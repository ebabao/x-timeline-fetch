name: Probe 3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pysocks
      - run: python3 .github/scripts/probe3.py
