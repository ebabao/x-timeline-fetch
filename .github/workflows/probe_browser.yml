name: Probe Browser Anti Bot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q playwright
      - run: python3 -m playwright install chromium
      - run: python3 -u .github/scripts/probe_browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-hits
          path: /tmp/browser_hits/
          if-no-files-found: ignore
