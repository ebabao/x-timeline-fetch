name: X Timeline Fetch

# ─────────────────────────────────────────────────────────────
# 为什么要有这个：
#   本地沙箱所在网络对 X 系列域名做 IP 层出口封锁（TCP 能建连、TLS 握手超时），
#   换 TLS 指纹、headless 浏览器、17 个 nitter 实例全部无效。
#   但 GitHub Runner 在美国机房，直连 x.com 完全正常 —— 所以让 Actions 负责“抓”，
#   沙箱端只用 api.github.com 读结果（该域名本机 100% 可达）。
#
# 权限说明：workflow 自带的 GITHUB_TOKEN 即可提交数据，不需要你额外配置 secret。
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: "要抓的账号，空格分隔（留空则读仓库内 accounts.txt）"
        required: false
        default: ""
      limit:
        description: "每个账号抓多少条上限"
        required: false
        default: "40"
      chain:
        description: "跑完后自动排下一轮（on/off）"
        required: false
        default: "off"
  schedule:
    - cron: "7,37 * * * *"      # 每小时 2 次（:07 / :37），schedule 偶发跳过也能兜住

# 同一时刻只允许一条流水线；链条是串行的，堆积只会互相打架
concurrency:
  group: x-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q requests

      - name: Fetch timelines
        env:
          INPUT_ACCOUNTS: ${{ github.event.inputs.accounts }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          python3 .github/scripts/fetch_timelines.py \
            --accounts "$INPUT_ACCOUNTS" \
            --accounts-file accounts.txt \
            --limit "${INPUT_LIMIT:-40}" \
            --outdir data

      - name: Build site
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 .github/scripts/build_site.py \
            --datadir data \
            --out docs/index.html \
            --limit 800

      - name: Show summary
        if: always()
        run: |
          if [ -f data/_run_summary.json ]; then
            echo "=== 本次运行结果 ==="
            python3 - <<'PY'
          import json
          d = json.load(open('data/_run_summary.json'))
          print("运行时间:", d['ran_at'])
          print("%-18s %-6s %-14s %-6s %-6s %s" % ('handle','状态','通道','新增','累计','其中中文'))
          for s in d['summary']:
              print("%-18s %-6s %-14s %-6s %-6s %s" % (
                  s['handle'], 'OK' if s['ok'] else 'FAIL',
                  str(s.get('src'))[:14], s.get('new',0), s.get('total',0), s.get('cn',0)))
          PY
          fi

      - name: Commit data
        if: always()
        run: |
          git config user.name "x-fetch-bot"
          git config user.email "bot@noreply"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          # data/（资讯源）、site/translations.json（译文缓存）、docs/index.html（页面）
          # 必须同一批提交 —— 页面和数据永远同源，Pages 也跟着这一次 push 自动部署。
          if [ -n "$(git status --porcelain data site docs)" ]; then
            git add data site/translations.json docs
            git commit -m "chore: update timelines + site $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "无变化，跳过提交"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x-timelines-${{ github.run_number }}
          path: |
            data/*.json
            docs/index.html
          retention-days: 30

      # ── 数据部分到此结束 ─────────────────────────────────────
      # 续链逻辑移到下方独立的 chain job。原因见 #205：
      # 那次 Commit data 失败 → fetch job 判 failure → 末尾 chain step 被跳过
      # → 自调度链一次性永久停摆，只剩 GitHub 严重漏跑的 schedule 兜底。

  # ── 续链（与抓取解耦）────────────────────────────────────────
  # 1) always()：抓取/提交失败也照样排下一轮，链不会因单次故障断掉；
  # 2) PAT 而非 GITHUB_TOKEN：绕开 GitHub 对递归 workflow 的拦截；
  # 3) 独立 job：不受 fetch 结果影响，也不会被 fetch 的失败状态吞掉；
  # 4) schedule 也续链：cron(:07/:37) 触发时 inputs.chain 为空，旧条件会让
  #    chain job 直接 skip → 链一断就只剩漏跑严重的 schedule 兜底（2026-11-05/
  #    11-09 两次长停摆即此因）。加了 event_name=='schedule' 后，只要仓库还
  #    活着，链条最迟 30 分钟内必被 schedule 重新拉回自维持状态。
  chain:
    needs: fetch
    if: always() && (github.event.inputs.chain == 'on' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Chain next run
        env:
          PAT: ${{ secrets.GH_PAT }}
          FETCH_RESULT: ${{ needs.fetch.result }}
        run: |
          echo "上一轮抓取结果: ${FETCH_RESULT}（无论成败都续链）"
          if [ -z "$PAT" ]; then
            echo "::error::缺少 secret GH_PAT，无法续链"
            exit 1
          fi
          echo "25 分钟后自动触发下一轮"
          sleep 1500
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/x_fetch.yml/dispatches" \
            -d '{"ref":"main","inputs":{"chain":"on"}}')
          echo "dispatch HTTP $code"
          [ "$code" = "204" ] || cat /tmp/resp.txt
