name: Probe SSR And Exit Routes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python3 -u .github/scripts/probe_ssr.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-hits
          path: /tmp/ssr_hits/
          if-no-files-found: ignore
