name: Probe Network Routes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python3 -u .github/scripts/probe_network.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hits-${{ matrix.os }}
          path: /tmp/probe_hits/
          if-no-files-found: ignore
