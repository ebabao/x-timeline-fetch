一心向佛，净念相继，终成无上菩提。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124800253916528969","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":933},{"id":"2124798417520165254","h":"cnfinancewatch","ts":1795426394,"zh":"我的粉丝\n如果用定投策略的，不要忘记\n下跌中定投不能停\n定投不择时","en":"我的粉丝\n如果用定投策略的，不要忘记\n下跌中定投不能停\n定投不择时","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124798417520165254","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":2,"vw":1251},{"id":"2124797660267757590","h":"ReutersChina","ts":1795426213,"zh":"随着支撑德国高薪汽车劳动力的模式崩溃，德国汽车制造商面临着数月有争议的劳资谈判以及因裁员和可能关闭工厂而举行的罢工。","en":"Germany's automakers face months of contentious labour talks and strikes over job cuts and potential factory closures as the model that underpinned the country's highly paid auto workforce breaks down.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2124797660267757590","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/business/world-at-work/german-automakers-face-winter-discontent-union-battles-loom-2026-11-23/?taid=6b0407a55f9bc3000128c530&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":214},{"id":"2124795087700074703","h":"CrushTheShorts","ts":1795425600,"zh":"摩根大通｜存储市场更新：全球TIG大会核心纪要\n摩根大通在香港全球TIG大会上分别会晤三星电子、SK海力士与铠侠。三家传递的信息高度一致：\n① 美国中期选举以来订单未发生变化；\n② 未来数年难以新增有意义的位元供给；\n③ 多年期长期协议（LTA）覆盖50%—70%的销售量。\n当前存储供给满足率仅60%—70%，三家均不认为2027年会改善。需求疲弱仅局限于消费级NAND，企业级市场已明显脱钩。\n摩根大通认为，当前出现了自2023年末AI兴起以来，投资界与企业界之间最大的情绪落差。尽管股价反映相反叙事，未来12—18个月存储供需仍将相当紧俏，维持全部存储制造商的增持评级。\n一、AI需求：订单稳定，推理拓宽存储需求\n三家制造商均对订单保持信心，铠侠甚至表示美国中期选举以来需求获得上修。\n供应商将数据中心建设延迟归因于监管环境变化（云服务商承担用电成本），认为AI建设放缓迹象有限。即便需求潜在放缓，非超大规模客户仍愿意承接当前未获满足的供给。\n今年AI训练仍占存储需求一半以上，预计2027年起推理将成为主要需求来源。\nKV-cache卸载主要发生在DRAM，但未来将形成分层化存储需求，与SK海力士的存储分层观点一致。\n二、传统DRAM最紧：满足率仅60%—70%\n多家供应商表示，2027年晶圆供给实质上已售罄，DRAM位元供给最大同比增幅约20%—25%。\n预计2027年供需缺口较2026年进一步扩大，2028年才有望部分缓解。\n各细分市场满足率：\n服务器DRAM/NAND及HBM： 处于60%以下或区间下沿；\n消费级DRAM/NAND： 处于区间上沿，其中消费级NAND最高；\n整体存储市场： 60%—70%，预计明年进一步恶化。\n即使采购需求放缓，供应商也仅将其视为缓解极端短缺。相比疫情期间约90%的满足率，当前供需仍极度紧张。\n三、HBM：重新定价成功，利润率差距收窄\n针对HBM由12层降至8层甚至4层的担忧，三星与SK海力士表示，降规格主要是为了增加HBM堆叠产品数量，确保终端系统出货。\n实际HBM含量下降可能有限：\n① 12层SKU仍在推进，占比可能高于市场预期；\n② DRAM核心裸片由24Gb升级至32Gb，提升单堆叠容量；\n③ ASIC需求更强，支撑HBM需求。\n供应商一致表示，2027年HBM价格谈判取得成功，有望显著收窄传统DRAM与HBM之间的利润率差距。\n与此同时，HBM晶圆配置比例未来数年仍将提高，持续挤占传统DRAM产能。\n即便DRAM晶圆月产能增长达到百分之十几，整体位元供给增幅仍受限于20%出头至中段区间。\n四、NAND：消费级与企业级明显分化\n与过去下行周期不同，本轮NAND市场呈现明显分层。\n消费级NAND需求走弱、现货价格下跌，但企业级SSD供需依然紧张。\n企业级SSD： 供给满足率仅50%出头；\n消费级NAND： 满足率70%以上；\n企业级SSD价格： 较客户端SSD存在约30%的溢价。\n中国NAND厂商主要集中于消费级NAND和客户端SSD，占其位元出货95%以上，对企业级SSD市场影响有限。\n现货交易占全球NAND制造商营收比例处于低个位数水平，企业级高密度TLC/QLC产品基本不存在现货市场。\n摩根大通不排除2027年消费级NAND定价情绪转弱，但受企业级SSD强劲需求支撑，整体NAND混合ASP仍有望上行。\n五、供给与资本开支：新增产能最早2028年明显释放\n洁净室不足、绿地晶圆厂建设周期延长、供给纪律及每比特资本开支上升，持续限制2027—2028年位元产出。\n各厂产能时间线：\n三星： P4剩余两个象限为2027年唯一可得洁净室空间，P5位元贡献最早2028年；\nSK海力士： Y1一期最早2027年末贡献产出；\n铠侠： 位元增长主要依赖技术迁移，新绿地厂最早2029年贡献产出。\n针对2027年位元供给超预期加速的可能性，三家均表示增产空间有限。\n摩根大通模型预计，至2028年DRAM供给年复合增长24%，晶圆月产能由2026年末210万片增至2028年末290万片，增加约78万片。\n六、长期协议：50%—70%销售量覆盖，设置价格下限\n本季LTA讨论热度有所下降，投资者更关注客户违约、放弃照付不议预付款或保证金等下行风险。\n价格区间成为判断LTA盈利可持续性的关键。\n虽然供应商未披露具体定价，但摩根大通认为，其暗示的利润率区间可能接近或高于AI时代之前的历史峰值。\n企业及服务器计算需求是LTA的核心领域，部分供应商也在企业级与消费级客户之间采取均衡策略。\n七、股东回报：增量更新有限\n三星电子： 重申2026年90万亿—110万亿韩元股东回报，正权衡剩余55万亿—75万亿韩元用于回购或分红，可能偏向优先股，预计2027年1月前更新政策。\nSK海力士： 公布2026财年100万亿韩元目标，并设定此后自由现金流50%的下限。公司表示，100万亿韩元现金目标约相当于两年资本开支，但随着投资承诺增加，净现金需求也在上升。\n铠侠： 维持超额现金100%返还目标，预计2027年3月季度披露增量股东回报政策。\nADR方面，SK海力士认为空间较大但存在监管瓶颈；三星视为中长期选项；铠侠预计最早2027年4月上市。","en":"摩根大通｜存储市场更新：全球TIG大会核心纪要\n摩根大通在香港全球TIG大会上分别会晤三星电子、SK海力士与铠侠。三家传递的信息高度一致：\n① 美国中期选举以来订单未发生变化；\n② 未来数年难以新增有意义的位元供给；\n③ 多年期长期协议（LTA）覆盖50%—70%的销售量。\n当前存储供给满足率仅60%—70%，三家均不认为2027年会改善。需求疲弱仅局限于消费级NAND，企业级市场已明显脱钩。\n摩根大通认为，当前出现了自2023年末AI兴起以来，投资界与企业界之间最大的情绪落差。尽管股价反映相反叙事，未来12—18个月存储供需仍将相当紧俏，维持全部存储制造商的增持评级。\n一、AI需求：订单稳定，推理拓宽存储需求\n三家制造商均对订单保持信心，铠侠甚至表示美国中期选举以来需求获得上修。\n供应商将数据中心建设延迟归因于监管环境变化（云服务商承担用电成本），认为AI建设放缓迹象有限。即便需求潜在放缓，非超大规模客户仍愿意承接当前未获满足的供给。\n今年AI训练仍占存储需求一半以上，预计2027年起推理将成为主要需求来源。\nKV-cache卸载主要发生在DRAM，但未来将 置48.5%，中部。最大Put贴近现价，P/C成交比2.27偏空，不做。观察。失效看335.53。\n名单只给五只，不足不凑。\n#小盘阿尔法\n本档不选。 $OFRM 市值偏小且有董事买入，但收在20日区间中部，近五日已经反弹26.11%，周五收弱，近四周EPS下修14家，经营现金流仍为负，位置和基本面都过不了。\n$LUXE、$RSKD 有内部人卖出，同样不选。\n#操作提示\n周一早盘期货反弹幅度不小，但对应的是周五已经完成的暴跌，不宜把反弹当成AI硬件的买点。只做仓位如果要开，就留在 $JNJ\n半仓，看它能不能站稳箱底。感恩节短周流动性会变差，周三PCE和本周科技财报都可能重新定价。恐慌贪婪指数按原邮件口径报9.7，极端恐惧可以解释反弹，但不能单独当成抄底信号。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#三个方向\n一是生物医药创新，这是今天唯一做成方向的大类，对应 $IHE 回调中的箱底个股，核心是 $JNJ。二是消费， $XLP\n20日仍为正，作为防御观察，不把尚未接近颈线的 $TJX 升级成突破。三是AI硬件，只观察不买，\n$NVDA、$AMD、$MSFT、$CRWV 都还在20日区间下沿附近，没有企稳。\n#六只个股\n #强生 $JNJ 收270.47涨1.25%，20日区间位置24.1%，箱底。周四最低见到264.68，周五放量收出小阳，实体很薄，更像止跌。触发是放量站上270.57并站稳，失效是跌破268.42，再往下是20日低264.20。半仓。\n #TJX公司 $TJX 收139.62涨0.15%，20日区间位置59.0%，区间中部。11月18日已经反弹8.05%，距20日高146.73还有5.09%，董事买入约20万美元只是轻量利多，资金共振0项。观察，不是突破准备。触发要放量接近或站上146.73，失效看138.31。\n #摩托罗拉解决方案 $MSI\n收520.21跌0.33%，20日区间位置61.7%，中上部。积压订单和提高股息是中等事件，期权三项偏多共振成立，但距20日高548.29还有5.40%，位置不够。仅观察。失效看487.11。\n #微软 $MSFT 收484.52跌2.77%，20日区间位置4.5%，靠近20日低481.03，箱底未企稳，最近一根是阴线，期权只有单项Call，不进只做。观察。失效看481.03。\n #苹果 $AAPL 收342.56跌1.90%，20日区间位置48.5%，中部。最大Put贴近现价，P/C成交比2.27偏空，不做。观察。失效看335.53。\n名单只给五只，不足不凑。\n#小盘阿尔法\n本档不选。 $OFRM 市值偏小且有董事买入，但收在20日区间中部，近五日已经反弹26.11%，周五收弱，近四周EPS下修14家，经营现金流仍为负，位置和基本面都过不了。\n$LUXE、$RSKD 有内部人卖出，同样不选。\n#操作提示\n周一早盘期货反弹幅度不小，但对应的是周五已经完成的暴跌，不宜把反弹当成AI硬件的买点。只做仓位如果要开，就留在 $JNJ\n半仓，看它能不能站稳箱底。感恩节短周流动性会变差，周三PCE和本周科技财报都可能重新定价。恐慌贪婪指数按原邮件口径报9.7，极端恐惧可以解释反弹，但不能单独当成抄底信号。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124777516166758524","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["财报"],"lk":1,"rt":0,"rp":1,"vw":561},{"id":"2124777232459764054","h":"cnfinancewatch","ts":1795421343,"zh":"美股盘前第一版\n周五把三大指数都打进了技术性调整。标普500收6910.39跌3.70%，近五日跌8.61%；纳指收22617.73跌5.28%，近五日跌10.02%，并转年内下跌；道指收48147.33跌1.93%，近五日跌8.02%。波动率指数收35.89。\n#英伟达 $NVDA 收125.53跌14.01%，几乎打在20日低点124.50。今日不硬做进攻。只做一个大类：生物医药创新，代表 #强生\n$JNJ。消费相对抗跌，只观察。AI硬件明确不做。\n如果只做3只：第一只 #强生 $JNJ，箱底企稳，CAPLYTA补充申报已交到FDA，期权两项偏多共振。第二、第三位空着。原邮件把\n$TJX、$MSI 也列入只做，但用截至11月20日的完整日线核验后， $TJX 收在20日区间中部、距20日高仍有5.09%， $MSI\n收在区间中上部、距20日高5.40%，都不算突破准备或箱底，事件和期权不能改写位置。\n明确不做：AI硬件追涨、已经走在20日高位附近的天然气商品、没有企稳蜡烛的箱底左侧，以及期权偏空的 #苹果 $AAPL。\n#消息面\n周末到周一早盘，股指期货自周五低位反弹。北京时间约15:17，标普迷你约7088.5点，较周五期货收盘6935点涨约2.21%；纳指迷你约25868点涨约2.95%；道指迷你约48969点涨约1.56%；罗素2000迷你约2638.5点涨约1.97%。这是连跌多个交易日后的超卖反弹，还不是新的趋势信号。公开报道把本轮调整主要归因于对AI资本开支回报的担忧、Anthropic上市后表现偏弱，以及中期选举后的政策预期变化。特朗普公开呼吁英伟达重新聘用黄仁勋，这是消息，不是买点。本周是感恩节短周，周三有10月PCE，今晚有\n$HPE 等财报，周二盘后还有\n$DELL。A股周一并未跟砸，上证3538.95涨0.15%，深证10454.37涨1.93%，创业板2280.20涨3.08%，科创50\n1227.89跌0.26%。\n#强生 $JNJ 在11月19日向FDA提交CAPLYTA用于成人双相I障碍躁狂或混合发作的补充新药申请，两份三期显示躁狂症状改善最早可在第3天出现，若获批将成为该药在成人中的第五个适应症。这是已发生的中等权重事件，不是当天批准。\n#研报面\n近12至24小时未见头部大行对名单股大幅上调目标价，事件权重最高档本轮是空的。卖方共识按分析师库口径： $JNJ\n目标价均值289.88，买入11家、持有6家、卖出0家，近四周EPS上修1家下修2家； $TJX\n目标价均值162.69，买入9家持有6家，近四周上修5家下修7家； $MSFT\n目标价均值632.48，买入34家，近四周上修39家，但股价仍在寻底，研报再乐观也要等企稳； $AAPL\n目标价均值343.69几乎贴着现价342.56，近四周下修16家多于上修9家。 $MSI 目标价共识未采集。\n#资金面\nARK在11月20日出现多只两基金同买，必须写入：ARKK与ARKW同买 $SPCX 合计约2240万美元、 $CRWV 约2170万美元、\n$CBRS 约2120万美元、 $AMD 约2110万美元；ARKG与ARKK同买 $TWST\n约1000万美元。同买成立，但这五只周五都还在下跌通道里，没有企稳蜡烛，不能因为ARK就改成只做。带方向的期权： $JNJ\n最大Call行权价282.5、量仓比25.73，P/C成交比0.26，两项同向，算共振； $MSI\nCall持仓增仓8.9%、Call成交放量278%、P/C成交比0.19，三项同向，但位置偏高，只记资金、不升级名单； $SPCX\n最大Call行权价131距现价约+2.51%、量仓比926.04，与ARK同买构成共振，K线未过。 $TWST\n的Put成交放量不算偏多期权。 $AAPL 最大Put行权价340距现价-0.75%，P/C成交比2.27，偏空。 $NVDA、$TSLA\n最大Call距离现价分别约9.06%、7.71%，且Call持仓大幅减仓，不把裸量仓比写成多头共振。做空余额按原邮件口径， $AAPL\n环比增10.03%， $CBRS 环比增11.77%，与多头共振相反，要留神。\n#期货\n周五完整交易日，股指期货与现货一起下跌，标普迷你收6935跌3.64%，纳指迷你收25126.5跌5.54%。原邮件给出的OI是增加的：标普迷你未平仓量213.92万、日增8.04万、量比1.28；纳指迷你未平仓量30.97万、日增2.46万、量比1.22。按价跌、OI增，更接近新空进场，但量比刚过放量线，不宜写太死。黄金期货周五收3515.4跌4.62%，原油收83.98涨0.93%，与原邮件按盘前价格做的OI定性并不一致，本档以完整日线核对价格，OI数字照录、方向标暂不沿用。周一早盘是另一回事：黄金约3634.9，较周五收盘涨约3.40%；原油约83.14，跌约1.00%；铜约5.543，涨约1.21%；白银约42.77，涨约4.23%；比特币期货约61470，涨约5.43%；十年期美债期货约106.58，较周五收盘106.84跌约0.25%。反弹日的OI要等完整交易日再看。\n#中美映射\n美股行业ETF用截至11月20日的完整日线。20日涨幅靠前的是 $UNG 涨10.23%、 $JETS 涨3.91%、 $FIW\n涨2.78%、 $XLP 涨2.49%、 $KIE 涨1.81%、 $IHE 涨1.79%。5日只有 $UNG 涨4.04%、 $TLT\n涨2.61%还是正的，其余主要行业ETF都是负的。双窗口同现只有\n$UNG，但它已经收在20日区间92.6%、距20日高仅1.23%，又偏商品属性，只观察、不作为只做方向。 $XLP\n仅20日为正、5日跌2.05%，属于趋势还在、尚未加速。 $IHE 20日仅涨1.79%，5日跌6.03%，制药也在回撤。科技侧更弱：\n$SMH 20日跌24.12%、5日跌17.81%， $SOXX、$XLK、$ARKK 都在20日区间底部。","en":"美股盘前第一版\n周五把三大指数都打进了技术性调整。标普500收6910.39跌3.70%，近五日跌8.61%；纳指收22617.73跌5.28%，近五日跌10.02%，并转年内下跌；道指收48147.33跌1.93%，近五日跌8.02%。波动率指数收35.89。\n#英伟达 $NVDA 收125.53跌14.01%，几乎打在20日低点124.50。今日不硬做进攻。只做一个大类：生物医药创新，代表 #强生\n$JNJ。消费相对抗跌，只观察。AI硬件明确不做。\n如果只做3只：第一只 #强生 $JNJ，箱底企稳，CAPLYTA补充申报已交到FDA，期权两项偏多共振。第二、第三位空着。原邮件把\n$TJX、$MSI 也列入只做，但用截至11月20日的完整日线核验后， $TJX 收在20日区间中部、距20日高仍有5.09%， $MSI\n收在区间中上部、距20日高5.40%，都不算突破准备或箱底，事件和期权不能改写位置。\n明确不做：AI硬件追涨、已经走在20日高位附近的天然气商品、没有企稳蜡烛的箱底左侧，以及期权偏空的 #苹果 $AAPL。\n#消息面\n周末到周一早盘，股指期货自周五低位反弹。北京时间约15:17，标普迷你约7088.5点，较周五期货收盘6935点涨约2.21%；纳指迷你约25868点涨约2.95%；道指迷你约48969点涨约1.56%；罗素2000迷你约2638.5点涨约1.97%。这是连跌多个交易日后的超卖反弹，还不是新的趋势信号。公开报道把本轮调整主要归因于对AI资本开支回报的担忧、Anthropic上市后表现偏弱，以及中期选举后的政策预期变化。特朗普公开呼吁英伟达重新聘用黄仁勋，这是消息，不是买点。本周是感恩节短周，周三有10月PCE，今晚有\n$HPE 等财报，周二盘后还有\n$DELL。A股周一并未跟砸，上证3538.95涨0.15%，深证10454.37涨1.93%，创业板2280.20涨3.08%，科创50\n1227.89跌0.26%。\n#强生 $JNJ 在11月19日向FDA提交CAPLYTA用于成人双相I障碍躁狂或混合发作的补充新药申请，两份三期显示躁狂症状改善最早可在第3天出现，若获批将成为该药在成人中的第五个适应症。这是已发生的中等权重事件，不是当天批准。\n#研报面\n近12至24小时未见头部大行对名单股大幅上调目标价，事件权重最高档本轮是空的。卖方共识按分析师库口径： $JNJ\n目标价均值289.88，买入11家、持有6家、卖出0家，近四周EPS上修1家下修2家； $TJX\n目标价均值162.69，买入9家持有6家，近四周上修5家下修7家； $MSFT\n目标价均值632.48，买入34家，近四周上修39家，但股价仍在寻底，研报再乐观也要等企稳； $AAPL\n目标价均值343.69几乎贴着现价342.56，近四周下修16家多于上修9家。 $MSI 目标价共识未采集。\n#资金面\nARK在11月20日出现多只两基金同买，必须写入：ARKK与ARKW同买 $SPCX 合计约2240万美元、 $CRWV 约2170万美元、\n$CBRS 约2120万美元、 $AMD 约2110万美元；ARKG与ARKK同买 $TWST\n约1000万美元。同买成立，但这五只周五都还在下跌通道里，没有企稳蜡烛，不能因为ARK就改成只做。带方向的期权： $JNJ\n最大Call行权价282.5、量仓比25.73，P/C成交比0.26，两项同向，算共振； $MSI\nCall持仓增仓8.9%、Call成交放量278%、P/C成交比0.19，三项同向，但位置偏高，只记资金、不升级名单； $SPCX\n最大Call行权价131距现价约+2.51%、量仓比926.04，与ARK同买构成共振，K线未过。 $TWST 顾性能与成本；原生800V直供省去变流设备；目前单位系统成本已接近联合循环燃气轮机（~2000美元/kW）；在燃机排产积压至2030年后背景下，伴随规模化降本，SOFC经济性有望超越燃气轮机。\n⸻\n核心逻辑\nAI数据中心供电需求激增与电网扩容周期漫长形成错配，SOFC凭借高效、快部署、高可靠及离网运行优势，迎来规模化放量机遇。\n叠加政策支持，具备核心材料壁垒及系统集成能力的厂商将显著受益。","en":"Bloom Energy的成长之路\n1、创业期（2001-2010）\nNASA航天技术起步，顶级VC超6亿美元注资，完成SOFC专利布局，联合谷歌、沃尔玛等完成技术实证。\n2、商业扩张期（2010-2018）\nPPA模式降低客户门槛，锁定全球头部企业，登陆纳斯达克。\n3、上市后阵痛期（2018-2021）\nPPA重资产拖累，早期产品寿命与预期存在差距，2018-2021年累计亏损超9亿$；靠PPA出清、降本增效、与韩国SK合作推进SOEC商业化走出低谷。\n4、转折与放量期（2021-2023）\n电堆寿命改善与韩国市场规模效应，2022年营收首破10亿$、积压订单超100亿$，SOEC产能全球领先，2021Q1服务毛利率历史性转正。\n5、高速增长期（2024至今）\n直击AI缺电痛点，以“55-90天交付、99.999%可用性、原生800V直供”跃升为主电源平台，CoreWeave、AEP、Equinix、Oracle、Brookfield、Nebius等头部客户订单集中落地，完成向AI核心基础设施供应商的定位升级。\n⸻\nBloom Energy全景分析\n1、产品全景\nEnergy Server（发电）+ Electrolyzer（电解制氢）。\nBloom SOFC发电效率达65%，热电联产超90%，优于其他燃料电池路线；SOEC制氢效能优于PEM、碱性电解。\n2、商业模式\n由重资产PPA转向轻资产直销。截至2025年末累计装机超1.5GW，总积压订单约200亿$，新增产品100%附带长期服务合同。\n3、客户结构\n形成三角支撑格局，传统工商业提供存量；韩国SK长协锁定海外业绩；AI数据中心以GW级订单成增长引擎。\n4、订单情况\n量级由2024年MW级试点跨越至2025年后GW级，AEP、BFC Power、Oracle、NTT DATA框架合计超5GW。\n5、降本空间\n采用YSZ+SCSZ复合电解质兼顾性能与成本；原生800V直供省去变流设备；目前单位系统成本已接近联合循环燃气轮机（~2000美元/kW）；在燃机排产积压至2030年后背景下，伴随规模化降本，SOFC经济性有望超越燃气轮机。\n⸻\n核心逻辑\nAI数据中心供电需求激增与电网扩容周期漫长形成错配，SOFC凭借高效、快部署、高可靠及离网运行优势，迎来规模化放量机遇。\n叠加政策支持，具备核心材料壁垒及系统集成能力的厂商将显著受益。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2124761473750859982","l":[],"ln":[],"t":["美股","原油能源","财报"],"lk":5,"rt":0,"rp":0,"vw":1441},{"id":"2124760597657166278","h":"cnfinancewatch","ts":1795417377,"zh":"关于基金和券商的关系：\n本轮科技成长4-6月中旬大涨，基金券商研报合力推动。\n五月底六月初我从美日韩考察结束，关闭订阅提出科技成长要跌两次50%的判断。\n但是在七月八月大跌中，基金券商联手发布看多科技研报，鼓励散户基民逆势加仓！这个过程实际上保险资金是受害的，他们按照卖方研报加仓之后突然发现加错了，立即转手亏本也卖，导致七八月a轮大跌之后科技成长十月十一继续c轮大跌，a和c轮都是-30%以上的快速暴跌，锁死散户和基民。\n这个过程中一直伴随着券商和基金的看多研报。\n结论是什么？报团行情多数由券商基金结合发起，最终也由他们多杀多终结，但股民基民永远受伤。","en":"关于基金和券商的关系：\n本轮科技成长4-6月中旬大涨，基金券商研报合力推动。\n五月底六月初我从美日韩考察结束，关闭订阅提出科技成长要跌两次50%的判断。\n但是在七月八月大跌中，基金券商联手发布看多科技研报，鼓励散户基民逆势加仓！这个过程实际上保险资金是受害的，他们按照卖方研报加仓之后突然发现加错了，立即转手亏本也卖，导致七八月a轮大跌之后科技成长十月十一继续c轮大跌，a和c轮都是-30%以上的快速暴跌，锁死散户和基民。\n这个过程中一直伴 把一天反弹写成反转。\n三是银行与红利，20日趋势还在，但今日明显获利回吐，工行跌破9.2元，短线先降为观察，不在周五高位加仓。水电相对抗跌，核电今日偏弱，核电不再作为主方向。\n机器人、影视院线今天涨得更猛，但5日和20日仍是深度回撤后的脉冲，只作为情绪观察，不进主方向。\n#六只个股\n #沪电股份 $002463 现价约82.65，涨2.90%，5日已转强，是PCB里位置更好的龙头，回踩不破今日低点77.64再看，不追高。\n #东山精密 $002384 现价约71.18，涨5.30%，今日调入港股通，属于低位反弹，上方压力仍重，失效看跌回66元附近。\n #中际旭创 $300308 现价约415.18，涨5.59%，成交额居首，深跌后反弹，仍远离11月中旬高点，站不稳388元则修复失败。\n #新易盛 $300502 现价约179.63，涨8.87%，流入靠前，短线弹性大，伸展较快，不追冲高。\n #长江电力 $600900 现价约31.37，跌0.79%，水电防守盘中抗住，继续当底仓。\n #农业银行 $601288 现价约7.80，涨0.39%，大行里几乎唯一没有回吐的，高股息里相对强，观察能否守住7.68元低点。\n早盘名单里的 #工商银行 $601398、 #建设银行 $601939、 #中国广核 $003816 今日跌幅靠前，暂时移出六只，改为观察回撤。\n#小盘阿尔法\n本档不选。 #中京电子 $002579 三连板、 #盛剑科技 $603324 五连板、 #宇树科技 $688836\n20厘米涨停，都是人气脉冲，缺少可核验的20日稳健位置和财报互证，不凑数。\n#操作提示\n早盘把银行当压舱石的判断，被今天的风格切换打了个对倒，高股息不要在周五的高位加仓。科技这边是超跌修复，尾盘看创业板和光模块能不能守住午后的涨幅；上证虽然收回3500，但盘中已经见过3476.65，防守意义下降。不追涨停和连板。晚上美股能否接住期指的反抽，是这轮修复能不能走下去的关键。外部变量还是中东和周三的MLF续作。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#期货\n标普迷你约7076.9点，较上周五结算涨约2.0%；纳指迷你约25837.8点，涨约2.8%；道指迷你约48903点，涨约1.4%，比早盘高点略回落，但仍是反抽状态。纽约金约3623美元，较结算涨约3.1%；原油约83.4美元，基本持平。离岸人民币约6.6709。富时A50期货本档未取到。恒生指数约22372点，跌0.17%，恒生科技跌0.10%，港股没有跟着A股创业板走。\n#三个方向\n一是PCB与元件。行业涨4.76%，资金净流入明确，5日转正，早盘“只做回踩、不追涨停”的纪律还要守，但方向已经从防守回踩改成超跌修复，看龙头能不能站稳，连板不追。\n二是光模块与光器件。 #中际旭创 $300308、 #新易盛 $300502、 #天孚通信 $300394\n带队反弹，成交和流入都在，位置仍在本轮深跌后的下半区，先看成色，不把一天反弹写成反转。\n三是银行与红利，20日趋势还在，但今日明显获利回吐，工行跌破9.2元，短线先降为观察，不在周五高位加仓。水电相对抗跌，核电今日偏弱，核电不再作为主方向。\n机器人、影视院线今天涨得更猛，但5日和20日仍是深度回撤后的脉冲，只作为情绪观察，不进主方向。\n#六只个股\n #沪电股份 $002463 现价约82.65，涨2.90%，5日已转强，是PCB里位置更好的龙头，回踩不破今日低点77.64再看，不追高。\n #东山精密 $002384 现价约71.18，涨5.30%，今日调入港股通，属于低位反弹，上方压力仍重，失效看跌回66元附近。\n #中际旭创 $300308 现价约415.18，涨5.59%，成交额居首，深跌后反弹，仍远离11月中旬高点，站不稳388元则修复失败。\n #新易盛 $300502 现价约179.63，涨8.87%，流入靠前，短线弹性大，伸展较快，不追冲高。\n #长江电力 $600900 现价约31.37，跌0.79%，水电防守盘中抗住，继续当底仓。\n #农业银行 $601288 现价约7.80，涨0.39%，大行里几乎唯一没有回吐的，高股息里相对强，观察能否守住7.68元低点。\n早盘名单里的 #工商银行 $601398、 #建设银行 $601939、 #中国广核 $003816 今日跌幅靠前，暂时移出六只，改为观察回撤。\n#小盘阿尔法\n本档不选。 #中京电子 $002579 三连板、 #盛剑科技 $603324 五连板、 #宇树科技 $688836\n20厘米涨停，都是人气脉冲，缺少可核验的20日稳健位置和财报互证，不凑数。\n#操作 hTheShorts/status/2124732002087964682","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":1,"vw":1077},{"id":"2124731634012590550","h":"bboczeng","ts":1795410471,"zh":"大多数投资者都在盯着科技股，却忽略了 AI 信贷市场正在发生的事：\n据报道，汇丰以约 85 美分兑 1 美元的价格出售了 3 亿美元的数据中心贷款，折价 15%。荷兰国际集团（ING）也试图出售另外 5 亿美元，但未能以可接受的价格吸引到足够的买盘，目前正在逐笔协商出售。\n路透社还报道称，银行越来越不愿意为新增的 AI 项目提供融资，即使这些项目有大型科技公司作为后盾。\n时机再糟糕不过。高盛估计，超大规模云厂商（hyperscaler）的债券发行量将激增 68%，从 2026 年的 2500 亿美元增至 2027 年的 4200 亿美元，而这恰恰是贷款机构变得更加谨慎的时候。\n这场戏我以前看过。正如我在书中所讨论的，页岩油热潮和加拿大大麻产业都建立在对未来增长的巨大预期之上，并假定资金会一直唾手可得。我亲眼见证了这两个行业在预期与实际交付之间出现落差时，会发生什么。\nAI 或许真的会改变世界，就像页岩技术改变了美国的能源生产一样。但这并不意味着每一美元的投资都能获得足够的回报。当一轮投资热潮依赖于源源不断的资本供给时，最大的风险并不是黄仁勋能否回归，而是放贷方是否还会回来。","en":"大多数投资者都在盯着科技股，却忽略了 AI 信贷市场正在发生的事：\n据报道，汇丰以约 85 美分兑 1 美元的价格出售了 3 亿美元的数据中心贷款，折价 15%。荷兰国际集团（ING）也试图出售另外 5 亿美元，但未能以可接受的价格吸引到足够的买盘，目前正在逐笔协商出售。\n路透社还报道称，银行越来越不愿意为新增的 AI 项目提供融资，即使这些项目有大型科技公司作为后盾。\n时机再糟糕不过。高盛估计，超大规模云厂商（hyperscaler）的债券发行量将激增 68%，从 2026 年的 2500 亿美元增至 2027 年的 4200 亿美元，而这恰恰是贷款机构变得更加谨慎的时候。\n这场戏我以前看过。正如我在书中所讨论的，页岩油热潮和加拿大大麻产业都建立在对未来增长的巨大预期之上，并假定资金会一直唾手可得。我亲眼见证了这两个行业在预期与实际交付之间出现落差时，会发生什么。\nAI 或许真的会改变世界，就像页岩技术改变了美国的能源生产一样。但这并不意味着每一美元的投资都能获得足够的回报。当一轮投资热潮依赖于源源不断的资本供给时，最大的风险并不是黄仁勋能否回归，而是放贷方是否还会回来。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124731634012590550","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":167},{"id":"2124731257829675164","h":"bboczeng","ts":1795410382,"zh":"Meta 2049 年到期的AI债券回报率在7.4%，也就是说，如果拿满，你能用22年的时间赚162%\n前提是Meta不会倒闭破产，你会去买嘛？\n谢谢大家","en":"Meta 2049 年到期的AI债券回报率在7.4%，也就是说，如果拿满，你能用22年的时间赚162%\n前提是Meta不会倒闭破产，你会去买嘛？\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124731257829675164","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":215},{"id":"2124730551718564013","h":"dmjk001","ts":1795410213,"zh":"13:01【两融保证金下调11月30日实施 频繁异常交易、涉嫌违法违规投资者将被依法采取限制性措施】财联社11月23日电，沪深北交易所将于11月30日正式下调两融保证金比例，从现行的100%下调至80%。记者最新获悉，监管已向券商下发通知，要求做好两融逆周期调节，包括券商要确保政策稳妥实施，要求各公司基于交易所公布的标准范围，对保证金比例实施动态管理与差异化控制，及时完成系统参数调整与测试验证，并做好政策解读与风险揭示。值得关注的是，通知明确本次保证金比例调整同时适用于新开仓合约及存量合约，投资者不必了结存量合约即可适用新的指标，券商需将相关安排有效传达至投资者，避免因政策理解偏差引发不必要的调仓交易。监管明确，券商要做好客户交易行为管理。通知要求对存在异常交易行为的投资者采取差异化管控，从严适用保证金比例、折算率等风控指标，审慎控制授信规模及交易费率，对频繁异常交易或涉嫌违法违规的投资者依法采取必要限制性措施。 （财联社记者 林坚）","en":"13:01【两融保证金下调11月30日实施 频繁异常交易、涉嫌违法违规投资者将被依法采取限制性措施】财联社11月23日电，沪深北交易所将于11月30日正式下调两融保证金比例，从现行的100%下调至80%。记者最新获悉，监管已向券商下发通知，要求做好两融逆周期调节，包括券商要确保政策稳妥实施，要求各公司基于交易所公布的标准范围，对保证金比例实施动态管理与差异化控制，及时完成系统参数调整与测试验证，并做好政策解读与风险揭示。值得关注的是，通知明确本次保证金比例调整同时适用于新开仓合约及存量合约，投资者不必了结存量合约即可适用新的指标，券商需将相关安排有效传达至投资者，避免因政策理解偏差引发不必要的调仓交易。监管明确，券商要做好客户交易行为管理。通知要求对存在异常交易行为的投资者采取差异化管控，从严适用保证金比例、折算率等风控指标，审慎控制授信规模及交易费率，对频繁异常交易或涉嫌违法违规的投资者依法采取必要限制性措施。 （财联社记者 林坚）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2124730551718564013","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":379},{"id":"2124730262408012145","h":"bboczeng","ts":1795410144,"zh":"将本周文章的精华部分摘抄如下：\nSNDK，KOSPI和ARKK相似，都是在第一次接近90度垂直上涨的大峰后，因去杠杆等技术性原因下跌，随后迎来了第二次圆顶反弹。但反弹失败意味着机构资金正式跑路，接下来就开启了真正的下跌。\n这是一种类似双顶的结构，但又不是真正的M顶，因为第一个顶明显比第二个顶更尖锐。从这些观察出发，我们可以得出如下有参考意义的结论：\n1. 在动量行情的炒作中，第一个顶部出现是技术性的，也就是所谓的blow off the top + deleveraging。股价因为gamma squeeze而大涨，也是因为做多杠杆爆仓而下跌。一旦杠杆被清理干净，第一批正股抄底者入场，引发了随后的反弹。这给我们的教训是，在第一次暴跌后，确实可以等待第二次反弹再清仓。\n2. 第二个圆弧顶则是机构派发导致的。抄底资金接盘，但是真正的早期投资者和机构资金实际上已经开始跑路。最终接盘能量不足，引发流动性危机，最后开启了真正的暴跌。在这个过程中，我们能够总结出的教训是：绝对不能抄底，不能接飞刀，而是要坚决止损，尽早离场。\n这两个阶段，实际上可以归纳在动量崩盘几何学中，他几乎是一个不变量。不仅在ARKK中有效，在SNDK中有效，在KOSPI中有效，甚至在最后下跌的SOXX中我们都能看到他的影子 动量崩盘的机制，本质上是第一次杠杆崩塌+主力资金撤退导致的。\n这种形态的出现，实际上也意味着整个行情的结束。我们会发现，ARKK随后跌回来2019年的起点，要在接近4年之后才开始了一次有意义的触底反弹","en":"将本周文章的精华部分摘抄如下：\nSNDK，KOSPI和ARKK相似，都是在第一次接近90度垂直上涨的大峰后，因去杠杆等技术性原因下跌，随后迎来了第二次圆顶反弹。但反弹失败意味着机构资金正式跑路，接下来就开启了真正的下跌。\n这是一种类似双顶的结构，但又不是真正的M顶，因为第一个顶明显比第二个顶更尖锐。从这些观察出发，我们可以得出如下有参考意义的结论：\n1. 在动量行情的炒作中，第一个顶部出现是技术性的，也就是所谓的blow off the top + deleveraging。股价因为gamma squeeze而大涨，也是因为做多杠杆爆仓而下跌。一旦杠杆被清理干净，第一批正股抄底者入场，引发了随后的反弹。这给我们的教训是，在第一次暴跌后，确实可以等待第二次反弹再清仓。\n2. 第二个圆弧顶则是机构派发导致的。抄底资金接盘，但是真正的早期投资者和机构资金实际上已经开始跑路。最终接盘能量不足，引发流动性危机，最后开启了真正的暴跌。在这个过程中，我们能够总结出的教训是：绝对不能抄底，不能接飞刀，而是要坚决止损，尽早离场。\n这两个阶段，实际上可以归纳在动量崩盘几何学中，他几乎是一个不变量。不仅在ARKK中有效，在SNDK中有效，在KOSPI中有效，甚至在最后下跌的SOXX中我们都能看到他的影子 动量崩盘的机制，本质上是第一次杠杆崩塌+主力资金撤退导致的。\n这种形态的出现，实际上也意味着整个行情的结束。我们会发现，ARKK随后跌回来2019年的起点，要在接近4年之后才开始了一次有意义的触底反弹","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124730262408012145","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":439},{"id":"2124729653550325829","h":"bboczeng","ts":1795409999,"zh":"subscriber 全文 Article ：","en":"subscriber 全文 Article ：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124729653550325829","l":["x.com"],"ln":[{"u":"https://x.com/bboczeng/status/2124729466933088293","d":"x.com"}],"t":[],"lk":1,"rt":1,"rp":0,"vw":106},{"id":"2124729160967049537","h":"qinbafrank","ts":1795409882,"zh":"贝森特真是“急智”的改口，表示离任的老黄现在就是外部人，同时假设老黄此前对涉事人物的疑似间谍身份并不知情。虽然没有明确给老黄复职背书，但这个改口相比之前也是大变样。当然这也是迎合川普更早表态，要求英伟达董事会重新考虑创始人的去留。川普已经从之前的支持老黄，升级到公开要求董事会给他第二次机会。已经是其实是明显的施压，贝森特再不“急智”，估计得让老大不快了。\n虽然回归之路阻力还不少，但不妨碍市场来一段交易老黄归来的时间窗口。\n关于“老黄”回归未来关键的几个时间点：\n1）12月初，老黄将分别接受众院情报、外交和对中共特设委员会的闭门记录问询。以及之后的参院银行委员会公开作证。要看国会听证完了\n2）董事会自己的独立调查也得有个结果，才能会给董事会一个台阶和理由；\n3）现在还有个就是民主党的态度了，民主党议员已提前取证。Warren、Coons要求行政部门保存记录，众院民主党人Meeks在追问商务部如何处理Megaspeed。","en":"贝森特真是“急智”的改口，表示离任的老黄现在就是外部人，同时假设老黄此前对涉事人物的疑似间谍身份并不知情。虽然没有明确给老黄复职背书，但这个改口相比之前也是大变样。当然这也是迎合川普更早表态，要求英伟达董事会重新考虑创始人的去留。川普已经从之前的支持老黄，升级到公开要求董事会给他第二次机会。已经是其实是明显的施压，贝森特再不“急智”，估计得让老大不快了。\n虽然回归之路阻力还不少，但不妨碍市场来一段交易老黄归来的时间窗口。\n关于“老黄”回归未来关键的几个时间点：\n1）12月初，老黄将分别接受众院情报、外交和对中共特设委员会的闭门记录问询。以及之后的参院银行委员会公开作证。要看国会听证完了\n2）董事会自己的独立调查也得有个结果，才能会给董事会一个台阶和理由；\n3）现在还有个就是民主党的态度了，民主党议员已提前取证。Warren、Coons要求行政部门保存记录，众院民主党人Meeks在追问商务部如何处理Megaspeed。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXyN6MkawAEvxqn.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2124729160967049537","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":0,"rp":4,"vw":2613},{"id":"2124725413771698382","h":"yijiangren","ts":1795408988,"zh":"上周的GTA6发布火爆全网\n我认识的人都有直接请假在家打游戏的\nTOFU @togetherdotfun 这周的交易赛直接送！\n前三名直接送GTA6\n反正我是要争取拿个前三的\n而且也让我们群的小伙伴参加了\n还有1000刀的奖池\n🥇 230$\n🥈 140$\n🥉100$\n 四 75$\n 五 55$\n 六到十 3 打算悬崖勒马，人造一个深V了？\n如果黄仁勋回归，本次熊市恐怕就要提前结束了\n否则，那就是死猫跳\n又一个2022年的死猫跳\n谢谢大家","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXyI8NsaAAAEHLz.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2124723696275431646","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":197},{"id":"2124722996954935706","h":"bboczeng","ts":1795408412,"zh":"在本文的最后，我们包含了三种熊市情况的抄底策略和仓位模拟，我将按照数据给出的最佳计划抄底，\n谢谢大家：","en":"在本文的最后，我们包含了三种熊市情况的抄底策略和仓位模拟，我将按照数据给出的最佳计划抄底，\n谢谢大家：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXyH39gbwAA_UHh.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2124722996954935706","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":471},{"id":"2124722457034830005","h":"bboczeng","ts":1795408283,"zh":"在本文的末尾，包含了三种熊市情况的抄底策略和抄底仓位比例模拟，我将按照计划抄底，谢谢大家：","en":"在本文的末尾，包含了三种熊市情况的抄底策略和抄底仓位比例模拟，我将按照计划抄底，谢谢大家：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXyHi1vawAARvQy.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2124722457034830005","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":249},{"id":"2124721156125245904","h":"bboczeng","ts":1795407973,"zh":"subscriber 全文：","en":"subscriber 全文：","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/bboczeng/status/2124721156125245904","l":["x.com"],"ln":[{"u":"https://x.com/bboczeng/status/2124720816101449802","d":"x.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":97},{"id":"2124721093009416432","h":"bboczeng","ts":1795407958,"zh":"动量出逃的几何结构，和熊市的抄底计划\n一直以来，熊市都会以一种出人意料，猝不及防的方式出现。周五的暴跌，可能是机构做空AMD，可能是NAND价格被首次下调，也可能是SEC对英伟达财务问题进行调查。当市场进入熊市，任何一个轻微的扰动都会引发暴雷。\n相比之下，美联储加息的鹰派态度可能具有威胁性。不论如何，纠结熊市发生的原因其实并没有什么价值，因为“每次都不一样”，所谓流动性危机和Ant破发也只能是熊市的结果。但从机构资金出逃的本质，大盘下跌的形态甚至速度等现象出发，我们或许还是能够得到一些对未来投资有普适意义的启发。这也是将本文将要讨论的重点。\n即便作为空仓5个月，全仓SGOV的“大空头”，我也是没想到市场会在黄仁勋离职后来上演这么一出爆仓大戏。周五，英伟达最大跌幅14%，令人瞩目；刚正式启动“拆股”的SNDK直接忽略一切利好大跌16%，回到了四月前的价格。实际上，包括台积电，SOXX等半导体指数也都悉数回到了4月初“旱地拔葱”的起点。今年的AI行情刚好走了一个来回，完成了预想之中的全面洗盘。就连QQQ都在当日内下跌5%。从今年的高点算起，纳指累计下跌17%，标普500累计下跌10%，已经进入“美股几何学”得出的baseline I 范围。\n现在，可以抄底了吗？\n回答这个问题之前，我们先要探讨一下，为什么散户总是在牛市中亏钱？即便是4-6月份抄底半导体的，如果9月之前没跑掉，现在恐怕都已经出现了亏损。\n其实“牛市逃顶”和“熊市抄底”一样，都是反人性的。在牛市最巅峰的日子里，谁会破坏氛围想着逃顶呢？大家都佩服自己的选股能力，佩服自己关注KOL的水平；都都盯着自己的账户余额发呆，幻想能再翻10倍吗。所以说，牛市之所以危险，大家之所以会被套牢，其实依然是人的思维惯性，和市场风险不可预测的长尾本质所共同导致的。\n在市场刚跌2%的时候，你会以为这和之前一样，只是牛市中正常回调；在市场跌去10%的时候，你会觉得既然都跌了这么多了，现在实在跑太亏了。应该再坚持一下，至少等出现一个反弹，甚至回到前高形成双顶再走。等市场跌了20%，抹去你全年盈利甚至开始出现亏损的时候，大部分人才开始意识到不对劲，准备跑路——然而，这时候往往才是华尔街机构叙事反转的开始\n抄底其实也是一样，只不过它恰好是逃顶流程的镜像。在熊市底部出现第一次反弹的时候，你会以为这只是普通的波动，要再等一等；等跳空高开出现一个大缺口的时候，你又会觉得这是死猫跳， 要等second leg再测试前低；等股指一飞冲天一去不复返之后，你又会觉得：现在这个价格抄底，太亏了。最后就是没抄到底，反而只能在高点追高。\n人性如此。纵观推特这么多不同风格的大V，大家应该已经发现，这一缺陷并不是能力和水平所能改变的。只不过多空双方都有运气好的那一天，当市场走势符合自己的风格，顺风顺水，恰好踩到了上涨或者下跌的区间。\n所以对待熊市唯一可行的方法，其实也就只有定投抄底了。下跌刚开始的时候就可以启动定投，越跌越买，而且绝对不能暂停。如果能跌到关键目标击球区还可以加大仓位，直接按照总仓位的固定比例买入。当然最后这一步因人而异，取决于你还剩多少现金。\n对于还有90%SGOV现金等价物的我来说，既然本周已经跌到baseline I击球区，即便未来还有继续下探baseline II的可能性，我也不得不出手了。具体计划我会在文末专题讨论。\n从历史上看，2025，2022和2020下跌幅度距离200日平均线都达到了正态分布的3-sigma位置，而本次下跌才刚超过1-sigma一点。从下跌速度来看，本次熊市已经完全超过了今年3月底的“伊朗战争”形成的bear trap，因此我觉得，本次跌幅大概至少会达到2-sigma，周五的还没有跌完。周一的反弹是预料之中的，主要是因为周五下跌有点过于夸张了，空头都在回补。在最糟糕的情况下，也完全可以去3sigma，也就是重演2018年特朗普第一任期的感恩节+圣诞节大回调。这两者之前的确有很多相似之处，我们下文将仔细分析。\n动量出逃的几何结构\n在之前的周末文章中我们说过，26年AI交易的疯狂，特别是半导体指数4月份旱地拔葱的翻倍行情，其实在美股历史上也并非没有先例。最典型的一次其实是2021年的成长股之春。当时，以ARKK为首的高PE成长股交易震撼了华尔街，木头姐一年的收益率远超巴菲特60倍，达到惊人的152%，她也被捧上了“女股神”的神坛。然而后面的故事我们都很熟悉了，成长股遭遇2022年熊市，ARKK腰斩之后再腰斩，五年年化回报收负为-2.66%，最终回归到连巴菲特都不如的水平。\n大家终于发现笑到最后的还是巴菲特老爷子。而这其实也不是巴菲特自己的本事，只是炒作资金出逃之后，市场必然会发生的均值回归罢了。我们之前说过，华尔街资金精明得很，好马不吃回头草，炒过一次的板块绝对不会再炒第二次。中概股是一个例子，2021年的成长股是第二个。而现在同样的故事恐怕就要轮到AI了\n经过历史诗级的暴涨和暴跌之后，ARKK随后进入长时间的震荡，在躺平4年之后，终于在2025年出现了企稳反弹的迹象。这其实就是动量炒作崩盘之后的普遍特征。\n观察一下SNDK，KOSPI和ARKK的形态，你是否发现了惊人的相似之处？你是否觉得，半导体真的要步入木头姐的后尘？\nSNDK，KOSPI和ARKK相似，都是在第一次接近90度垂直上涨的大峰后，因去杠杆等技术性原因下跌，随后迎来了第二次圆顶反弹。但反弹失败意味着机构资金正式跑路，接下来就开启了真正的下跌。这是一种类似双顶的结构，但又不是真正的M顶，因为第一个顶明显比第二个顶更尖锐。从这些观察出发，我们可以得出如下有参考意义的结论：\n1. 在动量行情的炒作中，第一个顶部出现是技术性的，也就是所谓的blow off the top + deleveraging。股价因为gamma squeeze而大涨，也是因为做多杠杆爆仓而下跌。一旦杠杆被清理干净，第一批正股抄底者入场，引发了随后的反弹。这给我们的教训是，在第一次暴跌后，确实可以等待第二次反弹再清仓。\n2. 第二个圆弧顶则是机构派发导致的。抄底资金接盘，但是真正的早期投资者和机构资金实际上已经开始跑路。最终接盘能量不足，引发流动性危机，最后开启了真正的暴跌。在这个过程中，我们能够总结出的教训是：绝对不能抄底，不能接飞刀，而是要坚决止损，尽早离场。\n这两个阶段，实际上可以归纳在动量崩盘几何学中，他几乎是一个不变量。不仅在ARKK中有效，在SNDK中有效，在KOSPI中有效，甚至在最后下跌的SOXX中我们都能看到他的影子\n动量崩盘的机制，本质上是第一次杠杆崩塌+主力资金撤退导致的。这种形态的出现，实际上也意味着整个行情的结束。我们会发现，ARKK随后跌回来2019年的起点，要在接近4年之后才开始了一次有意义的触底反弹。\n同样的道理，半导体作为周期性如此强的行业，在经历了这么一次非理性、非正常的动量炒作之后，已经元气大伤，也给广大投资这造成了极大的伤害。它极有可能迎来和ARKK类似的结局：跌回本轮翻倍增长的起点，并在长期的低波动，低成交量的大横盘中，等待下一个周期到来。实际上KOSPI和SOXL已经走出了这样的趋势。下一个值得关注的板块是存储，GPU和SOXX本身。\n下周的抄底计划\n先公开一下我现在持仓情况，因为我几乎是在空仓等暴跌，所以我的抄底计划有一点激进，并不一定不适合所有人。已经有美股仓位的可以再等一等，或者在反弹中继续减仓。\n以下内容为会员可见。会员可以阅读全站会员可见内容，并加入我们的会员群参与更多讨论。对会员项目感兴趣的读者可以阅读本文了解详情。下文将探讨熊市进一步发展的三种可能，以及在对应的可能性下，在不同目标位置以不同抄底比例的风险和平均回报，从而得到我下周一的抄底方案。注意，在我的语境下，抄底和定投是两种不同的策略，我自10月初以来已经开始定投，但抄底尚未开始。他们之间并不矛盾。\n包含图文的全文链接如下，subscriber post将发在评论区：","en":"动量出逃的几何结构，和熊市的抄底计划\n一直以来，熊市都会以一种出人意料，猝不及防的方式出现。周五的暴跌，可能是机构做空AMD，可能是NAND价格被首次下调，也可能是SEC对英伟达财务问题进行调查。当市场进入熊市，任何一个轻微的扰动都会引发暴雷。\n相比之下，美联储加息的鹰派态度可能具有威胁性。不论如何，纠结熊市发生的原因其实并没有什么价值，因为“每次都不一样”，所谓流动性危机和Ant破发也只能是熊市的结果。但从机构资金出逃的本质，大盘下跌的形态甚至速度等现象出发，我们或许还是能够得到一些对未来投资有普适意义的启发。这也是将本文将要讨论的重点。\n即便作为空仓5个月，全仓SGOV的“大空头”，我也是没想到市场会在黄仁勋离职后来上演这么一出爆仓大戏。周五，英伟达最大跌幅14%，令人瞩目；刚正式启动“拆股”的SNDK直接忽略一切利好大跌16%，回到了四月前的价格。实际上，包括台积电，SOXX等半导体指数也都悉数回到了4月初“旱地拔葱”的起点。今年的AI行情刚好走了一个来回，完成了预想之中的全面洗盘。就连QQQ都在当日内下跌5%。从今年的高点算起，纳指累计下跌17%，标普500累计下跌10%，已经进入“美股几何学”得出的baseline I 范围。\n现在，可以抄底了吗？\n回答这个问题之前，我们先要探讨一下，为什么散户总是在牛市中亏钱？即便是4-6月份抄底半导体的，如果9月之前没跑掉，现在恐怕都已经出现了亏损。\n其实“牛市逃顶”和“熊市抄底”一样，都是反人性的。在牛市最巅峰的日子里，谁会破坏氛围想着逃顶呢？大家都佩服自己的选股能力，佩服自己关注KOL的水平；都都盯着自己的账户余额发呆，幻想能再翻10倍吗。所以说，牛市之所以危险，大家之所以会被套牢，其实依然是人的思维惯性，和市场风险不可预测的长尾本质所共同导致的。\n在市场刚跌2%的时候，你会以为这和之前一样，只是牛市中正常回调；在市场跌去10%的时候，你会觉得既然都跌了这么多了，现在实在跑太亏了。应该再坚持一下，至少等出现一个反弹，甚至回到前高形成双顶再走。等市场跌了20%，抹去你全年盈利甚至开始出现亏损的时候，大部分人才开始意识到不对劲，准备跑路——然而，这时候往往才是华尔街机构叙事反转的开始\n抄底其实也是一样，只不过它恰好是逃顶流程的镜像。在熊市底部出现第一次反弹的时候，你会以为这只是普通的波动，要再等一等；等跳空高开出现一个大缺口的时候，你又会觉得这是死猫跳， 要等second leg再测试前低；等股指一飞冲天一去不复返之后，你又会觉得：现在这个价格抄底，太亏了。最后就是没抄到底，反而只能在高点追高。\n人性如此。纵观推特这么多不同风格的大V，大家应该已经发现，这一缺陷并不是能力和水平所能改变的。只不过多空双方都有运气好的那一天，当市场走势符合自己的风格，顺风顺水，恰好踩到了上涨或者下跌的区间。\n所以对待熊市唯一可行的方法，其实也就只有定投抄底了。下跌刚开始的时候就可以启动定投，越跌越买，而且绝对不能暂停。 史无前例的黄金、股票双杀，账户回撤非常激烈。\n我最后想说什么？\n不要放弃。不要气馁。人类的事情都是周期的，三十年大周期、八年中周期、3年小周期；A股更清晰一点，我们刚刚经历了A股科技成长股的牛市并进入了牛市后快速杀跌挤泡沫的中后段！\n中国科创指数大约还有10%的下跌幅度，美股指数最多大约还有20%的幅度。\n时间大概两个季度。主仓70%短债（大类轮动策略），30%用行业轮动（红利ETF、消费ETF）或者动平衡（QQQ➕SCHD；价值100➕成长100）\n安心睡觉，留70的短债等待大类轮动的机会。\n这个时刻送给大家三句话：\n坚定信念，留在市场，等待机会。\n这个同时发在平台，不注册空开可读：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124706442137755667","l":["macaostarbridge.com"],"ln":[{"u":"http://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["美股","汇率","黄金"],"lk":2,"rt":0,"rp":4,"vw":866},{"id":"2124704336349438124","h":"bbcchinese","ts":1795403963,"zh":"在AI接连解决数学问题的一年里，一名Anthropic员工表示，他使用公司的AI聊天机器人，证明了著名的黎曼猜想。","en":"在AI接连解决数学问题的一年里，一名Anthropic员工表示，他使用公司的AI聊天机器人，证明了著名的黎曼猜想。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2124704336349438124","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4ANHvnl","d":"bbc.in"}],"t":[],"lk":2,"rt":0,"rp":1,"vw":3284},{"id":"2124704274798288967","h":"nytchinese","ts":1795403948,"zh":"#新新世界 中国“盯上”所有人的钱包：网络上最近流传一个笑话，中国经济新引擎是查官员的家、让富人补缴税款，以及向穷人征收社保。经济增长乏力，人口老龄化严重，中国政府为支付各项开支进一步榨取民众的钱财，包括提高养老金缴费标准、对离岸资产征税等。无论贫富，中国民众都感到生活压力增加。","en":"#新新世界 中国“盯上”所有人的钱包：网络上最近流传一个笑话，中国经济新引擎是查官员的家、让富人补缴税款，以及向穷人征收社保。经济增长乏力，人口老龄化严重，中国政府为支付各项开支进一步榨取民众的钱财，包括提高养老金缴费标准、对离岸资产征税等。无论贫富，中国民众都感到生活压力增加。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2124704274798288967","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/business/20261123/china-economy-pensions/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["汇率"],"lk":6,"rt":0,"rp":3,"vw":2814},{"id":"2124702990812774404","h":"qinbafrank","ts":1795403642,"zh":"Anthropic的绿鞋行使，保险”过早失掉。上周五上市第二个交易日、大摩作为稳定代理人已经代表承销商行驶了全部超额配售选择权（“绿鞋”），又额外从市场拿走122亿美元。此次IPO共募集935亿美金，加上私募配售的260亿美金，这一把A社拿到了1195亿美的资金。\n正常来说、承销商对是否行使绿鞋拥有唯一裁量权。但按经验，牵头行几乎总会与公司协商并尽量配合其意愿，很少有投行单方面行动，而且根据招股说明书，承销商不会就超额配售部分获得佣金。因此Anthropic很可能批准甚至鼓励了提前行权。\n绿鞋机制是在IPO中，承销商通常会向投资者超额发售15%的股份，形成空头头寸。若股价上涨，承销商行使选择权，按发行价向发行人增购股份以平仓；若股价下跌，则在市场买入股票平仓，从而为股价提供支撑。\n而一旦行使选择权，承销商便无法再通过在市场买入股票平掉空头头寸来支撑股价。批评者认为，在股价尚未企稳、市况仍在恶化之际提前行权，使这层“保险”过早失效。\n上周五市场大跌，ANT股价在首日冲高回落后并不强势。这个时机只能说明官方急于拿到钱，短期内ANT股价大概率易跌难涨了。\n如上周在币安广场AMA聊到的如果Anthropic市值掉掉到八九千亿美金的位置、个人角度就跌出了性价比、届时中长期向上空间也被打开了。","en":"Anthropic的绿鞋行使，保险”过早失掉。上周五上市第二个交易日、大摩作为稳定代理人已经代表承销商行驶了全部超额配售选择权（“绿鞋”），又额外从市场拿走122亿美元。此次IPO共募集935亿美金，加上私募配售的260亿美金，这一把A社拿到了1195亿美的资金。\n正常来说、承销商对是否行使绿鞋拥有唯一裁量权。但按经验，牵头行几乎总会与公司协商并尽量配合其意愿，很少有投行单方面行动，而且根据招股说明书，承销商不会就超额配售部分获得佣金。因此Anthropic很可能批准甚至鼓励了提前行权。\n绿鞋机制是在IPO中，承销商通常会向投资者超额发售15%的股份，形成空头头寸。若股价上涨，承销商行使选择权，按发行价向发行人增购股份以平仓；若股价下跌，则在市场买入股票平仓，从而为股价提供支撑。\n而一旦行使选择权，承销商便无法再通过在市场买入股票平掉空头头寸来支撑股价。批评者认为，在股价尚未企稳、市况仍在恶化之际提前行权，使这层“保险”过早失效。\n上周五市场大跌，ANT股价在首日冲高回落后并不强势。这个时机只能说明官方急于拿到钱，短期内ANT股价大概率易跌难涨了。\n如上周在币安广场AMA聊到的如果Anthropic市值掉掉到八九千亿美金的位置、个人角度就跌出了性价比、届时中长期向上空间也被打开了。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXx17Y-awAAiK7k.jpg?name=orig","https://pbs.twimg.com/media/HXx17Y-aEAAppvq.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2124702990812774404","l":[],"ln":[],"t":[],"lk":18,"rt":0,"rp":6,"vw":5382},{"id":"2124702522191536131","h":"cnfinancewatch","ts":1795403531,"zh":"感觉现在红利板块进去的话后市力度不够；机器人、影视死扛，将来也不一定领军。\n大盘接近3440第一目标位。这个位置守住守不住还存疑。","en":"感觉现在红利板块进去的话后市力度不够；机器人、影视死扛，将来也不一定领军。\n大盘接近3440第一目标位。这个位置守住守不住还存疑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124702522191536131","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":3,"vw":1471},{"id":"2124702028320694344","h":"TraderS18","ts":1795403413,"zh":"对贝森特暗示黄仁勋回归这事不乐观，他们不是知道错了，而是被跌怕了，但你们搞老黄之前就没想到股市会大跌吗？还是知道会跌但不知道会跌这么多？要么就纯属嘴炮安抚市场。\n不论是哪种，即使现在立刻马上把老黄弄回去，也只会反弹不会反转了，谁见过把破碎的泡泡重新用万能胶粘起来？\n最多是重新换一个题材吹泡泡，但AI赛道确实后继乏力了","en":"对贝森特暗示黄仁勋回归这事不乐观，他们不是知道错了，而是被跌怕了，但你们搞老黄之前就没想到股市会大跌吗？还是知道会跌但不知道会跌这么多？要么就纯属嘴炮安抚市场。\n不论是哪种，即使现在立刻马上把老黄弄回去，也只会反弹不会反转了，谁见过把破碎的泡泡重新用万能胶粘起来？\n最多是重新换一个题材吹泡泡，但AI赛道确实后继乏力了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2124702028320694344","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":0,"vw":569},{"id":"2 nancewatch/status/2124693493549617398","l":[],"ln":[],"t":["黄金"],"lk":0,"rt":0,"rp":0,"vw":386},{"id":"2124692895680827853","h":"fxtrader","ts":1795401235,"zh":"金正恩表示，朝鲜将致力于提升自身“实力和能力”，“既不追求霸权，也不追求扩张。”\n“当前国际形势促使我们重新审视对国家主权和安全的认识。”朝鲜的外交目标是“本着守护主权、维护安全的原则，秉持自主、和平和友谊理念，谋求对外关系的扩大发展。”","en":"金正恩表示，朝鲜将致力于提升自身“实力和能力”，“既不追求霸权，也不追求扩张。”\n“当前国际形势促使我们重新审视对国家主权和安全的认识。”朝鲜的外交目标是“本着守护主权、维护安全的原则，秉持自主、和平和友谊理念，谋求对外关系的扩大发展。”","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXxsXkxagAADs2c.png?name=orig"],"u":"https://x.com/fxtrader/status/2124692895680827853","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":1359},{"id":"2124691952247464047","h":"ReutersChina","ts":1795401010,"zh":"随着人工智能的潜力创造了对其股票的疯狂需求，SpaceX 和 Anthropic 等公司已经掌握了巨大的力量，并且他们正在利用人工智能按照自己的方式做事。银行和投资者似乎别无选择，只能配合。","en":"Companies such as SpaceX and Anthropic have come to wield enormous power as AI's potential creates frenzied demand for their shares, and they are wielding it to do things their way. Banks and investors appear to have little choice but to play along.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2124691952247464047","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/like-spacex-anthropic-ran-an-unusual-ipo-process-chafing-some-bankers-2026-11-22/?taid=6b03a5324f7b1a000198f59e&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":376},{"id":"2124691909134450809","h":"nytchinese","ts":1795401000,"zh":"英伟达丑闻爆发数年前，中国情报机构已将目光瞄准AI芯片。多名知情官员透露，中国情报机构获取美国先进芯片的行动至少已持续两年。国安部成立工作组开展“反封锁”工作，收集半导体行业情报，并帮助企业获取芯片。","en":"英伟达丑闻爆发数年前，中国情报机构已将目光瞄准AI芯片。多名知情官员透露，中国情报机构获取美国先进芯片的行动至少已持续两年。国安部成立工作组开展“反封锁”工作，收集半导体行业情报，并帮助企业获取芯片。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2124691909134450809","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/china/20261123/china-nvidia-spy-chips-state-security/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes. ony Feng的Althesia在大规模用lean4爆破pure math problems的时候，我就说，lean4+Agent+lemma DAG（虽然没有被OpenAI和Anthropic采纳）是未来，而丘成桐这种传统培养方式已经进入死亡倒计时。\n但是不止丘成桐本人， 美国、欧洲、中国绝大多数传统数学系教授们，居然坚定认为这种筛选+培养手敲latex的方式是唯一正确的形式，抗拒AI，抗拒LLM，抗拒Agent，抗拒lean4 formal proof。\n所以我今年一个巨大的爆炸情绪，就是骂醒这些人，告诉他们时代变了，必须彻底抛弃传统基础科学的培养模式，否则你们自己、基础科学、大学制度都将彻底毁灭。","en":"我今年年初的时候，就开始激烈地反对丘成桐和他的实验班，\n因为我在年初看到Tony Feng的Althesia在大规模用lean4爆破pure math problems的时候，我就说，lean4+Agent+lemma DAG（虽然没有被OpenAI和Anthropic采纳）是未来，而丘成桐这种传统培养方式已经进入死亡倒计时。\n但是不止丘成桐本人， 美国、欧洲、中国绝大多数传统数学系教授们，居然坚定认为这种筛选+培养手敲latex的方式是唯一正确的形式，抗拒AI，抗拒LLM，抗拒Agent，抗拒lean4 formal proof。\n所以我今年一个巨大的爆炸情绪，就是骂醒这些人，告诉他们时代变了，必须彻底抛弃传统基础科学的培养模式，否则你们自己、基础科学、大学制度都将彻底毁灭。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124679656670728252","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":132},{"id":"2124677817799729240","h":"bboczeng","ts":1795397641,"zh":"半导体果然跌回四月初了\n和大盘一起，完整实现了我等待的第一目标\n旱地拔葱，从哪里来，就要回到哪里去\n典型的资金跑路后，momemtum fever交易的结局\n当然这也意味着我必须开始抄底了\n具体讨论见即将发布的专题文章\n谢谢大家","en":"半导体果然跌回四月初了\n和大盘一起，完整实现了我等待的第一目标\n旱地拔葱，从哪里来，就要回到哪里去\n典型的资金跑路后，momemtum fever交易的结局\n当然这也意味着我必须开始抄底了\n具体讨论见即将发布的专题文章\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124677817799729240","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":1,"rp":4,"vw":935},{"id":"2124676960223948829","h":"bboczeng","ts":1795397436,"zh":"美国银行表示，DDR5 现货价格在11月初回调后，本周反弹至约61美元；\n1Tb NAND 现货价格在连续数周疲软后首次上涨3%，显示整个存储器市场正趋于企稳。","en":"美国银行表示，DDR5 现货价格在11月初回调后，本周反弹至约61美元；\n1Tb NAND 现货价格在连续数周疲软后首次上涨3%，显示整个存储器市场正趋于企稳。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124676960223948829","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":583},{"id":"2124676282713837835","h":"ShanghaoJin","ts":1795397275,"zh":"😂政客的嘴皮子可以跟着老板随地转变\n但假设我是NV board member，我也会不惜一切代价阻止他回来\n明英宗回来了，于谦什么下场？","en":"😂政客的嘴皮子可以跟着老板随地转变\n但假设我是NV board member，我也会不惜一切代价阻止他回来\n明英宗回来了，于谦什么下场？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2124676282713837835","l":[],"ln":[],"t":[],"lk":11,"rt":0,"rp":7,"vw":3021},{"id":"2124674781140385803","h":"ShanghaoJin","ts":1795396917,"zh":"给你点个赞👍吧","en":"给你点个赞👍吧","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2124674781140385803","l":[],"ln":[],"t":[],"lk":14,"rt":0,"rp":1,"vw":2940},{"id":"2124673807512453556","h":"cnfinancewatch","ts":1795396684,"zh":"历史新高（转自网络）","en":"历史新高（转自网络）","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXxbkFcakAAnL7g.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2124673807512453556","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":699},{"id":"2124673793717407871","h":"cnfinancewatch","ts":1795396681,"zh":"三、涨停事件\n1、国产替代（7）\n4板：真视通、盛剑科技\n1板：东晶电子、鼎龙科技、建业股份、易天股份、华微电子\n事件1：美国商务部发布规则，规范对美国超级智能技术的远程访问，海外数据中心向国外公司提供超1,200万TPP算力须申请许可，同时收紧先进芯片的FAB和OSAT规定等。\n事件2：消息称三星开始穿透严查代工。\n2、PCB（6）\n2板：中京电子\n1板：光华科技、超声电子、澳弘电子、满坤科技、骏亚科技\n事件：全球电子协会在预警报告中指出，全球电子产业正面临印刷电路板（PCB）的严重短缺。这种零部件几乎存在于所有含有电子元件的消费产品中，其供应缺口可能对全球经济造成广泛影响。在2028年年中之前，供应紧张局面不太可能得到实质性缓解。\n3、农林牧渔（5）\n1板：东方海洋、国光股份、万向德农、金 新 农、好 当 家\n事件：厄尔尼诺带来全球农产品价格扰动预期。\n4、机器人（3）\n1板：长华集团、克来机电、风 语 筑、凡拓数创\n事件：马斯克预计未来12-18个月Optimus机器人能做家务劳动。\n5、短剧传媒（2）\n1板：龙版传媒、华媒控股\n事件：红果短剧日活破1亿，板块反复活跃。","en":"三、涨停事件\n1、国产替代（7）\n4板：真视通、盛剑科技\n1板：东晶电子、鼎龙科技、建业股份、易天股份、华微电子\n事件1：美国商务部发布规则，规范对美国超级智能技术的远程访问，海外数据中心向国外公司提供超1,200万TPP算力须申请许可，同时收紧先进芯片的FAB和OSAT规定等。\n事件2：消息称三星开始穿透严查代工。\n2、PCB（6）\n2板：中京电子\n1板：光华科技、超声电子、澳弘电子、满坤科技、骏亚科技\n事件：全球电子协会在预警报告中指出，全球电子产业正面临印刷电路板（PCB）的严重短缺。这种零部件几乎存在于所有含有电子元件的消费产品中，其供应缺口可能对全球经济造成广泛影响。在2028年年中之前，供应紧张局面不太可能得到实质性缓解。\n3、农林牧渔（5）\n1板：东方海洋、国光股份、万向德农、金 新 农、好 当 家\n事件：厄尔尼诺带来全球农产品价格扰动预期。\n4、机器人（3）\n1板：长华集团、克来机电、风 语 筑、凡拓数创\n事件：马斯克预计未来12-18个月Optimus机器人能做家务劳动。\n5、短剧传媒（2）\n1板：龙版传媒、华媒控股\n事件：红果短剧日活破1亿，板块反复活跃。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124673793717407871","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":798},{"id":"2124673789585981742","h":"cnfinancewatch","ts":1795396680,"zh":"No.1 盘前热点事件\n一、昨日热点\n算力：真视通\n光刻胶：盛剑科技\nPCB：中京电子\n短剧：龙版传媒\n二、周末稳市场举措\nA股：\n1、沪深北交易所降低融资保证金比例下限至80%，自2026年11月30日起施行，理论上可带来增量资金近4000亿元。\n2、沪深交易所推出新一批降费措施，包括免收交易单元使用费等，并将今年年初已实施的免收上市费、债券交易经手费等措施有效期再延长两年至2028年。\n3、中国结算明确，自2027年1月1日起至2028年12月31日，继续暂免收取绿色公司债券、科技创新公司债券和民营企业公司债券（不含可转换公司债券）发行人服务费及债券结算费。\n4、创业板拟引入做市商制度。\n5、上交所正推动修订科创板做市商规则。\n韩国\n高层金融官员在周日召开的紧急会议后表示，鉴于市场波动加剧，韩国宣布了分阶段措施以稳定市场，其中包括确保股票稳定基金就绪，以便在必要时采取行动。韩国财政部表示，将放宽每日股票回购限额和密切监控非法卖空行为，为期三个月。\n台\n正式推出“禁止平盘以下放空”规则，从11月23日开始，所有投资者都不能以低于前一交易日收盘价的价格提交融券卖出委托。最低融资维持保证金比例将从目前的130%下调至120%。\n三、行业要闻\n1、台：九合一投票将于11月28日举行，选举进入最后冲刺阶段。（福建）\n2、特朗普称将与伊朗达成一项永久性协议。（美伊）\n3、Neuralink 展示脑机接口新成果，瘫痪患者成功在《GTA 6》里自由驾驶、射击。（脑机接口）\n4、游戏《GTA 6》发售首日销售额达37.9亿美元。（游戏）\n5、我国启动具身智能数据国家标准研制。（机器人数据）\n6、22日起，新一轮冷空气自北向南影响我国中东部地区，带来大范围雨雪降温。（供热）\n7、特斯拉宣布在美国市场推出FSD v15。（无人驾驶）\n8、量子计算机高速内存全球首次真机实现。（量子计算）\n9、黄仁勋据称将创办新的半导体公司，或将筹资500亿美元用于创业。\n10、戴尔、惠普企业、联想及超微电脑等厂商正要求客户为已签订的AI服务器订单支付更高价格，部分订单涨幅达到25%至45%。\n11、特朗普表示，将对在海外建设数据中心的美国公司征税。\n12、美方拟禁止中国电信运营商直接获取美国互联网电话号码资源。\n13、美国证券交易委员会据悉正对英伟达潜在会计问题展开调查。\nNo.2 公告精选\n一、日常公告\n魅视科技：签署算力服务项目备忘录 最高金额11.64亿元\n弘信电子：控股子公司签署7.45亿元算力技术服务协议\n木 林 森：拟投资22.5亿元建设半导体芯片封测项目\n易天股份：拟收购艾晨数字能源37%股权\n奥 来 德：全资子公司预中标京东方8.6代AMOLED生产线项目\n鼎龙股份：已有10款高端晶圆光刻胶取得国内多家主流晶圆厂批量订单\n摩尔线程：实控人提议回购5亿-10亿元股份\n华友钴业：拟10亿-15亿元回购股份\n通威股份：拟10亿元-20亿元回购股份\n荣盛石化：控股股东拟增持10亿-20亿元股份","en":"No.1 盘前热点事件\n一、昨日热点\n算力：真视通\n光刻胶：盛剑科技\nPCB：中京电子\n短剧：龙版传媒\n二、周末稳市场举措\nA股：\n1、沪深北交易所降低融资保证金比例下限至80%，自2026年11月30日起施行，理论上可带来增量资金近4000亿元。\n2、沪深交易所推出新一批降费措施，包括免收交易单元使用费等，并将今年年初已实施的免收上市费、债券交易经手费等措施有效期再延长两年至2028年。\n3、中国结算明确，自2027年1月1日起至2028年12月31日，继续暂免收取绿色公司债券、科技创新公司债券和民营企业公司债券（不含可转换公司债券）发行人服务费及债券结算费。\n4、创业板拟引入做市商制度。\n5、上交所正推动修订科创板做市商规则。\n韩国\n高层金融官员在周日召开的紧急会议后表示，鉴于市场波动加剧，韩国宣布了分阶段措施以稳定市场，其中包括确保股票稳定基金就绪，以便在必要时采取行动。韩国财政部表示，将放宽每日股票回购限额和密切监控非法卖空行为，为期三个月。\n台\n正式推出“禁止平盘以下放空”规则，从11月23日开始，所有投资者都不能以低于前一交易日收盘价的价格提交融券卖出委托。最低融资维持保证金比例将从目前的130%下调至120%。\n三、行业要闻\n1、台：九合一投票将于11月28日举行，选举进入最后冲刺阶段。（福建）\n2、特朗普称将与伊朗达成一项永久性协议。（美伊）\n3、Neuralink 展示脑机接口新成果，瘫痪患者成功在《GTA 6》里自由驾驶、射击。（脑机接口）\n4、游戏《GTA 6》发售首日销售额达37.9亿美元。（游戏）\n5、我国启动具身智能数据国家标准研制。（机器人数据）\n6、22日起，新一轮冷空气自北向南影响我国中东部地区，带来大范围雨雪降温。（供热）\n7、特斯拉宣布在美国市场推出FSD v15。（无人驾驶）\n8、量子计算机高速内存全球首次真机实现。（量子计算）\n9、黄仁勋据称将创办新的半导体公司，或将筹资500亿美元用于创业。\n10、戴尔、惠普企业、联想及超微电脑等厂商正要求客户为已签订的AI服务器订单支付更高价格，部分订单涨幅达到25%至45%。\n11、特朗普表示，将对在海外建设数据中心的美国公司征税。\n12、美方拟禁止中国电信运营商直接获取美国互联网电话号码资源。\n13、美国证券交易委员会据悉正对英伟达潜在会计问题展开调查。\nNo.2 公告精选\n一、日常公告\n魅视科技：签署算力服务项目备忘录 最高金额11.64亿元\n弘信电子：控股子公司签署7.45亿元算力技术服务协议\n木 林 森：拟投资22.5亿元建设半导体芯片封测项目\n易天股份：拟收购艾晨数字能源37%股权\n奥 来 德：全资子公司预中标京东方8.6代AMOLED生产线项目\n鼎龙股份：已有10款高端晶圆光刻胶取得国内多家主流晶圆厂批量订单\n摩尔线程：实控人提议回购5亿-10亿元股份\n华友钴业：拟10亿-15亿元回购股份\n通威股份：拟10亿元-20亿元回购股份\n荣盛石化：控股股东拟增持10亿-20亿元股份","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124673789585981742","l":[],"ln":[],"t":["A股港股","AI科技"],"lk":2,"rt":0,"rp":2,"vw":1516},{"id":"2124672863592734820","h":"cnfinancewatch","ts":1795396459,"zh":"一生一定要去一次挪威","en":"一生一定要去一次挪威","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2124672834341609472/vid/avc1/480x852/4pswpNBYk7tWgiXv.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2124672863592734820","l":[],"ln":[],"t":[],"lk":6,"rt":1,"rp":2,"vw":1253},{"id":"2124671795907465459","h":"fxtrader","ts":1795396205,"zh":"#行情 韩国KOSPI指数跌3%。三星电子、SK海力士跌3%。\n日本股市因劳动感恩节假期休市一日。","en":"#行情 韩国KOSPI指数跌3%。三星电子、SK海力士跌3%。\n日本股市因劳动感恩节假期休市一日。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2124671795907465459","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":770},{"id":"2124671103276855306","h":"cnfinancewatch","ts":1795396040,"zh":"A股盘前第二版 2026年11月23日 周一\n#结论 两小时里最大的变化是美股期指继续往上走。标普期货约7085，较上周五结算涨约2.2%，纳指期货约25871涨约3.0%，比第一版时的涨1.2%和1.9%又抬了一截。但亚洲开盘没有跟着走，\n#韩国综指 开盘跌2.8%，随后跌幅扩大到3%， #三星电子 和 #SK海力士\n都跌约3%，日本今天休市。外盘反抽和亚洲情绪背离，第一版的判断不变：防守和高股息当压舱石，科技成长等止跌信号，开盘先看韩股这种背离会不会传到A股。\n#消息面 两小时更新\n偏利好的有三条。一是首批18只主动ETF今天上市，全部顶格募满20亿元，合计约360亿元增量资金将逐步入场。二是上周ETF整体净流入1908.02亿元，宽基型净流入1895.60亿元，华泰柏瑞沪深300ETF一只就净流入385.41亿元，托底资金很清楚。三是宁泉资产今天起恢复新投资者申购，停了一年多，私募老将重新开门收钱，算是一个情绪信号。\n偏利空的是杠杆还在出清：截至11月20日两市融资余额21437.91亿元，单日减少417.24亿元。本周还有3795亿元逆回购到期，周三1万亿元一年期MLF到期，流动性要看央行怎么续作。\n外部方面，特朗普称伊朗上周发射的无人机和导弹数量创一年多新高，中东风险仍在。产业上，戴尔、HPE、联想、超微等厂商在签约数月后上调AI服务器售价，最高涨45%，成本压力在往下游传导；韩国11月前20天半导体出口同比增长294.4%，硬件需求本身没塌，跌的是估值和资金。另外深交所港股通名单调入\n#东山精密 $002384，今天生效。\n#研报面\n两小时内新增的研报不多。11月23日开源证券给 #巨化股份 $600160 买入，控股股东拟增持，制冷剂需求明显改善；华鑫证券11月23日给\n#川润股份 $002272 增持，看点是加码液冷。中信建投今晨连发几篇：一篇认为探底阶段防御品种仍有较高配置价值，点名银行、白电、白酒、保险、铁路公路、电信运营等，红利交易热度升高但未拥挤；一篇看全球封测景气上行，三季度国内封测板块营收同比增长28%。银河证券认为ETF放量净流入显示托底意愿，但增量资金回补节奏还要看外部缓和。研报口径和第一版的防守主线一致。\n#热榜\n东财人气榜和同花顺热榜本档接口均未取到，数据缺失。第一版时榜单前列以PCB涨停股和低价题材为主，这一判断暂无新数据更新。\n#资金面\n集合竞价数据要到9点15分后才有，本稿截止时数据缺失。能确认的增量是上周ETF净流入1908亿元和今天上市的主动ETF，流向以沪深300等宽基为主，利好大市值权重；融资盘单日减少417亿元，流出集中在电子、电力设备等泛AI成长股，这和周五的结构一致。北向盘前数据缺失。\n#中美映射\n20日和5日双窗口沿用第一版数据：A股只有银行、红利、电力ETF在两个窗口都为正，美股半导体和科技ETF双窗口同步走弱，没有进攻方向的共振。两小时新增的是纳指期货涨约3%，若今晚美股能兑现，科技的5日窗口才有修复可能，现在只算期待，不算信号。\n#期货 两小时更新\n标普期货约7085，较前结算涨约2.2%；纳指期货约25871涨约3.0%；道指期货约48920涨约1.5%。纽约金约3576美元涨约1.7%，原油约82.9美元跌约0.6%。离岸人民币约6.6743，基本持平。富时A50期货最新报价本档未取到，第一版时夜盘收12515跌约0.85%。\n#三个方向\n维持不变。一是银行与红利，ETF资金和券商防御观点继续互证。二是水电与核电，防守属性，20日占优。三是PCB与元件，AI服务器涨价和韩国芯片出口数据是新的佐证，但只做回踩不追涨停。半导体与存储仍只观察，韩股芯片股今早下跌，说明资金还没回来。\n#六只个股\n维持第一版名单，两小时内无需调整的新信息。\n #工商银行 $601398 宽基ETF资金的直接受益者，回落不破9.2元可持有。\n #建设银行 $601939 与工行同步，看高股息资金是否延续。\n #长江电力 $600900 水电现金流稳定，防守首选之一。\n #中国广核 $003816 核电防守，弹性略大。\n #沪电股份 $002463 服务器板逻辑因AI服务器涨价加强，回踩企稳再看。\n #深南电路 $002916 与PCB短缺共振，不追高。\n #东山精密 $002384 今日调入港股通，可作PCB方向观察，不进六只。\n#小盘阿尔法\n今天不选。两小时内没有能通过20日K线和财报互证的小盘标的，不凑数。\n#操作提示\n9点15分看竞价：若上证50和银行继续高开、中证1000竞价跌幅不超过1%，说明美股期指的反抽传过来了，防守仓可持有；若跟着韩股跌，小票先减仓。科技股要等放量止跌，不因期指涨就抢反弹。今天的外部变量还是伊朗和周三的MLF续作。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘前第二版 2026年11月23日 周一\n#结论 两小时里最大的变化是美股期指继续往上走。标普期货约7085，较上周五结算涨约2.2%，纳指期货约25871涨约3.0%，比第一版时的涨1.2%和1.9%又抬了一截。但亚洲开盘没有跟着走，\n#韩国综指 开盘跌2.8%，随后跌幅扩大到3%， #三星电子 和 #SK海力士\n都跌约3%，日本今天休市。外盘反抽和亚洲情绪背离，第一版的判断不变：防守和高股息当压舱石，科技成长等止跌信号，开盘先看韩股这种背离会不会传到A股。\n#消息面 两小时更新\n偏利好的有三条。一是首批18只主动ETF今天上市，全部顶格募满20亿元，合计约360亿元增量资金将逐步入场。二是上周ETF整体净流入1908.02亿元，宽基型净流入1895.60亿元，华泰柏瑞沪深300ETF一只就净流入385.41亿元，托底资金很清楚。三是宁泉资产今天起恢复新投资者申购，停了一年多，私募老将重新开门收钱，算是一个情绪信号。\n偏利空的是杠杆还在出清：截至11月20日两市融资余额21437.91亿元，单日减少417.24亿元。本周还有3795亿元逆回购到期，周三1万亿元一 "我跟你们讲，如果你是我的老粉，你一定要认清，推特上没有几个是真分析师，\n#能分析宏观利率和汇率的，没有：去年我第一个提出人民币是升值压力的时候，多少分析是骂我？多少网友骂我？\n#能分析宏观产业周期的，没有：去年我提出中国一线地产，香港开头，其他今年筑底的，多少分析是笑话我？网友骂我？没有上千，也有九百了吧？骂我娘的都有。\n至于股市投资，能利用量化数据、回测数据，提出真正适合散户超长持仓模型的更没有，而是我是几乎唯一的奉献者，#推特唯一的专业人士 @cnfinancewatch。\n我告诉你们 #叫你们定投标普的几乎都是业余和民科分析师，身份存疑，是不是博士、是不是证券行业从业资格试通过者？非常存疑。\n真正让散户能穿越牛熊超长持仓，跑赢标普的策略，跟本不是定投，定投是跑不赢的，只会跑输标普本身。\n#你们应该订阅我，看我订阅区第一条：","en":"我跟你们讲，如果你是我的老粉，你一定要认清，推特上没有几个是真分析师，\n#能分析宏观利率和汇率的，没有：去年我第一个提出人民币是升值压力的时候，多少分析是骂我？多少网友骂我？\n#能分析宏观产业周期的，没有：去年我提出中国一线地产，香港开头，其他今年筑底的，多少分析是笑话我？网友骂我？没有上千，也有九百了吧？骂我娘的都有。\n至于股市投资，能利用量化数据、回测数据，提出真正适合散户超长持仓模型的更没有，而是我是几乎唯一的奉献者，#推特唯一的专业人士 @cnfinancewatch。\n我告诉你们 #叫你们定投标普的几乎都是业余和民科分析师，身份存疑，是不是博士、是不是证券行业从业资格试通过者？非常存疑。\n真正让散户能穿越牛熊超长持仓，跑赢标普的策略，跟本不是定投，定投是跑不赢的，只会跑输标普本身。\n#你们应该订阅我，看我订阅区第一条：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124670774951006478","l":["macaostarbridge.com"],"ln":[{"u":"http://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["美股","汇率"],"lk":0,"rt":0,"rp":0,"vw":569},{"id":"2124668379386753257","h":"qinbafrank","ts":1795395390,"zh":"历史上美股恐慌贪婪指数跌到9进入极度恐慌区间后美股会怎么走？上周五美股值得看的一个数据就是CNN恐慌贪婪指数跌到9的进入极度恐慌区间，印象中去年关税战指数跌倒3是过去这么多年恐贪指数一个极值。让GPT做了一个统计自2011年以来，美股共有136个交易日恐惧贪婪指数低于10，构成40段连续信号。把密集出现的信号合并成17轮行情，除去刚触发的本轮，已走完的 16 轮里：7 轮快速V 反，5轮反弹后二探或破底，4 轮继续下跌延后见底。尽管如此，16轮中有14轮在第21个交易日收涨。\n这次最值得对照的是2025年11月和2018年四季度：\n1）前者说明AI估值担忧遇上货币政策预期改善，可以很快止跌；\n2）后者说明一旦风险从股票估值传向盈利和融资成本即使出现强反弹，也可能要回头再二探一次。\n本轮已经出现了值得跟踪的信用市场证据。上周五CNN七个分项中，标普动量只有0.2，避险需求0.8，波动率分项 1.32，期权分项2.0，短期避险已经相当集中。与此同时，美国高收益债利差从 11/13 的323个基点扩大到11/19的\n352个基点。到 11/20，投资级信用违约互换指数CDX IG的利差盘中一度达到 65.5个基点，为 3月底以来最高。高收益债数据截至周四，CDX 是周五盘中读数，两者都指向融资风险开始被重新定价。\n所以反弹时信用利差怎么走来区分这两个历史参照：\n1）如果纳指反弹、科技债和广义信用利差同步收窄，更接近2025 年11月的快速稳定；\n2）如果纳指大涨几天，信用保护成本却继续上升，2018年四季度的经验就更有参考价值。\n所以整体上：\n市场进入极度恐慌区间，短线反弹是大概率的，是直接V反还是二探甚至延后见底还要再看。这一次个人更倾向会有二探或者延后见底，核心还是宏观和产业政策都还没明朗（上周推文聊到市场未来走出来要看宏观产业的三个层面，见引用推文最后部分），如果之后真能出现如去年10月恐慌贪婪指数被打倒5以下，市场恐慌到无以复加，那可能真是绝佳机会。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"历史上美股恐慌贪婪指数跌到9进入极度恐慌区间后美股会怎么走？上周五美股值得看的一个数据就是CNN恐慌贪婪指数跌到9的进入极度恐慌区间，印象中去年关税战指数跌倒3是过去这么多年恐贪指数一个极值。让GPT做了一个统计自2011年以来，美股共有136个交易日恐惧贪婪指数低于10，构成40段连续信号。把密集出现的信号合并成17轮行情，除去刚触发的本轮，已走完的 16 轮里：7 轮快速V 反，5轮反弹后二探或破底，4 轮继续下跌延后见底。尽管如此，16轮中有14轮在第21个交易日收涨。\n这次最值得对照的是2025年11月和2018年四季度：\n1）前者说明AI估值担忧遇上货币政策预期改善，可以很快止跌；\n2）后者说明一旦风险从股票估值传向盈利和融资成本即使出现强反弹，也可能要回头再二探一次。\n本轮已经出现了值得跟踪的信用市场证据。上周五CNN七个分项中，标普动量只有0.2，避险需求0.8，波动率分项 1.32，期权分项2.0，短期避险已经相当集中。与此同时，美国高收益债利差从 11/13 的323个基点扩大到11/19的\n352个基点。到 11/20，投资级信用违约互换指数CDX IG的利差盘中一度达到 65.5个基点，为 3月底以来最高。高收益债数据截至周四，CDX 是周五盘中读数，两者都指向融资风险开始被重新定价。\n所以反弹时信用利差怎么走来区分这两个历史参照：\n1）如果纳指反弹、科技债和广义信用利差同步收窄，更接近2025 年11月的快速稳定；\n2）如果纳指大涨几天，信用保护成本却继续上升，2018年四季度的经验就更有参考价值。\n所以整体上：\n市场进入极度恐慌区间，短线反弹是大概率的，是直接V反还是二探甚至延后见底还要再看。这一次个人更倾向会有二探或者延后见底，核心还是宏观和产业政策都还没明朗（上周推文聊到市场未来走出来要看宏观产业的三个层面，见引用推文最后部分），如果之后真能出现如去年10月恐慌贪婪指数被打倒5以下，市场恐慌到无以复加，那可能真是绝佳机会。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXxUXaLbkAAyGVs.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2124668379386753257","l":[],"ln":[],"t":["美股","关税贸易"],"lk":15,"rt":3,"rp":4,"vw":3792},{"id":"2124665306706567373","h":"darrencao2024","ts":1795394658,"zh":"https://x.com/i/article/2124665234019250176","en":"","zh_src":"bing","lang":"","m":[],"u":"https://x.com/darrencao2024/status/2124665306706567373","l":["x.com"],"ln":[{"u":"https://x.com/i/article/2124665234019250176","d":"x.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":108},{"id":"2124665303149973671","h":"bboczeng","ts":1795394657,"zh":"美国银行表示，本周开展的供应链渠道调研显示，尽管英伟达（Nvidia，$NVDA）管理层出现变动，且市场对AI支出的担忧不断升温，但其对HBM、SOCAMM和企业级SSD的订单并未出现减弱迹象。","en":"美国银行表示，本周开展的供应链渠道调研显示，尽管英伟达（Nvidia，$NVDA）管理层出现变动，且市场对AI支出的担忧不断升温，但其对HBM、SOCAMM和企业级SSD的订单并未出现减弱迹象。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124665303149973671","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":124},{"id":"2124662318311067919","h":"TJ_Research","ts":1795393945,"zh":"上年因为台风错跳过了深圳线下，这次给弥补了，链接是报名表格，只有一个要求，填了必须到，谢谢。","en":"上年因为台风错跳过了深圳线下，这次给弥补了，链接是报名表格，只有一个要求，填了 #中际旭创 $300308\n周五跌3.72%仍在榜，说明光模块人气在退潮。热榜和PCB短缺逻辑共振，但多是涨停后的人气，追高胜率低。\n#资金面\n周五两市成交约1.42万亿元，较前一日放量，上涨约313家下跌约5236家，资金明显往大市值防守集中。 #工商银行 $601398\n涨3.30%， #建设银行 $601939 涨3.07%， #长江电力 $600900 涨2.40%， #中国广核 $003816\n涨3.45%。周一北向与主力资金盘前数据缺失。\n#中美映射\n20日窗口：美股半导体ETF SOXX跌22.58%、SMH跌24.12%、科技XLK跌18.68%，几乎全部贴在20日低点；只有公用事业XLU、住宅建筑ITB、航空JETS在20日维度微涨。A股20日领先的是银行ETF涨9.07%、红利ETF涨3.60%、电力ETF涨2.55%，通信ETF跌29.57%、人工智能ETF跌17.10%。\n5日窗口：美股板块全线下跌，A股只有银行ETF涨3.23%、红利ETF涨1.63%、电力ETF涨1.45%。\n对照下来，没有进攻方向的双窗口共振，公用事业与电力只算20日的防守共振，趋势没加速；科技在两边都是双窗口同步走弱。\n#期货\n富时A50期货夜盘收12515，跌约0.85%。今晨美股期指反弹，标普期货涨约1.2%，纳指期货涨约1.9%；纽约金约3560美元，涨约1.3%；原油约83.2美元，基本持平。离岸人民币约6.6748。\n#三个方向\n一是银行与红利，20日和5日都在走强，周五逆势放量，继续当底仓。二是水电与核电，偏防守，20日小幅占优。三是PCB与元件，供给短缺加研报加热榜三方互证，但只做回踩不追涨停。半导体设备与存储研报偏多，价格还没止跌，只观察。\n#六只个股\n #工商银行 $601398 周五涨3.30%，大市值防守首选，回落不破9.2元可持有。\n #建设银行 $601939 涨3.07%，与工行同步，看高股息资金是否延续。\n #长江电力 $600900 涨2.40%，电力ETF20日领先，水电现金流稳定。\n #中国广核 $003816 涨3.45%，核电防守属性，低价股弹性稍大。\n #沪电股份 $002463 周五跌0.96%，PCB龙头，服务器板逻辑在，回踩企稳再看。\n #深南电路 $002916 跌0.59%，与PCB短缺逻辑共振，不追高。\n#小盘阿尔法\n今天不选。热榜小盘多是连板人气，缺少完整20日K线核验和财报互证，不凑数。\n#操作提示\n开盘先看A50和美股期指的反抽能否传到A股，若上证守住3500点、上证50继续红，防守线可以持有；若中证1000再跌超2%，减少小票仓位。科技股等出现缩量止跌再说，伊朗风险和美联储加息预期是今天两个外部变量。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘前第一版 2026年11月23日 周一\n#结论 周五A股放量杀跌，上证收3533.79跌1.23%，盘中最低3500.83，深证成指跌3.09%，创业板指跌3.54%，中证1000跌4.89%，只有上证50收涨0.45%。随后美股同日继续出清，标普跌3.70%，纳指跌5.28%，\n#英伟达 $NVDA 跌14.01%。好在周末到今晨，美股期指明显反抽，标普期货约7020涨约1.2%，纳指期货约25597涨约1.9%。今天的判断是低开或平开后分化，防守和高股息继续当压舱石，科技成长先看止跌信号，不抄刀。\n#消息面\n周末偏利空的是外部：特朗普称若新年后与伊朗仍无协议倾向动武，伊朗方面称两艘超大型油轮在霍尔木兹海峡附近触雷，中东风险抬头。马斯克警告人工智能行业明年可能面临严重资金短缺，与上周的AI出清情绪叠加。CME美联储观察显示12月加息25个基点的概率为91.4%（转述），而美财长贝森特警告美联储过度紧缩风险。\n偏利好的是国内：创业板将引入做市商制度，科创板做市规则同步酝酿修订；首批主动ETF今日上市；年内新发基金规模突破万亿元，24家公募同日上报ETF新品；回购增持密集落地。十大券商策略普遍认为不必过度悲观、市场或逐步企稳。个股层面\n#思特威 拟入股晶圆厂加码CIS代工产能， #天孚通信 拟在南昌投建高速光器件项目，但其股价自年内高点回撤超七成。\n#研报面\n周末研报集中在业绩修复和半导体。11月22日太平洋给 #兆易创新 $603986\n买入，逻辑是存储量价齐升，华安11月19日同样给买入；华安11月22日给 #澜起科技 $688008 买入；国金11月21日给 #北方华创\n$002371 买入，指向AI扩产与国产替代；太平洋11月22日给 #龙源电力 $001289\n买入，认为盈利底部逐渐清晰；太 CZ 和何一还表态过不做合约（不信可以去翻翻币安 BTCUSDT.P 的 K 线起点）。\n当时的 BitMEX 就是全球衍生品的绝对定价中心，加上它是在每天固定时间人工审核提币的机制，极端行情下跨所搬砖根本来不及补血。\n老黑拔掉的那根网线，断掉空头一夜暴富的梦，也改写了整个币圈的权力版图，从此BitMEX 沦为二流，币安合约，FTX等一骑绝尘，都是 312 之后的故事了。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXv7L37XcAI2KNi.jpg?name=orig"],"u":"https://x.com/AntonLaVay/status/2124567835766624716","l":[],"ln":[],"t":["关税贸易"],"lk":0,"rt":0,"rp":1,"vw":326},{"id":"2124565443751121252","h":"wufantouzi","ts":1795370848,"zh":"最近两周可能震荡\n但周一周二估计反弹\n12月9号加息0.25%\n就是靴子落地\n12月10号cpi出来\n会是利好涨\n反转最晚就在12月9号","en":"最近两周可能震荡\n但周一周二估计反弹\n12月9号加息0.25%\n就是靴子落地\n12月10号cpi出来\n会是利好涨\n反转最晚就在12月9号","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2124565443751121252","l":[],"ln":[],"t":["美联储"],"lk":3,"rt":1,"rp":2,"vw":1081},{"id":"2124564979928248351","h":"MOJOAI_HQ","ts":1795370738,"zh":"总经理，🎾 MOJO 美国股票交易大赛 🎾 于 11 月 23 日星期一美国市场开盘时拉开帷幕 🔔 快速了解您的分数如何运作 👇\n - 资本 = 您的账户总额（MOJO + 连接的交易所），在开盘时快照\n - PnL = 通过 MOJO 进行的美国股票交易实现的 PnL，减去费用\n - 回报 = 盈亏 ÷ 资本\n - 一旦设定，资本就固定：存款和取款都不会改变\n 🟢 开盘时间：11 月 23 日，06:30 SF / 09:30 NYC / 14:30 伦敦 / 22:30 新加坡 / 23:30 首尔\n ⚠️ 如果您尚未为 MOJO 账户注资或在铃声响起时连接交易所，则您的资金将在您的余额首次超过 100 美元时记录。截止日期：11 月 29 日星期日。🫡\n 示例：\n 1. 开盘时 $1,000，+$50 → 回报 5%\n 2. 比赛中存入$500 → 资金保持$1,000\n 3、开盘时$0，11月25日存入$200→本金$200； +$20 → 回报 10%，两块板\n 4.到 11 月 29 日仍低于 100 美元 → 无资本，仅限 PnL 董事会","en":"Gm, the 🎾 MOJO US Stock Trading Competition 🎾 kicks off at the US market open on Monday, Nov 23 🔔 Quick rundown of how your score works 👇\n- Capital = your account total (MOJO + connected exchanges), snapshotted at the opening bell\n- PnL = realized PnL from US-stock trades placed through MOJO, minus fees\n- Return = PnL ÷ capital\n- Once set, capital is fixed: deposits and withdrawals change neither\n🟢 Opening bell: Nov 23, 06:30 SF / 09:30 NYC / 14:30 London / 22:30 Singapore / 23:30 Seoul\n⚠️ If you haven't funded your MOJO account or connected an exchange by the bell, your capital is recorded the first time your balance goes over $100. D 普500指数大幅下挫，尽管企业连续第二个季度实现超过30%的利润增长，因为仅凭强劲的财报业绩不足以抵御围绕人工智能交易日益加剧的焦虑情绪。\n对盈利增长已经见顶的担忧并未消散，分析师们已大幅压缩了对下一轮盈利的预期，明年盈利放缓正成为华尔街的共识观点。\n科技板块的估值按市盈率计算已缩水逾40%，这是近三十年来最剧烈的估值重置之一，投资者对此的回应是大幅削减科技仓位。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXvQKWbbMAE5NAS.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2124520664828895399","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":1,"rt":0,"rp":0,"vw":1524},{"id":"2124519983506133298","h":"cnfinancewatch","ts":1795360010,"zh":"问：高尔夫球场生态问题有哪些？中国为什么更加重视这一问题？\n答：\n高尔夫球场确实存在一些普遍的生态危害，但“美国、日本没有出现这种说法”这个印象并不完全准确。争议和监管在三国都存在，真正的差异在于问题的紧迫性、监管的成熟度，以及产业与生态空间的冲突程度。\n🌍 高尔夫球场普遍的生态代价\n无论在哪里，高标准草坪的维护都意味着对自然的深度干预：\n· 巨大的水资源消耗：单个球场每日耗水可达3,000立方米，足以满足1.5万人的需求。在中国，北京球场年耗水曾接近4000万吨，相当于一座百万人口城市的居民用水量。\n· 化学品污染风险：为维持草坪，球场会大量使用化肥、杀虫剂和除草剂。一个千亩球场每月施用的这类化学品可达13吨，其中大部分未被吸收，会随雨水渗入地下水或流入河流。全球范围内，球场每年农药化肥用量可达1,500公斤。\n· 栖息地破坏与水资源竞争：建设过程往往需要清除原生植被，破坏野生动物栖息地，并在缺水地区与农业、居民争夺水源。\n🔍 为什么会有“美日没有危害”的印象？\n这主要源于认知偏差和发展阶段差异，而非美日不存在问题。\n在美国，争议一直以不同形式存在，且常进入公共视野。近期就有抗议活动，反对大学高尔夫设施可能带来的农药径流污染当地水井和河流；在干旱的亚利桑那州，球场用水也持续引发争论；佛罗里达州甚至在2024年因计划在州立公园内建球场而面临濒危物种保护的法律挑战。美国早已建立起相对成熟的管理框架，通过《清洁水法》许可、最佳管理实践（BMPs）和缓冲带要求等，将许多问题内化为合规成本和运营标准，而非任其演变为公共危机。\n在日本，环境争议同样存在，且监管颇为细致。日本环境省专门制定了指导方针，对球场排出水中的农药浓度设定“水浊指針值”和“水産指針值”进行双重管控。近期，世界自然基金会（WWF）也强烈反对冲绳石垣岛的大型高尔夫度假村计划，因其可能威胁拉姆萨尔湿地和特别天然纪念物冠鹫的栖息地，并带来地下水与水质污染风险。日本的争议更多聚焦于新建项目对敏感生态的冲击，而非已建球场的日常运营污染。\n⚠️ 为什么在中国被突出为“严重生态危害”？\n在中国，高尔夫球场的问题被放大，根源在于资源禀赋、治理环境和产业模式的叠加效应。\n第一，水资源约束极其刚性。 中国北方普遍缺水，而高尔夫球场的高耗水特性直接触碰了生存底线。在华北等地，球场偷采地下水用于灌溉的现象曾被频繁曝光，这不仅是资源浪费，更是对子孙后代水源的战略性透支。\n第二，监管缺位与违规建设形成恶性循环。 自2004年起，国家多次发文明令禁止新建高尔夫球场。然而，球场数量却在此期间从约170家逆势增长到约600家。大量项目以“体育公园”“绿化”之名违规上马，这意味着它们的污染治理设施和环保标准往往完全缺失，污染处于失控状态。\n第三，生态脆弱区的冲突格外尖锐。 许多违规球场直接建在生态极度敏感的区域。在内蒙古鄂尔多斯，球场建在了国家投入巨资治理的砒砂岩沙棘生态林中，为了建设甚至将防风固沙的沙棘林连根挖除，直接摧毁了脆弱的生态屏障。这种将生态工程成果转化为少数人娱乐场所的冲突，在舆论中具有极强的象征意义和冲击力。\n所以，美日并非没有生态危害的“净土”，而是它们的争议在既有框架内被消化和管控。中国的“严重危害”叙事，是对在极端缺水与生态脆弱条件下，资本驱动的违规开发可能造成不可逆损害的真实警示。这种警示的严厉程度，本质上与资源环境的承载底线是成正比的。","en":"问：高尔夫球场生态问题有哪些？中国为什么更加重视这一问题？\n答：\n高尔夫球场确实存在一些普遍的生态危害，但“美国、日本没有出现这种说法”这个印象并不完全准 差异点。\n1、与2000年对比\n上半年半导体板块很多标的股价确实走出了抛物线的形态、跟2000年有一定相似之处。\n但看本质的差异：\n2000年前后的互联网行业并没找到商业模式，从00年一直到06、07年 ，游戏、广告、电商、增值服务这四大商业模式才真正被确立。当下的状态是基础设施非常完善、信息传递速度很快，所以AI商业化的速度很快。年初这里\n当下AI的商业化进展其实还是可以的，几个例证：\n1）之前这里 聊到Anthropic今年做到500～600亿美是没问题明年大概率能突破1000亿美金的实际营收体量，这其实是一个很大的体量了。\n2）之前这里\n互联网的商业化就是这样，一旦被验证后渗透率和商业化会一路提升到饱和阶段，现在看商业化应该还没到饱和阶段。\n2、跟2008年的对比\n2006年下半年美国房价见顶，2007 年 4月2日，美国第二大房地产抵押贷款机构新世纪金融申请破产，整个二三季度美国一大半抵押贷款机构破产，07年8 月，美国浮息房贷的严重拖欠率已接近 20%，同月法国巴黎银行三只基金暂停赎回，9月英国北岩银行破产，花旗、瑞信等披露在次贷上巨额亏损。次贷证券的买家也在借短钱，资产一旦难估值，资金方不肯续作，持有人只能补抵押品或卖资产，家庭月供的缺口就这样传到了原本指望随时能赎回的投资者。底层资产价格崩溃开始一步步往上层传导、几乎止不住的踩踏。2007年10月美股触顶，大盘开始了长达一年半腰斩一路。\n这里核心07年初开始，房贷已经大面积开始违约。\n当下的状态是企业的债务、采购承诺、租赁合约、担保整体规模确实很大；11月13号的美联储报告也有提到。但周期都很长。采购承诺、租约、担保都是五年起步持续十几年的周期，并不是立马就兑现。举几个例子：\n1）Meta有2,789.9亿美元尚未起租的租约，2026年余下时间至2036年陆续开始，租约基二三十年，最长30年。\n2）谷歌披露 披露一年期以上的未来固定或担保承诺为7,070亿美元，绝大部分是长期供应协议。能源协议期限为2–26年，最远至2054年。\n3）再如英伟达\n本周三季度财报披露的 5,180亿美元未来承诺，数据截至10月25日。公司另列 320亿美元算力云商协议和 1,180亿美元担保敞口。这里需要说明320亿美元买的是满足条件后才开始计算。\n其中3900多亿美金都是的采购承诺其中2700亿美金是未来一年半的采购承诺，看着很可大。但实际上按照英伟达现在的业务体量、他确实需要这么大的采购量。今年英伟达大概有4200亿美金营收、74%的毛利、那么成本至少就是1100亿美金这都是采购成本。英伟达官方预计下一年75%的增速，如果毛利保持不变、意味着下一年采购成本就到了1900亿美金。\n而给OpenAI／SB Energy 担保的俄亥俄州项目，首批预计到2028年才生效。本周代理ceo也说只有当数据中心的土地、电力和外壳等基础设施真正就绪时，担保才会生效。\n4）美联储报告里先进计算相关公司债务累计1.1万亿美金，规模确实很大但是期限也很长。\n富时罗素统计过几家美国云巨头172 只面值合计 4,230.2 亿美元债券，平均本金回收年限是 17.27 年。 微软最长平均 22.69 年；大家最担心的甲骨文债务期限最短平均 15.70 年。\n说到这点能说明什么？\n2007年美国房贷已经大面积违约，违约层层传导到了房贷、次贷以及各种基于抵达贷款通过搭积木形成的各类金融衍生品上。\n而当下至少我们并没有看到哪一家大云厂商、新云厂商、大科技开始实质性的违约，美联储金融稳定报告也是在提前做预防，以防AI收入不及预期会如何影响金融稳定；\n其实市场跟美联储一样、都是把未来潜在的风险提前拿来计价。\n当然同一个数据，不同的人看到的反应也不一样。\n正面反应：这些债务、采购承诺、租赁合约、融资担保，要么期限很长、要么还没开始生效；\n负面反应：这么大的融资体量、生态担保，一旦商业化不及预期一定会爆一个大的。\n所以整体上来看，\n部分半导体上半年抛物线形态、但基本面商业化趋势远远好于2000年时期。\n虽然整体债务、承诺担保规模庞大，但是周期很长、然后也没实质性违约。达不到2008年、可能也就05年。而且未来如果商业化继续加速、商业化增速超过资本开支增速、这种潜在风险回比消除很多。\n所以当下是这对债务风险和28年开支断崖的担心，然后中选后政治生态剧变带动政策逆转的强烈担心，导致集中仓位出清。\n但就此照搬零零年和零八年也并不准确。\n短期看仓位出清程度，\n还是引用推文聊的中长期看：\n1）油价/通胀走势决定联储利率走向；\n2）新政治生态下AI政策比当下市场预期的要更收紧和会略缓和些；\n3）AI商业化是不是继续处于加速状态；","en":"现在是2000年还 38点），深成指上涨2.4%，沪市单日成交额从840亿放量至1240亿，增幅超47%，短期情绪和流动性提振非常直接。\n但拉长来看，2012年A股正处于持续下行周期中。降费带来的反弹是脉冲式的，指数在短暂冲高后继续沿原有趋势运行。同年7月第二次降费宣布后的次一交易日，沪指反而大跌1.74%，深成指跌2.57%；9月第三次降费当日，两市双双下挫。同一工具在四个月内用了三次，边际效力递减极为明显。\n② 2023年8月：政策合力下的“一日游”‼️\n2023年8月的降费并非孤立事件，而是与印花税减半、收紧IPO与减持等政策同日落地，形成了A股历史上罕见的“组合拳”。8月28日开盘三大指数集体大幅高开，但随后均显著回落，形成典型的“高开低走”走势。\n关键数据对比：2012年降费消息次日主要指数涨幅约2%，而2023年同样类型的消息次日涨幅仅约1%，同样幅度的工具，在十余年后撬动的短期情绪弹性已经明显衰减。\n③ 广义降费工具的历史规律\n如果将印花税、过户费等更广泛的“交易成本类工具”纳入观察，规律同样成立：2000年后四次下调印花税，当日或次日上证指数均出现明显上涨（2008年4月次日涨9.29%），但多数案例中，1到2个月后市场即回归原有运行轨迹，1998、2001、2005年均在印花税调整后2个月内重新转入下跌。兴业证券复盘三次过户费下调也显示，短期（当天至后7个交易日）涨跌幅均值为正，但并未改变中期方向。","en":"📊 历史降费政策后 具体结果与后续走势\n① ‼️2012年：短期脉冲显著，但未能扭转下行趋势\n2012年4月30日消息发布后首个交易日（5月2日），沪指上涨1.76%（2396→2438点），深成指上涨2.4%，沪市单日成交额从840亿放量至1240亿，增幅超47%，短期情绪和流动性提振非常直接。\n但拉长来看，2012年A股正处于持续下行周期中。降费带来的反弹是脉冲式的，指数在短暂冲高后继续沿原有趋势运行。同年7月第二次降费宣布后的次一交易日，沪指反而大跌1.74%，深成指跌2.57%；9月第三次降费当日，两市双双下挫。同一工具在四个月内用了三次，边际效力递减极为明显。\n② 2023年8月：政策合力下的“一日游”‼️\n2023年8月的降费并非孤立事件，而是与印花税减半、收紧IPO与减持等政策同日落地，形成了A股历史上罕见的“组合拳”。8月28日开盘三大指数集体大幅高开，但随后均显著回落，形成典型的“高开低走”走势。\n关键数据对比：2012年降费消息次日主要指数涨幅约2%，而2023年同样类型的消息次日涨幅仅约1%，同样幅度的工具，在十余年后撬动的短期情绪弹性已经明显衰减。\n③ 广义降费工具的历史规律\n如果将印花税、过户费等更广泛的“交易成本类工具”纳入观察，规律同样成立：2000年后四次下调印花税，当日或次日上证指数均出现明显上涨（2008年4月次日涨9.29%），但多数案例中，1到2个月后市场即回归原有运行轨迹，1998、2001、2005年均在印花税调整后2个月内重新转入下跌。兴业证券复盘三次过户费下调也显示，短期（当天至后7个交易日）涨跌幅均值为正，但并未改变中期方向。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2124468949333028870","l":[],"ln":[],"t":["A股港股"],"lk":1,"rt":1,"rp":0,"vw":1299},{"id":"2124468664841949371","h":"dmjk001","ts":1795347775,"zh":"将这次降费与历史操作对照，结论比较清晰：A股历史上类似的“交易所降费”并不罕见，但其效果呈现出高度一致的规律——\n【1】短期有效，\n【2】中期分化，\n【3】长期几乎无法单凭自身改变市场趋势。\n---\n📜 历史上几次可比的“降费”操作\n与你提到的措施最直接可比的，是2025年12月沪深交易所推出的2026年度降费方案，两者在工具类型和覆盖范围上几乎同构：都包含免收上市费、减免交易单元使用费、免收债券（不含可转债）交易经手费等项目，2026年度方案合计让利超19亿元（上交所约11.13亿，深交所超8亿）。你提到的措施本质上是这套“年度降费套餐”的延续和扩展，而非全新的工具。\n往前追溯，更具指标意义的是2012年和2023年两次涉及交易经手费的直接下调：\n· 2012年4月：沪深交易所联合中证登宣布下调A股交易相关收费标准，整体降幅25%，年度让利约30亿元，自6月1日起实施。同年9月经手费再次下调20%。\n· 2023年8月：沪深交易所将A股、B股交易经手费从0.00487%下调30%至0.00341%，北交所同步加码降幅50%，自8月28日起实施；同一窗口还叠加了印花税减半等一揽子政策。","en":"将这次降费与历史操作对照，结论比较清晰：A股历史上类似的“交易所降费”并不罕见，但其效果呈现出高度一致的规律——\n【1】短期有效，\n【2】中期分化，\n【3】长期几乎无法单凭自身改变市场趋势。\n---\n📜 历史上几次可比的“降费”操作\n与你提到的措施最直接可比的，是2025年12月沪深交易所推出的2026年度降费方案，两者在工具类型和覆盖范围上几乎同构：都包含免收上市费、减免交易单元使用费、免收债券（不含可转债）交易经手费等项目，2026年度方案合计让利超19亿元（上交所约11.13亿，深交所超8亿）。你提到的措施本质上是这套“年度降费套餐”的延续和扩展，而非全新的工具。\n往前追溯，更具指标意义的是2012年和2023年两次涉及交易经手费的直接下调：\n· 2012年4月：沪深交易所联合中证登宣布下调A股交易相关收费标准，整体降幅25%，年度让利约30亿元，自6月1日起实施。同年9月经手费再次下调20%。\n· 2023年8月：沪深交易所将A股、B股交易经手费从0.00487%下调30%至0.00341%，北交所同步加码降幅50%，自8月28日起实施；同一窗口还叠加了印花税减半等一揽子政策。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2124468664841949371","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1274},{"id":"2124468137928413656","h":"hanking66","ts":1795347649,"zh":"完蛋了，过了一个周末我又乐观了😅\nBuy the dip，长期持有，Discord在个人资料。","en":"完蛋了，过了一个周末我又乐观了😅\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2124468137928413656","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":348},{"id":"2124467339718807950","h":"dmjk001","ts":1795347459,"zh":"【浙商金融工程/陈奥林】❗#注意：3日内有望V型反转\n核心观点：市场在上周四已经触发流动性抛售信号，按历史经验测算，此处持仓20天，胜率80%以上。考虑到本轮雪球敲入及两融平仓压力等问题，#我们预计在下周后半周有望看到V型反转。\n目前市场最为关心的雪球敲入、私募赎回、两融爆仓压力、极端恐慌抛售场景交易策略和GJD交易行为可以重点交流。\n具体感兴趣的欢迎私信[玫瑰]\n☎️浙商金工首席 陈奥林","en":"【浙商金融工程/陈奥林】❗#注意：3日内有望V型反转\n核心观点：市场在上周四已经触发流动性抛售信号，按历史经验测算，此处持仓20天，胜率80%以上。考虑到本轮雪球敲入及两融平仓压力等问题，#我们预计在下周后半周有望看到V型反转。\n目前市场最为关心的雪球敲入、私募赎回、两融爆仓压力、极端恐慌抛售场景交易策略和GJD交易行为可以重点交流。\n具体感兴趣的欢迎私信[玫瑰]\n☎️浙商金工首席 陈奥林","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2124467339718807950","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":327},{"id":"2124463997357314277","h":"bbcchinese","ts":1795346662,"zh":"菲律宾马尼拉郊区近日惊爆宠物火葬场丑闻，动保团体在15处弃置点挖出约170具原本应已火化的猫狗遗骸，引发大批饲主悲痛与恐慌。目前菲律宾国家调查局已对四名涉案业者提起刑事诉讼，这场风波也促使当地社会呼吁修法，填补动物虐待法未涵盖动物死后权益的漏洞。","en":"菲律宾马尼拉郊区近日惊爆宠物火葬场丑闻，动保团体在15处弃置点挖出约170具原本应已火化的猫狗遗骸，引发大批饲主悲痛与恐慌。目前菲律宾国家调查局已对四名涉案业者提起刑事诉讼，这场风波也促使当地社会呼吁修法，填补动物虐待法未涵盖动物死后权益的漏洞。","zh_src":"native", czeng","ts":1795344918,"zh":"我不看08年之前的数据，那时候还没有qe","en":"我不看08年之前的数据，那时候还没有qe","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124456684848558522","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":622},{"id":"2124455269132591370","h":"dmjk001","ts":1795344581,"zh":"18:33:34【沪深北交易所降低融资保证金比例下限至80% 自2026年11月30日起施行】财联社11月22日电，经中国证监会批准，沪深北交易所发布通知调整融资保证金比例，将投资者融资买入证券的最低保证金比例由100%调低至80%，相关规则调整自2026年11月30日起施行。\n今年1月，沪深北交易所根据当时的市场形势，将融资保证金比例由80%调高至100%，对于缓解杠杆风险顺周期累积、促进投资者理性交易起到了积极作用。近期，融资交易活跃度明显下降，整体杠杆水平不高，根据法定的逆周期调节安排，适当降低融资保证金比例，有助于适度提高杠杆比例、释放融资空间、提升市场流动性，促进市场长期稳定健康发展。对于本次调整前尚未了结的融资合约，证券公司可以按照修改后的规定计算投资者的保证金可用余额，进一步盘活存量资金。\n此外，本次通知要求证券公司加强投资者融资融券交易行为管理，对存在异常交易行为的投资者从严适用保证金比例、可充抵保证金证券折算率等风险控制指标，审慎把控授信额度、交易费率等，情节严重的，必要时可依法采取限制、暂停或终止向其提供融资融券交易服务、不予展期等措施。前述要求旨在防范部分投资者利用两融工具过度投机和异常交易，有利于维护市场交易秩序，助力市场健康稳定运行，切实保护投资者合法权益。","en":"18:33:34【沪深北交易所降低融资保证金比例下限至80% 自2026年11月30日起施行】财联社11月22日电，经中国证监会批准，沪深北交易所发布通知调整融资保证金比例，将投资者融资买入证券的最低保证金比例由100%调低至80%，相关规则调整自2026年11月30日起施行。\n今年1月，沪深北交易所根据当时的市场形势，将融资保证金比例由80%调高至100%，对于缓解杠杆风险顺周期累积、促进投资者理性交易起到了积极作用。近期，融资交易活跃度明显下降，整体杠杆水平不高，根据法定的逆周期调节安排，适当降低融资保证金比例，有助于适度提高杠杆比例、释放融资空间、提升市场流动性，促进市场长期稳定健康发展。对于本次调整前尚未了结的融资合约，证券公司可以按照修改后的规定计算投资者的保证金可用余额，进一步盘活存量资金。\n此外，本次通知要求证券公司加强投资者融资融券交易行为管理，对存在异常交易行为的投资者从严适用保证金比例、可充抵保证金证券折算率等风险控制指标，审慎把控授信额度、交易费率等，情节严重的，必要时可依法采取限制、暂停或终止向其提供融资融券交易服务、不予展期等措施。前述要求旨在防范部分投资者利用两融工具过度投机和异常交易，有利于维护市场交易秩序，助力市场健康稳定运行，切实保护投资者合法权益。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2124455269132591370","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1227},{"id":"2124452354250428870","h":"bbcchinese","ts":1795343886,"zh":"威尔斯王妃凯特在即将播出的BBC纪录片《疗愈》（Heal）中，深入分享自己的抗癌与康复历程，坦言“癌症确实会改变你”，并强调疗愈是一段需要家人与他人陪伴的旅程。这部高度私人的影片将于11月29日播出，收录她完成“三峰挑战”及与家人互动的新画面。","en":"威尔斯王妃凯特在即将播出的BBC纪录片《疗愈》（Heal）中，深入分享自己的抗癌与康复历程，坦言“癌症确实会改变你”，并强调疗愈是一段需要家人与他人陪伴的旅程。这部高度私人的影片将于11月29日播出，收录她完成“三峰挑战”及与家人互动的新画面。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2124452354250428870","l":["bbc.in"],"ln":[{"u":"https:// 的人，就是不适合现代社会生活的人，但今天我想逼逼两句。\nX上其实有一个特别典型的现象，就是每次行情不好，或者大跌了，总会有一帮KOL把之前喊多的博主挂出来鞭尸，然后博取流量；\n之前喊多的博主流量越高，他们越挂，如果能反驳他们两句，那就更兴奋了，流量人血馒头吃的不亦乐乎，仿佛把别人踩在脚下，就能证明他们厉害，他们对，他们牛......\n回头再翻一翻他们的X，拿比特币举例，57000-87000上涨波，要么在做空，要么一点没做，稍微好点的，中间吃了个10%-20%的涨幅（那就够骄傲一辈子了，美其名曰，我只做我自己能够看懂的行情）；\n说的更都是一些模棱两可的话，反正将来无论涨跌，他都会说，嗯，这种情况：“我早说了吧！”，挂人者先防人挂，说话滴水不漏，但是我想问，有用吗？\n交易是一个很复杂的事情，有关认知、有关水平、最重要的是关乎人性。\n就拿这波我自己的币圈操作举例：\n比特币从57开始反弹以来，我基本吃满了57-87这整个上涨。\n昨天还和社区的小伙伴讲：想要赌趋势，如果做现货，确定起涨点被破坏了、确定趋势没了之后再跑，是没有问题的；既然是赌趋势，趋势不成立，盈利大幅度回撤那就是要承受的后果；\n还记得2026年2-5月那波反弹吗？比特币数次跌回上轮上涨的斐波那契0.786，然后又拉回，这波市场的难度，就是这个样子的。\n我的问题，出在人性的贪，加了杠杆；出在菜，不够敏感，没有分析明白美国那边问题的严重性，还心存侥幸；但是，不管赚，还是赔，我认为这都是交易的一部分。\n再回头看，现在这帮人，没有赔，好像很牛逼的样子；\n那有几个是真正的就提前意识到了危机？\n有几个是做完了一轮上涨后全身而退？\n那如果是你本来就没在车上，你当然不会赔，因为你也不曾赚过啊？\n那现在你又凭什么来踩这些看多的博主来博取流量呢？\n人品真的是差极了！\n这种，不管是引用的，还是转发的，还是回复的，今后，看到一个，拉黑一个。","en":"我，用抖音上的话讲，应该就属于那种毫无攻击性的人，就是不适合现代社会生活的人，但今天我想逼逼两句。\nX上其实有一个特别典型的现象，就是每次行情不好，或者大跌了，总会有一帮KOL把之前喊多的博主挂出来鞭尸，然后博取流量；\n之前喊多的博主流量越高，他们越挂，如果能反驳他们两句，那就更兴奋了，流量人血馒头吃的不亦乐乎，仿佛把别人踩在脚下，就能证明他们厉害，他们对，他们牛......\n回头再翻一翻他们的X，拿比特币举例，57000-87000上涨波，要么在做空，要么一点没做，稍微好点的，中间吃了个10%-20%的涨幅（那就够骄傲一辈子了，美其名曰，我只做我自己能够看懂的行情）；\n说的更都是一些模棱两可的话，反正将来无论涨跌，他都会说，嗯，这种情况：“我早说了吧！”，挂人者先防人挂，说话滴水不漏，但是我想问，有用吗？\n交易是一个很复杂的事情，有关认知、有关水平、最重要的是关乎人性。\n就拿这波我自己的币圈操作举例：\n比特币从57开始反弹以来，我基本吃满了57-87这整个上涨。\n昨天还和社区的小伙伴讲：想要赌趋势，如果做现货，确定起涨点被破坏了、确定趋势没了之后再跑，是没有问题的；既然是赌趋势，趋势不成立，盈利大幅度回撤那就是要承受的后果；\n还记得2026年2-5月那波反弹吗？比特币数次跌回上轮上涨的斐波那契0.786，然后又拉回，这波市场的难度，就是这个样子的。\n我的问题，出在人性的贪，加了杠杆；出在菜，不够敏感，没有分析明白美国那边问题的严重性，还心存侥幸；但是，不管赚，还是赔，我认为这都是交易的一部分。\n再回头看，现在这帮人，没有赔，好像很牛逼的样子；\n那有几个是真正的就提前意识到了危机？\n有几个是做完了一轮上涨后全身而退？\n那如果是你本来就没在车上，你当然不会赔，因为你也不曾赚过啊？\n那现在你又凭什么来踩这些看多的博主来博取流量呢？\n人品真的是差极了！\n这种，不管是引用的，还是转发的，还是回复的，今后，看到一个，拉黑一个。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Guilin_Chen_/status/2124431117256409595","l":[],"ln":[],"t":[],"lk":23,"rt":2,"rp":9,"vw":2672},{"id":"2124428215913705777","h":"bboczeng","ts":1795338131,"zh":"不知不觉，NVDA竟然跌回了我当时赌他跌不破120的位置\n诶，太惨了。。。","en":"不知不觉，NVDA竟然跌回了我当时赌他跌不破120的位置\n诶，太惨了。。。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124428215913705777","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":2,"vw":651},{"id":"2124425395839664467","h":"qinbafrank","ts":1795337458,"zh":"老马今天发帖强调AI算力部署、冷却和可靠运行的实际困难，以及明年行业现金流压力巨大，目标直指NeoCloud厂商，感觉他又想打扫战场了。SpaceX三季度末1.7GW算力，年底能到2.5GW，正在建设中明年能投产算力还有1GW，明年至少3.5GW算力在手。SpaceX明年重头戏是亚利桑那州Cochise County项目6GW，现在亚利桑那州州长、联邦参议员、州两院都是民主党掌控，变数还很大。但3.5GW已建成算力规模已经不小了，这让老马底气十足。","en":"老马今天发帖强调AI算力部署、冷却和可靠运行的实际困难，以及明年行业现金流压力巨大，目标直指NeoCloud厂商，感觉他又想打扫战场了。SpaceX三季度末1.7GW算力，年底能到2.5GW，正在建设中明年能投产算力还有1GW，明年至少3.5GW算力在手。SpaceX明年重头戏是亚利桑那州Cochise County项目6GW，现在亚利桑那州州长、联邦参议员、州两院都是民主党掌控，变数还很大。但3.5GW已建成算力规模已经不小了，这让老马底气十足。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXt5MrYasAEWXO3.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2124425395839664467","l":[],"ln":[],"t":["AI科技"],"lk":15,"rt":1,"rp":8,"vw":3608},{"id":"2124424554378670245","h":"bboczeng","ts":1795337258,"zh":"我语文作文的成绩是最差的，这也直接导致我高考和清华无缘，毕竟我有物理竞赛20分的加分。\n但问题是，写作文和写作其实是两回事\n首先，写作是自己的真情所发，真情所感，目的是表达自己的思想、立场，而且还可以反复修改，直到让自己满意，可以不断学习，精进自己的思维，这和命题作文很不同\n命题作文之所以痛苦，\n一个是他的题目是别人限定的，自己那么小，根本没有阅历怎么写，最后都是胡编乱造，死记硬背，乱用典故\n第二是作文有时间限制，30分钟写不好东西\n第三是作文写好之后基本上无法修改。我现在写作的方法都是要写两遍，第一遍写idea，第二遍把它们整理一下，最后还有一遍就精读，细细修改\n我算是领悟到鲁迅的感受了，每一个字都可以反复斟酌反复修改，永远改不完。\n我当时觉得他有病，现在觉得文章是自己的孩子，修改好了，自己也觉得开心\n这也是为什么我的帖子修改次数比别人多很多的原因，每次读都觉得有什么地方可以改进\n直到最后改无可改，遣词造句，句句珠玑，成为经典\n谢谢大家","en":"我语文作文的成绩是最差的，这也直接导致我高考和清华无缘，毕竟我有物理竞赛20分的加分。\n但问题是，写作文和写作其实是两回事\n首先，写作是自己的真情所发，真情所感，目的是表达自己的思想、立场，而且还可以反复修改，直到让自己满意，可以不断学习，精进自己的思维，这和命题作文很不同\n命题作文之所以痛苦，\n一个是他的题目是别人限定的，自己那么小，根本没有阅历怎么写，最后都是胡编乱造，死记硬背，乱用典故\n第二是作文有时间限制，30分钟写不好东西\n第三是作文写好之后基本上无法修改。我现在写作的方法都是要写两遍，第一遍写idea，第二遍把它们整理一下，最后还有一遍就精读，细细修改\n我算是领悟到鲁迅的感受了，每一个字都可以反复斟酌反复修改，永远改不完。\n我当时觉得他有病，现在觉得文章是自己的孩子，修改好了，自己也觉得开心\n这也是为什么我的帖子修改次数比别人多很多的原因，每次读都觉得有什么地方可以改进\n直到最后改无可改，遣词造句，句句珠玑，成为经典\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124424554378670245","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":1032},{"id":"2124424075552739466","h":"Balder13946731 份，我判断美联储一定会加息，而且加息的原因其实是AI的时候，我说了这么一句话：\n“淹死的都是会水的“\n指的当然是那些自以为是的多头，从来没有为一次大崩盘做过任何准备\n结果你猜怎么着，咱们的大聪明说“一群自己都不会游泳的人，在指点水池太深要淹死人”\n还嘲讽说“珍惜身边情绪化的人”，暗示我们很情绪化，\n还说我们都是优质指标，要大家我们的名字都记下来\n然后今天他又说“谁能想到呢？”\n是啊，谁能想到呢？谁能想到您不但毫无任何专业知识，还这么喜欢装逼，甚至内心和一个太监小人一样，天天阴阳怪气，明里暗里怂恿自己的粉丝，去网暴空头呢？\n请问截止2026年11月20日本周五，咱们的Herman Jin太监老师，您淹死了吗？\n您还没淹死吗？？\n还有这样的奇观，那我觉得我们确实需要把他这样的人好好捧一捧，然后把名字好好记下\n大家记下来了吗？\n我来帮大家记一下：Herman Jin，毕业于名校Univeristy of WaterLoo，在高盛最末端亚洲FICC干了20年，转行网络小说写手和香港Family Office，因为误判FOMC和“抄底”半导体AI小盘股，大概率年底即将被合伙人开除的\n金尚浩先生？\n判断错误都是正常的，我也经常看错。但你的问题是错误吗？你的问题难道不是您随时随地阴阳怪气的嘲笑他人，同时散发出阵阵恶臭的无耻人品？\n你难道真的都没有勇气，为自己曾经道貌岸然之下的自大和狂妄无知\n道歉吗？\n谢谢大家\n😅😅😅","en":"我记得之前在10月份，我判断美联储一定会加息，而且加息的原因其实是AI的时候，我说了这么一句话：\n“淹死的都是会水的“\n指的当然是那些自以为是的多头，从来没有为一次大崩盘做过任何准备\n结果你猜怎么着，咱们的大聪明说“一群自己都不会游泳的人，在指点水池太深要淹死人”\n还嘲讽说“珍惜身边情绪化的人”，暗示我们很情绪化，\n还说我们都是优质指标，要大家我们的名字都记下来\n然后今天他又说“谁能想到呢？”\n是啊，谁能想到呢？谁能想到您不但毫无任何专业知识，还这么喜欢装逼，甚至内心和一个太监小人一样，天天阴阳怪气，明里暗里怂恿自己的粉丝，去网暴空头呢？\n请问截止2026年11月20日本周五，咱们的Herman Jin太监老师，您淹死了吗？\n您还没淹死吗？？\n还有这样的奇观，那我觉得我们确实需要把他这样的人好好捧一捧，然后把名字好好记下\n大家记下来了吗？\n我来帮大家记一下：Herman Jin，毕业于名校Univeristy of WaterLoo，在高盛最末端亚洲FICC干了20年，转行网络小说写手和香港Family Office，因为误判FOMC和“抄底”半导体AI小盘股，大概率年底即将被合伙人开除的\n金尚浩先生？\n判断错误都是正常的，我也经常看错。但你的问题是错误吗？你的问题难道不是您随时随地阴阳怪气的嘲笑他人，同时散发出阵阵恶臭的无耻人品？\n你难道真的都没有勇气，为自己曾经道貌岸然之下的自大和狂妄无知\n道歉吗？\n谢谢大家\n😅😅😅","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXsp6RyawAErrTm.jpg?name=orig","https://pbs.twimg.com/media/HXsp8KraAAACD1c.jpg?name=orig","https://pbs.twimg.com/media/HXsqCRFaEAADIEV.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2124339278620803142","l":[],"ln":[],"t":["美联储","AI科技"],"lk":5,"rt":0,"rp":3,"vw":681},{"id":"2124337203690291419","h":"ShanghaoJin","ts":1795316432,"zh":"不是，写这段背是：\n国家承平，支持与袁世凯合作的宋教仁，被孙文亲信—陈美琪的小弟—应桂馨找杀手暗杀了宋\n当时上海地方审判厅已经传唤了国务院总理赵秉钧，某人拒绝司法途径悍然发动二次革命\n失败后向日本摇尾乞怜，请刚重新组阁的日本首相大隈重信支持革命党推翻袁政府，并提出以开放中国市场、让日本工商界受益作为回报","en":"不是，写这段背是：\n国家承平，支持与袁世凯合作的宋教仁，被孙文亲信—陈美琪的小弟—应桂馨找杀手暗杀了宋\n当时上海地方审判厅已经传唤了国务院总理赵秉钧，某人拒绝司法途径悍然发动二次革命\n失败后向日本摇尾乞怜，请刚重新组阁的日本首相大隈重信支持革命党推翻袁政府，并提出以开放中国市场、让日本工商界受益作为回报 869376","l":[],"ln":[],"t":[],"lk":16,"rt":1,"rp":4,"vw":2376},{"id":"2124325512134983819","h":"dmjk001","ts":1795313644,"zh":"险资专家交流：减仓接近尾声\nQ：现在险资权益、固收配置大致是什么水平，这一轮减仓节奏和现状如何？\nA：头部保险公司权益配置比例大概在20%左右，做得激进的能接近30%，中小险企普遍落在15%上下，固收类资产占比处在50%到70%区间，国寿这类大体量公司集中在50%到60%，其余不少公司可以到70%。往年险资一般11、12月兑现年度收益，去年提前到10月底，今年更进一步，9月底就有大公司开始卖出。10月初到11月中旬大中型险企持续减仓，部分标的流动性不足只能走大宗交易，监管也提醒过相关机构收敛交易节奏，目前这一轮减仓动作基本结束，账面现金充裕，大家都在等待明确信号才会考虑补仓，暂时没有统一加仓动作。\nQ：险资权益仓位内部结构有差异吗，不同账户持仓风格有什么不一样？\nA：权益仓位内部的分化其实非常明显，不能只看整体权益比例去判断风险，以公允价值计量、波动直接冲击利润表的 TPL 也就是 FV­T­PL 账户，交易型股票持仓在快速收缩，这部分是愿意承担波动的资金，已经在持续变少。而用 OCI 计量的高股息资产，是这一轮行情里险资坚定持有的部分，相当于组合里面的压舱石，重心放在稳定收息上面。也就是说账面上看着还有两成左右权益仓位，但真正暴露在短期股价波动里的资金体量已经大幅缩水，很多外部投资者只看整体权益占比，很容易高估险资实际承担的权益波动风险。\nQ：为什么险资会集中清仓科技成长股，是不看好板块基本面吗？\nA：并不是机构对科技板块基本面观点发生转向，核心是险资内部一套刚性止损纪律在发挥作用，这是一个偏机械的风控机制。保险公司做权益投资大多设置回撤红线，常规的控制区间在20%到30%之间，一旦回撤超过30%，基本就要执行强制清仓，没有太多商量余地；如果投资经理坚持认为持仓值得保留，必须提交专项报告，最后由管理层审批拍板。今年4、5月不少险企选择加仓科技成长股，紧接着7、8月市场出现剧烈调整，很多持仓直接打穿止损线，触发一连串被动卖出，这类资金在下跌过程里没法接盘，反而持续砍仓，也是科技板块调整阶段很容易被忽略的资金面因素。\nQ：险资如果想重新布局科技股，是不是很快就能进场形成增量资金？\nA：短期很难指望险资重新成为科技成长板块的增量资金来源，风控流程和投资约束摆在前面。就算后续市场企稳，想要再度买入这类资产，首先要出现足够明确的企稳信号，同时还要重新走完内部完整的投资审批流程，不是市场稍微反弹就能直接买回。险资这套止损机制是硬性要求，经历过这一轮击穿止损线强制卖出之后，机构对于科技成长风格的风险偏好明显压低，在没有充分论证、走完内部决策流程之前，不会轻易恢复配置，所以不能简单预设科技反弹的时候险资会回来托底。\nQ：险资减仓的时候，会不会优先赎回委外公募，保留自营仓位？\nA：市场流传过一种说法，险资集中减仓阶段，会优先赎回公募委外产品，保住自营持仓，这个说法并不成立。自营盘和委外资金之间不存在赎回优先级，两边标准完全一视同仁，判断要不要卖出或者赎回，核心看标的本身业绩表现，以及距离内部止损线的远近，谁先触及风控条件、业绩不及预期，就优先处理谁，不会因为是自营就天然保留，也不会因为是外部委外就提前一刀切赎回，风控规则对两类资金统一适用。","en":"险资专家交流：减仓接近尾声\nQ：现在险资权益、固收配置大致是什么水平，这一轮减仓节奏和现状如何？\nA：头部保险公司权益配置比例大概在20%左右，做得激进的能接近30%，中小险企普遍落在15%上下，固收类资产占比处在50%到70%区间，国寿这类大体量公司集中在50%到60%，其余不少公司可以到70%。往年险资一般11、12月兑现年度收益，去年提前到10月底，今年更进一步，9月底就有大公司开始卖出。10月初到11月中旬大中型险企持续减仓，部分标的流动性不足只能走大宗交易，监管也提醒过相关机构收敛交易节奏，目前这一轮减仓动作基本结束，账面现金充裕，大家都在等待明确信号才会考虑补仓，暂时没有统一加仓动作。\nQ：险资权益仓位内部结构有差异吗，不同账户持仓风格有什么不一样？\nA：权益仓位内部的分化其实非常明显，不能只看整体权益比例去判断风险，以公允价值计量、波动直接冲击利润表的 TPL 也就是 FV­T­PL 账户，交易型股票持仓在快速收缩，这部分是愿意承担波动的资金，已经在持续变少。而用 OCI 计量的高股息资产，是这一轮行情里险资坚定持有的部分，相当于组合里面的压舱石，重心放在稳定收息上面。也就是说账面上看着还有两成左右权 仓。对A股黄金、有色、外资敏感型成长股都偏负面。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"其中16家拟回购金额不低于1亿元。为什么重要：弱市里上市公司愿意拿出真金白银，说明部分产业资本认为价格已经有安全垫。制约：通威这一笔的用途首先是激励，不是立即注销增厚每股收益，邮件写成“注销式回购”不准确；光伏景气仍弱，回购托得住预期，托不住基本面继续下行。\n三大利空方向（由强到弱） 一、全球AI交易出清，又叠加上治理和会计层面的信任折扣。路透社的会计调查报道是本档相对早间最重要的增量。高盛称英伟达较10月6日高点回落近一半；穆迪展望调至稳定、美国对先进芯片远程使用收紧，早间已核实。Anthropic次日收88.30美元，较首日收盘97.17美元回吐，高盛交易台认为这次上市没能成为“风险重新打开”的清理事件。彭博社还称，新加坡数据中心商DayOne考虑搁置或缩小原计划最高约50亿美元的美国上市。对谁不利：A股CPO、光模块、封测、服务器代工，以及一切还在用“AI资本开支只会多不会少”定价的高位票。制约：盘后反弹说明有人在捡便宜，但反弹要先看美股周一能否站稳，而不是A股周五尾盘的银行。\n二、A股内部亏钱效应还在，交投热度的真实方向是降温而不是升温。周五上涨约313只、下跌约5236只，创业板跌3.54%，科创综指跌5.23%，指数被权重修好、多数股票没有被修好，这个判断不用改。新的是10月印花税和成交：当月全部A股成交27.37万亿元、日均1.61万亿元，同比下滑约25.5%，日均成交已连续四个月下滑；10月末两融余额2.34万亿元，同比下降6.02%、环比下降8.95%。对券商经纪和两融利息，这是四季度的压力，不是上半年高增的惯性。欢瑞世纪因2022年年报虚增利润，将于11月23日停牌、24日复牌并简称“ST欢瑞”，监管样本还在。制约：局部题材（PCB、算力租赁、农业）仍有板，但那是退潮期接力，不是广度修复。\n三、大宗商品和加密同步去杠杆，趋势策略还在卖。已核实：COMEX期铜当周跌9.91%，结算5.4770美元/磅；邮件把“纽铜跌近10%”写成周五当天，不准确，周五本身大约跌2%出头。WTI 12月合约周五结算83.98美元，当日小涨，但当周跌5.17%，连续第三周下跌；邮件里“全周跌约20%”或“三周大跌两成”不能直接当成当周跌幅。黄金周五大跌、比特币跌破5.7万美元、创2024年9月以来低点，CoinDesk在周六的报道里仍给出约56303美元附近的报价，并称过去24小时加密衍生品清算约24.0亿美元。这不是经典避险，而是杠杆出清。CTA的机械卖盘意味着，美股即便周一反弹，也可能继续碰到程序化减仓。对A股黄金、有色、外资敏感型成长股都偏负面。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124310999239204939","l":[],"ln":[],"t":["美股","A股港股","AI科技","黄金"],"lk":1,"rt":0,"rp":0,"vw":202},{"id":"2124310994298314939","h":"cnfinancewatch","ts":1795310183,"zh":"热点财经新闻综述｜2026-11-21·午间\n数据时点：A股、港股、日经225、韩国KOSPI与台股仍为11月20日（周五）收盘；美股为美东11月20日常规交易收盘，英伟达盘后补充至同日延长时段；黄金、原油、铜、比特币等补充至周五结算或周六白天可见的公开报价；本档截稿约北京时间11月21日13:40。今天是周六，沪深港休市，美股要到周一晚再开。本期新处理两封热点财经邮件：11月21日早间08:10版（位于垃圾邮件，早间档截稿时未到）与午间13:10版（收件箱）。凡标“邮件转述”的内容未逐条核实；与早间综述重复且已核实的收盘数字不再改写。早间与午间邮件里有几处把周跌写成日跌、把成交或周度净流入写成“一天抄底”，下文以公开报道为准。\n今日判断 对客户来说，午间需要补上的不是新的指数，而是两件会改变周一开盘权重的事。第一件，路透社周五报道，两名知情人士称美国证交会正在调查英伟达的会计处理；《华尔街日报》本周早些时候已报道存在调查，但当时未确认焦点。调查本身不等于认定违规，证交会和公司均未就细节置评。加州司法部对英伟达发出调查传票，是另一条线，不能和证交会会计调查写成同一件事。英伟达周五常规交易收跌14.01%报125.53美元，延长交易反弹至130.01美元，较收盘涨3.57%。邮件里“暗盘跌超7%”与公开盘后走势不符，本档不用。第二件，财政部1至10月证券交易印花税2511亿元、同比增长54.1%，早间综述把它当作国内交投仍活跃的背景；财联社今天上午拆出10月单月只有120亿元，同比下滑33.7%、环比减少48.05%，为年内最低、也是近两年次低，仅高于2025年6月的117亿元。累计高增和单月失速可以同时成立，但能解释周五量增价跌的，显然不是“印花税还在高增”这一句话。\n外部定价没有变轻。标普500跌3.70%报6910.39点，纳斯达克综合指数跌5.28%报22617.73点并转为年内下跌，道指跌1.93%报48147.33点，已在早间综述里核实。高盛交易台提到，纳指100周五跌5.6%、当周为2020年3月以来最差；费城半导体指数有口径称周五跌10.73%、当周跌17.13%，为2001年9月以来最差单周，芯片股市值有报道称一周蒸发约2.3万亿美元。高盛恐慌指数升至10分中的9分，估计商品交易顾问（CTA）过去一个月已卖出约570亿美元股票、美股净头寸转为净空约190亿美元；未来一周若市场平盘仍可能再卖约658亿美元，续跌则可达约806亿美元，即便反弹也可能卖出约286亿美元。与此同时，配置盘在指数层面确实在买：格隆汇援引的数据显示，周五ETF整体净流入899.25亿元，其中宽基型净流入923.63亿元，嘉实沪深300ETF净流入226.51亿元、华夏上证50ETF净流入215.83亿元、华泰柏瑞沪深300ETF净流入145.83亿元；每日经济新闻援引Wind数据，本周沪深股票型与跨境型ETF合计净流入1941.71亿元，其中宽基指数ETF净流入1896亿元，行业主题ETF净流出12.85亿元，沪深300相关净流入1024亿元。上证全周跌2.77%，深证全周跌6.49%。这是周度和当日的净申购，不是“近1900亿元在周五一天抄底成功”，更不能拿50ETF与300ETF的成交额相加当净买入。\n基调不变，只是更硬一点：防守优先。银行和红利仍然是唯一有价格互证的方向；科技硬件、封测和周五已经涨停的PCB票，周一要先消化美股收盘和会计调查的缺口，不适合当成周末作业去追。\n三大利多方向（由强到弱） 一、银行高股息，加上宽基ETF本周确实有净申购，仍是最清楚的防守框。已核实的周五收盘未变：工商银行涨3.30%收9.40元，建设银行涨3.07%，中国银行涨2.72%，按前复权计多只银行股收盘价创历史新高；工商银行A股市值约2.53万亿元，重夺市值第一。财政部11月19日在香港发行20亿美元三年期主权债，利率4.821%，总认购723亿美元，为发行额的36倍，将在香港联交所上市。为什么重要：外部风险升温时，高股息和宽基是资金愿意付钱的地方；主权债超额认购说明人民币信用仍有买盘，和银行股的防御逻辑同一方向。对谁有意义：已经拿着银行、保险、红利和宽基的组合，短期内仍是压舱石。制约：净申购是事实，但指数被买和个股被修不是一回事；尾盘拉得急，银行自己也可能变成波动源；主权债再热，也代替不了周一科技股的开盘价。\n二、PCB短缺的产业逻辑还在，但价格已经把周末情绪算进去了。全球电子协会供应链警报、短缺或至少持续至2027年上半年，早间已核实。周五中京电子、超声电子等涨停，属于逆势方向。为什么重要：供给约束对订单和价格的再定价，比单纯的情绪脉冲更站得住。制约：行业协会警报不是周一的护城河。英伟达会计调查落地后，凡是还在用“AI主线没坏”定价的环节，开盘都可能先被砸一下；已经涨停的中游制造票，赔率更差。可以把上游覆铜板、电子布、树脂当作观察名单，而不是把周五涨停股写成加仓清单。\n三、产业资本在用回购表态，但力度和结构都要看清楚。已核实：11月20日晚通威股份公告，拟以不超过17.20元/股、总金额不低于10亿元且不超过20亿元回购股份，用于员工持股或股权激励，期限6个月；收盘11.11元、跌2.46%。财联社统计，当日共有27家公司披露回购计划，","en":"热点财经新闻综述｜2026-11-21·午间\n数据时点：A股、港股、日经225、韩国KOSPI与台股仍为11月20日（周五）收盘；美股为美东11月20日常规交易收盘，英伟达盘后补充至同日延长时段；黄金、原油、铜、比特币等补充至周五结算或周六白天可见的公开报价；本档截稿约北京时间11月21日13:40。今天是周六，沪深港休市，美股要到周一晚再开。本期新处理两封热点财经邮件：11月21日早间08:10版（位于垃圾邮件，早间档截稿时未到）与午间13:10版（收件箱）。凡标“邮件转述”的内容未逐条核实；与早间综述重复且已核实的收盘数字不再改写。早间与午间邮件里有几处把周跌写成日跌、把成交或周度净流入写成“一天抄底”，下文以公开报道为准。\n今日判断 对客户来说 ,"A股港股","汇率","原油能源","AI科技","黄金"],"lk":2,"rt":0,"rp":2,"vw":637},{"id":"2124310775607242865","h":"cnfinancewatch","ts":1795310131,"zh":"散户热议｜2026-11-22·早间\n数据时点：国内社区浏览截至北京时间11月22日08:00。本期直接打开了韭研公社“公社广场-最新发布”列表，引用公开可见的标题、时间和摘要；部分长文需登录或只展示节选，未能全文引用。Reddit WallStreetBets与Stocktwits留言流仍未能直接抓取。海外部分改用AltIndex对WSB过去24小时的提及统计（页面显示更新至美西11月21日15:30，约北京时间22日07:30），均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周末仍在复盘冰点，避雷帖和涨停清单还搁在同一页\n韭研公社广场上，周六夜间到周日凌晨仍在写11月20日。有人把情绪周期写成“退潮末期/冰点延续”，依据是跌停多于涨停、连续第七个交易日超4100只个股下跌、连板高度只有4板且梯队收缩。有人给出与交易所口径接近的数字：涨停28家、跌停58家、成交约1.42万亿元、最高4板。也有帖把上涨家数写成297或311、跌停写成77，和此前已核实的上涨约313、下跌约5236并不完全一致，本档仍以公开收盘统计为准，社区数字只说明讨论在围绕同一张普跌图。\n更私人的周末复盘，语气比周五盘中更沉。有帖写道“连续7天盘中拉高、午后下杀，连续5天翘尾”，把周线支撑放到3403附近、月线支撑放到3488附近，并说“7连跌，不理解，但接受”。这类技术位置是社区推测，不是已被行情验证的底部。还有人把计划写成“周末看看有没有消息发酵”，并把真视通与盛剑科技的4板争夺、超声电子和满坤科技等PCB小票的尾盘拉升，当成短线还活着的证据。\n和周六午间相同的分裂没有消失。11月21日08:55那篇“英伟达单日暴跌-14%，避雷英伟达产业链（全景梳理）”仍在被评论：有人说“以前都是香饽饽，现在反转了”，有人把避雷帖本身当成终于说实话。但广场上的复盘仍在点名中京电子、真视通、中芯国际，PCB和算力租赁并没有从讨论里撤走。和券商口径相比，方向并不反：专业框架也承认银行红利是防守框、PCB有产业逻辑，但强调涨停价已经计入周末情绪。社区的斜率更陡，而且“避雷”和“还看消息发酵”同时出现，说明并没有形成一致的风险收敛。\n被忽略的风险有三。一是把周末出现的甲骨文融资声明、比特币重回6万美元、油轮遇袭后的油价传闻，直接读成周一可以加仓科技的理由。这些消息会进入开盘定价，但不等于出清结束。二是继续把宽基ETF净申购或“近490亿抄底”当成多数股票已经被修好。三是4连板的真视通、盛剑科技，以及任何还在被写成清单的周五涨停票，周一要先过会计调查、美股收盘和台股稳定措施带来的缺口。欢瑞世纪周一停牌、周二戴ST，监管样本还在。\n海外：英伟达仍是第一话题，但24小时提及量已经从峰值回落，中性标签还在\nWallStreetBets方面（AltIndex统计，二手）：页面最后更新为美西11月21日15:30，约北京时间22日07:30。过去24小时提及最多的仍是英伟达，约1133次，情绪标中性，价格与公开收盘125.53美元、跌14.01%相符。较之周六午间那帧美西11月20日21:15的约1993次，提及量明显回落，这更像是周五讨论滑出24小时窗口，不能写成“关注度已经崩塌”。Anthropic约654次（周六午间约1202次），同样标中性，页面报价约88.96美元、跌8.5%，与公开报道的收盘88.30美元接近。其后是谷歌约202次、标看多；苹果、SpaceX、Meta等也在榜上。最看多的标签出现在谷歌，最看空的是沃尔玛（约42次），不是芯片股本身。AMD、闪迪等仍在榜上并标看多，本档只记关注度和情绪标签，不引用其未核验的价格涨跌。甲骨文约38次、标中性，说明融资声明还没有把讨论从英伟达那里抢过来。\nStocktwits方面：实时留言流仍未打开，本档不引用无法核验的情绪分数或“极度看多”一类二手概括。\n与券商口径的异同：专业框架把重点放在AI出清叠加会计调查、台股已动用稳定措施、周末反弹还要过周一开盘；散户讨论的对象没变，还是英伟达和Anthropic，二手统计给出的仍是“中性”。提及次数随窗口滑动下降，但排名没有让位。被忽略的风险是：中性标签在跌14%之后，更可能对应有人还想接飞刀，而不是情绪已经出清完毕。会计调查、承销商撤出稳定仓位、台股稳定措施，不一定会马上改写过去24小时的情绪统计，却会进入周一的开盘价。\n小结：国内散户把周末花在复盘冰点和等待消息，避雷帖和涨停清单仍在同一页；海外散户没有离开英伟达，也没有形成一致看空。两边共同的风险，都是把周五已经涨停或周末已经反弹的价格，当成周日晚上可以加仓的理由。\n风险提示：以上为公开讨论整理，二手口径已标注，不构成投资建议。","en":"散户热议｜2026-11-22·早间\n数据时点：国内社区浏览截至北京时间11月22日08:00。本期直接打开了韭研公社“公社广场-最新发布”列表，引用公开可见的标题、时间和摘要；部分长文需登录或只展示节选，未能全文引用。Reddit WallStreetBets与Stocktwits留言流仍未能直接抓取。海外部分改用AltIndex对WSB过去24小时的提及统计（页面显示更新至美西11月21日15:30，约北京时间22日07:30），均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周末仍在复盘冰点，避雷帖和涨停清单还搁在同一页\n韭研公社广场上，周六夜间到周日凌晨仍在写11月20日。有人把情绪周期写成“退潮末期/冰点延续”，依据是跌停多于涨停、连续第七个交易日超4100只个股下跌、连板高度只有4板且梯队收缩。有人给出与交易所口径接近的数字：涨停28家、跌停58家、成交约1.42万亿元、最高4板。也有帖把上涨家数写成297或311、跌停写成77，和此前已核实的上涨约313、下跌约5236并不完全一致，本档仍以公开收盘统计为准，社区数字只说明讨论在围绕同一张普跌图。\n更私人的周末复盘，语气比周五盘中更沉。有帖写道“连续7天盘中拉高、午后下杀，连续5天翘尾”，把周线支撑放到3403附近、月线支撑放到3488附近，并说“7连跌，不理解，但接受”。这类技术位置是社区推测，不是已被行情验证的底部。还有人把计划写成“周末看看有没有消息发酵”，并把真视通与盛剑科技的4板争夺、超声电子和满坤科技等PCB小票的尾盘拉升，当成短线还活着的证据。\n和周六午间相同的分裂没有消失。11月21日08:55那篇“英伟达单日暴跌-14%，避雷英伟达产业链（全景梳理）”仍在被评论：有人说“以前都是香饽饽，现在反转了”，有人把避雷帖本身当成终于说实话。但广场上的复盘仍在点名中京电子、真视通、中芯国际，PCB和算力租赁并没有从讨论里撤走。和券商口径相比，方向并不反：专业框架也承认银行红利是防守框、PCB有产业逻辑，但强调涨停价已经计入周末情绪。社区的斜率更陡，而且“避雷”和“还看消息发酵”同时出现，说明并没有形成一致的风险收敛。\n被忽略的风险有三。一是把周末出现的甲骨文融资声明、比特币重回6万美元、油轮遇袭后的油价传闻，直接读成周一可以加仓科技的理由。这些消息会进入开盘定价，但不等于出清结束。二是继续把宽基ETF净申购或“近490亿抄底”当成多数股票已经被修好。三是4连板的真视通、盛剑科技，以及任何还在被写成清单的周五涨停票，周一要先过会计调查、美股收盘和台股稳定措施带来的缺口。欢瑞世纪周一停牌、周二戴ST，监管样本还在。\n海外：英伟达仍是第一话题，但24小时提及量已经从峰值回落，中性标签还在\nWallStreetBets方面（AltIndex统计，二手）：页面最后更新为美西11月21日15:30，约北京时间22日07:30。过去24小时提及最多的仍是英伟达，约1133次，情绪标中性，价格与公开收盘125.53美元、跌14.01%相符。较之周六午间那帧美西11月20日21:15的约1993次，提及量明显回落，这更像是周五讨论滑出24小时窗口，不能写成“关注度已经崩塌”。Anthropic约654次（周六午间约1202次），同样标中性，页面报价约88.96美元、跌8.5%，与公开报道的收盘88.30美元接近。其后是谷歌约202次、标看多；苹果、SpaceX、Meta等也在榜上。最看多的标签出现在谷歌，最看空的是沃尔玛（约42次），不是芯片股本身。AMD、闪迪等仍在榜上并标看多，本档只记关注度和情绪标签，不引用其未核验的价格涨跌。甲骨文约38次、标中性，说明融资声明还没有把讨论从英伟达那里抢过来。\nStocktwits方面：实时留言流仍未打开，本档不引用无法核验的情绪分数或“极度看多”一类二手概括。\n与券商口径的异同：专业框架把重点放在AI出清叠加会计调查、台股已动用稳定措施、周末反弹还要过周一开盘；散户讨论的对象没变，还是英伟达和Anthropic，二手统计给出的仍是“中性”。提及次数随窗口滑动下降，但排名没有让位。被忽略的风险是：中性标签在跌14%之后，更可能对应有人还想接飞刀，而不是情绪已经出清完毕。会计调查、承销商撤出稳定仓位、台股稳定措施，不一定会马上改写过去24小时的情绪统计，却会进入周一的开盘价。\n小结：国内散户把周末花在复盘冰点和等待消息，避雷帖和涨停清单仍在同一页；海外散户没有离开英伟达，也没有形成一致看空。两边共同的风险，都是把周五已经涨停或周末已经反弹的价格，当成周日晚上可以加仓的理由。\n风险提示：以上为公开讨论整理，二手口径已标注，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124310775607242865","l":[],"ln":[],"t":["美股","原油能源","AI科技"],"lk":1,"rt":0,"rp":1,"vw":544},{"id":"2124309196204388663","h":"Balder13946731","ts":1795309754,"zh":"很多人说过去的数据不能说明什么，但是发生不同于过去数据的事情的概率很小，小到类似于传说。\n哪怕你再难受，目前市场的变化，依然在历史统计的概率相对大的位置，而不是到了极小的位置。\n你做出的决策是在30%-60%的位置，却不是1%，5%甚至10%的情况。","en":"很多人说过去的数据不能说明什么，但是发生不同于过去数据的事情的概率很小，小到类似于传说。\n哪怕你再难受，目前市场的变化，依然在历史统计的概率相对大的位置，而不是到了极小的位置。\n你做出的决策是在30%-60%的位置，却不是1%，5%甚至10%的情况。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2124309196204388663","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":657},{"id":"2124308335277318162","h":"Balder13946731","ts":1795309549,"zh":"从数据上来说，这种对V型的结构非常明显。在过去10年都出现相似的反弹模式。\n所以1-2周内重新看到布林中线（661）的可能性还是很大。","en":"从数据上来说，这种对V型的结构非常明显。在过去10年都出现相似的反弹模式。\n所以1-2周内重新看到布林中线（661）的可能性还是很大。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXsPKwfbMAAdnVb.jpg?name=orig","https://pbs.twimg.com/media/HXsPKwea4AAKLpJ.jpg?name=orig"],"u":"https://x.com/Balder13946731/status/2124308335277318162","l":[],"ln":[],"t":[],"lk":28,"rt":1,"rp":4,"vw":12132},{"id":"2124308224396718549","h":"dmjk001","ts":1795309523,"zh":"彭博：中国1.7万亿美元的人工智能抛售潮让热门交易变成亏损赌注\n据彭博汇编的数据，自6月底以来，在三个聚焦科技的指数上市的股票市值合计蒸发了1.7万亿美元。\n全球人工智能热潮的退潮对中国冲击尤为严重，因为虚高的估值和对政策支持的依赖使股市在裂痕一旦显现时便不堪一击。\n中国互联网巨头正饱受人工智能开发成本高昂、国内消费疲软和激烈竞争之苦，在此轮抛售中，中国科技股整体估值下滑。","en":"彭博：中国1.7万亿美元的人工智能抛售潮让热门交易变成亏损赌注\n据彭博汇编的数据，自6月底以来，在三个聚焦科技的指数上市的股票市值合计蒸发了1.7万亿美元。\n全球人工智能热潮的退潮对中国冲击尤为严重，因为虚高的估值和对政策支持的依赖使股市在裂痕一旦显现时便不堪一击。\n中国互联网巨头正饱受人工智能开发成本高昂、国内消费疲软和激烈竞争之苦，在此轮抛售中，中国科技股整体估值下滑。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXsO-mXbMAAaFsG.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2124308224396718549","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":1018},{"id":"2124306952956305621","h":"bboczeng","ts":1795309219,"zh":"从这个图来说，本次下跌确实很像2025，因为跌  Drive 20TB 和 Youtube Premium 会员，可以说是相当划算了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tychozzz/status/2124306028284260593","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":235},{"id":"2124305315319668968","h":"ShanghaoJin","ts":1795308829,"zh":"猜猜截图谁说的","en":"猜猜截图谁说的","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2124305315319668968","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":176},{"id":"2124301691294257244","h":"dmjk001","ts":1795307965,"zh":"彭博：加州对英伟达的调查涉及潜在刑事违法问题\n加州总检察长罗布·邦塔正在调查英伟达公司是否非法向中国出售先进芯片，并就相关行为误导投资者，包括可能违反州法律的刑事行为。\n调查仍处于初步阶段，尚未得出任何结论。邦塔表示，如果英伟达或前首席执行官黄仁勋向公众提供了虚假信息，则可能违反了加州的多项法律。\n如果调查认定英伟达违法，处罚可能包括法院下令禁止进一步违规、返还非法销售所得的任何利润，以及可能对英伟达提起刑事诉讼并处以罚款。","en":"彭博：加州对英伟达的调查涉及潜在刑事违法问题\n加州总检察长罗布·邦塔正在调查英伟达公司是否非法向中国出售先进芯片，并就相关行为误导投资者，包括可能违反州法律的刑事行为。\n调查仍处于初步阶段，尚未得出任何结论。邦塔表示，如果英伟达或前首席执行官黄仁勋向公众提供了虚假信息，则可能违反了加州的多项法律。\n如果调查认定英伟达违法，处罚可能包括法院下令禁止进一步违规、返还非法销售所得的任何利润，以及可能对英伟达提起刑事诉讼并处以罚款。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXsJCpCbEAADqZ6.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2124301691294257244","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":802},{"id":"2124299120596976016","h":"bboczeng","ts":1795307352,"zh":"从这个图来说，确实很像2025，因为跌的太快了\n所以周一我一定要跑步入场，开始抄底\n不然我可能会后悔的\n主要是因为我等了5个月了，而且定投的比例太低了\n我必须开始行动\n已经有仓位的各位不要跟我\n想做空的也请自便\n具体规划，有机会的话周末文章专题分析\n我会和之前一样，在首页置顶\n谢谢大家","en":"从这个图来说，确实很像2025，因为跌的太快了\n所以周一我一定要跑步入场，开始抄底\n不然我可能会后悔的\n主要是因为我等了5个月了，而且定投的比例太低了\n我必须开始行动\n已经有仓位的各位不要跟我\n想做空的也请自便\n具体规划，有机会的话周末文章专题分析\n我会和之前一样，在首页置顶\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124299120596976016","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":2,"vw":945},{"id":"2124299077559153034","h":"bboczeng","ts":1795307342,"zh":"从这个图来说，确实很像2025，因为跌的太快了\n所以周一我一定要跑步入场，开始抄底\n不然我可能会后悔的\n主要是因为我等了5个月了，而且定投的比例太低了\n我必须开始行动\n已经有仓位的各位不要跟我\n想做空的也请自便\n具体规划，有机会的话周末文章专题分析\n谢谢大家","en":"从这个图来说，确实很像2025，因为跌的太快了\n所以周一我一定要跑步入场，开始抄底\n不然我可能会后悔的\n主要是因为我等了5个月了，而且定投的比例太低了\n我必须开始行动\n已经有仓位的各位不要跟我\n想做空的也请
