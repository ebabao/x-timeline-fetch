02330288","h":"Balder13946731","ts":1795022665,"zh":"1500亿美元的回购足以击杀一切空头😤 150最低了 $NVDA","en":"1500亿美元的回购足以击杀一切空头😤 150最低了 $NVDA","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123105057902330288","l":[],"ln":[],"t":[],"lk":10,"rt":1,"rp":2,"vw":1541},{"id":"2123104770542260366","h":"TheMarketMemo","ts":1795022597,"zh":"目前看起來，投資者似乎還沒有完全放棄半導體板塊，尤其是像 $MU 這類業績好、預期也很好的股票。換個角度看，如果 MU 也破位下跌（跌破 11 月 5 日低點），這意味著半導體行業有可能進入下行週期，絕大多數半導體股票會被腰斬、再腰斬。\n沒有了半導體類股的支撐，大盤也會繼續向下尋底，直到有*新的熱點*湧現出來。","en":"目前看起來，投資者似乎還沒有完全放棄半導體板塊，尤其是像 $MU 這類業績好、預期也很好的股票。換個角度看，如果 MU 也破位下跌（跌破 11 月 5 日低點），這意味著半導體行業有可能進入下行週期，絕大多數半導體股票會被腰斬、再腰斬。\n沒有了半導體類股的支撐，大盤也會繼續向下尋底，直到有*新的熱點*湧現出來。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbIZDWbAAAtYYt.png?name=orig"],"u":"https://x.com/TheMarketMemo/status/2123104770542260366","l":[],"ln":[],"t":[],"lk":35,"rt":0,"rp":3,"vw":2653},{"id":"2123103941118599357","h":"octopusycc","ts":1795022399,"zh":"截止目前，这张上涨了50%\nMSTR 12/18 95 P\n从8刀涨到12刀\n$MSTR","en":"截止目前，这张上涨了50%\nMSTR 12/18 95 P\n从8刀涨到12刀\n$MSTR","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbHpyTagAEbGkL.jpg?name=orig"],"u":"https://x.com/octopusycc/status/2123103941118599357","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":1559},{"id":"2123101979375235386","h":"BillAckman","ts":1795021931,"zh":"我认为 @nvidia 董事会的行事方式既不符合股东的最佳利益，也不符合其信托义务。 我们所知道的是，董事会因违反公司政策和/或回应与间谍有染的指控而解雇了詹森或迫使他辞职。 他们这样做时没有仔细考虑对公司、客户、股东或其他利益相关者的影响。 他们仓促做出判断，没有经过仔细的尽职调查，甚至没有对事实的基本了解。 我们怎么知道这一点？ 我们从詹森被解雇的速度有多快以及他被解雇时的情况知之甚少就知道了这一点。 召开董事会会议需要时间。也许有时间进行一次 Zoom。 这是一个应该由董事会亲自出席并在了解事实后仔细审议后做出的决定。他们应该在做出决定后就睡觉，并在第二天再次开会讨论事实、风险以及他们决定的其他影响。 由于时间安排和信息缺乏，董事会无法进行仔细的审议。 虽然董事会可以因首席执行官与下属的不当关系而解雇首席执行官，但这不应该是一个自动的决定。这就是为什么我们的董事会由人类而非代理人组成。 董事会应考虑这种关系是否是双方自愿的，或者是否滥用权力。董事会必须考虑解雇对所有利益相关者的影响。 如果我是这个董事会成员，我就不会根据媒体文章匆忙做出判断。我会确保董事会了解所有事实，以便能够做出谨慎且明智的决定。特拉华州公司董事会有谨慎义务，这意味着他们必须做出知情、审慎和善意的决定。这显然没有发生在这里。 哪家律师事务所为该委员会提供咨询服务？ 或者董事会是否听取了良好的法律建议？ 看起来不像。 现在，董事会坚称詹森不可能重新担任首席执行官，这让董事会的失败雪上加霜。 为什么在所有事实都清楚之前排除詹森回归的可能性才符合公司的最佳利益？这是他们又一次违反注意义务。 此外，董事会还发起了一项调查，调查范围尚不清楚。调查可能会对公司造成极大的损害，因此应谨慎定位，以解决任何需要了解的事实，而不是范围过于广泛。简而言之，这看起来像是董事因媒体头条新闻而惊慌失措的一系列重大治理失败。他们可能觉得有必要做某事，因为他们害怕在媒体上看起来很糟糕，而不是因为这对他们的公司来说是正确的事情。 他们受不了高温。 对于一家如此规模且对我们国家和整个世界如此重要的公司来说，董事会的行为令人震惊，特别是在历史的这个时刻。","en":"I believe the @nvidia board is not acting in the best interest of shareholders nor in a manner consistent with their fiduciary duties.\nWhat we know is that the board fired Jensen or forced his resignation for violating company policy and/or in response to the accusation of an affair with a spy.\nThey did so without careful consideration of the impact on the company, its customers, its shareholders or other stakeholders.\nThey rushed to judgment without the benefit of careful due diligence or even with a basic understanding of the facts.\nHow do we know this?\nWe know this by how quickly Jensen was fired and how little was known at the time of his firing.\nIt takes time to convene a board meeting. There was time, maybe, for one Zoom.\nAnd this is a decision that should have been made by a board sitting in person and carefully deliberating the facts once they are known.\nAnd they should have slept on the decision and met again the day after to discuss the facts, the risks and the other implications of their decision.\nThe timing and lack of information did not allow for careful board deliberation.\nWhile boards can fire a CEO for an inappropriate relationship with a subordinate, it should not be an automatic decision. That is why we have boards comprised of humans and not agents.\nA board should consider whether or not such a relationship was consensual or whether it was an abuse of power dynamics. And a board has to consider what the impact of the firing is on all stakeholders.\nIf I were in this board, I would not have rushed to judgment based on articles in the media. I would have made sure the board had all of the facts so it could make a careful and informed decision.\nBoards of Delaware companies have a duty of care which means they must make informed, prudent and good faith decisions. This clearly did not happen here.\nWhat law firm is advising this board?\nOr is the board even taken good legal advice?\nIt doesn’t look like it.\nAnd now the board is compounding its failures by insisting that there is no possibility for Jensen’s return as CEO.\nWhy is it in the best interest of the company to foreclose the possibility of Jensen’s return and to do so before all of the facts are known? This is yet another breach of their duty of care.\nFurthermore, the board has launched an investigation whose scope is unknown. Investigations can be extremely damaging to a company and should be carefully targeted to address whatever facts need to be known rather than be overly broad in scope.\nIn short, this looks like a series of major governance failures by directors that panicked due to headlines in the media. They likely felt compelled to do something because they were afraid of looking bad in the media, not because it was the right thing for them company.\nThey couldn’t stand the heat.\nThe board’s conduct here is shocking for a company of this scale and importance to our country and the world at large, particularly at this moment in history.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/BillAckman/status/2123101979375235386","l":[],"ln":[],"t":["AI科技"],"lk":5703,"rt":838,"rp":544,"vw":154106},{"id":"2123101157887475839","h":"bboczeng","ts":1795021736,"zh":"和我的看法几乎是完全一样的，首先去$150，随后$120，最差情况可以到$80（再来一次大解放日）\n其实技术面、特别是图形这种东西，你说准吧也不准，你说不准吧，还真不能不看\n因为他就摆在你面前\n看不到结构那就是无知了\n尺度越大的结构越有效","en":"和我的看法几乎是完全一样的，首先去$150，随后$120，最差情况可以到$80（再来一次大解放日）\n其实技术面、特别是图形这种东西，你说准吧也不准，你说不准吧，还真不能不看\n因为他就摆在你面前\n看不到结构那就是无知了\n尺度越大的结构越有效","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123101157887475839","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":242},{"id":"2123101026077315446","h":"bboczeng","ts":1795021704,"zh":"不知不觉，贵金属的行情已经彻底结束了：","en":"不知不觉，贵金属的行情已经彻底结束了：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbFGGMa8AAe3Je.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2123101026077315446","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":249},{"id":"2123100834603180310","h":"bboczeng","ts":1795021658,"zh":"据 Semafor 报道，尽管英伟达（$NVDA）董事会此前公开表示不考虑让黄仁勋重返CEO职位，但董事会内部已有“一派”成员正在推动黄仁勋重新出任首席执行官。\n据悉，黄仁勋近期已与多位科技行业高管会面，并与至少一名英伟达董事会成员讨论了重新担任CEO的可能性。","en":"据 Semafor 报道，尽管英伟达（$NVDA）董事会此前公开表示不考虑让黄仁勋重返CEO职位，但董事会内部已有“一派”成员正在推动黄仁勋重新出任首席执行官。\n据悉，黄仁勋近期已与多位科技行业高管会面，并与至少一名英伟达董事会成员讨论了重新担任CEO的可能性。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123100834603180310","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":319},{"id":"2123100781213794541","h":"bboczeng","ts":1795021646,"zh":"标普500指数（$SPX）七个月来首次收盘跌破200日移动平均线","en":"标普500指数（$SPX）七个月来首次收盘跌破200日移动平均线","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123100781213794541","l":[],"ln":[],"t":["美股"],"lk":2,"rt":0,"rp":0,"vw":252},{"id":"2123100159936791009","h":"Balder13946731","ts":1795021498,"zh":"每个人都将定制芯片描述为谷歌和 Meta 逃离 Nvidia 的收费站。看看他们要逃到谁那里去。\nHock Tan 以大约 69B 美元的价格收购了 VMware，取消了永久许可证并将每个人都捆绑在一起。 AT&T 告诉法庭，其续约报价上涨了 1,050%。客户尖叫了一年，但他们中的大多数人还是付了钱，因为将 VMware 从数据中心中剥离比吃掉账单更糟糕。\n正是这个人共同设计了 Google 的 TPU、Meta 的芯片和 OpenAI 的 10GW 定制芯片交易。在 VMware 中，他发现了一些客户无法轻易拆除并以这种方式定价的东西，并且他在整个职业生涯中一直在做这样的事情。\n一旦你的模型堆栈被调整到只有一家商店可以为你构建的芯片，离开就像离开 VMware 一样痛苦，而他就是那个在未来十年向你报价的人。","en":"Everyone frames custom chips as Google and Meta escaping Nvidia's toll booth. Look at who they're escaping to.\nHock Tan bought VMware for ~$69B, killed the perpetual licenses and pushed everyone onto bundles. AT&T told a court its renewal quote went up 1,050%. Customers screamed for a year, and most of them paid anyway, because ripping VMware out of a data center is worse than eating the bill.\nThat's the same guy co-designing Google's TPUs, Meta's chips and OpenAI's 10GW custom silicon deal. With VMware he found something customers couldn't easily rip out and priced it that way, and he's been doing some version of that his whole career.\nOnce your model stack is tuned to a chip only one shop can build for you, leaving gets about as painful as leaving VMware was, and he's the one who'll be quoting you the renewal for the next decade.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/Balder13946731/status/2123100159936791009","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":596},{"id":"2123100002985898311","h":"bboczeng","ts":1795021460,"zh":"至此，日本所有大型企业，包括三菱银行的数据库系统全部被攻陷\n全体日本人的私人信息估计都被泄露十几遍了，可以被做成游戏了\n这就是外包IT的后果吗？\n谢谢大家","en":"至此，日本所有大型企业，包括三菱银行的数据库系统全部被攻陷\n全体日本人的私人信息估计都被泄露十几遍了，可以被做成游戏了\n这就是外包IT的后果吗？\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123100002985898311","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":502},{"id":"2123099584373399836","h":"yijiangren","ts":1795021360,"zh":"QQQ $QQQ\n开盘前说的650附近\n今天最低点654\n还是有点误差","en":"QQQ $QQQ\n开盘前说的650附近\n今天最低点654\n还是有点误差","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbDpj1a0AAWdzz.png?name=orig","https://pbs.twimg.com/media/HXbDrw-agAALxtj.png?name=orig"],"u":"https://x.com/yijiangren/status/2123099584373399836","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":1,"vw":459},{"id":"2123099362435936730","h":"bboczeng","ts":1795021307,"zh":"黄金已经结束了\n正如半导体\n希望陶老师迷途知返，不要和Herman Jin一样不断纠缠了\n如果半个月前听了您的建议去抄底存储\n现在岂不是亏麻了？\n结束了就是结束\n改变立场比坚持更值得尊敬！\n不要为了维持人设陷入泥潭，意识形态挂帅，价值观先行\n请和我一样，做一个真诚，诚实，情绪化的人\n谢谢","en":"黄金已经结束了\n正如半导体\n希望陶老师迷途知返，不要和Herman Jin一样不断纠缠了\n如果半个月前听了您的建议去抄底存储\n现在岂不是亏麻了？\n结束了就是结束\n改变立场比坚持更值得尊敬！\n不要为了维持人设陷入泥潭，意识形态挂帅，价值观先行\n请和我一样，做一个真诚，诚实，情绪化的人\n谢谢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123099362435936730","l":[],"ln":[],"t":["AI科技","黄金"],"lk":2,"rt":1,"rp":2,"vw":652},{"id":"2123098165742309412","h":"bboczeng","ts":1795021022,"zh":"看来只有等到明天的IPO结束之后，\n半导体和NVDA才可能迎来11月份的第一次反弹","en":"看来只有等到明天的IPO结束之后，\n半导体和NVDA才可能迎来11月份的第一次反弹","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123098165742309412","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":675},{"id":"2123097645539553592","h":"bboczeng","ts":1795020898,"zh":"美联储理事沃勒呼吁12月加息50个基点\n美联储理事克里斯托弗·沃勒（Christopher Waller）呼吁，在12月8日至9日举行的联邦公开市场委员会（FOMC）会议上，大幅加息50个基点（0.5个百分点）。\n沃勒指出，美国核心消费者价格指数（Core CPI）已连续三个月环比上涨0.3%，按年化计算，通胀率接近3.5%，明显高于美联储2%的通胀目标。此外，超过70%的核心服务类项目价格涨幅超过3%。\n他警告称，通胀压力正在向更广泛的经济领域蔓延，而不仅仅是受到油价影响。因此，他主张美联储现在就采取激进的紧缩措施，或者至少明确释放未来将加快加息步伐的信号，以防止高通胀变得根深蒂固。\n市场对此作出反应，美国国债收益率上升，黄金价格下跌。\n不过，批评人士认为，考虑到油价正在下跌、整体通胀呈现放缓趋势，沃勒的鹰派立场可能为时过早。\n这一争论凸显了美联储当前面临的政策两难：究竟应该通过更激进的紧缩政策维护抗通胀的公信力，还是避免过度加息对经济造成不必要的冲击。","en":"美联储理事沃勒呼吁12月加息50个基点\n美联储理事克里斯托弗·沃勒（Christopher Waller）呼吁，在12月8日至9日举行的联邦公开市场委员会（FOMC）会议上，大幅加息50个基点（0.5个百分点）。\n沃勒指出，美国核心消费者价格指数（Core CPI）已连续三个月环比上涨0.3%，按年化计算，通胀率接近3.5%，明显高于美联储2%的通胀目标。此外，超过70%的核心服务类项目价格涨幅超过3%。\n他警告称，通胀压力正在向更广泛的经济领域蔓延，而不仅仅是受到油价影响。因此，他主张美联储现在就采取激进的紧缩措施，或者至少明确释放未来将加快加息步伐的信号，以防止高通胀变得根深蒂固。\n市场对此作出反应，美国国债收益率上升，黄金价格下跌。\n不过，批评人士认为，考虑到油价正在下跌、整体通胀呈现放缓趋势，沃勒的鹰派立场可能为时过早。\n这一争论凸显了美联储当前面临的政策两难：究竟应该通过更激进的紧缩政策维护抗通胀的公信力，还是避免过度加息对经济造成不必要的冲击。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123097645539553592","l":[],"ln":[],"t":["美联储","通胀","原油能源","黄金"],"lk":3,"rt":0,"rp":2,"vw":962},{"id":"2123097456787530207","h":"bboczeng","ts":1795020853,"zh":"Anthropic IPO 吸引近 5000 亿美元认购，超越 SpaceX 纪录\n开发 Claude 聊天机器人的这家 AI 公司，共收到机构投资者 4000 亿美元和散户投资者 1000 亿美元的认购，目前正商讨将发行价定在 78 美元以上，并扩大发行规模。\n公司前九个月营收 330 亿美元，同比增长 1200%，10 月年化收入run rate达 810 亿美元，股票将于明天在纳斯达克开始交易，股票代码为 $ANT。\n观察人士指出，散户的热情通过代币化产品得以体现，同时也有人将比特币的回落与资金流入此次 IPO 联系起来。","en":"Anthropic IPO 吸引近 5000 亿美元认购，超越 SpaceX 纪录\n开发 Claude 聊天机器人的这家 AI 公司，共收到机构投资者 4000 亿美元和散户投资者 1000 亿美元的认购，目前正商讨将发行价定在 78 美元以上，并扩大发行规模。\n公司前九个月营收 330 亿美元，同比增长 1200%，10 月年化收入run rate达 810 亿美元，股票将于明天在纳斯达克开始交易，股票代码为 $ANT。\n观察人士指出，散户的热情通过代币化产品得以体现，同时也有人将比特币的回落与资金流入此次 IPO 联系起来。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123097456787530207","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":5,"rt":0,"rp":1,"vw":1520},{"id":"2123096878363611329","h":"octopusycc","ts":1795020715,"zh":"帮着扩散一下，杨超越老师 365天盈利榜第一","en":"帮着扩散一下，杨超越老师 365天盈利榜第一","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2123096878363611329","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":0,"vw":1661},{"id":"2123095059633733782","h":"TraderS18","ts":1795020282,"zh":"是“糟心”不是“招新”，手速太快打错了","en":"是“糟心”不是“招新”，手速太快打错了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123095059633733782","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1135},{"id":"2123094172668490175","h":"bboczeng","ts":1795020070,"zh":"英伟达跌破150，那就是120见了","en":"英伟达跌破150，那就是120见了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123094172668490175","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":153},{"id":"2123093122423128338","h":"bboczeng","ts":1795019820,"zh":"事实证明，美股确实已经完了\n大家节哀吧\n只有定投voo是你们的唯一出路","en":"事实证明，美股确实已经完了\n大家节哀吧\n只有定投voo是你们的唯一出路","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123093122423128338","l":[],"ln":[],"t":["美股"],"lk":3,"rt":0,"rp":3,"vw":507},{"id":"2123089479921787104","h":"wufantouzi","ts":1795018951,"zh":"英伟达财报也没有拉起美股\n短期美股反弹的机会渺茫了\n只能装死等加息之后了","en":"英伟达财报也没有拉起美股\n短期美股反弹的机会渺茫了\n只能装死等加息之后了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2123089479921787104","l":[],"ln":[],"t":["美联储","美股","AI科技","财报"],"lk":10,"rt":0,"rp":6,"vw":2490},{"id":"2123088711030366217","h":"yijiangren","ts":1795018768,"zh":"A社 IPO：市场愿意给 AI 多高的估值\nAnthropic 即将登陆纳斯达克，股票代码 ANT。\n目前公开招股文件给出的发行区间为 70—78 美元。\n此前有媒体报道称，承销商正在考虑将发行价上调至 80 美元以上。\n市场讨论的估值已经达到约 1.4 万亿美元，如果最终定价继续上调，估值还会进一步抬升。\n但这 1.4 万亿美元究竟贵不贵？\n先看基本面\nAnthropic 的收入增长\n2025 年全年收入约 45.9 亿美元，2026 年前九个月已经达到 332.4 亿美元，同比增长约 12 倍。\n企业客户对 Claude 的需求正在快速增长，AI 编程、企业自动化和 API 服务都在推动商业化。\n但另一面也值得注意。\n2026 年前九个月，算力与基础设施费用达到 188.1 亿美元，占收入的 57%。\n同期经营亏损约 12.6 亿美元。\n账面净亏损约 1040 亿美元，其中约 943 亿美元来自可转换票据、衍生负债等金融工具的公允价值变动，不是实际现金烧掉了 1040 亿美元。\n这恰恰说明，AI 行业的商业化速度虽然很快，但算力投入依然是一笔庞大的长期成本。\n再看估值\n按照路透社报道的约 1.4 万亿美元估值计算，Anthropic 对应过去 12 个月收入约 40 倍。\n这个价格已经包含了市场对未来多年增长的预期。\n投资者买入的，是 Claude 在企业市场的持续渗透，是 AI Agent 带来的生产力变革，也是 Anthropic 未来争夺全球 AI 基础设施市场的可能性。\n但高估值也意味着更高的兑现要求。\n模型竞争、算力成本、融资环境、企业客户的实际付费意愿，任何一个环节出现变化，都可能影响估值。\n所以，两件事：\n最终发行价能否突破 80 美元\n首日交易能否承接如此高的估值\nIPO 首日的涨跌只能反映资金当下的态度。\n真正决定 Anthropic 长期价值的，是它能否把 AI 的技术优势，持续转化为收入、利润和现金流。","en":"A社 IPO：市场愿意给 AI 多高的估值\nAnthropic 即将登陆纳斯达克，股票代码 ANT。\n目前公开招股文件给出的发行区间为 70—78 美元。\n此前有媒体报道称，承销商正在考虑将发行价上调至 80 美元以上。\n市场讨论的估值已经达到约 1.4 万亿美元，如果最终定价继续上调，估值还会进一步抬升。\n但这 1.4 万亿美元究竟贵不贵？\n先看基本面\nAnthropic 的收入增长\n2025 年全年收入约 45.9 亿美元，2026 年前九个月已经达到 332.4 亿美元，同比增长约 12 倍。\n企业客户对 Claude 的需求正在快速增长，AI 编程、企业自动化和 API 服务都在推动商业化。\n但另一面也值得注意。\n2026 年前九个月，算力与基础设施费用达到 188.1 亿美元，占收入的 57%。\n同期经营亏损约 12.6 亿美元。\n账面净亏损约 1040 亿美元，其中约 943 亿美元来自可转换票据、衍生负债等金融工具的公允价值变动，不是实际现金烧掉了 1040 亿美元。\n这恰恰说明，AI 行业的商业化速度虽然很快，但算力投入依然是一笔庞大的长期成本。\n再看估值\n按照路透社报道的约 1.4 万亿美元估值计算，Anthropic 对应过去 12 个月收入约 40 倍。\n这个价格已经包含了市场对未来多年增长的预期。\n投资者买入的，是 Claude 在企业市场的持续渗透，是 AI Agent 带来的生产力变革，也是 Anthropic 未来争夺全球 AI 基础设施市场的可能性。\n但高估值也意味着更高的兑现要求。\n模型竞争、算力成本、融资环境、企业客户的实际付费意愿，任何一个环节出现变化，都可能影响估值。\n所以，两件事：\n最终发行价能否突破 80 美元\n首日交易能否承接如此高的估值\nIPO 首日的涨跌只能反映资金当下的态度。\n真正决定 Anthropic 长期价值的，是它能否把 AI 的技术优势，持续转化为收入、利润和现金流。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXa5c_yawAAv0av.png?name=orig"],"u":"https://x.com/yijiangren/status/2123088711030366217","l":[],"ln":[],"t":["美股","AI科技"],"lk":5,"rt":0,"rp":3,"vw":851},{"id":"2123083555953836116","h":"TraderS18","ts":1795017539,"zh":"那么我们想要的终极答案也就呼之欲出了，真正的反转点是利率何时从加息变降息，在能看到加息周期终点之前，只会有反弹而不会有反转。\n再回顾下本轮周期：9.16号加了25BP，10月没加，12月会加25BP，然后大概会在明年3月再加25BP后暂停。\n也就是说行情要到明年春节后才会开始好转，这跟市场一贯印象也很吻合。但不排除12月会随着TGA账户水位下降有一轮小宽松带来的行情回暖。\n好消息是油价还在下跌，如果趋势可以维持，宏观数据也会随之改善。如果11月12月的PCE/CPI都得到改善，行情的回暖也许会提前到来。毕竟市场会提前交易预期，而不会等利率决议那一刻才去博弈。","en":"那么我们想要的终极答案也就呼之欲出了，真正的反转点是利率何时从加息变降息，在能看到加息周期终点之前，只会有反弹而不会有反转。\n再回顾下本轮周期：9.16号加了25BP，10月没加，12月会加25BP，然后大概会在明年3月再加25BP后暂停。\n也就是说行情要到明年春节后才会开始好转，这跟市场一贯印象也很吻合。但不排除12月会随着TGA账户水位下降有一轮小宽松带来的行情回暖。\n好消息是油价还在下跌，如果趋势可以维持，宏观数据也会随之改善。如果11月12月的PCE/CPI都得到改善，行情的回暖也许会提前到来。毕竟市场会提前交易预期，而不会等利率决议那一刻才去博弈。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123083555953836116","l":[],"ln":[],"t":["美联储","原油能源"],"lk":31,"rt":2,"rp":2,"vw":5223},{"id":"2123081783269113949","h":"CrushTheShorts","ts":1795017116,"zh":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星开始穿透严查代工，据了解此事大概率为真\n2）只看代工来源，理论上说摩尔和壁仞相对还行，但其实都有各自的问题\n3）理论上说该把中芯华虹拉满，但腾讯给了2028年资本开支下滑的展望，尽管买国产卡的钱预计能增长2年，但在大beta向下的预期下，交易这两标的也是个难题","en":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星开始穿透严查代工，据了解此事大概率为真\n2）只看代工来源，理论上说摩尔和壁仞相对还行，但其实都有各自的问题\n3）理论上说该把中芯华虹拉满，但腾讯给了2028年资本开支下滑的展望，尽管买国产卡的钱预计能增长2年，但在大beta向下的预期下，交易这两标的也是个难题","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2123081783269113949","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":0,"rp":4,"vw":1345},{"id":"2123081479987302659","h":"Gabrysia_eth","ts":1795017044,"zh":"看到一个70岁老奶奶对ai时代的评论：\n「以后，年轻人也可能会没有工作机会，相信社会不会让人饿死。个体需要解决的就是打发时间。」\n「对抗虚无和无意义感的方法，就是让生活充满细节。」\n我一直觉得，我们正在经历的不只是生产力的进步，而可能是整个社会生产关系、阶级结构，甚至人类价值体系的重新洗牌。\n未来，人或许不再需要像过去几千年一样，终其一生都在为基本生存需求奔波。\n当劳动不再是人获取价值的主要方式，价值会是那些过去很容易被忽略的东西：人的思想、情感、创造力、审美、好奇心，以及与其他人建立真实连接的能力。\n我们为什么会被一朵花、一场雨打动，为什么想去探索、表达、创造，为什么愿意花时间去爱一个人、经营一段关系。\n生产力进步的终点，是让人终于有时间重新成为人。","en":"看到一个70岁老奶奶对ai时代的评论：\n「以后，年轻人也可能会没有工作机会，相信社会不会让人饿死。个体需要解决的就是打发时间。」\n「对抗虚无和无意义感的方法，就是让生活充满细节。」\n我一直觉得，我们正在经历的不只是生产力的进步，而可能是整个社会生产关系、阶级结构，甚至人类价值体系的重新洗牌。\n未来，人或许不再需要像过去几千年一样，终其一生都在为基本生存需求奔波。\n当劳动不再是人获取价值的主要方式，价值会是那些过去很容易被忽略的东西：人的思想、情感、创造力、审美、好奇心，以及与其他人建立真实连接的能力。\n我们为什么会被一朵花、一场雨打动，为什么想去探索、表达、创造，为什么愿意花时间去爱一个人、经营一段关系。\n生产力进步的终点，是让人终于有时间重新成为人。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Gabrysia_eth/status/2123081479987302659","l":[],"ln":[],"t":[],"lk":12,"rt":1,"rp":2,"vw":785},{"id":"2123081181730324877","h":"dmjk001","ts":1795016973,"zh":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星开始穿透严查代工，据了解此事大概率为真\n2）只看代工来源，理论上说摩尔和壁仞相对还行，但其实都有各自的问题\n3）理论上说该把中芯华虹拉满，但腾讯给了2028年资本开支下滑的展望，尽管买国产卡的钱预计能增长2年，但在大beta向下的预期下，交易这两标的也是个难题、","en":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星开始穿透严查代工，据了解此事大概率为真\n2）只看代工来源，理论上说摩尔和壁仞相对还行，但其实都有各自的问题\n3）理论上说该把中芯华虹拉满，但腾讯给了2028年资本开支下滑的展望，尽管买国产卡的钱预计能增长2年，但在大beta向下的预期下，交易这两标的也是个难题、","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123081181730324877","l":[],"ln":[],"t":["AI科技"],"lk":10,"rt":2,"rp":1,"vw":2260},{"id":"2123079660338811323","h":"xingpt","ts":1795016610,"zh":"最近有一个我很费解的现象：\n防御股（比如我们传统认为的消费、医疗这些刚需资产），一般来说应该是给比较低的市盈率；而成长类的股票（比如科技股），应该是市盈率相对比较高、波动也比较大。\n但现在经过半导体的这轮下跌，以及防御类股票资产的抱团取暖，事实上形成了科技股非常便宜、而防御股非常贵的现象，市盈率普遍接近了历史高点。\n这种情况是会持续很久，还是会在短期内逆转？其实我也拿不准。现在的交易环境已经是叙事大于基本面、情绪大于基本面，很难去参与这种高难度的博弈。但这种现象迟早会逆转：防御股不可能一直这么贵，科技股也会恢复它应该有的估值倍数","en":"最近有一个我很费解的现象：\n防御股（比如我们传统认为的消费、医疗这些刚需资产），一般来说应该是给比较低的市盈率；而成长类的股票（比如科技股），应该是市盈率相对比较高、波动也比较大。\n但现在经过半导体的这轮下跌，以及防御类股票资产的抱团取暖，事实上形成了科技股非常便宜、而防御股非常贵的现象，市盈率普遍接近了历史高点。\n这种情况是会持续很久，还是会在短期内逆转？其实我也拿不准。现在的交易环境已经是叙事大于基本面、情绪大于基本面，很难去参与这种高难度的博弈。但这种现象迟早会逆转：防御股不可能一直这么贵，科技股也会恢复它应该有的估值倍数","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXawu4BbcAAQVk8.jpg?name=orig","https://pbs.twimg.com/media/HXawwN7a8AEF5gx.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123079660338811323","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":0,"vw":275},{"id":"2123076802839212042","h":"TraderS18","ts":1795015929,"zh":"QE变QT，放水变收水，扩张变收缩，其实道理大家都太熟了，只是这次转换太快而且是隐藏在黄仁勋绯闻下的转换，堪称高级障眼法。跟刘谦给你变魔术似的，一边手上做点小动作吸引你的注意力，另一边通过老练的手法就把你兜里的钱拿走了，而你还以为这一切真的是因为黄仁勋出轨导致的。","en":"QE变QT，放水变收水，扩张变收缩，其实道理大家都太熟了，只是这次转换太快而且是隐藏在黄仁勋绯闻下的转换，堪称高级障眼法。跟刘谦给你变魔术似的，一边手上做点小动作吸引你的注意力，另一边通过老练的手法就把你兜里的钱拿走了，而你还以为这一切真的是因为黄仁勋出轨导致的。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123076802839212042","l":[],"ln":[],"t":[],"lk":13,"rt":2,"rp":1,"vw":2135},{"id":"2123076329549803618","h":"xingpt","ts":1795015816,"zh":"CNBC的资深记者爆料：Anthropic IPO机构和散户需求强劲，认购意向是发行规模的 7.6 倍多，所以公司正在考虑提高发行价，同时也考虑扩大规模，但没说扩大多少募资规模。总体来说，说明 AI 的资金还是很看好 Anthropic 的","en":"CNBC的资深记者爆料：Anthropic IPO机构和散户需求强劲，认购意向是发行规模的 7.6 倍多，所以公司正在考虑提高发行价，同时也考虑扩大规模，但没说扩大多少募资规模。总体来说，说明 AI 的资金还是很看好 Anthropic 的","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXauPnAbMAAhGCT.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123076329549803618","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":545},{"id":"2123076006206697546","h":"fxtrader","ts":1795015739,"zh":"日媒对高市早苗所接受的待遇感到不满。《每日新闻》引述外务省高级官员的话：“连最基本的礼貌都没有，真是无礼至极。”\n核心争议在于高市抵达深圳时，迎接规格明显低于特朗普、普京等其他国家领导人。其他国家领导人抵达时，有手持红色花束的年轻人列队欢迎，但高市抵达时并没有这一安排。\n日本方面认为这不仅是礼宾安排的差异，也带有外交信号。","en":"日媒对高市早苗所接受的待遇感到不满。《每日新闻》引述外务省高级官员的话：“连最基本的礼貌都没有，真是无礼至极。”\n核心争议在于高市抵达深圳时，迎接规格明显低于特朗普、普京等其他国家领导人。其他国家领导人抵达时，有手持红色花束的年轻人列队欢迎，但高市抵达时并没有这一安排。\n日本方面认为这不仅是礼宾安排的差异，也带有外交信号。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXatCMWbI 有一点原因其实是英伟达每次给的预期和指引都没有太高\n相对容易达到\n再加上最近黄仁勋先生的事情也影响不到之前的业绩\n聊聊 Anthropic\n今晚的核心事件是确定 IPO 最终发行价和估值\n最终确定时间应该是在明天上午\n正式上市交易安排在明天晚上\nOKX预言家上线了很多关于 A 社的预测\n比如：Anthropic上市首日涨跌幅是多少?\n大家可以来试试 如图二","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXapNsGa8AANNUM.jpg?name=orig","https://pbs.twimg.com/media/HXapO3ZbUAAtReM.jpg?name=orig"],"u":"https://x.com/yijiangren/status/2123072360593158369","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":107},{"id":"2123072046141993463","h":"TraderS18","ts":1795014795,"zh":"一句话总结：之前的问题主要发生在供给端，现在一夜之间需求端出问题了\n也就是说之前很多需求是老黄（或者以他为代表的一派）通过融资硬吹出来的，现在发动机熄火了，泡泡消下去很多，后面能不能涨得看云厂商需求会不会减弱会不会砍订单。也就是说英伟达作为AI央行给AI行业的放水一下被关小了。\n如果Anthropic上市后大涨或放出其他利好（如利润率大涨）证明需求端依然旺盛，盈利能力高于预期，硬件需求暴涨，似乎就能反转现在的行情？甚至成为新的AI央行（部分）？但这个过程看起来会很漫长。","en":"一句话总结：之前的问题主要发生在供给端，现在一夜之间需求端出问题了\n也就是说之前很多需求是老黄（或者以他为代表的一派）通过融资硬吹出来的，现在发动机熄火了，泡泡消下去很多，后面能不能涨得看云厂商需求会不会减弱会不会砍订单。也就是说英伟达作为AI央行给AI行业的放水一下被关小了。\n如果Anthropic上市后大涨或放出其他利好（如利润率大涨）证明需求端依然旺盛，盈利能力高于预期，硬件需求暴涨，似乎就能反转现在的行情？甚至成为新的AI央行（部分）？但这个过程看起来会很漫长。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123072046141993463","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":1,"rp":0,"vw":681},{"id":"2123071509589832088","h":"fxtrader","ts":1795014667,"zh":"俄罗斯总统新闻秘书佩斯科夫：11月19日未计划举行俄罗斯总统普京与美国总统特朗普的双边会谈。普京与特朗普今日未进行实质性交谈。","en":"俄罗斯总统新闻秘书佩斯科夫：11月19日未计划举行俄罗斯总统普京与美国总统特朗普的双边会谈。普京与特朗普今日未进行实质性交谈。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXaqRNBakAA_n1K.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123071509589832088","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":514},{"id":"2123069393940697583","h":"maojietrading","ts":1795014162,"zh":"周三开盘后20分钟止盈空头仓位，为日内股指最低点\n原因很简单，QQQ日内最低点离笨猫关键点位仅差0.03点，无法跌破，因此可以多单进场或至少空头仓位止盈，这便是关键点位的日常用法\n本贴之代表过去，目前股指反弹，市场瞬息万变，目前波动率飙升，点位跌破则市场将大幅走熊，触发更高级别的sell off","en":"周三开盘后20分钟止盈空头仓位，为日内股指最低点\n原因很简单，QQQ日内最低点离笨猫关键点位仅差0.03点，无法跌破，因此可以多单进场或至少空头仓位止盈，这便是关键点位的日常用法\n本贴之代表过去，目前股指反弹，市场瞬息万变，目前波动率飙升，点位跌破则市场将大幅走熊，触发更高级别的sell off","zh_src":"native","lang":"zh","m":["https:// \n也就是相当于你2000或者4000u买btc","en":"为什么说55u买crcl就是1000u买btc\ncrcl当前的市值不足150亿美金\nusdc发行规模大约700亿美金\n如果未来稳定币规模总量超过3万亿\nusdc大约在7000-1万亿美金发行量\n按照平均2.5%的利率计算\n有200-250亿美金的利率收益\n规模越大分给渠道的其实会越少\n就算按照给去到一半计算\ncrcl未来也有100-125亿美金的年收入\n不考虑其他业务的增速\n一家年增长40%\n净利润在100-150亿美金的企业\n给50-100倍pe是合理的\n匹配万亿美金的市值也是合理的\n所以从这个角度看\ncrcl相当于1000u的btc\n再不济你就按20倍pe计算\n也是一家3000-4000亿美金的企业\n那就算2000u的btc\n这个算法\n我不是今天提的\n跌下来或者涨上去都不会有变化\n只不过价格变化也相当于btc成本的变化\ncrcl涨到了100u\n也就是相当于你2000或者4000u买btc","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXaWBQ_a0AEGY7o.jpg?name=orig"],"u":"https://x.com/wufantouzi/status/2123049239781781948","l":[],"ln":[],"t":["财报"],"lk":1,"rt":0,"rp":0,"vw":427},{"id":"2123047277921177781","h":"LeoYuen13","ts":1795008890,"zh":"终于等到现在的黄金价格，不说第二次准备了🚀🚀 $GLD $GOLD","en":"终于等到现在的黄金价格，不说第二次准备了🚀🚀 $GLD $GOLD","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXaT4g7bwAADHRT.jpg?name=orig"],"u":"https://x.com/LeoYuen13/status/2123047277921177781","l":[],"ln":[],"t":["黄金"],"lk":6,"rt":0,"rp":0,"vw":452},{"id":"2123043914676666371","h":"xingpt","ts":1795008088,"zh":"2016 年至 2024 年，阿里巴巴在中国电商市场的份额从 80% 降至 40%，流失的市场份额主要被拼多多、抖音和快手蚕食。（图表来源：Momentum Works）\n图表标题：2016 年以来，中国电商平台的竞争格局发生了持续的结构性变化。\n2016 年，阿里巴巴以 80% 的市场份额占据中国电商市场的绝对主导地位。当时，分析师甚至宣称：“竞争已经结束”（Game Over）。\n然而到了 2024 年，阿里巴巴的市场份额已下降至约 40%。\n从图表估算，各大电商平台在 2024 年的市场份额分别为：\n阿里巴巴（淘宝、天猫）：约 36%\n拼多多：约 23%\n京东：约 20%\n抖音：约 15%\n快手：约 6%\n短短八年时间，阿里巴巴丧失了近一半的市场份额。即便是拥有强大规模效应、网络效应和先发优势的互联网巨头，其竞争护城河也可能随着商业模式创新和用户消费习惯的改变而逐渐瓦解。","en":"2016 年至 2024 年，阿里巴巴在中国电商市场的份额从 80% 降至 40%，流失的市场份额主要被拼多多、抖音和快手蚕食。（图表来源：Momentum Works）\n图表标题：2016 年以来，中国电商平台的竞争格局发生了持续的结构性变化。\n2016 年，阿里巴巴以 80% 的市场份额占据中国电商市场的绝对主导地位。当时，分析师甚至宣称：“竞争已经结束”（Game Over）。\n然而到了 2024 年，阿里巴巴的市场份额已下降至约 40%。\n从图表估算，各大电商平台在 2024 年的市场份额分别为：\n阿里巴巴（淘宝、天猫）：约 36%\n拼多多：约 23%\n京东：约 20%\n抖音：约 15%\n快手：约 6%\n短短八年时间，阿里巴巴丧失了近一半的市场份额。即便是拥有强大规模效应、网络效应和先发优势的互联网巨头，其竞争护城河也可能随着商业模式创新和用户消费习惯的改变而逐渐瓦解。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXaRLQWawAA2HUy.jpg?name=orig"], ddy Waters Research），就是其中最有名的一家。\n一、浑水究竟是什么来头？\n浑水研究由 Carson Block 于 2010 年创立，长期以调查研究和做空上市公司闻名。\n它的名字来自一句中国俗语：浑水摸鱼。\n这家机构最擅长的事情，是深入企业经营链条，调查财务数据、客户关系、供应商、资产真实性以及管理层之间的利益联系。\n它曾经让多家上市公司陷入严重的信任危机。\n2011 年，浑水将矛头指向加拿大上市的中国森林（Sino-Forest），质疑其林地资产和经营数据存在重大造假。\n当时，中国森林市值超过 60 亿加元，曾是资本市场备受关注的林业企业。\n浑水发布报告后，股价从报告发布前的 18.21 加元一路跌至 1.99 加元。随后监管机构介入，公司停牌、退市，最终进入债务重组程序。\n这场调查让 Carson Block 一战成名。\n此后，浑水还曾调查中国高速传媒、分众相关企业以及 NQ Mobile 等公司，在海外资本市场建立了相当强的影响力。\n当然，浑水的历史战绩也并非全胜。\n它对部分公司的质疑曾遭到独立调查否定，NQ Mobile 也曾公布独立调查结果，称没有发现浑水所指控的欺诈行为。\n所以，浑水的报告值得认真阅读，但它的结论始终需要独立证据验证。\n还有一个非常重要的细节：浑水本身就持有被调查公司的空头仓位。它通过做空相关证券获得潜在收益，并在报告发布后逐步平仓。\n换句话说，它既是调查者，也是利益相关方。\n这也是为什么每一份浑水报告，都应该同时看证据和利益动机。\n二、这一次，浑水为什么盯上英伟达？\n当地时间 11 月 17 日，浑水正式发布报告：《MW is Short NVIDIA: More Questions About China》。\n宣布已经做空英伟达（NVDA）。\n这份报告的核心，指向了两个人。\n一个是英伟达前全球业务执行副总裁 Ajay K. Puri，另一个是超微电脑（Super Micro，SMCI）前首席增长官 Cenly Chen。\nAjay Puri 曾在英伟达任职 21 年，负责全球销售、业务拓展、合作伙伴关系等重要业务。\n他在 2026 年 6 月宣布卸任原职，转为英伟达高级顾问。\n而 Cenly Chen 曾在超微电脑负责 GPU 采购和分配。\n事情的关键，出现在两人的公开活动照片上。\n浑水发现，2024 年至 2026 年间，一名被活动摄影网站标注为 Cenly Chen 或 Cenly Puri 的女性，多次与 Ajay Puri 同框。\n浑水由此提出一个问题：照片中的女性，是否就是曾经负责超微电脑 NVIDIA GPU 采购和分配的 Cenly Chen？\n这成为此次做空报告的核心切入点。\n三、超微电脑的芯片出口事件\n要理解浑水为什么关注这层关系，需要回到今年 3 月的一起美国刑事案件。\n美国司法部当时宣布，三名与超微电脑有关联的人员涉嫌合谋，将搭载美国先进 AI 技术的服务器非法转运至中国。\n根据美国司法部公布的起诉内容，2024 年至 2025 年期间，相关人员安排一家东南亚公司采购了约 25 亿美元的服务器。\n其中，仅 2025 年 4 月下旬至 5 月中旬，就有约 5.1 亿美元的服务器被非法转运至中国。\n案件还涉及伪造文件、安排虚假服务器接受检查等行为。\n这意味着，事件已经触及美国 AI 芯片出口管制的核心问题。\n随后，2026 年 10 月，一份针对超微电脑的证券集体诉讼文件，又将 Cenly Chen 的名字带入事件。\n诉讼文件援引前员工证词，称她曾负责超微电脑从英伟达采购 GPU，并决定芯片如何分配给不同客户。\n文件还质疑她是否知晓相关非法销售行为。\n浑水将这两条线索连接起来：\n一边是曾经负责英伟达全球业务的高级管理人员 Ajay Puri，另一边是被诉讼文件指向的超微电脑前高管 Cenly Chen。\n如果照片中的两人确实对应上述人物，那么这层关系就值得进一步调查。\n四、这份报告究竟有多少可信度？\n我认为，需要把整件事拆成三个层次。\n第一层，超微电脑相关人员涉嫌违规转运 AI 服务器，有美国司法部的刑事起诉作为依据。\n第二层，Cenly Chen 曾负责超微电脑的 GPU 采购与分配，有前员工证词被写入法院诉讼文件。\n第三层，照片中的女性究竟是不是 Cenly Chen，以及她与 Ajay Puri 的具体关系，目前仍然没有得到独立证实。\n第三层恰恰是浑水这次做空逻辑中最关键的连接点。\n目前没有证据证明 Ajay Puri 参与了芯片违规转运，也没有证据证明英伟达公司参与了相关违法活动。\n浑水自己也在报告中明确承认：Cenly Chen 没有受到任何政府机构的刑事指控，针对她的民事诉讼指控尚未得到证实。\n所以，这份报告目前更多是在提出一系列值得调查的问题。\n五、这件事对英伟达意味着什么？\n我认为，三个方面\n1. 出口管制风险\n英伟达的核心产品涉及美国严格管制的先进 AI 芯片。\n如果供应链中的违规转运持续扩大，监管部门就可能进一步审查芯片销售、终端客户核查和渠道管理。\n2. 管理层与供应链关系\n英伟达高度依赖服务器厂商、云服务商和分销渠道。\n一旦核心供应链合作伙伴出现合规问题，市场自然会重新审视英伟达的渠道管理能力。\n3. 市场信任\n英伟达当前的估值，很大程度上建立在 AI 算力需求持续增长、供应链稳定以及公司治理可靠的基础上。\n如果出口管制和内部管理问题持续发酵，即使短期营收没有变化，也可能影响投资者愿意支付的估值溢价。\n最后，还有一个细节值得注意。\n浑水在报告中明确披露，自己在发布报告时持有英伟达空头仓位，并计划在报告发布后回补相当一部分，甚至全部仓位。\n因此，不能简单地把浑水发布做空报告理解为它会一直持有空单。\n总而言之\n浑水过去确实有过非常漂亮的调查战绩，它的报告值得重视。\n但这次英伟达事件，最关键的证据链仍然存在缺口。\n超微电脑的出口违规案件有司法调查作为基础，高管之间的身份关联却仍待确认。\n接下来值得观察的，是美国司法部、监管机构以及英伟达自身会不会披露更多信息。\n浑水的报告可以成为风险预警，但还不足以单独构成做空英伟达的完整理由。","en":"浑水做空 $NVDA 英伟达：一场由高管关系、出口管制与供应链疑云引发的调查\n在华尔街，有一类机构让上市公司管理层颇为头疼。\n它们专门寻找企业财报、商业关系和经营活动中的漏洞，然后通过做空股票，从市场对这些问题的重新定价中获利。\n浑水研究（Muddy Waters Research），就是其中最有名的一家。\n一、浑水究竟是什么来头？\n浑水研究由 Carson Block 于 2010 年创立，长期以调查研究和做空上市公司闻名。\n它的名字来自一句中国俗语：浑水摸鱼。\n这家机构最擅长的事情，是深入企业经营链条，调查财务数据、客户关系、供应商、资产真实性以及管理层之间的利益联系。\n它曾经让多家上市公司陷入严重的信任危机。\n2011 年，浑水将矛头指向加拿大上市的中国森林（Sino-Forest），质疑其林地资产和经营数据存在重大造假。\n当时，中国森林市值超过 60 亿加元，曾是资本市场备受关注的林业企业。\n浑水发布报告后，股价从报告发布前的 18.21 加元一路跌至 1.99 加元。随后监管机构介入，公司停牌、退市，最终进入债务重组程序。\n这场调查让 Carson Block 一战成名。\n此后，浑水还曾调查中国高速传媒、分众相关企业以及 NQ Mobile 等公司，在海外资本市场建立了相当强的影响力。\n当然，浑水的历史战绩也并非全胜。\n它对部分公司的质疑曾遭到独立调查否定，NQ Mobile 也曾公布独立调查结果，称没有发现浑水所指控的欺诈行为。\n所以，浑水的报告值得认真阅读，但它的结论始终需要独立证据验证。\n还有一个非常重要的细节：浑水本身就持有被调查公司的空头仓位。它通过做空相关证券获得潜在收益，并在报告发布后逐步平仓。\n换句话说，它既是调查者，也是利益相关方。\n这也是为什么每一份浑水报告，都应该同时看证据和利益动机。\n二、这一次，浑水为什么盯上英伟达？\n当地时间 11 月 17 日，浑水正式发布报告：《MW is Short NVIDIA: More Questions About China》。\n宣布已经做空英伟达（NVDA）。\n这份报告的核心，指向了两个人。\n一个是英伟达前全球业务执行副总裁 Ajay K. Puri，另一个是超微电脑（Super Micro，SMCI）前首席增长官 Cenly Chen。\nAjay Puri 曾在英伟达任职 21 年，负责全球销售、业务拓展、合作伙伴关系等重要业务。\n他在 2026 年 6 月宣布卸任原职，转为英伟达高级顾问。\n而 Cenly Chen 曾在超微电脑负责 GPU 采购和分配。\n事情的关键，出现在两人的公开活动照片上。\n浑水发现，2024 年至 2026 年间，一名被活动摄影网站标注为 Cenly Chen 或 Cenly Puri 的女性，多次与 Ajay Puri 同框。\n浑水由此提出一个问题：照片中的女性，是否就是曾经负责超微电脑 NVIDIA GPU 采购和分配的 Cenly Chen？\n这成为此次做空报告的核心切入点。\n三、超微电脑的芯片出口事件\n要理解浑水为什么关注这层关系，需要回到今年 3 月的一起美国刑事案件。\n美国司法部当时宣布，三名与超微电脑有关联的 373","h":"cnfinancewatch","ts":1794999504,"zh":"股市投资有哪些策略？华尔街观察用什么策略？\n答：策略主要分类：\n1. 股票多头（主观/量化指增）：弹性最大，长期年化预期8%-18%，牛市高、熊市回撤大，业绩分化极强。\n2. 市场中性：对冲大盘Beta，赚超额收益，预期年化3%-6%，波动低，适合稳健配置。\n3. CTA管理期货：商品多空趋势，危机阿尔法，预期年化6%-12%，和股票低相关。\n4. 宏观策略：跨股、债、商品、汇率轮动，预期年化7%-15%，考验大类资产判断。\n5. 相对价值/套利：可转债、ETF、期现套利，赚价差，预期年化3%-5%，回撤很小。\n6. 债券私募：利率、信用债，预期年化3%-5%，防御属性。\n7. 多策略/FOF：分散配置多类私募，预期年化5%-9%，平滑波动。\n#华尔街观察团队及其大模型用：#基于机器量化的大类轮动策略和 #动量平衡策略（少量辅助仓为行业轮动策略）","en":"股市投资有哪些策略？华尔街观察用什么策略？\n答：策略主要分类：\n1. 股票多头（主观/量化指增）：弹性最大，长期年化预期8%-18%，牛市高、熊市回撤大，业绩分化极强。\n2. 市场中性：对冲大盘Beta，赚超额收益，预期年化3%-6%，波动低，适合稳健配置。\n3. CTA管理期货：商品多空趋势，危机阿尔法，预期年化6%-12%，和股票低相关。\n4. 宏观策略：跨股、债、商品、汇率轮动，预期年化7%-15%，考验大类资产判断。\n5. 相对价值/套利：可转债、ETF、期现套利，赚价差，预期年化3%-5%，回撤很小。\n6. 债券私募：利率、信用债，预期年化3%-5%，防御属性。\n7. 多策略/FOF：分散配置多类私募，预期年化5%-9%，平滑波动。\n#华尔街观察团队及其大模型用：#基于机器量化的大类轮动策略和 #动量平衡策略（少量辅助仓为行业轮动策略）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123007911412822373","l":[],"ln":[],"t":["汇率","AI科技"],"lk":0,"rt":0,"rp":0,"vw":973},{"id":"2123007880043679828","h":"octopusycc","ts":1794999496,"zh":"1.3T真的挺便宜的","en":"1.3T真的挺便宜的","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2123007880043679828","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":1380},{"id":"2123007692507906323","h":"wufantouzi","ts":1794999452,"zh":"其实跟着买了crcl\n你骂几句就骂几句吧\n毕竟跌了这么多\n都有情绪\n虽然你赚了和我没关系\n但是跌下来了总不免来踩我几脚\n其实也没有关系\n只要不在这住时候割肉就好了\n拿住你的crcl\n再熬两年\n我也不算被白骂了","en":"其实跟着买了crcl\n你骂几句就骂几句吧\n毕竟跌了这么多\n都有情绪\n虽然你赚了和我没关系\n但是跌下来了总不免来踩我几脚\n其实也没有关系\n只要不在这住时候割肉就好了\n拿住你的crcl\n再熬两年\n我也不算被白骂了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2123007692507906323","l":[],"ln":[],"t":[],"lk":17,"rt":0,"rp":12,"vw":2531},{"id":"2123007413246927006","h":"cnfinancewatch","ts":1794999385,"zh":"目前美国半导体明年开支还是确定性的，国内大厂的呢？另外，目前明年是增长最高峰，之后增长率存疑，要等超级应用，是不是这个悲观预期也很合理？最后是市场情绪，国内机构多杀多出清到什么程度了？","en":"目前美国半导体明年开支还是确定性的，国内大厂的呢？另外，目前明年是增长最高峰，之后增长率存疑，要等超级应用，是不是这个悲观预期也很合理？最后是市场情绪，国内机构多杀多出清到什么程度了？","zh_src":"native","lang":"zh","m":[]," rt":0,"rp":0,"vw":623},{"id":"2122994879840272736","h":"cnfinancewatch","ts":1794996397,"zh":"男人都要把这个视频看十遍：\n想想你的权利来自上边还是下边\n你有自己的势力还是只有上面的靠山\n“权利只对它的来源负责”\n这个铁律这个视频讲的最清楚，它同时也讲清楚了，“男人怎么才能获得权利、掌握权利、评估权利”","en":"男人都要把这个视频看十遍：\n想想你的权利来自上边还是下边\n你有自己的势力还是只有上面的靠山\n“权利只对它的来源负责”\n这个铁律这个视频讲的最清楚，它同时也讲清楚了，“男人怎么才能获得权利、掌握权利、评估权利”","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122994670984966144/vid/avc1/1024x576/n5v3NZxpzoEwye9S.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2122994879840272736","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":572},{"id":"2122993645234311502","h":"qinbafrank","ts":1794996102,"zh":"最新的美银全球基金经理调查，几个要点：1）基金经理对科技股的热情正在快速消退。调查显示科技股超配比例从10月的净37%降至净12%（见图一），降幅为2006年6月以来最大，超过2008年金融危机、2022年加息周期和今年“对等关税日4月2日”时的任何一次。\n目前科技股仓位已低于长期均值约半个标准差（下图2）\n2）在最大尾部风险票选中，\"AI泡沫\"以34%位居第一，\"AI超大规模运营商信用事件\"以31%紧随其后。两项合计65%，意味着市场上三分之二的资金管理者将AI视为当前股市和信用市场的最大威胁。相比之下，10月的头号风险是债券收益率无序上行。（下图3）\n3）在最可能引发系统性信用事件的来源中，38%的受访者指向AI超大规模运营商债券，30%指向私人信贷。（下图4）\n而在企业应优先怎样使用现金流这一问题里，参与调查的基金经理中42%选择选改善资产负债表、33%选回馈股东、16%选增加资本开支。\n4）现金持仓比例从3.9%降至3.6%，为8月以来最低，处于长期均值以下1.9个标准差的位置。按照美银的\"现金规则\"，当现金比例处于或低于4.0%时，构成全球股市的反向卖出信号。\nHartnett在调查发布前就写过，若现金升破4.2%、经济繁荣预期明显减弱，仓位对市场的压力就会减轻。实际结果是现金降至3.6%，仍落在他认为恐惧不足的区域。\n减仓速度很极端，减仓后的仓位仍有余量。 单月下降25个百分点，超过了2008年金融危机、2022年加息调整以及2025年4月关税冲击期间任何一个月的降幅。但减仓后，科技股仍为净超配，只比自身长期均值低约半个标准差。美银历史上看到的较好科技股入场机会，通常出现在受访者已转为净低配的时候。\n结合最近的几个不同的数据来看这一轮调整资金上是对冲基金先减仓、长线经理随后跟进。能从数据中确认的是，至少三类记录都出现了科技风险下降的迹象，但交易行为各有不同。\n1）德鲁肯米勒的三季度持仓显示，他在AI硬件内部做了很大的取舍。\n2）高盛Prime看到了先降杠杆、再卖反弹。 11月第一周，其美国基本面股票多空基金客户的总杠杆下降8.7个百分点至207.5%，是2020年3月以来最大单周降幅。随后一周，芯片股出现4月以来最强反弹，这批资金仍在卖科技。美国信息技术板块多头与空头敞口之比从6月初的2.14降至1.50，创高盛这组数据自2016年开始统计以来最低。\n3）同期仍有人申购科技基金。 美银11月12日《The Flow Show》引用的EPFR数据显示，截至11月11日的一周全球股票基金净流入983亿美元，其中科技基金净流入89亿美元。基金客户可以继续申购，但主动经理也可以把组合里的科技权重往下调。（见引用的推文）\n核心就是主动性资金在撤退。\n怎么看这几个数据呢？\n高盛客户的科技多空比已经很低，利好消息容易触发回补。美银更广泛的全球经理样本仍然净超配科技，后续也还有减仓空间。 一波有力度的反弹与长线资金继续调整仓位，完全可能出现在同一周期。\n仓位已经为反弹创造了条件，反弹能走多远取决于投资回报。\n中长期还是看周一梳理美银最新一期Flow Show的推文最后部分核心三个层面：\n1）油价/通胀走势；\n2）新的政治生态下AI政策会比预期的还要收紧还是会柔和些；\n3）AI商业化是不是继续处于加速状态。\n核心逻辑是，如果美伊能缓和、俄乌也能结束，油价下来通胀才会下来，市场才会预期利率更宽松，否则又要担心明年上半年联储会继续收紧。\n现在科技杀的这么猛、就是预期新国会生态带来AI基建的大放缓，那就要看明年实际力度比预期的更猛还是更弱。如果民主党搞事力度比现在预期更猛，即使通胀下来了，科技也很难受。但如果比现在预期柔和一些，市场情绪则又起来。\n而AI商业化则是最底层的逻辑支撑：最近大科技还算比较抗跌支撑指数，是因为市场认为政策再收紧他们还是能扛的，如果数据中心放缓大云厂手里的算力稀缺，但根源还是因为云业务增速在加速中，他们能撑的住。真要大幅度降速，那么通胀好转、政策缓和，也都带不动。","en":"最新的美银全球基金经理调查，几个要点：1）基金经理对科技股的热情正在快速消退。调查显示科技股超配比例从10月的净37%降至净12%（见图一），降幅为2006年6月以来最大，超过2008年金融危机、2022年加息周期和今年“对等关税日4月2日”时的任何一次。\n目前科技股仓位已低于长期均值约半个标准差（下图2）\n2）在最大尾部风险票选中，\"AI泡沫\"以34%位居第一，\"AI超大规模运营商信用事件\"以31%紧随其后。两项合计65%，意味着市场上三分之二的资金管理者将AI视为当前股市和信用市场的最大威胁。相比之下，10月的头号风险是债券收益率无序上行。（下图3）\n3）在最可能引发系统性信用事件的来源中，38%的受访者指向AI超大规模运营商债券，30%指向私人信贷。（下图4）\n而在企业应优先怎样使用现金流这一问题里，参与调查的基金经理中42%选择选改善资产负债表、33%选回馈股东、16%选增加资本开支。\n4）现金持仓比例从3.9%降至3.6%，为8月以来最低，处于长期均值以下1.9个标准差的位置。按照美银的\"现金规则\"，当现金比例处于或低于4.0%时，构成全球股市的反向卖出信号。\nHartnett在调查发布前就写过，若现金升破4.2%、经济繁荣预期明显减弱，仓位对市场的压力就会减轻。实际结果是现金降至3.6%，仍落在他认为恐惧不足的区域。\n减仓速度很极端，减仓后的仓位仍有余量。 单月下降25个百分点，超过了2008年金融危机、2022年加息调整以及2025年4月关税冲击期间任何一个月的降幅。但减仓后，科技股仍为净超配，只比自身长期均值低约半个标准差。美银历史上看到的较好科技股入场机会，通常出现在受访者已转为净低配的时候。\n结合最近的几个不同的数据来看这一轮调整资金上是对冲基金先减仓、长线经理随后跟进。能从数据中确认的是，至少三类记录都出现了科技风险下降的迹象，但交易行为各有不同。\n1）德鲁肯米勒的三季度持仓显示，他在AI硬件内部做了很大的取舍。\n2）高盛Prime看到了先降杠杆、再卖反弹。 11月第一周，其美国基本面股票多空基金客户的总杠杆下降8.7个百分点至207.5%，是2020年3月以来最大单周降幅。随后一周，芯片股出现4月以来最强反弹，这批资金仍在卖科技。美国信息技术板块多头与空头敞口之比从6月初的2.14降至1.50，创高盛这组数据自2016年开始统计以来最低。\n3）同期仍有人申购科技基金。 美银11月12日《The Flow Show》引用的EPFR数据显示，截至11月11日的一周全球股票基金净流入983亿美元，其中科技基金净流入89亿美元。基金客户可以继续申购，但主动经理也可以把组合里的科技权重往下调。（见引用的推文）\n核心就是主动性资金在撤退。\n怎么看这几个数据呢？\n高盛客户的科技多空比已经很低，利好消息容易触发回补。美银更广泛的全球经理样本仍然净超配科技，后续也还有减仓空间。 一波有力度的反弹与长线资金继续调整仓位，完全可能出现在同一周期。\n仓位已经为反弹创造了条件，反弹能走多远取决于投资回报。\n中长期还是看周一梳理美银最新一期Flow Show的推文最后部分核心三个层面：\n1）油价/通胀走势；\n2）新的政治生态下AI政策会比预期的还要收紧还是会柔和些；\n3）AI商业化是不是继续处于加速状态。\n核心逻辑是，如果美伊能缓和、俄乌也能结束，油价下来通胀才会下来，市场才会预期利率更宽松，否则又要担心明年上半年联储会继续收紧。\n现在科技杀的这么猛、就是预期新国会生态带来AI基建的大放缓，那就要看明年实际力度比预期的更猛还是更弱。如果民主党搞事力度比现在预期更猛，即使通胀下来了，科技也很难受。但如果比现在预期柔和一些，市场情绪则又起来。\n而AI商业化则是最底层的逻辑支撑：最近大科技还算比较抗跌支撑指数，是因为市场认为政策再收紧他们还是能扛的，如果数据中心放缓大云厂手里的算力稀缺，但根源还是因为云业务增速在加速中，他们能撑的住。真要大幅度降速，那么通胀好转、政策缓和，也都带不动。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXZgWD2b0AE0v0C.jpg?name=orig","https://pbs.twimg.com/media/HXZgWD8bUAAP46M.jpg?name=orig","https://pbs.twimg.com/media/HXZgWD3aMAADZ-0.jpg?name=orig","https://pbs.twimg.com/media/HXZgWDyagAAqZLy.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122993645234311502","l":[],"ln":[],"t":["美联储","通胀","原油能源","AI科技","关税贸易"],"lk":11,"rt":2,"rp":5,"vw":3185},{"id":"2122993272226226658","h":"bbcchinese","ts":1794996014,"zh":"美国时隔26年失去麻疹消除状态，今年病例达5400例、死亡10人，创1990年代以来新高。“疫苗怀疑论”持续遭到质疑。","en":"美国时隔26年失去麻疹消除状态，今年病例达5400例、死亡10人，创1990年代以来新高。“疫苗怀疑论”持续遭到质疑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122993272226226658","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4jn1xiy","d":"bbc.in"}],"t":[],"lk":2,"rt":0,"rp":1,"vw":2884},{"id":"2122991800063521226","h":"yijiangren","ts":1794995663,"zh":"目前全服第三\n欢迎成为500个创世中的一员\n我们群友还挺感兴趣的\n@togetherdotfun 什么时候出来简体中文\n大家都在问","en":"目前全服第三\n欢迎成为500个创世中的一员\n我们群友还挺感兴趣的\n@togetherdotfun 什么时候出来简体中文\n大家都在问","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXZeg8Zb0AAA5h6.jpg?name=orig","https://pbs.twimg.com/media/HXZhj9NaoAAs6Za.png?name=orig","https://pbs.twimg.com/media/HXZhmU_aYAAOgkD.png?name=orig"],"u":"https://x.com/yijiangren/status/2122991800063521226","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":469},{"id":"2122990209021403559","h":"cnfinancewatch","ts":1794995283,"zh":"周末，星桥学院华尔街观察闭门研讨会：\n美国债务危机和利率困局已经到了临界点，手里死拿单一法币现金，购买力只会被无情稀释。\n人工智能正在剧烈重塑商业版图，但技术狂热背后藏着巨大的资本泡沫与洗牌风险。\n欧洲深陷结构性泥潭，中美博弈进入深水区，地缘摩擦已经成为全球资产定价的最大变量。\n大时代转折的时候，最可怕的不是危机本身，而是用昨天的地图去走明天的路。\n关注纪要：","en":"周末，星桥学院华尔街观察闭门研讨会：\n美国债务危机和利率困局已经到了临界点，手里死拿单一法币现金，购买力只会被无情稀释。\n人工智能正在剧烈重塑商业版图，但技术狂热背后藏着巨大的资本泡沫与洗牌风险。\n欧洲深陷结构性泥潭，中美博弈进入深水区，地缘摩擦已经成为全球资产定价的最大变量。\n大时代转折的时候，最可怕的不是危机本身，而是用昨天的地图去走明天的路。\n关注纪要：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122990209021403559","l":["macaostarbridge.com"],"ln":[{"u":"http: 1.22万手、量比0.88，OI在增加但量能未明确确认，暂不定性。30年期美债价涨OI降约4.78万手，属空头回补。原油价跌OI降约1.38万手，属多头离场；黄金、铜、白银同样是价跌OI降，黄金和铜的量能口径还降了级，先按多头离场看、量能不可完全核对。比特币期货价涨OI降，属空头回补。今天盘前期指只是高开后收窄，原油现价约83.99、黄金期货约3777，继续偏弱，还看不到新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨8.25%、 $FIW 涨7.56%、 $PHO 涨7.24%、 $AGNG 涨5.39%、 $ITB 涨5.05%、 $IHI 涨4.92%、 $IHE 涨4.77%、 $XLP 涨4.23%、 $XLU 涨3.68%、 $KIE 涨3.09%。5日窗口几乎只剩 $XLE 涨1.85%、 $XLP 涨0.47%还在正值。能源是典型的仅5日脉冲，20日仍跌6.78%，慎追。必选消费是目前唯一还算双窗口同现的大类，但美股 $XLP 距20日高只差2.21%，5日涨幅已经缩到0.47%；公用事业昨天还在双窗口，今天5日已经翻到跌0.71%，变成仅20日。A股这边以今天收盘计，消费50ETF涨10.90%、消费ETF涨7.61%、酒ETF涨7.58%、银行ETF涨6.03%，消费和银行都是双窗口同现，而且已经走到20日区间90%以上，映射还在，只是位置高了，不追。住宅建筑是仅20日： $ITB 20日涨5.05%，但5日跌4.64%，距20日高11.66%；A股房地产ETF20日跌9.18%，映射没有启动。医疗器械和制药是仅20日， $IHI 5日跌1.95%，距20日高7.13%，量比只有0.58，等放量；A股纳指生物科技ETF20日涨2.63%、5日跌5.03%，对得不齐。半导体现状仍是双窗口都弱， $SOXX 20日跌15.13%、5日跌3.50%；A股芯片ETF今天收涨约2.3%，只是超跌反弹，20日仍跌7%左右，不构成共振。\n#三个方向\n一是 #必选消费 ，中美双窗口同现，但美股已经走在区间上沿，只作为防守框架，不在这里追高开仓。二是 #大盘消费科技龙头 ，只认 #苹果 这种低波动、仍靠近前高的品种，期权方向这轮不如昨天干净，仓位继续克制。三是 #制药与医疗器械 观察， $IHE 20日涨4.77%、距20日高3.58%， $IHI 还在回调， $TEVA 有FDA加分但位置不到，都不追。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.26失效，半仓。\n #梯瓦制药 $TEVA ，区间中上部，距20日高4.58%，FDA居家适应症和偏多的P/C是加分项，但位置不够突破，放量站上44.57再看，跌破周线十日均线41.52失效，仅观察。\n #太空探索科技 $SPCX ，箱体中部，位置47%，刚回到20日均线附近，ARK两只基金同买还在。站上均线后还要看能否放量离开中部，跌破周一低点135失效，仅观察。\n #Nutex Health $NUTX ，箱底，位置14%，周二长下影收阳，特别股息和双重上市是事件，但没有期权和机构持仓核验，不进只做。放量站上186.26（周线二十日均线）再看，跌破166.08失效，仅观察。\n #HubSpot $HUBS ，距颈线约26%，内部人买入属实，但周二中阴把涨幅吐掉，不构成突破准备。放量站上217.94再看，跌破188.25失效，仅观察。\n #菲利普斯66 $PSX ，箱体下部，位置30%，五日还在反弹，但周二已转弱，距20日均线267.63还有距离，仅观察，跌破近期低点253.74失效。\n#小盘阿尔法\n本期不选。 $NUTX 市值约11.6亿美元，位置是箱底，但事件只是特别股息，期权和13F都没有核到，先不选。 $HUBS 市值约113亿美元，不算小盘，位置也还不够。","en":"#资金面\nARK方面，最新能核到的公开交易仍是周一（11月16日）。两只及以上基金同买的主要是这几只： #太空探索科技 $SPCX 获ARKK与ARKW同买，合计约5190万美元，金额最大； $XYZ 获ARKK与ARKW同买，合计约2310万美元； #Shopify $SHOP 获ARKK、ARKW与ARKF三只基金同买，合计约1650万美元； $LUNR 获ARKX与ARKQ同买，合计约390万美元。同一天ARKK与ARKW合计卖出约8480万美元的英伟达。这些同买标的的位置都不在突破准备或箱底右侧： $SPCX 周二涨3.16%收到141.70，刚回到20日均线141.27附近，仍在区间47%； $XYZ 和 $SHOP 五日继续回撤，先观察。\n带方向的期权里，没有特别干净的多头共振。 #苹果 最大C "m":[],"u":"https://x.com/cnfinancewatch/status/2122988418233974860","l":[],"ln":[],"t":["美股","原油能源","AI科技","黄金"],"lk":0,"rt":0,"rp":0,"vw":261},{"id":"2122988411543785979","h":"cnfinancewatch","ts":1794994855,"zh":"美股盘前下午版｜2026年11月18日 周三 北京时间15:05\n#结论\n今日大类只做两个：必选消费的低波动防守，和大盘消费科技龙头。只做名单仍只给一只，第二、第三个位置空着。候选里能同时过技术位置的，还是靠近前高的苹果；医药事件票和箱底小盘都还没有走到可以开仓的位置。\n #苹果 $AAPL 周二收351.91，跌0.25%，距20日高也是52周高360.83还有2.53%，处在近20日区间75%的位置。比周一的2.28%又远了一点，已经略宽于通常的2%门槛，仍按回撤后的突破准备来看，不突破不进。期权最大Call行权价355，距现价只差0.63%，量仓比18.41，Call持仓增仓4.6%，但这边Put持仓也增了5.8%，做空余额环比升10%，算不上干净的多头共振。卖方目标价均值343.2低于现价，近四周EPS下修16家、上修9家，只给半仓。\n明确不做：半导体和AI硬件先看今夜开盘再定价，不追盘后跳空。 #英伟达 $NVDA 周二收155.46，仍在20日区间底部附近，位置大约只有9%；已经大涨或五日涨幅过大的品种；只有股息、没有资金共振的票；ARK同买但还在箱体中下部、未见右侧的，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指高开幅度已经收窄。纳指期货27242，较周二结算约27075涨约0.62%；标普期货7379，涨约0.28%；道指期货50865，涨约0.10%。早盘亚洲时段纳指期货一度更高，随后回吐了大半。周二美股继续下跌，纳指收24328.38，跌0.74%；标普7340.53，跌1.03%；道指50759.42，跌1.64%，都是四连跌。VIX升至25.46。A股今天收盘，上证3587.83涨0.09%，创业板2311.62涨0.85%，科创50收1247.99，涨2.19%。日经收59024点，涨0.28%；韩国综指5067点，涨1.99%，守住5000点。\n #英伟达 周二盘后交出换帅后第一份三季报：营收1158亿美元，同比增103%，高于市场约1089亿美元的预期；数据中心1076亿美元；非GAAP每股收益2.68美元，高于约2.47美元的预期。第四季度营收指引中值1300亿美元，上下3%，也高于华尔街预期。毛利率指引下调到71%到72%，公司把这说成低点，并且指引不含中国数据中心计算收入。董事会主席表态不打算让黄仁勋复职，黄本人说如果董事会认为符合利益，愿意回归。他已同意出席参议院银行委员会听证会，日期尚未敲定。浑水在财报前宣布做空，质疑前高管关联及对华销售，身份和细节仍待证实。盘后股价一度到约162.56，涨约4.6%，随后有所回吐。截稿时尚未取得完整的盘前报价。\n今晚美股盘前还有 #劳氏 $LOW 、 $TJX 出季报，盘后是 $PANW 。明天盘前有 #沃尔玛 $WMT 和 #阿里巴巴 $BABA 。Anthropic计划周三定价、周四以 $ANT 在纳斯达克挂牌。WTI原油现报约83.99美元，较周二收盘86.01再跌约2.4%。10年期美债收益率周二收5.103%，美元指数约103.70，仍靠近近期高位。 #家得宝 $HD 周二收339.01，跌2.45%； #迪士尼 $DIS 收116.94，跌1.48%，财报后的回吐在常规交易里落地了。\n高权重事件里， #梯瓦制药 $TEVA 的IGALMI已获FDA批准，可用于部分成人急性激越的居家治疗，事件权重大，期权P/C成交比0.29也偏多。但周二只收42.62，涨0.12%，距20日高44.57还有4.58%，处在区间64%，位置不够突破，只观察。 #Nutex Health $NUTX 宣布每股2美元特别股息，并获纳斯达克双重上市批准，市值约11.6亿美元，周二收174.51，涨2.83%，处在近20日区间14%，箱底有长下影，但事件落在股息档，期权和13F都没有核到，不进只做。 #HubSpot $HUBS 内部人Halligan（董事）11月13日约500万美元买入22985股，均价约217.44美元，16日披露；但周二倒跌6.76%，收216.30，距颈线还有约26%，只观察。\n#研报面\n #苹果 卖方均值目标价343.2美元，买入15家、持有8家、卖出6家，目标价低于现价，近四周EP ，外加白电龙头自己创新高。美股指期货已经把早盘涨幅吐掉大半，黄金和原油继续回落，尾盘不宜把科创50的反弹理解成风险偏好已经修复。\n#消息面\n隔夜英伟达财报营收和指引都高于预期，常规交易仍收155.46美元、跌0.44%，盘后一度涨约4%至5%。浑水在财报前宣布做空的扰动还在，四季度毛利率指引下调到71%至72%，且指引不含中国数据中心计算收入，开盘并没有把这些折干净。盘中三星电机宣布与英伟达加强合作，范围扩到MLCC；国内有媒体转述\n#中际旭创 $300308 订单能见度延伸到2028年、 #新易盛 $300502\n的1.6T持续放量，但两只股票分别只涨0.12%、跌1.21%，仍在20日低位附近，消息盖不住位置。11月17日工信部批准半导体设备与零部件质量管理体系行业标准，对已经过认证的设备商更有利，帮了制造和设备的忙。\n风格上，小家电和短剧继续出清。 #九阳股份 $002242 走出天地板，午后跌9.99%，换手超过20%，主力净流出约7.5亿元；\n#长虹美菱 $000521 早盘一字后炸板，现只涨0.21%。 #文投控股 $600715 、 #横店影视 $603103 跌停，\n#凯撒文化 $002425 跌9.89%。证监会午间回应，网传“要求基金公司上报全部产品AI敞口”不实；另有“国常会表态不再频繁救市”的传言也被澄清为谣言。北向资金当日净流入仍不披露。\n#研报面\n今天更贴盘面的是华龙证券电子行业三季报综述，认为半导体自主可控加速兑现；万联证券称三季度基金持仓向IT基础设施、软件和网络安全倾斜。这些报告解释了为什么设备和制造能扛住，但盖不住半导体ETF\n5日、20日仍在下跌。太平洋今天继续买入 #晶晨股份 $688099 、 #全志科技 $300458\n，逻辑是端侧AI，只作观察。中银证券点评10月社零同比只增0.4%、增幅回落，对必选消费是提醒，不是推翻。17日华鑫对 #特锐德\n$300001 、 #明阳电气 $301291 的买入，以及太平洋对检测设备和光刻胶的覆盖，仍当作事件背景。\n#热榜\n东财人气榜前排是 #九阳股份 $002242 、 #华胜天成 $600410 、 #常山北明 $000158 、 #有研新材 $600206\n、 #中际旭创 $300308 、 #长虹美菱 $000521 、 #北纬科技 $002148 、 #华东重机 $002685\n。九阳和美菱还在前十，已经是杀估值而不是进攻；华胜天成、华东重机、卡莱特是算力租赁连板的拥挤端。 #沪电股份 $002463\n升到前二十附近，和PCB反弹同向，但20日仍跌7%以上，热度不等于位置修复。同花顺热榜本档数据缺失。\n#资金面\n东财口径，截至约14:35，沪市主力净流出约34.4亿元，深市净流出约47.4亿元，两市合计约流出82亿元；科创50却净流入约37.1亿元，资金明显在指数内部搬家。行业上电子净流入约95亿元，半导体约43亿元，元件约43亿元，印制电路板约42亿元，通信约34亿元，半导体设备约18.6亿元，集成电路制造约11亿元。流出端是有色金属约38.5亿元、医药约32.4亿元、银行约23.5亿元、传媒约22.7亿元、电力设备约17.2亿元、家用电器约13.7亿元。个股上\n#沪电股份 $002463 净流入约11.9亿元， #寒武纪 $688256 、 #华虹公司 $688347 、 #华工科技 $000988\n、 #工业富联 $601138 、 #北方华创 $002371 承接明显； #紫金矿业 $601899 、 #九阳股份 $002242 、\n#有研新材 $600206 则在流出前排，有研新材涨5.4%却净流出约5.8亿元，是高位换手。南向额度显示沪、深各用满420亿元上限，只反映额度状态。融资余额仍是截至11月17日再减186.04亿元至22097.71亿元，没有盘中新数。跌停池接口只返回约38只的数量、未给出完整名单，跌停家数按此口径标注。","en":"A股：\n截至14:35，上证跌0.15%报3579.33点，深证跌0.10%报10628.37点，创业板翻红涨0.35%报2300.27点，科创50涨1.80%报1243.15点，是今天最清楚的主线。两市成交约1.24万亿元，上涨约1144只、下跌约4124只，涨停40只、跌停约38只。早盘给英伟达财报定价的高开，午后只在半导体制造、设备和算力租赁上留下差价；银行和电力走平，小家电和短剧继续兑现。盘面不是全面反攻，更像科技内部的事件反弹，外加白电龙头自己创新高。美股指期货已经把早盘涨幅吐掉大半，黄金和原油继续回落，尾盘不宜把科创50的反弹理解成风险偏好已经修复。\n#消息面\n隔夜英伟达财报营收和指引都高于预期，常规交易仍收155.46 位置不到，都不追。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.26失效，半仓。\n #梯瓦制药 $TEVA ，区间中上部，距20日高4.58%，FDA居家适应症和偏多的P/C是加分项，但位置不够突破，放量站上44.57再看，跌破周线十日均线41.52失效，仅观察。\n #太空探索科技 $SPCX ，箱体中部，位置47%，刚回到20日均线附近，ARK两只基金同买还在。站上均线后还要看能否放量离开中部，跌破周一低点135失效，仅观察。\n #Nutex Health $NUTX\n，箱底，位置14%，周二长下影收阳，特别股息和双重上市是事件，但没有期权和机构持仓核验，不进只做。放量站上186.26（周线二十日均线）再看，跌破166.08失效，仅观察。\n #HubSpot $HUBS ，距颈线约26%，内部人买入属实，但周二中阴把涨幅吐掉，不构成突破准备。放量站上217.94再看，跌破188.25失效，仅观察。\n #菲利普斯66 $PSX ，箱体下部，位置30%，五日还在反弹，但周二已转弱，距20日均线267.63还有距离，仅观察，跌破近期低点253.74失效。\n#小盘阿尔法\n本期不选。 $NUTX 市值约11.6亿美元，位置是箱底，但事件只是特别股息，期权和13F都没有核到，先不选。 $HUBS\n市值约113亿美元，不算小盘，位置也还不够。\n#操作提示\n英伟达的数字过了，但完整日线还没有走出来，今夜开盘先看跳空能不能站住，不提前把AI硬件改回主方向。苹果仍是贴着前高的半仓突破单，不突破就不进，跌破失效位当天走。期指涨幅已经比早盘收窄，若开盘重新转弱，这张单继续推迟。箱底和中部的\n$NUTX 、 $SPCX 只看到企稳或回到均线，不猜右侧。今晚还有零售相关财报，先看完再动手。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#三个方向\n一是 #必选消费 ，中美双窗口同现，但美股已经走在区间上沿，只作为防守框架，不在这里追高开仓。二是 #大盘消费科技龙头 ，只认 #苹果\n这种低波动、仍靠近前高的品种，期权方向这轮不如昨天干净，仓位继续克制。三是 #制药与医疗器械 观察， $IHE\n20日涨4.77%、距20日高3.58%， $IHI 还在回调， $TEVA 有FDA加分但位置不到，都不追。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.26失效，半仓。\n #梯瓦制药 $TEVA ，区间中上部，距20日高4.58%，FDA居家适应症和偏多的P/C是加分项，但位置不够突破，放量站上44.57再看，跌破周线十日均线41.52失效，仅观察。\n #太空探索科技 $SPCX ，箱体中部，位置47%，刚回到20日均线附近，ARK两只基金同买还在。站上均线后还要看能否放量离开中部，跌破周一低点135失效，仅观察。\n #Nutex Health $NUTX\n，箱底，位置14%，周二长下影收阳，特别股息和双重上市是事件，但没有期权和机构持仓核验，不进只做。放量站上186.26（周线二十日均线）再看，跌破166.08失效，仅观察。\n #HubSpot $HUBS ，距颈线约26%，内部人买入属实，但周二中阴把涨幅吐掉，不构成突破准备。放量站上217.94再看，跌破188.25失效，仅观察。\n #菲利普斯66 $PSX ，箱体下部，位置30%，五日还在反弹，但周二已转弱，距20日均线267.63还有距离，仅观察，跌破近期低点253.74失效。\n#小盘阿尔法\n本期不选。 $NUTX 市值约11.6亿美元，位置是箱底，但事件只是特别股息，期权和13F都没有核到，先不选。 $HUBS\n市值约113亿美元，不算小盘，位置也还不够。\n#操作提示\n英伟达的数字过了，但完整日线还没有走出来，今夜开盘先看跳空能不能站住，不提前把AI硬件改回主方向。苹果仍是贴着前高的半仓突破单，不突破就不进，跌破失效位当天走。期指涨幅已经比早盘收窄，若开盘重新转弱，这张单继续推迟。箱底和中部的\n$NUTX 、 $SPCX 只看到企稳或回到均线，不猜右侧。今晚还有零售相关财报，先看完再动手。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/SYU77996/status/2122980405540180224","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议" EC）峰会期间会面，这场围绕黄仁勋的风波，是否会为“特习会”增添新的变数？","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122945730600218624/vid/avc1/720x1280/Dv_BoAjCxijazoAK.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2122978127433633945","l":[],"ln":[],"t":["AI科技"],"lk":8,"rt":1,"rp":4,"vw":4968},{"id":"2122978128943603987","h":"nytchinese","ts":1794992403,"zh":"中美围绕人工智能的紧张局势加剧：人工智能的进步已成为中美经济和军事竞争的焦点，但两国对人工智能带来的最大风险有不同看法。黄仁勋事件和间谍指控更加剧了华盛顿和北京在这一问题上的互不信任。","en":"中美围绕人工智能的紧张局势加剧：人工智能的进步已成为中美经济和军事竞争的焦点，但两国对人工智能带来的最大风险有不同看法。黄仁勋事件和间谍指控更加剧了华盛顿和北京在这一问题上的互不信任。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2122978128943603987","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/usa/20261118/trump-china-ai-tensions/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":4,"rt":1,"rp":4,"vw":3750},{"id":"2122977436241649818","h":"fxtrader","ts":1794992238,"zh":"雷军表示，明年小米汽车正式出海。汽车是很多国家的支柱产业，跟当地的供应链合作，能够使产品更好地为当地的消费者服务。","en":"雷军表示，明年小米汽车正式出海。汽车是很多国家的支柱产业，跟当地的供应链合作，能够使产品更好地为当地的消费者服务。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2122977436241649818","l":[],"ln":[],"t":[],"lk":10,"rt":1,"rp":3,"vw":5084},{"id":"2122975275650850914","h":"fxtrader","ts":1794991723,"zh":"特朗普专机抵达深圳。","en":"特朗普专机抵达深圳。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXZStlRbMAEuH-b.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122975275650850914","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":0,"vw":923},{"id":"2122974976521506831","h":"wufantouzi","ts":1794991652,"zh":"腾讯营收竟然不及预期\n但主业现金流健康\n广告收入依然强劲\n传统业务的经营净利润其实还在涨\n但短期被超预期 AI 资本开支\n腾讯确实在加速砸AI了\n财报对短期股价不利\n但不投入AI早晚也是要死的\n投入AI还有一线生机\n马化腾不想做网易搜货就得冲Ai","en":"腾讯营收竟然不及预期\n但主业现金流健康\n广告收入依然强劲\n传统业务的经营净利润其实还在涨\n但短期被超预期 AI 资本开支\n腾讯确实在加速砸AI了\n财报对短期股价不利\n但不投入AI早晚也是要死的\n投入AI还有一线生机\n马化腾不想做网易搜货就得冲Ai","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2122974976521506831","l":[],"ln":[],"t":["AI科技","财报"],"lk":2,"rt gpt/status/2122934039925670201","l":[],"ln":[],"t":["财报"],"lk":1,"rt":0,"rp":0,"vw":140},{"id":"2122932822931575289","h":"nytchinese","ts":1794981601,"zh":"间谍丑闻、贸易失衡：习近平的APEC“高光”会否蒙尘？习近平希望通过峰会展示中国的科技雄心，证明中国的增长可以惠及世界。但黄仁勋丑闻和对北京的间谍指控可能会转移外界的注意力，中国也需要缓解其他国家的贸易担忧。","en":"间谍丑闻、贸易失衡：习近平的APEC“高光”会否蒙尘？习近平希望通过峰会展示中国的科技雄心，证明中国的增长可以惠及世界。但黄仁勋丑闻和对北京的间谍指控可能会转移外界的注意力，中国也需要缓解其他国家的贸易担忧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2122932822931575289","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/china/20261118/xi-apec/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["关税贸易"],"lk":0,"rt":1,"rp":0,"vw":701},{"id":"2122931447434756480","h":"tig88411109","ts":1794981273,"zh":"你问我支持不支持，我肯定支持。因为我知道英伟达可能对于黄仁勋的重要性，在他自己所有的亲人之上，宛如长子。\n真回来，反而是风险。我独家给你答疑解惑\n但是任何市场小作文或者一厢情愿他能回来，都是不切实际。首先法律也不容许，股东没有投票权来换CEO，要换就要现在的董事会同意，但是大概率不可能。\n因为现在董事会里面独立董事最怕就是连带的法律责任，让老黄再回来，不谈间谍，就是内部乱搞关系，他自己今天离职，明天你们又让他回来，说明内控失灵，一定引起重大连带诉讼，都要这个独董个人承担\n而且老黄位置坐长了，内部一定不是“一个声音”，现在真回来反而加速内部割裂。现在已经开始公司的估值和故事，往AI核心企业的二次转型，从创始人邪修到系统制度化垄断王者的路子上走，估值降低很正常，只要能未来2/3年利润增长，再长期，谁也看不到。如果再强势回归，这种个人失控和治理风险挥之不去，反而估值混乱。\n能不能回，当然可能。只要3%的股东投票把董事会目前2/3董事换一遍，虽然老黄自己有3.5%可以提名，但2/3以上股东的票数门槛，都是机构投资者，这些机构重要的是合规底线，现在财报没问题，短期基本面也看不到问题，有什么理由换董事会？机构投资者不会冒自己风险，为一个“上下级不正常关系和涉间谍活动”的老黄砸自己饭碗。\n而且真的投票权大战，所有内部信息都摊开，内部割裂，外部小作文，真损失第一是黄仁勋自己1400亿的股票市值，他会干么，另立山头？\n所以真正的投资可能的路线，就是祈祷黄仁勋好好反思享受家人之乐，配合国安调查，公司选出新的CEO行业大佬，做好切割和赔偿和解，估值没了创始人溢价，至少业绩和情绪平稳，回到我说的估值区间。","en":"你问我支持不支持，我肯定支持。因为我知道英伟达可能对于黄仁勋的重要性，在他自己所有的亲人之上，宛如长子。\n真回来，反而是风险。我独家给你答疑解惑\n但是任何市场小作文或者一厢情愿他能回来，都是不切实际。首先法律也不容许，股东没有投票权来换CEO，要换就要现在的董事会同意，但是大概率不可能。\n因为现在董事会里面独立董事最怕就是连带的法律责任，让老黄再回来，不谈间谍，就是内部乱搞关系，他自己今天离职，明天你们又让他回来，说明内控失灵，一定引起重大连带诉讼，都要这个独董个人承担\n而且老黄位置坐长了，内部一定不是“一个声音”，现在真回来反而加速内部割裂。现在已经开始公司的估值和故事，往AI核心企业的二次转型，从创始人邪修到系统制度化垄断王者的路子上走，估值降低很正常，只要能未来2/3年利润增长，再长期，谁也看不到。如果再强势回归，这种个人失控和治理风险挥之不去，反而估值混乱。\n能不能回，当然可能。只要3%的股东投票把董事会目前2/3董事换一遍，虽然老黄自己有3.5%可以提名，但2/3以上股东的票数门槛，都是机构投资者，这些机构重要的是合规底线，现在财报没问题，短期基本面也看不到问题，有什么理由换董事会？机构投资者不会冒自己风险，为一个“上下级不正常关系和涉间谍活动”的老黄砸自己饭碗。\n而且真的投票权大战，所有内部信息都摊开，内部割裂，外部小作文，真损失第一是黄仁勋自己1400亿的股票市值，他会干么，另立山头？\n所以真正的投资可能的路线，就是祈祷黄仁勋好好反思享受家人之乐，配合国安调查，公司选出新的CEO行业大佬，做好切割和赔偿和解，估值没了创始人溢价，至少业绩和情绪平稳，回到我说的估值区间。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tig88411109/status/2122931447434756480","l":[],"ln":[],"t":["AI科技","财报"],"lk":4,"rt":1,"rp":1,"vw":1109},{"id":"2122931202688745687","h":"dmjk001","ts":1794981215,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXYqlv7aMAAyA0Z.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122931202688745687","l":[],"ln":[],"t":[],"lk":2,"rt":1,"rp":0,"vw":1047},{"id":"2122930292835127323","h":"fxtrader","ts":1794980998,"zh":"中国上市公司协会承办的“资本市场辟谣平台”，今日发文辟谣，称近日关于“国常会上有人表态不会再频繁救市了”相关信息为谣言，系编造会议内容、歪曲炒作政策，严重扰乱资本市场预期，影响极其恶劣。","en":"中国上市公司协会承办的“资本市场辟谣平台”，今日发文辟谣，称近日关于“国常会上有人表态不会再频繁救市了”相关信息为谣言，系编造会议内容、歪曲炒作政策，严重扰乱资本市场预期，影响极其恶劣。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXYplDebsAAkt-k.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122930292835127323","l":[],"ln":[],"t":[],"lk":8,"rt":1,"rp":3,"vw":3203},{"id":"2122928657752633845","h":"Kay2289123","ts":1794980608,"zh":"这次黄仁勋回来继续做CEO 悬了！\n11 月 17 日，董事会明确表示没有请黄仁勋回来当 CEO 的打算。有传闻称，黄仁勋正在考虑另起炉灶，再办一家芯片公司。如果真干，老黄说不定第一天就能融到几百亿美元。公司仍由他自己说了算，想做什么，就能放手去做。凭他几十年攒下的人脉，台积电的关系，一批追随他的工程师\n@grok，你觉得老黄真能融到几百亿美元，提前拿下大客户，做出一家能跟英伟达掰手腕的公司吗？或者有可能加入 @elonmusk 的 terafab 吗概率有多大\n这对 $NVDA 是一片笼罩在头顶的乌云","en":"这次黄仁勋回来继续做CEO 悬了！\n11 月 17 日，董事会明确表示没有请黄仁勋回来当 CEO 的打算。有传闻称，黄仁勋正在考虑另起炉灶，再办一家芯片公司。如果真干，老黄说不定第一天就能融到几百亿美元。公司仍由他自己说了算，想做什么，就能放手去做。凭他几十年攒下的人脉，台积电的关系，一批追随他的工程师\n@grok，你觉得老黄真能融到几百亿美元，提前拿下大客户，做出一家能跟英伟达掰手腕的公司吗？或者有可能加入 @elonmusk 的 terafab 吗概率有多大\n这对 $NVDA 是一片笼罩在头顶的乌云","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXYnf7RboAAyD68.jpg?name=orig"],"u":"https://x.com/Kay2289123/status/2122928657752633845","l":[],"ln":[],"t":["AI科技"],"lk":4,"rt":0,"rp":4,"vw":2056},{"id":"2122927024423698673","h":"dmjk001","ts":1794980219,"zh":"资本市场辟谣平台：“国常会上有人表态不会再频繁救市了”系谣言\n据资本市场辟谣平台消息，近日，互联网上  on Wednesday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122917874582925384","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/south-korea-hopes-work-with-china-peace-korean-peninsula-president-says-2026-11-18/?taid=6afd30f57d7c310001eef72f&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":286},{"id":"2122912677014159546","h":"CrushTheShorts","ts":1794976798,"zh":"这么久才知道，原来九阳大帝是国产GPU 龙一\n豆浆机高速破壁\nGrain Processing Unit\n谷物处理单元\n简称 GPU","en":"这么久才知道，原来九阳大帝是国产GPU 龙一\n豆浆机高速破壁\nGrain Processing Unit\n谷物处理单元\n简称 GPU","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2122912677014159546","l":[],"ln":[],"t":[],"lk":10,"rt":0,"rp":3,"vw":1372},{"id":"2122912292610449855","h":"cnfinancewatch","ts":1794976707,"zh":"华尔街观察｜AI已经捆绑美股纳指合标普，泡沫迎来精准崩盘时刻\n核心暴论：#黄仁勋绝非被动离职，而是被顶级权力定点清除！ 他的永久离场，不是个人风波，而是全球科技权力洗牌的终极信号！当一个企业家构建出媲美主权大国GDP的跨国AI产业链联盟、足以制衡顶级地缘强权时，超强的个人能力、不受束缚的科技话语权，本身就是最大的原罪，本轮AI史诗级泡沫崩塌已成定局！\n市场始终在低估这场离职事件的致命性！坊间流传的芯片出口、私人风波全是烟雾弹，真实内核是权力忌惮。加拿大华裔学者蒋雪琴精准戳破真相：黄仁勋的离职，是行业、资本、地缘权力的联合围剿，且永久禁止回归，绝无翻盘可能。\n纵观全球商业史，从未有第二位企业家，能搭建出如此恐怖的超主权产业体系！黄仁勋一手缔造的英伟达生态，早已超越单一企业范畴：加州芯片设计、荷兰光刻机设备、东南亚产能增值、中国终端组装，串联起全球最精密的芯片供应链。他以个人极致的人脉、公信力与商业手腕，绑定台湾核心产业支柱，维系着全球AI算力的循环运转，这套产业链体量，足以媲美全球第五、第六大经济体GDP，形成独立于传统政治体系的科技商业联盟。\n更致命的是，他掌控着AI行业的生死命脉！独家搭建“芯片售卖+循环融资”的闭环生态，一手托举OpenAI、Anthropic等所有顶级AI巨头的生存根基。不同于依附资本、妥协权力的奥特曼，黄仁勋是纯粹的技术远见者，坚持开放创新、驱动行业迭代，拒绝沦为单一垄断权力的工具。\n正是这份不可替代、无法受控的绝对产业话语权，彻底触碰了顶级强权底线！在当下“劣币上位、能者出局”的畸形行业生态中，强权绝不允许出现游离于管控之外、足以制衡顶级帝国的科技力量。清除黄仁勋，本质是一场权力对科技的降维收割：扼杀个人超级影响力、拆解跨国产业联盟、锁死自主科技迭代空间，彻底将AI行业收归单一权力掌控。\n奥特曼可以被员工与资本迎回，因为他服从垄断规则；黄仁勋永不回归，因为他掌控的是真正的行业命脉与科技主权。随着他彻底离场，维系全球AI融资循环、供应链稳定、产业创新的唯一核心锚点彻底崩塌。\n产业链信任裂痕、合作摩擦激增、融资闭环断裂、技术迭代减速，所有隐患集中爆发！无需漫长等待，短期1-2个月内，叠加Anthropic IPO落地，全球AI超级泡沫将彻底破裂。本轮AI牛市从来不是纯粹的技术牛市，而是黄仁勋个人信用托举的泡沫，人走茶凉，信仰崩塌，AI行业的结构性寒冬，正式开启！\n#黄仁勋 #AI泡沫崩盘 #英伟达 #全球科技格局 #算力周期拐点","en":"华尔街观察｜AI已经捆绑美股纳指合标普，泡沫迎来精准崩盘时刻\n核心暴论：#黄仁勋绝非被动离职，而是被顶级权力定点清除！ 他的永久离场，不是个人风波，而是全球科技权 能环比下降约3个百分点。\n毛利率承压主要与两方面因素有关：\n一是内存价格上涨；\n二是新一代Rubin产品处于初期爬坡阶段，相关生产和供应链成本相对较高。\n这也意味着增长是有成本的。\n需要关注未来Rubin规模化出货后，毛利率能否逐步恢复。","en":"要说这次英伟达财报有瑕疵除了资本生态外（采购承诺和担保），应该就是毛利率的下降了。尽管下季收入指引强劲，但对第四财季毛利率的展望却相对谨慎。公司预计第四财季GAAP和非GAAP口径的毛利率分别为71%至72%，明显低于第三财季的74.8%和74.9%。\n这意味着毛利率可能环比下降约3个百分点。\n毛利率承压主要与两方面因素有关：\n一是内存价格上涨；\n二是新一代Rubin产品处于初期爬坡阶段，相关生产和供应链成本相对较高。\n这也意味着增长是有成本的。\n需要关注未来Rubin规模化出货后，毛利率能否逐步恢复。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXYPxZ_akAApjxj.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122911403451543973","l":[],"ln":[],"t":["AI科技","财报"],"lk":1,"rt":0,"rp":0,"vw":670},{"id":"2122911057807335507","h":"cnfinancewatch","ts":1794976412,"zh":"就这样，实现了奢侈品珠宝自由？","en":"就这样，实现了奢侈品珠宝自由？","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122362031563223040/vid/avc1/1080x1920/IVH7exMEHFLxLqfF.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2122911057807335507","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2122910244699304249","h":"fxtrader","ts":1794976218,"zh":"记者问：近日，发现互联网上传播“监管要求基金公司上报全部产品AI敞口”相关信息，请问这一情况是否属实？\n中国证监会新闻发言人答表示，该信息不属实。公募基金投资运作依照《证券投资基金法》等法律法规和基金合同约定进行，投资标的、投资比例由基金管理人按照基金合同和内部投资决策程序自主确定。中国证监会依法履行监管职责，未向基金管理人提出相关数据报送要求。","en":"记者问：近日，发现互联网上传播“监管要求基金公司上报全部产品AI敞口”相关信息，请问这一情况是否属实？\n中国证监会新闻发言人答表示，该信息不属实。公募基金投资运作依照《证券投资基金法》等法律法规和基金合同约定进行，投资标的、投资比例由基金管理人按照基金合同和内部投资决策程序自主确定。中国证监会依法履行监管职责，未向基金管理人提出相关数据报送要求。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXYXV05bQAACbKF.png?name=orig"],"u":"https://x.com/fxtrader/status/2122910244699304249","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":1125},{"id":"2122910227066442137","h":"ReutersChina","ts":1794976214,"zh":"巴布亚新几内亚总理詹姆斯·马拉佩周二告诉中国国家主席习近平，关闭台湾驻巴布亚新几内亚办事处“并不容易”，并承认他在这样做时面临国内挑战。","en":"Papua New Guinea's Prime Minister James Marape told Chinese President Xi Jinping on Tuesday that it \"wasn't easy\" to close Taiwan's office in his country, acknowledging he faced domestic challenges in doing so.","zh_src":"bing","lang":"en","m" 大超预期下季及下一财年指引很强劲，对外新的投资担保谨慎，董事会明确不打算请回老黄。聊聊个人理解。\n1、具体数字很多地方都能看到，只说关键点：\n1）Vera Rubin开始正式交货、创造力英伟达历史上最快的爬坡记录，单季交付超过200亿美金，这个量级与公司本季约196亿美元的整体环比收入增量接近，说明新产品是增量来源，且新产品的交付本没有挤压原有产线的销售；\n2）下一季指引1300亿美元，达到所有买方卖方的最高预期水平。\n3）进一步上调了2028财年增长预期（本季是27财年第三季度），公司目前预计截至2028年1月的2028财年营收同比增长约75%，高于此前提出的70%以上增长目标。今年（2027财年）英伟达的营收应该能超过4200亿美金，那么明年（2028财年）按照75%的增速营收能超过7400亿美金。\n4）公司三财季通过回购和分红向股东返还281亿美元。剩余股票回购授权约2273亿美元，要在28年之前完成，意味着未来五个季度单季平均回购450亿美金的股票，回购力度已经达到单季自由现金流的规模。\n2、电话会议上临时CEO聊到几个关于产业的信息\n1）OpenRouter上的周度Token使用量同比激增35倍，过去三个月内增长了3.5倍。智能体工作负载目前占据约80%的Token量。\n自5月以来Token价格已下降近60%，这推动了Token使用量的加速增长和算力需求的扩张。也带动GPU租用价格跨代上涨——已有老一代GPU在多年期合同中以最高两倍的原价续约，而B300的租用费率自推出以来已上涨逾60%。\n2）CPO路线快速推进，规模化生产已经启动。Lambda宣布了英伟达光子CPO交换机的首个量产部署，连接逾1万颗GB300 GPU。与公开插拔式光模块方案相比，英伟达光子交换机的能效提升5倍，可靠性提升15倍，延迟降低10%。三季度，英伟达的网络业务收入超过210亿美元。这可能是看到的对上游产业链最利好的一个信息。\n3）Vera Rubin Ultra仍按计划于明年发布，Feynman将于2028年推出。\nPOD到货后即可直接连接部署，将上线时间从数月压缩至数周，大幅加快首次Token生成的时间。对于年收入规模达500亿美元的1吉瓦AI工厂而言，仅仅提前一个季度达到首次Token生成，就可能为运营商额外带来逾100亿美元的收入。\n4）云行业积压订单目前已达2.5万亿美元，较三个月前的2万亿美元进一步增长。\n3、资本生态\n截至第三财季末英伟达的供应承诺从上一财季的2790亿美元增加至3900亿美元，主要与多年期内存采购有关。\n此外公司云服务协议和数据中心租赁承诺合计达到1020亿美元，高于上一季度的740亿美元。\n如果进一步计入股权投资、资本开支等项目，英伟达披露的未来各项承诺合计达到5180亿美元。\n而相关融资担保敞口和Neocloud协议由公司另外列示：\n1）披露最高1180亿美元的第三方融资担保敞口。最大的一笔涉及俄亥俄州SB Energy建设的数据中心园区。英伟达提供的相关担保最高达到1050亿美元，项目将建设约4.25吉瓦的数据中心容量，并通过长达20年的租赁安排为OpenAI提供基础设施。\n2）公司还披露与新兴云服务商（Neoclouds）的相关承诺达到320亿美元。\n关于“英伟达是否准备收缩客户融资”，\nKress在会上发出了明确信号：英伟达在支持新兴云客户时将变得更加“克制和挑剔”。她表示公司正在“严格评估”各项投资、承诺和财务担保。\nKress详细划定了英伟达的担保底线：\n如果（数据中心建设）开始了，但不幸的是他们被推迟了，或者在建设方面遇到了挑战，我们的担保就不再存在了。我们对其中大多数项目的担保，实际上是基于它们准备就绪的时候。\n我的理解是：原有的仍在继续，但未来项目的筛选应该会更谨慎和严格。英伟达不再为早期的水泥建设或选址买单，只有当数据中心的土地、电力和外壳等基础设施真正就绪时，财务担保才会生效。\n这向其实发出一个明确信号：部分企业是时候自力更生了。对于Neocloud来说，27年要为生存而战了。\n4、关于老黄回归问题\n董事会主席Harvey Jones在电话会明确表示董事会不打算恢复黄仁勋的CEO职务。他透露，董事会目前正同步考察内外部的CEO候选人，并表示“此次遴选将会全面而审慎”，在“找到真正合适的人选”前，公司绝不会仓促推进。\n“先进芯片技术和国家安全形势正在改变英伟达的经营环境，而新任 CEO 必须能够妥善应对这些变化。”\n虽然昨晚老黄也表态了回归的意愿，但是今年电话会的表态我们也要做好未来老黄不能回归的准备。\n5、怎么看这份财报对市场的影响\n1）短期内强劲财报和下季下一财年的指引会提振市场的情绪，短期内可能会带动市场一波反弹。\n2）但中长期最大的考验还是如果老黄确定不能回归后，新的ceo能不能顶替上来。不然市场还是会对技术迭代的速度，产业生态支持力度心存疑虑。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"老黄离开后的英伟达三季度财报看点：本季大超预期下季及下一财年指引很强劲，对外新的投资担保谨慎，董事会明确不打算请回老黄。聊聊个人理解。\n1、具体数字很多地方都能看到，只说关键点：\n1）Vera Rubin开始正式交货、创造力英伟达历史上最快的爬坡记录，单季交付超过200亿美金，这个量级与公司本季约196亿美元的整体环比收入增量接近，说明新产品是增量来源，且新产品的交付本没有挤压原有产线的销售；\n2）下一季指引1300亿美元，达到所有买方卖方的最高预期水平。\n3）进一步上调了2028财年增长预期（本季是27财年第三季度），公司目前预计截至2028年1月的2028财年营收同比增长约75%，高于此前提出的70%以上增长目标。今年（2027财年）英伟达的营收应该能超过4200亿美金，那么明年（2028财年）按照75%的增速营收能超过7400亿美金。\n4）公司三财季通过回购和分红向股东返还281亿美元。剩余股票回购授权约2273亿美元，要在28年之前完成，意味着未来五个季度单季平均回购450亿美金的股票，回购力度已经达到单季自由现金流的规模。\n2、电话会议上临时CEO聊到几个关于产业的信息\n1）OpenRouter上的周度Token使用量同比激增35倍，过去三个月内增长了3.5倍。智能体工作负载目前占据约80%的Token量。\n自5月以来Token价格已下降近60%，这推动了Token使用量的加速增长和算力需求的扩张。也带动GPU租用价格跨代上涨——已有老一代GPU在多年期合同中以最高两倍的原价续约，而B300的租用费率自推出以来已上涨逾60%。\n2）CPO路线快速推进，规模化生产已经启动。Lambda宣布了英伟达光子CPO交换机的首个量产部署，连接逾1万颗GB300 GPU。与公开插拔式光模块方案相比，英伟达光子交换机的能效提升5倍，可靠性提升15倍，延迟降低10%。三季度，英伟达的网络业务收入超过210亿美元。这可能是看到的对上游产业链最利好的一个信息。\n3）Vera Rubin Ultra仍按计划于明年发布，Feynman将于2028年推出。\nPOD到货后即可直接连接部署，将上线时间从数月压缩至数周，大幅加快首次Token生成的时间。对于年收入规模达500亿美元的1吉瓦AI工厂而言，仅仅提前一个季度达到首次Token生成，就可能为运营商额外带来逾100亿美元的收入。\n4）云行业积压订单目前已达2.5万亿美元，较三个月前的2万亿美元进一步增长。\n3、资本生态\n截至第三财季末英伟达的供应承诺从上一财季的2790亿美元增加至3900亿美元，主要与多年期内存采购有关。\n此外公司云服务协议和数据中心租赁承诺合计达到1020亿美元，高于上一季度的740亿美元。\n如果进一步计入股权投资、资本开支等项目，英伟达披露的未来各项承诺合计达到5180亿美元。\n而相关融资担保敞口和Neocloud协议由公司另外列示：\n1）披露最高1180亿美元的第三方融资担保敞口。最大的一笔涉及俄亥俄州SB Energy建设的数据中心园区。英伟达提供的相关担保最高达到1050亿美元，项目将建设约4.25吉瓦的数据中心容量，并通过长达20年的租赁安排为OpenAI提供基础设施。\n2）公司还披露与新兴云服务商（Neoclouds）的相关承诺达到320亿美元。\n关于“英伟达是否准备收缩客户融资”，\nKress在会上发出了明确信号：英伟达在支持新兴云客户时将变得更加“克制和挑剔”。她表示公司正在“严格评估”各项投资、承诺和财务担保。\nKress详细划定了英伟达的担保底线：\n如果（数据中心建设）开始了，但不幸的是他们被推迟了，或者在建设方面遇到了挑战，我们的担保就不再存在了。我们对其中大多数项目的担保，实际上是基于它们准备就绪的时候。\n我的理解是：原有的仍在继续，但未来项目的筛选应该会更谨慎和严格。英伟达不再为早期的水泥建设或选址买单，只有当数据中心的土地、电力和外壳等基础设施真正就绪时，财务担保才会生效。\n这向其实发出一个明确信号：部分企业是时候自力更生了。对于Neocloud来说，27年要为生存而战了。\n4、关于老黄回归问题\n董事会主席Harvey Jones在电话会明确表示董事会不打算恢复黄仁勋的CEO职务。他透露，董事会目前正同步考察内外部的CEO候选人，并表示“此次遴选将会全面而审慎”，在“找到真正合适的人选”前，公司绝不会仓促推进。\n“先进芯片技术和国家安全形势正在改变英伟达的经营环境，而新任 "id":"2122860058417811897","h":"ArtofSpecuycky","ts":1794964253,"zh":"确实，在这种市场环境下，日内交易的价格走势和交易机会更好（控制可接受的仓位就好）。大盘连续三天杀跌1%，反弹估计也是类似的轧空大涨，有波动就是非常好的做期权日内机会。在美国做不了合约，做做日内倒是挺好的。然后博反弹可以用看涨期权博，等诱多到了关键均线高位再大仓位做空","en":"确实，在这种市场环境下，日内交易的价格走势和交易机会更好（控制可接受的仓位就好）。大盘连续三天杀跌1%，反弹估计也是类似的轧空大涨，有波动就是非常好的做期权日内机会。在美国做不了合约，做做日内倒是挺好的。然后博反弹可以用看涨期权博，等诱多到了关键均线高位再大仓位做空","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ArtofSpecuycky/status/2122860058417811897","l":[],"ln":[],"t":[],"lk":7,"rt":2,"rp":0,"vw":3148},{"id":"2122858939792740644","h":"cnfinancewatch","ts":1794963986,"zh":"A股盘前第二版\n七点档的主结论还在，但外盘已经比当时热闹得多。第一版看到的美股指期货只是相对周二结算小幅翻红，现在标普500期货约7413点，较结算涨约0.72%；\n#纳指期货约27454点涨约1.40%；道指期货约50976点，涨约0.32%。\n亚洲开盘把这笔账做得更清楚：日经225约59448点，涨1.0%；韩国综指约5111点，#涨约2.87%，一度接近3%，昨天跌破的5000点已经收回。日本芯片股和软银集团早盘大涨，韩国三星电子、海力士和三星电机也明显走强。\n#三个方向不变：\n银行与红利、\n家电与必选消费、\n半导体制造的事件反弹。\n变化在于，第三方向的高开可能会比第一版预想的更猛，更要守住只观察、不追高，尤其不能把已经伤很重的CPO一并带进去。\n#消息面 两小时更新\n英伟达盘后涨幅一度扩大到约5%，临时CEO继续强调需求至少延伸到2028年，云业务未交订单约2.5万亿美元，并上调2028财年营收增长预期至75%。新出来的干扰也不少。做空机构浑水在财报前宣布做空英伟达，发布报告质疑其前全球现场运营高管与超微电脑前高管可能存在未披露关联，并把问题指向对华销售风险；浑水自己写明，相关身份尚未证实，两人也未被刑事指控。这是转述，不是已坐实的指控，但足够提醒：财报数字好，不等于开盘就能把位置问题一笔勾掉。另据报道，黄仁勋已同意出席美国参议院银行委员会听证会，日期未定。贝佐斯则称，若黄仁勋无法回归，英伟达应从内部寻找新CEO。Anthropic\nIPO仍被传超额认购10至20倍，发行价可能高于每股80美元，这是本周另一只靴子，不是今天开盘的加仓理由。10年期美债收益率在5%附近已经停留约27天，接近2007年的纪录，这根绳子并没有因为期货翻红就松开。\n国内可交易的新信息，更接近风险提示。截至11月17日，两市融资余额22097.71亿元，再减186.04亿元，沪市减78.24亿元、深市减107.8亿元，杠杆还在撤。\n#瀛通通讯 $002861 六天四板后公告，智能眼镜只是少量代工、收入占比不足1%，并提示情绪过热，热榜仍排在前二十，开盘不碰。短剧影视这边，\n#文投控股 $600715 、 #凯撒文化 $002425\n还在人气榜前排，改变不了昨天已经兑现的风险，一律不抄。集合竞价要到9点15分以后才有，截稿前无法采集，开盘强弱以9点25分竞价结果为准。\n#研报面 两小时更新\n今早和新结构更贴的，还是半导体设备与消费。#中信建投称半导体设备、材料和零部件板块业绩有望加速；华龙证券电子行业三季报综述认为自主可控加速兑现；国金证券优先看好国内存储渗透。这些报告只能当作事件反弹的背景，盖不住5日、20日仍在下跌的ETF位置，也不能覆盖浑水报告带来的情绪扰动。\n太平洋证券买入\n#晶晨股份 $688099 、 #全志科技 $300458 ，逻辑是端侧AI，不构成另开主线；\n同门还买入 #永和股份 $605020 、\n#安井食品 $603345 、 #宝立食品 $603170\n，后两只和必选消费同向，只作观察。\n#华泰看好国内储能中长期需求，#中信证券称原奶周期进入上行、稀土供需向好，都记在观察栏，不改今天三个方向。\n#热榜 两小时更新\n东财人气榜前排仍是 \n#华胜天成 $600410 、 #长虹美菱 $000521 、 #西陇科学 $002584 、 #九阳股份\n$002242 、 #有研新材 $600206 、 #华东重机 $002685 、 #海立股份 $600619 、 #中际旭创\n$300308 ， #小熊电器 $002959 、 #顺钠股份 $000533\n进入前十。\n和第一版相比，长虹美菱前移、九阳后撤，小家电和电子化学品还是最拥挤的一端。 \n#中际旭创 $300308\n仍在前十，但昨天继续收跌，热度和位置背离没有修复。同花顺热榜本档数据缺失。","en":"A股盘前第二版\n七点档的主结论还在，但外盘已经比当时热闹得多。第一版看到的美股指期货只是相对周二结算小幅翻红，现在标普500期货约7413点，较结算涨约0.72%；\n#纳指期货约27454点涨约1.40%；道指期货约50976点，涨约0.32%。\n亚洲开盘把这笔账做得更清楚：日经225约59448点，涨1.0%；韩国综指约5111点，#涨约2.87%，一度接近3%，昨天跌破的5000点已经收回。日本芯片股和软银集团早盘大涨，韩国三星电子、海力士和三星电机也明显走强。\n#三个方向不变：\n银行与红利、\n家电与必选消费、\n半导体制造的事件反弹。\n变化在于，第三方向的高开可能会比第一版预想的更猛，更要守住只观察、不追高，尤其不能把已经伤很重的CPO一并带进去。\n#消息面 两小时更新\n英伟达盘后涨幅一度扩大到约5%，临时CEO继续强调需求至少延伸到2028年，云业务未交订单约2.5万亿美元，并上调2028财年营收增长预期至75%。新出来的干扰也不少。做空机构浑水在财报前宣布做空英伟达，发布报告质疑其前全球现场运营高管与超微电脑前高管可能存在未披露关联，并把问题指向对华销售风险；浑水自己写明，相关身份尚未证实，两人也未被刑事指控。这是转述，不是已坐实的指控，但足够提醒：财报数字好，不等于开盘就能把位置问题一笔勾掉。另据报道，黄仁勋已同意出席美国参议院银行委员会听证会，日期未定。贝佐斯则称，若黄仁勋无法回归，英伟达应从内部寻找新CEO。Anthropic\nIPO仍被传超额认购10至20倍，发行价可能高于每股80美元，这是本周另一只靴子，不是今天开盘的加仓理由。10年期美债收益率在5%附近已经停留约27天，接近2007年的纪录，这根绳子并没有因为期货翻红就松开。\n国内可交易的新信息，更接近风险提示。截至11月17日，两市融资余额22097.71亿元，再减186.04亿元，沪市减78.24亿元、深市减107.8亿元，杠杆还在撤。\n#瀛通通讯 $002861 六天四板后公告，智能眼镜只是少量代工、收入占比不足1%，并提示情绪过热，热榜仍排在前二十，开盘不碰。短剧影视这边，\n#文投控股 $600715 、 #凯撒文化 $002425\n还在人气榜前排，改变不了昨天已经兑现的风险，一律不抄。集合竞价要到9点15分以后才有，截稿前无法采集，开盘强弱以9点25分竞价结果为准。\n#研报面 两小时更新\n今早和新结构更贴的，还是半导体设备与消费。#中信建投称半导体设备、材料和零部件板块业绩有望加速；华龙证券电子行业三季报综述认为自主可控加速兑现；国金证券优先看好国内存储渗透。这些报告只能当作事件反弹的背景，盖不住5日、20日仍在下跌的ETF位置，也不能覆盖浑水报告带来的情绪扰动。\n太平洋证券买入\n#晶晨股份 $688099 、 #全志科技 $300458 ，逻辑是端侧AI，不构成另开主线；\n同门还买入 #永和股份 $605020 、\n#安井食品 $603345 、 #宝立食品 $603170\n，后两只和必选消费同向，只作观察。\n#华泰看好国内储能中长期需求，#中信证券称原奶周期进入上行、稀土供需向好，都记在观察栏，不改今天三个方向。\n#热榜 两小时更新\n东财人气榜前排仍是 \n#华胜天成 $600410 、 #长虹美菱 $000521 、 #西陇科学 $002584 、 #九阳股份\n$002242 、 #有研新材 $600206 、 #华东重机 $002685 、 #海立股份 $600619 、 #中际旭创\n$300308 ， #小熊电器 $002959 、 #顺钠股份 $000533\n进入前十。\n和第一版相比，长虹美菱前移、九阳后撤，小家电和电子化学品还是最拥挤的一端。 \n#中际旭创 $300308\n仍在前十，但昨天继续收跌，热度和位置背离没有修复。同花顺热榜本档数据缺失。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122858939792740644","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":316},{"id":"2122857560202006537","h":"ReutersChina","ts":1794963657,"zh":"华为称美国对商业活动进行“恶意歪曲”，但未能在审判中证明指控","en":"Huawei says US put 'sinister spin' on business activities, failed to prove charges at trial","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122857560202006537","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/legal/litigation/huawei-says-us-put-sinister-spin-business-activities-failed-prove-charges-trial-2026-11-18/?taid=6afcf8c96018910001a1627a&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":348},{"id":"2122857345113895164","h":"bbcchinese","ts":1794963606,"zh":"在南部第一大城高雄，国民党立委柯志恩将对决民进党立委赖瑞隆。柯志恩以“知识蓝”的姿态拉拢中间选民，支持度大幅追贴深耕高雄20年的赖瑞隆，选情咬紧。","en":"在南部第一大城高雄，国民党立委柯志恩将对决民进党立委赖瑞隆。柯志恩以“知识蓝”的姿态拉拢中间选民，支持度大幅追贴深耕高雄20年的赖瑞隆，选情咬紧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122857345113895164","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4AuEacs","d":"bbc.in"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":1608},{"id":"2122855528108089408","h":"bboczeng","ts":1794963173,"zh":"地球已经疯了，我打算彻底离开","en":"地球已经疯了，我打算彻底离开","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122855528108089408","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":1055},{"id":"2122854898295599512","h":"fxtrader","ts":1794963023,"zh":"据CNN报道，美国国家安全局（NSA）内部传输、存储和共享机密情报的通讯网络NSANet突然出现大规模故障。\n交叉信源分别指出，此次故障发生在系统补丁更新期间，而华盛顿邮报更是提及NSA近期完成了微软Office 365的平台升级。\n#观察 美国最近一周密集出现了重要信息系统故障，值得调查一下。","en":"据CNN报道，美国国家安全局（NSA）内部传输、存储和共享机密情报的通讯网络NSANet突然出现大规模故障。\n交叉信源分别指出，此次故障发生在系统补丁更新期间，而华盛顿邮报更是提及NSA近期完成了微软Office 365的平台升级。\n#观察 美国最近一周密集出现了重要信息系统故障，值得调查一下。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXj7CubMAAtLMx.jpg?name=orig","https://pbs.twimg.com/media/HXXknMtbIAAuyID.png?name=orig"],"u":"https://x.com/fxtrader/status/2122854898295599512","l":[],"ln":[],"t":[],"lk":4,"rt":2,"rp":4,"vw":4014},{"id":"2122853536098877505","h":"cnfinancewatch","ts":1794962698,"zh":"#隔夜美股映射\n（一）美股去重榜前10领涨方向为交通运输航运JETS 20日+8.25%、水业FIW +7.56%、基建BILD +5.58%，但隔夜美股主要指数全线收跌，标普-1.03%、道指-1.64%，20日强势与隔夜方向背离。\n（二）映射个股须方向在美股去重榜前10且隔夜该方向收涨：昨日美股上涨板块仅能源油气UNG +2.24%、交通运输航运BDRY +2.06%、贵金属GDX +0.79%三个方向收涨，其中交通运输航运BDRY与去重榜JETS同向，权重上调一档，对应A股中远海控。\n（三）冲突处理：美股20日强势的消费、创新药隔夜均收跌（XLP -1.23%、IHI -1.06%），美股半导体博通昨+2.46%为带动性热股第一，虽不在去重榜前10，但隔夜方向明确，A股半导体设备K线未远离5日线，映射正确且位置可做，权重上调。\n#韩日开盘映射\n（一）韩国KOSPI 5124.17（+0.46%），日经225 59335.76（-0.55%），韩强日弱。\n（二）韩国存储半导体均+5.24%（SK海力士+5.97%、三星电子+4.52%），半导体设备与存储最强；日本半导体设备均+4.00%（爱德万测试+4.67%、迪思科+4.31%、东京电子+3.01%），精密制造均+0.53%，金融均-0.07%。\n（三）韩股存储强提高A股存储、半导体设备、封测权重；日股半导体设备强提高A股设备、材料权重，两者同向共振。\n（四）韩日半导体方向与隔夜美股博通+2.46%一致，定当日最高优先级；日经指数本身-0.55%与板块强势背离，仅作板块层面确认，指数层面降权。\n（五）韩日数据只用于确认半导体方向，不直接作买入理由。\n六、大盘风险开关\n（一）环境分42分，降仓档，只做回踩低吸不做追高。\n（二）指数位置：上证3584.58低于MA5 3631.59（-1.29%）、MA10 3650.77（-1.81%）、MA20 3654.66（-1.92%），沪深300、中证500、中证1000全部在5日线与10日线下方，中证1000偏离MA20达-5.83%最弱，属小盘弱势、权重相对抗跌格局。\n（三）期货升贴水：未获取。\n（四）涨跌停结构：窗口内龙虎榜涨停股以游资普通席位为主，成功率多在30%至45%，机构上榜多为卖出或分歧，赚钱效应一般，未见明显恶化但也无强势连板高度数据。\n（五）外盘冲击：隔夜美股三大指数收跌，日经-0.55%，仅韩国+0.46%与半导体板块强，外盘整体偏空但半导体结构性偏多。\n（六）综合：指数在均线下方、小盘弱、外盘偏空，环境分42分，降仓，只做半导体设备与消费的回踩低吸。\n#五大机构研报（窗口内）\n（一）华泰证券，11月18日，《互联网行业关注纯工具类平台和硬切软逻辑》，关注AI基础设施投入ROI边际变化。\n（二）中信证券，11月18日，《原奶周期进入上行通道 保持对牧业板块的推荐》，奶价终结五年下行。\n（三）中信证券，11月18日，《稀土行业供需向好 关注板块配置价值》，板块调整后配置价值凸显。\n（四）中信建投，11月18日，《半导体设备、材料、零部件板块业绩有望加速》，Q3半导体单季归母净利增速516%。\n（五）中信建投，11月17日，《十月底低点大概率已是本轮市场底，11月开启进二退一修复行情》，估值偏低。\n（六）中金公司，11月17日，《当前至12月有望迎来修复行情》，换手率降至3.6%，ETF净流入积极。\n（七）华泰证券，11月17日，《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》，必选与可选消费景气改善居前。\n（八）中信建投，11月16日，《注意估值风格切换的年末行情特征》，低估值盈利确定板块年末胜率高。\n#研报互证\n（一）方向一半导体设备与存储：互证结论月内强支撑。中信建投11月18日《半导体设备、材料、零部件板块业绩有望加速》直接覆盖设备材料；中信建投11月16日《持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现》覆盖算力硬件；中泰证券11月13日《AI产业趋势远未终结》覆盖电子。多家机构同向，方向权重上调一档。\n（二）方向二消费：互证结论月内强支撑。华泰证券11月17日《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》直接覆盖；中信证券11月18日《原奶周期进入上行通道 保持对牧业板块的推荐》覆盖食品农业链。两家同向，方向权重上调一档。\n（三）方向三军工航天：互证结论月内无支撑。近一个月华泰、中信建投、中信、中泰、中金五家研报库无军工航天直接覆盖，权重下调一档，仅作补涨观察。\n（四）主选股华海清科：月内强支撑，中信建投11月18日半导体设备研报覆盖设备环节，逻辑一致，权重上调。\n（五）主选股安井食品：月内单一支撑，华泰证券11月17日内需消费研报覆盖必选消费方向，未直接点名个股，维持原权重。\n（六）主选股中航光电：月内无支撑，五家机构近一个月无军工覆盖，权重下调，若同时与ETF榜不符则剔除，本方向仅美股AV映射、A股未进榜，降为观察性配置。\n（七）被研报否掉或剔除的标的：AI算力软件方向虽有多份研报支撑，但今日短线候选池该方向可作短线为零，行情数据与研报观点冲突，以行情为准，剔除；光伏储能方向研报有中信证券11月17日《储能发展规划出台》支撑，但A股同主题未进榜且候选池无达标个股，剔除。","en":"#隔夜美股映射\n（一）美股去重榜前10领涨方向为交通运输航运JETS 20日+8.25%、水业FIW +7.56%、基建BILD +5.58%，但隔夜美股主要指数全线收跌，标普-1.03%、道指-1.64%，20日强势与隔夜方向背离。\n（二）映射个股须方向在美股去重榜前10且隔夜该方向收涨：昨日美股上涨板块仅能源油气UNG +2.24%、交通运输航运BDRY +2.06%、贵金属GDX +0.79%三个方向收涨，其中交通运输航运BDRY与去重榜JETS同向，权重上调一档，对应A股中远海控。\n（三）冲突处理：美股20日强势的消费、创新药隔夜均收跌（XLP -1.23%、IHI -1.06%），美股半导体博通昨+2.46%为带动性热股第一，虽不在去重榜前10，但隔夜方向明确，A股半导体设备K线未远离5日线，映射正确且位置可做，权重上调。\n#韩日开盘映射\n（一）韩国KOSPI 5124.17（+0.46%），日经225 59335.76（-0.55%），韩强日弱。\n（二）韩国存储半导体均+5.24%（SK海力士+5.97%、三星电子+4.52%），半导体设备与存储最强；日本半导体设备均+4.00%（爱德万测试+4.67%、迪思科+4.31%、东京电子+3.01%），精密制造均+0.53%，金融均-0.07%。\n（三）韩股存储强提高A股存储、半导体设备、封测权重；日股半导体设备强提高A股设备、材料权重，两者同向共振。\n（四）韩日半导体方向与隔夜美股博通+2.46%一致，定当日最高优先级；日经指数本身-0.55%与板块强势背离，仅作板块层面确认，指数层面降权。\n（五）韩日数据只用于确认半导体方向，不直接作买入理由。\n六、大盘风险开关\n（一）环境分42分，降仓档，只做回踩低吸不做追高。\n（二）指数位置：上证3584.58低于MA5 3631.59（-1.29%）、MA10 3650.77（-1.81%）、MA20 3654.66（-1.92%），沪深300、中证500、中证1000全部在5日线与10日线下方，中证1000偏离MA20达-5.83%最弱，属小盘弱势、权重相对抗跌格局。\n（三）期货升贴水：未获取。\n（四）涨跌停结构：窗口内龙虎榜涨停股以游资普通席位为主，成功率多在30%至45%，机构上榜多为卖出或分歧，赚钱效应一般，未见明显恶化但也无强势连板高度数据。\n（五）外盘冲击：隔夜美股三大指数收跌，日经-0.55%，仅韩国+0.46%与半导体板块强，外盘整体偏空但半导体结构性偏多。\n（六）综合：指数在均线下方、小盘弱、外盘偏空，环境分42分，降仓，只做半导体设备与消费的回踩低吸。\n#五大机构研报（窗口内）\n（一）华泰证券，11月18日，《互联网行业关注纯工具类平台和硬切软逻辑》，关注AI基础设施投入ROI边际变化。\n（二）中信证券，11月18日，《原奶周期进入上行通道 保持对牧业板块的推荐》，奶价终结五年下行。\n（三）中信证券，11月18日，《稀土行业供需向好 关注板块配置价值》，板块调整后配置价值凸显。\n（四）中信建投，11月18日，《半导体设备、材料、零部件板块业绩有望加速》，Q3半导体单季归母净利增速516%。\n（五）中信建投，11月17日，《十月底低点大概率已是本轮市场底，11月开启进二退一修复行情》，估值偏低。\n（六）中金公司，11月17日，《当前至12月有望迎来修复行情》，换手率降至3.6%，ETF净流入积极。\n（七）华泰证券，11月17日，《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》，必选与可选消费景气改善居前。\n（八）中信建投，11月16日，《注意估值风格切换的年末行情特征》，低估值盈利确定板块年末胜率高。\n#研报互证\n（一）方向一半导体设备与存储：互证结论月内强支撑。中信建投11月18日《半导体设备、材料、零部件板块业绩有望加速》直接覆盖设备材料；中信建投11月16日《持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现》覆盖算力硬件；中泰证券11月13日《AI产业趋势远未终结》覆盖电子。多家机构同向，方向权重上调一档。\n（二） 几个小时后，英伟达董事长在财报电话会上一开场就说董事会无意让他复任。从时间线上看这个帖子更像是黄仁勋在公开争取回归，也多少有点施压的意思吧，特意提到还有员工、客户和合作伙伴希望他回来。\n回到财报，盘后反弹已经说明了一切。英伟达这季做了 1158 亿美元营收，超过预期。Vera Rubin 已经开始出货，上一代 Blackwell Ultra 也还在增长。新产品接上了，同时老产品还有需求。\n下季给了 1300 亿美元的营收指引，比市场预期高，也没计入来自中国的数据中心计算收入。不过这一季多了一周，直接看季度总额环比增长约 12%，摊到每周的话增幅约 4%。\n下季的毛利率指引是 71%–72%，低于这季的 74.9%。这个区间上季就说过当时管理层提到内存涨价比预想的厉害。按指引中值粗算卖得更多，毛利总额还是会涨，只是涨得没营收那么快。\n回款周期上这季平均收款天数从 60 天拉长到 64 天。公司的说法是一部分是因为 Rubin 出货节奏，一部分是给某些大客户的账期更长。\n这一季财报黄仁勋还在任。老黄对英伟达影响要看下一季了。股价盘后涨超 4%，现在有所回落，我觉得作为反弹不算小，但放在这次财报前的预期里，又有点克制了，继续看今晚正式开盘后的走势。\n买美股、加密货币用OKX，本条由@okxchinese赞助。","en":"英伟达财报超预期，黄仁勋还有机会回来吗？\n黄仁勋选在英伟达财报当天公开说自己愿意回来。几个小时后，英伟达董事长在财报电话会上一开场就说董事会无意让他复任。从时间线上看这个帖子更像是黄仁勋在公开争取回归，也多少有点施压的意思吧，特意提到还有员工、客户和合作伙伴希望他回来。\n回到财报，盘后反弹已经说明了一切。英伟达这季做了 1158 亿美元营收，超过预期。Vera Rubin 已经开始出货，上一代 Blackwell Ultra 也还在增长。新产品接上了，同时老产品还有需求。\n下季给了 1300 亿美元的营收指引，比市场预期高，也没计入来自中国的数据中心计算收入。不过这一季多了一周，直接看季度总额环比增长约 12%，摊到每周的话增幅约 4%。\n下季的毛利率指引是 71%–72%，低于这季的 74.9%。这个区间上季就说过当时管理层提到内存涨价比预想的厉害。按指引中值粗算卖得更多，毛利总额还是会涨，只是涨得没营收那么快。\n回款周期上这季平均收款天数从 60 天拉长到 64 天。公司的说法是一部分是因为 Rubin 出货节奏，一部分是给某些大客户的账期更长。\n这一季财报黄仁勋还在任。老黄对英伟达影响要看下一季了。股价盘后涨超 4%，现在有所回落，我觉得作为反弹不算小，但放在这次财报前的预期里，又有点克制了，继续看今晚正式开盘后的走势。\n买美股、加密货币用OKX，本条由@okxchinese赞助。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXbG5hawAA6iK6.jpg?name=orig"],"u":"https://x.com/LucyBuilding/status/2122847494073934005","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":480},{"id":"2122846131453661578","h":"cnfinancewatch","ts":1794960932,"zh":"散户热议｜2026-11-18·早间\n数据时点：国内社区以11月17日收盘后至11月18日07:50前可见的公开帖为准；海外统计抓取于北京时间今早。本期邮箱新增一封11月17日晚间热点财经邮件，早间邮件截稿未到。韭研公社热帖列表可以打开，但针对今早英伟达财报的时间轴帖打开时暂无评论；国内讨论因此主要依据淘股吧收盘后的复盘，以及韭研17日下午到晚间仍在消化国产替代与出口管制的帖文。WallStreetBets帖文正文未能直接完整抓取，情绪统计来自StonkHub二手页面，已注明；Stocktwits英伟达个股页可以打开，情绪值为平台标示，不是我们自行计算的投票。\n国内：17日收盘的 #情绪是冰点，不是修复完成\n淘股吧“庄哥说股”11月17日16:57的《11.18盘前推演:77家跌停！九阳地天板！明天只有一种可能性！》，发帖时英伟达还没出数，页面显示浏览约8077次。作者写得很难受：上证只跌0.50%，但下跌约4119家、跌停约77家、涨停37家，两市成交约1.46万亿元继续缩量；早盘半导体和九阳涨停让人看到希望，午后又把希望收走。他把压力分成三层：#外围科技不确定性、量能不够、#高位题材亏钱效应连锁——文投控股跌停，吉视传媒大跌，北纬科技断板，#短剧和机器人继续补跌。对 #九阳股份，他记的是低开28.26元、盘中触及跌停，最终封在31.52元，走出地天板，并称之为“总龙头地位的再次确认”，但也提醒20%振幅说明风险不小。热门榜里，#华胜天成收涨停、三天两板；#有研新材涨停被视为材料方向的新强点；中际旭创跌3.90%、成交204.75亿元，仍被写成“机构恐慌出逃、趋势向下”；凯撒文化地天后炸板，被标成次日危险。对今天的预案，他看 #支撑3550点、3530点，压力3600点、3630点，最想先看跌停数量能否下来、指数能否收回3600，#再看九阳的承接、#有研新材和华胜天成有没有板块响应、#中际旭创能不能稳住。这些是出数前的社区预案，不是已经消化过财报的新共识。上述涨跌停和成交是社区口径，与金十统计的全天成交14576.95亿元、涨停37只大体相近，跌停家数我们未与交易所逐一核对。\n#最强主线写成国产替代，并称光刻胶涨幅靠前，催化是美国拟封堵通过海外数据中心远程获取算力，以及外交部、商务部的回应。另一篇16:49的盘面帖同时转述了SemiAnalysis大幅下调未来数年AI加速器资本开支预测，以及“董事会没有在考虑让黄仁勋回任”的消息。昇腾、光刻材料、华东重机、华胜天成、寒武纪、海光信息等名字仍在被来回点。针对“英伟达财报”的时间轴帖由@韭连板在11月18日凌晨发布，我们打开时页面显示暂无评论，因此不能把“公社已经形成统一看多或看空”写成事实。抓取范围有限，这里不编造更多引语。\n与券商口径的异同：#相同点是都看见了国产替代和制造、设备、材料的活口，也都没有把光模块写成同步修复。不同点是社区更愿意把#九阳地天板、#华东重机连板理解成情绪锚点和“明天可以继续做高度”，分析口径则更强调这是亏钱效应还没收敛时的局部高潮。被忽略的风险有三：一是把今早可能出现的科技高开，直接理解成风格已经切回成长，去追昨天已经涨停的有研新材、连板的华东重机，或者补涨还没企稳的中际旭创；二 #是在文投慈文跌停后再去抄短剧，把风险提示当成利空出尽；三是忽略毛利率指引下修和中国数据中心收入缺失，只记住“营收翻倍”。\n海外：持股社区在盘后欢呼，但七日统计仍略偏空\nStonkHub（二手，页面今早抓取）显示，过去7天有1101名WallStreetBets用户讨论英伟达，提及1507次，人数较上周的474人升132%。全Reddit口径下，7日共2608次提及，看多35.7%（930次）、中性23.0%、#看空41.3%（1077次），分类器平均置信度64%，不宜过度解读。统计还显示，讨论最密的一小时仍是美东17日16时，也就是常规交易收盘、财报尚未公布的时点。也就是说，这组略偏空的数字，主要反映的是财报前一周的恐惧，不能直接当成盘后投票。页面列出的高赞标题包括黄仁勋表态愿意回归，需要和董事会主席“不打算让他复职”分开看：前者是他本人的条件句，后者才是公司在电话会上的正式口径。\nStocktwits英伟达个股页可以直接打开。平台标示情绪为93、极端看多，关注人数约68.84万，并给出盘后报价约161.55美元、较收盘155.46美元涨约3.92%。评论区分化很清楚：有人写“空头完蛋了”“市盈率只有19”，把超预期和回购授权理解成反转；也有人提醒，盘后量不大、董事会强调不会让黄仁勋复职，担心次日开盘才是机构兑现的时候。这和七日WSB统计并不矛盾——持股社区在股价已经大跌之后，更愿意把一份超预期财报当成转折；期权和短线玩家在出数前更怕波动，七日窗口里看空仍略占上风。\n专业资金的制约，散户讨论里出现得更少：四季度毛利率指引下调到71%至72%，指引仍不含中国数据中心计算收入，Anthropic上市还在后头。A股散户若只把盘后涨3.9%理解成“外部利好已经落地，今天可以追连板和光模块”，就会把两套不同的交易揉在一起。\n小结：国内短线还停在17日冰点复盘和国产替代活口，海外持股社区已经在盘后欢呼，但七日统计仍偏谨慎。","en":"散户热议｜2026-11-18·早间\n数据时点：国内社区以11月17日收盘后至11月18日07:50前可见的公开帖为准；海外统计抓取于北京时间今早。本期邮箱新增一封11月17日晚间热点财经邮件，早间邮件截稿未到。韭研公社热帖列表可以打开，但针对今早英伟达财报的时间轴帖打开时暂无评论；国内讨论因此主要依据淘股吧收盘后的复盘，以及韭研17日下午到晚间仍在消化国产替代与出口管制的帖文。WallStreetBets帖文正文未能直接完整抓取，情绪统计来自StonkHub二手页面，已注明；Stocktwits英伟达个股页可以打开，情绪值为平台标示，不是我们自行计算的投票。\n国内：17日收盘的 #情绪是冰点，不是修复完成\n淘股吧“庄哥说股”11月17日1 易"],"lk":0,"rt":0,"rp":0,"vw":1423},{"id":"2122844812449874286","h":"cnfinancewatch","ts":1794960618,"zh":"三大利空方向（由强到弱）\n一、利率和流动性约束并没有被一份财报解除。已核实：美股11个主要行业全部收跌，金融跌1.87%，公用事业跌1.60%，连传统防守板块也没能幸免。纽约尾盘10年期美债收益率报5.0987%，仍在5.10%附近，盘中高见5.1494%；市场此前计价美联储12月加息25个基点的概率约96.8%。现货黄金约3849.59美元，仍靠近一年低位；美元指数17日收于103.485，当日微跌0.06%，所谓“创十八个月新高”更多是近日背景，不宜写成17日当天又创新高。WTI原油约85.74美元，已从更早的大跌中暂时稳住。英伟达自己也在用毛利率下修和“不含中国数据中心计算收入”提醒：增长还在，但质量预期和地缘约束没有消失。只要债券收益率不下来，成长股的估值修复就会反复被打折。\n二、CPO、光模块和已经受伤的AI硬件，不能自动兑现英伟达的超预期。晚间邮件把英伟达的影响直接映射到中际旭创、新易盛，这个映射在出数前就已和盘面脱节。已核实：台积电常规交易跌3.68%，软件指数IGV跌3.29%，阿里巴巴美股跌4.38%。创业板收盘跌破52周低位，说明成长股的亏钱效应还在指数层面确认。另一只靴子是Anthropic：CNBC援引消息称发行价可能高于70至78美元的指引区间，计划11月19日以代码ANT在纳斯达克上市；招股文件显示前九个月营收332.4亿美元，同期净亏损1040亿美元，其中大部分来自可转债和衍生工具公允价值变动。定价和首日表现会重新测量AI估值，不排除“英伟达数字很好、新股定价很贵、风险资产仍然摇摆”的组合。\n三、短剧影视和高位题材的亏钱效应还在扩散，不是“利空出尽”后的抄底窗口。已核实：文投控股跌9.89%，慈文传媒跌9.98%，横店影视跌停，短剧影视继风险提示之后继续兑现。人形机器人里，宇树科技跌11.97%，襄阳轴承跌10.01%；中国稀土跌10.00%。另一端则是局部高潮：阳光照明涨停并处于连板高位，华东重机三连板，华胜天成三天两板，九阳走出地天板。涨停少、跌停多，希望在上午给过一次、下午又收走，这是典型的容错率下降。复星医药董事长提议以2.5亿元至5亿元回购A股，对板块只是温和信号。今天如果因为英伟达高开去接力这些高位票，或者在跌停堆里捡短剧，证伪成本都会非常低。\n主要依据：英伟达2027财年三季报及电话会公开转述、家得宝官方业绩与任命公告、京东SEC附件、商务部与外交部公开表态、中国证券报所载上交所审核通过公告、海关出口数据的公开报道、新华社与美联社行情、金十成交统计、东方财富早餐中的利率与商品报价。以上为公开信息整理，不构成投资建议，投资有风险。","en":"三大利空方向（由强到弱）\n一、利率和流动性约束并没有被一份财报解除。已核实：美股11个主要行业全部收跌，金融跌1.87%，公用事业跌1.60%，连传统防守板块也没能幸免。纽约尾盘10年期美债收益率报5.0987%，仍在5.10%附近，盘中高见5.1494%；市场此前计价美联储12月加息25个基点的概率约96.8%。现货黄金约3849.59美元，仍靠近一年低位；美元指数17日收于103.485，当日微跌0.06%，所谓“创十八个月新高”更多是近日背景，不宜写成17日当天又创新高。WTI原油约85.74美元，已从更早的大跌中暂时稳住。英伟达自己也在用毛利率下修和“不含中国数据中心计算收入”提醒：增长还在，但质量预期和地缘约束没有消失。只要债券收益率不下来，成长股的估值修复就会反复被打折。\n二、CPO、光模块和已经受伤的AI硬件，不能自动兑现英伟达的超预期。晚间邮件把英伟达的影响直接映射到中际旭创、新易盛，这个映射在出数前就已和盘面脱节。已核实：台积电常规交易跌3.68%，软件指数IGV跌3.29%，阿里巴巴美股跌4.38%。创业板收盘跌破52周低位，说明成长股的亏钱效应还在指数层面确认。另一只靴子是Anthropic：CNBC援引消息称发行价可能高于70至78美元的指引区间，计划11月19日以代码ANT在纳斯达克上市；招股文件显示前九个月营收332.4亿美元，同期净亏损1040亿美元，其中大部分来自可转债和衍生工具公允价值变动。定价和首日表现会重新测量AI估值，不排除“英伟达数字很好、新股定价很贵、风险资产仍然摇摆”的组合。\n三、短剧影视和高位题材的亏钱效应还在扩散，不是“利空出尽”后的抄底窗口。已核实：文投控股跌9.89%，慈文传媒跌9.98%，横店影视跌停，短剧影视继风险提示之后继续兑现。人形机器人里，宇树科技跌11.97%，襄阳轴承跌10.01%；中国稀土跌10.00%。另一端则是局部高潮：阳光照明涨停并处于连板高位，华东重机三连板，华胜天成三天两板，九阳走出地天板。涨停少、跌停多，希望在上午给过一次、下午又收走，这是典型的容错率下降。复星医药董事长提议以2.5亿元至5亿元回购A股，对板块只是温和信号。今天如果因为英伟达高开去接力这些高位票，或者在跌停堆里捡短剧，证伪成本都会非常低。\n主要依据：英伟达2027财年三季报及电话会公开转述、家得宝官方业绩与任命公告、京东SEC附件、商务部与外交部公开表态、中国证券报所载上交所审核通过公告、海关出口数据的公开报道、新华社与美联社行情、金十成交统计、东方财富早餐中的利率与商品报价。以上为公开信息整理，不构成投资建议，投资有风险。","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/cnfinancewatch/status/2122844812449874286","l":[],"ln":[],"t":["美联储","美股","A股港股","汇率","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":199},{"id":"2122844632346501296","h":"cnfinancewatch","ts":1794960575,"zh":"热点财经新闻综述｜2026-11-18·早间\n数据时点：A股为11月17日收盘；美股为美东11月17日收盘，并以盘后公开报价补充英伟达财报反应；隔夜与今早消息整理截至北京时间11月18日07:50。本期邮箱新增一封热点财经邮件（11月17日晚间20:10版，位于垃圾邮件），11月18日早间邮件截稿未到。该晚间邮件写于英伟达出数之前，其中对财报的预判不能当成已落实结果。凡标“邮件转述”的内容未逐条核实，其余已对照英伟达、家得宝等公司公告、京东向SEC提交的财报、商务部与外交部公开信息、交易所审核公告、海关出口数据的公开报道，以及新华社、美联社行情和主流媒体报道。\n今日判断\n凌晨落地的英伟达财报，是今天唯一足够改写叙事的新信息，但还不够改写仓位结构。已核实：三季度营收1158亿美元，同比增103%、环比增20%；数据中心收入1076亿美元，同比增110%；非GAAP每股收益2.68美元，GAAP为2.70美元。第四季度营收指引中值1300亿美元、上下浮动3%，公司明确指引不含中国数据中心计算收入。当季GAAP和非GAAP毛利率分别为74.8%和74.9%，但四季度毛利率指引下调到71%至72%。电话会上，临时CEO克雷斯把2028财年营收增长预期上调到75%，并称“一切照常”；董事会主席则明确表示，不打算让黄仁勋复职。黄仁勋本人在辞职后的首份声明里说，若董事会认为回归符合股东、员工、公司和美国利益，他愿意回来——这是他的态度，不是董事会的决定，两句话不能并成“马上回归”。财报还披露，董事会已于今年9月将回购授权上调1500亿美元，三季度回购加派息281亿美元，截至季末剩余授权约2273亿美元。\n常规交易里，英伟达收155.46美元，跌0.44%；盘后公开报价约161.55美元，涨约3.9%，盘后一度接近4%。数字是超预期的，盘后也给了反应，但美股三大指数昨天仍是四连跌：道指跌1.64%报50759.42点，标普500跌1.03%报7340.53点，纳指跌0.74%报24328.38点，11个主要行业全部收跌。A股昨天已经先走完自己的结构：上证跌0.50%报3584.58点，再失3600；创业板跌1.20%报2292.20点，收盘跌破52周低位；科创50反而涨0.62%。资金提前买的是制造、设备和材料，不是光模块。所以今天的基调很清楚：不要把超预期理解成成长风格已经反转。相对更稳的仍是银行红利和家电；半导体制造和设备只当成事件反弹观察，开盘不追；CPO和已经地天板、连板的题材票，不要并进同一笔交易。Anthropic的定价和上市也在这两天落地，是另一只靴子。\n三大利多方向（由强到弱）\n一、半导体制造、设备与材料的国产替代，是事件上最有弹性的方向，但必须和光模块拆开看。已核实：中芯国际三季度销售收入31.9亿美元，同比增33.9%，产能利用率升至97.3%；昨天中芯国际涨6.59%，华虹公司涨10.39%，北方华创涨4.09%，有研新材涨停，半导体板块主力净流入约29.6亿元，从上一交易日的流出第一转为流入第一。美国商务部本周公布新规，限制中国企业通过新加坡、马来西亚、泰国、印尼、巴西等地数据中心远程获取先进算力，存量业务须在90天内申请许可；中国商务部表示若美方一意孤行将采取反制，外交部称之为典型的经济胁迫和“长臂管辖”。这解释了为什么昨天修复的是国产制造和材料，而不是和英伟达订单绑定更紧的光模块——中际旭创跌3.90%，成交额204.75亿元居两市第一，新易盛跌4.08%。制约就在同一份财报里：毛利率指引下修、中国数据中心计算收入继续不计入、董事会人事并未“恢复原状”。有研新材已经涨停，中芯、华虹若高开后不能站稳，就是脉冲结束，而不是新趋势开始。开盘不追，更不要把CPO一并抬进去。\n二、家电与必选消费，是少数既有出口数字、又还没被亏钱效应打穿的方向。已核实：海关口径下，2026年10月家电出口4.02亿台，同比增14.1%，出口金额89.56亿美元，同比增20.9%，金额增速继续抬升。昨天美的集团涨0.70%，小家电里长虹美菱、小熊电器继续活跃。家得宝三季度销售额434亿美元，增4.9%，美国同店增2.2%，调整后每股收益3.86美元，并更新全年销售增长约4.5%、调整后每股收益增速约2.0%的指引，同时宣布财务总监麦克费尔将于11月23日接任CEO；但股价仍收跌约2.4%，报339美元附近，说明美股把“略超预期+换帅”理解成卖出机会，不能简单映射成A股家居建材要跟涨。真正该看的是出口链龙头，而不是已经走出地天板的九阳股份——该股昨天低开后触及跌停，再拉至涨停，淘股吧复盘记低开28.26元、收31.52元，振幅约20%，这是方向里已经拥挤的一端。制约：高位小家电和“羊”字辈的接力资金，随时可能被半导体高开抽走。\n三、银行与红利仍是防守底仓，但高位已经开始兑现。已核实：昨天工商银行涨0.11%，多只银行股仍在历史新高附近，但银行板块主力净流出约13.5亿元。上证失守3600，沪深成交14576.95亿元，再缩267.95亿元。东吴证券收购东海证券事项已获上交所并购重组委通过，交易对价约115.19亿元，后续仍待证监会注册，这只是券商整合的增量，改变不了昨天的缩量结构。\n邮件转述称尾盘有212亿元资金涌入宽基ETF、创业板ETF广发成交超50亿元创出天量。","en":"热点财经新闻综述｜2026-11-18·早间\n数据时点：A股为11月17日收盘；美股为美东11月17日收盘，并以盘后公开报价补充英伟达财报反应；隔夜与今早消息整理截至北京时间11月18日07:50。本期邮箱新增一封热点财经邮件（11月17日晚间20:10版，位于垃圾邮件），11月18日早间邮件截稿未到。该晚间邮件写于英伟达出数之前，其中对财报的预判不能当成已落实结果。凡标“邮件转述”的内容未逐条核实，其余已对照英伟达、家得宝等公司公告、京东向SEC提交的财报、商务部与外交部公开信息、交易所审核公告、海关出口数据的公开报道，以及新华社、美联社行情和主流媒体报道。\n今日判断\n凌晨落地的英伟达财报，是今天唯一足够改写叙事的新信息，但还不够改写仓位结构。已核实：三季度营收1158亿美元，同比增103%、环比增20%；数据中心收入1076亿美元，同比增110%；非GAAP每股收益2.68美元，GAAP为2.70美元。第四季度营收指引中值1300亿美元、上下浮动3%，公司明确指引不含中国数据中心计算收入。当季GAAP和非GAAP毛利率分别为74.8%和74.9%，但四季度毛利率指引下调到71%至72%。电话会上，临时CEO克雷斯把2028财年营收增长预期上调到75%，并称“一切照常”；董事会主席则明确表示，不打算让黄仁勋复职。黄仁勋本人在辞职后的首份声明里说，若董事会认为回归符合股东、员工、公司和美国利益，他愿意回来——这是他的态度，不是董事会的决定，两句话不能并成“马上回归”。财报还披露，董事会已于今年9月将回购授权上调1500亿美元，三季度回购加派息281亿美元，截至季末剩余授权约2273亿美元。\n常规交易里，英伟达收155.46美元，跌0.44%；盘后公开报价约161.55美元，涨约3.9%，盘后一度接近4%。数字是超预期的，盘后也给了反应，但美股三大指数昨天仍是四连跌：道指跌1.64%报50759.42点，标普500跌1.03%报7340.53点，纳指跌0.74%报24328.38点，11个主要行业全部收跌。A股昨天已经先走完自己的结构：上证跌0.50%报3584.58点，再失3600；创业板跌1.20%报2292.20点，收盘跌破52周低位；科创50反而涨0.62%。资金提前买的是制造、设备和材料，不是光模块。所以今天的基调很清楚：不要把超预期理解成成长风格已经反转。相对更稳的仍是银行红利和家电；半导体制造和设备只当成事件反弹观察，开盘不追；CPO和已经地天板、连板的题材票，不要并进同一笔交易。Anthropic的定价和上市也在这两天落地，是另一只靴子。\n三大利多方向（由强到弱）\n一、半导体制造、设备与材料的国产替代，是事件上最有弹性的方向，但必须和光模块拆开看。已核实：中芯国
