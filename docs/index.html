<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d4a24c'/><text x='16' y='23' font-size='19' font-family='system-ui' text-anchor='middle' fill='%230a0d13'>财</text></svg>">
<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

易的二战胜利成果。核武器是悬在人类头上的“达摩克利斯之剑”，应该全面禁止并彻底销毁，最终建立无核武器世界。核战争打不赢也打不得。要尽一切努力防止核战争，遵守《不扩散核武器条约》，维护全球战略稳定。\n第三，坚持合作共赢。三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。应该摒弃冷战思维，加强经贸合作，将资源大国、制造大国、消费大国的各自优势贯通起来，共同做大合作蛋糕，实现双赢共赢，而不能搞“脱钩断链”。全球能源安全面临严峻挑战，三国可以加强沟通和协调，共同维护能源产业链供应链稳定畅通，维护全球能源市场安全稳定。\n第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。三国要保持常态化高层交往，畅通各层级对话渠道，建立危机沟通和预防机制，确保误判少发生、分歧管得住、摩擦不升级。当前，全球各种纷争持续不断，热点问题按下葫芦浮起瓢，国际社会期待大国多做劝和促谈工作。中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。（新华社）","en":"（全文）习近平就大国如何正确相处提出4点看法\n11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平就大国如何正确相处、共同为世界和平托底提出4点看法：\n第一，坚持相互尊重。相互尊重是大国交往的基本准则。中俄美三国国情不同，谁也改变不了谁，这是历史形成的，也是各自人民的自主选择。正确的态度是彼此尊重、求同存异、共同发展。要尊重彼此主权和领土完整，尊重各自选择的社会制度和发展道路，尊重彼此核心利益和重大关切。要坚持不干涉别国内政，不干涉彼此内部事务。在涉及对方的重大敏感问题上，提前沟通、换位思考、谨慎行事，特别是不能触碰对方的底线。\n第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线，努力跨越“修昔底德陷阱”。中俄美都是二战主要战胜国，应当坚定维护战后国际秩序，维护《联合国宪章》宗旨，捍卫来之不易的二战胜利成果。核武器是悬在人类头上的“达摩克利斯之剑”，应该全面禁止并彻底销毁，最终建立无核武器世界。核战争打不赢也打不得。要尽一切努力防止核战争，遵守《不扩散核武器条约》，维护全球战略稳定。\n第三，坚持合作共赢。三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。应该摒弃冷战思维，加强经贸合作，将资源大国、制造大国、消费大国的各自优势贯通起来，共同做大合作蛋糕，实现双赢共赢，而不能搞“脱钩断链”。全球能源安全面临严峻挑战，三国可以加强沟通和协调，共同维护能源产业链供应链稳定畅通，维护全球能源市场安全稳定。\n第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。三国要保持常态化高层交往，畅通各层级对话渠道，建立危机沟通和预防机制，确保误判少发生、分歧管得住、摩擦不升级。当前，全球各种纷争持续不断，热点问题按下葫芦浮起瓢，国际社会期待大国多做劝和促谈工作。中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。（新华社）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123343947061919796","l":[],"ln":[],"t":[],"lk":10,"rt":3,"rp":1,"vw":4551},{"id":"2123342854785536181","h":"bbcchinese","ts":1795079361,"zh":"美国总统特朗普（Donald Trump）、俄罗斯总统普京（Vladimir Putin）和中国国家主席习近平正在中国深圳举行会谈。\n此次会谈在深圳麒麟山庄举行，是三人首次进行三方会晤。在此之前，特朗普已分别与普京和习近平举行了双边会晤。","en":"美国总统特朗普（Donald Trump）、俄罗斯总统普京（Vladimir Putin）和中国国家主席习近平正在中国深圳举行会谈。\n此次会谈在深圳麒麟山庄举行，是三人首次进行三方会晤。在此之前，特朗普已分别与普京和习近平举行了双边会晤。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123342431412531201/vid/avc1/1080x1920/ca8NVRZImkdkeAyz.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2123342854785536181","l":[ 毒、非法移民遣返、打击电信网络诈骗等领域的合作卓有成效，可以本着尊重、公平、对等的原则继续加强合作。中美应当加强沟通和协调，防范人工智能安全风险，确保人工智能始终处于人类控制之下。\n特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。\n双方认为此次会晤是积极、建设性的，同意制定建设性战略稳定关系行动计划，落实两国元首共识，构建基于尊重、公平、对等的中美建设性战略稳定关系。\n两国元首还就共同关心的国际和地区问题交换了意见。\n蔡奇、王毅、何立峰、黄坤明等参加会见。","en":"习近平会见美国总统特朗普（新华社）\n11月19日下午，国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。\n习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道，确立了“中美建设性战略稳定关系”的新定位，并赋予其“基于尊重、公平、对等”的新内涵，受到中美两国人民认可和国际社会欢迎。中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性。我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。\n习近平强调，构建中美建设性战略稳定关系是前无古人的开创性事业，需要敢闯敢试、脚踏实地、善作善成。中美元首外交的引领作用不可替代。要延续中美关系目前的稳定向好势头，关键是要在落实元首共识上付诸行动。双方团队的沟通也要跟上。要拉长合作清单、压缩问题清单，一时解决不了的分歧要建设性管控，防止矛盾升级。在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折。经贸领域要加强沟通，解决彼此关切，争取互利互惠。两国在禁毒、非法移民遣返、打击电信网络诈骗等领域的合作卓有成效，可以本着尊重、公平、对等的原则继续加强合作。中美应当加强沟通和协调，防范人工智能安全风险，确保人工智能始终处于人类控制之下。\n特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。\n双方认为此次会晤是积极、建设性的，同意制定建设性战略稳定关系行动计划，落实两国元首共识，构建基于尊重、公平、对等的中美建设性战略稳定关系。\n两国元首还就共同关心的国际和地区问题交换了意见。\n蔡奇、王毅、何立峰、黄坤明等参加会见。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123330090138558473","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":7,"rt":3,"rp":1,"vw":5052},{"id":"2123329922265698461","h":"xingpt","ts":1795076277,"zh":"ChatGPT最近表现有多差：我甚至都开始用Gemini替代ChatGPT了。\nOpenAI现在表现得就像三个月前的Gemini。\n谁缺卡缺算力都不用问，降智了肯定是他家缺卡了","en":"ChatGPT最近表现有多差：我甚至都开始用Gemini替代ChatGPT了。\nOpenAI现在表现得就像三个月前的Gemini。\n谁缺卡缺算力都不用问，降智了肯定是他家缺卡了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2123329922265698461","l":[],"ln":[],"t":["AI科技"],"lk":7,"rt":0,"rp":4,"vw":591},{"id":"2123329467582218535","h":"fxtrader","ts":1795076169,"zh":"腾讯正在重新分配AI资源，大幅削减在元宝上的投入，从原来的用户规模为重调整为能力为重。\n#观察 与过去互联网时代不同，A 应该按公司的经营和估值目标来兑现。\n3. Cybertruck 给 Cybercab 腾产能\nCybertruck 计划在 2027 年年中逐步停产。马斯克说，平均每辆车约有 1.2 名乘客，双座 Cybercab 就能覆盖约 90% 的乘客出行里程。\n多人出行怎么办？Tesla 计划做一款 6 至 7 座、没有方向盘和踏板的自动驾驶版 Model Y，量产时间还没公布。\n4. Starlink 手机直连，接下来要解决室内信号\n第 2 代手机直连卫星计划从 2027 年起发射，带宽预计是第 1 代的约 40 倍。SpaceX 还计划在 2027 年量产使用 800 MHz 频段的屋顶微型基站，补上室内覆盖。\n马斯克认为，AI 和机器人会带来更多通信需求，AT&T 和 Verizon 依然有生意做。他也希望用 Starlink 的收入继续支持 Starship。\n5. 换掉黄仁勋，像连胜球队送走巅峰期的乔丹\n马斯克觉得，黄仁勋最难替代的地方，是几十年积累下来的供应商关系，以及核心员工对他的信任。他说自己当然愿意聘请黄仁勋，也判断对方眼下无意找工作。\n6. 中期选举花了数亿美元，重来一次会少捐\n如果 MAGA 意味着无条件支持共和党，马斯克说自己拒绝这个标签。他说，这次花了数亿美元支持共和党候选人，结果远低于预期，重来一次会少捐 😅\n他希望共和党守住参议院多数席位，理由是美国需要两党互相制衡。\n7. Starlink 全面停服，乌克兰前线可能迅速崩溃\n这是马斯克的判断。他说，Starlink 应用于民用通信，进攻性军事用途应交给 Starshield，相关决策由美国军事指挥体系负责。至于塞瓦斯托波尔，他给出的解释是，当地当时受制裁，Starlink 服务原本就没开通。\nBuy the dip，长期持有，Discord在个人资料","en":"马斯克 DealBook 访谈要点\n马斯克和《纽约时报》的主持人 Andrew 连线聊了 47 分钟。\n1. Anthropic 可能再租 10 GW 算力\n马斯克判断，Anthropic 大概率会继续租用 SpaceX 的算力，追加规模可能达到 10 GW。按他的说法，现有协议可以提前约 3 至 6 个月通知终止。\n跟 Anthropic 的员工打过交道后，他对这个团队改观了。他说这些人有原则、肯干，还专门夸了 Opus 和 Fable。\n2. SpaceX 和 Tesla 合并，马斯克现在觉得有价值\nTesla 在做自动驾驶和 Optimus，SpaceX 有大模型、算力基础设施和芯片研发。两家在 AI 上能一起做的事比 5 年前多了。他甚至认为，未来大部分超级智能的算力可能部署在太空轨道上。\n合并最终得双方股东点头。马斯克也说，他自己的 Tesla 股票奖励应该按公司的经营和估值目标来兑现。\n3. Cybertruck 给 Cybercab 腾产能\nCybertruck 计划在 2027 年年中逐步停产。马斯克说，平均每辆车约有 1.2 名乘客，双座 Cybercab 就能覆盖约 90% 的乘客出行里程。\n多人出行怎么办？Tesla 计划做一款 6 至 7 座、没有方向盘和踏板的自动驾驶版 Model Y，量产时间还没公布。\n4. Starlink 手机直连，接下来要解决室内信号\n第 2 代手机直连卫星计划从 2027 年起发射，带宽预计是第 1 代的约 40 倍。SpaceX 还计划在 2027 年量产使用 800 MHz 频段的屋顶微型基站，补上室内覆盖。\n马斯克认为，AI 和机器人会带来更多通信需求，AT&T 和 Verizon 依然有生意做。他也希望用 Starlink 的收入继续支持 Starship。\n5. 换掉黄仁勋，像连胜球队送走巅峰期的乔丹\n马斯克觉得，黄仁勋最难替代的地方，是几十年积累下来的供应商关系，以及核心员工对他的信任。他说自己当然愿意聘请黄仁勋，也判断对方眼下无意找工作。\n6. 中期选举花了数亿美元，重来一次会少捐\n如果 MAGA 意味着无条件支持共和党，马斯克说自己拒绝这个标签。他说，这次花了数亿美元支持共和党候选人，结果远低于预期，重来一次会少捐 😅\n他希望共和党守住参议院多数席位，理由是美国需要两党互相制衡。\n7. Starlink 全面停服，乌克兰前线可能迅速崩溃\n这是马斯克的判断。他说，Starlink 应用于民用通信，进攻性军事用途应交给 Starshield，相关决策由美国军事指挥体系负责。至于塞瓦斯托波尔，他给出的解释是，当地当时受制裁，Starlink 服务原本就没开通。\nBuy the dip，长期持有，Discord在个人资料","zh_src":"native","l 示，他期待当天稍后与普京及中国国家主席习近平举行“历史性的三方会晤”。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123305752899305472/vid/avc1/1080x1920/0YIdzyScdAs9lm1A.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2123305826932904447","l":[],"ln":[],"t":[],"lk":18,"rt":4,"rp":0,"vw":6565},{"id":"2123305190824788060","h":"dmjk001","ts":1795070381,"zh":"转\n【严正澄清】尊敬的客户，近日舆论刻意放大三星代工合规审查政策，编造 “三星全面停接国内算力芯片订单、行业流片一夜断供” 的不实信息，刻意引发国产算力链非理性下跌。我们持续跟踪产业一线，就此严正澄清：\n1. 所谓 “断供” 完全失实。本次审查仅针对通过多层壳公司规避出口管制的违规订单，合规经营的国内客户流片、交付流程全程正常，不存在任何一刀切停单的情况。\n2. 所谓 “断供拖累行业进度” 纯属无稽之谈。国内主流算力芯片厂商，从未将三星先进制程产能作为核心供应来源，本就不存在 “被断供” 的前提。\n3. 产业基本面未受任何影响：国产GPU、高端交换机、超节点整机订单排期已至明年，核心ODM合作厂产能满负荷，客户锁单意愿强烈，景气度持续上行。\n刻意散播恐慌、放大局部合规要求制造利空砸盘，本质是利用信息差收割非理性筹码。本轮下跌是纯粹的情绪错杀，请勿被别有用心的小作文误导。","en":"转\n【严正澄清】尊敬的客户，近日舆论刻意放大三星代工合规审查政策，编造 “三星全面停接国内算力芯片订单、行业流片一夜断供” 的不实信息，刻意引发国产算力链非理性下跌。我们持续跟踪产业一线，就此严正澄清：\n1. 所谓 “断供” 完全失实。本次审查仅针对通过多层壳公司规避出口管制的违规订单，合规经营的国内客户流片、交付流程全程正常，不存在任何一刀切停单的情况。\n2. 所谓 “断供拖累行业进度” 纯属无稽之谈。国内主流算力芯片厂商，从未将三星先进制程产能作为核心供应来源，本就不存在 “被断供” 的前提。\n3. 产业基本面未受任何影响：国产GPU、高端交换机、超节点整机订单排期已至明年，核心ODM合作厂产能满负荷，客户锁单意愿强烈，景气度持续上行。\n刻意散播恐慌、放大局部合规要求制造利空砸盘，本质是利用信息差收割非理性筹码。本轮下跌是纯粹的情绪错杀，请勿被别有用心的小作文误导。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123305190824788060","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":2,"rp":0,"vw":1720},{"id":"2123303719475478950","h":"qinbafrank","ts":1795070030,"zh":"9月底德鲁肯米勒还有四十多亿美金的股票仓位，现在已经完全清仓，逻辑是什么？对我们的投资交易有何启发？前两天美股机构改革纷纷披露截止9月底的三季度13-F文件，看到不少关于德鲁肯米勒家族办公室的持仓分析，不过现在看来意义都不大了。因为11月18日在奥斯汀举行的TomorrowX峰会上与摩根士丹利全球衍生品业务负责人Iliana Bouzali对谈中，德鲁肯米勒已经明确说都清仓了。一个半月前仓位还很高，现在已经全清掉，这中间的逻辑是什么？详细看完德鲁肯米勒这次谈话全文，有几个点让我印象深刻。\n1、今年1月初为何全力做多？\n1）当时经济非常强劲，更重要的是往前看——联邦基金利率只有 3.5%，而名义GDP 增速高达 6%，这意味着当时的货币政策宽松得简直荒谬！而且看美联储所谓的“点阵图（Dot plot）”，市场还预期今年晚些时候会有更多次降息；\n2）包括铜在内的大宗商品正在向上突破创出新高；\n3）德鲁肯米勒紧盯的腾落指数（Advance-Decline line，衡量市场广度的核心指标）和其他技术指标全都在创新高；\n4）信用利差（Credit spreads）窄到了极点。\n在他看来，在如此过度刺激的货币政策下，未来6 到 12 个月内根本不可能发生经济衰退。\n而去年深秋晚些时候发布的 Claude Code，让所有圈内人（对 AI 的加速爆发兴奋到了极点！ 因此我们对 AI 资本开支（CapEx）极度看多。所有这些因素叠加在一起，让我们在 1 月份全力做多股市和经济。\n2、现在为什么清仓？\n虽然表层经济看起来依然强劲，但年初支持看多的所有其他指标，已经彻底来了个 180 度大反转：\n1）美联储不再降息，而是在加息：我们在美联储迎来了“政权更迭，德鲁肯米勒对沃什非常熟，因为沃什曾在德鲁肯米勒家族办公室在担任合伙人多年，之前这里 15 年我们一直搞“免费资金（零利率）”导致财政赤字和所有债务冲上云霄极其不满，对通胀连续 5 年高于目标更是深恶痛绝。\n2）大宗商品见顶回落，反手做空铜。今年 1 月向上突破的大宗商品，现在看起来已经彻底见顶并掉头向下；\n3）市场广度背离与信用利差走阔。1 月份还在创新高的腾落指数（Advance-Decline line），早在8 月14 日 就已经见顶了，尽管大盘指数一直撑到10月份才见顶；\n4）信用利差正在不断走阔（Widening）。\n在德鲁肯米勒眼里当下所有的宏观与技术指标，都跟今年 1 月份完完全全相反！\n当下他最严肃对待的 AI 看空逻辑是就是政治，以及融资问题\n3、没有做多为什么也没做空？\n他现在既没有做多美股，也没有做空美股。没做空是因为AI 创新的爆发力，他说自己绝不敢去摸老虎屁股做空这里的科技创新！ \n还有一点德鲁肯米勒也承认当下很多科技股近期已经严重超卖、经历了剧烈的仓位洗盘（Washed out），战术层面上机构的仓位已经降下来了。潜在意思他也认为当下做空性价比已经不高了。\n但每当看不清方向的时候他自然会选择不玩了。\n4、AI的下半场是什么？\n在股票市场方面，德鲁肯米勒正在全力寻找“AI 的实际应用用例”，而不是“AI 基础设施”！\nAI 基础设施在经历了近期的剧烈洗盘后，或许会是一笔不错的短线战术交易（Tactical trade），但他也不认为基建硬件还能像过去四年那样，能继续充当主升浪的核心引擎。\n但他认为应用层用例（Use cases）却完全有可能接棒。而且也许最有趣的“应用用例”恰恰就是前沿 AI 实验室自己！他的逻辑是：掌握全球顶级智能的实验室，没有理由继续停留在按token收费的商业模式上。\n“如果你拥有世界上最强的智能，你可以开始卖任务，而不是卖token，你可以自己创建业务，”他说。\n如果接下来股市还会有一波波澜壮阔的大主升浪，他认为核心就是——“卖任务，不卖 Token”。\n这一点是个人很认可的，之前也有聊过 AI主线已经迁移、中游的云厂、下游的应用都值得关注。当然从德鲁肯米勒自己的表态来看他肯定有人在关注Anthropic上市后能介入的机会。\n5、对我们投资交易的启发是什么？\n1）反手的能力\n看德鲁肯米勒这次讲话印象最深的一点，年初他刚刚全力做多没多久，伊朗战争爆发，他也当时慌了神砍掉了一大堆仓位；\n但很很快又把仓位买回来，并且顺势把不会暴涨的杂毛股全清理干净了，让我们结结实实吃下了二季度的这波主升浪。你看发生冲击时他也会慌，也会砍仓，然后再看机会在哪里。\n还有就是9月底他的机构还是高仓位运行、但现在已经清仓、明显在10月初以来的这一波调整中他夜趁机把仓位都砍掉，就是不知道他的回撤有多大。\n但这种“反手”的能力值得我们学习、不让自己的判断成为执念，能随时纠正，这种灵活性是一个投资高手必须要能掌握的。\n2）在棒球比赛里，有远超随机概率的“连续击球手顺期（Hitting streaks）”。\n做投资也一样：\n有时候站在击球区能清清楚楚看清飞过来的球，那就抡圆了胳膊下重注（Play big）；\n而当感觉看不清球的时候，他就只做一点小小的触击短打（Little bunts），等什么时候胜率回升、重新看清球路了，我再重新发力。","en":"9月底德鲁肯米勒还有四十多亿美金的股票仓位，现在已经完全清仓，逻辑是什么？对我们的投资交易有何启发？前两天美股机构改革纷纷披露截止9月底的三季度13-F文件，看到不少关于德鲁肯米勒家族办公室的持仓分析，不过现在看来意义都不大了。因为11月18日在奥斯汀举行的TomorrowX峰会上与摩根士丹利全球衍生品业务负责人Iliana Bouzali对谈中，德鲁肯米勒已经明确说都清仓了。一个半月前仓位还很高，现在已经全清掉，这中间的逻辑是什么？详细看完德鲁肯米勒这次谈话全文，有几个点让我印象深刻。\n1、今年1月初为何全力做多？\n1）当时经济非常强劲，更重要的是往前看——联邦基金利率只有 3.5%，而名义GDP 增速高达 6%，这意味着当时的货币政策宽松得简直荒谬！而且看美联储所谓的“点阵图（Dot plot）”，市场还预期今年晚些时候会有更多次降息；\n2）包括铜在内的大宗商品正在向上突破创出新高；\n3）德鲁肯米勒紧盯的腾落指数（Advance-Decline line，衡量市场广度的核心指标）和其他技术指标全都在创新高；\n4）信用利差（Credit spreads）窄到了极点。\n在他看来，在如此过度刺激的货币政策下，未来6 到 12 个月内根本不可能发生经济衰退。\n而去年深秋晚些时候发布的 Claude Code，让所有圈内人（对 AI 的加速爆发兴奋到了极点！ 因此我们对 AI 资本开支（CapEx）极度看多。所有这些因素叠加在一起，让我们在 1 月份全力做多股市和经济。\n2、现在为什么清仓？\n虽然表层经济看起来依然强劲，但年初支持看多的所有其他指标，已经彻底来了个 180 度大反转：\n1）美联储不再降息，而是在加息：我们在美联储迎来了“政权更迭，德鲁肯米勒对沃什非常熟，因为沃什曾在德鲁肯米勒家族办公室在担任合伙人多年，之前这里 15 年我们一直搞“免费资金（零利率）”导致财政赤字和所有债务冲上云霄极其不满，对通胀连续 5 年高于目标更是深恶痛绝。\n2）大宗商品见顶回落，反手做空铜。今年 1 月向上突破的大宗商品，现在看起来已经彻底见顶并掉头向下；\n3）市场广度背离与信用利差走阔。1 月份还在创新高的腾落指数（Advance-Decline line），早在8 月14 日 就已经见顶了，尽管大盘指数一直撑到10月份才见顶；\n4）信用利差正在不断走阔（Widening）。\n在德鲁肯米勒眼里当下所有的宏观与技术指标，都跟今年 1 月份完完全全相反！\n当下他最严肃对待的 AI 看空逻辑是就是政治，以及融资问题\n3、没有做多为什么也没做空？\n他现在既没有做多美股，也没有做空美股。没做空是因为AI 创新的爆发力，他说自己绝不敢去摸老虎屁股做空这里的科技创新！ \n还有一点德鲁肯米勒也承认当下很多科技股近期已经严重超卖、经历了剧烈的仓位洗盘（Washed out），战术层面上机构的仓位已经降下来了。潜在意思他也认为当下做空性价比已经不高了。\n但每当看不清方向的时候他自然会选择不玩了。\n4、AI的下半场是什么？\n在股票市场方面，德鲁肯米勒正在全力寻找“AI 的实际应用用例”，而不是“AI 基础设施”！\nAI 基础设施在经历了近期的剧烈洗盘后，或许会是一笔不错的短线战术交易（Tactical trade），但他也不认为基建硬件还能像过去四年那样，能继续充当主升浪的核心引擎。\n但他认为应用层用例（Use cases）却完全有可能接棒。而且也许最有趣的“应用用例”恰恰就是前沿 AI 实验室自己！他的逻辑是：掌握全球顶级智能的实验室，没有理由继续停留在按token收费的商业模式上。\n“如果你拥有世界上最强的智能，你可以开始卖任务，而不是卖token，你可以自己创建业务，”他说。\n如果接下来股市还会有一波波澜壮阔的大主升浪，他认为核心就是——“卖任务，不卖 Token”。\n这一点是个人很认可的，之前也有聊过 AI主线已经迁移、中游的云厂、下游的应用都值得关注。当然从德鲁肯米勒自己的表态来看他肯定有人在关注Anthropic上市后能介入的机会。\n5、对我们投资交易的启发是什么？\n1）反手的能力\n看德鲁肯米勒这次讲话印象最深的一点，年初他刚刚全力做多没多久，伊朗战争爆发，他也当时慌了神砍掉了一大堆仓位；\n但很很快又把仓位买回来，并且顺势把不会暴涨的杂毛股全清理干净了，让我们结结实实吃下了二季度的这波主升浪。你看发生冲击时他也会慌，也会砍仓，然后再看机会在哪里。\n还有就是9月底他的机构还是高仓位运行、但现在已经清仓、明显在10月初以来的这一波调整中他夜趁机把仓位都砍掉，就是不知道他的回撤有多大。\n但这种“反手”的能力值得我们学习、不让自己的判断成为执念，能随时纠正，这种灵活性是一个投资高手必须要能掌握的。\n2）在棒球比赛里，有远超随机概率的“连续击球手顺期（Hitting streaks）”。\n做投资也一样：\n有时候站在击球区能清清楚楚看清飞过来的球，那就抡圆了胳膊下重注（Play big）；\n而当感觉看不清球的时候，他就只做一点小小的触击短打（Little bunts），等什么时候胜率回升、重新看清球路了，我再重新发力。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2123303719475478950","l":["x.com","x.com"],"ln":[{"u":"https://x.com/qinbafrank/status/2017205726301823008?a=ish1j1_G9yEALfJyefQ&s=46有聊过。他知道沃什对过去","d":"x.com"},{"u":"https://x.com/qinbafrank/status/2118134547703562723?a=ZHeGwBJN15QLeV2CGek&s=46","d":"x.com"}],"t":["美联储","通胀","美股","AI科技"],"lk":4,"rt":2,"rp":0,"vw":1254},{"id":"2123303708154802641","h":"bbcchinese","ts":1795070027,"zh":"APEC领导人峰会在深圳举行之际，中美俄三国元首习近平、特朗普与普京举行罕有的三边会谈。BBC News中文即将转播。","en":"APEC领导人峰会在深圳举行之际，中美俄三国元首习近平、特朗普与普京举行罕有的三边会谈。BBC News中文即将转播。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2123303708154802641","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4ABriRV","d":"bbc.in"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":797},{"id":"2123303685317169479","h":"dmjk001","ts":1795070022,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXd9cSPbAAAqN3f.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123303685317169479","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":152},{"id":"2123303646456852557","h":"ArtofSpecuycky","ts":1795070013,"zh":"大盘短期看反弹，中期继续看跌\n标普500指数已经连续下跌5个交易日，前三个交易日罕见地连续出现三个派发日，指数下跌成交量放大，每天跌幅超过1%。历史上这种连续放量抛售对应阶段性底部，只不过底部形成过程都非常反复。\n我认为周四上涨概率很大。 加上Anthropic上市带来的情绪提振、打新资金可能回流、中美俄峰会、CTA空头潜在转为多头，以及市场上太多人看空，可能引发Gamma Squeeze和Short Squeeze。目前这个Setup也很像11月6日大涨的那一天，价格行为很相似。\nSPY明天重点关注11月5号低点733附近能否守稳。如果高开并站稳733和开盘价上方，可以顺势做多，第一目标738-740。再往上看745和0.618 fib 749.5，极限ema 20 751.6。\n虽今日标普微跌，但盘面出现Risk-on特征：非必需消费品上涨1.79%，科技股领涨，前期强势的价值股回调，小盘成长股走强，能源股大跌3.27%。资金开始从防御板块重新流向成长板块，对短期反弹是积极信号。\n情绪面还是比较悲观，但比上周好点。最新AAII投资者情绪调查显示，看空比例从上周的51.4%下降至42.2%，看多比例从30.8%回升至33.3%，中性比例从17.8%升至24.4%。 虽然悲观情绪有所缓解，但看空比例还是高于看多比例，Bull-Bear Spread-8.9个百分点。之前连续两周看空比例分别达到48.4%和51.4%，说明市场短期已经经历了一轮恐慌情绪释放。这种情绪环境下，短期还是容易出现技术性反弹。\n不过本质上，我认为QQQ目前还是处于650–700的大区间震荡，策略还是低买高卖。\n2018年历史类比与市场结构\n2026年同样是中期选举年，目前美股和10年期美债收益率的走势与2018年高度吻合，都是在10月初附近见顶回落。10月份连续杀跌后，11月份作为下跌中继，反弹修整一个月。短期还是看反弹，中期接着看跌。\nOpEx、Gamma与VIX\n本周五是月度OpEx，大量负Gamma敞口到期会释放做市商的被动抛压，叠加下周感恩节假期临近，波动率会进一步回落。\n目前SPX全链条总GEX为-15亿美元，其中未来两个交易日到期的合约贡献-10亿美元，已经处于极端负Gamma区域。这种环境下市场容易放大波动，如果开始反弹，也可能引发剧烈的均值回归。\n上方最大的Gamma集中区域在7400，其次是7500。今日7325、7400和7475附近出现明显的看涨期权资金流。如果反弹继续，7400是第一个重要目标，之后看7500。\nVIX也按照预期开始下跌，今日形成Inside Day并收在25下方。25是目前最重要的多空分水岭。 如果继续跌破就看到20。\nQQQ与SPX关键点位\nQQQ原本我的判断是走一个Bear Flag，在11月5日低点附近形成Higher Low后反弹，最多到718 0.618 fib，然后继续下跌。但现在来看，像是走了个Double Bottom。\n大概率还是650–700的箱体震荡下跌中继，只有有效站回702且不再跌回来，才有可能有更大的反弹。\n短线QQQ先看670，上方683.75是200日均线和11月5日破位低点的共振阻力。反弹到这些区域后会遇阻。我希望这个中期诱多反弹最高能到700–710，能到这里就很满意了，当然如果更高更好。\nSPX方面，周线目前处于派发阶段，但机构出货比较慢，所以大概率还要维持一个7300–7600的震荡区间。周线来看，现在很有可能形成一个大级别右肩，后续如果反弹到EMA 20 7540，甚至7600，都是比较理想的做空机会。\n机构仓位与板块轮动\n结合Duality Research与美银基金经理调查数据，基金经理对科技股的配置已经降至2004–2006年以来的低位水平。\n同时，XLP今年上涨20.2%，但EPS增速只有3.1%，绝大部分涨幅来自估值倍数扩张。XLV表现也很不错，这也表现经济周期尾部机构抱团防御的特征。\n这些现象说明机构之前已经降低风险敞口。短期如果市场情绪改善，科技股存在资金回流和仓位修复的机会，但中期风险没有解除。\n交易方向与个股\n短期最好还是以TQQQ、SOXL等指数为主，围绕箱体做波段。个股如果真要选，可以重点围绕AMD、AVGO、SPCX、TSLA和网络安全板块。\nNVDA日线和周线都已经非常超卖，150附近是重要的Put Wall，随时可能出现Dead Cat Bounce的技术性反抽。\n韩国KOSPI目前也在4900–5500区间震荡，趋势线已经破位。后续任何反弹到EMA 20附近的5400–5500，还是我关注的做空机会，中期目标看周线200 EMA附近的4170。","en":"大盘短期看反弹，中期继续看跌\n标普500指数已经连续下跌5个交易日，前三个交易日罕见地连续出现三个派发日，指数下跌成交量放大，每天跌幅超过1%。历史上这种连续放量抛售对应阶段性底部，只不过底部形成过程都非常反复。\n我认为周四上涨概率很大。 加上Anthropic上市带来的情绪提振、打新资金可能回流、中美俄峰会、CTA空头潜在转为多头，以及市场上太多人看空，可能引发Gamma Squeeze和Short Squeeze。目前这个Setup也很像11月6日大涨的那一天，价格行为很相似。\nSPY明天重点关注11月5号低点733附近能否守稳。如果高开并站稳733和开盘价上方，可以顺势做多，第一目标738-740。再往上看745和0.618 fib 749.5，极限ema 20 751.6。\n虽今日标普微跌，但盘面出现Risk-on特征：非必需消费品上涨1.79%，科技股领涨，前期强势的价值股回调，小盘成长股走强，能源股大跌3.27%。资金开始从防御板块重新流向成长板块，对短期反弹是积极信号。\n情绪面还是比较悲观，但比上周好点。最新AAII投资者情绪调查显示，看空比例从上周的51.4%下降至42.2%，看多比例从30.8%回升至33.3%，中性比例从17.8%升至24.4%。 虽然悲观情绪有所缓解，但看空比例还是高于看多比例，Bull-Bear Spread-8.9个百分点。之前连续两周看空比例分别达到48.4%和51.4%，说明市场短期已经经历了一轮恐慌情绪释放。这种情绪环境下，短期还是容易出现技术性反弹。\n不过本质上，我认为QQQ目前还是处于650–700的大区间震荡，策略还是低买高卖。\n2018年历史类比与市场结构\n2026年同样是中期选举年，目前美股和10年期美债收益率的走势与2018年高度吻合，都是在10月初附近见顶回落。10月份连续杀跌后，11月份作为下跌中继，反弹修整一个月。短期还是看反弹，中期接着看跌。\nOpEx、Gamma与VIX\n本周五是月度OpEx，大量负Gamma敞口到期会释放做市商的被动抛压，叠加下周感恩节假期临近，波动率会进一步回落。\n目前SPX全链条总GEX为-15亿美元，其中未来两个交易日到期的合约贡献-10亿美元，已经处于极端负Gamma区域。这种环境下市场容易放大波动，如果开始反弹，也可能引发剧烈的均值回归。\n上方最大的Gamma集中区域在7400，其次是7500。今日7325、7400和7475附近出现明显的看涨期权资金流。如果反弹继续，7400是第一个重要目标，之后看7500。\nVIX也按照预期开始下跌，今日形成Inside Day并收在25下方。25是目前最重要的多空分水岭。 如果继续跌破就看到20。\nQQQ与SP 值3.5万亿，剔除在Anthropic和SpaceX的股权，多花一万亿就能再给你全套互联网搜索/安卓入口，第一视频Youtube，自研芯片TPU，谷歌云。\n最新发布的Gemini 4 Neon已经把前沿模型的代差抹平甚至领先。\n那么问题来了，是Anthropic高估了？还是Google低估了？","en":"Anthropic明天史上最大IPO上市，按83定价市值1.5万亿，开盘情绪饱满或许市值破2万亿。买什么？背着万亿算力账单的“纯血AI顶级模型第一股？\n真正投资亮点在哪里？都知道买股票看未来，为何不买谷歌。\n看它招股说明书唯一在于， $ANT未来愿景是要打造垂直整合，专有芯片，自己的数据中心，实现软硬协同设计的成本/效率/算力的系统护城河。\n这不就是谷歌 $GOOG么，现市值3.5万亿，剔除在Anthropic和SpaceX的股权，多花一万亿就能再给你全套互联网搜索/安卓入口，第一视频Youtube，自研芯片TPU，谷歌云。\n最新发布的Gemini 4 Neon已经把前沿模型的代差抹平甚至领先。\n那么问题来了，是Anthropic高估了？还是Google低估了？","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdmFtyawAALNtI.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2123278479613718858","l":[],"ln":[],"t":["AI科技"],"lk":8,"rt":0,"rp":3,"vw":1328},{"id":"2123277185482113140","h":"dmjk001","ts":1795063704,"zh":"针对市场流传的某版 “算力芯片流片来源梳理”，结合我们产业链跟踪，做几点差异化汇报，供参考：\n代工结构修正：不能简单按 “海外 / 国内” 一刀切\n【寒武纪】690 从 26 年起主力已切 S；并非 “三星断供即没戏”。\n【天数 / 燧原】并非纯台积依赖，两家均有 S/H 产能储备，冲击程度要看各家配额。\n【壁仞】代工以 H 为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600 走 S 的 n+1 国产闭环。\n【平头哥】S + 三星双源，不是 H 为主。\n【摩尔 / 昆仑芯 / 芯原】均有 S 产能并行，不能按 “海外代工 = 规避” 直接外推。关于 “三星 / 台积穿透严查”BIS 新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升 + 边际收紧。","en":"针对市场流传的某版 “算力芯片流片来源梳理”，结合我们产业链跟踪，做几点差异化汇报，供参考：\n代工结构修正：不能简单按 “海外 / 国内” 一刀切\n【寒武纪】690 从 26 年起主力已切 S；并非 “三星断供即没戏”。\n【天数 / 燧原】并非纯台积依赖，两家均有 S/H 产能储备，冲击程度要看各家配额。\n【壁仞】代工以 H 为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600 走 S 的 n+1 国产闭环。\n【平头哥】S + 三星双源，不是 H 为主。\n【摩尔 / 昆仑芯 / 芯原】均有 S 产能并行，不能按 “海外代工 = 规避” 直接外推。关于 “三星 / 台积穿透严查”BIS 新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升 + 边际收紧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123277185482113140","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1392},{"id":"2123276957089669612","h":"xingpt","ts":1795063649,"zh":"效率与回本，决定 AI 投资能否持续：\n按照摩根大通的模型，每建设 1GW 算力需要约 400 亿美元投资，每年需要约 220 亿美元的终端 AI 支出来支撑。要达到 2029 年的收入门槛，终端 AI 市场需要维持约 80% 的年复合增长。\n接下来决定行业回报的关键，是单位算力成本下降的速度，以及新增资本开支转化为收入和自由现金流的效率。\nAI 投资最终将从比拼谁投入更多资本，转向比拼谁能用更低的成本创造更多收入。","en":"效率与回本，决定 AI 投资能否持续：\n按照摩根大通的模型，每建设 1GW 算力需要约 400 亿美元投资，每年需要约 220 亿美元的终端 AI 支出来支撑。要达到 2029 年的收入门槛，终端 AI 市场需要维持约 80% 的年复合增长。\n接下来决定行业回报的关键，是单位算力成本下降的速度，以及新增资本开支转化为收入和自由现金流的效率。\nAI 投资最终将从比拼谁投入更多资本，转向比拼谁能用更低的成本创造更多收入。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdiVnhawAAdzum.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123276957089669612","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":225},{"id":"2123276952413020352","h":"xingpt","ts":1795063648,"zh":"2. AI资本开支先投入，再获利：\n2026 年全球 AI 资本开支已经接近万亿美元规模，几大hyperscaler：Amazon、Google、Microsoft、Meta 仍在加速建设，马斯克也计划进一步扩张算力，如果 2027 年实际新增 7GW，SpaceX按照每 GW 300 亿美元计算，仅这一项就需要约 2,100 亿美元。\n未来三年，AI 基础设下载施投资将持续领先于商业收入兑现。2029 年将是关键验证窗口：数万亿美元的算力投入，必须逐渐转化为真实的云收入、推理需求和企业 AI 付费。","en":"2. AI资本开支先投入，再获利：\n2026 年全球 AI 资本开支已经接近万亿美元规模，几大hyperscaler：Amazon、Google、Microsoft、Meta 仍在加速建设，马斯克也计划进一步扩张算力，如果 2027 年实际新增 7GW，SpaceX按照每 GW 300 亿美元计算，仅这一项就需要约 2,100 亿美元。\n未来三年，AI 基础设下载施投资将持续领先于商业收入兑现。2029 年将是关键验证窗口：数万亿美元的算力投入，必须逐渐转化为真实的云收入、推理需求和企业 AI 付费。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdk8i6bwAEx45t.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123276952413020352","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":285},{"id":"2123276948038381943","h":"xingpt","ts":1795063647,"zh":"摩根大通：AI投入到底多少，能赚钱吗？什么时候开始盈利？\n1. 当前 AI 的账，怎么算？\n摩根大通测算：全球到 2029 年建成约 129GW 的 AI 算力，需要累计投入约 5.16 万亿美元，每年创造约 2.84 万亿美元的终端收入才能支撑这套基础设施。\n企业、消费者和政府的潜在 AI 支出合计约 3.65 万亿美元，其中企业贡献近 70%。这意味着 AI 商业化的核心战场在企业端，只有 AI Agent 真正进入工作流程、创造生产率价值，数万亿美元的市场才能成立。","en":"摩根大通：AI投入到底多少，能赚钱吗？什么时候开始盈利？\n1. 当前 AI 的账，怎么算？\n摩根大通测算：全球到 2029 年建成约 129GW 的 AI 算力，需要累计投入约 5.16 万亿美元，每年创造约 2.84 万亿美元的终端收入才能支撑这套基础设施。\n企业、消费者和政府的潜在 AI 支出合计约 3.65 万亿美元，其中企业贡献近 70%。这意味着 AI 商业化的核心战场在企业端，只有 AI Agent 真正进入工作流程、创造生产率价值，数万亿美元的市场才能成立。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdh7_haoAA3-c8.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123276948038381943","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":2,"vw":821},{"id":"2123276726004498849","h":"dmjk001","ts":1795063594,"zh":null,"en":"","z "lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123272667792826669","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/russia-is-integral-part-asia-pacific-putin-tells-apec-leaders-2026-11-19/?taid=6afe7b634f7b1a0001e4ae4d&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["原油能源"],"lk":0,"rt":0,"rp":0,"vw":338},{"id":"2123272387106066726","h":"cnfinancewatch","ts":1795062560,"zh":"一个人打烂饭碗受到严惩，\n导致九十九人不敢洗碗！","en":"一个人打烂饭碗受到严惩，\n导致九十九人不敢洗碗！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123272387106066726","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":215},{"id":"2123272112509276203","h":"cnfinancewatch","ts":1795062494,"zh":"第六天连续4千多家股票下跌，\n这种跌法，不少融资盘要爆仓了","en":"第六天连续4千多家股票下跌，\n这种跌法，不少融资盘要爆仓了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123272112509276203","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":3,"vw":798},{"id":"2123271600837628348","h":"qinbafrank","ts":1795062372,"zh":"腾讯认为资本开支高峰是什么时候以及28年之后硬件价格会如何？昨天腾讯三季度财报，大家关注最多的是workbuddy日活超千万用户，每日累计消耗Token超过100万亿；再一个就是负自由现金流人民币691亿元。其实个人角度更值得关注的腾讯是如何看待资本开支以及硬件价格走势的。\n在腾讯第三季度业绩电话会上，Bernstein的分析师Robin G提出的关于资本开支/预付款进展及美国限制影响的问题。看看这个问题的详细问答\nBernstein的Robin G：\n我想提两个问题。首先，我们已经连续两个季度的资本开支和预付款支出都非常高。我想了解一下，腾讯在这一轮激进的算力采购支出中目前进展如何？按照您的判断，我们距离达到理想的算力水平还有多远？另外，美国的限制措施将如何影响我们现有的以及未来的算力合作？这是否会对我们此前在云业务及其他领域看到的增长势头产生不利影响？其次，Work Buddy的表现非常出色。想请管理层评估一下该业务未来的机会空间——从用户增长来看，其可触达的市场和收入利润潜力主要集中在重度用户群体吗？考虑到半导体领域的限制，这一增长前景是否存在风险？\n腾讯首席战略官詹姆斯·米歇尔 / James Mitchell回答：\n那么，Robin，我先来回答关于预付款项和资本开支，以及先进制程半导体限制对云业务收入增长影响的几个问题。关于预付款项，大家知道，第二季度和第三季度的支出水平异常偏高，而我们现在已签署了此前计划签订的长期合同，因此预付款项的流出将逐步减少。事实上，未来某些季度可能会出现因取消此前已预付的合同而导致预付款项回流的情况。不过，随着近期资本开支相关条款的变化，我们正在逐步退出这部分预付款项的影响。至于当前的现金资本开支水平，我们认为应以现金口径来看待，这一数字约为650亿元人民币，而非810亿元人民币的权责发生制资本开支。因为如果同时考虑预付款项和资本开支，就应该统一以现金资本开支口径进行核算；否则，将预付款项与权责发生制资本开支叠加计算，就会造成重复计数。\n总之，从现金资本开支的水平来看，我们认为目前已处于阶段性高位，预计在2026年和2027年剩余时间内，该指标可能在这一峰值附近呈现季度间的波动。此后，我们预计其将进一步回落。\n至于这些限制对我们的云业务有何影响，我们实际上并未看到任何冲击。因为目前我们的云业务主要以推理为主，且重点运行诸如HY 4 Flash等高能效推理模型以及其他Flash系列模型。而且，在当前阶段，这些推理任务已能在数量出奇有限的国产芯片上高效执行。\n因此，我认为过去12个月里，我们在推理效率方面实现了显著提升，从而使得仅靠国产芯片就能处理远超一年前预期的更大规模的token流量。而云业务收入的核心驱动力正是推理。所以，我们认为此次变化不会对我们的云业务收入造成实质性不利影响。\n腾讯总裁马丁·刘 / 刘炽平补充回答：\n我想就詹姆斯刚才谈到的内容补充几点。首先，在资本开支方面，我认为目前我们投入的这些资本支出，实际上是为了夯实基础设施，从而推动我们的AI原生业务尽快起步。现阶段有点像在建一座工厂，以便开展模型训练和Token生成工作。其本质在于，一旦建成这套设施，后续就可以持续用于训练新一代模型，并不断产出新的Token。\n因此，我们在26年和27年进行了相关投入后，进入28年，趋势就会逐步改善，因为我们可以持续利用26年和27年所建设的基础设施。\n其次，我们在26年和27年实际看到的定价水平确实偏高。进入28年，即便采购需求不变，价格也应会显著回落。\n第三，也是我认为最重要的一点：经过对模型训练与推理环节的持续优化，我们发现计算效率正以极快的速度逐年提升。这意味着，随着技术进步，在保持相同算力投入的前提下，我们将能够实现更高的训练效率，以及更大的Token产出规模。综合以上因素，我们认为28年及以后的业绩表现将更加出色。\n简单说：\n1）腾讯自己认为当下就是资本开支的高点，26年四季度和27年资本开支就在当下的规模水平左右，之后会进步下滑。\n2）28年硬件采购的价格会回落即使需求不变。\n3）28年随着26、27年建设的投入落地，业绩表现会非常好。也是之前聊到的数据中心建设节奏、算力陆续落地、大云厂商的业绩会很好。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"腾讯认为资本开支高峰是什么时候以及28年之后硬件价格会如何？昨天腾讯三季度财报，大家关注最多的是workbuddy日活超千万用户，每日累计消耗Token超过100万亿；再一个就是负自由现金流人民币691亿元。其实个人角度更值得关注的腾讯是如何看待资本开支以及硬件价格走势的。\n在腾讯第三季度业绩电话会上，Bernstein的分析师Robin G提出的关于资本开支/预付款进展及美国限制影响的问题。看看这个问题的详细问答\nBernstein的Robin G：\n我想提两个问题。首先，我们已经连续两个季度的资本开支和预付款支出都非常高。我想了解一下，腾讯在这一轮激进的算力采购支出中目前进展如何？按照您的判断，我们距离达到理想的算力水平还有多远？另外，美国的限制措施将如何影响我们现有的以及未来的算力合作？这是否会对我们此前在云业务及其他领域看到的增长势头产生不利影响？其次，Work Buddy的表现非常出色。想请管理层评估一下该业务未来的机会空间——从用户增长来看，其可触达的市场和收入利润潜力主要集中在重度用户群体吗？考虑到半导体领域的限制，这一增长前景是否存在风险？\n腾讯首席战略官詹姆斯·米歇尔 / James Mitchell回答：\n那么，Robin，我先来回答关于预付款项和资本开支，以及先进制程半导体限制对云业务收入增长影响的几个问题。关于预付款项，大家知道，第二季度和第三季度的支出水平异常偏高，而我们现在已签署了此前计划签订的长期合同，因此预付款项的流出将逐步减少。事实上，未来某些季度可能会出现因取消此前已预付的合同而导致预付款项回流的情况。不过，随着近期资本开支相关条款的变化，我们正在逐步退出这部分预付款项的影响。至于当前的现金资本开支水平，我们认为应以现金口径来看待，这一数字约为650亿元人民币，而非810亿元人民币的权责发生制资本开支。因为如果同时考虑预付款项和资本开支，就应该统一以现金资本开支口径进行核算；否则，将预付款项与权责发生制资本开支叠加计算，就会造成重复计数。\n总之，从现金资本开支的水平来看，我们认为目前已处于阶段性高位，预计在2026年和2027年剩余时间内，该指标可能在这一峰值附近呈现季度间的波动。此后，我们预计其将进一步回落。\n至于这些限制对我们的云业务有何影响，我们实际上并未看到任何冲击。因为目前我们的云业务主要以推理为主，且重点运行诸如HY 4 Flash等高能效推理模型以及其他Flash系列模型。而且，在当前阶段，这些推理任务已能在数量出奇有限的国产芯片上高效执行。\n因此，我认为过去12个月里，我们在推理效率方面实现了显著提升，从而使得仅靠国产芯片就能处理远超一年前预期的更大规模的token流量。而云业务收入的核心驱动力正是推理。所以 《季候风》，后有这首歌，看来8、90年代的复古香港文化又要重新流行一段时间。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123251855673438208/vid/avc1/1280x720/tBbHAPCwoyD4msW5.mp4?tag=29","https://pbs.twimg.com/media/HXdOWGmakAAuECp.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123252855146782765","l":[],"ln":[],"t":[],"lk":32,"rt":2,"rp":6,"vw":5559},{"id":"2123250635403653594","h":"qinbafrank","ts":1795057374,"zh":"一周集齐DCM、DCO、FCM，对Backpack而言，意味着具备了在美国合规开展杠杆永续合约业务的所有基础设施条件：可以自主上市合约、接收并保管客户资金、完成清算，并在CFTC和NFA的监管框架下运营，至此在交易所、清算所和客户中介三层全部落地，Backapck形成完整的垂直监管合规架构。\nDCM+DCO+FCM的组合，是目前美国合规框架下衍生品也最完整也是最高级别的基础设施配置。Backpack用一周时间把这三张牌收齐，这样其衍生品业务不仅牌照数量上跟Coinbase一样，甚至牌照的覆盖范围还要大。\n两者现在都具备端到端的美国合规衍生品能力。区别在于清算范围：\nCoinbase Clearing目前主要覆盖全额抵押产品，杠杆保证金业务仍部分依赖外部清算伙伴；\nBackpack的DCO则明确包含保证金期货，对杠杆永续合约的自主清算更为直接。\n现在就期待后续美股个股永续合约真正在Backpack上线交易了。","en":"一周集齐DCM、DCO、FCM，对Backpack而言，意味着具备了在美国合规开展杠杆永续合约业务的所有基础设施条件：可以自主上市合约、接收并保管客户资金、完成清算，并在CFTC和NFA的监管框架下运营，至此在交易所、清算所和客户中介三层全部落地，Backapck形成完整的垂直监管合规架构。\nDCM+DCO+FCM的组合，是目前美国合规框架下衍生品也最完整也是最高级别的基础设施配置。Backpack用一周时间把这三张牌收齐，这样其衍生品业务不仅牌照数量上跟Coinbase一样，甚至牌照的覆盖范围还要大。\n两者现在都具备端到端的美国合规衍生品能力。区别在于清算范围：\nCoinbase Clearing目前主要覆盖全额抵押产品，杠杆保证金业务仍部分依赖外部清算伙伴；\nBackpack的DCO则明确包含保证金期货，对杠杆永续合约的自主清算更为直接。\n现在就期待后续美股个股永续合约真正在Backpack上线交易了。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdMNiCbAAA2JQa.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123250635403653594","l":[],"ln":[],"t":["美股"],"lk":19,"rt":0,"rp":11,"vw":7294},{"id":"2123250327814357008","h":"xingpt","ts":1795057300,"zh":"【一年后，我不再用 WHOOP 了】\n我准备把 Whoop 换成佳明的 CIRQA 手环。这个是 2026 年 7 月新出的佳明手环，对标的就是 Whoop。\n佳明这个是一次性大概 200 美金买断，而 Whoop 是 200 美金订阅一年，每年都要重复付费，所以佳明长期来看更划算。\n另外我发现 Whoop 测睡眠特别不准，特别是一些短时间的睡眠其实不是很准，所以我想用佳明试试。而且我最看重的身体年龄这个指标两个也都有，所以我可能会换佳明试试。","en":"【一年后，我不再用 WHOOP 了】\n我准备把 Whoop 换成佳明的 CIRQA 手环。这个是 2026 年 7 月新出的佳明手环，对标的就是 Whoop。\n佳明这个是一次性大概 200 美金买断，而 Whoop 是 200 美金订阅一年，每年都要重复付费，所以佳明长期来看更划算。\n另外我发现 Whoop 测睡眠特别不准，特别是一些短时间的睡眠其实不是很准，所以我想用佳明试试。而且我最看重的身体年龄这个指标两个也都有，所以我可能会换佳明试试。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdMkMYbkAAkZJF.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123250327814357008","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":305},{"id":"2123250235430605117","h":"cnfinancewatch","ts":1795057278,"zh":"大金融、大消费已经涨了一段；目前大盘靠大金融和大消费还比较难。\n目前大金融等在休息，但科技还是不涨。\n比较悲观的看法是大金融消息，大盘就回落。\n科技和金融都跌，就是没人气。\n很像924行情前那段。\n多看券商。银行和保险没力气了么。","en":"大金融、大消费已经涨了一段；目前大盘靠大金融和大消费还比较难。\n目前大金融等在休息，但科技还是不涨。\n比较悲观的看法是大金融消息，大盘就回落。\n科技和金融都跌，就是没人气。\n很像924行情前那段。\n多看券商。银行和保险没力气了么。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123250235430605117","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":347},{"id":"2123250070925594861","h":"ReutersChina","ts":1795057239,"zh":"美国总统唐纳德·特朗普表示，他周四与中国国家主席习近平和俄罗斯总统弗拉基米尔·普京的会晤在举行之前就已经是一次“胜利”，因为中国给予了他热烈的欢迎。","en":"US President Donald Trump said his meeting on Thursday with Chinese and Russian counterparts Xi Jinping and Vladimir Putin was already a \"win\" before it took place, as China gave him a warm welcome.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123250070925594861","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/trumps-historic-meeting-with-xi-putin-headlines-asia-trip-2026-11-18/?taid=6afe665779338c000111de8b&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":285},{"id":"2123249918475411534","h":"nytchinese","ts":1795057203,"zh":"特朗普抵达深圳：展示友好关系，无视间谍丑闻。习近平亲自到机场迎接，两人在红毯上拥抱。特朗普已经表示，他无意提起涉及黄仁勋的这起重大间谍丑闻。此次行程重头戏将是他与习近平、普京的三方会晤。","en":"特朗普抵达深圳：展示友好关系，无视间谍丑闻。习近平亲自到机场迎接，两人在红毯上拥抱。特朗普已经表示，他无意提起涉及黄仁勋的这起重大间谍丑闻。此次行程重头戏将是他与习近平、普京的三方会晤。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2123249918475411534","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/world/20261119/trump-xi-shenzhen-spy-scandal/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":786},{"id":"2123249198896382082","h":"bboczeng","ts":1795057031,"zh":"华尔街日报：英伟达5000亿美元芯片融资计划至今零资金到位，预计2027年前不会有交易执行\n今年8月，英伟达（$NVDA）宣布与阿波罗，黑石（Blackstone）、贝莱德（BlackRock）、布鲁克菲尔德（Brookfield）、高盛（Goldman Sachs）和KKR合作，计划动员5000亿美元资金，帮助OpenAI、Anthropic以及规模较小的AI云计算公司等客户为购买芯片融资。\n但该协议只是一份寥寥数页的谅解备忘录。各家机构均无义务募集任何资金，目前也没有任何资金到位。","en":"华尔街日报：英伟达5000亿美元芯片融资计划至今零资金到位，预计2027年前不会有交易执行\n今年8月，英伟达（$NVDA）宣布与阿波罗，黑石（Blackstone）、贝莱德（BlackRock）、布鲁克菲尔德（Brookfield）、高盛（Goldman Sachs）和KKR合作，计划动员5000亿美元资金，帮助OpenAI、Anthropic以及规模较小的AI云计算公司等客户为购买芯片融资。\n但该协议只是一份寥寥数页的谅解备忘录。各家机构均无义务募集任何资金，目前也没有任何资金到位。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123249198896382082","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":497},{"id":"2123248964925628548","h":"BrantChinesefn","ts":1795056975,"zh":"如果你是黄仁勋，回到英伟达会先干什么？我想即便裁掉董事会不是第一件要做的事情，也是priority。那董事会能不知道吗，所以现在一定会想尽办法不让老黄回来。对立非常清晰。\n以黄仁勋的地位，不可能不知道董事会现在的态度，但却在业绩前的重要节点把自己愿意回归的想法公布出来，这里面一定有故事。把矛盾都引向董事会。\n一场公司内部和政府在背后谋划的阴谋也好，阳谋也罢，正在上演。这些东西看不清，分析不明，这 $nvda怎么做。止跌震荡是一段时间内最好的结局了，无非是震荡的幅度可能稍大些罢了。","en":"如果你是黄仁勋，回到英伟达会先干什么？我想即便裁掉董事会不是第一件要做的事情，也是priority。那董事会能不知道吗，所以现在一定会想尽办法不让老黄回来。对立非常清晰。\n以黄仁勋的地位，不可能不知道董事会现在的态度，但却在业绩前的重要节点把自己愿意回归的想法公布出来，这里面一定有故事。把矛盾都引向董事会。\n一场公司内部和政府在背后谋划的阴谋也好，阳谋也罢，正在上演。这些东西看不清，分析不明，这 $nvda怎么做。止跌震荡是一段时间内最好的结局了，无非是震荡的幅度可能稍大些罢了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/BrantChinesefn/status/2123248964925628548","l":[],"ln":[],"t":["AI科技"],"lk":12,"rt":0,"rp":2,"vw":897},{"id":"2123248586645512399","h":"hanking66","ts":1795056885,"zh":"美光管理层在11月18日TomorrowX Summit表示，过去一个月客户需求没有转弱，供给仍紧、定价环境仍有利，2027年约75%的产出已售出，并已与客户讨论2028年承诺。\n终于等到美光管理层最新的表态，目前没有看出需求转弱的迹象😅\n关于半导体需求转弱的问题，我依旧没有看到任何实质性的迹象，无论是企业财报，电话会议，高管言论，供应链上下游，产品价格。有的全是华尔街小作文，分析师预测，散户臆想…而这些全都是因为股价跌了…\n我不是无脑看多，也不是一条路走到黑，而是我的确没看到可以说服我的证据，我不会因为周围人说半导体行情结束了就认为结束了，也不会因为股价跌了就觉得自己看错了😅，如果我看到实质性的证据或者数据，我会改变看法的，可惜目前没看到😅\n有人说等你看到了，市场早就跌完了，也许是的，市场行情往往走在事实之前，但前提是市场看对了方向，目前看市场只是在担心勿虚有的事情😅\nBuy the dip，长期持有，Discord在个人资料。","en":"美光管理层在11月18日TomorrowX Summit表示，过去一个月客户需求没有转弱，供给仍紧、定价环境仍有利，2027年约75%的产出已售出，并已与客户讨论2028年承诺。\n终于等到美光管理层最新的表态，目前没有看出需求转弱的迹象😅\n关于半导体需求转弱的问题，我依旧没有看到任何实质性的迹象，无论是企业财报，电话会议，高管言论，供应链上下游，产品价格。有的全是华尔街小作文，分析师预测，散户臆想…而这些全都是因为股价跌了…\n我不是无脑看多，也不是一条路走到黑，而是我的确没看到可以说服我的证据，我不会因为周围人说半导体行情结束了就认为结束了，也不会因为股价跌了就觉得自己看错了😅，如果我看到实质性的证据或者数据，我会改变看法的，可惜目前没看到😅\n有人说等你看到了，市场早就跌完了，也许是的，市场行情往往走在事实之前，但前提是市场看对了方向，目前看市场只是在担心勿虚有的事情😅\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdLVLubcAAd-74.jpg?name=orig"],"u":"https://x.com/hanking66/status/2123248586645512399","l":[],"ln":[],"t":["AI科技","财报"],"lk":6,"rt":1,"rp":2,"vw":1026},{"id":"2123248579334787251","h":"nytchinese","ts":1795056884,"zh":"习近平与高市早苗简短会面，中日关系无解冻迹象。这是自一年前中日爆发激烈外交争端以来，两国领导人首次接触。两人简短握手，气氛紧张。专家表示，这次互动不太可能标志着中日关系出现任何实质性解冻。","en":"习近平与高市早苗简短会面，中日关系无解冻迹象。这是自一年前中日爆发激烈外交争端以来，两国领导人首次接触。两人简短握手，气氛紧张。专家表示，这次互动不太可能标志着中日关系出现任何实质性解冻。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2123248579334787251","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/world/20261119/xi-jinping-china-sanae-takaichi-japan/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":1743},{"id":"2123247775660064859","h":"bboczeng","ts":1795056692,"zh":"是的，这代表他们已经看到或者掌握了对黄仁勋非常不利的证据\n所以不论员工如何联署，都无法答应他们的请求\n也不便出面解释\n相信调查，相信听证会，相信Board\n是我们唯一的选择","en":"是的，这代表他们已经看到或者掌握了对黄仁勋非常不利的证据\n所以不论员工如何联署，都无法答应他们的请求\n也不便出面解释\n相信调查，相信听证会，相信Board\n是我们唯一的选择","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123247775660064859","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":765},{"id":"2123244076678185279","h":"CrushTheShorts","ts":1795055810,"zh":"谢谢，稳的一逼，稳的像一条索马里的路边野狗🤢🤢🤢\n-------------------------------------------------\n经济日报：稳资本市场意义重大\n11月19日｜经济日报刊文指出，稳，是当前资本市场的主基调。“增强股市内在稳定性”“进一步深化市场稳定长效机制研究”“全力维护市场平稳运行”……近段时间，各方密集发声，持续释放稳市信号。作为牵一发而动全身的枢纽，资本市场的稳定运行历来意义重大。放到当下，这种重要性更是前所未有地凸显。\n从市场体量看，资本市场的地位“与日俱重”。当前A股市场拥有5500多家上市公司，总市值突破100万亿元，新经济领域公司数量、营收、市值占比均超过一半。现阶段的资本市场，已经不仅仅是一个投资交易场所，更是科技创新的“发动机”、产业升级的“推进器”。\n立足经济发展全局，资本市场的作用不可替代。中国式现代化全面提速，“十五五”时期要推进发展新质生产力、构建新发展格局、建设现代化经济体系等任务繁重，目标高远，每一场硬仗都离不开创新资本的加速集聚、金融资源的优化配置，都离不开一个稳定资本市场的有力支撑。\n资本市场稳不稳，是信心稳不稳、预期好不好、经济循环畅不畅的重要变量，事关国家创新体系整体效能，事关高质量发展全局。经济发展动能转换，需要资本市场发挥稳定的枢纽功能。新一轮科技革命奔涌向前，需要资本市场展现稳定的陪跑耐力。在激烈国际竞争中赢得战略主动，需要资本市场积蓄稳定的托举力量。","en":"谢谢，稳的一逼，稳的像一条索马里的路边野狗🤢🤢🤢\n-------------------------------------------------\n经济日报：稳资本市场意义重大\n11月19日｜经济日报刊文指出，稳，是当前资本市场的主基调。“增强股市内在稳定性”“进一步深化市场稳定长效机制研究”“全力维护市场平稳运行”……近段时间，各方密集发声，持续释放稳市信号。作为牵一发而动全身的枢纽，资本市场的稳定运行历来意义重大。放到当下，这种重要性更是前所未有地凸显。\n从市场体量看，资本市场的地位“与日俱重”。当前A股市场拥有5500多家上市公司，总市值突破100万亿元，新经济领域公司数量、营收、市值占比均超过一半。现阶段的资本市场，已经不仅仅是一个投资交易场所，更是科技创新的“发动机”、产业升级的“推进器”。\n立足经济发展全局，资本市场的作用不可替代。中国式现代化全面提速，“十五五”时期要推进发展新质生产力、构建新发展格局、建设现代化经济体系等任务繁重，目标高远，每一场硬仗都离不开创新资本的加速集聚、金融资源的优化配置，都离不开一个稳定资本市场的有力支撑。\n资本市场稳不稳，是信心稳不稳、预期好不好、经济循环畅不畅的重要变量，事关国家创新体系整体效能，事关高质量发展全局。经济发展动能转换，需要资本市场发挥稳定的枢纽功能。新一轮科技革命奔涌向前，需要资本市场展现稳定的陪跑耐力。在激烈国际竞争中赢得战略主动，需要资本市场积蓄稳定的托举力量。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2123244076678185279","l":[],"ln":[],"t":["财报"],"lk":2,"rt":0,"rp":0,"vw":1556},{"id":"2123242823134884315","h":"bbcchinese","ts":1795055511,"zh":"日本首相高市早苗周三（11月18日）抵达中国深圳，出席亚太经济合作组织（APEC）峰会。这是她上任以来首次访问中国。\n她在欢迎晚宴上与中国领导人习近平握手。这也是自她去年发表“台湾有事”论引发中日关系恶化以来，双方首次接触。\n然而，她扺达机场时，欢迎仪式相对简单，与到访的其他国家领导人的接待形成对比。","en":"日本首相高市早苗周三（11月18日）抵达中国深圳，出席亚太经济合作组织（APEC）峰会。这是她上任以来首次访问中国。\n她在欢迎晚宴上与中国领导人习近平握手。这也是自她去年发表“台湾有事”论引发中日关系恶化以来，双方首次接触。\n然而，她扺达机场时，欢迎仪式相对简单，与到访的其他国家领导人的接待形成对比。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123242692587188224/vid/avc1/1080x1920/Ig8zMjQ3Xyy6DJGp.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2123242823134884315","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1262},{"id":"2123242487472963670","h":"ReutersChina","ts":1795055431,"zh":"美国总统唐纳德·特朗普表示，他曾与中国国家主席习近平讨论过人工智能，而提到前英伟达首席执行官黄仁勋只是“简短”地提及。","en":"US President Donald Trump said he spoke to Chinese President Xi Jinping about artificial intelligence, and that reference to former Nv 54341,"zh":"#期货 两小时更新\n这是本档变化最大的一组数。纳指期货约08:58报27573点附近，较第一版的27238点明显上修，较结算涨约1.42%，盘中高点约27585、低点27169。标普500期货约7393点，涨约0.72%；道指期货约50489点，涨约0.43%。黄金约3753美元，比第一版的3731美元有所回升；WTI原油期货约81.81美元，和第一版的81.93美元相差不大。离岸人民币约6.6666，和第一版的6.668几乎走平。A股股指期货没有夜盘，仍是11月18日收盘：沪深300期货IF收3928.4点，上证50期货IH收2731.2点，中证500期货IC收6194.0点，中证1000期货IM收5987.4点。富时A50连续报价本档未取到可靠数据，标注缺失。港股9:30才开，以开盘现货为准。韩国股市今日推迟开市一小时，截稿前没有盘中数据。\n#三个方向\n一是银行与红利，不变。融资盘继续撤退的阶段，更要靠它守，但龙头多在20日高附近，竞价不追跳空。\n二是家电与必选消费，不变。华泰今早对必选消费的温和复苏判断，和中信建投内需磨底、出海定胜负的家电策略，都指向看 #美的集团 $000333\n、 #格力电器 $000651 这类龙头，不看已经连板或刚跌停的杂毛。\n三是半导体制造的事件余波，方向不变，弹性预期上调。日经高开和纳指期货转强，说明亚洲已经愿意给隔夜的弱势做修复，A股制造、设备和PCB大概率比第一版预想的更高开，但5日、20日仍是下跌共振，英伟达昨夜又是高开低走，只观察不追高；CPO和光模块位置仍差，不并入这一方向。腾讯提到的国产算力，也只加强观察，不改仓位纪律。\n#六只个股\n名单与第一版相同，位置数据仍用昨日收盘核验，本档没有新的完整日线需要改写。\n #工商银行 $601398 昨日平收9.06元，5日涨6.21%，20日涨7.22%，距20日高0.44%。触发是银行ETF不破5日线；失效是放量跌破5日或板块5日涨幅快速回吐。高位持盈，不追开盘。\n #中国平安 $601318 昨日跌0.46%，20日涨6.25%，距20日高0.88%，和保险ETF一样走平。触发是保险随银行继续抗跌；失效是独自走弱并跌破近日平台。\n #美的集团 $000333 昨日涨0.34%，5日涨6.81%，20日涨11.67%，距20日高0.77%。触发是家电ETF守住5日上行；失效是长阴跌破5日线。不追涨停杂毛。\n #格力电器 $000651 昨日涨0.22%，5日涨5.41%，20日涨9.75%，距20日高1.01%。触发与美的相同；失效是明显弱于美的并跌破5日。\n #长江电力 $600900 昨日涨0.26%，5日涨4.07%，20日涨3.75%，距20日高0.29%，红利属性清楚。触发是高息资产继续被承接；失效是跌破5日并放量。\n #北方华创 $002371 昨日涨0.93%，5日涨4.77%，20日涨2.33%，距20日高2.61%，位置比中芯和华虹更有余地。触发是半导体制造和设备在高开或平开后能够站稳；失效是放量回吐近日涨幅。开盘若因期货转强而跳空，先看成份，不预先加仓。\n#国电南瑞 $600406 第一版未取到完整日线，本档仍不写入样本。\n#小盘阿尔法\n本档仍不选。热榜里能看到的小票，多是连板后已经伸展， #华东重机 $002685 仍是四连板， #九阳股份 $002242\n20日大涨后昨日跌停、热度刚刚回落，缺少完整市值与财报互证的底部右侧标的，不符合入选条件。\n#操作提示\n今天比七点档更需要把高开和能追分开。期货和日经把隔夜美股的分化修得更漂亮了，开盘很容易把半导体制造、PCB和算力租赁再抬一截，但位置、杠杆和昨夜英伟达的收盘都还在。银行、家电、电力仍是相对抵抗方向，也多在20日高附近，只做持盈和回调再看，不在竞价里抬轿。\n#华虹公司 $688347 、 #沪电股份 $002463 开盘不追； #北方华创 $002371 只作为方向样本。 #中际旭创\n$300308 、 #新易盛 $300502 、 #胜宏科技 $300476\n仍在20日深跌区间，先观察不抄。短剧影视和刚跌停的小家电一律不抄。盯9点25分竞价，看银行ETF和红利ETF能否顶住，以及高开是否主要出现在科创和算力。美联储纪要偏鹰、今晚Anthropic上市和沃尔玛财报，都还是外部扰动。若高开低走，要能及时减。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#期货 两小时更新\n这是本档变化最大的一组数。纳指期货约08:58报27573点附近，较第一版的27238点明显上修，较结算涨约1.42%，盘中高点约27585、低点27169。标普500期货约 更多跨市场研究"}],"t":["美联储","美股","A股港股","汇率","原油能源","AI科技","财报","黄金"],"lk":1,"rt":0,"rp":2,"vw":1344},{"id":"2123237627570585970","h":"darrencao2024","ts":1795054272,"zh":"干货满满：微软、Meta、谷歌、亚马逊目标价更新","en":"干货满满：微软、Meta、谷歌、亚马逊目标价更新","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123237627570585970","l":["darrencr2024.substack.com"],"ln":[{"u":"https://darrencr2024.substack.com/p/meta-06f?r=6oyb2h&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true","d":"darrencr2024.substack.com"}],"t":[],"lk":3,"rt":0,"rp":0,"vw":665},{"id":"2123237442874728581","h":"CrushTheShorts","ts":1795054228,"zh":"领导好，针对今早市场流传的某版“算力芯片流片来源梳理”，结合我们产业链跟踪，做几点差异化汇报，供参考（信息勿转发）：\n#代工结构修正：不能简单按“海外/国内”一刀切\n【寒武纪】690从26年起主力已切S；并非“三星断供即没戏”。\n【天数/燧原】并非纯台积依赖，两家均有S/H产能储备，冲击程度要看各家额。\n【壁仞】代工以H为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600走S的n+1国产闭环\n【平头哥】S+三星双源，不是H为主。\n【摩尔/昆仑芯/芯原】均有S产能并行，不能按“海外代工=规避”直接外推。\n#关于“三星/台积穿透严查”\nBIS新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升+边际收紧。\n#关于腾讯资本开支：市场最容易误读\n腾讯3Q26资本开支814亿，预付大头对应5500合规N卡及部分高端B卡，但据产业跟踪实际到货比例很低。管理层业绩会明确：长协已签完，后续预付款流出下降，个别季度可能出现回冲（部分未交付合同资金回流）；现金CapEx当前处于峰值，#2026余下时间+2027年围绕峰值波动，2028后才回落。\n我们认为前期腾讯备卡严重不足，27年反而是激进补库窗口——N卡不够就转国产。所以“2028资本开支下滑”≠“算力需求下行”，而是高价抢卡期结束后的自然斜率放缓。#把腾讯资本开支回落理解成行业beta向下，是误读。\n#投资结论差异\n当前竞争已从“单芯片参数”进入“产品力×产能配额×大客户绑定”系统竞争；\n中芯华虹不是纯beta博弈——大厂缺卡是强现实，27年腾讯等CSP仍要激进补库，需求端有支撑。关键跟踪：估值位置、产能优先级、HBM供给节奏、整机交付验收；国产算力我们看结构性机会，有风险的是无产能保障的二三线，不是“代工在海外”的全部标的。","en":"领导好，针对今早市场流传的某版“算力芯片流片来源梳理”，结合我们产业链跟踪，做几点差异化汇报，供参考（信息勿转发）：\n#代工结构修正：不能简单按“海外/国内”一刀切\n【寒武纪】690从26年起主力已切S；并非“三星断供即没戏”。\n【天数/燧原】并非纯台积依赖，两家均有S/H产能储备，冲击程度要看各家额。\n【壁仞】代工以H为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600走S的n+1国产闭环\n【平头哥】S+三星双源，不是H为主。\n【摩尔/昆仑芯/芯原】均有S产能并行，不能按“海外代工=规避”直接外推。\n#关于“三星/台积穿透严查”\nBIS新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升+边际收紧。\n#关于腾讯资本开支：市场最容易误读\n腾讯3Q26资本开支814亿，预付大头对应5500合规N卡及部分高端B卡，但据产业跟踪实际到货比例很低。管理层业绩会明确：长协已签完，后续预付款流出下降，个别季度可能出现回冲（部分未交付合同资金回流）；现金CapEx当前处于峰值，#2026余下时间+2027年围绕峰值波动，2028后才回落。\n我们认为前期腾讯备卡严重不足，27年反而是激进补库窗口——N卡不够就转国产。所以“2028资本开支下滑”≠“算力需求下行”，而是高价抢卡期结束后的自然斜率放缓。#把腾讯资本开支回落理解成行业beta向下，是误读。\n#投资结论差异\n当前竞争已从“单芯片参数”进入“产品力×产能配额×大客户绑定”系统竞争；\n中芯华虹不是纯beta博弈——大厂缺卡是强现实，27年腾讯等CSP仍要激进补库，需求端有支撑。关键跟踪：估值位置、产能优先级、HBM供给节奏、整机交付验收；国产算力我们看结构性机会，有风险的是无产能保障的二三线，不是“代工在海外”的全部标的。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2123237442874728581","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":3,"vw":1509},{"id":"2123236946592022899","h":"ShanghaoJin","ts":1795054110,"zh":"这才哪跟哪啊","en":"这才哪跟哪啊","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/ShanghaoJin/status/2123236946592022899","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":1576},{"id":"2123233137828536612","h":"bbcchinese","ts":1795053202,"zh":"美国总统特朗普（Donald Trump）与俄罗斯总统普京（Vladimir Putin）周三在深圳APEC峰会欢迎晚宴期间会面，这是两人一年多来首次碰面。两人周四将与中国国家主席习近平举行历史性三方会谈。","en":"美国总统特朗普（Donald Trump）与俄罗斯总统普京（Vladimir Putin）周三在深圳APEC峰会欢迎晚宴期间会面，这是两人一年多来首次碰面。两人周四将与中国国家主席习近平举行历史性三方会谈。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123232734546198528/vid/avc1/1080x1920/6x40NTtJ7QQy7xZ7.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2123233137828536612","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":3,"vw":3502},{"id":"2123232072219369694","h":"nytchinese","ts":1795052948,"zh":"APE峰会期间，深圳变“空城”。学校停课，企业员工居家办公，许多居民离开了这座城市。峰会期间多条道路封闭，安保举措尤为严密。几乎没有人敢表达任何疑虑，只能无奈地接受这种干扰。“即使我们对此感到不悦，也不能直说，”一位居民表示。“政府不喜欢听到我们的不满。”","en":"APE峰会期间，深圳变“空城”。学校停课，企业员工居家办公，许多居民离开了这座城市。峰会期间多条道路封闭，安保举措尤为严密。几乎没有人敢表达任何疑虑，只能无奈地接受这种干扰。“即使我们对此感到不悦，也不能直说，”一位居民表示。“政府不喜欢听到我们的不满。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2123232072219369694","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/china/20261119/a-tropical-chinese-city-is-half-empty-and-ready-for-the-summit/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":6,"rt":0,"rp":11,"vw":2597},{"id":"2123231185535160498","h":"tig88411109","ts":1795052737,"zh":"黄金大跌14个月低点，还有谁鼓吹看衰美元美债，去买黄金？\n全球投资者都不傻，特别是韩国人惊弓之鸟，近期最大美债配置就是韩国。\n那么为何黄金大跌背后的直接原因是加息利率冲击。看看下面这是清楚的黄金投资底层逻辑🔽"," 公司来说，他们的EPS共识往往偏差很小，很多也是根据财报上管理层透露出来的信息计算出来的，可靠性很高。在此基础上，我们也可以参考公司过往财报击败分析师预期的表现，如果是长期击败预期的公司，证明你使用的共识EPS，大概率还是比较偏保守的。\n爆雷的情况有很多，最近两个月都遇到谷歌，英特尔和英伟达，这是投资个股必须承担的风险，任何单一公司都有可能爆雷，强如谷歌英伟达，也可能出现黑天鹅事件，所以除了通过EPS，PE去进行个股挑选，还要搭配好投资组合，用仓位控制风险。","en":"PE的确是一种较为粗糙的计算方法，但我也认为也是对于我们散户来说，最有效，最直观，也最客观的估值方式。\n前瞻PE无非就是根据分析师的共识前瞻EPS算出来的，散户投资者，大部分不具备机构投资者所掌握的信息和知识储备，依赖他们的共识EPS，结合历史估值区间，以及自己对公司未来走向的判断，是我认为散户投资者最好的凭借。\n另外只要是多分析师覆盖的公司，也就是美股上大部分市值较大的公司来说，他们的EPS共识往往偏差很小，很多也是根据财报上管理层透露出来的信息计算出来的，可靠性很高。在此基础上，我们也可以参考公司过往财报击败分析师预期的表现，如果是长期击败预期的公司，证明你使用的共识EPS，大概率还是比较偏保守的。\n爆雷的情况有很多，最近两个月都遇到谷歌，英特尔和英伟达，这是投资个股必须承担的风险，任何单一公司都有可能爆雷，强如谷歌英伟达，也可能出现黑天鹅事件，所以除了通过EPS，PE去进行个股挑选，还要搭配好投资组合，用仓位控制风险。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123223571111510294","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":6,"rt":0,"rp":1,"vw":759},{"id":"2123222071224180964","h":"bbcchinese","ts":1795050563,"zh":"亚太经合组织（APEC）领导人峰会在深圳登场，习近平将与各成员国与地区首脑合照，然后出席峰会。BBC News中文现场直播。","en":"亚太经合组织（APEC）领导人峰会在深圳登场，习近平将与各成员国与地区首脑合照，然后出席峰会。BBC News中文现场直播。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2123222071224180964","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4l0QzjT","d":"bbc.in"}],"t":[],"lk":5,"rt":0,"rp":1,"vw":5891},{"id":"2123219929042207147","h":"ReutersChina","ts":1795050053,"zh":"据韩联社周四报道，韩国青瓦台周三表示，没有发现美国和朝鲜之间可能举行的会谈有任何具体进展。","en":"South Korea's presidential office said on Wednesday it had detected no particular developments on possible talks between the United States and North Korea, Yonhap news agency reported on Thursday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123219929042207147","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/south-korea-sees-no-particular-sign-imminent-us-north-korea-talks-yonhap-says-2026-11-18/?taid=6afe4a454f7b1a0001e4accf&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":354},{"id":"2123217424313114797","h":"tig88411109","ts":1795049456,"zh":"看最新公布的10月份美联储会议纪要，就知道对冲基金这种墙头草过去6周月创纪录的卖出，背后恐慌在哪里？\n但是基金经理错误在于，没有理解美联储这种“就怕流氓有文化”\n美联储理事好比足球裁判给艺术体操打分。一帮搞货币的懂科技创新这种非线性的预测？\n全篇纪要中，美联储理事大谈AI投资过度的什么表外融资，循环融资风险，AI投资回报不及预期将导致系统风险\n这种无知者无畏的精神，历史上美联储多次犯错。最著名就是格林斯潘96年警告“非理性繁荣”，内部美联储预测股市大跌20%会刺穿泡沫，结果呢，2000年拐点提前整整4年。\n其他比如08年次贷危机前，还说次贷风险“相对有限”，21年通胀失控前，还说疫情放水没关系。\n我一直强调很多遍，就是美联储本身就是制造市场波动的最大风险。太多滥竽充数的理事，或许懂货币懂信用市场，但是对于这种非连续性的指数型的变化，人类从来没有预测能力。\n表外融资，不是等于黑市造假；循环融资不是等于庞氏骗局。根本性在于要理解，科技革命带来的生产率的提升，短期和中期的矛盾。美联储如果没有任何证据，直接判断当前AI融资是脆弱的，这就是误导整个市场，加剧市场波动。\n而且更重要在于，大幅提升风险溢价和信用的瓶颈，反而让科技本身能够提升供给，压缩通胀的能力下降，恶化长期通胀前景。\n特别是一些胡说八道的理事，去年那个沃勒还说要降息，今年就说12月要加0.5%。这意味着什么对于投资策略？\n市场有大量的认知差超额收益的空间。空头的最大炸弹就在于是不是美联储连续加息犯错刺穿泡沫。当然概率不大，政策风险叙事压缩短期估值，正是出现长期买点的重大机会。特别是对冲基金这种墙头草过去6周月创纪录的卖出恐慌下。\n具体颗粒度更细见投资策略周报订阅者分享。","en":"看最新公布的10月份美联储会议纪要，就知道对冲基金这种墙头草过去6周月创纪录的卖出，背后恐慌在哪里？\n但是基金经理错误在于，没有理解美联储这种“就怕流氓有文化”\n美联储理事好比足球裁判给艺术体操打分。一帮搞货币的懂科技创新这种非线性的预测？\n全篇纪要中，美联储理事大谈AI投资过度的什么表外融资，循环融资风险，AI投资回报不及预期将导致系统风险\n这种无知者无畏的精神，历史上美联储多次犯错。最著名就是格林斯潘96年警告“非理性繁荣”，内部美联储预测股市大跌20%会刺穿泡沫，结果呢，2000年拐点提前整整4年。\n其他比如08年次贷危机前，还说次贷风险“相对有限”，21年通胀失控前，还说疫情放水没关系。\n我一直强调很多遍，就是美联储本身就是制造市场波动的最大风险。太多滥竽充数的理事，或许懂货币懂信用市场，但是对于这种非连续性的指数型的变化，人类从来没有预测能力。\n表外融资，不是等于黑市造假；循环融资不是等于庞氏骗局。根本性在于要理解，科技革命带来的生产率的提升，短期和中期的矛盾。美联储如果没有任何证据，直接判断当前AI融资是脆弱的，这就是误导整个市场，加剧市场波动。\n而且更重要在于，大幅提升风险溢价和信用的瓶颈，反而让科技本身能够提升供给，压缩通胀的能力下降，恶化长期通胀前景。\n特别是一些胡说八道的理事，去年那个沃勒还说要降息，今年就说12月要加0.5%。这意味着什么对于投资策略？\n市场有大量的认知差超额收益的空间。空头的最大炸弹就在于是不是美联储连续加息犯错刺穿泡沫。当然概率不大，政策风险叙事压缩短期估值，正是出现长期买点的重大机会。特别是对冲基金这种墙头草过去6周月创纪录的卖出恐慌下。\n具体颗粒度更细见投资策略周报订阅者分享。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcudxAaQAAgo95.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2123217424313114797","l":[],"ln":[],"t":["美联储","通胀"],"lk":12,"rt":1,"rp":0,"vw":1530},{"id":"2123216211429437800","h":"fxtrader","ts":1795049166,"zh":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","en":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n$ANT\n#行情 纳指期货涨1%。 ,"vw":494},{"id":"2123212168661483899","h":"dmjk001","ts":1795048203,"zh":"【关于昇腾扩产预期与GPU代工风险汇报】\n一、华为昇腾：2027年国产算力供给有望大幅提升\n据产业链测算，昇腾950DT采用双芯片设计，960DT采用四芯片设计，单颗芯片面积约400—430mm²。按照12英寸晶圆、60%—70%良率估算，单片晶圆可产出约80—90颗有效芯片。若2027年中芯国际N+2工艺分配给昇腾的产能达到2万片/月，全年理论产出约1920万—2160万颗芯片，对应950DT约960万—1080万颗，或960DT约480万—540万颗。960DT虽然数量减半，但凭借HBM、互联及封装升级，系统性能有望实现3—4倍提升。 #市场另有先进制程产能提升至10万片/月的传闻、实际供给还需考虑良率、封装及其他芯片产能竞争（华丰科技、航天电器）\n二、国产GPU厂商：海外代工依赖成为核心变量\n近期产业链传闻，#三星可能加强晶圆代工及终端客户穿透审查，若属实，部分国产GPU企业2027年收入兑现面临风险。\n1、寒武纪： 690/580以国内代工为主，部分产品涉及台积电、三星。\n2、海光信息： CPU以国内代工为主，DCU据传依赖三星。\n3、摩尔线程： 新一代产品逐步转向中芯国际，仍需关注良率和交付。\n4、沐曦股份： 据传对三星依赖较高，国内工艺产品商业化尚待验证。\n5、天数智芯、燧原科技等： 海外先进制程依赖风险值得关注。\n6、壁仞科技、平头哥、昆仑芯： 代工来源存在差异，需分别评估技术成熟度及产能兑现。\n三、我们判断：国产晶圆制造战略价值进一步提升\n若海外代工限制升级，国产AI芯片产业链将加速向中芯国际、华虹等本土晶圆厂集中。华为昇腾凭借国内制造体系及超节点架构，有望强化国产算力竞争优势。\n结论：#重点跟踪华为昇腾国产链、中芯国际、华虹半导体，以及国产GPU厂商的实际代工来源和交付能力。以上代工信息及扩产数字，仅供内部研判，不宜作为确定性事实。","en":"【关于昇腾扩产预期与GPU代工风险汇报】\n一、华为昇腾：2027年国产算力供给有望大幅提升\n据产业链测算，昇腾950DT采用双芯片设计，960DT采用四芯片设计，单颗芯片面积约400—430mm²。按照12英寸晶圆、60%—70%良率估算，单片晶圆可产出约80—90颗有效芯片。若2027年中芯国际N+2工艺分配给昇腾的产能达到2万片/月，全年理论产出约1920万—2160万颗芯片，对应950DT约960万—1080万颗，或960DT约480万—540万颗。960DT虽然数量减半，但凭借HBM、互联及封装升级，系统性能有望实现3—4倍提升。 #市场另有先进制程产能提升至10万片/月的传闻、实际供给还需考虑良率、封装及其他芯片产能竞争（华丰科技、航天电器）\n二、国产GPU厂商：海外代工依赖成为核心变量\n近期产业链传闻，#三星可能加强晶圆代工及终端客户穿透审查，若属实，部分国产GPU企业2027年收入兑现面临风险。\n1、寒武纪： 690/580以国内代工为主，部分产品涉及台积电、三星。\n2、海光信息： CPU以国内代工为主，DCU据传依赖三星。\n3、摩尔线程： 新一代产品逐步转向中芯国际，仍需关注良率和交付。\n4、沐曦股份： 据传对三星依赖较高，国内工艺产品商业化尚待验证。\n5、天数智芯、燧原科技等： 海外先进制程依赖风险值得关注。\n6、壁仞科技、平头哥、昆仑芯： 代工来源存在差异，需分别评估技术成熟度及产能兑现。\n三、我们判断：国产晶圆制造战略价值进一步提升\n若海外代工限制升级，国产AI芯片产业链将加速向中芯国际、华虹等本土晶圆厂集中。华为昇腾凭借国内制造体系及超节点架构，有望强化国产算力竞争优势。\n结论：#重点跟踪华为昇腾国产链、中芯国际、华虹半导体，以及国产GPU厂商的实际代工来源和交付能力。以上代工信息及扩产数字，仅供内部研判，不宜作为确定性事实。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123212168661483899","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":621},{"id":"2123212074537152647","h":"fxtrader","ts":1795048180,"zh":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n另外，Anthropic设置了F类股，拥有公司普通股东投票事项 "m":["https://pbs.twimg.com/media/HXcYyfcaIAAHRYw.png?name=orig"],"u":"https://x.com/bboczeng/status/2123193101753921853","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":757},{"id":"2123192924217479250","h":"bboczeng","ts":1795043614,"zh":"“内战”发动在即，美股会变好吗？\n估计一调查，特朗普家族得把股票全卖掉\n到时候，半导体还有的跌\n佩洛西也得破产\n至少把24年赚的全吐出来\n😅😅😅","en":"“内战”发动在即，美股会变好吗？\n估计一调查，特朗普家族得把股票全卖掉\n到时候，半导体还有的跌\n佩洛西也得破产\n至少把24年赚的全吐出来\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123192924217479250","l":[],"ln":[],"t":["美股","AI科技"],"lk":3,"rt":0,"rp":0,"vw":766},{"id":"2123192663369564659","h":"bboczeng","ts":1795043552,"zh":"民主党议员正式启动对共和党高管的调查：\n众议院监督委员会的首席民主党人正在为长期承诺的、针对特朗普政府的调查打下基础，这些调查将在 1 月新一届国会开始时启动。\n加州众议员罗伯特·加西亚（Robert Garcia）预计将在民主党掌控众议院后出任该委员会主席。他发出多封信函，要求特朗普总统的家人和政府高级官员保存文件。这是对这位共和党总统及其政府展开调查的早期步骤。\n周三公布的这些信函涵盖了一系列可能的调查事项，包括涉及特朗普家人的所谓财务利益冲突、国土安全部的不当行为，以及政府对杰弗里·爱泼斯坦（Jeffrey Epstein）相关档案的处理。\n加西亚在声明中说：\"监督委员会民主党人正在努力终结本届政府的自肥、不当行为和滥用权力。\"他还说：\"这些调查将为惠及全体美国人的立法奠定基础。这只是开始。\"\n信函的对象包括特朗普的两个儿子、副总统 JD 万斯（JD Vance）、白宫办公厅主任斯蒂芬·米勒（Stephen Miller）、司法部长托德·布兰奇（Todd Blanche）以及总统的女婿贾里德·库什纳（Jared Kushner）。\n白宫多次反驳民主党提出的调查意图，官员们表示，对于他们认为正当的监督调查，愿意配合，但不会配合那些被认定出于政治动机的调查。\n白宫发言人劳伦·比斯（Lauren Bis）说，总统\"愿意与任何人合作，继续为勤劳的美国人民带来胜利\"。\"如果民主党人选择推进虚假的调查和激进左翼的政策，那他们就是选择与美国人民作对\"","en":"民主党议员正式启动对共和党高管的调查：\n众议院监督委员会的首席民主党人正在为长期承诺的、针对特朗普政府的调查打下基础，这些调查将在 1 月新一届国会开始时启动。\n加州众议员罗伯特·加西亚（Robert Garcia）预计将在民主党掌控众议院后出任该委员会主席。他发出多封信函，要求特朗普总统的家人和政府高级官员保存文件。这是对这位共和党总统及其政府展开调查的早期步骤。\n周三公布的这些信函涵盖了一系列可能的调查事项，包括涉及特朗普家人的所谓财务利益冲突、国土安全部的不当行为，以及政府对杰弗里·爱泼斯坦（Jeffrey Epstein）相关档案的处理。\n加西亚在声明中说：\"监督委员会民主党人正在努力终结本届政府的自肥、不当行为和滥用权力。\"他还说：\"这些调查将为惠及全体美国人的立法奠定基础。这只是开始。\"\n信函的对象包括特朗普的两个儿子、副总统 JD 万斯（JD Vance）、白宫办公厅主任斯蒂芬·米勒（Stephen Miller）、司法部长托德·布兰奇（Todd Blanche）以及总统的女婿贾里德·库什纳（Jared Kushner）。\n白宫多次反驳民主党提出的调查意图，官员们表示，对于他们认为正当的监督调查，愿意配合，但不会配合那些被认定出于政治动机的调查。\n白宫发言人劳伦·比斯（Lauren Bis）说，总统\"愿意与任何人合作，继续为勤劳的美国人民带来胜利\"。\"如果民主党人选择推进虚假的调查和激进左翼的政策，那他们就是选择与美国人民作对\"","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123192663369564659","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1193},{"id":"2123191520492986754","h":"bboczeng","ts":1795043280,"zh":"美国医保新规提案引发保险公司股价大幅下跌\n美国医疗保险和医疗补助服务中心（CMS）于11月16日公布了一项名为 CRUSH 的新规提案，计划通过加强对 Medicare Advantage（联邦医疗保险优势计划）的审计和监管，每年追回约90亿美元资金，未来十年累计追回近900亿美元。\n作为 Medicare Advantage 市场的最大参与者，联合健康集团（UnitedHealth）的股价暴跌至350美元附近；Humana 股价下跌13%，Elevance Health 等其他大型医疗保险公司也纷纷跟跌。\n该提案的公众意见征集期将持续至 2027年1月19日。由于可能面临法律挑战，最终规则仍存在调整的可能性。\n不过，投资者已经开始提前计入潜在的监管和财务风险，尤其是那些高度依赖 Medicare Advantage 业务的保险公司。\n市场担忧的核心在于：更严格的审计可能迫使保险公司退还更多医保资金，从而压缩其利润及未来盈利预期。","en":"美国医保新规提案引发保险公司股价大幅下跌\n美国医疗保险和医疗补助服务中心（CMS）于11月16日公布了一项名为 CRUSH 的新规提案，计划通过加强对 Medicare Advantage（联邦医疗保险优势计划）的审计和监管，每年追回约90亿美元资金，未来十年累计追回近900亿美元。\n作为 Medicare Advantage 市场的最大参与者，联合健康集团（UnitedHealth）的股价暴跌至350美元附近；Humana 股价下跌13%，Elevance Health 等其他大型医疗保险公司也纷纷跟跌。\n该提案的公众意见征集期将持续至 2027年1月19日。由于可能面临法律挑战，最终规则仍存在调整的可能性。\n不过，投资者已经开始提前计入潜在的监管和财务风险，尤其是那些高度依赖 Medicare Advantage 业务的保险公司。\n市场担忧的核心在于：更严格的审计可能迫使保险公司退还更多医保资金，从而压缩其利润及未来盈利预期。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123191520492986754","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":144},{"id":"2123190867066589269","h":"bboczeng","ts":1795043124,"zh":"刘云平长得很像石平啊\n这两人，最终都成为华人在海外政界的代表人物\n一个在日本，一个在美国\n难道面相上有什么说法吗？\n谢谢大家！","en":"刘云平长得很像石平啊\n这两人，最终都成为华人在海外政界的代表人物\n一个在日本，一个在美国\n难道面相上有什么说法吗？\n谢谢大家！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123190867066589269","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":221},{"id":"2123189275357581537","h":"bboczeng","ts":1795042744,"zh":"如果IPO后市值迅速跌回$1T，那基本可以说明这几天的签约都是投机性质，\nAI交易是真的要在2027年，彻底完蛋了\n我们现在虽然已经跌了很多，但可能也仅仅是在半山腰上","en":"如果IPO后市值迅速跌回$1T，那基本可以说明这几天的签约都是投机性质，\nAI交易是真的要在2027年，彻底完蛋了\n我们现在虽然已经跌了很多，但可能也仅仅是在半山腰上","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123189275357581537","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":394},{"id":"2123187625511313695","h":"wufantouzi","ts":1795042351,"zh":"ant打新\n锁住了市场5000亿美金流动资金\n预计还有30多个小时解禁回来 盘 · 11月18日】\n**大市**\n三大指数涨跌不一。标普(SPY) 收于 730.20，跌 0.31%。纳指(QQQ) 收于 659.51，涨 0.39%。道指(DIA) 收于 501.64，跌 1.12%，跌幅在主要指数中最大。罗素小型股(IWM) 收于 270.11，涨 0.39%。市宽偏弱，107 只观察股中 36 只上涨、71 只下跌，下跌家数约为上涨家数的两倍。指数层面科技权重股提供支撑，但多数个股承压。\n**板块**\n网络安全板块表现最强。 $PANW 涨 9.90%，领涨观察池。CRWD 涨 7.95%，NET 涨 5.66%。半导体与网络设备走强，AMD 涨 5.31%，ANET 涨 4.03%，AVGO 涨 3.65%。软件股同步上涨，MDB 涨 2.71%，SNOW 涨 2.45%。AMZN 涨 3.82%，TGT 涨 4.01%。\n能源板块领跌。OXY 跌 4.88%，CVX 跌 4.74%。量子计算概念股走弱，IONQ 跌 5.48%，QBTS 跌 4.83%。AAOI 跌 9.80%，ASTS 跌 7.61%，CRWV 跌 4.13%，QCOM 跌 4.12%。MRNA 跌 4.84%。\n**焦点**\nUNH 大跌 10.21%，为观察池中跌幅最大的个股。UNH 是道指成分股，是道指今日跌幅明显大于其他指数的主要拖累之一。\nNVDA 于前一交易日盘后公布第三财季业绩，今日盘中交易反映的就是这份财报。与财报同时受关注的是公司治理：董事会主席表示已接受黄仁勋辞职，且无意让其回归；黄仁勋此前对《华尔街日报》表示，若董事会邀请，他愿意回任。\nAVGO 上涨，定制芯片是市场持续讨论的方向。谷歌、Meta 等大厂推进自研芯片，以降低对英伟达的依赖，这部分订单的主要承接方正是博通。\nPANW 将于今日盘后公布财报，结果影响的是下一个交易日的走势。\n**小结**\n今日市场结构分化。科技成长方向偏强，网络安全、半导体和软件领涨。能源、医疗保险和量子计算概念承压。纳指与小型股小幅上涨，道指受个股拖累明显下跌，市宽显示多数个股走弱。后续关注 NVDA 管理层事件的进展，以及 PANW 盘后财报。\n---\n几点处理说明：\n- **PANW**：今日涨 9.90% 没有归因于财报，财报只作为盘后事项提及，符合铁律第 5 条。\n- **NVDA**：今日涨跌幅不在【今日行情】里，所以只写了财报和董事会事件，没有写涨跌，也没有写\"超预期\"。\n- **UNH**：今天大跌的原因数据里没有，正文只写了它对道指的拖累，没有编造原因。","en":"【美股复盘 · 11月18日】\n**大市**\n三大指数涨跌不一。标普(SPY) 收于 730.20，跌 0.31%。纳指(QQQ) 收于 659.51，涨 0.39%。道指(DIA) 收于 501.64，跌 1.12%，跌幅在主要指数中最大。罗素小型股(IWM) 收于 270.11，涨 0.39%。市宽偏弱，107 只观察股中 36 只上涨、71 只下跌，下跌家数约为上涨家数的两倍。指数层面科技权重股提供支撑，但多数个股承压。\n**板块**\n网络安全板块表现最强。 $PANW 涨 9.90%，领涨观察池。CRWD 涨 7.95%，NET 涨 5.66%。半导体与网络设备走强，AMD 涨 5.31%，ANET 涨 4.03%，AVGO 涨 3.65%。软件股同步上涨，MDB 涨 2.71%，SNOW 涨 2.45%。AMZN 涨 3.82%，TGT 涨 4.01%。\n能源板块领跌。OXY 跌 4.88%，CVX 跌 4.74%。量子计算概念股走弱，IONQ 跌 5.48%，QBTS 跌 4.83%。AAOI 跌 9.80%，ASTS 跌 7.61%，CRWV 跌 4.13%，QCOM 跌 4.12%。MRNA 跌 4.84%。\n**焦点**\nUNH 大跌 10.21%，为观察池中跌幅最大的个股。UNH 是道指成分股，是道指今日跌幅明显大于其他指数的主要拖累之一。\nNVDA 于前一交易日盘后公布第三财季业绩，今日盘中交易反映的就是这份财报。与财报同时受关注的是公司治理：董事会主席表示已接受黄仁勋辞职，且无意让其回归；黄仁勋此前对《华尔街日报》表示，若董事会邀请，他愿意回任。\nAVGO 上涨，定制芯片是市场持续讨论的方向。谷歌、Meta 等大厂推进自研芯片，以降低对英伟达的依赖，这部分订单的主要承接方正是博通。\nPANW 将于今日盘后公布财报，结果影响的是下一个交易日的走势。\n**小结**\n今日市场结构分化。科技成长方向偏强，网络安全、半导体和软件领涨。能源、医疗保险和量子计算概念承压。纳指与小型股小幅上涨，道指受个股拖累明显下跌，市 [],"t":["美联储","美股"],"lk":3,"rt":0,"rp":1,"vw":536},{"id":"2123168016125108580","h":"bboczeng","ts":1795037676,"zh":"英伟达股价下跌，尽管财报创纪录、高层动荡\n公司业绩全面超出预期，数据中心销售额激增 110%，下一季度业绩指引约为 1300 亿美元。但投资者的目光集中在各种不确定性上：黄仁勋上周离职、董事会调查、SEC 调查，以及对华销售问题。\n股价抹去了盘初涨幅，延续了此前的抛售走势，自 10 月初 240 美元以上的高点以来，已蒸发约 2 万亿美元市值。\n竞争对手 AMD 在此轮下跌中表现更为稳健，交易员指出，英伟达的执行风险盖过了强劲的业绩。","en":"英伟达股价下跌，尽管财报创纪录、高层动荡\n公司业绩全面超出预期，数据中心销售额激增 110%，下一季度业绩指引约为 1300 亿美元。但投资者的目光集中在各种不确定性上：黄仁勋上周离职、董事会调查、SEC 调查，以及对华销售问题。\n股价抹去了盘初涨幅，延续了此前的抛售走势，自 10 月初 240 美元以上的高点以来，已蒸发约 2 万亿美元市值。\n竞争对手 AMD 在此轮下跌中表现更为稳健，交易员指出，英伟达的执行风险盖过了强劲的业绩。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123168016125108580","l":[],"ln":[],"t":["AI科技","财报"],"lk":1,"rt":0,"rp":0,"vw":165},{"id":"2123167719155798265","h":"bboczeng","ts":1795037605,"zh":"金银在美联储鹰派通胀信号下暴跌\n此次暴跌在一天之内抹去了黄金和白银合计逾 1.17 万亿美元的市值，两者均跌至 14 个月低点，同时美元飙升至 2025 年 4 月以来的最高水平。\n沃勒（Waller）在接受 CNBC 采访时表示，为应对年化约 3.5% 的通胀，美联储 12 月可能需要加息 50 个基点，或发出更强的政策信号，并呼吁以\"冲击\"来重置市场预期。\n经济学家彼得·席夫（Peter Schiff）警告称，如果真正开始抗击通胀，股票、债券和房地产的跌幅可能比黄金更大，甚至可能引发比 2008 年更严重的衰退；不过也有交易员质疑，加息是否会过度收紧，反而导致通胀过度回落。","en":"金银在美联储鹰派通胀信号下暴跌\n此次暴跌在一天之内抹去了黄金和白银合计逾 1.17 万亿美元的市值，两者均跌至 14 个月低点，同时美元飙升至 2025 年 4 月以来的最高水平。\n沃勒（Waller）在接受 CNBC 采访时表示，为应对年化约 3.5% 的通胀，美联储 12 月可能需要加息 50 个基点，或发出更强的政策信号，并呼吁以\"冲击\"来重置市场预期。\n经济学家彼得·席夫（Peter Schiff）警告称，如果真正开始抗击通胀，股票、债券和房地产的跌幅可能比黄金更大，甚至可能引发比 2008 年更严重的衰退；不过也有交易员质疑，加息是否会过度收紧，反而导致通胀过度回落。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123167719155798265","l":[],"ln":[],"t":["美联储","通胀","黄金"],"lk":0,"rt":0,"rp":0,"vw":188},{"id":"2123164308712661020","h":"bboczeng","ts":1795036792,"zh":"你的观察很准确，现在是白宫护盘，所以资金只能去价值股拉SPY\nSPY的回调一般都比QQQ晚1-3个月\n我们最迟明年2月就知道，这次大崩盘最深能跌到哪里去了\n某些人，某些KOL，以价值股PE过高为借口，证明半导体一定会反弹\n这是很可笑的，就算因为Pair Trade collapse，半导体反弹也是给你跑路的机会\n是绝对回不到前高，也可能长期建仓的\n这群人就这么想回本吗？\n历史上，买错了想回本的人比比皆是，\n但他们基本都逃不过腰斩再腰斩，最后需要翻10倍才能回本的命运\n虽然很遗憾，但这就是事实","en":"你的观察很准确，现在是白宫护盘，所以资金只能去价值股拉SPY\nSPY的回调一般都比QQQ晚1-3个月\n我们最迟明年2月就知道，这次大崩盘最深能跌到哪里去了\n某些人，某些KOL，以价值股PE过高为借口，证明半导体一定会反弹 ghaoJin","ts":1795032035,"zh":"蒂姆·库克（Tim Cook）继承了史蒂夫·乔布斯（Steve Jobs）的遗产，但内华达州董事会必须解散詹森（Jensen）才能继续掌权。\n通过将领导层过渡转变为权力斗争，他们不可避免地改变了 NV 的文化\n乔布斯是苹果公司的传奇人物，而库克的工作就是为了保存这一遗产。\n但内华达州董事会拒绝了詹森的回归，现在必须证明没有他也能取得成功，并以不同的方式做事。您可以期待更多的合规性、更严格的控制、共识驱动的决策和官僚主义。\n短期财务收益可能会成为证明自己合理性的方式，但代价是牺牲让内华达变得非凡的激进冒险精神。\n结果呢？你会看到一个更加官僚化、规避风险、政治正确的 NV。它可能会在几年内保持盈利，但它不会是詹森建造的。\n这就是为什么首席财务官克雷斯或任何董事会指定的继任者可能注定会失败","en":"Tim Cook inherited Steve Jobs’ legacy, but NV board will have to dismantle Jensen’s to stay in power.\nBy turning a leadership transition into a power struggle, they are inevitably changing NV’s culture\nJobs was a legend in AAPL, and Cook’s job was just to preserve this legacy.\nBut NV’s board, having rejected Jensen’s return, must now prove it can succeed without him, and do things differently. You can expect more compliance, tighter controls, consensus driven decisions, and bureaucracy.\nShort term financial earnings will likely become the way to justify itself, at the expense of the aggressive risk taking that made NV extraordinary.\nThe result? You will see a more bureaucratic, risk averse, politically correct NV. It may remain profitable for a few more years, but it won’t be the one Jensen built.\nThat’s why Kress the CFO, or any board-appointed successor, may be doomed to fail","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ShanghaoJin/status/2123144356941205756","l":[],"ln":[],"t":["财报"],"lk":14,"rt":1,"rp":1,"vw":1350},{"id":"2123138337653637591","h":"octopusycc","ts":1795030600,"zh":"我认为瓶颈交易早就结束了\nAI也在事实放缓\n市场关于AI和半导体的定价是这个市场更重要的事情","en":"我认为瓶颈交易早就结束了\nAI也在事实放缓\n市场关于AI和半导体的定价是这个市场更重要的事情","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2123138337653637591","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":1,"vw":251},{"id":"2123132870718062629","h":"bboczeng","ts":1795029296,"zh":"黄仁勋真的有间谍，至少是走私嫌疑的，这不是开玩笑\n他肯定不可能回去做CEO了\n谢谢大家","en":"黄仁勋真的有间谍，至少是走私嫌疑的，这不是开玩笑\n他肯定不可能回去做CEO了\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/s
