<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

证金比例由80%调高至100%，对于缓解杠杆风险顺周期累积、促进投资者理性交易起到了积极作用。近期，融资交易活跃度明显下降，整体杠杆水平不高，根据法定的逆周期调节安排，适当降低融资保证金比例，有助于适度提高杠杆比例、释放融资空间、提升市场流动性，促进市场长期稳定健康发展。对于本次调整前尚未了结的融资合约，证券公司可以按照修改后的规定计算投资者的保证金可用余额，进一步盘活存量资金。\n此外，本次通知要求证券公司加强投资者融资融券交易行为管理，对存在异常交易行为的投资者从严适用保证金比例、可充抵保证金证券折算率等风险控制指标，审慎把控授信额度、交易费率等，情节严重的，必要时可依法采取限制、暂停或终止向其提供融资融券交易服务、不予展期等措施。前述要求旨在防范部分投资者利用两融工具过度投机和异常交易，有利于维护市场交易秩序，助力市场健康稳定运行，切实保护投资者合法权益。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2124455269132591370","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1227},{"id":"2124452354250428870","h":"bbcchinese","ts":1795343886,"zh":"威尔斯王妃凯特在即将播出的BBC纪录片《疗愈》（Heal）中，深入分享自己的抗癌与康复历程，坦言“癌症确实会改变你”，并强调疗愈是一段需要家人与他人陪伴的旅程。这部高度私人的影片将于11月29日播出，收录她完成“三峰挑战”及与家人互动的新画面。","en":"威尔斯王妃凯特在即将播出的BBC纪录片《疗愈》（Heal）中，深入分享自己的抗癌与康复历程，坦言“癌症确实会改变你”，并强调疗愈是一段需要家人与他人陪伴的旅程。这部高度私人的影片将于11月29日播出，收录她完成“三峰挑战”及与家人互动的新画面。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2124452354250428870","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4topfhN","d":"bbc.in"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":946},{"id":"2124451914016489831","h":"cnfinancewatch","ts":1795343781,"zh":"共和党:不准出国建数据中心，\n民主党:不准在本土建数据中心。\n科技巨头马斯克：明年没钱建！\n目前美股的情况！","en":"共和党:不准出国建数据中心，\n民主党:不准在本土建数据中心。\n科技巨头马斯克：明年没钱建！\n目前美股的情况！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124451914016489831","l":[],"ln":[],"t":["美股"],"lk":0,"rt":0,"rp":0,"vw":514},{"id":"2124450909979890146","h":"bboczeng","ts":1795343541,"zh":"如果因为本次投资狂热暴雷，美股半导体和QQQ陷入持续多年的超级大熊市，那今天重仓VGT的人肯定就完蛋了\n这也是下周一抄底时，我将会极度保守，只买一支科技股占比较低ETF的原因\n谢谢大家","en":"如果因为本次投资狂热暴雷，美股半导体和QQQ陷入持续多年的超级大熊市，那今天重仓VGT的人肯定就完蛋了\n这也是下周一抄底时，我将会极度保守，只买一支科技股占比较低ETF的原因\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124450909979890146","l":[],"ln":[],"t":["美股","AI科技"],"lk":4,"rt":0,"rp":2,"vw":572},{"id":"2124446041554419957","h":"bbcchinese","ts":1795342381,"zh":"以飙车和交通混乱闻名的电玩《侠盗猎车手》（GTA），如今竟成为研究人员提升现实世界道路安全的低成本实验室。凭藉逼真的物理模拟与城市环境，各国团队正透过改装这款游戏，测试单车警示装置、追踪人类面对危险的反应，并训练自动驾驶AI辨识风险与作出伦理抉择。","en":"以飙车和交通混乱闻名的电玩《侠盗猎车手》（GTA），如今竟成为研究人员提升现实世界道路安全的低成本实验室。凭藉逼真的物理模拟与城市环境，各国团队正透过改装这款游戏，测试单车警示装置、追踪人类面对危险的反应，并训练自动驾驶AI辨识风险与作出伦理抉择。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2124446041554419957","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4tdYcpj","d":"bbc.in"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":438},{"id":"2124443946118156513","h":"bboczeng","ts":1795341881,"zh":"特斯拉推出 FSD 15 版本，搭载震撼的\"现实视图\"\n特斯拉已开始向首批用户推送完全自动驾驶（FSD）15 版本，并引入\"特斯拉现实视图\"（Tesla Reality View）：以俯视视角生动渲染周围环境、行人、车道线和规划路线，并支持点按方向指引。\n此次更新提升了对交通标志、动物、坑洼、积水和测速摄像头的识别能力，从而增强安全性，同时在学校区域和恶劣天气下的行驶也更加平稳。整套系统由与 Robotaxi 技术共享的统一神经网络驱动。\n埃隆·马斯克称这一版本是\"banger\"（大作），并称其\"超级\"智能，在关键驾驶能力上超越人类；早期用户则表示画面令人惊叹，堪比《GTA》。更大范围的推送将于下个月开始。","en":"特斯拉推出 FSD 15 版本，搭载震撼的\"现实视图\"\n特斯拉已开始向首批用户推送完全自动驾驶（FSD）15 版本，并引入\"特斯拉现实视图\"（Tesla Reality View）：以俯视视角生动渲染周围环境、行人、车道线和规划路线，并支持点按方向指引。\n此次更新提升了对交通标志、动物、坑洼、积水和测速摄像头的识别能力，从而增强安全性，同时在学校区域和恶劣天气下的行驶也更加平稳。整套系统由与 Robotaxi 技术共享的统一神经网络驱动。\n埃隆·马斯克称这一版本是\"banger\"（大作），并称其\"超级\"智能，在关键驾驶能力上超越人类；早期用户则表示画面令人惊叹，堪比《GTA》。更大范围的推送将于下个月开始。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124443946118156513","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":562},{"id":"2124443807311618457","h":"bboczeng","ts":1795341848,"zh":"因为他本人已经扭曲了\n他从来不会正面回答你的问题，也不会正面承认自己的错误\n甚至都不会承认因本次在顶部“打光子弹”买入BE，AEHR，NBIS，NOK，CRBS，给“联创”Family Office带来的重大损失\n那种放在高盛FICC下周一就要被开除，职业生涯到此结束的损失\n这种人精，应该是经历过多次爆仓，破产\n在香港黑帮文化和经济下沉的浸淫下，现在已经水火不侵，刀枪不入了\n他现在给粉丝洗地的挡箭牌是：\n我是疯子，我人品不好，他遇人不淑\n你们这群粉丝才是真的遇人不淑好吧\n被他骗了6个月了\n😅😅😅","en":"因为他本人已经扭曲了\n他从来不会正面回答你的问题，也不会正面承认自己的错误\n甚至都不会承认因本次在顶部“打光子弹”买入BE，AEHR，NBIS，NOK，CRBS，给“联创”Family Office带来的重大损失\n那种放在高盛FICC下周一就要被开除，职业生涯到此结束的损失\n这种人精，应该是经历过多次爆仓，破产\n在香港黑帮文化和经济下沉的浸淫下，现在已经水火不侵，刀枪不入了\n他现在给粉丝洗地的挡箭牌是：\n我是疯子，我人品不好，他遇人不淑\n你们这群粉丝才是真的遇人不淑好吧\n被他骗了6个月了\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124443807311618457","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":419},{"id":"2124443506886545720","h":"wallstsir","ts":1795 油价似乎都不会一直高涨\ncpi也不会一直高居不下\n不需要物价下跌\n只需要物价稳住上涨速度\n货币宽松预期就可以重启\n美股就可以走牛\n引用：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2124441851994550665","l":["web.timestore.vip"],"ln":[{"u":"https://web.timestore.vip/#/time/pages/timeDetail/index?timeid=185359","d":"web.timestore.vip"}],"t":["通胀","美股","原油能源"],"lk":6,"rt":0,"rp":2,"vw":1795},{"id":"2124434291191136500","h":"CrushTheShorts","ts":1795339579,"zh":"复盘国庆后两个月的行情，感触最深的是炒股养家老师的一句话，“当你想回本再卖掉的时候，那你应该马上就卖掉”\n胜负手就是10.8那天，发现事情不对之后，要不要选择剁掉，后面每犹豫一天，损失都会以一个非常夸张的幅度扩大","en":"复盘国庆后两个月的行情，感触最深的是炒股养家老师的一句话，“当你想回本再卖掉的时候，那你应该马上就卖掉”\n胜负手就是10.8那天，发现事情不对之后，要不要选择剁掉，后面每犹豫一天，损失都会以一个非常夸张的幅度扩大","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2124434291191136500","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":0,"vw":618},{"id":"2124431117256409595","h":"Guilin_Chen_","ts":1795338823,"zh":"我，用抖音上的话讲，应该就属于那种毫无攻击性的人，就是不适合现代社会生活的人，但今天我想逼逼两句。\nX上其实有一个特别典型的现象，就是每次行情不好，或者大跌了，总会有一帮KOL把之前喊多的博主挂出来鞭尸，然后博取流量；\n之前喊多的博主流量越高，他们越挂，如果能反驳他们两句，那就更兴奋了，流量人血馒头吃的不亦乐乎，仿佛把别人踩在脚下，就能证明他们厉害，他们对，他们牛......\n回头再翻一翻他们的X，拿比特币举例，57000-87000上涨波，要么在做空，要么一点没做，稍微好点的，中间吃了个10%-20%的涨幅（那就够骄傲一辈子了，美其名曰，我只做我自己能够看懂的行情）；\n说的更都是一些模棱两可的话，反正将来无论涨跌，他都会说，嗯，这种情况：“我早说了吧！”，挂人者先防人挂，说话滴水不漏，但是我想问，有用吗？\n交易是一个很复杂的事情，有关认知、有关水平、最重要的是关乎人性。\n就拿这波我自己的币圈操作举例：\n比特币从57开始反弹以来，我基本吃满了57-87这整个上涨。\n昨天还和社区的小伙伴讲：想要赌趋势，如果做现货，确定起涨点被破坏了、确定趋势没了之后再跑，是没有问题的；既然是赌趋势，趋势不成立，盈利大幅度回撤那就是要承受的后果；\n还记得2026年2-5月那波反弹吗？比特币数次跌回上轮上涨的斐波那契0.786，然后又拉回，这波市场的难度，就是这个样子的。\n我的问题，出在人性的贪，加了杠杆；出在菜，不够敏感，没有分析明白美国那边问题的严重性，还心存侥幸；但是，不管赚，还是赔，我认为这都是交易的一部分。\n再回头看，现在这帮人，没有赔，好像很牛逼的样子；\n那有几个是真正的就提前意识到了危机？\n有几个是做完了一轮上涨后全身而退？\n那如果是你本来就没在车上，你当然不会赔，因为你也不曾赚过啊？\n那现在你又凭什么来踩这些看多的博主来博取流量呢？\n人品真的是差极了！\n这种，不管是引用的，还是转发的，还是回复的，今后，看到一个，拉黑一个。","en":"我，用抖音上的话讲，应该就属于那种毫无攻击性的人，就是不适合现代社会生活的人，但今天我想逼逼两句。\nX上其实有一个特别典型的现象，就是每次行情不好，或者大跌了，总会有一帮KOL把之前喊多的博主挂出来鞭尸，然后博取流量；\n之前喊多的博主流量越高，他们越挂，如果能反驳他们两句，那就更兴奋了，流量人血馒头吃的不亦乐乎，仿佛把别人踩在脚下，就能证明他们厉害，他们对，他们牛......\n回头再翻一翻他们的X，拿比特币举例，57000-87000上涨波，要么在做空，要么一点没做，稍微好点的，中间吃了个10%-20%的涨幅（那就够骄傲一辈子了，美其名曰，我只做我自己能够看懂的行情）；\n说的更都是一些模棱两可的话，反正将来无论涨跌，他都会说，嗯，这种情况：“我早说了吧！”，挂人者先防人挂，说话滴水不漏，但是我想问，有用吗？\n交易是一个很复杂的事情，有关认知、有关水平、最重要的是关乎人性。\n就拿这波我自己的币圈操作举例：\n比特币从57开始反弹以来，我基本吃满了57-87这整个上涨。\n昨天还和社区的小伙伴讲：想要赌趋势，如果做现货，确定起涨点被破坏了、确定趋势没了之后再跑，是没有问题的；既然是赌趋势，趋势不成立，盈利大幅度回撤那就是要承受的后果；\n还记得2026年2-5月那波反弹吗？比特币数次跌回上轮上涨的斐波那契0.786，然后又拉回，这波市场的难度，就是这个样子的。\n我的问题，出在人性的贪，加了杠杆；出在菜，不够敏感，没有分析明白美国那边问题的严重性，还心存侥幸；但是，不管赚，还是赔，我认为这都是交易的一部分。\n再回头看，现在这帮人，没有赔，好像很牛逼的样子；\n那有几个是真正的就提前意识到了危机？\n有几个是做完了一轮上涨后全身而退？\n那如果是你本来就没在车上，你当然不会赔，因为你也不曾赚过啊？\n那现在你又凭什么来踩这些看多的博主来博取流量呢？\n人品真的是差极了！\n这种，不管是引用的，还是转发的，还是回复的，今后，看到一个，拉黑一个。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Guilin_Chen_/status/2124431117256409595","l":[],"ln":[],"t":[],"lk":23,"rt":2,"rp":9,"vw":2672},{"id":"2124428215913705777","h":"bboczeng","ts":1795338131,"zh":"不知不觉，NVDA竟然跌回了我当时赌他跌不破120的位置\n诶，太惨了。。。","en":"不知不觉，NVDA竟然跌回了我当时赌他跌不破120的位置\n诶，太惨了。。。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124428215913705777","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":2,"vw":651},{"id":"2124425395839664467","h":"qinbafrank","ts":1795337458,"zh":"老马今天发帖强调AI算力部署、冷却和可靠运行的实际困难，以及明年行业现金流压力巨大，目标直指NeoCloud厂商，感觉他又想打扫战场了。SpaceX三季度末1.7GW算力，年底能到2.5GW，正在建设中明年能投产算力还有1GW，明年至少3.5GW算力在手。SpaceX明年重头戏是亚利桑那州Cochise County项目6GW，现在亚利桑那州州长、联邦参议员、州两院都是民主党掌控，变数还很大。但3.5GW已建成算力规模已经不小了，这让老马底气十足。","en":"老马今天发帖强调AI算力部署、冷却和可靠运行的实际困难，以及明年行业现金流压力巨大，目标直指NeoCloud厂商，感觉他又想打扫战场了。SpaceX三季度末1.7GW算力，年底能到2.5GW，正在建设中明年能投产算力还有1GW，明年至少3.5GW算力在手。SpaceX明年重头戏是亚利桑那州Cochise County项目6GW，现在亚利桑那州州长、联邦参议员、州两院都是民主党掌控，变数还很大。但3.5GW已建成算力规模已经不小了，这让老马底气十足。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXt5MrYasAEWXO3.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2124425395839664467","l":[],"ln":[],"t":["AI科技"],"lk":15,"rt":1,"rp":8,"vw":3608},{"id":"2124424554378670245","h":"bboczeng","ts":1795337258,"zh":"我语文作文的成绩是最差的，这也直接导致我高考和清华无缘，毕竟我有物理竞赛20分的加分。\n但问题是，写作文和写作其实是两回事\n首先，写作是自己的真情所发，真情所感，目的是表达自己的思想、立场，而且还可以反复修改，直到让自己满意，可以不断学习，精进自己的思维，这和命题作文很不同\n命题作文之所以痛苦，\n一个是他的题目是别人限定的，自己那么小，根本没有 金管局闹着要把他开除的货色\n现在居然还在网上有2000粉丝\n我这句话说错了吗？\n人类本质上当然都是一群喜欢自我欺骗的弱智，我并不觉得我就比他高人一等\n但他的问题是“无耻”\n是可忍孰不可忍而已","en":"为什么说我是“神经病”，我只是敢爱敢恨，直话直说，不用顾忌你们这群老登以及充斥整个社会99%的低学历傻逼而已\n比如那个金尚浩（herman jin），本质就是个末流高盛被开除的大傻逼\nFOMC会议记录都不看，10月份追高半导体而且全都是小盘股，Zen Family Office天天在香港金管局闹着要把他开除的货色\n现在居然还在网上有2000粉丝\n我这句话说错了吗？\n人类本质上当然都是一群喜欢自我欺骗的弱智，我并不觉得我就比他高人一等\n但他的问题是“无耻”\n是可忍孰不可忍而已","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124340384520425953","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":544},{"id":"2124340015128035711","h":"bboczeng","ts":1795317102,"zh":"当然他的语言还是一贯的“太监”，连一句稍微直白的论断都不敢说，靠的就是你自己去理解。\n懂得都懂","en":"当然他的语言还是一贯的“太监”，连一句稍微直白的论断都不敢说，靠的就是你自己去理解。\n懂得都懂","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124340015128035711","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":321},{"id":"2124339278620803142","h":"bboczeng","ts":1795316926,"zh":"我记得之前在10月份，我判断美联储一定会加息，而且加息的原因其实是AI的时候，我说了这么一句话：\n“淹死的都是会水的“\n指的当然是那些自以为是的多头，从来没有为一次大崩盘做过任何准备\n结果你猜怎么着，咱们的大聪明说“一群自己都不会游泳的人，在指点水池太深要淹死人”\n还嘲讽说“珍惜身边情绪化的人”，暗示我们很情绪化，\n还说我们都是优质指标，要大家我们的名字都记下来\n然后今天他又说“谁能想到呢？”\n是啊，谁能想到呢？谁能想到您不但毫无任何专业知识，还这么喜欢装逼，甚至内心和一个太监小人一样，天天阴阳怪气，明里暗里怂恿自己的粉丝，去网暴空头呢？\n请问截止2026年11月20日本周五，咱们的Herman Jin太监老师，您淹死了吗？\n您还没淹死吗？？\n还有这样的奇观，那我觉得我们确实需要把他这样的人好好捧一捧，然后把名字好好记下\n大家记下来了吗？\n我来帮大家记一下：Herman Jin，毕业于名校Univeristy of WaterLoo，在高盛最末端亚洲FICC干了20年，转行网络小说写手和香港Family Office，因为误判FOMC和“抄底”半导体AI小盘股，大概率年底即将被合伙人开除的\n金尚浩先生？\n判断错误都是正常的，我也经常看错。但你的问题是错误吗？你的问题难道不是您随时随地阴阳怪气的嘲笑他人，同时散发出阵阵恶臭的无耻人品？\n你难道真的都没有勇气，为自己曾经道貌岸然之下的自大和狂妄无知\n道歉吗？\n谢谢大家\n😅😅😅","en":"我记得之前在10月份，我判断美联储一定会加息，而且加息的原因其实是AI的时候，我说了这么一句话：\n“淹死的都是会水的“\n指的当然是那些自以为是的多头，从来没有为一次大崩盘做过任何准备\n结果你猜怎么着，咱们的大聪明说“一群自己都不会游泳的人，在指点水池太深要淹死人”\n还嘲讽说“珍惜身边情绪化的人”，暗示我们很情绪化，\n还说我们都是优质指标，要大家我们的名字都记下来\n然后今天他又说“谁能想到呢？”\n是啊，谁能想到呢？谁能想到您不但毫无任何专业知识，还这么喜欢装逼，甚至内心和一个太监小人一样，天天阴阳怪气，明里暗里怂恿自己的粉丝，去网暴空头呢？\n请问截止2026年11月20日本周五，咱们的Herman Jin太监老师，您淹死了吗？\n您还没淹死吗？？\n还有这样的奇观，那我觉得我们确实需要把他这样的人好好捧一捧，然后把名字好好记下\n大家记下来了吗？\n我来帮大家记一下：Herman Jin，毕业于名校Univeristy of WaterLoo，在高盛最末端亚洲FICC干了20年，转行网络小说写手和香港Family Office，因为误判FOMC和“抄底”半导体AI小盘股，大概率年底即将被合伙人开除的\n金尚浩先生？\n判断错误都是正常的，我也经常看错。但你的问题是错误吗？你的问题难道不是您随时随地阴阳怪气的嘲笑他人，同时散发出阵阵恶臭的无耻人品？\n你难道真的都没有勇气，为自己曾经道貌岸然之下的自大和狂妄无知\n道歉吗？\n谢谢大家\n😅😅😅","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXsp6RyawAErrTm.jpg?name=orig","https://pbs.twimg.com/media/HXsp8KraAAACD1c.jpg?name=orig","https://pbs.twimg.com/media/HXsqCRFaEAADIEV.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2124339278620803142","l":[],"ln":[],"t":["美联储","AI科技"],"lk":5,"rt":0,"rp":3,"vw":681},{"id":"2124337203690291419","h":"ShanghaoJin","ts":1795316432,"zh":"不是，写这段背是：\n国家承平，支持与袁世凯合作的宋教仁，被孙文亲信—陈美琪的小弟—应桂馨找杀手暗杀了宋\n当时上海地方审判厅已经传唤了国务院总理赵秉钧，某人拒绝司法途径悍然发动二次革命\n失败后向日本摇尾乞怜，请刚重新组阁的日本首相大隈重信支持革命党推翻袁政府，并提出以开放中国市场、让日本工商界受益作为回报","en":"不是，写这段背是：\n国家承平，支持与袁世凯合作的宋教仁，被孙文亲信—陈美琪的小弟—应桂馨找杀手暗杀了宋\n当时上海地方审判厅已经传唤了国务院总理赵秉钧，某人拒绝司法途径悍然发动二次革命\n失败后向日本摇尾乞怜，请刚重新组阁的日本首相大隈重信支持革命党推翻袁政府，并提出以开放中国市场、让日本工商界受益作为回报","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2124337203690291419","l":[],"ln":[],"t":[],"lk":3,"rt":1,"rp":1,"vw":1671},{"id":"2124336298618208671","h":"bboczeng","ts":1795316216,"zh":"我记得之前在10月份，我判断美联储一定会加息，而且加息的原因一定是AI的时候，我说了这么一句话：\n“淹死的都是会水的“\n指的当然是那些自以为是的多头，从来没有为一次大崩盘做过任何准备\n结果你猜怎么着，咱们的大聪明说“你没有和我谈论宏观的资格”\n然后今天他说“谁能想到呢”\n你能为自己的狂妄自大和无知道歉吗？\n😅😅😅","en":"我记得之前在10月份，我判断美联储一定会加息，而且加息的原因一定是AI的时候，我说了这么一句话：\n“淹死的都是会水的“\n指的当然是那些自以为是的多头，从来没有为一次大崩盘做过任何准备\n结果你猜怎么着，咱们的大聪明说“你没有和我谈论宏观的资格”\n然后今天他说“谁能想到呢”\n你能为自己的狂妄自大和无知道歉吗？\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124336298618208671","l":[],"ln":[],"t":["美联储"],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2124336175326367874","h":"TJ_Research","ts":1795316187,"zh":"会经常听到一句话，市场总是对的。怎么理解？我认为应该理解为价格总是对的，而这个价格反应的是当下综合因素，力量的结果，对交易特别有用，比如财报好下跌，财报差不跌。\n而价格并非一定对未来的事件，公司基本面预测准确。市场下跌或者上涨，市场都会去给原因，去合理化价格的波动，去猜这段时间市场在交易什么，而投资，仅仅看得是公司的EPS增速，PE很多时候是交给市场，因为是一个浑沌的因子。\n所以有没有可能这波半导体的下跌，其实市场单纯的在杀杠杆，而并非在走半导体的周期结束？一个可能性和思考的方向。","en":"会经常听到一句话，市场总是对的。怎么理解？我认为应该理解为价格总是对的，而这个价格反应的是当下综合因素，力量的结果，对交易特别有用，比如财报好下跌，财报差不跌。\n而价格并非一定对未来的事件，公司基本面预测准确。市场下跌或者上涨，市场都会去给原因，去合理化价格的波动，去猜这段时间市场在交易什么，而投资，仅仅看得是公司的EPS增速，PE很多时候是交给市场，因为是一个浑沌的因子。\n所以有没有可能这波半导体的下跌，其实市场单纯的在杀杠杆，而并非在走半导体的周期结束？一个可能性和思考的方向。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2124336175326367874","l":[],"ln":[],"t":["AI科技","财报"],"lk":42,"rt":1,"rp":24,"vw":5474},{"id":"2124334239361413189","h":"bbcchinese","ts":1795315725,"zh":"天文学家证实，直径仅一至两公尺的小行星「2026 QQ8」已被地球引力暂时捕获，成为绕行地球的新一颗「迷你月亮」，预计数个月后便会脱离轨道。除了这类短暂停留的迷你卫星，地球附近还有「准卫星」与「幽灵卫星」相伴，但它们距离都远超月球，对地球不构成任何威胁。","en":"天文学家证实，直径仅一至两公尺的小行星「2026 QQ8」已被地球引力暂时捕获，成为绕行地球的新一颗「迷你月亮」，预计数个月后便会脱离轨道。除了这类短暂停留的迷你卫星，地球附近还有「准卫星」与「幽灵卫星」相伴，但它们距离都远超月球，对地球不构成任何威胁。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2124334239361413189","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4fp1W1v","d":"bbc.in"}],"t":[],"lk":3,"rt":1,"rp":1,"vw":1406},{"id":"2124333009839259660","h":"bboczeng","ts":1795315432,"zh":"周五，台湾加权指数收跌6.2%，本周累计下跌约17.5%，\n创1991年以来最差单周表现；台积电当天收跌4.76%。","en":"周五，台湾加权指数收跌6.2%，本周累计下跌约17.5%，\n创1991年以来最差单周表现；台积电当天收跌4.76%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124333009839259660","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":1,"vw":616},{"id":"2124329437068198157","h":"bboczeng","ts":1795314580,"zh":"现在看到风向变了突然开始做空的小年轻们，很快也会被反噬\n咱们就等着看吧\n😭😭😭","en":"现在看到风向变了突然开始做空的小年轻们，很快也会被反噬\n咱们就等着看吧\n😭😭😭","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124329437068198157","l":[],"ln":[],"t":[],"lk":3,"rt":1,"rp":0,"vw":587},{"id":"2124328622685303002","h":"bboczeng","ts":1795314386,"zh":"所以，这波崩盘要是能把AI产业链全部出清，AI创业公司全部倒闭，GPU贬值到丢到街上都没人要\n最后大家一起去送外卖，那才是最好的\n我已经做好准备了","en":"所以，这波崩盘要是能把AI产业链全部出清，AI创业公司全部倒闭，GPU贬值到丢到街上都没人要\n最后大家一起去送外卖，那才是最好的\n我已经做好准备了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124328622685303002","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":249},{"id":"2124328070358479048","h":"qinbafrank","ts":1795314254,"zh":"两个被大家忽略事件也能佐证美国大众对于AI的情绪，也能解释共和党的惨败：1、9月中在华盛顿举办一场名为“亲人类大会”（Pro-Human Assembly）的人工智能会议上，班农和桑德斯同台演讲，共同呼吁对AI发展施加更多限制。这事罕见在于班农现在还是MAGA阵营最重要的代表人物，而桑德斯则主美国进步派代表人物，两位一个美国最右翼和一个最左翼的代表性人物，长期以来一直是政治对手，却因为担忧AI可能给人类带来伤害而罕见站到了一起，也折射出人工智能议题正在打破美国传统的左右政治分野。\n2、之前的几次全国性调查民众对数据中心建设的态度确实很负面。\n保守派人物传统基金会主席凯文·罗伯茨认为，共和党低估了本党选民对科技企业扩权的不满，让民主党在选举中抓住了这个议题。\n得州共和党众议员奇普·罗伊则把矛盾说得更具体：企业告诉居民，AI将使大量岗位消失，同时又请这些居民用土地、电力和水来支持项目。选民自然会问，自己为什么要为这笔投资买单。\n这就理解这次共和党惨败、一方面不仅民主党、即使共和党内部反思失败的时候也会把对AI管控权重给提上来。都败的这么惨了，川普自然也很难弹压之前被压制的党内强硬派。\n市场也开始重视这些声音、之前被忽略的对AI反对声音就开始被听到，到被重视、甚至开始被放大，导致市场和资金的预期也越来越悲观\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"两个被大家忽略事件也能佐证美国大众对于AI的情绪，也能解释共和党的惨败：1、9月中在华盛顿举办一场名为“亲人类大会”（Pro-Human Assembly）的人工智能会议上，班农和桑德斯同台演讲，共同呼吁对AI发展施加更多限制。这事罕见在于班农现在还是MAGA阵营最重要的代表人物，而桑德斯则主美国进步派代表人物，两位一个美国最右翼和一个最左翼的代表性人物，长期以来一直是政治对手，却因为担忧AI可能给人类带来伤害而罕见站到了一起，也折射出人工智能议题正在打破美国传统的左右政治分野。\n2、之前的几次全国性调查民众对数据中心建设的态度确实很负面。\n保守派人物传统基金会主席凯文·罗伯茨认为，共和党低估了本党选民对科技企业扩权的不满，让民主党在选举中抓住了这个议题。\n得州共和党众议员奇普·罗伊则把矛盾说得更具体：企业告诉居民，AI将使大量岗位消失，同时又请这些居民用土地、电力和水来支持项目。选民自然会问，自己为什么要为这笔投资买单。\n这就理解这次共和党惨败、一方面不仅民主党、即使共和党内部反思失败的时候也会把对AI管控权重给提上来。都败的这么惨了，川普自然也很难弹压之前被压制的党内强硬派。\n市场也开始重视这些声音、之前被忽略的对AI反对声音就开始被听到，到被重视、甚至开始被放大，导致市场和资金的预期也越来越悲观\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXsg90YasAAEcbv.jpg?name=orig","https://pbs.twimg.com/media/HXsg90aboAA6VPe.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2124328070358479048","l":[],"ln":[],"t":["美股","AI科技"],"lk":0,"rt":0,"rp":0,"vw":1169},{"id":"2124327284354281695","h":"bboczeng","ts":1795314067,"zh":"@jadenc141 而且更主要的问题是，水平非常一般也就罢了，他内心十分傲慢，觉得别人都不配谈宏观，都不会水\n我之前发过“淹死的都是会水的”，jin老师反手一个我不会水，我不配谈宏观，这个帖子你可以帮我找一下，只要他没删，推特都可以搜索\n我很好奇，他现在知道自己会水了吗？\n😅😅😅","en":"@jadenc141 而且更主要的问题是，水平非常一般也就罢了，他内心十分傲慢，觉得别人都不配谈宏观，都不会水\n我之前发过“淹死的都是会水的”，jin老师反手一个我不会水，我不配谈宏观，这个帖子你可以帮我找一下，只要他没删，推特都可以搜索\n我很好奇，他现在知道自己会水了吗？\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124327284354281695","l":[],"ln":[],"t":[],"lk":2,"rt":1,"rp":0,"vw":178},{"id":"2124326768563900914","h":"bboczeng","ts":1795313944,"zh":"年线收平，是美股开始进入熊市序列的常见形态\n如果明年美联储犯错，或者AI雷曼兄弟倒闭，或者Anthropic ARR大幅下修\n那么，SPY再回调20%也是完全可能的\n这也是我为什么不敢抄VGT的原因\n因为均值回归，他真的可以给你腰斩\n连QQQ的比例都要压低\n大家不要等到崩盘了才想起来要保守\n其实随时随地都要保守，我下周抄底的选择将会是极端保守的\n涨跌其实都是波动，不要以为上半年赚钱了，就是你自己或者某个KOL的水平\n请问他们有什么水平？在华尔街面前，你们只是波动的副产物而已\n甚至是波动的排泄物","en":"年线收平，是美股开始进入熊市序列的常见形态\n如果明年美联储犯错，或者AI雷曼兄弟倒闭，或者Anthropic ARR大幅下修\n那么，SPY再回调20%也是完全可能的\n这也是我为什么不敢抄VGT的原因\n因为均值回归，他真的可以给你腰斩\n连QQQ的比例都要压低\n大家不要等到崩盘了才想起来要保守\n其实随时随地都要保守，我下周抄底的选择将会是极端保守的\n涨跌其实都是波动，不要以为上半年赚钱了，就是你自己或者某个KOL的水平\n请问他们有什么水平？在华尔街面前，你们只是波动的副产物而已\n甚至是波动的排泄物","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124326768563900914","l":[],"ln":[],"t":["美联储","美股"],"lk":4,"rt":0,"rp":1,"vw":487},{"id":"2124326595078869376","h":"TJ_Research","ts":1795313903,"zh":"感觉现在就是这个时刻","en":"Feels like this is the moment","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/TJ_Research/status/2124326595078869376","l":[],"ln":[],"t":[],"lk":16,"rt":1,"rp":4,"vw":2376},{"id":"2124325512134983819","h":"dmjk001","ts":1795313644,"zh":"险资专家交流：减仓接近尾声\nQ：现在险资权益、固收配置大致是什么水平，这一轮减仓节奏和现状如何？\nA：头部保险公司权益配置比例大概在20%左右，做得激进的能接近30%，中小险企普遍落在15%上下，固收类资产占比处在50%到70%区间，国寿这类大体量公司集中在50%到60%，其余不少公司可以到70%。往年险资一般11、12月兑现年度收益，去年提前到10月底，今年更进一步，9月底就有大公司开始卖出。10月初到11月中旬大中型险企持续减仓，部分标的流动性不足只能走大宗交易，监管也提醒过相关机构收敛交易节奏，目前这一轮减仓动作基本结束，账面现金充裕，大家都在等待明确信号才会考虑补仓，暂时没有统一加仓动作。\nQ：险资权益仓位内部结构有差异吗，不同账户持仓风格有什么不一样？\nA：权益仓位内部的分化其实非常明显，不能只看整体权益比例去判断风险，以公允价值计量、波动直接冲击利润表的 TPL 也就是 FV­T­PL 账户，交易型股票持仓在快速收缩，这部分是愿意承担波动的资金，已经在持续变少。而用 OCI 计量的高股息资产，是这一轮行情里险资坚定持有的部分，相当于组合里面的压舱石，重心放在稳定收息上面。也就是说账面上看着还有两成左右权益仓位，但真正暴露在短期股价波动里的资金体量已经大幅缩水，很多外部投资者只看整体权益占比，很容易高估险资实际承担的权益波动风险。\nQ：为什么险资会集中清仓科技成长股，是不看好板块基本面吗？\nA：并不是机构对科技板块基本面观点发生转向，核心是险资内部一套刚性止损纪律在发挥作用，这是一个偏机械的风控机制。保险公司做权益投资大多设置回撤红线，常规的控制区间在20%到30%之间，一旦回撤超过30%，基本就要执行强制清仓，没有太多商量余地；如果投资经理坚持认为持仓值得保留，必须提交专项报告，最后由管理层审批拍板。今年4、5月不少险企选择加仓科技成长股，紧接着7、8月市场出现剧烈调整，很多持仓直接打穿止损线，触发一连串被动卖出，这类资金在下跌过程里没法接盘，反而持续砍仓，也是科技板块调整阶段很容易被忽略的资金面因素。\nQ：险资如果想重新布局科技股，是不是很快就能进场形成增量资金？\nA：短期很难指望险资重新成为科技成长板块的增量资金来源，风控流程和投资约束摆在前面。就算后续市场企稳，想要再度买入这类资产，首先要出现足够明确的企稳信号，同时还要重新走完内部完整的投资审批流程，不是市场稍微反弹就能直接买回。险资这套止损机制是硬性要求，经历过这一轮击穿止损线强制卖出之后，机构对于科技成长风格的风险偏好明显压低，在没有充分论证、走完内部决策流程之前，不会轻易恢复配置，所以不能简单预设科技反弹的时候险资会回来托底。\nQ：险资减仓的时候，会不会优先赎回委外公募，保留自营仓位？\nA：市场流传过一种说法，险资集中减仓阶段，会优先赎回公募委外产品，保住自营持仓，这个说法并不成立。自营盘和委外资金之间不存在赎回优先级，两边标准完全一视同仁，判断要不要卖出或者赎回，核心看标的本身业绩表现，以及距离内部止损线的远近，谁先触及风控条件、业绩不及预期，就优先处理谁，不会因为是自营就天然保留，也不会因为是外部委外就提前一刀切赎回，风控规则对两类资金统一适用。","en":"险资专家交流：减仓接近尾声\nQ：现在险资权益、固收配置大致是什么水平，这一轮减仓节奏和现状如何？\nA：头部保险公司权益配置比例大概在20%左右，做得激进的能接近30%，中小险企普遍落在15%上下，固收类资产占比处在50%到70%区间，国寿这类大体量公司集中在50%到60%，其余不少公司可以到70%。往年险资一般11、12月兑现年度收益，去年提前到10月底，今年更进一步，9月底就有大公司开始卖出。10月初到11月中旬大中型险企持续减仓，部分标的流动性不足只能走大宗交易，监管也提醒过相关机构收敛交易节奏，目前这一轮减仓动作基本结束，账面现金充裕，大家都在等待明确信号才会考虑补仓，暂时没有统一加仓动作。\nQ：险资权益仓位内部结构有差异吗，不同账户持仓风格有什么不一样？\nA：权益仓位内部的分化其实非常明显，不能只看整体权益比例去判断风险，以公允价值计量、波动直接冲击利润表的 TPL 也就是 FV­T­PL 账户，交易型股票持仓在快速收缩，这部分是愿意承担波动的资金，已经在持续变少。而用 OCI 计量的高股息资产，是这一轮行情里险资坚定持有的部分，相当于组合里面的压舱石，重心放在稳定收息上面。也就是说账面上看着还有两成左右权益仓位，但真正暴露在短期股价波动里的资金体量已经大幅缩水，很多外部投资者只看整体权益占比，很容易高估险资实际承担的权益波动风险。\nQ：为什么险资会集中清仓科技成长股，是不看好板块基本面吗？\nA：并不是机构对科技板块基本面观点发生转向，核心是险资内部一套刚性止损纪律在发挥作用，这是一个偏机械的风控机制。保险公司做权益投资大多设置回撤红线，常规的控制区间在20%到30%之间，一旦回撤超过30%，基本就要执行强制清仓，没有太多商量余地；如果投资经理坚持认为持仓值得保留，必须提交专项报告，最后由管理层审批拍板。今年4、5月不少险企选择加仓科技成长股，紧接着7、8月市场出现剧烈调整，很多持仓直接打穿止损线，触发一连串被动卖出，这类资金在下跌过程里没法接盘，反而持续砍仓，也是科技板块调整阶段很容易被忽略的资金面因素。\nQ：险资如果想重新布局科技股，是不是很快就能进场形成增量资金？\nA：短期很难指望险资重新成为科技成长板块的增量资金来源，风控流程和投资约束摆在前面。就算后续市场企稳，想要再度买入这类资产，首先要出现足够明确的企稳信号，同时还要重新走完内部完整的投资审批流程，不是市场稍微反弹就能直接买回。险资这套止损机制是硬性要求，经历过这一轮击穿止损线强制卖出之后，机构对于科技成长风格的风险偏好明显压低，在没有充分论证、走完内部决策流程之前，不会轻易恢复配置，所以不能简单预设科技反弹的时候险资会回来托底。\nQ：险资减仓的时候，会不会优先赎回委外公募，保留自营仓位？\nA：市场流传过一种说法，险资集中减仓阶段，会优先赎回公募委外产品，保住自营持仓，这个说法并不成立。自营盘和委外资金之间不存在赎回优先级，两边标准完全一视同仁，判断要不要卖出或者赎回，核心看标的本身业绩表现，以及距离内部止损线的远近，谁先触及风控条件、业绩不及预期，就优先处理谁，不会因为是自营就天然保留，也不会因为是外部委外就提前一刀切赎回，风控规则对两类资金统一适用。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2124325512134983819","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":0,"vw":658},{"id":"2124323690896851334","h":"bboczeng","ts":1795313210,"zh":"这怎么看都是利空。\n如果不是市场出现了重大危机，为什么要禁止卖空？\n而且，台湾股指其实也没跌多少，至少今年还是正的\n所 社的会计调查报道是本档相对早间最重要的增量。高盛称英伟达较10月6日高点回落近一半；穆迪展望调至稳定、美国对先进芯片远程使用收紧，早间已核实。Anthropic次日收88.30美元，较首日收盘97.17美元回吐，高盛交易台认为这次上市没能成为“风险重新打开”的清理事件。彭博社还称，新加坡数据中心商DayOne考虑搁置或缩小原计划最高约50亿美元的美国上市。对谁不利：A股CPO、光模块、封测、服务器代工，以及一切还在用“AI资本开支只会多不会少”定价的高位票。制约：盘后反弹说明有人在捡便宜，但反弹要先看美股周一能否站稳，而不是A股周五尾盘的银行。\n二、A股内部亏钱效应还在，交投热度的真实方向是降温而不是升温。周五上涨约313只、下跌约5236只，创业板跌3.54%，科创综指跌5.23%，指数被权重修好、多数股票没有被修好，这个判断不用改。新的是10月印花税和成交：当月全部A股成交27.37万亿元、日均1.61万亿元，同比下滑约25.5%，日均成交已连续四个月下滑；10月末两融余额2.34万亿元，同比下降6.02%、环比下降8.95%。对券商经纪和两融利息，这是四季度的压力，不是上半年高增的惯性。欢瑞世纪因2022年年报虚增利润，将于11月23日停牌、24日复牌并简称“ST欢瑞”，监管样本还在。制约：局部题材（PCB、算力租赁、农业）仍有板，但那是退潮期接力，不是广度修复。\n三、大宗商品和加密同步去杠杆，趋势策略还在卖。已核实：COMEX期铜当周跌9.91%，结算5.4770美元/磅；邮件把“纽铜跌近10%”写成周五当天，不准确，周五本身大约跌2%出头。WTI 12月合约周五结算83.98美元，当日小涨，但当周跌5.17%，连续第三周下跌；邮件里“全周跌约20%”或“三周大跌两成”不能直接当成当周跌幅。黄金周五大跌、比特币跌破5.7万美元、创2024年9月以来低点，CoinDesk在周六的报道里仍给出约56303美元附近的报价，并称过去24小时加密衍生品清算约24.0亿美元。这不是经典避险，而是杠杆出清。CTA的机械卖盘意味着，美股即便周一反弹，也可能继续碰到程序化减仓。对A股黄金、有色、外资敏感型成长股都偏负面。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"其中16家拟回购金额不低于1亿元。为什么重要：弱市里上市公司愿意拿出真金白银，说明部分产业资本认为价格已经有安全垫。制约：通威这一笔的用途首先是激励，不是立即注销增厚每股收益，邮件写成“注销式回购”不准确；光伏景气仍弱，回购托得住预期，托不住基本面继续下行。\n三大利空方向（由强到弱） 一、全球AI交易出清，又叠加上治理和会计层面的信任折扣。路透社的会计调查报道是本档相对早间最重要的增量。高盛称英伟达较10月6日高点回落近一半；穆迪展望调至稳定、美国对先进芯片远程使用收紧，早间已核实。Anthropic次日收88.30美元，较首日收盘97.17美元回吐，高盛交易台认为这次上市没能成为“风险重新打开”的清理事件。彭博社还称，新加坡数据中心商DayOne考虑搁置或缩小原计划最高约50亿美元的美国上市。对谁不利：A股CPO、光模块、封测、服务器代工，以及一切还在用“AI资本开支只会多不会少”定价的高位票。制约：盘后反弹说明有人在捡便宜，但反弹要先看美股周一能否站稳，而不是A股周五尾盘的银行。\n二、A股内部亏钱效应还在，交投热度的真实方向是降温而不是升温。周五上涨约313只、下跌约5236只，创业板跌3.54%，科创综指跌5.23%，指数被权重修好、多数股票没有被修好，这个判断不用改。新的是10月印花税和成交：当月全部A股成交27.37万亿元、日均1.61万亿元，同比下滑约25.5%，日均成交已连续四个月下滑；10月末两融余额2.34万亿元，同比下降6.02%、环比下降8.95%。对券商经纪和两融利息，这是四季度的压力，不是上半年高增的惯性。欢瑞世纪因2022年年报虚增利润，将于11月23日停牌、24日复牌并简称“ST欢瑞”，监管样本还在。制约：局部题材（PCB、算力租赁、农业）仍有板，但那是退潮期接力，不是广度修复。\n三、大宗商品和加密同步去杠杆，趋势策略还在卖。已核实：COMEX期铜当周跌9.91%，结算5.4770美元/磅；邮件把“纽铜跌近10%”写成周五当天，不准确，周五本身大约跌2%出头。WTI 12月合约周五结算83.98美元，当日小涨，但当周跌5.17%，连续第三周下跌；邮件里“全周跌约20%”或“三周大跌两成”不能直接当成当周跌幅。黄金周五大跌、比特币跌破5.7万美元、创2024年9月以来低点，CoinDesk在周六的报道里仍给出约56303美元附近的报价，并称过去24小时加密衍生品清算约24.0亿美元。这不是经典避险，而是杠杆出清。CTA的机械卖盘意味着，美股即便周一反弹，也可能继续碰到程序化减仓。对A股黄金、有色、外资敏感型成长股都偏负面。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124310999239204939","l":[],"ln":[],"t":["美股","A股港股","AI科技","黄金"],"lk":1,"rt":0,"rp":0,"vw":202},{"id":"2124310994298314939","h":"cnfinancewatch","ts":1795310183,"zh":"热点财经新闻综述｜2026-11-21·午间\n数据时点：A股、港股、日经225、韩国KOSPI与台股仍为11月20日（周五）收盘；美股为美东11月20日常规交易收盘，英伟达盘后补充至同日延长时段；黄金、原油、铜、比特币等补充至周五结算或周六白天可见的公开报价；本档截稿约北京时间11月21日13:40。今天是周六，沪深港休市，美股要到周一晚再开。本期新处理两封热点财经邮件：11月21日早间08:10版（位于垃圾邮件，早间档截稿时未到）与午间13:10版（收件箱）。凡标“邮件转述”的内容未逐条核实；与早间综述重复且已核实的收盘数字不再改写。早间与午间邮件里有几处把周跌写成日跌、把成交或周度净流入写成“一天抄底”，下文以公开报道为准。\n今日判断 对客户来说，午间需要补上的不是新的指数，而是两件会改变周一开盘权重的事。第一件，路透社周五报道，两名知情人士称美国证交会正在调查英伟达的会计处理；《华尔街日报》本周早些时候已报道存在调查，但当时未确认焦点。调查本身不等于认定违规，证交会和公司均未就细节置评。加州司法部对英伟达发出调查传票，是另一条线，不能和证交会会计调查写成同一件事。英伟达周五常规交易收跌14.01%报125.53美元，延长交易反弹至130.01美元，较收盘涨3.57%。邮件里“暗盘跌超7%”与公开盘后走势不符，本档不用。第二件，财政部1至10月证券交易印花税2511亿元、同比增长54.1%，早间综述把它当作国内交投仍活跃的背景；财联社今天上午拆出10月单月只有120亿元，同比下滑33.7%、环比减少48.05%，为年内最低、也是近两年次低，仅高于2025年6月的117亿元。累计高增和单月失速可以同时成立，但能解释周五量增价跌的，显然不是“印花税还在高增”这一句话。\n外部定价没有变轻。标普500跌3.70%报6910.39点，纳斯达克综合指数跌5.28%报22617.73点并转为年内下跌，道指跌1.93%报48147.33点，已在早间综述里核实。高盛交易台提到，纳指100周五跌5.6%、当周为2020年3月以来最差；费城半导体指数有口径称周五跌10.73%、当周跌17.13%，为2001年9月以来最差单周，芯片股市值有报道称一周蒸发约2.3万亿美元。高盛恐慌指数升至10分中的9分，估计商品交易顾问（CTA）过去一个月已卖出约570亿美元股票、美股净头寸转为净空约190亿美元；未来一周若市场平盘仍可能再卖约658亿美元，续跌则可达约806亿美元，即便反弹也可能卖出约286亿美元。与此同时，配置盘在指数层面确实在买：格隆汇援引的数据显示，周五ETF整体净流入899.25亿元，其中宽基型净流入923.63亿元，嘉实沪深300ETF净流入226.51亿元、华夏上证50ETF净流入215.83亿元、华泰柏瑞沪深300ETF净流入145.83亿元；每日经济新闻援引Wind数据，本周沪深股票型与跨境型ETF合计净流入1941.71亿元，其中宽基指数ETF净流入1896亿元，行业主题ETF净流出12.85亿元，沪深300相关净流入1024亿元。上证全周跌2.77%，深证全周跌6.49%。这是周度和当日的净申购，不是“近1900亿元在周五一天抄底成功”，更不能拿50ETF与300ETF的成交额相加当净买入。\n基调不变，只是更硬一点：防守优先。银行和红利仍然是唯一有价格互证的方向；科技硬件、封测和周五已经涨停的PCB票，周一要先消化美股收盘和会计调查的缺口，不适合当成周末作业去追。\n三大利多方向（由强到弱） 一、银行高股息，加上宽基ETF本周确实有净申购，仍是最清楚的防守框。已核实的周五收盘未变：工商银行涨3.30%收9.40元，建设银行涨3.07%，中国银行涨2.72%，按前复权计多只银行股收盘价创历史新高；工商银行A股市值约2.53万亿元，重夺市值第一。财政部11月19日在香港发行20亿美元三年期主权债，利率4.821%，总认购723亿美元，为发行额的36倍，将在香港联交所上市。为什么重要：外部风险升温时，高股息和宽基是资金愿意付钱的地方；主权债超额认购说明人民币信用仍有买盘，和银行股的防御逻辑同一方向。对谁有意义：已经拿着银行、保险、红利和宽基的组合，短期内仍是压舱石。制约：净申购是事实，但指数被买和个股被修不是一回事；尾盘拉得急，银行自己也可能变成波动源；主权债再热，也代替不了周一科技股的开盘价。\n二、PCB短缺的产业逻辑还在，但价格已经把周末情绪算进去了。全球电子协会供应链警报、短缺或至少持续至2027年上半年，早间已核实。周五中京电子、超声电子等涨停，属于逆势方向。为什么重要：供给约束对订单和价格的再定价，比单纯的情绪脉冲更站得住。制约：行业协会警报不是周一的护城河。英伟达会计调查落地后，凡是还在用“AI主线没坏”定价的环节，开盘都可能先被砸一下；已经涨停的中游制造票，赔率更差。可以把上游覆铜板、电子布、树脂当作观察名单，而不是把周五涨停股写成加仓清单。\n三、产业资本在用回购表态，但力度和结构都要看清楚。已核实：11月20日晚通威股份公告，拟以不超过17.20元/股、总金额不低于10亿元且不超过20亿元回购股份，用于员工持股或股权激励，期限6个月；收盘11.11元、跌2.46%。财联社统计，当日共有27家公司披露回购计划，","en":"热点财经新闻综述｜2026-11-21·午间\n数据时点：A股、港股、日经225、韩国KOSPI与台股仍为11月20日（周五）收盘；美股为美东11月20日常规交易收盘，英伟达盘后补充至同日延长时段；黄金、原油、铜、比特币等补充至周五结算或周六白天可见的公开报价；本档截稿约北京时间11月21日13:40。今天是周六，沪深港休市，美股要到周一晚再开。本期新处理两封热点财经邮件：11月21日早间08:10版（位于垃圾邮件，早间档截稿时未到）与午间13:10版（收件箱）。凡标“邮件转述”的内容未逐条核实；与早间综述重复且已核实的收盘数字不再改写。早间与午间邮件里有几处把周跌写成日跌、把成交或周度净流入写成“一天抄底”，下文以公开报道为准。\n今日判断 对客户来说，午间需要补上的不是新的指数，而是两件会改变周一开盘权重的事。第一件，路透社周五报道，两名知情人士称美国证交会正在调查英伟达的会计处理；《华尔街日报》本周早些时候已报道存在调查，但当时未确认焦点。调查本身不等于认定违规，证交会和公司均未就细节置评。加州司法部对英伟达发出调查传票，是另一条线，不能和证交会会计调查写成同一件事。英伟达周五常规交易收跌14.01%报125.53美元，延长交易反弹至130.01美元，较收盘涨3.57%。邮件里“暗盘跌超7%”与公开盘后走势不符，本档不用。第二件，财政部1至10月证券交易印花税2511亿元、同比增长54.1%，早间综述把它当作国内交投仍活跃的背景；财联社今天上午拆出10月单月只有120亿元，同比下滑33.7%、环比减少48.05%，为年内最低、也是近两年次低，仅高于2025年6月的117亿元。累计高增和单月失速可以同时成立，但能解释周五量增价跌的，显然不是“印花税还在高增”这一句话。\n外部定价没有变轻。标普500跌3.70%报6910.39点，纳斯达克综合指数跌5.28%报22617.73点并转为年内下跌，道指跌1.93%报48147.33点，已在早间综述里核实。高盛交易台提到，纳指100周五跌5.6%、当周为2020年3月以来最差；费城半导体指数有口径称周五跌10.73%、当周跌17.13%，为2001年9月以来最差单周，芯片股市值有报道称一周蒸发约2.3万亿美元。高盛恐慌指数升至10分中的9分，估计商品交易顾问（CTA）过去一个月已卖出约570亿美元股票、美股净头寸转为净空约190亿美元；未来一周若市场平盘仍可能再卖约658亿美元，续跌则可达约806亿美元，即便反弹也可能卖出约286亿美元。与此同时，配置盘在指数层面确实在买：格隆汇援引的数据显示，周五ETF整体净流入899.25亿元，其中宽基型净流入923.63亿元，嘉实沪深300ETF净流入226.51亿元、华夏上证50ETF净流入215.83亿元、华泰柏瑞沪深300ETF净流入145.83亿元；每日经济新闻援引Wind数据，本周沪深股票型与跨境型ETF合计净流入1941.71亿元，其中宽基指数ETF净流入1896亿元，行业主题ETF净流出12.85亿元，沪深300相关净流入1024亿元。上证全周跌2.77%，深证全周跌6.49%。这是周度和当日的净申购，不是“近1900亿元在周五一天抄底成功”，更不能拿50ETF与300ETF的成交额相加当净买入。\n基调不变，只是更硬一点：防守优先。银行和红利仍然是唯一有价格互证的方向；科技硬件、封测和周五已经涨停的PCB票，周一要先消化美股收盘和会计调查的缺口，不适合当成周末作业去追。\n三大利多方向（由强到弱） 一、银行高股息，加上宽基ETF本周确实有净申购，仍是最清楚的防守框。已核实的周五收盘未变：工商银行涨3.30%收9.40元，建设银行涨3.07%，中国银行涨2.72%，按前复权计多只银行股收盘价创历史新高；工商银行A股市值约2.53万亿元，重夺市值第一。财政部11月19日在香港发行20亿美元三年期主权债，利率4.821%，总认购723亿美元，为发行额的36倍，将在香港联交所上市。为什么重要：外部风险升温时，高股息和宽基是资金愿意付钱的地方；主权债超额认购说明人民币信用仍有买盘，和银行股的防御逻辑同一方向。对谁有意义：已经拿着银行、保险、红利和宽基的组合，短期内仍是压舱石。制约：净申购是事实，但指数被买和个股被修不是一回事；尾盘拉得急，银行自己也可能变成波动源；主权债再热，也代替不了周一科技股的开盘价。\n二、PCB短缺的产业逻辑还在，但价格已经把周末情绪算进去了。全球电子协会供应链警报、短缺或至少持续至2027年上半年，早间已核实。周五中京电子、超声电子等涨停，属于逆势方向。为什么重要：供给约束对订单和价格的再定价，比单纯的情绪脉冲更站得住。制约：行业协会警报不是周一的护城河。英伟达会计调查落地后，凡是还在用“AI主线没坏”定价的环节，开盘都可能先被砸一下；已经涨停的中游制造票，赔率更差。可以把上游覆铜板、电子布、树脂当作观察名单，而不是把周五涨停股写成加仓清单。\n三、产业资本在用回购表态，但力度和结构都要看清楚。已核实：11月20日晚通威股份公告，拟以不超过17.20元/股、总金额不低于10亿元且不超过20亿元回购股份，用于员工持股或股权激励，期限6个月；收盘11.11元、跌2.46%。财联社统计，当日共有27家公司披露回购计划，","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124310994298314939","l":[],"ln":[],"t":["美股","A股港股","汇率","原油能源","AI科技","黄金"],"lk":2,"rt":0,"rp":2,"vw":637},{"id":"2124310775607242865","h":"cnfinancewatch","ts":1795310131,"zh":"散户热议｜2026-11-22·早间\n数据时点：国内社区浏览截至北京时间11月22日08:00。本期直接打开了韭研公社“公社广场-最新发布”列表，引用公开可见的标题、时间和摘要；部分长文需登录或只展示节选，未能全文引用。Reddit WallStreetBets与Stocktwits留言流仍未能直接抓取。海外部分改用AltIndex对WSB过去24小时的提及统计（页面显示更新至美西11月21日15:30，约北京时间22日07:30），均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周末仍在复盘冰点，避雷帖和涨停清单还搁在同一页\n韭研公社广场上，周六夜间到周日凌晨仍在写11月20日。有人把情绪周期写成“退潮末期/冰点延续”，依据是跌停多于涨停、连续第七个交易日超4100只个股下跌、连板高度只有4板且梯队收缩。有人给出与交易所口径接近的数字：涨停28家、跌停58家、成交约1.42万亿元、最高4板。也有帖把上涨家数写成297或311、跌停写成77，和此前已核实的上涨约313、下跌约5236并不完全一致，本档仍以公开收盘统计为准，社区数字只说明讨论在围绕同一张普跌图。\n更私人的周末复盘，语气比周五盘中更沉。有帖写道“连续7天盘中拉高、午后下杀，连续5天翘尾”，把周线支撑放到3403附近、月线支撑放到3488附近，并说“7连跌，不理解，但接受”。这类技术位置是社区推测，不是已被行情验证的底部。还有人把计划写成“周末看看有没有消息发酵”，并把真视通与盛剑科技的4板争夺、超声电子和满坤科技等PCB小票的尾盘拉升，当成短线还活着的证据。\n和周六午间相同的分裂没有消失。11月21日08:55那篇“英伟达单日暴跌-14%，避雷英伟达产业链（全景梳理）”仍在被评论：有人说“以前都是香饽饽，现在反转了”，有人把避雷帖本身当成终于说实话。但广场上的复盘仍在点名中京电子、真视通、中芯国际，PCB和算力租赁并没有从讨论里撤走。和券商口径相比，方向并不反：专业框架也承认银行红利是防守框、PCB有产业逻辑，但强调涨停价已经计入周末情绪。社区的斜率更陡，而且“避雷”和“还看消息发酵”同时出现，说明并没有形成一致的风险收敛。\n被忽略的风险有三。一是把周末出现的甲骨文融资声明、比特币重回6万美元、油轮遇袭后的油价传闻，直接读成周一可以加仓科技的理由。这些消息会进入开盘定价，但不等于出清结束。二是继续把宽基ETF净申购或“近490亿抄底”当成多数股票已经被修好。三是4连板的真视通、盛剑科技，以及任何还在被写成清单的周五涨停票，周一要先过会计调查、美股收盘和台股稳定措施带来的缺口。欢瑞世纪周一停牌、周二戴ST，监管样本还在。\n海外：英伟达仍是第一话题，但24小时提及量已经从峰值回落，中性标签还在\nWallStreetBets方面（AltIndex统计，二手）：页面最后更新为美西11月21日15:30，约北京时间22日07:30。过去24小时提及最多的仍是英伟达，约1133次，情绪标中性，价格与公开收盘125.53美元、跌14.01%相符。较之周六午间那帧美西11月20日21:15的约1993次，提及量明显回落，这更像是周五讨论滑出24小时窗口，不能写成“关注度已经崩塌”。Anthropic约654次（周六午间约1202次），同样标中性，页面报价约88.96美元、跌8.5%，与公开报道的收盘88.30美元接近。其后是谷歌约202次、标看多；苹果、SpaceX、Meta等也在榜上。最看多的标签出现在谷歌，最看空的是沃尔玛（约42次），不是芯片股本身。AMD、闪迪等仍在榜上并标看多，本档只记关注度和情绪标签，不引用其未核验的价格涨跌。甲骨文约38次、标中性，说明融资声明还没有把讨论从英伟达那里抢过来。\nStocktwits方面：实时留言流仍未打开，本档不引用无法核验的情绪分数或“极度看多”一类二手概括。\n与券商口径的异同：专业框架把重点放在AI出清叠加会计调查、台股已动用稳定措施、周末反弹还要过周一开盘；散户讨论的对象没变，还是英伟达和Anthropic，二手统计给出的仍是“中性”。提及次数随窗口滑动下降，但排名没有让位。被忽略的风险是：中性标签在跌14%之后，更可能对应有人还想接飞刀，而不是情绪已经出清完毕。会计调查、承销商撤出稳定仓位、台股稳定措施，不一定会马上改写过去24小时的情绪统计，却会进入周一的开盘价。\n小结：国内散户把周末花在复盘冰点和等待消息，避雷帖和涨停清单仍在同一页；海外散户没有离开英伟达，也没有形成一致看空。两边共同的风险，都是把周五已经涨停或周末已经反弹的价格，当成周日晚上可以加仓的理由。\n风险提示：以上为公开讨论整理，二手口径已标注，不构成投资建议。","en":"散户热议｜2026-11-22·早间\n数据时点：国内社区浏览截至北京时间11月22日08:00。本期直接打开了韭研公社“公社广场-最新发布”列表，引用公开可见的标题、时间和摘要；部分长文需登录或只展示节选，未能全文引用。Reddit WallStreetBets与Stocktwits留言流仍未能直接抓取。海外部分改用AltIndex对WSB过去24小时的提及统计（页面显示更新至美西11月21日15:30，约北京时间22日07:30），均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周末仍在复盘冰点，避雷帖和涨停清单还搁在同一页\n韭研公社广场上，周六夜间到周日凌晨仍在写11月20日。有人把情绪周期写成“退潮末期/冰点延续”，依据是跌停多于涨停、连续第七个交易日超4100只个股下跌、连板高度只有4板且梯队收缩。有人给出与交易所口径接近的数字：涨停28家、跌停58家、成交约1.42万亿元、最高4板。也有帖把上涨家数写成297或311、跌停写成77，和此前已核实的上涨约313、下跌约5236并不完全一致，本档仍以公开收盘统计为准，社区数字只说明讨论在围绕同一张普跌图。\n更私人的周末复盘，语气比周五盘中更沉。有帖写道“连续7天盘中拉高、午后下杀，连续5天翘尾”，把周线支撑放到3403附近、月线支撑放到3488附近，并说“7连跌，不理解，但接受”。这类技术位置是社区推测，不是已被行情验证的底部。还有人把计划写成“周末看看有没有消息发酵”，并把真视通与盛剑科技的4板争夺、超声电子和满坤科技等PCB小票的尾盘拉升，当成短线还活着的证据。\n和周六午间相同的分裂没有消失。11月21日08:55那篇“英伟达单日暴跌-14%，避雷英伟达产业链（全景梳理）”仍在被评论：有人说“以前都是香饽饽，现在反转了”，有人把避雷帖本身当成终于说实话。但广场上的复盘仍在点名中京电子、真视通、中芯国际，PCB和算力租赁并没有从讨论里撤走。和券商口径相比，方向并不反：专业框架也承认银行红利是防守框、PCB有产业逻辑，但强调涨停价已经计入周末情绪。社区的斜率更陡，而且“避雷”和“还看消息发酵”同时出现，说明并没有形成一致的风险收敛。\n被忽略的风险有三。一是把周末出现的甲骨文融资声明、比特币重回6万美元、油轮遇袭后的油价传闻，直接读成周 三点起来买的案例如下：\n😅😅😅","en":"凌晨三点起来买的案例如下：\n😅😅😅","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXsDFKFaQAAH6C4.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2124295087194882460","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":268},{"id":"2124294982957940979","h":"bboczeng","ts":1795306366,"zh":"其实我发现一个很有意思的悖论：\n如果你靠从自媒体为生，那么你基本上没有办法躲过股灾\n因为像我这样5个月前清仓的人，这五个月以来几乎没有什么可以更新的素材，因为我也不炒个股了，全仓SGOV，账户一根直线，不骂我就不错了，不论说什么也不会有人看的\n除了每天问我SGOV股价不变到底怎么领利息，现在是不是可以抄底之外，群里一片寂静，粉丝数也直线下滑，这对自媒体行业来说简直是灾难\n但其实，也只有我这样不在乎粉丝数的人，才能真正躲过股灾\n至于说老李玩钱，Herman Jin这样，为了自己的粉丝热度不得不永远留在股市，甚至早上3am起来买入，以及就是靠粉丝经济为生的人\n他们肯定不可能提前清仓，即便看到风险，也不可能和我一样，提前全部转换成VOO+SGOV：\n毕竟，大家看他们就是为了找到“不一样 ”的alpha，如果连这群人都回归到长期投资去了，那大家还看什么呢？\n时至今日，他们也只能用会员与广告费，弥补自己这段时间投资的损失了\n更有甚者，还有人因为账户亏钱而提高会员费\n这就引出了一个悖论：\n你到底是“股市的产品”，那是“用股市这款产品赚钱的人”？\n你到底是在这里投资，还是把投资作为表演和创收的工具？\n鱼和熊掌不可兼得，这么在乎表演效果，\n迟早会被反噬","en":"其实我发现一个很有意思的悖论：\n如果你靠从自媒体为生，那么你基本上没有办法躲过股灾\n因为像我这样5个月前清仓的人，这五个月以来几乎没有什么可以更新的素材，因为我也不炒个股了，全仓SGOV，账户一根直线，不骂我就不错了，不论说什么也不会有人看的\n除了每天问我SGOV股价不变到底怎么领利息，现在是不是可以抄底之外，群里一片寂静，粉丝数也直线下滑，这对自媒体行业来说简直是灾难\n但其实，也只有我这样不在乎粉丝数的人，才能真正躲过股灾\n至于说老李玩钱，Herman Jin这样，为了自己的粉丝热度不得不永远留在股市，甚至早上3am起来买入，以及就是靠粉丝经济为生的人\n他们肯定不可能提前清仓，即便看到风险，也不可能和我一样，提前全部转换成VOO+SGOV：\n毕竟，大家看他们就是为了找到“不一样 ”的alpha，如果连这群人都回归到长期投资去了，那大家还看什么呢？\n时至今日，他们也只能用会员与广告费，弥补自己这段时间投资的损失了\n更有甚者，还有人因为账户亏钱而提高会员费\n这就引出了一个悖论：\n你到底是“股市的产品”，那是“用股市这款产品赚钱的人”？\n你到底是在这里投资，还是把投资作为表演和创收的工具？\n鱼和熊掌不可兼得，这么在乎表演效果，\n迟早会被反噬","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124294982957940979","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":2,"vw":576},{"id":"2124292843728707607","h":"bboczeng","ts":1795305856,"zh":"视频的水平非常高，看得出来是经历了人生宝贵淬炼的沉淀，得出的肺腑之言\n推特上很多所谓KOL，特别是年轻赌博KOL们，根本不可能有这样的觉悟\n不过，你提倡让普通人每天记录自己的操作，那就大可不必了\n每天写日记基本全都是噪音，Youtube的那些博主喜欢搞这些东西\n每周能反省一次就不错了\n而且，所谓图形学，他的本质就是美股几何学。我相信拥有一定投资经验的人都会殊途同归\n虽然我比你小一点，但很荣幸我们殊途同归了\n但，你的Youtube粉丝热度为什么不如大散户老李玩钱呢？\n这是我们每个人都要深刻反思的问题\n🥲🥲🥲","en":"视频的水平非常高，看得出来是经历了人生宝贵淬炼的沉淀，得出的肺腑之言\n推特上很多所谓KOL，特别是年轻赌博KOL们，根本不可能有这样的觉悟\n不过，你提倡让普通人每天记录自己的操作，那就大可不必了\n每天写日记基本全都是噪音 如果你靠从自媒体为生，那么你基本上没有办法躲过股灾\n因为像我这样5个月前清仓的人，这五个月以来几乎没有什么可以更新的素材，因为我也不炒个股了，全仓SGOV，账户一根直线，不骂我就不错了，不论说什么也不会有人看的\n除了每天问我SGOV股价不变到底怎么领利息，现在是不是可以抄底之外，群里一片寂静，粉丝数也直线下滑，这对自媒体行业来说简直是灾难\n但其实，也只有我这样不在乎粉丝数的人，才能真正躲过股灾\n至于说老李玩钱，Herman Jin这样，为了自己的粉丝热度不得不永远留在股市，甚至早上3am起来买入，甚至就是靠粉丝为生的人\n他们肯定不可能提前清仓，即便看到风险，也不可能和我一样，提前全部转换成VOO+SGOV：\n毕竟大家看他们就是为了找到“不一样 ”的alpha，\n如果连这群人都回归到长期投资的终点去了，那大家还看什么呢？\n时至今日，他们也只能用会员与广告费，弥补自己这段时间投资的损失了\n更有甚者，还有人因为亏钱而提高会员费\n这就引出了一个悖论：\n你到底是“股市的产品”，那是“用股市这款产品赚钱的人”？\n你到底是在这里投资，还是把投资作为表演和创收的工具？\n鱼和熊掌不可兼得，这么在乎表演效果，\n迟早会被反噬。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124287372280111351","l":[],"ln":[],"t":[],"lk":5,"rt":1,"rp":2,"vw":639},{"id":"2124284690723192844","h":"bboczeng","ts":1795303912,"zh":"卧槽，原来在Robinhood上做空有分红的公司，到期这笔分红要让你付？","en":"卧槽，原来在Robinhood上做空有分红的公司，到期这笔分红要让你付？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124284690723192844","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":666},{"id":"2124283241951801577","h":"Balder13946731","ts":1795303566,"zh":"马斯克从没有担忧购买这些硬件会不会亏钱，唯一的问题是如何让这些硬件全部跑起来","en":"马斯克从没有担忧购买这些硬件会不会亏钱，唯一的问题是如何让这些硬件全部跑起来","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2124283241951801577","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":260},{"id":"2124280327485141403","h":"bboczeng","ts":1795302871,"zh":"直播你破产亏90%就会有人看了\n老李曾经在2021年股灾后被骂的退网\n不知道这次会不会重蹈覆辙\n真正靠自己投资，或者上班养家的人不会在乎有多少粉丝\n在乎粉丝订阅的人，说明他们投资的钱基本等于订阅费\n需要订阅费续命，比如老李玩钱\n他的本职工作是媒体，而不是投资\n天天把自己的投资账户亮出来给别人看，借此证明对错的\n很容易会被反噬，影响自己的策略\n正经人根本没人这么干\n除非他原本就是个玩票的\n🥲🥲🥲","en":"直播你破产亏90%就会有人看了\n老李曾经在2021年股灾后被骂的退网\n不知道这次会不会重蹈覆辙\n真正靠自己投资，或者上班养家的人不会在乎有多少粉丝\n在乎粉丝订阅的人，说明他们投资的钱基本等于订阅费\n需要订阅费续命，比如老李玩钱\n他的本职工作是媒体，而不是投资\n天天把自己的投资账户亮出来给别人看，借此证明对错的\n很容易会被反噬，影响自己的策略\n正经人根本没人这么干\n除非他原本就是个玩票的\n🥲🥲🥲","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124280327485141403","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":2,"vw":487},{"id":"2124275257662202176","h":"Balder13946731","ts":1795301663,"zh":"这轮AI行情里，最没吃到肉的可能 或者过去被政府和国会高强度调查，一样涉华，一样有国家安全问题，马斯克甚至直到现在，他自己本人没有 $Spcx 国安项目的最高级别权限。\n没错，马斯克本人不能访问Starshield的部分核心机密细节，在许多情况下也无权知晓 SpaceX 火箭所搭载的军方机密载荷究竟是什么，甚至不被允许进入 SpaceX 内部专门处理高度机密项目的隔离设施。 \n你们看马斯克最近做了什么？\n他火速与 MAGA 切割，公开表示砸重金介入选举“很愚蠢”。面对民主党翻盘拿下大本营德州州长，他在 DealBook 峰会上甚至主动放软身段，表态预期曾反对 SpaceX 购地的新州长 Gina Hinojosa 会温和执政，“德州不会有事”。\n即便如此，民主党参议员 Ruben Gallego 还是在 X 上直接回：“你照样会收到传票”。\n马斯克不是软骨头，他在拜登政府时期对民主党是非常硬刚的。\n他180 度转弯，一边是国会传票与大本营变天的现实压力，一边是汹涌的反 AI、反硅谷民意。\n你们猜，他看到了什么？\n他显然不想成为下一个典型。","en":"1. @grok 请查证我的民调数字是否真实\n2. 跟那些喷我的说一句，因为我不想引用他们任何一条评论：你做任何投资都不能去忽视当地的政治，美国当前的政治斗争形势已经是中期选举后两个礼拜内，全球第一大市值公司创始人滚蛋的程度。\n和黄仁勋处境最相似的人就是马斯克，他们一样现在或者过去被政府和国会高强度调查，一样涉华，一样有国家安全问题，马斯克甚至直到现在，他自己本人没有 $Spcx 国安项目的最高级别权限。\n没错，马斯克本人不能访问Starshield的部分核心机密细节，在许多情况下也无权知晓 SpaceX 火箭所搭载的军方机密载荷究竟是什么，甚至不被允许进入 SpaceX 内部专门处理高度机密项目的隔离设施。 \n你们看马斯克最近做了什么？\n他火速与 MAGA 切割，公开表示砸重金介入选举“很愚蠢”。面对民主党翻盘拿下大本营德州州长，他在 DealBook 峰会上甚至主动放软身段，表态预期曾反对 SpaceX 购地的新州长 Gina Hinojosa 会温和执政，“德州不会有事”。\n即便如此，民主党参议员 Ruben Gallego 还是在 X 上直接回：“你照样会收到传票”。\n马斯克不是软骨头，他在拜登政府时期对民主党是非常硬刚的。\n他180 度转弯，一边是国会传票与大本营变天的现实压力，一边是汹涌的反 AI、反硅谷民意。\n你们猜，他看到了什么？\n他显然不想成为下一个典型。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2124227498938434012","l":[],"ln":[],"t":["AI科技"],"lk":4,"rt":1,"rp":2,"vw":839},{"id":"2124204129459577167","h":"Brand","ts":1795284704,"zh":"埃隆·马斯克在上海跳舞。是的，这是真的。传统的公关顾问可能会称之为一场灾难。动作僵硬、笨拙，甚至有点可笑。然而，这段视频成为马斯克最值得分享的时刻之一。为什么马斯克能把尴尬的时刻变成品牌资产，而黄仁勋精心打磨的形象却可能更容易受到伤害？ 在人工智能创造的抛光时代，可见的缺陷可以让创始人感觉更人性化。从这个意义上说，马斯克的品牌是反脆弱的：那些会让其他首席执行官难堪的时刻，却能强化人们已经发现的他的吸引力。他的声誉还涉及汽车、火箭、人工智能等领域，因此一项业务的挫折对他的定义意义不大。 BrandLLM， 的一部分。 com 认为，黄的品牌与 Nvidia 的主导地位以及他作为不知疲倦、沉着的领导者的形象有着更紧密的联系。这种组合效果非常好。这也意味着英伟达的挫折可能会让他的个人品牌同时面临压力。 对于创始人来说，教训很简单。建立一个你在台下也能达到的公众形象。在一个任何人都可以拍摄你的世界里，尴尬的时刻很容易被原谅。看起来很假更难恢复。","en":"Elon Musk dancing in Shanghai. Yes, it’s real. A traditional PR adviser would probably call it a disaster. The moves were stiff, awkward, and a little ridiculous. Yet the clip became one of Musk’s most shareable moments. Why can Musk turn an awkward moment into a brand asset, while Jensen Huang’s carefully polished image may be more vulnerable?\nIn an age of AI-generated polish, visible imperfections can make a founder feel more human. Musk’s brand is antifragile in that sense: moments that would embarrass other CEOs can reinforce what people already find compelling about him. His reputation also spans cars, rockets, AI, and more, so a setback in one business has less power to define him.\nBrandLLM, part of sees Huang’s brand as more tightly tied to Nvidia’s dominance and his image as a tireless, composed leader. That combination has worked remarkably well. It also means a setback at Nvidia can put his personal brand under pressure at the same time.\nFor founders, the lesson is simple. Build a public image you can live up to offstage. In a world where anyone can film you, an awkward moment is easy to forgive. Looking fake is harder to come back from.","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2124203959644557312/vid/avc1/1320x662/L2WISKiZXIBxi0Wk.mp4?tag=29"],"u":"https://x.com/Brand/status/2124204129459577167","l":["Brand.com"],"ln":[{"u":"http://Brand.com","d":"Brand.com"}],"t":["AI科技"],"lk":12,"rt":4,"rp":0,"vw":4827},{"id":"2124194844260368431","h":"maojietrading","ts":1795282491,"zh":"BTCUSD比特币这两年的点位没变过，跌破64k重心点位将去5.8w测试，周一我们继续重申，本周末果真去拉。\n目前暂时拉回，理论上算是交代了，如果接下来不再去5.8w则这轮也就到这里，如果再次测试超过两次以上就比较危险了，跌破概率要变大很多，这也将导致对目标价和27年全年走势的变更","en":"BTCUSD比特币这两年的点位没变过，跌破64k重心点位将去5.8w测试，周一我们继续重申，本周末果真去拉。\n目前暂时拉回，理论上算是交代了，如果接下来不再去5.8w则这轮也就到这里，如果再次测试超过两次以上就比较危险了，跌破概率要变大很多，这也将导致对目标价和27年全年走势的变更","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXqn9AEXoAAubPu.jpg?name=orig"],"u":"https://x.com/maojietrading/status/2124194844260368431","l":[],"ln":[],"t":[],"lk":15,"rt":0,"rp":2,"vw":1812},{"id":"2124194358572298546","h":"darrencao2024","ts":1795282375,"zh":"Zeta 26以下， Oscr 22以下，的确是长期很好的买点位置。","en":"Zeta 26以下， Oscr 22以下，的确是长期很好的买点位置。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/ "],"ln":[{"u":"https://youtu.be/zUtViPMFUpM?si=HAZN4OX8rQvlN0QC","d":"youtu.be"}],"t":["美股"],"lk":6,"rt":1,"rp":0,"vw":730},{"id":"2124150724284285321","h":"qinbafrank","ts":1795271972,"zh":"中期选举惨败引发的市场崩塌，昨晚美股大跌纳指已经把今年全年涨幅跌没了从最高点下来跌了-19%多、大饼更是跌破6万点，算是真正意义上市场崩了。个人角度11月5号纳指一根大阴线以来这一波大跌核心原因就是共和党中期选举惨败导致美国政治生态变化以及一系列连锁反应引发市场对于产业政策和党争的激烈定价。上周在“倒黄“事件梳理\n1、共和党的惨败程度\n都知道这次中选共和党惨败，但是惨败到什么程度呢？\n1）共和党参议院丢掉9个席位，导致民主党拿下56个参议员席位、这是民主党自1958年以来最大参议院净增席数。这也导致了虽然民主党不是绝对多数，但是争取几个共和党中间派和建制派议员实现60票以上的可能性大大增加。\n2）众议院全国普选票差距，\n众议院选举民主党约56%，共和党约42%，差距约14%，这是1974年水门事件以来最大的中期选举普选票优势，也是近50年最大差距。\n3）深红州被翻盘\n得克萨斯：参议院和州长双翻盘（州长是1990年代以来民主党首次）。\n堪萨斯参议院：1932年以来首次民主党胜利。\n南卡罗来纳、密西西比、爱荷华、俄亥俄等也出现翻盘，这已经不是边缘波动，而是广泛支持流失。\n4）州一级\n（1）民主党净增约6个州长席（包括佐治亚、爱荷华、内华达、俄亥俄、得克萨斯、阿拉斯加等），民主党获得多数州长席位（约30-20）。\n（2）多个议院翻盘，民主党新增多个“三权合一”（州长+两院）\n共和党几乎没有成功翻转任何民主党控制的参议院席位\n本次中期选举投票率约49%，民，是1914年以来第二高中期投票率（仅次于2018年）。即使共和党进行了中期重划选区、也遭遇了大败。\n两院失守且席位被大幅拉开、14点普选票优势 、深层红州翻盘 、州长与州议会大面积失利，这些都指向了这是近几十年最严重一次中期选举失败。选举结果刚出来的时候，我是远远低估这次失败的严重程度，以及惨败之后的一系列连锁反应。\n2、惨败的连锁反应\n1）最直接的就是川普在共和党的威信与影响力被极大的削弱\n之前川普可以依靠自己的威望和影响力，死死压住党内的不同意见，其他声音都不能完全冒头。但这次惨败趟则让川普的影响力大打折扣，通胀民生和AI发展数据中心建设潮的负面声音就被放大，因为这是惨败的直接原因、因为都败成这样了、川普也不能不承认。\n之前共和党内的政治人物都需要川普背书，但现在的问题是背书效应已经大打折扣、24年川普背书的议员赢得大选概率是89%，现在已经不到50%，川普背书已经不是助力而是阻力了，那么共和党内持不同主张的政治人物都开始活跃并强硬起来。\n2）“倒黄”事件就是川普威望和影响力被削弱的直接连锁反应之一。\n现在大家都清楚，这次“倒黄”主力不是民主党，而是共和党内对华强硬派，卢比奥、贝森特还有共和党国会几个委员会主席。之前他们可都不敢忤逆川普的意愿，但是这次即使川普再三帮助老黄发声，但效果甚微。\n老黄离开市场自然对英伟达的未来很悲观、技术迭代速度可能放缓、产业生态支持力度也会大幅减弱。这些都让担忧一步步加强\n3）产业政策的大逆转\n民主党不仅大幅度领先优势拿下国会多数席位、现在还有三十个州长位子，那么市场就会但心川普过去两年积极推动的AI和加密的产业政策会被逆转：\nAI监管会更加严格、AI基建会大幅放缓；\n加密立法几无可能、加密清算更加猛烈；\n这种预期的改变，对无论是对冲基金和长线资金信心的影响和动摇是巨大的，所以我们看到的没顾上对冲基金在大幅度砍仓，然后长线资金也是不断减持仓位。\n币市则表现为中期选举后比特币ETF连日大额净流出、稳定币发行量持续下降。\n4）然后就是美联储官员的激进表态\n你看川普影响力一被削弱、FOMC票委们的表态就大胆起来，这里典型就是沃勒、之前还算是鸽派、现在已经完全转变成了强鹰派，连12月50个基点的加息论调都提出来了，多名票委的鹰派发言，自然也让市场对12月以及明年初的利率走势更加悲观。\n当然核心也是现在美伊博弈在中期选举还没有明确的说法，市场也很担心通胀的走势。\n可以看到“倒黄”事件，产业政策被逆转的担忧、联储官员的鹰派很大程度上都是这次中选共和党惨败带来的连锁反应，一系列悲观情景下资金也是连锁踩踏，最后也止不住连锁出清，是市场大跌底层逻辑。\n3、接下来怎么看？\n看配图2，也是周三在币安广场AMA里聊到的三个变量：\n1）油价/通胀走势决定联储利率走向；\n2）新政治生态下AI政策比当下市场预期的要更收紧和会略缓和些；\n3）AI商业化是不是继续处于加速状态；\n当然从个人角度核心是前两者、第三点当下看还是处于加速之中。\n从另一个角度看市场一方面是对产业政策逆转和党争做悲观的定价、另一方面也是“死给你看”倒逼两党表态、特别是民主党到底要对AI政策逆转到什么程度？资金看不清、只能做悲观定价但说最悲观还要再看\nCNN恐慌贪婪指数已经9极度恐慌但离去年关税战3的过去五年最恐慌极值还有一点距离\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"中期选举惨败引发的市场崩塌，昨晚美股大跌纳指已经把今年全年涨幅跌没了从最高点下来跌了-19%多、大饼更是跌破6万点，算是真正意义上市场崩了。个人角度11月5号纳指一根大阴线以来这一波大跌核心原因就是共和党中期选举惨败导致美国政治生态变化以及一系列连锁反应引发市场对于产业政策和党争的激烈定价。上周在“倒黄“事件梳理\n1、共和党的惨败程度\n都知道这次中选共和党惨败，但是惨败到什么程度呢？\n1）共和党参议院丢掉9个席位，导致民主党拿下56个参议员席位、这是民主党自1958年以来最大参议院净增席数。这也导致了虽然民主党不是绝对多数，但是争取几个共和党中间派和建制派议员实现60票以上的可能性大大增加。\n2）众议院全国普选票差距，\n众议院选举民主党约56%，共和党约42%，差距约14%，这是1974年水门事件以来最大的中期选举普选票优势，也是近50年最大差距。\n3）深红州被翻盘\n得克萨斯：参议院和州长双翻盘（州长是1990年代以来民主党首次）。\n堪萨斯参议院：1932年以来首次民主党胜利。\n南卡罗来纳、密西西比、爱荷华、俄亥俄等也出现翻盘，这已经不是边缘波动，而是广泛支持流失。\n4）州一级\n（1）民主党净增约6个州长席（包括佐治亚、爱荷华、内华达、俄亥俄、得克萨斯、阿拉斯加等），民主党获得多数州长席位（约30-20）。\n（2）多个议院翻盘，民主党新增多个“三权合一”（州长+两院）\n共和党几乎没有成功翻转任何民主党控制的参议院席位\n本次中期选举投票率约49%，民，是1914年以来第二高中期投票率（仅次于2018年）。即使共和党进行了中期重划选区、也遭遇了大败。\n两院失守且席位被大幅拉开、14点普选票优势 、深层红州翻盘 、州长与州议会大面积失利，这些都指向了这是近几十年最严重一次中期选举失败。选举结果刚出来的时候，我是远远低估这次失败的严重程度，以及惨败之后的一系列连锁反应。\n2、惨败的连锁反应\n1）最直接的就是川普在共和党的威信与影响力被极大的削弱\n之前川普可以依靠自己的威望和影响力，死死压住党内的不同意见，其他声音都不能完全冒头。但这次惨败趟则让川普的影响力大打折扣，通胀民生和AI发展数据中心建设潮的负面声音就被放大，因为这是惨败的直接原因、因为都败成这样了、川普也不能不承认。\n之前共和党内的政治人物都需要川普背书，但现在的问题是背书效应已经大打折扣、24年川普背书的议员赢得大选概率是89%，现在已经不到50%，川普背书已经不是助力而是阻力了，那么共和党内持不同主张的政治人物都开始活跃并强硬起来。\n2）“倒黄”事件就是川普威望和影响力被削弱的直接连锁反应之一。\n现在大家都清楚，这次“倒黄”主力不是民主党，而是共和党内对华强硬派，卢比奥、贝森特还有共和党国会几个委员会主席。之前他们可都不敢忤逆川普的意愿，但是这次即使川普再三帮助老黄发声，但效果甚微。\n老黄离开市场自然对英伟达的未来很悲观、技术迭代速度可能放缓、产业生态支持力度也会大幅减弱。这些都让担忧一步步加强\n3）产业政策的大逆转\n民主党不仅大幅度领先优势拿下国会多数席位、现在还有三十个州长位子，那么市场就会但心川普过去两年积极推动的AI和加密的产业政策会被逆转：\nAI监管会更加严格、AI基建会大幅放缓；\n加密立法几无可能、加密清算更加猛烈；\n这种预期的改变，对无论是对冲基金和长线资金信心的影响和动摇是巨大的，所以我们看到的没顾上对冲基金在大幅度砍仓，然后长线资金也是不断减持仓位。\n币市则表现为中期选举后比特币ETF连日大额净流出、稳定币发行量持续下降。\n4）然后就是美联储官员的激进表态\n你看川普影响力一被削弱、FOMC票委们的表态就大胆起来，这里典型就是沃勒、之前还算是鸽派、现在已经完全转变成了强鹰派，连12月50个基点的加息论调都提出来了，多名票委的鹰派发言，自然也让市场对12月以及明年初的利率走势更加悲观。\n当然核心也是现在美伊博弈在中期选举还没有明确的说法，市场也很担心通胀的走势。\n可以看到“倒黄”事件，产业政策被逆转的担忧、联储官员的鹰派很大程度上 :532},{"id":"2124122829109313688","h":"qinbafrank","ts":1795265321,"zh":"@Ryder2087 @boboyuanzhang99 @tako_516 @jamboochuuu999 @XuiBTC 恭喜几位获得价值100U的GTA6终极版，请把自己的OKX账号UID私信给@Mercy_okx ，她会吧100U发放到各位的OKX账户里。恭喜几位👏，辛苦Mercy🫶","en":"@Ryder2087 @boboyuanzhang99 @tako_516 @jamboochuuu999 @XuiBTC 恭喜几位获得价值100U的GTA6终极版，请把自己的OKX账号UID私信给@Mercy_okx ，她会吧100U发放到各位的OKX账户里。恭喜几位👏，辛苦Mercy🫶","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2124122829109313688","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":1400},{"id":"2124117578545066011","h":"Brand","ts":1795264069,"zh":"沃尔玛的美国广告业务同比增长 37%，这表明该零售商正在效仿亚马逊的做法，将其庞大的客流量以及实体和数字货架空间转变为高利润的营销渠道。消费者是为了低廉的价格和便利而而来，而品牌则付费是为了在做出购买决定的那一刻被看到。 从表面上看，沃尔玛 $WMT 和亚马逊 $AMZN 正在趋同于类似的零售模式。两者都通过产品和交付吸引客户，然后通过第三方卖家佣金、履行服务、会员资格和广告将流量货币化。正如 BrandLLM 所指出的，两者都为品牌提供了涵盖销售、履行、广告和绩效归因的一站式闭环生态系统。 然而，他们的利润引擎仍然存在根本不同。在企业层面，亚马逊拥有独特的摇钱树。2026 年第三季度，AWS 约占其营业收入的 63%。相比之下，沃尔玛最强大的差异化因素是其广泛的实体店网络。尽管两家公司的收入规模相似，但亚马逊的广告业务仍是沃尔玛的约 11 倍。","en":"Walmart’s U.S. advertising business grew 37% year over year, signaling that the retailer is following Amazon’s playbook by turning its vast customer traffic and physical and digital shelf space into a high-margin marketing channel. Consumers come for low prices and convenience, while brands pay to be seen at the precise moment purchase decisions are made.\nOn the surface, Walmart $WMT and Amazon $AMZN are converging on a similar retail model. Both attract customers through products and delivery, then monetize that traffic through third-party seller commissions, fulfillment services, memberships, and advertising. As BrandLLM points out, both offer brands a one-stop, closed-loop ecosystem covering sales, fulfillment, advertising, and performance attribution.\nYet their profit engines remain fundamentally different. At the corporate level, Amazon has a unique cash cow. AWS generated approximately 63% of its operating income in the third quarter of 2026. Walmart’s strongest differentiator, by contrast, is its extensive physical-store network. Although the two companies generate revenue on a similar scale, Amazon’s advertising business remains approximately 11 times larger than Walmart’s.","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXphriYWYAAXP99.jpg?name=orig"],"u":"https://x.com/Brand/status/2124117578545066011","l":[],"ln":[],"t":["财报"],"lk":2,"rt":1,"rp":1,"vw":278},{"id":"2124113087733100903","h":"bbcchinese","ts":1795262998,"zh":"台湾将在11月28日举行“九合一”地方选举。 投票结果不仅会决定未来四年的地方治理，也可能牵动2028年总统选举布局，甚至影响两岸关系。\n选情最激烈的是三个直辖市：蒋万安与沈伯洋在台北对决，苏巧慧挑战国民党长期执政的新北，赖瑞隆与柯志恩在高雄交锋。\nBBC中文带你了解蓝绿版图正在出现哪些变化，以及各地选民最关心什么议题。","en":"台湾将在11月28日举行“九合一”地方选举。 投票结果不仅会决定未来四年的地方治理，也可能牵动2028年总统选举布局，甚至影响两岸关系。\n选情最激烈的是三个直辖市：蒋万安与沈伯洋在台北对决，苏巧慧挑战国民党长期执政的新北，赖瑞隆与柯志恩在高雄交锋。\nBBC中文带你了解蓝绿版图正在出现哪些变化，以及各地选民最关心什么议题。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2124112805410586624/vid/avc1/1280x720/xhaCDgNfZgtrTCda.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2124113087733100903","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":974},{"id":"2124105493467775258","h":"wufantouzi","ts":1795261188,"zh":"不要在震荡下跌行情中浪费子弹了\n等行情回暖万股复苏趋势上涨的时候\n认准几个大市值大赔率的大机会\n等能做浮云加仓的行情","en":"不要在震荡下跌行情中浪费子弹了\n等行情回暖万股复苏趋势上涨的时候\n认准几个大市值大赔率的大机会\n等能做浮云加仓的行情","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2124105493467775258","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":891},{"id":"2124098354179379472","h":"ShanghaoJin","ts":1795259486,"zh":"@chenweifei84422 @rickawsb 是，我对加息判断有误\n我本来觉得加息应该让defensive 死掉\n结果defensive 增长5%的暴涨，增长50%的暴跌\n然而，尊重市场不确定性，也要意识到最终的确定性","en":"@chenweifei84422 @rickawsb 是，我对加息判断有误\n我本来觉得加息应该让defensive 死掉\n结果defensive 增长5%的暴涨，增长50%的暴跌\n然而，尊重市场不确定性，也要意识到最终的确定性","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2124098354179379472","l":[],"ln":[],"t":["美联储"],"lk":5,"rt":1,"rp":2,"vw":558},{"id":"2124095846908383258","h":"TraderS18","ts":1795258888,"zh":"所以解铃还须系铃人，后面看看战争走向，油价什么时候能趋势下跌不再反弹，通胀能控制住，美联储何时进入降息周期。\n当然，还有个进入降息周期的方式就是系统性危机下场救市，但如果是这种路径，美联储下场之前一定会比现在跌的还惨，散户到时候还有没有本金进场就很难说了。","en":"所以解铃还须系铃人，后面看看战争走向，油价什么时候能趋势下跌不再反弹，通胀能控制住，美联储何时进入降息周期。\n当然，还有个进入降息周期的方式就是系统性危机下场救市，但如果是这种路径，美联储下场之前一定会比现在跌的还惨，散户到时候还有没有本金进场就很难说了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2124095846908383258","l":[],"ln":[],"t":["美联储","通胀","原油能源"],"lk":2,"rt":0,"rp":3,"vw":1314},{"id":"2124091151825449025","h":"TraderS18","ts":1795257768,"zh":"本质上来讲，现在的这波下跌全赖川普非要去打伊朗。\n要是他还像以往那样随便象征性打一下宣布胜利而不炸死哈梅内伊，伊朗说不定早就苟合了油价也不会涨成这样。\n要是他炸死哈梅内伊发现赢不了之后冲下滩做个强硬姿态宣布胜利体面撤走也不会深陷泥潭无法自拔。\n如果油价不涨通胀就不会爆炸；\n通胀不爆炸沃什上台说不定还能按原计划降息；\n降息变加息的罪魁祸首就是伊朗没打赢。\n加息抽贷导致原本明年才会破裂甚至还能发育更久的AI泡沫提前破裂。\n黄仁勋此前所做的一切即是扮演AI央行，也是扮演长袖善舞的产业链组织者角色，他的下课直接刺破了本就岌岌可危的泡沫。\n至于反黄倒黄都是下作的执行手段罢了，并不承担本轮下跌的主要责任。","en":"本质上来讲，现在的这波下跌全赖川普非要去打伊朗。\n要是他还像以往那样随便象征性打一下宣布胜利而不炸死哈梅内伊，伊朗说不定早就苟合了油价也不会涨成这样。\n要是他炸死哈梅内伊发现赢不了之后冲下滩做个强硬姿态宣布胜利体面撤走也不会深陷泥潭无法自拔。\n如果油价不涨通胀就不会爆炸；\n通胀不爆炸沃什上台说不定还能按原计划降息；\n降息变加息的罪魁祸首就是伊朗没打赢。\n加息抽贷导致原本明年才会破裂甚至还能发育更久的AI泡沫提前破裂。\n黄仁勋此前所做的一切即是扮演AI央行，也是扮演长袖善舞的产业链组织者角色，他的下课直接刺破了本就岌岌可危的泡沫。\n至于反黄倒黄都是下作的执行手段罢了，并不承担本轮下跌的主要责任。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2124091151825449025","l":[],"ln":[],"t":["美联储","通胀","原油能源"],"lk":5,"rt":1,"rp":1,"vw":514},{"id":"2124089536817045832","h":"ShanghaoJin","ts":1795257383,"zh":"时间会证明，懒得跟二极管辩论\n小丑张嘴就喷。记得当初炒山寨、对我群起而攻之的人吗\nAI时代multiple变化很大，我这次确实低估了流动性和负面情绪的影响\n但即使今天，仍坚信：\nwe r VERY EARLY in the AI cycle\n现在AI 定价，仿佛应用天花板就只有 300B coding？\nps 看多应用，却不看好 Semi，逻辑上说不通","en":"时间会证明，懒得跟二极管辩论\n小丑张嘴就喷。记得当初炒山寨、对我群起而攻之的人吗\nAI时代multiple变化很大，我这次确实低估了流动性和负面情绪的影响\n但即使今天，仍坚信：\nwe r VERY EARLY in the AI cycle\n现在AI 定价，仿佛应用天花板就只有 300B coding？\nps 看多应用，却不看好 Semi，逻辑上说不通","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2124089536817045832","l":[],"ln":[],"t":["AI科技"],"lk":23,"rt":1,"rp":2,"vw":1554},{"id":"2124085929468215407","h":"cnfinancewatch","ts":1795256523,"zh":"视频是 X 上增长最快的格式。带有视频的帖子获得的覆盖范围和互动量是普通帖子的 5 倍，现在 36% 的所有展示量都流向了视频。","en":"视频是 X 上增长最快的格式。带有视频的帖子获得的覆盖范围和互动量是普通帖子的 5 倍，现在 36% 的所有展示量都流向了视频。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124085929468215407","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":817},{"id":"2124084125187617052","h":"wufantouzi","ts":1795256093,"zh":"这个图上的票\n从上往下排\n按照截图价格排\n往两年后看\n基本都会赚钱\n但是当下\n就是拿不出钱来抄底了","en":"这个图上的票\n从上往下排\n按照截图价格排\n往两年后看\n基本都会赚钱\n但是当下\n就是拿不出钱来抄底了","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXpDPhhbIAADqaQ.jpg?name=orig"],"u":"https://x.com/wufantouzi/status/2124084125187617052","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2124082591511056442","h":"cnfinancewatch","ts":1795255728,"zh":"历史上最近三次类似（VIX冲40+、纳指技术熊市）情况：\n2025年4月关税冲击：VIX到52，纳指跌约23%。后续快速反弹，约2.5个月恢复高点，一年S&P约+34%。\n2020年3月疫情：VIX到82，纳指跌30%。V型反转，2.5个月恢复，一年大涨。\n2011年8月：VIX到48，纳指近20%跌。后续3个月+12%，一年+25%。\n多数案例中，极端恐慌后中长期上涨概率高，但短期波动仍大。","en":"历史上最近三次类似（VIX冲40+、纳指技术熊市）情况：\n2025年4月关税冲击：VIX到52，纳指跌约23%。后续快速反弹，约2.5个月恢复高点，一年S&P约+34%。\n2020年3月疫情：VIX到82，纳指跌30%。V型反转，2.5个月恢复，一年大涨。\n2011年8月：VIX到48，纳指近20%跌。后续3个月+12%，一年+25%。\n多数案例中，极端恐慌后中长期上涨概率高，但短期波动仍大。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124082591511056442","l":[],"ln":[],"t":["关税贸易"],"lk":0,"rt":0,"rp":0,"vw":322},{"id":"2124079213938721176","h":"Kay2289123","ts":1795254922,"zh":"近段时间半导体惨遭血洗。英伟达几周跌了四成，按预估利润算，只剩 9 倍市盈率。跌到这儿，便宜了吗？\n我还看好 AI，但一直有顾虑英伟达卖芯片赚到了钱，掏钱买芯片的那几家大厂，得多久才能赚回来？这篇聊聊这笔账，也聊聊我为什么还不敢说见底了\n希望对你有帮助","en":"近段时间半导体惨遭血洗。英伟达几周跌了四成，按预估利润算，只剩 9 倍市盈率。跌到这儿，便宜了吗？\n我还看好 AI，但一直有顾虑英伟达卖芯片赚到了钱，掏钱买芯片的那几家大厂，得多久才能赚回来？这篇聊聊这笔账，也聊聊我为什么还不敢说见底了\n希望对你有帮助","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Kay2289123/status/2124079213938721176","l":["x.com"],"ln":[{"u":"https://x.com/i/article/2124057037554470912","d":"x.com"}],"t":["AI科技"],"lk":12,"rt":2,"rp":2,"vw":1342},{"id":"2124076552283734484","h":"wufantouzi","ts":1795254288,"zh":"其实这样的时候\n事后看\n都是抄底的机会\n只不过我们仓位提前买满了\n感受到飞刀割肉流血的痛\n从94/312/519\n每一次大跌都是杠杆出清\n每一次大跌之后都是大涨\n这个月我也亏了很多钱\n踏错了节奏 看错了方向\n就要接受市场的毒打\n能怪的只有自己\n能做的只有慢慢熬慢慢忍了","en":"其实这样的时候\n事后看\n都是抄底的机会\n 对我是真的很信任。同时那些年币圈的法规在美国也不明确，换到今天我是万万不敢的。\n有了一些本金后，我2018年开始炒币，大概是1.8万美金开始做多btc。是的，那是未来几年的顶点！因为被套了所以就开始研究，我相信btc的未来，所以我逐步进场加仓，一路跌一路买，最后一次买入是3000美元，把总成本降到了一万美金。那天晚上我去纽约出差住在法拉盛的酒店，我心想这是我最后一次加仓，然后和我老婆说就当钱掉了，忘记这个持仓。她支持我，我很欣慰！\n从那以后，我再也没在这个账户买过和卖过btc，我一直拿到今年10万美金的时候卖掉了。十倍回报。其实之前几年涨到过三万 涨到过六万我没有卖掉，眼看着翻了三倍 六倍的利润再跌回到成本，心里也是心疼利润的。\n我经历了三轮币圈的牛熊，所以这一次我不想再经历一次周期，10万美金出掉了，这就是经历后带来的经验！那现在市场跌回到了6万，我认为这是非常好的机会。如果你准备买100万美金，分三次进场，这里第一笔入场应该是闭着眼开仓。然后震荡的时候开第二笔。启动的时候开第三笔。目标16万美元。这是我的思路，也是我接下来准备做的路径。我反正不在乎。至于哪里是底部，何一还套了一个亿呢，估计只有特朗普知道。当你的目标是16万，你还在意成本是3万 5w 还是8万吗？\n我不炒币，我只做长期持币，我在币圈爆过太多仓了，我为什么能扛住现在美股或者我账户的波动，因为这点波动比起我当年动辄30倍 50倍的波动不值一提。但吃过的亏不能白吃，所以我不碰合约，也没有一夜暴富的想法（因为已经被市场教育过了）。我只求细水长流，做周期性的持币。至于短线，就看纳指就好了，btc现在和纳指的关联性很高了。\n我上面的分享，是送给币圈的朋友们，或者想进入币圈的朋友们。比特币是一个信仰，但我也确实感受到了他的实用性，如果你生活在新加坡或者日本，更能体会这种方便性。\n如果你回看我在2018年以后在chinesefn youtube channel上面的视频，你会看到我那个时候向所有人推荐btc，我想让大家知道这是个好东西。但现在我不会了，因为这是个认知，认知需要你自己提升，人只能赚自己认知内的钱。\n另外，我每年都会在我女儿生日的时候给她买10万美金的btc作为礼物，我帮她存着。以后她们这个年代的孩子长大了，不会说家里有几套房子，而是说自己有几枚比特币，我相信这就是未来。#比特币\n今天分享一下btc，明天我会发一个视频，讲一下这轮美股下跌，亏钱的朋友们，你们该怎么办，该如何自救。","en":"很多人问我 $BTC 是什么观点，今天我给大家分享一下我在币圈的经历以及我对比特币的看法。我确实很少在节目里提到币圈，大家以为我只做美股，而事实上我很早就进入了币圈。我还有一个自己投资的数字货币交易平台—Vanbit。以前是okx，现在是bybit的ND broker，你在bybit官网可以查到。如果你仔细看，vanbit和我们chinesefn的app设计差不多，因为都是一个团队做的。\n2017年我开始接触币圈，我是第一代的搬砖人，那个时候和深圳的一个资方合作，他负责出钱，我负责在coinbase买币，然后打到币安这些地方做套利差价。当时一笔转出几百万美金的btc和eth，一两个小时不到地址心里战战兢兢，现在想想这大哥对我是真的很信任。同时那些年币圈的法规在美国也不明确，换到今天我是万万不敢的。\n有了一些本金后，我2018年开始炒币，大概是1.8万美金开始做多btc。是的，那是未来几年的顶点！因为被套了所以就开始研究，我相信btc的未来，所以我逐步进场加仓，一路跌一路买，最后一次买入是3000美元，把总成本降到了一万美金。那天晚上我去纽约出差住在法拉盛的酒店，我心想这是我最后一次加仓，然后和我老婆说就当钱掉了，忘记这个持仓。她支持我，我很欣慰！\n从那以后，我再也没在这个账户买过和卖过btc，我一直拿到今年10万美金的时候卖掉了。十倍回报。其实之前几年涨到过三万 涨到过六万我没有卖掉，眼看着翻了三倍 六倍的利润再跌回到成本，心里也是心疼利润的。\n我经历了三轮币圈的牛熊，所以这一次我不想再经历一次周期，10万美金出掉了，这就是经历后带来的经验！那现在市场跌回到了6万，我认为这是非常好的机会。如果你准备买100万美金，分三次进场，这里第一笔入场应该是闭着眼开仓。然后震荡的时候开第二笔。启动的时候开第三笔。目标16万美元。这是我的思路，也是我接下来准备做的路径。我反正不在乎。至于哪里是底部，何一还套了一个亿呢，估计只有特朗普知道。当你的目标是16万，你还在意成本是3万 5w 还是8万吗？\n我不炒币，我只做长期持币，我在币圈爆过太多仓了，我为什么能扛住现在美股或者我账户的波动，因为这点波动比起我当年动辄30倍 50倍的波动不值一提。但吃过的亏不能白吃，所 [],"u":"https://x.com/bboczeng/status/2123995325837070766","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1069},{"id":"2123994880540328037","h":"cnfinancewatch","ts":1795234816,"zh":"华尔街观察｜AI只有反弹没有主升，新叙事和流动性才是下一轮的前提\n总的说来，未来AI这个方向只有反弹，没有主升了。原因不在产业本身，而在资金。资金离开一个行业以后，不会原地等它回来，而是要找新的趋势、新的方向。现在正在被考虑的方向，是AI医疗、AI机器人这些。市场目前给AI汽车的定价，本质上就是特斯拉的估值。那么问题来了：特斯拉里面是不是已经包含了足够的AI机器人定价？如果已经包含，那AI机器人叙事还能往哪里拔估值？中国的AI机器人产业链、AI医药产业链，能不能长期给予积极看多？这个蓄势能不能起来？只有这些新叙事真正起来，目前我看大盘才有机会。\n但新叙事起来还需要一个先决条件：美联储从目前的加息预期变成降息预期。这个切换不是一两个季度能完成的，需要数个季度。所以到明年中后，市场才可能迎来一波有意义的反弹。那个时候，可能出现黄金和美股一起上涨的格局。\n所以未来的路径很清楚：流动性叙事是前提，股市的成长趋势是相对必要条件。两个条件具备，才会有新的机会。在此之前，AI方向只有反弹，没有主升；大盘也只有结构性机会，没有全面趋势。现在要等的不是AI自己修复，而是等新叙事蓄势、等美联储转向，两个条件缺一不可。","en":"华尔街观察｜AI只有反弹没有主升，新叙事和流动性才是下一轮的前提\n总的说来，未来AI这个方向只有反弹，没有主升了。原因不在产业本身，而在资金。资金离开一个行业以后，不会原地等它回来，而是要找新的趋势、新的方向。现在正在被考虑的方向，是AI医疗、AI机器人这些。市场目前给AI汽车的定价，本质上就是特斯拉的估值。那么问题来了：特斯拉里面是不是已经包含了足够的AI机器人定价？如果已经包含，那AI机器人叙事还能往哪里拔估值？中国的AI机器人产业链、AI医药产业链，能不能长期给予积极看多？这个蓄势能不能起来？只有这些新叙事真正起来，目前我看大盘才有机会。\n但新叙事起来还需要一个先决条件：美联储从目前的加息预期变成降息预期。这个切换不是一两个季度能完成的，需要数个季度。所以到明年中后，市场才可能迎来一波有意义的反弹。那个时候，可能出现黄金和美股一起上涨的格局。\n所以未来的路径很清楚：流动性叙事是前提，股市的成长趋势是相对必要条件。两个条件具备，才会有新的机会。在此之前，AI方向只有反弹，没有主升；大盘也只有结构性机会，没有全面趋势。现在要等的不是AI自己修复，而是等新叙事蓄势、等美联储转向，两个条件缺一不可。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123994880540328037","l":[],"ln":[],"t":["美联储","美股","黄金"],"lk":5,"rt":0,"rp":2,"vw":1210},{"id":"2123994802119438536","h":"TraderS18","ts":1795234797,"zh":"事已至此，一首《从头再来》送给大家，不要灰心，下轮周期再努力","en":"事已至此，一首《从头再来》送给大家，不要灰心，下轮周期再努力","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123994679398285313/vid/avc1/1282x720/Y7DerAHpdNY5FatG.mp4?tag=29"],"u":"https://x.com/TraderS18/status/2123994802119438536","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":408},{"id":"2123991796883824897","h":"LeoYuen13","ts":1795234080,"zh":"没有谁对谁错，市场反应这样也只能跟随市场走势，Burry的观点也许你不同意，但市场反应这样你也必须认了…","en":"没有谁对谁错，市场反应这样也只能跟随市场走势，Burry的观点也许你不同意，但市场反应这样你也必须认了…","zh_src":"native","lang":"zh","m":["https://pbs.twim 好的进场点是9月底。如果这些都做到的话今年大方向就完美了吧，以后这些吸取教训。如果前面做到，操作上应该能多减10%的INTC，那现在大概YTD能做到14-15%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2123983130721681524","l":[],"ln":[],"t":["AI科技"],"lk":20,"rt":0,"rp":4,"vw":4085},{"id":"2123982482827551032","h":"TheMarketMemo","ts":1795231860,"zh":"如果你無法承受10萬美元的賬面損失，你就不具備駕馭百萬美元財富的能力。","en":"如果你無法承受10萬美元的賬面損失，你就不具備駕馭百萬美元財富的能力。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123286122428264448/vid/avc1/1920x1080/gyAxIit0vYF7fSi1.mp4?tag=29"],"u":"https://x.com/TheMarketMemo/status/2123982482827551032","l":[],"ln":[],"t":[],"lk":56,"rt":5,"rp":5,"vw":3867},{"id":"2123980541649146239","h":"AntonLaVay","ts":1795231397,"zh":"刷 X，很容易产生一种错觉：仿佛大家都在替Jensen Huang鸣不平，都在痛骂《纽约时报》和《经济学人》搞舆论猎巫，都在为 AI 产业可能被华盛顿政客毁掉而焦虑。\n但如果把目光从 X 上全是硅谷、华尔街和科技从业者的时间线里抽离出来，我发现我们在 X 上，可能正身处一个极其厚重的信息茧房里…\n在真实世界里，美国普通民众对 AI 的敌意，以及对黄仁勋下台的态度，和 X 上的主流叙事几乎是完全相反的平行宇宙。\n美国民众跨党派的讨厌AI\n哪怕剥离“数据中心抢电抢水”，美国民众对 AI 本身的反感也已达到历史峰值\n就在本周（11月16日），Our World in Data 创始人 Max Roser 汇总对比了美国 5 家顶级机构的最新民调，得出了扎心的结论：无论问题怎么换着花样问，美国人对 AI 的负面情绪都呈压倒性优势。\n担忧与兴奋之比拉大到 5:1 以上： 根据皮尤研究中心（Pew Research，2026年6月调查/9月发布，样本量3,488人）的数据，52% 的美国成年人对 AI 普及感到“担忧多于兴奋”，而“兴奋多于担忧”的仅占 9%（2021年这一比例仅为 2:1）。这还是罕见的跨党派共识——56% 的民主党人和 49% 的共和党人同样如此。\n对社会弊大于利，且极端情绪一边倒： ABC News / 华盛顿邮报 / Ipsos 联合民调（2026年10月，样本量2,545人）显示，57% 的美国人认为 AI 对社会有害。更值得警惕的是情绪烈度：认为 AI 对社会“极其有害”的占 17%，认为“极其有益”的只有 2%。\n最反 AI 的不是老年人，而是年轻人： 很多人以为 Z 世代拥抱科技，但在 2026 年恰恰相反。\nABC/华邮/Ipsos 民调中，30岁以下年轻人有 65% 认为 AI 对社会有害（40岁以上群体反而只有 53%）；皮尤数据也显示，18-29岁年轻人首次有超过半数（55%）对 AI 担忧多于兴奋，高达 73% 认为 AI 将在未来20年减少工作岗位。\n就业威胁感甚至超过了“非法移民”： 路透社/Ipsos（Reuters/Ipsos，2026年10月，样本量4,506人）发现，高达 84% 的美国注册选民认为 AI 对美国劳工构成威胁，远超认为“非法移民”（60%）构成威胁的比例。\n盖洛普（Gallup，2026年5月调查/7月发布）也印证了这一点：79% 的美国人认为未来10年 AI 会减少美国就业岗位。\n对 AI 巨头高管的信任彻底破产： （Quinnipiac University，2026年9月30日）显示，高达 74% 的美国人对 AI 公司领导人“不太信任”或“完全不信任”（其中 45% 完全不信任，非常信任的仅占 3%）。\n同时，73% 担心未来 AI 可能威胁人类生存，86% 支持强制对 AI 公司设立独立安全标准，哪怕这会拖慢 AI 发展速度。\n本周日我会发布更详细的研究报告。","en":"刷 X，很容易产生一种错觉：仿佛大家都在替Jensen "rp":0,"vw":1374},{"id":"2123978328076156949","h":"cnfinancewatch","ts":1795230869,"zh":"你觉得黄仁勋以下行为可以接受吗？\n公司董事长训斥员工可以接受吗？\n下面这些吓我一跳，因为我本质上也是这样的人！下属做不好做不到我唯一可以做的就是当面批评直接批评，如果还没用就是“你不配做这个”！还要怎样？要哄着你？\n小人就是这样：你批评他给他建议，他认为你是在羞辱他，积怨你然后乘你病要你命地报复（黄仁勋很明显遇到了小人群体）：\n……\n<纽约时报>今天再发长文：“威胁、辱骂与和解：黄仁勋如何让羞辱员工成为常态”，这些案例包括：\n1. 诅咒员工不该出生：黄仁勋曾对一名高管说：“你妈当年就应该把你堕掉。”一名目击者向证实了这件事。\n2. 威胁扯断员工双臂：他曾威胁一名下属，要把对方的两条胳膊扯下来，再用这两条胳膊把对方活活打死。\n3. 威胁掀开员工头盖骨撒尿：他曾对另一名员工说，要掀开对方的头盖骨，然后“往你的脑子上撒尿”。\n4. 威胁挖出员工心脏：2004年10月，在一场约50名员工参加的公司会议上，黄仁勋说：“你必须把这事给我办了，否则我就把你他妈的心脏挖出来，再踩个稀巴烂。”时任英伟达人力资源高级副总裁Michael Winston称自己亲眼目睹了这一幕。\n5. 逐个威胁杀死管理人员：在一次会议上，黄仁勋挨个对在场的管理者说，他要杀了他们。\n6. 诅咒70多岁的员工赶紧死：在上述会议中，轮到一名70多岁的员工时，黄仁勋说，这个人实在太老了，大家都盼着他赶紧死掉。\n7. 把羞辱新员工当成入职考验：据Michael Winston回忆，黄仁勋曾向他炫耀，自己会在新员工入职后的前六个月故意羞辱他们，测试他们能不能承受。他称这是员工必须经历的“成人礼”，还表示不会停止，因为“这很有娱乐效果”。\n8. 在会议上长时间羞辱员工：2004年10月的那场会议上，黄仁勋持续当众辱骂员工。Michael Winston在笔记中写道，自己眼睁睁看着员工被这个“疯子”长时间折磨，其他与会者吓得恳求他出面干预。\n9. 当着客户高管的面痛骂副总裁：英伟达前战略营销副总裁Ned Finkle在一次重要客户会议上表现不佳，黄仁勋当着客户公司高管的面把他狠狠骂了一顿。随后又把他调去负责政府关系，而这在黄仁勋当时看来是公司最不重要的职位之一。\n10. 当着下属的面羞辱他们的老板：黄仁勋经常在资深管理者自己的团队面前训斥他们，直接告诉团队成员，他们的老板无能、不称职，根本不配坐在那个位置上。\n11. 嘲笑带孩子露营的高管：一名高管带孩子去露营，黄仁勋因此嘲笑他，并表示应该找一个对工作更加投入的人来担任他的职位。\n12. 嘲笑高管的飞行爱好：黄仁勋经常嘲笑另一名喜欢航空飞行的高管，拿对方的业余爱好说事。\n13. 当着美国政府官员的面羞辱销售高管：2019年，英伟达未能拿下一项美国政府超级计算机项目的部分合同，涉及数亿美元业务。黄仁勋当着政府官员的面猛烈训斥负责销售的高管。对方愤怒地将员工工牌扔向黄仁勋，黄仁勋当场表示接受其辞职。\n14. 当众贬低后来的临时CEO：据报道，黄仁勋曾在一次高级管理层会议上，当众贬低英伟达首席财务官Colette Kress。黄仁勋辞职后，Kress出任英伟达临时首席执行官。\n15. 认为员工太有钱，只能靠羞辱继续压榨工作量：近年来，黄仁勋曾告诉一群下属，英伟达员工已经太有钱了，单靠金钱无法再激励他们。要让他们继续更加卖力工作，唯一的办法就是羞辱他们。三名知情人士向证实了这段谈话。\n16. 故意避免一对一会议，让员工只能公开反对他：黄仁勋不愿与下属单独开会，公开理由是提高透明度。但一些高管认为，这实际上是一种权力手段：任何人如果不同意他的意见，都必须当众提出，黄仁勋就可以在其他人面前反击、嘲笑和羞辱对方。\n17. 威胁让反对他的HR高管在硅谷混不下去：2004年，英伟达人力资源高级副总裁Michael Winston因反对黄仁勋对待员工的方式而与他发生冲突，随后被公司解雇。Winston称，黄仁勋威胁他，如果敢起诉英伟达，就确保他今后再也无法在硅谷找到工作。双方后来以超过100万美元秘密和解。\n18. 嘲笑法国AI公司CEO的英语口音：今年早些时候，在英伟达开发者大会上，黄仁勋多次打断法国AI公司Mistral首席执行官Arthur Mensch的发言，似乎不满他的法国口音，甚至当众说：“你说的根本就不是人话。”直到另一名嘉宾介入才有所缓和。\n19. 黄仁勋女儿效仿父亲辱骂高管：黄仁勋的女儿Madison Huang在英伟达实际上承担着父亲幕僚长的职责。去年一次营销团队电话会议上，她反复训斥一名副总裁，导致对方表示：“我现在焦虑症发作了，我要退出会议了，对不起。”称查阅了会议录音。这不是黄仁勋本人实施的行为，而是报道用来说明其管理风格对公司其他管理者的影响。\n需要注意：上述多数案例来自员工、前员工及匿名知情人士的说法，部分有笔记、录音或法律文件支持，并非全部经过独立司法认定。黄仁勋否认了Michael Winston的指控，英伟达拒绝置评。","en":"你觉得黄仁勋以下行为可以接受吗？\n公司董事长训斥员工可以接受吗？\n下面这些吓我一跳，因为我本质上也是这样的人！下属做不好做不到我唯一可以做的就是当面批评直接批评，如果还没用就是“你不配做这个”！还要怎样？要哄着你？\n小人就是这样：你批评他给他建议，他认为你是在羞辱他，积怨你然后乘你病要你命地报复（黄仁勋很明显遇到了小人群体）：\n……\n<纽约时报>今天再发长文：“威胁、辱骂与和解：黄仁勋如何让羞辱员工成为常态”，这些案例包括：\n1. 诅咒员工不该出生：黄仁勋曾对一名高管说：“你妈当年就应该把你堕掉。”一名目击者向证实了这件事。\n2. 威胁扯断员工双臂：他曾威胁一名下属，要把对方的两条胳膊扯下来，再用这两条胳膊把对方活活打死。\n3. 威胁掀开员工头盖骨撒尿：他曾对另一名员工说，要掀开对方的头盖骨，然后“往你的脑子上撒尿”。\n4. 威胁挖出员工心脏：2004年10月，在一场约50名员工参加的公司会议上，黄仁勋说：“你必须把这事给我办了，否则我就把你他妈的心脏挖出来，再踩个稀巴烂。”时任英伟达人力资源高级副总裁Michael Winston称自己亲眼目睹了这一幕。\n5. 逐个威胁杀死管理人员：在一次会议上，黄仁勋挨个对在场的管理者说，他要杀了他们。\n6. 诅咒70多岁的员工赶紧死：在上述会议中，轮到一名70多岁的员工时，黄仁勋说，这个人实在太老了，大家都盼着他赶紧死掉。\n7. 把羞辱新员工当成入职考验：据Michael Winston回忆，黄仁勋曾向他炫耀，自己会在新员工入职后的前六个月故意羞辱他们，测试他们能不能承受。他称这是员工必须经历的“成人礼”，还表示不会停止，因为“这很有娱乐效果”。\n8. 在会议上长时间羞辱员工：2004年10月的那场会议上，黄仁勋持续当众辱骂员工。Michael Winston在笔记中写道，自己眼睁睁看着员工被这个“疯子”长时间折磨，其他与会者吓得恳求他出面干预。\n9. 当着客户高管的面痛骂副总裁：英伟达前战略营销副总裁Ned Finkle在一次重要客户会议上表现不佳，黄仁勋当着客户公司高管的面把他狠狠骂了一顿。随后又把他调去负责政府关系，而这在黄仁勋当时看来是公司最不重要的职位之一。\n10. 当着下属的面羞辱他们的老板：黄仁勋经常在资深管理者自己的团队面前训斥他们，直接告诉团队成员，他们的老板无能、不称职，根本不配坐在那个位置上。\n11. 嘲笑带孩子露营的高管：一名高管带孩子去露营，黄仁勋因此嘲笑他，并表示应该找一个对工作更加投入的人来担任他的职位。\n12. 嘲笑高管的飞行爱好：黄仁勋经常嘲笑另一名喜欢航空飞行的高管，拿对方的业余爱好说事。\n13. 当着美国政府官员的面羞辱销售高管：2019年，英伟达未能拿下一项美国政府超级计算机项目的部分合同，涉及数亿美元业务。黄仁勋当着政府官员的面猛烈训斥负责销售的高管。对方愤怒地将员工工牌扔向黄仁勋，黄仁勋当场表示接受其辞职。\n14. 当众贬低后来的临时CEO：据报道，黄仁勋曾在一次高级管理层会议上，当众贬低英伟达首席财务官Colette Kress。黄仁勋辞职后，Kress出任英伟达临时首席执行官。\n15. 认为员工太有钱，只能靠羞辱继续压榨工作量：近年来，黄仁勋曾告诉一群下属，英伟达员工已经太有钱了，单靠金钱无法再激励他们。要让他们继续更加卖力工作，唯一的办法就是羞辱他们。三名知情人士向证实了这段谈话。\n16. 故意避免一对一会议，让员工只能公开反对他：黄仁勋不愿与下属单独开会，公开理由是提高透明度。但一些高管认为，这实际上是一种权力手段：任何人如果不同意他的意见，都必须当众提出，黄仁勋就可以在其他人面前反击、嘲笑和羞辱对方。\n17. 威胁让反对他的HR高管在硅谷混不下去：2004年，英伟达人力资源高级副总裁Michael Winston因反对黄仁勋对待员工的方式而与他发生冲突，随后被公司解雇。Winston称，黄仁勋威胁他，如果敢起诉英伟达，就确保他今后再也无法在硅谷找到工作。双方后来以超过100万美元秘密和解。\n18. 嘲笑法国AI公司CEO的英语口音：今年早些时候，在英伟达开发者大会上，黄仁勋多次打断法国AI公司Mistral首席执行官Arthur Mensch的发言，似乎不满他的法国口音，甚至当众说：“你说的根本就不是人话。”直到另一名嘉宾介入才有所缓和。\n19. 蠢”。\n他唯一要求员工的：就事论事，接受批评和建议。","en":"如果这样乔布斯需要被撤职多少次？\n乔布斯出了名地骂人甚至羞辱蠢货啊！脾气暴躁。因为他“受不了愚蠢”。\n他唯一要求员工的：就事论事，接受批评和建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123969799118266518","l":[],"ln":[],"t":[],"lk":0,"rt":1,"rp":1,"vw":516},{"id":"2123969745942876389","h":"TheMarketMemo","ts":1795228823,"zh":"抱歉啊， $NVDA 被我烏鴉嘴了🤣","en":"抱歉啊， $NVDA 被我烏鴉嘴了🤣","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TheMarketMemo/status/2123969745942876389","l":[],"ln":[],"t":[],"lk":29,"rt":0,"rp":6,"vw":2516},{"id":"2123968968809697755","h":"cnfinancewatch","ts":1795228638,"zh":"机构可以用\n散户很难用的上\n往往深亏的的时候买已经时机过去了\n出现期权价值归零但股票上亏的并没有弥补","en":"机构可以用\n散户很难用的上\n往往深亏的的时候买已经时机过去了\n出现期权价值归零但股票上亏的并没有弥补","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123968968809697755","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":608},{"id":"2123966439057178802","h":"cnfinancewatch","ts":1795228035,"zh":"选前我就担心过民主党上台会出现华尔街看淡股市\n而川普摆烂的局面\n民主党加税、限制AI产业的政策，都会让股市下跌\n十月初我们止损了九月底建仓的QQQ之后一直要求学员支持bil避险\n但没想到民主党选民的报应来得这样猛烈","en":"选前我就担心过民主党上台会出现华尔街看淡股市\n而川普摆烂的局面\n民主党加税、限制AI产业的政策，都会让股市下跌\n十月初我们止损了九月底建仓的QQQ之后一直要求学员支持bil避险\n但没想到民主党选民的报应来得这样猛烈","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123966439057178802","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":793},{"id":"2123966363538784476","h":"cnfinancewatch","ts":1795228017,"zh":"站在统筹决策者角度，股市只是分管决策的一部分，全力救市未必必要。\n这轮牛市对产业实质贡献有限，国内产业难点归根结底是先进逻辑芯片制程不够；而制程获得资金并不多：\n长鑫拿到一部分但不缺钱，中芯国际定增400亿、粤芯60亿、联芯53亿、盛合晶威50亿、拓荆46亿，合计不超1000亿，为一点“醋”包整顿“饺子”是否值得。四大行定增1000多亿还是财政部自己掏钱。\n代价却不小：国家队年化收益仅个位数，居民储蓄至少赔5万亿，保险资金赔1万亿，其中5万亿还是很信任主流舆论的资金。\n谁赚了？约1%懂A股散户赚一些，原始股东高位减持、量化波段赚大头，对产业发展价值不大。\n若逆势把股市拉回4000帮多数人解套，国家队1万多亿不够，至少再投5万亿居民储蓄，几乎不可能，除非不计中央信用风险。\n今年外围小动作不断，但顾及市场反应未有力回应，也是损失。也许在某点位附近老实待着、别瞎搞，让市场不干扰领导决策，听着安稳，实则残酷。","en":"站在统筹决策者角度，股市只是分管决策的一部分，全力救市未必必要。\n这轮牛市对产业实质贡献有限，国内产业难点归根结底是先进逻辑芯片制程不够；而制程获得资金并不多：\n长鑫拿到一部分但不缺钱，中芯国际定增400亿、粤芯60亿、联芯53亿、盛合晶威50亿、拓荆46亿，合计不超1000亿，为一点“醋”包整顿“饺子”是否值得。四大行定增1000多亿还是财政部自己掏钱。\n代价却不小：国家队年化收益仅个位数，居民储蓄至少赔5万亿，保险资金赔1万亿，其中5万亿还是很信任主流舆论的资金。\n谁赚了？约1%懂A股散户赚一些，原始股东高位减持、量化波段赚大头，对产业发展价值不大。\n若逆势把股市拉回4000帮多数人解套，国家队1万多亿不够，至少再投5万亿居民储蓄，几乎不可能，除非不计中央信用风险。\n今年外围小动作不断，但顾及市场反应未有力回应，也是损失。也许在某点位附近老实待着、别瞎搞，让市场不干扰领导决策，听着安稳，实则残酷。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123966363538784476","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":2,"vw":880},{"id":"2123963913331163174","h":"bboczeng","ts":1795227432,"zh":"现在，你翻翻我7月底的推文？甚至7月4号的？\n我当时怎么判断的？\n谢谢","en":"现在，你翻翻我7月底的推文？甚至7月4号的？\n我当时怎么判断的？\n谢谢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123963913331163174","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":266},{"id":"2123962416254038363","h":"dmjk001","ts":1795227076,"zh":"彭博：Anthropic PBC 的一名研究人员声称，已使用该公司的人工智能软件解决了著名的数论难题——黎曼猜想。\n数学家 Levent Alpöge 在其个人网站上发布了一份说明和代码，包括 Andrew Sutherland 在内的其他数学家已在各自电脑上验证了他的工作。\n据 Sutherland 和 Noah Giansiracusa 等专家称，如果得到证实，Alpöge 的工作将标志着人工智能的一项重大成就，并对数学行业及其他职业产生潜在影响。","en":"彭博：Anthropic PBC 的一名研究人员声称，已使用该公司的人工智能软件解决了著名的数论难题——黎曼猜想。\n数学家 Levent Alpöge 在其个人网站上发布了一份说明和代码，包括 Andrew Sutherland 在内的其他数学家已在各自电脑上验证了他的工作。\n据 Sutherland 和 Noah Giansiracusa 等专家称，如果得到证实，Alpöge 的工作将标志着人工智能的一项重大成就，并对数学行业及其他职业产生潜在影响。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXnUd6kaMAAvbDm.png?name=orig"],"u":"https://x.com/dmjk001/status/2123962416254038363","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":425},{"id":"2123961335994351651","h":"cnfinancewatch","ts":1795226818,"zh":"从10月6日标普500创下历史新高算起，短短45天，美国股市累计蒸发约6万亿美元。\nAI烧钱、民主党赢得中期选举、美联储加息、黄仁勋离职、AMD遭做空，再加上Anthropic史上最大IPO，几乎所有利空都撞在了一起。","en":"从10月6日标普500创下历史新高算起，短短45天，美国股市累计蒸发约6万亿美元。\nAI烧钱、民主党赢得中期选举、美联储加息、黄仁勋离职、AMD遭做空，再加上Anthropic史上最大IPO，几乎所有利空都撞在了一起。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123961335994351651","l":[],"ln":[],"t":["美联储","美股"],"lk":1,"rt":1,"rp":1,"vw":783},{"id":"2123961026077138963","h":"cnfinancewatch","ts":1795226744,"zh":"英伟达从来就不是一家“普通芯片设计公司”。它的壁垒不在图纸上，而在两张只有黄仁勋亲手织起来的网里：一张是扎根台湾三十三年的产业链纵深，另一张是用资本把客户和供应商绑成命运共同体的生态设计。这两张网一旦失去织网的人，剩下的只是一堆先进的GPU设计，却落不了地。\n第一张网：台湾产业链的“超前配合”，靠的是老黄的人情和信用，不是合同。\n台积电承担了英伟达超70%的高端GPU产能，独家支撑4nm、3nm先进制程，CoWoS先进封装也系于台积电一身。鸿海、广达、纬创负责服务器组装，SK海力士和三星供应HBM，亚洲供应链已占英伟达生产成本的90%。这份“超前配合”不是凭空来的。黄仁勋与台积电张忠谋相识逾二十年，张忠谋曾在2013年两度邀他接掌台积电；他每年在台湾组“兆元宴”，台积电、鸿海、广达、纬创的掌门人坐在一张桌上，谈的是未来几年的产能、技术路线和投资时间表。供应商建一座晶圆厂、扩一条封装线，动辄数十亿美元，往往要在订单完全落实之前就下决心。他们敢提前押注，信的是黄仁勋这个人三十三年攒下的订单信用，而不是新CEO嘴里一句“我们的供应链规划向来很杰出”。已经有台湾供应商高管在黄仁勋离任后公开表示，愿意满足英伟达的产能需求，但“忧心继任者未必像黄仁勋那样积极预留产能”。\n第二张网：用资本替整条产业链“垫钱”，把生态锁死在英伟达的算力底座上。\n这才是黄仁勋真正超出“芯片CEO”范畴的能力。在他主导下，英伟达向AI新创、供应商和芯片客户投出的股权投资与财务支持超过1000亿美元，扮演着AI热潮“非官方银行家”的角色。这不是简单的财务投资。对OpenAI、Anthropic的注资，本质是锁定它们下一代模型优先采用英伟达的Rubin架构，同时用模型端的反馈反哺硬件迭代。对CoreWeave这类“新云”，英伟达提供采购订单和信用背书，帮它们借钱买卡、建数据中心，而它们买回来的又是英伟达的芯片。甚至为OpenAI的数据中心园区提供高达1050亿美元的租赁和电力费用担保，自己当自己客户的“地主”。这套“投资—采购—再投资”的循环，被外界批评为“循环融资”，但它实实在在地让整条产业链——从模型公司到云服务商到服务器组装厂——都在为英伟达的下一代芯片提前铺路。白人职业经理人算的是季度毛利率和投资回报率，黄仁勋算的是整条产业链十年后还在不在英伟达的轨道上。\n董事会接手后做的事情，恰恰证明他们看不懂这两张网值多少钱。\n黄仁勋离任后，临时CEO克雷斯做的第一件事，是把年度加薪和股权奖励从三月提前到十二月，试图用“朝四暮三”稳住员工。与此同时，她对外的投资口径立刻从黄仁勋的“我投你，我给你钱”转向“有纪律的”“严谨的”筛选，对新云客户的融资门槛骤然收紧。员工不是傻子。英伟达股价自黄仁勋辞职以来下跌13%，市值蒸发约5000亿美元，而员工薪酬与股票深度绑定，资产缩水是切肤之痛。一名高级员工致信董事会警告：不考虑让黄仁勋复职，英伟达将失去“不可替代的人才”。董事会主席琼斯承认“找到黄仁勋的克隆版是不现实的”，转头却仍在猎头那里物色外部接班人。他们宁可让一个没有供应链信用、没有生态设计履历的职业经理人坐上那个位置，也不肯给老黄一个顾问虚职来做权力过渡。这不是治理，这是把发动机拆了去换一块更“合规”的仪表盘。\n黄仁勋三十三年里反复讲同一句话：“公司离破产只有三十天”。这句话在董事会耳朵里大概只是创始人的煽情修辞。但真正做过芯片落地的人知道，那不是修辞。没有台积电提前扩的CoWoS产线，没有富士康和广达提前备的组装产能，没有用股权投资替客户垫出来的算力需求，英伟达的芯片设计再领先，也只是台积电排期表上一行可以被推迟的订单。华为的芯片设计不差，差的是让设计变成产品的落地纵深——而英伟达的落地纵深，是黄仁勋用三十三年的人情、信用和资本运作，一寸一寸织出来的。\n新的CEO以后任何一次公开发言，评论区只会重复同一个问题：Jenson在哪？供应链不会问董事会“你们的战略是什么”，他们只会问“老黄还管不管事”。答案如果不是肯定的，超前配合就会变成按合同办事，独家产线就会变成排队等位，生态绑定就会变成各寻出路。英伟达需要的不是一个“没有黄仁勋的英伟达”，它需要黄仁勋回来，哪怕只是回到那张织网的桌子旁边。","en":"英伟达从来就不是一家“普通芯片设计公司”。它的壁垒不在图纸上，而在两张只有黄仁勋亲手织起来的网里：一张是扎根台湾三十三年的产业链纵深，另一张是用资本把客户和供应商绑成命运共同体的生态设计。这两张网一旦失去织网的人，剩下的只是一堆先进的GPU设计，却落不了地。\n第一张网：台湾产业链的“超前配合”，靠的是老黄的人情和信用，不是合同。\n台积电承担了英伟达超70%的高端GPU产能，独家支撑4nm、3nm先进制程，CoWoS先进封装也系于台积电一身。鸿海、广达、纬创负责服务器组装，SK海力士和三星供应HBM，亚洲供应链已占英伟达生产成本 的长期盈利能力来构建基础设施，会在不可避免的周期转折时导致重大资本毁灭。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123960413335507140","l":[],"ln":[],"t":[],"lk":0,"rt":1,"rp":0,"vw":1053},{"id":"2123960070639915332","h":"cnfinancewatch","ts":1795226516,"zh":"大跌后散户唯一正确操作：保命优先，放弃幻想\nA股大跌落地，绝大多数散户还在犯致命错误：死扛、等反弹、左侧抄底。今天讲三条铁律，直接规避90%亏损，句句干货。\n第一，破20日线无条件降仓，不等反弹。任何个股、尤其是指数ETF，一旦有效跌破20日线，必须立刻减仓至半仓以下，不要等待反弹减仓、不要心存侥幸。硬核算账：满仓再跌10%账户亏10%，减半仓后同等跌幅仅亏5%，同等条件未来减亏你需要的涨幅只有满仓的三分之一多一点。大跌途中所有反弹都是诱多，当下砍仓，就是锁定安全、保留后续抄底本金。\n第二，严禁左侧抄底，绝不接飞刀。大跌之后市场情绪崩塌，资金不会瞬间回流。哪怕后续出现10%个股反弹、指数20%级别的修复，也全部是陷阱。A股大跌后的修复周期极长，往往需要数个季度磨底，左侧抄底只会持续深套，所有看似反转的机会，全是短期情绪超跌反弹。\n第三，死守右侧信号，耐心等真底。真正的市场见底，缺一不可三大共振信号：单日放量大阳线、强势收复5日线的技术信号；配套落地的政策暖风；以及美股市场同步企稳共振。\n目前节点明确：12月底、加息落地之前，市场难有持续性行情。当下最优解：低仓避险、管住手、放弃短线博弈。\n大跌炒股，活下来比赚反弹更重要，熬到底部信号出现，再重仓出击，才是散户唯一的生存之道。\n#A股 #股票大跌 #散户交易 #仓位管理 #市场复盘","en":"大跌后散户唯一正确操作：保命优先，放弃幻想\nA股大跌落地，绝大多数散户还在犯致命错误：死扛、等反弹、左侧抄底。今天讲三条铁律，直接规避90%亏损，句句干货。\n第一，破20日线无条件降仓，不等反弹。任何个股、尤其是指数ETF，一旦有效跌破20日线，必须立刻减仓至半仓以下，不要等待反弹减仓、不要心存侥幸。硬核算账：满仓再跌10%账户亏10%，减半仓后同等跌幅仅亏5%，同等条件未来减亏你需要的涨幅只有满仓的三分之一多一点。大跌途中所有反弹都是诱多，当下砍仓，就是锁定安全、保留后续抄底本金。\n第二，严禁左侧抄底，绝不接飞刀。大跌之后市场情绪崩塌，资金不会瞬间回流。哪怕后续出现10%个股反弹、指数20%级别的修复，也全部是陷阱。A股大跌后的修复周期极长，往往需要数个季度磨底，左侧抄底只会持续深套，所有看似反转的机会，全是短期情绪超跌反弹。\n第三，死守右侧信号，耐心等真底。真正的市场见底，缺一不可三大共振信号：单日放量大阳线、强势收复5日线的技术信号；配套落地的政策暖风；以及美股市场同步企稳共振。\n目前节点明确：12月底、加息落地之前，市场难有持续性行情。当下最优解：低仓避险、管住手、放弃短线博弈。\n大跌炒股，活下来比赚反弹更重要，熬到底部信号出现，再重仓出击，才是散户唯一的生存之道。\n#A股 #股票大跌 #散户交易 #仓位管理 #市场复盘","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123960070639915332","l":[],"ln":[],"t":["美联储","美股","A股港股"],"lk":1,"rt":0,"rp":0,"vw":799},{"id":"2123959042796359973","h":"bboczeng","ts":1795226271,"zh":"https://x.com/i/spaces/1YRZolmmzRorMJ","en":"","zh_src":"bing","lang":"","m":[],"u":"https://x.com/bboczeng/status/2123959042796359973","l":["x.com"],"ln":[{"u":"https://x.com/i/spaces/1YRZolmmzRorMJ","d":"x.com"}],"t":[],"lk":1,"rt":0,"rp":2,"vw":874},{"id":"2123957656302088664","h":"Kay2289123","ts":1795225941,"zh":"要不要清仓离场？我不会劝你，
