ness","ts":1794819002,"zh":"@parmy（来自 @opinion）写道，历史可能会回顾黄仁勋的下台和达里奥·阿莫迪的大规模 IPO，作为人工智能公司最终开始成长的那一刻","en":"History may look back at Jensen Huang's ousting and Dario Amodei's massive IPO as the moment AI companies finally started to grow up, writes @parmy (via @opinion)","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122250832582250996","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/opinion/articles/2026-11-16/nvidia-and-anthropic-ai-is-hitting-serious-new-power-limits?taid=6afac3bad0eea100019b03ac&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":3,"rt":0,"rp":1,"vw":9106},{"id":"2122249865803845908","h":"cnfinancewatch","ts":1794818772,"zh":"A股盘中｜2026年11月16日 周一 截至14时40分\n#结论 今天是一次干脆的风格切换，科技硬件被集中抛售，资金躲进银行、保险和家电。截至14时40分，沪指跌1.25%报3588.94点，失守3600点；深成指跌2.88%，创业板指跌4.72%，科创50跌5.99%，跌幅都比午盘扩大了一倍多。沪深两市已成交约1.34万亿元。涨停30家，跌停58家，跌停数是涨停的近两倍，赚钱效应明显偏弱。尾盘不建议抄科技的底，持仓向银行保险和白电靠拢，算力和半导体等本周英伟达财报落地再说。\n#盘面速览 上午还算有序，沪指午盘只跌0.39%，下午一点半后科创板和创业板加速下探，摩尔线程、沐曦股份、中科飞测、芯原股份跌超10%，寒武纪跌逾8%。上证50只跌0.68%，中证1000跌3.38%，大盘价值明显抗跌，小盘成长最弱。\n#板块与风格 领跌的是光模块、PCB和半导体。 #中际旭创 $300308 跌12.7%，成交215亿元居全市场第一； #新易盛 $300502 跌11.45%。 #沪电股份 $002463 、 #深南电路 $002916 、 #生益科技 $600183 三只PCB龙头跌停，元件是跌停最集中的行业。ETF口径，通信ETF跌8.61%，芯片ETF跌6.72%，半导体ETF跌6.31%，人工智能ETF跌5.65%，半导体设备ETF跌5.56%，军工、机器人、有色跌3.5%到4.2%。 红盘一侧，银行ETF涨1.67%，红利ETF涨1.36%，煤炭ETF涨1.27%，消费ETF涨1.0%，酒和食品饮料小幅收红。 #工商银行 $601398 涨1.92%，盘中再创历史新高； #美的集团 $000333 涨2.13%，股价刷新2021年2月创下的历史高点。\n#资金面 主力资金与板块资金流接口本档未能取到，数据缺失；北向当日不披露。可以确认的是：截至11月13日两市融资余额22497.85亿元，单日减少165.45亿元；据媒体援引的统计，上周股票型ETF合计净流出约422亿元。杠杆和ETF两条线都在退，今天的下跌更多是去拥挤，而不是新增利空。\n#涨停分布 30家涨停里，家电和零售最整齐。 #九阳股份 $002242 、 #小熊电器 $002959 、 #北鼎股份 $300824 、 #长虹美菱 $000521 、 #华帝股份 $002035 涨停， #广百股份 $002187 三连板， #天虹股份 $002419 涨停，内需消费是今天唯一成片的进攻线。固态电池 #紫竹高科 $002058 、 #领湃科技 $300530 涨停；AI漫剧回暖， #吉视传媒 $601929 三天两板， #华数传媒 $000156 涨停。最高板是 #北纬科技 $002148 四连板。电网设备 #顺钠股份 $000533 涨停，带动 #国电南瑞 $600406 涨3.78%。\n#盘中消息 科技链的压力来自几件事叠在一起：英伟达创始人辞任CEO后的余波还在发酵，本周英伟达财报登场前资金不愿接；周末中东局势升温，第三艘美军航母抵达；美联储12月加息预期升温，叠加有关AI融资风险的提示。早盘日韩芯片股转跌，港股大模型和芯片股同步重挫。托底的一面也有，证监会上周表态构建稳的机制、防范异常波动，中美经贸磋商贸易理事会首次会议已在11月13日召开。\n#研报面 这一轮下跌中，财通基金认为AI仍处渗透率早中期，调整属于预期消化；中信建投、东吴证券继续看好国产算力链。防守侧，国投证券11月13日首次覆盖 #工商银行 给予买入评级、目标价9.88元；美的集团近两周获财信证券、申万宏源、中泰证券等多家买入评级，最新一篇是财信证券11月12日。今天盘中未见新的重磅首次覆盖。\n#中美映射 双窗口沿用早间口径。银行与金融是唯一的20日加5日双窗口同现方向，今天银行再创新高，正好兑现。半导体只有5日共振，20日两边都是负的，属于超跌脉冲，今天这一脉冲被彻底打掉，再次说明仅5日上榜的方向不能追。\n#三个方向 一是 #银行与保险红利，双窗口同现，盘中最稳，尾盘仍是首选。二是 #家电与内需消费，龙头创新高加上小家电零售成片涨停，研报密集覆盖，是今天的进攻线，但涨停股不追，做龙头回踩。三是 #电网设备，订单逻辑与防御属性兼具，逆势收红。半导体设备与AI漫剧降为观察。\n#六只个股 #工商银行 $601398 ，涨1.92%创历史新高，双窗口方向的核心，持有不追高。 #中国平安 $601318 ，涨1.34%，保险板块居涨幅前列，补涨品种。 #美的集团 $000333 ，涨2.13%刷新历史高点，研报覆盖最密，回踩91元附近再加。 #国电南瑞 $600406 ，涨3.78%，电网设备逆势走强，防御兼成长。 #横店影视 $603103 ，涨4.04%，院线和AI漫剧逆势回暖，冲高不追。 #北方华创 $002371 ，跌1.84%，明显抗跌于科创50，上周设备板块有资金逆势流入，只作为科技企稳后的首选观察，不在今天接。\n#小盘阿尔法 本档不选。小家电和零售涨停股多为当日一字或快速封板，20日K线位置与最新财报未完成核验，按规则不入选。\n#尾盘观察 看三点。一是沪指能否收回3600点，收不回来明天大概率继续在科技里找底；二是中际旭创和沪电股份尾盘有没有放量承接，没有就别抄；三是银行能否站稳日内高点，银行走弱意味着防守资金也在撤。今天收盘前不建议追涨停家电，也不建议加仓科技。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅","en":"A股盘中｜2026年11月16日 周一 截至14时40分\n#结论 今天是一次干脆的风格切换，科技硬件被集中抛售，资金躲进银行、保险和家电。截至14时40分，沪指跌1.25%报3588.94点，失守3600点；深成指跌2.88%，创业板指跌4.72%，科创50跌5.99%，跌幅都比午盘扩大了一倍多。沪深两市已成交约1.34万亿元。涨停30家，跌停58家，跌停数是涨停的近两倍，赚钱效应明显偏弱。尾盘不建议抄科技的底，持仓向银行保险和白电靠拢，算力和半导体等本周英伟达财报落地再说。\n#盘面速览 上午还算有序，沪指午盘只跌0.39%，下午一点半后科创板和创业板加速下探，摩尔线程、沐曦股份、中科飞测、芯原股份跌超10%，寒武纪跌逾8%。上证50只跌0.68%，中证1000跌3.38%，大盘价值明显抗跌，小盘成长最弱。\n#板块与风格 领跌的是光模块、PCB和半导体。 #中际旭创 $300308 跌12.7%，成交215亿元居全市场第一； #新易盛 $300502 跌11.45%。 #沪电股份 $002463 、 #深南电路 $002916 、 #生益科技 $600183 三只PCB龙头跌停，元件是跌停最集中的行业。ETF口径，通信ETF跌8.61%，芯片ETF跌6.72%，半导体ETF跌6.31%，人工智能ETF跌5.65%，半导体设备ETF跌5.56%，军工、机器人、有色跌3.5%到4.2%。 红盘一侧，银行ETF涨1.67%，红利ETF涨1.36%，煤炭ETF涨1.27%，消费ETF涨1.0%，酒和食品饮料小幅收红。 #工商银行 $601398 涨1.92%，盘中再创历史新高； #美的集团 $000333 涨2.13%，股价刷新2021年2月创下的历史高点。\n#资金面 主力资金与板块资金流接口本档未能取到，数据缺失；北向当日不披露。可以确认的是：截至11月13日两市融资余额22497.85亿元，单日减少165.45亿元；据媒体援引的统计，上周股票型ETF合计净流出约422亿元。杠杆和ETF两条线都在退，今天的下跌更多是去拥挤，而不是新增利空。\n#涨停分布 30家涨停里，家电和零售最整齐。 #九阳股份 $002242 、 #小熊电器 $002959 被动工具的买入规模约3171亿美元，而主动基金存在较大赎回压力。这背后有一个重要的点：\n市场上涨究竟是主动投资者重新看好基本面，还是被动资金、ETF和长期配置资金持续买入的结果？\n两者对市场的意义是不同的：\n1）主动投资者推动，意味着风险偏好回归和盈利预期有更强共识。\n2）而只是被动资金推动，意味着风险偏好和盈利预期并没有形成共识，这种情况容易出现指数上涨、个股分化、行业内部集中度上升的情况。一旦ETF资金流入放缓，市场的边际买盘就可能迅速减弱。\n4、Hartnett 对未来市场的另一个判断：投资者情绪悲观，但实际仓位并没有那么悲观。\nHartnett 特别提到即将公布的11月17日美银全球基金经理调查需要重点关注三个指标：繁荣预期、现金仓位、实际股票仓位。\n如果现金仓位上升至4.2%以上，说明基金经理开始真正降低风险资产配置。这反而可能改善市场情绪指标，减少之前的拥挤交易风险。\n这里有一个潜在的风险：\n同一天美银经济团队认为，通胀持续高于2%目标，可能迫使美联储重新考虑此前的宽松路径，甚至需要进一步提高利率。\n同时，该团队也承认如果经济明显放缓、美国与伊朗达成协议导致油价回落，或者股票市场大幅下跌，后续加息可能推迟甚至取消。\n把本期Hartnett报告与近期看到的的机构资金流、AI融资、美国财政和美联储政策结合起来，我的判断是：\n市场可能已经完成一轮仓位清洗，但宏观压力和流动性风险尚未解除\n1）短期：市场有反弹条件，但不能简单理解为新一轮牛市已经开始\n对冲基金已经大幅降低杠杆，部分拥挤交易被清理。长期基金却仍在持续买入股票。\n这意味着市场下跌时的边际卖盘可能减少，出现空头回补和逢低买入推动的反弹。但反弹是否能够持续，需要观察主动基金是否重新增加风险敞口。\n2）中期 最大的风险来自宏观金融条件与AI政策及融资态势的碰撞\n我认为目前最值得警惕的组合是：油价长期维持高位、美元继续走强、美债收益率居高不下、科技公司债券发行增加且融资成本进一步上升。\n这些因素同时发生，就可能出现AI产业需求仍然旺盛，但资本市场对投资回报率的审视和挑剔更高，这会导致科技产业内部出现更加明显的分化。\n拥有强大现金流、资产负债表和商业化能力的公司，会比依赖外部融资的公司更有优势。\n所以未来核心是看中期宏观环境的变化，个人角度就聚焦就看三个层面：\n1）油价/通胀的走势；\n2）中期选举新政治生态下AI政策确实是进一步收紧还只是纠偏；\n3）AI商业化是不是还处于加速状态（大云厂的云业务增速和模型厂的实际营收增速）。","en":"美银最新一期FlowShow很值得看看，Hartnett对市场的态度还是很谨慎，为什么他继续坚持Risk-off，什么条件下才会重新转向Risk-on？这也是理解未来几周美股走势的关键。这份报告最值得关注的有几个方面：\n1）全球股票基金单周流入983亿美元，究竟是谁在买？\n2）美国科技股遭遇大规模抛售，为什么全球科技基金仍然持续吸金？\n3）美元、原油、美债收益率和全球流动性之间，正在发生什么变化？\n4）标普500的8000点和7000点情景，背后分别对应什么样的市场结构？\n聊聊Hartnett这期报告聊的几个要点\n1、美元成\"破坏之球\"，全球流动性全面收缩\n他的逻辑简明直接：美元飙升加上黄金跌破4000美元，等同于全球流动性的撤退信号。\n2、Hartnett为转向风险偏好设定了三个前提条件：油价（WTI）跌破70美元、10年期美债收益率降至4.5%以下、美元开始下行。周五收盘时，三项条件无一达标。\n他的逻辑是油价影响通胀、\n10年美债收益率决定贴现率和融资成本、美元走强会增加新兴市场的融资压力。\n3、而关于资金流向\n这里其实有一个分化，前四周被动工具的买入规模约3171亿美元，而主动基金存在较大赎回压力。这背后有一个重要的点：\n市场上涨究竟是主动投资者重新看好基本面，还是被动资金、ETF和长期配置资金持续买入的结果？\n两者对市场的意义是不同的：\n1）主动投资者推动，意味着风险偏好回归和盈利预期有更强共识。\n2）而只是被动资金推动，意味着风险偏好和盈利预期并没有形成共识，这种情况容易出现指数上涨、个股分化、行业内部集中度上升的情况。一旦ETF资金流入放缓，市场的边际买盘就可能迅速减弱。\n4、Hartnett 对未来市场的另一个判断：投资者情绪悲观，但实际仓位并没有那么悲观。\nHartnett 特别提到即将公布的11月17日美银全球基金经理调查需要重点关注三个指标：繁荣预期、现金仓位、实际股票仓位。\n如果现金仓位上升至4.2%以上，说明基金经理开始真正降低风险资产配置。这反而可能改善市场情绪指标，减少之前的拥挤交易风险。\n这里有一个潜在的风险：\n同一 太平洋看好\n#联影医疗 $688271 、 #惠泰医疗 $688617\n形成医疗线的互证。华泰证券通信研报看好OCS全光交换，建议关注海外整体方案商与国内上游核心元器件配套商；光通信20日跌幅较深，这类研报更多是中期逻辑，不构成今天追高理由。半导体设备方向两小时内没有新增评级，沿用第一版太平洋、华安的买入覆盖。\n#热榜\n人气榜本档仍未取到，数据缺失。集合竞价数据要到9点15分以后才有，本档截稿前无法采集，竞价强弱请以开盘实际为准。\n#资金面\n截至11月13日两市融资余额22497.85亿元，较前一交易日减少165.45亿元，沪市减86.72亿元、深市减78.73亿元，杠杆资金在上周后半段明显撤退，这与周五创业板大跌对得上。北向当日不披露，主力资金接口本档仍缺失。\n#中美映射\n双窗口数据沿用第一版，两小时内无新的收盘数据。银行与金融仍是唯一双窗口同现方向；半导体5日共振但20日为负，属于超跌脉冲。今早日韩芯片设备股走弱，进一步说明半导体反弹不能追。\n#期货 两小时更新\n纳指期货28178，较上一结算涨约0.5%；标普期货7601，涨约0.25%。A50期指本档报价未更新，仍为上周五夜盘12831附近，数据待开盘确认。离岸人民币6.6724，较前收略升。黄金3897美元，现货一度突破3900美元；纽约原油88.2美元小幅回落；白银48.8美元、美铜617美分，均小幅走弱。恒生指数与恒生科技本档仍为上周五收盘口径，分别跌1.55%和3.02%。\n#三个方向\n一是 #银行与红利，不变，杠杆资金撤退阶段防守仍是首选。二是 #影视院线与AI漫剧，不变，高开过多不追。三是\n#半导体设备与先进封装，不变，但优先级下调到观察低吸，日本 #爱德万测试\n大跌是今天的外部压力。液冷与数据中心电力设备单列观察，今早订单和准入消息多，但属于单日催化，需要盘面放量确认。\n#六只个股\n #工商银行 $601398 ，防守底仓，不变。\n #中国电影 $600977 ，影视趋势核心，回踩分时均线再看。\n #横店影视 $603103 ，院线弹性品种，高开超过5%不追。\n #北方华创 $002371 ，设备龙头，守住上周五低点才考虑低吸。\n #拓荆科技 $688072 ，先进封装逻辑清楚，今天外部芯片设备偏弱，轻仓或等。\n #国电南瑞 $600406 ，电网订单与智能微电网定调共振，防御兼成长。\n观察名单补充 #银轮股份 $002126 ，液冷换热器进入头部云厂商白名单，需看开盘量能，不进六只。\n#小盘阿尔法\n本档仍不选。液冷相关小盘标的消息面活跃，但20日K线与最新财报未完成核验，按规则不入选。\n#操作提示\n九点二十五分先看竞价：银行是否平开偏强，影视是否高开过度，设备是否随日韩低开。IM与IC贴水若继续扩大，成长股一律等。融资盘仍在撤，追涨的胜率不高，今天以守为主，液冷只看不追。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘前第二版｜2026年11月16日 周一 两小时更新\n#结论\n七点以后外盘给了一点缓冲，但科技链的压力没有消失。纳指期货报28178附近，较上一结算回升约0.5%，标普期货涨约0.25%；日经225却从高开0.34%转跌，盘中一度跌1%，日本芯片测试设备龙头\n#爱德万测试 跌8.2%，韩国KOSPI也回吐涨幅。外部算力链情绪仍弱，第一版的判断不变：银行红利守底仓，影视院线等回踩，半导体设备只低吸。两小时内的新增变化集中在两处，一是数据中心液冷与电力设备订单密集，二是医保目录落地后创新药获券商集中解读，今天可作为盘中观察的补充线索，不改三个方向。\n#消息面 两小时更新\n韩国 #LS电气 拿下约1300亿韩元美国超大规模AI数据中心配电订单， #三星SDI\n因美国电池订单早盘涨超6%，SK海力士宣布五年投入约10.5亿美元扶持本土材料设备供应商。国内方面， #银轮股份\n大型钎焊板式换热器进入国内头部云厂商白名单， #永贵电器 称液冷快换接头等产品在推广中，液冷是今早公告最密的方向。 #TCL中环\n调研称硅片供需偏紧格局有望延续、价格仍在上涨周期。 #龙蟠科技\n把与宁德时代的年度采购上限由70亿元上调至90亿元。国家能源局表态智能微电网进入规模化阶段。海外看，日本三季度GDP年化环比萎缩0.1%，低于预期；美国2年期国债收益率上周一度飙升37个基点，10年期重回5%上方，本周焦点在美联储官员讲话与会议纪要。美军在中东再度形成三航母部署，原油事件风险仍在。\n#研报面 两小时更新\n中信证券今早发文，新版医保目录新增107种药品，其中1类创新药51种、数量创新高，CAR-T首次纳入，关注2027年商业化增量，与第一版提到的太 伴，如果他们的公司想要获得英伟达珍贵的 GPU 配额，就需要从客户那里拿到预付款。这将使他们的项目更容易融资，并确保英伟达不是唯一的资金支持来源。\n“你们没有按应有的价格收费，”他说，并告诉他们，埃隆·马斯克把英伟达芯片租给客户的价格比他们的更优惠。“我根本不需要你们。我可以把所有这些算力都给埃隆！埃隆想要！”据两位听到这番言论的高管和一位事后不久得知此事的高管透露，他这样说道。","en":"华尔街日报：英伟达作为 AI 经济“开放式支票簿”的日子屈指可数\n在英伟达大举为算力交易和初创企业投资提供资金的一段时期之后，临时 CEO 科莱特·克雷斯预计将收紧交易\n在担任英伟达 NVDA=首席执行官的最后一个季度里， 黄仁勋已在着手准备收缩该公司为 AI 经济提供后盾的做法。\n就在上个月，购买英伟达芯片并出租算力的新兴云公司的首席执行官们齐聚柏林，参加英伟达在欧洲举办的首屈一指的人工智能大会。黄仁勋在一次令一些人感到意外的讲话中传达的信息很明确：英伟达充当“敞开的支票簿”的日子已经结束。\n与会人士称，黄仁勋告诉合作伙伴，如果他们的公司想要获得英伟达珍贵的 GPU 配额，就需要从客户那里拿到预付款。这将使他们的项目更容易融资，并确保英伟达不是唯一的资金支持来源。\n“你们没有按应有的价格收费，”他说，并告诉他们，埃隆·马斯克把英伟达芯片租给客户的价格比他们的更优惠。“我根本不需要你们。我可以把所有这些算力都给埃隆！埃隆想要！”据两位听到这番言论的高管和一位事后不久得知此事的高管透露，他这样说道。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXNwFwjXIAECLGA.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122163434192240953","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":962},{"id":"2122163156990804463","h":"SCMPNews","ts":1794798099,"zh":"随着在泰国的外国人失去房屋，马来西亚吸引了富有的买家","en":"As foreigners in Thailand lose homes, Malaysia courts wealthy buyers","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122163156990804463","l":["sc.mp"],"ln":[{"u":"https://sc.mp/d9881","d":"sc.mp"}],"t":[],"lk":1,"rt":2,"rp":1,"vw":1002},{"id":"2122162857781645705","h":"Balder13946731","ts":1794798027,"zh":"🔮 Earnings Radar — week of Nov 16\n上榜：HD·NVDA·LOW·TGT·PANW·WMT·BABA\n最贵：HD 隐含价格为 5.2%，而典型价格为 2.0%——是通常价格的 2.6 倍。\n隐含与每只股票的实际表现，卡片中的最后 8 个反应👇","en":"🔮 Earnings Radar — week of Nov 16\nOn the board: HD · NVDA · LOW · TGT · PANW · WMT · BABA\nPriciest: HD at 5.2% implied vs a 2.0% typical move — 2.6x what it usually does.\nImplied vs what each stock actually does, last 8 reactions in the card 👇","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXNv3x2bcAApXBZ.jpg?name=orig"],"u":"https://x.com/Balder13946731/status/2122162857781645705","l":[],"ln":[],"t":["财报"],"lk":0,"rt":1,"rp":1,"vw":4048},{"id":"2122162788357255486","h":"bbcchinese","ts":1794798011,"zh":"这位出生于瓜德罗普（Guadeloupe 能把这个Ship快速复飞，并实现双级同时回收，星舰的真正价值才会完全释放。\n很震撼！","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2121715092903596032/vid/avc1/3840x2160/epNZoVwS39gePomx.mp4?tag=29"],"u":"https://x.com/qinbafrank/status/2122152724313845869","l":["x.com"],"ln":[{"u":"https://x.com/SpaceX/status/2121715216597827756/video/1","d":"x.com"}],"t":[],"lk":46,"rt":2,"rp":17,"vw":17130},{"id":"2122152687382712435","h":"business","ts":1794795603,"zh":"10月份中国住宅价格持续下跌，引发人们对最新刺激措施将在多大程度上提振低迷市场的疑问","en":"China’s residential prices continued to fall in October, raising questions over how much the latest stimulus measures will lift the sagging market","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122152687382712435","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/china-home-price-slump-drags-on-despite-latest-stimulus-push?taid=6afa6852d0eea100019b000b&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":2,"rp":3,"vw":15183},{"id":"2122152511180288016","h":"SCMPNews","ts":1794795561,"zh":"中国总理李强在马尼拉东盟峰会上发表讲话","en":"Chinese Premier Li Qiang addresses Asean summit in Manila","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122152511180288016","l":["sc.mp"],"ln":[{"u":"https://sc.mp/hdi1n","d":"sc.mp"}],"t":[],"lk":2,"rt":0,"rp":1,"vw":1355},{"id":"2122152463478513758","h":"fxtrader","ts":1794795549,"zh":"#全文 腾讯公开2026总办LinkTime现场笔记，号召AI时代再创业，“心态归零”。\n1、上船应战，准备新的打法，找到新的高地\n大航海时代，不进则退；工业革命，落后就挨打。现在进行的智能革命如果不投入拥抱，就是被颠覆。这是一个生死存亡的问题。\n随着算力的不断投入，AI无疑将带来范式的变革，渗透到更多行业只是时间问题。而且特点是变化速度很快，在短时间内就能实现指数级增长，也能快速去颠覆传统业务。在这个改变世界的技术里，我们要义不容辞冲在前面，坚定投入。\n和之前降本增效不同，上次是被动降本，这次是主动增效——AI native业务、模型和产品要逆流而上；所有业务都要面向AI时代再创业，实现效率和创造力的极致提升，也让我们给用户创造的价值再次提升。当下国内竞争激烈，AI变现尤其困难，更需要把我们处于AI前沿的身位和洞察放到业务里面。\n浪已经杀过来了。一些核心业务看起来地位稳固，但AI的进展飞快，远处的浪潮已经在吞没一个个山丘了，你不能还坐着欣赏。大家要着急，赶紧站起来准备新的打法，找到新的高地。陆战变海战，陆军变海军，大家都要搬运物资，转变技能，迅速上船应战。\n我们正在经历一个大格局的变化，选出能够适应新的打法和新的战场的人，必须干脆、直截了当。组织也要扁平化。核心业务原来是陆军守，要升级、提效，一半人负责守住，另一半人去打新的战役，一起用AI干更多的事。现在不是和平年代了，大家不能自以为站在高处很安全，或者等着人哄、谈好条件利益才上船。\n2、做以人为本的AI，能投是荣幸\n现在大家都关心AI会不会安全，会不会对人产生负面影响。我们有自己的核心价值观。这个世界需要多样化的AI，才能把AI变得安全。我们要做以人为本的AI：首先要坚持AI必须造福人类和社会；第二AI必须是由人控制的；第三，AI要让人的创造力得到赋能。这就是我们为什么要大力投入AI的原因。\n投入很大，是因为AI发展还在早期，当前所有基建和算力都需要自建，而且在所有人都投入的情况下，价格飞涨。但如果现在不投，以后可能连参与的机会也没有。但我们也非常务实，不仅看长期和全局，也要在能力范围看投入产出比，看到底能创造多少价值。\n某种程度上，可以说我们过去28年的存在就为了今天可以投入这样一个改变世界的技术潮流。不是每家公司都有机会加入，能够投入、参与这场巨大的科技变革，并且站在前沿，这是我们的荣幸。\n在这场全球变革里，我们相信这些投入肯定有回报。这个回报可能是我们AI原生业务不断发展，创造新的价值，也有可能是现有业务向AI时代更快再创业带来的增值。我们扎根于中国，我们拥有在性价比上竞争力很强的模型，如果我们让地球上各个地方的人都能用上AI，同时深刻改变各个行业，这将创造巨大的价值。\n3、我们的AI金字塔初见雏形，智能应用的开发刚刚开始\n我们的AI业务要一层层看。金字塔的核心是模型，现在我们已经进入国内第一梯队，接下来不断迭代，推动智能的成本指数级下降。小微是每个人的私人AI助理，随着能力的迅速增长，它的目标是让大家实现“token自由”。而元宝未来可以成为每个人决策和资讯的参谋。WorkBuddy就是你的员工，它在短短8个月内成为中国提供最多token的单一AI产品，展示了AI时代的生长速度。这些AI产品，可以覆盖用户每天的需求。\nWorkBuddy是我们AI native第一个跑出来的产品，也希望之后我们内部更多团队可以和AI有乘数效应，创造出更多新的AI native产品。\n现在AI在应用层面的开发才刚刚开始，如同工业化早期刚刚发明用电力来照明，还没有出现各种电器和把电力用于生产。未来更大的智能应用将发生在生产中，跟千行百业结合，还有很多机会值得我们投入。\n这个过程中，资源有限，注意力也有限，所以一定要找准定位，发挥我们的优势。\n4、心态归零，加快速度，提升要求，打破山头\n心态归零，所有核心业务每一个团队都要面向AI时代再创业，抛掉身上的包袱，拥抱AI新时代。所有人都要动手做事，整个组织有机化。每个人快速提升能力，每个组织重新变化、扁平化，以小团队为作战单元。\n打破过去的管理流程。整个管理方式以及做事方式都要通过AI重新设计，在现有业务上再延伸竞争力，让成本、效率可以再优化，获取更多的商业化能力，甚至创造出新的需求——它也许是现有路径上的新需求，也许是一个全新的AI产品。\n我们要加快速度，马上反馈，马上决策，马上行动；我们要提升对所有人的要求。重新组建混元团队的时候，一个重要的体会就是：人才密度的定义不只是你有多少特别有能耐的人，还取决于团队所有人的能力能否向上拉齐。\n组织变革要加快，未来不一定要那么多管理岗位，不要让中间传话的不想动还霸占地盘的干部成为阻碍，山头主义、地盘意识都要完全打破。很多基层同事很有动力和激情利用AI发挥自己的聪明才智，他们有机会成为一个非常好的贡献者，但是受制于很多旧有的架构和组织。我们要对此做更大的调整，让更多有机的小团队做大事，组织更灵敏地变化。\n5、所有人先动起来，在新的时代同努力，再出发\n先动起来才能找到机会。不动不改，走出第一步的勇气都没有的话，就没有未来了；什么都要问清楚才动身，也没机会。\n过去28年我们经历很多，很多次变革都非常惊险，是自上而下和自下而上合力的结果。这次也是一样。我们给更好的土壤、更好的机制，让有想法的员工能够从下面冒上来，一旦新业务培育成功，我们全力以赴支持，兄弟部门也全力支持，最终平台和用户大家都受益。\n只要我们真正动起来，全面拥抱这个新的时代变革，把腾讯的价值观做到极致，就可以克服困难，产生巨大的生产力。首先是我们的正直，“用户为本、科技向善”已经在腾讯扎根；第二很多团队都有很强的自下而上、由内而外的创造力和意愿，我们一定要把这种创造力发挥出来；第三是协作，公司很大，有部门墙，但在生死之战中，你帮我挡住后面，我帮你看住前面，协作自然就会出来。游戏、金融、安全等团队都把他们的能力跟模型进行了Co-Design，带来了Hy能力的提升，我们可以进行更多这样的参与和推动，同时再把混元的能力拉进自己的业务里，让业务有质的提升，创造新的场景；在进取这块，我们还可以更加进取。\n期待所有小伙伴们可以把焦虑转为兴奋，把等待和观望的情绪转换为全情投入，核心业务面向AI时代再创业，同时支持AI native模型、业务的发展，让我们腾讯的价值观在AI时代闪闪发光。","en":"#全文 腾讯公开2026总办LinkTime现场笔记，号召AI时代再创业，“心态归零”。\n1、上船应战，准备新的打法，找到新的高地\n大航海时代，不进则退；工业革命，落后就挨打。现在进行的智能革命如果不投入拥抱，就是被颠覆。这是一个生死存亡的问题。\n随着算力的不断投入，AI无疑将带来范式的变革，渗透到更多行业只是时间问题。而且特点是变化速度很快，在短时间内就能实现指数级增长，也能快速去颠覆传统业务。在这个改变世界的技术里，我们要义不容辞冲在前面，坚定投入。\n和之前降本增效不同，上次是被动降本，这次是主动增效——AI native业务、模型和产品要逆流而上；所有业务都要面向AI时代再创业，实现效率和创造力的极致提升，也让我们给用户创造的价值再次提升。当下国内竞争激烈，AI变现尤其困难，更需要把我们处于AI前沿的身位和洞察放到业务里面。\n浪已经杀过来了。一些核心业务看起来地位稳固，但AI的进展飞快，远处的浪潮已经在吞没一个个山丘了，你不能还坐着欣赏。大家要着急，赶紧站起来准备新的打法，找到新的高地。陆战变海战，陆军变海军，大家都要搬运物资，转变技能，迅速上船应战。\n我们正在经历一个大格局的变化，选出能够适应新的打法和新的战场的人，必须干脆、直截了当。组织也要扁平化。核心业务原来是陆军守，要升级、提效，一半人负责守住，另一半人去打新的战役，一起用AI干更多的事。现在不是和平年代了，大家不能自以为站在高处很安全，或者等着人哄、谈好条件利益才上船。\n2、做以人为本的AI，能投是荣幸\n现在大家都关心AI会不会安全，会不会对人产生负面影响。我们有自己的核心价值观。这个世界需要多样化的AI，才能把AI变得安全。我们要做以人为本的AI：首先要坚持AI必须造福人类和社会；第二AI必须是由人控制的；第三，AI要让人的创造力得到赋能。这就是我们为什么要大力投入AI的原因。\n投入很大，是因为AI发展还在早期，当前所有基建和算力都需要自建，而且在所有人都投入的情况下，价格飞涨。但如果现在不投，以后可能连参与的机会也没有。但我们也非常务实，不仅看长期和全局，也要在能力范围看投入产出比，看到底能创造多少价值。\n某种程度上，可以说我们过去28年的存在就为了今天可以投入这样一个改变世界的技术潮流。不是每家公司都有机会加入，能够投入、参与这场巨大的科技变革，并且站在前沿，这是我们的荣幸。\n在这场全球变革里，我们相信这些投入肯定有回报。这个回报可能是我们AI原生业务不断发展，创造新的价值，也有可能是现有业务向AI时代更快再创业带来的增值。我们扎根于中国，我们拥有在性价比上竞争力很强的模型，如果我们让地球上各个地方的人都能用上AI，同时深刻改变各个行业，这将创造巨大的价值。\n3、我们的AI金字塔初见雏形，智能应用的开发刚刚开始\n我们的AI业务要一层层看。金字塔的核心是模型，现在我们已经进入国内第一梯队，接下来不断迭代，推动智能的成本指数级下降。小微是每个人的私人AI助理，随着能力的迅速增长，它的目标是让大家实现“token自由”。而元宝未来可以成为每个人决策和资讯的参谋。WorkBuddy就是你的员工，它在短短8个月内成为中国提供最多token的单一AI产品，展示了AI时代的生长速度。这些AI产品，可以覆盖用户每天的需求。\nWorkBuddy是我们AI native第一个跑出来的产品，也希望之后我们内部更多团队可以和AI有乘数效应，创造出更多新的AI native产品。\n现在AI在应用层面的开发才刚刚开始，如同工业化早期刚刚发明用电力来照明，还没有出现各种电器和把电力用于生产。未来更大的智能应用将发生在生产中，跟千行百业结合，还有很多机会值得我们投入。\n这个过程中，资源有限，注意力也有限，所以一定要找准定位，发挥我们的优势。\n4、心态归零，加快速度，提升要求，打破山头\n心态归零，所有核心业务每一个团队都要面向AI时代再创业，抛掉身上的包袱，拥抱AI新时代。所有人都要动手做事，整个组织有机化。每个人快速提升能力，每个组织重新变化、扁平化，以小团队为作战单元。\n打破过去的管理流程。整个管理方式以及做事方式都要通过AI重新设计，在现有业务上再延伸竞争力，让成本、效率可以再优化，获取更多的商业化能力，甚至创造出新的需求——它也许是现有路径上的新需求，也许是一个全新的AI产品。\n我们要加快速度，马上反馈，马上决策，马上行动；我们要提升对所有人的要求。重新组建混元团队的时候，一个重要的体会就是 期，而投资意外恶化，中国10月份经济增长全面疲软，这表明北京最新的刺激措施尚未对经济产生影响。","en":"China’s growth weakened across the board in October as consumption and industrial output undershot expectations while investment unexpectedly worsened, in a sign Beijing’s latest stimulus measures have yet to feed through to the economy.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122151431591354705","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/china-s-economy-weakens-more-than-forecast-despite-stimulus-push?taid=6afa6727718669000140b6e4&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":2,"rt":1,"rp":2,"vw":8748},{"id":"2122150587311780227","h":"cnfinancewatch","ts":1794795102,"zh":"书法家长寿！好像有道理？","en":"书法家长寿！好像有道理？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122150587311780227","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":694},{"id":"2122150171450437737","h":"business","ts":1794795003,"zh":"随着新员工的全球扩张，高频交易公司 Graviton 新加坡子公司的利润几乎增长了两倍，将其 39 岁的印度创始人变成了亿万富翁 ionaires?taid=6afa65fbd0eea100019afff8&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"High-frequency trading firm Graviton nearly tripled profits at its Singapore-based unit as it expands globally with new hires, turning its 39-year-old Indian founders into billionaires","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122150171450437737","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/hft-firm-graviton-s-singapore-profit-surge-makes-indian-founders-billionaires?taid=6afa65fbd0eea100019afff8&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":2,"rp":5,"vw":12195},{"id":"2122148315311858165","h":"cnfinancewatch","ts":1794794560,"zh":"传说苏东坡爱字如命。\n那一晚，他忽然想起“剑”字该怎么写。\n不是平日里随意的临帖，是心里那一笔忽然清了。横竖撇捺，每一处转折都该落在什么地方，他躺在榻上，越想越清楚，越清楚越坐不住。\n正好，约了一歌姬，不好把别人撂在那儿！\n姑娘进门，沐浴更衣，妆未卸，人已躺平。东坡也不多言，只取了墨，就在她胸口起了第一笔。\n他写得很慢。第一笔横，墨色还浓；第二笔竖，他已觉肩头太窄，转腕不顺。写完一个“剑”，他盯着看了片刻，自己摇头，唤人端水来，用软布把胸口的字轻轻拭去，只留淡淡一痕。然后又写。这一次他换了位置，写在她背上。背比胸宽，他可以慢慢拉开笔势。可写到“刀”字旁时，他忽然觉得那一撇太浮，不像从骨里生出来的。他又洗掉，重新来过。\n一整夜，他都在她身上写字。写了，看，不满意，便洗。洗干净了，再写。有时写在手臂，有时写在腰侧，有时甚至写在她锁骨与胸口之间那一小块平坦处。墨干了又湿，湿了又干，姑娘身上的皮肤被软布反复擦拭，渐渐发红。她起初还等着他有别的动作，后来只是侧躺着，任他翻来覆去地摆弄。东坡始终没有碰她别的地方。他只写“剑”字。\n天亮时，他写到第十七个。墨已淡，人已倦，可那一笔他还是没写完。他停下来，看着姑娘背上最后那个未完的字，忽然觉得，这个“剑”字今夜是写不成了。他放下笔，把剩下的墨洗干净，付了钱，让人送她回去。\n后来有人问他，那一晚到底写了些什么。东坡只说：“写了，洗了，又写了。”问的人以为他在打趣，他却认真得很。在他看来，字没写好，便不算写过。\n写不好的字留在纸上，是污了纸；留在人身上，是污了人。洗掉重来，不过是把污处重新变成干净的地方，好让下一次的笔能落得端正。\n他一生都是这样。被贬黄州的那些年，他写字写到半夜，纸用完了，便写在竹上，写在墙上，写在自己手掌心里。写完不满意，便用水洗掉，再写。有一回他写到天明，掌心被水泡得发白，字却还是没写好。旁人劝他将就着，他只说：“将就着写出来的字，不是我的字。”\n那一晚他什么也没做。不是他不想，是他觉得，字没写完，人便还没干净。干净了，才能再写。写不好，便只能再洗。洗到天亮，字还是没写完，他便什么都没做成。\n他后来老了，还是这样。\n有时夜里忽然想起某个字该怎么写，便独自坐到天明。墨干了，水凉了，字却始终没落下去。他也不着急。在他看来，字没写好之前，一切都还来得及。来得及洗，也来得及再写。写不好的，便不算写过。不算写过的，便还不脏。","en":"传说苏东坡爱字如命。\n那一晚，他忽然想起“剑”字该怎么写。\n不是平日里随意的临帖，是心里那一笔忽然清了。横竖撇捺，每一处转折都该落在什么地方，他躺在榻上，越想越清楚，越清楚越坐不住。\n正好，约了一歌姬，不好把别人撂在那儿！\n姑娘进门，沐浴更衣，妆未卸，人已躺平。东坡也不多言，只取了墨，就在她胸口起了第一笔。\n他写得很慢。第一笔横，墨色还浓；第二笔竖，他已觉肩头太窄，转腕不顺。写完一个“剑”，他盯着看了片刻，自己摇头，唤人端水来，用软布把胸口的字轻轻拭去，只留淡淡一痕。然后又写。这一次他换了位置，写在她背上。背比胸宽，他可以慢慢拉开笔势。可写到“刀”字旁时，他忽然觉得那一撇太浮，不像从骨里生出来的。他又洗掉，重新来过。\n一整夜，他都在她身上写字。写了，看，不满意，便洗。洗干净了，再写。有时写在手臂，有时写在腰侧，有时甚至写在她锁骨与胸口之间那一小块平坦处。墨干了又湿，湿了又干，姑娘身上的皮肤被软布反复擦拭，渐渐发红。她起初还等着他有别的动作，后来只是侧躺着，任他翻来覆去地摆弄。东坡始终没有碰她别的地方。他只写“剑”字。\n天亮时，他写到第十七个。墨已淡，人已倦，可那一笔他还是没写完。他停下来，看着姑娘背上最后那个未完的字，忽然觉得，这个“剑”字今夜是写不成了。他放下笔，把剩下的墨洗干净，付了钱，让人送她回去。\n后来有人问他，那一晚到底写了些什么。东坡只说：“写了，洗了，又写了。”问的人以为他在打趣，他却认真得很。在他看来，字没写好，便不算写过。\n写不好的字留在纸上，是污了纸；留在人身上，是污了人。洗掉重来，不过是把污处重新变成干净的地方，好让下一次的笔能落得端正。\n他一生都是这样。被贬黄州的那些年，他写字写到半夜，纸用完了，便写在竹上，写在墙上，写在自己手掌心里。写完不满意，便用水洗掉，再写。有一回他写到天明，掌心被水泡得发白，字却还是没写好。旁人劝他将就着，他只说：“将就着写出来的字，不是我的字。”\n那一晚他什么也没做。不是他不想，是他觉得，字没写完，人便还没干净。干净了，才能再写。写不好，便只能再洗。洗到天亮，字还是没写完，他便什么都没做成。\n他后来老了，还是这样。\n有时夜里忽然想起某个字该怎么写，便独自坐到天明。墨干了，水凉了，字却始终没落下去。他也不着急。在他看来，字没写好之前，一切都还来得及。来得及洗，也来得及再写。写不好的，便不算写过。不算写过的，便还不脏。","zh_src":"native","lang":"zh","m":[],"u":"https://x.co "u":"https://x.com/cnfinancewatch/status/2122138923967414561","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2122138761832411257","h":"qinbafrank","ts":1794792282,"zh":"老黄讨论回归，贝森特说英伟达必须从外部寻找CEO。这怎么看？\n1、金融时报说老黄已与亲信讨论了回归的可能性，\n他们正在组建一个由硅谷高管组成的“作战室”，以游说支持前英伟达负责人的回归，并将试图争取白宫的支持；\n而就在同一时间，财政部长贝森特表态称赞黄仁勋是“了不起的创新者”，英伟达也非常出色。但同时他要求英伟达董事会及外部律师必须在“未来10天内”就公司出口限制合规文化作出答复。\n在管理层问题上，他直言英伟达领导层需要“大幅调整”，并建议公司应当寻找外部人士来担任新CEO。此外，他还指出，上级与下属建立恋爱关系是“企业大忌”。\n2、只能说支持和反对的声音都很大。以老马为首的一众美国科技大佬，还有英伟达内部大部分员工都是强烈支持老黄，其实英伟达这些机构股东们例如贝莱德、富达、先锋和到富等机构，估计也都希望老黄回归，不然受损都是自己的账户、大部分资本还是求利。估计产业生态大部分伏击也都支持，毕竟很多都是一损俱损。\n当然前提条件就是如果要回归：老黄得严格遵守新的芯片出口条例，只能埋头技术发展，别在妄图钻政策空子，同时保持低调甚至避免跟川普的直接沟通。\n3、另外一点就是贝森特的表态也说明了共和党内“倒黄”并不是说的就是鲁比奥一人所为，还是之前的观点这是多股力量的合力。\n但也意味着回归之路会艰难和坎坷，反对的态度比较坚挺。“倒黄”派既担心老黄回归之后故伎重演，又担心他去影响川普的态度和判断。\n这中间的博弈估计是反复多次，还有本周的国会听证会。\n这期间英伟达的估计估计会随着老黄能回归和回归希望被打消这个两个状态之间反复，上上次下好几次也很有可能。\n最后如果确定老黄真能回归（回归身份最好是CEO、其次是董事会主席、最差得是个顾问），可能才会迎来反转。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"老黄讨论回归，贝森特说英伟达必须从外部寻找CEO。这怎么看？\n1、金融时报说老黄已与亲信讨论了回归的可能性，\n他们正在组建一个由硅谷高管组成的“作战室”，以游说支持前英伟达负责人的回归，并将试图争取白宫的支持；\n而就在同一时间，财政部长贝森特表态称赞黄仁勋是“了不起的创新者”，英伟达也非常出色。但同时他要求英伟达董事会及外部律师必须在“未来10天内”就公司出口限制合规文化作出答复。\n在管理层问题上，他直言英伟达领导层需要“大幅调整”，并建议公司应当寻找外部人士来担任新CEO。此外，他还指出，上级与下属建立恋爱关系是“企业大忌”。\n2、只能说支持和反对的声音都很大。以老马为首的一众美国科技大佬，还有英伟达内部大部分员工都是强烈支持老黄，其实英伟达这些机构股东们例如贝莱德、富达、先锋和到富等机构，估计也都希望老黄回归，不然受损都是自己的账户、大部分资本还是求利。估计产业生态大部分伏击也都支持，毕竟很多都是一损俱损。\n当然前提条件就是如果要回归：老黄得严格遵守新的芯片出口条例，只能埋头技术发展，别在妄图钻政策空子，同时保持低调甚至避免跟川普的直接沟通。\n3、另外一点就是贝森特的表态也说明了共和党内“倒黄”并不是说的就是鲁比奥一人所为，还是之前的观点这是多股力量的合力。\n但也意味着回归之路会艰难和坎坷，反对的态度比较坚挺。“倒黄”派既担心老黄回归之后故伎重演，又担心他去影响川普的态度和判断。\n这中间的博弈估计是反复多次，还有本周的国会听证会。\n这期间英伟达的估计估计会随着老黄能回归和回归希望被打消这个两个状态之间反复，上上次下好几次也很有可能。\n最后如果确定老黄真能回归（回归身份最好是CEO、其次是董事会主席、最差得是个顾问），可能才会迎来反转。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXNZ9Kzb0AAQQxF.jpg?name=orig","https://pbs.twimg.com/media/HXNZ9K2bAAAlbDb.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122138761832411257","l":[],"ln":[],"t":["美股","AI科技"]," 为云签有2亿元环卫具身智能合同。11月15日中午另一篇把亿嘉和称作“华为机器人版的赛力斯”，依据是今年7月的合作备忘录：华为云提供大小脑平台，亿嘉和负责设计制造。还有调研纪要帖讲拓斯达人形机器人工业落地。社区的逻辑很清晰：发布会是确定日程，标的辨识度够高。\n第二类是多点开花的题材映射。周日早间有商业航天帖，讲星舰上面级首次被“筷子”捕获，作者自己也写了“主要是情绪映射”，并注明助推器回收失败。周日中午有物理AI产业拐点长文，周五还有帖子讨论美国新规草案对远程算力的限制，推出“GPU维保”这类后市场支线；后者依据是“流出的草案”，我们未能核实，只能当作传闻看。另有周末资讯汇总帖提到周五“4000多家下跌”，逆势方向是影视院线、国产替代与华为机器人，还提到BLG夺得英雄联盟全球总决赛冠军，给电竞与游戏添了一个周末话题。\n第三类是宏观被压缩成一行字。周日晚的周末研报精选里，“美银预计连续三次加息”“外汇存款准备金率今起由4%提高至6%”排在宏观第一、第二条，但在首页可见摘要中，几乎没有帖子讨论今天上午10点的10月经济数据，也较少看到新版医保目录的个股梳理。\n与券商口径的异同：相同点是都承认机器人、院线是周五的逆势方向；不同点是社区把华为发布会当成“周一主线”，而券商框架更看重上午的宏观数据与周二英伟达财报。被忽略的风险有三：一是亿嘉和上周二已出现开盘快速涨停，发布会当天容易兑现，赛力斯类比只是作者推断，并非合作条款；二是周五机器人龙头已批量跌停，高低切换后再回头接力，亏钱效应可能二次放大；三是吴清提到要优化量化与减持制度规则，清朗专帖仍在置顶，个股吹票帖要打折看。\n海外：一边看空英伟达，一边排队买Anthropic\nWallStreetBets方面（StonkHub统计，二手）：过去7天有1093名WSB用户讨论英伟达，提及1515次，较昨日午间看到的1064人略增；全Reddit口径下看空41%、看多37.8%、中性21.5%，看空略占上风，分类器平均置信度只有66%，不宜过度解读。检索到的二手汇总显示，对Anthropic上市的讨论里质疑估值、护城河与现金消耗的声音较多，但我们未能逐条核看原帖，不作量化。\nStocktwits方面：个股页实时情绪未能打开。能核验的是11月12日官方新闻稿（二手、非当日实时）：当时英伟达散户情绪为“极度看多”，站内投票58%选择抄底、42%回避，当周消息量增约593%。WSB偏空与Stocktwits偏多并不矛盾，前者更多是期权玩家在押财报波动，后者是持股者在摊低成本。\n专业资金那边，口径更谨慎。已核实：Semafor称Anthropic认购约6倍，但AI“卖铲子”公司自6月以来市值已蒸发约4.2万亿美元；分析师提醒，英伟达周二财报若不及预期，会给周四的上市蒙上阴影。分析师丹·艾维斯（Yorkville Ives）仍预期财报需求指标较上季加速。散户容易忽略的是：英伟达与Anthropic已绑在一起，上市后英伟达预计向其投资约100亿美元，两件事不是独立的两次机会，而是同一笔AI风险敞口。\n小结：国内散户押一场发布会，海外散户押一份财报，共同的风险都是“事件当天兑现”。追高之前，先想清楚自己赌的是消息本身，还是消息之后还有没有人接力。\n风险提示：以上为公开讨论整理，二手口径已标注，不构成投资建议。","en":"散户热议｜2026-11-16·早间\n数据时点：国内社区浏览截至北京时间11月16日07:50；海外讨论覆盖至美东11月15日晚。国内部分直接打开了韭研公社首页，引用的是公开可见的帖子标题与摘要，帖子正文多需登录，未能全文引用。Reddit与Stocktwits个股页未能直接抓取实时情绪，海外部分改用StonkHub对WSB的统计与Stocktwits已刊新闻稿，均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周一的剧本几乎写给了华为机器人\n周一早上打开韭研公社，置顶依旧是长韭杯实盘大赛、站规与“打击吹票等不良行为”专帖。往下翻，最集中的话题只有一个：今天下午的华为云CloudRobo发布会。\n第一类是华为具身智能的标的梳理。11月14日晚的帖子按合作深度列出亿嘉和、拓斯达、福龙马、埃夫特、软通动力，摘要写明亿嘉和为“深化合作伙伴”、福龙马与华为云签有2亿元环卫具身智能合同。11月15日中午另一篇把亿嘉和称作“华为机器人版的赛力斯”，依据是今年7月的合作备忘录：华为云提供大小脑平台，亿嘉和负责设计制造。还有调研纪要帖讲拓斯达人形机器人工业落地。社区的逻辑很清晰：发布会是确定日程，标的辨识度够高。\n第二类是多点开花的题材映射。周日早间有商业航天帖，讲星舰上面级首次被“筷子”捕获，作者自己也写了“主要是情绪映射”，并注明助推器回收失败。 债了。\n4. 晒不到太阳，不是防晒做得好，是骨头在悄悄变成脆脆鲨。阳光不要钱，钙片要。\n5. 久坐不动，不是省体力，是让新陈代谢提前退休。你坐着，代谢躺着，最后一起摆烂。\n6. 腹部变大不是怀孕，是压力怀了脂肪，久坐给它接生，熬夜给它上户口。\n7. 总觉得自己老了，不是成熟，是给身体发指令：收到，开始老化。身体执行力强得可怕。\n虚弱从来不是突然发生的，是你每天亲手给它续费，最后它自动扣款。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122114737928573166","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":1,"vw":661},{"id":"2122114619456344098","h":"cnfinancewatch","ts":1794786526,"zh":"华尔街观察｜SPY真正的抄底密码，给你一把超额收割标普的金钥匙。\n免责声明：本文基于公开回测数据整理，仅为技术思路探讨，不构成任何投资建议。DYOR，自主决策。\n很多老股民抄底，习惯死等RSI跌到30以下，认定深度超卖就是底部。这份对标普500ETF（SPY）的逆向复盘，直接推翻了这个流传多年的惯性思维。\n我不纠结哪个指标事后好看，选择倒推底部。提取近两年501根SPY日线，筛选出：10个交易日内反弹5%以上的7个关键低点，以及下跌超5%的3个阶段高点。把13个常用技术指标，在每一个转折点的数值全部扒出来，和普通交易日的数据做对比，看看底部降临那一刻，指标真实读数到底是什么。\n先说最震撼的结论：布林极限%B（%BB）完胜一众传统指标。\n简单讲人话解释%B：布林带大家都熟，上轨、中轨、下轨三条线。%B就是把价格在布林带里的位置换算成数字。\n1=碰到上轨，0=碰到下轨，小于0代表收盘价已经跌到布林下轨的外面。\n回测结果：7个有效底部里面6个，拐点收盘%B＜0.15，命中率86%。而阶段顶部，没有一例出现这个信号。平日里，只有7%的普通交易日，才会跌到这个区间。\n再把几个热门指标的底部中位数值摊开，一看差距就出来了：\n1. MACD柱：‑2.80，普通行情+0.42。灵敏度够，但是噪音巨大，接近一半都是假信号，容易被反复打脸。\n2. 布林%B：0.11，普通行情0.67。信号最干净，本次回测最强单一过滤器。\n3. KDJ的K值：16，普通行情83；D值：21，普通行情83。\n4. RSI14：真实底部中位数39.6，而不是大家迷信的30！\n暴论来了：死守RSI＜30抄底，仅仅捕捉到29%的市场真实底部。一味等待更深的超卖，只会眼睁睁错过绝大多数反弹行情。过度苛求极致恐慌，反而踏空。\n经过复盘，提炼出三套可直接拿去实践的交易规则，按保守到激进排序：\n✅方案一（简洁版）：布林%B低于0.15。胜率最高的单一条件，适合喜欢简单粗暴的交易者。\n✅方案二（降噪版）：%B＜0.15 + 现价在50日均线下方。保留绝大多数底部机会，进一步过滤杂波，减少无效试错。\n✅方案三（极致保守）：RSI＜35 并且%B＜0.15。虽然仅抓到29%的底部，但是本次样本零假信号。信号很少，一旦触发，博弈反弹的置信度极高。\n拿近期历史信号印证：\n2026‑07‑29，%B‑0.16，后续反弹6.1%\n2026‑06‑26，%B0.14，后续反弹5.0%\n2026‑03‑30，%B‑0.02，后续反弹7.6%\n最后讲最关键的短板，避免大家无脑神话这套法则。\n样本只有7个底部，数量偏小；观察周期整体处于牛市环境，没有经历深度熊市的严酷考验。9月曾4次触发%B的低位，却没能走出5%的反弹。\n定位要清晰：%B跌到0.15以下，代表市场进入洗盘区，是恐慌充分释放的预警，不等于底部已经100%确认。\n我已经搭建自动化脚本，实时监控该触发器，一旦洗盘信号出现，自动推送提醒到Slack。后续拉长时间样本，继续验证这套择时体系的长期有效性。\n技术分析没有圣杯，逆向复盘的意义，就是打破教科书的刻板教条，跳出网上流传的口诀，去看一看市场拐点发生的那一刻，真相究竟是什么。\n觉得有用可以收藏，以后恐慌下跌的时候，别再死盯着RSI30，多看一看布林极限%B的位置。","en":"华尔街观察｜SPY真正的抄底密码，给你一把超额收割标普的金钥匙。\n免责声明：本文基于公开回测数据整理，仅为技术思路探讨，不构成任何投资建议。DYOR，自主决策。\n很多老股民抄底，习惯死等RSI跌到30以下，认定深度超卖就是底部。这份对标普500ETF（SPY）的逆向复盘，直接推翻了这个流传多年的惯性思维。\n我不纠结哪个指标 ，字节正在打通一套全球独一无二的闭环：\n海量网文IP沉淀（番茄小说）→ 零成本爆款剧本库 → 抖音全域流量测试 → Seedance视频大模型AI制片 → 红果短剧+海外PineDrama全球变现\n这套体系，实现了史无前例的三低革命：\n极低剧本成本、极低拍摄制作成本、极低全球获客成本。\n传统影视最大的成本：编剧、明星、剧组、场地、后期、宣发，几乎全部被AI模型清零。\n这是降维打击，不是行业竞争。\n当前短剧板块，在字节整体收入占比不足3%，属于边缘业务。\n但未来3-4年，这套海内外联动的AI短剧生态，极有望为字节新增400-500亿美元年化收入。\n什么概念？\n等同于再造四分之一个字节，体量对标当下 OpenAI + Anthropic 的总和。\n这也是为什么海外VC至今没有完全看懂：\n他们习惯了好莱坞、流媒体、长视频的传统估值逻辑，完全看不懂AI工业化内容的爆发势能。\n二、为什么短剧在国内能彻底打爆？是人性，不是流量\n很多人把短剧爆火归结为“碎片化娱乐”，这是浅层认知。\n短剧真正的底层逻辑，是当代高压社会的情绪补位。\n过去几十年，国人娱乐供给长期单一、严肃、压抑；社会长期内卷、高强度工作、精神紧绷。\n大众内心天然极度渴求高密度、高反馈、强情绪释放的内容。\n传统院线电影、主流影视剧，越来越脱离普通人的情绪需求：叙事拖沓、价值观说教、剧情悬浮、缺乏爽感。\n而网文衍生的短剧体系，精准击中人性刚需：\n高节奏、强反转、即时反馈、情绪拉满、解压治愈。\n不是短剧太“俗”，而是传统文娱太久不懂普通人。\n短剧的胜利，是情绪价值对艺术说教的胜利，是大众解压需求对精英叙事的替代。\n三、下一步：AI画质趋近真人，全球影视体系面临降维击穿\n更恐怖的拐点，将在未来1-2年彻底到来。\nAI视频模型的画质、光影、人物动态、细节真实度，将无限逼近真人实拍。\n届时，观众对AI内容的心理壁垒会彻底消失，只剩极致的沉浸体验。\n放眼全球，传统娱乐巨头早已外强中干：\n• 全球电影总票房：约330亿美元\n• Netflix全年营收：约510亿美元\n• YouTube广告收入：约600亿美元\n• 迪士尼视频业务：约250亿美元\n• 华纳HBO体系：约120亿美元\n这些盘踞全球几十年的超级巨头，未来都会成为字节AI短剧生态的替代对象。\n依托极致低成本工业化优势，字节可以全面覆盖欧亚非拉非英语市场，击穿全球中低端影视剧市场，刚性抢占350-400亿美元全球娱乐份额。\n除此之外，全球创作者持续调用字节Seedance大模型生产内容，还能为公司稳定带来百亿级别的模型工具收入。\n一鱼双吃：内容变现+模型算力变现。\n四、美国影视巨头几乎无解：体制锁死，无法转身\n为什么这场革命，只能由中国公司完成？\n好莱坞、美国影视行业，被两大枷锁彻底锁死：\n1. 极致复杂的版权诉讼体系\n2. 强大的演员工会、编剧工会体制束缚\n任何AI替代拍摄、AI替代演员、AI改编剧本的尝试，都会遭遇集体诉讼、罢工、制度阻力。\n美国文娱体系，已经没有颠覆性迭代的制度空间。\n而国内市场化充分、迭代极快、生态灵活，率先完成AI内容工业化跑通。\n随之而来的，是全球低端剧组、普通演员、传统制作人员的失业潮。\n国内已经提前上演：横店棚控率暴跌、中小剧组大量倒闭、群演岗位锐减、传统长剧开机量断崖下滑。\n这是一次AI对传统文娱劳动力的系统性替代，不可逆、不可挡。\n五、时代感慨：AI工业化时代，真正的顶级IP终将被重制\n从网文时代的《无限恐怖》《阳神》《龙蛇演义》开始，整整一代人的审美、热血、世界观，都由国产网文构建。\n过去受限于拍摄技术、资金、特效、剧本能力，这些顶级神作始终无法完美影视化。\n但现在，AI视频大模型彻底打破所有制作枷锁。\n未来唯一的悬念只剩一个：\n何时会有顶尖创作者，突破传统版权桎梏，用AI 1:1完美还原《无限恐怖》《杀戮都市》这类殿堂级神作？\n当顶级世界观 + AI无限生产力相遇，\n新一轮全球文娱审美颠覆，才刚刚真正开始。","en":"深度产业洞察：AI短剧颠覆全球娱乐，字节开启400亿美金新增收入时代\n当下中国文娱产业，正在发生一场绝大多数人低估的结构性革命。\n传统电影、长视频、好莱坞体系，维持了几十年的内容霸权，正在被一种全新的、AI工业化、极致低成本的内容模式快速瓦解。\n核心标志性数据极具冲击力：\n2026年红果短剧年化收入已无限逼近400亿级别。\n而整个中国院线电影，全年总票房规模也仅在520亿左右。\n一个诞生仅仅数年的互联网内容产品，单一平台体量，已经快要追上全国电影工业几十年积累的总盘子。\n这不是短暂热度，是新旧娱乐时代的正式交接。\n按照当前增速线性外推，2027年AI短剧的产 t of what's moving markets in China and around the world. Plus, a weekend edition.","en":"今日必读\n👜硅谷盟友推动黄仁勋重返公司\n🎒美伊冲突“非战非和”僵局难破\n👝美国老旧航空管理系统再敲警钟\n获取免费中文电子报《彭博财经早茶》与音频播报，聚焦中国与全球市场最新动向，并有周末特别推送。\nA daily Chinese-language briefing and audio broadcast of what's moving markets in China and around the world. Plus, a weekend edition.","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/business/status/2122113368584491389","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/account/newsletters/china-markets?taid=6afa43b48a00c900012277ea&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":0,"rp":0,"vw":13410},{"id":"2122112718627078363","h":"cnfinancewatch","ts":1794786073,"zh":"热点财经新闻综述｜2026-11-16·早间\n数据时点：A股为11月13日（周五）收盘，美股为美东11月13日收盘；周末与隔夜消息整理截至北京时间11月16日07:50。本期邮箱新增一封热点财经邮件（11月15日晚间版），11月16日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照官方或主流媒体公开报道。晚间邮件里写作“今日涨停”的个股，实为周五盘面，周末沪深休市。\n今日判断\n周一开盘前，最硬的变量不在题材里，而在两个日程上：上午9:30的70城房价、10:00的10月工业、社零、固投与地产数据（国新办发布会已核实），以及本周二美股盘后英伟达首份“后黄仁勋”财报、周三晚Anthropic定价。隔夜美股期货小幅走高，纳指100期货涨约0.6%，恒指期货略高于周五收盘，外盘没有给出恐慌信号。我们对今天的基调是：数据落地前不抢跑，创新药与院线首板方向可以持有观察，算力硬件等到周二财报再决定，高位连板继续回避。\n三大利多方向（由强到弱）\n一、医保目录落地，创新药拿到确定性的放量通道。已核实：国家医保局与人社部11月14日发布2026年版目录，新增107种药品，其中51个为1类创新药，数量创新高；商保创新药目录新增12种，合计28种，2027年1月1日起执行。恒瑞医药、复星医药、首药控股、艾力斯、京新药业等已公告相关品种纳入或续约。为什么重要：这是基本面事件，不靠情绪接力，对已有商业化产品的创新药企是收入兑现，对CXO是间接景气。制约：谈判降价幅度决定利润弹性，部分品种市场早有预期，开盘高开过多反而要防兑现。\n二、票房破320亿，院线从题材回到数据。已核实：截至11月15日，2026年度电影总票房（含预售）突破320亿元，年度前五均为国产片。邮件转述：周五幸福蓝海20%涨停，中国电影、横店影视、儒意电影集体首板。票房给院线涨停群提供了基本面注脚，比单纯的AI短剧概念更扎实。对投资的意味：院线权重可以作为短剧情绪的“低位替身”，但文投控股这类十几天九板的高位品种，与院线首板不是一回事。\n三、产业日程密集，给中低位题材提供催化。已核实：发改委、能源局印发“十五五”新型储能实施方案，2030年装机目标3亿千瓦；华为云CloudRobo具身世界模型发布会今天14:00线上举行，将发布昇腾原生模型；APEC工商领导人峰会17日至18日、领导人非正式会议18日至19日在深圳举行。储能是政策写明的数量目标，持续性最强；具身智能是事件驱动，发布会当天容易“利好兑现”；APEC更多是情绪与外资预期层面的支撑。\n三大利空方向（由强到弱）\n一、英伟达财报与Anthropic上市，本周AI链是二元事件。已核实：英伟达将于美东11月17日盘后发布财报，临时CEO克雷斯首次面对市场；Anthropic价格区间70至78美元，计划11月18日定价、19日以ANT代码上市，认购约6倍。黄仁勋辞职后英伟达上周跌约13%。邮件转述：索罗斯基金三季度减持英伟达、高毅清仓多只AI硬件股，这是13F类季度持仓，反映的是过去三个月，不能当成本周的资金流向。对谁不利：中际旭创、东山精密等北美算力链，周五已领跌。制约：若指引稳住，超跌反弹会很快，所以这里是“等结果”，而不是“继续空”。\n二、海外加息预期抬升，压制高估值成长。已核实：美国10月PPI同比6.5%，为2022年11月以来最大；美银将预测改为12月、明年1月和3月连续三次加息，联邦基金利率区间升至4.50%至4.75%；波士顿联储柯林斯支持渐进加息。邮件转述：黄金或录得六月来最大单周跌幅。传导路径是美债利率与美元走强，通过分母端压制A股成长估值，相对利好银行等低估值方向。另据已核实信息，伊朗周日称以无人机袭击巴林美军基地，巴林称已全部拦截、美军无受损；IEA则预计四季度全球石油日均过剩约170万桶。地缘推升避险、供给过剩压油价，两股力量对石油板块是对冲，不构成单边主线。\n三、高位题材退潮叠加个股治理风险。邮件转述：周五阳光照明、闽发铝业、大东方等高位连板股跌停，襄阳轴承等中位股跟跌。已核实：南卫股份公告实控人李平因涉嫌内幕交易罪被刑事拘留，公司称控制权未变、经营正常；证监会主席吴清11月14日表示将研究优化量化交易、股份减持等制度。监管语境下，高位接力的赔率继续变差；而“稳市长效机制”更多托住的是指数，而不是题材连板。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"热点财经新闻综述｜2026-11-16·早间\n数据时点：A股为11月13日（周五）收盘，美股为美东11月13日收盘；周末与隔夜消息整理截至北京时间11月16日07:50。本期邮箱新增一封热点财经邮件（11月15日晚间版），11月16日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照官方或主流媒体公开报道。晚间邮件里写作“今日涨停”的个股，实为周五盘面，周末沪深休市。\n今日判断\n周一开盘前，最硬的变量不在题材里，而在两个日程上：上午9:30的70城房价、10:00的10月工业、社零、固投与地产数据（国新办发布会已核实），以及本周二美股盘后英伟达首份“后黄仁勋”财报、周三晚Anthropic定价。隔夜美股期货小幅走高，纳指100期货涨约0.6%，恒指期货略高于周五收盘，外盘没有给出恐慌信号。我们对今天的基调是：数据落地前不抢跑，创新药与院线首板方向可以持有观察，算力硬件等到周二财报再决定，高位连板继续回避。\n三大利多方向（由强到弱）\n一、医保目录落地，创新药拿到确定性的放量通道。已核实：国家医保局与人社部11月14日发布2026年版目录，新增107种药品，其中51个为1类创新药，数量创新高；商保创新药目录新增12种，合计28种，2027年1月1日起执行。恒瑞医药、复星医药、首药控股、艾力斯、京新药业等已公告相关品种纳入或续约。为什么重要：这是基本面事件，不靠情绪接力，对已有商业化产品的创新药企是收入兑现，对CXO是间接景气。制约：谈判降价幅度决定利润弹性，部分品种市场早有预期，开盘高开过多反而要防兑现。\n二、票房破320亿，院线从题材回到数据。已核实：截至11月15日，2026年度电影总票房（含预售）突破320亿元，年度前五均为国产片。邮件转述：周五幸福蓝海20%涨停，中国电影、横店影视、儒意电影集体首板。票房给院线涨停群提供了基本面注脚，比单纯的AI短剧概念更扎实。对投资的意味：院线权重可以作为短剧情绪的“低位替身”，但文投控股这类十几天九板的高位品种，与院线首板不是一回事。\n三、产业日程密集，给中低位题材提供催化。已核实：发改委、能源局印发“十五五”新型储能实施方案，2030年装机目标3亿千瓦；华为云CloudRobo具身世界模型发布会今天14:00线上举行，将发布昇腾原生模型；APEC工商领导人峰会17日至18日、领导人非正式会议18日至19日在深圳举行。储能是政策写明的数量目标，持续性最强；具身智能是事件驱动，发布会当天容易“利好兑现”；APEC更多是情绪与外资预期层面的支撑。\n三大利空方向（由强到弱）\n一、英伟达财报与Anthropic上市，本周AI链是二元事件。已核实：英伟达将于美东11月17日盘后发布财报，临时CEO克雷斯首次面对市场；Anthropic价格区间70至78美元，计划11月18日定价、19日以ANT代码上市，认购约6倍。黄仁勋辞职后英伟达上周跌约13%。邮件转述：索罗斯基金三季度减持英伟达、高毅清仓多只AI硬件股，这是13F类季度持仓，反映的是过去三个月，不能当成本周的资金流向。对谁不利：中际旭创、东山精密等北美算力链，周五已领跌。制约：若指引稳住，超跌反弹会很快，所以这里是“等结果”，而不是“继续空”。\n二、海外加息预期抬升，压制高估值成长。已核实 const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
