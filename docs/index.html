62890","h":"SCMPNews","ts":1794927497,"zh":"贸易协议、稀土和四方复兴：特朗普亚洲之行的第一天","en":"A trade deal, rare earths and a Quad revival: day 1 of Trump’s Asia trip","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122705892819062890","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/china/diplomacy/article/3374794/trade-deal-rare-earths-and-quad-revival-day-1-trumps-asia-trip","d":"scmp.com"}],"t":["关税贸易"],"lk":1,"rt":0,"rp":0,"vw":1195},{"id":"2122705107322032285","h":"business","ts":1794927310,"zh":"普京对乌克兰的战争正在破坏总统自己阻止该国人口下降的努力。根据俄罗斯统计局掌握的机密数据，到 2025 年，冲突已成为俄罗斯大部分地区出生的劳动年龄男性最常见的死亡原因。了解更多：\n📷：谢尔盖·布尔金/法新社","en":"Putin’s war against Ukraine is undermining the president’s own efforts to halt the country’s demographic decline. By 2025, the conflict had become the most common cause of death for working-age men born across most of Russia, according to confidential data held by Rosstat. Read more:\n📷: Sergei Bulkin/AFP","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXVdC-lWEAAHnHy.jpg?name=orig"],"u":"https://x.com/business/status/2122705107322032285","l":["bloom.bg"],"ln":[{"u":"http://bloom.bg/4t2ZQKi","d":"bloom.bg"}],"t":[],"lk":6,"rt":4,"rp":2,"vw":14067},{"id":"2122703919101211021","h":"dmjk001","ts":1794927026,"zh":"Altman：芯片厂商在高估OpenAI需求\nOpenAI的Sam Altman称，芯片厂商在高估OpenAI需求、存在重复统计：各家都默认OpenAI会买下他们全部芯片。他表示：“没错。很长一段时间里，行业里基本只有一家芯片供应商。所以当时大家统计晶圆产能时，可以向我们这类公司了解需求预期，从而大致判断自家芯片的终端需求空间。现在做芯片的厂商变多了。其中不少厂商都认为，自己大部分芯片出货量都会卖给我们、Anthropic以及其他客户。但我们的需求、数据中心规模等资源都是有限的。很多芯片厂商在对接供应链的时候，都预设我们会采购他们全部的芯片。当然，整体需求、数据中心建设的基本面是扎实的。但我们不可能、也没有必要从每一家芯片供应商那里采购全部产能。”","en":"Altman：芯片厂商在高估OpenAI需求\nOpenAI的Sam Altman称，芯片厂商在高估OpenAI需求、存在重复统计：各家都默认OpenAI会买下他们全部芯片。他表示：“没错。很长一段时间里，行业里基本只有一家芯片供应商。所以当时大家统计晶圆产能时，可以向我们这类公司了解需求预期，从而大致判断自家芯片的终端需求空间。现在做芯片的厂商变多了。其中不少厂商都认为，自己大部分芯片出货量都会卖给我们、Anthropic以及其他客户。但我们的需求、数据中心规模等资源都是有限的。很多芯片厂商在对接供应链的时候，都预设我们会采购他们全部的芯片。当然，整体需求、数据中心建设的基本面是扎实的。但我们不可能、也没有必要从每一家芯片供应商那里采购全部产能。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/sta 79990317438","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/4zneddV","d":"bloom.bg"}],"t":[],"lk":2,"rt":2,"rp":0,"vw":1715},{"id":"2122700362843082996","h":"hanking66","ts":1794926179,"zh":"感觉全网都在赌达子财报利空出尽，超级反弹！😅😅😅\n希望这次大部分人都能赌对🙏🙏🙏跌这么久了，也该反弹一下了，利空消息也好多天了，消化得也差不多了……难道还能有比老黄走人更大的利空等着我们吗？我想象力贫瘠，实在想不出还有什么可以比现在更惨了\n新 ceo 总不第一个财报，给大家表演一个我杀我自己吧😅真要是这样，那达子董事会里是进间谍了吧🤣🤣\nBuy the dip，长期持有，Discord在个人资料。","en":"感觉全网都在赌达子财报利空出尽，超级反弹！😅😅😅\n希望这次大部分人都能赌对🙏🙏🙏跌这么久了，也该反弹一下了，利空消息也好多天了，消化得也差不多了……难道还能有比老黄走人更大的利空等着我们吗？我想象力贫瘠，实在想不出还有什么可以比现在更惨了\n新 ceo 总不第一个财报，给大家表演一个我杀我自己吧😅真要是这样，那达子董事会里是进间谍了吧🤣🤣\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2122700362843082996","l":[],"ln":[],"t":["财报"],"lk":5,"rt":0,"rp":3,"vw":1364},{"id":"2122700264780267782","h":"xingpt","ts":1794926155,"zh":"币圈人炒美股的几个恶习，一定要避坑这几个点：\n1. 信仰盘\n看准一个就以为是比特币，疯狂加仓，从 存储 到 Circle，到最近也有人喊英伟达。其实不管任何股票都有周期，不是所有的成功路径都可以通过早期囤比特币这种信仰盘的方式来复制，这种幸存者是极少的。但币圈往往是被早期囤比特币能发财、囤以太坊能发财的人洗脑，认为只要搞信仰盘就能够赚钱。\n2. 只会炒热门票\n什么热炒什么。其实美股涨得好的，往往是悄摸摸在偷偷发展的公司，不一定是热门票。\n一个票若是热门票，要么是涨到了顶点，要么是博弈面极其复杂，这种参与进去大概率都是韭菜，因为热门票的仓位已经极度拥挤了。\n就单看存储半导体，有多少人能真的赚到钱落到口袋里？而消费、医疗和网络安全，很多股票已经破了新高，但因为不在新闻热点上，币圈的人也没有深度覆盖的能力，所以只能跟着热度炒。但炒公司跟炒币不一样，公司是有长期投资价值的，不是说那些冷门的就没有。\n比如有一家公司几乎没有人提，半年时间已经稳稳翻倍了，而且几乎没有人提过：维多利亚的秘密，对，就是搞维密秀、卖女性内衣的那家公司\n3. 只会炒情绪盘\n别的不说，币圈的人炒情绪盘确实是很厉害的。因为炒 meme 和炒山寨币，大部分只要看情绪就够了。\n但炒美股，当然炒情绪也是一方面，但大部分时候还是要回归公司的基本价值跟行业逻辑，以及关于估值体系、这个市场交易的拥挤度和资金配置等问题。要考虑的层面，其实要比单纯看情绪面博弈复杂得多，而且看情绪面博弈的胜率和收益比，也没有币圈来得高。\n所以要炒透美股，还是要扎扎实实做好基本面研究：对公司的业务、公司本身的估值，以及公司的未来战略和上下游，都要搞清楚。\n比如有个公司叫 TBBB，是 Druckenmiller 的持仓，做的是墨西哥的平价超市。其实基本面非常好，但也并不在情绪盘里，这个公司今年也翻倍了，而且走势非常稳，不像科技一样大起大落。\n4. 盲目相信 KOL。\n当然这点其实并不是币圈的问题了，A 股包括很多股票圈的人也是盲目听着 KOL 就冲进去干了。\n但交易其实是自己的，KOL 只能提供一些他的思路。你要知道 KOL 他擅长的是什么：他是短线还是长线？他是交易基本面、情绪，还是技术方向？\n如果这都不知道你就盲目跟，你一定会丧失自己的节奏。因为没有 KOL 是永远准确的，也不可能第一时间就告诉你该买多少、该什么时候卖。\n我也订阅了很多 KOL，但我从来不会盲目抄作业，而是会把他们的思路吸收和分析，看有哪些是对的，有哪些我认为他们说得不对，我也不会盲目去跟单。\n总之，炒美股是一个比炒币复杂得多的事情。炒币赚钱当然牛逼，但不一定能代表炒美股赚钱，特别是个股。\n所以大家在看这些美股信息，特别是币圈 KOL 发的时候，还是要对他的观点有一个自己的判断。","en":"币圈人炒美股的几个恶习，一定要避坑这几个点：\n1. 信仰盘\n看准一个就以为是比特币，疯狂加仓，从 存储 到 Circle，到最近也有人喊英伟达。其实不管任何股票都有周期，不是所有的成功路径都可以通过早期囤比特币这种信仰盘的方式来复制，这种幸存者是极少的。但币圈往往是被早期囤比特币能发财、囤以太坊能发财的人洗脑，认为只要搞信仰盘就能够赚钱。\n2. 只会炒热门票\n什么热炒什么。其实美股涨得好的，往往是悄摸摸在偷偷发展的公司，不一定是热门票。\n一个票若是热门票，要么是涨到了顶点，要么是博弈面极其复杂，这种参与进去大概率都是韭菜，因为热门票的仓位已经极度拥挤了。\n就单看存储半导体，有多少人能真的赚到钱落到口袋里？而消费、医疗和网络安全，很多股票已经破了新高，但因为不在新闻热点上，币圈的人也没有深度覆盖的能力，所以只能跟着热度炒。但炒公司跟炒币不一样，公司是有长期投资价值的，不是说那些冷门的就没有。\n比如有一家公司几乎没有人提，半年时间已经稳稳翻倍了，而且几乎没有人提过：维多利亚的秘密，对，就是搞维密秀、卖女性内衣的那家公司\n3. 只会炒情绪盘\n别的不说，币圈的人炒情绪盘确实是很厉害的。因为炒 meme 和炒山寨币，大部分只要看情绪就够了。\n但炒美股，当然炒情绪也是一方面，但大部分时候还是要回归公司的基本价值跟行业逻辑，以及关于估值体系、这个市场交易的拥挤度和资金配置等问题。要考虑的层面，其实要比单纯看情绪面博弈复杂得多，而且看情绪面博弈的胜率和收益比，也没有币圈来得高。\n所以要炒透美股，还是要扎扎实实做好基本面研究：对公司的业务、公司本身的估值，以及公司的未来战略和上下游，都要搞清楚。\n比如有个公司叫 TBBB，是 Druckenmiller 的持仓，做的是墨西哥的平价超市。其实基本面非常好，但也并不在情绪盘里，这个公司今年也翻倍了，而且走势非常稳，不像科技一样大起大落。\n4. 盲目相信 KOL。\n当然这点其实并不是币圈的问题了，A 股包括很多股票圈的人也是盲目听着 KOL 就冲进去干了。\n但交易其实是自己的，KOL 只能提供一些他的思路。你要知道 KOL 他擅长的是什么：他是短线还是长线？他是交易基本面、情绪，还是技术方向？\n如果这都不知道你就盲目跟，你一定会丧失自己的节奏。因为没有 KOL 是永远准确的，也不可能第一时间就告诉你该买多少、该什么时候卖。\n我也订阅了很多 KOL，但我从来不会盲目抄作业，而是会把他们的思路吸收和分析，看有哪些是对的，有哪些我认为他们说得不对，我也不会盲目去跟单。\n总之，炒美股是一个比炒币复杂得多的事情。炒币赚钱当然牛逼，但不一定能代表炒美股赚钱，特别是个股。\n所以大家在看这些美股信息，特别是币圈 KOL 发的时候，还是要对他的观点有一个自己的判断。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVXK-gasAE6bg0.jpg?name=orig","https://pbs.twimg.com/media/HXVX3y_bEAAdQts.jpg?name=orig"],"u":"https://x.com/xingpt/status/2122700264780267782","l":[],"ln":[],"t":["美股","AI科技"],"lk":8,"rt":3,"rp":4,"vw":575},{"id":"2122700081153339750","h":"business","ts":1794926111,"zh":"此类交易的最大承销商桑坦德银行表示，在该国蓬勃发展的能源行业的推动下，阿根廷公司和各省的美元债券销售浪潮将持续到明年上半年 7?taid=6afc661f7d7c3100018f9340&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"A wave of dollar bond sales by Argentine companies and provinces is set to extend into the first half of next year, driven by the country’s booming energy industry, according to Banco Santander, the top underwriter for such deals","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/s 的推文经常看到：惊诧体，硬凑体，半截话，造黄谣，瞎B编。感觉不如取消这个激励，避免劣币驱逐良币。","en":"#观察 由于X平台的激励机制影响，现在X上的推文经常看到：惊诧体，硬凑体，半截话，造黄谣，瞎B编。感觉不如取消这个激励，避免劣币驱逐良币。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2122697624981844173","l":[],"ln":[],"t":[],"lk":35,"rt":1,"rp":12,"vw":4363},{"id":"2122697609227956541","h":"octopusycc","ts":1794925522,"zh":"nm为什么我改不了订阅费啊","en":"nm为什么我改不了订阅费啊","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVWOVObsAAoIWR.jpg?name=orig"],"u":"https://x.com/octopusycc/status/2122697609227956541","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1564},{"id":"2122697557092483565","h":"business","ts":1794925510,"zh":"解决今天的 Alphadots！\n提示：新闻稿？\n🧩 在这里玩：","en":"Solve today's Alphadots!\nHint: Press release?\n🧩 Play here:","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXVWLhcX0AAhiiH.jpg?name=orig"],"u":"https://x.com/business/status/2122697557092483565","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/alphadots","d":"bloom.bg"}],"t":[],"lk":2,"rt":1,"rp":0,"vw":14509},{"id":"2122697163633487906","h":"octopusycc","ts":1794925416,"zh":"我受不了了","en":"我受不了了","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/octopusycc/status/2122697163633487906","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":674},{"id":"2122697011443245229","h":"yijiangren","ts":1794925379,"zh":"观澜谱·兵法篇一：以正合，以奇胜\n《孙子兵法·兵势篇》有言：凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江海。\n很多人会把“奇”理解为出其不意的奇招，或是一支能够偷袭制胜的奇兵。\n历代兵家确实常以奇兵解释“奇”，但若只停留在奇袭二字，便容易忽略一个更深层的前提。\n你必须拥有尚未投入战场、能够随时调度的力量，才有资格谈出奇制胜。\n正兵负责正面交锋，奇兵负责寻找破绽。\n倘若所有兵力都已经陷入正面战场，即便敌人露出再大的破绽，你又拿什么去攻？\n所以，从投资的角度，“奇”理解为一种可以自由支配的余力。\n它可以是没有投入市场的现金，可以是尚未使用的风险额度，也可以是一条能够源源不断提供资金的现金流。\n它们共同构成了投资者的后手。\n以正合，是凭借已有的实力参与市场；以奇胜，是永远保留改变战局的能力。\n一、兵力未尽，胜负未定\n很多人有一个根深蒂固的误区。\n认为看准了方向，就应该全仓投入；认为一笔交易的胜率足够高，就应该尽可能放大收益。\n于是，满仓成为自信的证明，杠杆成为胆识的象征。\n谨慎遭人看不起，赌徒成为了吹捧的对象。\n市场最残酷的地方在于：我们的判断可以正确，价格却未必按照我们预期的时间和路径运行。\n一只股票，你认为它值 100 。\n它可能先跌到 80，再跌到 60，最终才回到 150。\n如果你在 100 的位置 All in，即使最终判断正确，中间的过程也让你承受巨大的心理压力。\n如果上了高杠杆，可能在价值兑现之前便遭到强制平仓。\n相反，如果你始终保留一部分现金，局面便完全不同。\n价格跌到 80，你可以重新评估\n跌到 60，你依然拥有选择权\n倘若基本面没有恶化，估值反而更加合理，你甚至有机会以更低的成本积累更多筹码。\n当然，前提是判断经过重新验证。持续下跌也可能意味着最初的投资逻辑已经失效。\n现金无法保证你买在最低点，却能保证你拥有下一次出手的资格。\n二、十则围之，五则攻之\n《孙子兵法·谋攻篇》还有一段极其精彩的论述：\n十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。\n兵力十倍于敌，便可以围困\n五倍于敌，可以主动进攻\n两倍于敌，可以分散敌军\n势均力敌，可以正面交战\n兵力处于劣势，则应当撤退或避其锋芒\n这段话的核心，是根据力量对比决定行动方式。\n放在交易市场中，同样适用。\n当市场趋势明确、基本面扎实、估值合理，且你拥有充分的资金储备时，可以主动进攻。\n当价格接近合理区间，但方向仍然模糊时，可以小仓位试探。\n当市场进入剧烈震荡、宏观环境不断恶化时，应当收缩战线。\n当原有交易逻辑被证伪，或者潜在风险已经超过承受能力时，就应该果断撤退。\n仓位的大小，应当服从胜算与风险的变化，而非情绪的强弱。\n孙子从未要求将军逢敌必战。\n真正高明的将领，知道何时进攻，也知道何时避战。\n交易亦然。\n有时候，空仓就是最好的防守。\n有时候，轻仓就是最好的进攻准备。\n真正危险的，是明明处于劣势，却因为仓位太重、退路太少，被迫与市场决一死战。\n三、永远不要 All in\n一句话，我认为值得反复提醒自己，也提醒大家：永远不要把最后一颗子弹，打在自己最有信心的时候。\n因为信心只代表你当下的认知，并不能消除未来的不确定性。\n今天你认为市场已经见底，明天可能出现新的流动性冲击\n今天你认为一家公司的估值足够便宜，下个季度可能迎来盈利预期下修\n今天你认为宏观环境即将转暖，一份超预期的经济数据便可能改变利率路径\n市场从来不会因为你已经满仓，就停止制造新的机会。\n更残酷的是，机会往往出现在绝大多数人无力行动的时候。\n牛市末期，人人都有购买的欲望\n熊市深处，真正缺的却是购买的能力\n那些在上涨阶段保留现金的人，往往能够在流动性收缩时拥有更大的主动权。\n当然，现金也有机会成本。长期持有过多现金，可能错过优质资产的持续上涨。\n所以保留后手，并不意味着永远轻仓，更不意味着机械地等待暴跌。\n它要求你根据市场环境、资产估值和自身现金流，动态分配兵力。\n更重要的是，在投入任何一笔资金之前，都要想清楚：\n如果判断错误，我还有没有退路？\n如果出现更好的机会，我还有没有余力？\n如果市场长期不按照预期运行，我能不能继续留在牌桌上？\nAll in 最大的代价，是你把未来所有的选择权，都押在了当下这一次判断上。\n四、源源不断的现金流，才是最好的后勤\n战争拼到最后，往往拼的是补给。\n投资也是如此。\n很多人把全部精力放在寻找下一只暴涨的股票，却忽略了自身持续创造现金流的能力。\n工资、经营收入、稳定的业务利润，以及其他可持续的自由现金流，都是投资者的后勤。\n它们让你不必依靠每一笔交易来维持生活。\n让你能够承受更长时间的等待。\n也让你在市场出现真正值得出手的机会时，拥有额外的资金来源。\n一个拥有稳定现金流的投资者，即使暂时遭遇亏损，只要风险可控，依然可以逐渐恢复实力。\n而一个失去现金流、又满仓高杠杆的人，即使对未来的判断足够深刻，也可能倒在黎明之前。\n这也是为什么，我一直认为普通人应该同时建立两种能力。\n一种是在市场中识别优质资产的能力。\n另一种是在市场之外持续创造财富的能力。\n前者决定投资收益的潜力，后者决定你能够在市场中停留多久。\n所谓无限后手，并非真的拥有取之不尽的资金。\n而是通过持续的现金流、合理的仓位管理和严格的风险控制，让自己始终具备重新组织进攻的能力。\n善战者，不以一战赌国运；善投者，不以一仓定生死。\n五、以正合，以奇胜\n如果让我将这六个字转化为一套投资体系，那么：\n所谓正，是对优质资产的理解，是对长期趋势的判断，是能够承受波动的核心仓位。\n所谓奇，是保留的现金，是灵活的机动仓位，是发现判断错误后及时撤退的能力，也是机会真正出现时敢于集结力量的底气。\n正决定你能够走多远。\n奇决定你在复杂的市场环境中，究竟还有多少选择。\n两者缺一不可。\n只守现金，可能错过漫长的资产升值。\n只持仓位，则可能在真正的历史性机会到来时无能为力。\n而最理想的状态，是让核心资产参与长期增长，让机动资金应对周期变化，让持续现金流不断补充自己的力量。\n行情好时，顺势而为\n行情差时，收缩阵地\n机会不足时，休养生息\n机会成熟时，集中优势兵力\n进退之间，始终掌握主动\n最后，我想用一句话作为这一篇的结尾。\n一个交易者真正的强大，不在于他能一次投入多少兵力，而在于无论经历多少次交锋，他始终还有兵可用。\n兵无常势，水无常形\n以正合，以奇胜\n留有余地，方有胜机","en":"观澜谱·兵法篇一：以正合，以奇胜\n《孙子兵法·兵势篇》有言：凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江海。\n很多人会把“奇”理解为出其不意的奇招，或是一支能够偷袭制胜的奇兵。\n历代兵家确实常以奇兵解释“奇”，但若只停留在奇袭二字，便容易忽略一个更深层的前提。\n你必须拥有尚未投入战场、能够随时调度的力量，才有资格谈出奇制胜。\n正兵负责正面交锋，奇兵负责寻找破绽。\n倘若所有兵力都已经陷入正面战场，即便敌人露出再大的破绽，你又拿什么去攻？\n所以，从投资的角度，“奇”理解为一种可以自由支配的余力。\n它可以是没有投入市场的现金，可以是尚未使用的风险额度，也可以是一条能够源源不断提供资金的现金流。\n它们共同构成了投资者的后手。\n以正合，是凭借已有的实力参与市场；以奇胜，是永远保留改变战局的能力。\n一、兵力未尽，胜负未定\n很多人有一个根深蒂固的误区。\n认为看准了方向，就应该全仓投入；认为一笔交易的胜率足够高，就应该尽可能放大收益。\n于是，满仓成为自信的证明，杠杆成为胆识的象征。\n谨慎遭人看不起，赌徒成为了吹捧的对象。\n市场最残酷的地方在于：我们的判断可以正确，价格却未必按照我们预期的时间和路径运行。\n一只股票，你认为它值 100 。\n它可能先跌到 80，再跌到 60，最终才回到 150。\n如果你在 100 的位置 All in，即使最终判断正确，中间的过程也让你承受巨大的心理压力。\n如果上了高杠杆，可能在价值兑现之前便遭到强制平仓。\n相反，如果你始终保留一部分现金，局面便完全不同。\n价格跌到 80，你可以重新评估\n跌到 60，你依然拥有选择权\n倘若基本面没有恶化，估值反而更加合理，你甚至有机会以更低的成本积累更多筹码。\n当然，前提是判断经过重新验证。持续下跌也可能意味着最初的投资逻辑已经失效。\n现金无法保证你买在最低点，却能保证你拥有下一次出手的资格。\n二、十则围之，五则攻之\n《孙子兵法·谋攻篇》还有一段极其精彩的论述：\n十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。\n兵力十倍于敌，便可以围困\n五倍于敌，可以主动进攻\n两倍于敌，可以分散敌军\n势均力敌，可以正面交战\n兵力处于劣势，则应当撤退或避其锋芒\n这段话的核心，是根据力量对比决定行动方式。\n放在交易市场中，同样适用。\n当市场趋势明确、基本面扎实、估值合理，且你拥有充分的资金储备时，可以主动进攻。\n当价格接近合理区间，但方向仍然模糊时，可以小仓位试探。\n当市场进入剧烈震荡、宏观环境不断恶化时，应当收缩战线。\n当原有交易逻辑被证伪，或者潜在风险已经超过承受能力时，就应该果断撤退。\n仓位的大小，应当服从胜算与风险的变化，而非情绪的强弱。\n孙子从未要求将军逢敌必战。\n真正高明的将领，知道何时进攻，也知道何时避战。\n交易亦然。\n有时候，空仓就是最好的防守。\n有时候，轻仓就是最好的进攻准备。\n真正危险的，是明明处于劣势，却因为仓位太重、退路太少，被迫与市场决一死战。\n三、永远不要 All in\n一句话，我认为值得反复提醒自己，也提醒大家：永远不要把最后一颗子弹，打在自己最有信心的时候。\n因为信心只代表你当下的认知，并不能消除未来的不确定性。\n今天你认为市场已经见底，明天可能出现新的流动性冲击\n今天你认为一家公司的估值足够便宜，下个季度可能迎来盈利预期下修\n今天你认为宏观环境即将转暖，一份超预期的经济数据便可能改变利率路径\n市场从来不会因为你已经满仓，就停止制造新的机会。\n更残酷的是，机会往往出现在绝大多数人无力行动的时候。\n牛市末期，人人都有购买的欲望\n熊市深处，真正缺的却是购买的能力\n那些在上涨阶段保留现金的人，往往能够在流动性收缩时拥有更大的主动权。\n当然，现金也有机会成本。长期持有过多现金，可能错过优质资产的持续上涨。\n所以保留后手，并不意味着永远轻仓，更不意味着机械地等待暴跌。\n它要求你根据市场环境、资产估值和自身现金流，动态分配兵力。\n更重要的是，在投入任何一笔资金之前，都要想清楚：\n如果判断错误，我还有没有退路？\n如果出现更好的机会，我还有没有余力？\n如果市场长期不按照预期运行，我能不能继续留在牌桌上？\nAll in 最大的代价，是你把未来所有的选择权，都押在了当下这一次判断上。\n四、源源不断的现金流，才是最好的后勤\n战争拼到最后，往往拼的是补给。\n投资也是如此。\n很多人把全部精力放在寻找下一只暴涨的股票，却忽略了自身持续创造现金流的能力。\n工资、经营收入、稳定的业务利润，以及其他可持续的自由现金流，都是投资者的后勤。\n它们让你不必依靠每一笔交易来维持生活。\n让你能够承受更长时间的等待。\n也让你在市场出现真正值得出手的机会时，拥有额外的资金来源。\n一个拥有稳定现金流的投资者，即使暂时遭遇亏损，只要风险可控，依然可以逐渐恢复实力。\n而一个失去现金流、又满仓高杠杆的人，即使对未来的判断足够深刻，也可能倒在黎明之前。\n这也是为什么，我一直认为普通人应该同时建立两种能力。\n一种是在市场中识别优质资产的能力。\n另一种是在市场之外持续创造财富的能力。\n前者决定投资收益的潜力，后者决定你能够在市场中停留多久。\n所谓无限后手，并非真的拥有取之不尽的资金。\n而是通过持续的现金流、合理的仓位管理和严格的风险控制，让自己始终具备重新组织进攻的能力。\n善战者，不以一战赌国运；善投者，不以一仓定生死。\n五、以正合，以奇胜\n如果让我将这六个字转化为一套投资体系，那么：\n所谓正，是对优质资产的理解，是对长期趋势的判断，是能够承受波动的核心仓位。\n所谓奇，是保留的现金，是灵活的机动仓位，是发现判断错误后及时撤退的能力，也是机会真正出现时敢于集结力量的底气。\n正决定你能够走多远。\n奇决定你在复杂的市场环境中，究竟还有多少选择。\n两者缺一不可。\n只守现金，可能错过漫长的资产升值。\n只持仓位，则可能在真正的历史性机会到来时无能为力。\n而最理想的状态，是让核心资产参与长期增长，让机动资金应对周期变化，让持续现金流不断补充自己的力量。\n行情好时，顺势而为\n行情差时，收缩阵地\n机会不足时，休养生息\n机会成熟时，集中优势兵力\n进退之间，始终掌握主动\n最后，我想用一句话作为这一篇的结尾。\n一个交易者真正的强大，不在于他能一次投入多少兵力，而在于无论经历多少次交锋，他始终还有兵可用。\n兵无常势，水无常形\n以正合，以奇胜\n留有余地，方有胜机","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVVl_LawAAyWRw.jpg?name=orig"],"u":"https://x.com/yijiangren/status/2122697011443245229","l":[],"ln":[],"t":["财报"],"lk":23,"rt":1,"rp":18,"vw":1144},{"id":"2122696770077741301","h":"octopusycc","ts":1794925322,"zh":"…我改不了订阅价 nm","en":"…我改不了订阅价 nm","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2122696770077741301","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":3,"vw":1995},{"id":"2122696398873522206","h":"ShanghaoJin","ts":1794925233,"zh":"Dr Lin的春天真的要来了？","en":"Dr Lin的春天真的要来了？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2122696398873522206","l":[],"ln":[],"t":[],"lk":15,"rt":0,"rp":4,"vw":6354},{"id":"2122696322247737825","h":"octopusycc","ts":1794925215,"zh":"再翻译一下\n这条抓到了今天限制中国光模块进口的老鼠仓了\n国会老爷们👀","en":"再翻译一下\n这条抓到了今天限制中国光模块进口的老鼠仓了\n国会老爷们👀","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2122696322247737825","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":722},{"id":"2122696303863816500","h":"business","ts":1794925211,"zh":"爱尔兰提议将需要央行预先批准的最高财务职位数量减少 60%，并承诺在英国以类似精神宣布改革几周后减轻企业负担","en":"Ireland is proposing a 60% reduction in the number of t d Trump played down concerns about a series of breakdowns in major US systems in recent days, assuring that Americans remain safe.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122674911420248071","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/trump-downplays-jpmorgan-microsoft-outages-saying-it-s-life?taid=6afc4eae7d7c3100018f9217&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":1,"rp":0,"vw":14501},{"id":"2122674607501275632","h":"cnfinancewatch","ts":1794920038,"zh":"（十二）\n1、事件：据华尔街见闻报道，京东三季度净营收3096亿元，归母净利润同比大增44%，新业务大幅减亏，自由现金流扩大至负239亿元。\n2、涉及标的：京东（JD）为财报主体；A股对应方向为电商与物流供应链，代表个股顺丰控股（002352）、圆通速递（600233）。\n3、影响：对美股偏多，强度中，属持续性逻辑；利润大增与减亏传导A股电商物流板块盈利预期改善。\n（十三）\n1、事件：据Reuters报道，美国升级芯片出口管制，商务部规则旨在进一步限制对华芯片出货，外交部回应称典型经济胁迫与长臂管辖，中方将采取必要措施。\n2、涉及标的：英伟达（NVDA）、AMD（AMD）为受限标的；A股对应方向为国产替代半导体设备材料，代表个股北方华创（002371）、中微公司（688012）。\n3、影响：对美股偏空、对A股国产替代偏多，强度强，属持续性逻辑；管制升级强化自主可控主线，利好设备材料端。\n（十四）\n1、事件：据Reuters报道，黄金跌至一年低点，受美债收益率与美元压制，势将创2015年以来最差年度表现，黄金期货结算价创52周新低。\n2、涉及标的：黄金ETF（GLD）与金矿股纽蒙特（NEM）承压；A股对应方向为黄金珠宝与贵金属，代表个股山东黄金（600547）、紫金矿业（601899）。\n3、影响：对美股黄金板块偏空，强度强，属持续性逻辑；金价走弱传导A股黄金股盈利预期下修。\n（十五）\n1、事件：据WSJ报道，美元创18个月新高，美元指数抹去解放日跌幅，“卖出美国”担忧消退，美元五连涨后企稳。\n2、涉及标的：美元指数（DXY）走强，新兴市场ETF（EEM）承压；A股对应方向为出口链与外汇敏感板块，代表个股美的集团（000333）、海尔智家（600690）。\n3、影响：对美股偏空于跨国企业盈利，强度中，属持续性逻辑；强美元压制新兴市场资金流入，传导A股外资偏好。\n（十六）\n1、事件：据WSJ报道，IEA称全球石油市场将随海湾出口恢复重回过剩，油价因供应前景改善而回落，抵消中东紧张局势。\n2、涉及标的：原油ETF（USO）与埃克森美孚（XOM）承压；A股对应方向为石油石化与油服，代表个股中国石油（601857）、中海油服（601808）。\n3、影响：对美股能源板块偏空，强度中，属持续性逻辑；油价回落传导A股石油石化盈利预期与油服订单。\n（十七）\n1、事件：据Barron's报道，一纸降级拖累全部稀土股，在特朗普与习近平会晤前稀土板块走弱。\n2、涉及标的：MP Materials（MP）为稀土标的；A股对应方向为稀土永磁，代表个股北方稀土（600111）、中国稀土（000831）当日-10.00%。\n3、影响：对美股稀土偏空，强度中，属当日情绪影响；会晤前不确定性传导A股稀土板块，短期波动加大。\n（十八）\n1、事件：据Bloomberg报道，巴克莱称被迫的散户平仓是台湾股市重挫背后原因，台股遭遇抛售。\n2、涉及标的：台积电（TSM）为台股权重核心；A股对应方向为半导体代工与封测，代表个股中芯国际（688981）、长电科技（600584）。\n3、影响：对美股半导体偏空，强度中，属当日情绪影响；台股去杠杆传导A股半导体情绪，但国产替代逻辑形成对冲。\n（十九）\n1、事件：据WSJ报道，美联储主席Warsh表示美联储正在推演AI如何重塑经济，并重申偏好小步加息，但通胀预期若失控将被迫提速。\n2、涉及标的：标普500（SPX）与美债ETF（TLT）为敏感标的；A股对应方向为大金融与利率敏感板块，代表个股招商银行（600036）、中国平安（601318）。\n3、影响：对美股偏空，强度中，属持续性逻辑；加息偏好与AI经济推演影响全球流动性预期，传导A股银行保险估值。\n（二十）\n1、事件：据BusinessInsider报道，迪士尼CEO Josh D'Amaro的科技战略获华尔街认可，财报超预期；同时Opera宣布以普通股直接登陆纳斯达克替代ADS。\n2、涉及标的：迪士尼（DIS）与Opera（OPRA）为事件主体；A股对应方向为传媒IP与浏览器软件，代表个股光线传媒（300251）、三六零（601360）。\n3、影响：对美股偏多，强度弱，属当日情绪影响；科技战略与上市结构调整对A股传媒软件板块示范效应有限。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：\n━━━━━━━━━━━━━\n⭐️⭐️⭐️ 华尔街观察团队 | WSV量化模型 | 不构成投资建议 | 投资有风险 ⭐️⭐️⭐️","en":"（十二）\n1、事件：据华尔街见闻报道，京东三季度净营收3096亿元，归母净利润同比大增44%，新业务大幅减亏，自由现金流扩大至负239亿元。\n2、涉及标的：京东（JD）为财报主体；A股对应方向为电商与物流供应链，代表个股顺丰控股（002352）、圆通速递（600233）。\n3、影响：对美股偏多，强度中，属持续性逻辑；利润大增与减亏传导A股电商物流板块盈利预期改善。\n（十三）\n1、事件：据Reuters报道，美国升级芯片出口管制，商务部规则旨在进一步限制对华芯片出货，外交部回应称典型经济胁迫与长臂管辖，中方将采取必要措施。\n2、涉及标的：英伟达（NVDA）、AMD（AMD）为受限标的；A股对应方向为国产替代半导体设备材料，代表个股北方华创（002371）、中微公司（688012）。\n3、影响：对美股偏空、对A股国产替代偏多，强度强，属持续性逻辑；管制升级强化自主可控主线，利好设备材料端。\n（十四）\n1、事件：据Reuters报道，黄金跌至一年低点，受美债收益率与美元压制，势将创2015年以来最差年度表现，黄金期货结算价创52周新低。\n2、涉及标的：黄金ETF（GLD）与金矿股纽蒙特（NEM）承压；A股对应方向为黄金珠宝与贵金属，代表个股山东黄金（600547）、紫金矿业（601899）。\n3、影响：对美股黄金板块偏空，强度强，属持续性逻辑；金价走弱传导A股黄金股盈利预期下修。\n（十五）\n1、事件：据WSJ报道，美元创18个月新高，美元指数抹去解放日跌幅，“卖出美国”担忧消退，美元五连涨后企稳。\n2、涉及标的：美元指数（DXY）走强，新兴市场ETF（EEM）承压；A股对应方向为出口链与外汇敏感板块，代表个股美的集团（000333）、海尔智家（600690）。\n3、影响：对美股偏空于跨国企业盈利，强度中，属持续性逻辑；强美元压制新兴市场资金流入，传导A股外资偏好。\n（十六）\n1、事件：据WSJ报道，IEA称全球石油市场将随海湾出口恢复重回过剩，油价因供应前景改善而回落，抵消中东紧张局势。\n2、涉及标的：原油ETF（USO）与埃克森美孚（XOM）承压；A股对应方向为石油石化与油服，代表个股中国石油（601857）、中海油服（601808）。\n3、影响：对美股能源板块偏空，强度中，属持续性逻辑；油价回落传导A股石油石化盈利预期与油服订单。\n（十七）\n1、事件：据Barron's报道，一纸降级拖累全部稀土股，在特朗普与习近平会晤前稀土板块走弱。\n2、涉及标的：MP Materials（MP）为稀土标的；A股对应方向为稀土永磁，代表个股北方稀土（600111）、中国稀土（000831）当日-10.00%。\n3、影响：对美股稀土偏空，强度中，属当日情绪影响；会晤前不确定性传导A股稀土板块，短期波动加大。\n（十八）\n1、事件：据Bloomberg报道，巴克莱称被迫的散户平仓是台湾股市重挫背后原因，台股遭遇抛售。\n2、涉及标的：台积电（TSM）为台股权重核心；A股对应方向为半导体代工与封测，代表个股中芯国际（688981）、长电科技（600584）。\n3、影响：对美股半导体偏空，强度中，属当日情绪影响；台股去杠杆传导A股半导体情绪，但国产替代逻辑形成对冲。\n（十九）\n1、事件：据WSJ报道，美联储主席Warsh表示美联储正在推演AI如何重塑经济，并重申偏好小步加息，但通胀预期若失控将被迫提速。\n2、涉及标的：标普500（SPX）与美债ETF（TLT）为敏感标的；A股对应方向为大金融与利率敏感板块，代表个股招商银行（600036）、中国平安（601318）。\n3、影响：对美股偏空，强度中，属持续性逻辑；加息偏好与AI经济推演影响全球流动性预期，传导A股银行保险估值。\n（二十）\n1、事件：据BusinessInsider报道，迪士尼CEO Josh D'Amaro的科技战略获华尔街认可，财报超预期；同时Opera宣布以普通股直接登陆纳斯达克替代ADS。\n2、涉及标的：迪士尼（DIS）与Opera（OPRA）为事件主体；A股对应方向为传媒IP与浏览器软件，代表个股光线传媒（300251）、三六零（601360）。\n3、影响：对美股偏多，强度弱，属当日情绪影响；科技战略与上市结构调整对A股传媒软件板块示范效应有限。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：\n━━━━━━━━━━━━━\n⭐️⭐️⭐️ 华尔街观察团队 | WSV量化模型 | 不构成投资建议 | 投资有风险 ⭐️⭐️⭐️","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122674607501275632","l":["macaostarbridge.com"],"ln":[{"u":"https://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["美联储","通胀","美股","汇率","原油能源","AI科技","财报","关税贸易","黄金"],"lk":0,"rt":0,"rp":1,"vw":597},{"id":"2122674601217999265","h":"cnfinancewatch","ts":1794920036,"zh":"今日美股与全球热点二十条\n（一）\n1、事件：据财联社报道，英伟达将于太平洋时间11月17日下午1时20分左右公布2027财年第三季度财务业绩，并于下午2时召开业绩电话会议，市场聚焦四大看点。\n2、涉及标的：英伟达（NVDA）为全球AI算力核心标的；A股对应方向为CPO光模块与算力硬件，代表个股中际旭创（300308）、新易盛（300502）。\n3、影响：对美股偏多待验证，强度强，属当日情绪影响；财报结果将直接传导A股算力硬件板块，超预期则修复光模块情绪。\n（二）\n1、事件：据华尔街见闻报道，黄仁勋离职震荡蔓延，“AI央行”紧缩，新云公司融资危险了，英伟达董事会称暂不考虑复职事项。\n2、涉及标的：英伟达（NVDA）管理层变动为核心变量；A股对应方向为AI算力与服务器，代表个股工业富联（601138）、华胜天成（600410）。\n3、影响：对美股偏空，强度强，属当日情绪影响；管理层不确定性压制AI硬件估值，传导A股算力板块风险偏好。\n（三）\n1、事件：据华尔街见闻报道，英伟达暴跌，空头大赚240亿美元，英伟达跌4%，空头40天斩获240亿美元收益。\n2、涉及标的：英伟达（NVDA）为空头主要目标；A股对应方向为半导体与AI硬件，代表个股寒武纪（688256）、海光信息（688041）。\n3、影响：对美股偏空，强度强，属当日情绪影响；空头获利了结压力传导A股国产算力芯片情绪，短期波动加大。\n（四）\n1、事件：据华尔街见闻报道，AI暴跌前华尔街大佬分道扬镳，桥水、索罗斯Q3大砍英伟达持仓，“木头姐”、Tepper逆势加码，德鲁肯米勒清仓闪迪、台积电。\n2、涉及标的：英伟达（NVDA）、台积电（TSM）、闪迪（SNDK）为调仓对象；A股对应方向为半导体设备材料，代表个股北方华创（002371）、有研新材（600206）。\n3、影响：对美股偏空，强度中，属持续性逻辑；机构分歧加大显示AI交易拥挤度高位，传导A股半导体板块波动。\n（五）\n1、事件：据华尔街见闻报道，高盛五份研报同指一个结论，AI盛宴接近尾声，市场比经济更脆弱。\n2、涉及标的：纳斯达克100指数（NDX）与标普500（SPX）为承压指数；A股对应方向为AI应用与算力，代表个股科大讯飞（002230）、浪潮信息（000977）。\n3、影响：对美股偏空，强度中，属持续性逻辑；外资对AI估值担忧传导A股科技板块风险偏好收敛。\n（六）\n1、事件：据华尔街见闻报道，大摩高喊拥抱风险，AI算力开支只会迟到不会缩水，顶格超配全球股市，摩根士丹利将全球股票上调至最大超配。\n2、涉及标的：MSCI全球指数与标普500（SPX）为受益方向；A股对应方向为算力基础设施，代表个股中科曙光（603019）、紫光股份（000938）。\n3、影响：对美股偏多，强度中，属持续性逻辑；与高盛观点形成对冲，对A股算力板块情绪形成一定支撑。\n（七）\n1、事件：据财联社报道，Anthropic IPO计划于11月18日定价，并于次日开始交易，IPO成AI牛市关键试金石。\n2、涉及标的：Anthropic为待上市AI标的；A股对应方向为AI大模型与应用，代表个股三六零（601360）、昆仑万维（300418）。\n3、影响：对美股偏多待验证，强度强，属当日情绪影响；IPO定价与首日表现将检验AI估值，传导A股AI应用板块情绪。\n（八）\n1、事件：据华尔街见闻报道，巴菲特感恩节再捐股55亿美元，这次的信只写了250字，1620亿剩余财富8年内捐完。\n2、涉及标的：伯克希尔哈撒韦（BRK.B）为捐赠主体；A股对应方向为价值红利风格，代表个股工商银行（601398）、长江电力（600900）。\n3、影响：对美股中性偏多，强度弱，属持续性逻辑；捐赠不改变公司经营，红利价值风格对A股高股息方向形成示范。\n（九）\n1、事件：据华尔街见闻报道，伯克希尔Q3大调仓，建仓Lennar与Delta，减持美银与VeriSign，加码房产与航空股。\n2、涉及标的：莱纳（LEN）、达美航空（DAL）为新进标的，美国银行（BAC）被减持；A股对应方向为地产链与航空，代表个股保利发展（600048）、中国国航（601111）。\n3、影响：对美股偏多，强度中，属持续性逻辑；房产与航空加仓释放对美国内需信心，传导A股地产与航空板块情绪。\n（十）\n1、事件：据\n2、涉及标的：家得宝（HD）为事件主体；A股对应方向为家居建材与消费建材，代表个股欧派家居（603833）、东方雨虹（002271）。\n3、影响：对美股偏多，强度中，属持续性逻辑；美国家居需求韧性传导A股家居出口链预期。\n（十一）\n1、事件：据Seeking Alpha报道，迪士尼第四季度业绩超预期，流媒体增长驱动，半年度股息上调33%至1.00美元，并重申FY2027调整后EPS指引。\n2、涉及标的：迪士尼（DIS）为事件主体；A股对应方向为影视传媒与IP经济，代表个股光线传媒（300251）、广百股份（002187）属IP经济概念。\n3、影响：对美股偏多，强度中，属持续性逻辑；流媒体盈利改善传导A股传媒板块估值修复预期。","en":"今日美股与全球热点二十条\n（一）\n1、事件：据财联社报道，英伟达将于太平洋时间11月17日下午1时20分左右公布2027财年第三季度财务业绩，并于下午2时召开业绩电话会议，市场聚焦四大看点。\n2、涉及标的：英伟达（NVDA）为全球AI算力核心标的；A股对应方向为CPO光模块与算力硬件，代表个股中际旭创（300308）、新易盛（300502）。\n3、影响：对美股偏多待验证，强度强，属当日情绪影响；财报结果将直接传导A股算力硬件板块，超预期则修复光模块情绪。\n（二）\n1、事件：据华尔街见闻报道，黄仁勋离职震荡蔓延，“AI央行”紧缩，新云公司融资危险了，英伟达董事会称暂不考虑复职事项。\n2、涉及标的：英伟达（NVDA）管理层变动为核心变量；A股对应方向为AI算力与服务器，代表个股工业富联（601138）、华胜天成（600410）。\n3、影响：对美股偏空，强度强，属当日情绪影响；管理层不确定性压制AI硬件估值，传导A股算力板块风险偏好。\n（三）\n1、事件：据华尔街见闻报道，英伟达暴跌，空头大赚240亿美元，英伟达跌4%，空头40天斩获240亿美元收益。\n2、涉及标的：英伟达（NVDA）为空头主要目标；A股对应方向为半导体与AI硬件，代表个股寒武纪（688256）、海光信息（688041）。\n3、影响：对美股偏空，强度强，属当日情绪影响；空头获利了结压力传导A股国产算力芯片情绪，短期波动加大。\n（四）\n1、事件：据华尔街见闻报道，AI暴跌前华尔街大佬分道扬镳，桥水、索罗斯Q3大砍英伟达持仓，“木头姐”、Tepper逆势加码，德鲁肯米勒清仓闪迪、台积电。\n2、涉及标的：英伟达（NVDA）、台积电（TSM）、闪迪（SNDK）为调仓对象；A股对应方向为半导体设备材料，代表个股北方华创（002371）、有研新材（600206）。\n3、影响：对美股偏空，强度中，属持续性逻辑；机构分歧加大显示AI交易拥挤度高位，传导A股半导体板块波动。\n（五）\n1、事件：据华尔街见闻报道，高盛五份研报同指一个结论，AI盛宴接近尾声，市场比经济更脆弱。\n2、涉及标的：纳斯达克100指数（NDX）与标普500（SPX）为承压指数；A股对应方向为AI应用与算力，代表个股科大讯飞（002230）、浪潮信息（000977）。\n3、影响：对美股偏空，强度中，属持续性逻辑；外资对AI估值担 -needed-by-spring?taid=6afc4c5638c51300013e0046&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["美联储","通胀"],"lk":1,"rt":1,"rp":0,"vw":7848},{"id":"2122671338276204775","h":"dmjk001","ts":1794919259,"zh":"《广发海外电子通信》\n☄️存储：下调NAND价格预测\n👉据TrendForce最新跟踪，受消费端需求疲软及中国eSSD采购动能放缓拖累，NAND需求表现弱于预期。我们进一步下调明年NAND合约价预期，预计2027年Q1-Q4价格环比为0%/-3%/-8%/-12%。\n☀️下调NAND价格预测：我们将2027年Q1-Q4 NAND合约价环比预期从+6%/+3%/0%/0%下调至0%/-3%/-8%/-12%。消费电子需求持续疲软，预计2027年智能手机与PC出货量均将出现两位数下滑。与此同时，国内GPU与HBM供应瓶颈制约了服务器部署节奏，削弱了配套eSSD的采购需求，抵消了北美云厂商9月以来的加单效应。上述多重逆风共同缓解了此前的供应紧张局面，对NAND价格形成下行压力。\n☀️2027年Q2或迎供过于求：我们目前预计2026/27/28年NAND bit需求增速分别为26%/20%/24%，其中2027年需求下修47.8EB（占总需求的3.2%），主要反映消费端双位数需求下滑以及中国eSSD采购放缓。供给端方面，随着中国厂商产能持续扩张以及QLC产品占比提升，我们预计2026/27/28年NAND bit供给增速分别为21%/28%/30%，供需格局将迎来反转，预计2026/27/28年NAND供需缺口分别为-5%/+3%/+7%，2027年Q2起或正式进入价格下行通道。\n☀️2028年情景分析：展望2028年，我们预计NAND市场将继续分化，消费市场复苏节奏及中国CSP的eSSD需求仍是核心变量，供给则取决于海外与中国厂商的排产策略。我们对2028年NAND价格设定悲观/中性/乐观三种情景，分别为$0.08/0.15/0.20/GB，对应AI前价格，LTA底部价格，乐观需求价格。作为纯NAND厂商，闪迪盈利波动最为剧烈，2028年三种情景下EPS预计分别为34/126/193美元。相比之下，美光与海力士受影响更小：美光预计为190/205/215美元，海力士预计为48/52/55美元。\n☀️投资建议：我们对纯NAND标的仍然保持谨慎，如闪迪（SNDK US）、铠侠（285A JP）、群联（8299 TT）等。DRAM/HBM厂商有望相对跑赢，如美光（MU US）、海力士（SKHY US）及三星电子（005930 KS）。","en":"《广发海外电子通信》\n☄️存储：下调NAND价格预测\n👉据TrendForce最新跟踪，受消费端需求疲软及中国eSSD采购动能放缓拖累，NAND需求表现弱于预期。我们进一步下调明年NAND合约价预期，预计2027年Q1-Q4价格环比为0%/-3%/-8%/-12%。\n☀️下调NAND价格预测：我们将2027年Q1-Q4 NAND合约价环比预期从+6%/+3%/0%/0%下调至0%/-3%/-8%/-12%。消费电子需求持续疲软，预计2027年智能手机与PC出货量均将出现两位数下滑。与此同时，国内GPU与HBM供应瓶颈制约了服务器部署节奏，削弱了配套eSSD的采购需求，抵消了北美云厂商9月以来的加单效应。上述多重逆风共同缓解了此前的供应紧张局面，对NAND价格形成下行压力。\n☀️2027年Q2或迎供过于求：我们目前预计2026/27/28年NAND bit需求增速分别为26%/20%/24%，其中2027年需求下修47.8EB（占总需求的3.2%），主要反映消费端双位数需求下滑以及中国eSSD采购放缓。供给端方面，随着中国厂商产能持续扩张以及QLC产品占比提升，我们预计2026/27/28年NAND bit供给增速分别为21%/28%/30%，供需格局将迎来反转，预计2026/27/28年NAND供需缺口分别为-5%/+3%/+7%，2027年Q2起或正式进入价格下行通道。\n☀️2028年情景分析：展望2028年，我们预计NAND市场将继续分化，消费市场复苏节奏及中国CSP的eSSD需求仍是核心变量，供给则取决于海外与中国厂商的排产策略。我们对2028年NAND价格设定悲观/中性/乐观三种情景，分别为$0.08/0.15/0.20/GB，对应AI前价格 w.bloomberg.com/news/articles/2026-11-17/trump-says-us-looking-into-any-iran-attack-plan-for-washington?taid=6afc49ff38c51300013e003b&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":2,"rp":1,"vw":11714},{"id":"2122668636972122266","h":"business","ts":1794918614,"zh":"由于投资者等待英伟达财报，科技股抛售持续，新兴市场股市跌至七个月以来的最低水平","en":"Emerging-market stocks slumped to their lowest-level in seven months as a tech-selloff extended, amid investors awaiting earnings from Nvidia","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122668636972122266","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/emerging-stocks-drop-as-nvidia-jitters-weigh-on-asian-tech?taid=6afc48d6a3d32e000116b77c&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技","财报"],"lk":4,"rt":1,"rp":4,"vw":12831},{"id":"2122668566369767525","h":"cnfinancewatch","ts":1794918598,"zh":"一组网络消息：\n一、板块热议：\n半导体芯片：业内人士称，已接获晶圆代工调价通知，涨幅从10％至逾20％不等，明年包括台积电在内的合作晶圆厂都将调价。（华东重机、联合化学、国林科技、佳先股份、西陇科学等）\n昇腾：华为云发布并开源昇腾原生具身世界模型，昇腾云已覆盖80%的中国具身智能企业。（华胜天成、泰嘉股份、克莱特、嘉环科技、真视通等）\n氯化铵：联碱法企业因纯碱长期亏损而主动减产，导致副产品氯化铵供应收缩，国内氯化铵工业级价格涨至730元/吨，创年内新高。（中盐化工、和邦生物、双环科技、华昌化工等）\n#华尔街观察最近提示乳业：11月本是原奶传统淡季，但散奶价格较合同奶价出现明显倒挂，反映供应趋紧，部分地区合同奶价上行。（伊利股份、新乳业、光明乳业、骑士乳业等）\n风险提示：以上内容来自公社用户写作，相关信息未经核实，未必准确，请审慎参考。\n二、大涨股解析：\n顺钠股份：干式变压器\n2026年11月16日盘中消息，1-9月全国电网工程投资完成额4594亿元，同比+4.9%，其中8-9月单月投资同比提速，单9月同比+13.8%；此外，机构预计第五批招标有望于12月挂网招标，有可能涉及“2直1交”，招标金额可观公司为国内干式变压器开拓者，主导或参与制定国家及行业标准超过50项，干式变压器规格超过3000种，累计销量超过16.2万台，其它产品包括预装式变电站、开关柜、电抗器、分布式储能柜及储能系统等，同时承接电力成套工程并提供配套运维服务。\n长虹美菱：家电\n公司2026年H1小家电方面已推出集成AI控温、净水和保鲜存储的AI冰吧机，正在开发AI视觉食材识别、膳食大模型、健康数据监测和自适应烹饪调控系统，构建智能健康烹饪方案。公司空调（营收占比55.99%）搭载AI人感技术并布局AI节能算法，冰箱冰柜（营收占比29.97%）营收占比29.97%，围绕“AI垂直应用”完善产品矩阵，并已推出AI套系家电。\n北鼎股份：小家电\n公司2026年持续推出全钢蒸锅、全钛锅具、全钛保温杯、全玻璃养生壶等升级新品，中国区前三季度收入6.01亿同比增长27.54%，Q3单季1.88亿同比增长33.9%；公司深耕高品质厨房小家电，主要产品养生壶（营收占比17.43%）、蒸炖锅（31.15%）产品在国补背景下具备较强优势，自主品牌规模效应显现。\n泰嘉股份：昇腾超节点PSU\n2026年11月16日市场传闻（未证实），DeepSeek新版本拟采用原生国产昇腾950DT超节点进行训练的消息，具体方案尚待官方确认。公司通过旗下雅达电子深度布局AI服务器 PSU，通过华为官方认证，进入昇腾供应链，独家代工CloudMatrix 384 超节点高功率电源模块PSU，同时供货微软LES，是国内最早实现PSU供货海外巨头的企业之一。\n盛剑科技：光刻胶+半导体设备\n1、2026年5月18日盘后纪要，2025 年光刻胶显影液（TMAH）回收技术在客户端测试验证成功，蚀刻液回收技术研发完成。\n2、2026年6月25日机构研报，公司是半导体废气处理与厂务设备龙头，已获得亚翔新加坡项目1亿风管代工订单，真空泵、工艺废气处理设备在马来西亚英飞凌厂验证顺利，预计27年可获得设备订单。公司昨晚正式授予股权激励，目标激进，预测26-28年业绩0.7/2.0/3.6。\n西陇科学：光刻胶配套试剂\n公司拥有酸碱类、溶剂类、蚀刻类和光刻胶配套试剂多种，和英特尔（成都）公司等建立合作关系。公司铜蚀刻液实现量产供应，可用于显示面板8.5高世代产线。\n真视通：华为算力\n公司是华为的“多产品金牌代理”，与华为昇腾会谈共同探索“智能算力建设与运营”合作之路。公司作为北京移动数字北京算力服务产品合作伙伴，为北京移动提供GPU高性能计算服务、并行文件存储服务、机房液冷服务、算力网络服务等。\n扬子新材：半导体洁净室\n2026年8月31日互动，公司的主要产品包括高洁净彩涂板、抗静电彩涂板、高韧耐污彩涂板等，主要用于集成电路厂房、医疗场所等建设项目，下游主要客户为净化及洁净类公司。\n亚泰集团：重整投资协议落地\n2026年11月16日晚公告，公司与长发集团、长春兴泰企业管理及其设立的长春泰启企业管理签署《重整投资协议》。重整投资人拟合计出资15.53亿元，受让公司14.19亿股转增股票，占转增后总股本的20.90%。其中，长发集团作为牵头投资人，将在投资完成后取得公司控股权。\n双环科技：氯化铵涨价\n2026年11月16日讯，截至11月16日氯化铵工业级730元/吨创年内新高，上周山东、河北干铵主流价格升至720元/吨，周内大涨80元/吨，涨幅达12.5%。公司本部运用联碱法生产纯碱和氯化铵等化工产品，年产纯碱近110万吨，每生产1吨纯碱同时产生1吨氯化铵。公司自备真空制盐装置，产能130万吨/年。","en":"一组网络消息：\n一、板块热议：\n半导体芯片：业内人士称，已接获晶圆代工调价通知，涨幅从10％至逾20％不等，明年包括台积电在内的合作晶圆厂都将调价。（华东重机、联合化学、国林科技、佳先股份、西陇科学等）\n昇腾：华为云发布并开源昇腾原生具身世界模型，昇腾云已覆盖80%的中国具身智能企业。（华胜天成、泰嘉股份、克莱特、嘉环科技、真视通等）\n氯化铵：联碱法企业因纯碱长期亏损而主动减产，导致副产品氯化铵供应收缩，国内氯化铵工业级价格涨至730元/吨，创年内新高。（中盐化工、和邦生物、双环科技、华昌化工等）\n#华尔街观察最近提示乳业：11月本是原奶传统淡季，但散奶价格较合同奶价出现明显倒挂，反映供应趋紧，部分地区合同奶价上行。（伊利股份、新乳业、光明乳业、骑士乳业等）\n风险提示：以上内容来自公社用户写作，相关信息未经核实，未必准确，请审慎参考。\n二、大涨股解析：\n顺钠股份：干式变压器\n2026年11月16日盘中消息，1-9月全国电网工程投资完成额4594亿元，同比+4.9%，其中8-9月单月投资同比提速，单9月同比+13.8%；此外，机构预计第五批招标有望于12月挂网招标，有可能涉及“2直1交”，招标金额可观公司为国内干式变压器开拓者，主导或参与制定国家及行业标准超过50项，干式变压器规格超过3000种，累计销量超过16.2万台，其它产品包括预装式变电站、开关柜、电抗器、分布式储能柜及储能系统等，同时承接电力成套工程并提供配套运维服务。\n长虹美菱：家电\n公司2026年H1小家电方面已推出集成AI控温、净水和保鲜存储的AI冰吧机，正在开发AI视觉食材识别、膳食大模型、健康数据监测和自适应烹饪调控系统，构建智能健康烹饪方案。公司空调（营收占比55.99%）搭载AI人感技术并布局AI节能算法，冰箱冰柜（营收占比29.97%）营收占比29.97%，围绕“AI垂直应用”完善产品矩阵，并已推出AI套系家电。\n北鼎股份：小家电\n公司2026年持续推出全钢蒸锅、全钛锅具、全钛保温杯、全玻璃养生壶等升级新品，中国区前三季度收入6.01亿同比增长27.54%，Q3单季1.88亿同比增长33.9%；公司深耕高品质厨房小家电，主要产品养生壶（营收占比17.43%）、蒸炖锅（31.15 "vw":290},{"id":"2122657529968857480","h":"qinbafrank","ts":1794915966,"zh":"“看我的大字报如何炮打AI司令部”，华尔街日报这篇特稿真是让我惊到了。标题直接就用了“贬损、派对与一个‘王室家族’”。核心几点：\n1）老黄本人以严苛、当面斥责闻名，会议上会说“你的问题很愚蠢”“这个想法很愚蠢”，还会用“死脸”形容被训后茫然的员工。\n2）女儿黄敏珊（Madison）被描述成实际上的幕僚长，属于非正式的“乐队”核心圈，随父走遍全球，要求同样苛刻，还会用“死脸”“金鱼”（记不住事的人）骂人。\n3）员工普遍认为公司文化是围绕黄仁勋及其成年子女建立的，几乎没有传统公司架构，黄有60个直接下属，家人被私下称为“皇室家族”。\n把这些元素叠在一起，再配合页面导航里的“黄仁勋被罢免”“英伟达风云”“临时首席执行官”，是不是就有了“旧司令部垮台后，把内部运作和文化贴出来清算”的感觉。\n一个把企业带到如此高度的大佬，要说没有个性那是假的，乔布斯、马斯克在也都有过“暴君”标签，但这种过往行事风格，被包装成家族特权、内部秩序来公司贬损。\n个人角度老黄未来一段时间回归英伟达的可能性其实不大了，但这么急迫搞臭一家全球市值第一的上市公司创始人还是第一次看到。大家再一次看到这一次“倒黄”背后几鼓势力合流势能之凶猛。","en":"“看我的大字报如何炮打AI司令部”，华尔街日报这篇特稿真是让我惊到了。标题直接就用了“贬损、派对与一个‘王室家族’”。核心几点：\n1）老黄本人以严苛、当面斥责闻名，会议上会说“你的问题很愚蠢”“这个想法很愚蠢”，还会用“死脸”形容被训后茫然的员工。\n2）女儿黄敏珊（Madison）被描述成实际上的幕僚长，属于非正式的“乐队”核心圈，随父走遍全球，要求同样苛刻，还会用“死脸”“金鱼”（记不住事的人）骂人。\n3）员工普遍认为公司文化是围绕黄仁勋及其成年子女建立的，几乎没有传统公司架构，黄有60个直接下属，家人被私下称为“皇室家族”。\n把这些元素叠在一起，再配合页面导航里的“黄仁勋被罢免”“英伟达风云”“临时首席执行官”，是不是就有了“旧司令部垮台后，把内部运作和文化贴出来清算”的感觉。\n一个把企业带到如此高度的大佬，要说没有个性那是假的，乔布斯、马斯克在也都有过“暴君”标签，但这种过往行事风格，被包装成家族特权、内部秩序来公司贬损。\n个人角度老黄未来一段时间回归英伟达的可能性其实不大了，但这么急迫搞臭一家全球市值第一的上市公司创始人还是第一次看到。大家再一次看到这一次“倒黄”背后几鼓势力合流势能之凶猛。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUxdTdaIAEC-J6.jpg?name=orig","https://pbs.twimg.com/media/HXUxdTXbMAAE87u.jpg?name=orig","https://pbs.twimg.com/media/HXUxdTZakAA-dgl.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122657529968857480","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":1,"rp":2,"vw":2284},{"id":"2122657303228993991","h":"fxtrader","ts":1794915912,"zh":"对于英伟达新设立的国家安全和出口管制监督委员会，特朗普表示，“这是一家伟大的公司，这是一个伟大的想法。”","en":"对于英伟达新设立的国家安全和出口管制监督委员会，特朗普表示，“这是一家伟大的公司，这是一个伟大的想法。”","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122644736548786176/vid/avc1/1280x720/VA-nDB0Hagr8aZil.mp4?tag=29"],"u":"https://x.com/fxtrader/status/2122657303228993991","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":0,"vw":742},{"id":"2122657299466432903","h":"business","ts":1794915911,"zh":"一项新的民意调查显示，随着基金经理削减科技股的投资，投资者对全球人工智能热潮的乐观情绪正在 Cn/status/2122632976815067403","l":["rfi.my"],"ln":[{"u":"https://rfi.my/DEAa","d":"rfi.my"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":679},{"id":"2122632134896517516","h":"business","ts":1794909912,"zh":"秘鲁总统藤森惠子呼吁中国帮助应对厄尔尼诺极端天气现象的影响 o?taid=6afc26d838c51300013dff25&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Peru’s President Keiko Fujimori appealed for help from China in coping with the fallout from the El Niño extreme weather phenomenon","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122632134896517516","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/peru-s-fujimori-appeals-to-xi-for-chinese-help-against-el-nino?taid=6afc26d838c51300013dff25&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":10,"rt":4,"rp":0,"vw":13025},{"id":"2122632109106012451","h":"xingpt","ts":1794909906,"zh":"德鲁肯米勒最新13F：AI产业利润的重新分配\n11月16日，德鲁肯米勒（Stanley Druckenmiller）旗下Duquesne Family Office公布了2026年Q3持仓，13F申报总市值为44.71亿美元，环比下降14.2%，持仓数量从95项减少至65项。\n结合最近几个季度的持仓变化、他今年的公开采访，以及11月份的美股行情，我认为他的投资思路正在发生一些比较重要的变化。\n1. 生物科技可能成为下一轮市场的主线\n很多人关注德鲁肯米勒的半导体持仓，却忽略了生物医药已经成为他最大的配置方向，占13F申报市值的四成左右。\n第一大重仓股是癌症及基因检测公司Natera（$NTRA），持仓市值13.06亿美元，占比从上季度的16.6%上升至29.2%。不过，这期间他的持仓股数实际减少了0.8%，权重提升主要来自股价上涨和其他仓位的收缩。\n此外，他还持有大量生物科技公司，包括：\n$INSM：罕见病治疗\n$RVMD：RAS靶向抗癌药\n$NAMS：心血管疾病创新药\n$BEAM：基因碱基编辑\n$RLAY：精准药物研发\n今年3月，德鲁肯米勒在接受摩根士丹利采访时，解释了自己投资生物科技的几个原因：\n一是生物科技经历了数年的低迷，存在市场领导板块切换的机会；二是行业的技术面和价格动量正在发生变化；三是生物科技可能是AI最具潜力的应用场景之一，尤其是药物研发、疾病诊断和持续监测。\n这笔交易值得重视的地方，在于将产业技术变革、行业周期和市场资金轮动结合起来。\n未来可以重点观察生物科技ETF（$XBI）相对于纳斯达克100（$QQQ）的走势。\n2. 减持AI算力，加仓HDD\nQ3德鲁肯米勒对半导体进行了大幅调仓：\n清仓AMD、Sandisk、Google。\n减持94.5%的台积电、47.9%的意法半导体。\n增持180.2%的希捷科技（$STX）。\n新建仓希捷看涨期权及西部数据（$WDC）。\n两家HDD厂商合计占其13F申报市值的9.9%（含期权对应标的市值）。\n尤其值得注意的是，他清仓了做NAND的Sandisk，同时买入了做HDD的西部数据。\n相比其他半导体细分赛道，HDD具有行业竞争格局高度集中、资本开支相对克制、供给弹性有限等特点。随着AI生成的数据量不断增长，海量数据的长期存储需求，有望转化为HDD厂商的定价能力、利润率和自由现金流增长。\n希捷10月底公布的财报也部分验证了这一逻辑，单季度自由现金流达到14.79亿美元，创历史新高。\n不过，随着AI数据中心融资环境恶化，HDD未来的需求增长也存在被下修的风险。\n3. 从AI基础设施向AI应用进行切换\nQ3德鲁肯米勒大幅增加了部分AI应用公司的配置：\n增持435.5%的Unity（$U）。\n增持42.7%的亚马逊（$AMZN）。\n新建仓AppLovin（$APP）。\n新建仓Palantir（$PLTR）。\n其中Unity和AppLovin这组交易尤其值得关注，两家公司都能通过AI算法提高广告投放效率，并将技术进步直接转化为收入和利润。\n最新财报显示，Unity的AI广告平台Vector收入同比增长126%，AppLovin营收同比增长55%，净利润增长72%。\n过去几年，AI产业的超额利润主要集中在上游算力厂商。但随着模型能力提升、推理成本下降以及竞争加剧，超额利润可能逐渐向具有用户、数据和商业化优势的下游应用公司转移。\n相比需要投入巨额资本开支的云厂商，部分AI应用公司具有更好的资本回报率和利润增长潜力。\n4. 宏观层面：警惕资本稀缺和AI融资风险\n9月10日，据《金融时报》报道，德鲁肯米勒认为，考虑到美国经济、资本开支热潮以及对资本的争夺，即便当时美债收益率已经明显上升，利率可能依然偏低。\n据11月16日《华尔街日报》报道，德鲁肯米勒近期与Paul Tudor Jones在一场闭门会议上就AI泡沫展开辩论。\n他表达了几个重要观点：\nAI是历史上规模最大的技术变革之一。\n其家族办公室已经削减AI相关投资敞口。\n英伟达目前正在获取超常水平的利润（overearning），未来利润率可能下降，竞争对手也会获得更多市场份额。\n资本市场未必愿意为计划中的大规模AI数据中心建设提供足够资金。\n最后一点尤其重要。\n美国政府财政赤字、Hyperscaler资本开支、Neocloud债务融资，都在争夺有限的资本。资本成本的上升，可能成为制约下一阶段AI发展的重要因素。\n此外，德鲁肯米勒在Q3退出了多项宽基指数看涨期权，并同时新建仓三大黄金矿业公司Newmont（$NEM）、Barrick（$B）和Agnico Eagle（$AEM）。\n结合他此前长期看空美元、担忧美国财政可持续性的观点，这部分配置也具有一定的宏观交易属性。\n5. 结合近期行情，推测他四季度做了什么？\n如果按照9月30日披露的持仓静态计算，截至11月16日，德鲁肯米勒的正股组合累计下跌约15.3%，其中两大核心重仓Natera和希捷科技分别下跌约30%和46%。\n相比之下，Unity和AppLovin分别上涨约27%和43%。\n与此同时，美国10年期国债收益率突破5%，AI基础设施企业的信用风险显著上升。\n结合他的近期发言及一贯灵活的交易风格，我推测他在四季度可能进行了以下调整：\n一是进一步削减AI硬件敞口，特别是对数据中心建设速度高度敏感的公司；二是降低部分重仓股的集中度；三是保留部分AI应用和生物科技公司的配置；四是通过现金、短期国债或宏观对冲降低组合整体风险。\n至于加密货币，虽然他在10月29日公开确认投资了Trade[XYZ]，但其Q3加密相关上市公司持仓市值实际上环比下降了约13%。目前没有充分证据表明他正在增加加密资产的方向性多头敞口。\n总结\n我认为，德鲁肯米勒当前的投资主线，可以归纳为四个方向：\n生物科技的行业复苏与技术变革。\nAI产业链内部的利润重新分配。\n具有供给约束和定价能力的细分行业。\n资本成本上升背景下的宏观风险管理。\n过去三年，AI投资最重要的变量是需求增长。未来三年，竞争格局、资本成本、自由现金流和投资回报率可能变得更加重要。\n即使AI产业继续高速发展，产业增长与股东回报之间也可能出现显著分化。\n注：13F持仓截至9月30日，组合收益为不含期权、股息及期间调仓的静态模拟，四季度交易方向为个人推测。","en":"德鲁肯米勒最新13F：AI产业利润的重新分配\n11月16日，德鲁肯米勒（Stanley Druckenmiller）旗下Duquesne Family Office公布了2026年Q3持仓，13F申报总市值为44.71亿美元，环比下降14.2%，持仓数量从95项减少至65项。\n结合最近几个季度的持仓变化、他今年的公开采访，以及11月份的美股行情，我认为他的投资思路正在发生一些比较重要的变化。\n1. 生物科技可能成为下一轮市场的主线\n很多人关注德鲁肯米勒的半导体持仓，却忽略了生物医药已经成为他最大的配置方向，占13F申报市值的四成左右。\n第一大重仓股是癌症及基因检测公司Natera（$NTRA），持仓市值13.06亿美元，占比从上季度的16.6%上升至29.2%。不过，这期间他的持仓股数实际减少了0. t":0,"rp":0,"vw":158},{"id":"2122610469538247089","h":"cnfinancewatch","ts":1794904746,"zh":"美股盘前下午版｜2026年11月17日 周二 北京时间15:05\n#结论\n今日大类只做两个：必选消费与公用事业的低波动防守，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置和资金共振的，只剩靠近前高的苹果；箱底的航天和炼油股还没走出右侧，医药事件票已经伸展，不进只做。\n #苹果 $AAPL 周一收352.78，跌0.98%，距20日高也是52周高360.83还有2.28%，处在近20日区间77%的位置。比上周五的1.3%远了一点，略宽于通常的2%门槛，仍按突破准备的回撤来看，不突破不进。期权最大Call行权价355，距现价只差0.36%，量仓比24.14，Call持仓增仓5.5%，三项同向偏多。卖方目标价均值345.57低于现价，近四周EPS下修16家、上修9家，只给半仓。\n明确不做：半导体和AI硬件，英伟达今晚美股盘后出换帅后第一份财报，周一收156.14，跌4.12%，处在20日区间只剩10%的位置；已经大涨或五日涨幅过大的品种；ARK同买但仍在阴跌的箱底票，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指分化。纳指期货27311，较周一结算27284涨约0.1%；标普期货7425，跌约0.2%；道指期货51489，跌约0.4%。周一纳指收24509.76，跌2.49%，已经离开10月收盘高点10%以上，重新进入技术性调整；标普7416.59，跌1.92%；道指51608.17，跌1.41%；费城半导体跌5.28%。A股今天收盘，上证3584.58跌0.50%，创业板跌1.20%，科创50收1221.19，涨0.62%，比午后低点有所回升。\n #英伟达 $NVDA 今晚盘后发布三季报，是黄仁勋辞职、原CFO克雷斯任临时CEO后的第一份财报。华尔街预期营收约1090亿美元，高于公司自身1080亿美元上下的指引，每股收益约2.47美元。有报道称黄仁勋方面在讨论回归，Yorkville的丹·艾夫斯认为回归希望不大，并下调了预期。有机构把期权隐含波动大约估在7.8%。家得宝、迪士尼今晚美股盘前出季报，明天还有零售销售数据。Anthropic计划周三定价、周四以\n$ANT 在纳斯达克挂牌，区间70到78美元，是本周AI估值的第二块试金石。WTI原油现报84.81美元，较周一再跌约1%，较上周五的88.56已经明显回落。10年期美债收益率周一收5.12%，美元指数约103.47，仍靠近近期高位。VIX周一升至22.91。\n高权重事件里， #CG Oncology $CGON\n公布三期PIVOT-006达到主要终点，膀胱癌复发风险下降68%，事件分最高；但周一放量收84.78，五日涨13.4%，20日涨41%，量比超过8倍，已经伸展，只看不追。\n#Powell工业 $POWL\n周一盘后公布四季度营收3.97亿美元，同比增33%，每股收益2.23美元，新订单7.10亿，积压订单升至27亿美元；周一股价已收151.20，处在20日区间59%，等回踩再看。\n#雷神技术 $RTX 积压订单升至1300亿美元，标普把信用评级上调至A-，但股价在区间中部，距20日高还有5.5%，不追。\n#研报面\n #苹果 卖方均值目标价345.57美元，买入16家、持有8家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。\n#菲利普斯66 $PSX 均值目标价299.13美元，区间258到346美元，买入6家无卖出，近四周EPS上修22家、下修2家。 #Grid\nDynamics $GDYN 均值13.75美元，4家全是买入，近四周EPS上修9家，但今天有律所发布股东调查通知，研报再好也先放一放。\n#资金面\nARK两只及以上基金同买的有三只。 #太空探索科技 $SPCX\n获ARKK与ARKW同买，合计约5190万美元，是本期金额最大的一笔；期权最大Put行权价135，距现价只差1.72%，偏空，和基金买入方向相反，不能算多头共振。\n#Block $XYZ 、 #Shopify $SHOP\n也是多基金同买，但股价分别在20日区间59%和29%，五日仍在回撤，位置不够。邮件还记了ARKQ买入 #火箭实验室 $RKLB\n约90万美元，公开交易记录未核验到；即便算上，期权最大Put行权价57贴着现价57.37，也是偏空，不算共振。\n带方向的期权里，只有 #苹果 最干净：最大Call行权价355距现价-0.36%，量仓比24.14，Call持仓增仓5.5%，三项同向。\n#菲利普斯 //www.bloomberg.com/news/articles/2026-11-17/ing-plans-to-break-into-etfs-with-two-debut-funds-in-germany?taid=6afc1095be5ec50001f2851e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":1,"rp":1,"vw":10445},{"id":"2122607980252111077","h":"qinbafrank","ts":1794904153,"zh":"美股又多了一个能影响股票定价的资产类型，永续合约这一币市原创终于在美股登堂入室。这两天才注意到本月初11月3日，CFTC主席Michael S. Selig 正式宣布，美股个股永续合约可以在符合条件的美国交易所开始交易。这些合约被依据CFTCRegulation 40.3 视为已批准定性为《商品期货现代化法案》下的 security futures products（证券期货产品），由 CFTC 和 SEC 联合监管。\n要求交易所必须同时满足：\n1）CFTC 的DCM牌照；\n2）SEC 的 notice-registered national securities exchange备案（针对 security futures）；\n要特别注意，这是直接挂钩美股正股价格的永续期货合约，不是很多加密交易所上的代币化股票（tokenized stocks）合约。这次美股个股永续合约是CFTC/SEC 框架下的 Equity Perps ，与加密交易所上的美股代币合约是安全不同产品。前者是美国监管机构批准能直接面对美国客户的产品，前者是监管灰色地带的产物。\nKalshi 已在11月5日前后上线，覆盖约50只大型个股（如 Nvidia、SpaceX、Micron 等）。上线10天左右名义成交量已达约50亿美元，单日部分热门标的（如 Nvidia）能到上亿美元级别。Coinbase已经在准备、Backpack也计划很快上线美股个股永续合约。\n这个意义还是非常大的，之前美股只有股指期货合约，并没有个股合约而永续合约更是币市原创，大家只能玩正股和期权。现在美股个股永续合约已经被正式批准，美股又多了一个能影响定价的资产类型。\n现在加密永续已经是一个日成交数千美元、年成交几十万亿美元接近百万亿美金级别的成熟市场。从长期天花板来看，美股个股永续合约（Equity Perps）的潜力确实更大，原因很直接：\n1）底层市场规模差距巨大\n美股市值远超加密资产。传统股权衍生品（股票/指数期货和期权）本身就是万亿美元级别的成熟市场，年合约成交量以百亿张计。如果美股永续能分到传统股权衍生品的一部分流量，或吸引新的杠杆/投机需求，规模很容易超过当前的加密永续。\n2）需求场景更广泛 加密永续高度依赖加密圈内的杠杆交易文化；美股永续则可以同时吸引传统股票投资者、对冲基金、散户杠杆需求，以及希望更简单做空的用户。\n当然短期内规模还需要时间，增长不会那么迅速。毕竟也有限制：\n1）目前美国合规版本的杠杆被压得较低（大致 5–7 倍左右），远低于离岸加密永续常见的 20–100 倍。\n2）产品才刚推出，流动性还在建立阶段；\n3）加密永续已经跑了近十年，生态和用户习惯非常成熟；美股永续还需要时间积累流动性、经纪通道和用户教育。\n现在还面临法律挑战：Cboe 和 Citadel 等组成的团体已起诉 CFTC，认为其无权批准这类产品。法官初步认为原告“很可能在实体问题上胜诉”，但拒绝了紧急禁令，最终结果还不确定、还要看双方博弈的情况。\n美股个股永续如果能在监管和法律挑战中站稳，并逐步提升流动性和可接受度，中长期确实有机会成长到比当前加密永续更大的规模，但那应该是几年后的事情了。","en":"美股又多了一个能影响股票定价的资产类型，永续合约这一币市原创终于在美股登堂入室。这两天才注意到本月初11月3日，CFTC主席Michael S. Selig 正式宣布，美股个股永续合约可以在符合条件的美国交易所开始交易。这些合约被依据CFTCRegulation 40.3 视为已批准定性为《商品期货现代化法案》下的 security futures products（证券期货产品），由 CFTC 和 SEC 联合监管。\n要求交易所必须同时满足：\n1）CFTC 的DCM牌照；\n2）SEC 的 notice-registered national securities exchange备案（针对 security futures）；\n要特别注意，这是直接挂钩美股正股价格的永续期货合约，不是很多加密交易所上的代币化股票（tokenized stocks）合约。这次美股个股永续合约是CFTC/SEC 框架下的 Equity Perps ，与加密交易所上的美股代币合约是安全不同产品。前者是美国监管机构批准能直接面对美国客户的产品，前者是监管灰色地带的产物。\nKalshi 已在11月5日前后上线，覆盖约50只大型个股（如 Nvidia、SpaceX、Micron 等）。上线10天左右名义成交量已达约50亿美元，单日部分热门标的（如 Nvidia）能到上亿美元级别。Coinbase已经在准备、Backpack也计划很快上线美股个股永续合约。\n这个意义还是非常大的，之前美股只有股指期货合约，并没有个股合约而永续合约更是币市原创，大家只能玩正股和期权。现在美股个股永续合约已经被正式批准，美股又多了一个能影响定价的资产类型。\n现在加密永续已经是一个日成交数千美元、年成交几十万亿美元接近百万亿美金级别的成熟市场。从长期天花板来看，美股个股永续合约（Equity Perps）的潜力确实更大，原因很直接：\n1）底层市场规模差距巨大\n美股市值远超加密资产。传统股权衍生品（股票/指数期货和期权）本身就是万亿美元级别的成熟市场，年合约成交量以百亿张计。如果美股永续能分到传统股权衍生品的一部分流量，或吸引新的杠杆/投机需求，规模很容易超过当前的加密永续。\n2）需求场景更广泛 加密永续高度依赖加密圈内的杠杆交易文化；美股永续则可以同时吸引传统股票投资者、对冲基金、散户杠杆需求，以及希望更简单做空的用户。\n当然短期内规模还需要时间，增长不会那么迅速。毕竟也有限制：\n1）目前美国合规版本的杠杆被压得较低（大致 5–7 倍左右），远低于离岸加密永续常见的 20–100 倍。\n2）产品才刚推出，流动性还在建立阶段；\n3）加密永续已经跑了近十年，生态和用户习惯非常成熟；美股永续还需要时间积累流动性、经纪通道和用户教育。\n现在还面临法律挑战：Cboe 和 Citadel 等组成的团体已起诉 CFTC，认为其无权批准这类产品。法官初步认为原告“很可能在实体问题上胜诉”，但拒绝了紧急禁令，最终结果还不确定、还要看双方博弈的情况。\n美股个股永续如果能在监管和法律挑战中站稳，并逐步提升流动性和可接受度，中长期确实有机会成长到比当前加密永续更大的规模，但那应该是几年后的事情了。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUEtKsbsAA_Vqi.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122607980252111077","l":[],"ln":[],"t":["美股","汇率","AI科技"],"lk":30,"rt":4,"rp":22,"vw":14567},{"id":"2122606961216586060","h":"business","ts":1794903910,"zh":"伊朗继续袭击巴林美国基地，且天气模型预示寒流即将到来，欧洲天然气价格上涨","en":"European natural gas ticked higher after Iran continued to attack US bases in Bahrain and weather models pointed to an upcoming cold spell","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122606961216586060","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/europe-gas-edges-higher-on-middle-east-tensions-weather-outlook?taid=6afc0f667d7c3100018f900d&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["原油能源"],"lk":9,"rt":1,"rp":3,"vw":11820},{"id":"2122605703999144094","h":"business","t 55","h":"yijiangren","ts":1794897760,"zh":"想像玩游戏一样做交易吗？\n大家还记得前两天的 LOL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意思多了。\n二，交易也能像玩游戏一样升级\n这是我个人最喜欢的设计。\n引入了 XP、等级、成就和 Trading Drops 机制。\n交易产生的成交量可以转化为 XP，XP 累积之后可以提升等级。\n随着参与度增加，还能获得不同稀有度的 Mystery Box。\n里面有头像框、专属名牌、称号和弹幕样式等个性化道具。\n从 Common 到 Legendary，一共有四个稀有度。\n你甚至可以通过自己的等级、头像框和称号，让其他人知道你在这个社区里的身份。\n这就有点像 MMORPG 里的角色成长系统。\n每个人都有自己的等级、装备和专属身份。\n交易之外，还多了一层收集和养成的乐趣。\n三，把交易、社交和游戏放进同一个地方\n的底层交易接入 Hyperliquid。\n它把行情、交易执行、实时聊天室、K 线弹幕和游戏化奖励融合在一个界面里。\n这意味着你不需要在行情软件、X、Telegram 和 DEX 之间反复切换。\n看行情、讨论市场、观察其他人的观点，以及执行交易，都可以在同一个地方完成。\n这也是它和传统 DEX 最明显的差异。\n传统 DEX 更像一个交易终端， 则试图把它变成一个有社区、有互动、有成长体系的交易空间。\n我一直认为，加密的特殊之处在于：价格由交易决定，叙事靠社区传播，情绪在社交网络里发酵。\n如果这些东西能够在同一个产品里形成闭环，用户体验自然会发生变化。\n当然，游戏化奖励只是额外体验，没必要为了刷 XP 而过度交易。\n但我确实很喜欢 的产品思路。\n交易本来就可以很有趣。\n一个人盯盘是交易，一群人一起看市场、讨论行情、分享观点，或许才是加密社区更有生命力的样子。\n想体验一下这种交易方式，可以去看看：\nTrade together, farm fun together.","en":"想像玩游戏一样做交易吗？\n大家还记得前两天的 LOL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意思多了。\n二，交易也能像玩游戏一样升级\n这是我个人最喜欢的设计。\n引入了 XP、等级、成就和 Trading Drops 机制。\n交易产生的成交量可以转化为 XP，XP 累积之后可以提升等级。\n随着参与度增加，还能获得不同稀有度的 Mystery Box。\n里面有头像框、专属名牌、称号和弹幕样式等个性化道具。\n从 Common 到 Legendary，一共有四个稀有度。\n你甚至可以通过自己的等级、头像框和称号，让其他人知道你在这个社区里的身份。\n这就有点像 MMORPG 里的角色成长系统。\n每个人都有自己的等级、装备和专属身份。\n交易之外，还多了一层收集和养成的乐趣。\n三，把交易、社交和游戏放进同一个地方\n的底层交易接入 Hyperliquid。\n它把行情、交易执行、实时聊天室、K 线弹幕和游戏化奖励融合在一个界面里。\n这意味着你不需要在行情软件、X、Telegram 和 DEX 之间反复切换。\n看行情、讨论市场、观察其他人的观点，以及执行交易，都可以在同一个地方完成。\n这也是它和传统 DEX 最明显的差异。\n传统 DEX 更像一个交易终端， 则试图把它变成一个有社区、有互动、有成长体系的交易空间。\n我一直认为，加密的特殊之处在于：价格由交易决定，叙事靠社区传播，情绪在社交网络里发酵。\n如果这些东西能够在同一个产品里形成闭环，用户体验自然会发生变化。\n当然，游戏化奖励只是额外体验，没必要为了刷 XP 而过度交易。\n但我确实很喜欢 的产品思路。\n交易本来就可以很有趣。\n一个人盯盘是交易，一群人一起看市场、讨论行情、分享观点，或许才是加密社区更有生命力的样子。\n想体验一下这种交易方式，可以去看看：\nTrade together, farm fun together.","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXTsDEOaMAAZFZF.jpg?name=orig","https://pbs.twimg.com/media/HXTsF4sa4AAdoqe.jpg?name=orig","https://pbs.twimg.com/media/HXTsJZ5bsAAhdoR.jpg?name=orig","https://pbs.twimg.com/media/HXTsMJeaAAAxadS.jpg?name=orig"],"u":"https://x.com/yijiangren/status/2122581167417540855","l":["Together.fun","Together.fun","Together.fun"],"ln":[{"u":"http://Together.fun","d":"Together.fun"},{"u":"http://Together.fun","d":"Together.fun"},{"u":"http://Together.fun","d":"Together.fun"}],"t":[],"lk":45,"rt":0,"rp":27,"vw":3876},{"id":"2122580762340073902","h":"SCMPNews","ts":1794897664,"zh":"特朗普权衡伊朗选择之际，美国第三艘航母抵达中东","en":"Third US aircraft carrier reaches Middle East as Trump weighs Iran options","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122580762340073902","l":["sc.mp"],"ln":[{"u":"https://sc.mp/klr4x","d":"sc.mp"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":1181},{"id":"2122580540725293377","h":"business","ts":1794897611,"zh":"苏黎世保险集团表示，由于今年早些时候收购的专业保险公司 Beazley 的整合，预计中期收入每年将增加约 15 亿美元。","en":"Zurich Insurance Group said it now expects increased revenue of around $1.5 billion per yea const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
