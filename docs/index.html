tus/2121493300922458314","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":1114},{"id":"2121485913847128527","h":"cnfinancewatch","ts":1794636631,"zh":"都会回关评论。不急。慢慢来哦！","en":"都会回关评论。不急。慢慢来哦！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121485913847128527","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":42},{"id":"2121475200613319068","h":"cnfinancewatch","ts":1794634077,"zh":"散户热议｜2026-11-14·午间\n数据时点：国内社区浏览截至北京时间11月14日13:30，海外讨论数据截至美东11月13日收盘后（北京时间11月14日上午）。国内部分直接浏览韭研公社首页公开帖子；Reddit与Stocktwits直连被拦截，海外部分改用StonkHub对WallStreetBets的统计和Stocktwits官方新闻稿，均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周末在复盘，也在找下一个故事\n韭研公社首页周五到周六最显眼的是三类帖子。\n第一类是复盘亏钱效应。社区一篇11月13日的涨停汇总写得很直白：沪指跌0.59%、创业板指跌3.32%，超4700只个股下跌，38只涨停、34只跌停，炸板率约36%。周六上午一篇复盘把近期热点归为机器人、短剧等几条线，并承认大业股份、襄阳轴承这两个机器人龙头周五批量跌停，“可能会提前休整”。情绪方向偏谨慎，不是恐慌。\n第二类是高低切换。短剧和AI漫剧仍是讨论最集中的方向，文投控股、幸福蓝海、中国电影反复被提。一个值得注意的细节：社区帖子写文投控股“18天10板”，午间热点财经邮件写“14天9板”，统计区间不同，但都说明位置已高。另一条切换线是大消费，有帖子把来伊份包装成“首发经济加谷子经济”，与邮件提到的公募大消费持仓回暖属同一叙事，只是社区更偏短线炒作。\n第三类是英伟达换帅后的“国产替代”叙事。多篇帖子从黄仁勋辞职推导国产AI芯片窗口期，点名寒武纪、燧原科技、沐曦股份等；也有帖子拆解超聚变过会后的产业链受益方，提到华胜天成、软通动力、神州数码等。这和券商口径有相同点，都认可国产算力中期逻辑；不同点在于社区几乎不谈超聚变上半年经营现金流为负、也不谈过会到上市还隔注册与询价，容易把“过会”读成“马上兑现”。\n被忽略的风险：一是周六监管层讲话提到减少羊群效应和短期化交易，对接力炒作并不友好，社区今天对此讨论很少；二是韭研公社首页置顶了打击吹票的专帖，说明平台本身也在约束荐股帖，个股“深度梳理”类帖子要打折看。医保目录的讨论截至发稿时还不多，周一可能成为新的接力方向，但创新药的业绩兑现要到2027年。\n海外：散户抄底，机构降级\nWallStreetBets方面（StonkHub统计，二手）：过去7天有1025人在WSB讨论英伟达，人数比前一周增加622%；全Reddit口径下看空占40.6%、看多占37.7%，多空基本对半。过去24小时热帖里，有帖子转述英伟达员工在内部论坛要求黄仁勋回归，还有标题直接叫“Jensen\ncomeback”，说明社区相当一部分在押注人事反转，而不是基本面。\nStocktwits方面（官方新闻稿，二手）：英伟达散户情绪为“极度看多”，一周消息量增加593%；一项站内投票显示58%的人在抄底、42%回避。另一篇报道称SPY、QQQ、DIA的散户情绪已从10月底的“看空”升至“极度看多”。\n与券商口径的差异很明显：汇丰、Truist、Craig-Hallum都已降到持有，Truist把目标价从346美元砍到174美元，理由是治理和出口调查风险比估值更重要；散户则把下跌当成打折。11月17日财报是两种看法的交汇点。\n追高与被忽略的风险：第一，英伟达已连跌六周，散户抄底多发生在治理问题没有结论之前，若国会或联邦调查出新消息，抄底仓位会先被止损；第二，Anthropic定于11月19日上市，社区热度高，但估值区间对应约1.4万亿美元，首日追高风险不小；第三，美国PPI同比6.5%、美联储稳定报告点名AI估值，利率端的压力在散户讨论里几乎缺席。\n小结：国内散户在亏钱效应里找切换，海外散户在下跌里找反转。两边都偏向押事件，而不是押业绩，下周英伟达财报和医保目录后的创新药行情，会检验谁的判断更扎实。\n来源：韭研公社公开首页帖子、StonkHub对WSB的统计页、Stocktwits新闻稿、雅虎财经转载的Stocktwits市场稿；以上为社区讨论整理，不代表本文观点，不构成投资建议。","en":"散户热议｜2026-11-14·午间\n数据时点：国内社区浏览截至北京时间11月14日13:30，海外讨论数据截至美东11月13日收盘后（北京时间11月14日上午）。国内部分直接浏览韭研公社首页公开帖子；Reddit与Stocktwits直连被拦截，海外部分改用StonkHub对WallStreetBets的统计和Stocktwits官方新闻稿，均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周末在复盘，也在找下一个故事\n韭研公社首页周五到周六最显眼的是三类帖子。\n第一类是复盘亏钱效应。社区一篇11月13日的涨停汇总写得很直白：沪指跌0.59%、创业板指跌3.32%，超4700只个股下跌，38只涨停、34只跌停，炸板率约36%。周六上午一篇复盘把近期热点归为机器人、短剧等几条线，并承认大业股份、襄阳轴承这两个机器人龙头周五批量跌停，“可能会提前休整”。情绪方向偏谨慎，不是恐慌。\n第二类是高低切换。短剧和AI漫剧仍是讨论最集中的方向，文投控股、幸福蓝海、中国电影反复被提。一个值得注意的细节：社区帖子写文投控股“18天10板”，午间热点财经邮件写“14天9板”，统计区间不同，但都说明位置已高。另一条切换线是大消费，有帖子把来伊份包装成“首发经济加谷子经济”，与邮件提到的公募大消费持仓回暖属同一叙事，只是社区更偏短线炒作。\n第三类是英伟达换帅后的“国产替代”叙事。多篇帖子从黄仁勋辞职推导国产AI芯片窗口期，点名寒武纪、燧原科技、沐曦股份等；也有帖子拆解超聚变过会后的产业链受益方，提到华胜天成、软通动力、神州数码等。这和券商口径有相同点，都认可国产算力中期逻辑；不同点在于社区几乎不谈超聚变上半年经营现金流为负、也不谈过会到上市还隔注册与询价，容易把“过会”读成“马上兑现”。\n被忽略的风险：一是周六监管层讲话提到减少羊群效应和短期化交易，对接力炒作并不友好，社区今天对此讨论很少；二是韭研公社首页置顶了打击吹票的专帖，说明平台本身也在约束荐股帖，个股“深度梳理”类帖子要打折看。医保目录的讨论截至发稿时还不多，周一可能成为新的接力方向，但创新药的业绩兑现要到2027年。\n海外：散户抄底，机构降级\nWallStreetBets方面（StonkHub统计，二手）：过去7天有1025人在WSB讨论英伟达，人数比前一周增加622%；全Reddit口径下看空占40.6%、看多占37.7%，多空基本对半。过去24小时热帖里，有帖子转述英伟达员工在内部论坛要求黄仁勋回归，还有标题直接叫“Jensen\ncomeback”，说明社区相当一部分在押注人事反转，而不是基本面。\nStocktwits方面（官方新闻稿，二手）：英伟达散户情绪为“极度看多”，一周消息量增加593%；一项站内投票显示58%的人在抄底、42%回避。另一篇报道称SPY、QQQ、DIA的散户情绪已从10月底的“看空”升至“极度看多”。\n与券商口径的差异很明显：汇丰、Truist、Craig-Hallum都已降到持有，Truist把目标价从346美元砍到174美元，理由是治理和出口调查风险比估值更重要；散户则把下跌当成打折。11月17日财报是两种看法的交汇点。\n追高与被忽略的风险：第一，英伟达已连跌六周，散户抄底多发生在治理问题没有结论之前，若国会或联邦调查出新消息，抄底仓位会先被止损；第二，Anthropic定于11月19日上市，社区热度高，但估值区间对应约1.4万亿美元，首日追高风险不小；第三，美国PPI同比6.5%、美联储稳定报告点名AI估值，利率端的压力在散户讨论里几乎缺席。\n小结：国内散户在亏钱效应里找切换，海外散户在下跌里找反转。两边都偏向押事件，而不是押业绩，下周英伟达财报和医保目录后的创新药行情，会检验谁的判断更扎实。\n来源：韭研公社公开首页帖子、StonkHub对WSB的统计页、Stocktwits新闻稿、雅虎财经转载的Stocktwits市场稿；以上为社区讨论整理，不代表本文观点，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121475200613319068","l":[],"ln":[],"t":["美联储","A股港股","AI科技","财报"],"lk":1,"rt":0,"rp":0,"vw":376},{"id":"2121475015959077125","h":"cnfinancewatch","ts":1794634033,"zh":"热点财经新闻综述｜2026-11-14·午间\n数据时点：A股为11月13日（周五）收盘，美股为美东11月13日收盘（北京时间11月14日05:00），周末消息整理截至北京时间11月14日13:30。本期邮箱新增两封热点财经邮件（早间08:10版、午间13:10版），凡标“邮件转述”的内容未逐条核实，其余已对照官方或主流媒体公开报道。今天周六，沪深与美股均休市。\n今日判断\n周六上午出了两件对A股定价有分量的事：国家医保局发布2026年版医保目录，证监会主席吴清在首届中国资本市场学术年会致辞。前者给创新药一个看得见的支付端增量，后者给“稳市”加了一层制度预期。但外部的主要矛盾没变，下周二（11月17日）英伟达财报才是AI硬件链的胜负手。我们对下周的基调是：创新药和稳市受益方向可以先布局，AI硬件等财报落地再说，高位题材股继续回避。\n三大利多方向（由强到弱）\n一、创新药与CAR-T。已核实：医保局与人社部11月14日发布新版目录，新增107种药品，其中1类创新药51个，创历史新高；药明巨诺的瑞基奥仑赛成为首个进入基本医保的CAR-T产品；商保创新药目录新增12种、总数28种；新版目录2027年1月1日执行。为什么重要：支付端放开决定创新药放量的天花板，独家品种的销售预期会被重估。口径提示：邮件称CAR-T报销后患者自付或在10万元以内，公开报道更常见的说法是谈判后年治疗费用“有望降至30万元以内”，以后者为准。邮件另点名百利天恒、东阳光相关品种入选，我们尚未逐一核对。制约：降价幅度要等谈判价格细节，业绩兑现在2027年。\n二、稳市制度与券商、高股息。已核实：吴清提出系统构建“稳的机制、稳的力量、稳的生态”，研究评估量化交易、股份减持等制度优化，并加强大型和新型科技企业发行上市的制度适配性研究。此前11月3日央行开展第三批互换便利操作1000亿元，31家券商和基金参与；回购增持再贷款转为长期安排、利率降至1%。投资含义：券商、权重蓝筹、高股息资产的下行保护更厚。制约：讲话以“研究”为主，没有落地细则，周一不宜期待脉冲行情。\n三、国产算力服务器与AI定价锚。已核实：超聚变11月12日创业板过会，拟募资80亿元，为今年创业板上会最大项目；2026年上半年营收372.86亿元、归母净利21.08亿元。Anthropic计划11月18日定价、19日在纳斯达克上市，发行区间70至78美元，对应估值约1.3万亿至1.4万亿美元。对谁有利：国产服务器配套、算力服务和AI应用端。制约：超聚变上半年经营现金流为-156.85亿元，过会后还需注册与询价；巨型IPO也会分流资金。\n三大利空方向（由强到弱）\n一、英伟达领导层真空与财报风险。已核实：英伟达周五收162.85美元，单周跌约13%，连续第六周下跌；汇丰、Truist、Craig-Hallum先后下调至持有；临时CEO为CFO克雷斯。邮件转述：董事会接触Arm\nCEO Rene Haas。A股周五中际旭创、新易盛跌超8%（邮件与公开盘面一致）。财报若指引稳住，超跌反弹会很猛，空头不宜追；若订单口径松动，光模块、PCB还有一段。\n二、海外利率与AI估值警示。已核实：美国10月PPI环比0.3%低于预期，但同比6.5%为2022年11月以来最高；美联储11月13日金融稳定报告把AI列为最受关注的风险，指出股票估值偏高。邮件转述：柯林斯称很快需要进一步加息。对谁不利：高估值成长股、黄金、加密资产。\n三、高位题材退潮。邮件转述：大东方收监管工作函后跌停，阳光照明、闽发铝业等高位连板股跌停，机器人龙头大业股份、襄阳轴承跌停。吴清讲话点名减少“羊群效应”和短期化交易，对炒作情绪是边际约束。短剧影视仍是最强分支，但文投控股连板天数邮件与社区口径不一（14天9板与18天10板），说明已在高位，追高赔率很差。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"热点财经新闻综述｜2026-11-14·午间\n数据时点：A股为11月13日（周五）收盘，美股为美东11月13日收盘（北京时间11月14日05:00），周末消息整理截至北京时间11月14日13:30。本期邮箱新增两封热点财经邮件（早间08:10版、午间13:10版），凡标“邮件转述”的内容未逐条核实，其余已对照官方或主流媒体公开报道。今天周六，沪深与美股均休市。\n今日判断\n周六上午出了两件对A股定价有分量的事：国家医保局发布2026年版医保目录，证监会主席吴清在首届中国资本市场学术年会致辞。前者给创新药一个看得见的支付端增量，后者给“稳市”加了一层制度预期。但外部的主要矛盾没变，下周二（11月17日）英伟达财报才是AI硬件链 5%9B%A0%E5%A9%9A%E5%A4%96%E6%83%85%E8%A2%AB%E8%BF%AB%E8%BE%9E%E8%81%8C%E8%8B%B1%E4%BC%9F%E8%BE%BE%E6%89%A7%E8%A1%8C%E9%95%BF","en":"黄仁勋何竟只因婚外情被迫辞职英伟达执行长 www.​rfi.​fr/cn/%E4%B8%AD%E5%9B%BD/20261114-%E9%BB%84%E4%BB%81%E5%8B%8B%E4%BD%95%E7%AB%9F%E5%8F%AA%E5%9B%A0%E5%A9%9A%E5%A4%96%E6%83%85%E8%A2%AB%E8%BF%AB%E8%BE%9E%E8%81%8C%E8%8B%B1%E4%BC%9F%E8%BE%BE%E6%89%A7%E8%A1%8C%E9%95%BF","zh_src":"native","lang":"ja","m":["https://pbs.twimg.com/media/HXDBXrxbEAA0Yvg.jpg?name=orig"],"u":"https://x.com/RFI_Cn/status/2121408038829756681","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":814},{"id":"2121407969791283695","h":"ReutersChina","ts":1794618048,"zh":"能源危机、地区冲突笼罩峰会，东盟团结面临考验","en":"ASEAN unity faces test as energy crisis, regional conflicts loom over summit","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2121407969791283695","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/business/energy/asean-unity-faces-test-energy-crisis-regional-conflicts-loom-over-summit-2026-11-13/?taid=6af7b2c0718669000140a46a&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["原油能源"],"lk":0,"rt":0,"rp":0,"vw":596},{"id":"2121407194482581603","h":"SCMPNews","ts":1794617863,"zh":"白宫在亚太经合组织会议期间确认美中俄三边关系","en":"White House confirms US-China-Russia trilateral on Apec sidelines","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2121407194482581603","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/china/diplomacy/article/3374415/white-house-confirms-us-china-russia-trilateral-apec-sidelines?utm_medium=Social&utm_source=Twitter#Echobox=1794617147-1","d":"scmp.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":1331},{"id":"2121398084005744812","h":"cnfinancewatch","ts":1794615691,"zh":"华尔街观察： #为什么AI短剧制作者全线亏损？ #AI投融资如火如荼但股市为什么下跌？\n#我对AI短期是否造福人类感到悲观\nAI生产力狂飙，旧生产关系锁死普通人红利\nAI技术已带领社会生产力迈入指数级迭代的全新时代，内容生成、文案创作、视频制作、数据处理的边际成本近乎归零，效率实现跨越式突破。但残酷的现实是：生产力已经进入AI时代，生产关系却停滞在互联网买量时代，这种结构性错位，让本轮技术革命几乎无法普惠普通劳动者，短期难言造福大众。\n当下AI创造的全部效率红利，并未流向从业者，而是被平台流量体系层层收割。从业者借助AI省下的时间、压缩的成本，没有转化为休息时间与收益增量，反而全部沦为投流竞价、同行内卷的弹药。所有人用AI降本增效，最终结果不是行业减负，而是流量价格水涨船高，所有效率盈余最终变成平台的“流量税”，完成资本单向收割。\n市场正在验证残酷的“牛马守恒定律”：技术工具越先进，行业考核基准、产出门槛同步抬升。AI消灭了低效重复劳动，却催生了无差别的高强度内卷。劳动者被迫用更高效率匹配更高KPI，效率越高、负荷越重、内卷越深。技术解放劳动的初衷彻底失效，只是变相延长了劳动时长、加剧了生存竞争。\n深层症结在于旧有生产关系与分配体系的彻底滞后。当前流量分发、算法规则、渠道垄断仍牢牢掌握在头部平台手中，全要素生产率的提升被垄断结构锁死。没有分配机制的革新、没有流量壁垒的打破、没有垄断格局的重构，单纯的技术进步只会加剧贫富分化。\n技术本身无罪，但制度决定红利归属。在生产关系完成适配改革前，AI不会成为普通人的福利，只会成为资本加剧收割、行业加剧内卷的工具。AI生产力狂奔不止，旧枷锁纹丝不动，这便是当下技术时代最大的结构性悲观现实。","en":"华尔街观察： #为什么AI短剧制作者全线亏损？ #AI投融资如火如荼但股市为什么下跌？\n#我对AI短期是否造福人类感到悲观\nAI生产力狂飙，旧生产关系锁死普通人红利\nAI技术已带领社会生产力迈入指数级迭代的全新时代，内容生成、文案创作、视频制作、数据处理的边际成本近乎归零，效率实现跨越式突破。但残酷的现实是：生产力已经进入AI时代，生产关系却停滞在互联网买量时代，这种结构性错位，让本轮技术革命几乎无法普惠普通劳动者，短期难言造福大众。\n当下AI创造的全部效率红利，并未流向从业者，而是被平台流量体系层层收割。从业者借助AI省下的时间、压缩的成本，没有转化为休息时间与收益增量，反而全部沦为投流竞价、同行内卷的弹药。所有人用AI降本增效，最终结果不是行业减负，而是流量价格水涨船高，所有效率盈余最终变成平台的“流量税”，完成资本单向收割。\n市场正在验证残酷的“牛马守恒定律”：技术工具越先进，行业考核基准、产出门槛同步抬升。AI消灭了低效重复劳动，却催生了无差别的高强度内卷。劳动者被迫用更高效率匹配更高KPI，效率越高、负荷越重、内卷越深。技术解放劳动的初衷彻底失效，只是变相延长了劳动时长、加剧了生存竞争。\n深层症结在于旧有生产关系与分配体系的彻底滞后。当前流量分发、算法规则、渠道垄断仍牢牢掌握在头部平台手中，全要素生产率的提升被垄断结构锁死。没有分配机制的革新、没有流量壁垒的打破、没有垄断格局的重构，单纯的技术进步只会加剧贫富分化。\n技术本身无罪，但制度决定红利归属。在生产关系完成适配改革前，AI不会成为普通人的福利，只会成为资本加剧收割、行业加剧内卷的工具。AI生产力狂奔不止，旧枷锁纹丝不动，这便是当下技术时代最大的结构性悲观现实。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121398084005744812","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":407},{"id":"2121396462424887640","h":"cnfinancewatch","ts":1794615304,"zh":"截至11月，股票型ETF自9月28日起连续25个交易日净流入，累计约6215亿元，刷新最长纪录；7月单周曾扫入2036亿元，历史单周最高；11月3日单日净流入837.59亿元，年内峰值。但市场仍在磨底：10月上证跌6.33%，创业板跌23.02%，科创50跌24.13%；11月指数在3600点上下反复，科技股反弹一波三折，全市场动辄超4600只个股下跌。\n钱去哪了？高度集中：9月28日至10月30日，沪深300ETF华泰柏瑞净流入624亿，科创50ETF华夏501亿，创业板ETF易方达493亿；宽基ETF累计吸金约6000亿，7只核心宽基就拿走近5000亿。宽基ETF天然逆周期——越弱越托底，稍稳即收力，使命是防失控，不是点火；同时集中抽走中小盘流动性，形成“越买ETF、个股越弱”。\n看出水：2026年上半年重要股东实际减持4894亿，截至8月底约5600亿，已远超2025年全年约4000亿的水平；IPO截至11月11日募资2275亿，是2025年全年1318亿的近1.7倍；再融资截至8月已超4700亿，前三季度股权融资合计7164亿。流出端合计约1.3万亿—1.4万亿量级。对冲端：分红已实施2.29万亿，回购实施超1500亿，增持计划大几百亿，合计约2.5万亿。净现金流仍是正的，但结构极度不均：分红流向长期资金和原始股东，ETF集中权重，减持和融资分散抽血中小盘。\n增量还有：险资一季度持仓增1024亿，机构预测全年入市0.9万亿—1.2万亿，高股息占比74%居历史高位；公募权益类新发截至10月逼近5000亿；国家队ETF持仓存量约1.5万亿，仍是压舱石但不造弹性。\n托底要多少钱？高盛2000亿、李迅雷2万亿—3万亿、中信2.3万亿—4.6万亿，逻辑没变：前提是止血。减持从4000亿级跳到5600亿以上，IPO和再融资同步放大，出水口不收，增量进来仍会被对冲。6215亿买到的还是“不崩”，离“起来”隔着减持约束、融资节奏和盈利修复三件事。缺了它们，堆钱的结果依然是：指数有面子，账户没里子。\n原创不易，转发不要去掉名字，谢谢 @cnfinancewatch","en":"截至11月，股票型ETF自9月28日起连续25个交易日净流入，累计约6215亿元，刷新最长纪录；7月单周曾扫入2036亿元，历史单周最高；11月3日单日净流入837.59亿元，年内峰值。但市场仍在磨底：10月上证跌6.33%，创业板跌23.02%，科创50跌24.13%；11月指数在3600点上下反复，科技股反弹一波三折，全市场动辄超4600只个股下跌。\n钱去哪了？高度集中：9月28日至10月30日，沪深300ETF华泰柏瑞净流入624亿，科创50ETF华夏501亿，创业板ETF易方达493亿；宽基ETF累计吸金约6000亿，7只核心宽基就拿走近5000亿。宽基ETF天然逆周期——越弱越托底，稍稳即收力，使命是防失控，不是点火；同时集中抽走中小盘流动性，形成“越买ETF、个股越弱”。\n看出水：2026年上半年重要股东实际减持4894亿，截至8月底约5600亿，已远超2025年全年约4000亿的水平；IPO截至11月11日募资2275亿，是2025年全年1318亿的近1.7倍；再融资截至8月已超4700亿，前三季度股权融资合计7164亿。流出端合计约1.3万亿—1.4万亿量级。对冲端：分红已实施2.29万亿，回购实施超1500亿，增持计划大几百亿，合计约2.5万亿。净现金流仍是正的，但结构极度不均：分红流向长期资金和原始股东，ETF集中权重，减持和融资分散抽血中小盘。\n增量还有：险资一季度持仓增1024亿，机构预测全年入市0.9万亿—1.2万亿，高股息占比74%居历史高位；公募权益类新发截至10月逼近5000亿；国家队ETF持仓存量约1.5万亿，仍是压舱石但不造弹性。\n托底要多少钱？高盛2000亿、李迅雷2万亿—3万亿、中信2.3万亿—4.6万亿，逻辑没变：前提是止血。减持从4000亿级跳到5600亿以上，IPO和再融资同步放大，出水口不收，增量进来仍会被对冲。6215亿买到的还是“不崩”，离“起来”隔着减持约束、融资节奏和盈利修复三件事。缺了它们，堆钱的结果依然是：指数有面子，账户没里子。\n原创不易，转发不要去掉名字，谢谢 @cnfinancewatch","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121396462424887640","l":[],"ln":[],"t":["A股港股"],"lk":2,"rt":0,"rp":1,"vw":601},{"id":"2121394933018030216","h":"fxtrader","ts":1794614940,"zh":"美国财长贝森特：我遵循特勤局的指示，已从家中搬到军事基地。我想说的是，我不得不搬家的原因之一，就是《华尔街日报》在我买房当天刊登了我房子的照片，而且带有地理定位信息。我们曾恳求编辑不要刊登我家的位置，但他们还是刊登了。这极其不负责任且危险，类似行为必须停止。","en":"美国财长贝森特：我遵循特勤局的指示，已从家中搬到军事基地。我想说的是，我不得不搬家的原因之一，就是《华尔街日报》在我买房当天刊登了我房子的照片，而且带有地理定位信息。我们曾恳求编辑不要刊登我家的位置，但他们还是刊登了。这极其不负责任且危险，类似行为必须停止。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2121394933018030216","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":0,"vw":2125},{"id":"2121393051478442284","h":"cnfinancewatch","ts":1794614491,"zh":"订阅区公布了我们的大类轮动和两个锤型动平衡账户的原始数据\n周日下午“周报”将公布提炼的持仓数据","en":"订阅区公布了我们的大类轮动和两个锤型动平衡账户的原始数据\n周日下午“周报”将公布提炼的持仓数据","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121393051478442284","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":807},{"id":"2121392666911121696","h":"cnfinancewatch","ts":1794614400,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXA06oLbwAAaaxw.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2121392666911121696","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":136},{"id":"2121391967133430233","h":"cnfinancewatch","ts":1794614233,"zh":"热点财经新闻综述｜2026-11-14·早间\n数据时点：A股为11月13日收盘，美股为美东11月13日收盘（北京时间11月14日05:00），整理截至北京时间11月14日07:40。本期邮箱新增一封11月13日晚间热点财经邮件，以下凡标“邮件转述”的内容未逐条核实，其余已对照公开网页。\n今日判断 本周末的核心矛盾很清楚：一边是英伟达换帅后的AI硬件重定价，一边是美联储加息预期从“可能”变成“几乎确定”。\n周五A股创业板指跌3.32%，美股费城半导体指数再跌3.43%，两地硬件链同步承压；\n同时银行、影视、猪肉、能源在接资金。\n下周一开盘，我们的基调是防御为先、科技等止跌信号，不建议在周末情绪里提前抄底硬件高位股。\n三大利多方向（由强到弱）\n一、银行与高股息。已核实：11月13日银行板块涨约1.46%，江苏银行、南京银行、青岛银行、成都银行、杭州银行盘中创历史新高；11月12日华宝银行ETF净流入5.58亿元。为什么重要：美债10年期收益率周五在5.1%以上，CME FedWatch显示市场对12月9日加息的定价接近100%，成长股估值的锚被抬高，低波动高股息成了机构年末调仓的蓄水池。对谁有利：城商行、国有大行、保险。制约：拥挤度已快速上升，若下周科技反弹，银行可能出现短线获利了结。\n二、能源与石油石化。已核实：布伦特1月合约周五收于约96.32美元，美股能源板块领涨，雪佛龙涨1.64%。背景是特朗普称美国不需要与伊朗达成协议，地缘溢价回升。对A股：中国海油、中国石油等“三桶油”周五抗跌。制约：邮件转述IEA月报下修未来两年石油需求，油价中期上行空间受需求端压制，更适合当防御仓位而非进攻主线。\n三、政策驱动的储能与输配电。邮件转述：两部门印发“十五五”新型储能实施方案；思源电气三季报收入保持高增长。这属于中期逻辑，周五盘面未见大规模资金响应，个股行情数据邮件也未给出。我们的看法是逻辑顺、节奏慢，适合在硬件链出清期间逢低关注，而不是追涨。\n三大利空方向（由强到弱） 一、AI硬件链重定价。已核实：英伟达周五再跌2.01%至162.85美元，创52周新低，本周累计跌约13%，为连续第六周下跌；汇丰下调至持有。A股周五元件板块跌6.29%，CPO跌4.40%，中际旭创、新易盛、天孚通信等成交居前且大跌。为什么重要：市场正在从“信任单一龙头”转向“按订单确定性定价”，绑定英伟达出货的光模块、PCB首当其冲。关键节点：公开报道显示英伟达11月17日发布三季度财报，这是下周最大的单一变量。制约：美股散户周四开盘半小时净买入英伟达约1.11亿美元（Vanda数据），若财报指引稳住，超跌反弹会很猛烈，空头也不宜过度追杀。\n二、美联储加息与美元走强。已核实：美国10月PPI同比6.5%，为2022年11月以来最大年度涨幅；10年期美债约5.14%。邮件转述：美联储Hammack与Daly支持渐进加息，美国10月成屋销售跌至2010年以来最低。对谁不利：高估值成长股、黄金（12月黄金期货收于约3878美元，邮件称跌至近一年低位）、加密资产（邮件称比特币跌破7万美元）。\n三、A股高位题材退潮。已核实：周五两市成交约1.67万亿元，缩量约2788亿元，上涨仅约765家、下跌4748家；襄阳轴承、大东方等高位股跌停。上交所对溢价较高的芯片LOF重点监控（邮件转述）。文投控股14天9板、累计涨100%，但公司公告AI漫剧收入仅占营收约2.57%，已多次提示快速回落风险。题材接力的赚钱效应在收缩。\n多空如何制约 防御资金抱团银行与能源，托住了上证指数（仅跌0.59%），但深成指、创业板指的杀跌说明增量资金缺席。银河证券认为电子具备超跌反弹基础，中信证券认为系统性抛售压力有限；我们同意中期逻辑未坏，但短期必须等英伟达财报和量能回升来确认。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"热点财经新闻综述｜2026-11-14·早间\n数据时点：A股为11月13日收盘，美股为美东11月13日收盘（北京时间11月14日05:00），整理截至北京时间11月14日07:40。本期邮箱新增一封11月13日晚间热点财经邮件，以下凡标“邮件转述”的内容未逐条核实，其余已对照公开网页。\n今日判断 本周末的核心矛盾很清楚：一边是英伟达换帅后的AI硬件重定价，一边是美联储加息预期从“可能”变成“几乎确定”。\n周五A股创业板指跌3.32%，美股费城半导体指数再跌3.43%，两地硬件链同步承压；\n同时银行、影视、猪肉、能源在接资金。\n下周一开盘，我们的基调是防御为先、科技等止跌信号，不建议在周末情绪里提前抄底硬件高位股。\n三大利多方向（由强到弱）\n一、银行与高股息。已核实：11月13日银行板块涨约1.46%，江苏银行、南京银行、青岛银行、成都银行、杭州银行盘中创历史新高；11月12日华宝银行ETF净流入5.58亿元。为什么重要：美债10年期收益率周五在5.1%以上，CME FedWatch显示市场对12月9日加息的定价接近100%，成长股估值的锚被抬高，低波动高股息成了机构年末调仓的蓄水池。对谁有利：城商行、国有大行、保险。制约：拥挤度已快速上升，若下周科技反弹，银行可能出现短线获利了结。\n二、能源与石油石化。已核实：布伦特1月合约周五收于约96.32美元，美股能源板块领涨，雪佛龙涨1.64%。背景是特朗普称美国不需要与伊朗达成协议，地缘溢价回升。对A股：中国海油、中国石油等“三桶油”周五抗跌。制约：邮件转述IEA月报下修未来两年石油需求，油价中期上行空间受需求端压制，更适合当防御仓位而非进攻主线。\n三、政策驱动的储能与输配电。邮件转述：两部门印发“十五五”新型储能实施方案；思源电气三季报收入保持高增长。这属于中期逻辑，周五盘面未见大规模资金响应，个股行情数据邮件也未给出。我们的看法是逻辑顺、节奏慢，适合在硬件链出清期间逢低关注，而不是追涨。\n三大利空方向（由强到弱） 一、AI硬件链重定价。已核实：英伟达周五再跌2.01%至162.85美元，创52周新低，本周累计跌约13%，为连续第六周下跌；汇丰下调至持有。A股周五元件板块跌6.29%，CPO跌4.40%，中际旭创、新易盛、天孚通信等成交居前且大跌。为什么重要：市场正在从“信任单一龙头”转向“按订单确定性定价”，绑定英伟达出货的光模块、PCB首当其冲。关键节点：公开报道显示英伟达11月17日发布三季度财报，这是下周最大的单一变量。制约：美股散户周四开盘半小时净买入英伟达约1.11亿美元（Vanda数据），若财报指引稳住，超跌反弹会很猛烈，空头也不宜过度追杀。\n二、美联储加息与美元走强。已核实：美国10月PPI同比6.5%，为2022年11月以来最大年度涨幅；10年期美债约5.14%。邮件转述：美联储Hammack与Daly支持渐进加息，美国10月成屋销售跌至2010年以来最低。对谁不利：高估值成长股、黄金（12月黄金期货收于约3878美元，邮件称跌至近一年低位）、加密资产（邮件称比特币跌破7万美元）。\n三、A股高位题材退潮。已核实：周五两市成交约1.67万亿元，缩量约2788亿元，上涨仅约765家、下跌4748家；襄阳轴承、大东方等高位股跌停。上交所对溢价较高的芯片LOF重点监控（邮件转述）。文投控股14天9板、累计涨100%，但公司公告AI漫剧收入仅占营收约2.57%，已多次提示快速回落风险。题材接力的赚钱效应在收缩。\n多空如何制约 防御资金抱团银行与能源，托住了上证指数（仅跌0.59%），但深成指、创业板指的杀跌说明增量资金缺席。银河证券认为电子具备超跌反弹基础，中信证券认为系统性抛售压力有限；我们同意中期逻辑未坏，但短期必须等英伟达财报和量能回升来确认。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121391967133430233","l":[],"ln":[],"t":["美联储","美股","A股港股","原 ，哪有苹果的成功？\n你同意黄为傲慢自负道歉吗？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121249860766884204","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":635},{"id":"2121246797402104252","h":"dmjk001","ts":1794579622,"zh":"路透：贝森特周五表示，数月来他的部门一直倾向于将总部位于新加坡的云计算公司 Megaspeed 列入美国实体清单，但采取行动取决于商务部，并补充说联邦贸易委员会（FTC）可能采取其他行动。\n他补充说，政府正在努力堵住芯片出口体系中的“漏洞”，并指出在首席执行官黄仁勋本周离职 、在人工智能行业引发震荡之际，英伟达（NVDA.O）对其合作伙伴公司的审查是否到位存在问题。\n“这里真正的故事应该是：英伟达是否了解他们的客户，以及英伟达是否做出了扎实的努力，确保没有泄漏，并且确保他们不是把产品卖给了明显是过手空壳公司的对象？”贝森特对 CNBC 的“Squawk Box”节目表示。\n“公司里的任何相关人员都必须为此承担责任，这一点很重要。”","en":"路透：贝森特周五表示，数月来他的部门一直倾向于将总部位于新加坡的云计算公司 Megaspeed 列入美国实体清单，但采取行动取决于商务部，并补充说联邦贸易委员会（FTC）可能采取其他行动。\n他补充说，政府正在努力堵住芯片出口体系中的“漏洞”，并指出在首席执行官黄仁勋本周离职 、在人工智能行业引发震荡之际，英伟达（NVDA.O）对其合作伙伴公司的审查是否到位存在问题。\n“这里真正的故事应该是：英伟达是否了解他们的客户，以及英伟达是否做出了扎实的努力，确保没有泄漏，并且确保他们不是把产品卖给了明显是过手空壳公司的对象？”贝森特对 CNBC 的“Squawk Box”节目表示。\n“公司里的任何相关人员都必须为此承担责任，这一点很重要。”","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXAugEEX0AAe9Nr.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2121246797402104252","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":2,"rt":0,"rp":0,"vw":1308},{"id":"2121244779652747390","h":"cnfinancewatch","ts":1794579140,"zh":"美元破位上行，A股估值斩杀线上移，有色板块进入三重承压周期\n#有色金属##股票财经#\n11月13日市场核心数据速览\n今日A股市场整体情绪走弱，指数呈现明显分化下行格局：上证指数跌0.59%收3634.35点，深证成指大跌2.05%，北证50重挫3.50%，中小盘与周期资产杀跌力度显著更强。\n板块层面，有色金属板块承压明显：有色指数单日下跌2.51%，收6888.21点；有色ETF（512400）收跌2.55%、报1.375元，盘面大跌但逆势净流入3360万，说明高位机构出逃、低位已有资金试探性托底，多空分歧剧烈。\n核心标的中国铝业正式破位：开盘直接失守8元整数关口，最低下探7.92元，收盘7.96元。全天成交额仅9.02亿元，量比低至0.71，进入极致缩量阴跌状态。资金结构上，主力资金净流出6303万，机构持续兑现离场；而散户、中小单逆势净流入超6000万，融资盘持续逆势接仓，筹码高位下沉隐患加剧。\n板块情绪全面降温，龙头资金出逃明显：紫金矿业净流出3.30亿、洛阳钼业净流出2.45亿。中国铝业动态市盈率跌破5.72倍，刷新历史估值极值，极低估值背景下依旧持续杀跌，完全是宏观流动性定价主导市场。\n一、宏观定调：美元指数突破103，重新定义A股估值底线\n当下A股所有调整的核心根源，不是个股基本面，而是美元流动性重定价。\n本轮美元指数强势突破103，核心是市场重新计价“美联储高利率延续”预期，美债收益率高位锚定，全球无风险收益率被动抬升。这会形成两大致命传导链条，直接改写A股与大宗商品的定价逻辑：\n1. 全球资金虹吸效应\n美元走强、美债收益走高，美元资产性价比大幅提升，全球跨境资本从新兴市场回流美国。A股作为外资重要配置市场，北向风险偏好收缩、增量资金枯竭，存量资金持续出逃，所有权重、周期、资源板块都会被动承压。\n2. A股整体斩杀线上移\n以往市场认可的估值底、政策底、产业资本增持底，在强美元周期中全部失效。\n美元走强=A股估值安全垫压缩=市场支撑位整体上移。\n简单讲：以前跌到位能反弹的位置，现在只是中继平台；以前的超低估值，在高美元利率环境下依旧存在下行空间。这也是为何中铝跌破历史最低PE，依然止不住跌势。\n3. 有色板块遭受双重打击\n有色金属属于美元计价大宗商品，货币属性极强。美元升值直接压制伦铝、国际金属价格，外盘承压带动内盘跟跌；同时AH溢价持续走阔，今日中铝H股大跌3.14%，AH溢价飙升至39.69%，内外价差撕裂，A股有色估值被动高估，长期承压无解。\n二、盘面核心特征：缩量阴跌，最折磨人的钝刀行情\n今日中铝破8元后的最大特征，不是恐慌暴跌，而是无量下跌。\n量比0.71、成交额极致萎缩，代表市场当下处于特殊状态：\n恐慌盘已经彻底割不动，浮筹清洗殆尽；但主力资金受宏观利空压制，拒绝任何主动护盘与拉升。\n没有抛压、没有承接、没有反弹力量，完全依靠市场重力自由回落。\n这种“缩量阴跌”，是比放量大跌更可怕的走势——放量下跌是风险一次性释放，缩量阴跌是情绪与估值的长期磨底，时间换空间，持续消耗多头信心。\n三、资金博弈拆解：机构撤退、散户接盘，杠杆风险积聚\n今日筹码博弈呈现极致的反向背离：\n• 大资金高度理性：超大单、大单合计流出超6300万，在美元流动性拐点确认后，机构统一选择减仓避险，不博弈短线超跌。\n• 散户与融资盘反向死扛：小单、中单净流入超6000万，叠加前两日融资盘累计净买入1.4亿。\n市场最大风险已经浮出水面：极低估值吸引散户杠杆抄底，但宏观逆风未止。\n一旦股价继续小幅下探，高位累积的融资盘将触发被动平仓，极易引发连锁多杀多踩踏，形成加速下跌。资本市场永远反人性：低估不代表立刻上涨，逆势流动性收紧下，低价可以更低。\n四、逻辑重构：为何大股东增持底彻底失效？\n很多投资者困惑：产业资本9元上方真金白银增持，为何挡不住7.9元的杀跌？\n核心逻辑区分：\n产业资本看3-5年产业周期，交易资金看当下全球流动性。\n大股东增持是长线战略布局，不计短期波动；但量化、游资、外资是顺势交易，在美元强势、全球流动性收紧的大背景下，不会为基本面买单。\n当下市场主线非常清晰：宏观流动性＞技术形态＞估值高低＞股东增持。\n覆巢之下无完卵，整个有色板块资金全线抽血，再好的基本面也无法对抗系统性流动性压力。\n五、后市核心展望：三重寒冬之下，只看三个见底信号\n当前中国铝业、有色金属板块，正处于美元宏观压制+资金持续流出+技术破位的三重寒冬。\n前期填权行情、箱体震荡结构彻底终结，短期不存在企稳反转基础。\n后续真正底部，必须等待三大信号同步出现：\n1. 美元指数高位钝化、流动性压力缓释\n只要美元持续走强，有色杀估值行情不会结束，所有反弹仅为弱修复。\n2. 融资盘充分出清\n当前杠杆资金高位接盘、筹码不稳定，必须完成一轮彻底的筹码清洗，风险释放完毕才具备企稳条件。\n3. 后续需在7.9元区间连续收出缩量十字星、企稳小阳线，同时主力资金停止大幅流出，方能确认短期底部。\n现阶段A股最大的交易真相：强美元周期下，所有低估值周期股，都在重新接受全球流动性定价。","en":"美元破位上行，A股估值斩杀线上移，有色板块进入三重承压周期\n#有色金属##股票财经#\n11月13日市场核心数据速览\n今日A股市场整体情绪走弱，指数呈现明显分化下行格局：上证指数跌0.59%收3634.35点，深证成指大跌2.05%，北证50重挫3.50%，中小盘与周期资产杀跌力度显著更强。\n板块层面，有色金属板块承压明显：有色指数单日下跌2.51%，收6888.21点；有色ETF（512400）收跌2.55%、报1.375元，盘面大跌但逆势净流入3360万，说明高位机构出逃、低位已有资金试探性托底，多空分歧剧烈。\n核心标的中国铝业正式破位：开盘直接失守8元整数关口，最低下探7.92元，收盘7.96元。全天成交额仅9.02亿元，量比低至0.71，进入极致缩量阴跌状态。资金结构上，主力资金净流出6303万，机构持续兑现离场；而散户、中小单逆势净流入超6000万，融资盘持续逆势接仓，筹码高位下沉隐患加剧。\n板块情绪全面降温，龙头资金出逃明显：紫金矿业净流出3.30亿、洛阳钼业净流出2.45亿。中国铝业动态市盈率跌破5.72倍，刷新历史估值极值，极低估值背景下依旧持续杀跌，完全是宏观流动性定价主导市场。\n一、宏观定调：美元指数突破103，重新定义A股估值底线\n当下A股所有调整的核心根源，不是个股基本面，而是美元流动性重定价。\n本轮美元指数强势突破103，核心是市场重新计价“美联储高利率延续”预期，美债收益率高位锚定，全球无风险收益率被动抬升。这会形成两大致命传导链条，直接改写A股与大宗商品的定价逻 $PANW 至超配，目标价380。William Blair与Oppenheimer同时上调 #超威半导体 $AMD ，后者目标价600。Truist把英伟达降至持有，目标价从346砍到174，Craig-Hallum也降至持有。Wedbush把Cerebras目标价提到205。\n#资金面\n期权有方向的共振： $LLY Call持仓增4.8%、Call成交放量172%，最大Put行权价1430贴着现价，三项同向； $JNJ 最大Call行权价290距现价2.25%、Call增仓5.5%、量仓比1.58，三项同向； $GOOGL 最大Call行权价300距现价0.44%、Call增仓13.4%、Call成交放量192%。 #杜邦 $DD 的P/C成交比2.42，空单放量，方向偏空，不算共振。\nARK方面， $CRWV 获ARKK与ARKW同日买入合计约1600万美元， $TWST 获ARKG与ARKK同买约840万美元，后者Call持仓增15.4%。\n#期货\n周四口径：ES与NQ价涨OI降，属空头回补，不是新多进场；罗素与10年期美债OI增但量能不够，暂不定性；30年美债价跌OI降，多头离场；WTI与布油价跌OI降，多头离场；黄金价涨OI降，空头回补。股指反弹的底子偏薄。\n#中美映射\n美股20日窗口前列为 $JETS 加9.3%、 $IHE 加9.0%、 $FIW 加8.7%、 $ITB 加8.1%；5日窗口前列为 $SMH 加12.1%、 $XLK 加7.0%、 $QQQ 加6.4%、 $ITA 加5.3%。双窗口同现的只有 $IHE （20日加9.0%，5日加4.4%），这是趋势加速。半导体只在5日窗口，20日仍跌10%，属短线脉冲。A股20日前列是机器人、纳指生物科技、汽车零部件、影视、科创人工智能，其中纳指生物科技ETF20日涨15.20%，与美股医药形成20日共振。A股5日窗口数据缺失。A股今天创业板跌3.32%，科技映射继续降温。\n#三个方向\n一是创新药与大药企，事件、资金、ETF三方都对得上。二是水务与AI冷却，艺康大行上调加上水业ETF20日走强，但个股位置还在区间中部，先看。三是大型平台股的超跌修复，只看谷歌一只，纳指20日仍是下行，降权处理。\n#六只个股\n #礼来 $LLY 收1427.28，距20日高也是52周高1460约2.3%，近20日区间85%位置，突破准备。触发是放量站上1460，失效看跌破1346一线的20日均线。\n #强生 $JNJ 收283.52，距52周高286.08不到1%，区间93%位置，偏高位突破准备，获利盘近99.5%，只给半仓。放量过286.08加，跌破270失效。\n #谷歌 $GOOGL 收298.70，20日区间30%位置，从276.92低点回升，近5日涨5.7%，箱底企稳右侧，上方MA20在305.66。站上305.66确认，跌破287失效，仓位减半。\n #艺康 $ECL 收304.41，区间59%，大行上调后先看能否站回311并挑战318.93，未到前只观察。\n #杜邦 $DD 收154.70，区间84%，距20日高159.48约3%，期权偏空，只观察，放量过159.48才考虑。\n #特维斯特生物 $TWST 收114.22，周四从93.68拉回，区间24%，长下影企稳，但20日仍跌20.9%、MA20在140，属超跌反抽，只观察。\n#小盘阿尔法\n本档不选。 $PACB 箱底位置约20%，但P/C成交比6.14偏空、做空余额还在增加，5日跌18.9%； $AMRC 积压订单72亿美元加内部人买入，5日已涨35%，短线已伸展； $FUN 区间96%位置，高位。核验不过，宁可空着。\n#操作提示\n21:30 PPI是今晚第一道闸，高于预期利率还会往上顶，先防高估值科技回落。医药按触发价分批，不在开盘追高；英伟达等财报，不抄底。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"美股盘前晚间版 2026-11-13 北京时间21:00\n#先说结论\n今日大类只留一个半： #生物医药创新 做主线， #水务与AI冷却 只观察。英伟达换帅风波还没消化完，科技反弹归反弹，今天不追AI硬件。\n如果只做3只： #礼来 $LLY 第一， #强生 $JNJ 第二， #谷歌 $GOOGL 第三且仓位减半。\n明确不做：英伟达链条抄底、期权偏空的票、5日已涨两三成的ARK热门股、盘前无理由暴涨的小票。\n#消息面\n盘前三大期指小幅偏强，标普期货涨0.15%到0.3%，纳指期货基本走平。 #英伟达 $NVDA 盘前反弹约2%到3%，但本周累计跌约11%，临时CEO由前CFO接任，外部猎头已在找继任者，下周二财报   if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
