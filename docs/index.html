tatus/2122577269843710170","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":692},{"id":"2122577021608075329","h":"tychozzz","ts":1794896772,"zh":"现在最尴尬的局面是，科技股 PE 极其低，价值股 PE 极其高。\n继续抱着纳指和科技股，未来 EPS 下修的话，会有戴维斯双杀的风险。\n换仓到价值股，起不到任何避险的作用，最后还可能变成追涨杀跌的傻逼...\n传统价值股也有可能会成为继半导体之后，另一个被无脑追多、极度拥挤、然后暴力下杀的板块。","en":"现在最尴尬的局面是，科技股 PE 极其低，价值股 PE 极其高。\n继续抱着纳指和科技股，未来 EPS 下修的话，会有戴维斯双杀的风险。\n换仓到价值股，起不到任何避险的作用，最后还可能变成追涨杀跌的傻逼...\n传统价值股也有可能会成为继半导体之后，另一个被无脑追多、极度拥挤、然后暴力下杀的板块。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tychozzz/status/2122577021608075329","l":[],"ln":[],"t":["AI科技"],"lk":221,"rt":6,"rp":67,"vw":45801},{"id":"2122573945174147162","h":"dmjk001","ts":1794896038,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXTlvzQXwAADexo.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122573945174147162","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1535},{"id":"2122570437024678229","h":"bbcchinese","ts":1794895202,"zh":"周一（11月16日）晚间，台北101外墙打灯声援辉达创办人黄仁勋。此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","en":"周一（11月16日）晚间，台北101外墙打灯声援辉达创办人黄仁勋。此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122554344130363392/vid/avc1/720x1280/yfIQvXLptTLEoPrY.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2122570437024678229","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":2,"vw":1559},{"id":"2122569336527458788","h":"cnfinancewatch","ts":1794894939,"zh":"超跌反弹会很快，所以这里仍然是“等结果”，不是单边看空到底。本周另一只靴子是Anthropic，计划18日定价、19日上市。\n二、短剧和高位题材的亏钱效应，今天已经从提示变成价格。已核实：文投控股开盘即靠近跌停，报3.37元，跌9.89%，盘中最高只到3.57元，午后仍封死跌停；浙文影业跌10.08%，大晟文化跌10.00%，慈文传媒跌近10%。这是对16日风险提示的兑现——前三季度营收1.80亿元、净亏3754.58万元，AI漫剧收入约占2.57%，并提示可能被实施退市风险警示。高位股同样在兑现：闽发铝业午间邮件记为12天7板后跌停（连板天数未逐日复核），大东方跌停，日出东方深跌。对短线交易者，这意味着亏钱效应正在从光模块扩散到连板；对还想接力“羊字辈”、广百、华东重机的人，赔率已经不好看。\n三、外部风险偏好没有转暖，银行红利今天也不是无脑避风港。已核实：港股恒生指数午间收报23571.61点，跌0.77%，恒生科技跌0.46%，科网股普遍调整，哔哩哔哩、百度跌幅靠前，华虹宏力则涨超9%。亚洲股市同步偏弱，FXStreet在北京时间13:01前后称，日经225跌约1.18%、报58960点附近，韩国KOSPI跌约1.79%、接近5000点；我们早间还记录到KOSPI盘中一度跌破5000点。银行板块午间走弱，银行ETF鹏华半日跌0.96%，新浪基金转述其重仓股里工商银行午间跌1.10%；13:28前后工商银行约跌0.33%，只是跌幅收窄，并没有重新走强。黄金、原油隔夜已明显走弱，美元走强的压力还在。邮件转述美联储官员倾向缓慢加息、部分机构喊出连续加息，未逐条核实原话，只作为外部约束的背景。银行和红利可以继续当作底仓，但昨天创历史新高之后，今天更适合看回踩，不适合把防御做成追高。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"超跌反弹会很快，所以这里仍然是“等结果”，不是单边看空到底。本周另一只靴子是Anthropic，计划18日定价、19日上市。\n二、短剧和高位题材的亏钱效应，今天已经从提示变成价格。已核实：文投控股开盘即靠近跌停，报3.37元，跌9.89%，盘中最高只到3.57元，午后仍封死跌停；浙文影业跌10.08%，大晟文化跌10.00%，慈文传媒跌近10%。这是对16日风险提示的兑现——前三季度营收1.80亿元、净亏3754.58万元，AI漫剧收入约占2.57%，并提示可能被实施退市风险警示。高位股同样在兑现：闽发铝业午间邮件记为12天7板后跌停（连板天数未逐日复核），大东方跌停，日出东方深跌。对短线交易者，这意味着亏钱效应正在从光模块扩散到连板；对还想接力“羊字辈”、广百、华东重机的人，赔率已经不好看。\n三、外部风险偏好没有转暖，银行红利今天也不是无脑避风港。已核实：港股恒生指数午间收报23571.61点，跌0.77%，恒生科技跌0.46%，科网股普遍调整，哔哩哔哩、百度跌幅靠前，华虹宏力则涨超9%。亚洲股市同步偏弱，FXStreet在北京时间13:01前后称，日经225跌约1.18%、报58960点附近，韩国KOSPI跌约1.79%、接近5000点；我们早间还记录到KOSPI盘中一度跌破5000点。银行板块午间走弱，银行ETF鹏华半日跌0.96%，新浪基金转述其重仓股里工商银行午间跌1.10%；13:28前后工商银行约跌0.33%，只是跌幅收窄，并没有重新走强。黄金、原油隔夜已明显走弱，美元走强的压力还在。邮件转述美联储官员倾向缓慢加息、部分机构喊出连续加息，未逐条核实原话，只作为外部约束的背景。银行和红利可以继续当作底仓，但昨天创历史新高之后，今天更适合看回踩，不适合把防御做成追高。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122569336527458788","l":[],"ln":[],"t":["美联储","A股港股","原油能源","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":443},{"id":"2122569332261798273","h":"cnfinancewatch","ts":1794894938,"zh":"热点财经新闻综述｜2026-11-17·午间\n数据时点：A股以11月17日午间收盘（北京时间11:30）为主，并用13:28前后的公开行情补充午后变化；港股为午间收盘；外盘与海外消息整理截至北京时间13:30左右。本期邮箱新增两封热点财经邮件（11月17日早间08:10版、午间13:10版），均在垃圾邮件中。凡标“邮件转述”的内容未逐条核实，其余已对照新华财经、中新经纬、每日经济新闻、证券时报、澎湃、公开行情及已披露公司文件。\n今日判断\n今天上午的剧本，几乎是昨天的镜像。指数低开后翻红，半导体和光刻机把昨天的杀跌往回修，银行和短剧则在吐出涨幅。已核实：截至午间收盘，上证报3602.07点，微跌0.01%；深证成指报10764.88点，涨0.69%；创业板指报2336.80点，涨0.72%；科创50报1253.91点，涨3.31%，早盘一度跌超1%。北证50涨2.44%，报857.01点。新华财经称沪深半日成交约8946亿元，较上一交易日半日缩量59亿元；中新经纬则写半日成交约9010亿元、超3500只个股上涨。金融界统计，截至12:30两市约42只涨停。\n但这不是风格已经切回来了。光模块并没有跟上半导体的反弹，英伟达还要到北京时间18日凌晨才公布黄仁勋离职后的首份财报。更直接的信号是午后开盘后反弹明显回吐：截至13:28前后，上证跌约0.26%，创业板由午间的上涨转为下跌约0.72%，科创50涨幅从3.31%收窄到约1.22%。上午的修复，更像财报前的超跌反弹，叠加上国产替代交易，不是可以追高的趋势反转。短剧这边，昨天提示的风险今天兑现了——文投控股、浙文影业、大晟文化跌停，慈文传媒接近跌停。\n三大利多方向（由强到弱）\n一、半导体设备材料与晶圆代工的国产替代，是今天最强的主线，但要把它和光模块分开看。已核实：午间中芯国际、华虹宏力大幅上扬，午间邮件记为分别涨7.43%、11.59%；有研新材、伟测科技涨停，联合化学、国林科技触及20%涨停。新华财经称半导体、光刻机、消费电子、OLED等居前。逻辑上有三条，但要分清新旧：中芯国际三季度营收31.90亿美元、同比增33.9%、环比增6.1%，产能利用率由二季度的93.7%升至97.3%，毛利率29.9%，这是11月12日前后已披露的业绩，不是今天的新财报，四季度指引还略有回落；每日经济新闻提到，上海微电子新一代光刻机日前亮相，称国产前道干式光刻机已在国内量产线运行；另据港股报道，美国商务部16日出台临时规定，限制部分国家通过远程方式访问先进人工智能芯片和服务器，强化了国产算力替代的交易情绪。对谁有影响：晶圆代工、光刻机和电子化学品今天接到了钱；中际旭创、新易盛、东山精密没有一起涨——午间邮件记为分别跌2.93%、3.79%、3.99%，公开行情还显示中际旭创盘中低见385元、跌破400元。投资含义是：今天强的是“国产替代和超跌修复”，不是“全球算力链已经翻多”。制约很硬：英伟达财报今晚落地，午后科创50已经在吐出涨幅，财报前不宜把反弹当成新主线去追。\n二、家电和部分必选消费，资金仍在，但龙头已经走到情绪极限。已核实：九阳股份早盘最低25.79元、触及跌停，随后拉升至31.52元涨停，振幅20%，成交超过34亿元，证券时报e公司报道封单超过13万手，走出“地天板”。阳光照明同步涨停，澎湃称继续引领所谓“羊字辈”炒作；长虹美菱、小熊电器走出2连板，北鼎股份涨超15%，美的集团午后仍小幅上涨。这和昨天的逻辑是连续的：科技股出清时，资金去买有出口和内销故事的家电。但九阳自9月28日以来累计涨幅超230%（证券时报口径；每日经济新闻若从8月底起算则写约294%），此前异常波动公告已说明参股机器人相关公司属财务性投资、对当期营收和利润无重大影响。地天板是情绪交易的极致，不是基本面突变。制约：高位股的赔率已经变差，若半导体午后继续回流，家电的接力资金会被抽走。\n三、流动性和个别政策是托底，不是今天的交易主线。已核实：央行17日开展7140亿元隔夜逆回购，利率1.25%，当日有4600亿元逆回购到期，Wind口径单日净投放2540亿元。商务部等9部门发布意见，推动新能源汽车“车电一体报废”回收拆解，这是中期政策线索。华为算力方向也有局部高潮，华胜天成涨停、走出3天2板，真视通、嘉环科技涨停，拓维信息跟涨。这些能解释为什么下跌之后仍有活钱，但连板股波动加大，广百股份4连板、华东重机3连板，已经是短线博弈而不是配置。邮件转述的“11月16日股票型ETF净申购216亿元、融资余额减少214.1亿元”，是上一交易日的资金数据，不宜写成今日增量。\n三大利空方向（由强到弱）\n一、英伟达财报与管理层真空，仍是本周最硬的空头约束。已核实：公司将于美西时间11月17日13:20、也就是美东16:20左右、北京时间18日凌晨5:20前后公布2027财年第三季度业绩，这是首席财务官科莱特·克雷斯以临时CEO身份主持的首份财报。董事会知情人士向CNBC等表示，暂不考虑让黄仁勋回归，当前重点仍是相关调查。周一英伟达跌4.12%，收156.14美元，纳指跌2.49%。今天A股半导体能反弹，恰恰说明有资金在抢国产替代和超跌，但光模块没有跟上，说明全球算力链的风险并没有被消化。制约的另一面是：若指引稳住，","en":"热点财经新闻综述｜2026-11-17·午间\n数据时点：A股以11月17日午间收盘（北京时间11:30）为主，并用13:28前后的公开行情补充午后变化；港股为午间收盘；外盘与海外消息整理截至北京时间13:30左右。本期邮箱新增两封热点财经邮件（11月17日早间08:1 nancewatch","ts":1794884919,"zh":"最近中信的一篇研究报告揭示出市场为什么调整的这么凶，报告认为此轮调整过程中，机构大票的出清速度远快于过往，这意味着机构权重股的快速下跌，特别科技权重快速杀跌，引发市场迅速走熊，这对市场伤害很大。但到明年大票提前出清完成，可能会领先于小票反弹修复。而小微盘股的出清，可能才刚刚开始，意味着小微盘股可能短期没跌完。","en":"最近中信的一篇研究报告揭示出市场为什么调整的这么凶，报告认为此轮调整过程中，机构大票的出清速度远快于过往，这意味着机构权重股的快速下跌，特别科技权重快速杀跌，引发市场迅速走熊，这对市场伤害很大。但到明年大票提前出清完成，可能会领先于小票反弹修复。而小微盘股的出清，可能才刚刚开始，意味着小微盘股可能短期没跌完。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122527308678561995","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":2,"vw":1113},{"id":"2122525317847781685","h":"ReutersChina","ts":1794884445,"zh":"中国自由奔放的科技之都深圳在准备本周接待世界领导人之际，呈现出一种不同寻常的安静，汽车喇叭被禁止，送货无人机停飞，居民被敦促将车辆留在家中。","en":"China's freewheeling tech capital of Shenzhen has embraced an unusual quiet as it prepares to host world leaders this week, with car horns banned, delivery drones grounded and residents urged to leave vehicles at home.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122525317847781685","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/technology/horns-drones-banned-shenzhen-hushes-trump-apec-2026-11-17/?taid=6afbc35c24f1750001f92f5f&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":134},{"id":"2122525146783080879","h":"bbcchinese","ts":1794884404,"zh":"罗伯·派汀森（Robert Pattinson）早已在《暮光之城》系列、《蝙蝠侠》和《奥德赛》等电影，奠定了自己作为男主角、动作明星及演员的地位。如今，他接下詹姆士·庞德（James Bond；占士邦）一角，将使他的知名度更上一层楼。","en":"罗伯·派汀森（Robert Pattinson）早已在《暮光之城》系列、《蝙蝠侠》和《奥德赛》等电影，奠定了自己作为男主角、动作明星及演员的地位。如今，他接下詹姆士·庞德（James Bond；占士邦）一角，将使他的知名度更上一层楼。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122525146783080879","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4iUWAw5","d":"bbc.in"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":470},{"id":"2122525146355536117","h":"nytchinese","ts":1794884404,"zh":"关于特朗普访华及中美俄首脑会晤，你应该了解的：特朗普亚洲之行的重头戏是在深圳与习近平及普京会晤。这将是三位掌握全球最大核武库的领导人首次坐在一起。预计他们将讨论核扩散和伊朗问题，但不会谈及黄仁勋事件。","en":"关于特朗普访华及中美俄首脑会晤，你应该了解的：特朗普亚洲之行的重头戏是在深圳与习近平及普京会晤。这将是三位掌握全球最大核武库的领导人首次坐在 2122520410550087749","h":"TraderS18","ts":1794883275,"zh":"为今之计只能看 APEC 峰会上各国领导人会不会在双边、多边或者比较重要的发布会上重申大力发展 AI 及对 AI 产业支持的声明了。最好是能来一次当年习大大行情那种爆拉，但也可能只是一个赌徒爆仓前的幻想","en":"为今之计只能看 APEC 峰会上各国领导人会不会在双边、多边或者比较重要的发布会上重申大力发展 AI 及对 AI 产业支持的声明了。最好是能来一次当年习大大行情那种爆拉，但也可能只是一个赌徒爆仓前的幻想","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2122520410550087749","l":[],"ln":[],"t":["AI科技"],"lk":15,"rt":2,"rp":2,"vw":22284},{"id":"2122517697174835636","h":"ReutersChina","ts":1794882628,"zh":"美国总统唐纳德·特朗普周二飞抵菲律宾，正值东南亚峰会的尾声，他可能会面临抗议活动，此次出访是在印太地区四方安全对话（Quad）国家领导人两年后的首次会晤之前。","en":"US President Donald Trump flies into the Philippines on Tuesday at the tail end of a Southeast Asian summit, where he could face protests ahead of the first meeting in two years of the leaders of the Quad group of Indo-Pacific countries.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122517697174835636","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/trump-kick-off-asia-trip-with-quad-talks-manila-ahead-china-visit-2026-11-17/?taid=6afbbc44da07f00001ffa594&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":299},{"id":"2122515290152136825","h":"nytchinese","ts":1794882054,"zh":"特朗普访华前，美国推进新规封堵芯片出口漏洞。新规旨在使中国企业更难远程访问英伟达等公司制造的先进芯片。此前，中国企业一直通过东南亚等地的数据中心来租用这些芯片，相关政策曾在特朗普政府内部引发争论。","en":"特朗普访华前，美国推进新规封堵芯片出口漏洞。新规旨在使中国企业更难远程访问英伟达等公司制造的先进芯片。此前，中国企业一直通过东南亚等地的数据中心来租用这些芯片，相关政策曾在特朗普政府内部引发争论。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2122515290152136825","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/usa/20261117/trump-china-ai-chip-loophole/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":4,"rt":1,"rp":3,"vw":2329},{"id":"2122512993993052324","h":"cnfinancewatch","ts":1794881506,"zh":"国内：都看见了杀跌，但仍有人在短剧里找接力\n周一收盘后，韭研公社置顶仍是长韭杯实盘大赛、站规和“打击吹票等不良行为”专帖。往下翻，讨论几乎围着同一张K线：创业板跌4.37%，银行、保险、家电逆势走强，算力硬件被砸。\n第一类是复盘和情绪宣泄。15:41有帖《2026年11月16日连板个股复盘》，摘要写沪深下跌家数多、创业板跌4.37%，防御方向走强，并点到美的、九阳。17:09的涨停点评帖称超4400只下跌、33涨停、63跌停，资金躲进银行家电，算力硬件与高位股退潮——涨跌停和下跌家数是社区口径，我们未逐一核对官方统计。21:18《晚间A股值得关注的资讯》更直白，摘要写“今天，市场跌的大家都找不到北”，并提到北纬科技连板、九阳与小家电走强，资金“高低切”至固态电池。这是社区里对亏钱效应最直接的表述。\n第二类是短剧和家电，仍被当成“接得住的主线”。热门帖讨论文投控股、AI影视传媒、红果OTT大屏和牌照逻辑，还有帖子问“社零只涨0.4%，资金为什么拼命抢这三条消费线”，摘要称美的创历史新高。最新发布里，11月17日0:07已有帖讨论“九阳13天8板疯涨，谁最有资格接棒”，并引申到“阳”字辈补涨——这是作者自己的连板统计和映射，未见公司或交易所口径，不当作已核实事实。华为云16日发布并开源昇腾原生具身世界模型CloudRobo-WM1.2，也被多篇资讯帖带到，但可见摘要里会后合作细节并不多，热度低于上一交易日发布会之前。\n第三类是风险提示还没成为主流话题。22:44的市场精华汇总摘要提到金科股份、山鹰国际的退市风险提示，关联标注里出现了文投控股，但首页未见专门拆解文投控股退市风险警示的热帖。社区仍在讨论AI漫剧用户扩张和影院渠道，对“收入只占2.57%、前三季度亏损”的公告，消化明显慢于对涨停本身的讨论。\n与券商口径的异同：相同点是都承认16日是一次干脆的风格切换，银行家电是避风港，CPO是杀跌中心。不同点是社区把短剧、九阳补涨和固态电池高低切当成“明天还能做”的方向，而公开公告已经给文投控股标上了退市风险警示；海外董事会口径也不支持把黄仁勋回归写成利多。被忽略的风险有三：一是文投这类高位连板票热度还在、基本面已经揭底，开盘若再接力，亏钱效应可能从光模块扩散到短剧；二是“阳”字辈、OTT牌照这类补涨映射，证伪成本很低；三是今早虽有帖子同步了纳指跌2.49%、费半跌逾5%，但对英伟达财报和董事会调查的讨论仍然偏少，容易把隔夜大跌理解成“又一个低吸点”。","en":"国内：都看见了杀跌，但仍有人在短剧里找接力\n周一收盘后，韭研公社置顶仍是长韭杯实盘大赛、站规和“打击吹票等不良行为”专帖。往下翻，讨论几乎围着同一张K线：创业板跌4.37%，银行、保险、家电逆势走强，算力硬件被砸。\n第一类是复盘和情绪宣泄。15:41有帖《2026年11月16日连板个股复盘》，摘要写沪深下跌家数多、创业板跌4.37%，防御方向走强，并点到美的、九阳。17:09的涨停点评帖称超4400只下跌、33涨停、63跌停，资金躲进银行家电，算力硬件与高位股退潮——涨跌停和下跌家数是社区口径，我们未逐一核对官方统计。21:18《晚间A股值得关注的资讯》更直白，摘要写“今天，市场跌的大家都找不到北”，并提到北纬科技连板、九阳与小家电走强，资金“高低切”至固态电池。这是社区里对亏钱效应最直接的表述。\n第二类是短剧和家电，仍被当成“接得住的主线”。热门帖讨论文投控股、AI影视传媒、红果OTT大屏和牌照逻辑，还有帖子问“社零只涨0.4%，资金为什么拼命抢这三条消费线”，摘要称美的创历史新高。最新发布里，11月17日0:07已有帖讨论“九阳13天8板疯涨，谁最有资格接棒”，并引申到“阳”字辈补涨——这是作者自己的连板统计和映射，未见公司或交易所口径，不当作已核实事实。华为云16日发布并开源昇腾原生具身世界模型CloudRobo-WM1.2，也被多篇资讯帖带到，但可见摘要里会后合作细节并不多，热度低于上一交易日发布会之前。\n第三类是风险提示还没成为主流话题。22:44的市场精华汇总摘要提到金科股份、山鹰国际的退市风险提示，关联标注里出现了文投控股，但首页未见专门拆解文投控股退市风险警示的热帖。社区仍在讨论AI漫剧用户扩张和影院渠道，对“收入只占2.57%、前三季度亏损”的公告，消化明显慢于对涨停本身的讨论。\n与券商口径的异同：相同点是都承认16日是一次干脆的风格切换，银行家电是避风港，CPO是杀跌中心。不同点是社区把短剧、九阳补涨和固态电池高低切当成“明天还能做”的方向，而公开公告已经给文投控股标上了退市风险警示；海外董事会口径也不支持把黄仁勋回归写成利多。被忽略的风险有三：一是文投这类高位连板票热度还在、基本面已经揭底，开盘若再接力，亏钱效应可能从光模块扩散到短剧；二是“阳”字辈、OTT牌照这类补涨映射，证伪成本很低；三是今早虽有帖子同步了纳指跌2.49%、费半跌逾5%，但对英伟达财报和董事会调查的讨论仍然偏少，容易把隔夜大跌理解成“又一个低吸点”。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122512993993052324","l":[],"ln":[],"t":["A股港股","AI科技","财报"],"lk":0,"rt":0,"rp":2,"vw":859},{"id":"2122512990264263018","h":"cnfinancewatch","ts":1794881505,"zh":"热点财经新闻综述｜2026-11-17·早间\n数据时点：A股为11月16日收盘，美股为美东11月16日收盘；隔夜与今早消息整理截至北京时间11月17日07:50。本期邮箱新增一封热点财经邮件（11月16日晚间版），11月17日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照交易所行情、公司公告与主流媒体公开报道。\n今日判断\n周一A股已经先把风格切完了：银行保险创历史新高，算力硬件创年内新低。隔夜美股把同一条裂口又撕大了一截——纳指跌2.49%报24509.76点，标普500跌1.92%报7416.59点，道指跌1.41%报51608.17点，费城半导体跌5.28%，英伟达跌4.12%收156.14美元，光通信股Lumentum、Ciena跌超8%。今早美股期货只是略为回稳，纳指期货涨约0.2%，标普期货基本持平。英伟达将于美东11月17日盘后、也就是北京时间18日早晨公布黄仁勋辞职后的首份财报，市场共识约每股收益2.47美元、营收1091.5亿美元。真空期里，我们对今天的基调是：红利和家电可以做底仓，不抢半导体和光模块的缺口，也不去追已经连板的短剧票。\n三大利多方向（由强到弱）\n一、银行与红利，资金已经用价格确认。已核实：11月16日上证收3602.57点，跌0.87%，盘中失守3600后收回；创业板跌4.37%报2320.02点，科创50跌5.16%，上证50只跌0.30%。沪深京成交约1.49万亿元，较上一交易日缩量1729亿元。工商银行收9.05元，涨2.26%，与建设银行、南京银行、成都银行、杭州银行、江苏银行、青岛银行一起创历史新高；银行ETF华宝涨2.23%。港股同日恒生指数反涨0.49%，收23753.84点，说明外部并不是“中国资产被抛弃”，而是A股成长股在单独消化估值。增量消息还有两条：港交所16日推出首个离岸人民币债券指数，纳入305只债券、名义本金约8500亿元，平均收益率2.08%，挂钩ETF仍在筹备；国家外汇局称10月跨境资金净流入769亿美元，但9至10月月均净流入588亿美元，较8月下降6%，含节假日收支节奏，不宜写成外资大举流入。银行红利是今天相对稳的底仓，但已在历史新高附近，适合持有和回踩，不适合追高。制约：若英伟达财报好于预期，风格可能迅速切回成长。\n二、家电与必选消费，是杀跌里真正接到钱的方向。已核实：16日小家电板块居前，九阳股份收28.65元，涨7.10%；长虹美菱、华帝股份、小熊电器涨停，美的集团创历史新高。这不是主题炒作，而是科技股出清时，资金去买有出口和内销支撑的白马。家电龙头比高位短剧票更经得起波动，但它们也已经走了一段，今天若低开不多而被情绪资金抬升，不要把防御做成追高。\n三、政策托底是中期线索，不是今天的交易主线。已核实：工信部表示，对应付账款规模大、故意拉长账期或投诉较多的车企，将联合部门约谈并督促整改；中汽协同步启动对17家重点车企供应商账款的年度评估，17家是评估范围，不等于已被约谈名单。胜宏科技董事会16日通过1.5亿元至3亿元回购方案。百度三季度营收308亿元，同比下降1%，连续第六个季度下滑，但智能云基础设施收入同比增长94%至82亿元，自由现金流仍为负45.71亿元。这些对零部件现金流和AI应用叙事有帮助，但不足以对冲外部算力链波动，只作为观察项。","en":"热点财经新闻综述｜2026-11-17·早间\n数据时点：A股为11月16日收盘，美股为美东11月16日收盘；隔夜与今早消息整理截至北京时间11月17日07:50。本期邮箱新增一封热点财经邮件（11月16日晚间版），11月17日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照交易所行情、公司公告与主流媒体公开报道。\n今日判断\n周一A股已经先把风格切完了：银行保险创历史新高，算力硬件创年内新低。隔夜美股把同一条裂口又撕大了一截——纳指跌2.49%报24509.76点，标普500跌1.92%报7416.59点，道指跌1.41%报51608.17点，费城半导体跌5.28%，英伟达跌4.12%收156.14美元，光通信股Lumentum、Ciena跌超8%。今早美股期货只是略为回稳，纳指期货涨约0.2%，标普期货基本持平。 违约管理机制。DCM牌照则解决了产品能不能挂出来的问题。集齐这两张牌照后，Backpack就能够在自己的交易所上线永续合约，并在自己的清算所里完成清结算。\n对比 Coinbase，两边现在的牌照配置已经非常接近：Coinbase拥有交易所、期货经纪商和自有清算所，是目前少数跑通完整链条的平台。但Coinbase的DCO牌照范围仅限全额抵押产品，杠杆相关清算仍需依赖外部伙伴。而Backpack的清算所直接获准保证金期货这比Coinbase的DCO牌照获批范围大得多，这是少有的获准清算保证金期货（margined futures）的新清算所。\n在此之前Backpack 已经持有 FINRA 注册券商 Backpack Securities、FinCEN 货币服务业务（MSB）登记和 22 个州及华盛顿特区的汇款牌照。加上迪拜 VARA 和欧盟 MiFID II，这次 CFTC 批准补上的是美国牌照矩阵里最后、也是最难的一块：衍生品，形成了一个覆盖全球的完备的牌照矩阵，可以说Backpack几乎是要集齐加密领域几乎所有的合规牌照了。\n而且看官方的说法，下一步还要推进美股永续在美国的合约审批与SEC登记，要知道之前美股只有股指期货合约并没有个股的永续合约。美国境内真正的个股永续也是刚刚在本月初被 CFTC 以“deemed approved”的方式放开，需接受 CFTC 和 SEC 的双重监管。监管刚刚放行，Backpack就迅速跟上，加密市场永续合约现在是一个日成交数千亿美金，年成交接近百万亿美金的规模，那么美股个股永续合约市场规模未来只会更大。\n对Backpac 而言，完成DCM+SEC notice registration+具体个股永续合约的审批/认证，这意味着它从“全球平台做美股代币永续”进入“美国监管体系内自己上市、自己清算的真正美股永续”的阶段，妥妥的与Coinbase处于同一监管身位，而且如前面说到它的DCO牌照覆盖保证金期货，清算能力上甚至要更完整一些。\n之前这里","en":"拿下CFTC的两张重磅牌照，让Backpack在加密合规层面与Coinbase站在了同一身位。看到Backpack宣布已获得CFTC批准，拿到 DCO（衍生品清算机构）进和DCM（衍生品交易所）两张牌照，意味着Backpack获得早美国合法向零售用户提供衍生品交易与清算服务的资质，正式具备了自己上市自己清算的能力，由此也正式进入全球最大的零售衍生品市场。\nBackpack的DCO牌照获批范围包括全额抵押的期货、期货期权和掉期，以及保证金期货。这意味着它可以处理带杠杆的产品，配套初始保证金、维持保证金、变动保证金和违约管理机制。DCM牌照则解决了产品能不能挂出来的问题。集齐这两张牌照后，Backpack就能够在自己的交易所上线永续合约，并在自己的清算所里完成清结算。\n对比 Coinbase，两边现在的牌照配置已经非常接近：Coinbase拥有交易所、期货经纪商和自有清算所，是目前少数跑通完整链条的平台。但Coinbase的DCO牌照范围仅限全额抵押产品，杠杆相关清算仍需依赖外部伙伴。而Backpack的清算所直接获准保证金期货这比Coinbase的DCO牌照获批范围大得多，这是少有的获准清算保证金期货（margined futures）的新清算所。\n在此之前Backpack 已经持有 FINRA 注册券商 Backpack Securities、FinCEN 货币服务业务（MSB）登记和 22 个州及华盛顿特区的汇款牌照。加上迪拜 VARA 和欧盟 MiFID II，这次 CFTC 批准补上的是美国牌照矩阵里最后、也是最难的一块：衍生品，形成了一个覆盖全球的完备的牌照矩阵，可以说Backpack几乎是要集齐加密领域几乎所有的合规牌照了。\n而且看官方的说法，下一步还要推进美股永续在美国的合约审批与SEC登记，要知道之前美股只有股指期货合约并没有个股的永续合约。美国境内真正的个股永续也是刚刚在本月初被 CFTC 以“deemed approved”的方式放开，需接受 CFTC 和 SEC 的双重监管。监管刚刚放行，Backpack就迅速跟上，加密市场永续合约现在是一个日成交数千亿美金，年成交接近百万亿美金的规模，那么美股个股永续合约市场规模未来只会更大。\n对Backpac 而言，完成DCM+SEC notice registration+具体个股永续合约的审批/认证，这意味着它从“全球平台做美股代币永续”进入“美国监管体系内自己上市、自己清算的真正美股永续”的阶段，妥妥的与Coinbase处于同一监管身位，而且如前面说到它的DCO牌照覆盖保证金期货，清算能力上甚至要更完整一些。\n之前这里","zh_src":"native", 程方向，权重下调；但该方向属美股去重榜第2位映射，未与榜单不符，保留观察不剔除。\n（三）方向消费：互证结论为月内强支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，华泰证券2026-11-11猪价二次探底推动产能去化再加速，两家机构指向消费与农业，权重上调一档。\n（四）个股迈瑞医疗：互证结论为月内单一支撑。支撑研报为中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，提及医疗器械经营改善，维持原权重。\n（五）个股四川路桥：互证结论为月内无支撑。近一个月五大机构无研报覆盖该个股或基建工程细分，权重下调。\n（六）个股美的集团：互证结论为月内单一支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转，提及可选消费景气改善，维持原权重。\n（七）被研报否掉的方向：AI算力软件。中信建投2026-11-16持续看好国产算力产业链，但隔夜NVDA-4.12%、纳指-2.49%，行情数据与研报观点冲突，以真实行情为准，研报观点已滞后，该方向剔除。\n（八）被研报否掉的个股：中际旭创。人气榜第2名但5日-9.53%、昨-12.28%，与中信证券2026-11-14看好中国光通信的长期发展趋势研报方向相悖于短期行情，且总市值4817亿属超大盘，剔除。\n（九）权重调整结果：创新药基因上调一档为最高权重，消费上调一档，基建建筑下调一档仅保留观察。","en":"#五大机构研报（窗口内）\n（一）中信证券，2026-11-17，架构调优中心化，OpenAI加速具身布局，核心观点为具身大脑产业进步是OpenAI调整核心动因，前沿AI实验室加速物理AI布局。\n（二）中信建投，2026-11-17，物理AI是人工智能下一波浪潮 建议聚焦优质环节，核心观点为GPT-6加速具身大脑发展，Apple、OpenAI、Meta入局，Tesla推进量产。\n（三）华泰证券，2026-11-17，内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，核心观点为10月全行业景气指数回升，必选消费与可选消费景气改善居前。\n（四）华泰证券，2026-11-17，端侧AI催化密集 看好需求扩容与电池技术升级，核心观点为模型能力向规划与动作执行延伸，带动AI眼镜、无屏穿戴及机器人硬件。\n（五）中信证券，2026-11-16，AI原生广告商业化提速，看好AI影视、AI营销及精品游戏，核心观点为AI模型成本下降，内容平台开放流量入口，AI影视供给增加。\n（六）中信证券，2026-11-16，国家医保谈判持续支持创新药 关注2027年商业化增量，核心观点为新增107种药品其中1类创新药51种，CAR-T首次纳入基本医保。\n（七）华泰证券，2026-11-16，A股策略：底部仍待夯实 配置上建议继续向质量和价值风格切换，核心观点为底部信号体系显示市场处于底部区域，但科技筹码尚未充分出清。\n（八）中信建投，2026-11-16，持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现，核心观点为模型迭代与AI商业化支撑算力需求，国产芯片订单有望转化。\n#研报互证（近一个月）\n（一）方向创新药基因：互证结论为月内强支撑。支撑研报为中信证券2026-11-16国家医保谈判持续支持创新药 关注2027年商业化增量，中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，中泰证券2026-11-12医药产业链景气延续 AI4S有望推动估值持续抬升，三家机构指向同一方向，权重上调一档。\n（二）方向基建建筑：互证结论为月内无支撑。近一个月五大机构无研报覆盖基建工程方向，权重下调；但该方向属美股去重榜第2位映射，未与榜单不符，保留观察不剔除。\n（三）方向消费：互证结论为月内强支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，华泰证券2026-11-11猪价二次探底推动产能去化再加速，两家机构指向消费与农业，权重上调一档。\n（四）个股迈瑞医疗：互证结论为月内单一支撑。支撑研报为中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，提及医疗器械经营改善，维持原权重。\n（五）个股四川路桥：互证结论为月内无支撑。近一个月五大机构无研报覆盖该个股或基建工程细分，权重下调。\n（六）个股美的集团：互证结论为月内单一支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转，提及可选消费景气改善，维持原权重。\n（七）被研报否掉的方向：AI算力软件。中信建投2026-11-16持续看好国产算力产业链，但隔夜NVDA-4.12%、 2122480730639155477","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":1,"rp":0,"vw":1046},{"id":"2122480007432040718","h":"fxtrader","ts":1794873642,"zh":"CNBC援引知情人士报道，英伟达董事会目前没有考虑恢复黄仁勋的CEO职务，正专注于调查其个人行为是否涉及英伟达商业机密，双方尚未就其复职展开讨论。\n公司已聘请Wachtell Lipton律师事务所牵头调查。","en":"CNBC援引知情人士报道，英伟达董事会目前没有考虑恢复黄仁勋的CEO职务，正专注于调查其个人行为是否涉及英伟达商业机密，双方尚未就其复职展开讨论。\n公司已聘请Wachtell Lipton律师事务所牵头调查。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXSQUE5bkAAphM2.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122480007432040718","l":[],"ln":[],"t":["AI科技"],"lk":13,"rt":0,"rp":3,"vw":3959},{"id":"2122479831317135829","h":"artinmemes","ts":1794873600,"zh":"看了眼RootData出的8-10月加密股票市场报告，很有意思\n1. 头部效应很明显，币安、OK、Bitget吃掉了84%的市场，三家都达到中等以上券商水平了\n2. 热门个股还是半导体、存储，比如SOXL和闪迪美光，SOXL 10月日均交易额干到了26亿，传统市场也就100亿\n3. 合约是现货的61倍，传统美股市场这个比例其实只有5-10倍样子\n4. 老朋友Bitget成交增速和盘口深度干到了第一，旗下RWA协议Reality干到第四，很牛逼，在这里恭喜一下\n总得来说，加密股票市场不能说是房间里的大象，肯定也是房间里的大狗了，很快要倒过来影响传统市场了","en":"看了眼RootData出的8-10月加密股票市场报告，很有意思\n1. 头部效应很明显，币安、OK、Bitget吃掉了84%的市场，三家都达到中等以上券商水平了\n2. 热门个股还是半导体、存储，比如SOXL和闪迪美光，SOXL 10月日均交易额干到了26亿，传统市场也就100亿\n3. 合约是现货的61倍，传统美股市场这个比例其实只有5-10倍样子\n4. 老朋友Bitget成交增速和盘口深度干到了第一，旗下RWA协议Reality干到第四，很牛逼，在这里恭喜一下\n总得来说，加密股票市场不能说是房间里的大象，肯定也是房间里的大狗了，很快要倒过来影响传统市场了","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQQkYpbwAASN-4.jpg?name=orig","https://pbs.twimg.com/media/HXQQkYZbMAAgjk6.jpg?name=orig","https://pbs.twimg.com/media/HXQV-MbbUAAzBLW.jpg?name=orig"],"u":"https://x.com/artinmemes/status/2122479831317135829","l":[],"ln":[],"t":["美股","AI科技"],"lk":10,"rt":0,"rp":12,"vw":4129},{"id":"2122477672509100265","h":"qinbafrank","ts":1794873085,"zh":"BIS（美国商务部工业与安全局）出台远程算力访问新规，远程算力套利窗口正在关闭。先看新规要点：1）远程访问管制全球任何地区的数据中心中国公司及子公司提供超过1,200万TPP的算力（约相当于750张H100/H200量级，或约300张左右B200，具体视计算方式而定），相关先进计算芯片及服务器的出口、再出口和境内转移就需许可。许可逐案审批。\n2）规则发布前已在提供大规模算力的数据中心，若要继续服务，须在生效后90天内取得许可，否则面临后续出口限制。\n3）有限豁免：仅用于商业推荐系统（电商、社交媒体排名等，不生成文本/图像/音视频/软件）可豁免但须报备；生成式AI系统即使兼有推荐功能也不豁免。\n4）新增五国许可：向印尼、马来西亚、新加坡、泰国、巴西出口/再出口/境内转移先进计算芯片均须许可（商务部长可增列其他国家）。美国总部公司可免许可但须月报。审查时会考虑目的国出口管制有效性及执法合作。\n前两天《谁在“倒黄”》这篇长文聊到“境外云算力”越来越受限正在成为现实，\n这两年中国头部公司（阿里、字节/抖音、腾讯等）大量通过马来西亚、新加坡、印尼、泰国等东南亚数据中心租用H100/H200/Blackwell算力进行训练。之前头部大模型公司把东南亚数据中心当作“准国内算力”使用，这次规则把这个主要workaround系统性地纳入许可。对需要十万卡级别训练的模型来说，这是成本、可用性和确定性的同步恶化。\n远程先进算力通道被实质性收紧，会提高中国模型厂商训练的成本和难度，拖慢与美国前沿的追赶速度。\n可以说美国正在试图封堵中国AI追赶过程中几乎所有重要的外部途径：\n芯片管制更严格、\n远程算力通道被压缩、前沿模型的反蒸馏措施越来越严格。\n这算不算中国模型的“艰难时刻”？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"BIS（美国商务部工业与安全局）出台远程算力访问新规，远程算力套利窗口正在关闭。先看新规要点：1）远程访问管制全球任何地区的数据中心中国公司及子公司提供超过1,200万TPP的算力（约相当于750张H100/H200量级，或约300张左右B200，具体视计算方式而定），相关先进计算芯片及服务器的出口、再出口和境内转移就需许可。许可逐案审批。\n2）规则发布前已在提供大规模算力的数据中心，若要继续服务，须在生效后90天内取得许可，否则面临后续出口限制。\n3）有限豁免：仅用于商业推荐系统（电商、社交媒体排名等，不生成文本/图像/音视频/软件）可豁免但须报备；生成式AI系统即使兼有推荐功能也不豁免。\n4）新增五国许可：向印尼、马来西亚、新加坡、泰国、巴西出口/再出口/境内转移先进计算芯片均须许可（商务部长可增列其他国家）。美国总部公司可免许可但须月报。审查时会考虑目的国出口管制有效性及执法合作。\n前两天《谁在“倒黄”》这篇长文聊到“境外云算力”越来越受限正在成为现实，\n这两年中国头部公司（阿里、字节/抖音、腾讯等）大量通过马来西亚、新加坡、印尼、泰国等东南亚数据中心租用H100/H200/Blackwell算力进行训练。之前头部大模型公司把东南亚数据中心当作“准国内算力”使用，这次规则把这个主要workaround系统性地纳入许可。对需要十万卡级别训练的模型来说，这是成本、可用性和确定性的同步恶化。\n远程先进算力通道被实质性收紧，会提高中国模型厂商训练的成本和难度，拖慢与美国前沿的追赶速度。\n可以说美国正在试图封堵中国AI追赶过程中几乎所有重要的外部途径：\n芯片管制更严格、\n远程算力通道被压缩、前沿模型的反蒸馏措施越来越严格。\n这算不算中国模型的“艰难时刻”？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXR-pmdaMAAb4pl.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122477672509100265","l":[],"ln":[],"t":["美股","AI科技","关税贸易"],"lk":73,"rt":10,"rp":32,"vw":24347},{"id":"2122472784471491067","h":"tig88411109","ts":1794871920,"zh":"订阅者专享｜11月第三周投资策略深度 11/15 满城剑影齐出鞘\n现在到了一个比较关键的阶段，市场最危险的时候肯定不是人人满仓或者人人做空。因为市场共识的混乱叠加信息和情绪的放大，多空双杀，左右打脸，如何解读？如何应对投资策略 🔽","en":"订阅者专享｜11月第三周投资策略深度 11/15 满城剑影齐出鞘\n现在到了一个比较关键的阶段，市场最危险的时候肯定不是人人满仓或者人人做空。因为市场共识的混乱叠加信息和情绪的放大，多空双杀，左右打脸，如何解读？如何应对投资策略 🔽","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tig88411109/status/2122472784471491067","l":["x.com"],"ln":[{"u":"https://x.com/tig88411109/status/2122209413658563025?a=yYZ_w5kvFQu-FbqV9GM&s=46","d":"x.com"}],"t":[],"lk":1,"rt":0,"rp":1 u":"https://x.com/ArtofSpecuycky/status/2122464235943030916","l":[],"ln":[],"t":["通胀"],"lk":23,"rt":1,"rp":5,"vw":8821},{"id":"2122460646587642008","h":"TheMarketMemo","ts":1794869026,"zh":"我的看法是，即便你是純粹的價值投資者，懂一些圖形分析也是有好處的，至少你知道市場是不是認可你的價值判斷。如果市場與你的價值判斷相反，你不可能賺到錢的。\n很簡單的道理，不是對與錯，你無法改變市場，所以你只能順應市場。很多人要用一輩子的代價去理解這句話。","en":"我的看法是，即便你是純粹的價值投資者，懂一些圖形分析也是有好處的，至少你知道市場是不是認可你的價值判斷。如果市場與你的價值判斷相反，你不可能賺到錢的。\n很簡單的道理，不是對與錯，你無法改變市場，所以你只能順應市場。很多人要用一輩子的代價去理解這句話。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXR9XEabYAADsst.jpg?name=orig"],"u":"https://x.com/TheMarketMemo/status/2122460646587642008","l":[],"ln":[],"t":[],"lk":154,"rt":13,"rp":10,"vw":15952},{"id":"2122457329413337314","h":"Balder13946731","ts":1794868235,"zh":"【美股复盘 · 11月16日】\n**大市**\n美股三大指数全线下跌，科技股领跌。标普500 ETF（ $SPY ）收于 739.96，跌 1.91%。纳指100 ETF（QQQ）收于 661.75，跌 2.67%，跌幅居主要指数之首。道指 ETF（DIA）收于 515.68，跌 1.43%。罗素2000 ETF（IWM）收于 272.95，跌 1.65%。市场普遍走弱，107 只观察股中仅 12 只上涨，95 只下跌。反向杠杆 ETF 涨幅居前：SOXS 涨 16.35%，SQQQ 涨 8.10%，SPXU 涨 5.73%。半导体做空工具涨幅最大，说明抛压主要集中在芯片板块。\n**板块**\n光模块与互联板块跌幅居前。AAOI 跌 9.48%，LITE 跌 8.48%，CRDO 跌 8.21%，CIEN 跌 8.19%。量子计算板块同步大跌，QBTS 跌 9.31%，IONQ 跌 8.41%。算力与存储相关个股同样承压，IREN 跌 9.80%，SNDK 跌 8.58%，半导体测试设备股 AEHR 跌 10.53%。ASTS 跌 12.33%，在观察股中跌幅最大。\n防御板块相对抗跌。UNH 涨 1.12%，MCD 涨 0.99%，COST 涨 0.68%，WMT 涨 0.25%。软件股中 APP 涨 1.50%，ADBE 涨 1.20%。UBER 涨 0.43%。\n**焦点**\n据报道，美国商务部计划封堵 AI 算力出口的「第三国」漏洞。此前，中国公司无需直接采购芯片，可以通过租用东南亚数据中心的英伟达算力获取资源，这一渠道将被关闭。英伟达在马来西亚、新加坡等地的客户收入中，有多少实际来自转道而来的中国需求，成为市场重新评估的问题。消息出现在 AI 硬件产业链普遍下跌的交易日，光模块、互联和算力租赁个股跌幅集中。\n**小结**\n本日市场呈现明显的风险偏好收缩。资金撤离高估值的 AI 硬件和题材股，转向医疗、必需消费等防御板块。市宽为 12 涨 95 跌，下跌范围很广。后续需关注出口管制细则的落地进度，以及 AI 硬件板块能否企稳。\n---\n说明：\n- 今天的行情数据中没有英伟达的涨跌幅，所以焦点段只写了出口管制这件事本身，没有写英伟达今天的价格或涨跌。帖子里「2025年7月以来最低收盘」的说法也没有引用。\n- 这次没有提供【财报】名单，所以文中没有用财报解释任何个股的涨跌。\n- 个股只有涨跌幅、没有收盘价，所以「收于 X」的写法只用在四个指数上。\n- 其余几个备选角度（OpenAI Mercury、新台币与寿险、挪威主权基金、美光与海力士）和今天的行情关系不大，没有用进复盘。","en":"【美股复盘 · 11月16日】\n**大市**\n美股三大指数全线下跌，科技股领跌。标普500 ETF（ $SPY ）收于 739.96，跌 1.91%。纳指100 ETF（QQQ）收于 661.75，跌 2.67%，跌幅居主要指数之首。道指 ETF（DIA）收于 8},{"id":"2122438428130451884","h":"Balder13946731","ts":1794863728,"zh":"连续 7 期让大家盯的 7,428 今天破了。收在 7,417，在它下方 11 点。\n今早给的锚点是 7,477，区间 7,445–7,509。实际收盘 7,416.59，跌破下沿 28 点，今天的区间说错了。全天 -1.92%。\n下一交易日的区间是 7,378–7,455。现在距近期高点 -5.15%。\n2005 年以来，距近期高点跌了 3.6% 到 6.6% 的交易日有 728 个。在这些日子之后的 20 个交易日里，摸到近期高点 7,819 的占 26%（所有交易日平均 56%），跌破 7,046 的占 24%（平均 20%），跌破 6,675 的占 5%（平均 6%）。","en":"连续 7 期让大家盯的 7,428 今天破了。收在 7,417，在它下方 11 点。\n今早给的锚点是 7,477，区间 7,445–7,509。实际收盘 7,416.59，跌破下沿 28 点，今天的区间说错了。全天 -1.92%。\n下一交易日的区间是 7,378–7,455。现在距近期高点 -5.15%。\n2005 年以来，距近期高点跌了 3.6% 到 6.6% 的交易日有 728 个。在这些日子之后的 20 个交易日里，摸到近期高点 7,819 的占 26%（所有交易日平均 56%），跌破 7,046 的占 24%（平均 20%），跌破 6,675 的占 5%（平均 6%）。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2122438428130451884","l":["balder-ai.com"],"ln":[{"u":"http://balder-ai.com/playbook","d":"balder-ai.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":3015},{"id":"2122435641090941002","h":"ArtofSpecuycky","ts":1794863064,"zh":"传奇投资人 Stanley Druckenmiller 最新13F曝光\n根据2026年第三季度披露的持仓数据，他正在进行一轮大规模的投资组合调整。首先，最大的变化是大幅削减部分AI半导体和科技股敞口：彻底清仓谷歌（GOOGL）、AMD、ARM、闪迪（SNDK）、泛林集团（LRCX），同时大幅减持台积电（TSM）94%、Palo Alto Networks（PANW）74%、CRH（CRH）71%和礼来（LLY）69%，另外还清仓了联合航空（UAL）、达美航空（DAL）。\n但他没有全面撤离科技板块，将资金转向更有选择性的方向：亚马逊（AMZN）加仓43%、希捷（STX）加仓180%，并建立约9040万美元的STX看涨期权仓位；同时新建仓西部数据（WDC）3680万美元、AppLovin（APP）3180万美元、Palantir（PLTR）1500万美元和SpaceX（SPCX）3050万美元的相关持仓。\n医疗创新还是他的核心押注，Natera（NTRA）以约13.1亿美元稳居第一大持仓，Beam Therapeutics（BEAM）大幅加仓356%，Relay Therapeutics（RLAY）加仓144%。他还大举增持Unity（U）436%，并新建仓Somnigroup（SGI）6170万美元。他还一次性新建仓三家黄金矿企：Newmont（NEM）4390万美元、Barrick（B）4290万美元、Agnico Eagle（AEM）4230万美元，合计约1.29亿美元。\n截至第三季度末，前五大持仓依次为NTRA（13.1亿美元）、STX（3.152亿美元）、AMZN（1.925亿美元）、FOXA（1.908亿美元）和YPF（1.776亿美元），其中FOXA本季度也加仓约38%。\n我对这次调仓的理解是，Druckenmiller是在从部分估值敏感、资本开支依赖较高的科技公司撤出，转向盈利兑现、产业链结构性机会和宏观对冲。 清仓AMD、ARM、LRCX，大幅减持TSM，说明他至少在主动降低半导体周期风险。但大幅加仓STX、买入WDC和STX看涨期权，说明他没有完全放弃AI基础设施需求，仓位不大，可能是怕踏空？加仓AMZN、APP、PLTR和U，说明他愿意参与AI应用和平台公司的增长机会。他还买入三大黄金矿企，可能是在为未来的货币政策变化、通胀风险或市场波动增加防御性配置。医疗方面持续重仓NTRA、加码BEAM和RLAY，说明他还是偏好具有独立技术催化剂的成长公司。\n总结下来，他上个季度的操作逻辑就是降低部分AI芯片和半导体设备敞口，增配AI存储与应用，继续押注创新医疗，同时利用黄金矿企对冲宏观不确定性。 这是上个季度的持仓，可以参考和学习的是他上个季度投资的逻辑。","en":"传奇投资人 Stanley Druckenmiller 最新13F曝光\n根据2026年第三季度披露的持仓数据，他正在进行一轮大规模的投资组合调整。首先，最大的变化是大幅削减部分AI半导体和科技股敞口：彻底清仓谷歌（GOOGL）、AMD、ARM、闪迪（SNDK）、泛林集团（LRCX），同时大幅减持台积电（TSM）94%、Palo Alto Networks（PANW）74%、CRH（CRH）71%和礼来（LLY）69%，另外还清仓了联合航空（UAL）、达美航空（DAL）。\n但他没有全面撤离科技板块，将资金转向更有选择性的方向：亚马逊（AMZN）加仓43%、希捷（STX）加仓180%，并建立约9040万美元的STX看涨期权仓位；同时新建仓西部数据（WDC）3680万美元、AppLovin（APP）3180万美元、Palantir（PLTR）1500万美元和SpaceX（SPCX）3050万美元的相关持仓。\n医疗创新还是他的核心押注，Natera（NTRA）以约13.1亿美元稳居第一大持仓，Beam Therapeutics（BEAM）大幅加仓356%，Relay Therapeutics（RLAY）加仓144%。他还大举增持Unity（U）436%，并新建仓Somnigroup（SGI）6170万美元。他还一次性新建仓三家黄金矿企：Newmont（NEM）4390万美元、Barrick（B）4290万美元、Agnico Eagle（AEM）4230万美元，合计约1.29亿美元。\n截至第三季度末，前五大持仓依次为NTRA（13.1亿美元）、STX（3.152亿美元）、AMZN（1.925亿美元）、FOXA（1.908亿美元）和YPF（1.776亿美元），其中FOXA本季度也加仓约38%。\n我对这次调仓的理解是，Druckenmiller是在从部分估值敏感、资本开支依赖较高的科技公司撤出，转向盈利兑现、产业链结构性机会和宏观对冲。 清仓AMD、ARM、LRCX，大幅减持TSM，说明他至少在主动降低半导体周期风险。但大幅加仓STX、买入WDC和STX看涨期权，说明他没有完全放弃AI基础设施需求，仓位不大，可能是怕踏空？加仓AMZN、APP、PLTR和U，说明他愿意参与AI应用和平台公司的增长机会。他还买入三大黄金矿企，可能是在为未来的货币政策变化、通胀风险或市场波动增加防御性配置。医疗方面持续重仓NTRA、加码BEAM和RLAY，说明他还是偏好具有独立技术催化剂的成长公司。\n总结下来，他上个季度的操作逻辑就是降低部分AI芯片和半导体设备敞口，增配AI存储与应用，继续押注创新医疗，同时利用黄金矿企对冲宏观不确定性。 这是上个季度的持仓，可以参考和学习的是他上个季度投资的逻辑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ArtofSpecuycky/status/2122435641090941002","l":[],"ln":[],"t":["通胀","AI科技","黄金"],"lk":141,"rt":23,"rp":7,"vw":35400},{"id":"2122411403135025159","h":"ArtofSpecuycky","ts":1794857285,"zh":"老段提前走位大幅减仓英伟达和谷歌，太强了！","en":"老段提前走位大幅减仓英伟达和谷歌，太强了！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ArtofSpecuycky/status/2122411403135025159","l":[],"ln":[],"t":["AI科技"],"lk":25,"rt":2,"rp":2,"vw":27577},{"id":"2122409923103596797","h":"wufantouzi","ts":1794856932,"zh":"现在这种极难赚钱的行情\n就特别怀念以前有期现套利\n那时候无风险年化30%的收益率\n可是币圈用户基本都看不上\n现在找遍币圈\n无风险的策略是很少了\n低风险的收益高的也不多\n这不就是红利少了嘛","en":"现在这种极难赚钱的行情\n就特别怀念以前有期现套利\n那时候无风险年化30%的收益率\n可是币圈用户基本都看不上\n现在找遍币圈\n无风险的策略 现在的5刀，因为他们后来做了些合并等等。\n好公司好价格，只有在下跌中发掘，买入，持有。我22年当时买的是100以下的META和现在差不多12块的英伟达，之后这两个标的都卖飞了。站在22年，市场无人知道23年会有OPENAI出现，但在老黄的视角里，OPENAI的爆发一定会，只是不知道何时。但就过去几年，有太多个股例子在某一时间段里面市场情绪面极低，然后出现反转，这我觉得就是投资个股的魅力，肯定会错，但是买对了后的回报就会非常可观，而且你可以拿很久。但说实话，这种方法可能不适用大多数人🤣","en":"在这种市场里分享一个拍断大腿的例子，22年12月，我和一个朋友再聊币圈，当时聊到了 $HUT，观察了整个22年熊市，我说价格在 $1 左右可以买了，因为市值会小于比特币持有市值+矿机未来产出，包括当时彼此确认 $COIN 低于30开始买。后来阴差阳错 $HUT没敢加， $COIN 没跌倒30， 当时HUT 的1刀是差不多现在的5刀，因为他们后来做了些合并等等。\n好公司好价格，只有在下跌中发掘，买入，持有。我22年当时买的是100以下的META和现在差不多12块的英伟达，之后这两个标的都卖飞了。站在22年，市场无人知道23年会有OPENAI出现，但在老黄的视角里，OPENAI的爆发一定会，只是不知道何时。但就过去几年，有太多个股例子在某一时间段里面市场情绪面极低，然后出现反转，这我觉得就是投资个股的魅力，肯定会错，但是买对了后的回报就会非常可观，而且你可以拿很久。但说实话，这种方法可能不适用大多数人🤣","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2122404952622445008","l":[],"ln":[],"t":["AI科技"],"lk":111,"rt":3,"rp":17,"vw":41548},{"id":"2122399981818847616","h":"ArtofSpecuycky","ts":1794854562,"zh":"收工，今天差不多了，spy 740目标也到了，738的缺口看是今天补还是明天补了，英伟达看今天或者明天什么时候到150了，财报前空头估计也会平仓，spy如果明天低开到ema 200 735是不错的做多机会","en":"收工，今天差不多了，spy 740目标也到了，738的缺口看是今天补还是明天补了，英伟达看今天或者明天什么时候到150了，财报前空头估计也会平仓，spy如果明天低开到ema 200 735是不错的做多机会","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXRHiR0aoAAlyES.jpg?name=orig","https://pbs.twimg.com/media/HXRHiR4asAAaDz7.jpg?name=orig"],"u":"https://x.com/ArtofSpecuycky/status/2122399981818847616","l":[],"ln":[],"t":["AI科技","财报"],"lk":40,"rt":1,"rp":5,"vw":13599},{"id":"2122399970624225681","h":"SupFin","ts":1794854559,"zh":"黄仁勋已经摸到华人在美国的天花板，然而发现上面没人。创建英伟达，成为人工智能时代最重要的企业家之一，却买不到一套自动保护你的社会关系。连当年英伟达诞生的Denny's餐厅都第一时间把纪念牌匾摘了下来，迫不及待的切割。马斯克有推特，贝索斯有华盛顿邮报，大量美国老牌家族经营了几十年的媒体、政治和社会网络。黄仁勋经营了33年英伟达，却很少经营这些东西。","en":"黄仁勋已经摸到华人在美国的天花板，然而发现上面没人。创建英伟达，成为人工智能时代最重要的企业家之一，却买不到一套自动保护你的社会关系。连当年英伟达诞生的Denny's餐厅都第一时间把纪念牌匾摘了下来，迫不及待的切割。马斯克有推特，贝索斯有华盛顿邮报，大量美国老牌家族经营了几十年的媒体、政治和社会网络。黄仁勋经营了33年英伟达，却很少经营这些东西。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122356064725454848/vid/avc1/1280x720/GfZq4u21E7QiMNjq.mp4?tag=29"],"u":"https://x.com/SupFin/status/2122399970624 dia/HXQ3rr4a8AEzmhG.jpg?name=orig"],"u":"https://x.com/BrantChinesefn/status/2122382554036875538","l":[],"ln":[],"t":["美联储","通胀","美股","AI科技"],"lk":69,"rt":3,"rp":15,"vw":16099},{"id":"2122379915643568621","h":"TraderS18","ts":1794849778,"zh":"看原视频说懂王支持黄仁勋回归其实多少是有点勉强的，感觉是想让老黄回去的人过度解读了，这也是小幅反弹后转跌的原因吧","en":"看原视频说懂王支持黄仁勋回归其实多少是有点勉强的，感觉是想让老黄回去的人过度解读了，这也是小幅反弹后转跌的原因吧","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122379657484079104/vid/avc1/1280x720/U78TP-5734P-f8-4.mp4?tag=29"],"u":"https://x.com/TraderS18/status/2122379915643568621","l":[],"ln":[],"t":[],"lk":9,"rt":0,"rp":2,"vw":20057},{"id":"2122379764522770541","h":"misaENFP","ts":1794849742,"zh":"深夜Misa又来了，聊一聊关于币圈那些没什么粉丝的小 KOL。\n最近听到一句很不舒服的谣言：Misa签约了一堆垃圾KOL。\n第一，没有那么多经费，真的垃圾的账号没有地方会要的，我这里不会，别的地方更不会。\n我的账号大部分是自然流，你像我一样17H泡在X上，你也会有正向反馈，把时间精力花在哪里哪里就逐渐开花结果，如果流量只能用钱堆出来，那么我不是一个合格的员工。\n第二点就是今天想聊的，什么时候开始，一个人在互联网上的价值，只能用用粉丝数量来衡量，没粉丝就是垃圾？\n我第一个账号从7个粉丝开端，从7到100走了很久很久，然后靠模仿短鸟老师迎来第一批对我感兴趣的人，经历了各种磨难，才一步一步走到今天，人微言轻，我缺被看见的机会，我相信你们也是。\nKOL，说白了就是网红的意思，做久了发现这里有一套非常直观的评价体系。\n粉丝多少，阅读多少，互动多少，有没有人认识你。\n这些数字当然重要，我自己做品牌，也要看数据，我很清楚传播是有商业价值的。\n但让我有点难过的是，太多人慢慢把商业价值和人的价值混为一谈了。\n我引用的这条帖子，皮神@Meichin333333 他刚认识我时，压根懒得发东西，连图都懒得自己做，让我们帮他做，通过我不懈的努力说服了他，挖掘出来一个天才，可以去看看他现在的视频质量。\n这样的列子在我的社区里数不胜数，Misa赛道代表人物@hetzerLin 也渐渐取得小结果，做视频也开始接商单了，这需要我们双向努力。\n为什么我一空下来就去“批作业”？不是我闲的没事干，是一个几十几百粉丝的小博主认真写了一篇分析，可能连被看完的机会都没有，没人看，那我来看。\n甚至有时候，粉丝少仿佛成了一种原罪。\n你表达观点，别人问你赚了多少钱。\n你分享研究，别人说你的研究有啥可参考的。\n你想争取一次合作机会，别人还没看你的内容，就已经通过主页上的数字给你定了价。\n这里面有一件事特别值得警惕：\n我们可以给流量定价，但不要习惯性地给人定价。\n这两件事是完全不同的。\n我接触过很多小 KOL，有些人白天上学上班，还有在考研的，带娃的，然后晚上回来研究行情、看数据、写内容。\n可能花了三四个小时做出来的东西，最后只有几十个阅读。\n也有人认真回复每一条评论，哪怕自己的评论区只有三五个老熟人。\n他们可能不懂怎么蹭热点，不擅长制造情绪，也没有什么资源，但这不代表他们的认真就很廉价。\n我们总喜欢讨论早期价值。\n一个项目还没有多少人关注的时候，我们愿意研究它的潜力，愿意想象它未来会发展成什么样。\n可是面对一个刚刚开始做内容的人，我们却经常只看他今天有多少粉丝。\n我们愿意给一个项目成长的时间，为什么有时候却不愿意给一个普通人成长的空间？\n我总是喜欢转发他们的帖子，我希望他们走到大家视野里，希望他们被看到，希望除了我还有赏识他们的人。\n影响力有差异，合作预算有差异，这些都很正常，很多人就是单打独斗，没有被看见，所以我来了。\n我想表达，即使你暂时没有商业价值，也不意味着你的付出不值得尊重。\n更何况，今天那些拥有几十万粉丝的人，谁没有经历过只有几十个人看自己内容的日子呢，穷途末路的时候我发p的不像我的自拍都是三四个浏览。\n我自己也做内容，所以我知道，很多时候真正让人坚持下去的，甚至不是收益。\n而是有人认真看完你写的东西，愿意和你讨论，或者告诉你一句：你这个观点让我有了新的思考，你做的很棒。\n这种被看见的感觉，真的很珍贵。\n做社区不应该只是维护一群已经有影响力的人，他们已经很厉害，一个好的社区，也应该让暂时没有影响力的人，有机会慢慢长出自己的影响力。\n我不希望这个世界最后变成一个只有大网红才有资格说话的地方。\n小账号不需要因为粉丝少而卑微。\n我们可以尊重流量，但不必崇拜流量。\n可以承认差距，但没必要把差距变成羞辱别人的理由。\n张口闭口舔狗论，那其实我更像一个舔狗，想方设法的做对大家有利的事情。\n亲爱的们，你不需要每天证明自己值得被关注，也不用因为没有流量就怀疑自己。\n认真研究过的东西不会白费，真诚建立起来的关系也不应该只用数字衡量，学会的东西都是自己的。\n粉丝数量决定了今天有多少人能听见你，但不应该决定你有没有资格开口。\n希望你以后能有很多很多粉丝。\n但在那之前，也希望你不要放弃，继续做自己。\n晚安宝贝们🌙","en":"深夜Misa又来了，聊一聊关于币圈那些没什么粉丝的小 KOL。\n最近听到一句很不舒服的谣言：Misa签约了一堆垃圾KOL。\n第一，没有那么多经费，真的垃圾的账号没有地方会要的，我这里不会，别的地方更不会。\n我的账号大部分是自然流，你像我一样17H泡在X上，你也会有正向反馈，把时间精力花在哪里哪里就逐渐开花结果，如果流量只能用钱堆出来，那么我不是一个合格的员工。\n第二点就是今天想聊的，什么时候开始，一个人在互联网上的价值，只能用用粉丝数量来衡量，没粉丝就是垃圾？\n我第一个账号从7个粉丝开端，从7到100走了很久很久，然后靠模仿短鸟老师迎来第一批对我感兴趣的人，经历了各种磨难，才一步一步走到今天，人微言轻，我缺被看见的机会，我相信你们也是。\nKOL，说白了就是网红的意思，做久了发现这里有一套非常直观的评价体系。\n粉丝多少，阅读多少，互动多少，有没有人认识你。\n这些数字当然重要，我自己做品牌，也要看数据，我很清楚传播是有商业价值的。\n但让我有点难过的是，太多人慢慢把商业价值和人的价值混为一谈了。\n我引用的这条帖子，皮神@Meichin333333 他刚认识我时，压根懒得发东西，连图都懒得自己做，让我们帮他做，通过我不懈的努力说服了他，挖掘出来一个天才，可以去看看他现在的视频质量。\n这样的列子在我的社区里数不胜数，Misa赛道代表人物@hetzerLin 也渐渐取得小结果，做视频也开始接商单了，这需要我们双向努力。\n为什么我一空下来就去“批作业”？不是我闲的没事干，是一个几十几百粉丝的小博主认真写了一篇分析，可能连被看完的机会都没有，没人看，那我来看。\n甚至有时候，粉丝少仿佛成了一种原罪。\n你表达观点，别人问你赚了多少钱。\n你分享研究，别人说你的研究有啥可参考的。\n你想争取一次合作机会，别人还没看你的内容，就已经通过主页上的数字给你定了价。\n这里面有一件事特别值得警惕：\n我们可以给流量定价，但不要习惯性地给人定价。\n这两件事是完全不同的。\n我接触过很多小 KOL，有些人白天上学上班，还有在考研的，带娃的，然后晚上回来研究行情、看数据、写内容。\n可能花了三四个小时做出来的东西，最后只有几十个阅读。\n也有人认真回复每一条评论，哪怕自己的评论区只有三五个老熟人。\n他们可能不懂怎么蹭热点，不擅长制造情绪，也没有什么资源，但这不代表他们的认真就很廉价。\n我们总喜欢讨论早期价值。\n一个项目还没有多少人关注的时候，我们愿意研究它的潜力，愿意想象它未来会发展成什么样。\n可是面对一个刚刚开始做内容的人，我们却经常只看他今天有多少粉丝。\n我们愿意给一个项目成长的时间，为什么有时候却不愿意给一个普通人成长的空间？\n我总是喜欢转发他们的帖子，我希望他们走到大家视野里，希望他们被看到，希望除了我还有赏识他们的人。\n影响力有差异，合作预算有差异，这些都很正常，很多人就是单打独斗，没有被看见，所以我来了。\n我想表达，即使你暂时没有商业价值，也不意味着你的付出不值得尊重。\n更何况，今天那些拥有几十万粉丝的人，谁没有经历过只有几十个人看自己内容的日子呢，穷途末路的时候我发p的不像我的自拍都是三四个浏览。\n我自己也做内容，所以我知道，很多时候真正让人坚持下去的，甚至不是收益。\n而是有人认真看完你写的东西，愿意和你讨论，或者告诉你一句：你这个观点让我有了新的思考，你做的很棒。\n这种被看见的感觉，真的很珍贵。\n做社区不应该只是维护一群已经有影响力的人，他们已经很厉害，一个好的社区，也应该让暂时没有影响力的人，有机会慢慢长出自己的影响力。\ 定要变化的，黄仁勋只是那个被推出来祭旗的旗手","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2122374187704795426","l":[],"ln":[],"t":["AI科技"],"lk":15,"rt":0,"rp":4,"vw":3656},{"id":"2122373371388448791","h":"xingpt","ts":1794848218,"zh":"为什么黄仁勋必须死？\n首先我们来看一下，老黄在的时候做了什么、利好了谁。\n他最提倡开源，提倡把芯片卖到全球，特别是通过一些灰色渠道流到中国，他是睁一只眼闭一只眼的，甚至可以说是纵容了这种事情发生。\n他在位的时候，整个亚洲半导体产业链都吃饱了，特别是台湾的供应商。\n所以黄仁勋在位的时期，整个 AI 硬件和半导体的投入增加是极其巨大的。\n那为什么他必须“死”呢？\n因为美国需要把 AI 的资本开支放缓了，大家实在是没有钱买卡了。\n标普全球算过，六家大厂明年 Capex 加起来 1.3 万亿美元，自由现金流还是正的只剩微软一家。高盛估计明年还得发 4000 亿美元的投资级债。这个钱是花不下去的。\n他下台之后会怎么样？\n中国的开源模型没办法拿卡了，或者说拿卡跟蒸馏的难度会非常大，跟美国frontier lab的差距会扩大。\n美国本土的云厂商也会受益，可以减小 Capex 投入。而且没有中国开源模型在后面追，闭源模型公司也可以放缓买卡和训练，把更多算力放到更高毛利的推理上，不用再拼命赶新模型的进度。\n所以未来一年你会看到，新模型发布的节奏一定是迅速放缓的。\n另外一方面，整个半导体产业链因为老黄赚得盆满钵满，很多下游产业都在被吸血。消费电子因为服务器跟内存涨价，可以说是深受其害吧。\n还有一点跟政治相关。数据中心因为算力竞赛，不断在环保和居民空间上侵害一些人的利益，民主党看到了这个机会，在中期选举上大做文章，把参众两院都拿下了。\n所以你可以看到，老黄下台，对闭源模型大厂有好处，对微软、谷歌、亚马逊、甲骨文这些买卡的大云厂商有好处，对民主党也有好处。\n不利的是中国倒卡的二道贩子、中国的开源大模型厂商，还有靠老黄背书才拿得到融资担保的 New Clouds。\n但是老黄在台上利好的这些力量，完全没有在美国争取选票的能力和政治影响力。受损的这些大厂，都有极强的背景和游说能力。\n所以在 AI 资本开支不得不放缓的时候，老黄必须走，他也必须对此负责。不然大家都会崩盘，整个融资和负债都会出问题。\n在 AI 时代要高歌猛进、堆算力的时候，黄仁勋就是那个被捧上神坛的旗手；当 AI 因为投入过大不得不放缓的时候，黄仁勋也会是第一个被推下神坛祭旗的人。\n所以老黄必须死。","en":"为什么黄仁勋必须死？\n首先我们来看一下，老黄在的时候做了什么、利好了谁。\n他最提倡开源，提倡把芯片卖到全球，特别是通过一些灰色渠道流到中国，他是睁一只眼闭一只眼的，甚至可以说是纵容了这种事情发生。\n他在位的时候，整个亚洲半导体产业链都吃饱了，特别是台湾的供应商。\n所以黄仁勋在位的时期，整个 AI 硬件和半导体的投入增加是极其巨大的。\n那为什么他必须“死”呢？\n因为美国需要把 AI 的资本开支放缓了，大家实在是没有钱买卡了。\n标普全球算过，六家大厂明年 Capex 加起来 1.3 万亿美元，自由现金流还是正的只剩微软一家。高盛估计明年还得发 4000 亿美元的投资级债。这个钱是花不下去的。\n他下台之后会怎么样？\n中国的开源模型没办法拿卡了，或者说拿卡跟蒸馏的难度会非常大，跟美国frontier lab的差距会扩大。\n美国本土的云厂商也会受益，可以减小 Capex 投入。而且没有中国开源模型在后面追，闭源模型公司也可以放缓买卡和训练，把更多算力放到更高毛利的推理上，不用再拼命赶新模型的进度。\n所以未来一年你会看到，新模型发布的节奏一定是迅速放缓的。\n另外一方面，整个半导体产业链因为老黄赚得盆满钵满，很多下游产业都在被吸血。消费电子因为服务器跟内存涨价，可以说是深受其害吧。\n还有一点跟政治相关。数据中心因为算力竞赛，不断在环保和居民空间上侵害一些人的利益，民主党看到了这个机会，在中期选举上大做文章，把参众两院都拿下了。\n所以你可以看到，老黄下台，对闭源模型大厂有好处，对微软、谷歌、亚马逊、甲骨文这些买卡的大云厂商有好处，对民主党也有好处。\n不利的是中国倒卡的二道贩子、中国的开源大模型厂商，还有靠老黄背书才拿得到融资担保的 New Clouds。\n但是老黄在台上利好的这些力量，完全没有在美国争取选票的能力和政治影响力。受损的这些大厂，都有极强的背景和游说 31253672440015","l":[],"ln":[],"t":[],"lk":27,"rt":1,"rp":2,"vw":7200},{"id":"2122330918497223003","h":"baoshu88","ts":1794838096,"zh":"美国把出海租卡的路也正式封死了。美国商务部BIS直接把通过第三国数据中心远程访问先进芯片和服务器的管制，跟物理禁运对齐。而且本规则“由财政部和国家安全委员会指导制定”。","en":"美国把出海租卡的路也正式封死了。美国商务部BIS直接把通过第三国数据中心远程访问先进芯片和服务器的管制，跟物理禁运对齐。而且本规则“由财政部和国家安全委员会指导制定”。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQIr33bgAAASSu.png?name=orig"],"u":"https://x.com/baoshu88/status/2122330918497223003","l":[],"ln":[],"t":["AI科技"],"lk":8,"rt":0,"rp":6,"vw":1728},{"id":"2122330318485201323","h":"cnfinancewatch","ts":1794837953,"zh":"这人是口语天才：\n准备揭露她：短腿小柯基，离了滤镜根本没法看，又矮又丑，又装又立。满嘴谎话，满肚子小心眼儿，还玻璃心。\n随便学一嘴，别人都很难回嘴啊！","en":"这人是口语天才：\n准备揭露她：短腿小柯基，离了滤镜根本没法看，又矮又丑，又装又立。满嘴谎话，满肚子小心眼儿，还玻璃心。\n随便学一嘴，别人都很难回嘴啊！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122330318485201323","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":960},{"id":"2122330285106680160","h":"dmjk001","ts":1794837945,"zh":"[Sun]【中金互联网】美国BIS发布AI芯片远程访问新规：海外数据中心向中国等国公司提供超1,200万TPP算力须申请许可，存量须在90天内补办\n[玫瑰]美国商务部工业与安全局（BIS）于11月15日发布暂行最终规则（IFR），规则自刊登于联邦公报之日起生效，意见征询期60天。\n[烟花]一、远程访问管制：适用于全球数据中心，存量须在90天内取得许可\n1）如知悉数据中心（含通过网络互联、共享资源的多个数据中心）向总部或最终母公司位于澳门或D:5国家组（含中国）的公司提供超过1,200万aggregate TPP的算力（约334张B200），相关先进计算芯片及服务器（ECCN 3A090、4A090等）的出口、再出口和境内转移须申请许可，适用于全球任何地区的数据中心，许可逐案审批。\n2）规则发布前已在向上述公司提供大量算力的数据中心，如需继续服务，须在规则生效后90天内取得许可，否则将面临后续出口限制；芯片持有人是否参与最初的出口交易不影响适用，数据中心转为服务上述公司视为境内转移，须取得授权。\n3）数据中心向其他客户提供算力、而该客户为上述公司训练模型或向其提供模型的，同样适用；数据中心须对客户开展尽职调查，识别是否被中国或澳门主体直接或间接持有或控制。\n4）仅用于商业推荐系统（如电商、社交媒体）的算力不受此限，但须向BIS报备；生成文本、图像、音视频、软件的AI系统，或包含此类模型的系统，即使兼有推荐功能也不在豁免范围内。\n5）BIS同时明确，现行规则一直覆盖上述公司作为采购方、或作为数据中心主要远程用户（使用超过50%算力）的交易，违规者应主动向BIS自我披露。\n[烟花]二、新增五国许可要求\n1）向印尼、马来西亚、新加坡、泰国、巴西出口、再出口或在其境内转移先进计算芯片均须申请许可，商务部长可增列其他国家；许可逐案审批，审查时考虑目的国出口管制体系的有效性及与BIS的执法合作。\n2）最终收货人或最终用户为美国总部公司（或最终母公司位于美国）的，可免于许可，但出口方须每月向BIS报告交易明细。\n[烟花]三、其他\n1）收紧对晶圆代工厂和封测厂的推定规则：位于D:1/D:4/D:5国家组或上述五国的芯片设计公司，不再能通过相关途径推翻其先进逻辑芯片属于管制物项的推定。\n2）正式废除拜登政府时期的《AI扩散规则》，取消国家分级、数据中心VEU授权及模型权重管制。\n原文详见：","en": 是其 3000 亿美元模型投资组合套件的最新一次全面调整。","en":"彭博：贝莱德调整人工智能押注，在新模型调整中增加股票风险\n贝莱德公司正在调整其人工智能敞口，并在市场抛售后战术性增加股票风险，这是其 3000 亿美元模型投资组合套件的最新一次全面调整。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQHOkIbMAEtc50.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122329409764180033","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":1040},{"id":"2122329193065119954","h":"dmjk001","ts":1794837685,"zh":"彭博：美国商务部发布了一项临时规则，限制某些国家远程访问先进 AI 芯片和服务器。\n美国商务部在一份声明中表示：“该规则旨在确保现有对美国敏感技术准入的限制，不会被涉及第三国数据中心的远程计算安排所规避。”\n新规将要求向巴西、新加坡、印度尼西亚、马来西亚和泰国再出口先进 AI 芯片须获得许可。\n商务部指出，先进云计算使得远程访问美国 AI 计算系统日益成为可能，并表示新规旨在与现有的技术实体准入规则保持一致。","en":"彭博：美国商务部发布了一项临时规则，限制某些国家远程访问先进 AI 芯片和服务器。\n美国商务部在一份声明中表示：“该规则旨在确保现有对美国敏感技术准入的限制，不会被涉及第三国数据中心的远程计算安排所规避。”\n新规将要求向巴西、新加坡、印度尼西亚、马来西亚和泰国再出口先进 AI 芯片须获得许可。\n商务部指出，先进云计算使得远程访问美国 AI 计算系统日益成为可能，并表示新规旨在与现有的技术实体准入规则保持一致。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQHBCcbQAENntw.png?name=orig"],"u":"https://x.com/dmjk001/status/2122329193065119954","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":1088},{"id":"2122328867817816451","h":"ReutersChina","ts":1794837607,"zh":"英伟达首席执行官黄仁勋（Jensen Huang）意外退出英伟达首席执行官一职，经历了动荡的一周，周一全球股市下跌，这家芯片制造商的盈利和本周 Anthropic 的 IPO 将测试人工智能推动的牛市是否还能进一步运行。","en":"Global shares fell on Monday after a volatile week capped by the shock exit of Jensen Huang as Nvidia CEO, with the chipmaker's earnings and Anthropic's IPO this week set to test whether the AI-fuelled bull market still has further to run.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122328867817816451","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/global-markets-global-markets-2026-11-16/?taid=6afb0c678a00c90001227c12&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["AI科技","财报"],"lk":1,"rt":1,"rp":0,"vw":578},{"id":"2122328617753645364","h":"cnfinancewatch","ts":1794837548,"zh":"很多人吃亏在嘴上。","en":"很多人吃亏在嘴上。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfi  股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122324121816010767","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["原油能源","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":338},{"id":"2122324116653113375","h":"cnfinancewatch","ts":1794836474,"zh":"美股盘前晚间版｜2026年11月16日 周一 北京时间21:00\n#结论\n今日大类只做两个：生物医药创新，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置的，只剩贴着前高的苹果；箱底小盘还没走到右侧，高位医药和区间中部的能源股都不进只做。\n #苹果 $AAPL 上周五收356.27，距20日高也是52周高360.83只差1.3%，处在区间87%的位置，属突破准备。盘前约357.8，又近了一点。卖方目标价均值345.57低于现价，近四周EPS下修16家，只给半仓，不突破不进。\n明确不做：半导体和AI硬件，英伟达明天盘后出财报，盘前已跌到156.7附近，大约低3.8%；ARK加仓但仍在下跌通道里的小盘；已经处在高位、或者五日涨幅过大的品种。\n#消息面\n截至北京时间21时出头，美股期指比下午更弱。纳指期货27662，较上周五结算跌约1.3%；标普期货7535，跌约0.6%；道指期货基本平。\n#英伟达 $NVDA 盘前约156.7，跌约3.8%。财报是明天美股盘后，也是换帅后第一份季报。英文媒体称黄仁勋方面在讨论重返CEO，没有官方确认，先当噪音。Susquehanna维持看好、目标价275美元，预期本季好于市场，同时提示继任者和对华出口仍有变数。Anthropic计划周三定价、周四在纳斯达克以\n$ANT 挂牌，定价区间70到78美元。\n #安进 $AMGN 11月11日公布干燥综合征新药dazodalibep三期OASIZ-301达到主要终点，盘前约471，涨约1.1%。事件权重大，但股价在20日区间69%、距20日高还有3.9%，不到突破位，只观察。家得宝、迪士尼明天盘前出财报，\n#Powell工业 $POWL\n今晚美股盘后出季报，盘前已跌到136.3附近，大约低4.5%。WTI回落到88美元附近。10年期美债收益率上周五收5.15%，美元指数约103.46，靠近20日高，VIX盘前约20.6。\nA股今天已经收盘，上证3602.57，跌0.87%；创业板跌4.37%，科创50跌5.16%，半导体映射继续失效。\n#研报面\n #苹果 卖方均值目标价345.57美元，买入16家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。 #菲利普斯66\n$PSX 均值目标价299.13，近四周EPS上修22家。 #科迪亚克天然气 $KGS 均值72.55，12家全是买入。 #太平洋生物科学\n$PACB 均值2.64。 #爱德华生命科学 $EW 均值114.5，买入19家。 #安进\n目标价本轮未采集。英伟达除Susquehanna外，上周汇丰降级和集体诉讼仍在。\n#资金面\n晚间版相对下午最重要的变化，是 $PACB\n变成ARK两只基金同买：ARKK加仓930万股、ARKG加仓7.0万股。但期权最大Put行权价2.5离现价太远，Put持仓还增了20.3%，同向项只有ARK一档，不算共振。\n$SCTX 只有ARKG单基金买入约47万美元，做空余额环比升49%，也不算共振。加仓榜里还有 $ACHR 、 $BEAM 、 $CERS\n、 $RXRX ，这几只都还在20日区间下部、近5日继续跌，不是右侧。\n带方向的期权： $AAPL Put持仓减仓20.8%，贴近现价，但只有这一项，未形成共振。 $NVDA\nPut持仓增仓75.2%，偏空；最大Call行权价165距现价约1.3%、量仓比13.46，和Put增仓方向不一致，不当作多共振。\n$TSLA Call持仓减仓62%，偏空。 $AMGN Call持仓减仓5.8%，是多单离场，内部人近三个月小额净买入构不成两项同向。\n$EW 目标价和买入家数增加两项同向，算共振，但位置已经在高位。 $PSX 目标价上调和EPS上修两项同向，期权链未采集。 $KGS\n内部人买入加目标价上调两项同向，但最大Call行权价60离现价34%，期权不算。\n#期货\n上周五完整交易日，股指是多头离场：标普迷你价跌、OI减4474手，量比0.90；纳指迷你价跌、OI减4391手，量比0.93；罗素迷你同样价跌OI降。10年期美债期货价涨OI降，是空头回补。WTI价跌OI降2.35万手，多头离场；黄金、铜也是价跌OI降，多头离场。今天期价继续偏弱，但是未完成交易日，OI先不定性。股指层面仍没有新多进场的证据。\n#中美映射\n20日窗口，美股 $JETS 涨11.57%、 $SBIO 涨11.00%、 $IHE 涨9.87%、 $FIW 涨9.38%、 $AGNG\n涨8.85%、 $ITB 涨8.81%、 $XLV 涨6.87%、 $XLY 涨6.69%、 $XLF 涨5.69%。5日窗口， $SOXX\n涨9.35%、 $XLE 涨5.42%、 $SMH 涨4.91%、 $IHE 涨4.16%。双窗口同现的是 $IHE 医药、$XLV\n医疗、$XLF 金融； $FIW 水业5日只涨1.88%，趋势还在、加速度不够。半导体仍是仅5日，20日 $SOXX\n跌9.22%，短线脉冲慎追。\nA股今天收盘后，汇添富纳指生物科技ETF 20日涨8.70%、5日涨2.10%，与美股医药是20日共振；银行ETF\n20日涨4.90%、5日涨3.95%，与 $XLF 双窗口同现，今天盘面也对得上。广发机器人ETF\n20日涨8.59%，但5日跌5.71%。芯片ETF 20日跌7.43%、5日跌2.41%，通信ETF\n20日跌25.43%，半导体映射今天继续失效。","en":"美股盘前晚间版｜2026年11月16日 周一 北京时间21:00\n#结论\n今日大类只做两个：生物医药创新，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置的，只剩贴着前高的苹果；箱底小盘还没走到右侧，高位医药和区间中部的能源股都不进只做。\n #苹果 $AAPL 上周五收356.27，距20日高也是52周高360.83只差1.3%，处在区间87%的位置，属突破准备。盘前约357.8，又近了一点。卖方目标价均值345.57低于现价，近四周EPS下修16家，只给半仓，不突破不进。\n明确不做：半导体和AI硬件，英伟达明天盘后出财报，盘前已跌到156.7附近，大约低3.8%；ARK加仓但仍在下跌通道里的小盘；已经处在高位、或者五日涨幅过大的品种。\n#消息面\n截至北京时间21时出头，美股期指比下午更弱。纳指期货27662，较上周五结算跌约1.3%；标普期货7535，跌约0.6%；道指期货基本平。\n#英伟达 $NVDA 盘前约156.7，跌约3.8%。财报是明天美股盘后，也是换帅后第一份季报。英文媒体称黄仁勋方面在讨论重返CEO，没有官方确认，先当噪音。Susquehanna维持看好、目标价275美元，预期本季好于市场，同时提示继任者和对华出口仍有变数。Anthropic计划周三定价、周四在纳斯达克以\n$ANT 挂牌，定价区间70到78美元。\n #安进 $AMGN 11月11日公布干燥综合征新药dazodalibep三期OASIZ-301达到主要终点，盘前约471，涨约1.1%。事件权重大，但股价在20日区间69%、距20日高还有3.9%，不到突破位，只观察。家得宝、迪士尼明天盘前出财报，\n#Powell工业 $POWL\n今晚美股盘后出季报，盘前已跌到136.3附近，大约低4.5%。WTI回落到88美元附近。10年期美债收益率上周五收5.15%，美元指数约103.46，靠近20日高，VIX盘前约20.6。\nA股今天已经收盘，上证3602.57，跌0.87%；创业板跌4.37%，科创50跌5.16%，半导体映射继续失效。\n#研报面\n #苹果 卖方均值目标价345.57美元，买入16家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。 #菲利普斯66\n$PSX 均值目标价299.13，近四周EPS上修22家。 #科迪亚克天然气 $KGS 均值72.55，12家全是买入。 #太平洋生物科学\n$PACB 均值2.64。 #爱德华生命科学 $EW 均值114.5，买入19家。 #安进\n目标价本轮未采集。英伟达除Susquehanna外，上周汇丰降级和集体诉讼仍在。\n#资金面\n晚间版相对下午最重要的变化，是 $PACB\n变成ARK两只基金同买：ARKK加仓930万股、ARKG加仓7.0万股。但期权最大Put行权价2.5离现价太远，Put持仓还增了20.3% 在乎这两天的，本身就不够格。\n天天纠别人鞭子，自己不好好写，算个什么？看不上。","en":"文坛那点儿事儿，也就只有酸臭文人在乎\n什么抄袭啦？什么位置啦？名气啦？都是浮云。写字这事儿，千古事，在乎这两天的，本身就不够格。\n天天纠别人鞭子，自己不好好写，算个什么？看不上。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122272482749284456","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2122270961588400152","h":"cnfinancewatch","ts":1794823801,"zh":"华尔街观察｜具身智能：路线迭变，终点不改，数采与T链价值重估\n风险提示：本文仅为产业逻辑推演复盘，不构成任何投资建议。机器人、具身智能行业技术迭代快、落地不及预期、行业竞争超预期等风险持续存在，个股仅为产业链举例，不做买入推荐。\nOpenAI组织架构调整，市场一度解读为其机器人业务战略收缩。重新审视这次团队变动，本质并不是放弃具身赛道，而是一次研发路线的明确与资源再集中，是将机器人研究并入通用大模型主线的战略选择。\n回溯OpenAI机器人业务的演进，2020年前后曾一轮收缩，2024年重建团队，本轮再次架构整合，背后的核心判断正在显现：GPT‑6、Astra这类通用基座模型，已经具备直接承载部分机器人任务的潜力。研发重心转向通用大模型作为具身智能的“大脑”，集中算力与研发资源收敛大模型范式，用更强的基础模型去驱动物理端智能，赛道的终局目标——迈向具身智能，并未改变，只是行进的路线发生迭代。\n在基座大模型能力快速抬升的时代，具身企业的壁垒正在被重新定义。基础大模型可以快速迭代，但真机运行所产生的高质量物理交互数据、垂直专家场景、线下落地部署入口，是基座模型短期无法替代的护城河。基模变强，会冲击一部分具身公司的原有业务边界，但能够持续产出独有物理数据、场景闭环落地的厂商，模型迭代可以持续拿到额外的边际增益，数据采集链条的长期价值将持续抬升。\n整条具身产业链正在迎来结构性机会，可以划分为四大主线进行跟踪：\n1. T链（执行器传动链，软硬结合核心赛道）\n传动、结构件、执行器是机器人物理行动的基础硬件，是具身落地最为刚性的一环。重点方向包含减速器、丝杠、轴承、结构件、驱控、手套、设备供应商等。产业链代表标的包括三花智控、拓普集团、恒立液压、双环传动、浙江荣泰、科达利、福赛科技、科森科技、长盈精密、斯菱智驱、金沃股份、新泉股份、田中精机等。硬件是物理AI落地绕不开的载体，行业落地加速阶段，T链的业绩弹性值得持续追踪。\n2. 本体与垂类应用\n机器人整机本体以及垂直场景落地厂商，承载着真机落地、场景闭环、物理数据生成的使命，是物理世界的数据发生器。稀缺材料、整机集成、行业场景服务商处在这一环节，代表上纬新材、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和等。本体厂商最大的价值不单是硬件整机，更是持续运转带来的独家场景数据入口。\n3. 数采链（数据采集闭环）\n高质量真机数据是本轮具身竞赛的核心资源。数采链覆盖传感器、数据采集、信号链路相关企业，代表凡拓数创、奥比中光、芯动联科、华依科技、日盈电子。随着各家具身机型持续试跑、迭代扩容，数据采集需求将会持续放量，数采链是产业军备竞赛里的隐形主线。\n4. OAI供应链条\n直接或是间接供给OpenAI具身项目的国内零部件厂商，兆威机电、长盈精密、立讯精密、中鼎股份、豪鹏科技等，将优先受益其样机迭代、试产放量的订单催化。\n物理AI已经跨过单纯Demo展示阶段，进入落地部署的产业周期。各家大厂的技术路线会持续试错、摇摆、切换，耦合架构、训练数据结构百家争鸣，短期路线具备非常强的不确定性。但整个产业向具身智能前进的长期终点不会改变，一场横跨软硬件的物理AI军备竞赛已经开启。\n行情机会不再是单一主题的脉冲炒作，产业投资主线，应当锚定数据与模型驱动的新叙事，高度把握软硬结合赛道，重点跟踪T链的产业进展。技术路线会不断生变，能够穿越路线波动的硬核硬件、真机场景、物理数据资源，才是具身时代的长期核心资产。","en":"华尔街观察｜具身智能：路线迭变，终点不改，数采与T链价值重估\n风险提示：本文仅为产业逻辑推演复盘，不构成任何投资建议。机器人、具身智能行业技术迭代快、落地不及预期、行业竞争超预期等风险持续存在，个股仅为产业链举例，不做买入推荐。\nOpenAI组织架构调整，市场一度解读为其机器人业务战略收缩。重新审视这次团队变动，本质并不是放弃具身赛道，而是一次研发路线的明确  亿美元（较 2023 年增长约 5 倍），未偿还公共债务超 1.1 万亿美元，#在全美非金融投资级企业债总发行量中的占比从不到 6% 飙升至 31%。\n[太阳] 核心结论：#复盘1997-2002年电信债务危机，坍塌顺序是一级发行条款→板块利差→总量利差/股价→评级下调，当前正处在第一道信号验证期，一级市场的估值下修和信用利差走阔，往往比二级市场股价和评级下调更早反映风险。\n相关资料包，欢迎私戳~","en":"[红包] 【天风机械】AI一级市场开始\"挤水分\"：为什么这是比二级市场更早的预警信号 #美联储官方定调AI债务规模\n[烟花] #OpenAI估值理性下修后完成首批打款：11月6日已完成新一轮融资首批110亿美元打款（全轮目标200亿美元），估值目标从10月初路演时的1.4万亿美元下调至1.25万亿美元#顶级机构开始拒绝无条件接受无限溢价，不再只听Scaling Law故事\n[爆竹] #Anthropic转向公开市场，IPO估值同步下修：10月26日已向SEC递交S-1招股书，拟以ANT代码登陆纳斯达克；前三季度收入332亿美元、同比暴涨1206%，运营亏损收窄至13亿美元，但投资者对IPO估值心理预期已从1.5-2万亿美元下调至1.2-1.3万亿美元\n[福] #CoreWeave信用利差是本轮最该盯的先行指标：依托与Meta、微软的算力合同积累大量私有信贷，总债务规模已升至约516亿美元，本周无担保债券收益率升至16.08%（+155bps），创近期新高，利差明显走阔\n[玫瑰] #美联储官方定调AI债务规模：美联储在11月14日发布的《金融稳定报告》中重点预警了 AI 债务扩张风险。截至 2026 年 10 月，#美国AI相关的债务发行规模已突破 6800 亿美元（较 2023 年增长约 5 倍），未偿还公共债务超 1.1 万亿美元，#在全美非金融投资级企业债总发行量中的占比从不到 6% 飙升至 31%。\n[太阳] 核心结论：#复盘1997-2002年电信债务危机，坍塌顺序是一级发行条款→板块利差→总量利差/股价→评级下调，当前正处在第一道信号验证期，一级市场的估值下修和信用利差走阔，往往比二级市场股价和评级下调更早反映风险。\n相关资料包，欢迎私戳~","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122264647839723903","l":[],"ln":[],"t":["美联储","美股","AI科技"],"lk":0,"rt":0,"rp":0,"vw":436},{"id":"2122262834231075160","h":"yijiangren","ts":1794821864,"zh":"上周一在群里发了一句 反弹\n基本上把住了上周的基调\n这周有点模糊了 需要再看看\n但可以肯定的是 波动一定大\nA社上市\n英伟达财报\n美联储FOMC会议纪要\n至于英伟达 $NVDA 如果再去一次前低附近\n还是可以试试做多\n比特币和以太坊现货\n越跌越买","en":"上周一在群里发了一句 反弹\n基本上把住了上周的基调\n这周有点模糊了 需要再看看\n但可以肯定的是 波动一定大\nA社上市\n英伟达财报\n美联储FOMC会议纪要\n至于英伟达 $NVDA 如果再去一次前低附近\n还是可以试试做多\n比特币和以太坊现货\n越跌越买","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXPJ2ZxbUAAn91r.png?name=orig"],"u":"https://x.com/yijiangren/status/2122262834231075160","l":[],"ln":[],"t":["美联储","AI科技","财报"],"lk":16,"rt":0,"rp":8,"vw":3647},{"id":"2122261609477460117","h":"wallstsir","ts":1794821572,"zh":"@cnfinancewatch 跟老师开启周动平衡策略，就更希望周末！更愉快了。","en":"@cnfinancewatch 跟老师开启周动平衡策略，就更希望周末！更愉快了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wallstsir/status/2122261609477460117","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":0,"vw":414},{"id":"2 率和美元压力，原油全周下跌、后半周回升。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122257117507899771","l":[],"ln":[],"t":["美联储","通胀","美股","A股港股","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":1,"vw":527},{"id":"2122256266085220688","h":"fxtrader","ts":1794820298,"zh":"百度发布第三季度财报，显示季度总营收308亿元，百度一般性业务收入250亿元，同比增长1%，超出市场预期；AI业务收入132亿元，占百度一般性业务收入53%，已连续三季占比过半。净利润14亿元，上年同期-112.3亿元。\nAI云基础设施收入82亿元，同比增长94%，较上一季度50%的同比增速显著加快；AI应用收入26亿元；AI原生营销服务收入24亿元。","en":"百度发布第三季度财报，显示季度总营收308亿元，百度一般性业务收入250亿元，同比增长1%，超出市场预期；AI业务收入132亿元，占百度一般性业务收入53%，已连续三季占比过半。净利润14亿元，上年同期-112.3亿元。\nAI云基础设施收入82亿元，同比增长94%，较上一季度50%的同比增速显著加快；AI应用收入26亿元；AI原生营销服务收入24亿元。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2122256266085220688","l":[],"ln":[],"t":["财报"],"lk":4,"rt":0,"rp":1,"vw":2321},{"id":"2122254703454986598","h":"fxtrader","ts":1794819925,"zh":"因为股价单日暴跌29%，英特尔、CEO陈立武和CFO David Zinsner面临股东起诉。\n由密歇根州南菲尔德市消防与警察退休基金牵头，向加州圣何塞联邦法院提交集体诉讼，指控英特尔误导股东，披露信息严重滞后，未及时告知市场PC销量下滑、库存高企会拖累营收。\n股东们还指控，英特尔有动机也有机会通过隐瞒经营问题误导投资者，以便在8月中旬筹集资金。当时，公司正处于被股东称为“灾难性”的第三季度中期，却以每股95美元的价格出售了价值230亿美元的股票。","en":"因为股价单日暴跌29%，英特尔、CEO陈立武和CFO David Zinsner面临股东起诉。\n由密歇根州南菲尔德市消防与警察退休基金牵头，向加州圣何塞联邦法院提交集体诉讼，指控英特尔误导股东，披露信息严重滞后，未及时告知市场PC销量下滑、库存高企会拖累营收。\n股东们还指控，英特尔有动机也有机会通过隐瞒经营问题误导投资者，以便在8月中旬筹集资金。当时，公司正处于被股东称为“灾难性”的第三季度中期，却以每股95美元的价格出售了价值230亿美元的股票。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXPAJXPaYAAYxpB.png?name=orig"],"u":"https://x.com/fxtrader/status/2122254703454986598","l":[],"ln":[],"t":["财报"],"lk":12,"rt":0,"rp":2,"vw":4037},{"id":"2122253905132429621","h":"wufantouzi","ts":1794819735,"zh":"中东还是没有实质利好\n12月加息一次不可怕\n一直不解决油价一直高位\n传导到各个行业\n变成了持续加息才可怕\n所以纳斯达克又下去了\n未来两年川普的工作很难做\n两院不配合\n政令不出白宫\n上次他已经体会过一次了\n未来两年川普想努力\n但也努力不了\n民主党希望看到一个川普治理下\n崩盘的美国由川普背锅\n这样下次大选给共和党挖好坟\n民主党才能在总统大选也赢","en":"中东还是没有实质利好\n12月加息一次不可怕\n一直不解决油价一直高位\n传导到各个行业\n变成了持续加息才可怕\n所以纳斯达克又下去了\n未来两年川普的工作很难做\n两院不配合\n政令不出白宫\n上次他已经体会过一次了\n未来两年川普想努力\n但也努力不了\n民主党希望看到一个川普治理下\n崩盘的美国由川普背锅\n这样下次大选给共和党挖好坟\n民主党才能在总统大选也赢","zh_src ":"2122252079876235528","h":"cnfinancewatch","ts":1794819300,"zh":"科技男创业。不去KTV\n美女没了活路\n科技男创业，不吃不喝，还不雇佣劳动力，只用AI\n工人也没了活路\n这就是当下处境","en":"科技男创业。不去KTV\n美女没了活路\n科技男创业，不吃不喝，还不雇佣劳动力，只用AI\n工人也没了活路\n这就是当下处境","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122252079876235528","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2122251360167211032","h":"cnfinancewatch","ts":1794819128,"zh":"过早思考世界是灾难，理性的终极是抑郁。","en":"过早思考世界是灾难，理性的终极是抑郁。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122251360167211032","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":334},{"id":"2122249865803845908","h":"cnfinancewatch","ts":1794818772,"zh":"A股盘中｜2026年11月16日 周一 截至14时40分\n#结论 今天是一次干脆的风格切换，科技硬件被集中抛售，资金躲进银行、保险和家电。截至14时40分，沪指跌1.25%报3588.94点，失守3600点；深成指跌2.88%，创业板指跌4.72%，科创50跌5.99%，跌幅都比午盘扩大了一倍多。沪深两市已成交约1.34万亿元。涨停30家，跌停58家，跌停数是涨停的近两倍，赚钱效应明显偏弱。尾盘不建议抄科技的底，持仓向银行保险和白电靠拢，算力和半导体等本周英伟达财报落地再说。\n#盘面速览 上午还算有序，沪指午盘只跌0.39%，下午一点半后科创板和创业板加速下探，摩尔线程、沐曦股份、中科飞测、芯原股份跌超10%，寒武纪跌逾8%。上证50只跌0.68%，中证1000跌3.38%，大盘价值明显抗跌，小盘成长最弱。\n#板块与风格 领跌的是光模块、PCB和半导体。 #中际旭创 $300308 跌12.7%，成交215亿元居全市场第一； #新易盛 $300502 跌11.45%。 #沪电股份 $002463 、 #深南电路 $002916 、 #生益科技 $600183 三只PCB龙头跌停，元件是跌停最集中的行业。ETF口径，通信ETF跌8.61%，芯片ETF跌6.72%，半导体ETF跌6.31%，人工智能ETF跌5.65%，半导体设备ETF跌5.56%，军工、机器人、有色跌3.5%到4.2%。 红盘一侧，银行ETF涨1.67%，红利ETF涨1.36%，煤炭ETF涨1.27%，消费ETF涨1.0%，酒和食品饮料小幅收红。 #工商银行 $601398 涨1.92%，盘中再创历史新高； #美的集团 $000333 涨2.13%，股价刷新2021年2月创下的历史高点。\n#资金面 主力资金与板块资金流接口本档未能取到，数据缺失；北向当日不披露。可以确认的是：截至11月13日两市融资余额22497.85亿元，单日减少165.45亿元；据媒体援引的统计，上周股票型ETF合计净流出约422亿元。杠杆和ETF两条线都在退，今天的下跌更多是去拥挤，而不是新增利空。\n#涨停分布 30家涨停里，家电和零售最整齐。 #九阳股份 $002242 、 #小熊电器 $002959 、 #北鼎股份 $300824 、 #长虹美菱 $000521 、 #华帝股份 $002035 涨停， #广百股份 $002187 三连板， #天虹股份 $002419 涨停，内需消费是今天唯一成片的进攻线。固态电池 #紫竹高科 $002058 、 #领湃科技 $300530 涨停；AI漫剧回暖， #吉视传媒 $601929 三天两板， #华数传媒 $000156 涨停。最高板是 #北纬科技 $002148 四连板。电网设备 #顺钠股份 $000533 涨停，带动 #国电南瑞 $600406 涨3.78%。\n#盘中消息 科技链的压力来自几件事叠在一起：英伟达创始人辞任CEO后的余波还在发酵，本周英伟达财报登场前资金不愿接；周末中东局势升温，第三艘美军航母抵达；美联储12月加息预期升温，叠加有关AI融资风险的提示。早盘日韩芯片股转跌，港股大模型和芯片股同步重挫。托底的一面也有，证监会上周表态构建稳的机制、防范异常波动，中美经贸磋商贸易理事会首次会议已在11月13日召开。\n#研报面 这一轮下跌中，财通基金认为AI仍处渗透率早中期，调整属于预期消化；中信建投、东吴证券继续看好国产算力链。防守侧，国投证券11月13日首次覆盖 #工商银行 给予买入评级、目标价9.88元；美的集团近两周获财信证券、申万宏源、中泰证券等多家买入评级，最新一篇是财信证券11月12日。今天盘中未见新的重磅首次覆盖。\n#中美映射 双窗口沿用早间口径。银行与金融是唯一的20日加5日双窗口同现方向，今天银行再创新高，正好兑现。半导体只有5日共振，20日两边都是负的，属于超跌脉冲，今天这一脉冲被彻底打掉，再次说明仅5日上榜的方向不能追。\n#三个方向 一是 #银行与保险红利，双窗口同现，盘中最稳，尾盘仍是首选。二是 #家电与内需消费，龙头创新高加上小家电零售成片涨停，研报密集覆盖，是今天的进攻线，但涨停股不追，做龙头回踩。三是 #电网设备，订单逻辑与防御属性兼具，逆势收红。半导体设备与AI漫剧降为观察。\n#六只个股 #工商银行 $601398 ，涨1.92%创历史新高，双窗口方向的核心，持有不追高。 #中国平安 $601318 ，涨1.34%，保险板块居涨幅前列，补涨品种。 #美的集团 $000333 ，涨2.13%刷新历史高点，研报覆盖最密，回踩91元附近再加。 #国电南瑞 $600406 ，涨3.78%，电网设备逆势走强，防御兼成长。 #横店影视 $603103 ，涨4.04%，院线和AI漫剧逆势回暖，冲高不追。 #北方华创 $002371 ，跌1.84%，明显抗跌于科创50，上周设备板块有资金逆势流入，只作为科技企稳后的首选观察，不在今天接。\n#小盘阿尔法 本档不选。小家电和零售涨停股多为当日一字或快速封板，20日K线位置与最新财报未完成核验，按规则不入选。\n#尾盘观察 看三点。一是沪指能否收回3600点，收不回来明天大概率继续在科技里找底；二是中际旭创和沪电股份尾盘有没有放量承接，没有就别抄；三是银行能否站稳日内高点，银行走弱意味着防守资金也在撤。今天收盘前不建议追涨停家电，也不建议加仓科技。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅","en":"A股盘中｜2026年11月16日 周一 截至14时40分\n#结论 今天是一次干脆的风格切换，科技硬件被集中抛售，资金躲进银行、保险和家电。截至14时40分，沪指跌1.25%报3588.94点，失守3600点；深成指跌2.88%，创业板指跌4.72%，科创50跌5.99%，跌幅都比午盘扩大了一倍多。沪深两市已成交约1.34万亿元。涨停30家，跌停58家，跌停数是涨停的近两倍，赚钱效应明显偏弱。尾盘不建议抄科技的底，持仓向银行保险和白电靠拢，算力和半导体等本周英伟达财报落地再说。\n#盘面速览 上午还算有序，沪指午盘只跌0.39%，下午一点半后科创板和创业板加速下探，摩尔线程、沐曦股份、中科飞测、芯原股份跌超10%，寒武纪跌逾8%。上证50只跌0.68%，中证1000跌3.38%，大盘价值明显抗跌，小盘成长最弱。\n#板块与风格 领跌的是光模块、PCB和半导体。 #中际旭创 $300308 跌12.7%，成交215亿元居全市场第一； #新易盛 $300502 跌11.45%。 #沪电股份 $002463 、 #深南电路 $002916 、 #生益科技 $600183 三只PCB龙头跌停，元件是跌停最集中的行业。ETF口径，通信ETF跌8.61%，芯片ETF跌6.72%，半导体ETF跌6.31%，人工智能ETF跌5.65%，半导体设备ETF跌5.56%，军工、机器人、有色跌3.5%到4.2%。 红盘一侧，银行ETF涨1.67%，红利ETF涨1.36%，煤炭ETF涨1.27%，消费ETF涨1.0%，酒和食品饮料小幅收红。 #工商银行 $601398 涨1.92%，盘中再创历史新高； #美的集团 $000333 涨2.13%，股价刷新2021年2月创下的历史高点。\n#资金面 主力资金与板块资金流接口本档未能取到，数据缺失；北向当日不披露。可以确认的是：截至11月13日两市融资余额22497.85亿元，单日减少165.45亿元；据媒体援引的统计，上周股票型ETF合计净流出约422亿元。杠杆和ETF两条线都在退，今天的下跌更多是去拥挤，而不是新增利空。\n#涨停分布 30家涨停里，家电和零售最整齐。 #九阳股份 $002242 、 #小熊电器 $002959 、 #北鼎股份 $300824 、 #长虹美菱 $000521 、 #华帝股份 $002035 涨停， #广百股份 $002187 三 为对nvda的担忧半导体回调，看跌\n周二：下跌，英伟达盘后财报，老黄感恩节前出席听证会，财报后看反弹\n周三：特朗普带队去APEC峰会，FOMC minutes，VIX期权到期，看涨\n周四：中美俄三国元首会晤 + Anthropic上市，看涨（IPO获得六倍超额认购，在ant上市前吸流动性，上市后IPO认购资金返还，给市场注入活力）\n周五：看涨\n11月5号大阴线capitulation确认阶段性底部，短期情绪面偏悲观，所以不认为下跌会持续很久，深度很深，大概率是二次探底higher low，然后继续反弹。中期来看可能走个bear flag做个诱多陷进再下杀。","en":"这周催化剂挺多的\n周一：因为对nvda的担忧半导体回调，看跌\n周二：下跌，英伟达盘后财报，老黄感恩节前出席听证会，财报后看反弹\n周三：特朗普带队去APEC峰会，FOMC minutes，VIX期权到期，看涨\n周四：中美俄三国元首会晤 + Anthropic上市，看涨（IPO获得六倍超额认购，在ant上市前吸流动性，上市后IPO认购资金返还，给市场注入活力）\n周五：看涨\n11月5号大阴线capitulation确认阶段性底部，短期情绪面偏悲观，所以不认为下跌会持续很久，深度很深，大概率是二次探底higher low，然后继续反弹。中期来看可能走个bear flag做个诱多陷进再下杀。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ArtofSpecuycky/status/2122206620021043359","l":[],"ln":[],"t":["美联储","AI科技","财报"],"lk":274,"rt":30,"rp":27,"vw":65420},{"id":"2122205735295795445","h":"dmjk001","ts":1794808250,"zh":"转，靠谱性尚未知，市场传闻，谨慎参考","en":"转，靠谱性尚未知，市场传闻，谨慎参考","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXOW3KOWsAAHuKU.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122205735295795445","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":242},{"id":"2122199764829909463","h":"qinbafrank","ts":1794806827,"zh":"美银最新一期FlowShow很值得看看，Hartnett对市场的态度还是很谨慎，为什么他继续坚持Risk-off，什么条件下才会重新转向Risk-on？这也是理解未来几周美股走势的关键。这份报告最值得关注的有几个方面：\n1）全球股票基金单周流入983亿美元，究竟是谁在买？\n2）美国科技股遭遇大规模抛售，为什么全球科技基金仍然持续吸金？\n3）美元、原油、美债收益率和全球流动性之间，正在发生什么变化？\n4）标普500的8000点和7000点情景，背后分别对应什么样的市场结构？\n聊聊Hartnett这期报告聊的几个要点\n1、美元成\"破坏之球\"，全球流动性全面收缩\n他的逻辑简明直接：美元飙升加上黄金跌破4000美元，等同于全球流动性的撤退信号。\n2、Hartnett为转向风险偏好设定了三个前提条件：油价（WTI）跌破70美元、10年期美债收益率降至4.5%以下、美元开始下行。周五收盘时，三项条件无一达标。\n他的逻辑是油价影响通胀、\n10年美债收益率决定贴现率和融资成本、美元走强会增加新兴市场的融资压力。\n3、而关于资金流向\n这里其实有一个分化，前四周被动工具的买入规模约3171亿美元，而主动基金存在较大赎回压力。这背后有一个重要的点：\n市场上涨究竟是主动投资者重新看好基本面，还是被动资金、ETF和长期配置资金持续买入的结果？\n两者对市场的意义是不同的：\n1）主动投资者推动，意味着风险偏好回归和盈利预期有更强共识。\n2）而只是被动资金推动，意味着风险偏好和盈利预期并没有形成共识，这种情况容易出现指数上涨、个股分化、行业内部集中度上升的情况。一旦ETF资金流入放缓，市场的边际买盘就可能迅速减弱。\n4、Hartnett 对未来市场的另一个判断：投资者情绪悲观，但实际仓位并没有那么悲观。\nHartnett 特别提到即将公布的11月17日美银全球基金经理调查需要重点关注三个指标：繁荣预期、现金仓位、实际股票仓位。\n如果现金仓位上升至4.2%以上，说明基金经理开始真正降低风险资产配置。这反而可能改善市场情绪指标，减少之前的拥挤交易风险。\n这里有一个潜在的风险：\n同一天美银经济团队认为，通胀持续高于2%目标，可能迫使美联储重新考虑此前的宽松路径，甚至需要进一步提高利率。\n同时，该团队也承认如果经济明显放缓、美国与伊朗达成协议导致油价回落，或者股票市场大幅下跌，后续加息可能推迟甚至取消。\n把本期Hartnett报告与近期看到的的机构资金流、AI融资、美国财政和美联储政策结合起来，我的判断是：\n市场可能已经完成一轮仓位清洗，但宏观压力和流动性风险尚未解除\n1）短期：市场有反弹条件，但不能简单理解为新一轮牛市已经开始\n对冲基金已经大幅降低杠杆，部分拥挤交易被清理。长期基金却仍在持续买入股票。\n这意味着市场下跌时的边际卖盘可能减少，出现空头回补和逢低买入推动的反弹。但反弹是否能够持续，需要观察主动基金是否重新增加风险敞口。\n2）中期 最大的风险来自宏观金融条件与AI政策及融资态势的碰撞\n我认为目前最值得警惕的组合是：油价长期维持高位、美元继续走强、美债收益率居高不下、科技公司债券发行增加且融资成本进一步上升。\n这些因素同时发生，就可能出现AI产业需求仍然旺盛，但资本市场对投资回报率的审视和挑剔更高，这会导致科技产业内部出现更加明显的分化。\n拥有强大现金流、资产负债表和商业化能力的公司，会比依赖外部融资的公司更有优势。\n所以未来核心是看中期宏观环境的变化，个人角度就聚焦就看三个层面：\n1）油价/通胀的走势；\n2）中期选举新政治生态下AI政策确实是进一步收紧还只是纠偏；\n3）AI商业化是不是还处于加速状态（大云厂的云业务增速和模型厂的实际营收增速）。","en":"美银最新一期FlowShow很值得看看，Hartnett对市场的态度还是很谨慎，为什么他继续坚持Risk-off，什么条件下才会重新转向Risk-on？这也是理解未来几周美股走势的关键。这份报告最值得关注的有几个方面：\n1）全球股票基金单周流入983亿美元，究竟是谁在买？\n2）美国科技股遭遇大规模抛售，为什么全球科技基金仍然持续吸金？\n3）美元、原油、美债收益率和全球流动性之间，正在发生什么变化？\n4）标普500的8000点和7000点情景，背后分别对应什么样的市场结构？\n聊聊Hartnett这期报告聊的几个要点\n1、美元成\"破坏之球\"，全球流动性全面收缩\n他的逻辑简明直接：美元飙升加上黄金跌破4000美元，等同于全球流动性的撤退信号。\n2、Hartnett为转向风险偏好设定了三个前提条件：油价（WTI）跌破70美元、10年期美债收益率降至4.5%以下、美元开始下行。周五收盘时，三项条件无一达标。\n他的逻辑是油价影响通胀、\n10年美债收益率决定贴现率和融资成本、美元走强会增加新兴市场的融资压力。\n3、而关于资金流向\n这里其实有一个分化，前四周被动工具的买入规模约3171亿美元，而主动基金存在较大赎回压力。这背后有一个重要的点：\n市场上涨究竟是主动投资者重新看好基本面，还是被动资金、ETF和长期配置资金持续买入的结果？\n两者对市场的意义是不同的：\n1）主动投资者推动，意味着风险偏好回归和盈利预期有更强共识。\n2）而只是被动资金推动，意味着风险偏好和盈利预期并没有形成共识，这种情况容易出现指数上涨、个股分化、行业内部集中度上升的情况。一旦ETF资金流入放缓，市场的边际买盘就可能迅速减弱。\n4、Hartnett 对未来市场的另一个判断：投资者情绪悲观，但实际仓位并没有那么悲观。\nHartnett 特别提到即将公布的11月17日美银全球基金经理调查需要重点关注三个指标：繁荣预期、现金仓位、实际股票仓位。\n如果现金仓位上升至4.2%以上，说明基金经理开始真正降低风险资产配置。这反而可能改善市场情绪指标，减少之前的拥挤交易风险。\n这里有一个潜在的风险：\n同一天美银经济团队认为，通胀持续高于2%目标，可能迫使美联储重新考虑此前的宽松路径，甚至需要进一步提高利率。\n同时，该团队也承认如果经济明显放缓、美国与伊朗达成协议导致油价回落，或者股票市场大幅下跌，后续加息可能推迟甚至取消。\n把本期Hartnett报告与近期看到的的机构资金流、AI融资、美国财政和美联储政策结合起来，我的判断是：\n市场可能已经完成一轮仓位清洗，但宏观压力和流动性风险尚未解除\n1）短期：市场有反弹条件，但不能简单理解为新一轮牛市已经开始\n对冲基金已经大幅降低杠杆，部分拥挤交易被清理。长期基金却仍在持续买入股票。\n这意味着市场下跌时的边际卖盘可能减少，出现空头回补和逢低买入推动的反弹。但反弹是否能够持续，需要观察主动基金是否重新增加风险敞口。\n2）中期 最大的风险来自宏观金融条件 液冷是今早公告最密的方向。 #TCL中环\n调研称硅片供需偏紧格局有望延续、价格仍在上涨周期。 #龙蟠科技\n把与宁德时代的年度采购上限由70亿元上调至90亿元。国家能源局表态智能微电网进入规模化阶段。海外看，日本三季度GDP年化环比萎缩0.1%，低于预期；美国2年期国债收益率上周一度飙升37个基点，10年期重回5%上方，本周焦点在美联储官员讲话与会议纪要。美军在中东再度形成三航母部署，原油事件风险仍在。\n#研报面 两小时更新\n中信证券今早发文，新版医保目录新增107种药品，其中1类创新药51种、数量创新高，CAR-T首次纳入，关注2027年商业化增量，与第一版提到的太平洋看好\n#联影医疗 $688271 、 #惠泰医疗 $688617\n形成医疗线的互证。华泰证券通信研报看好OCS全光交换，建议关注海外整体方案商与国内上游核心元器件配套商；光通信20日跌幅较深，这类研报更多是中期逻辑，不构成今天追高理由。半导体设备方向两小时内没有新增评级，沿用第一版太平洋、华安的买入覆盖。\n#热榜\n人气榜本档仍未取到，数据缺失。集合竞价数据要到9点15分以后才有，本档截稿前无法采集，竞价强弱请以开盘实际为准。\n#资金面\n截至11月13日两市融资余额22497.85亿元，较前一交易日减少165.45亿元，沪市减86.72亿元、深市减78.73亿元，杠杆资金在上周后半段明显撤退，这与周五创业板大跌对得上。北向当日不披露，主力资金接口本档仍缺失。\n#中美映射\n双窗口数据沿用第一版，两小时内无新的收盘数据。银行与金融仍是唯一双窗口同现方向；半导体5日共振但20日为负，属于超跌脉冲。今早日韩芯片设备股走弱，进一步说明半导体反弹不能追。\n#期货 两小时更新\n纳指期货28178，较上一结算涨约0.5%；标普期货7601，涨约0.25%。A50期指本档报价未更新，仍为上周五夜盘12831附近，数据待开盘确认。离岸人民币6.6724，较前收略升。黄金3897美元，现货一度突破3900美元；纽约原油88.2美元小幅回落；白银48.8美元、美铜617美分，均小幅走弱。恒生指数与恒生科技本档仍为上周五收盘口径，分别跌1.55%和3.02%。\n#三个方向\n一是 #银行与红利，不变，杠杆资金撤退阶段防守仍是首选。二是 #影视院线与AI漫剧，不变，高开过多不追。三是\n#半导体设备与先进封装，不变，但优先级下调到观察低吸，日本 #爱德万测试\n大跌是今天的外部压力。液冷与数据中心电力设备单列观察，今早订单和准入消息多，但属于单日催化，需要盘面放量确认。\n#六只个股\n #工商银行 $601398 ，防守底仓，不变。\n #中国电影 $600977 ，影视趋势核心，回踩分时均线再看。\n #横店影视 $603103 ，院线弹性品种，高开超过5%不追。\n #北方华创 $002371 ，设备龙头，守住上周五低点才考虑低吸。\n #拓荆科技 $688072 ，先进封装逻辑清楚，今天外部芯片设备偏弱，轻仓或等。\n #国电南瑞 $600406 ，电网订单与智能微电网定调共振，防御兼成长。\n观察名单补充 #银轮股份 $002126 ，液冷换热器进入头部云厂商白名单，需看开盘量能，不进六只。\n#小盘阿尔法\n本档仍不选。液冷相关小盘标的消息面活跃，但20日K线与最新财报未完成核验，按规则不入选。\n#操作提示\n九点二十五分先看竞价：银行是否平开偏强，影视是否高开过度，设备是否随日韩低开。IM与IC贴水若继续扩大，成长股一律等。融资盘仍在撤，追涨的胜率不高，今天以守为主，液冷只看不追。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘前第二版｜2026年11月16日 周一 两小时更新\n#结论\n七点以后外盘给了一点缓冲，但科技链的压力没有消失。纳指期货报28178附近，较上一结算回升约0.5%，标普期货涨约0.25%；日经225却从高开0.34%转跌，盘中一度跌1%，日本芯片测试设备龙头\n#爱德万测试 跌8.2%，韩国KOSPI也回吐涨幅。外部算力链情绪仍弱，第一版的判断不变：银行红利守底仓，影视院线等回踩，半导体设备只低吸。两小时内的新增变化集中在两处，一是数据中心液冷与电力设备订单密集，二是医保目录落地后创新药获券商集中解读，今天可作为盘中观察的补充线索，不改三个方向。\n#消息面 两小时更新\n韩国 #LS电气 拿下约1300亿韩元美国超大规模AI数据中心配电订单， #三星SDI\n因美国电池订单早盘涨超6%，SK海力士宣布五年投入约10.5亿美元扶持本土材料设备供应商。国内方面， #银轮股份\n大型钎焊板式换热器进入国内头部云厂商白名单， #永贵电器 称液冷快换接头等产品在推广中，液 务。\n它让星舰从“能飞到轨道”变成“能把整个火箭都带回家”，意义不亚于当年猎鹰9第一次成功着陆。后续如果能把这个Ship快速复飞，并实现双级同时回收，星舰的真正价值才会完全释放。\n很震撼！","en":"昨天星舰回收成功这是自2011年NASA航天飞机完成最后一次飞行以来，首次有飞船从轨道返回并被被机械臂‘捞’出空中回收；星舰的这次返回对SpaceX而言也是“第一次”。之前筷子夹火箭（助推器），现在已经升级到筷子夹飞船（星舰上面级）。\n飞船级（Ship）从轨道返回后被接住，是实现完全可重复使用的最后一块拼图。只有Ship也能回收，才能把单次发射成本压到接近燃料成本的水平，支撑大规模Starlink V3、轨道数据中心等高频任务。\n它让星舰从“能飞到轨道”变成“能把整个火箭都带回家”，意义不亚于当年猎鹰9第一次成功着陆。后续如果能把这个Ship快速复飞，并实现双级同时回收，星舰的真正价值才会完全释放。\n很震撼！","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2121715092903596032/vid/avc1/3840x2160/epNZoVwS39gePomx.mp4?tag=29"],"u":"https://x.com/qinbafrank/status/2122152724313845869","l":["x.com"],"ln":[{"u":"https://x.com/SpaceX/status/2121715216597827756/video/1","d":"x.com"}],"t":[],"lk":46,"rt":2,"rp":17,"vw":17130},{"id":"2122152463478513758","h":"fxtrader","ts":1794795549,"zh":"#全文 腾讯公开2026总办LinkTime现场笔记，号召AI时代再创业，“心态归零”。\n1、上船应战，准备新的打法，找到新的高地\n大航海时代，不进则退；工业革命，落后就挨打。现在进行的智能革命如果不投入拥抱，就是被颠覆。这是一个生死存亡的问题。\n随着算力的不断投入，AI无疑将带来范式的变革，渗透到更多行业只是时间问题。而且特点是变化速度很快，在短时间内就能实现指数级增长，也能快速去颠覆传统业务。在这个改变世界的技术里，我们要义不容辞冲在前面，坚定投入。\n和之前降本增效不同，上次是被动降本，这次是主动增效——AI native业务、模型和产品要逆流而上；所有业务都要面向AI时代再创业，实现效率和创造力的极致提升，也让我们给用户创造的价值再次提升。当下国内竞争激烈，AI变现尤其困难，更需要把我们处于AI前沿的身位和洞察放到业务里面。\n浪已经杀过来了。一些核心业务看起来地位稳固，但AI的进展飞快，远处的浪潮已经在吞没一个个山丘了，你不能还坐着欣赏。大家要着急，赶紧站起来准备新的打法，找到新的高地。陆战变海战，陆军变海军，大家都要搬运物资，转变技能，迅速上船应战。\n我们正在经历一个大格局的变化，选出能够适应新的打法和新的战场的人，必须干脆、直截了当。组织也要扁平化。核心业务原来是陆军守，要升级、提效，一半人负责守住，另一半人去打新的战役，一起用AI干更多的事。现在不是和平年代了，大家不能自以为站在高处很安全，或者等着人哄、谈好条件利益才上船。\n2、做以人为本的AI，能投是荣幸\n现在大家都关心AI会不会安全，会不会对人产生负面影响。我们有自己的核心价值观。这个世界需要多样化的AI，才能把AI变得安全。我们要做以人为本的AI：首先要坚持AI必须造福人类和社会；第二AI必须是由人控制的；第三，AI要让人的创造力得到赋能。这就是我们为什么要大力投入AI的原因。\n投入很大，是因为AI发展还在早期，当前所有基建和算力都需要自建，而且在所有人都投入的情况下，价格飞涨。但如果现在不投，以后可能连参与的机会也没有。但我们也非常务实，不仅看长期和全局，也要在能力范围看投入产出比，看到底能创造多少价值。\n某种程度上，可以说我们过去28年的存在就为了今天可以投入这样一个改变世界的技术潮流。不是每家公司都有机会加入，能够投入、参与这场巨大的科技变革，并且站在前沿，这是我们的荣幸。\n在这场全球变革里，我们相信这些投入肯定有回报。这个回报可能是我们AI原生业务不断发展，创造新的价值，也有可能是现有业务向AI时代更快再创业带来的增值。我们扎根于中国，我们拥有在性价比上竞争力很强的模型，如果我们让地球上各个地方的人都能用上AI，同时深刻改变各个行业，这将创造巨大的价值。\n3、我们的AI金字塔初见雏形，智能应用的开发刚刚开始\n我们的AI业务要一层层看。金字塔的核心是模型，现在我们已经进入国内第一梯队，接下来不断迭代，推动智能的成本指数级下降。小微是每个人的私人AI助理，随着能力的迅速增长，它的目标是让大家实现“token自由”。而元宝未来可以成为每个人决策和资讯的参谋。WorkBuddy就是你的员工，它在短短8个月内成为中国提供最多token的单一AI产品，展示了AI时代的生长速度。这些AI产品，可以覆盖用户每天的需求。\nWorkBuddy是我们AI native第一个跑出来的产品，也希望之后我们内部更多团队可以和AI有乘数效应，创造出更多新的AI native产品。\n现在AI在应用层面的开发才刚刚开始，如同工业化早期刚刚发明用电力来照明，还没有出现各种电器和把电力用于生产。未来更大的智能应用将发生在生产中，跟千行百业结合，还有很多机会值得我们投入。\n这个过程中，资源有限，注意力也有限，所以一定要找准定位，发挥我们的优势。\n4、心态归零，加快速度，提升要求，打破山头\n心态归零，所有核心业务每一个团队都要面向AI时代再创业，抛掉身上的包袱，拥抱AI新时代。所有人都要动手做事，整个组织有机化。每个人快速提升能力，每个组织重新变化、扁平化，以小团队为作战单元。\n打破过去的管理流程。整个管理方式以及做事方式都要通过AI重新设计，在现有业务上再延伸竞争力，让成本、效率可以再优化，获取更多的商业化能力，甚至创造出新的需求——它也许是现有路径上的新需求，也许是一个全新的AI产品。\n我们要加快速度，马上反馈，马上决策，马上行动；我们要提升对所有人的要求。重新组建混元团队的时候，一个重要的体会就是：人才密度的定义不只是你有多少特别有能耐的人，还取决于团队所有人的能力能否向上拉齐。\n组织变革要加快，未来不一定要那么多管理岗位，不要让中间传话的不想动还霸占地盘的干部成为阻碍，山头主义、地盘意识都要完全打破。很多基层同事很有动力和激情利用AI发挥自己的聪明才智，他们有机会成为一个非常好的贡献者，但是受制于很多旧有的架构和组织。我们要对此做更大的调整，让更多有机的小团队做大事，组织更灵敏地变化。\n5、所有人先动起来，在新的时代同努力，再出发\n先动起来才能找到机会。不动不改，走出第一步的勇气都没有的话，就没有未来了；什么都要问清楚才动身，也没机会。\n过去28年我们经历很多，很多次变革都非常惊险，是自上而下和自下而上合力的结果。这次也是一样。我们给更好的土壤、更好的机制，让有想法的员工能够从下面冒上来，一旦新业务培育成功，我们全力以赴支持，兄弟部门也全力支持，最终平台和用户大家都受益。\n只要我们真正动起来，全面拥抱这个新的时代变革，把腾讯的价值观做到极致，就可以克服困难，产生巨大的生产力。首先是我们的正直，“用户为本、科技向善”已经在腾讯扎根；第二很多团队都有很强的自下而上、由内而外的创造力和意愿，我们一定要把这种创造力发挥出来；第三是协作，公司很大，有部门墙，但在生死之战中，你帮我挡住后面，我帮你看住前面，协作自然就会出来。游戏、金融、安全等团队都把他们的能力跟模型进行了Co-Design，带来了Hy能力的提升，我们可以进行更多这样的参与和推动，同时再把混元的能力拉进自己的业务里，让业务有质的提升，创造新的场景；在进取这块，我们还可以更加进取。\n期待所有小伙伴们可以把焦虑转为兴奋，把等待和观望的情绪转换为全情投入，核心业务面向AI时代再创业，同时支持AI native模型、业务的发展，让我们腾讯的价值观在AI时代闪闪发光。","en":"#全文 腾讯公开2026总办LinkTime现场笔记，号召AI时代再创业，“心态归零”。\n1、上船应战，准备新的打法，找到新的高地\n大航海时代，不进则退；工业革命，落后就挨打。现在进行的智能革命如果不投入拥抱，就是被颠覆。这是一个生死存亡的问题。\n随着算力的不断投入，AI无疑将带来范式的变革，渗透到更多行业只是时间问题。而且特点是变化速度很快，在短时间内就能实现指数级增长，也能快速去颠覆传统业务。在这个改变世界的技术里，我们要义不容辞冲在前面，坚定投入。\n和之前降本增效不同，上次是被动降本，这次是主动增效——AI native业务、模型和产品要逆流而上；所有业务都要面向AI时代再创业，实现效率和创造力的极致提升，也让我们给用户创造的价值再次提升。当下国内竞争激烈，AI变现尤其困难，更需要把我们处于AI前沿的身位和洞察放到业务里面。\n浪已经杀过来了。一些核心业务看起来地位稳固，但AI的进展飞快，远处的浪潮已经在吞没一个个山丘了，你不能还坐着欣赏。大家要着急，赶紧站起来准备新的打法，找到新的高地。陆战变海战，陆军变海军，大家都要搬运物资，转变技能，迅速上船应战。\n我们正在经历一个大格局的变化，选出能够适应新的打法和新的战场的人，必须干脆、直截了当。组织也要扁平化。核心业务原来是陆军守，要升级、提效，一半人负责守住，另一半人去打新的战役，一起用AI干更多的事。现在不是和平年代了，大家不能自以为站在高处很安全，或者等着人哄、谈好条件利益才上船。\n2、做以人为本的AI，能投是荣幸\n现在大家都关心AI会不会安全，会不会对人产生负面影响。我们有自己的核心价值观。这个世界需要多样化的AI，才能把AI变得安全。我们要做以人为本的AI：首先要坚持AI必须造福人类和社会；第二AI必须是由人控制的；第三，AI要让人的创造力得到赋能。这就是我们为什么要大力投入AI的原因。\n投入很大，是因为AI发展还在早期，当前所有基建和算力都需要自建，而且在所有人都投入的情况下，价格飞涨。但如果现在不投，以后可能连参与的机会也没有。但我们也非常务实，不仅看长期和全局，也要在能力范围看投入产出比，看到底能创造多少价值。\n某种程度上，可以说我们过去28年的存在就为了今天可以投入这样一个改变世界的技术潮流。不是每家公司都有机会加入，能够投入、参与这场巨大的科技变革，并且站在前沿，这是我们的荣幸。\n在这场全球变革里，我们相信这些投入肯定有回报。这个回报可能是我们AI原生业务不断发展，创造新的价值，也有可能是现有业务向AI时代更快再创业带来的增值。我们扎根于中国，我们拥有在性价比上竞争力很强的模型，如果我们让地球上各个地方的人都能用上AI，同时深刻改变各个行业，这将创造巨大的价值。\n3、我们的AI金字塔初见雏形，智能应用的开发刚刚开始\n我们的AI业务要一层层看。金字塔的核心是模型，现在我们已经进入国内第一梯队，接下来不断迭代，推动智能的成本指数级下降。小微是每个人的私人AI助理，随着能力的迅速增长，它的目标是让大家实现“token自由”。而元宝未来可以成为每个人决策和资讯的参谋。WorkBuddy就是你的员工，它在短短8个月内成为中国提供最多token的单一AI产品，展示了AI时代的生长速度。这些AI产品，可以覆盖用户每天的需求。\nWorkBuddy是我们AI native第一个跑出来的产品，也希望之后我们内部更多团队可以和AI有乘数效应，创造出更多新的AI native产品。\n现在AI在应用层面的开发才刚刚开始，如同工业化早期刚刚发明用电力来照明，还没有出现各种电器和把电力用于生产。未来更大的智能应用将发生在生产中，跟千行百业结合，还有很多机会值得我们投入。\n这个过程中，资源有限，注意力也有限，所以一定要找准定位，发挥我们的优势。\n4、心态归零，加快速度，提升要求，打破山头\n心态归零，所有核心业务每一个团队都要面向AI时代再创业，抛掉身上的包袱，拥抱AI新时代。所有人都要动手做事，整个组织有机化。每个人快速提升能力，每个组织重新变化、扁平化，以小团队为作战单元。\n打破过去的管理流程。整个管理方式以及做事方式都要通过AI重新设计，在现有业务上再延伸竞争力，让成本、效率可以再优化，获取更多的商业化能力，甚至创造出新的需求——它也许是现有路径上的新需求，也许是一个全新的AI产品。\n我们要加快速度，马上反馈，马上决策，马上行动；我们要提升对所有人的要求。重新组建混元团队的时候，一个重要的体会就是：人才密度的定义不只是你有多少特别有能耐的人，还取决于团队所有人的能力能否向上拉齐。\n组织变革要加快，未来不一定要那么多管理岗位，不要让中间传话的不想动还霸占地盘的干部成为阻碍，山头主义、地盘意识都要完全打破。很多基层同事很有动力和激情利用AI发挥自己的聪明才智，他们有机会成为一个非常好的贡献者，但是受制于很多旧有的架构和组织。我们要对此做更大的调整，让更多有机的小团队做大事，组织更灵敏地变化。\n5、所有人先动起来，在新的时代同努力，再出发\n先动起来才能找到机会。不动不改，走出第一步的勇气都没有的话，就没有未来了；什么都要问清楚才动身，也没机会。\n过去28年我们经历很多，很多次变革都非常惊险，是自上而下和自下而上合力的结果。这次也是一样。我们给更好的土壤、更好的机制，让有想法的员工能够从下面冒上来，一旦新业务培育成功，我们全力以赴支持，兄弟部门也全力支持，最终平台和用户大家都受益。\n只要我们真正动起来，全面拥抱这个新的时代变革，把腾讯的价值观做到极致，就可以克服困难，产生巨大的生产力。首先是我们的正直，“用户为本、科技向善”已经在腾讯扎根；第二很多团队都有很强的自下而上、由内而外的创造力和意愿，我们一定要把这种创造力发挥出来；第三是协作，公司很大，有部门墙，但在生死之战中，你帮我挡住后面，我帮你看住前面，协作自然就会出来。游戏、金融、安全等团队都把他们的能力跟模型进行了Co-Design，带来了Hy能力的提升，我们可以进行更多这样的参与和推动，同时再把混元的能力拉进自己的业务里，让业务有质的提升，创造新的场景；在进取这块，我们还可以更加进取。\n期待所有小伙伴们可以把焦虑转为兴奋，把等待和观望的情绪转换为全情投入，核心业务面向AI时代再创业，同时支持AI native模型、业务的发展，让我们腾讯的价值观在AI时代闪闪发光。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2122152463478513758","l":[],"ln":[],"t":["AI科技"],"lk":15,"rt":3,"rp":5,"vw":6602},{"id":"2122152183164481878","h":"nytchinese","ts":1794795482,"zh":"英伟达丑闻引发讨论：究竟怎样才算间谍？围绕黄乐的种种疑点使中国情报机构的运作方式受到高度关注，也引发了关于究竟怎样才算间谍的讨论。黄乐在事件中所扮演角色的性质及其参与程度同样受引发疑问。","en":"英伟达丑闻引发讨论：究竟怎样才算间谍？围绕黄乐的种种疑点使中国情报机构的运作方式受到高度关注，也引发了关于究竟怎样才算间谍的讨论。黄乐在事件中所扮演角色的性质及其参与程度同样受引发疑问。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2122152183164481878","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/usa/20261116/nvidia-alice-huang-spy-china/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":331},{"id":"2122151959511830637","h":"cnfinancewatch","ts":1794795429,"zh":"我们订阅区公布了比这个更炸裂的动平衡配置；\n年化18%左右。\n年轻的可以考虑！","en":"我们订阅区公布了比这个更炸裂的动平衡配置；\n年化18%左右。\n年轻的可以考虑！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122151959511830637","l":["macaostarbridge.com"],"ln":[{"u":"https://macaostarbridge.com","d":"macaostarbridge.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":260},{"id":"2122150587311780227","h":"cnfinancewatch","ts":1794795102,"zh":"书法家长寿！好像有道理？","en":"书法家长寿！好像有道理？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122150587311780227","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":694},{"id":"2122148315311858165","h":"cnfinancewatch","ts":1794794560,"zh":"传说苏东坡爱字如命。\n那一晚，他忽然想起“剑”字该怎么写。\n不是平日里随意的临帖，是心里那一笔忽然清了。横竖撇捺，每一处转折都该落在什么地方，他躺在榻上，越想越清楚，越清楚越坐不住。\n正好，约了一歌姬，不好把别人撂在那儿！\n姑娘进门，沐浴更衣，妆未卸，人已躺平。东坡也不多言，只取了墨，就在她胸口起了第一笔。\n他写得很慢。第一笔横，墨色还浓；第二笔竖，他已觉肩头太窄，转腕不顺。写完一个“剑”，他盯着看了片刻，自己摇头，唤人端水来，用软布把胸口的字轻轻拭去，只留淡淡一痕。然后又写。这一次他换了位置，写在她背上。背比胸宽，他可以慢慢拉开笔势。可写到“刀”字旁时，他忽然觉得那一撇太浮，不像从骨里生出来的。他又洗掉，重新来过。\n一整夜，他都在她身上写字。写了，看，不满意，便洗。洗干净了，再写。有时写在手臂，有时写在腰侧，有时甚至写在她锁骨与胸口之间那一小块平坦处。墨干了又湿，湿了又干，姑娘身上的皮肤被软布反复擦拭，渐渐发红。她起初还等着他有别的动作，后来只是侧躺着，任他翻来覆去地摆弄。东坡始终没有碰她别的地方。他只写“剑”字。\n天亮时，他写到第十七个。墨已淡，人已倦，可那一笔他还是没写完。他停下来，看着姑娘背上最后那个未完的字，忽然觉得，这个“剑”字今夜是写不成了。他放下笔，把剩下的墨洗干净，付了钱，让人送她回去。\n后来有人问他，那一晚到底写了些什么。东坡只说：“写了，洗了，又写了。”问的人以为他在打趣，他却认真得很。在他看来，字没写好，便不算写过。\n写不好的字留在纸上，是污了纸；留在人身上，是污了人。洗掉重来，不过是把污处重新变成干净的地方，好让下一次的笔能落得端正。\n他一生都是这样。被贬黄州的那些年，他写字写到半夜，纸用完了，便写在竹上，写在墙上，写在自己手掌心里。写完不满意，便用水洗掉，再写。有一回他写到天明，掌心被水泡得发白，字却还是没写好。旁人劝他将就着，他只说：“将就着写出来的字，不是我的字。”\n那一晚他什么也没做。不是他不想，是他觉得，字没写完，人便还没干净。干净了，才能再写。写不好，便只能再洗。洗到天亮，字还是没写完，他便什么都没做成。\n他后来老了，还是这样。\n有时夜里忽然想起某个字该怎么写，便独自坐到天明。墨干了，水凉了，字却始终没落下去。他也不着急。在他看来，字没写好之前，一切都还来得及。来得及洗，也来得及再写。写不好的，便不算写过。不算写过的，便还不脏。","en":"传说苏东坡爱字如命。\n那一晚，他忽然想起“剑”字该怎么写。\n不是平日里随意的临帖，是心里那一笔忽然清了。横竖撇捺，每一处转折都该落在什么地方，他躺在榻上，越想越清楚，越清楚越坐不住。\n正好，约了一歌姬，不好把别人撂在那儿！\n姑娘进门，沐浴更衣，妆未卸，人已躺平。东坡也不多言，只取了墨，就在她胸口起了第一笔。\n他写得很慢。第一笔横，墨色还浓；第二笔竖，他已觉肩头太窄，转腕不顺。写完一个“剑”，他盯着看了片刻，自己摇头，唤人端水来，用软布把胸口的字轻轻拭去，只留淡淡一痕。然后又写。这一次他换了位置，写在她背上。背比胸宽，他可以慢慢拉开笔势。可写到“刀”字旁时，他忽然觉得那一撇太浮，不像从骨里生出来的。他又洗掉，重新来过。\n一整夜，他都在她身上写字。写了，看，不满意，便洗。洗干净了，再写。有时写在手臂，有时写在腰侧，有时甚至写在她锁骨与胸口之间那一小块平坦处。墨干了又湿，湿了又干，姑娘身上的皮肤被软布反复擦拭，渐渐发红。她起初还等着他有别的动作，后来只是侧躺着，任他翻来覆去地摆弄。东坡始终没有碰她别的地方。他只写“剑”字。\n天亮时，他写到第十七个。墨已淡，人已倦，可那一笔他还是没写完。他停下来，看着姑娘背上最后那个未完的字，忽然觉得，这个“剑”字今夜是写不成了。他放下笔，把剩下的墨洗干净，付了钱，让人送她回去。\n后来有人问他，那一晚到底写了些什么。东坡只说：“写了，洗了，又写了。”问的人以为他在打趣，他却认真得很。在他看来，字没写好，便不算写过。\n写不好的字留在纸上，是污了纸；留在人身上，是污了人。洗掉重来，不过是把污处重新变成干净的地方，好让下一次的笔能落得端正。\n他一生都是这样。被贬黄州的那些年，他写字写到半夜，纸用完了，便写在竹上，写在墙上，写在自己手掌心里。写完不满意，便用水洗掉，再写。有一回他写到天明，掌心被水泡得发白，字却还是没写好。旁人劝他将就着，他只说：“将就着写出来的字，不是我的字。”\n那一晚他什么也没做。不是他不想，是他觉得，字没写完，人便还没干净。干净了，才能再写。写不好，便只能再洗。洗到天亮，字还是没写完，他便什么都没做成。\n他后来老了，还是这样。\n有时夜里忽然想起某个字该怎么写，便独自坐到天明。墨干了，水凉了，字却始终没落下去。他也不着急。在他看来，字没写好之前，一切都还来得及。来得及洗，也来得及再写。写不好的，便不算写过。不算写过的，便还不脏。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122148315311858165","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":1390},{"id":"2122148040123527335","h":"fxtrader","ts":1794794495,"zh":"#数据 中国\n10月规模以上工业增加值同比增4.8%，预期5.3%；\n10月社会消费品零售总额同比增0.4%，预期0.8%；\n10月城镇调查失业率5.1%，前值5.5%；\n1-10月城镇固定资产投资同比-8.1%，预期-7.0%。","en":"#数据 中国\n10月规模 的就是鲁比奥一人所为，还是之前的观点这是多股力量的合力。\n但也意味着回归之路会艰难和坎坷，反对的态度比较坚挺。“倒黄”派既担心老黄回归之后故伎重演，又担心他去影响川普的态度和判断。\n这中间的博弈估计是反复多次，还有本周的国会听证会。\n这期间英伟达的估计估计会随着老黄能回归和回归希望被打消这个两个状态之间反复，上上次下好几次也很有可能。\n最后如果确定老黄真能回归（回归身份最好是CEO、其次是董事会主席、最差得是个顾问），可能才会迎来反转。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"老黄讨论回归，贝森特说英伟达必须从外部寻找CEO。这怎么看？\n1、金融时报说老黄已与亲信讨论了回归的可能性，\n他们正在组建一个由硅谷高管组成的“作战室”，以游说支持前英伟达负责人的回归，并将试图争取白宫的支持；\n而就在同一时间，财政部长贝森特表态称赞黄仁勋是“了不起的创新者”，英伟达也非常出色。但同时他要求英伟达董事会及外部律师必须在“未来10天内”就公司出口限制合规文化作出答复。\n在管理层问题上，他直言英伟达领导层需要“大幅调整”，并建议公司应当寻找外部人士来担任新CEO。此外，他还指出，上级与下属建立恋爱关系是“企业大忌”。\n2、只能说支持和反对的声音都很大。以老马为首的一众美国科技大佬，还有英伟达内部大部分员工都是强烈支持老黄，其实英伟达这些机构股东们例如贝莱德、富达、先锋和到富等机构，估计也都希望老黄回归，不然受损都是自己的账户、大部分资本还是求利。估计产业生态大部分伏击也都支持，毕竟很多都是一损俱损。\n当然前提条件就是如果要回归：老黄得严格遵守新的芯片出口条例，只能埋头技术发展，别在妄图钻政策空子，同时保持低调甚至避免跟川普的直接沟通。\n3、另外一点就是贝森特的表态也说明了共和党内“倒黄”并不是说的就是鲁比奥一人所为，还是之前的观点这是多股力量的合力。\n但也意味着回归之路会艰难和坎坷，反对的态度比较坚挺。“倒黄”派既担心老黄回归之后故伎重演，又担心他去影响川普的态度和判断。\n这中间的博弈估计是反复多次，还有本周的国会听证会。\n这期间英伟达的估计估计会随着老黄能回归和回归希望被打消这个两个状态之间反复，上上次下好几次也很有可能。\n最后如果确定老黄真能回归（回归身份最好是CEO、其次是董事会主席、最差得是个顾问），可能才会迎来反转。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXNZ9Kzb0AAQQxF.jpg?name=orig","https://pbs.twimg.com/media/HXNZ9K2bAAAlbDb.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122138761832411257","l":[],"ln":[],"t":["美股","AI科技"],"lk":140,"rt":12,"rp":44,"vw":46146},{"id":"2122137338134593917","h":"TraderS18","ts":1794791943,"zh":"去年期待过的三巨头会面，今年终于要实现了。不过时过境迁，现在的川普已经成了跛脚鸭，也就是说，是他更需要这场会面来给自己撑腰打气，这可能也是能够成行的原因之一吧。很多人把这次会面称为雅尔塔 2.0，但除了人物形象上的接近以外，跟真正的雅尔塔会议已经相去甚远了。当时三大国携二战胜利之余威，构建新的国际秩序和格局。而现在美俄都深陷跟中等强国的战争泥潭不能自拔，威信大减，已无力构建新的国际秩序","en":"去年期待过的三巨头会面，今年终于要实现了。不过时过境迁，现在的川普已经成了跛脚鸭，也就是说，是他更需要这场会面来给自己撑腰打气，这可能也是能够成行的原因之一吧。很多人把这次会面称为雅尔塔 2.0，但除了人物形象上的接近以外，跟真正的雅尔塔会议已经相去甚远了。当时三大国携二战胜利之余威，构建新的国际秩序和格局。而现在美俄都深陷跟中等强国的战争泥潭不能自拔，威信大减，已无力构建新的国际秩序","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXNYp5oakAAcVLF.jpg?name=orig"],"u":"https://x.com/TraderS18/status/2122137338134593917","l":[],"ln":[],"t":[],"lk":79,"rt":3,"rp":5," 块链上与英伟达股价相关的永续期货合约涨超3%。纳斯达克100期货涨0.9%。 $NVDA","en":"#行情 受黄仁勋考虑重返英伟达的消息影响，Hyperliquid区块链上与英伟达股价相关的永续期货合约涨超3%。纳斯达克100期货涨0.9%。 $NVDA","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2122132354726809659","l":[],"ln":[],"t":["美股","AI科技"],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2122124984994668844","h":"bbcchinese","ts":1794788998,"zh":"深圳APEC2026到来，特朗普（川普）称将与中俄领袖在深圳会面，中俄确认正协调三方会晤。BBC中文专访APEC执行秘书长讨论敏感议，称对领导人出席保持乐观。","en":"深圳APEC2026到来，特朗普（川普）称将与中俄领袖在深圳会面，中俄确认正协调三方会晤。BBC中文专访APEC执行秘书长讨论敏感议，称对领导人出席保持乐观。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122124984994668844","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4zrkUvE","d":"bbc.in"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":831},{"id":"2122124656111202760","h":"fxtrader","ts":1794788919,"zh":"FT：黄仁勋正考虑重返英伟达担任CEO。黄仁勋在硅谷的盟友正在向英伟达董事会施压，要求恢复他的职务。他们表示，正在组建一个由硅谷企业高管组成的“战情室”，以游说推动黄仁勋重返公司，并将努力争取白宫方面的支持。","en":"FT：黄仁勋正考虑重返英伟达担任CEO。黄仁勋在硅谷的盟友正在向英伟达董事会施压，要求恢复他的职务。他们表示，正在组建一个由硅谷企业高管组成的“战情室”，以游说推动黄仁勋重返公司，并将努力争取白宫方面的支持。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXNNHU2bQAAMz2G.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122124656111202760","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":1,"vw":1213},{"id":"2122122065050468538","h":"dmjk001","ts":1794788302,"zh":"彭博：英伟达公司罢免黄仁勋首席执行官职务数日后，压力持续加大，财政部长斯科特·贝森特敦促该公司进行“大刀阔斧”的领导层改组，并如实说明其珍贵 AI 芯片遵守出口管制的情况。\n贝森特周日试图排除黄仁勋回归的可能性，在一系列指控称英伟达协助向中国实体出售先进人工智能芯片之后，他呼吁英伟达董事会从公司外部寻找新的领导层。近日，这位财政部长还将矛头指向商务部，称其在执行美国出口限制方面做得不够。\n“这让我觉得，在董事会物色新领导人的过程中，他们需要从公司外部寻找人选，”贝森特在接受福克斯新闻 《周日早间期货》 采访时表示。“他们需要一次大刀阔斧的改组。”\n“我想不断回到英伟达的文化是什么这个问题上，他们是否在推动这些看似非法的销售，以抬高收入和利润？”贝森特说，“我认为，我们需要董事会在未来10天内给出答案，外部法律顾问也要给出答案。”\n“正如我所说，许多其他部门都在推动此事，而商务部掌握着决定权，”这位财政部长表示。","en":"彭博：英伟达公司罢免黄仁勋首席执行官职务数日后，压力持续加大，财政部长斯科特·贝森特敦促该公司进行“大刀阔斧”的领导层改组，并如实说明其珍贵 AI 芯片遵守出口管制的情况。\n贝森特周日试图排除黄仁勋回归的可能性，在一系列指控称英伟达协助向中国实体出售先进人工智能芯片之后，他呼吁英伟达董事会从公司外部寻找新的领导层。近日，这位财政部长还将矛头指向商务部，称其在执行美国出口限制方面做得不够。\n“这让我觉得，在董事会物色新领导人的过程中，他们需要从公司外部寻找人选，”贝森特在接受福克斯新闻 《周日早间期货》 采访时表示。“他们需要一次大刀阔斧的改组。”\n“我想不断回到英伟达的文化是什么这个问题上，他们是否在推动这些看似非法的销售，以抬高收入和利润？”贝森特说，“我认为，我们需要董事会在未来10天内给出答案，外部法律顾问也要给出答案。”\n“正如我所说，许多其他部门都在推动此事，而商务部掌握着决定权，”这位财政部长表示。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXNKU-SbIAArimX.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122122065050468538","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":2,"rt":0,"rp":0,"vw":895},{"id":"2122120900598243390","h":"bbcchinese","ts":1794788024,"zh":"前英伟达执行长黄仁勋（Jensen Huang）已被传唤下个月到美国参议院委员会作证，说明他与一名疑似中国间谍女性的外遇。","en":"前英伟达执行长黄仁勋（Jensen Huang）已被传唤下个月到美国参议院委员会作证，说明他与一名疑似中国间谍女性的外遇。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122120900598243390","l":["bbc.in"],"ln":[{"u":"https://bbc.in/48kuyFu","d":"bbc.in"}],"t":["AI科技"],"lk":3,"rt":0,"rp":2,"vw":3260},{"id":"2122115302049906742","h":"cnfinancewatch","ts":1794786689,"zh":"散户热议｜2026-11-16·早间\n数据时点：国内社区浏览截至北京时间11月16日07:50；海外讨论覆盖至美东11月15日晚。国内部分直接打开了韭研公社首页，引用的是公开可见的帖子标题与摘要，帖子正文多需登录，未能全文引用。Reddit与Stocktwits个股页未能直接抓取实时情绪，海外部分改用StonkHub对WSB的统计与Stocktwits已刊新闻稿，均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周一的剧本几乎写给了华为机器人\n周一早上打开韭研公社，置顶依旧是长韭杯实盘大赛、站规与“打击吹票等不良行为”专帖。往下翻，最集中的话题只有一个：今天下午的华为云CloudRobo发布会。\n第一类是华为具身智能的标的梳理。11月14日晚的帖子按合作深度列出亿嘉和、拓斯达、福龙马、埃夫特、软通动力，摘要写明亿嘉和为“深化合作伙伴”、福龙马与华为云签有2亿元环卫具身智能合同。11月15日中午另一篇把亿嘉和称作“华为机器人版的赛力斯”，依据是今年7月的合作备忘录：华为云提供大小脑平台，亿嘉和负责设计制造。还有调研纪要帖讲拓斯达人形机器人工业落地。社区的逻辑很清晰：发布会是确定日程，标的辨识度够高。\n第二类是多点开花的题材映射。周日早间有商业航天帖，讲星舰上面级首次被“筷子”捕获，作者自己也写了“主要是情绪映射”，并注明助推器回收失败。周日中午有物理AI产业拐点长文，周五还有帖子讨论美国新规草案对远程算力的限制，推出“GPU维保”这类后市场支线；后者依据是“流出的草案”，我们未能核实，只能当作传闻看。另有周末资讯汇总帖提到周五“4000多家下跌”，逆势方向是影视院线、国产替代与华为机器人，还提到BLG夺得英雄联盟全球总决赛冠军，给电竞与游戏添了一个周末话题。\n第三类是宏观被压缩成一行字。周日晚的周末研报精选里，“美银预计连续三次加息”“外汇存款准备金率今起由4%提高至6%”排在宏观第一、第二条，但在首页可见摘要中，几乎没有帖子讨论今天上午10点的10月经济数据，也较少看到新版医保目录的个股梳理。\n与券商口径的异同：相同点是都承认机器人、院线是周五的逆势方向；不同点是社区把华为发布会当成“周一主线”，而券商框架更看重上午的宏观数据与周二英伟达财报。被忽略的风险有三：一是亿嘉和上周二已出现开盘快速涨停，发布会当天容易兑现，赛力斯类比只是作者推断，并非合作条款；二是周五机器人龙头已批量跌停，高低切换后再回头接力，亏钱效应可能二次放大；三是吴清提到要优化量化与减持制度规则，清朗专帖仍在置顶，个股吹票帖要打折看。\n海外：一边看空英伟达，一边排队买Anthropic\nWallStreetBets方面（StonkHub统计，二手）：过去7天有1093名WSB用户讨论英伟达，提及1515次，较昨日午间看到的1064人略增；全Reddit口径下看空41%、看多37.8%、中性21.5%，看空略占上风，分类器平均置信度只有66%，不宜过度解读。检索到的二手汇总显示，对Anthropic上市的讨论里质疑估值、护城河与现金消耗的声音较多，但我们未能逐条核看原帖，不作量化。\nStocktwits方面：个股页实时情绪未能打开。能核验的是11月12日官方新闻稿（二手、非当日实时）：当时英伟达散户情绪为“极度看多”，站内投票58%选择抄底、42%回避，当周消息量增约593%。WSB偏空与Stocktwits偏多并不矛盾，前者更多是期权玩家在押财报波动，后者是持股者在摊低成本。\n专业资金那边，口径更谨慎。已核实：Semafor称Anthropic认购约6倍，但AI“卖铲子”公司自6月以来市值已蒸发约4.2万亿美元；分析师提醒，英伟达周二财报若不及预期，会给周四的上市蒙上阴影。分析师丹·艾维斯（Yorkville Ives）仍预期财报需求指标较上季加速。散户容易忽略的是：英伟达与Anthropic已绑在一起，上市后英伟达预计向其投资约100亿美元，两件事不是独立的两次机会，而是同一笔AI风险敞口。\n小结：国内散户押一场发布会，海外散户押一份财报，共同的风险都是“事件当天兑现”。追高之前，先想清楚自己赌的是消息本身，还是消息之后还有没有人接力。\n风险提示：以上为公开讨论整理，二手口径已标注，不构成投资建议。","en":"散户热议｜2026-11-16·早间\n数据时点：国内社区浏览截至北京时间11月16日07:50；海外讨论覆盖至美东11月15日晚。国内部分直接打开了韭研公社首页，引用的是公开可见的帖子标题与摘要，帖子正文多需登录，未能全文引用。Reddit与Stocktwits个股页未能直接抓取实时情绪，海外部分改用StonkHub对WSB的统计与Stocktwits已刊新闻稿，均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周一的剧本几乎写给了华为机器人\n周一早上打开韭研公社，置顶依旧是长韭杯实盘大赛、站规与“打击吹票等不良行为”专帖。往下翻，最集中的话题只有一个：今天下午的华为云CloudRobo发布会。\n第一类是华为具身智能的标的梳理。11月14日晚的帖子按合作深度列出亿嘉和、拓斯达、福龙马、埃夫特、软通动力，摘要写明亿嘉和为“深化合作伙伴”、福龙马与华为云签有2亿元环卫具身智能合同。11月15日中午另一篇把亿嘉和称作“华为机器人版的赛力斯”，依据是今年7月的合作备忘录：华为云提供大小脑平台，亿嘉和负责设计制造。还有调研纪要帖讲拓斯达人形机器人工业落地。社区的逻辑很清晰：发布会是确定日程，标的辨识度够高。\n第二类是多点开花的题材映射。周日早间有商业航天帖，讲星舰上面级首次被“筷子”捕获，作者自己也写了“主要是情绪映射”，并注明助推器回收失败。周日中午有物理AI产业拐点长文，周五还有帖子讨论美国新规草案对远程算力的限制，推出“GPU维保”这类后市场支线；后者依据是“流出的草案”，我们未能核实，只能当作传闻看。另有周末资讯汇总帖提到周五“4000多家下跌”，逆势方向是影视院线、国产替代与华为机器人，还提到BLG夺得英雄联盟全球总决赛冠军，给电竞与游戏添了一个周末话题。\n第三类是宏观被压缩成一行字。周日晚的周末研报精选里，“美银预计连续三次加息”“外汇存款准备金率今起由4%提高至6%”排在宏观第一、第二条，但在首页可见摘要中，几乎没有帖子讨论今天上午10点的10月经济数据，也较少看到新版医保目录的个股梳理。\n与券商口径的异同：相同点是都承认机器人、院线是周五的逆势方向；不同点是社区把华为发布会当成“周一主线”，而券商框架更看重上午的宏观数据与周二英伟达财报。被忽略的风险有三：一是亿嘉和上周二已出现开盘快速涨停，发布会当天容易兑现，赛力斯类比只是作者推断，并非合作条款；二是周五机器人龙头已批量跌停，高低切换后再回头接力，亏钱效应可能二次放大；三是吴清提到要优化量化与减持制度规则，清朗专帖仍在置顶，个股吹票帖要打折看。\n海外：一边看空英伟达，一边排队买Anthropic\nWallStreetBets方面（StonkHub统计，二手）：过去7天有1093名WSB用户讨论英伟达，提及1515次，较昨日午间看到的1064人略增；全Reddit口径下看空41%、看多37.8%、中性21.5%，看空略占上风，分类器平均置信度只有66%，不宜过度解读。检索到的二手汇总显示，对Anthropic上市的讨论里质疑估值、护城河与现金消耗的声音较多，但我们未能逐条核看原帖，不作量化。\nStocktwits方面：个股页实时情绪未能打开。能核验的是11月12日官方新闻稿（二手、非当日实时）：当时英伟达散户情绪为“极度看
