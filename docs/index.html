t=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":8,"rt":0,"rp":2,"vw":10045},{"id":"2121235393391525973","h":"business","ts":1794576903,"zh":"英国一些最大的零售商正在加大人工智能和技术岗位的招聘力度，尽管成本上涨迫使他们缩减包括店内员工在内的其他领域的招聘","en":"Some of Britain’s biggest retailers are ramping up hiring for AI and technology roles, even as rising costs force them to pull back on recruitment for other areas including in-store staff","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2121235393391525973","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-13/uk-retailers-are-hiring-for-ai-and-pulling-back-on-other-roles?taid=6af71206191e680001ad03fd&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":8,"rt":1,"rp":2,"vw":12664},{"id":"2121234769606483987","h":"cnfinancewatch","ts":1794576754,"zh":"美股盘前晚间版 2026-11-13 北京时间21:00\n#先说结论\n今日大类只留一个半： #生物医药创新 做主线， #水务与AI冷却 只观察。英伟达换帅风波还没消化完，科技反弹归反弹，今天不追AI硬件。\n如果只做3只： #礼来 $LLY 第一， #强生 $JNJ 第二， #谷歌 $GOOGL 第三且仓位减半。\n明确不做：英伟达链条抄底、期权偏空的票、5日已涨两三成的ARK热门股、盘前无理由暴涨的小票。\n#消息面\n盘前三大期指小幅偏强，标普期货涨0.15%到0.3%，纳指期货基本走平。 #英伟达 $NVDA 盘前反弹约2%到3%，但本周累计跌约11%，临时CEO由前CFO接任，外部猎头已在找继任者，下周二财报才是真正的考验。 #微软 $MSFT 因Outlook、Teams、Copilot大面积宕机超12小时，盘前跌约2%，七巨头里唯一下跌。 #Cerebras $CBRS 上调2026年收入指引并拿下微软订单，盘前涨超17%。今晚21:30公布10月PPI，市场预期环比0.4%，美联储12月加息已被完全定价，10年期美债收益率周四一度到5.10%。布伦特原油约96美元。\n高权重事件里，礼来口服OSA药物三期获胜，强生Caplyta第二个三期阳性，都属于临床与FDA一档，是本期最硬的事件。\n#研报面\n富国银行把 #艺康 $ECL 从持平上调至超配，目标价315升到380，理由是直接液冷和晶圆厂超纯水。KeyBanc上调 #派拓网络 $PANW 至超配，目标价380。William Blair与Oppenheimer同时上调 #超威半导体 $AMD ，后者目标价600。Truist把英伟达降至持有，目标价从346砍到174，Craig-Hallum也降至持有。Wedbush把Cerebras目标价提到205。\n#资金面\n期权有方向的共振： $LLY Call持仓增4.8%、Call成交放量172%，最大Put行权价1430贴着现价，三项同向； $JNJ 最大Call行权价290距现价2.25%、Call增仓5.5%、量仓比1.58，三项同向； $GOOGL 最大Call行权价300距现价0.44%、Call增仓13.4%、Call成交放量192%。 #杜邦 $DD 的P/C成交比2.42，空单放量，方向偏空，不算共振。\nARK方面， $CRWV 获ARKK与ARKW同日买入合计约1600万美元， $TWST 获ARKG与ARKK同买约840万美元，后者Call持仓增15.4%。\n#期货\n周四口径：ES与NQ价涨OI降，属空头回补，不是新多进场；罗素与10年期美债OI增但量能不够，暂不定性；30年美债价跌OI降，多头离场；WTI与布油价跌OI降，多头离场；黄金价涨OI降，空头回补。股指反弹的底子偏薄。\n#中美映射\n美股20日窗口前列为 $JETS 加9.3%、 $IHE 加9.0%、 $FIW 加8.7%、 $ITB 加8.1%；5日窗口前列为 $SMH 加12.1%、 $XLK 加7.0%、 $QQQ 加6.4%、 $ITA 加5.3%。双窗口同现的只有 $IHE （20日加9.0%，5日加4.4%），这是趋势加速。半导体只在5日窗口，20日仍跌10%，属短线脉冲。A股20日前列是机器人、纳指生物科技、汽车零部件、影视、科创人工智能，其中纳指生物科技ETF20日涨15.20%，与美股医药形成20日共振。A股5日窗口数据缺失。A股今天创业板跌3.32%，科技映射继续降温。\n#三个方向\n一是创新药与大药企，事件、资金、ETF三方都对得上。二是水务与AI冷却，艺康大行上调加上水业ETF20日走强，但个股位置还在区间中部，先看。三是大型平台股的超跌修复，只看谷歌一只，纳指20日仍是下行，降权处理。\n#六只个股\n #礼来 $LLY 收1427.28，距20日高也是52周高1460约2.3%，近20日区间85%位置，突破准备。触发是放量站上1460，失效看跌破1346一线的20日均线。\n #强生 $JNJ 收283.52，距52周高286.08不到1%，区间93%位置，偏高位突破准备，获利盘近99.5%，只给半仓。放量过286.08加，跌破270失效。\n #谷歌 $GOOGL 收298.70，20日区间30%位置，从276.92低点回升，近5日涨5.7%，箱底企稳右侧，上方MA20在305.66。站上305.66确认，跌破287失效，仓位减半。\n #艺康 $ECL 收304.41，区间59%，大行上调后先看能否站回311并挑战318.93，未到前只观察。\n #杜邦 $DD 收154.70，区间84%，距20日高159.48约3%，期权偏空，只观察，放量过159.48才考虑。\n #特维斯特生物 $TWST 收114.22，周四从93.68拉回，区间24%，长下影企稳，但20日仍跌20.9%、MA20在140，属超跌反抽，只观察。\n#小盘阿尔法\n本档不选。 $PACB 箱底位置约20%，但P/C成交比6.14偏空、做空余额还在增加，5日跌18.9%； $AMRC 积压订单72亿美元加内部人买入，5日已涨35%，短线已伸展； $FUN 区间96%位置，高位。核验不过，宁可空着。\n#操作提示\n21:30 PPI是今晚第一道闸，高于预期利率还会往上顶，先防高估值科技回落。医药按触发价分批，不在开盘追高；英伟达等财报，不抄底。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"美股盘前晚间版 2026-11-13 北京时间21:00\n#先说结论\n今日大类只留一个半： #生物医药创新 做主线， #水务与AI冷却 只观察。英伟达换帅风波还没消化完，科技反弹归反弹，今天不追AI硬件。\n如果只做3只： #礼来 $LLY 第一， #强生 $JNJ 第二， #谷歌 $GOOGL 第三且仓位减半。\n明确不做：英伟达链条抄底、期权偏空的票、5日已涨两三成的ARK热门股、盘前无理由暴涨的小票。\n#消息面\n盘前三大期指小幅偏强，标普期货涨0.15%到0.3%，纳指期货基本走平。 #英伟达 $NVDA 盘前反弹约2%到3%，但本周累计跌约11%，临时CEO由前CFO接任，外部猎头已在找继任者，下周二财报才是真正的考验。 #微软 $MSFT 因Outlook、Teams、Copilot大面积宕机超12小时，盘前跌约2%，七巨头里唯一下跌。 #Cerebras $CBRS 上调2026年收入指引并拿下微软订单，盘前涨超17%。今晚21:30公布10月PPI，市场预期环比0.4%，美联储12月加息已被完全定价，10年期美债收益率周四一度到5.10%。布伦特原油约96美元。\n高权重事件里，礼来口服OSA药物三期获胜，强生Caplyta第二个三期阳性，都属于临床与FDA一档，是本期最硬的事件。\n#研报面\n富国银行把 #艺康 $ECL 从持平上调至超配，目标价315升到380，理由是直接液冷和晶圆厂超纯水。KeyBanc上调 #派拓网络 $PANW 至超配，目标价380。William Blair与Oppenheimer同时上调 #超威半导体 $AMD ，后者目标价600。Truist把英伟达降至持有，目标价从346砍到174，Craig-Hallum也降至持有。Wedbush把 6451825045","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":858},{"id":"2121133418188788176","h":"fxtrader","ts":1794552590,"zh":"美媒在另一篇报道中刻画了黄仁勋对英伟达CFO克雷斯的内部紧张氛围。华尔街日报援引消息称，黄仁勋今夏在财务高管会议上猛烈批评克雷斯，称她是“被车灯照到的鹿”（手足无措），并说她只是“汇报型CFO”，不是能帮他定战略、做决策的人。\n英伟达在向买不起芯片的客户提供巨额担保，其中包括黄仁勋女婿Nico Caprez主导的交易（向新兴云商和数据中心商提供融资，换取长期客户和收入分成）。对此，克雷斯还是发挥出重要作用，质疑如何筛选交易、估值担保和计算回报，并试图约束Caprez的行为，但公司仍继续推进。此后英伟达即面临主要云厂商减少依赖、而大量晶圆和内存采购承诺可能堆积的双重压力。\n在黄仁勋对公司股价不满以及“循环融资”质疑之际，还是听从建议选择了收紧水龙头，不再无限供应并为客户提供融资背书。\n报道还提供了上个月柏林会议的一个小故事。黄仁勋在闭门圆桌会上，用一个日本汤面稀缺的故事，“教育”了云计算公司的CEO们。","en":"美媒在另一篇报道中刻画了黄仁勋对英伟达CFO克雷斯的内部紧张氛围。华尔街日报援引消息称，黄仁勋今夏在财务高管会议上猛烈批评克雷斯，称她是“被车灯照到的鹿”（手足无措），并说她只是“汇报型CFO”，不是能帮他定战略、做决策的人。\n英伟达在向买不起芯片的客户提供巨额担保，其中包括黄仁勋女婿Nico Caprez主导的交易（向新兴云商和数据中心商提供融资，换取长期客户和收入分成）。对此，克雷斯还是发挥出重要作用，质疑如何筛选交易、估值担保和计算回报，并试图约束Caprez的行为，但公司仍继续推进。此后英伟达即面临主要云厂商减少依赖、而大量晶圆和内存采购承诺可能堆积的双重压力。\n在黄仁勋对公司股价不满以及“循环融资”质疑之际，还是听从建议选择了收紧水龙头，不再无限供应并为客户提供融资背书。\n报道还提供了上个月柏林会议的一个小故事。黄仁勋在闭门圆桌会上，用一个日本汤面稀缺的故事，“教育”了云计算公司的CEO们。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HW_DUJlbYAAYINB.png?name=orig","https://pbs.twimg.com/media/HW_EFALaQAAqQsJ.png?name=orig"],"u":"https://x.com/fxtrader/status/2121133418188788176","l":[],"ln":[],"t":["AI科技"],"lk":7,"rt":1,"rp":4,"vw":4581},{"id":"2121131679989600721","h":"cnfinancewatch","ts":1794552175,"zh":"#三个方向\n一是影视院线与AI短剧。消息、涨停数量、主力净流入三方互证，是今天唯一有进攻性的方向。\n二是生猪养殖。产能去化加上养殖股三季报回暖，资金在低位承接。\n三是银行与红利。保险重仓、证金持股、中特估概念主力净流入都在 15 亿上下，是避险资金的落脚点。\n半导体设备单列观察：跌幅不小但主力在进，等科技情绪止跌再说。\n#六只个股\n #中国电影 $600977 涨停，成交 18.65 亿，院线龙头里流动性最好。\n #儒意电影 $002739 涨停，成交 14.56 亿，短剧与内容双线。\n #牧原股份 $002714 涨 2.73%，猪周期反转逻辑的核心标的。\n #温氏股份 $300498 涨 2.18%，同方向第二选择。\n #工商银行 $601398 涨 1.61%，红利防守首选。\n #北方华创 $002371 跌 0.96%，明显强于板块，设备涨价逻辑的观察仓。\n#小盘阿尔法\n本档不选。影视里的小票已经涨停，追高性价比低；今天缺少能完整核验20日K线与最新财报的小市值标的，宁缺不凑。\n#中美映射\n中美行业ETF的20日与5日双窗口数据本档缺失。能确认的是映射方向一致：美股AI硬件受英伟达管理层风波拖累，A股光模块与PCB同步被兑现。\n#期货\nIM主力约 6285.8，较昨结算跌约 3.3%，相对中证1000贴水约 67 点；IC跌约 2.7%；IF跌约\n1%；IH基本持平。小盘期指跌幅大于现货，空头情绪重。标普期货跌约 0.16%。\n#尾盘观察\n看三件事：光模块龙头能否在尾盘缩量止跌；影视涨停板封单是否稳定；IM贴水是否收窄。三件事都不好，明天先防守。\n#操作提示\n今天不抄科技的底。已有光模块和PCB仓位的，反抽减仓优于割在最低点。新开仓只考虑影视龙头的回踩和银行红利，单票仓位压低。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#三个方向\n一是影视院线与AI短剧。消息、涨停数量、主力净流入三方互证，是今天唯一有进攻性的方向。\n二是生猪养殖。产能去化加上养殖股三季报回暖，资金在低位承接。\n三是银行与红利。保险重仓、证金持股、中特估概念主力净流入都在 15 亿上下，是避险资金的落脚点。\n半导体设备单列观察：跌幅不小但主力在进，等科技情绪止跌再说。\n#六只个股\n #中国电影 $600977 涨停，成交 18.65 亿，院线龙头里流动性最好。\n #儒意电影 $002739 涨停，成交 14.56 亿，短剧与内容双线。\n #牧原股份 $002714 涨 2.73%，猪周期反转逻辑的核心标的。\n #温氏股份 $300498 涨 2.18%，同方向第二选择。\n #工商银行 $601398 涨 1.61%，红利防守首选。\n #北方华创 $002371 跌 0.96%，明显强于板块，设备涨价逻辑的观察仓。\n#小盘阿尔法\n本档不选。影视里的小票已经涨停，追高性价比低；今天缺少能完整核验20日K线与最新财报的小市值标的，宁缺不凑。\n#中美映射\n中美行业ETF的20日与5日双窗口数据本档缺失。能确认的是映射方向一致：美股AI硬件受英伟达管理层风波拖累，A股光模块与PCB同步被兑现。\n#期货\nIM主力约 6285.8，较昨结算跌约 3.3%，相对中证1000贴水约 67 点；IC跌约 2.7%；IF跌约\n1%；IH基本持平。小盘期指跌幅大于现货，空头情绪重。标普期货跌约 0.16%。\n#尾盘观察\n看三件事：光模块龙头能否在尾盘缩量止跌；影视涨停板封单是否稳定；IM贴水是否收窄。三件事都不好，明天先防守。\n#操作提示\n今天不抄科技的底。已有光模块和PCB仓位的，反抽减仓优于割在最低点。新开仓只考虑影视龙头的回踩和银行红利，单票仓位压低。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121131679989600721","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":1,"vw":740},{"id":"2121131674784387541","h":"cnfinancewatch","ts":1794552174,"zh":"#A股盘中 2026-11-13 北京时间14:30\n#结论\n今天是一场典型的高位科技集中兑现。光模块、CPO、PCB 一起被砸，创业板指跌 3.51%，中证1000跌\n2.82%，全市场跌多涨少接近七比一。资金躲进三处：影视院线、生猪养殖、银行红利。尾盘不要去接光模块的飞刀，防守仓位可以留，进攻只看有消息又有资金的影视线。\n#盘面速览\n截至14:40，上证指数 3630.43，跌 0.69%；深证成指跌 2.13%；创业板指跌 3.51%；科创50跌\n2.65%；沪深300跌 0.81%。恒生指数跌 1.49%，恒生科技跌 2.92%。沪深两市成交约 1.52 万亿。上涨约 700\n家，下跌约 4630 家，涨停 37 家，跌停 33 家，炸板 21 家。权重托住了上证，中小盘和科技成长是重灾区。\n#板块与风格\n跌幅前列：印制电路板跌 7.03%，元件跌 6.47%，玻纤制造跌 5.61%，分立器件、被动元件、通信线缆都跌 5%\n左右。概念上光通信模块跌 5.32%，CPO跌 5.16%，PCB跌 4.9%，高带宽内存跌 4.7%。\n涨幅前列：院线涨 12.5%，影视院线涨 4.12%，生猪养殖涨 3.13%，银行涨 1.35%。风格上大盘价值、红利、茅指数小幅翻红，明显的高低切。\n#资金面\n沪市主力净流出约 208 亿，深市约 380 亿，合计近 590 亿，超大单是主要卖方。行业主力净流入前列是影视院线 13.62 亿、银行\n11.29 亿、IT服务 10.28 亿，半导体设备板块虽然跌 3.52%，主力仍净流入 9.16 亿，值得记一笔。流出最重的是CPO概念\n166 亿、光通信模块 156 亿、PCB 140 亿。个股成交前列 #中际旭创 $300308 跌 8.8%，主力净流出 30 亿；\n#新易盛 $300502 跌 9.37%； #东山精密 $002384 与 #沪电股份 $002463 跌停。北向实时数据缺失。\n#涨停分布\n37 家涨停里，汽车零部件 6 家，影视院线 5 家，游戏与IT服务各 2 家。连板高度最高是 #天普股份 $605255 4连板，\n#北纬科技 $002148 和 #金辰股份 $603396 3连板。高标还在，但没有形成主线梯队，情绪偏弱。\n#盘中消息\n英伟达CEO更替风波继续发酵，美股科技情绪偏谨慎，纳指期货盘中跌约\n0.37%。美联储官员接连放鹰，美债遭抛售，海外加息担忧压制高估值。中芯国际业绩会提到上游设备采购价格提高、交付周期拉长，AI配套芯片代工价格维持上行，这是设备链今天逆势吸金的直接理由。火山引擎发布新模型，AI影视降本提速，短剧与院线集体涨停。猪周期产能去化加速的预期继续升温。\n#研报面\n今天新出的买入评级集中在半导体与电网：华安证券给 #海光信息 $688041 #长鑫科技 $688825 #盛合晶微 $688820\n#国电南瑞 $600406 买入；太平洋给 #华峰测控 $688200 买入，看AI测试布局；国信证券11月11日给 #益生股份\n$002458 增持，三季度归母净利同比增 429%。","en":"#A股盘中 2026-11-13 北京时间14:30\n#结论\n今天是一场典型的高位科技集中兑现。光模块、CPO、PCB 一起被砸，创业板指跌 3.51%，中证1000跌\n2.82%，全市场跌多涨少接近七比一。资金躲进三处：影视院线、生猪养殖、银行红利。尾盘不要去接光模块的飞刀，防守仓位可以留，进攻只看有消息又有资金的影视线。\n#盘面速览\n截至14:40，上证指数 3630.43，跌 0.69%；深证成指跌 2.13%；创业板指跌 3.51%；科创50跌\n2.65%；沪深300跌 0.81%。恒生指数跌 1.49%，恒生科技跌 2.92%。沪深两市成交约 1.52 万亿。上涨约 700\n家，下跌约 4630 家，涨停 37 家，跌停 33 家，炸板 21 家。权重托住了上证，中小盘和科技成长是重灾区。\n#板块与风格\n跌幅前列：印制电路板跌 7.03%，元件跌 6.47%，玻纤制造跌 5.61%，分立器件、被动元件、通信线缆都跌 5%\n左右。概念上光通信模块跌 5.32%，CPO跌 5.16%，PCB跌 4.9%，高带宽内存跌 4.7%。\n涨幅前列：院线涨 12.5%，影视院线涨 4.12%，生猪养殖涨 3.13%，银行涨 1.35%。风格上大盘价值、红利、茅指数小幅翻红，明显的高低切。\n#资金面\n沪市主力净流出约 208 亿，深市约 380 亿，合计近 590 亿，超大单是主要卖方。行业主力净流入前列是影视院线 13.62 亿、银行\n11.29 亿、IT服务 10.28 亿，半导体设备板块虽然跌 3.52%，主力仍净流入 9.16 亿，值得记一笔。流出最重的是CPO概念\n166 亿、光通信模块 156 亿、PCB 140 亿。个股成交前列 #中际旭创 $300308 跌 8.8%，主力净流出 30 亿；\n#新易盛 $300502 跌 9.37%； #东山精密 $002384 与 #沪电股份 $002463 跌停。北向实时数据缺失。\n#涨停分布\n37 家涨停里，汽车零部件 6 家，影视院线 5 家，游戏与IT服务各 2 家。连板高度最高是 #天普股份 $605255 4连板，\n#北纬科技 $002148 和 #金辰股份 $603396 3连板。高标还在，但没有形成主线梯队，情绪偏弱。\n#盘中消息\n英伟达CEO更替风波继续发酵，美股科技情绪偏谨慎，纳指期货盘中跌约\n0.37%。美联储官员接连放鹰，美债遭抛售，海外加息担忧压制高估值。中芯国际业绩会提到上游设备采购价格提高、交付周期拉长，AI配套芯片代工价格维持上行，这是设备链今天逆势吸金的直接理由。火山引擎发布新模型，AI影视降本提速，短剧与院线集体涨停。猪周期产能去化加速的预期继续升温。\n#研报面\n今天新出的买入评级集中在半导体与电网：华安证券给 #海光信息 $688041 #长鑫科技 $688825 #盛合晶微 $688820\n#国电南瑞 $600406 买入；太平洋给 #华峰测控 $688200 买入，看AI测试布局；国信证券11月11日给 # 结盟关系！根本目的是两年后宣战，现在是剪出羽翼！\n下一步还会有大瓜。不排除马斯克，美国进入新的政治危险期。\n你们 #关注我！我会一一分析。\n我也会进一步解释我为什么会是汉语大v中唯一一个 #预见黄仁勋需要辞职的人！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121116642734485920","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":2348},{"id":"2121115958437957825","h":"CrushTheShorts","ts":1794548427,"zh":"是的不要怀疑，A 股就是全世界最傻逼的市场\n昨天上午冲高已经猥琐的跑了大半，躲过了全天跳水，晚上复盘感觉真是天才交易员\n早上低开，美滋滋-5%低吸了几个昨天跳了七八个点的票，下午一看，还他妈能“深水追高”，又给套上了","en":"是的不要怀疑，A 股就是全世界最傻逼的市场\n昨天上午冲高已经猥琐的跑了大半，躲过了全天跳水，晚上复盘感觉真是天才交易员\n早上低开，美滋滋-5%低吸了几个昨天跳了七八个点的票，下午一看，还他妈能“深水追高”，又给套上了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2121115958437957825","l":[],"ln":[],"t":[],"lk":24,"rt":0,"rp":9,"vw":5018},{"id":"2121115015856148923","h":"cnfinancewatch","ts":1794548202,"zh":"这是中肯评价！","en":"这是中肯评价！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121115015856148923","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":2226},{"id":"2121111535460536800","h":"cnfinancewatch","ts":1794547373,"zh":"散户热议｜2026-11-13·午间\n数据时点：北京时间2026年11月13日约13:20。国内部分来自韭研公社公开帖与21财经、一财等报道；海外部分来自Reuters报道、Stocktwits新闻页与投票、StonkHub对Reddit WallStreetBets的统计。本轮未直接登录抓取WSB原帖，WSB数据为第三方统计的二手转述；Stocktwits用户发言均转引自其新闻页，非我们抽样。以下不含任何编造的引语或情绪数字。\n一、国内：资金在缩量里玩“接力”\n真实话题一：AI漫剧还能不能上。韭研公社午间热帖的标题是“创业板指半日跌超1%，AI漫剧和银行股凭什么上涨？”，帖子把上午概括为存量轮动：AI漫剧逆势领涨，文投控股5天4板，金逸影视4天2板，华是科技、幸福蓝海20CM涨停，横店影视、湖北广电涨停。讨论里看多的理由是“技术降本跨过临界点”，腾讯首款AI游戏陪伴产品首测、AI长剧登上卫视黄金档被反复引用。\n但公告和券商口径冷静得多。文投控股自己披露AI漫剧收入占比约2.57%，前三季度营收1.80亿元、同比降29.51%；公司工作人员对21财经说“纯是击鼓传花”。华西证券测算，今年上半年抖音新增AI剧播放破亿率仅约0.48%，投流可能占全链路成本约70%，制作成本下降不等于利润率提升。散户热的是“故事”，券商冷的是“利润表”，这是今天最大的分歧。\n真实话题二：CPO是洗盘还是见顶。光模块是过去几个月散户最集中的持仓之一，上午天孚通信、源杰科技、新易盛集体跳水。论坛里一派认为思科上调指引、中际旭创获纳入MSCI中国指数（邮件转述）说明逻辑还在，跌下来是机会；另一派担心英伟达换帅后整条链的估值锚松动。我们的看法偏后者：需求没坏，但筹码太拥挤，抄底要等成交量明显萎缩。\n真实话题三：高低切换。银行创新高、猪肉白酒反弹，被不少帖子解读为“机构在防守”。这和券商口径一致，但散户往往在切换的第二三天才追进去，此时性价比已下降。\n被忽略的风险：一是亏钱效应在扩散，超2900只个股下跌，炸板和高位大面的个股增多，大东方收监管函后高位走弱是前车之鉴；二是缩量接力的特点是“涨得快、退得更快”，一旦龙头停牌或开板，后排跟风股往往连续补跌；三是监管态度与情绪存在分歧，市场在赌监管容忍度。\n二、海外：英伟达成了散户的“信仰测试”\nReuters报道，黄仁勋辞职当天，散户在开盘半小时内净买入约1.11亿美元英伟达，抄底力度创纪录，帮助股价从盘中最深约14%的跌幅收窄。Stocktwits新闻页显示，其平台对英伟达的散户情绪处于“极度看多”区间，一周消息量增长593%；一项投票中58%的受访者表示在抄底，42%选择回避。\nWSB的态度更分裂。据StonkHub统计，过去7天有859名WSB用户讨论英伟达，较前一周增加逾4倍；全Reddit范围内看多39.3%、看空38.0%，几乎打平。WSB最热的帖子是官方换帅公告本身，其次是一批调侃黄仁勋私生活的梗帖，可见“玩梗”和“抄底”并存。\n与华尔街的分歧很鲜明：Truist与Craig-Hallum分别把英伟达降至“持有”，目标价下调到174美元和180美元，理由是治理和调查风险“比估值更重要”。散户看到的是“便宜了”，机构看到的是“不确定性还没定价”。另一个热点是AMD与博通，Stocktwits上有交易者认为“英伟达的坏消息就是AMD的催化剂”。\n被忽略的风险：一是联邦调查与对华出口审查尚无结论，抄底者押的是“最坏已过去”；二是利率环境逆风，今晚PPI若超预期，高估值科技会被一起抛售；三是英伟达11月18日财报是换帅后首份，指引和管理层表态都可能引发新一轮波动。\n三、我们怎么看\n国内与海外散户今天的共同点，是都在用“抄底”和“接力”对抗利率与治理风险。我们的建议是：题材股不接最后一棒，科技龙头等事件落地，低位防守资产可作为仓位的压舱石。\n本文仅为舆情整理与研究观点，事实与推测已分开标注，不构成投资建议。市场有风险，投资需谨慎。","en":"散户热议｜2026-11-13·午间\n数据时点：北京时间2026年11月13日约13:20。国内部分来自韭研公社公开帖与21财经、一财等报道；海外部分来自Reuters报道、Stocktwits新闻页与投票、StonkHub对Reddit WallStreetBets的统计。本轮未直接登录抓取WSB原帖，WSB数据为第三方统计的二手转述；Stocktwits用户发言均转引自其新闻页，非我们抽样。以下不含任何编造的引语或情绪数字。\n一、国内：资金在缩量里玩“接力”\n真实话题一：AI漫剧还能不能上。韭研公社午间热帖的标题是“创业板指半日跌超1%，AI漫剧和银行股凭什么上涨？”，帖子把上午概括为存量轮动：AI漫剧逆势领涨，文投控股5天4板，金逸影视4天2板，华是科技、幸福蓝海20CM涨停，横店影视、湖北广电涨停。讨论里看多的理由是“技术降本跨过临界点”，腾讯首款AI游戏陪伴产品首测、AI长剧登上卫视黄金档被反复引用。\n但公告和券商口径冷静得多。文投控股自己披露AI漫剧收入占比约2.57%，前三季度营收1.80亿元、同比降29.51%；公司工作人员对21财经说“纯是击鼓传花”。华西证券测算，今年上半年抖音新增AI剧播放破亿率仅约0.48%，投流可能占全链路成本约70%，制作成本下降不等于利润率提升。散户热的是“故事”，券商冷的是“利润表”，这是今天最大的分歧。\n真实话题二：CPO是洗盘还是见顶。光模块是过去几个月散户最集中的持仓之一，上午天孚通信、源杰科技、新易盛集体跳水。论坛里一派认为思科上调指引、中际旭创获纳入MSCI中国指数（邮件转述）说明逻辑还在，跌下来是机会；另一派担心英伟达换帅后整条链的估值锚松动。我们的看法偏后者：需求没坏，但筹码太拥挤，抄底要等成交量明显萎缩。\n真实话题三：高低切换。银行创新高、猪肉白酒反弹，被不少帖子解读为“机构在防守”。这和券商口径一致，但散户往往在切换的第二三天才追进去，此时性价比已下降。\n被忽略的风险：一是亏钱效应在扩散，超2900只个股下跌，炸板和高位大面的个股增多，大东方收监管函后高位走弱是前车之鉴；二是缩量接力的特点是“涨得快、退得更快”，一旦龙头停牌或开板，后排跟风股往往连续补跌；三是监管态度与情绪存在分歧，市场在赌监管容忍度。\n二、海外：英伟达成了散户的“信仰测试”\nReuters报道，黄仁勋辞职当天，散户在开盘半小时内净买入约1.11亿美元英伟达，抄底力度创纪录，帮助股价从盘中最深约14%的跌幅收窄。Stocktwits新闻页显示，其平台对英伟达的散户情绪处于“极度看多”区间，一周消息量增长593%；一项投票中58%的受访者表示在抄底，42%选择回避。\nWSB的态度更分裂。据StonkHub统计，过去7天有859名WSB用户讨论英伟达，较前一周增加逾4倍；全Reddit范围内看多39.3%、看空38.0%，几乎打平。WSB最热的帖子是官方换帅公告本身，其次是一批调侃黄仁勋私生活的梗帖，可见“玩梗”和“抄底”并存。\n与华尔街的分歧很鲜明：Truist与Craig-Hallum分别把英伟达降至“持有”，目标价下调到174美元和180美元，理由是治理和调查风险“比估值更重要”。散户看到的是“便宜了”，机构看到的是“不确定性还没定价”。另一个热点是AMD与博通，Stocktwits上有交易者认为“英伟达的坏消息就是AMD的催化剂”。\n被忽略的风险：一是联邦调查与对华出口审查尚无结论，抄底者押的是“最坏已过去”；二是利率环境逆风，今晚PPI若超预期，高估值科技会被一起抛售；三是英伟达11月18日财报是换帅后首份，指引和管理层表态都可能引发新一轮波动。\n三、我们怎么看\n国内与海外散户今天的共同点，是都在用“抄底”和“接力”对抗利率与治理风险。我们的建议是：题材股不接最后一棒，科技龙头等事件落地，低位防守资产可作为仓位的压舱石。\n本文仅为舆情整理与研究观点，事实与推测已分开标注，不构成投资建议。市场有风险，投资需谨慎。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121111535460536800","l":[],"ln":[],"t":["A股港股","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":2495},{"id":"2121111132496880024","h":"cnfinancewatch","ts":1794547276,"zh":"热点财经新闻综述｜2026-11-13·午间\n数据时点：北京时间2026年11月13日约13:20采集，A股、港股数据截至午间收盘，外盘为亚洲时段报价。依据：11月13日早间（08:10）与午间（13:10）两封热点财经邮件，交叉新浪财经、凤凰网、中新经纬、21财经、Bloomberg、Reuters、盛宝等公开报道。凡标“邮件转述”的为未独立核实口径，不当定论。\n今日判断\n上午的盘面一句话：指数靠银行托住，资金在缩量里找短线。沪指半日涨0.22%报3663.71点，深成指跌0.56%，创业板指跌1.47%报2472.53点，科创50盘中一度涨超2%后冲高回落。两市半日成交约9794亿元，较上一交易日缩量约2421亿元，超2900只个股下跌。港股更弱，恒指午盘跌0.92%报23786点，恒生科技跌1.75%。\n外部环境没有变好也没有变坏：美10年期国债收益率在5.13%附近，布伦特原油守在每桶96美元下方，美元兑日元贴着160，美股期货基本走平。今晚21:30公布美国10月PPI，是全天最大的变量。我们的建议是午后不追涨，仓位维持中性偏低，把精力放在“业绩能落地的科技”和“防守型高股息”两头，题材股只做观察。\n三大利多方向（由强到弱）\n一、晶圆代工与半导体设备：业绩兑现，逻辑最硬。中芯国际三季度净利润约4.28亿美元，好于预期，营收同比增长约34%（盛宝援引）。午间邮件转述其业绩会信息：上游设备采购价提高、交付周期拉长，AI配套芯片代工价格维持上行。这意味着国产代工的议价权在提升，设备厂订单能见度跟着变好。制约在于港股中芯一度涨超7%后半日涨幅收窄到约0.5%，华虹半导体跌4.42%，说明资金认业绩，但不愿给高估值溢价。思路是设备与代工逢回踩分批，不追冲高。\n二、银行与高股息：指数的真正压舱石。江苏银行、南京银行、青岛银行、成都银行盘中创历史新高。背景是缩量环境下资金寻找确定性，加上邮件转述的外资重新定价中国资产、淡马锡称持续加码中国。对稳健型客户而言，这是当前回撤最小的方向；风险是若午后成长股反弹，银行可能出现获利了结，不宜在新高处重仓追入。\n三、生猪产能去化与消费修复：低位切换的备选。猪肉概念早盘异动，金新农、天邦食品涨停；邮件转述产能去化加速、猪周期反转预期升温。白酒板块反弹，古井贡酒领涨。这条线的意义在于高低切换时承接资金，但基本面拐点还要看后续生猪价格与存栏数据，属于左侧布局，宜小仓位。\n三大利空方向（由强到弱）\n一、美债收益率与加息预期：压在所有成长股头上的利率。周四美债遭遇2022年以来最大幅度的抛售之一，10年期重回5%上方，市场押注美联储12月加息。邮件转述克利夫兰联储哈马克支持渐进加息。今晚PPI若高于预期，高估值科技和黄金会再受压；若回落，则可能出现一轮修复。PPI之前不宜重仓高弹性品种。\n二、CPO与光模块高位回调：拥挤交易松动。天孚通信、源杰科技、新易盛等集体走弱，同花顺热股榜显示中际旭创、新易盛、东山精密跌幅都在7%以上（邮件转述，个股口径以收盘为准）。英伟达换帅后供应链估值重估，叠加前期涨幅过大，资金正在兑现。思科上调指引、AI收入料翻倍，说明需求没坏，问题出在筹码而不是基本面。短线回避，等缩量企稳后再看。\n三、题材炒作与监管降温：AI漫剧亏钱效应的隐患。文投控股本轮累计涨幅已逾一倍，公司公告AI漫剧收入仅占营收约2.57%，前三季度净亏损3755万元，工作人员对媒体直言“纯是击鼓传花”，并称后续可能停牌（21财经）。大东方收到上交所监管工作函后高位走弱，邮件转述当日跌8.36%。题材越热，监管和退潮风险越集中，追高者承担的是接力断裂的代价。\n多空如何制约\n利多集中在“有业绩的硬科技”和“有分红的防守资产”，利空集中在“利率”与“拥挤度”。短期内PPI决定方向，中期看英伟达11月18日财报（市场口径）能否稳住AI链。结构上我们倾向低吸代工设备与银行，回避高位CPO和纯题材。\n本文仅为信息整理与研究观点，事实与推测已分开标注，不构成投资建议。市场有风险，投资需谨慎。","en":"热点财经新闻综述｜2026-11-13·午间\n数据时点：北京时间2026年11月13日约13:20采集，A股、港股数据截至午间收盘，外盘为亚洲时段报价。依据：11月13日早间（08:10）与午间（13:10）两封热点财经邮件，交叉新浪财经、凤凰网、中新经纬、21财经、Bloomberg、Reuters、盛宝等公开报道。凡标“邮件转述”的为未独立核实口径，不当定论。\n今日判断\n上午的盘面一句话：指数靠银行托住，资金在缩量里找短线。沪指半日涨0.22%报3663.71点，深成指跌0.56%，创业板指跌1.47%报2472.53点，科创50盘中一度涨超2%后冲高回落。两市半日成交约9794亿元，较上一交易日缩量约2421亿元，超2900只个股下跌。港股更弱，恒指午盘跌0.92%报23786点，恒生科技跌1.75%。\n外部环境没有变好也没有变坏：美10年期国债收益率在5.13%附近，布伦特原油守在每桶96美元下方，美元兑日元贴着160，美股期货基本走平。今晚21:30公布美国10月PPI，是全天最大的变量。我们的建议是午后不追涨，仓位维持中性偏低，把精力放在“业绩能落地的科技”和“防守型高股息”两头，题材股只做观察。\n三大利多方向（由强到弱）\n一、晶圆代工与半导体设备：业绩兑现，逻辑最硬。中芯国际三季度净利润约4.28亿美元，好于预期，营收同比增长约34%（盛宝援引）。午间邮件转述其业绩会信息：上游设备采购价提高、交付周期拉长，AI配套芯片代工价格维持上行。这意味着国产代工的议价权在提升，设备厂订单能见度跟着变好。制约在于港股中芯一度涨超7%后半日涨幅收窄到约0.5%，华虹半导体跌4.42%，说明资金认业绩，但不愿给高估值溢价。思路是设备与代工逢回踩分批，不追冲高。\n二、银行与高股息：指数的真正压舱石。江苏银行、南京银行、青岛银行、成都银行盘中创历史新高。背景是缩量环境下资金寻找确定性，加上邮件转述的外资重新定价中国资产、淡马锡称持续加码中国。对稳健型客户而言，这是当前回撤最小的方向；风险是若午后成长股反弹，银行可能出现获利了结，不宜在新高处重仓追入。\n三、生猪产能去化与消费修复：低位切换的备选。猪肉概念早盘异动，金新农、天邦食品涨停；邮件转述产能去化加速、猪周期反转预期升温。白酒板块反弹，古井贡酒领涨。这条线的意义在于高低切换时承接资金，但基本面拐点还要看后续生猪价格与存栏数据，属于左侧布局，宜小仓位。\n三大利空方向（由强到弱）\n一、美债收益率与加息预期：压在所有成长股头上的利率。周四美债遭遇2022年以来最大幅度的抛售之一，10年期重回5%上方，市场押注美联储12月加息。邮件转述克利夫兰联储哈马克支持渐进加息。今晚PPI若高于预期，高估值科技和黄金会再受压；若回落，则可能出现一轮修复。PPI之前不宜重仓高弹性品种。\n二、CPO与光模块高位回调：拥挤交易松动。天孚通信、源杰科技、新易盛等集体走弱，同花顺热股榜显示中际旭创、新易盛、东山精密跌幅都在7%以上（邮件转述，个股口径以收盘为准）。英伟达换帅后供应链估值重估，叠加前期涨幅过大，资金正在兑现。思科上调指引、AI收入料翻倍，说明需求没坏，问题出在筹码而不是基本面。短线回避，等缩量企稳后再看。\n三、题材炒作与监管降温：AI漫剧亏钱效应的隐患。文投控股本轮累计涨幅已逾一倍，公司公告AI漫剧收入仅占营收约2.57%，前三季度净亏损3755万元，工作人员对媒体直言“纯是击鼓传花”，并称后续可能停牌（21财经）。大东方收到上交所监管工作函后高位走弱，邮件转述当日跌8.36%。题材越热，监管和退潮风险越集中，追高者承担的是接力断裂的代价。\n多空如何制约\n利多集中在“有业绩的硬科技”和“有分红的防守资产”，利空集中在“利率”与“拥挤度”。短期内PPI决定方向，中期看英伟达11月18日财报（市场口径）能否稳住AI链。结构上我们倾向低吸代工设备与银行，回避高位CPO和纯题材。\n本文仅为信息整理与研究观点，事实与推测 ese","ts":1794546001,"zh":"黄仁勋辞职前，特朗普曾敦促他为保住英伟达CEO职位而战。黄仁勋是总统在人工智能领域的重要顾问，此前特朗普至少两次被告知黄仁勋存在国安风险，仍邀其陪同访华。","en":"黄仁勋辞职前，特朗普曾敦促他为保住英伟达CEO职位而战。黄仁勋是总统在人工智能领域的重要顾问，此前特朗普至少两次被告知黄仁勋存在国安风险，仍邀其陪同访华。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2121105783152898330","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/usa/20261113/trump-jensen-huang-nvidia/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":23,"rt":2,"rp":16,"vw":11517},{"id":"2121104127992488359","h":"cnfinancewatch","ts":1794545606,"zh":"【11月13日A股午间观察】\n11月13日早盘，A股主要指数走势分化。上证指数半日上涨0.22%，深证成指下跌0.56%，创业板指跌幅1.47%；科创50盘中一度涨超2%，随后回落，午间收跌0.48%。\n两市半日成交额9794亿元，较前一日同期缩减2421亿元，下跌个股超过2900只，资金仍在存量格局中快速轮动。盘面上，昨日调整的机器人、AI应用出现修复，但未能形成统一进攻方向；AI漫剧逆势走强，算力芯片局部活跃，银行等高股息品种对指数形成支撑，CPO等高位科技方向则继续承压。\n#AI漫剧成为早盘最强线索。文投控股5天4板、金逸影视4天2板，华是科技、幸福蓝海20CM涨停，横店影视、湖北广电封板。催化因素来自11月12日火山引擎Seedance 2.5 flash：生成速度较Seedance 2.5提升一倍，720P文生/图生视频价格降至约0.99元/秒，降幅约34%，单段最长支持30秒，AI影视制作成本进一步下探。供给和用户端同步扩张：网络材料称，广电总局数据显示前10个月微短剧上线近55万部，为2025年全年的近17倍，AI剧占比超过94%；QuestMobile显示，9月红果免费短剧去重用户4.3亿，超过豆包的4.19亿，短剧用户突破4亿用时不足3年；机构测算2026年国内AI剧、漫剧市场约400亿元，用户有望突破6亿。\n#算力芯片局部活跃，但高位品种分歧加大。天普股份4连板，华东重机涨停，旋极信息20CM涨停；燧原科技、摩尔线程冲高回落，CPO板块集体调整，天孚通信、源杰科技、新易盛走弱。分化背后既有海外需求验证，也有获利了结：CoreWeave三季报营收36.6亿美元、同比增长168%，在手订单1325亿美元，较6月末再增约285亿美元，排期至2027年；平头哥赴港上市推进，截至2026年4月真武系列AI芯片累计出货56万片、服务超650家客户；三季度全球半导体销售额5177亿美元、环比增24.1%，DRAM收入同比增369%。机器人板块昨日调整后今日普遍止跌，但未形成集体反弹，资金从纯题材情绪转向业绩确定性环节，后续仍需观察产业链量产订单兑现进度。\n#银行股批量创新高，成为指数核心支撑。江苏银行、南京银行双双创历史新高。业绩与股息形成双重支撑：42家上市银行前三季度合计营收4.66万亿元、同比增7.81%，归母净利润1.75万亿元、同比增3.78%，净利增速较半年度提升0.8个百分点，34只银行股净利正增长。低利率环境下股息吸引力凸显：最新TTM股息率显示，42家银行中7家超过5%，成都银行6.94%居首，北京银行、上海银行分别为6.79%、6.22%，站上4%的多达22家。叠加年末调仓、险资托底与全面破净，银行股正从防御资产向高确定性权益资产重估。\n#支线方面，#猪肉板块异动，金新农、天邦食品涨停。核心催化是去化强化：三季度末全国能繁母猪存栏降至3602万头、同比降10.7%，为本轮首次跌破3750万头正常保有量；立冬后北方灌肠、南方腌腊启动，屠宰开工率回升至33.04%，猪价低位企稳。机构对去化和底部临近渐成共识，但反转时点仍有分歧，多认为拐点在2027年二季度前后。白酒板块仍在磨底：双十一电商成交高增，京东酒类整体增25%，茅台、五粮液等头部品牌双位数增长，但本质是平台补贴与渠道回笼现金的“库存泄压”，并非需求复苏。三季报显示，#19家A股白酒上市公司前三季度合计营收同比降7.39%、归母净利同比降超8%，千元价格带倒挂延续，当前仅是库存底、价盘底，而非需求底、盈利底。\n整体看，市场仍处存量博弈，风格向低波红利倾斜，科技主线在高位分歧中等待新催化。操作上避免追高，等待轮动低吸。\n以上根据网络材料整理改写，数据未经独立核实，不构成任何投资建议。","en":"【11月13日A股午间观察】\n11月13日早盘，A股主要指数走势分化。上证指数半日上涨0.22%，深证成指下跌0.56%，创业板指跌幅1.47%；科创50盘中一度涨超2%，随后回落，午间收跌0.48%。\n两市半日成交额9794亿元，较前一日同期缩减2421亿元，下跌个股超过2900只，资金仍在存量格局中快速轮动。盘面上，昨日调整的机器人、AI应用出现修复，但未能形成统一进攻方向；AI漫剧逆势走强，算力芯片局部活跃，银行等高股息品种对指数形成支撑，CPO等高位科技方向则继续承压。\n#AI漫剧成为早盘最强线索。文投控股5天4板、金逸影视4天2板，华是科技、幸福蓝海20CM涨停，横店影视、湖北广电封板。催化因素来自11月12日火山引擎Seedance 2.5 flash：生成速度较Seedance 2.5提升一倍，720P文生/图生视频价格降至约0.99元/秒，降幅约34%，单段最长支持30秒，AI影视制作成本进一步下探。供给和用户端同步扩张：网络材料称，广电总局数据显示前10个月微短剧上线近55万部，为2025年全年的近17倍，AI剧占比超过94%；QuestMobile显示，9月红果免费短剧去重用户4.3亿，超过豆包的4.19亿，短剧用户突破4亿用时不足3年；机构测算2026年国内AI剧、漫剧市场约400亿元，用户有望突破6亿。\n#算力芯片局部活跃，但高位品种分歧加大。天普股份4连板，华东重机涨停，旋极信息20CM涨停；燧原科技、摩尔线程冲高回落，CPO板块集体调整，天孚通信、源杰科技、新易盛走弱。分化背后既有海外需求验证，也有获利了结：CoreWeave三季报营收36.6亿美元、同比增长168%，在手订单1325亿美元，较6月末再增约285亿美元，排期至2027年；平头哥赴港上市推进，截至2026年4月真武系列AI芯片累计出货56万片、服务超650家客户；三季度全球半导体销售额5177亿美元、环比增24.1%，DRAM收入同比增369%。机器人板块昨日调整后今日普遍止跌，但未形成集体反弹，资金从纯题材情绪转向业绩确定性环节，后续仍需观察产业链量产订单兑现进度。\n#银行股批量创新高，成为指数核心支撑。江苏银行、南京银行双双创历史新高。业绩与股息形成双重支撑：42家上市银行前三季度合计营收4.66万亿元、同比增7.81%，归母净利润1.75万亿元、同比增3.78%，净利增速较半年度提升0.8个百分点，34只银行股净利正增长。低利率环境下股息吸引力凸显：最新TTM股息率显示，42家银行中7家超过5%，成都银行6.94%居首，北京银行、上海银行分别为6.79%、6.22%，站上4%的多达22家。叠加年末调仓、险资托底与全面破净，银行股正从防御资产向高确定性权益资产重估。\n#支线方面，#猪肉板块异动，金新农、天邦食品涨停。核心催化是去化强化：三季度末全国能繁母猪存栏降至3602万头、同比降10.7%，为本轮首次跌破3750万头正常保有量；立冬后北方灌肠、南方腌腊启动，屠宰开工率回升至33.04%，猪价低位企稳。机构对去化和底部临近渐成共识，但反转时点仍有分歧，多认为拐点在2027年二季度前后。白酒板块仍在磨底：双十一电商成交高增，京东酒类整体增25%，茅台、五粮液等头部品牌双位数增长，但本质是平台补贴与渠道回笼现金的“库存泄压”，并非需求复苏。三季报显示，#19家A股白酒上市公司前三季度合计营收同比降7.39%、归母净利同比降超8%，千元价格带倒挂延续，当前仅是库存底、价盘底，而非需求底、盈利底。\n整体看，市场仍处存量博弈，风格向低波红利倾斜，科技主线在高位分歧中等待新催化。操作上避免追高，等待轮动低吸。\n以上根据网络材料整理改写，数据未经独立核实，不构成任何投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121104127992488359","l":[],"ln":[],"t":["A股港股","AI科技","财报"],"lk":0,"rt":0,"rp":6,"vw":4859},{"id":"2121100866908291287","h":"dmjk001","ts":1794544829,"zh":null,"en":"","zh_src":"","lang":" :"nytchinese","ts":1794538803,"zh":"关于英伟达临时CEO克雷斯，我们知道些什么？雷斯于2013年加入英伟达，任公司首席财务官。她在华尔街有广泛人脉，但她缺乏黄仁勋与供应链和华盛顿方面建立的关系。黄仁勋管理英伟达的方式可能会使克雷斯的过渡变得复杂。","en":"关于英伟达临时CEO克雷斯，我们知道些什么？雷斯于2013年加入英伟达，任公司首席财务官。她在华尔街有广泛人脉，但她缺乏黄仁勋与供应链和华盛顿方面建立的关系。黄仁勋管理英伟达的方式可能会使克雷斯的过渡变得复杂。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2121075592737022068","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/technology/20261113/nvidia-colette-kress-jensen-huang/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":10,"rt":2,"rp":12,"vw":12266},{"id":"2121074184940044331","h":"fxtrader","ts":1794538467,"zh":"黄仁勋离开英伟达一事，还可能牵连特朗普政府，包括商务部长卢特尼克。在美国政府对华芯片销售的监管问题上，卢特尼克正面临越来越多的质疑，尤其是他和黄仁勋不顾两党资深对华鹰派的审视，力主放宽销售。","en":"黄仁勋离开英伟达一事，还可能牵连特朗普政府，包括商务部长卢特尼克。在美国政府对华芯片销售的监管问题上，卢特尼克正面临越来越多的质疑，尤其是他和黄仁勋不顾两党资深对华鹰派的审视，力主放宽销售。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2121074184940044331","l":[],"ln":[],"t":["AI科技"],"lk":27,"rt":0,"rp":7,"vw":15005},{"id":"2121071219164242094","h":"bbcchinese","ts":1794537760,"zh":"从失禁到长期疼痛，数以百万计的女性在分娩数十年后仍然饱受后遗症困扰。","en":"从失禁到长期疼痛，数以百万计的女性在分娩数十年后仍然饱受后遗症困扰。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2121071219164242094","l":["bbc.in"],"ln":[{"u":"https://bbc.in/48PmSuR","d":"bbc.in"}],"t":[],"lk":16,"rt":0,"rp":6,"vw":14374},{"id":"2121070861797171632","h":"cnfinancewatch","ts":1794537675,"zh":"这个栏目不错\n原始信息第二次提炼了","en":"这个栏目不错\n原始信息第二次提炼了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121070861797171632","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":4569},{"id":"2121069849359372574","h":"cnfinancewatch","ts":1794537434,"zh":"散户热议｜2026-11-13·早间\n数据时点：国内部分为2026年11月13日约07:32（北京时间）抓取的韭研公社首页公开帖子，内容以11月12日盘后为主；海外部分为11月12日美股交易时段的公开报道。Reddit\nWallStreetBets与Stocktwits本期未直接抓取，相关数据来自路透社和Stocktwits自家新闻稿，属于二手转述，下文均已标注。所有情绪描述只代表这些公开样本，不代表全体投资者。\n国内：情绪退潮，抱团往低位和防御躲\n韭研公社周四晚间的复盘帖给出的盘面口径是：剔除ST和未开板新股，涨停37家、跌停5家、连板11家，破板率48.61%，涨停数明显少于前一日，作者直接写“情绪转弱”。这和公开收评一致，全市场超4600只个股下跌。\n真实话题集中在四处。\n一是国产算力。热度较高的一篇帖子标题是“海外算力封堵，国产算力必须顶上”，把甲骨文终止腾讯海外算力租赁合约（帖子转述，我们未核实）、英伟达管理层变动、美国拟管制远程算力调用串成一条线，结论是寒武纪、燧原科技等将成为下一阶段主线。另有帖子炒作昇腾整机“配额制”，用互动易上的股权穿透（约12%间接权益）把一家传动件公司拉进昇腾概念。\n二是“东方系”和低位小票接力。东方海洋17天9板、大东方8天6板被反复提到，燃气板块的东方环宇连板后，已有帖子在找“补涨套利股”。\n三是大消费和防御。多篇帖子讨论零售、冰雪、水产、食品饮料逆势走强，也有作者从估值分位论证医药“长坡厚雪”回来了。\n四是情绪抱怨。有人在晚间资讯帖里指责盘中“小作文”扰动市场，可见题材资金对负面消息高度敏感。\n与券商口径的异同。相同点是双方都认可国产算力受益于外部封堵，也都看到资金向防御板块迁移。不同点在节奏：券商更多强调代工、设备材料这类有业绩验证的环节，提示港股不宜追高贝塔；社区则更爱涨幅最大的芯片设计和连板小票，倾向把政策和股权关系直接翻译成“必涨逻辑”。\n被忽略的风险。其一，高低切换并不等于安全，大东方在连板过程中已收到上交所监管工作函（晚间邮件转述），监管对高标的压制往往在次日开板后体现为补跌。其二，“补涨套利”思路在炸板率接近五成的环境里亏钱效应最大，龙头一旦断板，跟风股最先被抛。其三，股权穿透式的概念链条兑现到利润的路径很长，属于情绪定价。其四，国产算力龙头短期涨幅已大，若下周英伟达财报或出口管制落地不如预期激烈，存在预期差回撤。\n海外：散户抄底英伟达，但并非一边倒\n路透社报道，Vanda Research估算周四开盘后半小时散户净买入英伟达约1.11亿美元，是其有记录以来最大的开盘半小时散户流入。富达平台截至美东时间中午，英伟达买单约39.5万笔，卖单约8万笔，买单数量超过平台其他九只最热门股票之和，排第二的是AMD。\n但在Reddit的WallStreetBets，路透统计关于英伟达的评论约六成偏负面（二手数据，我们未直接抓取原帖）。Stocktwits方面，其新闻稿称英伟达散户情绪处于“极度看多”区间，7天讨论量增长741%，一项约1.7万人参与的投票中57%表示会在黄仁勋离任后抄底（同为平台自家数据）。\n与专业机构的分歧很明显。Baird本周把英伟达下调至中性、目标价下调六成至200美元，理由是2027年数据中心预测可见度下降；郭明錤则认为辞职是“一次性出清事件”。散户买的是“历史上每次抄底都赢”的经验，机构担心的是明年资本开支增速放缓。\n被忽略的风险有三：下周二财报电话会是临时CEO首次面对市场，管理层难以给出完整的长期规划；10年期美债收益率已在5.1%上方，估值锚在上移；Anthropic据报下周上市，可能分流AI板块资金。另外Nebius单日跌近17%、超微电脑跌逾11%，说明AI基建链里并非所有“错杀”都值得接。\n总结：国内外散户都在“抄底”，但国内抄的是替代逻辑和低位题材，海外抄的是龙头本身。两边共同的盲点是利率，这一点比任何CEO变动都更持久。\n来源：韭研公社公开帖子、路透社、TradingView转载的Stocktwits新闻、新华财经、11月12日晚间热点财经邮件（转述已标注）。未捏造引语，统计均来自所列来源。以上内容不构成投资建议。","en":"散户热议｜2026-11-13·早间\n数据时点：国内部分为2026年11月13日约07:32（北京时间）抓取的韭研公社首页公开帖子，内容以11月12日盘后为主；海外部分为11月12日美股交易时段的公开报道。Reddit\nWallStreetBets与Stocktwits本期未直接抓取，相关数据来自路透社和Stocktwits自家新闻稿，属于二手转述，下文均已标注。所有情绪描述只代表这些公开样本，不代表全体投资者。\n国内：情绪退潮，抱团往低位和防御躲\n韭研公社周四晚间的复盘帖给出的盘面口径是：剔除ST和未开板新股，涨停37家、跌停5家、连板11家，破板率48.61%，涨停数明显少于前一日，作者直接写“情绪转弱”。这和公开收评一致，全市场超4600只个股下跌。\n真实话题集中在四处。\n一是国产算力。热度较高的一篇帖子标题是“海外算力封堵，国产算力必须顶上”，把甲骨文终止腾讯海外算力租赁合约（帖子转述，我们未核实）、英伟达管理层变动、美国拟管制远程算力调用串成一条线，结论是寒武纪、燧原科技等将成为下一阶段主线。另有帖子炒作昇腾整机“配额制”，用互动易上的股权穿透（约12%间接权益）把一家传动件公司拉进昇腾概念。\n二是“东方系”和低位小票接力。东方海洋17天9板、大东方8天6板被反复提到，燃气板块的东方环宇连板后，已有帖子在找“补涨套利股”。\n三是大消费和防御。多篇帖子讨论零售、冰雪、水产、食品饮料逆势走强，也有作者从估值分位论证医药“长坡厚雪”回来了。\n四是情绪抱怨。有人在晚间资讯帖里指责盘中“小作文”扰动市场，可见题材资金对负面消息高度敏感。\n与券商口径的异同。相同点是双方都认可国产算力受益于外部封堵，也都看到资金向防御板块迁移。不同点在节奏：券商更多强调代工、设备材料这类有业绩验证的环节，提示港股不宜追高贝塔；社区则更爱涨幅最大的芯片设计和连板小票，倾向把政策和股权关系直接翻译成“必涨逻辑”。\n被忽略的风险。其一，高低切换并不等于安全，大东方在连板过程中已收到上交所监管工作函（晚间邮件转述），监管对高标的压制往往在次日开板后体现为补跌。其二，“补涨套利”思路在炸板率接近五成的环境里亏钱效应最大，龙头一旦断板，跟风股最先被抛。其三，股权穿透式的概念链条兑现到利润的路径很长，属于情绪定价。其四，国产算力龙头短期涨幅已大，若下周英伟达财报或出口管制落地不如预期激烈，存在预期差回撤。\n海外：散户抄底英伟达，但并非一边倒\n路透社报道，Vanda Research估算周四开盘后半小时散户净买入英伟达约1.11亿美元，是其有记录以来最大的开盘半小时散户流入。富达平台截至美东时间中午，英伟达买单约39.5万笔，卖单约8万笔，买单数量超过平台其他九只最热门股票之和，排第二的是AMD。\n但在Reddit的WallStreetBets，路透统计关于英伟达的评论约六成偏负面（二手数据，我们未直接抓取原帖）。Stocktwits方面，其新闻稿称英伟达散户情绪处于“极度看多”区间，7天讨论量增长741%，一项约1.7万人参与的投票中57%表示会在黄仁勋离任后抄底（同为平台自家数据）。\n与专业机构的分歧很明显。Baird本周把英伟达下调至中性、目标价下调六成至200美元，理由是2027年数据中心预测可见度下降；郭明錤则认为辞职是“一次性出清事件”。散户买的是“历史上每次抄底都赢”的经验，机构担心的是明年资本开支增速放缓。\n被忽略的风险有三：下周二财报电话会是临时CEO首次面对市场，管理层难以给出完整的长期规划；10年期美债收益率已在5.1%上方，估值锚在上移；Anthropic据报下周上市，可能分流AI板块资金。另外Nebius单日跌近17%、超微电脑跌逾11%，说明AI基建链里并非所有“错杀”都值得接。\n总结：国内外散户都在“抄底”，但国内抄的是替代逻辑和低位题材，海外抄的是龙头本身。两边共同的盲点是利率，这一点比任何CEO变动都更持久。\n来源：韭研公社公开帖子、路透社、TradingView转载的Stocktwits新闻、新华财经、11月12日晚间热点财经邮件（转述已标注）。未捏造引语，统计均来自所列来源。以上内容不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121069849359372574","l":[],"ln":[],"t":["美股","A股港股","AI科技","财报","关税贸易"],"lk":1,"rt":0,"rp":0,"vw":2237},{"id":"2121069844917539145","h":"cnfinancewatch","ts":1794537433,"zh":"热点财经新闻综述｜2026-11-13·早间\n数据时点：截至2026年11月13日07:35（北京时间）。素材来自11月12日20:11的晚间热点财经邮件（本期截稿前邮箱尚未收到11月13日早间版），关键数字已用新华财经、路透、东方财富、澎湃、智通财经等公开报道交叉核对。文中凡写“邮件转述”的，是未逐条核实的口径，请勿当作定论。\n今日判断\n一句话：靴子落地，但利率没放过市场。英伟达周四宣布黄仁勋辞去CEO、总裁及董事职务，CFO克雷斯任临时CEO。股价盘中一度跌约14%，收盘跌4.34%报166.19美元，跌幅大幅收窄；AMD涨5.86%、博通涨5.54%，资金在AI内部换车而非离场。真正的压力来自另一头：特朗普称不需要与伊朗达成协议，WTI原油涨2.94%至89.07美元，10年期美债收益率升至5.105%，美元指数到103.18的19个月高位，期货定价12月加息约29个基点。三大指数各跌0.35%至0.39%，中概金龙指数跌3.09%，阿里巴巴美股跌逾7%。\nA股周四冲高回落，沪指收3655.83点跌0.67%，创业板指收2509.43点跌2.44%，成交约1.93万亿元，超4600只个股下跌，只有科创50涨0.73%。恒指收24008.55点跌1.26%，恒生科技跌2.36%。我们对今天的看法是指数偏弱震荡，结构上国产算力和晶圆代工相对占优，英伟达链和中概互联网继续承压，仓位宜控在中性偏低，不追高位题材。\n三大利多方向（由强到弱）\n第一，国产晶圆代工与算力芯片。这是昨晚最扎实的增量。中芯国际三季度收入31.9亿美元，环比增6.1%，毛利率29.9%，环比提升4.6个百分点，两项都超过此前指引；产能利用率97.3%，接近满产；四季度收入指引环比增4%至6%。叠加外媒报道美国商务部拟把远程调用先进芯片也纳入管制（尚未公布），国产替代的逻辑在加强。周四寒武纪涨超8%，燧原科技涨超13%创上市新高。制约在于：中芯四季度毛利率指引26%至28%，低于三季度实际值；燧原等短期涨幅已大，邮件转述其7天涨约73%，追高的性价比在下降。更稳的做法是关注代工、设备与材料，而不是只盯涨幅最大的芯片设计。\n第二，英伟达之外的AI算力“替代链”。AMD、博通、Arista等周四逆势大涨，郭明錤认为谷歌TPU及其伙伴博通、联发科是近期受益方，并称此事对英伟达产品竞争力的影响最快2028年才显现。对A股的意味是：ASIC、交换机、高速连接等非英伟达单一依赖的环节，估值受冲击小于光模块龙头。制约是美光、闪迪、应用材料周四同样下跌，存储与设备并未全面受益；邮件转述的“美光明年HBM大部分售罄”我们未独立核实。\n第三，防御型内需与增量资金。周四尾盘资金流向银行、机场、公路等红利板块，白酒、零售、水产等逆势走强；邮件转述双11名酒成交同比增约25%，21只基金同日成立、年内新发规模近万亿元；港媒报道港股南向资金周四净流入58.47亿港元。这对低估值高股息与消费龙头形成托底。制约是这类轮动本质是避险，持续性要靠批价、库存和社零数据验证。\n三大利空方向（由强到弱）\n第一，美国利率与美元。10年期美债重回5.1%上方，2年期升至4.867%，美元强、日元一度触及160后急速回弹，市场猜测日本已出手。高利率直接压成长股估值，并对港股与新兴市场资金形成抽离。华泰证券提示港股盈利预期仍在下修，12月还有解禁高峰，不建议追高贝塔品种。\n第二，英伟达链与中概AI平台。光模块、PCB龙头周四午后跳水，邮件转述中际旭创盘中由涨4.7%翻至跌6.1%（精确数字未核）。CoreWeave跌6.86%，Nebius因下调年度营收预期跌16.84%，说明市场开始给AI基建的融资压力定价。阿里巴巴港股跌6.76%、连跌五日。下周二英伟达财报电话会是新管理层首秀，Anthropic据报下周IPO，均可能放大波动。\n第三，油价反弹与题材退潮。国内成品油价格已于12日24时下调，但国际油价随中东表态再度走高，通胀与下一调价窗口方向都偏不利。题材端，周四涨停仅37家，炸板率接近五成，AI漫剧上海电影跌停，大东方被上交所下发监管工作函（邮件转述）。金价跌约3%至3880美元附近，黄金股已连续走弱。\n操作上，优先低位、有业绩验证的国产算力与代工环节，回避高位连板、监管关注股和英伟达单一依赖的高位品种。\n来源：新华财经、路透、东方财富、澎湃新闻、智通财经、星岛日报、TradingView/Stocktwits新闻、11月12日晚间热点财经邮件（转述部分已标注）。以上为研究观点，不构成投资建议。","en":"热点财经新闻综述｜2026-11-13·早间\n数据时点：截至2026年11月13日07:35（北京时间）。素材来自11月12日20:11的晚间热点财经邮件（本期截稿前邮箱尚未收到11月13日早间版），关键数字已用新华财经、路透、东方财富、澎湃、智通财经等公开报道交叉核对。文中凡写“邮件转述”的，是未逐条核实的口径，请勿当作定论。\n今日判断\n一句话：靴子落地，但利率没放过市场。英伟达周四宣布黄仁勋辞去CEO、总裁及董事职务，CFO克雷斯任临时CEO。股价盘中一度跌约14%，收盘跌4.34%报166.19美元，跌幅大幅收窄；AMD涨5.86%、博通涨5.54%，资金在AI内部换车而非离场。真正的压力来自另一头：特朗普称不需要与伊朗达成协议，WTI原油涨2.94%至89.07美元，10年期美债收益率升至5.105%，美元指数到103.18的19个月高位，期货定价12月加息约29个基点。三大指数各跌0.35%至0.39%，中概金龙指数跌3.09%，阿里巴巴美股跌逾7%。\nA股周四冲高回落，沪指收3655.83点跌0.67%，创业板指收2509.43点跌2.44%，成交约1.93万亿元，超4600只个股下跌，只有科创50涨0.73%。恒指收24008.55点跌1.26%，恒生科技跌2.36%。我们对今天的看法是指数偏弱震荡，结构上国产算力和晶圆代工相对占优，英伟达链和中概互联网继续承压，仓位宜控在中性偏低， .com/business/us-senate-banking-committee-chair-calls-jensen-huang-lutnick-testify-2026-11-13/?taid=6af676408a00c90001225f98&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["AI科技"],"lk":3,"rt":1,"rp":0,"vw":1580},{"id":"2121067745093787727","h":"dmjk001","ts":1794536932,"zh":"The Information：英伟达临时 CEO 科莱特·克雷斯试图遏制英伟达风险最高的押注\n克雷斯可能会采取比黄仁勋更为保守的做法。据知情人士透露，作为财务负责人，她有时会对黄仁勋力推的交易提出反对——包括一项拟议中的英伟达代表 OpenAI 提供 2500 亿美元信用支持兜底的方案\n克雷斯优先考虑设法确保英伟达的财务风险不会过度集中于少数几家公司。","en":"The Information：英伟达临时 CEO 科莱特·克雷斯试图遏制英伟达风险最高的押注\n克雷斯可能会采取比黄仁勋更为保守的做法。据知情人士透露，作为财务负责人，她有时会对黄仁勋力推的交易提出反对——包括一项拟议中的英伟达代表 OpenAI 提供 2500 亿美元信用支持兜底的方案\n克雷斯优先考虑设法确保英伟达的财务风险不会过度集中于少数几家公司。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HW-Lm7TaIAAxl1L.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2121067745093787727","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":1,"rp":0,"vw":5678},{"id":"2121067231329341898","h":"fxtrader","ts":1794536810,"zh":"彭博社揭露黄仁勋在英伟达迅速下台的经过，形容过程是“好莱坞式”的坠落，强势形象尽失，开始说出自暴自弃的话语。\n起初黄仁勋持续否认出轨指控，但在总法律顾问当面质询后承认与黄乐Alice Huang的关系，随后注意力被分散，工作放慢。\n在纽约时报报道第二段婚外情后，英伟达董事会快速行动，会议持续到深夜，黄仁勋最终无条件辞职。\n近期与黄仁勋交谈的人透露，他目前更多的是自责，承认自己是混蛋（“piece of sh--”），表示自己已不太在意个人后果，主要担心妻子，以及“不要毁掉”被公开与他有关的多名女性的生活。","en":"彭博社揭露黄仁勋在英伟达迅速下台的经过，形容过程是“好莱坞式”的坠落，强势形象尽失，开始说出自暴自弃的话语。\n起初黄仁勋持续否认出轨指控，但在总法律顾问当面质询后承认与黄乐Alice Huang的关系，随后注意力被分散，工作放慢。\n在纽约时报报道第二段婚外情后，英伟达董事会快速行动，会议持续到深夜，黄仁勋最终无条件辞职。\n近期与黄仁勋交谈的人透露，他目前更多的是自责，承认自己是混蛋（“piece of sh--”），表示自己已不太在意个人后果，主要担心妻子，以及“不要毁掉”被公开与他有关的多名女性的生活。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HW-KUukaMAARW1s.jpg?name=orig","https://pbs.twimg.com/media/HW-KXRJbEAANFxO.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2121067231329341898","l":[],"ln":[],"t":["AI科技"],"lk":430,"rt":29,"rp":55,"vw":130212},{"id":"2121062891520479550","h":"nytchinese","ts":1794535775,"zh":"黄仁勋下台会成为人工智能泡沫破裂的开端吗？黄仁勋不再掌舵后，英伟达所扮演的角色可能发生变化。英伟达不仅是占据主导地位的芯片制造商，它还为整个行业的发展提供融资支持；黄仁勋则是英伟达的中心。他的离职给本已处于敏感时期的人工智能产业带来了新的不确定性。","en":"黄仁勋下台会成为人工智能泡沫破裂的开端吗？黄仁勋不再掌舵后，英伟达所扮演的角色可能发生变化。英伟达不仅是占据主导地位的芯片制造商，它还为整个行业的发展提供融资支持；黄仁勋则是英伟达的中心。他的离职给本已处于敏感时期的人工智能产业带来了新的不确定性。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2121062891520479550","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/business/20261113/jensen-huang-economy-nvidia-ai/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":30,"rt":3,"rp":20,"vw":14220},{"id":"2121059748804223008","h":"nytchinese","ts":1794535026,"zh":"新加坡政府表示，由于黄乐在该国注册的公司涉嫌“虚假申报”问题，该国自去年6月至今年2月扣留了她的护照。在此期间，新加坡曾向美国寻求协助，但美国几乎未予理会。","en":"新加坡政府表示，由于黄乐在该国注册的公司涉嫌“虚假申报”问题，该国自去年6月至今年2月扣留了她的护照。在此期间，新加坡曾向美国寻求协助，但美国几乎未予理会。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2121059748804223008","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/world/20261113/nvidia-megaspeed-alice-huang/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":238,"rt":44,"rp":52,"vw":45284},{"id":"2121058472972148795","h":"nytchinese","ts":1794534721,"zh":"中国间谍机构如何利用“美人计”套取情报：黄仁勋事件引发人们对中国情报部门如何利用亲密关系从事间谍活动的关注。情报专家表示，在间谍活动中利用美色并不新鲜，中国的独特之处在于其投入的时间。","en":"中国间谍机构如何利用“美人计”套取情报：黄仁勋事件引发人们对中国情报部门如何利用亲密关系从事间谍活动的关注。情报专家表示，在间谍活动中利用美色并不新鲜，中国的独特之处在于其投入的时间。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2121058472972148795","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/china/20261113/china-spy-espionage-romance/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":105,"rt":16,"rp":144,"vw":35151},{"id":"2121052299426771092","h":"fxtrader","ts":1794533250,"zh":"#观察 X终于突破了单条推文4张图片/视频的限制，现在可以一次发20张图。\nPeter Sellis @petersellis 上任后，平台出现了不少积极的变化，评论区的诈骗广告也比以前少了。","en":"#观察 X终于突破了单条推文4张图片/视频的限制，现在可以一次发20张图。\nPeter Sellis @petersellis 上任后，平台出现了不少积极的变化，评论区的诈骗广告也比以前少了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2121052299426771092","l":[],"ln":[],"t":[],"lk":26,"rt":0,"rp":4,"vw":11302 const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
