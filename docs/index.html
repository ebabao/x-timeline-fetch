<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

提供融资，换取长期客户和收入分成）。对此，克雷斯还是发挥出重要作用，质疑如何筛选交易、估值担保和计算回报，并试图约束Caprez的行为，但公司仍继续推进。此后英伟达即面临主要云厂商减少依赖、而大量晶圆和内存采购承诺可能堆积的双重压力。\n在黄仁勋对公司股价不满以及“循环融资”质疑之际，还是听从建议选择了收紧水龙头，不再无限供应并为客户提供融资背书。\n报道还提供了上个月柏林会议的一个小故事。黄仁勋在闭门圆桌会上，用一个日本汤面稀缺的故事，“教育”了云计算公司的CEO们。","en":"美媒在另一篇报道中刻画了黄仁勋对英伟达CFO克雷斯的内部紧张氛围。华尔街日报援引消息称，黄仁勋今夏在财务高管会议上猛烈批评克雷斯，称她是“被车灯照到的鹿”（手足无措），并说她只是“汇报型CFO”，不是能帮他定战略、做决策的人。\n英伟达在向买不起芯片的客户提供巨额担保，其中包括黄仁勋女婿Nico Caprez主导的交易（向新兴云商和数据中心商提供融资，换取长期客户和收入分成）。对此，克雷斯还是发挥出重要作用，质疑如何筛选交易、估值担保和计算回报，并试图约束Caprez的行为，但公司仍继续推进。此后英伟达即面临主要云厂商减少依赖、而大量晶圆和内存采购承诺可能堆积的双重压力。\n在黄仁勋对公司股价不满以及“循环融资”质疑之际，还是听从建议选择了收紧水龙头，不再无限供应并为客户提供融资背书。\n报道还提供了上个月柏林会议的一个小故事。黄仁勋在闭门圆桌会上，用一个日本汤面稀缺的故事，“教育”了云计算公司的CEO们。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HW_DUJlbYAAYINB.png?name=orig","https://pbs.twimg.com/media/HW_EFALaQAAqQsJ.png?name=orig"],"u":"https://x.com/fxtrader/status/2121133418188788176","l":[],"ln":[],"t":["AI科技"],"lk":7,"rt":1,"rp":4,"vw":4581},{"id":"2121132221138415886","h":"business","ts":1794552304,"zh":"亿万富翁投资者、英伟达股东 Leo KoGuan 周五表达了对黄仁勋的支持，并表示他不会增持这家由其他人掌舵的科技公司的股份","en":"Billionaire investor and Nvidia shareholder Leo KoGuan expressed support for Jensen Huang on Friday and said he won’t increase his stake in the tech company with someone else at the helm","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2121132221138415886","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-13/billionaire-koguan-vows-not-to-buy-nvidia-stock-as-huang-quits?taid=6af6b1f0c6e5210001cd4e9f&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":26,"rt":9,"rp":9,"vw":14378},{"id":"2121131679989600721","h":"cnfinancewatch","ts":1794552175,"zh":"#三个方向\n一是影视院线与AI短剧。消息、涨停数量、主力净流入三方互证，是今天唯一有进攻性的方向。\n二是生猪养殖。产能去化加上养殖股三季报回暖，资金在低位承接。\n三是银行与红利。保险重仓、证金持股、中特估概念主力净流入都在 15 亿上下，是避险资金的落脚点。\n半导体设备单列观察：跌幅不小但主力在进，等科技情绪止跌再说。\n#六只个股\n #中国电影 $600977 涨停，成交 18.65 亿，院线龙头里流动性最好。\n #儒意电影 $002739 涨停，成交 14.56 亿，短剧与内容双线。\n #牧原股份 $002714 涨 2.73%，猪周期反转逻辑的核心标的。\n #温氏股份 $300498 涨 2.18%，同方向第二选择。\n #工商银行 $601398 涨 1.61%，红利防守首选。\n #北方华创 $002371 跌 0.96%，明显强于板块，设备涨价逻辑的观察仓。\n#小盘阿尔法\n本档不选。影视里的小票已经涨停，追高性价比低；今天缺少能完整核验20日K线与最新财报的小市值标的，宁缺不凑。\n#中美映射\n中美行业ETF的20日与5日双窗口数据本档缺失。能确认的是映射方向一致：美股AI硬件受英伟达管理层风波拖累，A股光模块与PCB同步被兑现。\n#期货\nIM主力约 6285.8，较昨结算跌约 3.3%，相对中证1000贴水约 67 点；IC跌约 2.7%；IF跌约\n1%；IH基本持平。小盘期指跌幅大于现货，空头情绪重。标普期货跌约 0.16%。\n#尾盘观察\n看三件事：光模块龙头能否在尾盘缩量止跌；影视涨停板封单是否稳定；IM贴水是否收窄。三件事都不好，明天先防守。\n#操作提示\n今天不抄科技的底。已有光模块和PCB仓位的，反抽减仓优于割在最低点。新开仓只考虑影视龙头的回踩和银行红利，单票仓位压低。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#三个方向\n一是影视院线与AI短剧。消息、涨停数量、主力净流入三方互证，是今天唯一有进攻性的方向。\n二是生猪养殖。产能去化加上养殖股三季报回暖，资金在低位承接。\n三是银行与红利。保险重仓、证金持股、中特估概念主力净流入都在 15 亿上下，是避险资金的落脚点。\n半导体设备单列观察：跌幅不小但主力在进，等科技情绪止跌再说。\n#六只个股\n #中国电影 $600977 涨停，成交 18.65 亿，院线龙头里流动性最好。\n #儒意电影 $002739 涨停，成交 14.56 亿，短剧与内容双线。\n #牧原股份 $002714 涨 2.73%，猪周期反转逻辑的核心标的。\n #温氏股份 $300498 涨 2.18%，同方向第二选择。\n #工商银行 $601398 涨 1.61%，红利防守首选。\n #北方华创 $002371 跌 0.96%，明显强于板块，设备涨价逻辑的观察仓。\n#小盘阿尔法\n本档不选。影视里的小票已经涨停，追高性价比低；今天缺少能完整核验20日K线与最新财报的小市值标的，宁缺不凑。\n#中美映射\n中美行业ETF的20日与5日双窗口数据本档缺失。能确认的是映射方向一致：美股AI硬件受英伟达管理层风波拖累，A股光模块与PCB同步被兑现。\n#期货\nIM主力约 6285.8，较昨结算跌约 3.3%，相对中证1000贴水约 67 点；IC跌约 2.7%；IF跌约\n1%；IH基本持平。小盘期指跌幅大于现货，空头情绪重。标普期货跌约 0.16%。\n#尾盘观察\n看三件事：光模块龙头能否在尾盘缩量止跌；影视涨停板封单是否稳定；IM贴水是否收窄。三件事都不好，明天先防守。\n#操作提示\n今天不抄科技的底。已有光模块和PCB仓位的，反抽减仓优于割在最低点。新开仓只考虑影视龙头的回踩和银行红利，单票仓位压低。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121131679989600721","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":1,"vw":740},{"id":"2121131674784387541","h":"cnfinancewatch","ts":1794552174,"zh":"#A股盘中 2026-11-13 北京时间14:30\n#结论\n今天是一场典型的高位科技集中兑现。光模块、CPO、PCB 一起被砸，创业板指跌 3.51%，中证1000跌\n2.82%，全市场跌多涨少接近七比一。资金躲进三处：影视院线、生猪养殖、银行红利。尾盘不要去接光模块的飞刀，防守仓位可以留，进攻只看有消息又有资金的影视线。\n#盘面速览\n截至14:40，上证指数 3630.43，跌 0.69%；深证成指跌 2.13%；创业板指跌 3.51%；科创50跌\n2.65%；沪深300跌 0.81%。恒生指数跌 1.49%，恒生科技跌 2.92%。沪深两市成交约 1.52 万亿。上涨约 700\n家，下跌约 4630 家，涨停 37 家，跌停 33 家，炸板 21 家。权重托住了上证，中小盘和科技成长是重灾区。\n#板块与风格\n跌幅前列：印制电路板跌 7.03%，元件跌 6.47%，玻纤制造跌 5.61%，分立器件、被动元件、通信线缆都跌 5%\n左右。概念上光通信模块跌 5.32%，CPO跌 5.16%，PCB跌 4.9%，高带宽内存跌 4.7%。\n涨幅前列：院线涨 12.5%，影视院线涨 4.12%，生猪养殖涨 3.13%，银行涨 1.35%。风格上大盘价值、红利、茅指数小幅翻红，明显的高低切。\n#资金面\n沪市主力净流出约 208 亿，深市约 380 亿，合计近 590 亿，超大单是主要卖方。行业主力净流入前列是影视院线 13.62 亿、银行\n11.29 亿、IT服务 10.28 亿，半导体设备板块虽然跌 3.52%，主力仍净流入 9.16 亿，值得记一笔。流出最重的是CPO概念\n166 亿、光通信模块 156 亿、PCB 140 亿。个股成交前列 #中际旭创 $300308 跌 8.8%，主力净流出 30 亿；\n#新易盛 $300502 跌 9.37%； #东山精密 $002384 与 #沪电股份 $002463 跌停。北向实时数据缺失。\n#涨停分布\n37 家涨停里，汽车零部件 6 家，影视院线 5 家，游戏与IT服务各 2 家。连板高度最高是 #天普股份 $605255 4连板，\n#北纬科技 $002148 和 #金辰股份 $603396 3连板。高标还在，但没有形成主线梯队，情绪偏弱。\n#盘中消息\n英伟达CEO更替风波继续发酵，美股科技情绪偏谨慎，纳指期货盘中跌约\n0.37%。美联储官员接连放鹰，美债遭抛售，海外加息担忧压制高估值。中芯国际业绩会提到上游设备采购价格提高、交付周期拉长，AI配套芯片代工价格维持上行，这是设备链今天逆势吸金的直接理由。火山引擎发布新模型，AI影视降本提速，短剧与院线集体涨停。猪周期产能去化加速的预期继续升温。\n#研报面\n今天新出的买入评级集中在半导体与电网：华安证券给 #海光信息 $688041 #长鑫科技 $688825 #盛合晶微 $688820\n#国电南瑞 $600406 买入；太平洋给 #华峰测控 $688200 买入，看AI测试布局；国信证券11月11日给 #益生股份\n$002458 增持，三季度归母净利同比增 429%。","en":"#A股盘中 2026-11-13 北京时间14:30\n#结论\n今天是一场典型的高位科技集中兑现。光模块、CPO、PCB 一起被砸，创业板指跌 3.51%，中证1000跌\n2.82%，全市场跌多涨少接近七比一。资金躲进三处：影视院线、生猪养殖、银行红利。尾盘不要去接光模块的飞刀，防守仓位可以留，进攻只看有消息又有资金的影视线。\n#盘面速览\n截至14:40，上证指数 3630.43，跌 0.69%；深证成指跌 2.13%；创业板指跌 3.51%；科创50跌\n2.65%；沪深300跌 0.81%。恒生指数跌 1.49%，恒生科技跌 2.92%。沪深两市成交约 1.52 万亿。上涨约 700\n家，下跌约 4630 家，涨停 37 家，跌停 33 家，炸板 21 家。权重托住了上证，中小盘和科技成长是重灾区。\n#板块与风格\n跌幅前列：印制电路板跌 7.03%，元件跌 6.47%，玻纤制造跌 5.61%，分立器件、被动元件、通信线缆都跌 5%\n左右。概念上光通信模块跌 5.32%，CPO跌 5.16%，PCB跌 4.9%，高带宽内存跌 4.7%。\n涨幅前列：院线涨 12.5%，影视院线涨 4.12%，生猪养殖涨 3.13%，银行涨 1.35%。风格上大盘价值、红利、茅指数小幅翻红，明显的高低切。\n#资金面\n沪市主力净流出约 208 亿，深市约 380 亿，合计近 590 亿，超大单是主要卖方。行业主力净流入前列是影视院线 13.62 亿、银行\n11.29 亿、IT服务 10.28 亿，半导体设备板块虽然跌 3.52%，主力仍净流入 9.16 亿，值得记一笔。流出最重的是CPO概念\n166 亿、光通信模块 156 亿、PCB 140 亿。个股成交前列 #中际旭创 $300308 跌 8.8%，主力净流出 30 亿；\n#新易盛 $300502 跌 9.37%； #东山精密 $002384 与 #沪电股份 $002463 跌停。北向实时数据缺失。\n#涨停分布\ ward-looking. Read more:\n🎨: Ard Su for Bloomberg Businessweek","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HW-04cvXAAAs0A0.jpg?name=orig"],"u":"https://x.com/business/status/2121112833429586172","l":["bloom.bg"],"ln":[{"u":"http://bloom.bg/4zplw4Z","d":"bloom.bg"}],"t":["AI科技"],"lk":11,"rt":1,"rp":2,"vw":17665},{"id":"2121112077666242777","h":"business","ts":1794547502,"zh":"随着数月冲突后流量反弹，亚洲炼油厂越来越多地转向中东生产商的原油","en":"Oil refiners in Asia are increasingly turning back toward crude from Middle Eastern producers as flows rebound after months of conflict","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2121112077666242777","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-13/oil-hungry-asia-turns-back-to-mideast-in-earnest-as-flows-expand?taid=6af69f2ed0eea100019adef3&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["原油能源"],"lk":18,"rt":4,"rp":5,"vw":18646},{"id":"2121111535460536800","h":"cnfinancewatch","ts":1794547373,"zh":"散户热议｜2026-11-13·午间\n数据时点：北京时间2026年11月13日约13:20。国内部分来自韭研公社公开帖与21财经、一财等报道；海外部分来自Reuters报道、Stocktwits新闻页与投票、StonkHub对Reddit WallStreetBets的统计。本轮未直接登录抓取WSB原帖，WSB数据为第三方统计的二手转述；Stocktwits用户发言均转引自其新闻页，非我们抽样。以下不含任何编造的引语或情绪数字。\n一、国内：资金在缩量里玩“接力”\n真实话题一：AI漫剧还能不能上。韭研公社午间热帖的标题是“创业板指半日跌超1%，AI漫剧和银行股凭什么上涨？”，帖子把上午概括为存量轮动：AI漫剧逆势领涨，文投控股5天4板，金逸影视4天2板，华是科技、幸福蓝海20CM涨停，横店影视、湖北广电涨停。讨论里看多的理由是“技术降本跨过临界点”，腾讯首款AI游戏陪伴产品首测、AI长剧登上卫视黄金档被反复引用。\n但公告和券商口径冷静得多。文投控股自己披露AI漫剧收入占比约2.57%，前三季度营收1.80亿元、同比降29.51%；公司工作人员对21财经说“纯是击鼓传花”。华西证券测算，今年上半年抖音新增AI剧播放破亿率仅约0.48%，投流可能占全链路成本约70%，制作成本下降不等于利润率提升。散户热的是“故事”，券商冷的是“利润表”，这是今天最大的分歧。\n真实话题二：CPO是洗盘还是见顶。光模块是过去几个月散户最集中的持仓之一，上午天孚通信、源杰科技、新易盛集体跳水。论坛里一派认为思科上调指引、中际旭创获纳入MSCI中国指数（邮件转述）说明逻辑还在，跌下来是机会；另一派担心英伟达换帅后整条链的估值锚松动。我们的看法偏后者：需求没坏，但筹码太拥挤，抄底要等成交量明显萎缩。\n真实话题三：高低切换。银行创新高、猪肉白酒反弹，被不少帖子解读为“机构在防守”。这和券商口径一致，但散户往往在切换的第二三天才追进去，此时性价比已下降。\n被忽略的风险：一是亏钱效应在扩散，超2900只个股下跌，炸板和高位大面的个股增多，大东方收监管函后高位走弱是前车之鉴；二是缩量接力的特点是“涨得快、退得更快”，一旦龙头停牌或开板，后排跟风股往往连续补跌；三是监管态度与情绪存在分歧，市场在赌监管容忍度。\n二、海外：英伟达成了散户的“信仰测试”\nReuters报道，黄仁勋辞职当天，散户在开盘半小时内净买入约1.11亿美元英伟达，抄底力度创纪录，帮助股价从盘中最深约14%的跌幅收窄。Stocktwits新闻页显示，其平台对英伟达的散户情绪处于“极度看多”区间，一周消息量增长593%；一项投票中58%的受访者表示在抄底，42%选择回避。\nWSB的态度更分裂。据StonkHub统计，过去7天有859名WSB用户讨论英伟达，较前一周增加逾4倍；全Reddit范围内看多39.3%、看空38.0%，几乎打平。WSB最热的帖子是官方换帅公告本身，其次是一批调侃黄仁勋私生活的梗帖，可见“玩梗”和“抄底”并存。\n与华尔街的分歧很鲜明：Truist与Craig-Hallum分别把英伟达降至“持有”，目标价下调到174美元和180美元，理由是治理和调查风险“比估值更重要”。散户看到的是“便宜了”，机构看到的是“不确定性还没定价”。另一个热点是AMD与博通，Stocktwits上有交易者认为“英伟达的坏消息就是AMD的催化剂”。\n被忽略的风险：一是联邦调查与对华出口审查尚无结论，抄底者押的是“最坏已过去”；二是利率环境逆风，今晚PPI若超预期，高估值科技会被一起抛售；三是英伟达11月18日财报是换帅后首份，指引和管理层表态都可能引发新一轮波动。\n三、我们怎么看\n国内与海外散户今天的共同点，是都在用“抄底”和“接力”对抗利率与治理风险。我们的建议是：题材股不接最后一棒，科技龙头等事件落地，低位防守资产可作为仓位的压舱石。\n本文仅为舆情整理与研究观点，事实与推测已分开标注，不构成投资建议。市场有风险，投资需谨慎。","en":"散户热议｜2026-11-13·午间\n数据时点：北京时间2026年11月13日约13:20。国内部分来自韭研公社公开帖与21财经、一财等报道；海外部分来自Reuters报道、Stocktwits新闻页与投票、StonkHub对Reddit WallStreetBets的统计。本轮未直接登录抓取WSB原帖，WSB数据为第三方统计的二手转述；Stocktwits用户发言均转引自其新闻页，非我们抽样。以下不含任何编造的引语或情绪数字。\n一、国内：资金在缩量里玩“接力”\n真实话题一：AI漫剧还能不能上。韭研公社午间热帖的标题是“创业板指半日跌超1%，AI漫剧和银行股凭什么上涨？”，帖子把上午概括为存量轮动：AI漫剧逆势领涨，文投控股5天4板，金逸影视4天2板，华是科技、幸福蓝海20CM涨停，横店影视、湖北广电涨停。讨论里看多的理由是“技术降本跨过临界点”，腾讯首款AI游戏陪伴产品首测、AI长剧登上卫视黄金档被反复引用。\n但公告和券商口径冷静得多。文投控股自己披露AI漫剧收入占比约2.57%，前三季度营收1.80亿元、同比降29.51%；公司工作人员对21财经说“纯是击鼓传花”。华西证券测算，今年上半年抖音新增AI剧播放破亿率仅约0.48%，投流可能占全链路成本约70%，制作成本下降不等于利润率提升。散户热的是“故事”，券商冷的是“利润表”，这是今天最大的分歧。\n真实话题二：CPO是洗盘还是见顶。光模块是过去几个月散户最集中的持仓之一，上午天孚通信、源杰科技、新易盛集体跳水。论坛里一派认为思科上调指引、中际旭创获纳入MSCI中国指数（邮件转述）说明逻辑还在，跌下来是机会；另一派担心英伟达换帅后整条链的估值锚松动。我们的看法偏后者：需求没坏，但筹码太拥挤，抄底要等成交量明显萎缩。\n真实话题三：高低切换。银行创新高、猪肉白酒反弹，被不少帖子解读为“机构在防守”。这和券商口径一致，但散户往往在切换的第二三天才追进去，此时性价比已下降。\n被忽略的风险：一是亏钱效应在扩散，超2900只个股下跌，炸板和高位大面的个股增多，大东方收监管函后高位走弱是前车之鉴；二是缩量接力的特点是“涨得快、退得更快”，一旦龙头停牌或开板，后排跟风股往往连续补跌；三是监管态度与情绪存在分歧，市场在赌监管容忍度。\n二、海外：英伟达成了散户的“信仰测试”\nReuters报道，黄仁勋辞职当天，散户在开盘半小时内净买入约1.11亿美元英伟达，抄底力度创纪录，帮助股价从盘中最深约14%的跌幅收窄。Stocktwits新闻页显示，其平台对英伟达的散户情绪处于“极度看多”区间，一周消息量增长593%；一项投票中58%的受访者表示在抄底，42%选择回避。\nWSB的态度更分裂。据StonkHub统计，过去7天有859名WSB用户讨论英伟达，较前一周增加逾4倍；全Reddit范围内看多39.3%、看空38.0%，几乎打平。WSB最热的帖子是官方换帅公告本身，其次是一批调侃黄仁勋私生活的梗帖，可见“玩梗”和“抄底”并存。\n与华尔街的分歧很鲜明：Truist与Craig-Hallum分别把英伟达降至“持有”，目标价下调到174美元和180美元，理由是治理和调查风险“比估值更重要”。散户看到的是“便宜了”，机构看到的是“不确定性还没定价”。另一个热点是AMD与博通，Stocktwits上有交易者认为“英伟达的坏消息就是AMD的催化剂”。\n被忽略的风险：一是联邦调查与对华出口审查尚无结论，抄底者押的是“最坏已过去”；二是利率环境逆风，今晚PPI若超预期，高估值科技会被一起抛售；三是英伟达11月18日财报是换帅后首份，指引和管理层表态都可能引发新一轮波动。\n三、我们怎么看\n国内与海外散户今天的共同点，是都在用“抄底”和“接力”对抗利率与治理风险。我们的建议是：题材股不接最后一棒，科技龙头等事件落地，低位防守资产可作为仓位的压舱石。\n本文仅为舆情整理与研究观点，事实与推测已分开标注，不构成投资建议。市场有风险，投资需谨慎。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121111535460536800","l":[],"ln":[],"t":["A股港股","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":2495},{"id":"2121111132496880024","h":"cnfinancewatch","ts":1794547276,"zh":"热点财经新闻综述｜2026-11-13·午间\n数据时点：北京时间2026年11月13日约13:20采集，A股、港股数据截至午间收盘，外盘为亚洲时段报价。依据：11月13日早间（08:10）与午间（13:10）两封热点财经邮件，交叉新浪财经、凤凰网、中新经纬、21财经、Bloomberg、Reuters、盛宝等公开报道。凡标“邮件转述”的为未独立核实口径，不当定论。\n今日判断\n上午的盘面一句话：指数靠银行托住，资金在缩量里找短线。沪指半日涨0.22%报3663.71点，深成指跌0.56%，创业板指跌1.47%报2472.53点，科创50盘中一度涨超2%后冲高回落。两市半日成交约9794亿元，较上一交易日缩量约2421亿元，超2900只个股下跌。港股更弱，恒指午盘跌0.92%报23786点，恒生科技跌1.75%。\n外部环境没有变好也没有变坏：美10年期国债收益率在5.13%附近，布伦特原油守在每桶96美元下方，美元兑日元贴着160，美股期货基本走平。今晚21:30公布美国10月PPI，是全天最大的变量。我们的建议是午后不追涨，仓位维持中性偏低，把精力放在“业绩能落地的科技”和“防守型高股息”两头，题材股只做观察。\n三大利多方向（由强到弱）\n一、晶圆代工与半导体设备：业绩兑现，逻辑最硬。中芯国际三季度净利润约4.28亿美元，好于预期，营收同比增长约34%（盛宝援引）。午间邮件转述其业绩会信息：上游设备采购价提高、交付周期拉长，AI配套芯片代工价格维持上行。这意味着国产代工的议价权在提升，设备厂订单能见度跟着变好。制约在于港股中芯一度涨超7%后半日涨幅收窄到约0.5%，华虹半导体跌4.42%，说明资金认业绩，但不愿给高估值溢价。思路是设备与代工逢回踩分批，不追冲高。\n二、银行与高股息：指数的真正压舱石。江苏银行、南京银行、青岛银行、成都银行盘中创历史新高。背景是缩量环境下资金寻找确定性，加上邮件转述的外资重新定价中国资产、淡马锡称持续加码中国。对稳健型客户而言，这是当前回撤最小的方向；风险是若午后成长股反弹，银行可能出现获利了结，不宜在新高处重仓追入。\n三、生猪产能去化与消费修复：低位切换的备选。猪肉概念早盘异动，金新农、天邦食品涨停；邮件转述产能去化加速、猪周期反转预期升温。白酒板块反弹，古井贡酒领涨。这条线的意义在于高低切换时承接资金，但基本面拐点还要看后续生猪价格与存栏数据，属于左侧布局，宜小仓位。\n三大利空方向（由强到弱）\n一、美债收益率与加息预期：压在所有成长股头上的利率。周四美债遭遇2022年以来最大幅度的抛售之一，10年期重回5%上方，市场押注美联储12月加息。邮件转述克利夫兰联储哈马克支持渐进加息。今晚PPI若高于预期，高估值科技和黄金会再受压；若回落，则可能出现一轮修复。PPI之前不宜重仓高弹性品种。\n二、CPO与光模块高位回调：拥挤交易松动。天孚通信、源杰科技、新易盛等集体走弱，同花顺热股榜显示中际旭创、新易盛、东山精密跌幅都在7%以上（邮件转述，个股口径以收盘为准）。英伟达换帅后供应链估值重估，叠加前期涨幅过大，资金正在兑现。思科上调指引、AI收入料翻倍，说明需求没坏，问题出在筹码而不是基本面。短线回避，等缩量企稳后再看。\n三、题材炒作与监管降温：AI漫剧亏钱效应的隐患。文投控股本轮累计涨幅已逾一倍，公司公告AI漫剧收入仅占营收约2.57%，前三季度净亏损3755万元，工作人员对媒体直言“纯是击鼓传花”，并称后续可能停牌（21财经）。大东方收到上交所监管工作函后高位走弱，邮件转述当日跌8.36%。题材越热，监管和退潮风险越集中，追高者承担的是接力断裂的代价。\n多空如何制约\n利多集中在“有业绩的硬科技”和“有分红的防守资产”，利空集中在“利率”与“拥挤度”。短期内PPI决定方向，中期看英伟达11月18日财报（市场口径）能否稳住AI链。结构上我们倾向低吸代工设备与银行，回避高位CPO和纯题材。\n本文仅为信息整理与研究观点，事实与推测已分开标注，不构成投资建议。市场有风险，投资需谨慎。","en":"热点财经新闻综述｜2026-11-13·午间\n数据时点：北京时间2026年11月13日约13:20采集，A股、港股数据截至午间收盘，外盘为亚洲时段报价。依据：11月13日早间（08:10）与午间（13:10）两封热点财经邮件，交叉新浪财经、凤凰网、中新经纬、21财经、Bloomberg、Reuters、盛宝等公开报道。凡标“邮件转述”的为未独立核实口径，不当定论。\n今日判断\n上午的盘面一句话：指数靠银行托住，资金在缩量里找短线。沪指半日涨0.22%报3663.71点，深成指跌0.56%，创业板指跌1.47%报2472.53点，科创50盘中一度涨超2%后冲高回落。两市半日成交约9794亿元，较上一交易日缩量约2421亿元，超2900只个股下跌。港股更弱，恒指午盘跌0.92%报23786点，恒生科技跌1.75%。\n外部环境没有变好也没有变坏：美10年期国债收益率在5.13%附近，布伦特原油守在每桶96美元下方，美元兑日元贴着160，美股期货基本走平。今晚21:30公布美国10月PPI，是全天最大的变量。我们的建议是午后不追涨，仓位维持中性偏低，把精力放在“业绩能落地的科技”和“防守型高股息”两头，题材股只做观察。\n三大利多方向（由强到弱）\n一、晶圆代工与半导体设备：业绩兑现，逻辑最硬。中芯国际三季度净利润约4.28亿美元，好于预期，营收同比增长约34%（盛宝援引）。午间邮件转述其业绩会信息：上游设备采购价提高、交付周期拉长，AI配套芯片代工价格维持上行。这意味着国产代工的议价权在提升，设备厂订单能见度跟着变好。制约在于港股中芯一度涨超7%后半日涨幅收窄到约0.5%，华虹半导体跌4.42%，说明资金认业绩，但不愿给高估值溢价。思路是设备与代工逢回踩分批，不追冲高。\n二、银行与高股息：指数的真正压舱石。江苏银行、南京银行、青岛银行、成都银行盘中创历史新高。背景是缩量环境下资金寻找确定性，加上邮件转述的外资重新定价中国资产、淡马锡称持续加码中国。对稳健型客户而言，这是当前回撤最小的方向；风险是若午后成长股反弹，银行可能出现获利了结，不宜在新高处重仓追入。\n三、生猪产能去化与消费修复：低位切换的备选。猪肉概念早盘异动，金新农、天邦食品涨停；邮件转述产能去化加速、猪周期反转预期升温。白酒板块反弹，古井贡酒领涨。这条线的意义在于高低切换时承接资金，但基本面拐点还要看后续生猪价格与存栏数据，属于左侧布局，宜小仓位。\n三大利空方向（由强到弱）\n一、美债收益率与加息预期：压在所有成长股头上的利率。周四美债遭遇2022年以来最大幅度的抛售之一，10年期重回5%上方，市场押注美联储12月加息。邮件转述克利夫兰联储哈马克支持渐进加息。今晚PPI若高于预期，高估值科技和黄金会再受压；若回落，则可能出现一轮修复。PPI之前不宜重仓高弹性品种。\n二、CPO与光模块高位回调：拥挤交易松动。天孚通信、源杰科技、新易盛等集体走弱，同花顺热股榜显示中际旭创、新易盛、东山精密跌幅都在7%以上（邮件转述，个股口径以收盘为准）。英伟达换帅后供应链估值重估，叠加前期涨幅过大，资金正在兑现。思科上调指引、AI收入料翻倍，说明需求没坏，问题出在筹码而不是基本面。短线回避，等缩量企稳后再看。\n三、题材炒作与监管降温：AI漫剧亏钱效应的隐患。文投控股本轮累计涨幅已逾一倍，公司公告AI漫剧收入仅占营收约2.57%，前三季度净亏损3755万元，工作人员对媒体直言“纯是击鼓传花”，并称后续可能停牌（21财经）。大东方收到上交所监管工作函后高位走弱，邮件转述当日跌8.36%。题材越热，监管和退潮风险越集中，追高者承担的是接力断裂的代价。\n多空如何制约\n利多集中在“有业绩的硬科技”和“有分红的防守资产”，利空集中在“利率”与“拥挤度”。短期内PPI决定方向，中期看英伟达11月18日财报（市场口径）能否稳住AI链。结构上我们倾向低吸代工设备与银行，回避高位 13日早盘，A股主要指数走势分化。上证指数半日上涨0.22%，深证成指下跌0.56%，创业板指跌幅1.47%；科创50盘中一度涨超2%，随后回落，午间收跌0.48%。\n两市半日成交额9794亿元，较前一日同期缩减2421亿元，下跌个股超过2900只，资金仍在存量格局中快速轮动。盘面上，昨日调整的机器人、AI应用出现修复，但未能形成统一进攻方向；AI漫剧逆势走强，算力芯片局部活跃，银行等高股息品种对指数形成支撑，CPO等高位科技方向则继续承压。\n#AI漫剧成为早盘最强线索。文投控股5天4板、金逸影视4天2板，华是科技、幸福蓝海20CM涨停，横店影视、湖北广电封板。催化因素来自11月12日火山引擎Seedance 2.5 flash：生成速度较Seedance 2.5提升一倍，720P文生/图生视频价格降至约0.99元/秒，降幅约34%，单段最长支持30秒，AI影视制作成本进一步下探。供给和用户端同步扩张：网络材料称，广电总局数据显示前10个月微短剧上线近55万部，为2025年全年的近17倍，AI剧占比超过94%；QuestMobile显示，9月红果免费短剧去重用户4.3亿，超过豆包的4.19亿，短剧用户突破4亿用时不足3年；机构测算2026年国内AI剧、漫剧市场约400亿元，用户有望突破6亿。\n#算力芯片局部活跃，但高位品种分歧加大。天普股份4连板，华东重机涨停，旋极信息20CM涨停；燧原科技、摩尔线程冲高回落，CPO板块集体调整，天孚通信、源杰科技、新易盛走弱。分化背后既有海外需求验证，也有获利了结：CoreWeave三季报营收36.6亿美元、同比增长168%，在手订单1325亿美元，较6月末再增约285亿美元，排期至2027年；平头哥赴港上市推进，截至2026年4月真武系列AI芯片累计出货56万片、服务超650家客户；三季度全球半导体销售额5177亿美元、环比增24.1%，DRAM收入同比增369%。机器人板块昨日调整后今日普遍止跌，但未形成集体反弹，资金从纯题材情绪转向业绩确定性环节，后续仍需观察产业链量产订单兑现进度。\n#银行股批量创新高，成为指数核心支撑。江苏银行、南京银行双双创历史新高。业绩与股息形成双重支撑：42家上市银行前三季度合计营收4.66万亿元、同比增7.81%，归母净利润1.75万亿元、同比增3.78%，净利增速较半年度提升0.8个百分点，34只银行股净利正增长。低利率环境下股息吸引力凸显：最新TTM股息率显示，42家银行中7家超过5%，成都银行6.94%居首，北京银行、上海银行分别为6.79%、6.22%，站上4%的多达22家。叠加年末调仓、险资托底与全面破净，银行股正从防御资产向高确定性权益资产重估。\n#支线方面，#猪肉板块异动，金新农、天邦食品涨停。核心催化是去化强化：三季度末全国能繁母猪存栏降至3602万头、同比降10.7%，为本轮首次跌破3750万头正常保有量；立冬后北方灌肠、南方腌腊启动，屠宰开工率回升至33.04%，猪价低位企稳。机构对去化和底部临近渐成共识，但反转时点仍有分歧，多认为拐点在2027年二季度前后。白酒板块仍在磨底：双十一电商成交高增，京东酒类整体增25%，茅台、五粮液等头部品牌双位数增长，但本质是平台补贴与渠道回笼现金的“库存泄压”，并非需求复苏。三季报显示，#19家A股白酒上市公司前三季度合计营收同比降7.39%、归母净利同比降超8%，千元价格带倒挂延续，当前仅是库存底、价盘底，而非需求底、盈利底。\n整体看，市场仍处存量博弈，风格向低波红利倾斜，科技主线在高位分歧中等待新催化。操作上避免追高，等待轮动低吸。\n以上根据网络材料整理改写，数据未经独立核实，不构成任何投资建议。","en":"【11月13日A股午间观察】\n11月13日早盘，A股主要指数走势分化。上证指数半日上涨0.22%，深证成指下跌0.56%，创业板指跌幅1.47%；科创50盘中一度涨超2%，随后回落，午间收跌0.48%。\n两市半日成交额9794亿元，较前一日同期缩减2421亿元，下跌个股超过2900只，资金仍在存量格局中快速轮动。盘面上，昨日调整的机器人、AI应用出现修复，但未能形成统一进攻方向；AI漫剧逆势走强，算力芯片局部活跃，银行等高股息品种对指数形成支撑，CPO等高位科技方向则继续承压。\n#AI漫剧成为早盘最强线索。文投控股5天4板、金逸影视4天2板，华是科技、幸福蓝海20CM涨停，横店影视、湖北广电封板。催化因素来自11月12日火山引擎Seedance 2.5 flash：生成速度较Seedance 2.5提升一倍，720P文生/图生视频价格降至约0.99元/秒，降幅约34%，单段最长支持30秒，AI影视制作成本进一步下探。供给和用户端同步扩张：网络材料称，广电总局数据显示前10 1074184940044331","h":"fxtrader","ts":1794538467,"zh":"黄仁勋离开英伟达一事，还可能牵连特朗普政府，包括商务部长卢特尼克。在美国政府对华芯片销售的监管问题上，卢特尼克正面临越来越多的质疑，尤其是他和黄仁勋不顾两党资深对华鹰派的审视，力主放宽销售。","en":"黄仁勋离开英伟达一事，还可能牵连特朗普政府，包括商务部长卢特尼克。在美国政府对华芯片销售的监管问题上，卢特尼克正面临越来越多的质疑，尤其是他和黄仁勋不顾两党资深对华鹰派的审视，力主放宽销售。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2121074184940044331","l":[],"ln":[],"t":["AI科技"],"lk":27,"rt":0,"rp":7,"vw":15005},{"id":"2121071219164242094","h":"bbcchinese","ts":1794537760,"zh":"从失禁到长期疼痛，数以百万计的女性在分娩数十年后仍然饱受后遗症困扰。","en":"从失禁到长期疼痛，数以百万计的女性在分娩数十年后仍然饱受后遗症困扰。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2121071219164242094","l":["bbc.in"],"ln":[{"u":"https://bbc.in/48PmSuR","d":"bbc.in"}],"t":[],"lk":16,"rt":0,"rp":6,"vw":14374},{"id":"2121070861797171632","h":"cnfinancewatch","ts":1794537675,"zh":"这个栏目不错\n原始信息第二次提炼了","en":"这个栏目不错\n原始信息第二次提炼了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121070861797171632","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":4569},{"id":"2121069849359372574","h":"cnfinancewatch","ts":1794537434,"zh":"散户热议｜2026-11-13·早间\n数据时点：国内部分为2026年11月13日约07:32（北京时间）抓取的韭研公社首页公开帖子，内容以11月12日盘后为主；海外部分为11月12日美股交易时段的公开报道。Reddit\nWallStreetBets与Stocktwits本期未直接抓取，相关数据来自路透社和Stocktwits自家新闻稿，属于二手转述，下文均已标注。所有情绪描述只代表这些公开样本，不代表全体投资者。\n国内：情绪退潮，抱团往低位和防御躲\n韭研公社周四晚间的复盘帖给出的盘面口径是：剔除ST和未开板新股，涨停37家、跌停5家、连板11家，破板率48.61%，涨停数明显少于前一日，作者直接写“情绪转弱”。这和公开收评一致，全市场超4600只个股下跌。\n真实话题集中在四处。\n一是国产算力。热度较高的一篇帖子标题是“海外算力封堵，国产算力必须顶上”，把甲骨文终止腾讯海外算力租赁合约（帖子转述，我们未核实）、英伟达管理层变动、美国拟管制远程算力调用串成一条线，结论是寒武纪、燧原科技等将成为下一阶段主线。另有帖子炒作昇腾整机“配额制”，用互动易上的股权穿透（约12%间接权益）把一家传动件公司拉进昇腾概念。\n二是“东方系”和低位小票接力。东方海洋17天9板、大东方8天6板被反复提到，燃气板块的东方环宇连板后，已有帖子在找“补涨套利股”。\n三是大消费和防御。多篇帖子讨论零售、冰雪、水产、食品饮料逆势走强，也有作者从估值分位论证医药“长坡厚雪”回来了。\n四是情绪抱怨。有人在晚间资讯帖里指责盘中“小作文”扰动市场，可见题材资金对负面消息高度敏感。\n与券商口径的异同。相同点是双方都认可国产算力受益于外部封堵，也都看到资金向防御板块迁移。不同点在节奏：券商更多强调代工、设备材料这类有业绩验证的环节，提示港股不宜追高贝塔；社区则更爱涨幅最大的芯片设计和连板小票，倾向把政策和股权关系直接翻译成“必涨逻辑”。\n被忽略的风险。其一，高低切换并不等于安全，大东方在连板过程中已收到上交所监管工作函（晚间邮件转述），监管对高标的压制往往在次日开板后体现为补跌。其二，“补涨套利”思路在炸板率接近五成的环境里亏钱效应最大，龙头一旦断板，跟风股最先被抛。其三，股权穿透式的概念链条兑现到利润的路径很长，属于情绪定价。其四，国产算力龙头短期涨幅已大，若下周英伟达财报或出口管制落地不如预期激烈，存在预期差回撤。\n海外：散户抄底英伟达，但并非一边倒\n路透社报道，Vanda Research估算周四开盘后半小时散户净买入英伟达约1.11亿美元，是其有记录以来最大的开盘半小时散户流入。富达平台截至美东时间中午，英伟达买单约39.5万笔，卖单约8万笔，买单数量超过平台其他九只最热门股票之和，排第二的是AMD。\n但在Reddit的WallStreetBets，路透统计关于英伟达的评论约六成偏负面（二手数据，我们未直接抓取原帖）。Stocktwits方面，其新闻稿称英伟达散户情绪处于“极度看多”区间，7天讨论量增长741%，一项约1.7万人参与的投票中57%表示会在黄仁勋离任后抄底（同为平台自家数据）。\n与专业机构的分歧很明显。Baird本周把英伟达下调至中性、目标价下调六成至200美元，理由是2027年数据中心预测可见度下降；郭明錤则认为辞职是“一次性出清事件”。散户买的是“历史上每次抄底都赢”的经验，机构担心的是明年资本开支增速放缓。\n被忽略的风险有三：下周二财报电话会是临时CEO首次面对市场，管理层难以给出完整的长期规划；10年期美债收益率已在5.1%上方，估值锚在上移；Anthropic据报下周上市，可能分流AI板块资金。另外Nebius单日跌近17%、超微电脑跌逾11%，说明AI基建链里并非所有“错杀”都值得接。\n总结：国内外散户都在“抄底”，但国内抄的是替代逻辑和低位题材，海外抄的是龙头本身。两边共同的盲点是利率，这一点比任何CEO变动都更持久。\n来源：韭研公社公开帖子、路透社、TradingView转载的Stocktwits新闻、新华财经、11月12日晚间热点财经邮件（转述已标注）。未捏造引语，统计均来自所列来源。以上内容不构成投资建议。","en":"散户热议｜2026-11-13·早间\n数据时点：国内部分为2026年11月13日约07:32（北京时间）抓取的韭研公社首页公开帖子，内容以11月12日盘后为主；海外部分为11月12日美股交易时段的公开报道。Reddit\nWallStreetBets与Stocktwits本期未直接抓取，相关数据来自路透社和Stocktwits自家新闻稿，属于二手转述，下文均已标注。所有情绪描述只代表这些公开样本，不代表全体投资者。\n国内：情绪退潮，抱团往低位和防御躲\n韭研公社周四晚间的复盘帖给出的盘面口径是：剔除ST和未开板新股，涨停37家、跌停5家、连板11家，破板率48.61%，涨停数明显少于前一日，作者直接写“情绪转弱”。这和公开收评一致，全市场超4600只个股下跌。\n真实话题集中在四处。\n一是国产算力。热度较高的一篇帖子标题是“海外算力封堵，国产算力必须顶上”，把甲骨文终止腾讯海外算力租赁合约（帖子转述，我们未核实）、英伟达管理层变动、美国拟管制远程算力调用串成一条线，结论是寒武纪、燧原科技等将成为下一阶段主线。另有帖子炒作昇腾整机“配额制”，用互动易上的股权穿透（约12%间接权益）把一家传动件公司拉进昇腾概念。\n二是“东方系”和低位小票接力。东方海洋17天9板、大东方8天6板被反复提到，燃气板块的东方环宇连板后，已有帖子在找“补涨套利股”。\n三是大消费和防御。多篇帖子讨论零售、冰雪、水产、食品饮料逆势走强，也有作者从估值分位论证医药“长坡厚雪”回来了。\n四是情绪抱怨。有人在晚间资讯帖里指责盘中“小作文”扰动市场，可见题材资金对负面消息高度敏感。\n与券商口径的异同。相同点是双方都认可国产算力受益于外部封堵，也都看到资金向防御板块迁移。不同点在节奏：券商更多强调代工、设备材料这类有业绩验证的环节，提示港股不宜追高贝塔；社区则更爱涨幅最大的芯片设计和连板小票，倾向把政策和股权关系直接翻译成“必涨逻辑”。\n被忽略的风险。其一，高低切换并不等于安全，大东方在连板过程中已收到上交所监管工作函（晚间邮件转述），监管对高标的压制往往在次日开板后体现为补跌。其二，“补涨套利”思路在炸板率接近五成的环境里亏钱效应最大，龙头一旦断板，跟风股最先被抛。其三，股权穿透式的概念链条兑现到利润的路径很长，属于情绪定价。其四，国产算力龙头短期涨幅已大，若下周英伟达财报或出口管制落地不如预期激烈，存在预期差回撤。\n海外：散户抄底英伟达，但并非一边倒\n路透社报道，Vanda Research估算周四开盘后半小时散户净买入英伟达约1.11亿美元，是其有记录以来最大的开盘半小时散户流入。富达平台截至美东时间中午，英伟达买单约39.5万笔，卖单约8万笔，买单数量超过平台其他九只最热门股票之和，排第二的是AMD。\n但在Reddit的WallStreetBets，路透统计关于英伟达的评论约六成偏负面（二手数据，我们未直接抓取原帖）。Stocktwits方面，其新闻稿称英伟达散户情绪处于“极度看多”区间，7天讨论量增长741%，一项约1.7万人参与的投票中57%表示会在黄仁勋离任后抄底（同为平台自家数据）。\n与专业机构的分歧很明显。Baird本周把英伟达下调至中性、目标价下调六成至200美元，理由是2027年数据中心预测可见度下降；郭明錤则认为辞职是“一次性出清事件”。散户买的是“历史上每次抄底都赢”的经验，机构担心的是明年资本开支增速放缓。\n被忽略的风险有三：下周二财报电话会是临时CEO首次面对市场，管理层难以给出完整的长期规划；10年期美债收益率已在5.1%上方，估值锚在上移；Anthropic据报下周上市，可能分流AI板块资金。另外Nebius单日跌近17%、超微电脑跌逾11%，说明AI基建链里并非所有“错杀”都值得接。\n总结：国内外散户都在“抄底”，但国内抄的是替代逻辑和低位题材，海外抄的是龙头本身。两边共同的盲点是利率，这一点比任何CEO变动都更持久。\n来源：韭研公社公开帖子、路透社、TradingView转载的Stocktwits新闻、新华财经、11月12日晚间热点财经邮件（转述已标注）。未捏造引语，统计均来自所列来源。以上内容不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121069849359372574","l":[],"ln":[],"t":["美股","A股港股","AI科技","财报","关税贸易"],"lk":1,"rt":0,"rp":0,"vw":2237},{"id":"2121069844917539145","h":"cnfinancewatch","ts":1794537433,"zh":"热点财经新闻综述｜2026-11-13·早间\n数据时点：截至2026年11月13日07:35（北京时间）。素材来自11月12日20:11的晚间热点财经邮件（本期截稿前邮箱尚未收到11月13日早间版），关键数字已用新华财经、路透、东方财富、澎湃、智通财经等公开报道交叉核对。文中凡写“邮件转述”的，是未逐条核实的口径，请勿当作定论。\n今日判断\n一句话：靴子落地，但利率没放过市场。英伟达周四宣布黄仁勋辞去CEO、总裁及董事职务，CFO克雷斯任临时CEO。股价盘中一度跌约14%，收盘跌4.34%报166.19美元，跌幅大幅收窄；AMD涨5.86%、博通涨5.54%，资金在AI内部换车而非离场。真正的压力来自另一头：特朗普称不需要与伊朗达成协议，WTI原油涨2.94%至89.07美元，10年期美债收益率升至5.105%，美元指数到103.18的19个月高位，期货定价12月加息约29个基点。三大指数各跌0.35%至0.39%，中概金龙指数跌3.09%，阿里巴巴美股跌逾7%。\nA股周四冲高回落，沪指收3655.83点跌0.67%，创业板指收2509.43点跌2.44%，成交约1.93万亿元，超4600只个股下跌，只有科创50涨0.73%。恒指收24008.55点跌1.26%，恒生科技跌2.36%。我们对今天的看法是指数偏弱震荡，结构上国产算力和晶圆代工相对占优，英伟达链和中概互联网继续承压，仓位宜控在中性偏低，不追高位题材。\n三大利多方向（由强到弱）\n第一，国产晶圆代工与算力芯片。这是昨晚最扎实的增量。中芯国际三季度收入31.9亿美元，环比增6.1%，毛利率29.9%，环比提升4.6个百分点，两项都超过此前指引；产能利用率97.3%，接近满产；四季度收入指引环比增4%至6%。叠加外媒报道美国商务部拟把远程调用先进芯片也纳入管制（尚未公布），国产替代的逻辑在加强。周四寒武纪涨超8%，燧原科技涨超13%创上市新高。制约在于：中芯四季度毛利率指引26%至28%，低于三季度实际值；燧原等短期涨幅已大，邮件转述其7天涨约73%，追高的性价比在下降。更稳的做法是关注代工、设备与材料，而不是只盯涨幅最大的芯片设计。\n第二，英伟达之外的AI算力“替代链”。AMD、博通、Arista等周四逆势大涨，郭明錤认为谷歌TPU及其伙伴博通、联发科是近期受益方，并称此事对英伟达产品竞争力的影响最快2028年才显现。对A股的意味是：ASIC、交换机、高速连接等非英伟达单一依赖的环节，估值受冲击小于光模块龙头。制约是美光、闪迪、应用材料周四同样下跌，存储与设备并未全面受益；邮件转述的“美光明年HBM大部分售罄”我们未独立核实。\n第三，防御型内需与增量资金。周四尾盘资金流向银行、机场、公路等红利板块，白酒、零售、水产等逆势走强；邮件转述双11名酒成交同比增约25%，21只基金同日成立、年内新发规模近万亿元；港媒报道港股南向资金周四净流入58.47亿港元。这对低估值高股息与消费龙头形成托底。制约是这类轮动本质是避险，持续性要靠批价、库存和社零数据验证。\n三大利空方向（由强到弱）\n第一，美国利率与美元。10年期美债重回5.1%上方，2年期升至4.867%，美元强、日元一度触及160后急速回弹，市场猜测日本已出手。高利率直接压成长股估值，并对港股与新兴市场资金形成抽离。华泰证券提示港股盈利预期仍在下修，12月还有解禁高峰，不建议追高贝塔品种。\n第二，英伟达链与中概AI平台。光模块、PCB龙头周四午后跳水，邮件转述中际旭创盘中由涨4.7%翻至跌6.1%（精确数字未核）。CoreWeave跌6.86%，Nebius因下调年度营收预期跌16.84%，说明市场开始给AI基建的融资压力定价。阿里巴巴港股跌6.76%、连跌五日。下周二英伟达财报电话会是新管理层首秀，Anthropic据报下周IPO，均可能放大波动。\n第三，油价反弹与题材退潮。国内成品油价格已于12日24时下调，但国际油价随中东表态再度走高，通胀与下一调价窗口方向都偏不利。题材端，周四涨停仅37家，炸板率接近五成，AI漫剧上海电影跌停，大东方被上交所下发监管工作函（邮件转述）。金价跌约3%至3880美元附近，黄金股已连续走弱。\n操作上，优先低位、有业绩验证的国产算力与代工环节，回避高位连板、监管关注股和英伟达单一依赖的高位品种。\n来源：新华财经、路透、东方财富、澎湃新闻、智通财经、星岛日报、TradingView/Stocktwits新闻、11月12日晚间热点财经邮件（转述部分已标注）。以上为研究观点，不构成投资建议。","en":"热点财经新闻综述｜2026-11-13·早间\n数据时点：截至2026年11月13日07:35（北京时间）。素材来自11月12日20:11的晚间热点财经邮件（本期截稿前邮箱尚未收到11月13日早间版），关键数字已用新华财经、路透、东方财富、澎湃、智通财经等公开报道交叉核对。文中凡写“邮件转述”的，是未逐条核实的口径，请勿当作定论。\n今日判断\n一句话：靴子落地，但利率没放过市场。英伟达周四宣布黄仁勋辞去CEO、总裁及董事职务，CFO克雷斯任临时CEO。股价盘中一度跌约14%，收盘跌4.34%报166.19美元，跌幅大幅收窄；AMD涨5.86%、博通涨5.54%，资金在AI内部换车而非离场。真正的压力来自另一头：特朗普称不需要与伊朗达成协议，WTI原油涨2.94%至89.07美元，10年期美债收益率升至5.105%，美元指数到103.18的19个月高位，期货定价12月加息约29个基点。三大指数各跌0.35%至0.39%，中概金龙指数跌3.09%，阿里巴巴美股跌逾7%。\nA股周四冲高回落，沪指收3655.83点跌0.67%，创业板指收2509.43点跌2.44%，成交约1.93万亿元，超4600只个股下跌，只有科创50涨0.73%。恒指收24008.55点跌1.26%，恒生科技跌2.36%。我们对今天的看法是指数偏弱震荡，结构上国产算力和晶圆代工相对占优，英伟达链和中概互联网继续承压，仓位宜控在中性偏低，不追高位题材。\n三大利多方向（由强到弱）\n第一，国产晶圆代工与算力芯片。这是昨晚最扎实的增量。中芯国际三季度收入31.9亿美元，环比增6.1%，毛利率29.9%，环比提升4.6个百分点，两项都超过此前指引；产能利用率97.3%，接近满产；四季度收入指引环比增4%至6%。叠加外媒报道美国商务部拟把远程调用先进芯片也纳入管制（尚未公布），国产替代的逻辑在加强。周四寒武纪涨超8%，燧原科技涨超13%创上市新高。制约在于：中芯四季度毛利率指引26%至28%，低于三季度实际值；燧原等短期涨幅已大，邮件转述其7天涨约73%，追高的性价比在下降。更稳的做法是关注代工、设备与材料，而不是只盯涨幅最大的芯片设计。\n第二，英伟达之外的AI算力“替代链”。AMD、博通、Arista等周四逆势大涨，郭明錤认为谷歌TPU及其伙伴博通、联发科是近期受益方，并称此事对英伟达产品竞争力的影响最快2028年才显现。对A股的意味是：ASIC、交换机、高速连接等非英伟达单一依赖的环节，估值受冲击小于光模块龙头。制约是美光、闪迪、应用材料周四同样下跌，存储与设备并未全面受益；邮件转述的“美光明年HBM大部分售罄”我们未独立核实。\n第三，防御型内需与增量资金。周四尾盘资金流向银行、机场、公路等红利板块，白酒、零售、水产等逆势走强；邮件转述双11名酒成交同比增约25%，21只基金同日成立、年内新发规模近万亿元；港媒报道港股南向资金周四净 4498053,"zh":"路透：美国众议院议长迈克·约翰逊周四表示，在一桩丑闻迫使英伟达首席执行官黄仁勋下台后，国会内部正在就限制向中国出口半导体芯片形成越来越多的共识。\n约翰逊对记者表示：“对华芯片出口管制一直是这里的一个重大议题。我支持限制这些出口，而且我认为国会正在形成一种共识，即这是一个应当采取的重要立场。尤其是考虑到最近的事态发展，这样做是合理的。”","en":"路透：美国众议院议长迈克·约翰逊周四表示，在一桩丑闻迫使英伟达首席执行官黄仁勋下台后，国会内部正在就限制向中国出口半导体芯片形成越来越多的共识。\n约翰逊对记者表示：“对华芯片出口管制一直是这里的一个重大议题。我支持限制这些出口，而且我认为国会正在形成一种共识，即这是一个应当采取的重要立场。尤其是考虑到最近的事态发展，这样做是合理的。”","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HW73bigWEAAU9Cw.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2120904675964653672","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":5,"rt":0,"rp":0,"vw":3874},{"id":"2120904478509691202","h":"fxtrader","ts":1794498006,"zh":"Tom Lee将黄仁勋辞去英伟达职务视为机会，表示仍坚持科技股已于上周见底的观点。“黄仁勋的辞任并不会改变我们的判断”。\n“上周多家知名对冲基金的惨烈亏损与崩溃，正是‘内部底部’已经形成的证据，”“什么是内部底部？意味着出现了大规模的抛售潮和强制平仓。在我看来，上周的下跌某种程度上属于‘黑天鹅’事件，因为对冲基金通常保持‘贝塔中性’，即使科技股下跌，也不应出现如此剧烈的亏损。”\n“更重要的是，历史表明市场往往在坏消息中见底。”","en":"Tom Lee将黄仁勋辞去英伟达职务视为机会，表示仍坚持科技股已于上周见底的观点。“黄仁勋的辞任并不会改变我们的判断”。\n“上周多家知名对冲基金的惨烈亏损与崩溃，正是‘内部底部’已经形成的证据，”“什么是内部底部？意味着出现了大规模的抛售潮和强制平仓。在我看来，上周的下跌某种程度上属于‘黑天鹅’事件，因为对冲基金通常保持‘贝塔中性’，即使科技股下跌，也不应出现如此剧烈的亏损。”\n“更重要的是，历史表明市场往往在坏消息中见底。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2120904478509691202","l":[],"ln":[],"t":["AI科技"],"lk":25,"rt":2,"rp":6,"vw":14382},{"id":"2120904380723691967","h":"fxtrader","ts":1794497983,"zh":"#观察 黄仁勋或许可以回台湾再创造一家伟大的企业。几年后，英伟达收购这家企业，老黄回归。","en":"#观察 黄仁勋或许可以回台湾再创造一家伟大的企业。几年后，英伟达收购这家企业，老黄回归。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2120904380723691967","l":[],"ln":[],"t":["AI科技"],"lk":137,"rt":2,"rp":36,"vw":32628},{"id":"2120903543406346661","h":"fxtrader","ts":1794497783,"zh":"特朗普表示，（苹果）库克应该接替黄仁勋担任英伟达的CEO。","en":"特朗普表示，（苹果）库克应该接替黄仁勋担任英伟达的CEO。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2120903543406346661","l":[],"ln":[],"t":["AI科技"],"lk":54,"rt":1,"rp":11,"vw":15337},{"id":"2120903367786663946","h":"RFI_Cn","ts":1794497742,"zh":"据《信息报》报道，一位曾听到相关言论的前英伟达经理透露称，近年来，黄仁勋曾向一些资深同事表示，他计划执掌英伟达直至120岁。“这家公司30年来都是围绕他建立的，”这位人 VDA 及半导体情绪，预测平台显示数据中心负责人或CFO接任概率最高。医药端三条事件都是FDA档： #礼来 $LLY 口服OSA三期获胜，冲击首个口服OSA批准； #安进 $AMGN 公布干燥综合征三期新结果； #Vir生物 $VIR 三期成功后估值讨论升温。 #强生 $JNJ 有双相躁狂新增长点，属已签约新产品档。 #谷歌 $GOOGL 发布TPU 8tx与TPU 8i Max，在英伟达出事的当口反而值得留意。内部人方面， $TSM 有内部人买入， $FUN 董事买入380万美元，偏中线参考。\n#研报面\n$JNJ 卖方目标价均值287.88美元，区间260到320，买入11家、持有6家、无卖出，但近4周EPS上修6家、下修10家，目标价离现价只有约2.7%空间。 $LLY 本轮未采集到目标价共识，近7日没有大行上调动作。今晚盘后 $AMAT 与 $CSCO 发财报，AMAT预期EPS 4.06，结果会直接影响半导体设备情绪。\n#资金面\nARK方面， $ACHR 获三只基金同买，合计约170万美元； $PRME 获ARKG买入750万美元，占该基金持仓比例达21.47%。带方向的期权共振有五只： $AMGN Call持仓增170.5%、Call成交放量71%； $ACHR Call持仓增3.2%、最大Call行权价5美元距现价约2.8%、P/C成交比0.14； $GOOGL 最大Call行权价300美元距现价约2.2%、P/C成交比0.3； $RKLB Call持仓增6.1%； $VZ Call持仓增2.0%。不算共振的： $LLY 与 $JNJ Call和Put同步增仓，方向对冲； $VIR Put成交放量400%，偏空； $NVDA Call持仓减5.8%。恐慌贪婪指数36.9，仍在恐惧区。\n#期货\n标普、纳指、罗素迷你期货都是价跌OI降，属多头离场，不是新空进场，杀伤力有限。10年与30年美债期货价涨OI降，空头回补，利率端在帮成长股。原油和黄金都是价跌OI降，多头离场。北京时间15:05，原油期货约86.8美元，黄金约3973美元。\n#中美映射\n美股行业ETF 20日涨幅前列： $JETS 16.8%、 $ITB 14.5%、 $SBIO 13.7%、 $IHE 11.6%、 $PHO 11.5%、 $AV 10.9%。近5日： $SBIO 4.3%、 $JETS 2.5%、 $AV 2.5%、 $IHE 1.8%，而 $ITB 5日跌4.8%，住宅建筑已转回调。双窗口同现的是生物医药、航空与航天。A股20日前列有机器人ETF约21%、纳指生物科技ETF约10.4%，生物医药两边20日共振；A股5日窗口本轮数据缺失。今天A股盘中资金从光模块撤到国产芯片，和英伟达风波是同一条线。","en":"美股盘前下午版｜2026-11-12 北京时间15:05\n#结论\n今日大类只看 #生物医药创新，AI硬件只观察不出手。英伟达董事会被曝讨论黄仁勋去留，盘后跌约8.4%，纳指期货北京时间15:05前后较前收跌约0.4%，科技链今晚大概率先消化治理风险。\n如果只做3只： $LLY 排第一，FDA级别事件加颈线附近突破准备； $AMGN 第二，三期新数据加Call增仓共振，离20日高约3%； $VIR 第三，三期成功后的缩量回踩。\n明确不做：英伟达链的抄底单、5日涨幅已超25%的航天小票、只有股息或商品逻辑的标的、期权方向对冲的票。\n#消息面\n最高权重是英伟达治理风波，属于大事件但方向偏空，会压制 $NVDA 及半导体情绪，预测平台显示数据中心负责人或CFO接任概率最高。医药端三条事件都是FDA档： #礼来 $LLY 口服OSA三期获胜，冲击首个口服OSA批准； #安进 $AMGN 公布干燥综合征三期新结果； #Vir生物 $VIR 三期成功后估值讨论升温。 #强生 $JNJ 有双相躁狂新增长点，属已签约新产品档。 #谷歌 $GOOGL 发布TPU 8tx与TPU 8i Max，在英伟达出事的当口反而值得留意。内部人方面， $TSM 有内部人买入， $FUN 董事买入380万美元，偏中线参考。\n#研报面\n$JNJ 卖方目标价均值287.88美元，区间260到320，买入11家、持有6家、无卖出，但近4周EPS上修6家、下修10家，目标价离现价只有约2.7%空间。 $LLY 本轮未采集到目标价共识，近7日没有大行上调动作。今晚盘后 $AMAT 与 $CSCO 发财报，AMAT预期EPS 4.06，结果会直接影响半导体设备情绪。\n#资金面\nARK方面， $ACHR 获三只基金同买，合计约170万美元； $PRME 获ARKG买入750万美元，占该基金持仓比例达21.47%。带方向的期权共振有五只： $AM 有结论均基于上述真实数据，未做任何编造。*\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：\n━━━━━━━━━━━━━\n⭐️⭐️⭐️ 华尔街观察团队 | WSV量化模型 | 不构成投资建议 | 投资有风险 ⭐️⭐️⭐️","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120768058688205209","l":["macaostarbridge.com"],"ln":[{"u":"https://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["美联储","A股港股","AI科技"],"lk":0,"rt":0,"rp":0,"vw":2249},{"id":"2120767876911235104","h":"cnfinancewatch","ts":1794465438,"zh":"研报×数据交叉验证 🔍\n**共振标的1：国产算力链（中信证券研报 × 龙虎榜 × 人气榜 × 韭研）**\n- 研报：中信证券\"国产算力边际向上，聚焦IDC、连接器、交换机低估龙头\"，腾讯阿里Q2资本开支超1200亿环比翻倍。\n- 龙虎榜：燧原科技（688801）涨停净买入2.56亿（2家机构）、光迅科技（002281）涨停净买入2.46亿（2家机构）、沪电股份（002463）涨停净买入3.86亿（3家机构）、东山精密（002384）涨停净买入7.22亿（3家机构）——机构资金集中涌入算力硬件。\n- 人气榜：寒武纪（第13，+8.57%）、剑桥科技（第9，+5.40%）、通富微电（第11，+5.45%）。\n- 韭研：00:51帖子申海光信息/寒武纪，逻辑\"字节向第三方芯片采购比例提升\"。\n- **结论**：研报逻辑与机构龙虎榜、人气榜、韭研热帖四重共振，国产算力是今日最强主线，但需注意中际旭创-6.07%显示光模块内部分化。\n**共振标的2：AI应用/传媒（华泰证券研报 × 龙虎榜 × 人气榜）**\n- 研报：华泰证券\"AI重塑影视、消费级应用、企业组织与互动影游\"。\n- 龙虎榜：果麦文化（301052）涨停净买入2.04亿（1家机构，成功率52.66%）、风语筑（603466）涨停净买入1.79亿（游资）。\n- 人气榜：蓝色光标（第5，+11.87%）。\n- 韭研：10:46帖子锁定AI应用主线，推荐值得买。\n- **结论**：华泰AI应用研报与传媒股龙虎榜、人气榜形成共振，但机构成功率分化（果麦52.66% vs 光迅19.44%），需精选。\n**背离标的：战略金属（中信建投研报 × 盘面）**\n- 研报：中信建投看好钼、锡、钨、钽、铀、铼等战略金属。\n- 盘面：紫金矿业-3.52%明显承压。\n- **结论**：研报偏中长期逻辑，短期资金未定价，属\"研报热、盘面冷\"的背离，需等待催化。\n**银行配置（华泰证券研报 × 盘面）**\n- 研报：华泰看好国有大行配置价值，三季报营收净利双升。\n- 盘面：招商银行+0.23%、平安银行+0.85%小幅收红，防御属性显现。\n- **结论**：弱市中银行股抗跌验证研报逻辑，但弹性有限。","en":"研报×数据交叉验证 🔍\n**共振标的1：国产算力链（中信证券研报 × 龙虎榜 × 人气榜 × 韭研）**\n- 研报：中信证券\"国产算力边际向上，聚焦IDC、连接器、交换机低估龙头\"，腾讯阿里Q2资本开支超1200亿环比翻倍。\n- 龙虎榜：燧原科技（688801）涨停净买入2.56亿（2家机构）、光迅科技（002281）涨停净买入2.46亿（2家机构）、沪电股份（002463）涨停净买入3.86亿（3家机构）、东山精密（002384）涨停净买入7.22亿（3家机构）——机构资金集中涌入算力硬件。\n- 人气榜：寒武纪（第13，+8.57%）、剑桥科技（第9，+5.40%）、通富微电（第11，+5.45%）。\n- 韭研：00:51帖子申海光信息/寒武纪，逻辑\"字节向第三方芯片采购比例提升\"。\n- **结论**：研报逻辑与机构龙虎榜、人气榜、韭研热帖四重共振，国产算力是今日最强主线，但需注意中际旭创-6.07%显示光模块内部分化。\n**共振标的2：AI应用/传媒（华泰证券研报 × 龙虎榜 × 人气榜）**\n- 研报：华泰证券\"AI重塑影视、消费级应用、企业组织与互动影游\"。\n- 龙虎榜：果麦文化（301052）涨停净买入2.04亿（1家机构，成功率52.66%）、风语筑（603466）涨停净买入1.79亿（游资）  #工业富联 $601138：英伟达链条暴露最直接，降为观察，等风波落地。\n#小盘阿尔法\n #德科立 $688205 维持第一版判断：箱体下部反弹，估值约189倍，先看箱体下沿能否站稳。长芯博创控股股东长飞光纤增持至20.00%并拟继续增持不低于2000万元，这是新增的内部人信号，但完整20日K线本档未取全，按规则不纳入，只列观察。\n#操作提示\n第一版的核心判断仍成立，今天不是追涨日，英伟达风波让这一点更确定。9:15看竞价，光模块若集体低开，不要急着抄，等十点前量能和承接；存储看未封板的龙头，机器人看零部件。杠杆资金昨天在加仓，盘中跳水要防踩踏。10月金融数据今日待公布。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120687337931993413","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["AI科技"],"lk":1,"rt":0,"rp":1,"vw":2681},{"id":"2120687163671273754","h":"cnfinancewatch","ts":1794446194,"zh":"A股盘前第二版 11月12日\n先说结论：两小时内最大的变化来自美股盘后。英伟达董事会被曝研究是否撤换黄仁勋，盘后最低报159.10美元，较收盘173.73美元跌8.42%，CoreWeave盘后也回落超6%。隔夜费半5%以上的反弹，有一部分会在今天被这条消息吃掉。三个方向不换，但顺序调整：存储芯片升为第一顺位，人形机器人第二，光模块与PCB降为看竞价再定。六只个股不换，英伟达链条最直接的\n#工业富联 和昨天涨幅最大的两只光模块降为观察。总仓继续中性偏谨慎。\n#消息面 两小时更新\n英伟达这件事是今天开盘前唯一的大变量。公开报道称董事会11月11日已开会讨论黄仁勋去留，正考虑先任命临时首席执行官，并与外部机构物色继任者；白宫最新表态不会干预董事会决定。这是治理风险，不是订单风险，CoreWeave刚上调全年指引，称2027年剩余算力产能获约10倍超额认购，需求端没有坏消息。但A股光模块昨天一天涨了15%以上，最怕的就是情绪面先撤。\n其他新增：MSCI调整结果公布，MSCI中国指数新纳入 #中际旭创 等3只A股，剔除38只，对 #中际旭创\n是被动资金边际利好。存储端，上证报口径称原厂四季度官方价格仍微涨，以企业级为主，消费级未见同步；北京君正称DRAM需求旺盛、产能非常紧张，已对大部分客户完成调价；生益科技称未接到终端取消订单通知。中国船舶子公司签下20艘VLCC、总额约172亿元。珠免集团筹划收购免税公司剩余49%股权，今日停牌。今天中国国际半导体博览会开幕，商务部例行发布会召开。以上为公开报道转述。\n#研报面\n两小时内新出观点：中信证券认为国产算力边际向上，聚焦IDC、连接器、交换机低估龙头；中国银河证券梳理 #东山精密\n光模块与AIPCB双线；华创证券跟踪燧原科技架构迭代；中泰证券称医药产业链景气延续。卖方对大盘分歧明显，国泰海通看缩量震荡酝酿反弹，银河证券认为继续调整概率提升。\n#热榜\n东财人气榜和同花顺热榜本档仍未取到完整排名，标注数据缺失。龙虎榜旁证：11月11日机构席位净买入 #东山精密 $002384\n约4.70亿元、燧原科技约4.35亿元，世运电路、冰山冷热、襄阳轴承也获机构净买入，算力硬件和机器人零部件仍是机构在买的方向。\n#资金面\n两市融资余额增加74.92亿元，杠杆资金昨天是加仓的，这也意味着今天若高开低走，回撤会被放大。北向完整净流入仍未取到，标注数据缺失。\n#中美映射\n双窗口结论不变：半导体与光通信两边都只是5日共振，20日仍在深坑里，是超短脉冲；机器人仍是A股单边双窗口。新增的是英伟达盘后大跌对美股AI硬件今晚开盘构成压力，5日脉冲能否延续要打问号。存储的产业链价格信号是两边共有的，比单纯情绪更扎实。\n#期货 两小时更新\n富时中国A50期货夜盘最后报12982点附近，早间新一轮报价在发稿时尚未形成有效变化。日经225早盘涨0.28%报61419点，涨幅较开盘收窄。美元指数报道称升至19个月高位，现货黄金失守3980美元。集合竞价数据9:15后才有，本稿未写入。\n#三个方向\n第一，存储芯片。原厂四季度官方价格和国内厂商调价都有确认，这是基本面线索，受英伟达人事风波影响最小，升为第一顺位，仍只做未封板、业绩已兑现的。\n第二，人形机器人。北京行动方案落地，机构席位净买入襄阳轴承等零部件，20日加5日双窗口还在，做零部件不做连板。\n第三，光模块与PCB算力硬件。需求逻辑没坏，生益科技否认取消订单， #中际旭创\n获MSCI纳入，但英伟达盘后大跌叠加昨日涨幅过大，今天大概率先受情绪冲击。看竞价，低开不破昨日中位再考虑，高开不追。","en":"A股盘前第二版 11月12日\n先说结论：两小时内最大的变化来自美股盘后。英伟达董事会被曝研究是否撤换黄仁勋，盘后最低报159.10美元，较收盘173.73美元跌8.42%，CoreWeave盘后也回落超6%。隔夜费半5%以上的反弹，有一部分会在今天被这条消息吃掉。三个方向不换，但顺序调整：存储芯片升为第一顺位，人形机器人第二，光模块与PCB降为看竞价再定。六只个股不换，英伟达链条最直接的\n#工业富联 和昨天涨幅最大的两只光模块降为观察。总仓继续中性偏谨慎。\n#消息面 两小时更新\n英伟达这件事是今天开盘前唯一的大变量。公开报道称董事会11月11日已开会讨论黄仁勋去留，正考虑先任命临时首席执行官，并与外部机构物色继任者；白宫最新表态不会干预董事会决定。这是治理风险，不是订单风险，CoreWeave刚上调全年指引，称2027年剩余算力产能获约10倍超额认购，需求端没有坏消息。但A股光模块昨天一天涨了15%以上，最怕的就是情绪面先撤。\n其他新增：MSCI调整结果公布，MSCI中国指数新纳入 #中际旭创 等3只A股，剔除38只，对 #中际旭创\n是被动资金边际利好。存储端，上证报口径称原厂四季度官方价格仍微涨，以企业级为主，消费级未见同步；北京君正称DRAM需求旺盛、产能非常紧张，已对大部分客户完成调价；生益科技称未接到终端取消订单通知。中国船舶子公司签下20艘VLCC、总额约172亿元。珠免集团筹划收购免税公司剩余49%股权，今日停牌。今天中国国际半导体博览会开幕，商务部例行发布会召开。以上为公开报道转述。\n#研报面\n两小时内新出观点：中信证券认为国产算力边际向上，聚焦IDC、连接器、交换机低估龙头；中国银河证券梳理 #东山精密\n光模块与AIPCB双线；华创证券跟踪燧原科技架构迭代；中泰证券称医药产业链景气延续。卖方对大盘分歧明显，国泰海通看缩量震荡酝酿反弹，银河证券认为继续调整概率提升。\n#热榜\n东财人气榜和同花顺热榜本档仍未取到完整排名，标注数据缺失。龙虎榜旁证：11月11日机构席位净买入 #东山精密 $002384\n约4.70亿元、燧原科技约4.35亿元，世运电路、冰山冷热、襄阳轴承也获机构净买入，算力硬件和机器人零部件仍是机构在买的方向。\n#资金面\n两市融资余额增加74.92亿元，杠杆资金昨天是加仓的，这也意味着今天若高开低走，回撤会被放大。北向完整净流入仍未取到，标注数据缺失。\n#中美映射\n双窗口结论不变：半导体与光通信两边都只是5日共振，20日仍在深坑里，是超短脉冲；机器人仍是A股单边双窗口。新增的是英伟达盘后大跌对美股AI硬件今晚开盘构成压力，5日脉冲能否延续要打问号。存储的产业链价格信号是两边共有的，比单纯情绪更扎实。\n#期货 两小时更新\n富时中国A50期货夜盘最后报12982点附近，早间新一轮报价在发稿时尚未形成有效变化。日经225早盘涨0.28%报61419点，涨幅较开盘收窄。美元指数报道称升至19个月高位，现货黄金失守3980美元。集合竞价数据9:15后才有，本稿未写入。\n#三个方向\n第一，存储芯片。原厂四季度官方价格和国内厂商调价都有确认，这是基本面线索，受英伟达人事风波影响最小，升为第一顺位，仍只做未封板、业绩已兑现的。\n第二，人形机器人。北京行动方案落地，机构席位净买入襄阳轴承等零部件，20日加5日双窗口还在，做零部件不做连板。\n第三，光模块与PCB算力硬件。需求逻辑没坏，生益科技否认取消订单， #中际旭创\n获MSCI纳入，但英伟达盘后大跌叠加昨日涨幅过大，今天大概率先受情绪冲击。看竞价，低开不破昨日中位再考虑，高开不追。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120687163671273754","l":[],"ln":[],"t":["美股","A股港股","汇率","AI科技","黄金"],"lk":1,"rt":0,"rp":3,"vw":4111},{"id":"21206838002 it WallStreetBets本期没有直接抓取原帖，相关内容来自搜索结果的二手汇总，下文已单独标注。所有引述只代表个别用户观点，不是统计结论。\n一、国内：算力“强修复”，但情绪已经从高点往下走\n韭研公社11月11日晚到今早讨论最多的仍是CPO、光模块、PCB，其次是存储和机器人。\n真实话题之一是“昨天为什么暴涨”。一位用户在11月11日下午的帖子把原因归为剑桥科技业绩会上的订单与扩产指引、海外算力反弹、禁令担忧缓和等几条催化叠加，并写到板块主力净流入超过116亿元。另一篇复盘笔记称头部光模块厂“2027年订单基本覆盖全年、1.6T需求持续增加”。这些是论坛用户的整理，我没有找到公司公告逐条对应，只能当作市场预期看。\n更有价值的是情绪数据。同一用户的收盘复盘写到：涨停85家、炸板25家、跌停1家，两市成交约16887亿元、较前一日放量约1719亿元，但他自己的情绪读数从前一天77.2降到53.8，晋级率下降、高标断板。换句话说，散户自己也承认这是“权重算力强、题材轮动快”的一天，赚钱集中在少数大票，并不是普涨。\n情绪方向：对 #算力偏多，对追高偏谨慎。和券商口径相比，相同点是都看好光模块和PCB的业绩线；不同点在于，券商更强调海外订单和估值切换，散户更关心第二天能不能接力、谁是补涨。\n被忽略的风险有三点。\n第一，亏钱效应在消费和防御板块：\n复盘里提到白酒、乳业、保险、航空等方向负反馈，说明资金是从这些板块抽出来去打算力，这种跷跷板在主线回调时会反过来。\n第二，高低切换已经很快，昨天的低位补涨股，今天可能就是兑现盘。\n第三，监管分歧：文投控股这类连板股业绩大幅亏损，交易所异动监管随时可能介入，接力资金承担的是政策风险而不只是价格风险。\n二、海外：CoreWeave点燃热情，Anthropic成为散户新焦点\nStocktwits报道显示，#CoreWeave盘前大涨时散户情绪进入“极度看多”区间，讨论量极高；这是平台自己的情绪标签，我没有拿到具体百分比。同一篇报道也列出了冷静的一面：Jefferies把目标价从150美元下调到90美元，理由是估值倍数下调；公司当季净亏损扩大到7.09亿美元。\n英伟达方面，Kiplinger写道华尔街在周三“买跌”，股价涨2.9%，尽管Baird罕见下调评级。散户的讨论主线是黄仁勋风波会不会演变成换帅。据搜索结果的二手汇总，WallStreetBets上有人在下跌后加杠杆 #抄底英伟达，也有人质疑Anthropic估值和现金流；这部分我没有直接看到原帖，不能确认具体说法。\n最大的新话题是Anthropic上市。Reuters援引Vanda Research称， #Anthropic预计11月19日在纳斯达克交易，首日散户净买入可能约2.5亿美元，是SpaceX上市纪录1.18亿美元的约两倍，目标估值最高约1.4万亿美元。散户热度高，本身就是一个风险信号：上市首日散户集中买入、后续锁定期解禁，历来容易出现高开低走。\n三、和券商口径的异同、以及我的提醒\n券商和散户这次难得 #一致看多算力，但关注点不同：券商看订单和指引，散户看情绪和接力。一致性越高，越要防“利好出尽”。\n我的三条提醒：\n一是不要在放量大涨后的第二天开盘追光模块龙头；\n二是消费防御板块已被抽血，若算力回调，这里可能先出现反弹，不宜盲目割肉；\n三是美债收益率仍在5%附近，海外散户再热，利率一抬头也会集体降温。\n来源：韭研公社公开帖子（用户观点）、Stocktwits、Reuters（经WTBX转载）、Kiplinger；WallStreetBets内容为二手汇总已标注。\n以上不构成投资建议。","en":"散户热议｜2026-11-12·早间\n数据时点：北京时间2026年11月12日约07:35–07:50检索。国内主要看韭研公社公开帖子，海外看Stocktwits公开报道和Reuters、Kiplinger关于散户行为的报道。Reddit WallStreetBets本期没有直接抓取原帖，相关内容来自搜索结果的二手汇总，下文已单独标注。所有引述只代表个别用户观点，不是统计结论。\n一、国内：算力“强修复”，但情绪已经从高点往下走\n韭研公社11月11日晚到今早讨论最多的仍是CPO、光模块、PCB，其次是存储和机器人。\n真实话题之一是“昨天为什么暴涨”。一位用户在11月11日下午的帖子把原因归为剑桥科技业绩会上的订单与扩产指引、海外算力反弹、禁令担忧缓和等几条催化叠加，并写到板块主力净流入超过116亿元。另一篇复盘笔记称头部光模块厂“2027年订单基本覆盖全年、1.6T需求持续增加”。这些是论坛用户的整理，我没有找到公司公告逐条对应，只能当作市场预期看。\n更有价值的是情绪数据。同一用户的收 ，位置从坑里变成短线已伸展。只做回撤，不接板。\n第二，存储芯片。闪迪上调NAND合约价，美光和闪迪大涨，A股兆易创新、佰维存储跟涨，但存储概念近20日仍跌7.12%，同样是5日脉冲。公开报道也提到产能排期紧张和消费级涨不动并存，选业绩已经兑现、还没封板的。\n第三，人形机器人。A股20日加5日都在，政策上有北京具身智能方案，研报仍在跟踪苹果、小米等进展。利润还没普遍跟上，三花智控三季报净利同比还掉了5.4%。这条更适合做未加速的零部件，不要去抬连板情绪票。\n#六只个股 #中际旭创 $300308：三季报营收695.47亿元、同比增178.1%，净利222.38亿元、同比增211.8%。昨日涨15.07%报542元，市值约6384亿元，净流入靠前。近60日仍跌约38.8%，是深调后的反弹，不是新高突破。完整20日K线分位本轮未取全，按短线已伸展处理，回撤再做，失效应看量能是否迅速萎缩。\n#新易盛 $300502：三季报营收318.50亿元、同比增93.0%，净利113.72亿元、同比增79.7%。昨日涨16.97%报215元，净流入约30.5亿元居首。20日位置约在区间下部33.9%，仍在20日均线下方，但单日涨幅过大。触发是放量反弹确认，失效是高开低走把阳线吞掉。\n#沪电股份 $002463：三季报营收232.25亿元、同比增71.9%，净利56.22亿元、同比增106.9%，PCB里业绩更干净。昨日涨停报89.43元，20日位置约37%，仍低于20日均线。涨停板今天不追，等板打开再看。\n#兆易创新 $603986：存储里更合适的位置。三季报营收202.97亿元、同比增197.1%，净利110.66亿元、同比增921.5%。昨日涨6.15%报259.62元，未封板，市值约1828亿元、市盈率约12.4倍。近20日跌11.26%，近5日仍跌4.33%，属于坑里修复。触发看能否站稳反弹高点附近，失效是重新跌破11月6日低点一带。\n#三花智控 $002050：机器人加液冷的交叉点，华安证券11月11日维持买入。昨日涨2.83%报36.35元，近20日涨16.2%，位置已到20日区间约94.7%的高位，短线已偏伸展。三季报营收同比只增5.2%，净利同比降5.4%，故事在、利润还没跟上。可以跟踪，不宜再追高。\n#工业富联 $601138：算力代工里相对没那么热的大盘票。三季报营收9414.14亿元、同比增55.9%，净利403.75亿元、同比增79.5%。昨日涨5.51%报45.56元，市值约9041亿元，近60日仍跌约31%。完整20日分位本轮未取全，作为观察仓，不把它写成已经突破。\n#小盘阿尔法 #德科立 $688205：光模块产业链偏上游，市值约167亿元。三季报营收7.93亿元、同比增21.6%，净利0.67亿元、同比增65.9%，扣非只有0.28亿元，利润体量仍小，市盈率约189倍，估值不便宜。20日K线位置约在区间23.3%，距离9月高点仍回撤约54%，属于箱体下部的反弹。昨日涨8.96%，已经走了一截。先观察箱体下沿能否站稳，不把高估值小利润的票当成确定性机会。长芯博创等中小光器件完整20日K线本轮未取全，按规则不纳入。\n#操作提示 今天不是追涨日。隔夜美股反弹给了情绪，但A股昨天已经把最容易涨的一段走掉了。总仓中性，涨停板只当温度计。光模块、PCB、存储等回撤再做，封板的和一天涨超15%的先让一让；机器人看零部件不看连板情绪；AI眼镜和消费电子先观察。开盘后先看量能能不能接住，接不住就是冲高回落。10月金融数据待公布，公布前不要把宏观假设做满。美债昨天休市，利率定价还停在CPI那一晚。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅","en":"#三个方向 第一，光模块与PCB算力硬件。隔夜费半大涨、CoreWeave上调指引，国内又有砍单不实的公司口径，逻辑还在。但CPO、光模块、PCB的20日仍跌10%到13%，昨日龙头一天涨了15%上下，多只涨停，位置从坑里变成短线已伸展。只做回撤，不接板。\n第二，存储芯片。闪迪上调NAND合约价，美光和闪迪大涨，A股兆易创新、佰维存储跟涨，但存储概念近20日仍跌7.12%，同样是5日脉冲。公开报道也提到产能排期紧张和消费级涨不动并存，选业绩已经兑现、还没封板的。\n第三，人形机器人。A股20日加5日都在，政策上有北京具身智能方案，研报仍在跟踪苹果、小米等进展。利润还没普遍跟上，三花智控三季报净利同比还掉了5.4%。这条更适合做未加速的零部件，不要去抬连板情绪票。\n#六只个股 #中际旭创 $300308：三季报营收695.47亿元、同比增178.1%，净利222.38亿元、同比增211.8%。昨日涨15.07%报542元，市 费城半导体涨5.66%。CoreWeave三季度营收高于预期并上调全年指引，股价涨24.71%；英伟达收涨2.87%报173.73美元，结束此前两日约10%的跌幅；美光涨11.89%，闪迪涨13.69%，AMD涨7.32%。微软跌2.26%，苹果涨2.04%。当晚美国债市因退伍军人节休市，利率没有新报价；前一交易日10年期美债收益率约在4.99%、2年期约4.74%，12月加息25个基点仍被充分定价。COMEX黄金约3994美元、跌0.89%；WTI原油约86.42美元、涨0.44%。离岸人民币约6.67。\nA股11月11日沪指涨0.46%报3680.64点，深成指涨1.32%，创业板指涨3.11%报2572.07点，科创50涨2.80%，上证50跌0.27%；两市成交约1.68万亿元，较前一日放量约1715亿元，上涨超过3500只，涨停约85只。新易盛涨16.97%报215元，中际旭创涨15.07%报542元，天孚通信涨13.96%；沪电股份、东山精密、光迅科技、深南电路涨停，源杰科技20CM涨停。存储午后跟涨，白酒调整，酒ETF跌2.91%。恒生指数11月11日收跌0.98%，收盘早于美股反弹，今日港股要重新定价。日经11月11日涨1.31%，韩国KOSPI涨2.60%。\n央行11月11日发布三季度货币政策执行报告，提出加力实施支持资本市场两项工具。光通信“砍单”传闻方面，公开报道称多家上市公司回应没有不利变化；微软游说美国政府放弃拟议中的中国光收发器进口禁令，仍是产业阻力的线索，不是禁令已经取消。存储侧，公开报道称闪迪11月10日将NAND合约价上调50%，为年内第三次。北京印发具身智能机器人产业方案，提出新增超过50000PFlops专用算力集群。以上均为公开信息转述。今日将公布中国10月金融数据，时间未定。\n#研报面 最近三个交易日公开口径：11月11日华安证券维持三花智控买入，理由是收入增速回升，液冷与机器人业务稳步推进；东吴证券强调AI加制造、国产替代与具身智能共振；华龙证券转述苹果HALO跑通仿真到真实环境的泛化链路；国元证券提及小米机器人验证8小时作业。11月10日中邮证券给奥士康买入，逻辑落在算力PCB起量；国金证券电子行业维持买入，称市场已充分反映悲观预期；华安证券继续把物理AI作为下一风口。中信建投等公开观点仍看好2027年800G、1.6T需求，属研报转述。\n#热榜 东财人气榜和同花顺热榜本轮未能取到完整排名，改用涨停池和主力净流入作热度旁证。11月11日涨停约85只，集中在光模块、PCB、光纤和部分机器人、AI影视。主力净流入前排是新易盛约30.5亿元、中际旭创约29.9亿元、东山精密约23.2亿元、天孚通信约16.9亿元、长鑫科技约16.6亿元、兆易创新约12.5亿元、沪电股份约10.9亿元，和光模块、PCB、存储能对上。高位连板仍在，但资金明显在向低位算力切换。\n#资金面 11月11日两市成交约1.68万亿元，放量约1715亿元，增量主要进了算力硬件。北向资金完整净流入本轮未能取到，标注数据缺失。风格上创业板和科创强、上证50和白酒弱，是风险偏好回升，不是权重普涨。\n#中美映射 半导体与光通信是5日共振，不是20日共振。美股SMH近20日跌10.23%、近5日仅涨0.53%，11月11日单日涨4.82%；A股半导体ETF近20日跌5.71%、近5日涨4.79%，通信ETF近20日跌15.35%、近5日涨3.42%，CPO概念近20日跌12.92%、近5日涨6.54%，PCB近20日跌10.10%、近5日涨4.82%。两边都是深调之后的超短脉冲，仅5日等于短线脉冲，慎追。\n机器人是A股单边的双窗口。机器人ETF近20日涨11.44%、近5日涨3.90%，人形机器人、减速器、执行器的20日和5日同时靠前；美股BOTZ 11月11日涨2.09%，近20日仍约跌5.5%，还没有趋势共振。消费电子ETF近20日跌3.78%、近5日涨2.59%，昨日立讯精密平盘、歌尔股份跌2.14%，资金已经切走。黄金两边都弱，继续观察。\n#期货 富时中国A50期指当月连续约报12980点，涨0.07%；沪深300期指夜盘约报4067点，较11月11日日盘收盘4043点上涨约0.6%，对早盘略偏积极，但升幅有限。COMEX黄金约3994美元、跌0.89%，国内黄金ETF11月11日跌约1.3%；WTI约86.42美元、涨0.44%。国内SC原油夜盘公开报道收涨2.26%、报597.30元/桶，沪金夜盘跌1.30%。股指期货量能与持仓增减的完整口径本轮未取全，不作多空定性。","en":"A股盘前第一版 11月12日\n先说结论：隔夜美股靠CoreWeave超预期和半导体反弹收复失地，纳指涨1.60%，费城半 120569836304523342","h":"business","ts":1794418221,"zh":"到目前为止，对于美国政治和科技行业来说，这是重要的一个月。民主党在全国范围内取得了压倒性胜利，对人工智能的持续发展提出了质疑。英伟达对首席执行官黄仁勋与一名涉嫌中国间谍的恋情展开调查。有很多事情让投资者感到紧张，但随着市场等待即将到来的 Anthropic IPO，我们看到了科技股的反弹。\n彭博社的迈克尔·鲍尔 (Michael Ball) 与 @TheStalwart 和 @tracyalloway 一起参与 Odd Lot 播客，揭示为何科技行业在宏观经济动荡的情况下仍表现出韧性。请访问 收听或观看","en":"It’s been a big month so far for American politics and the tech industry. Democrats deliver a sweeping win across the country, calling continued AI development into question. Nvidia launches an investigation into CEO Jensen Huang’s affair with an alleged Chinese spy. There are plenty of things to make investors jittery, yet we’re seeing a tech rally as markets await the upcoming Anthropic IPO.\nBloomberg’s Michael Ball joins @TheStalwart and @tracyalloway on the Odd Lots podcast to unpack why the tech trade is showing resilience despite macro jitters. Listen at or watch at","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2120566841705680896/vid/avc1/1080x1920/QJYoYh9LDO0hV3YB.mp4?tag=16"],"u":"https://x.com/business/status/2120569836304523342","l":["bit.ly","Bloomberg.com"],"ln":[{"u":"http://bit.ly/3PsKJKY","d":"bit.ly"},{"u":"http://Bloomberg.com/video","d":"Bloomberg.com"}],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":13716},{"id":"2120569789324173626","h":"business","ts":1794418210,"zh":"英伟达表示，建设数据中心的公司需要以吸引当地社区的方式进行建设。","en":"Nvidia says the companies building data centers need to do so in ways that appeal to local communities.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120569789324173626","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-11/nvidia-says-data-centers-should-be-an-asset-to-communities?taid=6af4a622191e680001d3d706&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2120568497113604278","h":"business","ts":1794417902,"zh":"安迪·伯纳姆是否打算放弃英国多年的气候领导地位？他将作为欧洲国家唯一的领导人前往 COP31，但人们担心他将如何利用在那里的时间。通过@allegrastratton获取读数","en":"Is Andy Burnham about to throw away the UK’s years of climate leadership? He’s heading to COP31 as the only leader of a European nation, yet there are fears with how he’ll use his time there. Get the Readout with @allegrastratton","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120568497113604278","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-11/is-andy-burnham-going-to-cop-out?taid=6af4a4ee22159d00010a0f34&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":2,"rp":1,"vw":9348},{"id":"2120567249148706977","h":"business","ts":1794417605,"zh":"以下是投资者在未来几天应该关注的五件事。 Five-things-to-watch?taid=6af4a3c522159d00010a0f25&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Here are five things investors should be looking for in the days ahead.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120567249148706977","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-11/what-s-next-for-anthropic-s-mega-ipo-five-things-to-watch?taid=6af4a3c522159d00010a0f25&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":1,"rp":0,"vw":9973},{"id":"2120566704061526503","h":"cnfinancewatch","ts":1794417475,"zh":"感觉很善良的一片帖子：\n他的妻子65岁 🇺🇸\n他们已经结婚41年了。\n作为早期的微芯片设计师，据报道她赚的钱更多\n她为了抚养他们的两个孩子而完全离开了工程工作，而黄仁勋则从一家小型初创公司起步打造了英伟达。❤️\n她和黄仁勋相识时，她是俄勒冈州立大学一个约250人的电气工程班里仅有的三名女生之一。\n黄仁勋17岁时走到19岁的洛丽（他的妻子）面前，问道：“你想看看我的作业吗？”\n他承诺，如果她每个周日都和他一起学习，她就会门门得A，这让那些周日的作业时光变成了每周的约会。\n大约在同一时期，他还告诉她，他会在30岁时成为CEO。这个承诺他兑现了：1993年，30岁的他联合创立了英伟达。\n黄仁勋曾多次把与她相识的那天称为他“击败了班上其他250个男生，赢得了她的芳心”的日子\n他们于1985年结婚，同年她完成了电气工程学位，随后在惠普设计微芯片。\n他们的女儿黄敏珊曾接受厨师培训并担任厨师，后来成为英伟达的高级总监。如今她以“家庭问题”为由，取消了前往首尔参加英伟达AI日的行程。\n他们的儿子黄胜斌在台北经营一家鸡尾酒吧多年，后来最终也在英伟达负责管理机器人软件。\n她担任黄仁勋与洛丽·黄基金会的主席，该基金会由他们于2007年创立，已捐出数亿美元。\n2022年，这对夫妇向俄勒冈州立大学（他们相识的校园）捐赠了5000万美元，用于建立一座以两人名字命名的人工智能与机器人创新综合大楼。\n黄仁勋曾说，洛丽和他们的女儿为他打理穿着，包括那件标志性的黑色皮夹克。\n他曾公开称赞她是操持家庭的那个人（“洛丽打理了一切”），并且抚养了孩子，让他得以专注于打造英伟达。\n四十多年来，她几乎完全保持着私密的个人形象，同时一直陪伴着一家如今市值数万亿美元的公司的创立。\n.\n.\n.\n.\n目前正在发生的事情相当令人难过，洛丽·黄一定心碎不已。\n40多年来，她一直保持着极其低调和私密的形象，但现在她在网上随处可见，而且并不是出于好的原因。\n她是一位低调的慈善家，为了专心养育子女而离开了自己的工程事业。黄仁勋甚至开玩笑说，孩子们90%的养育工作都是她做的。\n想象一下，一位女性曾经只是约250名工程专业学生中的三名女生之一……如今却不得不离开那份工程事业，专注于家庭。\n.\n.\n黄仁勋也已承担起责任，在致每一位英伟达员工的信中公开向妻子道歉：“我的行为伤害了她和我们的孩子。我所做的事情没有任何借口。我深感抱歉。”\n他的妻子65岁。黄仁勋63岁。\n在这个本该一起享受平稳退休生活的年纪考虑离婚，对洛丽来说可能会很沉重。\n我个人觉得，她正处于一个任何人都绝对不想陷入的处境。更不用说现在这件事已经公开，往后无论她做出什么决定，网上的陌生人都会试图羞辱她。\n.\n.\n.\n总之，我希望他们的2个孩子安好。\n看着爸爸妈妈因为这些原因登上网络热搜，绝对不是任何孩子想要的。\n我真心希望他们能得到所需的情感支持，无论他们多大。他们仍然是妈妈和爸爸的儿子和女儿，这对他们来说也会很沉重。\n.\n.\n.\n我祝愿黄家在这段艰难时期获得他们所需的一切平静与情感上的安全。\n.\n.\n非常感谢您的阅读 🫂\n.\n.\n✍️ 用心撰写","en":"感觉很善良的一片帖子：\n他的妻子65岁 🇺🇸\n他们已经结婚41年了。\n作为早期的微芯片设计师，据报道她赚的钱更多\n她为了抚养他们的两个孩子而完全离开了工程工作，而黄仁勋则从一家小型初创公司起步打造了英伟达。❤️\n她和黄仁勋相识时，她是俄勒冈州立大学一个约250人的电气工程班里仅有的三名女生之一。\n黄仁勋17岁时走到19岁的洛丽（他的妻子）面前，问道：“你想看看我的作业吗？”\n他承诺，如果她每个周日都和他一起学习，她就会门门得A，这让那些周日的作业时光变成了每周的约会。\n大约在同一时期，他还告诉她，他会在30岁时成为CEO。这个承诺他兑现了：1993年，30岁的他联合创立了英伟达。\n黄仁勋曾多次把与她相识的那天称为他“击败了班上其他250个男生，赢得了她的芳心”的日子\n他们于1985年结婚，同年她完成了电气工程学位，随后在惠普设计微芯片。\n他们的女儿黄敏珊曾接受厨师培训并担任厨师，后来成为英伟达的高级总监。如今她以“家庭问题”为由，取消了前往首尔参加英伟达AI日的行程。\n他们的儿子黄胜斌在台北经营一家鸡尾酒吧多年，后来最终也在英伟达负责管理机器人软件。\n她担任黄仁勋与洛丽·黄基金会的主席，该基金会由他们于2007年创立，已捐出数亿美元。\n2022年，这对夫妇向俄勒冈州立大学（他们相识的校园）捐赠了5000万美元，用于建立一座以两人名字命名的人工智能与机器人创新综合大楼。\n黄仁勋曾说，洛丽和他们的女儿为他打理穿着，包括那件标志性的黑色皮夹克。\n他曾公开称赞她是操持家庭的那个人（“洛丽打理了一切”），并且抚养了孩子，让他得以专注于打造英伟达。\n四十多年来，她几乎完全保持着私密的个人形象，同时一直陪伴着一家如今市值数万亿美元的公司的创立。\n.\n.\n.\n.\n目前正在发生的事情相当令人难过，洛丽·黄一定心碎不已。\n40多年来，她一直保持着极其低调和私密的形象，但现在她在网上随处可见，而且并不是出于好的原因。\n她是一位低调的慈善家，为了专心养育子女而离开了自己的工程事业。黄仁勋甚至开玩笑说，孩子们90%的养育工作都是她做的。\n想象一下，一位女性曾经只是约250名工程专业学生中的三名女生之一……如今却不得不离开那份工程事业，专注于家庭。\n.\n.\n黄仁勋也已承担起责任，在致每一位英伟达员工的信中公开向妻子道歉：“我的行为伤害了她和我们的孩子。我所做的事情没有任何借口。我深感抱歉。”\n他的妻子65岁。黄仁勋63岁。\n在这个本该一起享受平稳退休生活的年纪考虑离婚，对洛丽来说可能会很沉重。\n我个人觉得，她正处于一个任何人都绝对不想陷入的处境。更不用说现在这件事已经公开，往后无论她做出什么决定，网上的陌生人都会试图羞辱她。\n.\n.\n.\n总之，我希望他们的2个孩子安好。\n看着爸爸妈妈因为这些原因登上网络热 称为“狗狗节”（Kukur Puja），这一天专门用来礼敬狗狗。人们通过为狗狗戴上鲜花花环、献上美食，并在它们的额头点上朱红色吉祥颜料，以表达敬意和祝福。#RFI360","en":"在尼泊尔，排灯节（Diwali）期间的第二天，也被称为“狗狗节”（Kukur Puja），这一天专门用来礼敬狗狗。人们通过为狗狗戴上鲜花花环、献上美食，并在它们的额头点上朱红色吉祥颜料，以表达敬意和祝福。#RFI360","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2120519428588576769/vid/avc1/1080x1920/bD6C3NBbpJ4-NPJ-.mp4?tag=29"],"u":"https://x.com/RFI_Cn/status/2120519780134240497","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":524},{"id":"2120519428664144262","h":"business","ts":1794406203,"zh":"知情人士称，在反情报评估显示数据可能被收集和传播后，德国军方禁止使用中国制造的无人机，并禁止某些车辆进入基地","en":"Germany’s military banned Chinese-made drones and prohibited certain vehicles from bases after a counterintelligence assessment showed that data was potentially being collected and disseminated, people familiar with the matter said","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120519428664144262","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-11/german-army-bans-chinese-drones-and-cars-from-military-bases?taid=6af4773b7186690001443cf1&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":1,"rp":0,"vw":11938},{"id":"2120519210774458650","h":"cnfinancewatch","ts":1794406151,"zh":"你以为越南过冬首选是芽庄？错！它连前二都进不去。\n按「旱季暖阳 + 旅居低价 + 康养舒服度」排硬核趣味榜：\n第 5｜大叻：高原如春清凉款，冬日常温 15–22℃，云海漫山、鲜花不断，负氧拉满，专门怕酷热、偏爱慢节奏喝咖啡静养的人。法式山城，菜市场全是有机果蔬，租房便宜。短板：夜里偏凉，不是下海挂，怕冷要备薄外套。\n第 4｜岘港：中产友好海滨款，冬末稳定 20–27℃，美溪白沙滩、山茶半岛、会安灯笼古镇一键打包，医院商超成熟，华人多、吃的顺口。适合带家人长住，航班多进出方便。⚠️ 12 月上旬容易遇阴雨，最好等到 1 月之后再来。\n第 3｜芽庄：老牌阳光海岸，全年超 300 天日照，冬季 24–29℃，海水平稳适合游泳潜水，俄罗斯候鸟扎堆，配套成熟，海鲜大排档遍地。适合爱热闹、喜欢出海玩的人。缺点：旺季人挤，海边部分区域嘈杂。\n第 2｜美奈（平顺潘切）：干热避寒黑马，越南日照天花板，冬季 25–31℃，极少阴雨，一半大海一半沙丘，滑沙、风筝冲浪、仙女溪拍照。物价碾压芽庄、富国，长租性价比爆炸。人少安静，适合躺平。短板：没有大型三甲，医疗偏弱。\n第 1｜#富国岛：越南过冬断层第一，旱季 26–32℃，白沙滩细腻，海水透亮，能浮潜、出海、逛胡椒园，直飞方便，岛上商超医院齐全。可以短袖过冬，游客密度低于泰国海岛。唯一坑：春节前后房租暴涨，早点锁房。\n记住：没有万能越南过冬地。想下海躺平选富国，偏爱干爽安静选美奈，喜欢清凉看花就蹲大叻；签证、租房、蚊虫提前搞定，远比死磕第一名舒服。\nSave this list；转给打算南下避寒的朋友；Like & Retweet，别让这份暖冬清单躺在收藏夹吃灰。\n#Vietnam #避寒旅居 #富国岛 #美奈 #越南过冬","en":"你以为越南过冬首选是芽庄？错！它连前二都进不去。\n按「旱季暖阳 + 旅居低价 + 康养舒服度」排硬核趣味榜：\n第 5｜大叻：高原如春清凉款，冬日常温 15–22℃，云海漫山、鲜花不断，负氧拉满，专门怕酷热、偏爱慢节奏喝咖啡静养的人。法式山城，菜市场全是有机果蔬，租房便宜。短板：夜里偏凉，不是下海挂，怕冷要备薄外套。\n第 4｜岘港：中产友好海滨款，冬末稳定 20–27℃，美溪白沙滩、山茶半岛、会安灯笼古镇一键打包，医院商超成熟，华人多、吃的顺口。适合带家人长住，航班多进出方便。⚠️ 12 月上旬容易遇阴雨，最好等到 1 月之后再来。\n第 3｜芽庄：老牌阳光海岸，全年超 300 天日照，冬季 24–29℃，海水平稳适合游泳潜水，俄罗斯候鸟扎堆，配套成熟，海鲜大排档遍地。适合爱热闹、喜欢出海玩的人。缺点：旺季人挤，海边部分区域嘈杂。\n第 2｜美奈（平顺潘切）：干热避寒黑马，越南日照天花板，冬季 25–31℃，极少阴雨，一半大海一半沙丘，滑沙、风筝冲浪、仙女溪拍照。物价碾压芽庄、富国，长租性价比爆炸。人少安静，适合躺平。短板：没有大型三甲，医疗偏弱。\n第 1｜#富国岛：越南过冬断层第一，旱季 26–32℃，白沙滩细腻，海水透亮，能浮潜、出海、逛胡椒园，直飞方便，岛上商超医院齐全。可以短袖过冬，游客密度低于泰国海岛。唯一坑：春节前后房租暴涨，早点锁房。\n记住：没有万能越南过冬地。想下海躺平选富国，偏爱干爽安静选美奈，喜欢清凉看花就蹲大叻；签证、租房、蚊虫提前搞定，远比死磕第一名舒服。\nSave this list；转给打算南下避寒的朋友；Like & Retweet，别让这份暖冬清单躺在收藏夹吃灰。\n#Vietnam #避寒旅居 #富国岛 #美奈 #越南过冬","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HW2Y5dQbYAAZKj_.png?name=orig","https://pbs.twimg.com/media/HW2Y744bcAAN9AR.png?name=orig","https://pbs.twimg.com/media/HW2Y-u3a0AAuhJV.png?name=orig"],"u":"https://x.com/cnfinancewatch/status/2120519210774458650","l":[],"ln":[],"t":["通胀"],"lk":0,"rt":0,"rp":0,"vw":917},{"id":"2120518778534441002","h":"business","ts":1794406048,"zh":"“人工智能是一场非凡的技术革命，它绝对不是泡沫。”\n人工智能先驱李开复与 Francine Lacqua 讨论万亿美元的人工智能估值是否合理","en":"“Artificial intelligence is a phenomenal technology revolution, it’s absolutely not a bubble.”\nAI pioneer Kai-Fu Lee discusses whether trillion-dollar AI valuations can be justified with Francine Lacqua","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2120518686045810688/vid/avc1/1080x1920/tup48Q7DraaOEQAf.mp4?tag=16"],"u":"https://x.com/business/status/2120518778534441002","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/4iL5Jr0","d":"bloom.bg"}],"t":["汇率","AI科技"],"lk":13,"rt":1,"rp":2,"vw":13644},{"id":"2120518427127185444","h":"cnfinancewatch","ts":1794405965,"zh":"你以为云南过冬首选是大理？错。它连前二都进不去。\n按 “暖冬体感 + 旅居成本 + 康养舒服度” 排个趣味榜，每一处主打功效写清楚：\n第 5｜#元谋：干热河谷平价暖阳款，冬日稳定 10–24℃，日照极足，干燥少湿，专门适合受不了南方湿冷、有鼻炎、怕关节闷潮的人。成昆动车直达，菜市场鲜果蔬菜便宜，租房门槛低。早晚温差巨大，一早一晚一定要添外套，娱乐项目不多，适合安静静养。\n第 4｜#普洱（思茅）：绿海茶林氧吧，冬日常温 12–22℃，森林密布，负氧充足，茶香漫城，节奏缓慢，没有拥挤人流中国气象局。适合偏爱喝茶、散步、低强度康养，不想被网红打卡打扰的人。物价友好，小城安逸；短板是医疗配套一般，雨季湿气偏重。\n第 3｜#芒市：边陲东南亚风暖城，冬日白天稳定 22℃上下，傣味美食扎堆，大金塔、树包塔氛围感拉满，阳光柔和不灼人。节奏松弛，物价远低于版纳，适合吃货、喜欢慢悠悠逛街闲逛。属于舒服耐看型，大规模景点不多，适合长住而不是走马观花。\n第 2｜#元江：河谷干热避寒黑马，冬季 14–26℃，云南少有的干爽暖冬，热带水果源源不断，温泉散落周边，人比版纳少一大截。中老铁路通达，租房性价比极高，怕冷又讨厌潮湿的候鸟很爱这里。小城体量偏小，商业配套有限，更适合躺平旅居。\n第 1｜西双版纳（景洪）：云南过冬断层第一，冬季 15–27℃，正宗热带雨林，穿短袖过冬，配套成熟，医院商超齐全，告庄、傣寨、植物园玩法丰富，热闹有人气，老少都适配。短住长住都合适，热带植被养人；缺点很实在，春节前后人挤人，房租物价直接上浮，湿度偏高。\n记住：没有万能云南过冬地。喜欢热闹繁华选版纳，偏爱干爽安静选元江，爱吃美食选芒市；接受昼夜温差、备好防晒，远比死磕第一名更舒服。\n保存这份清单；转给打算去云南过冬的家人；点赞收藏，别让这份暖冬方案只躺在收藏夹里。","en":"你以为云南过冬首选是大理？错。它连前二都进不去。\n按 “暖冬体感 + 旅居成本 + 康养舒服度” 排个趣味榜，每一处主打功效写清楚：\n第 5｜#元谋：干热河谷平价暖阳款，冬日稳定 10–24℃，日照极足，干燥少湿，专门适合受不了南方湿冷、有鼻炎、怕关节闷潮的人。成昆动车直达，菜市场鲜果蔬菜便宜，租房门槛低。早晚温差巨大，一早一晚一定要添外套，娱乐项目不多，适合安静静养。\n第 4｜#普洱（思茅）：绿海茶林氧吧，冬日常温 12–22℃，森林密布，负氧充足，茶香漫城，节奏缓慢，没有拥挤人流中国气象局。适合偏爱喝茶、散步、低强度康养，不想被网红打卡打扰的人。物价友好，小城安逸；短板是医疗配套一般，雨季湿气偏重。\n第 3｜#芒市：边陲东南亚风暖城，冬日白天稳定 22℃上下，傣味美食扎堆，大金塔、树包塔氛围感拉满，阳光柔和不灼人。节奏松弛，物价远低于版纳，适合吃货、喜欢慢悠悠逛街闲逛。属于舒服耐看型，大规模景点不多，适合长住而不是走马观花。\n第 2｜#元江：河谷干热避寒黑马，冬季 14–26℃，云南少有的干爽暖冬，热带水果源源不断，温泉散落周边，人比版纳少一大截。中老铁路通达，租房性价比极高，怕冷又讨厌潮湿的候鸟很爱这里。小城体量偏小，商业配套有限，更适合躺平旅居。\n第 1｜西双版纳（景洪）：云南过冬断层第一，冬季 15–27℃，正宗热带雨林，穿短袖过冬，配套成熟，医院商超齐全，告庄、傣寨、植物园玩法丰富，热闹有人气，老少都适配。短住长住都合适，热带植被养人；缺点很实在，春节前后人挤人，房租物价直接上浮，湿度偏高。\n记住：没有万能云南过冬地。喜欢热闹繁华选版纳，偏爱干爽安静选元江，爱吃美食选芒市；接受昼夜温差、备好防晒，远比死磕第一名更舒服。\n保存这份清单；转给打算去云南过冬的家人；点赞收藏，别让这份暖冬方案只躺在收藏夹里。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120518427127185444","l":[],"ln":[],"t":["通胀"],"lk":0,"rt":2,"rp":1,"vw":1092},{"id":"2120518166845571477","h":"business","ts":1794405902,"zh":"对于研究人工智能是否会提升或消除就业机会的经济学毕业生来说，这一威胁已经触手可及","en":"For economics graduates studying whether AI will elevate or eliminate jobs, the threat hits home","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120518166845571477","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-11/top-economists-cl d to navigate the COVID-19 pandemic were those that planned ahead, built resilient systems and invested in trusted relationships.\nNow, as AI, geopolitical fragmentation, energy constraints, demographic shifts and severe weather reshape the global economy, resilience is becoming a competitive imperative.\nCo-chaired with @MarshGlobal, the #BloombergNewEconomy Competitive Resilience Coalition is helping leaders anticipate disruption, identify opportunity and sustain growth through profound change.\nLearn More:","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2120320321949499392/vid/avc1/1280x720/Ao_ujWO2hQcSVJOV.mp4?tag=16"],"u":"https://x.com/BBGNewEconomy/status/2120516901503644039","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/3ULa7yb","d":"bloom.bg"}],"t":["原油能源","AI科技"],"lk":9,"rt":2,"rp":1,"vw":5040},{"id":"2120516512020824181","h":"cnfinancewatch","ts":1794405508,"zh":"要说国内最适合 #过冬的地方：\n三亚是有钱的过冬，\n西双版纳是懂生活的过冬，\n北海是预算有限的过冬，\n普洱是偏爱安静的过冬，\n漳州是爱吃的过冬，\n攀枝花是怕冷又怕潮的过冬，\n海口是想离大陆近一点的过冬，\n只有江浙沪，是硬扛过冬。","en":"要说国内最适合 #过冬的地方：\n三亚是有钱的过冬，\n西双版纳是懂生活的过冬，\n北海是预算有限的过冬，\n普洱是偏爱安静的过冬，\n漳州是爱吃的过冬，\n攀枝花是怕冷又怕潮的过冬，\n海口是想离大陆近一点的过冬，\n只有江浙沪，是硬扛过冬。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120516512020824181","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":1273},{"id":"2120516492139675753","h":"RFI_Cn","ts":1794405503,"zh":"美国商务部推迟将Megaspeed列入贸易黑名单\n据金融时报透露，与英伟达首席执行官黄仁勋有染且被美国情报官员认为是中国女谍的黄乐所在公司Megaspeed，迟迟未被美国商务部列入“实体清单”","en":"美国商务部推迟将Megaspeed列入贸易黑名单\n据金融时报透露，与英伟达首席执行官黄仁勋有染且被美国情报官员认为是中国女谍的黄乐所在公司Megaspeed，迟迟未被美国商务部列入“实体清单”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/RFI_Cn/status/2120516492139675753","l":["rfi.my"],"ln":[{"u":"https://rfi.my/DDBr","d":"rfi.my"}],"t":["AI科技","关税贸易"],"lk":0,"rt":0,"rp":0,"vw":1037},{"id":"2120516384291745958","h":"RFI_Cn","ts":1794405477,"zh":"泽连斯基致敬美国态度“变化”后 俄乌谈判进入第二天","en":"泽连斯基致敬美国态度“变化”后 俄乌谈判进入第二天","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/RFI_Cn/status/2120516384291745958","l":["rfi.my"],"ln":[{"u":"https://rfi.my/DDB5","d":"rfi.my"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":995},{"id":"2120515995500683529","h":"cnfinancewatch","ts":1794405385,"zh":"你以为此生必去的是马尔代夫？错。它连前二都进不去。\n按 “震撼程度 + 独特记忆 + 值得专程奔赴” 排个趣味榜，每个地方到底凭什么出圈：\n第 5 #冰岛：大地的天然实验室，冰川、黑沙滩、间歇泉、极光一网打尽。能徒步冰洞、看火山，在这里很容易感受到人类的渺小。最佳是秋冬追极光、夏天走环岛；风大寒冷，一定要做好防风。\n第 4 #敦煌：东方独有的浪漫，大漠戈壁、鸣沙月牙，莫高窟壁画藏着千年文脉。不是单纯看风景，是和古人隔空相遇。避开盛夏正午，傍晚逛鸣沙山，落日沙丘最绝。\n第 3 #秘鲁马丘比丘：云端之上的印加古城，被群山云雾环抱，神秘氛围感无可替代。古老石城嵌在山脊，徒步古道，触摸消失文明的痕迹。建议走印加步道或者一早进山，躲开汹涌人流。\n第 2 #瑞士阿尔卑斯：把童话实景搬到人间，澄澈湖泊、连绵雪山、草甸木屋。春夏繁花遍野，秋冬白雪皑皑，随便一处湖泊都像油画。适合慢节奏，不必赶景点，找个小镇住几天。\n第 1 #赞比亚维多利亚大瀑布：被称为 “雷鸣之雾”，瀑布宽度和水量断层级震撼，水雾腾空数千米。可以近距离直面奔腾河水，还能在魔鬼池体验。雨季水量最磅礴，视觉冲击力很难有地方比肩。\n记住：没有完美目的地。旅行的珍贵在于心境，慢慢走、用心感受，远比打卡第一名重要。\n保存这份旅行清单；转给想一起出游的人；点赞收藏，别让向往只停在收藏夹。","en":"你以为此生必去的是马尔代夫？错。它连前二都进不去。\n按 “震撼程度 + 独特记忆 + 值得专程奔赴” 排个趣味榜，每个地方到底凭什么出圈：\n第 5 #冰岛：大地的天然实验室，冰川、黑沙滩、间歇泉、极光一网打尽。能徒步冰洞、看火山，在这里很容易感受到人类的渺小。最佳是秋冬追极光、夏天走环岛；风大寒冷，一定要做好防风。\n第 4 #敦煌：东方独有的浪漫，大漠戈壁、鸣沙月牙，莫高窟壁画藏着千年文脉。不是单纯看风景，是和古人隔空相遇。避开盛夏正午，傍晚逛鸣沙山，落日沙丘最绝。\n第 3 #秘鲁马丘比丘：云端之上的印加古城，被群山云雾环抱，神秘氛围感无可替代。古老石城嵌在山脊，徒步古道，触摸消失文明的痕迹。建议走印加步道或者一早进山，躲开汹涌人流。\n第 2 #瑞士阿尔卑斯：把童话实景搬到人间，澄澈湖泊、连绵雪山、草甸木屋。春夏繁花遍野，秋冬白雪皑皑，随便一处湖泊都像油画。适合慢节奏，不必赶景点，找个小镇住几天。\n第 1 #赞比亚维多利亚大瀑布：被称为 “雷鸣之雾”，瀑布宽度和水量断层级震撼，水雾腾空数千米。可以近距离直面奔腾河水，还能在魔鬼池体验。雨季水量最磅礴，视觉冲击力很难有地方比肩。\n记住：没有完美目的地。旅行的珍贵在于心境，慢慢走、用心感受，远比打卡第一名重要。\n保存这份旅行清单；转给想一起出游的人；点赞收藏，别让向往只停在收藏夹。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HW2V9c8a8AAF9Sx.png?name=orig"],"u":"https://x.com/cnfinancewatch/status/2120515995500683529","l":[],"ln":[],"t":[],"lk":3,"rt":1,"rp":2,"vw":1347},{"id":"2120515649495617699","h":"business","ts":1794405302,"zh":"随着安迪·伯纳姆 (Andy Burnham) 前往土耳其参加 COP31 气候谈判，罗斯班克油田的命运已成为对英国首相应对全球变暖政策的考验 rnham?taid=6af473b622159d00010a0cc5&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"As Andy Burnham heads to the COP31 climate talks in Turkey, the fate of Rosebank oil field has become a test of the UK prime minister's approach to global warming","zh_src":"bing cle/3374101/outcry-after-taiwan-asks-mainland-chinese-tourist-sign-independence-statement?utm_medium=Social&utm_source=Twitter#Echobox=1794402442","d":"scmp.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":1283},{"id":"2120503351758540814","h":"cnfinancewatch","ts":1794402370,"zh":"关于离岸信托的规模和后续的影响，现在大致的情况，我感觉还是符合市场之前的预期的：\n税率统一为20%（装入环节按财产转让所得、存续环节按年对收益/分红等按“利息股息红利”或财产转让所得、终止清算同）。\n申报个税超1600亿元 → 对应应税所得（增值+历史累积收益）约8000亿元（1600÷0.2）。\n市场机构此前估算中国居民控制的离岸信托总资产规模约2.3万亿–2.7万亿元（户数约1万左右）。\n按平均25%–35%的有效应税增值/累积收益比例测算，理论补税正好落在1200亿–1800亿元区间。实际申报1600亿正好落在这个区间中位，说明存量规模与此前机构判断高度吻合。\n用北京怀柔21人做非合规推测：\n10月22日过渡期最后一天，北京市怀柔区税务局对晁某哲等21名自然人公告送达《税务事项通知书》，事由是“离岸信托个人所得税涉税事项核实及通知申报纳税”。这属于公告送达（联系不上或拒不配合才用此方式），并非全部未申报者，只是北京一个区的公开点名样本。⁠Yemacaijing\n官方表述是“绝大多数纳税人积极配合”。同时有业内统计，过去三个月因离岸信托需补税的自然人已超800人（其中港股上市公司高管/股东超350人）：\n若全国约1万户，北京作为高净值高度集中地区，假设北京占全国相关户数的8%–15%（约800–1500户量级）。\n怀柔一个区就公开点名21人（多为联系不上或明确不配合），再叠加青岛等地也有类似公开催告。\n非主动申报/拒不配合比例如果控制在5%–10%区间，全国未主动申报对应的应税所得大约在400亿–800亿元量级，对应潜在补税80亿–160亿元。这与“绝大多数配合、实际申报已达1600亿、理论区间上限1800亿”的叙事是匹配的。\n公告送达的21人以及类似未配合者，后续可能面临滞纳金、稽查甚至曝光。如果平均单户金额较高，全国未申报部分可能还有数十亿到低百亿量级的追缴空间，但不会改变“主体已合规”的格局。\n#钱是回来还是最终就落在海外了，这是个问题。总的来说，这些钱以后只要在海外就每年需要缴税，未来新增信托可能会犹豫出海的便利与成本。","en":"关于离岸信托的规模和后续的影响，现在大致的情况，我感觉还是符合市场之前的预期的：\n税率统一为20%（装入环节按财产转让所得、存续环节按年对收益/分红等按“利息股息红利”或财产转让所得、终止清算同）。\n申报个税超1600亿元 → 对应应税所得（增值+历史累积收益）约8000亿元（1600÷0.2）。\n市场机构此前估算中国居民控制的离岸信托总资产规模约2.3万亿–2.7万亿元（户数约1万左右）。\n按平均25%–35%的有效应税增值/累积收益比例测算，理论补税正好落在1200亿–1800亿元区间。实际申报1600亿正好落在这个区间中位，说明存量规模与此前机构判断高度吻合。\n用北京怀柔21人做非合规推测：\n10月22日过渡期最后一天，北京市怀柔区税务局对晁某哲等21名自然人公告送达《税务事项通知书》，事由是“离岸信托个人所得税涉税事项核实及通知申报纳税”。这属于公告送达（联系不上或拒不配合才用此方式），并非全部未申报者，只是北京一个区的公开点名样本。⁠Yemacaijing\n官方表述是“绝大多数纳税人积极配合”。同时有业内统计，过去三个月因离岸信托需补税的自然人已超800人（其中港股上市公司高管/股东超350人）：\n若全国约1万户，北京作为高净值高度集中地区，假设北京占全国相关户数的8%–15%（约800–1500户量级）。\n怀柔一个区就公开点名21人（多为联系不上或明确不配合），再叠加青岛等地也有类似公开催告。\n非主动申报/拒不配合比例如果控制在5%–10%区间，全国未主动申报对应的应税所得大约在400亿–800亿元量级，对应潜在补税80亿–160亿元。这与“绝大多数配合、实际申报已达1600亿、理论区间上限1800亿”的叙事是匹配的。\n公告送达的21人以及类似未配合者，后续可能面临滞纳金、稽查甚至曝光。如果平均单户金额较高，全国未申报部分可能还有数十亿到低百亿量级的追缴空间，但不会改变“主体已合规”的格局 路板涨5.57%、元件涨4.71%、激光设备涨4.47%、集成电路封测涨4.14%。概念端 #CPO 涨5.69%、 #光通信模块 涨5.14%、 #光纤 涨4.55%。领跌的是白酒跌3.14%、光伏主材跌2.57%，茅指数跌1.45%、宁组合跌1.04%。风格是大盘成长加中小盘科技，消费和老核心资产被当作资金来源。\n#资金面\n沪深两市主力合计净流入约163亿元。行业层面电子净流入159.7亿元、通信设备126.5亿元、元件74.8亿元、半导体65.3亿元；流出端医药生物净流出39.9亿元、电力设备32.5亿元、白酒10.6亿元。个股主力净流入前列是 #中际旭创 29.5亿元、 #新易盛 29.0亿元、 #东山精密 22.4亿元、 #天孚通信 14.7亿元、 #兆易创新 10.7亿元、 #沪电股份 10.4亿元。北向实时数据暂不可用。\n#涨停分布\n82家涨停里汽车零部件10家、通用设备8家、专用设备7家、通信设备6家、元件5家。连板高度在4板，大东方、日出东方领衔，亚玛顿、文投控股、锋龙股份、光洋股份、东方环宇3板。光模块主力多是20cm大涨而非一字，说明是机构型资金在推，不是游资接力。游戏因腾讯新动作有4家涨停，属于支线。\n#盘中消息\n一是微软向美国政府施压要求放弃中国光收发器进口禁令，这是今天的总开关。二是存储厂商酝酿新一轮涨价，先从企业级开始，兆易创新与长鑫科技放量。三是台积电10月营收同比增60%，并批准向Anthropic和OpenAI合计投资10亿美元，AI资本开支叙事没有降温。四是北京发布具身智能支持政策，提升具身数据供给与专用算力保障，但机器人板块盘中只是温和跟涨。偏空的一面，美国10月CPI超预期，高盛把美联储第三次加息预期放到明年3月，现货黄金逼近4000美元关口，海外流动性仍是悬在成长股头上的变量。午后《会计改革与发展十五五规划》发布，严打财务造假，对题材股中的业绩瑕疵标的是约束。\n#研报面\n11月11日华安证券给 #三花智控 买入评级，理由是收入增速回升、液冷与机器人业务推进；华鑫证券覆盖 #科士达 买入，看点在数据中心项目。11月10日中邮证券给 #奥士康 买入，题目直接写算力PCB起量；中邮证券给 #强一股份 买入，提到算力探针份额提升与存储进展；太平洋给 #新亚电子 买入，提到高频高速线缆放量与光芯片布局。今天领涨的光模块龙头两日内没有新出的个股研报，行情先于研报。\n#中美映射\n美股近20日最强的是住房建筑ITB涨13.65%、医疗XLV涨11.33%、医疗器械IHI涨10.21%，同口径半导体SMH近20日跌17.77%、近5日跌6.73%，科技XLK近20日跌13.94%。A股机器人ETF近20日涨约11%、近5日涨约3.6%，是A股这边少有的双窗口同现。通信ETF近5日涨5.05%但近20日跌16.42%，半导体设备ETF近5日涨约10%、近20日跌约11.7%，都属仅5日的短线脉冲，美股同类方向也没有给出共振，追高要克制。纳指期货盘中涨约1.3%，标普期货涨约0.5%，外盘对今天的A股科技算是顺风。\n#三个方向\n第一，光模块与CPO。利空松动加超跌反弹，资金最集中，但20日趋势仍弱，看反弹空间不看反转。第二，PCB与元件。算力PCB有研报和资金双重印证，沪电、东山精密双双涨停，节奏比光模块稳。第三，存储芯片。涨价消息加兆易创新、长鑫科技放量，是今天新冒出来的线索，持续性待验证。\n#六只个股\n #中际旭创 $300308 盘中涨约15%，主力净流入29.5亿元居全市场第一，光模块风向标。\n #新易盛 $300502 涨约17%，主力净流入29亿元，弹性最大，PE不到20倍，估值不算贵。\n #天孚通信 $300394 涨约14%，光器件平台，主力净流入近15亿元。\n #沪电股份 $002463 涨停，算力PCB核心，主力净流入10.4亿元。\n #东山精密 $002384 涨停，主力净流入22.4亿元，PCB叠加光模块业务。\n #兆易创新 $603986 涨约5.9%，存储涨价最直接的受益标的之一，主力净流入近11亿元。","en":"A股盘中｜2026-11-11 北京时间14:30\n#结论\n今天是光通信的单边日。CPO概念单板块主力净流入约194亿元，光通信模块、光纤概念也都在120亿元以上，创业板指涨3.07%，上证50反而翻绿，权重和题材两头冷、中间的AI硬件独热。驱动很清楚：微软公开游说放弃对中国光收发器的进口禁令，压在板块头上一个多月的最大利空松动。但要分清性质，通信ETF近20日仍跌16%，这是超跌后的5日反弹，不是趋势反转。尾盘重点看中际旭创、新易盛能不能稳住15%以上的涨幅，守住就是明天还有接力的信号，冲高回落就按脉冲处理。\n#盘面速 over-fear-of-closure?taid=6af3fc2e22159d00010a0992&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":0,"rp":3,"vw":10988},{"id":"2120386718050480457","h":"cnfinancewatch","ts":1794374563,"zh":"散户热议｜2026-11-11·午间\n数据时点：北京时间11月11日约13:15–13:17抓取。国内依据韭研公社首页公开帖（发帖时间为11月10日晚至11日中午）；海外依据Stocktwits公开数据（热门榜，以及英伟达、CoreWeave两只股票各最新30条消息，时间约北京时间12:00–13:16）。Reddit WallStreetBets直接抓取被拦截，WSB部分引自第三方汇总站Buzzberg对11月10日美股盘中帖子的整理，属二手转述。下文帖子观点只代表发帖人，内容未经核实；情绪统计只限所列样本，不代表全体。\n国内：韭研公社\n一、光模块“利空出尽”。昨晚有用户转发券商机械团队观点，标题是海外大厂反对FCC、板块有望反弹。核心论点是选举之后FCC规则制定阻力会变大，光板块从高点回调七成以上，近日外围利空下却很坚挺，说明筹码结构改善。今天上午这条逻辑兑现得很充分。和券商口径的差别在于：券商讲订单和产能，社区更爱讲“平权”，有帖子直接推荐二十亿市值的光模块配套小票，理由只是一笔收购。这种低市值补涨思路在龙头大涨日最活跃，也最容易接最后一棒。\n二、AI游戏与AI漫剧。午间有多篇帖子集中讨论“AI游戏”，引用的说法是Anthropic新模型八小时生成一款可运行的射击游戏，用来论证游戏开发门槛大幅下降，并点名富春股份、凯撒文化、名臣健康等。该说法本文未核实。另有帖子把腾讯鹅次元内测、沙特财团收购沐瞳获批、京东短剧串成“AI内容变现”主线。情绪明显偏多，但这是典型的题材扩散阶段：高标文投控股已走出多日连板（各来源对板数统计不一），后排跟风多是首板。\n三、机器人与玄学。机器人帖子里有偏研究的零部件拆解，比如柔轮、面罩、灵巧手电机；也有纯名字联想，比如“前有龙江交通，今有锋龙股份”，于是推荐同带“龙”字的低位股。昨天的“东方系”也是同一种名字炒作。这和券商讲的产业逻辑基本无关，是高低切换里最该警惕的部分。\n四、其他事件帖：平头哥分拆带出的“合作商”挖掘，华为新型存储试商用，深圳APEC概念股，峨眉山的猴年加冰雪。共同点是事件驱动、周期短。\n被忽略的风险：上午沪指收跌、成交缩量、两千六百多只个股下跌，但社区几乎没人讨论白酒、医药、贵金属的亏钱效应，也很少提美国利率。监管方面，韭研公社置顶了打击吹票的专帖，平台自身也在约束荐股；连续涨停股被交易所重点监控、发异动公告的可能性同样要算进去。\n海外：Stocktwits与WSB\n一、Stocktwits。热门榜第一是CoreWeave，其后是英伟达、Zeta、HPE，微软、Rocket Lab也在榜上，Anthropic相关代码同样上榜。CoreWeave最新30条消息中，带标签的14条看多、1条看空，情绪偏亢奋：有人喊“到月球”，有人说还要再涨两成才能回本，也有人在拆它的资产抵押贷款融资结构。英伟达最新30条里，带标签的7条看多、3条看空，大部分没标注。讨论明显分化：一边是“错过的人该上车了”“GPU需求不会消失，替代品在哪”，一边是围绕CEO私事和国家安全的调侃与担忧，还夹着未经证实的收购传闻。\n二、WSB（二手转述）。据Buzzberg整理，11月10日美股盘中有WSB用户披露在178美元买入100股英伟达，另有人晒出2027年3月到期、行权价100美元的看跌期权；还有帖子讨论标普远期市盈率17.7倍与席勒市盈率接近40的矛盾，以及AMD低位挂单成交、认为200日均线附近有人接。\n与券商口径的异同：机构盯利率路径和资本开支回报，散户更盯个股弹性和抄底时点。被忽略的风险也很具体：英伟达已收在168.80美元，低于那位用户的买入价；利率仍在上行，CoreWeave的高杠杆融资在加息周期里会更贵。\n小结：国内散户在高低切换和题材接力中情绪偏热，海外散户在抄底和对冲之间来回摇摆。两边都低估了同一个变量，就是利率。\n以上为公开讨论的整理与编辑判断，不构成投资建议。","en":"散户热议｜2026-11-11·午间\n数据时点：北京时间11月11日约13:15–13:17抓取。国内依据韭研公社首页公开帖（发帖时间为11月10日晚至11日中午）；海外依据Stocktwits公开数据（热门榜，以及英伟达、CoreWeave两只股票各最新30条消息，时间约北京时间12:00–13:16）。Reddit WallStreetBets直接抓取被拦截，WSB部分引自第三方汇总站Buzzberg对11月10日美股盘中帖子的整理，属二手转述。下文帖子观点只代表发帖人，内容未经核实；情绪统计只限所列样本，不代表全体。\n国内：韭研公社\n一、光模块“利空出尽”。昨晚有用户转发券商机械团队观点，标题是海外大厂反对FCC、板块有望反弹。核心论点是选举之后FCC规则制定阻力会变大，光板块从高点回调七成以上，近日外围利空下却很坚挺，说明筹码结构改善。今天上午这条逻辑兑现得很充分。和券商口径的差别在于：券商讲订单和产能，社区更爱讲“平权”，有帖子直接推荐二十亿市值的光模块配套小票，理由只是一笔收购。这种低市值补涨思路在龙头大涨日最活跃，也最容易接最后一棒。\n二、AI游戏与AI漫剧。午间有多篇帖子集中讨论“AI游戏”，引用的说法是Anthropic新模型八小时生成一款可运行的射击游戏，用来论证游戏开发门槛大幅下降，并点名富春股份、凯撒文化、名臣健康等。该说法本文未核实。另有帖子把腾讯鹅次元内测、沙特财团收购沐瞳获批、京东短剧串成“AI内容变现”主线。情绪明显偏多，但这是典型的题材扩散阶段：高标文投控股已走出多日连板（各来源对板数统计不一），后排跟风多是首板。\n三、机器人与玄学。机器人帖子里有偏研究的零部件拆解，比如柔轮、面罩、灵巧手电机；也有纯名字联想，比如“前有龙江交通，今有锋龙股份”，于是推荐同带“龙”字的低位股。昨天的“东方系”也是同一种名字炒作。这和券商讲的产业逻辑基本无关，是高低切换里最该警惕的部分。\n四、其他事件帖：平头哥分拆带出的“合作商”挖掘，华为新型存储试商用，深圳APEC概念股，峨眉山的猴年加冰雪。共同点是事件驱动、周期短。\n被忽略的风险：上午沪指收跌、成交缩量、两千六百多只个股下跌，但社区几乎没人讨论白酒、医药、贵金属的亏钱效应，也很少提美国利率。监管方面，韭研公社置顶了打击吹票的专帖，平台自身也在约束荐股；连续涨停股被交易所重点监控、发异动公告的可能性同样要算进去。\n海外：Stocktwits与WSB\n一、Stocktwits。热门榜第一是CoreWeave，其后是英伟达、Zeta、HPE，微软、Rocket Lab也在榜上，Anthropic相关代码同样上榜。CoreWeave最新30条消息中，带标签的14条看多、1条看空，情绪偏亢奋：有人喊“到月球”，有人说还要再涨两成才能回本，也有人在拆它的资产抵押贷款融资结构。英伟达最新30条里，带标签的7条看多、3条看空，大部分没标注。讨论明显分化：一边是“错过的人该上车了”“GPU需求不会消失，替代品在哪”，一边是围绕CEO私事和国家安全的调侃与担忧，还夹着未经证实的收购传闻。\n二、WSB（二手转述）。据Buzzberg整理，11月10日美股盘中有WSB用户披露在178美元买入100股英伟达，另有人晒出2027年3月到期、行权价100美元的看跌期权；还有帖子讨论标普远期市盈率17.7倍与席勒市盈率接近40的矛盾，以及AMD低位挂单成交、认为200日均线附近有人接。\n与券商口径的异同：机构盯利率路径和资本开支回报，散户更盯个股弹性和抄底时点。被忽略的风险也很具体：英伟达已收在168.80美元，低于那位用户的买入价；利率仍在上行，CoreWeave的高杠杆融资在加息周期里会更贵。\n小结：国内散户在高低切换和题材接力中情绪偏热，海外散户在抄底和对冲之间来回摇摆。两边都低估了同一个变量，就是利率。\n以上为公开讨论的整理与编辑判断，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120386718050480457","l":[],"ln":[],"t":["美联储","美股","A股港股","AI科技"],"lk":0,"rt":0,"rp":0,"vw":1773},{"id":"2120386565910446149","h":"cnfinancewatch","ts":1794374526,"zh":"热点财经新闻综述｜2026-11-11·午间\n数据时点：北京时间2026年11月11日约13:15–13:18采集。依据：本期新收到的两封热点财经邮件（早间件08:10、午间件13:10），交叉核对新华财经、智通财经、上海证券报、中新经纬、新浪港股、钛媒体、路透、CNBC、TechCrunch、美联社、日经等公开报道。标注【邮件转述】的内容未经独立核实，不作定论。\n今日判断\n上午是“外冷内热、指数分化”。已核实的数据：沪指午间跌0.24%报3654.95点，深成指涨0.11%，创业板指涨0.99%报2519.14点，沪深两市半日成交约9283亿元，比上一交易日同期缩量约320亿元；港股恒指跌0.83%报24352.69点，恒生科技指数跌1.36%。隔夜美国10月CPI环比0.4%、核心0.3%，都比预期高0.1个百分点，10年期美债收益率收在4.986%，2年期一天升17个基点到4.73%，期货已把12月加息当成定局。利率这么紧，A股资金却没有离场，而是从白酒、贵金属、创新药里撤出来，挤进光模块、机器人和AI内容。我们的看法是：下午沪指仍会被消费权重拖着走，创业板的强势只靠少数高景气方向撑着，缩量环境下别把结构行情当成全面反转。\n三大利多方向（由强到弱）\n第一，光模块与CPO：政策尾部风险后移，订单有验证。路透11月10日报道，微软等公司和行业团体正游说特朗普政府叫停对中国新型光收发器的进口禁令；据报道FCC考虑的门槛是3.2T规格，这一代产品要到2028年才量产。一个悬了几个月的尾部风险被往后推了。加上中际旭创称主要客户订单已基本覆盖2027年，剑桥科技披露大幅扩产计划，午间中际旭创涨8.26%报509.89元，市值重回6000亿元，港股中际旭创也涨超7%。受益的是光模块龙头、光器件和高端PCB。投资含义：业绩能对上的龙头优于小市值跟风。制约在于游说不等于政策落地，FCC至今没有公开表态；英伟达若继续下跌，情绪会反复。\n第二，人形机器人与物理AI：催化密集。机器人板块早盘反复活跃，锋龙股份、光洋股份走出3连板。【邮件转述】谷歌机器人模型进入奔驰产线、具身智能标准化提速、国资与机构扎堆调研。含义：零部件里有订单或送样进度的标的更有支撑。制约：连板股多是情绪接力，业绩兑现期还远。\n第三，AI内容与游戏：大厂入局。腾讯“鹅次元”AI陪伴产品内测，【邮件转述】京东内测短剧产品，AI漫剧、游戏板块走强。Anthropic已启动IPO路演，发行区间70至78美元，按完全摊薄口径估值最高约1.4万亿美元，预计11月19日在纳斯达克挂牌，给AI应用叙事提供了一个估值锚。制约：题材扩散快、变现慢，高位连板股分歧在加大。\n三大利空方向（由强到弱）\n第一，美国利率重定价。核心CPI连续第三个月环比0.3%，美联储理事沃勒表示12月可考虑加息50个基点，达拉斯联储主席洛根认为可能还要至少两次加息。需要更正一点：邮件称10年期美债收益率“突破5%”，实际收盘为4.986%，是逼近而非突破。首当其冲的是高估值成长股和外资重仓资产，港股科技今天就是例子。截至中午美股期货小幅回升，但只要长端收益率贴着5%，任何反弹都会被质疑。\n第二，英伟达风波与AI资本开支情绪。英伟达周二跌5.53%收168.80美元，围绕CEO的董事会调查继续发酵，国会议员已把矛头指向其对华芯片销售。软银公布4至9月亏损，今天东京盘中一度跌10.5%。对A股而言，光模块今天逆势走强说明传导出现分化，但不代表免疫，美股科技若继续杀估值，A股算力链的高位筹码会先松动。\n第三，消费权重、避险资产走弱叠加缩量。白酒、乳业、贵金属、航空领跌，金价随实际利率回落；【邮件转述】两融余额前一交易日减少13.85亿元。缩量下的题材抱团，最怕高位股集中兑现。\n操作上，仓位中性偏低，主线集中在光模块龙头和机器人中有订单的标的，不追连板。下午重点看两件事：创业板能否守住1%左右的涨幅，港股科技能否止跌。\n另需说明：邮件称Take-Two“指引令人失望”，与公开收盘数据不符（该股周二涨8.31%，重申全年指引），本文未采用。\n以上为基于公开信息的分析与推测，不构成投资建议。","en":"热点财经新闻综述｜2026-11-11·午间\n数据时点：北京时间2026年11月11日约13:15–13:18采集。依据：本期新收到的两封热点财经邮件（早间件08:10、午间件13:10），交叉核对新华财经、智通财经、上海证券报、中新经纬、新浪港股、钛媒体、路透、CNBC、TechCrunch、美联社、日经等公开报道。标注【邮件转述】的内容未经独立核实，不作定论。\n今日判断\n上午是“外冷内热、指数分化”。已核实的数据：沪指午间跌0.24%报3654.95点，深成指涨0.11%，创业板指涨0.99%报2519.14点，沪深两市半日成交约9283亿元，比上一交易日同期缩量约320亿元；港股恒指跌0.83%报24352.69点，恒生科技指数跌1.36%。隔夜美国10月CPI环比0.4%、核心0.3%，都比预期高0.1个百分点，10年期美债收益率收在4.986%，2年期一天升17个基点到4.73%，期货已把12月加息当成定局。利率这么紧，A股资金却没有离场，而是从白酒、贵金属、创 rueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":8,"rt":1,"rp":2,"vw":11454},{"id":"2120385751678648698","h":"cnfinancewatch","ts":1794374332,"zh":"热点财经新闻 午间\n2026-11-11 13:10:49 北京时间\n【热点财经新闻 · 午间】2026年11月11日\n数据源：A股十大财经源 + 英文十大财经源（本次共取用 420 条素材）\n一、今日中国A股热点二十条\n（一）\n1、事件：据同花顺热股榜，文投控股（600715）当日+10.18%，录得12天8板，居热股榜第3名、东财人气榜第1名，题材为AI漫剧、剧集发行与北京国资。\n2、涉及个股：文投控股（600715），传媒短剧游戏板块；慈文传媒（002343）+4.72%、掌阅科技（603533）-2.62%同属短剧游戏与AI语料方向。\n3、影响：偏多，强度中，属当日情绪影响，连板高度已高，追高需防分歧，持续性取决于短剧与AI内容题材能否扩散。\n（二）\n1、事件：据同花顺热股榜，日出东方（603366）当日+10.02%，4天4板，题材为“东方系”、空气能热泵、储能与三季报增长。\n2、涉及个股：日出东方（603366），热泵与储能概念；大东方（600327）+9.93%同属“东方系”4天4板，东方海洋（002086）+0.65%亦在榜。\n3、影响：偏多，强度中，属当日情绪影响，“东方系”名称炒作特征明显，缺乏基本面支撑的连板股回撤风险大。\n（三）\n1、事件：据同花顺热股榜，襄阳轴承（000678）当日+10.02%，2天2板，题材为机器人轴承、汽车轴承与湖北国资，东财人气榜排名升9位。\n2、涉及个股：襄阳轴承（000678），减速器与机器人零部件方向；光洋股份（002708）+10.01%3天3板、锋龙股份（002931）+10.01%3天3板同属人形机器人关节与机电组件。\n3、影响：偏多，强度中，属情绪与产业逻辑叠加，机器人零部件是当日资金主线之一，需跟踪订单与送样进展能否兑现。\n（四）\n1、事件：据同花顺热股榜与东财人气榜，中际旭创（300308）当日+11.57%，东财人气榜排名升66位；新易盛（300502）+11.47%，排名升91位。\n2、涉及个股：中际旭创（300308）、新易盛（300502），共封装光学CPO与光模块方向；剑桥科技（603083）+10.00%首板涨停，东山精密（002384）+9.57%同属CPO与光纤概念。\n3、影响：偏多，强度强，属持续性产业逻辑，光模块是当日最强主线，受海外算力资本开支驱动，波动跟随美股芯片股。\n（五）\n1、事件：据Google中文引述同花顺财经，A股午评创业板指低开高走涨0.99%，燃气、元件、CPO板块活跃，超2700只个股飘红。\n2、涉及个股：创业板权重方向可关注中际旭创（300308）、新易盛（300502）；燃气板块代表个股当日素材未给出具体名称与代码，标注数据不足。\n3、影响：偏多，强度中，属当日情绪影响，指数分化格局下资金集中于算力硬件与题材连板，沪指走弱显示权重承压。\n（六）\n1、事件：据金融界与证券之星，A股午评沪指跌0.24%、创业板涨0.99%，CPO与AI漫剧概念股走强，机器人板块活跃，白酒股震荡调整。\n2、涉及个股：AI漫剧方向文投控股（600715）、风语筑（603466）+9.98%；白酒板块当日素材未给出具体个股名称与代码，标注数据不足。\n3、影响：偏空于白酒等权重消费，偏多于科技题材，强度中，属当日情绪影响，风格切换特征明显。\n（七）\n1、事件：据东方财富，腾讯“鹅次元”亮相带动游戏多股涨停，京东内测独立短剧产品，短剧与游戏概念受催化。\n2、涉及个股：凯撒文化（002425）+10.06%2天2板，手游与AI游戏；大晟文化（600892）+10.00%8天5板、芒果超媒（300413）+3.69%同属短剧游戏方向。\n3、影响：偏多，强度中，属当日情绪影响，游戏与短剧受大厂入局消息驱动，题材扩散快但业绩兑现慢。\n（八）\n1、事件：据东方财富，新一代通信网技术取得重要突破，光纤概念逆势走高，多股业绩倍增可期。\n2、涉及个股：东山精密（002384）+9.57%，共封装光学与光纤概念；中际旭创（300308）、新易盛（300502）同属光通信产业链。\n3、影响：偏多，强度中，属持续性产业逻辑，光通信技术突破与海外需求共振，是算力主线的延伸方向。\n（九）\n
