n😭😭😭","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXgmlhmawAA7IfZ.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2123490447553401041","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":665},{"id":"2123490117205840329","h":"SupFin","ts":1795114471,"zh":"黄仁勋如果重新创业，英伟达真正的品牌价值将真正显现。老黄如果新开公司，肯定不缺钱、人才和客户排队。这将是对于英伟达品牌资产最狠的一次压力测试:过去30多年，大家到底是在相信英伟达，还是相信黄仁勋？英伟达手里真正属于公司的东西很硬，芯片架构、软件生态、工程团队、供应链、客户已经部署的系统。但黄仁勋能带走的东西同样值钱，他对下一代技术的判断、和台积电等供应商几十年的关系、云计算巨头对他的信任，以及资本市场愿意相信他下一次还能押对的信用。如果他真的重新创业，新公司最大的资产可能一开始就不在资产负债表上，而在黄仁勋这个名字本身。真正强大的创始人品牌，可以让一家还没有产品、没有收入、甚至没有名字的公司提前获得融资、人才和客户。英伟达未来真正需要证明的，就是黄仁勋离开以后，客户买的依然是英伟达，而不是黄仁勋。","en":"黄仁勋如果重新创业，英伟达真正的品牌价值将真正显现。老黄如果新开公司，肯定不缺钱、人才和客户排队。这将是对于英伟达品牌资产最狠的一次压力测试:过去30多年，大家到底是在相信英伟达，还是相信黄仁勋？英伟达手里真正属于公司的东西很硬，芯片架构、软件生态、工程团队、供应链、客户已经部署的系统。但黄仁勋能带走的东西同样值钱，他对下一代技术的判断、和台积电等供应商几十年的关系、云计算巨头对他的信任，以及资本市场愿意相信他下一次还能押对的信用。如果他真的重新创业，新公司最大的资产可能一开始就不在资产负债表上，而在黄仁勋这个名字本身。真正强大的创始人品牌，可以让一家还没有产品、没有收入、甚至没有名字的公司提前获得融资、人才和客户。英伟达未来真正需要证明的，就是黄仁勋离开以后，客户买的依然是英伟达，而不是黄仁勋。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123489801827684352/vid/avc1/1920x1080/5DsLUmRILgocr0vm.mp4?tag=29"],"u":"https://x.com/SupFin/status/2123490117205840329","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":358},{"id":"2123487489709244484","h":"Balder13946731","ts":1795113844,"zh":"炒掉董事会，让他回来😤😤😤","en":"炒掉董事会，让他回来😤😤😤","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123487489709244484","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":360},{"id":"2123487410483073135","h":"AntonLaVay","ts":1795113825,"zh":"我觉得，当前美股的最大问题来自政治的不稳定。\n美国可能正在从一个政治高度极化、但党内权力结构相对稳定的体系\n转向\n一个政治高度极化，而且两党内部权力结构也不稳定的体系。\n原本共和党对民主党的优势来自于民主党内部高度分裂，而共和党被Maga整合，但是现在这种整合明显已经崩盘。\n原本，对抗政府导致政策相对稳定，双方都很难改变现状，市场反而可能获得政策确定性，但是我觉得这不符合当下的事实。\n更可能的是政治失序：各方不仅无法达成协议，连各自会采取什么行动，谁能约束谁都变得难以预测。\n共和党如今发现，Trump对伊朗行动在美国不得人心，靠近都会不幸，谁Maga谁输选举。\n民主党虽然赢了，但是这种胜利是建立在民众对于高油价，伊朗战争和数据中心的极度厌恶中带来的民意反弹。\n民主党面对一个麻烦的处境，他们知道选民烦什么，膈应什么，但是选举到底希望民主党实施什么政策，这一点并不清楚。\n其中一个明显的证明当前在走向政治失序而不是对抗国会的僵局的证据就在于：中期选举完还没有超过一个月，一个管理五万亿美元市值公司的CEO就被干掉了..\n头皮发麻。","en":"我觉得，当前美股的最大问题来自政治的不稳定。\n美国可能正在从一个政治高度极化、但党内权力结构相对稳定的体系\n转向\n一个政治高度极化，而且两党内部权力结构也不稳定的体系。\n原本共和党对民主党的优势来自于民主党内部高度分裂，而共和党被Maga整合，但是现在这种整合明显已经崩盘。\n原本，对抗政府导致政策相对稳定，双方都很难改变现状，市场反而可能获得政策确定性，但是我觉得这不符合当下的事实。\n更可能的是政治失序：各方不仅无法达成协议，连各自会采取什么行动，谁能约束谁都变得难以预测。\n共和党如今发现，Trump对伊朗行动在美国不得人心，靠近都会不幸，谁Maga谁输选举。\n民主党虽然赢了，但是这种胜利是建立在民众对于高油价，伊朗战争和数据中心的极度厌恶中带来的民意反弹。\n民主党面对一个麻烦的处境，他们知道选民烦什么，膈应什么，但是选举到底希望民主党实施什么政策，这一点并不清楚。\n其中一个明显的证明当前在走向政治失序而不是对抗国会的僵局的证据就在于：中期选举完还没有超过一个月，一个管理五万亿美元市值公司的CEO就被干掉了..\n头皮发麻。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2123487410483073135","l":[],"ln":[],"t":["美股","原油能源"],"lk":1,"rt":2,"rp":0,"vw":540},{"id":"2123486210689761623","h":"Balder13946731","ts":1795113539,"zh":"目前 $QQQ 的参考区间下滑到了636-661","en":"目前 $QQQ 的参考区间下滑到了636-661","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123486210689761623","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":653},{"id":"2123485127338828212","h":"Balder13946731","ts":1795113281,"zh":"！这个时候我们应该听到伯克希尔哈撒韦入股 $NVDA 🫪 没有比这更有性价比的交易了。","en":"！这个时候我们应该听到伯克希尔哈撒韦入股 $NVDA 🫪 没有比这更有性价比的交易了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123485127338828212","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":3,"vw":1259},{"id":"2123484696206295100","h":"wufantouzi","ts":1795113178,"zh":"又这样啊\n还不如永续直接买\n一天的资金费率还是付得起的\n也能撸到十几个点\n这样搞破发就给你了\n开盘35%就没你的份了\n引用：","en":"又这样啊\n还不如永续直接买\n一天的资金费率还是付得起的\n也能撸到十几个点\n这样搞破发就给你了\n开盘35%就没你的份了\n引用：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXgiEKTacAADiJp.png?name=orig"],"u":"https://x.com/wufantouzi/status/2123484696206295100","l":["web.timestore.vip"],"ln":[{"u":"https://web.timestore.vip/#/time/pages/timeDetail/index?timeid=184520","d":"web.timestore.vip"}],"t":[],"lk":3,"rt":0,"rp":1,"vw":1606},{"id":"2123483927201648932","h":"bboczeng","ts":1795112995,"zh":"你持有，或者最近抄底的股票，比如neocloud，nvda，intc，还要再跌多少你才会止损，放弃，跑路？\n请说实话：","en":"你持有，或者最近抄底的股票，比如neocloud，n nancewatch","ts":1795096993,"zh":"今日美股与全球热点二十条\n（一）\n1、事件：据路透社报道，Anthropic以810亿美元募资规模完成史上最大IPO，估值达1.5万亿美元，定价83美元。\n2、涉及标的：Anthropic为未上市转上市AI龙头，代码素材未给出；美股AI方向可参考英伟达（NVDA）；A股对应方向为AI算力与CPO，代表个股中际旭创（300308）与新易盛（300502）。\n3、影响：偏多，强度强，属当日情绪影响，对A股算力与AI应用板块形成情绪提振，但需警惕虹吸效应。\n（二）\n1、事件：据彭博社报道，Anthropic上调IPO发行规模，欧洲散户抢购11亿美元IPO股票，暗盘最高暴涨26%。\n2、涉及标的：Anthropic代码素材未给出；杠杆ETF方向已有20只产品抢跑；A股对应方向为AI应用与云计算，代表个股华胜天成（600410）。\n3、影响：偏多，强度强，属当日情绪影响，全球AI风险偏好回升，对A股云计算与AI应用形成正向传导。\n（三）\n1、事件：据华尔街见闻报道，阿里巴巴2027财年第二季度营收2715.2亿元同比增长10%，云业务收入增长53%，AI资本开支增60%。\n2、涉及标的：阿里巴巴（BABA）；A股对应方向为云计算与算力租赁，代表个股常山北明（000158）与四川长虹（600839）。\n3、影响：偏多，强度中等，属持续性逻辑，云业务高增验证AI需求，对A股算力租赁板块形成中期支撑。\n（四）\n1、事件：据MarketWatch报道，阿里巴巴云业务蓬勃发展，但AI实验室亏损完全抵消了云业务利润。\n2、涉及标的：阿里巴巴（BABA）；A股对应方向为AI应用与云服务，代表个股拓维信息（002261）属华为昇腾概念。\n3、影响：中性偏空，强度中等，属持续性逻辑，AI投入拖累利润的叙事对A股AI应用盈利预期形成压制。\n（五）\n1、事件：据华尔街见闻报道，腾讯三季度WorkBuddy成中国使用量最大AI应用，但元宝不及预期，AI成本大增且现金流转负。\n2、涉及标的：腾讯（TCEHY）；A股对应方向为AI应用与办公软件，代表个股金山办公（688111）为办公软件方向代表。\n3、影响：中性偏空，强度中等，属持续性逻辑，AI投入产出比受质疑，对A股AI应用估值形成压制。\n（六）\n1、事件：据路透社报道，英伟达财报强劲前景未能消除不确定性，股价继续回落，市场对AI交易分歧加大。\n2、涉及标的：英伟达（NVDA）；A股对应方向为CPO与算力硬件，代表个股中际旭创（300308）与新易盛（300502）当日逆势上涨。\n3、影响：偏空，强度较强，属当日情绪影响，英伟达走弱对A股算力链形成压制，但CPO方向当日表现分化。\n（七）\n1、事件：据巴伦周刊报道，英伟达股票被认为是当前最佳交易之一，但存在一个关键隐患。\n2、涉及标的：英伟达（NVDA）；A股对应方向为AI服务器与PCB，代表个股沪电股份（002463）与东山精密（002384）。\n3、影响：中性，强度中等，属持续性逻辑，估值与增长匹配度是核心变量，对A股PCB方向形成间接指引。\n（八）\n1、事件：据巴伦周刊报道，CoreWeave与IREN因英伟达对新云厂商融资释放谨慎信号而下跌。\n2、涉及标的：CoreWeave（CRWV）与IREN（IREN）；A股对应方向为算力租赁，代表个股利通电子（603629）与美利云（000815）。\n3、影响：偏空，强度中等，属当日情绪影响，新云厂商融资收紧对A股算力租赁概念形成负面映射。\n（九）\n1、事件：据路透社报道，美联储理事Waller称美联储需要在通胀应对上更加激进，鹰派表态升温。\n2、涉及标的：标普500指数（SPX）与纳斯达克100指数（NDX）；A股对应方向为贵金属与有色，代表个股紫金矿业（601899）。\n3、影响：偏空，强度较强，属当日情绪影响，加息预期升温压制风险资产，对A股资源与成长板块形成双重压力。\n（十）\n1、事件：据华尔街见闻报道，10月美联储FOMC会议纪要强烈指引12月至少加息25基点，同时为10月未加息找理由。\n2、涉及标的：美国10年期国债收益率方向，对应ETF可参考TLT；A股对应方向为高股息红利，代表个股华能蒙电（600863）。\n3、影响：偏空，强度较强，属持续性逻辑，加息路径明确对全球估值形成压制，红利资产相对抗跌。","en":"今日美股与全球热点二十条\n（一）\n1、事件：据路透社报道，Anthropic以810亿美元募资规模完成史上最大IPO，估值达1.5万亿美元，定价83美元。\n2、涉及标的：Anthropic为未上市转上市AI龙头，代码素材未给出；美股AI方 泉水\n直接就是冰美式\n我估计奶茶店 蜜雪 库迪 瑞幸那些\n也都是这么干的\n所以为什么我们要在外卖买了\n然后还要等1小送过来\n而不是自己拿个杯子倒进去😄","en":"发现很多事情都是信息差智商税\n买那个咖啡液倒到杯子里\n然后再倒入冰镇矿泉水\n直接就是冰美式\n我估计奶茶店 蜜雪 库迪 瑞幸那些\n也都是这么干的\n所以为什么我们要在外卖买了\n然后还要等1小送过来\n而不是自己拿个杯子倒进去😄","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2123416739820240978","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":4,"vw":2369},{"id":"2123416614263775302","h":"cnfinancewatch","ts":1795096946,"zh":"【热点财经新闻 · 晚间】2026年11月19日\n数据源：A股十大财经源 + 英文十大财经源（本次共取用 391 条素材）\n一、今日中国A股热点二十条\n（一）\n1、事件：据新浪财经报道，消息称三星电子计划在CES 2027发布2款人形机器人，机器人产业商业化预期再度升温。\n2、涉及个股：九阳股份（002242）属厨房小家电叠加机器人投资概念，当日涨停；襄阳轴承（000678）属减速器与机器人轴承概念，当日涨停；宇树科技（688836）属人形机器人概念。\n3、影响：偏多，强度中等，属当日情绪影响叠加产业趋势的持续性逻辑，资金沿机器人零部件与整机两条线扩散。\n（二）\n1、事件：据韭研公社报道，马斯克更新Optimus机器人进展，强调手部能力与真实任务验证，华源机器人团队跟进解读。\n2、涉及个股：襄阳轴承（000678）机器人轴承方向，九阳股份（002242）机器人投资方向，柯力传感（603662）为机器人传感器方向代表。\n3、影响：偏多，强度中等，属持续性产业逻辑，灵巧手与传感器环节是资金关注重点，但当日板块内部分化明显。\n（三）\n1、事件：据新浪财经报道，Counterpoint数据显示2025下半年全球智能眼镜出货量同比增长139%，消费电子新品类放量。\n2、涉及个股：立讯精密（002475）为消费电子精密制造代表，歌尔股份（002241）为声学与智能硬件方向代表，板块归属消费电子与AI硬件概念。\n3、影响：偏多，强度中等，属持续性逻辑，智能眼镜放量对光学、声学与整机组装环节形成中期拉动。\n（四）\n1、事件：据新浪财经报道，互联网行业2027年AI展望提出双寡头格局定调ARR稳健放量，Agent-Infra成破局迭代主线。\n2、涉及个股：华胜天成（600410）属云计算与网络安全概念，常山北明（000158）属算力租赁与华为盘古概念，四川长虹（600839）属华为欧拉概念。\n3、影响：偏多，强度中等，属持续性逻辑，Agent基础设施方向对算力租赁与云服务板块形成中期支撑。\n（五）\n1、事件：据韭研公社报道，东吴电子陈海进指出海外通道收紧、国产替代提速，继续强call国产算力。\n2、涉及个股：海光信息（688041）属中国AI 50与芯片概念，拓维信息（002261）属华为昇腾概念，真视通（002771）属液冷算力概念当日三连板。\n3、影响：偏多，强度较强，属持续性逻辑，国产算力是本轮资金主线之一，但海光信息当日下跌显示高位分歧。\n（六）\n1、事件：据东方财富报道，海外利空激发国产替代，先进封装概念走强，半导体自主可控方向获资金追捧。\n2、涉及个股：江化微（603078）属光刻胶与湿电子化学品概念当日涨停，西陇科学（002584）属光刻胶与氟化工概念，有研新材（600206）属国家大基金持股概念。\n3、影响：偏多，强度较强，属当日情绪影响叠加持续性逻辑，材料与封装环节是国产替代最直接受益方向。\n（七）\n1、事件：据韭研公社报道，华辰装备光刻机镜片磨床石锤出货，长春光机所合资叠加华字辈铲子股进入兑现期。\n2、涉及个股：华辰装备（300809）属光刻机镜片磨床方向，华微电子（600360）被官媒点名功率半导体专用光刻方向，西陇科学（002584）属光刻胶概念。\n3、影响：偏多，强度中等，属当日情绪影响，光刻环节题材属性强，兑现节奏需跟踪订单落地。\n（八）\n1、事件：据新浪财经报道，14只基金扛住市场震荡，押注半导体国产替代主线，基金调仓方向明确。\n2、涉及个股：中芯国际（688981）与华虹公司（688347）当日大涨，属晶圆代工方向；长鑫科技（688981除外，代码未在素材中给出）回购方案上调至最高50亿元。\n3、影响：偏多，强度中等，属持续性逻辑，机构资金在缩量市中向半导体集中，形成结构性抱团。\n（九）\n1、事件：据华尔街见闻报道，长鑫科技大幅上调回购金额至最高50亿元，回购价格不超过63.78元每股。\n2、涉及个股：长鑫科技为存储芯片方向代表，属半导体板块；同方向可关注有研新材（600206）与江化微（603078）。\n3、影响：偏多，强度中等，属持续性逻辑，大额回购对存储产业链情绪形成支撑，但个股代码素材未给出需注意。\n（十）\n1、事件：据新浪财经报道，英伟达澄清新云厂商融资担保规则，称担保有生效条件，后续筛选对象将更加审慎。\n2、涉及个股：利通电子（603629）属英伟达概念与OLED概念，中际旭创（300308）属CPO概念，新易盛（300502）属CPO与5G概念。\n3、影响：偏空，强度中等，属当日情绪影响，算力租赁与CPO板块午后承压，共进股份（603118）当日跌停。","en":"【热点财经新闻 · 晚间】2026年11月19日\n数据源：A股十大财经源 + 英文十大财经源（本次共取用 391 条素材）\n一、今日中国A股热点二十条\n（一）\n1、事件：据新浪财经报道，消息称三星电子计划在CES 2027发布2款人形机器人，机器人产业商业化预期再度升温。\n2、涉及个股：九阳股份（002242）属厨房小家电叠加机器人投资概念，当日涨停；襄阳轴承（000678）属减速器与机器人轴承概念，当日涨停；宇树科技（688836）属人形机器人概念。\n3、影响：偏多，强度中等，属当日情绪影响叠加产业趋势的持续性逻辑，资金沿机器人零部件与整机两条线扩散。\n（二）\n1、事件：据韭研公社报道，马斯克更新Optimus机器人进展，强调手部能力与真实任务验证，华源机器人团队跟进解读。\n2、涉及个股：襄阳轴承（000678）机器人轴承方向，九阳股份（002242）机器人投资方向，柯力传感（603662）为机器人传感器方向代表。\n3、影响：偏多，强度中等，属持续性产业逻辑，灵巧手与传感器环节是资金关注重点，但当日板块内部分化明显。\n（三）\n1、事件：据新浪财经报道，Counterpoint数据显示2025下半年全球智能眼镜出货量同比增长139%，消费电子新品类放量。\n2、涉及个股：立讯精密（002475）为消费电子精密制造代表，歌尔股份（002241）为声学与智能硬件方向代表，板块归属消费电子与AI硬件概念。\n3、影响：偏多，强度中等，属持续性逻辑，智能眼镜放量对光学、声学与整机组装环节形成中期拉动。\n（四）\n1、事件：据新浪财经报道，互联网行业2027年AI展望提出双寡头格局定调ARR稳健放量，Agent-Infra成破局迭代主线。\n2、涉及个股：华胜天成（600410）属云计算与网络安全概念，常山北明（000158）属算力租赁与华为盘古概念，四川长虹（600839）属华为欧拉概念。\n3、影响：偏多，强度中等，属持续性逻辑，Agent基础设施方向对算力租赁与云服务板块形成中期支撑。\n（五）\n1、事件：据韭研公社报道，东吴电子陈海进指出海外通道收紧、国产替代提速，继续强call国产算力。\n2、涉及个股：海光信息（688041）属中国AI 50与芯片概念，拓维信息（002261）属华为昇腾概念，真视通（002771）属液冷算力概念当日三连板。\n3、影响：偏多，强度较强，属持续性逻辑，国产算力是本轮资金主线之一，但海光信息当日下跌显示高位分歧。\n（六）\n1、事件：据东方财富报道，海外利空激发国产替代，先进封装概念走强，半导体自主可控方向获资金追捧。\n2、涉及个股：江化微（603078）属光刻胶与湿电子化学品概念当日涨停，西陇科学（002584）属光刻胶与氟化工概念，有研新材（600206）属国家大基金持股概念。\n3、影响：偏多，强度较强，属当日情绪影响叠加持续性逻辑，材料与封装环节是国产替代最直接受益方向。\n（七）\n1、事件：据韭研公社报道，华辰装备光刻机镜片磨床石锤出货，长春光机所合资叠加华字辈铲子股进入兑现期。\n2、涉及个股：华辰装备（300809）属光刻机镜片磨床方向，华微电子（600360）被官媒点名功率半导体专用光刻方向，西陇科学（002584）属光刻胶概念。\n3、影响：偏多，强度中等，属当日情绪影响，光刻环节题材属性强，兑现节奏需跟踪订单落地。\n（八）\n1、事件：据新浪财经报道，14只基金扛住市场震荡，押注半导体国产替代主线，基金调仓方向明确。\n2、涉及个股：中芯国际（688981）与华虹公司（688347）当日大涨，属晶圆代工方向；长鑫科技（688981除外，代码未在素材中给出）回购方案上调至最高50亿元。\n3、影响：偏多，强度中等，属持续性逻辑，机构资金在缩量市中向半 XxBA.jpg?name=orig"],"u":"https://x.com/octopusycc/status/2123415501540147421","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":1833},{"id":"2123414290539610468","h":"ShanghaoJin","ts":1795096392,"zh":"我学到了一个有意思的名字叫 Daroio","en":"我学到了一个有意思的名字叫 Daroio","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2123414290539610468","l":[],"ln":[],"t":[],"lk":22,"rt":0,"rp":8,"vw":4626},{"id":"2123412731739127834","h":"qinbafrank","ts":1795096021,"zh":"美国对中国AI技术管制与封锁三板斧：\n1）芯片出口管制和BIS新出台的远程算力访问新规；\n2）昨天美中经济与安全审查委员会正式发布《2026 年年度报告》。其中第八章围绕中美 AI 技术竞争展开，并通过第 18—20 条政策建议，提出限制中国开放权重 AI 模型在美国敏感领域的部署、要求披露中国 AI 模型的使用情况（配图1）\n3）限制中国先进制程芯片在台积电和三星的流片。\n看今天路透报道台积电和三星已通知部分中国客户在向美国商务部工业与安全局（BIS）申请出口许可证期间，暂停特定处理器的出货。原因是美国商务部BIS于11月19日生效的临时最终规则（Interim Final Rule，文件号2026-23529）。现在相关先进逻辑芯片被推定为受控（需许可证），除非设计商在美国批准名单上。先进制程（尤其是16nm及以下）面向中国客户/设计商的流片与出货，目前处于“先暂停、等许可证”状态。（见图二）\n至此三板斧都已经砍下来：\n第一板斧卡先进芯片/服务器和远程算力访问，让你拿不到先进算力；\n第二板斧卡中国开源模型在美国的采用，卡住全球采用和削弱影响力；\n第三板斧卡中国自研芯片，能设计先进制程芯片但不能流片，制造受阻；\n三板斧环环相扣，川普晚上才刚从深圳离开。\n这里有特别值得说的一点：16号美国商务部工业与安全局（BIS）发布的远程算力访问新规，官方明确说到这项规则由美国财政部和白宫国家安全委员会指导并起草，由商务部BIS署名对外发布，这在出口管制规则里比较少见。意味着远程算力访问新规其实是贝森特和鲁比奥主导，倒闭卢特尼克去推动落实。\n这一次中期选举的结果、以及“倒黄”时间无一不透露着、前几天这里\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"美国对中国AI技术管制与封锁三板斧：\n1）芯片出口管制和BIS新出台的远程算力访问新规；\n2）昨天美中经济与安全审查委员会正式发布《2026 年年度报告》。其中第八章围绕中美 AI 技术竞争展开，并通过第 18—20 条政策建议，提出限制中国开放权重 AI 模型在美国敏感领域的部署、要求披露中国 AI 模型的使用情况（配图1）\n3）限制中国先进制程芯片在台积电和三星的流片。\n看今天路透报道台积电和三星已通知部分中国客户在向美国商务部工业与安全局（BIS）申请出口许可证期间，暂停特定处理器的出货。原因是美国商务部BIS于11月19日生效的临时最终规则（Interim Final Rule，文件号2026-23529）。现在相关先进逻辑芯片被推定为受控（需许可证），除非设计商在美国批准名单上。先进制程（尤其是16nm及以下）面向中国客户/设计商的流片与出货，目前处于“先暂停、等许可证”状态。（见图二）\n至此三板斧都已经砍下来：\n第一板斧卡先进芯片/服务器和远程算力访问，让你拿不到先进算力；\n第二板斧卡中国开源模型在美国的采用，卡住全球采用和削弱影响力；\n第三板斧卡中国自研芯片，能设计先进制程芯片但不能流片，制造受阻；\n三板斧环环相扣，川普晚上才刚从深圳离开。\n这里有特别值得说的一点：16号美国商务部工业与安全局（BIS）发布的远程算力访问新规，官方明确说到这项规则由美国财政部和白宫国家安全委员会指导并起草，由商务部BIS署名对外发布，这在出口管制规则里比较少见。意味着远程算力访问新规其实是贝森特和鲁比奥主导，倒闭卢特尼克去推动落实。\n这一次中期选举的结果、以及“倒黄”时间无一不透露着、前几天这里\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src 交易能否站稳，不提前改方向。苹果仍是贴着前高的半仓突破单，期权没有转强，不突破就不进，跌破失效位当天走。若开盘是高开低走，这张单继续推迟。\n$ESTC 只看到箱底一根阳， $FPS 还在下行通道里，都不进只做。 $WMT 、 $BABA 、 $PDD 、 $PANW 和 $ANT\n都要用今晚完整日线确认，不拿盘前跳空去填名单。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#梯瓦制药 $TEVA ，区间中部，位置57%，距20日高5.54%，FDA和偏多的P/C是加分项，但位置不够突破，放量站上44.57再看，跌破周线十日均线41.44失效，仅观察。\n $ESTC ，箱底，位置11.4%，周三收83.01，涨3.26%，量比约1.34。11月17日先砸出20日低点79.87，18日收回一根阳，还不能算放量确认。期权Call方向清楚，但软件ETF\n$IGV 20日跌10.92%、五日跌5.17%，大势仍弱，只观察不进只做。放量站上87.98再看，跌破20日低79.87失效。\n $FPS ，箱体位置34.3%，周三收21.70，涨2.36%，下影到20.94，量比只有0.58。20日跌31.68%，五日跌11.68%，均线在23.64上方，还在下行通道里。内部人买入和P/C偏低都不构成有效共振，仅观察。放量站上21.99再看，跌破21.64失效。\n $CGON ，区间中部，位置59%，三期达终点是加分，距20日高17.44%，等回踩或重新接近前高，跌破周线二十日均线71.66失效，仅观察。\n #太空探索科技 $SPCX ，区间中上部，位置68%，周三收143.50，涨1.27%，距20日高还有7.50%。周一ARK两只基金同买还在，但位置不是箱底也不是突破准备，仅观察，跌破周一低点135失效。\n#小盘阿尔法\n本期不选。 $ACHR 市值偏小，又有ARK两只基金同买和近月Call共振，本应优先核验，但周三收在20日最低，五日大幅下跌，没有企稳蜡烛，不能因为资金项就选进去。\n$NUTX 仍是箱底加股息，期权没有核到，不进只做。 $FPS 市值约65亿美元，已经偏大，位置也不过关。 $SLS 短线已经伸展。\n#操作提示\n期指比下午更强，但英伟达的完整日线仍是长阴，盘前那点反弹改变不了位置，AI硬件要等常规交易能否站稳，不提前改方向。苹果仍是贴着前高的半仓突破单，期权没有转强，不突破就不进，跌破失效位当天走。若开盘是高开低走，这张单继续推迟。\n$ESTC 只看到箱底一根阳， $FPS 还在下行通道里，都不进只做。 $WMT 、 $BABA 、 $PDD 、 $PANW 和 $ANT\n都要用今晚完整日线确认，不拿盘前跳空去填名单。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123411819515744637","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":186},{"id":"2123411814927192551","h":"cnfinancewatch","ts":1795095802,"zh":"#研报面\n本档公开源未见针对只做名单的新下调或大幅上调。 #苹果\n卖方均值目标价仍是343.2美元，买入15家、持有8家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。公开源能核到的摩根士丹利动作，仍是11月3日把目标价从355下调到350、维持增持。\n$HUBS 均值230.5美元，买入6家、持有19家，卖方立场偏弱。 $ESTC 、 $FPS 、 #梯瓦制药 、 $CGON\n的卖方目标价本档仍未采集到可核对的数字。\n#资金面\nARK方面，最新公开记录仍是周三（11月18日）。必须先写的是两只及以上基金同买： $ACHR\n获ARKK加仓5021885股、ARKQ加仓2267519股，同时期权最大Call行权价3.5距现价只差0.57%、量仓比2.14，Call持仓增仓2.8%，共振项有三项。但周三收3.23，跌8.24%，正好收在20日最低，五日跌33.54%，还在下跌，没有企稳，同买不能单独当成买点，只记录、不进只做。其余能看到的都是单基金小额：ARKQ买入\n$KDK 约53.64万美元，ARKG买入 $TWST 约32.99万美元，ARKK买入 $WGS 约22.44万美元，ARKG买入\n$SCTX 约16.21万美元，权重已经降档。加仓榜上新出现 $CRCL\n，也是单基金记录，再叠加USDC在非洲推进的多年协议，事件权重一般，不进名单。周一 $SPCX 、 $XYZ 、 $SHOP\n的同买还在，位置仍没有走到右侧。\n带方向的期权里，干净的多头并不多。 $ESTC\n最大Call行权价85，距周三收盘83.01约2.35%，量仓比2.72，成交527张，Call成交放量646.5%，P/C成交比0.06，这项是清楚的，但要跟K线位置一起看。\n#苹果 期权已经转弱，不能再按多头共振去理解。 #梯瓦制药 P/C成交比0.13，只算一项偏多。 $FPS\n的P/C成交比0.09虽然偏多，但最大Call行权价24距现价已有10.6%，量仓比只有0.79，仓单变化还没有基线，构不成带方向的期权共振；内部人CAO买入3000股，金额很小，只能降权记录。\n$NVDA 最大Call行权价160量仓比4.54，同时最大Put行权价150量仓比1.87，多空都在放量，股价又砸回区间底部。 $MSFT\n最大Call行权价420量仓比3.51、P/C成交比0.22，只作为记录。\n#期货\n周三完整交易日：标普迷你成交量约226万手、量比1.13，OI增约1.07万手，OI在增加但量能未明确确认，暂不定性。纳指迷你成交量约96万手、量比1.19，OI降约5415手，价涨OI降，属空头回补。微型标普OI降约2801手，同样是价涨OI降，属空头回补。10年期美债期货量比0.95，OI降约8.36万手，价跌OI降，属多头离场。原油量比0.81、OI大幅增加约15.0万手，价跌且量能未确认，暂不定性。黄金量比0.42、OI降约1.58万手，价跌OI降，属多头离场，而且是缩量的。白银和铜的成交量口径降级，周三公开日线分别收跌约4.84%和约5.30%，按价跌、持仓下降更接近多头离场，不能按价涨去写成空头回补。今晚盘前期指比下午更强，原油回到约83.16、黄金跌到约3717，这笔股指反弹要看今晚常规交易能否站住，盘前还不能说已经出现新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨8.60%、 $FIW 涨7.73%、 $PHO 涨7.58%、 $ITB 涨7.03%、 $IHI\n涨6.50%、 $UNG 涨6.42%、 $XHB 涨5.39%、 $AGNG 涨4.82%、 $XLP 涨4.67%、 $IHE\n涨4.15%、 $XLU 涨3.69%。5日窗口只剩下 $UNG 涨3.82%还在比较明显的正值， $XLP\n已经翻到跌0.30%。天然气是目前唯一双窗口同现的品种，但 $UNG\n距20日高只差0.75%，位置95%，量比不足1，已经走在上沿，慎追。必选消费从双窗口变成仅20日， $XLP\n距20日高2.52%。水业、住宅建筑、医疗器械都是仅20日，而且五日已经转弱； $ITB\n距20日高10.54%，行业ETF在回调。半导体双窗口都更弱， $SOXX\n20日跌16.62%、5日跌8.72%。A股这边以今日收盘计，消费ETF20日涨约8.56%、5日涨约2.90%，银行ETF20日涨约6.03%、5日涨约3.39%，酒ETF20日涨约8.91%、5日涨约1.38%，消费和银行仍是双窗口同现，但已经走到20日区间90%以上，映射还在，位置高了，不追。住宅建筑美股仅20日，A股房地产ETF20日跌约7.75%，映射没有启动。医疗这边对不齐：\n$IHI 仅20日、5日跌2.20%，A股纳指生物科技ETF20日涨2.31%、5日跌7.82%，创新药ETF双窗口都是负的。芯片A股今日收涨约1.1%，20日仍跌约3.6%，和美股\n$SOXX 一样构不成共振。美股今晚没有新的完整日线，这组窗口与下午相同，结论也不改。\n#三个方向\n一是 #大盘消费科技龙头 ，只认 #苹果 这种低波动、仍靠近前高的品种，期权这轮没有转强，仓位继续克制，不突破不进。二是 #必选消费\n，中美映射还在，但美股五日已经翻绿， $TJX 把箱底一次走完， $WMT\n财报虽然略超预期并上调指引，位置却在区间中上部，只作为防守框架，不在这里追高开仓。三是 #制药与医疗器械 观察， $IHI 、 $IHE\n都是仅20日回调， $TEVA 和 $CGON 有事件加分但位置都在区间中部，都不追。软件和电气设备今晚不单列方向。\n#六只个股\n #苹果 双窗口同现，但已经走到20日区间90%以上，映射还在，位置高了，不追。住宅建筑美股仅20日，A股房地产ETF20日跌约7.75%，映射没有启动。医疗这边对不齐：\n$IHI 仅20日、5日跌2.20%，A股纳指生物科技ETF20日涨2.31%、5日跌7.82%，创新药ETF双窗口都是负的。芯片A股今日收涨约1.1%，20日仍跌约3.6%，和美股\n$SOXX 一样构不成共振。美股今晚没有新的完整日线，这组窗口与下午相同，结论也不改。\n#三个方向\n一是 #大盘消费科技龙头 ，只认 #苹果 这种低波动、仍靠近前高的品种，期权这轮没有转强，仓位继续克制，不突破不进。二是 #必选消费\n，中美映射还在，但美股五日已经翻绿， $TJX 把箱底一次走完， $WMT\n财报虽然略超预期并上调指引，位置却在区间中上部，只作为防守框架，不在这里追高开仓。三是 #制药与医疗器械 观察， $IHI 、 $IHE\n都是仅20日回调， $TEVA 和 $CGON 有事件加分但位置都在区间中部，都不追。软件和电气设备今晚不单列方向。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.69失效，半仓。晚间原邮件给的失效位是周线十日均线345.08，更为宽松，这里仍用更近的20日均线。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123411814927192551","l":[],"ln":[],"t":["美股","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":1,"vw":216},{"id":"2123411806077198489","h":"cnfinancewatch","ts":1795095800,"zh":"美股盘前晚间版｜2026年11月19日 周四 北京时间21:00\n#结论\n今日大类只做两个：大盘消费科技龙头，以及暂时只作为防守框架的必选消费。只做名单仍只给一只，第二、第三个位置空着。用周三完整日线核下来，能同时过位置的还是靠近前高的苹果。晚间原邮件把\n$ESTC 和 $FPS 放到只做前两位，并给ESTC记了箱底放量阳和Call共振，但独立核验后，这两只都还不能进只做。\n #苹果 $AAPL 周三收352.45，涨0.15%，距20日高也是52周高360.83还有2.38%，处在近20日区间76%的位置。仍按回撤后的突破准备来看，不突破不进。期权没有转强：最大Call行权价360，距现价2.14%，量仓比只有0.68，Call持仓减仓7.0%，P/C成交比0.98、持仓比1.19，资金面未形成共振。13F机构持股76.82%、Fmr增持，不能单独算共振。卖方目标价均值343.2仍低于现价，只给半仓。本档未能从公开源核到可靠的苹果盘前报价，先按周三收盘位置处理。\n明确不做：半导体和AI硬件不改回主方向。 #英伟达 $NVDA\n周三收150.96，跌2.89%，几乎砸回20日低点148.80附近，位置大约只有3%。有报道称盘前反弹约1.5%，改变不了这根长阴，要等常规交易。\n$ESTC 是软件不是医疗器械， $FPS 是电气设备，不能拿 $IHI\n的框架给这两只开仓；已经大涨或五日涨幅过大的、只有股息没有资金共振的、ARK同买但还在下跌并收在区间最低的，先观察不追。\n#消息面\n截至北京时间21时出头，美股期指比下午见到的位置更强一点。纳指期货约27793，较周三收盘27186.75涨约2.23%；标普期货约7432，较周三7340.50涨约1.25%；道指期货约50591，涨约0.63%。下午15时附近纳指期货大约还在27723、涨约1.97%，这几个小时里纳指端又抬了一截。周三美股分化收盘没有变：纳指24429.88，涨0.42%；标普7323.63，跌0.23%；道指50198.17，跌1.11%，道指和标普都是五连跌。VIX收24.56，10年期美债收益率收5.066%，美元指数收103.86，仍靠近近期高位。这三项本档未核到盘前最新报价。\nA股和港股已经收盘：上证3577.62跌0.28%，深证10583.20跌0.71%，创业板2293.34跌0.79%，科创50收1270.78，涨1.83%；中证1000跌1.88%。恒生约22833点，跌约1.98%；恒生科技约3648点，跌约2.36%。日经225今日收59444.21，涨0.71%；韩国综指收约5107点，涨约0.78%。\n盘前最重要的新信息是零售和中概财报落地，以及Anthropic即将上市。 #沃尔玛 $WMT\n财政三季度营收1888.4亿美元，高于约1872.7亿的预期；调整后每股收益0.65美元，略高于0.64美元。公司第三次上调全年指引：净销售增长4.9%到5.2%，调整后每股收益2.84到2.89美元，调整后营业利润增长8.0%到8.6%。全球电商增17%，美国可比销售不含燃油增2.9%。但公开盘前报价并不一致，有报道称股价在126.5美元一带小幅低开。\n$WMT 周三收127.36，处在区间68%，距20日高3.50%，本来就不是箱底也不是突破准备，财报再好也不拿盘前去填只做。\n #阿里巴巴 $BABA 9月季度营收2715.2亿元，同比增10%，略超预期；调整后净利润199.1亿元，低于约266.1亿的预期，调整后每股美国存托凭证收益8.10元，低于约10.75元。阿里云相关收入609.7亿元，同比增53%，但自由现金流转为流出344.7亿元。周三已经收在84.37，跌2.63%，几乎贴着20日低点，位置只有0.6%。有报道称盘前先拉后砸，这种位置先看常规交易，不抄下跌中的缺口。\n $PDD 三季度营收1083亿元，同比持平，低于约1152亿的预期；调整后每股美国存托凭证收益21.04元，高于约18.54元，非公认会计准则营业利润326亿元，也高于预期。利润主要来自销售费用下降，交易服务收入同比减12%。有报道称盘前一度涨7%到9%。周三收77.45，位置大约13%，即使跳空也不等于已经突破，完整日线确认后再看。\nAnthropic定价每股83美元，发行9.80亿股A类股，有报道按充分稀释估值约1.5万亿美元，今晚以 $ANT\n在纳斯达克挂牌，北京时间22:30才开始常规交易，截稿时还没有可写的公开成交价。这是外部扰动，先看上市后的交易，不把它映射成现有AI硬件的买点。\n #帕洛阿尔托 $PANW 下午已经写过一季报超预期。晚间补上的是：全年营收指引上调到145.2亿到145.7亿美元，此前是141.0亿到142.0亿美元，并宣布以约45亿美元收购Applied\nCompute。周三常规交易收339.92，涨9.90%，处在区间37%，距20日高还有19.70%。盘后和盘前都有继续走高的报道，要用今晚完整日线看缺口能否站住，不提前写入只做。有报道称\n#英伟达 盘前约涨1.5%， #超威 $AMD 约涨2.9%，都要等常规交易。\n高权重事件里，位置多数没有改善。 #梯瓦制药 $TEVA\n的IGALMI已获FDA批准，期权P/C成交比0.13偏多，但周三收42.23，跌0.92%，距20日高44.57还有5.54%，处在区间57%，是中部不是突破，只观察。\n$CGON 膀胱癌三期PIVOT-006达主要终点，周三收80.00，涨1.34%，处在区间59%，距20日高17.44%，也不够。\n$ACM 积压订单创纪录280亿美元，但20日已经涨38.48%、五日涨17.27%，周三收82.38，处在区间93%，短线已经伸展，不追。","en":"美股盘前晚间版｜2026年11月19日 周四 北京时间21:00\n#结论\n今日大类只做两个：大盘消费科技龙头，以及暂时只作为防守框架的必选消费。只做名单仍只给一只，第二、第三个位置空着。用周三完整日线核下来，能同时过位置的还是靠近前高的苹果。晚间原邮件把\n$ESTC 和 $FPS 放到只做前两位，并给ESTC记了箱底放量阳和Call共振，但独立核验后，这两只都还不能进只做。\n #苹果 $AAPL 周三收352.45，涨0.15%，距20日高也是52周高360.83还有2.38%，处在近20日区间76%的位置。仍按回撤后的突破准备来看，不突破不进。期权没有转强：最大Call行权价360，距现价2.14%，量仓比只有0.68，Call持仓减仓7.0%，P/C成交比0.98、持仓比1.19，资金面未形成共振。13F机构持股76.82%、Fmr增持，不能单独算共振。卖方目标价均值343.2仍低于现价，只给半仓。本档未能从公开源核到可靠的苹果盘前报价，先按周三收盘位置处理。\n明确不做：半导体和AI硬件不改回主方向。 #英伟达 $NVDA\n周三收150.96，跌2.89%，几乎砸回20日低点148.80附近，位置大约只有3%。有报道称盘前反弹约1.5%，改变不了这根长阴，要等常规交易。\n$ESTC 是软件不是医疗器械， $FPS 是电气设备，不能拿 $IHI\n的框架给这两只开仓；已经大涨或五日涨幅过大的、只有股息没有资金共振的、ARK同买但还在下跌并收在区间最低的，先观察不追。\n#消息面\n截至北京时间21时出头，美股期指比下午见到的位置更强一点。纳指期货约27793，较周三收盘27186.75涨约2.23%；标普期货约7432，较周三7340.50涨约1.25%；道指期 况再搞搞。\n晚上打算撸撸ant。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXfdvM7bkAAa6Me.jpg?name=orig"],"u":"https://x.com/xiaomustock/status/2123409559389933622","l":[],"ln":[],"t":[],"lk":26,"rt":1,"rp":11,"vw":10977},{"id":"2123407523416076398","h":"tychozzz","ts":1795094779,"zh":"Anthropic 今晚就要上市了，人类历史上最大的 IPO。\n认购价是 83，而暗盘价格已经到了 100 上方。尽管最近大盘跌了不少，但 Anthropic IPO 的情绪还是非常高。\n对于很多准备今天现价买入的朋友来说，一定要清楚什么时候离场。我感觉 ANT 很有可能会像 SpaceX 一样，IPO 前几天冲高，后面几周开始回落，甚至最后暴跌破发，一切皆有可能。\nIPO 之后的半年时间里，有几个比较关键的时间节点，给大家梳理一下。\n上市的第一天，非创始人的董事、高管和员工就可以卖掉手里 10% 的股份，对于股价绝对是潜在的卖压。\n12 月 10 号左右，也就是上市后的第 15 个交易日，ANT 大概率会被纳入纳斯达克 100 指数，这是今年 5 月出来的新规定，SpaceX 就是这样在上市后不到一个月被纳入的。这是利好，被动资金买入会带来一波支撑，但可能也是短期利好出尽的信号。\n12 月 15 号，上市后第 27 天，持股 0.5% 以下的其他老股东开始解禁第一批 6%。之后 1 月 5 号再解禁 6%，1 月 19号 7%，2 月 2 号 7%。每一批量不大，但会持续给股价带来卖压。按照我自己的投资风格来看，这个阶段肯定是不碰了，风险盈亏比都不站在我们散户这边。\n明年 2 到 3 月，第一份年度财报，具体日期还没公布，这是最关键的一个节点。财报发布后第二个交易日，员工再解禁 35%，小股东再解禁 12.5%，之后每两周左右再放 9.5%。有分析估计财报后两天内最多可能有 17 亿股解禁，这是整个解禁表里最大的一次。\n这里一方面是关注财报本身的数据，另一方面是解禁相关的利空，二者可能会有相互抵消，这得结合到时候股价的具体情况来分析。如果这个时候 ANT 破发，我觉得会是很不错的买入时机。\n我们也可以看看几个月前 SpaceX 走过的路，发行价 135，第三天盘中最高涨到 225，7 月份就跌破发行价，8 月出现阶段性低点，其实整个过程还是很快的，留给高位出货的时间很短暂。\nAnthropic 也可能会遇到类似的情况，还是得谨慎一些。不过把时间拉长来看，我认为 Anthropic 是最值得投资的 AI 标的，应该也会是我未来长期的 AI 核心仓位。这段时间最重要的还是耐心，等一个好的点位建仓买入。\n📈 投资美股用 BIT，稳定币直接入金，持有真实股票，终身免佣，丝滑交易美股。","en":"Anthropic 今晚就要上市了，人类历史上最大的 IPO。\n认购价是 83，而暗盘价格已经到了 100 上方。尽管最近大盘跌了不少，但 Anthropic IPO 的情绪还是非常高。\n对于很多准备今天现价买入的朋友来说，一定要清楚什么时候离场。我感觉 ANT 很有可能会像 SpaceX 一样，IPO 前几天冲高，后面几周开始回落，甚至最后暴跌破发，一切皆有可能。\nIPO 之后的半年时间里，有几个比较关键的时间节点，给大家梳理一下。\n上市的第一天，非创始人的董事、高管和员工就可以卖掉手里 10% 的股份，对于股价绝对是潜在的卖压。\n12 月 10 号左右，也就是上市后的第 15 个交易日，ANT 大概率会被纳入纳斯达克 100 指数，这是今年 5 月出来的新规定，SpaceX 就是这样在上市后不到一个月被纳入的。这是利好，被动资金买入会带来一波支撑，但可能也是短期利好出尽的信号。\n12 月 15 号，上市后第 27 天，持股 0.5% 以下的其他老股东开始解禁第一批 6%。之后 1 月 5 号再解禁 6%，1 月 19号 7%，2 月 2 号 7%。每一批量不大，但会持续给股价带来卖压。按照我自己的投资风格来看，这个阶段肯定是不碰了，风险盈亏比都不站在我们散户这边。\n明年 2 到 3 月，第一份年度财报，具体日期还没公布，这是最关键的一个节点。财报发布后第二个交易日，员工再解禁 35%，小股东再解禁 12.5%，之后每两周左右再放 9.5%。有分析估计财报后两天内最多可能有 17 亿股解禁，这是整个解禁表里最大的一次。\n这里一方面是关注财报本身的数据，另一方面是解禁相关的利空，二者可能会有相互抵消，这得结合到时候股价的具体情况来分析。如果这个时候 ANT 破发，我觉得会是很不错的买入时机。\n我们也可以看看几个月前 SpaceX 走过的路，发行价 135，第三天盘中最高涨到 225，7 月份就跌破发行价，8 月出现阶段性低点，其实整个过程还是很快的，留给高位出货的时间很短暂。\nAnthropic 也可能会遇到类似的情况，还是得谨慎一些。不过把时间拉长来看，我认为 Anthropic 是最值得投资的 AI 标的，应该也会是我未来长期的 AI 核心仓位。这段时间最重要的还是耐心，等一个好的点位建仓买入。\n📈 投资美股用 BIT，稳定币直接入金，持有真实股票，终身免佣，丝滑交易美股。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXfbLwZbcAA-f8M.jpg?name=orig"],"u":"https://x.com/tychozzz/status/2123407523416076398","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":6,"rt":2,"rp":4,"vw":3148},{"id":"2123406739429372143","h":"dmjk001","ts":1795094592,"zh":"转，靠谱性尚未知，市场传闻，谨慎参考","en":"转，靠谱性尚未知，市场传闻，谨慎参考","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXfbLB9bwAASVCh.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123406739429372143","l":[],"ln":[],"t":[],"lk":11,"rt":1,"rp":0,"vw":2925},{"id":"2123404920552616398","h":"dmjk001","ts":1795094158,"zh":"路透：消息人士称，随着美国新规堵住制造漏洞，台积电收紧对中国 AI 芯片的限制\n台湾台积电正在收紧对中国芯片设计公司的限制，暂停部分此前获准的先进制造订单，并普遍将受影响客户限制在较旧的芯片制造技术上。\n使用16纳米及以下制造工艺的受影响订单必须停止，除非客户获得美国出口许可证。\n这些限制是在美国商务部新规于周四生效之后出台的。新规取消了一条合规途径，该途径此前允许部分中国设计公司在无需单独出口许可证的情况下获得先进制造服务。\n台积电的指引还要求对客户的运营地点、母公司、主要股东、封装供应商和运输路线进行更严格的审查。\n这些审查范围延伸至通过海外子公司或中介机构下达的订单，包括位于台湾、美国、欧洲、日本和东南亚的实体。","en":"路透：消息人士称，随着美国新规堵住制造漏洞，台积电收紧对中国 AI 芯片的限制\n台湾台积电正在收紧对中国芯片设计公司的限制，暂停部分此前获准的先进制造订单，并普遍将受影响客户限制在较旧的芯片制造技术上。\n使用16纳米及以下制造工艺的受影响订单必须停止，除非客户获得美国出口许可证。\n这些限制是在美国商务部新规于周四生效之后出台的。新规取消了一条合规途径，该途径此前允许部分中国设计公司在无需单独出口许可证的情况下获得先进制造服务。\n台积电的指引还要求对客户的运营地点、母公司、主要股东、封装供应商和运输路线进行更严格的审查。\n这些审查范围延伸至通过海外子公司或中介机构下达的订单，包括位于台湾、美国、欧洲、日本和东南亚的实体。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXfZIbQaIAEejrC.png?name=orig"],"u":"https://x.com/dmjk001/status/2123404920552616398","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":449},{"id":"2123403731660390584","h":"yijiangren","ts":1795093875,"zh":"别焦虑\n已经天地锁了\n八十分钟之后\n面对风暴吧","en":"别焦虑\n已经天地锁了\n八十分钟之后\n面对风暴吧","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXfYbXBa0 知情人士透露，这两家芯片制造商近日已告知中国客户，将暂停某些处理器的发货，同时向美国商务部申请许可证。\n周一，负责监管敏感技术的美国商务部下属机构工业与安全局表示，使用美国技术生产先进芯片的芯片制造商，若销售最终运往中国客户的产品，必须申请许可证。\n新规切断了中国芯片设计公司此前利用台积电和三星代工生产对 AI 数据中心至关重要的高性能芯片的途径。\n据两位知情人士透露，台积电和三星也已通知消费电子客户，它们已暂停发货。","en":"FT：台积电和三星暂停向部分中国客户发货芯片\n暂停发生在美国商务部出台新出口管制之后\n据多位知情人士透露，这两家芯片制造商近日已告知中国客户，将暂停某些处理器的发货，同时向美国商务部申请许可证。\n周一，负责监管敏感技术的美国商务部下属机构工业与安全局表示，使用美国技术生产先进芯片的芯片制造商，若销售最终运往中国客户的产品，必须申请许可证。\n新规切断了中国芯片设计公司此前利用台积电和三星代工生产对 AI 数据中心至关重要的高性能芯片的途径。\n据两位知情人士透露，台积电和三星也已通知消费电子客户，它们已暂停发货。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXe1zX2awAAJHf0.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123366097571492217","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":0,"rt":0,"rp":0,"vw":1148},{"id":"2123365738186690903","h":"octopusycc","ts":1795084816,"zh":"只是做了一些微小的工作，谢谢大家\n未来财报工作 大的节点 也会持续做下去\n@yuyue_chris 也是我们这一批币圈里转型美股里做美股做的最好最敏捷的\n完全没有韭菜盲目抄底的惯性思维，很多Catalyst也抓得很准；其实补齐了我对于抓反弹趋势的视角。\n6月以来，几乎每个趋势节点，我们都会进行充分的讨论。当观点共振的时候，正确率也陡然上升。\n未来这些共振时刻也会在推文中额外标注。\n能够完全顶住整个抄底的惯性思维而自产交易思路的人都是值得关注的。","en":"只是做了一些微小的工作，谢谢大家\n未来财报工作 大的节点 也会持续做下去\n@yuyue_chris 也是我们这一批币圈里转型美股里做美股做的最好最敏捷的\n完全没有韭菜盲目抄底的惯性思维，很多Catalyst也抓得很准；其实补齐了我对于抓反弹趋势的视角。\n6月以来，几乎每个趋势节点，我们都会进行充分的讨论。当观点共振的时候，正确率也陡然上升。\n未来这些共振时刻也会在推文中额外标注。\n能够完全顶住整个抄底的惯性思维而自产交易思路的人都是值得关注的。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2123365738186690903","l":[],"ln":[],"t":["美股","财报"],"lk":2,"rt":0,"rp":2,"vw":1240},{"id":"2123365627805172111","h":"octopusycc","ts":1795084790,"zh":"仅在第四季度下降","en":"only down in q4","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/octopusycc/status/2123365627805172111","l":[],"ln":[],"t":[],"lk":7,"rt":1,"rp":2,"vw":1147},{"id":"2123364908096237959","h":"CrushTheShorts","ts":1795084618,"zh":"长鑫第一版发回购是 10 月 30 号，收盘54 块，又跌了半个月到 37， 再上修回购金额\n毕竟才上市几个月，人家ipo融资是8.66 块融的，现在三四十的价格回购，也算是有诚意了\n大 A 如果多点这样的公司，何至于此？","en":"长鑫第一版发回购是 10 月 30 号，收盘54 块，又跌了半个月到 37， 再上修回购金额\n毕竟才上市几个月，人家ipo融资是8.66 块融的，现在三四十的价格回购，也算是有诚意了\n大 A 如果多点这样的公司，何至于此？","zh_src":"native","lang":"zh","m":["https://pbs ":[],"lk":95,"rt":58,"rp":82,"vw":2169},{"id":"2123346119178739939","h":"TraderS18","ts":1795080139,"zh":"中俄美元首首次会谈注定是要上历史书的，值得铭记","en":"中俄美元首首次会谈注定是要上历史书的，值得铭记","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123345915859877889/vid/avc1/960x540/ZK0wP9hEUQ-IHEF6.mp4?tag=29"],"u":"https://x.com/TraderS18/status/2123346119178739939","l":[],"ln":[],"t":[],"lk":12,"rt":1,"rp":1,"vw":1934},{"id":"2123344337409098027","h":"fxtrader","ts":1795079714,"zh":"“‘修昔底德陷阱’绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线，努力跨越‘修昔底德陷阱’。”","en":"“‘修昔底德陷阱’绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线，努力跨越‘修昔底德陷阱’。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123344337409098027","l":[],"ln":[],"t":[],"lk":12,"rt":1,"rp":4,"vw":6279},{"id":"2123343947061919796","h":"fxtrader","ts":1795079621,"zh":"（全文）习近平就大国如何正确相处提出4点看法\n11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平就大国如何正确相处、共同为世界和平托底提出4点看法：\n第一，坚持相互尊重。相互尊重是大国交往的基本准则。中俄美三国国情不同，谁也改变不了谁，这是历史形成的，也是各自人民的自主选择。正确的态度是彼此尊重、求同存异、共同发展。要尊重彼此主权和领土完整，尊重各自选择的社会制度和发展道路，尊重彼此核心利益和重大关切。要坚持不干涉别国内政，不干涉彼此内部事务。在涉及对方的重大敏感问题上，提前沟通、换位思考、谨慎行事，特别是不能触碰对方的底线。\n第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线，努力跨越“修昔底德陷阱”。中俄美都是二战主要战胜国，应当坚定维护战后国际秩序，维护《联合国宪章》宗旨，捍卫来之不易的二战胜利成果。核武器是悬在人类头上的“达摩克利斯之剑”，应该全面禁止并彻底销毁，最终建立无核武器世界。核战争打不赢也打不得。要尽一切努力防止核战争，遵守《不扩散核武器条约》，维护全球战略稳定。\n第三，坚持合作共赢。三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。应该摒弃冷战思维，加强经贸合作，将资源大国、制造大国、消费大国的各自优势贯通起来，共同做大合作蛋糕，实现双赢共赢，而不能搞“脱钩断链”。全球能源安全面临严峻挑战，三国可以加强沟通和协调，共同维护能源产业链供应链稳定畅通，维护全球能源市场安全稳定。\n第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。三国要保持常态化高层交往，畅通各层级对话渠道，建立危机沟通和预防机制，确保误判少发生、分歧管得住、摩擦不升级。当前，全球各种纷争持续不断，热点问题按下葫芦浮起瓢，国际社会期待大国多做劝和促谈工作。中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。（新华社）","en":"（全文）习近平就大国如何正确相处提出4点看法\n11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平就大国如何正确相处、共同为世界和平托底提出4点看法：\n第一，坚持相互尊重。相互尊重是大国交往的基本准则。中俄美三国国情不同，谁也改变不了谁，这是历史形成的，也是各自人民的自主选择。正确的态度是彼此尊重、求同存异、共同发展。要尊重彼此主权和领土完整，尊重各自选择的社会制度和发展道路，尊重彼此核心利益和重大关切。要坚持不干涉别国内政，不干涉彼此内部事务。在涉及对方的重大敏感问题上，提前沟通、换位思考、谨慎行事，特别 记者。","en":"根据特朗普的日程安排，与习近平的午餐会安排在下午3点。\n特朗普将在美东时间周四17:30（北京时间周五6:30）返回白宫见记者。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXeWXQdbwAAottF.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123331823153651965","l":[],"ln":[],"t":[],"lk":8,"rt":3,"rp":0,"vw":3190},{"id":"2123330613570945362","h":"xingpt","ts":1795076442,"zh":"Kraken CEO把自己的Crypto VC给收购了，大家都知道现在币圈VC不值什么钱，Kraken收购是溢价收购还是折价收购未披露，如果是溢价收购难保不是帮管理层套现","en":"Kraken CEO把自己的Crypto VC给收购了，大家都知道现在币圈VC不值什么钱，Kraken收购是溢价收购还是折价收购未披露，如果是溢价收购难保不是帮管理层套现","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXeVchMbEAA1lsJ.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123330613570945362","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":457},{"id":"2123330090138558473","h":"fxtrader","ts":1795076317,"zh":"习近平会见美国总统特朗普（新华社）\n11月19日下午，国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。\n习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道，确立了“中美建设性战略稳定关系”的新定位，并赋予其“基于尊重、公平、对等”的新内涵，受到中美两国人民认可和国际社会欢迎。中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性。我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。\n习近平强调，构建中美建设性战略稳定关系是前无古人的开创性事业，需要敢闯敢试、脚踏实地、善作善成。中美元首外交的引领作用不可替代。要延续中美关系目前的稳定向好势头，关键是要在落实元首共识上付诸行动。双方团队的沟通也要跟上。要拉长合作清单、压缩问题清单，一时解决不了的分歧要建设性管控，防止矛盾升级。在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折。经贸领域要加强沟通，解决彼此关切，争取互利互惠。两国在禁毒、非法移民遣返、打击电信网络诈骗等领域的合作卓有成效，可以本着尊重、公平、对等的原则继续加强合作。中美应当加强沟通和协调，防范人工智能安全风险，确保人工智能始终处于人类控制之下。\n特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。\n双方认为此次会晤是积极、建设性的，同意制定建设性战略稳定关系行动计划，落实两国元首共识，构建基于尊重、公平、对等的中美建设性战略稳定关系。\n两国元首还就共同关心的国际和地区问题交换了意见。\n蔡奇、王毅、何立峰、黄坤明等参加会见。","en":"习近平会见美国总统特朗普（新华社）\n11月19日下午，国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。\n习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道，确立了“中美建设性战略稳定关系”的新定位，并赋予其“基于尊重、公平、对等”的新内涵，受到中美两国人民认可和国际社会欢迎。中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性。我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。\n习近平强调，构建中美建设性战略稳定关系是前无古人的开创性事业，需要敢闯敢试、脚踏实地、善作善成。中美元首外交的引 tarlink 服务原本就没开通。\nBuy the dip，长期持有，Discord在个人资料","en":"马斯克 DealBook 访谈要点\n马斯克和《纽约时报》的主持人 Andrew 连线聊了 47 分钟。\n1. Anthropic 可能再租 10 GW 算力\n马斯克判断，Anthropic 大概率会继续租用 SpaceX 的算力，追加规模可能达到 10 GW。按他的说法，现有协议可以提前约 3 至 6 个月通知终止。\n跟 Anthropic 的员工打过交道后，他对这个团队改观了。他说这些人有原则、肯干，还专门夸了 Opus 和 Fable。\n2. SpaceX 和 Tesla 合并，马斯克现在觉得有价值\nTesla 在做自动驾驶和 Optimus，SpaceX 有大模型、算力基础设施和芯片研发。两家在 AI 上能一起做的事比 5 年前多了。他甚至认为，未来大部分超级智能的算力可能部署在太空轨道上。\n合并最终得双方股东点头。马斯克也说，他自己的 Tesla 股票奖励应该按公司的经营和估值目标来兑现。\n3. Cybertruck 给 Cybercab 腾产能\nCybertruck 计划在 2027 年年中逐步停产。马斯克说，平均每辆车约有 1.2 名乘客，双座 Cybercab 就能覆盖约 90% 的乘客出行里程。\n多人出行怎么办？Tesla 计划做一款 6 至 7 座、没有方向盘和踏板的自动驾驶版 Model Y，量产时间还没公布。\n4. Starlink 手机直连，接下来要解决室内信号\n第 2 代手机直连卫星计划从 2027 年起发射，带宽预计是第 1 代的约 40 倍。SpaceX 还计划在 2027 年量产使用 800 MHz 频段的屋顶微型基站，补上室内覆盖。\n马斯克认为，AI 和机器人会带来更多通信需求，AT&T 和 Verizon 依然有生意做。他也希望用 Starlink 的收入继续支持 Starship。\n5. 换掉黄仁勋，像连胜球队送走巅峰期的乔丹\n马斯克觉得，黄仁勋最难替代的地方，是几十年积累下来的供应商关系，以及核心员工对他的信任。他说自己当然愿意聘请黄仁勋，也判断对方眼下无意找工作。\n6. 中期选举花了数亿美元，重来一次会少捐\n如果 MAGA 意味着无条件支持共和党，马斯克说自己拒绝这个标签。他说，这次花了数亿美元支持共和党候选人，结果远低于预期，重来一次会少捐 😅\n他希望共和党守住参议院多数席位，理由是美国需要两党互相制衡。\n7. Starlink 全面停服，乌克兰前线可能迅速崩溃\n这是马斯克的判断。他说，Starlink 应用于民用通信，进攻性军事用途应交给 Starshield，相关决策由美国军事指挥体系负责。至于塞瓦斯托波尔，他给出的解释是，当地当时受制裁，Starlink 服务原本就没开通。\nBuy the dip，长期持有，Discord在个人资料","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2123311336134484359","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":2,"vw":511},{"id":"2123310347385753702","h":"ReutersChina","ts":1795071610,"zh":"在华盛顿宣布新的高性能半导体出货限制后，贸易部长佐哈里·阿卜杜勒·加尼周三表示，马来西亚的数据中心运营商应遵守美国对先进人工智能芯片的新限制。","en":"Malaysia's data centre operators should comply with new US restrictions on advanced artificial intelligence chips, Trade Minister Johari Abdul Ghani said on Wednesday after Washington announced fresh curbs on shipments of high-performance semiconductors.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123310347385753702","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/business/finance/malaysia-says-data-centres-m 被别有用心的小作文误导。","en":"转\n【严正澄清】尊敬的客户，近日舆论刻意放大三星代工合规审查政策，编造 “三星全面停接国内算力芯片订单、行业流片一夜断供” 的不实信息，刻意引发国产算力链非理性下跌。我们持续跟踪产业一线，就此严正澄清：\n1. 所谓 “断供” 完全失实。本次审查仅针对通过多层壳公司规避出口管制的违规订单，合规经营的国内客户流片、交付流程全程正常，不存在任何一刀切停单的情况。\n2. 所谓 “断供拖累行业进度” 纯属无稽之谈。国内主流算力芯片厂商，从未将三星先进制程产能作为核心供应来源，本就不存在 “被断供” 的前提。\n3. 产业基本面未受任何影响：国产GPU、高端交换机、超节点整机订单排期已至明年，核心ODM合作厂产能满负荷，客户锁单意愿强烈，景气度持续上行。\n刻意散播恐慌、放大局部合规要求制造利空砸盘，本质是利用信息差收割非理性筹码。本轮下跌是纯粹的情绪错杀，请勿被别有用心的小作文误导。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123305190824788060","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":2,"rp":0,"vw":1720},{"id":"2123303719475478950","h":"qinbafrank","ts":1795070030,"zh":"9月底德鲁肯米勒还有四十多亿美金的股票仓位，现在已经完全清仓，逻辑是什么？对我们的投资交易有何启发？前两天美股机构改革纷纷披露截止9月底的三季度13-F文件，看到不少关于德鲁肯米勒家族办公室的持仓分析，不过现在看来意义都不大了。因为11月18日在奥斯汀举行的TomorrowX峰会上与摩根士丹利全球衍生品业务负责人Iliana Bouzali对谈中，德鲁肯米勒已经明确说都清仓了。一个半月前仓位还很高，现在已经全清掉，这中间的逻辑是什么？详细看完德鲁肯米勒这次谈话全文，有几个点让我印象深刻。\n1、今年1月初为何全力做多？\n1）当时经济非常强劲，更重要的是往前看——联邦基金利率只有 3.5%，而名义GDP 增速高达 6%，这意味着当时的货币政策宽松得简直荒谬！而且看美联储所谓的“点阵图（Dot plot）”，市场还预期今年晚些时候会有更多次降息；\n2）包括铜在内的大宗商品正在向上突破创出新高；\n3）德鲁肯米勒紧盯的腾落指数（Advance-Decline line，衡量市场广度的核心指标）和其他技术指标全都在创新高；\n4）信用利差（Credit spreads）窄到了极点。\n在他看来，在如此过度刺激的货币政策下，未来6 到 12 个月内根本不可能发生经济衰退。\n而去年深秋晚些时候发布的 Claude Code，让所有圈内人（对 AI 的加速爆发兴奋到了极点！ 因此我们对 AI 资本开支（CapEx）极度看多。所有这些因素叠加在一起，让我们在 1 月份全力做多股市和经济。\n2、现在为什么清仓？\n虽然表层经济看起来依然强劲，但年初支持看多的所有其他指标，已经彻底来了个 180 度大反转：\n1）美联储不再降息，而是在加息：我们在美联储迎来了“政权更迭，德鲁肯米勒对沃什非常熟，因为沃什曾在德鲁肯米勒家族办公室在担任合伙人多年，之前这里 15 年我们一直搞“免费资金（零利率）”导致财政赤字和所有债务冲上云霄极其不满，对通胀连续 5 年高于目标更是深恶痛绝。\n2）大宗商品见顶回落，反手做空铜。今年 1 月向上突破的大宗商品，现在看起来已经彻底见顶并掉头向下；\n3）市场广度背离与信用利差走阔。1 月份还在创新高的腾落指数（Advance-Decline line），早在8 月14 日 就已经见顶了，尽管大盘指数一直撑到10月份才见顶；\n4）信用利差正在不断走阔（Widening）。\n在德鲁肯米勒眼里当下所有的宏观与技术指标，都跟今年 1 月份完完全全相反！\n当下他最严肃对待的 AI 看空逻辑是就是政治，以及融资问题\n3、没有做多为什么也没做空？\n他现在既没有做多美股，也没有做空美股。没做空是因为AI 创新的爆发力，他说自己绝不敢去摸老虎屁股做空这里的科技创新！ \n还有一点德鲁肯米勒也承认当下很多科技股近期已经严重超卖、经历了剧烈的仓位洗盘（Washed out），战术层面上机构的仓位已经降下来了。潜在意思他也认为当下做空性价比已经不高了。\n但每当看不清方向的时候他自然会选择不玩了。\n4、AI的下半场是什么？\n在股票市场方面，德鲁肯米勒正在全力寻找“AI 的实际应用用例”，而不是“AI 基础设施”！\nAI 基础设施在经历了近期的剧烈洗盘后，或许会是一笔不错的短线战术交易（Tactical trade），但他也不认为基建硬件还能像过去四年那样，能继续充当主升浪的核心引擎。\n但他认为应用层用例（Use cases）却完全有可能接棒。而且也许最有趣的“应用用例”恰恰就是前沿 AI 实验室自己！他的逻辑是：掌握全球顶级智能的实验室，没有理由继续停留在按token收费的商业模式上。\n“如果你拥有世界上最强的智能，你可以开始卖任务，而不是卖token，你可以自己创建业务，”他说。\n如果接下来股市还会有一波波澜壮阔的大主升浪，他认为核心就是——“卖任务，不卖 Token”。\n这一点是个人很认可的，之前也有聊过 AI主线已经迁移、中游的云厂、下游的应用都值得关注。当然从德鲁肯米勒自己的表态来看他肯定有人在关注Anthropic上市后能介入的机会。\n5、对我们投资交易的启发是什么？\n1）反手的能力\n看德鲁肯米勒这次讲话印象最深的一点，年初他刚刚全力做多没多久，伊朗战争爆发，他也当时慌了神砍掉了一大堆仓位；\n但很很快又把仓位买回来，并且顺势把不会暴涨的杂毛股全清理干净了，让我们结结实实吃下了二季度的这波主升浪。你看发生冲击时他也会慌，也会砍仓，然后再看机会在哪里。\n还有就是9月底他的机构还是高仓位运行、但现在已经清仓、明显在10月初以来的这一波调整中他夜趁机把仓位都砍掉，就是不知道他的回撤有多大。\n但这种“反手”的能力值得我们学习、不让自己的判断成为执念，能随时纠正，这种灵活性是一个投资高手必须要能掌握的。\n2）在棒球比赛里，有远超随机概率的“连续击球手顺期（Hitting streaks）”。\n做投资也一样：\n有时候站在击球区能清清楚楚看清飞过来的球，那就抡圆了胳膊下重注（Play big）；\n而当感觉看不清球的时候，他就只做一点小小的触击短打（Little bunts），等什么时候胜率回升、重新看清球路了，我再重新发力。","en":"9月底德鲁肯米勒还有四十多亿美金的股票仓位，现在已经完全清仓，逻辑是什么？对我们的投资交易有何启发？前两天美股机构改革纷纷披露截止9月底的三季度13-F文件，看到不少关于德鲁肯米勒家族办公室的持仓分析，不过现在看来意义都不大了。因为11月18日在奥斯汀举行的TomorrowX峰会上与摩根士丹利全球衍生品业务负责人Iliana Bouzali对谈中，德鲁肯米勒已经明确说都清仓了。一个半月前仓位还很高，现在已经全清掉，这中间的逻辑是什么？详细看完德鲁肯米勒这次谈话全文，有几个点让我印象深刻。\n1、今年1月初为何全力做多？\n1）当时经济非常强劲，更重要的是往前看——联邦基金利率只有 3.5%，而名义GDP 增速高达 6%，这意味着当时的货币政策宽松得简直荒谬！而且看美联储所谓的“点阵图（Dot plot）”，市场还预期今年晚些时候会有更多次降息；\n2）包括铜在内的大宗商品正在向上突破创出新高；\n3）德鲁肯米勒紧盯的腾落指数（Advance-Decline line，衡量市场广度的核心指标）和其他技术指标全都在创新高；\n4）信用利差（Credit spreads）窄到了极点。\n在他看来，在如此过度刺激的货币政策下，未来6 到 12 个月内根本不可能发生经济衰退。\n而去年深秋晚些时候发布的 Claude Code，让所有圈内人（对 AI 的加速爆发兴奋到了极点！ 因此我们对 AI 资本开支（CapEx）极度看多。所有这些因素叠加在一起，让我们在 1 月份全力做多股市和经济。\n2、现在为什么清仓？\n虽然表层经济看起来依然强劲，但年初支持看多的所有其他指标，已经彻底来了个 180 度大反转：\n1）美联储不再降息，而是在加息：我们在美联储迎来了“政权更迭，德鲁肯米勒对沃什非常熟，因为沃什曾在德鲁肯米勒家族办公室在担任合伙人多年，之前这里 15 年我们一直搞“免费资金（零利率）”导致财政赤字和所有债务冲上云霄极其不满，对通胀连续 5 年高于目标更是深恶痛绝。\n2）大宗商品见顶回落，反手做空铜。今年 1 月向上突破的大宗商品，现在看起来已经彻底见顶并掉头向下；\n3）市场广度背离与信用利差走阔。1 月份还在创新高的腾落指数（Advance-Decline line），早在8 月14 日 就已经见顶了，尽管大盘指数一直撑到10月份才见顶；\n4）信用利差正在不断走阔（Widening）。\n在德鲁肯米勒眼里当下所有的宏观与技术指标，都跟今年 1 月份完完全全相反！\n当下他最严肃对待的 AI 看空逻辑是就是政治，以及融资问题\n3、没有做多为什么也没做空？\n他现在既没有做多美股，也没有做空美股。没做空是因为AI 创新的爆发力，他说自己绝不敢去摸老虎屁股做空这里的科技创新！ \n还有一点德鲁肯米勒也承认当下很多科技股近期已经严重超卖、经历了剧烈的仓位洗盘（Washed out），战术层面上机构的仓位已经降下来了。潜在意思他也认为当下做空性价比已经不高了。\n但每当看不清方向的时候他自然会选择不玩了。\n4、AI的下半场是什么？\n在股票市场方面，德鲁肯米勒正在全力寻找“AI 的实际应用用例”，而不是“AI 基础设施”！\nAI 基础设施在经历了近期的剧烈洗盘后，或许会是一笔不错的短线战术交易（Tactical trade），但他也不认为基建硬件还能像过去四年那样，能继续充当主升浪的核心引擎。\n但他认为应用层用例（Use cases）却完全有可能接棒。而且也许最有趣的“应用用例”恰恰就是前沿 AI 实验室自己！他的逻辑是：掌握全球顶级智能的实验室，没有理由继续停留在按token收费的商业模式上。\n“如果你拥有世界上最强的智能，你可以开始卖任务，而不是卖token，你可以自己创建业务，”他说。\n如果接下来股市还会有一波波澜壮阔的大主升浪，他认为核心就是——“卖任务，不卖 Token”。\n这一点是个人很认可的，之前也有聊过 AI主线已经迁移、中游的云厂、下游的应用都值得关注。当然从德鲁肯米勒自己的表态来看他肯定有人在关注Anthropic上市后能介入的机会。\n5、对我们投资交易的启发是什么？\n1）反手的能力\n看德鲁肯米勒这次讲话印象最深的一点，年初他刚刚全力做多没多久，伊朗战争爆发，他也当时慌了神砍掉了一大堆仓位；\n但很很快又把仓位买回来，并且顺势把不会暴涨的杂毛股全清理干净了，让我们结结实实吃下了二季度的这波主升浪。你看发生冲击时他也会慌，也会砍仓，然后再看机会在哪里。\n还有就是9月底他的机构还是高仓位运行、但现在已经清仓、明显在10月初以来的这一波调整中他夜趁机把仓位都砍掉，就是不知道他的回撤有多大。\n但这种“反手”的能力值得我们学习、不让自己的判断成为执念，能随时纠正，这种灵活性是一个投资高手必须要能掌握的。\n2）在棒球比赛里，有远超随机概率的“连续击球手顺期（Hitting streaks）”。\n做投资也一样：\n有时候站在击球区能清清楚楚看清飞过来的球，那就抡圆了胳膊下重注（Play big）；\n而当感觉看不清球的时候，他就只做一点小小的触击短打（Little bunts），等什么时候胜率回升、重新看清球路了，我再重新发力。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2123303719475478950","l":["x.com","x.com"],"ln":[{"u":"https://x.com/qinbafrank/status/2017205726301823008?a=ish1j1_G9yEALfJyefQ&s=46有聊过。他知道沃什对过去","d":"x.com"},{"u":"https://x.com/qinbafrank/status/2118134547703562723?a=ZHeGwBJN15QLeV2CGek&s=46","d":"x.com"}],"t":["美联储","通胀","美股","AI科技"],"lk":4,"rt":2,"rp":0,"vw":1254},{"id":"2123303708154802641","h":"bbcchinese","ts":1795070027,"zh":"APEC领导人峰会在深圳举行之际，中美俄三国元首习近平、特朗普与普京举行罕有的三边会谈。BBC News中文即将转播。","en":"APEC领导人峰会在深圳举行之际，中美俄三国元首习近平、特朗普与普京举行罕有的三边会谈。BBC News中文即将转播。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2123303708154802641","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4ABriRV","d":"bbc.in"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":797},{"id":"2123303685317169479","h":"dmjk001","ts":1795070022,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXd9cSPbAAAqN3f.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123303685317169479","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":152},{"id":"2123303646456852557","h":"ArtofSpecuycky","ts":1795070013,"zh":"大盘短期看反弹，中期继续看跌\n标普500指数已经连续下跌5个交易日，前三个交易日罕见地连续出现三个派发日，指数下跌成交量放大，每天跌幅超过1%。历史上这种连续放量抛售对应阶段性底部，只不过底部形成过程都非常反复。\n我认为周四上涨概率很大。 加上Anthropic上市带来的情绪提振、打新资金可能回流、中美俄峰会、CTA空头潜在转为多头，以及市场上太多人看空，可能引发Gamma Squeeze和Short Squeeze。目前这个Setup也很像11月6日大涨的那一天，价格行为很相似。\nSPY明天重点关注11月5号低点733附近能否守稳。如果高开并站稳733和开盘价上方，可以顺势做多，第一目标738-740。再往上看745和0.618 fib 749.5，极限ema 20 751.6。\n虽今日标普微跌，但盘面出现Risk-on特征：非必需消费品上涨1.79%，科技股领涨，前期强势的价值股回调，小盘成长股走强，能源股大跌3.27%。资金开始从防御板块重新流向成长板块，对短期反弹是积极信号。\n情绪面还是比较悲观，但比上周好点。最新AAII投资者情绪调查显示，看空比例从上周的51.4%下降至42.2%，看多比例从30.8%回升至33.3%，中性比例从17.8%升至24.4%。 虽然悲观情绪有所缓解，但看空比例还是高于看多比例，Bull-Bear Spread-8.9个百分点。之前连续两周看空比例分别达到48.4%和51.4%，说明市场短期已经经历了一轮恐慌情绪释放。这种情绪环境下，短期还是容易出现技术性反弹。\n不过本质上，我认为QQQ目前还是处于650–700的大区间震荡，策略还是低买高卖。\n2018年历史类比与市场结构\n2026年同样是中期选举年，目前美股和10年期美债收益率的走势与2018年高度吻合，都是在10月初附近见顶回落。10月份连续杀跌后，11月份作为下跌中继，反弹修整一个月。短期还是看反弹，中期接着看跌。\nOpEx、Gamma与VIX\n本周五是月度OpEx，大量负Gamma敞口到期会释放做市商的被动抛压，叠加下周感恩节假期临近，波动率会进一步回落。\n目前SPX全链条总GEX为-15亿美元，其中未来两个交易日到期的合约贡献-10亿美元，已经处于极端负Gamma区域。这种环境下市场容易放大波动，如果开始反弹，也可能引发剧烈的均值回归。\n上方最大的Gamma集中区域在7400，其次是7500。今日7325、7400和7475附近出现明显的看涨期权资金流。如果反弹继续，7400是第一个重要目标，之后看7500。\nVIX也按照预期开始下跌，今日形成Inside Day并收在25下方。25是目前最重要的多空分水岭。 如果继续跌破就看到20。\nQQQ与SPX关键点位\nQQQ原本我的判断是走一个Bear Flag，在11月5日低点附近形成Higher Low后反弹，最多到718 0.618 fib，然后继续下跌。但现在来看，像是走了个Double Bottom。\n大概率还是650–700的箱体震荡下跌中继，只有有效站回702且不再跌回来，才有可能有更大的反弹。\n短线QQQ先看670，上方683.75是200日均线和11月5日破位低点的共振阻力。反弹到这些区域后会遇阻。我希望这个中期诱多反弹最高能到700–710，能到这里就很满意了，当然如果更高更好。\nSPX方面，周线目前处于派发阶段，但机构出货比较慢，所以大概率还要维持一个7300–7600的震荡区间。周线来看，现在很有可能形成一个大级别右肩，后续如果反弹到EMA 20 7540，甚至7600，都是比较理想的做空机会。\n机构仓位与板块轮动\n结合Duality Research与美银基金经理调查数据，基金经理对科技股的配置已经降至2004–2006年以来的低位水平。\n同时，XLP今年上涨20.2%，但EPS增速只有3.1%，绝大部分涨幅来自估值倍数扩张。XLV表现也很不错，这也表现经济周期尾部机构抱团防御的特征。\n这些现象说明机构之前已经降低风险敞口。短期如果市场情绪改善，科技股存在资金回流和仓位修复的机会，但中期风险没有解除。\n交易方向与个股\n短期最好还是以TQQQ、SOXL等指数为主，围绕箱体做波段。个股如果真要选，可以重点围绕AMD、AVGO、SPCX、TSLA和网络安全板块。\nNVDA日线和周线都已经非常超卖，150附近是重要的Put Wall，随时可能出现Dead Cat Bounce的技术性反抽。\n韩国KOSPI目前也在4900–5500区间震荡，趋势线已经破位。后续任何反弹到EMA 20附近的5400–5500，还是我关注的做空机会，中期目标看周线200 EMA附近的4170。","en":"大盘短期看反弹，中期继续看跌\n标普500指数已经连续下跌5个交易日，前三个交易日罕见地连续出现三个派发日，指数下跌成交量放大，每天跌幅超过1%。历史上这种连续放量抛售对应阶段性底部，只不过底部形成过程都非常反复。\n我认为周四上涨概率很大。 加上Anthropic上市带来的情绪提振、打新资金可能回流、中美俄峰会、CTA空头潜在转为多头，以及市场上太多人看空，可能引发Gamma Squeeze和Short Squeeze。目前这个Setup也很像11月6日大涨的那一天，价格行为很相似。\nSPY明天重点关注11月5号低点733附近能否守稳。如果高开并站稳733和开盘价上方，可以顺势做多，第一目标738-740。再往上看745和0.618 fib 749.5，极限ema 20 751.6。\n虽今日标普微跌，但盘面出现Risk-on特征：非必需消费品上涨1.79%，科技股领涨，前期强势的价值股回调，小盘成长股走强，能源股大跌3.27%。资金开始从防御板块重新流向成长板块，对短期反弹是积极信号。\n情绪面还是比较悲观，但比上周好点。最新AAII投资者情绪调查显示，看空比例从上周的51.4%下降至42.2%，看多比例从30.8%回升至33.3%，中性比例从17.8%升至24.4%。 虽然悲观情绪有所缓解，但看空比例还是高于看多比例，Bull-Bear Spread-8.9个百分点。之前连续两周看空比例分别达到48.4%和51.4%，说明市场短期已经经历了一轮恐慌情绪释放。这种情绪环境下，短期还是容易出现技术性反弹。\n不过本质上，我认为QQQ目前还是处于650–700的大区间震荡，策略还是低买高卖。\n2018年历史类比与市场结构\n2026年同样是中期选举年，目前美股和10年期美债收益率的走势与2018年高度吻合，都是在10月初附近见顶回落。10月份连续杀跌后，11月份作为下跌中继，反弹修整一个月。短期还是看反弹，中期接着看跌。\nOpEx、Gamma与VIX\n本周五是月度OpEx，大量负Gamma敞口到期会释放做市商的被动抛压，叠加下周感恩节假期临近，波动率会进一步回落。\n目前SPX全链条总GEX为-15亿美元，其中未来两个交易日到期的合约贡献-10亿美元，已经处于极端负Gamma区域。这种环境下市场容易放大波动，如果开始反弹，也可能引发剧烈的均值回归。\n上方最大的Gamma集中区域在7400，其次是7500。今日7325、7400和7475附近出现明显的看涨期权资金流。如果反弹继续，7400是第一个重要目标，之后看7500。\nVIX也按照预期开始下跌，今日形成Inside Day并收在25下方。25是目前最重要的多空分水岭。 如果继续跌破就看到20。\nQQQ与SPX关键点位\nQQQ原本我的判断是走一个Bear Flag，在11月5日低点附近形成Higher Low后反弹，最多到718 0.618 fib，然后继续下跌。但现在来看，像是走了个Double Bottom。\n大概率还是650–700的箱体震荡下跌中继，只有有效站回702且不再跌回来，才有可能有更大的反弹。\n短线QQQ先看670，上方683.75是200日均线和11月5日破位低点的共振阻力。反弹到这些区域后会遇阻。我希望这个中期诱多反弹最高能到700–710，能到这里就很满意了，当然如果更高更好。\nSPX方面，周线目前处于派发阶段，但机构出货比较慢，所以大概率还要维持一个7300–7600的震荡区间。周线来看，现在很有可能形成一个大级别右肩，后续如果反弹到EMA 20 7540，甚至7600，都是比较理想的做空机会。\n机构仓位与板块轮动\n结合Duality Research与美银基金经理调查数据，基金经理对科技股的配置已经降至2004–2006年以来的低位水平。\n同时，XLP今年上涨20.2%，但EPS增速只有3.1%，绝大部分涨幅来自估值倍数扩张。XLV表现也很不错，这也表现经济周期尾部机构抱团防御的特征。\n这些现象说明机构之前已经降低风险敞口。短期如果市场情绪改善，科技股存在资金回流和仓位修复的机会，但中期风险没有解除。\n交易方向与个股\n短期最好还是以TQQQ、SOXL等指数为主，围绕箱体做波段。个股如果真要选，可以重点围绕AMD、AVGO、SPCX、TSLA和网络安全板块。\nNVDA日线和周线都已经非常超卖，150附近是重要的Put Wall，随时可能出现Dead Cat Bounce的技术性反抽。\n韩国KOSPI目前也在49 行亚太经合组织（APEC）峰会的区域，但专家认为，这不太可能代表金正恩有意出席峰会。","en":"朝鲜（北韩）领导人金正恩周日至周一偕同家人及劳动党官员，前往靠近中国边境的北部观光区视察。\n官方发布的画面显示，其女儿金主爱在滑雪时未佩戴安全帽。\n此次访问正值白宫和克里姆林宫先后释出讯号，暗示可能与金正恩举行会谈之际。\n尽管行程地点靠近正在中国深圳举行亚太经合组织（APEC）峰会的区域，但专家认为，这不太可能代表金正恩有意出席峰会。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123255919454887936/vid/avc1/608x1080/fta8LMpkaQiJvDLm.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2123280107183788081","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1748},{"id":"2123280007749636566","h":"cnfinancewatch","ts":1795064377,"zh":"\"不是牛市太短，是利润兑现不了。\n公司赚钱，才有钱回报股东，才有长牛。\"\n2020年以来，中国新增了 5万亿美元 GDP——\n但中国股票跑输全球 110%，宏观增长没有转化为股权回报。\n利润年年不及年初预期（连续 9 年落空）→ 增发摊薄 → 估值收缩，三刀齐下，股东所剩无几。","en":"\"不是牛市太短，是利润兑现不了。\n公司赚钱，才有钱回报股东，才有长牛。\"\n2020年以来，中国新增了 5万亿美元 GDP——\n但中国股票跑输全球 110%，宏观增长没有转化为股权回报。\n利润年年不及年初预期（连续 9 年落空）→ 增发摊薄 → 估值收缩，三刀齐下，股东所剩无几。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123280007749636566","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1531},{"id":"2123278479613718858","h":"tig88411109","ts":1795064012,"zh":"Anthropic明天史上最大IPO上市，按83定价市值1.5万亿，开盘情绪饱满或许市值破2万亿。买什么？背着万亿算力账单的“纯血AI顶级模型第一股？\n真正投资亮点在哪里？都知道买股票看未来，为何不买谷歌。\n看它招股说明书唯一在于， $ANT未来愿景是要打造垂直整合，专有芯片，自己的数据中心，实现软硬协同设计的成本/效率/算力的系统护城河。\n这不就是谷歌 $GOOG么，现市值3.5万亿，剔除在Anthropic和SpaceX的股权，多花一万亿就能再给你全套互联网搜索/安卓入口，第一视频Youtube，自研芯片TPU，谷歌云。\n最新发布的Gemini 4 Neon已经把前沿模型的代差抹平甚至领先。\n那么问题来了，是Anthropic高估了？还是Google低估了？","en":"Anthropic明天史上最大IPO上市，按83定价市值1.5万亿，开盘情绪饱满或许市值破2万亿。买什么？背着万亿算力账单的“纯血AI顶级模型第一股？\n真正投资亮点在哪里？都知道买股票看未来，为何不买谷歌。\n看它招股说明书唯一在于， $ANT未来愿景是要打造垂直整合，专有芯片，自己的数据中心，实现软硬协同设计的成本/效率/算力的系统护城河。\n这不就是谷歌 $GOOG么，现市值3.5万亿，剔除在Anthropic和SpaceX的股权，多花一万亿就能再给你全套互联网搜索/安卓入口，第一视频Youtube，自研芯片TPU，谷歌云。\n最新发布的Gemini 4 Neon已经把前沿模型的代差抹平甚至领先。\n那么问题来了，是Anthropic高估了？还是Google低估了？","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdmFtyawAALNtI.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2123278479613718858","l":[],"ln":[],"t":["AI科技"],"lk":8,"rt":0,"rp":3,"vw":1328},{"id":"2123277185482113140","h":"dmjk001","ts":1795063704,"zh":"针对市场流传的某版 “算力芯片流片来源梳理”，结合我们产业链跟踪，做几点差异化汇报，供参考：\n代工结构修正：不能简单按 “海外 / 国内” 一刀切\n【寒武纪】690 从 26 年起主力已切 S；并非 “三星断供即没戏”。\n【天数 / 燧原】并非纯台积依赖，两家均有 S/H 产能储备，冲击程度要看各家配额。\n【壁仞】代工以 H 为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600 走 S 的 n+1 国产闭环。\n【平头哥】S + 三星双源，不是 H 为主。\n【摩尔 / 昆仑芯 / 芯原】均有 S 产能并行，不能按 “海外代工 = 规避” 直接外推。关于 “三星 / 台积穿透严查”BIS 新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升 + 边际收紧。","en":"针对市场流传的某版 “算力芯片流片来源梳理”，结合我们产业链跟踪，做几点差异化汇报，供参考：\n代工结构修正：不能简单按 “海外 / 国内” 一刀切\n【寒武纪】690 从 26 年起主力已切 S；并非 “三星断供即没戏”。\n【天数 / 燧原】并非纯台积依赖，两家均有 S/H 产能储备，冲击程度要看各家配额。\n【壁仞】代工以 H 为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600 走 S 的 n+1 国产闭环。\n【平头哥】S + 三星双源，不是 H 为主。\n【摩尔 / 昆仑芯 / 芯原】均有 S 产能并行，不能按 “海外代工 = 规避” 直接外推。关于 “三星 / 台积穿透严查”BIS 新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升 + 边际收紧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123277185482113140","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1392},{"id":"2123276957089669612","h":"xingpt","ts":1795063649,"zh":"效率与回本，决定 AI 投资能否持续：\n按照摩根大通的模型，每建设 1GW 算力需要约 400 亿美元投资，每年需要约 220 亿美元的终端 AI 支出来支撑。要达到 2029 年的收入门槛，终端 AI 市场需要维持约 80% 的年复合增长。\n接下来决定行业回报的关键，是单位算力成本下降的速度，以及新增资本开支转化为收入和自由现金流的效率。\nAI 投资最终将从比拼谁投入更多资本，转向比拼谁能用更低的成本创造更多收入。","en":"效率与回本，决定 AI 投资能否持续：\n按照摩根大通的模型，每建设 1GW 算力需要约 400 亿美元投资，每年需要约 220 亿美元的终端 AI 支出来支撑。要达到 2029 年的收入门槛，终端 AI 市场需要维持约 80% 的年复合增长。\n接下来决定行业回报的关键，是单位算力成本下降的速度，以及新增资本开支转化为收入和自由现金流的效率。\nAI 投资最终将从比拼谁投入更多资本，转向比拼谁能用更低的成本创造更多收入。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdiVnhawAAdzum.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123276957089669612","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":225},{"id":"2123276952413020352","h":"xingpt","ts":1795063648,"zh":"2. AI资本开支先投入，再获利：\n2026 年全球 AI 资本开支已经接近万亿美元规模，几大hyperscaler：Amazon、Google、Microsoft、Meta 仍在加速建设，马斯克也计划进一步扩张算力，如果 2027 年实际新增 7GW，SpaceX按照每 GW 300 亿美元计算，仅这一项就需要约 2,100 亿美元。\n未来三年，AI 基础设下载施投资将持续领先于商业收入兑现。2029 年将是关键验证窗口：数万亿美元的算力投入，必须逐渐转化为真实的云收入、推理需求和企业 AI 付费。","en":"2. AI资本开支先投入，再获利：\n2026 年全球 AI 资本开支已经接近万亿美元规模，几大hyperscaler：Amazon、Google、Microsoft、Meta 仍在加速建设，马斯克也计划进一步扩张算力，如果 2027 年实际新增 7GW，SpaceX按照每 GW 300 亿美元计算，仅这一项就需要约 2,100 亿美元。\n未来三年，AI 基础设下载施投资将持续领先于商业收入兑现。2029 年将是关键验证窗口：数万亿美元的算力投入，必须逐渐转化为真实的云收入、推理需求和企业 AI 付费。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdk8i6bwAEx45t.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123276952413020352","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":285},{"id":"2123276948038381943","h":"xingpt","ts":1795063647,"zh":"摩根大通：AI投入到底多少，能赚钱吗？什么时候开始盈利？\n1. 当前 AI 的账，怎么算？\n摩根大通测算：全球到 2029 年建成约 129GW 的 AI 算力，需要累计投入约 5.16 万亿美元，每年创造约 2.84 万亿美元的终端收入才能支撑这套基础设施。\n企业、消费者和政府的潜在 AI 支出合计约 3.65 万亿美元，其中企业贡献近 70%。这意味着 AI 商业化的核心战场在企业端，只有 AI Agent 真正进入工作流程、创造生产率价值，数万亿美元的市场才能成立。","en":"摩根大通：AI投入到底多少，能赚钱吗？什么时候开始盈利？\n1. 当前 AI 的账，怎么算？\n摩根大通测算：全球到 2029 年建成约 129GW 的 AI 算力，需要累计投入约 5.16 万亿美元，每年创造约 2.84 万亿美元的终端收入才能支撑这套基础设施。\n企业、消费者和政府的潜在 AI 支出合计约 3.65 万亿美元，其中企业贡献近 70%。这意味着 AI 商业化的核心战场在企业端，只有 AI Agent 真正进入工作流程、创造生产率价值，数万亿美元的市场才能成立。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdh7_haoAA3-c8.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123276948038381943","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":2,"vw":821},{"id":"2123276726004498849","h":"dmjk001","ts":1795063594,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXdk6WGagAAuTyb.png?name=orig"],"u":"https://x.com/dmjk001/status/2123276726004498849","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":0,"vw":1995},{"id":"2123275678544171352","h":"fxtrader","ts":1795063344,"zh":"进入会议室时，特朗普还特意假装惊讶，停步并指了一下普京，笑问“他是谁？”","en":"进入会议室时，特朗普还特意假装惊讶，停步并指了一下普京，笑问“他是谁？”","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123274044069883905/vid/avc1/1280x720/q5ZDxzQ5NtZsyGa3.mp4?tag=29"],"u":"https://x.com/fxtrader/status/2123275678544171352","l":[],"ln":[],"t":[],"lk":17,"rt":0,"rp":1,"vw":6771},{"id":"2123275044789035115","h":"fxtrader","ts":1795063193,"zh":"特朗普与普京握手致意：“我们彼此认识很久了，我认为会有很多好事发生。”","en":"特朗普与普京握手致意：“我们彼此认识很久了，我认为会有很多好事发生。”", 中承担\"质量守门人\"角色。\n弹性标的方面，#华东重机通过锐信图芯切入图形GPU赛道，但芯片设计业务上半年营收仅1759.98万元、占总营收2.32%，主力仍是港口装卸装备；#旋极信息参股曲速科技，后者研发TGU推理芯片。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123273725173010548","l":[],"ln":[],"t":["AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":2032},{"id":"2123273673884725329","h":"bbcchinese","ts":1795062867,"zh":"APEC领导人峰会在深圳举行，习近平将在会议周边会晤特朗普，成为今年以来第三次“习特会”。BBC News中文即将转播。","en":"APEC领导人峰会在深圳举行，习近平将在会议周边会晤特朗普，成为今年以来第三次“习特会”。BBC News中文即将转播。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2123273673884725329","l":["bbc.in"],"ln":[{"u":"https://bbc.in/3VDtXf4","d":"bbc.in"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":849},{"id":"2123272667792826669","h":"ReutersChina","ts":1795062627,"zh":"俄罗斯总统弗拉基米尔·普京在中国对亚太经合组织领导人表示，俄罗斯是亚太地区不可分割的一部分，他敦促各国使用俄罗斯的物流基础设施，并表示莫斯科正在为地区粮食和能源安全做出贡献。 Russia-is-integral-part-asia-pacific-putin-tells-apec-leaders-2026-11-19/?taid=6afe7b634f7b1a0001e4ae4d&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","en":"Russia is an integral part of the Asia-Pacific region, President Vladimir Putin told APEC leaders in China, as he urged nations to use Russian logistics infrastructure and said Moscow was contributing to regional food and energy security.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123272667792826669","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/russia-is-integral-part-asia-pacific-putin-tells-apec-leaders-2026-11-19/?taid=6afe7b634f7b1a0001e4ae4d&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["原油能源"],"lk":0,"rt":0,"rp":0,"vw":338},{"id":"2123272387106066726","h":"cnfinancewatch","ts":1795062560,"zh":"一个人打烂饭碗受到严惩，\n导致九十九人不敢洗碗！","en":"一个人打烂饭碗受到严惩，\n导致九十九人不敢洗碗！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123272387106066726","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":215},{"id":"2123272112509276203","h":"cnfinancewatch","ts":1795062494,"zh":"第六天连续4千多家股票下跌，\n这种跌法，不少融资盘要爆仓了","en":"第六天连续4千多家股票下跌，\n这种跌法，不少融资盘要爆仓了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123272112509276203","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":3,"vw":798},{"id":"2123271600837628348","h":"qinbafrank","ts":1795062372,"zh":"腾讯认为资本开支高峰是什么时候以及28年之后硬件价格会如何？昨天腾讯三季度财报，大家关注最多的是workbuddy日活超千万用户，每日累计消耗Token超过100万亿；再一个就是负自由现金流人民币691亿元。其实个人角度更值得关注的腾讯是如何看待资本开支以及硬件价格走势的。\n在腾讯第三季度业绩电话会上，Bernstein的分析师Robin G提出的关于资本开支/预付款进展及美国限制影响的问题。看看这个问题的详细问答\nBernstein的Robin G：\n我想提两个问题。首先，我们已经连续两个季度的资本开支和预付款支出都非常高。我想了解一下，腾讯在这一轮激进的算力采购支出中目前进展如何？按照您的判断，我们距离达到理想的算力水平还有多远？另外，美国的限制措施将如何影响我们现有的以及未来的算力合作？这是否会对我们此前在云业务及其他领域看到的增长势头产生不利影响？其次，Work Buddy的表现非常出色。想请管理层评估一下该业务未来的机会空间——从用户增长来看，其可触达的市场和收入利润潜力主要集中在重度用户群体吗？考虑到半导体领域的限制，这一增长前景是否存在风险？\n腾讯首席战略官詹姆斯·米歇尔 / James Mitchell回答：\n那么，Robin，我先来回答关于预付款项和资本开支，以及先进制程半导体限制对云业务收入增长影响的几个问题。关于预付款项，大家知道，第二季度和第三季度的支出水平异常偏高，而我们现在已签署了此前计划签订的长期合同，因此预付款项的流出将逐步减少。事实上，未来某些季度可能会出现因取消此前已预付的合同而导致预付款项回流的情况。不过，随着近期资本开支相关条款的变化，我们正在逐步退出这部分预付款项的影响。至于当前的现金资本开支水平，我们认为应以现金口径来看待，这一数字约为650亿元人民币，而非810亿元人民币的权责发生制资本开支。因为如果同时考虑预付款项和资本开支，就应该统一以现金资本开支口径进行核算；否则，将预付款项与权责发生制资本开支叠加计算，就会造成重复计数。\n总之，从现金资本开支的水平来看，我们认为目前已处于阶段性高位，预计在2026年和2027年剩余时间内，该指标可能在这一峰值附近呈现季度间的波动。此后，我们预计其将进一步回落。\n至于这些限制对我们的云业务有何影响，我们实际上并未看到任何冲击。因为目前我们的云业务主要以推理为主，且重点运行诸如HY 4 Flash等高能效推理模型以及其他Flash系列模型。而且，在当前阶段，这些推理任务已能在数量出奇有限的国产芯片上高效执行。\n因此，我认为过去12个月里，我们在推理效率方面实现了显著提升，从而使得仅靠国产芯片就能处理远超一年前预期的更大规模的token流量。而云业务收入的核心驱动力正是推理。所以，我们认为此次变化不会对我们的云业务收入造成实质性不利影响。\n腾讯总裁马丁·刘 / 刘炽平补充回答：\n我想就詹姆斯刚才谈到的内容补充几点。首先，在资本开支方面，我认为目前我们投入的这些资本支出，实际上是为了夯实基础设施，从而推动我们的AI原生业务尽快起步。现阶段有点像在建一座工厂，以便开展模型训练和Token生成工作。其本质在于，一旦建成这套设施，后续就可以持续用于训练新一代模型，并不断产出新的Token。\n因此，我们在26年和27年进行了相关投入后，进入28年，趋势就会逐步改善，因为我们可以持续利用26年和27年所建设的基础设施。\n其次，我们在26年和27年实际看到的定价水平确实偏高。进入28年，即便采购需求不变，价格也应会显著回落。\n第三，也是我认为最重要的一点：经过对模型训练与推理环节的持续优化，我们发现计算效率正以极快的速度逐年提升。这意味着，随着技术进步，在保持相同算力投入的前提下，我们将能够实现更高的训练效率，以及更大的Token产出规模。综合以上因素，我们认为28年及以后的业绩表现将更加出色。\n简单说：\n1）腾讯自己认为当下就是资本开支的高点，26年四季度和27年资本开支就在当下的规模水平左右，之后会进步下滑。\n2）28年硬件采购的价格会回落即使需求不变。\n3）28年随着26、27年建设的投入落地，业绩表现会非常好。也是之前聊到的数据中心建设节奏、算力陆续落地、大云厂商的业绩会很好。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"腾讯认为资本开支高峰是什么时候以及28年之后硬件价格会如何？昨天腾讯三季度财报，大家关注最多的是workbuddy日活超千万用户，每日累计消耗Token超过100万亿；再一个就是负自由现金流人民币691亿元。其实个人角度更值得关注的腾讯是如何看待资本开支以及硬件价格走势的。\n在腾讯第三季度业绩电话会上，Bernstein的分析师Robin G提出的关于资本开支/预付款进展及美国限制影响的问题。看看这个问题的详细问答\nBernstein的Robin G：\n我想提两个问题。首先，我们已经连续两个季度的资本开支和预付款支出都非常高。我想了解一下，腾讯在这一轮激进的算力采购支出中目前进展如何？按照您的判断，我们距离达到理想的算力水平还有多远？另外，美国的限制措施将如何影响我们现有的以及未来的算力合作？这是否会对我们此前在云业务及其他领域看到的增长势头产生不利影响？其次，Work Buddy的表现非常出色。想请管理层评估一下该业务未来的机会空间——从用户增长来看，其可触达的市场和收入利润潜力主要集中在重度用户群体吗？考虑到半导体领域的限制，这一增长前景是否存在风险？\n腾讯首席战略官詹姆斯·米歇尔 / James Mitchell回答：\n那么，Robin，我先来回答关于预付款项和资本开支，以及先进制程半导体限制对云业务收入增长影响的几个问题。关于预付款项，大家知道，第二季度和第三季度的支出水平异常偏高，而我们现在已签署了此前计划签订的长期合同，因此预付款项的流出将逐步减少。事实上，未来某些季度可能会出现因取消此前已预付的合同而导致预付款项回流的情况。不过，随着近期资本开支相关条款的变化，我们正在逐步退出这部分预付款项的影响。至于当前的现金资本开支水平，我们认为应以现金口径来看待，这一数字约为650亿元人民币，而非810亿元人民币的权责发生制资本开支。因为如果同时考虑预付款项和资本开支，就应该统一以现金资本开支口径进行核算；否则，将预付款项与权责发生制资本开支叠加计算，就会造成重复计数。\n总之，从现金资本开支的水平来看，我们认为目前已处于阶段性高位，预计在2026年和2027年剩余时间内，该指标可能在这一峰值附近呈现季度间的波动。此后，我们预计其将进一步回落。\n至于这些限制对我们的云业务有何影响，我们实际上并未看到任何冲击。因为目前我们的云业务主要以推理为主，且重点运行诸如HY 4 Flash等高能效推理模型以及其他Flash系列模型。而且，在当前阶段，这些推理任务已能在数量出奇有限的国产芯片上高效执行。\n因此，我认为过去12个月里，我们在推理效率方面实现了显著提升，从而使得仅靠国产芯片就能处理远超一年前预期的更大规模的token流量。而云业务收入的核心驱动力正是推理。所以，我们认为此次变化不会对我们的云业务收入造成实质性不利影响。\n腾讯总裁马丁·刘 / 刘炽平补充回答：\n我想就詹姆斯刚才谈到的内容补充几点。首先，在资本开支方面，我认为目前我们投入的这些资本支出，实际上是为了夯实基础设施，从而推动我们的AI原生业务尽快起步。现阶段有点像在建一座工厂，以便开展模型训练和Token生成工作。其本质在于，一旦建成这套设施，后续就可以持续用于训练新一代模型，并不断产出新的Token。\n因此，我们在26年和27年进行了相关投入后，进入28年，趋势就会逐步改善，因为我们可以持续利用26年和27年所建设的基础设施。\n其次，我们在26年和27年实际看到的定价水平确实偏高。进入28年，即便采购需求不变，价格也应会显著回落。\n第三，也是我认为最重要的一点：经过对模型训练与推理环节的持续优化，我们发现计算效率正以极快的速度逐年提升。这意味着，随着技术进步，在保持相同算力投入的前提下，我们将能够实现更高的训练效率，以及更大的Token产出规模。综合以上因素，我们认为28年及以后的业绩表现将更加出色。\n简单说：\n1）腾讯自己认为当下就是资本开支的高点，26年四季度和27年资本开支就在当下的规模水平左右，之后会进步下滑。\n2）28年硬件采购的价格会回落即使需求不变。\n3）28年随着26、27年建设的投入落地，业绩表现会非常好。也是之前聊到的数据中心建设节奏、算力陆续落地、大云厂商的业绩会很好。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/21232716 杆保证金业务仍部分依赖外部清算伙伴；\nBackpack的DCO则明确包含保证金期货，对杠杆永续合约的自主清算更为直接。\n现在就期待后续美股个股永续合约真正在Backpack上线交易了。","en":"一周集齐DCM、DCO、FCM，对Backpack而言，意味着具备了在美国合规开展杠杆永续合约业务的所有基础设施条件：可以自主上市合约、接收并保管客户资金、完成清算，并在CFTC和NFA的监管框架下运营，至此在交易所、清算所和客户中介三层全部落地，Backapck形成完整的垂直监管合规架构。\nDCM+DCO+FCM的组合，是目前美国合规框架下衍生品也最完整也是最高级别的基础设施配置。Backpack用一周时间把这三张牌收齐，这样其衍生品业务不仅牌照数量上跟Coinbase一样，甚至牌照的覆盖范围还要大。\n两者现在都具备端到端的美国合规衍生品能力。区别在于清算范围：\nCoinbase Clearing目前主要覆盖全额抵押产品，杠杆保证金业务仍部分依赖外部清算伙伴；\nBackpack的DCO则明确包含保证金期货，对杠杆永续合约的自主清算更为直接。\n现在就期待后续美股个股永续合约真正在Backpack上线交易了。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdMNiCbAAA2JQa.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123250635403653594","l":[],"ln":[],"t":["美股"],"lk":19,"rt":0,"rp":11,"vw":7294},{"id":"2123250327814357008","h":"xingpt","ts":1795057300,"zh":"【一年后，我不再用 WHOOP 了】\n我准备把 Whoop 换成佳明的 CIRQA 手环。这个是 2026 年 7 月新出的佳明手环，对标的就是 Whoop。\n佳明这个是一次性大概 200 美金买断，而 Whoop 是 200 美金订阅一年，每年都要重复付费，所以佳明长期来看更划算。\n另外我发现 Whoop 测睡眠特别不准，特别是一些短时间的睡眠其实不是很准，所以我想用佳明试试。而且我最看重的身体年龄这个指标两个也都有，所以我可能会换佳明试试。","en":"【一年后，我不再用 WHOOP 了】\n我准备把 Whoop 换成佳明的 CIRQA 手环。这个是 2026 年 7 月新出的佳明手环，对标的就是 Whoop。\n佳明这个是一次性大概 200 美金买断，而 Whoop 是 200 美金订阅一年，每年都要重复付费，所以佳明长期来看更划算。\n另外我发现 Whoop 测睡眠特别不准，特别是一些短时间的睡眠其实不是很准，所以我想用佳明试试。而且我最看重的身体年龄这个指标两个也都有，所以我可能会换佳明试试。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdMkMYbkAAkZJF.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123250327814357008","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":305},{"id":"2123250235430605117","h":"cnfinancewatch","ts":1795057278,"zh":"大金融、大消费已经涨了一段；目前大盘靠大金融和大消费还比较难。\n目前大金融等在休息，但科技还是不涨。\n比较悲观的看法是大金融消息，大盘就回落。\n科技和金融都跌，就是没人气。\n很像924行情前那段。\n多看券商。银行和保险没力气了么。","en":"大金融、大消费已经涨了一段；目前大盘靠大金融和大消费还比较难。\n目前大金融等在休息，但科技还是不涨。\n比较悲观的看法是大金融消息，大盘就回落。\n科技和金融都跌，就是没人气。\n很像924行情前那段。\n多看券商。银行和保险没力气了么。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123250235430605117","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":347},{"id":"2123250070925594861","h":"ReutersChina","ts":1795057239,"zh":"美国总统唐纳德·特朗普表示，他周四与中国国家主席习近平和俄罗斯总统弗拉基米尔·普京的会晤在举行之前就已经是一次“胜利”，因为中国给予了他热烈的欢迎。","en":"US President Donald Trump said his meeting on Thursday with Chinese and Russian counterparts Xi Jinping and Vladimir Putin was already a \"win\" before it took place, as China gave him a warm welcome.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123250070925594861","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/trumps-historic-meeting-with-xi-putin-headlines-asia-trip-2026-11-18/?taid=6afe665779338c000111de8b&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":285},{"id":"2123249918475411534","h":"nytchinese","ts":1795057203,"zh":"特朗普抵达深圳：展示友好关系，无视间谍丑闻。习近平亲自到机场迎接，两人在红毯上拥抱。特朗普已经表示，他无意提起涉及黄仁勋的这起重大间谍丑闻。此次行程重头戏将是他与习近平、普京的三方会晤。","en":"特朗普抵达深圳：展示友好关系，无视间谍丑闻。习近平亲自到机场迎接，两人在红毯上拥抱。特朗普已经表示，他无意提起涉及黄仁勋的这起重大间谍丑闻。此次行程重头戏将是他与习近平、普京的三方会晤。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2123249918475411534","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/world/20261119/trump-xi-shenzhen-spy-scandal/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":786},{"id":"2123249198896382082","h":"bboczeng","ts":1795057031,"zh":"华尔街日报：英伟达5000亿美元芯片融资计划至今零资金到位，预计2027年前不会有交易执行\n今年8月，英伟达（$NVDA）宣布与阿波罗，黑石（Blackstone）、贝莱德（BlackRock）、布鲁克菲尔德（Brookfield）、高盛（Goldman Sachs）和KKR合作，计划动员5000亿美元资金，帮助OpenAI、Anthropic以及规模较小的AI云计算公司等客户为购买芯片融资。\n但该协议只是一份寥寥数页的谅解备忘录。各家机构均无义务募集任何资金，目前也没有任何资金到位。","en":"华尔街日报：英伟达5000亿美元芯片融资计划至今零资金到位，预计2027年前不会有交易执行\n今年8月，英伟达（$NVDA）宣布与阿波罗，黑石（Blackstone）、贝莱德（BlackRock）、布鲁克菲尔德（Brookfield）、高盛（Goldman Sachs）和KKR合作，计划动员5000亿美元资金，帮助OpenAI、Anthropic以及规模较小的AI云计算公司等客户为购买芯片融资。\n但该协议只是一份寥寥数页的谅解备忘录。各家机构均无义务募集任何资金，目前也没有任何资金到位。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123249198896382082","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":497},{"id":"2123248964925628548","h":"BrantChinesefn","ts":1795056975,"zh":"如果你是黄仁勋，回到英伟达会先干什么？我想即便裁掉董事会不是第一件要做的事情，也是priority。那董事会能不知道吗，所以现在一定会想尽办法不让老黄回来。对立非常清晰。\n以黄仁勋的地位，不可能不知道董事会现在的态度，但却在业绩前的重要节点把自己愿意回归的想法公布出来，这里面一定有故事。把矛盾都引向董事会。\n一场公司内部和政府在背后谋划的阴谋也好，阳谋也罢，正在上演。这些东西看不清，分析不明，这 $nvda怎么做。止跌震荡是一段时间内最好的结局了，无非是震荡的幅度可能稍大些罢了。","en":"如果你是黄仁勋，回到英伟达会先干什么？我想即便裁掉董事会不是第一件要做的事情，也是priority。那董事会能不知道吗，所以现在一定会想尽办法不让老黄回来。对立非常清晰。\n以黄仁勋的地位，不可能不知道董事会现在的态度，但却在业绩前的重要节点把自己愿意回归的想法公布出来，这里面一定有故事。把矛盾都引向董事会。\n一场公司内部和政府在背后谋划的阴谋也好，阳谋也罢，正在上演。这些东西看不清，分析不明，这 $nvda怎么做。止跌震荡是一段时间内最好的结局了，无非是震荡的幅度可能稍大些罢了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/BrantChinesefn/status/2123248964925628548","l":[],"ln":[],"t":["AI科技"],"lk":12,"rt":0,"rp":2,"vw":897},{"id":"2123248586645512399","h":"hanking66","ts":1795056885,"zh":"美光管理层在11月18日TomorrowX Summit表示，过去一个月客户需求没有转弱，供给仍紧、定价环境仍有利，2027年约75%的产出已售出，并已与客户讨论2028年承诺。\n终于等到美光管理层最新的表态，目前没有看出需求转弱的迹象😅\n关于半导体需求转弱的问题，我依旧没有看到任何实质性的迹象，无论是企业财报，电话会议，高管言论，供应链上下游，产品价格。有的全是华尔街小作文，分析师预测，散户臆想…而这些全都是因为股价跌了…\n我不是无脑看多，也不是一条路走到黑，而是我的确没看到可以说服我的证据，我不会因为周围人说半导体行情结束了就认为结束了，也不会因为股价跌了就觉得自己看错了😅，如果我看到实质性的证据或者数据，我会改变看法的，可惜目前没看到😅\n有人说等你看到了，市场早就跌完了，也许是的，市场行情往往走在事实之前，但前提是市场看对了方向，目前看市场只是在担心勿虚有的事情😅\nBuy the dip，长期持有，Discord在个人资料。","en":"美光管理层在11月18日TomorrowX Summit表示，过去一个月客户需求没有转弱，供给仍紧、定价环境仍有利，2027年约75%的产出已售出，并已与客户讨论2028年承诺。\n终于等到美光管理层最新的表态，目前没有看出需求转弱的迹象😅\n关于半导体需求转弱的问题，我依旧没有看到任何实质性的迹象，无论是企业财报，电话会议，高管言论，供应链上下游，产品价格。有的全是华尔街小作文，分析师预测，散户臆想…而这些全都是因为股价跌了…\n我不是无脑看多，也不是一条路走到黑，而是我的确没看到可以说服我的证据，我不会因为周围人说半导体行情结束了就认为结束了，也不会因为股价跌了就觉得自己看错了😅，如果我看到实质性的证据或者数据，我会改变看法的，可惜目前没看到😅\n有人说等你看到了，市场早就跌完了，也许是的，市场行情往往走在事实之前，但前提是市场看对了方向，目前看市场只是在担心勿虚有的事情😅\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdLVLubcAAd-74.jpg?name=orig"],"u":"https://x.com/hanking66/status/2123248586645512399","l":[],"ln":[],"t":["AI科技","财报"],"lk":6,"rt":1,"rp":2,"vw":1026},{"id":"2123248579334787251","h":"nytchinese","ts":1795056884,"zh":"习近平与高市早苗简短会面，中日关系无解冻迹象。这是自一年前中日爆发激烈外交争端以来，两国领导人首次接触。两人简短握手，气氛紧张。专家表示，这次互动不太可能标志着中日关系出现任何实质性解冻。","en":"习近平与高市早苗简短会面，中日关系无解冻迹象。这是自一年前中日爆发激烈外交争端以来，两国领导人首次接触。两人简短握手，气氛紧张。专家表示，这次互动不太可能标志着中日关系出现任何实质性解冻。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2123248579334787251","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/world/20261119/xi-jinping-china-sanae-takaichi-japan/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":1743},{"id":"2123247775660064859","h":"bboczeng","ts":1795056692,"zh":"是的，这代表他们已经看到或者掌握了对黄仁勋非常不利的证据\n所以不论员工如何联署，都无法答应他们的请求\n也不便出面解释\n相信调查，相信听证会，相信Board\n是我们唯一的选择","en":"是的，这代表他们已经看到或者掌握了对黄仁勋非常不利的证据\n所以不论员工如何联署，都无法答应他们的请求\n也不便出面解释\n相信调查，相信听证会，相信Board\n是我们唯一的选择","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123247775660064859","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":765},{"id":"2123244076678185279","h":"CrushTheShorts","ts":1795055810,"zh":"谢谢，稳的一逼，稳的像一条索马里的路边野狗🤢🤢🤢\n-------------------------------------------------\n经济日报：稳资本市场意义重大\n11月19日｜经济日报刊文指出，稳，是当前资本市场的主基调。“增强股市内在稳定性”“进一步深化市场稳定长效机制研究”“全力维护市场平稳运行”……近段时间，各方密集发声，持续释放稳市信号。作为牵一发而动全身的枢纽，资本市场的稳定运行历来意义重大。放到当下，这种重要性更是前所未有地凸显。\n从市场体量看，资本市场的地位“与日俱重”。当前A股市场拥有5500多家上市公司，总市值突破100万亿元，新经济领域公司数量、营收、市值占比均超过一半。现阶段的资本市场，已经不仅仅是一个投资交易场所，更是科技创新的“发动机”、产业升级的“推进器”。\n立足经济发展全局，资本市场的作用不可替代。中国式现代化全面提速，“十五五”时期要推进发展新质生产力、构建新发展格局、建设现代化经济体系等任务繁重，目标高远，每一场硬仗都离不开创新资本的加速集聚、金融资源的优化配置，都离不开一个稳定资本市场的有力支撑。\n资本市场稳不稳，是信心稳不稳、预期好不好、经济循环畅不畅的重要变量，事关国家创新体系整体效能，事关高质量发展全局。经济发展动能转换，需要资本市场发挥稳定的枢纽功能。新一轮科技革命奔涌向前，需要资本市场展现稳定的陪跑耐力。在激烈国际竞争中赢得战略主动，需要资本市场积蓄稳定的托举力量。","en":"谢谢，稳的一逼，稳的像一条索马里的路边野狗🤢🤢🤢\n-------------------------------------------------\n经济日报：稳资本市场意义重大\n11月19日｜经济日报刊文指出，稳，是当前资本市场的主基调。“增强股市内在稳定性”“进一步深化市场稳定长效机制研究”“全力维护市场平稳运行”……近段时间，各方密集发声，持续释放稳市信号。作为牵一发而动全身的枢纽，资本市场的稳定运行历来意义重大。放到当下，这种重要性更是前所未有地凸显。\n从市场体量看，资本市场的地位“与日俱重”。当前A股市场拥有5500多家上市公司，总市值突破100万亿元，新经济领域公司数量、营收、市值占比均超过一半。现阶段的资本市场，已经不仅仅是一个投资交易场所，更是科技创新的“发动机”、产业升级的“推进器”。\n立足经济发展全局，资本市场的作用不可替代。中国式现代化全面提速，“十五五”时期要推进发展新质生产力、构建新发展格局、建设现代化经济体系等任务繁重，目标高远，每一场硬仗都离不开创新资本的加速集聚、金融资源的优化配置，都离不开一个稳定资本市场的有力支撑。\n资本市场稳不稳，是信心稳不稳、预期好不好、经济循环畅不畅的重要变量，事关国家创新体系整体效能，事关高质量发展全局。经济发展动能转换，需要资本市场发挥稳定的枢纽功能。新一轮科技革命奔涌向前，需要资本市场展现稳定的陪跑耐力。在激烈国际竞争中赢得战略主动，需要资本市场积蓄稳定的托举力量。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2123244076678185279","l":[],"ln":[],"t":["财报"],"lk":2,"rt":0,"rp":0,"vw":1556},{"id":"2123242823134884315","h":"bbcchinese","ts":1795055511,"zh":"日本首相高市早苗周三（11月18日）抵达中国深圳，出席亚太经济合作组织（APEC）峰会。这是她上任以来首次访问中国。\n她在欢迎晚宴上与中国领导人习近平握手。这也是自她去年发表“台湾有事”论引发中日关系恶化以来，双方首次接触。\n然而，她扺达机场时，欢迎仪式相对简单，与到访的其他国家领导人的接待形成对比。","en":"日本首相高市早苗周三（11月18日）抵达中国深圳，出席亚太经济合作组织（APEC）峰会。这是她上任以来首次访问中国。\n她在欢迎晚宴上与中国领导人习近平握手。这也是自她去年发表“台湾有事”论引发中日关系恶化以来，双方首次接触。\n然而，她扺达机场时，欢迎仪式相对简单，与到访的其他国家领导人的接待形成对比。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123242692587188224/vid/avc1/1080x1920/Ig8zMjQ3Xyy6DJGp.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2123242823134884315","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1262},{"id":"2123242487472963670","h":"ReutersChina","ts":1795055431,"zh":"美国总统唐纳德·特朗普表示，他曾与中国国家主席习近平讨论过人工智能，而提到前英伟达首席执行官黄仁勋只是“简短”地提及。","en":"US President Donald Trump said he spoke to Chinese President Xi Jinping about artificial intelligence, and that reference to former Nvidia CEO Jensen Huang only came up \"briefly.\"","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123242487472963670","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/technology/trump-says-he-referred-ex-nvidia-boss-huangs-situation-briefly-talk-with-xi-2026-11-19/?taid=6afe5f4779338c000111de49&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":330},{"id":"2123240498303521197","h":"xingpt","ts":1795054957,"zh":"今日寄语","en":"今日寄语","zh_src":"native","lang":"ja","m":["https://pbs.twimg.com/media/HXdD-YFbsAAPlBt.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123240498303521197","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":1,"vw":576},{ 盘核验，本档没有新的完整日线需要改写。\n #工商银行 $601398 昨日平收9.06元，5日涨6.21%，20日涨7.22%，距20日高0.44%。触发是银行ETF不破5日线；失效是放量跌破5日或板块5日涨幅快速回吐。高位持盈，不追开盘。\n #中国平安 $601318 昨日跌0.46%，20日涨6.25%，距20日高0.88%，和保险ETF一样走平。触发是保险随银行继续抗跌；失效是独自走弱并跌破近日平台。\n #美的集团 $000333 昨日涨0.34%，5日涨6.81%，20日涨11.67%，距20日高0.77%。触发是家电ETF守住5日上行；失效是长阴跌破5日线。不追涨停杂毛。\n #格力电器 $000651 昨日涨0.22%，5日涨5.41%，20日涨9.75%，距20日高1.01%。触发与美的相同；失效是明显弱于美的并跌破5日。\n #长江电力 $600900 昨日涨0.26%，5日涨4.07%，20日涨3.75%，距20日高0.29%，红利属性清楚。触发是高息资产继续被承接；失效是跌破5日并放量。\n #北方华创 $002371 昨日涨0.93%，5日涨4.77%，20日涨2.33%，距20日高2.61%，位置比中芯和华虹更有余地。触发是半导体制造和设备在高开或平开后能够站稳；失效是放量回吐近日涨幅。开盘若因期货转强而跳空，先看成份，不预先加仓。\n#国电南瑞 $600406 第一版未取到完整日线，本档仍不写入样本。\n#小盘阿尔法\n本档仍不选。热榜里能看到的小票，多是连板后已经伸展， #华东重机 $002685 仍是四连板， #九阳股份 $002242\n20日大涨后昨日跌停、热度刚刚回落，缺少完整市值与财报互证的底部右侧标的，不符合入选条件。\n#操作提示\n今天比七点档更需要把高开和能追分开。期货和日经把隔夜美股的分化修得更漂亮了，开盘很容易把半导体制造、PCB和算力租赁再抬一截，但位置、杠杆和昨夜英伟达的收盘都还在。银行、家电、电力仍是相对抵抗方向，也多在20日高附近，只做持盈和回调再看，不在竞价里抬轿。\n#华虹公司 $688347 、 #沪电股份 $002463 开盘不追； #北方华创 $002371 只作为方向样本。 #中际旭创\n$300308 、 #新易盛 $300502 、 #胜宏科技 $300476\n仍在20日深跌区间，先观察不抄。短剧影视和刚跌停的小家电一律不抄。盯9点25分竞价，看银行ETF和红利ETF能否顶住，以及高开是否主要出现在科创和算力。美联储纪要偏鹰、今晚Anthropic上市和沃尔玛财报，都还是外部扰动。若高开低走，要能及时减。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#期货 两小时更新\n这是本档变化最大的一组数。纳指期货约08:58报27573点附近，较第一版的27238点明显上修，较结算涨约1.42%，盘中高点约27585、低点27169。标普500期货约7393点，涨约0.72%；道指期货约50489点，涨约0.43%。黄金约3753美元，比第一版的3731美元有所回升；WTI原油期货约81.81美元，和第一版的81.93美元相差不大。离岸人民币约6.6666，和第一版的6.668几乎走平。A股股指期货没有夜盘，仍是11月18日收盘：沪深300期货IF收3928.4点，上证50期货IH收2731.2点，中证500期货IC收6194.0点，中证1000期货IM收5987.4点。富时A50连续报价本档未取到可靠数据，标注缺失。港股9:30才开，以开盘现货为准。韩国股市今日推迟开市一小时，截稿前没有盘中数据。\n#三个方向\n一是银行与红利，不变。融资盘继续撤退的阶段，更要靠它守，但龙头多在20日高附近，竞价不追跳空。\n二是家电与必选消费，不变。华泰今早对必选消费的温和复苏判断，和中信建投内需磨底、出海定胜负的家电策略，都指向看 #美的集团 $000333\n、 #格力电器 $000651 这类龙头，不看已经连板或刚跌停的杂毛。\n三是半导体制造的事件余波，方向不变，弹性预期上调。日经高开和纳指期货转强，说明亚洲已经愿意给隔夜的弱势做修复，A股制造、设备和PCB大概率比第一版预想的更高开，但5日、20日仍是下跌共振，英伟达昨夜又是高开低走，只观察不追高；CPO和光模块位置仍差，不并入这一方向。腾讯提到的国产算力，也只加强观察，不改仓位纪律。\n#六只个股\n名单与第一版相同，位置数据仍用昨日收盘核验，本档没有新的完整日线需要改写。\n #工商银行 $601398 昨日平收9.06元，5日涨6.21%，20日涨7.22%，距20日高0.44%。触发是银行ETF不破5日线；失效是放量跌破5日或板块5日涨幅快速回吐 n【天数/燧原】并非纯台积依赖，两家均有S/H产能储备，冲击程度要看各家额。\n【壁仞】代工以H为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600走S的n+1国产闭环\n【平头哥】S+三星双源，不是H为主。\n【摩尔/昆仑芯/芯原】均有S产能并行，不能按“海外代工=规避”直接外推。\n#关于“三星/台积穿透严查”\nBIS新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升+边际收紧。\n#关于腾讯资本开支：市场最容易误读\n腾讯3Q26资本开支814亿，预付大头对应5500合规N卡及部分高端B卡，但据产业跟踪实际到货比例很低。管理层业绩会明确：长协已签完，后续预付款流出下降，个别季度可能出现回冲（部分未交付合同资金回流）；现金CapEx当前处于峰值，#2026余下时间+2027年围绕峰值波动，2028后才回落。\n我们认为前期腾讯备卡严重不足，27年反而是激进补库窗口——N卡不够就转国产。所以“2028资本开支下滑”≠“算力需求下行”，而是高价抢卡期结束后的自然斜率放缓。#把腾讯资本开支回落理解成行业beta向下，是误读。\n#投资结论差异\n当前竞争已从“单芯片参数”进入“产品力×产能配额×大客户绑定”系统竞争；\n中芯华虹不是纯beta博弈——大厂缺卡是强现实，27年腾讯等CSP仍要激进补库，需求端有支撑。关键跟踪：估值位置、产能优先级、HBM供给节奏、整机交付验收；国产算力我们看结构性机会，有风险的是无产能保障的二三线，不是“代工在海外”的全部标的。","en":"领导好，针对今早市场流传的某版“算力芯片流片来源梳理”，结合我们产业链跟踪，做几点差异化汇报，供参考（信息勿转发）：\n#代工结构修正：不能简单按“海外/国内”一刀切\n【寒武纪】690从26年起主力已切S；并非“三星断供即没戏”。\n【天数/燧原】并非纯台积依赖，两家均有S/H产能储备，冲击程度要看各家额。\n【壁仞】代工以H为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600走S的n+1国产闭环\n【平头哥】S+三星双源，不是H为主。\n【摩尔/昆仑芯/芯原】均有S产能并行，不能按“海外代工=规避”直接外推。\n#关于“三星/台积穿透严查”\nBIS新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升+边际收紧。\n#关于腾讯资本开支：市场最容易误读\n腾讯3Q26资本开支814亿，预付大头对应5500合规N卡及部分高端B卡，但据产业跟踪实际到货比例很低。管理层业绩会明确：长协已签完，后续预付款流出下降，个别季度可能出现回冲（部分未交付合同资金回流）；现金CapEx当前处于峰值，#2026余下时间+2027年围绕峰值波动，2028后才回落。\n我们认为前期腾讯备卡严重不足，27年反而是激进补库窗口——N卡不够就转国产。所以“2028资本开支下滑”≠“算力需求下行”，而是高价抢卡期结束后的自然斜率放缓。#把腾讯资本开支回落理解成行业beta向下，是误读。\n#投资结论差异\n当前竞争已从“单芯片参数”进入“产品力×产能配额×大客户绑定”系统竞争；\n中芯华虹不是纯beta博弈——大厂缺卡是强现实，27年腾讯等CSP仍要激进补库，需求端有支撑。关键跟踪：估值位置、产能优先级、HBM供给节奏、整机交付验收；国产算力我们看结构性机会，有风险的是无产能保障的二三线，不是“代工在海外”的全部标的。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2123237442874728581","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":3,"vw":1509},{"id":"2123236946592022899","h":"ShanghaoJin","ts":1795054110,"zh":"这才哪跟哪啊","en":"这才哪跟哪啊","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/ShanghaoJin/status/2123236946592022899","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":1576},{"id":"2123233137828536612","h":"bbcchinese","ts":1795053202,"zh":"美国总统特朗普（Donald Trump）与俄罗斯总统普京（Vladimir Putin）周三在深圳APEC峰会欢迎晚宴期间会面，这是两人一年多来首次碰面。两人周四将与中国国家主席习近平举行历史性三方会谈。","en":"美国总统特朗普（Donald Trump）与俄罗斯总统普京（Vladimir Putin）周三在深圳APEC峰会欢迎晚宴期间会面，这是两人一年多来首次碰面。两人周四将与中国国家主席习近平举行历史性三方会谈。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123232734546198528/vid/avc1/1080x1920/6x40NTtJ7QQy7xZ7.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2123233137828536612","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":3,"vw":3502},{"id":"2123232072219369694","h":"nytchinese","ts":1795052948,"zh":"APE峰会期间，深圳变“空城”。学校停课，企业员工居家办公，许多居民离开了这座城市。峰会期间多条道路封闭，安保举措尤为严密。几乎没有人敢表达任何疑虑，只能无奈地接受这种干扰。“即使我们对此感到不悦，也不能直说，”一位居民表示。“政府不喜欢听到我们的不满。”","en":"APE峰会期间，深圳变“空城”。学校停课，企业员工居家办公，许多居民离开了这座城市。峰会期间多条道路封闭，安保举措尤为严密。几乎没有人敢表达任何疑虑，只能无奈地接受这种干扰。“即使我们对此感到不悦，也不能直说，”一位居民表示。“政府不喜欢听到我们的不满。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2123232072219369694","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/china/20261119/a-tropical-chinese-city-is-half-empty-and-ready-for-the-summit/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":6,"rt":0,"rp":11,"vw":2597},{"id":"2123231185535160498","h":"tig88411109","ts":1795052737,"zh":"黄金大跌14个月低点，还有谁鼓吹看衰美元美债，去买黄金？\n全球投资者都不傻，特别是韩国人惊弓之鸟，近期最大美债配置就是韩国。\n那么为何黄金大跌背后的直接原因是加息利率冲击。看看下面这是清楚的黄金投资底层逻辑🔽","en":"黄金大跌14个月低点，还有谁鼓吹看衰美元美债，去买黄金？\n全球投资者都不傻，特别是韩国人惊弓之鸟，近期最大美债配置就是韩国。\n那么为何黄金大跌背后的直接原因是加息利率冲击。看看下面这是清楚的黄金投资底层逻辑🔽","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXc7gw9bsAAY3Dl.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2123231185535160498","l":[],"ln":[],"t":["美联储","黄金"],"lk":3,"rt":0,"rp":0,"vw":1496},{"id":"2123230326956970303","h":"fxtrader","ts":1795052532,"zh":"被问及黄乐（Alice Huang）的问题时，特朗普表示自己并未听说这件事构成国家安全威胁，并调侃“任何中国美女都会被美国视为间谍”。\n特朗普不希望，英伟达能够生产芯片，却不允许向海外销售。还暗示两三年后，自己还在的话，可能放宽Blackwell芯片的出口。","en":"被问及黄乐（Alice Huang）的问题时，特朗普表示自己并未听说这件事构成国家安全威胁，并调侃“任何中国美女都会被美国视为间谍”。\n特朗普不希望，英伟达能够生产芯片，却不允许向海外销售。还暗示两三年后，自己还在的话，可能放宽Blackwell芯片的出口。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video 2123223571111510294","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":6,"rt":0,"rp":1,"vw":759},{"id":"2123222071224180964","h":"bbcchinese","ts":1795050563,"zh":"亚太经合组织（APEC）领导人峰会在深圳登场，习近平将与各成员国与地区首脑合照，然后出席峰会。BBC News中文现场直播。","en":"亚太经合组织（APEC）领导人峰会在深圳登场，习近平将与各成员国与地区首脑合照，然后出席峰会。BBC News中文现场直播。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2123222071224180964","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4l0QzjT","d":"bbc.in"}],"t":[],"lk":5,"rt":0,"rp":1,"vw":5891},{"id":"2123219929042207147","h":"ReutersChina","ts":1795050053,"zh":"据韩联社周四报道，韩国青瓦台周三表示，没有发现美国和朝鲜之间可能举行的会谈有任何具体进展。","en":"South Korea's presidential office said on Wednesday it had detected no particular developments on possible talks between the United States and North Korea, Yonhap news agency reported on Thursday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123219929042207147","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/south-korea-sees-no-particular-sign-imminent-us-north-korea-talks-yonhap-says-2026-11-18/?taid=6afe4a454f7b1a0001e4accf&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":354},{"id":"2123217424313114797","h":"tig88411109","ts":1795049456,"zh":"看最新公布的10月份美联储会议纪要，就知道对冲基金这种墙头草过去6周月创纪录的卖出，背后恐慌在哪里？\n但是基金经理错误在于，没有理解美联储这种“就怕流氓有文化”\n美联储理事好比足球裁判给艺术体操打分。一帮搞货币的懂科技创新这种非线性的预测？\n全篇纪要中，美联储理事大谈AI投资过度的什么表外融资，循环融资风险，AI投资回报不及预期将导致系统风险\n这种无知者无畏的精神，历史上美联储多次犯错。最著名就是格林斯潘96年警告“非理性繁荣”，内部美联储预测股市大跌20%会刺穿泡沫，结果呢，2000年拐点提前整整4年。\n其他比如08年次贷危机前，还说次贷风险“相对有限”，21年通胀失控前，还说疫情放水没关系。\n我一直强调很多遍，就是美联储本身就是制造市场波动的最大风险。太多滥竽充数的理事，或许懂货币懂信用市场，但是对于这种非连续性的指数型的变化，人类从来没有预测能力。\n表外融资，不是等于黑市造假；循环融资不是等于庞氏骗局。根本性在于要理解，科技革命带来的生产率的提升，短期和中期的矛盾。美联储如果没有任何证据，直接判断当前AI融资是脆弱的，这就是误导整个市场，加剧市场波动。\n而且更重要在于，大幅提升风险溢价和信用的瓶颈，反而让科技本身能够提升供给，压缩通胀的能力下降，恶化长期通胀前景。\n特别是一些胡说八道的理事，去年那个沃勒还说要降息，今年就说12月要加0.5%。这意味着什么对于投资策略？\n市场有大量的认知差超额收益的空间。空头的最大炸弹就在于是不是美联储连续加息犯错刺穿泡沫。当然概率不大，政策风险叙事压缩短期估值，正是出现长期买点的重大机会。特别是对冲基金这种墙头草过去6周月创纪录的卖出恐慌下。\n具体颗粒度更细见投资策略周报订阅者分享。","en":"看最新公布的10月份美联储会议纪要，就知道对冲基金这种墙头草过去6周月创纪录的卖出，背后恐慌在哪里？\n但是基金经理错误在于，没有理解美联储这种“就怕流氓有文化”\n美联储理事好比足球裁判给艺术体操打分。一帮搞货币的懂科技创新这种非线性的预测？\n全篇纪要中，美联储理事大谈AI投资过度的什么表外融资，循环融资风险，AI投资回报不及预期将导致系统风险\n这种无知者无畏的精神，历史上美联储多次犯错。最著名就是格林斯潘96年警告“非理性繁荣”，内部美联储预测股市大跌20%会刺穿泡沫，结果呢，2000年拐点提前整整4年。\n其他比如08年次贷危机前，还说次贷风险“相对有限”，21年通胀失控前，还说疫情放水没关系。\n我一直强调很多遍，就是美联储本身就是制造市场波动的最大风险。太多滥竽充数的理事，或许懂货币懂信用市场，但是对于这种非连续性的指数型的变化，人类从来没有预测能力。\n表外融资，不是等于黑市造假；循环融资不是等于庞氏骗局。根本性在于要理解，科技革命带来的生产率的提升，短期和中期的矛盾。美联储如果没有任何证据，直接判断当前AI融资是脆弱的，这就是误导整个市场，加剧市场波动。\n而且更重要在于，大幅提升风险溢价和信用的瓶颈，反而让科技本身能够提升供给，压缩通胀的能力下降，恶化长期通胀前景。\n特别是一些胡说八道的理事，去年那个沃勒还说要降息，今年就说12月要加0.5%。这意味着什么对于投资策略？\n市场有大量的认知差超额收益的空间。空头的最大炸弹就在于是不是美联储连续加息犯错刺穿泡沫。当然概率不大，政策风险叙事压缩短期估值，正是出现长期买点的重大机会。特别是对冲基金这种墙头草过去6周月创纪录的卖出恐慌下。\n具体颗粒度更细见投资策略周报订阅者分享。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcudxAaQAAgo95.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2123217424313114797","l":[],"ln":[],"t":["美联储","通胀"],"lk":12,"rt":1,"rp":0,"vw":1530},{"id":"2123216211429437800","h":"fxtrader","ts":1795049166,"zh":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","en":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcpTTQbIAAca6R.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123216211429437800","l":[],"ln":[],"t":["美股"],"lk":6,"rt":1,"rp":3,"vw":3629},{"id":"2123215835527532873","h":"darrencao2024","ts":1795049077,"zh":"我只看前瞻pe 不是ttm","en":"我只看前瞻pe 不是ttm","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123215835527532873","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":797},{"id":"2123215824458838166","h":"qinbafrank","ts":1795049074,"zh":"感觉AI时代最硬的需求应该还是安全了，每发生一次重大安全事故，企业对安全的需求就又多了一分。这个板块调整的时候跌的少、反弹也是最快最猛的。","en":"感觉AI时代最硬的需求应该还是安全了，每发生一次重大安全事故，企业对安全的需求就又多了一分。这个板块调整的时候跌的少、反弹也是最快最猛的。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXctiTubsAADO8v.jpg?name=orig","https://pbs.twimg.com/media/HXctiTsbMAA-fMM.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123215824458838166","l":[],"ln":[],"t":[],"lk":12,"rt":1,"rp":5,"vw":3859},{"id":"2123213641457787250","h":"huiying_lii","ts":1795048554,"zh":"我的首席执行官，最棒的首席执行官","en":"My CEO, best CEO","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/huiying_lii/status/2123213641457787250","l":[],"ln":[],"t":[],"lk":314,"rt":20,"rp":15,"vw":5353},{"id":"2123212487546020124","h":"dmjk001","ts":1795048279,"zh":"OpenAI首款AI硬件或于年底启动出货，立讯精密等中国供应商参与\n11月19日，据供应链消息，OpenAI首款AI端侧硬件产品或将于今年年底启动出货，多家中国厂商参与该项目。其中，立讯精密独家承担整机制造，并供应核心零部件。关于这款产品形态OpenAI尚未正式公布。不过，此前有消息称，OpenAI与苹果前首席设计官Jony Ive团队合作开发的首款消费级硬件，将是一款类似“甜甜圈”形状的无屏AI设备，集成麦克风、扬声器、摄像头及多种传感器，主要通过语音与用户交互，并具备感知周围环境的能力，但具体产品信息仍有待进一步确认。（每经）","en":"OpenAI首款AI硬件或于年底启动出货，立讯精密等中国供应商参与\n11月19日，据供应链消息，OpenAI首款AI端侧硬件产品或将于今年年底启动出货，多家中国厂商参与该项目。其中，立讯精密独家承担整机制造，并供应核心零部件。关于这款产品形态OpenAI尚未正式公布。不过，此前有消息称，OpenAI与苹果前首席设计官Jony Ive团队合作开发的首款消费级硬件，将是一款类似“甜甜圈”形状的无屏AI设备，集成麦克风、扬声器、摄像头及多种传感器，主要通过语音与用户交互，并具备感知周围环境的能力，但具体产品信息仍有待进一步确认。（每经）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123212487546020124","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":494},{"id":"2123212168661483899","h":"dmjk001","ts":1795048203,"zh":"【关于昇腾扩产预期与GPU代工风险汇报】\n一、华为昇腾：2027年国产算力供给有望大幅提升\n据产业链测算，昇腾950DT采用双芯片设计，960DT采用四芯片设计，单颗芯片面积约400—430mm²。按照12英寸晶圆、60%—70%良率估算，单片晶圆可产出约80—90颗有效芯片。若2027年中芯国际N+2工艺分配给昇腾的产能达到2万片/月，全年理论产出约1920万—2160万颗芯片，对应950DT约960万—1080万颗，或960DT约480万—540万颗。960DT虽然数量减半，但凭借HBM、互联及封装升级，系统性能有望实现3—4倍提升。 #市场另有先进制程产能提升至10万片/月的传闻、实际供给还需考虑良率、封装及其他芯片产能竞争（华丰科技、航天电器）\n二、国产GPU厂商：海外代工依赖成为核心变量\n近期产业链传闻，#三星可能加强晶圆代工及终端客户穿透审查，若属实，部分国产GPU企业2027年收入兑现面临风险。\n1、寒武纪： 690/580以国内代工为主，部分产品涉及台积电、三星。\n2、海光信息： CPU以国内代工为主，DCU据传依赖三星。\n3、摩尔线程： 新一代产品逐步转向中芯国际，仍需关注良率和交付。\n4、沐曦股份： 据传对三星依赖较高，国内工艺产品商业化尚待验证。\n5、天数智芯、燧原科技等： 海外先进制程依赖风险值得关注。\n6、壁仞科技、平头哥、昆仑芯： 代工来源存在差异，需分别评估技术成熟度及产能兑现。\n三、我们判断：国产晶圆制造战略价值进一步提升\n若海外代工限制升级，国产AI芯片产业链将加速向中芯国际、华虹等本土晶圆厂集中。华为昇腾凭借国内制造体系及超节点架构，有望强化国产算力竞争优势。\n结论：#重点跟踪华为昇腾国产链、中芯国际、华虹半导体，以及国产GPU厂商的实际代工来源和交付能力。以上代工信息及扩产数字，仅供内部研判，不宜作为确定性事实。","en":"【关于昇腾扩产预期与GPU代工风险汇报】\n一、华为昇腾：2027年国产算力供给有望大幅提升\n据产业链测算，昇腾950DT采用双芯片设计，960DT采用四芯片设计，单颗芯片面积约400—430mm²。按照12英寸晶圆、60%—70%良率估算，单片晶圆可产出约80—90颗有效芯片。若2027年中芯国际N+2工艺分配给昇腾的产能达到2万片/月，全年理论产出约1920万—2160万颗芯片，对应950DT约960万—1080万颗，或960DT约480万—540万颗。960DT虽然数量减半，但凭借HBM、互联及封装升级，系统性能有望实现3—4倍提升。 #市场另有先进制程产能提升至10万片/月的传闻、实际供给还需考虑良率、封装及其他芯片产能竞争（华丰科技、航天电器）\n二、国产GPU厂商：海外代工依赖成为核心变量\n近期产业链传闻，#三星可能加强晶圆代工及终端客户穿透审查，若属实，部分国产GPU企业2027年收入兑现面临风险。\n1、寒武纪： 690/580以国内代工为主，部分产品涉及台积电、三星。\n2、海光信息： CPU以国内代工为主，DCU据传依赖三星。\n3、摩尔线程： 新一代产品逐步转向中芯国际，仍需关注良率和交付。\n4、沐曦股份： 据传对三星依赖较高，国内工艺产品商业化尚待验证。\n5、天数智芯、燧原科技等： 海外先进制程依赖风险值得关注。\n6、壁仞科技、平头哥、昆仑芯： 代工来源存在差异，需分别评估技术成熟度及产能兑现。\n三、我们判断：国产晶圆制造战略价值进一步提升\n若海外代工限制升级，国产AI芯片产业链将加速向中芯国际、华虹等本土晶圆厂集中。华为昇腾凭借国内制造体系及超节点架构，有望强化国产算力竞争优势。\n结论：#重点跟踪华为昇腾国产链、中芯国际、华虹半导体，以及国产GPU厂商的实际代工来源和交付能力。以上代工信息及扩产数字，仅供内部研判，不宜作为确定性事实。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123212168661483899","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":621},{"id":"2123212074537152647","h":"fxtrader","ts":1795048180,"zh":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n另外，Anthropic设置了F类股，拥有公司普通股东投票事项中合计50.1%的投票权。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","en":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n另外，Anthropic设置了F类股，拥有公司普通股东投票事项中合计50.1%的投票权。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcpTTQbIAAca6R.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123212074537152647","l":[],"ln":[],"t":["美股"],"lk":0,"rt":0,"rp":1,"vw":1789},{"id":"2123210083861672428","h":"darrencao2024","ts":1795047705,"zh":"你的名字这家公司 今天我买了点😂","en":"你的名字这家公司 今天我买了点😂","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123210083861672428","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":666},{"id":"212320935
