HBM 相当，这将有助于在 2027 年第一季度稳定内存价格，并引发 2027 年第三季度的 PC 出货量复苏。\n●OEM 激进的库存去风险\n一线 PC OEM 将 DRAM 覆盖从 6 个月削减至 3–4 个月，CPU 覆盖至 2 个月，将成品库存保持在 30–40 天，以避免高成本库存敞口。","en":"●GB300 生产与交付\n一家全球 AI 服务器 OEM 在 2026 年第三季度实现约 700 机架的 GB300 NVL72 产能，按计划交付约 600 机架，其中 90% 供应给云服务提供商。\n●Vera Rubin 推迟至 2027 年 Q1\n下一代 Vera Rubin 产量原定 2026 年 12 月少于 100 机架，因电网瓶颈和 HBM4 良率低，推迟至 2027 年第一季度；2027 年目标为 5,000–6,000 机架，平均售价约 800 万美元。\n●电力：广泛延误\n数据中心电网连接积压，导致所有客户层级的部署延误 1–3 个月，具体取决于公用事业队列。\n●Neocloud 管道高风险\n计算租赁客户的第三季度谅解备忘录环比增长不到 50%，仅有 30–40% 转化为具有约束力的采购订单，原因是融资紧张和单位经济性疲软。\n●价格战风险与超大规模商稳定性\n商品计算租赁引发价格战，并导致 Neocloud 在 2027 年上半年对后续采购订单犹豫不决；而自筹资金的超大规模商则保持高转化率。\n●2027 年 OEM 配额调整\nDell 的 GB300 / Vera Rubin 分配将持平至适度增长；Lenovo 的 NVL 配额将从 7% 上升至 10%，继系统审计和 NVIDIA 认证之后。\n●消费硬件严重下滑\n2026 年 PC 出货量预计为 6,300 万台（50% 为 AI PC）；2026 年第三季度 PC 出货量同比下降 22–23%，手机出货量同比下降 40–50%，原因是内存成本膨胀。\n●内存成本激增与 ASP 策略\nDRAM 现货价格较 2025 年第二季度翻了四倍，推动内存 BOM 占比从 18–20% 上升至 35–38%；供应商依赖更高的平均售价和高端产品组合来抵消入门级需求疲软。\n●三星晶圆转移与 2027 年复苏\n预计三星将在 2026 年第四季度将产能从 HBM 转移回 DRAM，因为 DRAM 利润率与 HBM 相当，这将有助于在 2027 年第一季度稳定内存价格，并引发 2027 年第三季度的 PC 出货量复苏。\n●OEM 激进的库存去风险\n一线 PC OEM 将 DRAM 覆盖从 6 个月削减至 3–4 个月，CPU 覆盖至 2 个月，将成品库存保持在 30–40 天，以避免高成本库存敞口。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2119721524471214479","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":591},{"id":"2119718130914107561","h":"SCMPNews","ts":1794215159,"zh":"在马来西亚，纳吉布的软禁使宫殿与检察官对立","en":"In Malaysia, Najib’s house arrest pits palace against prosecutors","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119718130914107561","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/week-asia/people/article/3373784/malaysia-najibs-house-arrest-pits-palace-against-prosecutors?utm_medium=Social&utm_source=Twitter#Echobox=1794215158","d":"scmp.com"}],"t":[],"lk":1,"rt":1,"rp":1,"vw":951},{"id":"2119717209417171383","h":"SCMPNews","ts":1794214939,"zh":"印度尼西亚考虑在总统窃听后进行宫殿窃听","en":"Indonesia mulls palace bug sweeps after presidential wiretaps","zh_src":"bin 的吗？求分享","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2119688982200209618","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":4,"vw":2705},{"id":"2119686780978913567","h":"cnfinancewatch","ts":1794207685,"zh":"A股盘中 11月9日\n先说结论：指数小幅分化，赚钱效应集中在题材与电子硬件，不是普涨日。上证微红、深成和创业板翻绿，涨少跌多，风格略偏中小盘。盘中主线仍是商业航天与卫星、人形机器人，另加一条资金最扎实的PCB与光通信；早盘提过的光伏设备今日走弱并净流出，尾盘不宜再当进攻仓。仓位中性，只跟消息和资金共振的方向，高位连板与字辈情绪票防兑现。\n#盘面速览\n截至约14:53，上证3661.88点涨0.35%，深成指11155.76点跌0.18%，创业板指2461.35点跌0.16%，科创50报1258.83点涨0.45%，沪深300涨约0.08%。上证口径上涨约959家、下跌约1331家，指数靠权重与局部热点撑着，多数个股并不舒服。两市成交额合计约1.43万亿元，量能尚可但结构极不均衡。国证2000涨约0.32%，上证50几乎走平，中小盘略强于权重，却谈不上全面风险偏好回升。\n#板块风格\n行业涨幅靠前的是焦炭、卫浴电器、煤炭与动力煤、印制电路板、燃气。概念侧6G、纳米银、毫米波、机器人执行器、光通信模块、人形机器人、卫星互联网、商业航天居前。跌幅侧教育、宠物食品、钾肥、锂、逆变器、光伏电池组件与光伏设备靠后。进攻落在航天机器人与PCB硬件，煤炭燃气偏周期脉冲；成长里光伏链今日是撤的。整体更像主题轮动，而不是指数趋势日。\n#资金面\n行业主力净流入靠前：电子约91亿、通信设备约37亿、元件与印制电路板各约36亿、通信约32亿，半导体与消费电子也有流入。净流出侧电力设备、电池与锂电池、光伏设备、逆变器、计算机靠前，非银与证券同步失血。光通信模块、商业航天、卫星互联网、CPO等概念净流入也靠前，说明钱在硬件与航天事件里打转。北向实时接口全日返回占位零值，北向净流入数据暂不可用。\n#涨停\n东财涨停池接口今日暂不可用；公开情绪统计约14:44口径涨停约54家、炸板约44、封板率约五成五，主线标注航天与机器人，PCB亦有涨停扩散。人气端东方字辈、制冷冰雪、航天材料仍活跃，封板质量一般，炸板偏多说明情绪已过脉冲高峰，追高性价比低。\n#盘中消息\n周末催化延续到盘中：太空算力与星舰叙事抬升商业航天；苹果HALO人形控制系统在宇树G1验证，推高机器人溢价。PCB则交易供应偏紧与松下湖口厂火灾扰动，覆铜板和电子布涨价链被反复定价，景旺、胜宏、沪电等业绩链同步走强。汽车出口冲高、进博会与中美经贸缓和偏宏观，对当日主线映射弱于航天、机器人、PCB。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #东方海洋 002086 、 #日出东方 603366 、 #宇树科技 $688836 、 #中国卫星 $600118 、 #信维通信 $300136 、 #大东方 600327 、 #东方新能 002310 、 #东方日升 300118 等。同花顺热榜亦见东方海洋、宇树、冰山冷热、东山精密、中际旭创。字辈与主线交叉票权重大，需区分纯情绪与有订单映射；字辈票可以提供流动性，不宜当基本面仓。\n#中美映射\n美股主题ETF仍用11月6日收盘窗口：5日光伏TAN领先，20日偏医疗与必选消费；半导体中期仍弱。A股今日刷新：机器人相关ETF近20日与近5日都强；卫星偏5日；光伏设备近5日涨幅仍高，但今日板块资金流出，超短共振松动。盘中更干净的是航天事件驱动加PCB供需，而非早盘的光伏修复。医疗器械与创新药的20日趋势共振今天没有成为主战场。\n#三个方向\n商业航天与卫星通信：消息与人气共振，优先组网、载荷与材料，避开纯联想票。\n人形机器人与具身智能：HALO催化仍在，本体作方向观察，执行与热管理里挑有辨识度的，不追亏损高标。\nPCB与光通信：资金净流入最集中，供需与涨价可核验，是今日最扎实的硬件仓，但短线已经启动，注意回撤。\n#六只个股\n1. #中国卫星 $600118 ：约57.7元、涨约4.9%；近20日约+10%、5日约+3.6%。三季报营收同比约+28%，利润大幅改善，位置低于部分连板情绪票。\n2. #信维通信 $300136 ：涨约12.6%；近5日约+11%、20日基本持平。三季报营收微增、利润略承压，短线属性更重，适合当卫星通信弹性观察。\n3. #西部材料 $002149 ：涨停；近20日约+35%、5日约+20%，市值约200亿。三季报营收略降、净利下滑，按航天材料主题仓看钛材订单，不按业绩趋势仓。\n4. #宇树科技 $688836 ：涨约9%；近20日约+70%，市值与人气都顶格，适合观察方向，不宜单押，更不宜当小仓唯一工具。\n5. #景旺电子 $603228 ：涨约7.2%。三季报营收同比约+37%、净利约+70%，对应PCB涨价链；近20日仍处深回撤后的反弹，属业绩与资金交叉。\n6. #雪人集团 $002639 ：涨停；近20日约+20%、5日约+15%。三季报仍亏，机器人与制冷交叉，只作情绪观察，不做中线基本面叙事。\n#小盘阿尔法\n #西部材料 $002149 见上，今日涨停且与航天材料互证。 #再升科技 $603601 涨约4%，气凝胶热控叙事，近5日约+5%、近20日仍负，验证看出货与毛利率。 #苏轴股份 $920418 涨约3.4%，北交所小市值轴承，近20日约+4%，验证看航空航天送样订单。\n#操作提示\n不是空仓日，也不是抬杠杆日。尾盘盯封板是否松动，以及光伏与锂电有没有继续砸情绪。核心仓留给航天材料与PCB里能对上业绩的，题材仓严格止盈。字辈连板与亏损龙头，退潮会很快。总仓中性，单票试错并设好退出。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘中 11月9日\n先说结论：指数小幅分化，赚钱效应集中在题材与电子硬件，不是普涨日。上证微红、深成和创业板翻绿，涨少跌多，风格略偏中小盘。盘中主线仍是商业航天与卫星、人形机器人，另加一条资金最扎实的PCB与光通信；早盘提过的光伏设备今日走弱并净流出，尾盘不宜再当进攻仓。仓位中性，只跟消息和资金共振的方向，高位连板与字辈情绪票防兑现。\n#盘面速览\n截至约14:53，上证3661.88点涨0.35%，深成指11155.76点跌0.18%，创业板指2461.35点跌0.16%，科创50报1258.83点涨0.45%，沪深300涨约0.08%。上证口径上涨约959家、下跌约1331家，指数靠权重与局部热点撑着，多数个股并不舒服。两市成交额合计约1.43万亿元，量能尚可但结构极不均衡。国证2000涨约0.32%，上证50几乎走平，中小盘略强于权重，却谈不上全面风险偏好回升。\n#板块风格\n行业涨幅靠前的是焦炭、卫浴电器、煤炭与动力煤、印制电路板、燃气。概念侧6G、纳米银、毫米波、机器人执行器、光通信模块、人形机器人、卫星互联网、商业航天居前。跌幅侧教育、宠物食品、钾肥、锂、逆变器、光伏电池组件与光伏设备靠后。进攻落在航天机器人与PCB硬件，煤炭燃气偏周期脉冲；成长里光伏链今日是撤的。整体更像主题轮动，而不是指数趋势日。\n#资金面\n行业主力净流入靠前：电子约91亿、通信设备约37亿、元件与印制电路板各约36亿、通信约32亿，半导体与消费电子也有流入。净流出侧电力设备、电池与锂电池、光伏设备、逆变器、计算机靠前，非银与证券同步失血。光通信模块、商业航天、卫星互联网、CPO等概念净流入也靠前，说明钱在硬件与航天事件里打转。北向实时接口全日返回占位零值，北向净流入数据暂不可用。\n#涨停\n东财涨停池接口今日暂不可用；公开情绪统计约14:44口径涨停约54家、炸板约44、封板率约五成五，主线标注航天与机器人，PCB亦有涨停扩散。人气端东方字辈、制冷冰雪、航天材料仍活跃，封板质量一般，炸板偏多说明情绪已过脉冲高峰，追高性价比低。\n#盘中消息\n周末催化延续到盘中：太空算力与星舰叙事抬升商业航天；苹果HALO人形控制系统在宇树G1验证，推高机器人溢价。PCB则交易供应偏紧与松下湖口厂火灾扰动，覆铜板和电子布涨价链被反复定价，景旺、胜宏、沪电等业绩链同步走强。汽车出口冲高、进博会与中美经贸缓和偏宏观，对当日主线映射弱于航天、机器人、PCB。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #东方海洋 002086 、 #日出东方 603366 、 #宇树科技 $688836 、 #中国卫星 $600118 、 #信维通信 $300136 、 #大东方 600327 、 #东方新能 002310 、 #东方日升 300118 等。同花顺热榜亦见东方海洋、宇树、冰山冷热、东山精密、中际旭创。字辈与主线交叉票权重大，需区分纯情绪与有订单映射；字辈票可以提供流动性，不宜当基本面仓。\n#中美映射\n美股主题ETF仍用11月6日收盘窗口：5日光伏TAN领先，20日偏医疗与必选消费；半导体中期仍弱。A股今日刷新：机器人相关ETF近20日与近5日都强；卫星偏5日；光伏设备近5日涨幅仍高，但今日板块资金流出，超短共振松动。盘中更干净的是航天事件驱动加PCB供需，而非早盘的光伏修复 com/dmjk001/status/2119684511550337122","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":1,"rp":0,"vw":4855},{"id":"2119683957021360599","h":"nytchinese","ts":1794207011,"zh":"英伟达先进芯片流向中国“空壳”公司：美国商务部已批准数十家中国公司购买和处理英伟达芯片，但时报调查发现，两家获批企业在中国的登记办公室空置、无人办公，且与被美国政府列入黑名单的公司有关联。","en":"英伟达先进芯片流向中国“空壳”公司：美国商务部已批准数十家中国公司购买和处理英伟达芯片，但时报调查发现，两家获批企业在中国的登记办公室空置、无人办公，且与被美国政府列入黑名单的公司有关联。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2119683957021360599","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/business/20261109/nvidia-chips-chinese-firms/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":43,"rt":7,"rp":10,"vw":15731},{"id":"2119682953613598777","h":"cnfinancewatch","ts":1794206772,"zh":"美股盘前 11月9日\n先说结论：周末 #英伟达 $NVDA 董事会就黄仁勋相关调查发声，盘后与永续合约大约跌3%出头，但股指期货整体偏强修复，市场在把龙头治理风险和宽基反弹拆开看。今日交易焦点最多两类——医疗器械趋势、光伏超短；半导体、AI算力、存储、机器人并作AI硬件一个大类，只观察相对强者与本周财报，不做 $NVDA 情绪多空。如果只做3只： #史赛克 $SYK → #第一太阳能 $FSLR → #普尔特 $PHM 。明确不做：追 $NVDA 、追5日脉冲贵金属、把周五半导体反弹当趋势反转、追 BOTZ 。\n#消息面\n上周五三大指数分化收盘：标普约+0.31%、纳指约+1.09%、道指约-0.46%，费城半导体ETF $SMH 约+3.6%，属超跌反弹不是趋势翻多。上周中段AI交易大幅回撤后，周五只是修复日。周末焦点在 $NVDA ：公司称就黄仁勋是否遭境外情报针对性接触启动独立调查，并称暂无证据显示国家机密或公司内部信息泄露；公开报道盘后约180美元附近、较周五收盘约186.6美元跌逾3%。同业隔夜更多偏修复，公开报道 AMD 约涨1%出头、半导体ETF小涨，资金有从单一龙头切向其他芯片名的迹象，但仍是情绪层。本周催化密度高：周二美国10月CPI， CRWV 盘后；周四 CSCO 、 AMAT ；周一盘后还有 RKLB 。非农偏强后，公开口径里12月加息概率抬到约八成附近，宏观仍偏紧，高估值成长更怕通胀再热。\n#研报面\n头部大行可核：摩根士丹利将 AMAT 从等权上调至增持，目标价自172上调至209，主因上调晶圆设备尤其是存储资本开支假设，并对 KLAC 、 LRCX 盈利预测同步上修，权重高于普通点评。商业航天侧， RKLB 盘后出财报前：Cantor维持偏多目标122，摩根士丹利维持买入目标105，Citizens维持跑赢但目标自130下调至90并点出Neutron延期至2027——目标分歧大，当事件仓而非趋势仓。 CRWV 一侧Citigroup近日维持买入但下调目标价，属盈利与融资成本担忧下的目标下修，不是新翻多。非头部自媒体目标价一律降权，不单独开仓。\n#资金面\n期权异动与ARK多基金同买本轮未采集，不能用裸成交量凑共振。按规则， AMAT 仅有大行上调一项，缺第二项同向资金，暂不算完整资金共振。行业层面用涨幅代替资金流观察：住房 $ITB 、医疗器械 IHI 、医疗 XLV 、必选 XLP 近20日仍居前；光伏 $TAN 近5日领涨。AI硬件ETF与龙头近20日、近5日仍深回撤， $SMH 20日约-23%、5日约-11%， BOTZ 20日仍负，周五反弹未改中期结构。散户情绪平台热帖未做逐条核验，不作硬证据。上周五现金指数与ETF结构上，防御与住房仍强于科技宽基；今日若期指高开，优先核对医疗与光伏成分股是否同步放量，避免只追期货溢价。\n#期货\n现金指数以上周五收盘为准。隔夜股指期货多家公开口径偏强：有报道道指期货约+0.7%、标普与纳指期货约+0.6%一带，也有时段显示涨幅更窄，价格随新闻波动，开盘前以实时报价为准。VIX上周五约25.6，回落但仍不低。黄金与WTI原油公开报道口径不一，大致原油仍在90美元附近。ES/NQ成交量与持仓量方向未采集，不做OI定论，避免把报价涨跌误读成新多进场。\n#中美映射\n美股行业ETF截至11月6日收盘：20日靠前为住房 $ITB 约+13.9%、医疗器械 IHI 约+11.3%、医疗 XLV 约+8.2%、必选 XLP 约+8.0%、保险 KIE 、地产 XLRE 、材料 XLB ，光伏 $TAN 约+4.2%；5日榜黄金股 GDX 、光伏 $TAN 大幅领先，其次清洁能源、游戏、航空、医疗器械、通信、黄金ETF。半导体 $SMH 20日约-23%、5日约-11%。A股主题（含11月9日）：20日偏强机器人、创新药、航天、银行；5日偏强贵金属脉冲、光伏、黄金、科创50与芯片反弹、机器人与卫星、创新药。标注：20日共振——医疗器械/创新药；5日共振——光伏；双窗口同现偏事件——机器人（A股双侧强、美股 BOTZ 仍弱）；仅5日慎追——贵金属与芯片反弹。映射是观察框架，不是同步买入信号。\n#三个方向\n医疗器械与医疗防御： IHI /XLV 20日趋势仍在，周五回调提供分歧，优先器械龙头而非纯主题ETF追价。\n光伏设备：中美5日共振最干净，作超短修复仓，不升格为已确认大趋势。\n住房建设： $ITB 20日居首但周五转弱，作备选趋势仓，等量能与利率预期再确认。\n#六只个股\n1. #史赛克 $SYK ：近20日约+17.5%、5日约+11.7%，距20日高约6.8%；周五约-2.7%。医疗器械主线代表，触发看能否在回调后重新放量收复短期均线，失效看跌破本轮5日低点区间。\n2. #直觉外科 $ISRG ：近20日约+6.8%、5日约+4.8%，周五约-3.4%，量能偏弱。器械旗舰，适合趋势回撤观察，不追反弹第一根。\n3. #雅培 $ABT ：近20日约+11.1%、5日约+3.5%，周五约-3.2%。医疗防御属性，作 IHI 映射补位。\n4. #第一太阳能 $FSLR ：近20日约+13.1%、5日约+15.3%，周五约+2.7%，距20日高约6.4%。光伏主线中期与超短都强，当5日共振执行票，严格止盈。\n5. #普尔特 $PHM ：近20日约+18.2%、5日约+6.2%，周五约-2.0%，距20日高约5.3%。住房链里20日最强之一，量比大约0.8，等放量再加。\n6. #霍顿 $DHI ：近20日约+12.9%、5日约+4.3%，周五约-3.4%。住房备选，逻辑同 $ITB ，不做无量追高。\n#操作提示\n不是恐慌空仓日，也不是把AI超跌当趋势反转日。仓位中性：核心试错留给 $SYK 与 $FSLR ， $PHM 等住房量能。 AMAT 有大行上调但缺资金第二项且距高点深回撤，财报前最多观察。 RKLB 今日盘后、 CRWV 本周财报，事件波动大、位置仍弱，不进只做3只名单。CPI公布前避免加杠杆，单票设好退出，总仓留余地应对通胀与AI龙头新闻的双向扰动。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"美股盘前 11月9日\n先说结论：周末 #英伟达 $NVDA 董事会就黄仁勋相关调查发声，盘后与永续合约大约跌3%出头，但股指期货整体偏强修复，市场在把龙头治理风险和宽基反弹拆开看。今日交易焦点最多两类——医疗器械趋势、光伏超短；半导体、AI算力、存储、机器人并作AI硬件一个大类，只观察相对强者与本周财报，不做 $NVDA 情绪多空。如果只做3只： #史赛克 $SYK → #第一太阳能 $FSLR → #普尔特 $PHM 。明确不做：追 $NVDA 、追5日脉冲贵金属、把周五半导体反弹当趋势反转、追 BOTZ 。\n#消息面\n上周五三大指数分化收盘：标普约+0.31%、纳指约+1.09%、道指约-0.46%，费城半导体ETF $SMH 约+3.6%，属超跌反弹不是趋势翻多。上周中段AI交易大幅回撤后，周五只是修复日。周末焦点在 $NVDA ：公司称就黄仁勋是否遭境外情报针对性接触启动独立调查，并称暂无证据显示国家机密或公司内部信息泄露；公开报道盘后约180美元附近、较周五收盘约186.6美元跌逾3%。同业隔夜更多偏修复，公开报道 AMD 约涨1%出头、半导体ETF小涨，资金有从单一龙头切向其他芯片名的迹象，但仍是情绪层。本周催化密度高：周二美国10月CPI， CRWV 盘后；周四 CSCO 、 AMAT ；周一盘后还有 RKLB 。非农偏强后，公开口径里12月加息概率抬到约八成附近，宏观仍偏紧，高估值成长更怕通胀再热。\n#研报面\n头部大行可核：摩根士丹利将 AMAT 从等权上调至增持，目标价自172上调至209，主因上调晶圆设备尤其是存储资本开支假设，并对 KLAC 、 LRCX 盈利预测同步上修，权重高于普通点评。商业航天侧， RKLB 盘后出财报前：Cantor维持偏多目标122，摩根士丹利维持买入目标105，Citizens维持跑赢但目标自130下调至90并点出Neutron延期至2027——目标分歧大，当事件仓而非趋势仓。 CRWV 一侧Citigroup近日维持买入但下调目标价，属盈利与融资成本担忧下的目标下修，不是新翻多。非头部自媒体目标价一律降权，不单独开仓。\n#资金面\n期权异动与ARK多基金同买本轮未采集，不能用裸成交量凑共振。按规则， AMAT 仅有大行上调一项，缺第二项同向资金，暂不算完整资金共振。行业层面用涨幅代替资金流观察：住房 $ITB 、医疗器械 IHI 、医疗 XLV 、必选 XLP 近20日仍居前；光伏 $TAN 近5日领涨。AI硬件ETF与龙头近20日、近5日仍深回撤， $SMH 20日约-23%、5日约-11%， BOTZ 20日仍负，周五反弹未改中期结构。散户情绪平台热帖未做逐条核验，不作硬证据。上周五现金指数与ETF结构上，防御与住房仍强于科技宽基；今日若期指高开，优先核对医疗与光伏成分股是否同步放量，避免只追期货溢价。\n#期货\n现金指数以上周五收盘为准。隔夜股指期货多家公开口径偏强：有报道道指期货约+0.7%、标普与纳指期货约+0.6%一带，也有时段显示涨幅更窄，价格随新闻波动，开盘前以实时报价为准。VIX上周五约25.6，回落但仍不低。黄金与WTI原油公开报道口径不一，大致原油仍在90美元附近。ES/NQ成交量与持仓量方向未采集，不做OI定论，避免把报价涨跌误读成新多进场。\n#中美映射\n美股行业ETF截至11月6日收盘：20日靠前为住房 $ITB 约+13.9%、医疗器械 IHI 约+11.3%、医疗 XLV 约+8.2%、必选 XLP 约+8.0%、保险 KIE 、地产 XLRE 、材料 XLB ，光伏 $TAN 约+4.2%；5日榜黄金股 GDX 、光伏 $TAN 大幅领先，其次清洁能源、游戏、航空、医疗器械、通信、黄金ETF。半导体 $SMH 20日约-23%、5日约-11%。A股主题（含11月9日）：20日偏强机器人、创新药、航天、银行；5日偏强贵金属脉冲、光伏、黄金、科创50与芯片反弹、机器人与卫星、创新药。标注：20日共振——医疗器械/创新药；5日共振——光伏；双窗口同现偏事件——机器人（A股双侧强、美股 BOTZ 仍弱）；仅5日慎追——贵金属与芯片反弹。映射是观察框架，不是同步买入信号。\n#三个方向\n医疗器械与医疗防御： IHI /XLV 20日趋势仍在，周五回调提供分歧，优先器械龙头而非纯主题ETF追价。\n光伏设备：中美5日共振最干净，作超短修复仓，不升格为已确认大趋势。\n住房建设： $ITB 20日居首但周五转弱，作备选趋势仓，等量能与利率预期再确认。\n#六只个股\n1. #史赛克 $SYK ：近20日约+17.5%、5日约+11.7%，距20日高约6.8%；周五约-2.7%。医疗器械主线代表，触发看能否在回调后重新放量收复短期均线，失效看跌破本轮5日低点区间。\n2. #直觉外科 $ISRG ：近20日约+6.8%、5日约+4.8%，周五约-3.4%，量能偏弱。器械旗舰，适合趋势回撤观察，不追反弹第一根。\n3. #雅培 $ABT ：近20日约+11.1%、5日约+3.5%，周五约-3.2%。医疗防御属性，作 IHI 映射补位。\n4. #第一太阳能 $FSLR ：近20日约+13.1%、5日约+15.3%，周五约+2.7%，距20日高约6.4%。光伏主线中期与超短都强，当5日共振执行票，严格止盈。\n5. #普尔特 $PHM ：近20日约+18.2%、5日约+6.2%，周五约-2.0%，距20日高约5.3%。住房链里20日最强之一，量比大约0.8，等放量再加。\n6. #霍顿 $DHI ：近20日约+12.9%、5日约+4.3%，周五约-3.4%。住房备选，逻辑同 $ITB ，不做无量追高。\n#操作提示\n不是恐慌空仓日，也不是把AI超跌当趋势反转日。仓位中性：核心试错留给 $SYK 与 $FSLR ， $PHM 等住房量能。 AMAT 有大行上调但缺资金第二项且距高点深回撤，财报前最多观察。 RKLB 今日盘后、 CRWV 本周财报，事件波动大、位置仍弱，不进只做3只名单。CPI公布前避免加杠杆，单票设好退出，总仓留余地应对通胀与AI龙头新闻的双向扰动。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119682953613598777","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["美联储","通胀","美股","原油能源","AI科技","财报","黄金"],"lk":3,"rt":0,"rp":6,"vw":4586},{"id":"2119681948842914240","h":"SCMPNews","ts":1794206533,"zh":"一名医生在韩国被谋杀。 8 年过去了，“一切都没有改变”","en":"A doctor was murdered in South Korea. 8 years on, ‘nothing has changed’","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119681948842914240","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/week-asia/health-environment/article/3373762/doctor-was-murdered-south-korea-8-years-nothing-has-changed?utm_medium=Social&utm_source=Twitter#Echobox=1794206532","d":"scmp.com"}],"t":[],"lk":2,"rt":0,"rp":0,"vw":2651},{"id":"2119680809359798662","h":"fxtrader","ts":1794206261,"zh":"美银首席策略师Michael Hartnett在最新一期周报中，将2026年中期选举定性为“AI股票集中度见顶”的历史节点，上调明年超大规模云厂商资本开支预期，预示未来现金流恶化。美银还为明年初债务上限做准备，看多黄金。\n根据美银7月全球基金经理调查，七成投资者认为中期选举前美联储不会加息，八成认为民主党不会横扫，九成认为AI资本开支不会削减。而这些预期正在逐一被打破，美联储9月已经加息，民主党中期选举完成横扫，而随着多位民主党当选州长承诺暂停数据中心建设，“AI资本开支不会削减”的信念也岌岌可危。\nHartnett的市场逻辑是，云计算大厂资本开支高企，现金流急剧恶化（美银一周内将2027年超大规模云厂商资本开支从1.2万亿美元上调至1.3万亿）。债券市场期待AI资本开支放缓；科技债券将跑赢科技股，利空芯片、云计算建设端，利好AI使用方资产负债表。\n芯片股方面，费城半导体指数目前跌至200日均线下方 17%，根据历史规律，优质买点一般在20%‑25%区间；英伟达、台积电ADR均跌破关键支撑价位，仍有进一步调整空间。\n在宏观交易方面，美银押注黄金，警惕债务上限危机，理由是2027年2月美国或将触及41.1万亿美元债务上限，而历史上前两次债务上限博弈前三个月黄金大幅上涨，黄金从当前约4000美元起算，有望在债务上限博弈高峰期触及4500至4700美元区间。\n在中期选举后，Hartnett的交易清单方向是黄金 > 石油、收益率下行、科技债券 > 科技股、消费股 > 能源股、小盘股 > 垄断股、做多欧洲、做多中国科技股。\n美银对标普500是否会崩盘设定了三个衰退预警指标，分别是银行ETF（IXG）守住125美元、中小盘ETF（MDY）守住666美元、高收益债ETF（JNK）守住92美元。而MDY目前已告破，而且需要警惕的是，标普500目前距离Hartnett“全球广度法则”买入信号触发线（7323点）仅不足1%。","en":"美银首席策略师Michael Hartnett在最新一期周报中，将2026年中期选举定性为“AI股票集中度见顶”的历史节点，上调明年超大规模云厂商资本开支预期，预示未来现金流恶化。美银还为明年初债务上限做准备，看多黄金。\n根据美银7月全球基金经理调查，七成投资者认为中期选举前美联储不会加息，八成认为民主党不会横扫，九成认为AI资本开支不会削减。而这些预期正在逐一被打破，美联储9月已经加息，民主党中期选举完成横扫，而随着多位民主党当选州长承诺暂停数据中心建设，“AI资本开支不会削减”的信念也岌岌可危。\nHartnett的市场逻辑是，云计算大厂资本开支高企，现金流急剧恶化（美银一周内将2027年超大规模云厂商资本开支从1.2万亿美元上调至1.3万亿）。债券市场期待AI资本开支放缓；科技债券将跑赢科技股，利空芯片、云计算建设端，利好AI使用方资产负债表。\n芯片股方面，费城半导体指数目前跌至200日均线下方 17%，根据历史规律，优质买点一般在20%‑25%区间；英伟达、台积电ADR均跌破关键支撑价位，仍有进一步调整空间。\n在宏观交易方面，美银押注黄金，警惕债务上限危机，理由是2027年2月美国或将触及41.1万亿美元债务上限，而历史上前两次债务上限博弈前三个月黄金大幅上涨，黄金从当前约4000美元起算，有望在债务上限博弈高峰期触及4500至4700美元区间。\n在中期选举后，Hartnett的交易清单方向是黄金 > 石油、收益率下行、科技债券 > 科技股、消费股 > 能源股、小盘股 > 垄断股、做多欧洲、做多中国科技股。\n美银对标普500是否会崩盘设定了三个衰退预警指标，分别是银行ETF（IXG）守住125美元、中小盘ETF（MDY）守住666美元、高收益债ETF（JNK）守住92美元。而MDY目前已告破，而且需要警惕的是，标普500目前距离Hartnett“全球广度法则”买入信号触发线（7323点）仅不足1%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2119680809359798662","l":[],"ln":[],"t":["美联储","美股","AI科技","黄金"],"lk":22,"rt":3,"rp":3,"vw":13071},{"id":"2119676561162920222","h":"bbcchinese","ts":1794205248,"zh":"“黄仁勋被人算计了，他上当了。”美国调查记者、《黄仁勋传》作者史帝芬·维特（Stephen Witt）对BBC说。\n美国科技巨头英伟达表示，已对公司CEO黄仁勋展开调查。黄仁勋已在公司内部信中承认对妻子“不忠”。\n此前，《纽约时报》报导称黄仁勋的外遇对象是名为Alice Huang（中文名音译：黄乐）的商人，美国情报部门认定她是中国间谍，而中国否认该指控。","en":"“黄仁勋被人算计了，他上当了。”美国调查记者、《黄仁勋传》作者史帝芬·维特（Stephen Witt）对BBC说。\n美国科技巨头英伟达表示，已对公司CEO黄仁勋展开调查。黄仁勋已在公司内部信中承认对妻子“不忠”。\n此前，《纽约时报》报导称黄仁勋的外遇对象是名为Alice Huang（中文名音译：黄乐）的商人，美国情报部门认定她是中国间谍，而中国否认该指控。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2119675904053870592/vid/avc1/1080x1920/_lItNQFUiPREtE9N.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2119676561162920222","l":[],"ln":[],"t":["AI科技"],"lk":73,"rt":7,"rp":24,"vw":24894},{"id":"2119671509396717784","h":"cnfinancewatch","ts":1794204044,"zh":"美国卡车公司倒闭增多，未必只说明需求变冷。\n还要看运价、利率、燃料成本，以及前几年是否涌入了太多新运力。\n货运常被看作实体经济的温度计，但温度计也会受季节和行业结构影响。看到“倒闭潮”，你会先下衰退结论，还是先拆原因？","en":"美国卡车公司倒闭增多，未必只说明需求变冷。\n还要看运价、利率、燃料成本，以及前几年是否涌入了太多新运力。\n货运常被看作实体经济的温度计，但温度计也会受季节和行业结构影响。看到“倒闭潮”，你会先下衰退结论，还是先拆原因？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119671509396717784","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":3507},{"id":"2119671405772194115","h":"cnfinancewatch","ts":1794204019,"zh":"看通胀数据，别只看CPI涨了多少。\nCPI更接近消费端价格，PPI更接近工厂端价格。两者走势出现分化时，往往要追问：成本压力到了谁身上？企业能不能转嫁？利润会不会被压缩？\n一个指标给答案，两个指标才看到链条。你更关注物价，还是企业利润？\n对今天中国的两个数据你怎么看？","en":"看通胀数据，别只看CPI涨了多少。\nCPI更接近消费端价格，PPI更接近工厂端价格。两者走势出现分化时，往往要追问：成本压力到了谁身上？企业能不能转嫁？利润会不会被压缩？\n一个指标给答案，两个指标才看到链条。你更关注物价，还是企业利润？\n对今天中国的两个数据你怎么看？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119671405772194115","l":[],"ln":[],"t":["通胀"],"lk":1,"rt":0,"rp":0,"vw":2904},{"id":"2119671211643023561","h":"cnfinancewatch","ts":1794203973,"zh":"老板买了自家股票，你就该跟吗？\n先查是自掏现金，还是股权奖励；是主动买入，还是预设计划；金额相对他的持仓又有多大。\n内部人买入值得研究，却不能替利润、现金流和估值作答。信心是信号，不是底部证明。","en":"老板买了自家股票，你就该跟吗？\n先查是自掏现金，还是股权奖励；是主动买入，还是预设计划；金额相对他的持仓又有多大。\n内部人买入值得研究，却不能替利润、现金流和估值作答。信心是信号，不是底部证明。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119671211643023561","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":3053},{"id":"2119671140914541017","h":"cnfinancewatch","ts":1794203956,"zh":"看机构研报，别只截图“上调评级”四个字。\n真正值得保存的是：它假设利润增长多少、估值能到多少、什么情况会推翻判断。\n市场变了，旧结论未必还成立。比追问谁被打脸更有用的，是检查自己买入时的假设，还剩几条站得住。\n要看目标价是提升了还是下降了？\n要看评级是维持还是提升？\n最重要的是看逻辑是不是顺。","en":"看机构研报，别只截图“上调评级”四个字。\n真正值得保存的是：它假设利润增长多少、估值能到多少、什么情况会推翻判断。\n市场变了，旧结论未必还成立。比追问谁被打脸更有用的，是检查自己买入时的假设，还剩几条站得住。\n要看目标价是提升了还是下降了？\n要看评级是维持还是提升？\n最重要的是看逻辑是不是顺。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119671140914541017","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":2533},{"id":"2119670888694214804","h":"cnfinancewatch","ts":1794203896,"zh":"美国还在盖楼，但资金追逐的未必是写字楼。\n数据中心建设热，值得关注的不只是投入多少，还有谁来付电费、谁来租算力、现金流何时覆盖成本。\n建得快，是投资力度；赚得回来，才是商业闭环。看AI基建，你更关心开工规模，还是客户回款？","en":"美国还在盖楼，但资金追逐的未必是写字楼。\n数据中心建设热，值得关注的不只是投入多少，还有谁来付电费、谁来租算力、现金流何时覆盖成本。\n建得快，是投资力度；赚得回来，才是商业闭环。看AI基建，你更关心开工规模，还是客户回款？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119670888694214804","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":2952},{"id":"2119670785862508929","h":"cnfinancewatch","ts":1794203871,"zh":"看好一项技术，不等于看准一 珊出发前突然取消韩国行，只透露是“家庭原因”。原定计划会见韩国副总理兼科技信息通信部长官裴庆勋，并出席英伟达与SK等韩企合作的签订仪式，目前已临时改由其他人员代劳。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWpPIyBbYAAQ1SF.png?name=orig","https://pbs.twimg.com/media/HWpPSqAbYAAOqGO.png?name=orig","https://pbs.twimg.com/media/HWpPgbEasAABz-8.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2119595371081146491","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":24,"rt":2,"rp":4,"vw":16817},{"id":"2119595194009964703","h":"SCMPNews","ts":1794185849,"zh":"英伟达首席执行官黄仁勋承认有外遇；董事会命令调查","en":"Nvidia CEO Jensen Huang admits to affair; board orders investigation","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119595194009964703","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/tech/article/3373724/nvidia-ceo-jensen-huang-admits-affair-board-orders-investigation?utm_medium=Social&utm_source=Twitter#Echobox=1794185848","d":"scmp.com"}],"t":["AI科技"],"lk":8,"rt":4,"rp":0,"vw":2475},{"id":"2119594631025598722","h":"cnfinancewatch","ts":1794185714,"zh":"老黄所处的关系网络复杂\n政治关系，这里不排除是有人设计，美国两党政治内斗的一步棋，川普想保，另一边呢？想搞事儿，无休无止\nCIA调查，川普知道，应该是没有泄密，事儿不大\n经济关系，估计次之\n科技技术关系，相对复杂\n国际关系，黄之前相对亲中，也亲台，这就复杂中的复杂了\n希望下一个大瓜不要是马斯克\n企业还是要发展，人类还是要进步，内斗不可取","en":"老黄所处的关系网络复杂\n政治关系，这里不排除是有人设计，美国两党政治内斗的一步棋，川普想保，另一边呢？想搞事儿，无休无止\nCIA调查，川普知道，应该是没有泄密，事儿不大\n经济关系，估计次之\n科技技术关系，相对复杂\n国际关系，黄之前相对亲中，也亲台，这就复杂中的复杂了\n希望下一个大瓜不要是马斯克\n企业还是要发展，人类还是要进步，内斗不可取","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119594631025598722","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":4233},{"id":"2119593590288715933","h":"cnfinancewatch","ts":1794185466,"zh":"这事儿，一声叹息\n想想当年我也是文青，在他们圈子混了很久","en":"这事儿，一声叹息\n想想当年我也是文青，在他们圈子混了很久","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWpPDM6acAAS7Jm.png?name=orig"],"u":"https://x.com/cnfinancewatch/status/2119593590288715933","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":6423},{"id":"2119591605044658508","h":"SCMPNews","ts":1794184993,"zh":"特朗普表示任命 UFC 的达纳·怀特为新闻秘书“只是开玩笑”","en":"Trump says ‘only kidding’ about naming UFC’s Dana White as press secretary","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119591605044658508","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/world/united-states-canada/article/3373723/trump-says-only-kidding-about-naming-ufcs-dana-white-press-secretary?utm_medium=Social&utm_source=Twitter#Echobox=1794184992","d":"scmp.com"}],"t":[],"lk":2,"rt":0,"rp":1,"vw":2371},{"id":"2119590924535861612","h":"cnfinancewatch","ts":1794184831,"zh":"《热点财经新闻综述｜11月9日·早间》\n北京时间08:15。今日判断：国内稳市政策与海外科技股压力形成拉锯。指数获得承接，不代表高估值赛道已经止跌。重点区分政策支持、资金流入与企业盈利，避免把三者混为一谈。\n三大利多方向，由强到弱\n稳市机制制度化。11月6日国常会提出完善资本市场稳市机制；第三批证券、基金、保险公司互换便利操作规模为1000亿元，31家机构参与。部分券商已披露完成相关股票买入。对券商和宽基权重而言，政策支持更具体，但操作额度不等于即时入市资金，不能据此推算指数必然上涨。\n被动资金形成承接。据中国基金报11月8日报道，股票ETF连续23个交易日净流入，累计约6215亿元。分析上，这有助于缓冲指数抛压，但ETF申购并不代表所有投资者看多，也不保证资金均匀流向中小盘。观察重点应是宽基成交、申赎持续性与市场上涨家数能否同步改善。\n半导体设备与国产替代。公开报道显示，中微公司获密集机构调研，公司提及新签订单增长。相较依赖海外AI资本开支的硬件环节，国产设备有不同的需求来源。不过，订单增长仍需转化为收入、利润和现金流，不能只凭调研数量判断买点。邮件关于杠杆资金调仓、光刻机模型的说法尚缺独立核验，不作为交易依据。\n三大利空方向，由强到弱\n海外科技交易降温。上周纳指约跌3.4%、标普约跌2.7%，国内部分光模块个股亦明显调整。需区分估值压缩与盈利下修：前者可能随风险偏好修复，后者则要等订单与业绩证据。不能把一次反弹直接认定为趋势反转。\n英伟达事件风险。英伟达董事会11月8日声明启动独立调查，并表示目前没有理由认为国家安全或公司机密受到损害。相关情报指控仍属报道与调查事项，不能当成定论。投资判断应跟踪公司正式披露、治理安排和业务影响，而不是围绕未经证实的个人细节交易。\n利率与宏观数据扰动。公开报道显示，10月美国非农新增16.5万、失业率4.1%。就业数据与通胀预期会影响利率定价，成长股对贴现率变化更敏感。本周应关注CPI及债券收益率反应，不能只看科技股自身消息，也不能把利率期货概率当成美联储承诺。\n多空如何制约\n政策与ETF资金主要缓冲指数风险，并不替个别公司的估值兜底。券商、宽基权重与国产设备各有催化，但仍需成交和业绩确认；高位算力硬件要重点辨别订单兑现与估值压力。油价下跌可能改善部分运输企业成本，却也可能反映需求担忧，不能机械归为全市场利多。\n操作上，先看开盘后的承接与市场宽度，再看板块强弱。已有仓位应关注持仓逻辑是否变化，新增仓位不宜只因政策标题追高。\n主要来源：国常会、互换便利、ETF报道、英伟达董事会声明。\n@cnfinancewatch 以上为信息整理与分析，不构成投资建议。","en":"《热点财经新闻综述｜11月9日·早间》\n北京时间08:15。今日判断：国内稳市政策与海外科技股压力形成拉锯。指数获得承接，不代表高估值赛道已经止跌。重点区分政策支持、资金流入与企业盈利，避免把三者混为一谈。\n三大利多方向，由强到弱\n稳市机制制度化。11月6日国常会提出完善资本市场稳市机制；第三批证券、基金、保险公司互换便利操作规模为1000亿元，31家机构参与。部分券商已披露完成相关股票买入。对券商和宽基权重而言，政策支持更具体，但操作额度不等于即时入市资金，不能据此推算指数必然上涨。\n被动资金形成承接。据中国基金报11月8日报道，股票ETF连续23个交易日净流入，累计约6215亿元。分析上，这有助于缓冲指数抛压，但ETF申购并不代表所有投资者看多，也不保证资金均匀流向中小盘。观察重点应是宽基成交、申赎持续性与市场上涨家数能否同步改善。\n半导体设备与国产替代。公开报道显示，中微公司获密集机构调研，公司提及新签订单增长。相较依赖海外AI资本开支的硬件环节，国产设备有不同的需求来源。不过，订单增长仍需转化为收入、利润和现金流，不能只凭调研数量判断买点。邮件关于杠杆资金调仓、光刻机模型的说法尚缺独立核验，不作为交易依据。\n三大利空方向，由强到弱\n海外科技交易降温。上周纳指约跌3.4%、标普约跌2.7%，国内部分光模块个股亦明显调整。需区分估值压缩与盈利下修：前者可能随风险偏好修复，后者则要等订单与业绩证据。不能把一次反弹直接认定为趋势反转。\n英伟达事件风险。英伟达董事会11月8日声明启动独立调查，并表示目前没有理由认为国家安全或公司机密受到损害。相关情报指控仍属报道与调查事项，不能当成定论。投资判断应跟踪公司正式披露、治理安排和业务影响，而不是围绕未经证实的个人细节交易。\n利率与宏观数据扰动。公开报道显示，10月美国非农新增16.5万、失业率4.1%。就业数据与通胀预期会影响利率定价，成长股对贴现率变化更敏感。本周应关注CPI及债券收益率反应，不能只看科技股自身消息，也不能把利率期货概率当成美联储承诺。\n多空如何制约\n政策与ETF资金主要缓冲指数风险，并不替个别公司的估值兜底。券商、宽基权重与国产设备各有催化，但仍需成交和业绩确认；高位算力硬件要重点辨别订单兑现与估值压力。油价下跌可能改善部分运输企业成本，却也可能反映需求担忧，不能机械归为全市场利多。\n操作上，先看开盘后的承接与市场宽度，再看板块强弱。已有仓位应关注持仓逻辑是否变化，新增仓位不宜只因政策标题追高。\n主要来源：国常会、互换便利、ETF报道、英伟达董事会声明。\n@cnfinancewatch 以上为信息整理与分析，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119590924535861612","l":[],"ln":[],"t":["美联储","通胀","美股","原油能源","AI科技"],"lk":0,"rt":0,"rp":0,"vw":2180},{"id":"2119590651318985136","h":"cnfinancewatch","ts":1794184766,"zh":"《散户热议｜11月9日·早间》\n北京时间08:15。以下区分社区观点与可核事实，不将零散帖子当作全体散户的态度。国内参考韭研公社，海外参考Stocktwits；本期未能直接核对Reddit WallStreetBets原帖，不据二手摘要替其下结论。本篇尚未发布到X。\n国内讨论：题材接力与高低切换\n名字题材重新受到关注。公社公开帖讨论“东方”系个股，并延伸出补涨猜测。这类讨论反映短线资金寻找辨识度，并不构成公司盈利改善的证据。名字相近不意味着业务相关，更不意味着估值可以互相套用。与基本面研究相比，这类交易更依赖情绪和承接，断板后的流动性风险尤其值得注意。\n国内算力重估叙事升温。部分帖子围绕欧美数据中心建设压力，讨论国内算力、算力租赁与Token出海，也有人认为市场对算力已经过度悲观。需要拆开看：海外资本开支变化、国内新增需求和具体公司的订单，不是同一件事。即便方向成立，也要检查合同质量、利用率、回款及折旧压力，不能只凭“东升西降”四个字判断盈利。\n资金寻找低位催化。盘前讨论涉及传媒、AI短剧、机器人、商业航天及半导体国产替代。社区同时存在两种思路：一派寻找新题材承接资金，另一派认为高位光模块调整后可能出现机会。两者的验证条件不同：新题材要看催化是否兑现，原主线要看订单与盈利预期是否止跌。板块涨跌并不能单独回答这些问题。\n稳市政策获得重视，但额度容易被误读。部分帖子把互换便利操作规模直接描述为已经入市的资金。公开信息能确认操作规模和部分机构买入，不能据此认定全部额度已转为股票购买。政策支持有助于改善承接预期，却不能保证每个题材、每只股票都得到资金支持。\n海外讨论：龙头信心与事件风险\nStocktwits英伟达页面出现较强看多情绪，平台读数属于其自身指标，不能代表全部投资者。部分讨论强调芯片需求与生态优势，也有声音担忧治理事件带来的管理层不确定性。判断时应分开业务竞争力和事件风险：前者较强，并不意味着后者可以忽略；后者引发波动，也不自动证明业务已经受损。\n“抄底还是反弹”仍有分歧。围绕科技股调整，有观点着眼长期需求，有观点更重视短期估值和利率压力。长期看好与短期仓位控制并不矛盾。尤其使用期权时，方向判断之外还要考虑到期日、隐含波动率和亏损上限，不能把看好公司等同于看好任何价格的看涨合约。\n本期没有完成WSB一手核验，因此不提供其看多看空比例，也不将第三方总结包装成社区共识。零散热门帖、点赞数与情绪标签，都不能替代有明确样本和方法的统计。\n综合判断\n国内讨论更关注题材轮动，海外讨论更关注龙头估值与事件。共同需要补上的一环是盈利验证：政策额度不是已入市资金，社区热度不是订单，长期叙事也不是短期收益保证。观察订单、现金流与风险承受能力，比猜测下一轮最热口号更有意义。\n参考：韭研公社公开广场、Stocktwits英伟达讨论页。\n@cnfinancewatch 以上为公开讨论整理与分析，不构成投资建议。","en":"《散户热议｜11月9日·早间》\n北京时间08:15。以下区分社区观点与可核事实，不将零散帖子当作全体散户的态度。国内参考韭研公社，海外参考Stocktwits；本期未能直接核对Reddit WallStreetBets原帖，不据二手摘要替其下结论。本篇尚未发布到X。\n国内讨论：题材接力与高低切换\n名字题材重新受到关注。公社公开帖讨论“东方”系个股，并延伸出补涨猜测。这类讨论反映短线资金寻找辨识度，并不构成公司盈利改善的证据。名字相近不意味着业务相关，更不意味着估值可以互相套用。与基本面研究相比，这类交易更依赖情绪和承接，断板后的流动性风险尤其值得注意。\n国内算力重估叙事升温。部分帖子围绕欧美数据中心建设压力，讨论国内算力、算力租赁与Token出海，也有人认为市场对算力已经过度悲观。需要拆开看：海外资本开支变化、国内新增需求和具体公司的订单，不是同一件事。即便方向成立，也要检查合同质量、利用率、回款及折旧压力，不能只凭“东升西降”四个字判断盈利。\n资金寻找低位催化。盘前讨论涉及传媒、AI短剧、机器人、商业航天及半导体国产替代。社区同时存在两种思路：一派寻找新题材承接资金，另一派认为高位光模块调整后可能出现机会。两者的验证条件不同：新题材要看催化是否兑现，原主线要看订单与盈利预期是否止跌。板块涨跌并不能单独回答这些问题。\n稳市政策获得重视，但额度容易被误读。部分帖子把互换便利操作规模直接描述为已经入市的资金。公开信息能确认操作规模和部分机构买入，不能据此认定全部额度已转为股票购买。政策支持有助于改善承接预期，却不能保证每个题材、每只股票都得到资金支持。\n海外讨论：龙头信心与事件风险\nStocktwits英伟达页面出现较强看多情绪，平台读数属于其自身指标，不能代表全部投资者。部分讨论强调芯片需求与生态优势，也有声音担忧治理事件带来的管理层不确定性。判断时应分开业务竞争力和事件风险：前者较强，并不意味着后者可以忽略；后者引发波动，也不自动证明业务已经受损。\n“抄底还是反弹”仍有分歧。围绕科技股调整，有观点着眼长期需求，有观点更重视短期估值和利率压力。长期看好与短期仓位控制并不矛盾。尤其使用期权时，方向判断之外还要考虑到期日、隐含波动率和亏损上限，不能把看好公司等同于看好任何价格的看涨合约。\n本期没有完成WSB一手核验，因此不提供其看多看空比例，也不将第三方总结包装成社区共识。零散热门帖、点赞数与情绪标签，都不能替代有明确样本和方法的统计。\n综合判断\n国内讨论更关注题材轮动，海外讨论更关注龙头估值与事件。共同需要补上的一环是盈利验证：政策额度不是已入市资金，社区热度不是订单，长期叙事也不是短期收益保证。观察订单、现金流与风险承受能力，比猜测下一轮最热口号更有意义。\n参考：韭研公社公开广场、Stocktwits英伟达讨论页。\n@cnfinancewatch 以上为公开讨论整理与分析，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119590651318985136","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":2,"vw":2156},{"id":"2119590504463773839","h":"cnfinancewatch","ts":1794184731,"zh":"【A股盘前｜2026年11月9日】\n结论：邮件给出的环境评分为42分，归入其“降仓档”；这是底稿自定义评分，不是经验证的择时指标。其总体建议是控制仓位、不追高，关注房地产链、机器人机械与传媒娱乐三个方向。\n以下行情、资金及研报数据均为邮件转述，未逐项独立核实，不代表实时盘口。周一稿中的“昨日”“隔夜”没有统一明确日期，因此不据此判断最新跨市场涨跌。\n#消息面 邮件提到外资机构看多A股、有色金属ETF发行、限售股解禁以及算力相关材料需求。分析上应区分长期需求与短期交易：机构观点不等于实际增量资金，ETF发行规模不等于即时买入，解禁规模也不等于股东必然减持。核能和商业航天的海外催化，还需进一步确认具体合同与A股公司的业务关联。\n#研报面 邮件引用中信证券、中信建投、华泰等机构观点，涉及估值、稳投资、盈利改善及医疗器械。但三个主选方向在底稿中均被标为研报互证不足，主选个股亦缺少近期直接覆盖。行业观点不能直接替代个股盈利预测，更不能据此证明买入时点。\n#资金面 邮件称上海电影获机构净买入1.19亿元，索辰科技获游资净买入1.73亿元，并列出影视、消费龙头、机器人ETF的20日表现。上述数字需核对交易日期和统计口径。龙虎榜只能反映特定交易日的部分席位，不能据此认定机构持续加仓；板块阶段涨幅较高，也可能意味着交易拥挤。\n#期货 邮件提及纳指期货反弹，但缺少清晰报价时间；股指期货升贴水数据未取得。这部分不作确定方向判断，不能以一条无时点期货报价覆盖整个盘前风险判断。\n#中美映射 底稿比较了美国住宅建筑、机器人、半导体与日韩制造业表现。其思路是用海外行业走势辅助筛选A股方向，但价格同向不等于盈利联动。不同市场的交易日期、汇率、估值与业务结构均可能造成偏差，跨市场映射只作观察线索。\n#三个方向 一、房地产链。底稿权重最高，理由是海外住宅建筑映射与潜在补涨。需要验证国内销售、订单、回款与板块成交，不能只因海外ETF上涨推导国内公司盈利改善。\n二、机器人机械。底稿强调美日相关资产同向，但其筛选结果没有符合“可作短线”条件的标的。因此方向可以观察，不必为了覆盖主题强行下单。\n三、传媒娱乐。底稿认为更多由A股资金驱动，缺少海外互证。连续上涨后尤其要关注成交承接、业绩兑现和资金撤离风险。\n#六只个股 顾家家居（603816）：底稿列为短线候选，关注量价承接与家居需求。\n三棵树（603737）：列入地产链观察名单。底稿一处给出低吸描述，但最终短线池未包含它，口径有冲突，不将其表述为明确买入标的。\n上海电影（601595）：底稿列为短线候选，同时提示短期涨幅较大、偏离均线，不宜忽略回撤风险。\n索辰科技（688507）：底稿认为位置偏高且不满足短线条件，仅观察。\n芒果超媒（300413）：虽被列入短线池，底稿又提示处于加速阶段、仅作备选。应保留这项风险提示，而非只强调入选。\n凡拓数创（301313）：底稿称热度条件不成立，仅观察，不设置买点。\n#操作提示 上述名单是邮件筛选结果，不是独立验证后的推荐。底稿具体价位未完成行情及复权口径核验，本稿不直接给出挂单价。先检查数据日期、原始研报与公司公告，再判断交易逻辑是否成立；不因题材齐全而凑足持仓。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅","en":"【A股盘前｜2026年11月9日】\n结论：邮件给出的环境评分为42分，归入其“降仓档”；这是底稿自定义评分，不是经验证的择时指标。其总体建议是控制仓位、不追高，关注房地产链、机器人机械与传媒娱乐三个方向。\n以下行情、资金及研报数据均为邮件转述，未逐项独立核实，不代表实时盘口。周一稿中的“昨日”“隔夜”没有统一明确日期，因此不据此判断最新跨市场涨跌。\n#消息面 邮件提到外资机构看多A股、有色金属ETF发行、限售股解禁以及算力相关材料需求。分析上应区分长期需求与短期交易：机构观点不等于实际增量资金，ETF发行规模不等于即时买入，解禁规模也不等于股东必然减持。核能和商业航天的海外催化，还需进一步确认具体合同与A股公司的业务关联。\n#研报面 邮件引用中信证券、中信建投、华泰等机构观点，涉及估值、稳投资、盈利改善及医疗器械。但三个主选方向在底稿中均被标为研报互证不足，主选个股亦缺少近期直接覆盖。行业观点不能直接替代个股盈利预测，更不能据此证明买入时点。\n#资金面 邮件称上海电影获机构净买入1.19亿元，索辰科技获游资净买入1.73亿元，并列出影视、消费龙头、机器人ETF的20日表现。上述数字需核对交易日期和统计口径。龙虎榜只能反映特定交易日的部分席位，不能据此认定机构持续加仓；板块阶段涨幅较高，也可能意味着交易拥挤。\n#期货 邮件提及纳指期货反弹，但缺少清晰报价时间；股指期货升贴水数据未取得。这部分不作确定方向判断，不能以一条无时点期货报价覆盖整个盘前风险判断。\n#中美映射 底稿比较了美国住宅建筑、机器人、半导体与日韩制造业表现。其思路是用海外行业走势辅助筛选A股方向，但价格同向不等于盈利联动。不同市场的交易日期、汇率、估值与业务结构均可能造成偏差，跨市场映射只作观察线索。\n#三个方向 一、房地产链。底稿权重最高，理由是海外住宅建筑映射与潜在补涨。需要验证国内销售、订单、回款与板块成交，不能只因海外ETF上涨推导国内公司盈利改善。\n二、机器人机械。底稿强调美日相关资产同向，但其筛选结果没有符合“可作短线”条件的标的。因此方向可以观察，不必为了覆盖主题强 const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
