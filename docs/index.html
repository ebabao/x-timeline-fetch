eliance on on-site natural gas plants that threatens to increase emissions from the AI boom, according to BloombergNEF","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120368428225638490","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-11/global-policies-target-data-center-grid-delays-lower-emissions?taid=6af3ea9ad0eea10001e9b47d&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["原油能源","AI科技"],"lk":0,"rt":2,"rp":0,"vw":8921},{"id":"2120367558289154144","h":"bbcchinese","ts":1794369995,"zh":"中国正加快大规模发展可再生能源，碳排放增长可能已几乎停滞。该国最近达到一个重要里程碑：2026年上半年，中国首次有超过一半的电力来自非燃煤发电。","en":"中国正加快大规模发展可再生能源，碳排放增长可能已几乎停滞。该国最近达到一个重要里程碑：2026年上半年，中国首次有超过一半的电力来自非燃煤发电。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2120367558289154144","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4eoRHKm","d":"bbc.in"}],"t":[],"lk":9,"rt":1,"rp":0,"vw":1638},{"id":"2120367397127483635","h":"CrushTheShorts","ts":1794369956,"zh":"Anthropic IPO：估值约1.26-1.41T，企业需求支撑增长，新模型进一步提效\n公司拟公开发售8.25亿股A类普通股，定价70—78美元，对应发售总额577.5—643.5亿美元，按约180.13亿股扩展稀释口径估算，#估值约1.26—1.41T美元。\n路演材料要点：\n#增长基础拓宽。10月年化收入810亿美元、环比+14.1%，Q3收入169.6亿美元，同比+1127%、环比+46.7%。截至9月底，年贡献收入超10万美元客户由去年底约1,500家增至11,900余家，非前五大客户贡献79%收入，新增客户与扩单共同驱动增长。\n#Cowork打开第二增长曲线。按发布后相同时长比较，年化收入曲线领先Claude Code。超50%财富500强企业年支出达10万美元，应用向办公、金融、医药研发扩散，生命科学、机器人进一步拓展业务边界。增长空间从开发者工具延伸至更广泛的知识劳动（40万亿空间）。\n#提效改善盈利，短期算力拖累利润。前三季度毛利率超85%、扣算力后利润率43%、调整后经营利润率12%。Q3调整后经营利润24.63亿美元，利润率由19%降至15%，主要受50亿美元高成本短期算力支出影响。GAAP经营亏损5.67亿美元。公司目标35%以上调整后经营利润率。\n#资金充裕，长期承诺仍需需求兑现。 现金及短期投资约1,320亿美元，算力承诺约9,009亿美元、延伸至2045年，包含现有合同、未起租租赁及部分可取消或短期安排，压力取决于付款节奏与退出条件。\n此外，#发布Fable 5.2，能力提升、成本下降。输入/输出价格降至8/40美元/百万Token，降价20%、生成速度最高提升30%。FrontierCode成绩32.4%→49.1%。该评测中，较低思考投入下以约半数费用达到Opus 5.5近似成绩。\n科研工程突破，完整RSI仍待验证。科学任务成绩52.6%→74.6%，三款电子设备设计经人工制造验证可运行，能力由代码延伸至科研、硬件。公司同时限制部分直接加速AI研发的能力，内核优化及模型架构改进约维持Opus 5.5水平。\n#总结：Anthropic IPO估值由于AI板块回调后有所下修（从此前2T到目前1.26-1.41T）。商业化逻辑来自企业客户扩张和模型提效，使用不再集中于少数大客户，新模型继续以低成本换更多用量。后续增长重点看code以外的增量，cowork和科研工程进展顺利。","en":"Anthropic IPO：估值约1.26-1.41T，企业需求支撑增长，新模型进一步提效\n公司拟公开发售8.25亿股A类普通股，定价70—78美元，对应发售总额577.5—643.5亿美元，按约180.13亿股扩展稀释口径估算，#估值约1.26—1.41T美元。\n路演材料要点：\n#增长基础拓宽。10月年化收入810亿美元、环比+14.1%，Q3收入169.6亿美元，同比+1127%、环比+46.7%。截至9月底，年贡献收入超10万美元客户由去年底约1,500家增至11,900余家，非前五大客户贡献79%收入，新增客户与扩单共同驱动增长。\n#Cowork打开第二增长曲线。按发布后相同时长比较，年化收入曲线领先Claude Code。超50%财富500强企业年支出达10万美元，应用向办公、金融、医药研发扩散，生命科学、机器人进一步拓展业务边界。增长空间从开发者工具延伸至更广泛的知识劳动（40万亿空间）。\n#提效改善盈利，短期算力拖累利润。前三季度毛利率超85%、扣算力后利润率43%、调整后经营利润率12%。Q3调整后经营利润24.63亿美元，利润率由19%降至15%，主要受50亿美元高成本短期算力支出影响。GAAP经营亏损5.67亿美元。公司目标35%以上调整后经营利润率。\n#资金充裕，长期承诺仍需需求兑现。 现金及短期投资约1,320亿美元，算力承诺约9,009亿美元、延伸至2045年，包含现有合同、未起租租赁及部分可取消或短期安排，压力取决于付款节奏与退出条件。\n此外，#发布Fable 5.2，能力提升、成本下降。输入/输出价格降至8/40美元/百万Token，降价20%、生成速度最高提升30%。FrontierCode成绩32.4%→49.1%。该评测中，较低思考投入下以约半数费用达到Opus 5.5近似成绩。\n科研工程突破，完整RSI仍待验证。科学任务成绩52.6%→74.6%，三款电子设备设计经人工制造验证可运行，能力由代码延伸至科研、硬件。公司同时限制部分直接加速AI研发的能力，内核优化及模型架构改进约维持Opus 5.5水平。\n#总结：Anthropic IPO估值由于AI板块回调后有所下修（从此前2T到目前1.26-1.41T）。商业化逻辑来自企业客户扩张和模型提效，使用不再集中于少数大客户，新模型继续以低成本换更多用量。后续增长重点看code以外的增量，cowork和科研工程进展顺利。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2120367397127483635","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":383},{"id":"2120367171314294813","h":"business","ts":1794369902,"zh":"据知情人士透露，总统卢拉的经济团队正准备在下周向国会提交提案，旨在向投资者展示他的政府在未来几年内如何实现财政目标。","en":"President Lula's economic team is preparing to send proposals to Congress by next week aimed at showing investors how his government intends to meet fiscal targets in the coming years, according to people familiar with the matter.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120367171314294813","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-11/lula-team-readies-brazil-fiscal-plan-in-bid-to-calm-market-jitters?taid=6af3e96e718669000144387a&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}] berg.com"}],"t":["AI科技"],"lk":3,"rt":1,"rp":2,"vw":10681},{"id":"2120339416568992240","h":"fxtrader","ts":1794363285,"zh":"据CNBC报道，在黄仁勋承认出轨的第二天，即返回英伟达总部办公并主持高层闭门晨会，会议开篇就出轨事件向员工致歉。周二依旧到岗办公。目前距离英伟达季度财报发布仅剩一周。\n不少员工曾将黄仁勋视作不会犯错的英雄和榜样，在出轨事件后，内部氛围低落，员工普遍感到震惊，难以接受。","en":"据CNBC报道，在黄仁勋承认出轨的第二天，即返回英伟达总部办公并主持高层闭门晨会，会议开篇就出轨事件向员工致歉。周二依旧到岗办公。目前距离英伟达季度财报发布仅剩一周。\n不少员工曾将黄仁勋视作不会犯错的英雄和榜样，在出轨事件后，内部氛围低落，员工普遍感到震惊，难以接受。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWzzvWIaMAAHlDf.jpg?name=orig","https://pbs.twimg.com/media/HWz1BssbsAAV5jA.png?name=orig"],"u":"https://x.com/fxtrader/status/2120339416568992240","l":[],"ln":[],"t":["AI科技","财报"],"lk":8,"rt":1,"rp":3,"vw":2245},{"id":"2120338301492290002","h":"cnfinancewatch","ts":1794363019,"zh":"热点财经新闻综述｜2026-11-11·早间\n数据时点：北京时间2026年11月11日07:40前。依据：本期新收到的晚间热点财经邮件（11月10日20:11），并交叉核对每经、新浪财经、路透、CNBC、雅虎财经、经济日报等公开报道。邮件转述与已核实事实分开标注。\n今日判断\n隔夜的主线只有一条：利率。美国10月CPI环比0.4%、核心CPI环比0.3%，均比预期高0.1个百分点；美联储理事沃勒公开支持12月加息，通胀若恶化可考虑50个基点。据CME FedWatch，12月至少加息25个基点已被完全定价，50个基点的概率约11.8%（经济日报、路透转述）。两年期美债收益率单日上行约19个基点至4.736%，十年期收于约4.99%。美股三大指数小幅收跌，道指跌0.30%、标普500跌0.38%、纳指跌0.74%；英伟达再跌约5.5%，纳斯达克金龙中国指数跌1.2%，恒指夜盘跌0.95%。对A股而言，今天大概率是外部降温、内部题材自转的格局：指数层面承压，资金仍在机器人、AI应用、端侧硬件里打转，但追高的性价比在下降。\n三大利多方向（从强到弱）\n一、出口与AI硬件链的基本面背书。海关数据显示，10月货物贸易进出口4.87万亿元、增长31.2%，其中出口增28.7%、进口增34.7%，进出口已连续6个月两位数增长（每经引海关总署）。邮件称美元口径出口增35.2%、贸易顺差突破1万亿美元，路透也以\"AI热潮推动出口、顺差突破1万亿美元\"为题报道，口径不同但方向一致。对光模块、PCB、服务器零部件这类出口链，这是业绩层面的支撑，比单日情绪可靠。隔夜台积电涨约2%、博通涨约3.9%，说明海外资金是在芯片内部切换，而非全面撤离。代表方向：中际旭创、新易盛、沪电股份、东山精密。\n二、AI算力需求再获实锤：CoreWeave财报。Q3营收36.6亿美元、同比增168%，高于预期；全年营收指引上调至130亿至133亿美元，积压订单约1325亿美元，盘后一度涨约8%（CNBC、雅虎财经）。它回应了\"数据中心是否降温\"的疑问；但该公司单季利息支出8.46亿美元、部分债券收益率一度超16%，说明需求强与融资贵并存。对A股算力链是情绪托底，不是新的加速器。\n三、增量资金与政策底。邮件称第三批互换便利资金入市、至少10家券商官宣买入股票；新浪财经统计股票型ETF曾连续25日净流入超6200亿元；此前国常会提出\"完善资本市场稳市机制\"。这条利多决定的是\"跌不深\"，而不是\"涨得快\"。\n三大利空方向（从强到弱）\n一、美联储重回加息通道。这是今天最大的变量。高估值成长股、港股科技、中概股首当其冲；ICE美元指数涨0.6%至102.26，在岸人民币兑美元回落至6.68附近，外资风险偏好承压。若后续数据继续超预期，50个基点的讨论会升温。\n二、英伟达治理风波外溢。公开报道的事实是：英伟达董事会就黄仁勋婚外情对象涉嫌情报背景一事启动独立调查，股价两日累计跌近10%，市值降至约4.07万亿美元（CNBC）。邮件将其表述为\"股东集体诉讼、涉嫌欺诈\"，该说法未能在主流报道中核实，请按未证实处理。影响在于可能拖慢投资决策与产品节奏，并让出口管制话题再度被讨论，对国内CPO链是情绪扰动。\n三、贵金属与题材高位的双重回撤风险。现货黄金跌2.6%至约4032美元，白银跌3.5%，邮件中\"黄金站稳4100美元\"的判断已被隔夜行情改写，贵金属板块今日承压。国内方面，邮件统计昨日95只涨停（另有统计为93只），闽发铝业7连板、文投控股15天8板，\"东方系\"\"羊字辈\"等名称炒作扎堆，金杯汽车已公告澄清机器人组装业务收入仅50万元。高标一旦断板，跟风股回撤会很快。\n多空如何制约\n利率是压估值的力量，出口与算力订单是托业绩的力量。今天更可能看到指数窄幅震荡、偏弱整理，资金从纯题材向有订单的硬件回流。操作上，宜降低对连板高标的接力，优先业绩可验证的方向。油价跌至两个月低位（布油约91.5美元）对中下游制造是缓冲，但霍尔木兹海峡油轮触雷事件可能带来反向扰动，需要盯住。\n事实与推测：以上指数、宏观数据、财报数字来自公开报道；\"指数承压、资金回流硬件\"等属分析推测。以上内容不构成投资建议，市场有风险，决策请独立判断。","en":"热点财经新闻综述｜2026-11-11·早间\n数据时点：北京时间2026年11月11日07:40前。依据：本期新收到的晚间热点财经邮件（11月10日20:11），并交叉核对每经、新浪财经、路透、CNBC、雅虎财经、经济日报等公开报道。邮件转述与已核实事实分开标注。\n今日判断\n隔夜的主线只有一条：利率。美国10月CPI环比0.4%、核心CPI环比0.3%，均比预期高0.1个百分点；美联储理事沃勒公开支持12月加息，通胀若恶化可考虑50个基点。据CME FedWatch，12月至少加息25个基点已被完全定价，50个基点的概率约11.8%（经济日报、路透转述）。两年期美债收益率单日上行约19个基点至4.736%，十年期收于约4.99%。美股三大指数小幅收跌，道指跌0.30%、标普500跌0.38%、纳指跌0.74%；英伟达再跌约5.5%，纳斯达克金龙中国指数跌1.2%，恒指夜盘跌0.95%。对A股而言，今天大概率是外部降温、内部题材自转的格局：指数层面承压，资金仍在机器人、AI应用、端侧硬件里打转，但追高的性价比在下降。\n三大利多方向（从强到弱）\n一、出口与AI硬件链的基本面背书。海关数据显示，10月货物贸易进出口4.87万亿元、增长31.2%，其中出口增28.7%、进口增34.7%，进出口已连续6个月两位数增长（每经引海关总署）。邮件称美元口径出口增35.2%、贸易顺差突破1万亿美元，路透也以\"AI热潮推动出口、顺差突破1万亿美元\"为题报道，口径不同但方向一致。对光模块、PCB、服务器零部件这类出口链，这是业绩层面的支撑，比单日情绪可靠。隔夜台积电涨约2%、博通涨约3.9%，说明海外资金是在芯片内部切换，而非全面撤离。代表方向：中际旭创、新易盛、沪电股份、东山精密。\n二、AI算力需求再获实锤：CoreWeave财报。Q3营收36.6亿美元、同比增168%，高于预期；全年营收指引上调至130亿至133亿美元，积压订单约1325亿美元，盘后一度涨约8%（CNBC、雅虎财经）。它回应了\"数据中心是否降温\"的疑问；但该公司单季利息支出8.46亿美元、部分债券收益率一度超16%，说明需求强与融资贵并存。对A股算力链是情绪托底，不是新的加速器。\n三、增量资金与政策底。邮件称第三批互换便利资金入市、至少10家券商官宣买入股票；新浪财经统计股票型ETF曾连续25日净流入超6200亿元；此前国常会提出\"完善资本市场稳市机制\"。这条利多决定的是\"跌不深\"，而不是\"涨得快\"。\n三大利空方向（从强到弱）\n一、美联储重回加息通道。这是今天最大的变量。高估值成长股、港股科技、中概股首当其冲；ICE美元指数涨0.6%至102.26，在岸人民币兑美元回落至6.68附近，外资风险偏好承压。若后续数据继续超预期，50个基点的讨论会升温。\n二、英伟达治理风波外溢。公开报道的事实是：英伟达董事会就黄仁勋婚外情对象涉嫌情报背景一事启动独立调查，股价两日累计跌近10%，市值降至约4.07万亿美元（CNBC）。邮件将其表述为\"股东集体诉讼、涉嫌欺诈\"，该说法未能在主流报道中核实，请按未证实处理。影响在于可能拖慢投资决策与产品节奏，并让出口管制话题再度被讨论，对国内CPO链是情绪扰动。\n三、贵金属与题材高位的双重回撤风险。现货黄金跌2.6%至约4032美元，白银跌3.5%，邮件中\"黄金站稳4100美元\"的判断已被隔夜行情改写，贵金属板块今日承压。国内方面，邮件 89426","h":"cnfinancewatch","ts":1794354048,"zh":"A股盘前第一版 11月11日\n先说结论：隔夜美国10月CPI高于预期，美股转跌，金价随利率回吐，今天不是追涨日。昨天A股是创业板和题材占优，但那是CPI公布前的交易。主线三条：AI眼镜与消费电子、光模块与PCB算力硬件、人形机器人。前两条只在回撤和未封板的票里做，后一条有ETF双窗口，但零部件利润还没跟上。贵金属从超短主线降为观察。总仓中性偏低，涨停板只当温度计。\n#消息面\n美国10月CPI环比上涨0.4%、核心上涨0.3%，均高于预期的0.3%和0.2%；因去年同期政府停摆缺基数，官方未公布同比。沃勒在数据前表示，若核心通胀在0.3%附近，12月应把加息50个基点放上桌。10年期美债收益率收在约4.99%、上行约13个基点，2年期约4.74%、上行约18个基点；12月加息25个基点几乎完全定价。美股三大指数收跌，道指跌0.30%报52231.89点，标普跌0.38%报7520.93点，纳指跌0.74%报25065.88点，费城半导体跌0.35%；英伟达跌5.47%收168.89美元，博通涨3.91%，AMD和台积电ADR跟涨，半导体内部分化。现货黄金跌约2.7%至4032美元附近；WTI约86.23美元。A股11月10日沪指涨0.08%报3663.72点，深成指涨0.86%，创业板指涨1.46%，科创50涨0.64%，上证50跌0.58%；两市成交约1.49万亿元，放量约222亿元。影视院线、游戏和AI视频走强，午后AI眼镜爆发，十余只眼镜链涨停；港口航运和油气偏弱。公开新闻转述前10个月货物进出口同比增长20%。今日公司公告未见能改主线的新重磅。\n#研报面\n最近三个交易日公开口径：11月10日国金证券电子行业维持买入，称市场已充分反映悲观预期；中邮证券给奥士康买入，逻辑落在算力PCB起量；太平洋首次覆盖新亚电子买入，关注高频高速线缆和光芯片，并维持智微智能买入。华安证券把物理AI作为下一风口；华龙证券转述Meta或联手傅利叶打造人形机器人，属研报转述，不是已落地合同。以上均为公开研报转述。\n#热榜\n东财人气榜接口本轮未能取到完整排名，改用涨停池和主力净流入作热度旁证。11月10日涨停约93只，集中在影视院线、游戏、AI视频和AI眼镜。主力净流入前排的新易盛、中际旭创、瑞芯微、立讯精密、歌尔股份、沪电股份，和眼镜、光模块能对上。连板和亏损传媒股热度高，但不作为方向仓。\n#资金面\n风格偏向创业板和题材。主力净流入前排：新易盛约13.54亿元、中际旭创约9.84亿元、瑞芯微约6.19亿元、立讯精密约4.58亿元、歌尔股份约3.57亿元、沪电股份约3.02亿元。龙虎榜净买入居前为富瀚微约2.68亿元，且为两家机构买入。北向当日完整净流入口径未完整采集，不作判断。开盘要看眼镜和光模块是继续高开，还是把隔夜压力消化在竞价里。\n#中美映射\n美股行业ETF用11月10日收盘：20日靠前为住房建设 $ITB 约+13.7%、医疗 $XLV 约+11.3%、医疗器械 $IHI\n约+10.2%；5日黄金股 $GDX 约+11.5%但当日跌5.4%， $ITB 当日跌3.3%。半导体 $SMH\n近20日约-17.8%、近5日约-6.7%，机器人 $BOTZ\n近20日约-9.7%、近5日约-2.3%。A股主题ETF至11月10日：5日靠前为半导体约+11.8%、芯片约+10.7%至+11.1%、机器人约+7.3%、光伏约+6.5%、黄金约+5.1%；20日靠前为酒约+7.5%、机器人约+6.6%、汽车约+4.4%、医疗约+3.9%，半导体和芯片20日仍约-11%至-13%。\n标注：20日共振（趋势）是医药和医疗器械，美股更强、A股温和，不是今天最热主线。5日共振已削弱：半导体只剩A股短端还强，美股 $SMH\n五日转负，不能再当双侧超短共振，更不能当趋势仓。双窗口同现偏事件是机器人，A股ETF双侧为正，美股 $BOTZ\n双侧仍弱。仅5日慎追贵金属和光伏，黄金隔夜已经在回吐。住房是美股独立行情，A股地产不是同步买入信号。AI眼镜是A股短线主线，美股没有对等主题ETF，映射弱。\n#期货\n富时中国A50当月连续报12879点，跌约0.29%，外盘对A股情绪略偏压制。截至北京时间约07:15，标普期货约7556点较前值涨约0.16%，纳指期货约27924点涨约0.32%，道指期货约52378点涨约0.12%，只是现货收跌后的轻微修复。黄金期货约4039美元，现货约4032美元；国内黄金期货夜盘回落至865元/克附近。WTI约86.23美元。股指期货夜盘报价未完整采集，开盘以现货和A50为锚。\n#三个方向\nAI眼镜与消费电子：昨天午后十余股涨停，品牌消费电子20日和5日都在走强，端侧AI研报可作旁证。这是短线主线，位置已经偏热，只做没封板的龙头，不追连板。\n光模块与PCB算力硬件：新易盛、中际旭创、沪电资金领先，并有电子和算力PCB研报互证。A股半导体五日仍强、二十日仍深负，隔夜美股芯片转弱，只按脉冲和业绩回撤处理，不加趋势仓。\n人形机器人与物理AI：A股机器人ETF五日、二十日双窗口为正，美股机器人ETF仍弱，零部件利润还没跟上，适合低仓跟踪。","en":"A股盘前第一版 11月11日\n先说结论：隔夜美国10月CPI高于预期，美股转跌，金价随利率回吐，今天不是追涨日。昨天A股是创业板和题材占优，但那是CPI公布前的交易。主线三条：AI眼镜与消费电子、光模块与PCB算力硬件、人形机器人。前两条只在回撤和未封板的票里做，后一条有ETF双窗口，但零部件利润还没跟上。贵金属从超短主线降为观察。总仓中性偏低，涨停板只当温度计。\n#消息面\n美国10月CPI环比上涨0.4%、核心上涨0.3%，均高于预期的0.3%和0.2%；因去年同期政府停摆缺基数，官方未公布同比。沃勒在数据前表示，若核心通胀在0.3%附近，12月应把加息50个基点放上桌。10年期美债收益率收在约4.99%、上行约13个基点，2年期约4.74%、上行约18个基点；12月加息25个基点几乎完全定价。美股三大指数收跌，道指跌0.30%报52231.89点，标普跌0.38%报7520.93点，纳指跌0.74%报25065.88点，费城半导体跌0.35%；英伟达跌5.47%收168.89美元，博通涨3.91%，AMD和台积电ADR跟涨，半导体内部分化。现货黄金跌约2.7%至4032美元附近；WTI约86.23美元。A股11月10日沪指涨0.08%报3663.72点，深成指涨0.86%，创业板指涨1.46%，科创50涨0.64%，上证50跌0.58%；两市成交约1.49万亿元，放量约222亿元。影视院线、游戏和AI视频走强，午后AI眼镜爆发，十余只眼镜链涨停；港口航运和油气偏弱。公开新闻转述前10个月货物进出口同比增长20%。今日公司公告未见能改主线的新重磅。\n#研报面\n最近三个交易日公开口径：11月10日国金证券电子行业维持买入，称市场已充分反映悲观预期；中邮证券给奥士康买入，逻辑落在算力PCB起量；太平洋首次覆盖新亚电子买入，关注高频高速线缆和光芯片，并维持智微智能买入。华安证券把物理AI作为下一风口；华龙证券转述Meta或联手傅利叶打造人形机器人，属研报转述，不是已落地合同。以上均为公开研报转述。\n#热榜\n东财人气榜接口本轮未能取到完整排名，改用涨停池和主力净流入作热度旁证。11月10日涨停约93只，集中在影视院线、游戏、AI视频和AI眼镜。主力净流入前排的新易盛、中际旭创、瑞芯微、立讯精密、歌尔股份、沪电股份，和眼镜、光模块能对上。连板和亏损传媒股热度高，但不作为方向仓。\n#资金面\n风格偏向创业板和题材。主力净流入前排：新易盛约13.54亿元、中际旭创约9.84亿元、瑞芯微约6.19亿元、立讯精密约4.58亿元、歌尔股份约3.57亿元、沪电股份约3.02亿元。龙虎榜净买入居前为富瀚微约2.68亿元，且为两家机构买入。北向当日完整净流入口径未完整采集，不作判断。开盘要看眼镜和光模块是继续高开，还是把隔夜压力消化在竞价里。\n#中美映射\n美股行业ETF用11月10日收盘：20日靠前为住房建设 $ITB 约+13.7%、医疗 $XLV 约+11.3%、医疗器械 $IHI\n约+10.2%；5日黄金股 $GDX 约+11.5%但当日跌5.4%， $ITB 当日跌3.3%。半导体 $SMH\n近20日约-17.8%、近5日约-6.7%，机器人 $BOTZ\n近20日约-9.7%、近5日约-2.3%。A股主题ETF至11月10日：5日靠前为半导体约+11.8%、芯片约+10.7%至+11.1%、机器人约+7.3%、光伏约+6.5%、黄金约+5.1%；20日靠前为酒约+7.5%、机器人约+6.6%、汽车约+4.4%、医疗约+3.9%，半导体和芯片20日仍约-11%至-13%。\n标注：20日共振（趋势）是医药和医疗器械，美股更强、A股温和，不是今天最热主线。5日共振已削弱：半导体只剩A股短端还强，美股 $SMH\n五日转负，不能再当双侧超短共振，更不能当趋势仓。双窗口同现偏事件是机器人，A股ETF双侧为正，美股 $BOTZ\n双侧仍弱。仅5日慎追贵金属和光伏，黄金隔夜已经在回吐。住房是美股独立行情，A股地产不是同步买入信号。AI眼镜是A股短线主线，美股没有对等主题ETF，映射弱。\n#期货\n富时中国A50当月连续报12879点，跌约0.29%，外盘对A股情绪略偏压制。截至北京 const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
