<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经资讯工作台 · X 信源</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d4a24c'/><text x='16' y='23' font-size='19' font-family='system-ui' text-anchor='middle' fill='%230a0d13'>财</text></svg>">
<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>
</head>

收盘集合竞价阶段不得申报的限制等。二是要求上市36个月内的上市公司当股价触及护盘式回购情形的，严格认真履行上市承诺中的稳定股价措施。三是要求存在超募资金的上市公司在触及护盘式回购时及时实施回购。四是要求上市公司在年度现金分红计划中明确一定比例资金纳入回购专项基金，要求存在超募资金的上市公司将一定比例的超募资金纳入回购专项基金并专项用于股份回购注销，要求上市公司通过集中竞价卖出护盘式回购股份的所得收益纳入回购专项基金。\n下一步，我们将在深入研究论证的基础上，抓紧修订《上市公司股份回购规则》，增强护盘式回购的约束力。规则正式修订前，证监会将加大和有关方面协调配合，支持、鼓励和督促具备条件的上市公司，特别是重要指数成份股公司、龙头科技股公司按照上述要求结合自身实际积极实施股份回购，持续做好市值管理。","en":"20:36:51【近期证监会拟对护盘式回购作调整优化】财联社11月2日电，中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。在监管部门的号召和推动下，近年来不少上市公司积极开展股份回购，请问上市公司回购的整体实施情况如何？下一步在支持上市公司股份回购、优化回购规则方面有什么考虑？\n答：开展股份回购是上市公司进行市值管理的重要工具，也是上市公司稳定自身股价、展现和传递发展前景及信心的重要途径。2023年12月，证监会修订《上市公司股份回购规则》，提升了股份回购便利度，完善了上市公司股份回购的常态化机制性安排，回购规模数量总体呈上升态势。2024年至2026年前10个月，上市公司回购股份的积极性稳步提升，沪深两市累计披露回购计划金额和实际实施金额均较前三年（2021年-2023年）增长50%。今年前10个月，沪深两市645家上市公司披露700单2377亿元股份回购计划，其中回购注销金额1150亿元，占比近50%，747家公司实际实施回购1345亿元，回购计划金额、实际回购金额、回购注销金额及占比均创历史新高。\n为进一步提高上市公司开展股份回购的便利度，发挥市场内在稳市功能，经广泛深入调研，近期证监会拟对为维护公司价值及股东权益所必需而回购股份（简称护盘式回购）作以下调整优化：一是新增股价“破发”作为可以开展护盘式回购的情形之一，规定护盘式回购不适用“公司股票上市已满六个月”的限制，取消护盘式回购中开盘和收盘集合竞价阶段不得申报的限制等。二是要求上市36个月内的上市公司当股价触及护盘式回购情形的，严格认真履行上市承诺中的稳定股价措施。三是要求存在超募资金的上市公司在触及护盘式回购时及时实施回购。四是要求上市公司在年度现金分红计划中明确一定比例资金纳入回购专项基金，要求存在超募资金的上市公司将一定比例的超募资金纳入回购专项基金并专项用于股份回购注销，要求上市公司通过集中竞价卖出护盘式回购股份的所得收益纳入回购专项基金。\n下一步，我们将在深入研究论证的基础上，抓紧修订《上市公司股份回购规则》，增强护盘式回购的约束力。规则正式修订前，证监会将加大和有关方面协调配合，支持、鼓励和督促具备条件的上市公司，特别是重要指数成份股公司、龙头科技股公司按照上述要求结合自身实际积极实施股份回购，持续做好市值管理。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117234665170129062","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1220},{"id":"2117234652742062509","h":"dmjk001","ts":1793623052,"zh":"20:35:26【证监会：下一步将引导和鼓励已完成募集的18只主动ETF加快开展投资建仓】财联社11月2日电，证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。下一步，证监会将引导和鼓励已完成募集的18只主动ETF加快开展投资建仓。同时，持续加大权益类基金产品供给和创新力度，支持基金管理人逆周期布局。推出更多新指数股票ETF，丰富场内投资工具。研究推出股债恒定比例等多资产指数基金，丰富场外中低波动型产品，更好满足不同投资者投资需求。鼓励基金管理人发行更多浮动费率基金，进一步强化基金管理人与持有人利益相绑定。","en":"20:35:26【证监会：下一步将引导和鼓励已完成募集的18只主动ETF加快开展投资建仓】财联社11月2日电，证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。下一步，证监会将引导和鼓励已完成募集的18只主动ETF加快开展投资建仓。同时，持续加大权益类基金产品供给和创新力度，支持基金管理人逆周期布局。推出更多新指数股票ETF，丰富场内投资工具。研究推出股债恒定比例等多资产指数基 运用融资工具。证监会将继续督促证券公司切实加强风险管理，保护投资者合法权益。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117233926460821980","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1267},{"id":"2117233672373825943","h":"dmjk001","ts":1793622818,"zh":"20:32:55【中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问】财联社11月2日电，中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。一、今日金融管理部门召开座谈会，就用好用足两项结构性货币政策工具作出安排，请问证监会对后续工作有何考虑？\n答：2024年9月，人民银行会同证监会、金融监管总局推出证券、基金、保险公司互换便利和股票回购增持专项再贷款两项新的货币政策工具。两年多来，证券公司、基金管理公司和上市公司等市场主体积极响应，两项工具运作良好。截至今年10月底，已开展了两批次互换便利操作，28家证券公司和基金管理公司参与，合计金额1050亿元。全市场已有902家上市公司披露1110单回购增持贷款公告，加上中国国新、中国诚通两家国有资本运营公司申请的增持贷款，目前申请贷款额度上限已累计约4400亿元。两项货币政策工具的设立实施，为引入市场增量资金、盘活机构存量资产、促进完善市场内在稳定机制发挥了重要作用。\n今天人民银行宣布将开展第三批证券、基金、保险公司互换便利操作，股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率降低至1%，我们将会同人民银行组织相关市场主体用好用足这两项工具，协同发挥好稳市支持作用。\n一是扩大互换便利业务的参与机构范围和资金额度。经相关机构申请，证监会商人民银行已经同意31家证券公司和基金管理公司开展第三批互换便利操作，申请额度超过1000亿元，近日就开始操作。证监会将继续督促证券公司和基金管理公司加强合规风控管理，充分发挥专业投资能力，更好稳定资本市场。\n二是提高上市公司股票回购增持专项再贷款覆盖率。证监会将引导推出更多权重指数公司、龙头科技股等具有较强市场影响的标志性案例。同时，督促已披露回购增持贷款计划的上市公司加快实施进度，已经申请贷款的公司加大回购实施力度，延续当前贷款回购增持的良好势头，为资本市场稳定积极贡献力量。\n二、在监管部门的号召和推动下，近年来不少上市公司积极开展股份回购，请问上市公司回购的整体实施情况如何？下一步在支持上市公司股份回购、优化回购规则方面有什么考虑？\n答：开展股份回购是上市公司进行市值管理的重要工具，也是上市公司稳定自身股价、展现和传递发展前景及信心的重要途径。2023年12月，证监会修订《上市公司股份回购规则》，提升了股份回购便利度，完善了上市公司股份回购的常态化机制性安排，回购规模数量总体呈上升态势。2024年至2026年前10个月，上市公司回购股份的积极性稳步提升，沪深两市累计披露回购计划金额和实际实施金额均较前三年（2021年-2023年）增长50%。今年前10个月，沪深两市645家上市公司披露700单2377亿元股份回购计划，其中回购注销金额1150亿元，占比近50%，747家公司实际实施回购1345亿元，回购计划金额、实际回购金额、回购注销金额及占比均创历史新高。\n为进一步提高上市公司开展股份回购的便利度，发挥市场内在稳市功能，经广泛深入调研，近期证监会拟对为维护公司价值及股东权益所必需而回购股份（简称护盘式回购）作以下调整优化：一是新增股价“破发”作为可以开展护盘式回购的情形之一，规定护盘式回购不适用“公司股票上市已满六个月”的限制，取消护盘式回购中开盘和收盘集合竞价阶段不得申报的限制等。二是要求上市36个月内的上市公司当股价触及护盘式回购情形的，严格认真履行上市承诺中的稳定股价措施。三是要求存在超募资金的上市公司在触及护盘式回购时及时实施回购。四是要求上市公司在年度现金分红计划中明确一定比例资金纳入回购专项基金，要求存在超募资金的上市公司将一定比例的超募资金纳入回购专项基金并专项用于股份回购注销，要求上市公司通过集中竞价卖出护盘式回购股份的所得收益纳入回购专项基金。\n下一步，我们将在深入研究论证的基础上，抓紧修订《上市公司股份回购规则》，增强护盘式回购的约束力。规则正式修订前，证监会将加大和有关方面协调配合，支持、鼓励和督促具备条件的上市公司，特别是重要指数成份股公司、龙头科技股公司按照上述要求结合自身实际积极实施股份回购，持续做好市值管理。\n三、前期监管部门已宣布推出主动ETF，目前进展情况如何？下一步在丰富市场投资工具等方面还有哪些工作考虑？\n答：主动ETF是基金经理依托专业投研能力自主开展选股、择时与配置，不以跟踪特定指数为目标，同时可以进行场内实时交易、实物申赎的公募基金产品，兼具普通基金主动管理和ETF交易灵活、透明度高的特点，可满足不同风险偏好投资者的需求，为市场持续引入增量资金。自今年6月份我会宣布推出主动ETF后，基金公司踊跃申报。首批18只主动ETF于10月19日注册，10月23日启动募集，整体募集态势良好。截至11月2日，合计募集资金超过350亿元，其中已有16只产品达到20亿元的单只募集规模上限并结束募集。\n下一步，证监会将引导和鼓励已完成募集的18只主动ETF加快开展投资建仓。同时，持续加大权益类基金产品供给和创新力度，支持基金管理人逆周期布局。推出更多新指数股票ETF，丰富场内投资工具。研究推出股债恒定比例等多资产指数基金，丰富场外中低波动型产品，更好满足不同投资者投资需求。鼓励基金管理人发行更多浮动费率基金，进一步强化基金管理人与持有人利益相绑定。\n四、在发挥好融资融券业务逆周期调节功能作用方面，请问证监会近期有何考虑？\n答：融资融券是资本市场重要的基础性制度之一，对平抑非理性波动，促进价格发现，吸引中长期资金入市，满足投资者融资需求具有积极作用。2026年1月，根据当时的市场形势，沪深北交易所将融资保证金比例由80%提高至100%，对减缓杠杆风险顺周期积累、促进理性交易和提前防控风险起到积极作用。近期，融资余额和交易活跃度明显下降，整体杠杆水平趋于稳健。为稳定资本市场、提振投资者信心，促进融资融券业务功能发挥，证监会将会同证券交易所指导证券公司对融资保证金比例、可充抵保证金证券折算率、维持担保比例等风险控制指标进行统筹研究，进一步优化，保持弹性。在风险总体可控的基础上，根据法定的逆周期调节安排，适度释放融资空间，盘活存量资金，提升市场流动性。","en":"20:32:55【中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问】财联社11月2日电，中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。一、今日金融管理部门召开座谈会，就用好用足两项结构性货币政策工具作出安排，请问证监会对后续工作有何考虑？\n答：2024年9月，人民银行会同证监会、金融监管总局推出证券、基金、保险公司互换便利和股票回购增持专项再贷款两项新的货币政策工具。两年多来，证券公司、基金管理公司和上市公司等市场主体积极响应，两项工具运作良好。截至今年10月底，已开展了两批次互换便利操作，28家证券公司和基金管理公司参与，合计金额1050亿元。全市场已有902家上市公司披露1110单回购增持贷款公告，加上中国国新、中国诚通两家国有资本运营公司申请的增持贷款，目前申请贷款额度上限已累计约4400亿元。两项货币政策工具的设立实施，为引入市场增量资金、盘活机构存量资产、促进完善市场内在稳定机制发挥了重要作用。\n今天人民银行宣布将开展第三批证券、基金、保险公司互换便利操作，股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率降低至1%，我们将会同人民银行组织相关市场主体用好用足这两项工具，协同发挥好稳市支持作用。\n一是扩大互换便利业务的参与机构范围和资金额度。经相关机构申请，证监会商人民银行已经同意31家证券公司和基金管理公司开展第三批互换便利操作，申请额度超过1000亿元，近日就开始操作。证监会将继续督促证券公司和基金管理公司加强合规风控管理，充分发挥专业投资能力，更好稳定资本市场。\n二是提高上市公司股票回购增持专项再贷款覆盖率。证监会将引导推出更多权重指数公司、龙头科技股等具有较强市场影响的标志性案例。同时，督促已披露回购增持贷款计划的上市公司加快实施进度，已经申请贷款的公司加大回购实施力度，延续当前贷款回购增持的良好势头，为资本市场稳定积极贡献力量。\n二、在监管部门的号召和推动下，近年来不少上市公司积极开展股份回购，请问上市公司回购的整体实施情况如何？下一步在支持上市公司股份回购、优化回购规则方面有什么考虑？\n答：开展股份回购是上市公司进行市值管理的重要工具，也是上市公司稳定自身股价、展现和传递发展前景及信心的重要途径。2023年12月，证监会修订《上市公司股份回购规则》，提升了股份回购便利度，完善了上市公司股份回购的常态化机制性安排，回购规模数量总体呈上升态势。2024年至2026年前10个月，上市公司回购股份的积极性稳步提升，沪深两市累计披露回购计划金额和实际实施金额均较前三年（2021年-2023年）增长50%。今年前10个月，沪深两市645家上市公司披露700单2377亿元股份回购计划，其中回购注销金额1150亿元，占比近50%，747家公司实际实施回购1345亿元，回购计划金额、实际回购金额、回购注销金额及占比均创历史新高。\n为进一步提高上市公司开展股份回购的便利度，发挥市场内在稳市功能，经广泛深入调研，近期证监会拟对为维护公司价值及股东权益所必需而回购股份（简称护盘式回购）作以下调整优化：一是新增股价“破发”作为可以开展护盘式回购的情形之一，规定护盘式回购不适用“公司股票上市已满六个月”的限制，取消护盘式回购中开盘和收盘集合竞价阶段不得申报的限制等。二是要求上市36个月内的上市公司当股价触及护盘式回购情形的，严格认真履行上市承诺中的稳定股价措施。三是要求存在超募资金的上市公司在触及护盘式回购时及时实施回购。四是要求上市公司在年度现金分红计划中明确一定比例资金纳入回购专项基金，要求存在超募资金的上市公司将一定比例的超募资金纳入回购专项基金并专项用于股份回购注销，要求上市公司通过集中竞价卖出护盘式回购股份的所得收益纳入回购专项基金。\n下一步，我们将在深入研究论证的基础上，抓紧修订《上市公司股份回购规则》，增强护盘式回购的约束力。规则正式修订前，证监会将加大和有关方面协调配合，支持、鼓励和督促具备条件的上市公司，特别是重要指数成份股公司、龙头科技股公司按照上述要求结合自身实际积极实施股份回购，持续做好市值管理。\n三、前期监管部门已宣布推出主动ETF，目前进展情况如何？下一步在丰富市场投资工具等方面还有哪些工作考虑？\n答：主动ETF是基金经理依托专业投研能力自主开展选股、择时与配置，不以跟踪特定指数为目标，同时可以进行场内实时交易、实物申赎的公募基金产品，兼具普通基金主动管理和ETF交易灵活、透明度高的特点，可满足不同风险偏好投资者的需求，为市场持续引入增量资金。自今年6月份我会宣布推出主动ETF后，基金公司踊跃申报。首批18只主动ETF于10月19日注册，10月23日启动募集，整体募集态势良好。截至11月2日，合计募集资金超过350亿元，其中已有16只产品达到20亿元的单只募集规模上限并结束募集。\n下一步，证监会将引导和鼓励已完成募集的18只主动ETF加快开展投资建仓。同时，持续加大权益类基金产品供给和创新力度，支持基金管理人逆周期布局。推出更多新指数股票ETF，丰富场内投资工具。研究推出股债恒定比例等多资产指数基金，丰富场外中低波动型产品，更好满足不同投资者投资需求。鼓励基金管理人发行更多浮动费率基金，进一步强化基金管理人与持有人利益相绑定。\n四、在发挥好融资融券业务逆周期调节功能作用方面，请问证监会近期有何考虑？\n答：融资融券是资本市场重要的基础性制度之一，对平抑非理性波动，促进价格发现，吸引中长期资金入市，满足投资者融资需求具有积极作用。2026年1月，根据当时的市场形势，沪深北交易所将融资保证金比例由80%提高至100%，对减缓杠杆风险顺周期积累、促进理性交易和提前防控风险起到积极作用。近期，融资余额和交易活跃度明显下降，整体杠杆水平趋于稳健。为稳定资本市场、提振投资者信心，促进融资融券业务功能发挥，证监会将会同证券交易所指导证券公司对融资保证金比例、可充抵保证金证券折算率、维持担保比例等风险控制指标进行统筹研究，进一步优化，保持弹性。在风险总体可控的基础上，根据法定的逆周期调节安排，适度释放融资空间，盘活存量资金，提升市场流动性。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117233672373825943","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":0,"vw":1385},{"id":"2117233435391475782","h":"business","ts":1793622761,"zh":"欧洲多个国家的连锁超市遭到疑似网络攻击，导致冰箱和冰柜的温度突然变化，几周前法国也出现类似问题。全文：\n📷：弗雷德里克·桑德伯格/TT/美联社照片","en":"Supermarket chains in multiple European countries were hit by suspected cyberattacks that caused sudden changes in the temperatures of their fridges and freezers, weeks after a similar issue in France. Full story:\n📷: Fredrik Sandberg/TT/AP Photo","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HWHslvmWYAA8aZH.jpg?name=orig"],"u":"https://x.com/business/status/2117233435391475782","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/48t7mVg","d":"bloom.bg"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":2526},{"id":"2117232820045086818","h":"business","ts":1793622615,"zh":"这是您开始新的一天需要了解的内容 te?taid=6ae88257c52de30001da1697&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Here’s what you need to know to start your day","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2117232820045086818","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-02/feud-erupts-in-michigan-as-el-sayed-rival-backs-gop-candidate?taid=6ae88257c52de30001da1697&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":6989},{"id":"2117231855753892273","h":"cnfinancewatch","ts":1793622385,"zh":"10月去杠杆的余震与11月的机会窗口：中性偏多地看AI资本开支交易\n10月对很多投资者来说是一次残酷的压力测试。摩根士丹利的数据显示，最近一轮对冲基金去杠杆化是过去10年最高，强度超过了2016年中国股市崩盘、2018年“波动地狱”、2020年3月COVID崩盘、2021年Archegos/恒大危机以及2022年熊市。高盛主经纪业务部门在26日报告称，两周内观察到约200亿美元抛售，而7月整个去杠杆期间约为230亿美元。换句话说，10月的抛售在极短时间内集中释放，情绪和仓位都经历了剧烈出清。\n与此同时，空头力量明显抬头。根据HOOD空头持仓数据，从9月到10月，多只股票的空头浮动比率显著上升：AAOI从12.5%升至19.84%以上，AEVA从11%升至25.64%以上，CBRS从12.25%升至20.12%以上，AEHR从14.33%升至17.93%以上，TSEM从2.15%升至4.73%以上，CIFR从19.94%升至25.39%以上，LWLG从15.24%升至19.12%以上，OKLO从17.72%升至22.93%以上，CRWV从17.91%升至26.58%以上。大量去杠杆与空头持仓激增同时发生，确实让人联想到事件落地后出现过的“7月式”格局——仓位先极端收缩，随后再根据基本面和宏观不确定性重新定价。但需要强调，空头比率上升本身不等于方向判断，它更多反映的是市场分歧和防御性仓位。\n轮动层面也出现了一些值得警惕的泡沫化迹象。近期资金把$CRWD和网络安全等股票推向数百倍远期市盈率的估值区间，说明市场在追逐确定性增长时，愿意支付很高的溢价。这种估值结构意味着，一旦宏观风险偏好回落或财报不及预期，波动会被放大。\n不过，从AI资本开支和瓶颈环节的基本面看，许多财报（并非全部，例如INTC）仍然强劲。比如AXTI给出的年化四季度指引对应约23.7倍市盈率，这还没有计入InP衬底潜在涨价和产能扩张，若这些因素兑现，估值可能被压缩到个位数。SKHY约591亿美元运营利润，轻松超过亚马逊281亿美元运营利润，并且有5年长期协议支持。更关键的是，目前没有迹象表明MSFT或AMZN会大幅削减资本支出，而SPCX又为GPU采购额外锁定400亿美元。这些信号说明，AI基础设施的资本开支周期仍有较强支撑，尤其是光子和内存等瓶颈环节。\n宏观上，市场正在等待下周以后美国中期选举结束。选举落地通常有助于降低一部分政策不确定性，让资金重新回到基本面和盈利趋势上。伊朗问题如果随后走向明朗化，也可能缓和此前积累的地缘风险溢价。当然，这只是一种偏积极的基准假设，地缘政治仍有反复可能，不能把“明朗化”等同于风险完全消失。\n综合来看，10月的极端去杠杆和空头激增说明市场已经释放了相当一部分压力，但估值泡沫和宏观不确定性仍在，短期波动不会小。中性偏多的看法是：在中期选举结束、伊朗问题趋于明朗化的窗口里，市场风险偏好可能边际改善；而AI资本开支交易，特别是光子和内存等瓶颈环节，仍是一个具备世代级产业逻辑的机会，只是路径会伴随极端波动。更合理的姿态不是追涨，而是在波动中甄别真正有盈利兑现和产能瓶颈支撑的公司，同时对资本开支削减、地缘反复和高估值消化保持警惕。\n以上为市场观点梳理，不构成投资建议。参考了网络意见。并非全部原创。","en":"10月去杠杆的余震与11月的机会窗口：中性偏多地看AI资本开支交易\n10月对很多投资者来说是一次残酷的压力测试。摩根士丹利的数据显示，最近一轮对冲基金去杠杆化是过去10年最高，强度超过了2016年中国股市崩盘、2018年“波动地狱”、2020年3月COVID崩盘、2021年Archegos/恒大危机以及2022年熊市。高盛主经纪业务部门在26日报告称，两周内观察到约200亿美元抛售，而7月整个去杠杆期间约为230亿美元。换句话说，10月的抛售在极短时间内集中释放，情绪和仓位都经历了剧烈出清。\n与此同时，空头力量明显抬头。根据HOOD空头持仓数据，从9月到10月，多只股票的空头浮动比率显著上升：AAOI从12.5%升至19.84%以上，AEVA从11%升至25.64%以上，CBRS从12.25%升至20.12%以上，AEHR从14.33%升至17.93%以上，TSEM从2.15%升至4.73%以上，CIFR从19.94%升至25.39%以上，LWLG从15.24%升至19.12%以上，OKLO从17.72%升至22.93%以上，CRWV从17.91%升至26.58%以上。大量去杠杆与空头持仓激增同时发生，确实让人联想到事件落地后出现过的“7月式”格局——仓位先极端收缩，随后再根据基本面和宏观不确定性重新定价。但需要强调，空头比率上升本身不等于方向判断，它更多反映的是市场分歧和防御性仓位。\n轮动层面也出现了一些值得警惕的泡沫化迹象。近期资金把$CRWD和网络安全等股票推向数百倍远期市盈率的估值区间，说明市场在追逐确定性增长时，愿意支付很高的溢价。这种估值结构意味着，一旦宏观风险偏好回落或财报不及预期，波动会被放大。\n不过，从AI资本开支和瓶颈环节的基本面看，许多财报（并非全部，例如INTC）仍然强劲。比如AXTI给出的年化四季度指引对应约23.7倍市盈率，这还没有计入InP衬底潜在涨价和产能扩张，若这些因素兑现，估值可能被压缩到个位数。SKHY约591亿美元运营利润，轻松超过亚马逊281亿美元运营利润，并且有5年长期协议支持。更关键的是，目前没有迹象表明MSFT或AMZN会大幅削减资本支出，而SPCX又为GPU采购额外锁定400亿美元。这些信号说明，AI基础设施的资本开支周期仍有较强支撑，尤其是光子和内存等瓶颈环节。\n宏观上，市场正在等待下周以后美国中期选举结束。选举落地通常有助于降低一部分政策不确定性，让资金重新回到基本面和盈利趋势上。伊朗问题如果随后走向明朗化，也可能缓和此前积累的地缘风险溢价。当然，这只是一种偏积极的基准假设，地缘政治仍有反复可能，不能把“明朗化”等同于风险完全消失。\n综合来看，10月的极端去杠杆和空头激增说明市场已经释放了相当一部分压力，但估值泡沫和宏观不确定性仍在，短期波动不会小。中性偏多的看法是：在中期选举结束、伊朗问题趋于明朗化的窗口里，市场风险偏好可能边际改善；而AI资本开支交易，特别是光子和内存等瓶颈环节，仍是一个具备世代级产业逻辑的机会，只是路径会伴随极端波动。更合理的姿态不是追涨，而是在波动中甄别真正有盈利兑现和产能瓶颈支撑的公司，同时对资本开支削减、地缘反复和高估值消化保持警惕。\n以上为市场观点梳理，不构成投资建议。参考了网络意见。并非全部原创。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117231855753892273","l":[],"ln":[],"t":["财报"],"lk":0,"rt":0,"rp":0,"vw":591},{"id":"2117231526614089943","h":"business","ts":1793622306,"zh":"荷兰政府最高咨询机构呼吁推迟两年征收资本利得税 eform?taid=6ae881221b8d7100019465f1&utm_campaign=trueanthem&utm_content=business&utm_medium=social& 配置权益资产。资金用途有明确限制，只能用于资本市场投资，不能随意挪作他用。\n[烟花] 这次招标有什么新变化？\n央行将于11月3日启动第三次SFISF操作招标，前期已有超过30家机构表达申报意向，申报家数和意向额度均高于前两批。前两次操作分别为500亿元和550亿元，合计1050亿元，首期额度框架为5000亿元。本次参与范围进一步扩大，互换费率也有望维持低位甚至继续下调，监管也要求机构“报足、做实”，尽快把资金投向市场。\n[烟花] 对市场的实质影响怎么看？\n短期： 有助于提振市场信心，缓解非银机构在波动中的流动性压力。\n中期： 如果机构持续使用，会形成一笔可循环的权益市场增量资金，降低大跌时的被动卖出压力。\n结构上： 资金主要流向股票、股票ETF和做市，更可能利好流动性较好的权重板块、宽基ETF和高股息资产；中小盘不一定直接受益。\n长期： 它更像资本市场的“稳定器”，不是单靠它就能制造持续大牛市的“发动机”。后续仍需跟踪企业盈利、科技与周期板块景气度、AI产业链兑现、外资流向和宏观政策组合。\n[烟花] 后续重点观察：\n1、第三次招标实际中标规模；\n2、互换费率是否继续下降；\n3、机构融资后资金实际投向哪些板块；\n4、是否进一步扩围至更多券商、基金、保险机构。\nSFISF对A股是“托底+改善流动性”的工具，能降低极端下跌时的脆弱性，但不宜简单理解成“央行直接给股市发钱”。真正值得跟踪的是机构申报规模、费率变化和资金最终流向。\n（数据截至2026年11月2日，仅供参考。非营销材料，仅供合作机构及特定私募合格投资人内部交流，不构成投资建议。相关数据请以托管复核发布为准）","en":"《关于第三次互换便利（SFISF）启动招标》的解读\n[烟花] 央行这次SFISF招标，不是直接印钱买股票，而是给券商、基金、保险开了一条更顺畅的融资通道。机构把手里流动性偏弱的股票ETF、沪深300成分股、债券等资产抵押给央行，换回国债、央票这类高等级资产，再去银行间市场质押融资，最后把资金投向股票、股票ETF和做市。\n平时市场波动大的时候，机构手里虽然有股票、ETF，但拿去融资并不方便，质押折扣也可能较低。SFISF相当于先把这些“不太好借钱”的资产，换成“更好借钱”的国债/央票，再让机构获得资金继续配置权益资产。资金用途有明确限制，只能用于资本市场投资，不能随意挪作他用。\n[烟花] 这次招标有什么新变化？\n央行将于11月3日启动第三次SFISF操作招标，前期已有超过30家机构表达申报意向，申报家数和意向额度均高于前两批。前两次操作分别为500亿元和550亿元，合计1050亿元，首期额度框架为5000亿元。本次参与范围进一步扩大，互换费率也有望维持低位甚至继续下调，监管也要求机构“报足、做实”，尽快把资金投向市场。\n[烟花] 对市场的实质影响怎么看？\n短期： 有助于提振市场信心，缓解非银机构在波动中的流动性压力。\n中期： 如果机构持续使用，会形成一笔可循环的权益市场增量资金，降低大跌时的被动卖出压力。\n结构上： 资金主要流向股票、股票ETF和做市，更可能利好流动性较好的权重板块、宽基ETF和高股息资产；中小盘不一定直接受益。\n长期： 它更像资本市场的“稳定器”，不是单靠它就能制造持续大牛市的“发动机”。后续仍需跟踪企业盈利、科技与周期板块景气度、AI产业链兑现、外资流向和宏观政策组合。\n[烟花] 后续重点观察：\n1、第三次招标实际中标规模；\n2、互换费率是否继续下降；\n3、机构融资后资金实际投向哪些板块；\n4、是否进一步扩围至更多券商、基金、保险机构。\nSFISF对A股是“托底+改善流动性”的工具，能降低极端下跌时的脆弱性，但不宜简单理解成“央行直接给股市发钱”。真正值得跟踪的是机构申报规模、费率变化和资金最终流向。\n（数据截至2026年11月2日，仅供参考。非营销材料，仅供合作机构及特定私募合格投资人内部交流，不构成投资建议。相关数据请以托管复核发布为准）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117191067179385006","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":893},{"id":"2117190370027262229","h":"RFI_Cn","ts":1793612494,"zh":"台北市长选举辩论后 民进党参选人沈伯洋民调首度突破五成 rfi.​my/DBWy","en":"台北市长选举辩论后 民进党参选人沈伯洋民调首度突破五成 rfi.​my/DBWy","zh_src":"native","lang" what's expected to be a brutal election campaign","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2117127104986808387","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-02/top-court-clash-marks-start-of-poland-s-brutal-election-campaign?taid=6ae81fe21d3fbb0001703ee3&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":2,"rt":1,"rp":0,"vw":7032},{"id":"2117126487442882921","h":"dmjk001","ts":1793597263,"zh":"这种时候，政策小作文特别多，真真假假难辨，谨慎参考","en":"这种时候，政策小作文特别多，真真假假难辨，谨慎参考","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117126487442882921","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":682},{"id":"2117126286120509796","h":"dmjk001","ts":1793597215,"zh":"转（出处未知）：\n会议核心定位：不是推出全新救市工具，而是把已经存在的两大央行存量工具，解决落地卡点、提升使用率；一共分两场会。证金公司没有参会，不是本次会议执行主体。\n第一场：央行+证监会，召集券商、公募基金（上午）\n核心议题：证券、基金、保险公司互换便利（SF­I­SF，5000亿）优化\n1. 讨论现存痛点：目前工具申请门槛、抵押品范围、审批流程、费率问题，很多机构申请意愿不强，额度使用不足。\n2. 可能讨论优化方向：\n- 放宽抵押标的范围，简化内部审批手续\n- 降低互换费率，提升券商、公募用这个工具加仓、做市的动力\n- 扩大符合资格的机构名单，不止局限少数头部机构\n- 明确资金用途，只能用于股票、ETF投资，防止资金外流\n3. 附带配套议题（次要）：公募基金的流动性应急机制，防范集中赎回带来的被动抛售踩踏；讨论权益类基金产品发行提速，引导资金入市。\n关于量化：不属于本次会议主线\n券商、公募代表可以口头提出建议，讨论程序化交易顺周期卖出放大波动的问题；但不会在本次会议讨论一刀切限制量化规模、停止量化产品发行。最多只是讨论加强对程序化交易监控、下跌环境约束自动止损这类行为监管。\n第二场：央行+金融监管总局+证监会，召集各大银行（同日）\n核心议题：股票回购增持再贷款（3000亿）优化\n1. 当前卡点：银行顾虑风险，放贷意愿偏弱，很多上市公司大股东想借钱回购增持，但银行审批慢、门槛高。\n2. 可能讨论优化方向：\n- 简化银行审批流程、降低对上市公司/大股东准入门槛\n- 优化风险分担机制，打消银行坏账顾虑，鼓励银行放款\n- 落实专款专用，资金只能用于回购、增持股票，封闭运行。\n不在本次会议重点的内容\n1. 不讨论证金公司直接下场买股票，不讨论证金加码转融资（证金未受邀参会）；\n2. 不会新增全新大规模救市工具；\n3. 不会出台直接限制量化基金总规模的重磅新政。\n利好强度排序\n1. 最大利好：SF­I­SF互换便利降低门槛、扩大抵押品范围，让机构低成本拿到资金买股票；\n2. 次一级利好：回购增持再贷款优化，降低产业资本增持的融资成本，带动上市公司回购；\n3. 偏长期利好：基金流动性保护，防止赎回踩踏；\n4. 微弱预期：口头探讨程序化交易（量化）的顺周期风险，属于现有监管延续，短期力度有限。\n一句话总括\n今天会议重心是盘活已经存在的8000亿两大央行工具，打通机构、银行的落地堵点，提高资金实际投放量，而不是出新大招。会上可以顺带聊量化交易波动风险，但不会直接出台限制量化规模的政策。","en":"转（出处未知）：\n会议核心定位：不是推出全新救市工具，而是把已经存在的两大央行存量工具，解决落地卡点、提升使用率；一共分两场会。证金公司没有参会，不是本次会议执行主体。\n第一场：央行+证监会，召集券商、公募基金（上 ps://x.com/business/status/2117075505140605234","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-02/china-factory-activity-expands-but-ends-streak-of-faster-growth?taid=6ae7efd4f24b6b00016d2de3&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":8,"rt":5,"rp":3,"vw":15175},{"id":"2117074986724897237","h":"cnfinancewatch","ts":1793584984,"zh":"南非陨落启示：高等文明的温柔，从来抵不过野蛮的激进\n人类近代史上，最魔幻的国运反差，莫过于南非。\n三十多年前，它是非洲唯一的工业强国。在全球全面武器禁运、美苏双重封锁的绝境下，南非靠自主技术，研发出独创的铀提纯工艺，造出6枚可实战空投的原子弹，打磨出可改造成洲际导弹的RSA-3运载火箭，集齐了核威慑、航天侦察、高端军工的完整硬核体系，是南半球当之无愧的技术霸主。\n三十多年后，曾经能造核弹火箭的国家，连基础民生都难以维系。全国常态化大停电、市政管网瘫痪停水、铁路电缆频频被盗、工业体系彻底萎缩。从顶尖核武航天强国，跌落到发展中国家末流，断崖式崩塌的背后，从不是资源与技术的流失，而是文明维度的致命冲突。\n南非的巅峰，是欧洲基督教理性文明的产物。白人治理时代，承袭西式契约精神、工业逻辑、规则秩序与极致理性。这套高等文明体系，擅长深耕精密工业、搭建制度框架、突破科技壁垒，造就了南非逆天的硬核国力。但这种文明有一个致命短板：高度文明必然伴随包容、克制、温和与守序，自带柔性与妥协性。\n这是所有高阶文明的共性：追求秩序、崇尚理性、信奉规则、厌恶极端冲突。可在更低阶、更原始的族群文化面前，这份温柔与克制，会直接沦为软弱。\n非洲本土原生文化，带着原始族群的生存本能，重掠夺、轻建设、重私利、轻规则，缺乏长期制度建设与工业沉淀的耐心。当讲究契约、深耕积累的西式高等文明，对上随性野蛮、逐利短视的原生族群文化，前者的理性守序毫无招架之力。\n高等文明擅长建设，野蛮文明擅长破坏。建一座核工厂、打磨一套航天技术需要数十年深耕；毁掉百年工业体系、掏空国家基建，只需短短数年。西式文明搭建的精密工业秩序，无法约束原生文明的无序掠夺，最终层层崩塌，造就了南非如今的残局。\n纵观历史，这种文明降维碾压的悲剧，从未停止。\n千年大宋，是华夏文明的巅峰。经济繁荣、文化璀璨、制度完善、人文昌盛，儒学教化下的宋人，理性、温和、重礼、守序，文明进化程度冠绝当世。可就是这样顶级的高等文明，在崇尚掠夺、骁勇好战、不讲规则的北方游牧野蛮族群面前，节节溃败。\n宋的软肋和今日南非如出一辙：文明越高，底线越高、顾虑越多、妥协越多；野性越强，底线越低、手段越狠、掠夺越烈。文明负责创造财富，野蛮负责抢夺成果，前者负重前行，后者坐享其成，胜负从一开始就注定。\n把视角拉到当下全球格局，一场无声的文明博弈正在上演。\n曾经强势扩张的基督教文明，如今在欧美全面软化：白左思潮泛滥、过度包容、去军事化、放弃博弈、追求安逸，丧失了曾经的铁血进取性。\n传承千年的儒教文明，在日韩、港台乃至内地，也逐渐褪去刚硬风骨，变得温和内敛、极致守序、包容退让。\n两大人类顶级高等文明，双双陷入“文明温柔病”：重规则、轻杀伐，重包容、轻制衡，重发展、轻掠夺。\n反观当下崛起的诸多新兴势力，大多保留着原始的野性竞争逻辑：不讲过多规则、不惧舆论束缚、擅长极限博弈、敢于打破秩序。\n这就是全球格局最残酷的真相：文明的进步，必然伴随性格的软化；野蛮的留存，必然自带扩张的攻击性。\n高等文明负责创造繁荣，野蛮力量负责重塑格局。温柔守序的文明，永远玩不过无底线的激进野性。\n南非的陨落、大宋的覆灭、当下全球文明的强弱置换，最终都指向同一个历史铁律：文明的高度，从来不等同于博弈的强度。所有高阶文明的衰落，从来不是输在创造能力，而是输在过于温柔的善良与克制。\n用以上观点看伊美和俄乌战争，谁赢谁输？光脚的不怕穿鞋的，后者赢不了，赢了也算输。","en":"南非陨落启示：高等文明的温柔，从来抵不过野蛮的激进\n人类近代史上，最魔幻的国运反差，莫过于南非。\n三十多年前，它是非洲唯一的工业强国。在全球全面武器禁运、美苏双重封锁的绝境下，南非靠自主技术，研发出 有营业场所或住所的海外居民，则不能征税，这导致了税收负担的​​差异。","en":"据日经新闻报道，随着外国房产持有量的增加，日本政府正在考虑对在日本经营房地产租赁或停车场业务的海外居民的收入征税，以解决税收不公平的问题。\n目前日本各都道府县无权向海外居民征税，只能向在日本设有办事处或住所的人员征税。总务省计划将这项变更纳入政府和执政联盟正在制定的2027财年税制改革指导方针中。\n个人营业税的征收权归营业场所所在地的都道府县所有。虽然日本国内居民即使没有营业场所，也可以根据其住所地被征税，但对于在日本没有营业场所或住所的海外居民，则不能征税，这导致了税收负担的​​差异。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWFULScbMAAV20p.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2117066269308637184","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":2,"vw":1483},{"id":"2117066120490541064","h":"cnfinancewatch","ts":1793582870,"zh":"上海仪电(集团)有限公司公告，本公司拟分别向上海国盛(集团)有限公司、上海国茂控股有限公司转让所持有\n华鑫股份22.00%和4.99%的股份。\n本次股份转让前，本公司直接持有华鑫股份34.12%的股份，并通过本公司全资子公司华鑫置业(集团)有限公司持有华鑫股份13.15%的股份，合计持股比例为47.27%。本次股份转让完成后，本公司合计持有华鑫股份20.28%的股份。华鑫股份的控股股东将由本公司变更为国盛集团，实际控制人保持不变，仍为上海市国有资产监督管理委员会。截至本公告披露日，上述子公司股权转让事项已经本公司董事会审议通过，本公司与国盛集团、国茂控股签署了《关于上海华鑫股份有限公司之股份转让框架协议》。正式股权转让协议尚未签署，相关工作正在推进中。","en":"上海仪电(集团)有限公司公告，本公司拟分别向上海国盛(集团)有限公司、上海国茂控股有限公司转让所持有\n华鑫股份22.00%和4.99%的股份。\n本次股份转让前，本公司直接持有华鑫股份34.12%的股份，并通过本公司全资子公司华鑫置业(集团)有限公司持有华鑫股份13.15%的股份，合计持股比例为47.27%。本次股份转让完成后，本公司合计持有华鑫股份20.28%的股份。华鑫股份的控股股东将由本公司变更为国盛集团，实际控制人保持不变，仍为上海市国有资产监督管理委员会。截至本公告披露日，上述子公司股权转让事项已经本公司董事会审议通过，本公司与国盛集团、国茂控股签署了《关于上海华鑫股份有限公司之股份转让框架协议》。正式股权转让协议尚未签署，相关工作正在推进中。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117066120490541064","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":618},{"id":"2117065436529299803","h":"business","ts":1793582707,"zh":"财政大臣片山さつき表示，如果货币市场出现无序波动，日本当局已准备采取行动，并将根据与美国同行的现有协议行事。","en":"Japanese authorities are prepared to respond if currency market movements become disorderly, acting in accordance with a standing pact with her US counterpart, says Finance Minister Satsuki Katayama","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2117065436529299803","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-02/japan-s-katayama-says-ready-to-take-steps-for-stable-fx-market?taid=6ae7e673f64aaa00017cb1cb&utm_campa 1%。\n2、涉及标的：黄金ETF、山东黄金（sh600547）、中金黄金（sh600489）。\n3、影响分析：对贵金属方向偏多，强度中，属持续逻辑，但A股同主题未进去重榜前10。\n（七）布伦特原油期货跌幅扩大至1%\n1、事件：财联社11月2日23:01:26报道，布伦特原油期货跌幅扩大至1%，报112.191美元/桶。\n2、涉及标的：标普油气ETF嘉实（sz159518）、中海油服（sh601808）。\n3、影响分析：对能源油气方向偏空，强度弱，属当日情绪影响，与20日强势形成短线背离。\n（八）美股股指期货小幅高开纳指期货涨0.36%\n1、事件：财联社11月2日23:00:59报道，美股股指期货小幅高开，纳指期货涨0.36%。\n2、涉及标的：纳指、QQQ、A股科技成长。\n3、影响分析：对A股科技方向偏多，强度弱，属当日情绪影响，仅缓和恐慌。\n（九）美股科技股隔夜重挫\n1、事件：Yahoo与CNBC报道，隔夜纳指-2.86%、QQQ-3.47%、NVDA-4.22%，市场关注中期选举与AI资本开支。\n2、涉及标的：纳斯达克指数、半导体硬件、A股AI算力软件。\n3、影响分析：对A股半导体与AI算力方向偏空，强度强，属当日情绪影响。\n（十）美国原油基金20日领涨美股ETF\n1、事件：Seeking Alpha报道，油价在中东霍尔木兹袭击再起背景下于中期选举前回落，USO 20日+14.56%仍居美股去重榜首位。\n2、涉及标的：USO、XLE、XOP、A股油服链。\n3、影响分析：对A股能源油气方向偏多，强度中，属持续逻辑，但当日油价回落需观察。","en":"二、今日中美股市重要新闻事件\n（一）美联储12月加息概率升至72%\n1、事件：据CME美联储观察，财联社11月2日22:13:55报道，美联储12月加息25个基点概率为72%，维持不变概率28%。\n2、涉及标的：沪深300、创业板指、成长风格ETF。\n3、影响分析：对A股成长方向偏空，强度强，属持续逻辑，压制估值端。\n（二）央行与证监会将开两场会议优化稳市工具\n1、事件：Google新闻援引BigGo Finance报道，中国央行与证券监管机构11月2日召开两场会议，8000亿元稳市工具进一步优化。\n2、涉及标的：上证指数、券商板块、沪深300。\n3、影响分析：对A股整体偏多，强度中，属当日情绪影响，托底预期升温。\n（三）上市银行三季报收官息差企稳\n1、事件：财联社11月2日22:22:26报道，42家A股上市银行前三季度营收4.66万亿元同比+7.81%，归母净利1.75万亿元同比+3.78%。\n2、涉及标的：银行ETF华夏（sh515020）、成都银行（sh601838）、江苏银行（sh600919）。\n3、影响分析：对银行方向偏多，强度中，属持续逻辑，支撑红利底仓。\n（四）上市券商三季报逾六成营利双增\n1、事件：财联社11月2日22:23:40报道，41家上市券商前三季度营收4924.42亿元同比+19.16%，归母净利2065.74亿元同比+24.02%。\n2、涉及标的：券商板块、中信证券（sh600030）、东方财富（sz300059）。\n3、影响分析：对券商方向偏多，强度弱，属持续逻辑，但当日量能未起。\n（五）A股三季报AI算力与新能源动能向新\n1、事件：财联社11月2日22:36:45报道，AI算力产业链芯片、存储、光模块、PCB头部公司业绩爆发式增长，新能源板块结构性复苏。\n2、涉及标的：光模块、PCB、锂电材料相关ETF。\n3、影响分析：对AI算力与新能源方向偏多，强度中，属持续逻辑，但当日盘面未承接。\n（六）现货黄金突破3900美元\n1、事件：财联社11月2日23:06:47报道，现货黄金突破3900美元，日内上涨0.6%；现货白银报49.59美元/盎司涨1%。\n2、涉及标的：黄金ETF、山东黄金（sh600547）、中金黄金（sh600489）。\n3、影响分析：对贵金属方向偏多，强度中，属持续逻辑，但A股同主题未进去重榜前10。\n（七）布伦特原油期货跌幅扩大至1%\n1、事件：财联社11月2日23:01:26报道，布伦特原油期货跌幅扩大至1%，报112.191美元/桶。\n2、涉及标的：标普油气ETF嘉实（sz159518）、中海油服（sh601808）。\n3、影响分析：对能源油气方向偏空，强度弱，属当日情绪影响，与20日强势形成短线背离。\n（八）美股股指期货小幅高开纳指期货涨0.36%\n1、事件：财联社11月2日23:00:59报道，美股股指期货小幅高开，纳指期货涨0.36%。\n2、涉及标的：纳指、QQQ、A股科技成长。\n3、影响分析：对A股科技方向偏多，强度弱 ？","en":"看到了新一轮924行情的预兆了吗？","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWDCm2fbgAAAIep.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2116905894248374451","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":772},{"id":"2116905633731457093","h":"business","ts":1793544607,"zh":"加纳外交部长表示，在总统约翰·马哈马对这种做法表示担忧后，俄罗斯总统弗拉基米尔·普京已同意停止招募加纳人前往乌克兰作战。 Russia-agrees-to-halt-recruitment-of-ghanaians-for-ukraine-war?taid=6ae7519ff24b6b00016d286c&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Russian President Vladimir Putin has agreed to halt the recruitment of Ghanaians to fight in Ukraine after President John Mahama raised concerns about the practice, according to Ghana’s foreign minister.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2116905633731457093","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-01/russia-agrees-to-halt-recruitment-of-ghanaians-for-ukraine-war?taid=6ae7519ff24b6b00016d286c&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":9,"rt":5,"rp":1,"vw":13363},{"id":"2116905630665711638","h":"cnfinancewatch","ts":1793544607,"zh":"上海中心城区（尤其是黄浦老城厢、静安张园周边等）不少石库门/里弄地块已经完成居民动迁（保护性征收），但长期围挡封存、未大规模开建，形成“人走房空”的过渡状态。\n为什么动迁完却迟迟不开建？\n政策彻底转向“留改拆并举，以保留保护为主”\n2017年后，上海明确从过去以拆除为主的旧改，转向保护优先。中心城区大量石库门里弄被划入历史文化风貌区、风貌保护街坊或优秀历史建筑范畴，实行“征而不拆、人走房留”。不能像过去那样整片推平建高楼，必须修缮、保留肌理、有时还要整体平移。\n施工本身极其复杂、周期长\n典型如张园：2018年启动保护性征收，2020年完成动迁，西区2022年才开放。东区为了在老建筑下方开发地下三层空间（停车、商业、地铁2/12/13号线站内换乘），不得不把部分建筑群临时平移出去（最著名的是7500吨“华严里”用432个机器人日行约10米移动），地下结构做完再归位修缮。这类“地上行走、地下生长”的工程，从动迁到全面运营往往要5-10年。\n经济账难算平\n动迁成本极高（黄浦区2025年相关支出预算就很高），保护修缮+地下开发费用巨大，而地上可新增建筑面积被严格限制。过去“毛地批租”模式因成本倒挂早已停摆，现在多用政府土地储备+平台公司主导。商业回报依赖高端消费/文化IP，市场一旦冷却，开发商就更谨慎。黄浦老西门、乔家路、方浜中路一带就有不少被描述为“无人区”的围挡地块。\n规划和审批链条长\n风貌保护专项规划、控规调整、地下空间、文保审批等层层叠加，加上历史风貌保护资金统筹、开发权转移等机制还在完善中。\n以后怎么解决？城市规划方向\n上海已经明确进入存量更新阶段，大规模成片旧里改造基本收官（2022-2025年基本完成成片及零星二级旧里以下改造），未来不会再走过去“拆完就建高楼”的老路。\n续文脉 + 留韵活化：黄浦等核心区明确从“拆改腾地”转向“留韵活化、价值深耕”。重点是历史建筑保护性修缮、里弄街坊基础设施升级、功能置换（商业、文化、办公、体验空间）。张园、海玥黄浦源·十八里、顺昌路等项目就是样本：保留原生石库门肌理，用平移、原位托换、修旧如旧+局部新建，再配地下空间。⁠\n地下空间补偿地上受限：这是核心区解决密度与保护矛盾的主要手段，同时解决停车、地铁换乘等城市功能。\n资金与机制：土地出让收入专项用于风貌保护；探索开发权转移；政府主导或政企合作；对重点旧改和风貌地块有财政支持。\n其他重点：城中村改造（未来几年最后一波大规模动迁窗口）、不成套职工住宅改造、老旧小区大规模修缮（计划2400万㎡级别）。\n中心区土地其实不稀缺，文化IP（石库门里弄）是否有溢价？张园西区客流和品牌表现说明活化路径是可行的。但保护项目利润薄、周期长，纯市场化动力不足，需要政策持续托底。经济下行周期，这个托底，谁也没底气。\n功能淘汰和城市发展方式的淘汰——从增量扩张、大拆大建转向存量提质、精细更新。老石库门作为海派城市记忆的一部分，不会被简单清除，但原住民的生活方式和低效空间会逐步被现代功能替代。短期这些围挡地块还会持续存在，是必要的“等待期”；中长期会以保护性活化项目逐步打开。\n上海中心城区的石库门更新已经从“拆得快”进入“留得住、活得好”的阶段。但过程确实漫长；逻辑是清晰的：先保护，再活化，地下补功能，经济靠文化+商业慢慢回本。具体地块进度差异很大，张园这种标杆项目推进相对明确，老城厢一些复杂地块可能更慢。\n这是个两难，暂时在地产下行阶段还无解。","en":"上海中心城区（尤其是黄浦老城厢、静安张园周边等）不少石库门/里弄地块已经完成居民动迁（保护性征收），但长期围挡封存、未大规模开建，形成“人走房空”的过渡状态。\n为什么动迁完却迟迟不开建？\n政策彻底转向“留改拆并举，以保留保护为主”\n2017年后，上海明确从过去以拆除为主的旧改，转向保护优先。中心城区大量石库门里弄被划入历史文化风貌区、风貌保护街坊或优秀历史建筑范畴，实行“征而不拆、人走房留”。不能像过去那样整片推平建高楼，必须修缮、保留肌理、有时还要整体平移。\n施工本身极其复杂、周期长\n典型如张园：2018年启动保护性征收，2020年完成动迁，西区2022年才开放。东区为了在老建筑下方开发地下三层空间（停车、商业、地铁2/12/13号线站内换乘），不得不把部分建筑群临时平移出去（最著名的是7500吨“华严里”用432个机器人日行约10米移动），地下结构做完再归位修缮。这类“地上行走、地下生长”的工程，从动迁到全面运营往往要5-10年。\n经济账难算平\n动迁成本极高（黄浦区2025年相关支出预算就很高），保护修缮+地下开发费用巨大，而地上可新增建筑面积被严格限制。过去“毛地批租”模式因成本倒挂早已停摆，现在多用政府土地储备+平台公司主导。商业回报依赖高端消费/文化IP，市场一旦冷却，开发商就更谨慎。黄浦老西门、乔家路、方浜中路一带就有不少被描述为“无人区”的围挡地块。\n规划和审批链条长\n风貌保护专项规划、控规调整、地下空间、文保审批等层层叠加，加上历史风貌保护资金统筹、开发权转移等机制还在完善中。\n以后怎么解决？城市规划方向\n上海已经明确进入存量更新阶段，大规模成片旧里改造基本收官（2022-2025年基本完成成片及零星二级旧里以下改造），未来不会再走过去“拆完就建高楼”的老路。\n续文脉 + 留韵活化：黄浦等核心区明确从“拆改腾地”转向“留韵活化、价值深耕”。重点是历史建筑保护性修缮、里弄街坊基础设施升级、功能置换（商业、文化、办公、体验空间）。张园、海玥黄浦源·十八里、顺昌路等项目就是样本：保留原生石库门肌理，用平移、原位托换、修旧如旧+局部新建，再配地下空间。⁠\n地下空间补偿地上受限：这是核心区解决密度与保护矛盾的主要手段，同时解决停车、地铁换乘等城市功能。\n资金与机制：土地出让收入专项用于风貌保护；探索开发权转移；政府主导或政企合作；对重点旧改和风貌地块有财政支持。\n其他重点：城中村改造（未来几年最后一波大规模动迁窗口）、不成套职工住宅改造、老旧小区大规模修缮（计划2400万㎡级别）。\n中心区土地其实不稀缺，文化IP（石库门里弄）是否有溢价？张园西区客流和品牌表现说明活化路径是可行的。但保护项目利润薄、周期长，纯市场化动力不足，需要政策持续托底。经济下行周期，这个托底，谁也没底气。\n功能淘汰和城市发展方式的淘汰——从增量扩张、大拆大建转向存量提质、精细更新。老石库门作为海派城市记忆的一部分，不会被简单清除，但原住民的生活方式和低效空间会逐步被现代功能替代。短期这些围挡地块还会持续存在，是必要的“等待期”；中长期会以保护性活化项目 ，研究优化股票回购增持再贷款政策。\n[红包]央行有哪些支持路径？\n1️⃣互换便利（SFISF）：券商、基金、保险质押债券、股票ETF、沪深300成分股 → 从央行换入国债、央票 → 银行间回购融资 → 限投股票、ETF和做市。不投放基础货币，期限1年可展期，折算率不高于90%，盈亏自担。\n2️⃣回购增持再贷款：银行贷款给上市公司和主要股东 → 央行按贷款本金100%向银行发放再贷款 → 回购、增持。国有资本运营平台已纳入，国新、诚通。与互换便利合用8000亿额度。\n3️⃣汇金、证金再贷款：央行直接贷款 → 增持宽基ETF。不在8000亿之内（互换便利 5000 亿 + 回购增持再贷款 3000 亿，2025 年 5 月 7 日合并使用），2025年4月8日央行公开表态必要时提供充足再贷款。\n互换便利累计开展两次操作、合计1050亿元（2024年10月500亿元、2025年1月550亿元，据央行公告）；另据央行《2026年第二季度中国货币政策执行报告》，截至6月末，金融机构签定股票回购增持贷款合同金额超3900亿元，已发放超2100亿元。\n[红包]会议后续看点：互换便利第三次操作、额度扩大多少、汇金公告。","en":"市场短期超跌，政策底到市场底【东方财富策略 陈果/姚皓天】\n财联社消息，11月2日金融管理部门有两场会：一是央行、证监会开会，研究推动支持资本市场工具使用，已有券商、基金公司接到通知；二是央行、金融监管总局、证监会召集各大银行，研究优化股票回购增持再贷款政策。\n[红包]央行有哪些支持路径？\n1️⃣互换便利（SFISF）：券商、基金、保险质押债券、股票ETF、沪深300成分股 → 从央行换入国债、央票 → 银行间回购融资 → 限投股票、ETF和做市。不投放基础货币，期限1年可展期，折算率不高于90%，盈亏自担。\n2️⃣回购增持再贷款：银行贷款给上市公司和主要股东 → 央行按贷款本金100%向银行发放再贷款 → 回购、增持。国有资本运营平台已纳入，国新、诚通。与互换便利合用8000亿额度。\n3️⃣汇金、证金再贷款：央行直接贷款 → 增持宽基ETF。不在8000亿之内（互换便利 5000 亿 + 回购增持再贷款 3000 亿，2025 年 5 月 7 日合并使用），2025年4月8日央行公开表态必要时提供充足再贷款。\n互换便利累计开展两次操作、合计1050亿元（2024年10月500亿元、2025年1月550亿元，据央行公告）；另据央行《2026年第二季度中国货币政策执行报告》，截至6月末，金融机构签定股票回购增持贷款合同金额超3900亿元，已发放超2100亿元。\n[红包]会议后续看点：互换便利第三次操作、额度扩大多少、汇金公告。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2116819536314085388","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":481},{"id":"2116818333161119853","h":"RFI_Cn","ts":1793523793,"zh":"莫迪政府再遭挑战：因审查选民信息，印度反对党及“蟑螂党”举行抗议活动 rfi.​my/DBKr","en":"莫迪政府再遭挑战：因审查选民信息，印度反对党及“蟑螂党”举行抗议活动 rfi.​my/DBKr","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWBxKbibMAECj0O.jpg?name=orig"],"u":"https://x.com/RFI_Cn/status/2116818333161119853","l":["rfi.my"],"ln":[{"u":"https://rfi.my/DBKr","d":"rfi.my"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":492},{"id":"2116817592568406525","h":"business","ts":1793523617,"zh":"“公司不是个人。”\n经济学家达龙·阿西莫格鲁 (Daron Acemoglu) 告诉米沙尔·侯赛因 (Mishal Husain) 为什么他认为亿万富翁应该能够进行政治捐款，但他们的企业不应该\n请访问 收听或观看 The Mishal Husain Show：","en":"\"Corporations are not individuals.\"\nEconomist Daron Acemoglu tells Mishal H en","m":[],"u":"https://x.com/business/status/2116764719948177552","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-01/macau-gaming-revenue-decline-extends-despite-golden-week-boost?taid=6ae6ce63f64aaa00017cab75&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["财报","黄金"],"lk":4,"rt":0,"rp":2,"vw":10968},{"id":"2116759944427192484","h":"cnfinancewatch","ts":1793509872,"zh":"中长期AI革命仍在，下一次主升可能不是单靠算力，而是“物理AI+模型+AI医疗/咨询/法律”等应用形成合力。当前抛售并非算力需求不稳，而是巨大需求引发短期投资过猛、现金流承压；电力仍是硬约束，算力供应只能缓慢释放——电力短缺对股价未必是负面，反而可能强化稀缺逻辑和电力基础设施投资。\n数据支撑很硬：SK海力士Q3收入104.6万亿韩元（同比+328%）、运营利润83.3万亿韩元、利润率约80%；DRAM和HBM基本售罄至2029年，客户HBM需求约为供应2倍，短缺预计持续至2030年，长协已覆盖2027–2028年产能一半以上、涉及14家主要客户。Anthropic每美元计算和基础设施支出收入从2025Q1的0.40美元升至2026Q2的2.08美元，五季度提升5.2倍；计算成本占收入从251%降至48%，实现首个季度运营利润；收入同比+1368%，计算支出仅+约300%。GPU租赁回暖：B200按需价格一个月涨超20%，H100/H200趋稳。\n供应端也未放缓：亚马逊2026年现金资本支出约2200亿美元，2027年“大幅增加”；Alphabet维持2026年1950–2050亿美元区间，2027年显著上升；Meta提高区间下限；主要超大规模云厂商2026年资本支出合计超7000亿美元。Q3亚马逊、Alphabet、Meta负自由现金流，靠运营现金、发债和股权融资填补。\n估值上，纳斯达克 trailing PE 20倍高位，远低于2000年3月约190倍。\n所以，短期风险是FCF承压、融资成本和电力/内存/数据中心交付节奏；但中长期看，需求仍超供应。电力制约会拉长算力释放周期，反而可能让紧缺更持久，并催生电力与AI应用侧机会。","en":"中长期AI革命仍在，下一次主升可能不是单靠算力，而是“物理AI+模型+AI医疗/咨询/法律”等应用形成合力。当前抛售并非算力需求不稳，而是巨大需求引发短期投资过猛、现金流承压；电力仍是硬约束，算力供应只能缓慢释放——电力短缺对股价未必是负面，反而可能强化稀缺逻辑和电力基础设施投资。\n数据支撑很硬：SK海力士Q3收入104.6万亿韩元（同比+328%）、运营利润83.3万亿韩元、利润率约80%；DRAM和HBM基本售罄至2029年，客户HBM需求约为供应2倍，短缺预计持续至2030年，长协已覆盖2027–2028年产能一半以上、涉及14家主要客户。Anthropic每美元计算和基础设施支出收入从2025Q1的0.40美元升至2026Q2的2.08美元，五季度提升5.2倍；计算成本占收入从251%降至48%，实现首个季度运营利润；收入同比+1368%，计算支出仅+约300%。GPU租赁回暖：B200按需价格一个月涨超20%，H100/H200趋稳。\n供应端也未放缓：亚马逊2026年现金资本支出约2200亿美元，2027年“大幅增加”；Alphabet维持2026年1950–2050亿美元区间，2027年显著上升；Meta提高区间下限；主要超大规模云厂商2026年资本支出合计超7000亿美元。Q3亚马逊、Alphabet、Meta负自由现金流，靠运营现金、发债和股权融资填补。\n估值上，纳斯达克 trailing PE 20倍高位，远低于2000年3月约190倍。\n所以，短期风险是FCF承压、融资成本和电力/内存/数据中心交付节奏；但中长期看，需求仍超供应。电力制约会拉长算力释放周期，反而可能让紧缺更持久，并催生电力与AI应用侧机会。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116759944427192484","l":[],"ln":[],"t":["美股","AI科技"],"lk":0,"rt":0,"rp":0,"vw":345},{"id":"2116759670010302467","h":"business","ts":1793509807,"zh":"币安表示，将于周日分阶段恢复提款，两天前，黑客试图从加密货币交易所窃取超过 60 亿美元，这是有史以来最大规模的网络盗窃事件","en":"Binance said it would resume withdrawals in phases on Sunday, two days after hackers attempted to drain more than $6 billion from the crypto exchange in the biggest cyber theft ever recorded","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2116759670010302467","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-01/binance-to-resume-customer-withdrawals-in-phases-after-hack?taid=6ae6c9aff24b6b00016d2566&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":1,"rt":2,"rp":0,"vw":8807},{"id":"2116758329607295459","h":"SCMPNews","ts":1793509487,"zh":"讨厌纸吸管？亚洲的新替代品是另一个生态陷阱","en":"Hate paper straws? Asia’s new alternatives are another eco trap","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2116758329607295459","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/week-asia/health-environment/article/3372751/hate-paper-straws-asias-new-alternatives-are-another-eco-trap?utm_medium=Social&utm_source=Twitter#Echobox=1793509484","d":"scmp.com"}],"t":[],"lk":1,"rt":1,"rp":0,"vw":959},{"id":"2116757246822781344","h":"cnfinancewatch","ts":1793509229,"zh":"宁可裁人减薪；也要抱算力基建；结论算力代替人力是实实在在的趋势 ：\n华尔街观察｜以人补资本开支：微软VEO背后，AI军备竞赛的账本置换\n当地时间10月26日，微软推出自愿离职方案 VEO（Voluntary Exit Offer），面向美、加、英、印四国符合条件团队，覆盖职级70级及以下，合计约6万名员工收到邀约，占其全球全职员工约27%。需要厘清：这不是强制裁员，只是买断邀约，最终实际离职人数取决于员工接受比例，但它拉开了一个极具标志性的范式：头部科技公司正式进入「以人力预算，置换算力资本开支」的阶段，Meta、亚马逊、谷歌都已经走在同一条路上。\n很多市场解读简单归为降本增效，这是表层叙事。真正的账本逻辑是：AI 时代算力账单刚性、持续、体量巨大，GPU、数据中心、电力的资本开支几乎没有弹性；而薪酬、人力是资产负债表里为数不多可以主动腾挪的可变成本。与其压制算力扩张，不如把非核心业务、成熟业务、低杠杆岗位的人力预算释放出来，定向供给算力集群。\n从微软的名单边界就能看清取舍：Windows、Xbox、Copilot、后台职能纳入本次自愿买断池；数据中心基建、网络安全、核心销售、量子计算等前线产能岗位，反而不在名单内。这不是单纯削减人头，是一次结构性的人力再分配：保留造算力、卖算力的队伍，收缩那些 AI 可以替代、边际产出持续走低的岗位。70级覆盖至副总裁层级，说明这次调整不是只裁基层，中高薪酬、成熟稳定的存量人力，同样是置换预算的标的。自愿买断相比硬裁员，优势在于平滑舆论冲击，同时把选择权交给员工，用一笔补偿金换取更可控的人员结构优化。\n这条路线已经成为硅谷共识。Meta 管理层曾经直白对外传递信号：削减人力，就是为了对冲 AI 资本开支。几大科技巨头今年合计的 AI 资本开支已经抬升至数千亿美元级别，增速远超营收增速。资本市场一边给 AI 算力故事高估值，一边持续拷问自由现金流、利润率。在这种矛盾之下，大厂找到了折中方案：用人力费用的收缩，去平滑资本开支对利润表的冲击，维持资本开支上行周期里的盈利韧性。\n这里藏着两层对二级市场的推论。\n第一层，算力产业链的长期资本开支逻辑被再次强化。只要这套「人力换算力」的账本成立，头部厂商不会轻易下调 capex 指引，GPU、光模块、服务器、电力、液冷等上游硬件赛道的需求底座，短期很难被证伪。市场之前反复交易的「资本开支见顶」预期，被微软这次动作打出一个反证：不是不投，是资金的内部结构在重新调配。\n第二层，软件、应用层、传统互联网业务，将持续承受人员出清压力。Copilot 这类 AI 应用本身也在裁员池里，说明即便是 AI 产品线，一旦它的人力投入产出比不及算力基建，同样会被优化。未来科技公司的价值权重持续向「算力供给端」倾斜，纯应用层、流量层的溢价会被持续压缩。\n但这个模式自带硬约束，也是最大风险。其一，自愿买断有上限，不能无限循环。人力压缩是一次性的预算腾挪，无法永久覆盖持续滚动的算力账单；当可优化的人力空间耗尽，资本开支的压力会重新全部压向利润。其二，人才的逆向风险：高价值资深员工如果集中选择接受买断，会带走业务沉淀，长期损害产品迭代能力。其三，市场定价的矛盾：投资者今天为「持续加码算力」买单，未来某一个节点，又会突然开始要求资本开支降速、分红回购，预期切换往往非常剧烈。\n放到跨市场视角，这条趋势同样会外溢。国内人形机器人、物理AI、算力产业链的叙事，底层是同一个命题：资本从传统人力，转向自动化、算力、智能硬件。只是海外巨头是在财报层面做预算置换，国内更多是产业赛道的轮动。\n一句话总结：微软这次 VEO，不是一次普通人事调整。它标志着 AI 牛市进入新阶段——资本不再无差别拥抱科技公司，资金开始在「人」和「算力」之间做取舍。算力是这场军备竞赛里刚性的资本品，而人力，正在变成可以被重新定价、被置换的变量。行情的主线，也随之从「AI 故事」，逐步走向「资本开支分配权之争」。\n自愿离职计划最终参与率存在不确定性；科技巨头资本开支节奏受算力供需、宏观利率、客户订单多重变量扰动；产业链高资本开支模式本身具备高波动风险，不构成交易建议。","en":"宁可裁人减薪；也要抱算力基建；结论算力代替人力是实实在在的趋势 ：\n华尔街观察｜以人补资本开支：微软VEO背后，AI军备竞赛的账本置换\n当地时间10月26日，微软推出自愿离职方案 VEO（Voluntary Exit Offer），面向美、加、英、印四国符合条件团队，覆盖职级70级及以下，合计约6万名员工收到邀约，占其全球全职员工约27%。需要厘清：这不是强制裁员，只是买断邀约，最终实际离职人数取决于员工接受比例，但它拉开了一个极具标志性的范式：头部科技公司正式进入「以人力预算，置换算力资本开支」的阶段，Meta、亚马逊、谷歌都已经走在同一条路上。\n很多市场解读简单归为降本增效，这是表层叙事。真正的账本逻辑是：AI 时代算力账单刚性、持续、体量巨大，GPU、数据中心、电力的资本开支几乎没有弹性；而薪酬、人力是资产负债表里为数不多可以主动腾挪的可变成本。与其压制算力扩张，不如把非核心业务、成熟业务、低杠杆岗位的人力预算释放出来，定向供给算力集群。\n从微软的名单边界就能看清取舍：Windows、Xbox、Copilot、后台职能纳入本次自愿买断池；数据中心基建、网络安全、核心销售、量子计算等前线产能岗位，反而不在名单内。这不是单纯削减人头，是一次结构性的人力再分配：保留造算力、卖算力的队伍，收缩那些 AI 可以替代、边际产出持续走低的岗位。70级覆盖至副总裁层级，说明这次调整不是只裁基层，中高薪酬、成熟稳定的存量人力，同样是置换预算的标的。自愿买断相比硬裁员，优势在于平滑舆论冲击，同时把选择权交给员工，用一笔补偿金换取更可控的人员结构优化。\n这条路线已经成为硅谷共识。Meta 管理层曾经直白对外传递信号：削减人力，就是为了对冲 AI 资本开支。几大科技巨头今年合计的 AI 资本开支已经抬升至数千亿美元级别，增速远超营收增速。资本市场一边给 AI 算力故事高估值，一边持续拷问自由现金流、利润率。在这种矛盾之下，大厂找到了折中方案：用人力费 ,"ts":1793506809,"zh":"由于墨尔本公共假期以及利率上升的威胁令该国住宅房地产市场承压，澳大利亚拍卖清盘率跌至六年低点","en":"Australia’s auction clearance rate fell to a six-year low as a public holiday in Melbourne and the threat of higher interest rates weighed on the nation’s residential real estate market","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2116747093805023338","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-01/australia-home-auction-clearance-rate-falls-to-six-year-low?taid=6ae6bdf81d3fbb000170375c&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":3,"rp":2,"vw":13935},{"id":"2116746450461667517","h":"SCMPNews","ts":1793506655,"zh":"“活着”：患有肌肉萎缩症的香港人克服重重困难迎来18岁生日","en":"‘Be alive’: Hongkonger with muscular dystrophy turns 18, against all odds","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2116746450461667517","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/hong-kong/society/article/3372861/be-alive-hongkonger-muscular-dystrophy-turns-18-against-all-odds?utm_medium=Social&utm_source=Twitter#Echobox=1793506647","d":"scmp.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":1349},{"id":"2116744565394723239","h":"cnfinancewatch","ts":1793506206,"zh":"资金博弈决定指数方向：两条路径与两大时间窗口\n当前A股指数行情，本质是七大资金阵营达成共识的结果：国家大基金、保险资金、银行理财、社保资金、券商自营、游资与散户。不同资金的风险偏好、持仓成本、考核周期完全不同，最终会博弈出两条截然不同的指数中枢，3300点是多空分水岭。\n一、两种市场均衡格局\n第一种：体面共识（乐观基准情景）\n指数震荡中枢锁定在3300—3600点区间。\n长线资金（社保、保险、国家级产业资金）守住底部底线，机构自营与银行理财维持仓位稳定，游资和散户形成情绪共振，多类资金形成合力，守住3300关键支撑。只要指数站稳这一平台，中期依然保留走出大五浪的技术条件，趋势行情仍有延续基础。\n第二种：弱势平衡（悲观熊市情景）\n若3300关口被有效跌破，市场将进入2700—3300点长期箱体震荡。\n长线资金开始收缩主动加仓节奏，机构资金被动减仓自保，场内资金陷入存量博弈，增量资金持续缺席。一旦进入这个箱体，市场会彻底步入熊市磨底阶段，估值修复与趋势性行情将长期缺席，整体需要三五年的时间完成筹码充分交换，才会重新迎来大级别机会。\n二、两大关键时间窗口\n1、短期：春季躁动行情\n岁末年初历来是政策预期博弈窗口，流动性环境边际宽松，资金博弈春季行情是历史常态。\n如果指数能够守住3300支撑，政策预期+日历效应叠加，春季行情具备启动基础；一旦指数提前跌破关键点位，情绪持续走弱，春季躁动大概率会落空，仅剩下零星结构性机会。\n2、中期：明年11月重要会议窗口期\n年底重大会议是政策定调的核心节点，也是机构资金提前博弈预期的重要时间点。\n若届时指数仍能站稳3300上方，政策利好会推动指数企稳向上，形成一波事件驱动的修复行情；反之，如果指数已经运行在2700—3300弱势箱体里，即便有政策利好，也只会带来脉冲式反弹，很难扭转长期弱势格局。\n三、核心结论\n1. 3300点是本轮指数行情的生命线，守住则保留大五浪上涨机会，跌破则进入长达数年的熊市底部震荡；\n2. 指数的最终方向，取决于七大主力资金能否形成仓位共识，3300—3600是多方都能接受的均衡区间；\n3. 行情节奏紧盯两个时间节点：先看春季躁动能否如期兑现，再看明年11月会议前后的企稳力度，以此判断市场究竟会走向均衡震荡，还是进入长期磨底。","en":"资金博弈决定指数方向：两条路径与两大时间窗口\n当前A股指数行情，本质是七大资金阵营达成共识的结果：国家大基金、保险资金、银行理财、社保资金、券商自营、游资与散户。不同资金的风险偏好、持仓成本、考核周期完全不同，最终会博弈出两条截然不同的指数中枢，3300点是多空分水岭。\n一、两种市场均衡格局\n第一种：体面共识（乐观基准情景）\n指数震荡中枢锁定在3300—3600点区间。\n长线资金（社保、保险、国家级产业资金）守住底部底线，机构自营与银行理财维持仓位稳定，游资和散户形成情绪共振，多类资金形成合力，守住3300关键支撑。只要指数站稳这一平台，中期依然保留走出大五浪的技术条件，趋势行情仍有延续基础。\n第二种：弱势平衡（悲观熊市情景）\n若3300关口被有效跌破，市场将进入2700—3300点长期箱体震荡。\n长线资金开始收缩主动加仓节奏，机构资金被动减仓自保，场内资金陷入存量博弈，增量资金持续缺席。一旦进入这个箱体，市场会彻底步入熊市磨底阶段，估值修复与趋势性行情将长期缺席，整体需要三五年的时间完成筹码充分交换，才会重新迎来大级别机会。\n二、两大关键时间窗口\n1、短期：春季躁动行情\n岁末年初历来是政策预期博弈窗口，流动性环境边际宽松，资金博弈春季行情是历史常态。\n如果指数能够守住3300支撑，政策预期+日历效应叠加，春季行情具备启动基础；一旦指数提前跌破关键点位，情绪持续走弱，春季躁动大概率会落空，仅剩下零星结构性机会。\n2、中期：明年11月重要会议窗口期\n年底重大会议是政策定调的核心节点，也是机构资金提前博弈预期的重要时间点。\n若届时指数仍能站稳3300上方，政策利好会推动指数企稳向上，形成一波事件驱动的修复行情；反之，如果指数已经运行在2700—3300弱势箱体里，即便有政策利好，也只会带来脉冲式反弹，很难扭转长期弱势格局。\n三、核心结论\n1. 3300点是本轮指数行情的生命线，守住则保留大五浪上涨机会，跌破则进入长达数年的熊市底部震荡；\n2. 指数的最终方向，取决于七大主力资金能否形成仓位共识，3300—3600是多方都能接受的均衡区间；\n3. 行情节奏紧盯两个时间节点：先看春季躁动能否如期兑现，再看明年11月会议前后的企稳力度，以此判断市场究竟会走向均衡震荡，还是进入长期磨底。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116744565394723239","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":1539},{"id":"2116743864593641694","h":"SCMPNews","ts":1793506039,"zh":"远离家乡，接近悲伤：为什么数百万菲律宾移民害怕 Undas","en":"Far from home, close to grief: why millions of Filipino migrants dread Undas","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2116743864593641694","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/week-asia/lifestyle-culture/article/3372721/far-home-close-grief-why-millions-filipino-migrants-dread-undas?utm_medium=Social&utm_source=Twitter#Echobox=1793506034","d":"scmp.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":1547},{"id":"2116742053681942875","h":"business","ts":1793505607,"zh":"上海占 是抢在开盘前把预期锚定住。2026年3月那次教科书级干预提供了范本：财长在美股开盘前两小时出现在CNBC，不承诺“救市”，却句句封死恐慌自我强化的路径——给出油价的心理天花板，让市场知道最坏的情景有边界。预期管理之所以是第一道防线，是因为恐慌的本质不是没钱，而是没人敢先出价。\n第二步，财政与央行必须从“懦夫博弈”走向有限协同。财政部的长债回购是信号，但流动性工具治不了偿付能力的病，回购一日便失效的教训近在眼前。真正的主炮是美联储的YCC或QE：通过扩张资产负债表、主动吸收久期，向风险资产重新注入再平衡的动力。而在此之前，像Citadel以折扣价承接被迫卖方的股票组合那样，让私人资本充当“已知卖方的清道夫”，能以最小公共成本打断连环抛售。\n救市不是在救股价，是在救定价所依赖的那个“最后信念”。信念断了，一切资产都会在真空中坠落；信念还在，流动性才有去处。","en":"美股如果继续暴跌\n美需要考虑救市\n不救，崩的是定价之锚；救，是在与恐慌抢时间。\n美股若继续暴跌，击穿的远不止屏幕上的数字。401(k)养老金计划总资产高达8.9万亿美元，与股市直接挂钩；当数万亿美元市值蒸发，数千万普通美国人的退休储蓄随之震颤，这就不再是“市场调整”，而是一场社会契约的挤兑。更危险的是传导链：美股集中度已高度绑定少数AI巨头，一旦抛售从科技股蔓延为系统性去风险，全球养老金被迫减持，欧亚股市同步失血，“抛售美国”将从交易变成叙事。到那一刻，美联储看跌期权若继续缺席，市场失去的将是对“最后贷款人”的信任本身。\n救市的第一步，不是印钞，而是抢在开盘前把预期锚定住。2026年3月那次教科书级干预提供了范本：财长在美股开盘前两小时出现在CNBC，不承诺“救市”，却句句封死恐慌自我强化的路径——给出油价的心理天花板，让市场知道最坏的情景有边界。预期管理之所以是第一道防线，是因为恐慌的本质不是没钱，而是没人敢先出价。\n第二步，财政与央行必须从“懦夫博弈”走向有限协同。财政部的长债回购是信号，但流动性工具治不了偿付能力的病，回购一日便失效的教训近在眼前。真正的主炮是美联储的YCC或QE：通过扩张资产负债表、主动吸收久期，向风险资产重新注入再平衡的动力。而在此之前，像Citadel以折扣价承接被迫卖方的股票组合那样，让私人资本充当“已知卖方的清道夫”，能以最小公共成本打断连环抛售。\n救市不是在救股价，是在救定价所依赖的那个“最后信念”。信念断了，一切资产都会在真空中坠落；信念还在，流动性才有去处。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116451936644088078","l":[],"ln":[],"t":["美联储","美股","原油能源"],"lk":7,"rt":3,"rp":5,"vw":6539},{"id":"2116451403392582117","h":"business","ts":1793436310,"zh":"在交易日开始前，了解推动英国市场的因素。\n订阅《每日市场 英国版》:","en":"Get up to speed on what’s driving UK markets before the trading day starts.\nSubscribe to Markets Daily UK Edition:","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HV8lVZYW8AAWow9.jpg?name=orig"],"u":"https://x.com/business/status/2116451403392582117","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/3UuUQkS","d":"bloom.bg"}],"t":[],"lk":1,"rt":1,"rp":1,"vw":20953},{"id":"2116445100452479253","h":"business","ts":1793434808,"zh":"德国对意大利的批评作出回击，意大利指责最后时刻补充天然气库存的努力正在推高全欧洲的价格","en":"Germany pushed back against Italian criticism that last-minute efforts to replenish natural gas inventories are driving up prices across Europe","zh_src":"bing","lang":"e ；无人系统/高超音速/Spartan J85/Valkyrie，pipeline约150亿。FY26收入17.5-18.1亿。\n8/ $PLTR：RPO约49亿；Maven Smart System为program of record，Army TITAN约1.27亿，NGC2/Enterprise潜在最高约100亿。国防数字化+自主系统软件层。\n9/ $ONDS：pro forma backlog约7.57亿；6/30后订单超2.7亿（8月下旬-10月初超1.65亿）；ULTRA/IonStrike/ESAD/c-UAS。2026收入目标上调至5.25-5.50亿。\n10/ $RCAT：Army SRR program（Black Widow/Teal），扩展USV（B-18/B-39开放订单，B-26全速率生产）；2026收入目标1.50-1.80亿，依赖下半年放量。\nETF：ITA 规模最大，重仓GE/RTX/BA/LMT/GD；PPA 覆盖广；XAR 更均衡，含KTOS/AVAV；SHLD 偏科技/AI，含PLTR。\n总结：弹药+导弹防御是最大订单引擎；无人机/自主系统与软件占比上升；潜艇/大型平台稳健。多数公司上调指引，backlog提供多年可见度；风险在产能、供应链、F-35谈判、预算最终落地。数据以公司披露/IR为准，不构成投资建议。","en":"美国军工股订单与预增速览（2026 Q3财报季，截至10月底）\n宏观：特朗普/五角大楼FY2027国防预算约1.5万亿美元（基础约1.15万亿+约3500亿 reconciliation），目标是补伊朗冲突弹药库存、加速Golden Dome导弹防御、无人机/自主系统与工业扩产。政治阻力/CR风险仍在，但军工巨头backlog和订单创纪录，实际需求强劲。\n1/ $LMT：Q3末backlog创纪录2920亿美元，book-to-bill 4x；MFC backlog约1425亿，含PAC-3 MSE多年期约525亿（潜在最高586亿）。2026销售指引上调至800-820亿，EPS 30.35-30.75。F-35 Lot20+谈判是执行风险。\n2/ $NOC：backlog创纪录1096亿，Q3净订单164亿，b2b 1.5x；classified约46亿、Sentinel约20亿、Virginia推进约14亿、F-35相关约13亿、E-2约10亿；约35% backlog预计12个月内转化。销售指引43.75-44.25B，EPS上调，2027有加速预期。\n3/ $RTX：backlog创纪录3400亿（国防1640/商业1760），Q3新awards超810亿（国防近590亿）；Raytheon销售+14%至约80亿，Patriot/SM/Tomahawk驱动。2026 adj EPS上调至7.65-7.75，销售970-975亿。\n4/ $GD：backlog创纪录2203亿，estimated contract value 2707亿；Q3订单988亿，整体b2b 6.8x、国防8.5x。Columbia-class 5艘约295亿、Virginia Block VI 9艘约421亿。2026 EPS 17.20-17.30，收入565-568亿。\n5/ $LHX：backlog创纪录532亿，Q3订单193亿，b2b 3.2x（Missile Solutions 11.8x）；THAAD推进约63亿、PAC-3 MSE约47亿、VAMPIRE C-UAS超5亿、NGJ-LB约8.76亿。2026收入235-237亿，GAAP EPS 12.25-12.35，FCF约30亿。\n6/ $AVAV：FY27 Q1 funded backlog约14.6-15亿（+37%），bookings约6.83亿，b2b约1.4x；Switchblade/Puma/JUMP20/c-UAS。FY27收入指引21.25-22.25亿，结果偏后半年。\n7/ $KTOS：总backlog 20.84亿（funded 15.72亿），Q2 b2b 1.1x、LTM 1.3x；无人系统/高超音速/Spartan J85/Valkyrie，pipeline约150亿。FY26收入17.5-18.1亿。\n8/ $PLTR：RPO约49亿；Maven Smart System为program of record，Army TITAN约1.27亿，NGC2/Enterprise潜在最高约100亿。国防数字化+自主系统软件层。\n9/ $ONDS：pro forma backlog约7.57亿；6/30后订单超2.7亿（8月下旬-10月初超1.65亿）；ULTRA/ const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
