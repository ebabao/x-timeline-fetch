<head>

<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

秘鲁总统藤森惠子呼吁中国帮助应对厄尔尼诺极端天气现象的影响 o?taid=6afc26d838c51300013dff25&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Peru’s President Keiko Fujimori appealed for help from China in coping with the fallout from the El Niño extreme weather phenomenon","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122632134896517516","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/peru-s-fujimori-appeals-to-xi-for-chinese-help-against-el-nino?taid=6afc26d838c51300013dff25&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":10,"rt":4,"rp":0,"vw":13025},{"id":"2122632109106012451","h":"xingpt","ts":1794909906,"zh":"德鲁肯米勒最新13F：AI产业利润的重新分配\n11月16日，德鲁肯米勒（Stanley Druckenmiller）旗下Duquesne Family Office公布了2026年Q3持仓，13F申报总市值为44.71亿美元，环比下降14.2%，持仓数量从95项减少至65项。\n结合最近几个季度的持仓变化、他今年的公开采访，以及11月份的美股行情，我认为他的投资思路正在发生一些比较重要的变化。\n1. 生物科技可能成为下一轮市场的主线\n很多人关注德鲁肯米勒的半导体持仓，却忽略了生物医药已经成为他最大的配置方向，占13F申报市值的四成左右。\n第一大重仓股是癌症及基因检测公司Natera（$NTRA），持仓市值13.06亿美元，占比从上季度的16.6%上升至29.2%。不过，这期间他的持仓股数实际减少了0.8%，权重提升主要来自股价上涨和其他仓位的收缩。\n此外，他还持有大量生物科技公司，包括：\n$INSM：罕见病治疗\n$RVMD：RAS靶向抗癌药\n$NAMS：心血管疾病创新药\n$BEAM：基因碱基编辑\n$RLAY：精准药物研发\n今年3月，德鲁肯米勒在接受摩根士丹利采访时，解释了自己投资生物科技的几个原因：\n一是生物科技经历了数年的低迷，存在市场领导板块切换的机会；二是行业的技术面和价格动量正在发生变化；三是生物科技可能是AI最具潜力的应用场景之一，尤其是药物研发、疾病诊断和持续监测。\n这笔交易值得重视的地方，在于将产业技术变革、行业周期和市场资金轮动结合起来。\n未来可以重点观察生物科技ETF（$XBI）相对于纳斯达克100（$QQQ）的走势。\n2. 减持AI算力，加仓HDD\nQ3德鲁肯米勒对半导体进行了大幅调仓：\n清仓AMD、Sandisk、Google。\n减持94.5%的台积电、47.9%的意法半导体。\n增持180.2%的希捷科技（$STX）。\n新建仓希捷看涨期权及西部数据（$WDC）。\n两家HDD厂商合计占其13F申报市值的9.9%（含期权对应标的市值）。\n尤其值得注意的是，他清仓了做NAND的Sandisk，同时买入了做HDD的西部数据。\n相比其他半导体细分赛道，HDD具有行业竞争格局高度集中、资本开支相对克制、供给弹性有限等特点。随着AI生成的数据量不断增长，海量数据的长期存储需求，有望转化为HDD厂商的定价能力、利润率和自由现金流增长。\n希捷10月底公布的财报也部分验证了这一逻辑，单季度自由现金流达到14.79亿美元，创历史新高。\n不过，随着AI数据中心融资环境恶化，HDD未来的需求增长也存在被下修的风险。\n3. 从AI基础设施向AI应用进行切换\nQ3德鲁肯米勒大幅增加了部分AI应用公司的配置：\n增持435.5%的Unity（$U）。\n增持42.7%的亚马逊（$AMZN）。\n新建仓AppLovin（$APP）。\n新建仓Palantir（$PLTR）。\n其中Unity和AppLovin这组交易尤其值得关注，两家公司都能通过AI算法提高广告投放效率，并将技术进步直接转化为收入和利润。\n最新财报显示，Unity的AI广告平台Vector收入同比增长126%，AppLovin营收同比增长55%，净利润增长72%。\n过去几年，AI产业的超额利润主要集中在上游算力厂商。但随着模型能力提升、推理成本下降以及竞争加剧，超额利润可能逐渐向具有用户、数据和商业化优势的下游应用公司转移。\n相比需要投入巨额资本开支的云厂商，部分AI应用公司具有更好的资本回报率和利润增长潜力。\n4. 宏观层面：警惕资本稀缺和AI融资风险\n9月10日，据《金融时报》报道，德鲁肯米勒认为，考虑到美国经济、资本开支热潮以及对资本的争夺，即便当时美债收益率已经明显上升，利率可能依然偏低。\n据11月16日《华尔街日报》报道，德鲁肯米勒近期与Paul Tudor Jones在一场闭门会议上就AI泡沫展开辩论。\n他表达了几个重要观点：\nAI是历史上规模最大的技术变革之一。\n其家族办公室已经削减AI相关投资敞口。\n英伟达目前正在获取超常水平的利润（overearning），未来利润率可能下降，竞争对手也会获得更多市场份额。\n资本市场未必愿意为计划中的大规模AI数据中心建设提供足够资金。\n最后一点尤其重要。\n美国政府财政赤字、Hyperscaler资本开支、Neocloud债务融资，都在争夺有限的资本。资本成本的上升，可能成为制约下一阶段AI发展的重要因素。\n此外，德鲁肯米勒在Q3退出了多项宽基指数看涨期权，并同时新建仓三大黄金矿业公司Newmont（$NEM）、Barrick（$B）和Agnico Eagle（$AEM）。\n结合他此前长期看空美元、担忧美国财政可持续性的观点，这部分配置也具有一定的宏观交易属性。\n5. 结合近期行情，推测他四季度做了什么？\n如果按照9月30日披露的持仓静态计算，截至11月16日，德鲁肯米勒的正股组合累计下跌约15.3%，其中两大核心重仓Natera和希捷科技分别下跌约30%和46%。\n相比之下，Unity和AppLovin分别上涨约27%和43%。\n与此同时，美国10年期国债收益率突破5%，AI基础设施企业的信用风险显著上升。\n结合他的近期发言及一贯灵活的交易风格，我推测他在四季度可能进行了以下调整：\n一是进一步削减AI硬件敞口，特别是对数据中心建设速度高度敏感的公司；二是降低部分重仓股的集中度；三是保留部分AI应用和生物科技公司的配置；四是通过现金、短期国债或宏观对冲降低组合整体风险。\n至于加密货币，虽然他在10月29日公开确认投资了Trade[XYZ]，但其Q3加密相关上市公司持仓市值实际上环比下降了约13%。目前没有充分证据表明他正在增加加密资产的方向性多头敞口。\n总结\n我认为，德鲁肯米勒当前的投资主线，可以归纳为四个方向：\n生物科技的行业复苏与技术变革。\nAI产业链内部的利润重新分配。\n具有供给约束和定价能力的细分行业。\n资本成本上升背景下的宏观风险管理。\n过去三年，AI投资最重要的变量是需求增长。未来三年，竞争格局、资本成本、自由现金流和投资回报率可能变得更加重要。\n即使AI产业继续高速发展，产业增长与股东回报之间也可能出现显著分化。\n注：13F持仓截至9月30日，组合收益为不含期权、股息及期间调仓的静态模拟，四季度交易方向为个人推测。","en":"德鲁肯米勒最新13F：AI产业利润的重新分配\n11月16日，德鲁肯米勒（Stanley Druckenmiller）旗下Duquesne Family Office公布了2026年Q3持仓，13F申报总市值为44.71亿美元，环比下降14.2%，持仓数量从95项减少至65项。\n结合最近几个季度的持仓变化、他今年的公开采访，以及11月份的美股行情，我认为他的投资思路正在发生一些比较重要的变化。\n1. 生物科技可能成为下一轮市场的主线\n很多人关注德鲁肯米勒的半导体持仓，却忽略了生物医药已经成为他最大的配置方向，占13F申报市值的四成左右。\n第一大重仓股是癌症及基因检测公司Natera（$NTRA），持仓市值13.06亿美元，占比从上季度的16.6%上升至29.2%。不过，这期间他的持仓股数实际减少了0.8%，权重提升主要来自股价上涨和其他仓位的收缩。\n此外，他还持有大量生物科技公司，包括：\n$INSM：罕见病治疗\n$RVMD：RAS靶向抗癌药\n$NAMS：心血管疾病创新药\n$BEAM：基因碱基编辑\n$RLAY：精准药物研发\n今年3月，德鲁肯米勒在接受摩根士丹利采访时，解释了自己投资生物科技的几个原因：\n一是生物科技经历了数年的低迷，存在市场领导板块切换的机会；二是行业的技术 : Evening Briefing Asia","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122620809868919031","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-17/alibaba-z-ai-baidu-among-chinese-ai-stocks-hit-by-sweeping-us-chip-curbs?taid=6afc1c4c38c51300013dfee9&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":5,"rt":2,"rp":5,"vw":11277},{"id":"2122620049089544371","h":"fxtrader","ts":1794907030,"zh":"韩国《每日经济新闻》报道，三星电子与苹果即将签署DRAM（动态随机存取存储器）长期供应协议（LTA）。作为全球最大的消费电子产品企业，苹果是大型科技公司中唯一一家尚未与三星电子签署LTA的企业。\n据业界17日消息，三星电子与苹果正在进行最后阶段的协议磋商。该协议拟从明年上半年开始生效，期限为4至5年。\n据悉，协议还将设定DRAM供应量下限，同时根据未来市场情况最终确定价格。此次协议背后，被认为是日益严峻的存储芯片供应紧张局面。\n分析认为，为确保iPhone、MacBook等核心产品所需DRAM的稳定供应，苹果最终选择签署长期供应协议。三星电子、SK海力士和美光等三大存储芯片制造商相继与主要客户签署LTA，也对苹果产生了影响。据悉，苹果近期也已与SK海力士签署存储芯片供应长期协议，且协议条件更有利于供应商。","en":"韩国《每日经济新闻》报道，三星电子与苹果即将签署DRAM（动态随机存取存储器）长期供应协议（LTA）。作为全球最大的消费电子产品企业，苹果是大型科技公司中唯一一家尚未与三星电子签署LTA的企业。\n据业界17日消息，三星电子与苹果正在进行最后阶段的协议磋商。该协议拟从明年上半年开始生效，期限为4至5年。\n据悉，协议还将设定DRAM供应量下限，同时根据未来市场情况最终确定价格。此次协议背后，被认为是日益严峻的存储芯片供应紧张局面。\n分析认为，为确保iPhone、MacBook等核心产品所需DRAM的稳定供应，苹果最终选择签署长期供应协议。三星电子、SK海力士和美光等三大存储芯片制造商相继与主要客户签署LTA，也对苹果产生了影响。据悉，苹果近期也已与SK海力士签署存储芯片供应长期协议，且协议条件更有利于供应商。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUPqcka0AAe64P.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122620049089544371","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":0,"rp":0,"vw":4086},{"id":"2122619542530662470","h":"business","ts":1794906909,"zh":"澳大利亚政府将调查有关中国以“低于正常价值”出口结构木材产品的指控","en":"The Australian government will investigate allegations that China exported structural timber products at “less than their normal value”","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122619542530662470","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/australia-to-investigate-china-over-alleged-timber-dumping?taid=6afc1b1d38c51300013dfee5&utm_campaign=trueanthem&utm .6亿美元，形态接近缩量回踩，但20日涨幅过大，加上调查通知和期权偏空，先不选。 $Adecoagro\n$AGRO 市值约13亿美元，董事买入量太小，期权未采集，五日仍弱。\n#操作提示\n英伟达财报前不碰AI硬件。苹果是贴着前高的半仓突破单，不突破就不进，跌破失效位当天走。今晚开盘若纳指期货重新转弱，这张单继续推迟。箱底的\n$SPCX 和 $PSX 只看到企稳，不猜右侧。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"1.88%、 $XLU 涨0.75%、 $XLF\n涨0.33%还在正值，能源是典型的仅5日脉冲，20日仍跌6.06%，慎追。必选消费和公用事业是双窗口同现，但都已经贴近20日高，分别只差0.95%和0.63%。金融也是双窗口同现，力度更弱：\n$XLF 5日只涨0.33%，A股银行ETF20日涨5.77%、5日涨3.04%，今天收跌0.11%，中美都还在，只是今天没再加速。住宅建筑是仅20日：\n$ITB 20日涨9.98%，但5日跌6.06%，距20日高9.64%，属回调；A股房地产ETF20日跌8.38%，映射没有启动。半导体现状是双窗口都弱，\n$SOXX 20日跌15.59%、5日跌3.77%；A股芯片ETF今天收涨约1.1%，只是超跌反弹，20日仍跌9%左右，不构成共振。\n#三个方向\n一是 #必选消费与公用事业 ，中美双窗口同现，但美股已经走在区间上沿，只作为防守框架，不在这里追高开仓。二是 #大盘消费科技龙头 ，只认\n#苹果 这种低波动、仍靠近前高、且期权方向清楚的品种。三是 #制药 观察， $IHE\n20日涨9.01%、距20日高2.42%，量比只有0.56，等放量再跟； $CGON 这种已经放量伸展的事件票不追。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线346.64失效，半仓。\n #太空探索科技 $SPCX ，箱底，位置37%，ARK两只基金同买，但五日仍在阴跌，近端Put偏空，未见右侧，站上141.6（20日均线）放量再看，跌破周一低点135失效，仅观察。\n #菲利普斯66 $PSX ，箱底，位置37%，五日已反弹3%，Call放量但行权价过远，站上269.3（20日均线）放量再看，跌破周一低点257.18失效，仅观察。\n #Equitable控股 $EQH\n，周一收55.28，距20日高56.83差2.8%，比上周五更远，暂不够突破准备，站上56.83再看，跌破20日均线54.62失效。\n #Grid Dynamics $GDYN ，缩量回踩形态还在，但20日已涨68%，又有律所调查通知，期权偏空，不进只做，跌破本轮回踩低点13.04失效。\n #CG Oncology $CGON ，事件权重大，短线已伸展，不追高。\n#小盘阿尔法\n本期不选。 $GDYN 市值约10.6亿美元，形态接近缩量回踩，但20日涨幅过大，加上调查通知和期权偏空，先不选。 $Adecoagro\n$AGRO 市值约13亿美元，董事买入量太小，期权未采集，五日仍弱。\n#操作提示\n英伟达财报前不碰AI硬件。苹果是贴着前高的半仓突破单，不突破就不进，跌破失效位当天走。今晚开盘若纳指期货重新转弱，这张单继续推迟。箱底的\n$SPCX 和 $PSX 只看到企稳，不猜右侧。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122610484725858786","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":158},{"id":"2122610469538247089","h":"cnfinancewatch","ts":1794904746,"zh":"美股盘前下午版｜2026年11月17日 周二 北京时间15:05\n#结论\n今日大类只做两个：必选消费与公用事业的低波动防守，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置和资金共振的，只剩靠近前高的苹果；箱底的航天和炼油股还没走出右侧，医药事件票已经伸展，不进只做。\n #苹果 $AAPL 周一收352.78，跌0.98%，距20日高也是52周高360.83还有2.28%，处在近20日区间77%的位置。比上周五的1.3%远了一点，略宽于通常的2%门槛，仍按突破准备的回撤来看，不突破不进。期权最大Call行权价355，距现价只差0.36%，量仓比24.14，Call持仓增仓5.5%，三项同向偏多。卖方目标价均值345.57低于现价，近四周EPS下修16家、上修9家，只给半仓。\n明确不做：半导体和AI硬件，英伟达今晚美股盘后出换帅后第一份财报，周一收156.14，跌4.12%，处在20日区间只剩10%的位置；已经大涨或五日涨幅过大的品种；ARK同买但仍在阴跌的箱底票，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指分化。纳指期货27311，较周一结算27284涨约0.1%；标普期货7425，跌约0.2%；道指期货51489，跌约0.4%。周一纳指收24509.76，跌2.49%，已经离开10月收盘高点10%以上，重新进入技术性调整；标普7416.59，跌1.92%；道指51608.17，跌1.41%；费城半导体跌5.28%。A股今天收盘，上证3584.58跌0.50%，创业板跌1.20%，科创50收1221.19，涨0.62%，比午后低点有所回升。\n #英伟达 $NVDA 今晚盘后发布三季报，是黄仁勋辞职、原CFO克雷斯任临时CEO后的第一份财报。华尔街预期营收约1090亿美元，高于公司自身1080亿美元上下的指引，每股收益约2.47美元。有报道称黄仁勋方面在讨论回归，Yorkville的丹·艾夫斯认为回归希望不大，并下调了预期。有机构把期权隐含波动大约估在7.8%。家得宝、迪士尼今晚美股盘前出季报，明天还有零售销售数据。Anthropic计划周三定价、周四以\n$ANT 在纳斯达克挂牌，区间70到78美元，是本周AI估值的第二块试金石。WTI原油现报84.81美元，较周一再跌约1%，较上周五的88.56已经明显回落。10年期美债收益率周一收5.12%，美元指数约103.47，仍靠近近期高位。VIX周一升至22.91。\n高权重事件里， #CG Oncology $CGON\n公布三期PIVOT-006达到主要终点，膀胱癌复发风险下降68%，事件分最高；但周一放量收84.78，五日涨13.4%，20日涨41%，量比超过8倍，已经伸展，只看不追。\n#Powell工业 $POWL\n周一盘后公布四季度营收3.97亿美元，同比增33%，每股收益2.23美元，新订单7.10亿，积压订单升至27亿美元；周一股价已收151.20，处在20日区间59%，等回踩再看。\n#雷神技术 $RTX 积压订单升至1300亿美元，标普把信用评级上调至A-，但股价在区间中部，距20日高还有5.5%，不追。\n#研报面\n #苹果 卖方均值目标价345.57美元，买入16家、持有8家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。\n#菲利普斯66 $PSX 均值目标价299.13美元，区间258到346美元，买入6家无卖出，近四周EPS上修22家、下修2家。 #Grid\nDynamics $GDYN 均值13.75美元，4家全是买入，近四周EPS上修9家，但今天有律所发布股东调查通知，研报再好也先放一放。\n#资金面\nARK两只及以上基金同买的有三只。 #太空探索科技 $SPCX\n获ARKK与ARKW同买，合计约5190万美元，是本期金额最大的一笔；期权最大Put行权价135，距现价只差1.72%，偏空，和基金买入方向相反，不能算多头共振。\n#Block $XYZ 、 #Shopify $SHOP\n也是多基金同买，但股价分别在20日区间59%和29%，五日仍在回撤，位置不够。邮件还记了ARKQ买入 #火箭实验室 $RKLB\n约90万美元，公开交易记录未核验到；即便算上，期权最大Put行权价57贴着现价57.37，也是偏空，不算共振。\n带方向的期权里，只有 #苹果 最干净：最大Call行权价355距现价-0.36%，量仓比24.14，Call持仓增仓5.5%，三项同向。\n#菲利普斯66 最大Call量仓比4.84、Call持仓增仓1.3%，P/C成交比只有0.04，但行权价220距现价远了17%，只能记偏多、不能当贴价看涨。\n#Grid Dynamics 期权P/C成交比1.82，空单放量，没有多头共振。\n#期货\n邮件给出的持仓变化，量能口径更接近上周五：标普迷你OI增4.88万手、量比0.99，纳指迷你OI增9072手、量比1.05，价跌但量能未确认，暂不定性 n":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/kalshi-to-launch-stock-trading-moving-futher-beyond-predictions?taid=6afc11be7d7c3100018f9018&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":0,"rp":1,"vw":8872},{"id":"2122608515537895841","h":"SCMPNews","ts":1794904280,"zh":"分析人士称，美国嘉手纳空军基地获得了F-15EX战斗机，但对中国来说没有优势","en":"US airbase Kadena gets F-15EX fighters but no upper hand against China, analysts say","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122608515537895841","l":["sc.mp"],"ln":[{"u":"https://sc.mp/ak8up","d":"sc.mp"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":1086},{"id":"2122608242698211742","h":"ReutersChina","ts":1794904215,"zh":"巴布亚新几内亚总理詹姆斯·马拉佩周二告诉中国国家主席习近平，关闭台湾驻巴布亚新几内亚办事处“并不容易”，并承认他在这样做时面临国内挑战。","en":"Papua New Guinea's Prime Minister James Marape told Chinese President Xi Jinping on Tuesday that it \"wasn't easy\" to close Taiwan's office in his country, acknowledging he faced domestic challenges in doing so.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122608242698211742","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/papua-new-guineas-prime-minister-says-taiwan-does-not-operate-there-anymore-2026-11-17/?taid=6afc109738c51300013dfeba&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":401},{"id":"2122608231105065080","h":"business","ts":1794904213,"zh":"ING 计划推出自己的 ETF，以迎合市场对快速增长的投资产品的需求","en":"ING is set to introduce its own ETFs as the lender seeks to tap into demand for the fast-growing investment products","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122608231105065080","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/ing-plans-to-break-into-etfs-with-two-debut-funds-in-germany?taid=6afc1095be5ec50001f2851e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":1,"rp":1,"vw":10445},{"id":"2122607980252111077","h":"qinbafrank","ts":1794904153,"zh":"美股又多了一个能影响股票定价的资产类型，永续合约这一币市原创终于在美股登堂入室。这两天才注意到本月初11月3日，CFTC主席Michael S. Selig 正式宣布，美股个股永续合约可以在符合条件的美国交易所开始交易。这些合约被依据CFTCRegulation 40.3 视为已批准定性为《商品期货现代化法案》下的 security futures products（证券期货产品），由 CFTC 和 SEC 联合监管。\n要求交易所必须同时满足：\n1）CFTC 的DCM牌照；\n2）SEC 的 notice-registered national securities exchange备案（针对 security futures）；\n要特别注意，这是直接挂钩美股正股价格的永续期货合约，不是很多加密交易所上的代币化股票（tokenized stocks）合约。这次美股个股永续合约是CFTC/SEC 框架下的 Equity Perps ，与加密交易所上的美股代币合约是安全不同产品。前者是美国监管机构批准能直接面对美国客户的产品，前者是监管灰色地带的产物。\nKalshi 已在11月5日前后上线，覆盖约50只大型个股（如 Nvidia、SpaceX、Micron 等）。上线10天左右名义成交量已达约50亿美元，单日部分热门标的（如 Nvidia）能到上亿美元级别。Coinbase已经在准备、Backpack也计划很快上线美股个股永续合约。\n这个意义还是非常大的，之前美股只有股指期货合约，并没有个股合约而永续合约更是币市原创，大家只能玩正股和期权。现在美股个股永续合约已经被正式批准，美股又多了一个能影响定价的资产类型。\n现在加密永续已经是一个日成交数千美元、年成交几十万亿美元接近百万亿美金级别的成熟市场。从长期天花板来看，美股个股永续合约（Equity Perps）的潜力确实更大，原因很直接：\n1）底层市场规模差距巨大\n美股市值远超加密资产。传统股权衍生品（股票/指数期货和期权）本身就是万亿美元级别的成熟市场，年合约成交量以百亿张计。如果美股永续能分到传统股权衍生品的一部分流量，或吸引新的杠杆/投机需求，规模很容易超过当前的加密永续。\n2）需求场景更广泛 加密永续高度依赖加密圈内的杠杆交易文化；美股永续则可以同时吸引传统股票投资者、对冲基金、散户杠杆需求，以及希望更简单做空的用户。\n当然短期内规模还需要时间，增长不会那么迅速。毕竟也有限制：\n1）目前美国合规版本的杠杆被压得较低（大致 5–7 倍左右），远低于离岸加密永续常见的 20–100 倍。\n2）产品才刚推出，流动性还在建立阶段；\n3）加密永续已经跑了近十年，生态和用户习惯非常成熟；美股永续还需要时间积累流动性、经纪通道和用户教育。\n现在还面临法律挑战：Cboe 和 Citadel 等组成的团体已起诉 CFTC，认为其无权批准这类产品。法官初步认为原告“很可能在实体问题上胜诉”，但拒绝了紧急禁令，最终结果还不确定、还要看双方博弈的情况。\n美股个股永续如果能在监管和法律挑战中站稳，并逐步提升流动性和可接受度，中长期确实有机会成长到比当前加密永续更大的规模，但那应该是几年后的事情了。","en":"美股又多了一个能影响股票定价的资产类型，永续合约这一币市原创终于在美股登堂入室。这两天才注意到本月初11月3日，CFTC主席Michael S. Selig 正式宣布，美股个股永续合约可以在符合条件的美国交易所开始交易。这些合约被依据CFTCRegulation 40.3 视为已批准定性为《商品期货现代化法案》下的 security futures products（证券期货产品），由 CFTC 和 SEC 联合监管。\n要求交易所必须同时满足：\n1）CFTC 的DCM牌照；\n2）SEC 的 notice-registered national securities exchange备案（针对 security futures）；\n要特别注意，这是直接挂钩美股正股价格的永续期货合约，不是很多加密交易所上的代币化股票（tokenized stocks）合约。这次美股个股永续合约是CFTC/SEC 框架下的 Equity Perps ，与加密交易所上的美股代币合约是安全不同产品。前者是美国监管机构批准能直接面对美国客户的产品，前者是监管灰色地带的产物。\nKalsh 0","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":2,"rp":0,"vw":1710},{"id":"2122583054057078841","h":"business","ts":1794898210,"zh":"一系列失误导致这家拥有超过 5 亿用户的社交媒体巨头在印度受到更严格的审查后，Meta Platforms 从印度的 Instagram 上删除了更多露骨内容。 dia-scrutiny?taid=6afbf92238c51300013dfe49&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Meta Platforms removed more explicit content from Instagram in India, after a series of lapses brought the social media giant under tougher scrutiny across the country of over half a billion users.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122583054057078841","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/meta-facebook-instagran-fb-ig-cjp-social-media-removes-explicit-posts-india-scrutiny?taid=6afbf92238c51300013dfe49&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":0,"rp":1,"vw":10253},{"id":"2122581801206005825","h":"business","ts":1794897911,"zh":"唐纳德·特朗普总统将于周二会见印度、澳大利亚和日本领导人，举行非正式安全小组高层聚会，然后本周晚些时候在中国与习近平举行备受期待的会晤。","en":"President Donald Trump will meet with the leaders of India, Australia, and Japan on Tuesday for a top-level gathering of their informal security group, ahead of his highly anticipated meetings with Xi Jinping later this week in China.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122581801206005825","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/trump-quad-india-australia-japan-economic-security-talks-before-xi-meeting?taid=6afbf7f738c51300013dfe47&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":2,"rp":3,"vw":12436},{"id":"2122581167417540855","h":"yijiangren","ts":1794897760,"zh":"想像玩游戏一样做交易吗？\n大家还记得前两天的 LOL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意思多了。\n二，交易也能像玩游戏一样升级\n这是我个人最喜欢的设计。\n引入了 XP、等级、成就和 Trading Drops 机制。\n交易产生的成交量可以转化为 XP，XP 累积之后可以提升等级。\n随着参与度增加，还能获得不同稀有度的 Mystery Box。\n里面有头像框、专属名牌、称号和弹幕样式等个性化道具。\n从 Common 到 Legendary，一共有四个稀有度。\n你甚至可以通过自己的等级、头像框和称号，让其他人知道你在这个社区里的身份。\n这就有点像 MMORPG 里的角色成长系统。\n每个人都有自己的等级、装备和专属身份。\n交易之外，还多了一层收集和养成的乐趣。\n三，把交易、社交和游戏放进同一个地方\n的底层交易接入 Hyperliquid。\n它把行情、交易执行、实时聊天室、K 线弹幕和游戏化奖励融合在一个界面里。\n这意味着你不需要在行情软件、X、Telegram 和 DEX 之间反复切换。\n看行情、讨论市场、观察其他人的观点，以及执行交易，都可以在同一个地方完成。\n这也是它和传统 DEX 最明显的差异。\n传统 DEX 更像一个交易终端， 则试图把它变成一个有社区、有互动、有成长体系的交易空间。\n我一直认为，加密的特殊之处在于：价格由交易决定，叙事靠社区传播，情绪在社交网络里发酵。\n如果这些东西能够在同一个产品里形成闭环，用户体验自然会发生变化。\n当然，游戏化奖励只是额外体验，没必要为了刷 XP 而过度交易。\n但我确实很喜欢 的产品思路。\n交易本来就可以很有趣。\n一个人盯盘是交易，一群人一起看市场、讨论行情、分享观点，或许才是加密社区更有生命力的样子。\n想体验一下这种交易方式，可以去看看：\nTrade together, farm fun together.","en":"想像玩游戏一样做交易吗？\n大家还记得前两天的 LOL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意思多了。\n二，交易也能像玩游戏一样升级\n这是我个人最喜欢的设计。\n引入了 XP、等级、成就和 Trading Drops 机制。\n交易产生的成交量可以转化为 XP，XP 累积之后可以提升等级。\n随着参与度增加，还能获得不同稀有度的 Mystery Box。\n里面有头像框、专属名牌、称号和弹幕样式等个性化道具。\n从 Common 到 Legendary，一共有四个稀有度。\n你甚至可以通过自己的等级、头像框和称号，让其他人知道你在这个社区里的身份。\n这就有点像 MMORPG 里的角色成长系统。\n每个人都有自己的等级、装备和专属身份。\n交易之外，还多了一层收集和养成的乐趣。\n三，把交易、社交和游戏放进同一个地方\n的底层交易接入 Hyperliquid。\n它把行情、交易执行、实时聊天室、K 线弹幕和游戏化奖励融合在一个界面里。\n这意味着你不需要在行情软件、X、Telegram 和 DEX 之间反复切换。\n看行情、讨论市场、观察其他人的观点，以及执行交易，都可以在同一个地方完成。\n这也是它和传统 DEX 最明显的差异。\n传统 DEX 更像一个交易终端， 则试图把它变成一个有社区、有互动、有成长体系的交易空间。\n我一直认为，加密的特殊之处在于：价格由交易决定，叙事靠社区传播，情绪在社交网络里发酵。\n如果这些东西能够在同一个产品里形成闭环，用户体验自然会发生变化。\n当然，游戏化奖励只是额外体验，没必要为了刷 XP 而过度交易。\n但我确实很喜欢 的产品思路。\n交易本来就可以很有趣。\n一个人盯盘是交易，一群人一起看市场、讨论行情、分享观点，或许才是加密社区更有生命力的样子。\n想体验一下这种交易方式，可以去看看：\nTrade together, farm fun together.","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXTsDEOaMAAZFZF.jpg?name=orig","https://pbs.twimg.com/media/HXTsF4sa4AAdoqe.jpg?name=orig","https://pbs.twimg.com/media/HXTsJZ5bsAAhdoR.jpg?name=orig","https://pbs.twimg.com/media/HXTsMJeaAAAxadS.jpg?name=orig"],"u":"https://x.com/yijiangren/status/2122581167417540855","l":["Together.fun","Together.fun","Together.fun"],"ln":[{"u":"http://Together.fun","d":"Together.fun"},{"u":"http://Together.fun","d":"Together.fun"},{"u":"http://Together.fun","d":"Together.fun"}],"t":[],"lk":45,"rt":0,"rp":27,"vw":3876},{"id":"2122580762340073902","h":"SCMPNews","ts":1794897664,"zh":"特朗普权衡伊朗选择之际，美国第三艘航母抵达中东","en":"Third US aircraft carrier reaches Middle East as Trump weighs Iran options","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122580762340073902","l":["sc.mp"],"ln":[{"u":"https://sc.mp/klr4x","d":"sc.mp"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":1181},{"id":"2122580540725293377","h":"business","ts":1794897611,"zh":"苏黎世保险集团表示，由于今年早些时候收购的专业保险公司 Beazley 的整合，预计中期收入每年将增加约 15 亿美元。","en":"Zurich Insurance Group said it now expects increased revenue of around $1.5 billion per year in the medium term as a result of the integration of Beazley, the specialty insurer it bought earlier this year.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/21225805407 tter","d":"bloomberg.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":7741},{"id":"2122570465587634213","h":"business","ts":1794895209,"zh":"法国工会和学生团体正计划周二再举行一天的罢工和抗议活动，以测试近几周来多次造成破坏的运动的势头。","en":"French unions and student groups are planning another day of strikes and protests on Tuesday, testing the momentum of a movement that has brought repeated disruption in recent weeks.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122570465587634213","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/france-braces-strikes-and-protests-unions-student-groups-cost-of-living?taid=6afbed69b1a19900018e3b18&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":0,"rp":0,"vw":8539},{"id":"2122570437024678229","h":"bbcchinese","ts":1794895202,"zh":"周一（11月16日）晚间，台北101外墙打灯声援辉达创办人黄仁勋。此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","en":"周一（11月16日）晚间，台北101外墙打灯声援辉达创办人黄仁勋。此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122554344130363392/vid/avc1/720x1280/yfIQvXLptTLEoPrY.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2122570437024678229","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":2,"vw":1559},{"id":"2122569336527458788","h":"cnfinancewatch","ts":1794894939,"zh":"超跌反弹会很快，所以这里仍然是“等结果”，不是单边看空到底。本周另一只靴子是Anthropic，计划18日定价、19日上市。\n二、短剧和高位题材的亏钱效应，今天已经从提示变成价格。已核实：文投控股开盘即靠近跌停，报3.37元，跌9.89%，盘中最高只到3.57元，午后仍封死跌停；浙文影业跌10.08%，大晟文化跌10.00%，慈文传媒跌近10%。这是对16日风险提示的兑现——前三季度营收1.80亿元、净亏3754.58万元，AI漫剧收入约占2.57%，并提示可能被实施退市风险警示。高位股同样在兑现：闽发铝业午间邮件记为12天7板后跌停（连板天数未逐日复核），大东方跌停，日出东方深跌。对短线交易者，这意味着亏钱效应正在从光模块扩散到连板；对还想接力“羊字辈”、广百、华东重机的人，赔率已经不好看。\n三、外部风险偏好没有转暖，银行红利今天也不是无脑避风港。已核实：港股恒生指数午间收报23571.61点，跌0.77%，恒生科技跌0.46%，科网股普遍调整，哔哩哔哩、百度跌幅靠前，华虹宏力则涨超9%。亚洲股市同步偏弱，FXStreet在北京时间13:01前后称，日经225跌约1.18%、报58960点附近，韩国KOSPI跌约1.79%、接近5000点；我们早间还记录到KOSPI盘中一度跌破5000点。银行板块午间走弱，银行ETF鹏华半日跌0.96%，新浪基金转述其重仓股里工商银行午间跌1.10%；13:28前后工商银行约跌0.33%，只是跌幅收窄，并没有重新走强。黄金、原油隔夜已明显走弱，美元走强的压力还在。邮件转述美联储官员倾向缓慢加息、部分机构喊出连续加息，未逐条核实原话，只作为外部约束的背景。银行和红利可以继续当作底仓，但昨天创历史新高之后，今天更适合看回踩，不适合把防御做成追高。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"超跌反弹会很快，所以这里仍然是“等结果”，不是单边看空到底。本周另一只靴子是Anthropic，计划18日定价、19日上市。\n二、短剧和高位题材的亏钱效应，今天已经从提示变成价格。已核实：文投控股开盘即靠近跌停，报3.37元，跌9.89%，盘中最高只到3.57元，午后仍封死跌停；浙文影业跌10.08%，大晟文化跌10.00%，慈文传媒跌近10%。这是对16日风险提示的兑现——前三季度营收1.80亿元、净亏3754.58万元，AI漫剧收入约占2.57%，并提示可能被实施退市风险警示。高位股同样在兑现：闽发铝业午间邮件记为12天7板后跌停（连板天数未逐日复核），大东方跌停，日出东方深跌。对短线交易者，这意味着亏钱效应正在从光模块扩散到连板；对还想接力“羊字辈”、广百、华东重机的人，赔率已经不好看。\n三、外部风险偏好没有转暖，银行红利今天也不是无脑避风港。已核实：港股恒生指数午间收报23571.61点，跌0.77%，恒生科技跌0.46%，科网股普遍调整，哔哩哔哩、百度跌幅靠前，华虹宏力则涨超9%。亚洲股市同步偏弱，FXStreet在北京时间13:01前后称，日经225跌约1.18%、报58960点附近，韩国KOSPI跌约1.79%、接近5000点；我们早间还记录到KOSPI盘中一度跌破5000点。银行板块午间走弱，银行ETF鹏华半日跌0.96%，新浪基金转述其重仓股里工商银行午间跌1.10%；13:28前后工商银行约跌0.33%，只是跌幅收窄，并没有重新走强。黄金、原油隔夜已明显走弱，美元走强的压力还在。邮件转述美联储官员倾向缓慢加息、部分机构喊出连续加息，未逐条核实原话，只作为外部约束的背景。银行和红利可以继续当作底仓，但昨天创历史新高之后，今天更适合看回踩，不适合把防御做成追高。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122569336527458788","l":[],"ln":[],"t":["美联储","A股港股","原油能源","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":443},{"id":"2122569332261798273","h":"cnfinancewatch","ts":1794894938,"zh":"热点财经新闻综述｜2026-11-17·午间\n数据时点：A股以11月17日午间收盘（北京时间11:30）为主，并用13:28前后的公开行情补充午后变化；港股为午间收盘；外盘与海外消息整理截至北京时间13:30左右。本期邮箱新增两封热点财经邮件（11月17日早间08:10版、午间13:10版），均在垃圾邮件中。凡标“邮件转述”的内容未逐条核实，其余已对照新华财经、中新经纬、每日经济新闻、证券时报、澎湃、公开行情及已披露公司文件。\n今日判断\n今天上午的剧本，几乎是昨天的镜像。指数低开后翻红，半导体和光刻机把昨天的杀跌往回修，银行和短剧则在吐出涨幅。已核实：截至午间收盘，上证报3602.07点，微跌0.01%；深证成指报10764.88点，涨0.69%；创业板指报2336.80点，涨0.72%；科创50报1253.91点，涨3.31%，早盘一度跌超1%。北证50涨2.44%，报857.01点。新华财经称沪深半日成交约8946亿元，较上一交易日半日缩量59亿元；中新经纬则写半日成交约9010亿元、超3500只个股上涨。金融界统计，截至12:30两市约42只涨停。\n但这不是风格已经切回来了。光模块并没有跟上半导体的反弹，英伟达还要到北京时间18日凌晨才公布黄仁勋离职后的首份财报。更直接的信号是午后开盘后反弹明显回吐：截至13:28前后，上证跌约0.26%，创业板由午间的上涨转为下跌约0.72%，科创50涨幅从3.31%收窄到约1.22%。上午的修复，更像财报前的超跌反弹，叠加上国产替代交易，不是可以追高的趋势反转。短剧这边，昨天提示的风险今天兑现了——文投控股、浙文影业、大晟文化跌停，慈文传媒接近跌停。\n三大利多方向（由强到弱）\n一、半导体设备材料与晶圆代工的国产替代，是今天最强的主线，但要把它和光模块分开看。已核实：午间中芯国际、华虹宏力大幅上扬，午间邮件记为分别涨7.43%、11.59%；有研新材、伟测科技涨停，联合化学、国林科技触及20%涨停。新华财经称半导体、光刻机、消费电子、OLED等居前。逻辑上有三条，但要分清新旧：中芯国际三季度营收31.90亿美元、同比增33.9%、环比增6.1%，产能利用率由二季度的93.7%升至97.3%，毛利率29.9%，这是11月12日前后已披露的业绩，不是今天的新财报，四季度指引还略有回落；每日经济新闻提到，上海微电子新一代光刻机日前亮相，称国产前道干式光刻机已在国内量产线运行；另据港股报道，美国商务部16日出台临时规定，限制部分国家通过远程方式访问先进人工智能芯片和服务器，强化了国产算力替代的交易情绪。对谁有影响：晶圆代工、光刻机和电子化学品今天接到了钱；中际旭创、新易盛、东山精密没有一起涨——午间邮件记为分别跌2.93%、3.79%、3.99%，公开行情还显示中际旭创盘中低见385元、跌破400元。投资含义是：今天强的是“国产替代和超跌修复”，不是“全球算力链已经翻多”。制约很硬：英伟达财报今晚落地，午后科创50已经在吐出涨幅，财报前不宜把反弹当成新主线去追。\n二、家电和部分必选消费，资金仍在，但龙头已经走到情绪极限。已核实：九阳股份早盘最低25.79元、触及跌停，随后拉升至31.52元涨停，振幅20%，成交超过34亿元，证券时报e公司报道封单超过13万手，走出“地天板”。阳光照明同步涨停，澎湃称继续引领所谓“羊字辈”炒作；长虹美菱、小熊电器走出2连板，北鼎股份涨超15%，美的集团午后仍小幅上涨。这和昨天的逻辑是连续的：科技股出清时，资金去买有出口和内销故事的家电。但九阳自9月28日以来累计涨幅超230%（证券时报口径；每日经济新闻若从8月底起算则写约294%），此前异常波动公告已说明参股机器人相关公司属财务性投资、对当期营收和利润无重大影响。地天板是情绪交易的极致，不是基本面突变。制约：高位股的赔率已经变差，若半导体午后继续回流，家电的接力资金会被抽走。\n三、流动性和个别政策是托底，不是今天的交易主线。已核实：央行17日开展7140亿元隔夜逆回购，利率1.25%，当日有4600亿元逆回购到期，Wind口径单日净投放2540亿元。商务部等9部门发布意见，推动新能源汽车“车电一体报废”回收拆解，这是中期政策线索。华为算力方向也有局部高潮，华胜天成涨停、走出3天2板，真视通、嘉环科技涨停，拓维信息跟涨。这些能解释为什么下跌之后仍有活钱，但连板股波动加大，广百股份4连板、华东重机3连板，已经是短线博弈而不是配置。邮件转述的“11月16日股票型ETF净申购216亿元、融资余额减少214.1亿元”，是上一交易日的资金数据，不宜写成今日增量。\n三大利空方向（由强到弱）\n一、英伟达财报与管理层真空，仍是本周最硬的空头约束。已核实：公司将于美西时间11月17日13:20、也就是美东16:20左右、北京时间18日凌晨5:20前后公布2027财年第三季度业绩，这是首席财务官科莱特·克雷斯以临时CEO身份主持的首份财报。董事会知情人士向CNBC等表示，暂不考虑让黄仁勋回归，当前重点仍是相关调查。周一英伟达跌4.12%，收156.14美元，纳指跌2.49%。今天A股半导体能反弹，恰恰说明有资金在抢国产替代和超跌，但光模块没有跟上，说明全球算力链的风险并没有被消化。制约的另一面是：若指引稳住，","en":"热点财经新闻综述｜2026-11-17·午间\n数据时点：A股以11月17日午间收盘（北京时间11:30）为主，并用13:28前后的公开行情补充午后变化；港股为午间收盘；外盘与海外消息整理截至北京时间13:30左右。本期邮箱新增两封热点财经邮件（11月17日早间08:10版、午间13:10版），均在垃圾邮件中。凡标“邮件转述”的内容未逐条核实，其余已对照新华财经、中新经纬、每日经济新闻、证券时报、澎湃、公开行情及已披露公司文件。\n今日判断\n今天 2122513833457557740","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/chip-stocks-slide-as-us-sets-new-curbs-on-china-s-compute-access?taid=6afbb8aada07f00001ffa565&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":9,"rt":5,"rp":1,"vw":13168},{"id":"2122512993993052324","h":"cnfinancewatch","ts":1794881506,"zh":"国内：都看见了杀跌，但仍有人在短剧里找接力\n周一收盘后，韭研公社置顶仍是长韭杯实盘大赛、站规和“打击吹票等不良行为”专帖。往下翻，讨论几乎围着同一张K线：创业板跌4.37%，银行、保险、家电逆势走强，算力硬件被砸。\n第一类是复盘和情绪宣泄。15:41有帖《2026年11月16日连板个股复盘》，摘要写沪深下跌家数多、创业板跌4.37%，防御方向走强，并点到美的、九阳。17:09的涨停点评帖称超4400只下跌、33涨停、63跌停，资金躲进银行家电，算力硬件与高位股退潮——涨跌停和下跌家数是社区口径，我们未逐一核对官方统计。21:18《晚间A股值得关注的资讯》更直白，摘要写“今天，市场跌的大家都找不到北”，并提到北纬科技连板、九阳与小家电走强，资金“高低切”至固态电池。这是社区里对亏钱效应最直接的表述。\n第二类是短剧和家电，仍被当成“接得住的主线”。热门帖讨论文投控股、AI影视传媒、红果OTT大屏和牌照逻辑，还有帖子问“社零只涨0.4%，资金为什么拼命抢这三条消费线”，摘要称美的创历史新高。最新发布里，11月17日0:07已有帖讨论“九阳13天8板疯涨，谁最有资格接棒”，并引申到“阳”字辈补涨——这是作者自己的连板统计和映射，未见公司或交易所口径，不当作已核实事实。华为云16日发布并开源昇腾原生具身世界模型CloudRobo-WM1.2，也被多篇资讯帖带到，但可见摘要里会后合作细节并不多，热度低于上一交易日发布会之前。\n第三类是风险提示还没成为主流话题。22:44的市场精华汇总摘要提到金科股份、山鹰国际的退市风险提示，关联标注里出现了文投控股，但首页未见专门拆解文投控股退市风险警示的热帖。社区仍在讨论AI漫剧用户扩张和影院渠道，对“收入只占2.57%、前三季度亏损”的公告，消化明显慢于对涨停本身的讨论。\n与券商口径的异同：相同点是都承认16日是一次干脆的风格切换，银行家电是避风港，CPO是杀跌中心。不同点是社区把短剧、九阳补涨和固态电池高低切当成“明天还能做”的方向，而公开公告已经给文投控股标上了退市风险警示；海外董事会口径也不支持把黄仁勋回归写成利多。被忽略的风险有三：一是文投这类高位连板票热度还在、基本面已经揭底，开盘若再接力，亏钱效应可能从光模块扩散到短剧；二是“阳”字辈、OTT牌照这类补涨映射，证伪成本很低；三是今早虽有帖子同步了纳指跌2.49%、费半跌逾5%，但对英伟达财报和董事会调查的讨论仍然偏少，容易把隔夜大跌理解成“又一个低吸点”。","en":"国内：都看见了杀跌，但仍有人在短剧里找接力\n周一收盘后，韭研公社置顶仍是长韭杯实盘大赛、站规和“打击吹票等不良行为”专帖。往下翻，讨论几乎围着同一张K线：创业板跌4.37%，银行、保险、家电逆势走强，算力硬件被砸。\n第一类是复盘和情绪宣泄。15:41有帖《2026年11月16日连板个股复盘》，摘要写沪深下跌家数多、创业板跌4.37%，防御方向走强，并点到美的、九阳。17:09的涨停点评帖称超4400只下跌、33涨停、63跌停，资金躲进银行家电，算力硬件与高位股退潮——涨跌停和下跌家数是社区口径，我们未逐一核对官方统计。21:18《晚间A股值得关注的资讯》更直白，摘要写“今天，市场跌的大家都找不到北”，并提到北纬科技连板、九阳与小家电走强，资金“高低切”至固态电池。这是社区里对亏钱效应最直接的表述。\n第二类是短剧和家电，仍被当成“接得住的主线”。热门帖讨论文投控股、AI影视传媒、红果OTT大屏和牌照逻辑，还有帖子问“社零只涨0.4%，资金为什么拼命抢这三条消费线”，摘要称美的创历史新高。最新发布里，11月17日0:07已有帖讨论“九阳13天8板疯涨，谁最有资格接棒”，并引申到“阳”字辈补涨——这是作者自己的连板统计和映射，未见公司或交易所口径，不当作已核实事实。华为云16日发布并开源昇腾原生具身世界模型CloudRobo-WM1.2，也被多篇资讯帖带到，但可见摘要里会后合作细节并不多，热度低于上一交易日发布会之前。\n第三类是风险提示还没成为主流话题。22:44的市场精华汇总摘要提到金科股份、山鹰国际的退市风险提示，关联标注里出现了文投控股，但首页未见专门拆解文投控股退市风险警示的热帖。社区仍在讨论AI漫剧用户扩张和影院渠道，对“收入只占2.57%、前三季度亏损”的公告，消化明显慢于对涨停本身的讨论。\n与券商口径的异同：相同点是都承认16日是一次干脆的风格切换，银行家电是避风港，CPO是杀跌中心。不同点是社区把短剧、九阳补涨和固态电池高低切当成“明天还能做”的方向，而公开公告已经给文投控股标上了退市风险警示；海外董事会口径也不支持把黄仁勋回归写成利多。被忽略的风险有三：一是文投这类高位连板票热度还在、基本面已经揭底，开盘若再接力，亏钱效应可能从光模块扩散到短剧；二是“阳”字辈、OTT牌照这类补涨映射，证伪成本很低；三是今早虽有帖子同步了纳指跌2.49%、费半跌逾5%，但对英伟达财报和董事会调查的讨论仍然偏少，容易把隔夜大跌理解成“又一个低吸点”。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122512993993052324","l":[],"ln":[],"t":["A股港股","AI科技","财报"],"lk":0,"rt":0,"rp":2,"vw":859},{"id":"2122512990264263018","h":"cnfinancewatch","ts":1794881505,"zh":"热点财经新闻综述｜2026-11-17·早间\n数据时点：A股为11月16日收盘，美股为美东11月16日收盘；隔夜与今早消息整理截至北京时间11月17日07:50。本期邮箱新增一封热点财经邮件（11月16日晚间版），11月17日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照交易所行情、公司公告与主流媒体公开报道。\n今日判断\n周一A股已经先把风格切完了：银行保险创历史新高，算力硬件创年内新低。隔夜美股把同一条裂口又撕大了一截——纳指跌2.49%报24509.76点，标普500跌1.92%报7416.59点，道指跌1.41%报51608.17点，费城半导体跌5.28%，英伟达跌4.12%收156.14美元，光通信股Lumentum、Ciena跌超8%。今早美股期货只是略为回稳，纳指期货涨约0.2%，标普期货基本持平。英伟达将于美东11月17日盘后、也就是北京时间18日早晨公布黄仁勋辞职后的首份财报，市场共识约每股收益2.47美元、营收1091.5亿美元。真空期里，我们对今天的基调是：红利和家电可以做底仓，不抢半导体和光模块的缺口，也不去追已经连板的短剧票。\n三大利多方向（由强到弱）\n一、银行与红利，资金已经用价格确认。已核实：11月16日上证收3602.57点，跌0.87%，盘中失守3600后收回；创业板跌4.37%报2320.02点，科创50跌5.16%，上证50只跌0.30%。沪深京成交约1.49万亿元，较上一交易日缩量1729亿元。工商银行收9.05元，涨2.26%，与建设银行、南京银行、成都银行、杭州银行、江苏银行、青岛银行一起创历史新高；银行ETF华宝涨2.23%。港股同日恒生指数反涨0.49%，收23753.84点，说明外部并不是“中国资产被抛弃”，而是A股成长股在单独消化估值。增量消息还有两条：港交所16日推出首个离岸人民币债券指数，纳入305只债券、名义本金约8500亿元，平均收益率2.08%，挂钩ETF仍在筹备；国家外汇局称10月跨境资金净流入769亿美元，但9至10月月均净流入588亿美元，较8月下降6%，含节假日收支节奏，不宜写成外资大举流入。银行红利是今天相对稳的底仓，但已在历史新高附近，适合持有和回踩，不适合追高。制约：若英伟达财报好于预期，风格可能迅速切回成长。\n二、家电与必选消费，是杀跌里真正接到钱的方向。已核实：16日小家电板块居前，九阳股份收28.65元，涨7.10%；长虹美菱、华帝股份、小熊电器涨停，美的集团创历史新高。这不是主题炒作，而是科技股出清时，资金去买有出口和内销支撑的白马。家电龙头比高位短剧票更经得起波动，但它们也已经走了一段，今天若低开不多而被情绪资金抬升，不要把防御做成追高。\n三、政策托底是中期线索，不是今天的交易主线。已核实：工信部表示，对应付账款规模大、故意拉长账期或投诉较多的车企，将联合部门约谈并督促整改；中汽协同步启动对17家重点车企供应商账款的年度评估，17家是评估范围，不等于已被约谈名单。胜宏科技董事会16日通过1.5亿元至3亿元回购方案。百度三季度营收308亿元，同比下降1%，连续第六个季度下滑，但智能云基础设施收入同比增长94%至82亿元，自由现金流仍为负45.71亿元。这些对零部件现金流和AI应用叙事有帮助，但不足以对冲外部算力链波动，只作为观察项。","en":"热点财经新闻综述｜2026-11-17·早间\n数据时点：A股为11月16日收盘，美股为美东11月16日收盘；隔夜与今早消息整理截至北京时间11月17日07:50。本期邮箱新增一封热点财经邮件（11月16日晚间版），11月17日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照交易所行情、公司公告与主流媒体公开报道。\n今日判断\n周一A股已经先把风格切完了：银行保险创历史新高，算力硬件创年内新低。隔夜美股把同一条裂口又撕大了一截——纳指跌2.49%报24509.76点，标普500跌1.92%报7416.59点，道指跌1.41%报51608.17点，费城半导体跌5.28%，英伟达跌4.12%收156.14美元，光通信股Lumentum、Ciena跌超8%。今早美股期货只是略为回稳，纳指期货涨约0.2%，标普期货基本持平。英伟达将于美东11月17日盘后、也就是北京时间18日早晨公布黄仁勋辞职后的首份财报，市场共识约每股收益2.47美元、营收1091.5亿美元。真空期里，我们对今天的基调是：红利和家电可以做底仓，不抢半导体和光模块的缺口，也不去追已经连板的短剧票。\n三大利多方向（由强到弱）\n一、银行与红利，资金已经用价格确认。已核实：11月16日上证收3602.57点，跌0.87%，盘中失守3600后收回；创业板跌4.37%报2320.02点，科创50跌5.16%，上证50只跌0.30%。沪深京成交约1.49万亿元，较上一交易日缩量1729亿元。工商银行收9.05元，涨2.26%，与建设银行、南京银行、成都银行、杭州银行、江苏银行、青岛银行一起创历史新高；银行ETF华宝涨2.23%。港股同日恒生指数反涨0.49%，收23753.84点，说明外部并不是“中国资产被抛弃”，而是A股成长股在单独消化估值。增量消息还有两条：港交所16日推出首个离岸人民币债券指数，纳入305只债券、名义本金约8500亿元，平均收益率2.08%，挂钩ETF仍在筹备；国家外汇局称10月跨境资金净流入769亿美元，但9至10月月均净流入588亿美元，较8月下降6%，含节假日收支节奏，不宜写成外资大举流入。银行红利是今天相对稳的底仓，但已在历史新高附近，适合持有和回踩，不适合追高。制约：若英伟达财报好于预期，风格可能迅速切回成长。\n二、家电与必选消费，是杀跌里真正接到钱的方向。已核实：16日小家电板块居前，九阳股份收28.65元，涨7.10%；长虹美菱、华帝股份、小熊电器涨停，美的集团创历史新高。这不是主题炒作，而是科技股出清时，资金去买有出口和内销支撑的白马。家电龙头比高位短剧票更经得起波动，但它们也已经走了一段，今天若低开不多而被情绪资金抬升，不要把防御做成追高。\n三、政策托底是中期线索，不是今天的交易主线。已核实：工信部表示，对应付账款规模大、故意拉长账期或投诉较多的车企，将联合部门约谈并督促整改；中汽协同步启动对17家重点车企供应商账款的年度评估，17家是评估范围，不等于已被约谈名单。胜宏科技董事会16日通过1.5亿元至3亿元回购方案。百度三季度营收308亿元，同比下降1%，连续第六个季度下滑，但智能云基础设施收入同比增长94%至82亿元，自由现金流仍为负45.71亿元。这些对零部件现金流和AI应用叙事有帮助，但不足以对冲外部算力链波动，只作为观察项。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122512990264263018","l":[],"ln":[],"t":["美股","A股港股","汇率","AI科技","财报"],"lk":0,"rt":0,"rp":2,"vw":1581},{"id":"2122512578320454010","h":"business","ts":1794881407,"zh":"1945年在雅尔塔，三大军事强国的领导人聚集在一起，制定一个能够带来世界稳定的计划——或者密谋瓜分世界。对那次二战会议的两种解读八十年后仍然存在且活跃。","en":"At Yalta in 1945, leaders of three military powers gathered to craft a plan that would bring stability to the world – or conspired to carve it up. Both readings of that World War II meeting are still alive and well, eight decades later.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122512578320454010","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/xi-trump-putin-gets-world-worrying-about-a-great-power-stitch-up?taid=6afbb77f24f1750001f92f00&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":1,"rp":2,"vw":14171},{"id":"2122511307819647297","h":"business","ts":1794881104,"zh":"一个政府顾问小组建议英国忽视为富裕投资者推出签证途径的提议，并取消旨在吸引企业家的创新者创始人签证","en":"A government advisory panel has recommended that the UK ignore proposals to launch a visa route for wealthy investors, and scrap the Innovator Founder visa designed to attract entrepreneurs","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122511307819647297","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/uk-migration-advisers-reject-call-for-investor-visa?taid=6afbb650da07f00001ffa554&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":7356},{"id":"2122511062058549484","h":"bbcchinese","ts":1794881046,"zh":"BBC调查发现，有中国顾问公司涉嫌协助富裕移民，伪装成艺术家以虚假资料申请英国的“全球人才签证”。报导揭露，一些移民试图钻制度漏洞，透过支付高额费用予中介伪造作品集，从而冒充为自己的作品。","en":"BBC调查发现，有中国顾问公司涉嫌协助富裕移民，伪装成艺术家以虚假资料申请英国的“全球人才签证”。报导揭露，一些移民试图钻制度漏洞，透过支付高额费用予中介伪造作品集，从而冒充为自己的作品。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122511062058549484","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4t3nOFa","d":"bbc.in"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":1123},{"id":"2122510520691617801","h":"qinbafrank","ts":1794880917,"zh":"拿下CFTC的两张重磅牌照，让Backpack在加密合规层面与Coinbase站在了同一身位。看到Backpack宣布已获得CFTC批准，拿到 DCO（衍生品清算机构）进和DCM（衍生品交易所）两张牌照，意味着Backpack获得早美国合法向零售用户提供衍生品交易与清算服务的资质，正式具备了自己上市自己清算的能力，由此也正式进入全球最大的零售衍生品市场。\nBackpack的DCO牌照获批范围包括全额抵押的期货、期货期权和掉期，以及保证金期货。这意味着它可以处理带杠杆的产品，配套初始保证金、维持保证金、变动保证金和违约管理机制。DCM牌照则解决了产品能不能挂出来的问题。集齐这两张牌照后，Backpack就能够在自己的交易所上线永续合约，并在自己的清算所里完成清结算。\n对比 Coinbase，两边现在的牌照配置已经非常接近：Coinbase拥有交易所、期货经纪商和自有清算所，是目前少数跑通完整链条的平台。但Coinbase的DCO牌照范围仅限全额抵押产品，杠杆相关清算仍需依赖外部伙伴。而Backpack的清算所直接获准保证金期货这比Coinbase的DCO牌照获批范围大得多，这是少有的获准清算保证金期货（margined futures）的新清算所。\n在此之前Backpack 已经持有 FINRA 注册券商 Backpack Securities、FinCEN 货币服务业务（MSB）登记和 22 个州及华盛顿特区的汇款牌照。加上迪拜 VARA 和欧盟 MiFID II，这次 CFTC 批准补上的是美国牌照矩阵里最后、也是最难的一块：衍生品，形成了一个覆盖全球的完备的牌照矩阵，可以说Backpack几乎是要集齐加密领域几乎所有的合规牌照了。\n而且看官方的说法，下一步还要推进美股永续在美国的合约审批与SEC登记，要知道之前美股只有股指期货合约并没有个股的永续合约。美国境内真正的个股永续也是刚刚在本月初被 CFTC 以“deemed approved”的方式放开，需接受 CFTC 和 SEC 的双重监管。监管刚刚放行，Backpack就迅速跟上，加密市场永续合约现在是一个日成交数千亿美金，年成交接近百万亿美金的规模，那么美股个股永续合约市场规模未来只会更大。\n对Backpac 而言，完成DCM+SEC notice registration+具体个股永续合约的审批/认证，这意味着它从“全球平台做美股代币永续”进入“美国监管体系内自己上市、自己清算的真正美股永续”的阶段，妥妥的与Coinbase处于同一监管身位，而且如前面说到它的DCO牌照覆盖保证金期货，清算能力上甚至要更完整一些。\n之前这里","en":"拿下CFTC的两张重磅牌照，让Backpack在加密合规层面与Coinbase站在了同一身位。看到Backpack宣布已获得CFTC批准，拿到 DCO（衍生品清算机构）进和DCM（衍生品交易所）两张牌照，意味着Backpack获得早美国合法向零售用户提供衍生品交易与清算服务的资质，正式具备了自己上市自己清算的能力，由此也正式进入全球最大的零售衍生品市场。\nBackpack的DCO牌照获批范围包括全额抵押的期货、期货期权和掉期，以及保证金期货。这意味着它可以处理带杠杆的产品，配套初始保证金、维持保证金、变动保证金和违约管理机制。DCM牌照则解决了产品能不能挂出来的问题。集齐这两张牌照后，Backpack就能够在自己的交易所上线永续合约，并在自己的清算所里完成清结算。\n对比 Coinbase，两边现在的牌照配置已经非常接近：Coinbase拥有交易所、期货经纪商和自有清算所，是目前少数跑通完整链条的平台。但Coinbase的DCO牌照范围仅限全额抵押产品，杠杆相关清算仍需依赖外部伙伴。而Backpack的清算所直接获准保证金期货这比Coinbase的DCO牌照获批范围大得多，这是少有的获准清算保证金期货（margined futures）的新清算所。\n在此之前Backpack 已经持有 FINRA 注册券商 Backpack Securities、FinCEN 货币服务业务（MSB）登记和 22 个州及华盛顿特区的汇款牌照。加上迪拜 VARA 和欧盟 MiFID II，这次 CFTC 批准补上的是美国牌照矩阵里最后、也是最难的一块：衍生品，形成了一个覆盖全球的完备的牌照矩阵，可以说Backpack几乎是要集齐加密领域几乎所有的合规牌照了。\n而且看官方的说法，下一步还要推进美股永续在美国的合约审批与SEC登记，要知道之前美股只有股指期货合约并没有个股的永续合约。美国境内真正的个股永续也是刚刚在本月初被 CFTC 以“deemed approved”的方式放开，需接受 CFTC 和 SEC 的双重监管。监管刚刚放行，Backpack就迅速跟上，加密市场永续合约现在是一个日成交数千亿美金，年成交接近百万亿美金的规模，那么美股个股永续合约市场规模未来只会更大。\n对Backpac 而言，完成DCM+SEC notice registration+具体个股永续合约的审批/认证，这意味着它从“全球平台做美股代币永续”进入“美国监管体系内自己上市、自己清算的真正美股永续”的阶段，妥妥的与Coinbase处于同一监管身位，而且如前面说到 谈判研报覆盖该细分方向。\n（二）方向二基建建筑\n1、四川路桥（sh600039）\n（1）基本面一句话：四川省交通基建施工龙头，主营公路桥梁隧道工程施工。\n（2）映射与消息触发：美股基建建筑ITB 20日+9.98%，今日+2.28%量比1.36进入候选池可作短线。\n（3）K线位置：收8.97，5日+1.24%，1日+2.28%，换手0.26%，量比1.36，刚放量突破。\n（4）支撑位：近5日低点约8.70；压力位：前高约9.30。\n（5）当前位置：中枢内，距压力约3.7%。\n（6）量价：量比1.36高于1，换手0.26%极低，属放量但成交清淡，需观察持续性。\n（7）触发因素：美股基建建筑20日+9.98%映射、今日量比放大。\n（8）概率：低。依据为近一个月五大机构无研报支撑，换手极低，韩日无确认。\n（9）操盘建议：竞价高开2%到4%且量能达标可小仓试错；高开超6%不追；开盘15分钟不破8.70且回踩缩量可低吸；跌破8.70则逻辑失效；目标只看前压9.30；单票不超两成仓。\n（10）身份与依据：龙一，依据为本方向5日涨幅最大，5日+1.24%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122505930088849634","l":[],"ln":[],"t":["美股"],"lk":0,"rt":0,"rp":2,"vw":1916},{"id":"2122505627314647159","h":"cnfinancewatch","ts":1794879750,"zh":"#五大机构研报（窗口内）\n（一）中信证券，2026-11-17，架构调优中心化，OpenAI加速具身布局，核心观点为具身大脑产业进步是OpenAI调整核心动因，前沿AI实验室加速物理AI布局。\n（二）中信建投，2026-11-17，物理AI是人工智能下一波浪潮 建议聚焦优质环节，核心观点为GPT-6加速具身大脑发展，Apple、OpenAI、Meta入局，Tesla推进量产。\n（三）华泰证券，2026-11-17，内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，核心观点为10月全行业景气指数回升，必选消费与可选消费景气改善居前。\n（四）华泰证券，2026-11-17，端侧AI催化密集 看好需求扩容与电池技术升级，核心观点为模型能力向规划与动作执行延伸，带动AI眼镜、无屏穿戴及机器人硬件。\n（五）中信证券，2026-11-16，AI原生广告商业化提速，看好AI影视、AI营销及精品游戏，核心观点为AI模型成本下降，内容平台开放流量入口，AI影视供给增加。\n（六）中信证券，2026-11-16，国家医保谈判持续支持创新药 关注2027年商业化增量，核心观点为新增107种药品其中1类创新药51种，CAR-T首次纳入基本医保。\n（七）华泰证券，2026-11-16，A股策略：底部仍待夯实 配置上建议继续向质量和价值风格切换，核心观点为底部信号体系显示市场处于底部区域，但科技筹码尚未充分出清。\n（八）中信建投，2026-11-16，持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现，核心观点为模型迭代与AI商业化支撑算力需求，国产芯片订单有望转化。\n#研报互证（近一个月）\n（一）方向创新药基因：互证结论为月内强支撑。支撑研报为中信证券2026-11-16国家医保谈判持续支持创新药 关注2027年商业化增量，中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，中泰证券2026-11-12医药产业链景气延续 AI4S有望推动估值持续抬升，三家机构指向同一方向，权重上调一档。\n（二）方向基建建筑：互证结论为月内无支撑。近一个月五大机构无研报覆盖基建工程方向，权重下调；但该方向属美股去重榜第2位映射，未与榜单不符，保留观察不剔除。\n（三）方向消费：互证结论为月内强支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，华泰证券2026-11-11猪价二次探底推动产能去化再加速，两家机构指向消费与农业，权重上调一档。\n（四）个股迈瑞医疗：互证结论为月内单一支撑。支撑研报为中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，提及医疗器械经营改善，维持原权重。\n（五）个股四川路桥：互证结论为月内无支撑。近一个月五大机构无研报覆盖该个股或基建工程细分，权重下调。\n（六）个股美的集团：互证结论为月内单一支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转，提及可选消费景气改善，维持原权重。\n（七）被研报否掉的方向：AI算力软件。中信建投2026-11-16持续看好国产算力产业链，但隔夜NVDA-4.12%、纳指-2.49%，行情数据与研报观点冲突，以真实行情为准，研报观点已滞后，该方向剔除。\n（八）被研报否掉的个股：中际旭创。人气榜第2名但5日-9.53%、昨-12.28%，与中信证券2026-11-14看好中国光通信的长期发展趋势研报方向相悖于短期行情，且总市值4817亿属超大盘，剔除。\n（九）权重调整结果：创新药基因上调一档为最高权重，消费上调一档，基建建筑下调一档仅保留观察。","en":"#五大机构研报（窗口内）\n（一）中信证券，2026-11-17，架构调优中心化，OpenAI加速具身布局，核心观点为具身大脑产业进步是OpenAI调整核心动因，前沿AI实验室加速物理AI布局。\n（二）中信建投，2026-11-17，物理AI是人工智能下一波浪潮 建议聚焦优质环节，核心观点为GPT-6加速具身大脑发展，Apple、OpenAI、Meta入局，Tesla推进量产。\n（三）华泰证券，2026-11-17，内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，核心观点为10月全行业景气指数回升，必选消费与可选消费景气改善居前。\n（四）华泰证券，2026-11-17，端侧AI催化密集 看好需求扩容与电池技术升级，核心观点为模型能力向规划与动作执行延伸，带动AI眼镜、无屏穿戴及机器人硬件。\n（五）中信证券，2026-11-16，AI原生广告商业化提速，看好AI影视、AI营销及精品游戏，核心观点为AI模型成本下降，内容平台开放流量入口，AI影视供给增加。\n（六）中信证券，2026-11-16，国家医保谈判持续支持创新药 关注2027年商业化增量，核心观点为新增107种药品其中1类创新药51种，CAR-T首次纳入基本医保。\n（七）华泰证券，2026-11-16，A股策略：底部仍待夯实 配置上建议继续向质量和价值风格切换，核心观点为底部信号体系显示市场处于底部区域，但科技筹码尚未充分出清。\n（八）中信建投，2026-11-16，持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现，核心观点为模型迭代与AI商业化支撑算力需求，国产芯片订单有望转化。\n#研报互证（近一个月）\n（一）方向创新药基因：互证结论为月内强支撑。支撑研报为中信证券2026-11-16国家医保谈判持续支持创新药 关注2027年商业化增量，中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，中泰证券2026-11-12医药产业链景气延续 AI4S有望推动估值持续抬升，三家机构指向同一方向，权重上调一档。\n（二）方向基建建筑：互证结论为月内无支撑。近一个月五大机构无研报覆盖基建工程方向，权重下调；但该方向属美股去重榜第2位映射，未与榜单不符，保留观察不剔除。\n（三）方向消费：互证结论为月内强支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，华泰证券2026-11-11猪价二次探底推动产能去化再加速，两家机构指向消费与农业，权重上调一档。\n（四）个股迈瑞医疗：互证结论为月内单一支撑。支撑研报为中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，提及医疗器械经营改善，维持原权重。\n（五）个股四川路桥：互证结论为月内无支撑。近一个月五大机构无研报覆盖该个股或基建工程细分，权重下调。\n（六）个股美的集团：互证结论为月内单一支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转，提及可选消费景气改善，维持原权重。\n（七）被研报否掉的方向：AI算力软件。中信建投2026-11-16持续看好国产算力产业链，但隔夜NVDA-4.12%、纳指-2.49%，行情数据与研报观点冲突，以真实行情为准，研报观点已滞后，该方向剔除。\n（八）被研报否掉的个股：中际旭创。人气榜第2名但5日-9.53%、昨-12.28%，与中信证券2026-11-14看好中国光通信的长期发展趋势研报方向相悖于短期行情，且总市值4817亿属超大盘，剔除。\n（九）权重调整结果：创新药基因上调一档为最高权重，消费上调一档，基建建筑下调一档仅保留观察。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122505627314647159","l":[],"ln":[],"t":["美股","AI科技"],"lk":2,"rt":0,"rp":4,"vw":14 he Nvidia scandal. @parmy and @BTLipschultz join @sarahsholder on the Big Take podcast to explain. Listen to the Big Take podcast at","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2122477750141222913/vid/avc1/1080x1920/0LCZnrh30KnNd2io.mp4?tag=16"],"u":"https://x.com/business/status/2122477797457174625","l":["bit.ly"],"ln":[{"u":"http://bit.ly/4rPgAEc","d":"bit.ly"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":6357},{"id":"2122477672509100265","h":"qinbafrank","ts":1794873085,"zh":"BIS（美国商务部工业与安全局）出台远程算力访问新规，远程算力套利窗口正在关闭。先看新规要点：1）远程访问管制全球任何地区的数据中心中国公司及子公司提供超过1,200万TPP的算力（约相当于750张H100/H200量级，或约300张左右B200，具体视计算方式而定），相关先进计算芯片及服务器的出口、再出口和境内转移就需许可。许可逐案审批。\n2）规则发布前已在提供大规模算力的数据中心，若要继续服务，须在生效后90天内取得许可，否则面临后续出口限制。\n3）有限豁免：仅用于商业推荐系统（电商、社交媒体排名等，不生成文本/图像/音视频/软件）可豁免但须报备；生成式AI系统即使兼有推荐功能也不豁免。\n4）新增五国许可：向印尼、马来西亚、新加坡、泰国、巴西出口/再出口/境内转移先进计算芯片均须许可（商务部长可增列其他国家）。美国总部公司可免许可但须月报。审查时会考虑目的国出口管制有效性及执法合作。\n前两天《谁在“倒黄”》这篇长文聊到“境外云算力”越来越受限正在成为现实，\n这两年中国头部公司（阿里、字节/抖音、腾讯等）大量通过马来西亚、新加坡、印尼、泰国等东南亚数据中心租用H100/H200/Blackwell算力进行训练。之前头部大模型公司把东南亚数据中心当作“准国内算力”使用，这次规则把这个主要workaround系统性地纳入许可。对需要十万卡级别训练的模型来说，这是成本、可用性和确定性的同步恶化。\n远程先进算力通道被实质性收紧，会提高中国模型厂商训练的成本和难度，拖慢与美国前沿的追赶速度。\n可以说美国正在试图封堵中国AI追赶过程中几乎所有重要的外部途径：\n芯片管制更严格、\n远程算力通道被压缩、前沿模型的反蒸馏措施越来越严格。\n这算不算中国模型的“艰难时刻”？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"BIS（美国商务部工业与安全局）出台远程算力访问新规，远程算力套利窗口正在关闭。先看新规要点：1）远程访问管制全球任何地区的数据中心中国公司及子公司提供超过1,200万TPP的算力（约相当于750张H100/H200量级，或约300张左右B200，具体视计算方式而定），相关先进计算芯片及服务器的出口、再出口和境内转移就需许可。许可逐案审批。\n2）规则发布前已在提供大规模算力的数据中心，若要继续服务，须在生效后90天内取得许可，否则面临后续出口限制。\n3）有限豁免：仅用于商业推荐系统（电商、社交媒体排名等，不生成文本/图像/音视频/软件）可豁免但须报备；生成式AI系统即使兼有推荐功能也不豁免。\n4）新增五国许可：向印尼、马来西亚、新加坡、泰国、巴西出口/再出口/境内转移先进计算芯片均须许可（商务部长可增列其他国家）。美国总部公司可免许可但须月报。审查时会考虑目的国出口管制有效性及执法合作。\n前两天《谁在“倒黄”》这篇长文聊到“境外云算力”越来越受限正在成为现实，\n这两年中国头部公司（阿里、字节/抖音、腾讯等）大量通过马来西亚、新加坡、印尼、泰国等东南亚数据中心租用H100/H200/Blackwell算力进行训练。之前头部大模型公司把东南亚数据中心当作“准国内算力”使用，这次规则把这个主要workaround系统性地纳入许可。对需要十万卡级别训练的模型来说，这是成本、可用性和确定性的同步恶化。\n远程先进算力通道被实质性收紧，会提高中国模型厂商训练的成本和难度，拖慢与美国前沿的追赶速度。\n可以说美国正在试图封堵中国AI追赶过程中几乎所有重要的外部途径：\n芯片管 nkruptcy-fears?taid=6afb851671866900015ded27&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["原油能源"],"lk":1,"rt":0,"rp":3,"vw":12615},{"id":"2122457329413337314","h":"Balder13946731","ts":1794868235,"zh":"【美股复盘 · 11月16日】\n**大市**\n美股三大指数全线下跌，科技股领跌。标普500 ETF（ $SPY ）收于 739.96，跌 1.91%。纳指100 ETF（QQQ）收于 661.75，跌 2.67%，跌幅居主要指数之首。道指 ETF（DIA）收于 515.68，跌 1.43%。罗素2000 ETF（IWM）收于 272.95，跌 1.65%。市场普遍走弱，107 只观察股中仅 12 只上涨，95 只下跌。反向杠杆 ETF 涨幅居前：SOXS 涨 16.35%，SQQQ 涨 8.10%，SPXU 涨 5.73%。半导体做空工具涨幅最大，说明抛压主要集中在芯片板块。\n**板块**\n光模块与互联板块跌幅居前。AAOI 跌 9.48%，LITE 跌 8.48%，CRDO 跌 8.21%，CIEN 跌 8.19%。量子计算板块同步大跌，QBTS 跌 9.31%，IONQ 跌 8.41%。算力与存储相关个股同样承压，IREN 跌 9.80%，SNDK 跌 8.58%，半导体测试设备股 AEHR 跌 10.53%。ASTS 跌 12.33%，在观察股中跌幅最大。\n防御板块相对抗跌。UNH 涨 1.12%，MCD 涨 0.99%，COST 涨 0.68%，WMT 涨 0.25%。软件股中 APP 涨 1.50%，ADBE 涨 1.20%。UBER 涨 0.43%。\n**焦点**\n据报道，美国商务部计划封堵 AI 算力出口的「第三国」漏洞。此前，中国公司无需直接采购芯片，可以通过租用东南亚数据中心的英伟达算力获取资源，这一渠道将被关闭。英伟达在马来西亚、新加坡等地的客户收入中，有多少实际来自转道而来的中国需求，成为市场重新评估的问题。消息出现在 AI 硬件产业链普遍下跌的交易日，光模块、互联和算力租赁个股跌幅集中。\n**小结**\n本日市场呈现明显的风险偏好收缩。资金撤离高估值的 AI 硬件和题材股，转向医疗、必需消费等防御板块。市宽为 12 涨 95 跌，下跌范围很广。后续需关注出口管制细则的落地进度，以及 AI 硬件板块能否企稳。\n---\n说明：\n- 今天的行情数据中没有英伟达的涨跌幅，所以焦点段只写了出口管制这件事本身，没有写英伟达今天的价格或涨跌。帖子里「2025年7月以来最低收盘」的说法也没有引用。\n- 这次没有提供【财报】名单，所以文中没有用财报解释任何个股的涨跌。\n- 个股只有涨跌幅、没有收盘价，所以「收于 X」的写法只用在四个指数上。\n- 其余几个备选角度（OpenAI Mercury、新台币与寿险、挪威主权基金、美光与海力士）和今天的行情关系不大，没有用进复盘。","en":"【美股复盘 · 11月16日】\n**大市**\n美股三大指数全线下跌，科技股领跌。标普500 ETF（ $SPY ）收于 739.96，跌 1.91%。纳指100 ETF（QQQ）收于 661.75，跌 2.67%，跌幅居主要指数之首。道指 ETF（DIA）收于 515.68，跌 1.43%。罗素2000 ETF（IWM）收于 272.95，跌 1.65%。市场普遍走弱，107 只观察股中仅 12 只上涨，95 只下跌。反向杠杆 ETF 涨幅居前：SOXS 涨 16.35%，SQQQ 涨 8.10%，SPXU 涨 5.73%。半导体做空工具涨幅最大，说明抛压主要集中在芯片板块。\n**板块**\n光模块与互联板块跌幅居前。AAOI 跌 9.48%，LITE 跌 8.48%，CRDO 跌 8.21%，CIEN 跌 8.19%。量子计算板块同步大跌，QBTS 跌 9.31%，IONQ 跌 8.41%。算力与存储相关个股同样承压，IREN 跌 9.80%，SNDK 跌 8.58%，半导体测试设备股 AEHR 跌 10.53%。ASTS 跌 12.33%，在观察股中跌幅最大。\n防御板块相对抗跌。UNH 涨 1.12%，MCD 涨 0.99%，COST 涨 0.68%，WMT 涨 0.25%。软件股中 APP 涨 1.50%，ADBE 涨 1.20%。UBER 涨 0.43%。\n**焦点**\ 医疗方面持续重仓NTRA、加码BEAM和RLAY，说明他还是偏好具有独立技术催化剂的成长公司。\n总结下来，他上个季度的操作逻辑就是降低部分AI芯片和半导体设备敞口，增配AI存储与应用，继续押注创新医疗，同时利用黄金矿企对冲宏观不确定性。 这是上个季度的持仓，可以参考和学习的是他上个季度投资的逻辑。","en":"传奇投资人 Stanley Druckenmiller 最新13F曝光\n根据2026年第三季度披露的持仓数据，他正在进行一轮大规模的投资组合调整。首先，最大的变化是大幅削减部分AI半导体和科技股敞口：彻底清仓谷歌（GOOGL）、AMD、ARM、闪迪（SNDK）、泛林集团（LRCX），同时大幅减持台积电（TSM）94%、Palo Alto Networks（PANW）74%、CRH（CRH）71%和礼来（LLY）69%，另外还清仓了联合航空（UAL）、达美航空（DAL）。\n但他没有全面撤离科技板块，将资金转向更有选择性的方向：亚马逊（AMZN）加仓43%、希捷（STX）加仓180%，并建立约9040万美元的STX看涨期权仓位；同时新建仓西部数据（WDC）3680万美元、AppLovin（APP）3180万美元、Palantir（PLTR）1500万美元和SpaceX（SPCX）3050万美元的相关持仓。\n医疗创新还是他的核心押注，Natera（NTRA）以约13.1亿美元稳居第一大持仓，Beam Therapeutics（BEAM）大幅加仓356%，Relay Therapeutics（RLAY）加仓144%。他还大举增持Unity（U）436%，并新建仓Somnigroup（SGI）6170万美元。他还一次性新建仓三家黄金矿企：Newmont（NEM）4390万美元、Barrick（B）4290万美元、Agnico Eagle（AEM）4230万美元，合计约1.29亿美元。\n截至第三季度末，前五大持仓依次为NTRA（13.1亿美元）、STX（3.152亿美元）、AMZN（1.925亿美元）、FOXA（1.908亿美元）和YPF（1.776亿美元），其中FOXA本季度也加仓约38%。\n我对这次调仓的理解是，Druckenmiller是在从部分估值敏感、资本开支依赖较高的科技公司撤出，转向盈利兑现、产业链结构性机会和宏观对冲。 清仓AMD、ARM、LRCX，大幅减持TSM，说明他至少在主动降低半导体周期风险。但大幅加仓STX、买入WDC和STX看涨期权，说明他没有完全放弃AI基础设施需求，仓位不大，可能是怕踏空？加仓AMZN、APP、PLTR和U，说明他愿意参与AI应用和平台公司的增长机会。他还买入三大黄金矿企，可能是在为未来的货币政策变化、通胀风险或市场波动增加防御性配置。医疗方面持续重仓NTRA、加码BEAM和RLAY，说明他还是偏好具有独立技术催化剂的成长公司。\n总结下来，他上个季度的操作逻辑就是降低部分AI芯片和半导体设备敞口，增配AI存储与应用，继续押注创新医疗，同时利用黄金矿企对冲宏观不确定性。 这是上个季度的持仓，可以参考和学习的是他上个季度投资的逻辑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ArtofSpecuycky/status/2122435641090941002","l":[],"ln":[],"t":["通胀","AI科技","黄金"],"lk":141,"rt":23,"rp":7,"vw":35400},{"id":"2122434606590787689","h":"business","ts":1794862817,"zh":"曾在特朗普总统经济顾问委员会任职的哈佛大学经济学家在一篇论文中指出，技术移民导致受过大学教育的美国工人的工资较低，尤其是在科学领域 y-finds?taid=6afb6ee1d0eea1000147c827&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Skilled immigration leads to lower wages for college-educated US workers, particularly in scientific fields, according to a paper by a Harvard University economist who served on President Trump’s Council of Economic Advisers","zh_src":"bing","lang":"e iff Macklem, who has overseen one of the most tumultuous economic periods in the Bank of Canada’s history, will leave the central bank when his seven-year term ends in June","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122380443425100153","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/tiff-macklem-to-leave-as-bank-of-canada-governor-starting-succession-race?taid=6afb3c708a00c90001227e60&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":7,"rt":2,"rp":3,"vw":9988},{"id":"2122379915643568621","h":"TraderS18","ts":1794849778,"zh":"看原视频说懂王支持黄仁勋回归其实多少是有点勉强的，感觉是想让老黄回去的人过度解读了，这也是小幅反弹后转跌的原因吧","en":"看原视频说懂王支持黄仁勋回归其实多少是有点勉强的，感觉是想让老黄回去的人过度解读了，这也是小幅反弹后转跌的原因吧","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122379657484079104/vid/avc1/1280x720/U78TP-5734P-f8-4.mp4?tag=29"],"u":"https://x.com/TraderS18/status/2122379915643568621","l":[],"ln":[],"t":[],"lk":9,"rt":0,"rp":2,"vw":20057},{"id":"2122379764522770541","h":"misaENFP","ts":1794849742,"zh":"深夜Misa又来了，聊一聊关于币圈那些没什么粉丝的小 KOL。\n最近听到一句很不舒服的谣言：Misa签约了一堆垃圾KOL。\n第一，没有那么多经费，真的垃圾的账号没有地方会要的，我这里不会，别的地方更不会。\n我的账号大部分是自然流，你像我一样17H泡在X上，你也会有正向反馈，把时间精力花在哪里哪里就逐渐开花结果，如果流量只能用钱堆出来，那么我不是一个合格的员工。\n第二点就是今天想聊的，什么时候开始，一个人在互联网上的价值，只能用用粉丝数量来衡量，没粉丝就是垃圾？\n我第一个账号从7个粉丝开端，从7到100走了很久很久，然后靠模仿短鸟老师迎来第一批对我感兴趣的人，经历了各种磨难，才一步一步走到今天，人微言轻，我缺被看见的机会，我相信你们也是。\nKOL，说白了就是网红的意思，做久了发现这里有一套非常直观的评价体系。\n粉丝多少，阅读多少，互动多少，有没有人认识你。\n这些数字当然重要，我自己做品牌，也要看数据，我很清楚传播是有商业价值的。\n但让我有点难过的是，太多人慢慢把商业价值和人的价值混为一谈了。\n我引用的这条帖子，皮神@Meichin333333 他刚认识我时，压根懒得发东西，连图都懒得自己做，让我们帮他做，通过我不懈的努力说服了他，挖掘出来一个天才，可以去看看他现在的视频质量。\n这样的列子在我的社区里数不胜数，Misa赛道代表人物@hetzerLin 也渐渐取得小结果，做视频也开始接商单了，这需要我们双向努力。\n为什么我一空下来就去“批作业”？不是我闲的没事干，是一个几十几百粉丝的小博主认真写了一篇分析，可能连被看完的机会都没有，没人看，那我来看。\n甚至有时候，粉丝少仿佛成了一种原罪。\n你表达观点，别人问你赚了多少钱。\n你分享研究，别人说你的研究有啥可参考的。\n你想争取一次合作机会，别人还没看你的内容，就已经通过主页上的数字给你定了价。\n这里面有一件事特别值得警惕：\n我们可以给流量定价，但不要习惯性地给人定价。\n这两件事是完全不同的。\n我接触过很多小 KOL，有些人白天上学上班，还有在考研的，带娃的，然后晚上回来研究行情、看数据、写内容。\n可能花了三四个小时做出来的东西，最后只有几十个阅读。\n也有人认真回复每一条评论，哪怕自己的评论区只有三五个老熟人。\n他们可能不懂怎么蹭热点，不擅长制造情绪，也没有什么资源，但这不代表他们的认真就很廉价。\n我们总喜欢讨论早期价值。\n一个项目还没有多少人关注的时候，我们愿意研究它的潜力，愿意想象它未来会发展成什么样。\n可是面对一个刚刚开始做内容的人，我们却经常只看他今天有多少粉丝。\n我们愿意给一个项目成长的时间，为什么有时候却不愿意给一个普通人成长的空间？\n我总是喜欢转发他们的帖子，我希望他们走到大家视野里，希望他们被看到，希望除了我还有赏识他们的人。\n影响力有差异，合作预算有差异，这些都很正常，很多人就是单打独斗，没有被看见，所以我来了。\n我想表达，即使你暂时没有商业价值，也不意味着你的付出不值得尊重。\n更何况，今天那些拥有几十万粉丝的人，谁没有经历过只有几十个人看自己内容的日子呢，穷途末路的时候我发p的不像我的自拍都是三四个浏览。\n我自己也做内容，所以我知道，很多时候真正让人坚持下去的，甚至不是收益。\n而是有人认真看完你写的东西，愿意和你讨论，或者告诉你一句：你这个观点让我有了新的思考，你做的很棒。\n这种被看见的感觉，真的很珍贵。\n做社区不应该只是维护一群已经有影响力的人，他们已经很厉害，一个好的社区，也应该让暂时没有影响力的人，有机会慢慢长出自己的影响力。\n我不希望这个世界最后变成一个只有大网红才有资格说话的地方。\n小账号不需要因为粉丝少而卑微。\n我们可以尊重流量，但不必崇拜流量。\n可以承认差距，但没必要把差距变成羞辱别人的理由。\n张口闭口舔狗论，那其实我更像一个舔狗，想方设法的做对大家有利的事情。\n亲爱的们，你不需要每天证明自己值得被关注，也不用因为没有流量就怀疑自己。\n认真研究过的东西不会白费，真诚建立起来的关系也不应该只用数字衡量，学会的东西都是自己的。\n粉丝数量决定了今天有多少人能听见你，但不应该决定你有没有资格开口。\n希望你以后能有很多很多粉丝。\n但在那之前，也希望你不要放弃，继续做自己。\n晚安宝贝们🌙","en":"深夜Misa又来了，聊一聊关于币圈那些没什么粉丝的小 KOL。\n最近听到一句很不舒服的谣言：Misa签约了一堆垃圾KOL。\n第一，没有那么多经费，真的垃圾的账号没有地方会要的，我这里不会，别的地方更不会。\n我的账号大部分是自然流，你像我一样17H泡在X上，你也会有正向反馈，把时间精力花在哪里哪里就逐渐开花结果，如果流量只能用钱堆出来，那么我不是一个合格的员工。\n第二点就是今天想聊的，什么时候开始，一个人在互联网上的价值，只能用用粉丝数量来衡量，没粉丝就是垃圾？\n我第一个账号从7个粉丝开端，从7到100走了很久很久，然后靠模仿短鸟老师迎来第一批对我感兴趣的人，经历了各种磨难，才一步一步走到今天，人微言轻，我缺被看见的机会，我相信你们也是。\nKOL，说白了就是网红的意思，做久了发现这里有一套非常直观的评价体系。\n粉丝多少，阅读多少，互动多少，有没有人认识你。\n这些数字当然重要，我自己做品牌，也要看数据，我很清楚传播是有商业价值的。\n但让我有点难过的是，太多人慢慢把商业价值和人的价值混为一谈了。\n我引用的这条帖子，皮神@Meichin333333 他刚认识我时，压根懒得发东西，连图都懒得自己做，让我们帮他做，通过我不懈的努力说服了他，挖掘出来一个天才，可以去看看他现在的视频质量。\n这样的列子在我的社区里数不胜数，Misa赛道代表人物@hetzerLin 也渐渐取得小结果，做视频也开始接商单了，这需要我们双向努力。\n为什么我一空下来就去“批作业”？不是我闲的没事干，是一个几十几百粉丝的小博主认真写了一篇分析，可能连被看完的机会都没有，没人看，那我来看。\n甚至有时候，粉丝少仿佛成了一种原罪。\n你表达观点，别人问你赚了多少钱。\n你分享研究，别人说你的研究有啥可参考的。\n你想争取一次合作机会，别人还没看你的内容，就已经通过主页上的数字给你定了价。\n这里面有一件事特别值得警惕：\n我们可以给流量定价，但不要习惯性地给人定价。\n这两件事是完全不同的。\n我接触过很多小 KOL，有些人白天上学上班，还有在考研的，带娃的，然后晚上回来研究行情、看数据、写内容。\n可能花了三四个小时做出来的东西，最后只有几十个阅读。\n也有人认真回复每一条评论，哪怕自己的评论区只有三五个老熟人。\n他们可能不懂怎么蹭热点，不擅长制造情绪，也没有什么资源，但这不代表他们的认真就很廉价。\n我们总喜欢讨论早期价值。\n一个项目还没有多少人关注的时候，我们愿意研究它的潜力，愿意想象它未来会发展成什么样。\n可是面对一个刚刚开始做内容的人，我们却 een light from European Union regulators today, paving the way for UniCredit’s takeover of Commerzbank.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122374189273276588","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-16/brussels-backs-takeover-of-commerzbank-by-unicredit?taid=6afb369c7186690001d7ad8a&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":8,"rt":4,"rp":0,"vw":13751},{"id":"2122374187704795426","h":"xingpt","ts":1794848412,"zh":"川子现在说了不算了，老黄重新做 CEO 这个概率非常非常小了，至少短期内不太可能了。\n即便老黄能回来做 CEO，他也不敢像之前一样继续卖卡给中国了。\n本质上，整个 AI 半导体的格局是注定要变化的，黄仁勋只是那个被推出来祭旗的旗手","en":"川子现在说了不算了，老黄重新做 CEO 这个概率非常非常小了，至少短期内不太可能了。\n即便老黄能回来做 CEO，他也不敢像之前一样继续卖卡给中国了。\n本质上，整个 AI 半导体的格局是注定要变化的，黄仁勋只是那个被推出来祭旗的旗手","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2122374187704795426","l":[],"ln":[],"t":["AI科技"],"lk":15,"rt":0,"rp":4,"vw":3656},{"id":"2122374138455110087","h":"BloombergLive","ts":1794848401,"zh":"ICYMI：“现实是美国人的价格标签已经上涨。”\n在#BloombergGreen，美国前国务卿@JohnKerry 将极端天气日益增长的成本与美国人面临的负担能力压力联系起来——从不断上升的保险风险和住房成本到从灾难中恢复所需的数十亿美元。\n#COP31 完整采访：\n⏯️","en":"ICYMI: “The reality is the price tag to Americans is already going up.”\nAt #BloombergGreen, former US Secretary of State @JohnKerry connects the growing costs of extreme weather to the affordability pressures facing Americans — from rising insurance risks and housing costs to the billions spent recovering from disasters.\nFull #COP31 interview:\n⏯️","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2122319501886693376/vid/avc1/1080x1920/6tY093heBJPodBvT.mp4?tag=16"],"u":"https://x.com/BloombergLive/status/2122374138455110087","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/48RdIhr","d":"bloom.bg"}],"t":[],"lk":1,"rt":1,"rp":0,"vw":1974},{"id":"2122373611583369454","h":"BBGEmPortugues","ts":1794848275,"zh":"J&F - J&F 第三季度净收入增长 68%，至 94 亿雷亚尔，但由于成本上升，利润下降 13%，至 13.5 亿雷亚尔\n作者：@rachelgamarski 和 @dayannesousa","en":"J&F - Receita líquida da J&F saltou 68%, para R$ 9,4 bi no 3º tri, mas o lucro caiu 13%, para R$ 1,35 bi, com alta de custos\nPor @rachelgamarski e @dayannesousa","zh_src":"bing","lang":"pt","m":[],"u":"https://x.com/BBGEmPortugues/status/2122373611583369454","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/j-f-ve-receita-disparar-mas-alta-de-custo-pesa-no-lucro?taid=6afb36137186690001d7ad70&utm_campaign=trueanthem&utm_content=brazil&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":2,"rp":2,"vw":6643},{"id":"2122373371388448791","h":"xingpt","ts":1794848218,"zh":"为什么黄仁勋必须死？\n首先我们来看一下，老黄在的时候做了什么、利好了谁。\n他最提倡开源，提倡把芯片卖到全球，特别是通过一些灰色渠道流到中国，他是睁一只眼闭一只眼的，甚至可以说是纵容了这种事情发生。\n他在位的时候，整个亚洲半导体产业链都吃饱了，特别是台湾的供应商。\n所以黄仁勋在位的时期，整个 AI 硬件和半导体的投入增加是极其巨大的。\n那为什么他必须“死”呢？\n因为美国需要把 AI 的资本开支放缓了，大家实在是没有钱买卡了。\n标普全球算过，六家大厂明年 Capex 加起来 1.3 万亿美元，自由现金流还是正的只剩微软一家。高盛估计明年还得发 4000 亿美元的投资级债。这个钱是花不下去的。\n他下台之后会怎么样？\n中国的开源模型没办法拿卡了，或者说拿卡跟蒸馏的难度会非常大，跟美国frontier lab的差距会扩大。\n美国本土的云厂商也会受益，可以减小 Capex 投入。而且没有中国开源模型在后面追，闭源模型公司也可以放缓买卡和训练，把更多算力放到更高毛利的推理上，不用再拼命赶新模型的进度。\n所以未来一年你会看到，新模型发布的节奏一定是迅速放缓的。\n另外一方面，整个半导体产业链因为老黄赚得盆满钵满，很多下游产业都在被吸血。消费电子因为服务器跟内存涨价，可以说是深受其害吧。\n还有一点跟政治相关。数据中心因为算力竞赛，不断在环保和居民空间上侵害一些人的利益，民主党看到了这个机会，在中期选举上大做文章，把参众两院都拿下了。\n所以你可以看到，老黄下台，对闭源模型大厂有好处，对微软、谷歌、亚马逊、甲骨文这些买卡的大云厂商有好处，对民主党也有好处。\n不利的是中国倒卡的二道贩子、中国的开源大模型厂商，还有靠老黄背书才拿得到融资担保的 New Clouds。\n但是老黄在台上利好的这些力量，完全没有在美国争取选票的能力和政治影响力。受损的这些大厂，都有极强的背景和游说能力。\n所以在 AI 资本开支不得不放缓的时候，老黄必须走，他也必须对此负责。不然大家都会崩盘，整个融资和负债都会出问题。\n在 AI 时代要高歌猛进、堆算力的时候，黄仁勋就是那个被捧上神坛的旗手；当 AI 因为投入过大不得不放缓的时候，黄仁勋也会是第一个被推下神坛祭旗的人。\n所以老黄必须死。","en":"为什么黄仁勋必须死？\n首先我们来看一下，老黄在的时候做了什么、利好了谁。\n他最提倡开源，提倡把芯片卖到全球，特别是通过一些灰色渠道流到中国，他是睁一只眼闭一只眼的，甚至可以说是纵容了这种事情发生。\n他在位的时候，整个亚洲半导体产业链都吃饱了，特别是台湾的供应商。\n所以黄仁勋在位的时期，整个 AI 硬件和半导体的投入增加是极其巨大的。\n那为什么他必须“死”呢？\n因为美国需要把 AI 的资本开支放缓了，大家实在是没有钱买卡了。\n标普全球算过，六家大厂明年 Capex 加起来 1.3 万亿美元，自由现金流还是正的只剩微软一家。高盛估计明年还得发 4000 亿美元的投资级债。这个钱是花不下去的。\n他下台之后会怎么样？\n中国的开源模型没办法拿卡了，或者说拿卡跟蒸馏的难度会非常大，跟美国frontier lab的差距会扩大。\n美国 颜值 是杠杆很大的事情","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQI41ObgAAtGuB.jpg?name=orig"],"u":"https://x.com/yijiangren/status/2122331253672440015","l":[],"ln":[],"t":[],"lk":27,"rt":1,"rp":2,"vw":7200},{"id":"2122330918497223003","h":"baoshu88","ts":1794838096,"zh":"美国把出海租卡的路也正式封死了。美国商务部BIS直接把通过第三国数据中心远程访问先进芯片和服务器的管制，跟物理禁运对齐。而且本规则“由财政部和国家安全委员会指导制定”。","en":"美国把出海租卡的路也正式封死了。美国商务部BIS直接把通过第三国数据中心远程访问先进芯片和服务器的管制，跟物理禁运对齐。而且本规则“由财政部和国家安全委员会指导制定”。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQIr33bgAAASSu.png?name=orig"],"u":"https://x.com/baoshu88/status/2122330918497223003","l":[],"ln":[],"t":["AI科技"],"lk":8,"rt":0,"rp":6,"vw":1728},{"id":"2122330318485201323","h":"cnfinancewatch","ts":1794837953,"zh":"这人是口语天才：\n准备揭露她：短腿小柯基，离了滤镜根本没法看，又矮又丑，又装又立。满嘴谎话，满肚子小心眼儿，还玻璃心。\n随便学一嘴，别人都很难回嘴啊！","en":"这人是口语天才：\n准备揭露她：短腿小柯基，离了滤镜根本没法看，又矮又丑，又装又立。满嘴谎话，满肚子小心眼儿，还玻璃心。\n随便学一嘴，别人都很难回嘴啊！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122330318485201323","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":960},{"id":"2122330285106680160","h":"dmjk001","ts":1794837945,"zh":"[Sun]【中金互联网】美国BIS发布AI芯片远程访问新规：海外数据中心向中国等国公司提供超1,200万TPP算力须申请许可，存量须在90天内补办\n[玫瑰]美国商务部工业与安全局（BIS）于11月15日发布暂行最终规则（IFR），规则自刊登于联邦公报之日起生效，意见征询期60天。\n[烟花]一、远程访问管制：适用于全球数据中心，存量须在90天内取得许可\n1）如知悉数据中心（含通过网络互联、共享资源的多个数据中心）向总部或最终母公司位于澳门或D:5国家组（含中国）的公司提供超过1,200万aggregate TPP的算力（约334张B200），相关先进计算芯片及服务器（ECCN 3A090、4A090等）的出口、再出口和境内转移须申请许可，适用于全球任何地区的数据中心，许可逐案审批。\n2）规则发布前已在向上述公司提供大量算力的数据中心，如需继续服务，须在规则生效后90天内取得许可，否则将面临后续出口限制；芯片持有人是否参与最初的出口交易不影响适用，数据中心转为服务上述公司视为境内转移，须取得授权。\n3）数据中心向其他客户提供算力、而该客户为上述公司训练模型或向其提供模型的，同样适用；数据中心须对客户开展尽职调查，识别是否被中国或澳门主体直接或间接持有或控制。\n4）仅用于商业推荐系统（如电商、社交媒体）的算力不受此限，但须向BIS报备；生成文本、图像、音视频、软件的AI系统，或包含此类模型的系统，即使兼有推荐功能也不在豁免范围内。\n5）BIS同时明确，现行规则一直覆盖上述公司作为采购方、或作为数据中心主要远程用户（使用超过50%算力）的交易，违规者应主动向BIS自我披露。\n[烟花]二、新增五国许可要求\n1）向印尼、马来西亚、新加坡、泰国、巴西出口、再出口或在其境内转移先进计算芯片均须申请许可，商务部长可增列其他国家；许可逐案审批，审查时考虑目的国出口管制体系的有效性及与BIS的执法合作。\n2）最终收货人或最终用户为美国总部公司（或最终母公司位于美国）的，可免于许可，但出口方须每月向BIS报告交易明细。\n[烟花]三、其他\n1）收紧对晶圆代工厂和封测厂的推定规则：位于D:1/D:4/D:5国家组或上述五国的芯片设计公司，不再能通过相关途径推翻其先进逻辑芯片属于管制物项的推定。\n2）正式废除拜登政府时期的《AI扩散规则》，取消国家分级、数据中心VEU授权及模型权重管制。\n原文详见：","en":"[Sun]【中金互联网】美国BIS发布AI芯片远程访问新规：海外数据中心向中国等国公司提供超1,200万TPP算力须申请许可，存量须在90天内补办\n[玫瑰]美国商务部工业与安全局（BIS）于11月15日发布暂行最终规则（IFR），规则自刊登于联邦公报之日起生效，意见征询期60天。\n[烟花]一、远程访问管制：适用于全球数据中心，存量须在90天内取得许可\n1）如知悉数据中心（含通过网络互联、共享资源的多个数据中心）向总部或最终母公司位于澳门或D:5国家组（含中国）的公司提供超过1,200万aggregate TPP的算力（约334张B200），相关先进计算芯片及服务器（ECCN 3A090、4A090等）的出口、再出口和境内转移须申请许可，适用于全球任何地区的数据中心，许可逐案审批。\n2）规则发布前已在向上述公司提供大量算力的数据中心，如需继续服务，须在规则生效后90天内取得许可，否则将面临后续出口限制；芯片持有人是否参与最初的出口交易不影响适用，数据中心转为服务上述公司视为境内转移，须取得授权。\n3）数据中心向其他客户提供算力、而该客户为上述公司训练模型或向其提供模型的，同样适用；数据中心须对客户开展尽职调查，识别是否被中国或澳门主体直接或间接持有或控制。\n4）仅用于商业推荐系统（如电商、社交媒体）的算力不受此限，但须向BIS报备；生成文本、图像、音视频、软件的AI系统，或包含此类模型的系统，即使兼有推荐功能也不在豁免范围内。\n5）BIS同时明确，现行规则一直覆盖上述公司作为采购方、或作为数据中心主要远程用户（使用超过50%算力）的交易，违规者应主动向BIS自我披露。\n[烟花]二、新增五国许可要求\n1）向印尼、马来西亚、新加坡、泰国、巴西出口、再出口或在其境内转移先进计算芯片均须申请许可，商务部长可增列其他国家；许可逐案审批，审查时考虑目的国出口管制体系的有效性及与BIS的执法合作。\n2）最终收货人或最终用户为美国总部公司（或最终母公司位于美国）的，可免于许可，但出口方须每月向BIS报告交易明细。\n[烟花]三、其他\n1）收紧对晶圆代工厂和封测厂的推定规则：位于D:1/D:4/D:5国家组或上述五国的芯片设计公司，不再能通过相关途径推翻其先进逻辑芯片属于管制物项的推定。\n2）正式废除拜登政府时期的《AI扩散规则》，取消国家分级、数据中心VEU授权及模型权重管制。\n原文详见：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122330285106680160","l":["bis.gov"],"ln":[{"u":"https://www.bis.gov/press-release/bis-issues-rule-addressing-remote-access-american-super-intelligence-technology","d":"bis.gov"}],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":0,"vw":1136},{"id":"2122330130743738731","h":"dmjk001","ts":1794837908,"zh":"今天，美国商务部工业与安全局（BIS）发布了一项临时最终规则（IFR）——该规则由财政部和国家安全委员会撰写并指导——以应对对先进超级智能（SI）芯片和服务器的远程访问问题。该规则旨在确保现有对敏感美国技术的访问限制无法通过涉及第三国数据中心的远程计算安排被规避。","en":"今天，美国商务部工业与安全局（BIS）发布了一项临时最终规则（IFR）——该规则由财政部和国家安全委员会撰写并指导——以应对对先进超级智能（SI）芯片和服务器的远程访问问题。该规则旨在确保现有对敏感美国技术的访问限制无法通过涉及第三国数据中心的远程计算安排被规避。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQH9DmbEAAiIov.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122330130743738731","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt 药创新，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置的，只剩贴着前高的苹果；箱底小盘还没走到右侧，高位医药和区间中部的能源股都不进只做。\n #苹果 $AAPL 上周五收356.27，距20日高也是52周高360.83只差1.3%，处在区间87%的位置，属突破准备。盘前约357.8，又近了一点。卖方目标价均值345.57低于现价，近四周EPS下修16家，只给半仓，不突破不进。\n明确不做：半导体和AI硬件，英伟达明天盘后出财报，盘前已跌到156.7附近，大约低3.8%；ARK加仓但仍在下跌通道里的小盘；已经处在高位、或者五日涨幅过大的品种。\n#消息面\n截至北京时间21时出头，美股期指比下午更弱。纳指期货27662，较上周五结算跌约1.3%；标普期货7535，跌约0.6%；道指期货基本平。\n#英伟达 $NVDA 盘前约156.7，跌约3.8%。财报是明天美股盘后，也是换帅后第一份季报。英文媒体称黄仁勋方面在讨论重返CEO，没有官方确认，先当噪音。Susquehanna维持看好、目标价275美元，预期本季好于市场，同时提示继任者和对华出口仍有变数。Anthropic计划周三定价、周四在纳斯达克以\n$ANT 挂牌，定价区间70到78美元。\n #安进 $AMGN 11月11日公布干燥综合征新药dazodalibep三期OASIZ-301达到主要终点，盘前约471，涨约1.1%。事件权重大，但股价在20日区间69%、距20日高还有3.9%，不到突破位，只观察。家得宝、迪士尼明天盘前出财报，\n#Powell工业 $POWL\n今晚美股盘后出季报，盘前已跌到136.3附近，大约低4.5%。WTI回落到88美元附近。10年期美债收益率上周五收5.15%，美元指数约103.46，靠近20日高，VIX盘前约20.6。\nA股今天已经收盘，上证3602.57，跌0.87%；创业板跌4.37%，科创50跌5.16%，半导体映射继续失效。\n#研报面\n #苹果 卖方均值目标价345.57美元，买入16家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。 #菲利普斯66\n$PSX 均值目标价299.13，近四周EPS上修22家。 #科迪亚克天然气 $KGS 均值72.55，12家全是买入。 #太平洋生物科学\n$PACB 均值2.64。 #爱德华生命科学 $EW 均值114.5，买入19家。 #安进\n目标价本轮未采集。英伟达除Susquehanna外，上周汇丰降级和集体诉讼仍在。\n#资金面\n晚间版相对下午最重要的变化，是 $PACB\n变成ARK两只基金同买：ARKK加仓930万股、ARKG加仓7.0万股。但期权最大Put行权价2.5离现价太远，Put持仓还增了20.3%，同向项只有ARK一档，不算共振。\n$SCTX 只有ARKG单基金买入约47万美元，做空余额环比升49%，也不算共振。加仓榜里还有 $ACHR 、 $BEAM 、 $CERS\n、 $RXRX ，这几只都还在20日区间下部、近5日继续跌，不是右侧。\n带方向的期权： $AAPL Put持仓减仓20.8%，贴近现价，但只有这一项，未形成共振。 $NVDA\nPut持仓增仓75.2%，偏空；最大Call行权价165距现价约1.3%、量仓比13.46，和Put增仓方向不一致，不当作多共振。\n$TSLA Call持仓减仓62%，偏空。 $AMGN Call持仓减仓5.8%，是多单离场，内部人近三个月小额净买入构不成两项同向。\n$EW 目标价和买入家数增加两项同向，算共振，但位置已经在高位。 $PSX 目标价上调和EPS上修两项同向，期权链未采集。 $KGS\n内部人买入加目标价上调两项同向，但最大Call行权价60离现价34%，期权不算。\n#期货\n上周五完整交易日，股指是多头离场：标普迷你价跌、OI减4474手，量比0.90；纳指迷你价跌、OI减4391手，量比0.93；罗素迷你同样价跌OI降。10年期美债期货价涨OI降，是空头回补。WTI价跌OI降2.35万手，多头离场；黄金、铜也是价跌OI降，多头离场。今天期价继续偏弱，但是未完成交易日，OI先不定性。股指层面仍没有新多进场的证据。\n#中美映射\n20日窗口，美股 $JETS 涨11.57%、 $SBIO 涨11.00%、 $IHE 涨9.87%、 $FIW 涨9.38%、 $AGNG\n涨8.85%、 $ITB 涨8.81%、 $XLV 涨6.87%、 $XLY 涨6.69%、 $XLF 涨5.69%。5日窗口， $SOXX\n涨9.35%、 $XLE 涨5.42%、 $SMH 涨4.91%、 $IHE 涨4.16%。双窗口同现的是 $IHE 医药、$XLV\n医疗、$XLF 金融； $FIW 水业5日只涨1.88%，趋势还在、加速度不够。半导体仍是仅5日，20日 $SOXX\n跌9.22%，短线脉冲慎追。\nA股今天收盘后，汇添富纳指生物科技ETF 20日涨8.70%、5日涨2.10%，与美股医药是20日共振；银行ETF\n20日涨4.90%、5日涨3.95%，与 $XLF 双窗口同现，今天盘面也对得上。广发机器人ETF\n20日涨8.59%，但5日跌5.71%。芯片ETF 20日跌7.43%、5日跌2.41%，通信ETF\n20日跌25.43%，半导体映射今天继续失效。","en":"美股盘前晚间版｜2026年11月16日 周一 北京时间21:00\n#结论\n今日大类只做两个：生物医药创新，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置的，只剩贴着前高的苹果；箱底小盘还没走到右侧，高位医药和区间中部的能源股都不进只做。\n #苹果 $AAPL 上周五收356.27，距20日高也是52周高360.83只差1.3%，处在区间87%的位置，属突破准备。盘前约357.8，又近了一点。卖方目标价均值345.57低于现价，近四周EPS下修16家，只给半仓，不突破不进。\n明确不做：半导体和AI硬件，英伟达明天盘后出财报，盘前已跌到156.7附近，大约低3.8%；ARK加仓但仍在下跌通道里的小盘；已经处在高位、或者五日涨幅过大的品种。\n#消息面\n截至北京时间21时出头，美股期指比下午更弱。纳指期货27662，较上周五结算跌约1.3%；标普期货7535，跌约0.6%；道指期货基本平。\n#英伟达 $NVDA 盘前约156.7，跌约3.8%。财报是明天美股盘后，也是换帅后第一份季报。英文媒体称黄仁勋方面在讨论重返CEO，没有官方确认，先当噪音。Susquehanna维持看好、目标价275美元，预期本季好于市场，同时提示继任者和对华出口仍有变数。Anthropic计划周三定价、周四在纳斯达克以\n$ANT 挂牌，定价区间70到78美元。\n #安进 $AMGN 11月11日公布干燥综合征新药dazodalibep三期OASIZ-301达到主要终点，盘前约471，涨约1.1%。事件权重大，但股价在20日区间69%、距20日高还有3.9%，不到突破位，只观察。家得宝、迪士尼明天盘前出财报，\n#Powell工业 $POWL\n今晚美股盘后出季报，盘前已跌到136.3附近，大约低4.5%。WTI回落到88美元附近。10年期美债收益率上周五收5.15%，美元指数约103.46，靠近20日高，VIX盘前约20.6。\nA股今天已经收盘，上证3602.57，跌0.87%；创业板跌4.37%，科创50跌5.16%，半导体映射继续失效。\n#研报面\n #苹果 卖方均值目标价345.57美元，买入16家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。 #菲利普斯66\n$PSX 均值目标价299.13，近四周EPS上修22家。 #科迪亚克天然气 $KGS 均值72.55，12家全是买入。 #太平洋生物科学\n$PACB 均值2.64。 #爱德华生命科学 $EW 均值114.5，买入19家。 #安进\n目标价本轮未采集。英伟达除Susquehanna外，上周汇丰降级和集体诉讼仍在。\n#资金面\n晚间版相对下午最重要的变化，是 $PACB\n变成ARK两只基金同买：ARKK加仓930万股、ARKG加仓7.0万股。但期权最大Put行权价2.5离现价太远，Put持仓还增了20.3%，同向项只有ARK一档，不算共振。\n$SCTX 只有ARKG单基金买入约47万美元，做空余额环比升49%，也不算共振。加仓榜里还有 $ACHR 、 $BEAM 、 $CERS\n、 $RXRX ，这几只都还在20日区间下部、近5日继续跌，不是右侧。\n带方向的期权： $AAPL Put持仓减仓20.8%，贴近现价，但只有这一项，未形成共振。 $NVDA\nPut持仓增仓75.2%，偏空；最大Call行权价165距现价约1.3%、量仓比13.46，和Put增仓方向不一致，不当作多共振。\n$TSLA Call持仓减仓62%，偏空。 $AMGN Call持仓减仓5.8%，是多单离场，内部人近三个月小额净买入构不成两项同向。\n$EW 目标价和买入家数增加两项同向，算共振，但位置已经在高位。 $PSX 目标价上调和EPS上修两项同向，期权链未采集。 $KGS\n内部人买入加目标价上调两项同向，但最大Call行权价60离现价34%，期权不算。\n#期货\n上周五完整交易日，股指是多头离场：标普迷你价跌、OI减4474手，量比0.90；纳指迷你价跌、OI减4391手，量比0 斗从 Hyperliquid 疯人院 @hl_madhouse 的星星之火，现在燎原到整个中文 CT 大小社区，几百号人玩上了 @trasiaxyz 交易赛\n▶ 方外三建学院 @yijiangren\n▶ 青云社区 @Tsingxbt\n▶ 八方社区 * 2 @xx03199\n▶ Trader42 @MindfrogCrypto\n▶ 大老师 @octopusycc\n▶ 甜饼糖人街 @sweet919268\n▶ yaya 女仆战队 @coseryaya\n▶ pearl 中文社区 * 3 @0xVanvan\n▶ Trasia 创世乱斗众多战队↓\n@mandywangETH, @bc1qDave, @cluec3, @Jessica_Web3_, @ShiGuangYuYanJi, @BuTongRen6, @hoshino_sasaki, @WY_mask\n...\n更多大家熟悉的老师都在大战！\n@MMMusol, @Aumileude, @48Kchunbai, , @RyanMcRae77, @hippo688, @Goupenguin, @KaMiaoRich, @EEEEdison1992, @Franky7, @Seasui23, @0x_nezha, @AnchorNode, @JXiaoLoong, @Ron521520, @moon_bgb, @Mojito_cx, @lionmika_web3, @Minghaw05, @jeonleetogether, @No_tariff3, @kalilkalilkai, @0xDaaa, @0xStudy, @Syu990, @cryptolfggo, @Bit_Xun, @Yick_Yang\n还有好多老师没有@出...\n人手 100u 大乱斗，复赛率极高，玩过的是真的还想玩（当然也是因为奖池丰厚），大家 K线里面琴瑟相逢 - “比梭哈更容易找到知己的是爆仓”，相信会成为许多 PerpDEX 项目方的学习模板\n-\n3️⃣ 所以我在想，下一代大型交易产品，不再只是手续费和杠杆比较，而要把交易里本来就有的竞争欲、围观欲做成产品本身\n而两个要素缺一不可：\n➊ 简单围观：观众需要实时、清晰地知道场上正在发生什么，为什么发生\n➋ 利害攸关：NBA 主席讲 bet-to-watch —— 下注了才会更认真地看\nTrasia 两个产品模块就很好地回答了这两点\n✅ 侦察模式\n接入 @HyperliquidX aws 亚马逊云，得到得不只是流动性和丰富的标的，唯一的 fully onchain PerpDEX 让你可以任意“侦察”所有人此刻的持仓、浮动盈亏、止盈止损，已成交和还挂着的限价单...\n同场比赛的选手仓位是摊开的 —— “每位交易员都是一本打开的大书。”\nmable 姐倾情制作的赛况视频（看看我上传的视频），其实就是解说员的角色，告诉你“球场这边是 Tiki-taka，那边是防守反击”\n✅ Copy Trading\n跟单甚至反向跟单你的对手，观众和进场只有 one click away，随手跟一单看好的聪明钱，就下场了\n-\n以上，只有这样，交易晋级才不会停留在圈内小众，也只有 Trasia 脆脆鲨在把这个交易竞技的闭环打通\n\"Trading as an Esport is the new meta.\"\n—— 希望大家都来体验反馈\n正好下周要举办「kfc v50 脆脆鲨百人大乱斗」\n更加好玩！\n海报 & 报名入口附评论区\n没玩过的 bro 是时候来参加了","en":"1️⃣ 很巧，昨天刚好同时发生两件事：\n➊ BLG 一穿四 Gen.G 拿下英雄联盟全球总冠军\n➋ FT @joinfrontier 伦敦总决赛 @idatsy PNL +$131k 拿下 S1 冠军，砍下大奖把保时捷 911 开回家（对就是 @jadoodoo 狂出名场面的那个交易赛）\n游戏和交易 ——\n曾经一代人讥笑电竞是旁门，如今声势不输超级碗... 人类始终被竞争吸引，也始终在将竞争变成供人观看的奇观，从罗马斗兽到奥林匹克，Z世代不再成长于球场，而是从屏幕里长出电竞\n而我看到，这趋势还在往 K 线之上转移，交易娱乐化、Competitive Trading 大有流行之势\n「\n“这不眠的资本市场就是世上最大的电子游戏。”\n」\n交易和游戏都需要快速的信息处理、抗压和识别非对称机会的能力，但也和游戏一样 “simple to understand & complicated to master” —— 游戏谁不玩梭哈谁不会？简单，但精通却都万般繁难\n2️⃣ 不会还有人没玩过脆脆鲨大乱斗吧？\n从中秋国庆到现在，将近两个月，我跟老 数采与T链价值重估\n风险提示：本文仅为产业逻辑推演复盘，不构成任何投资建议。机器人、具身智能行业技术迭代快、落地不及预期、行业竞争超预期等风险持续存在，个股仅为产业链举例，不做买入推荐。\nOpenAI组织架构调整，市场一度解读为其机器人业务战略收缩。重新审视这次团队变动，本质并不是放弃具身赛道，而是一次研发路线的明确与资源再集中，是将机器人研究并入通用大模型主线的战略选择。\n回溯OpenAI机器人业务的演进，2020年前后曾一轮收缩，2024年重建团队，本轮再次架构整合，背后的核心判断正在显现：GPT‑6、Astra这类通用基座模型，已经具备直接承载部分机器人任务的潜力。研发重心转向通用大模型作为具身智能的“大脑”，集中算力与研发资源收敛大模型范式，用更强的基础模型去驱动物理端智能，赛道的终局目标——迈向具身智能，并未改变，只是行进的路线发生迭代。\n在基座大模型能力快速抬升的时代，具身企业的壁垒正在被重新定义。基础大模型可以快速迭代，但真机运行所产生的高质量物理交互数据、垂直专家场景、线下落地部署入口，是基座模型短期无法替代的护城河。基模变强，会冲击一部分具身公司的原有业务边界，但能够持续产出独有物理数据、场景闭环落地的厂商，模型迭代可以持续拿到额外的边际增益，数据采集链条的长期价值将持续抬升。\n整条具身产业链正在迎来结构性机会，可以划分为四大主线进行跟踪：\n1. T链（执行器传动链，软硬结合核心赛道）\n传动、结构件、执行器是机器人物理行动的基础硬件，是具身落地最为刚性的一环。重点方向包含减速器、丝杠、轴承、结构件、驱控、手套、设备供应商等。产业链代表标的包括三花智控、拓普集团、恒立液压、双环传动、浙江荣泰、科达利、福赛科技、科森科技、长盈精密、斯菱智驱、金沃股份、新泉股份、田中精机等。硬件是物理AI落地绕不开的载体，行业落地加速阶段，T链的业绩弹性值得持续追踪。\n2. 本体与垂类应用\n机器人整机本体以及垂直场景落地厂商，承载着真机落地、场景闭环、物理数据生成的使命，是物理世界的数据发生器。稀缺材料、整机集成、行业场景服务商处在这一环节，代表上纬新材、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和等。本体厂商最大的价值不单是硬件整机，更是持续运转带来的独家场景数据入口。\n3. 数采链（数据采集闭环）\n高质量真机数据是本轮具身竞赛的核心资源。数采链覆盖传感器、数据采集、信号链路相关企业，代表凡拓数创、奥比中光、芯动联科、华依科技、日盈电子。随着各家具身机型持续试跑、迭代扩容，数据采集需求将会持续放量，数采链是产业军备竞赛里的隐形主线。\n4. OAI供应链条\n直接或是间接供给OpenAI具身项目的国内零部件厂商，兆威机电、长盈精密、立讯精密、中鼎股份、豪鹏科技等，将优先受益其样机迭代、试产放量的订单催化。\n物理AI已经跨过单纯Demo展示阶段，进入落地部署的产业周期。各家大厂的技术路线会持续试错、摇摆、切换，耦合架构、训练数据结构百家争鸣，短期路线具备非常强的不确定性。但整个产业向具身智能前进的长期终点不会改变，一场横跨软硬件的物理AI军备竞赛已经开启。\n行情机会不再是单一主题的脉冲炒作，产业投资主线，应当锚定数据与模型驱动的新叙事，高度把握软硬结合赛道，重点跟踪T链的产业进展。技术路线会不断生变，能够穿越路线波动的硬核硬件、真机场景、物理数据资源，才是具身时代的长期核心资产。","en":"华尔街观察｜具身智能：路线迭变，终点不改，数采与T链价值重估\n风险提示：本文仅为产业逻辑推演复盘，不构成任何投资建议。机器人、具身智能行业技术迭代快、落地不及预期、行业竞争超预期等风险持续存在，个股仅为产业链举例，不做买入推荐。\nOpenAI组织架构调整，市场一度解读为其机器人业务战略收缩。重新审视这次团队变动，本质并不是放弃具身赛道，而是一次研发路线的明确与资源再集中，是将机器人研究并入通用大模型主线的战略选择。\n回溯OpenAI机器人业务的演进，2020年前后曾一轮收缩，2024年重建团队，本轮再次架构整合，背后的核心判断正在显现：GPT‑6、Astra这类通用基座模型，已经具备直接承载部分机器人任务的潜力。研发重心转向通用大模型作为具身智能的“大脑”，集中算力与研发资源收敛大模型范式，用更强的基础模型去驱动物理端智能，赛道的终局目标——迈向具身智能，并未改变，只是行进的路线发生迭代。\n在基座大模型能力快速抬升的时代，具身企业的壁垒正在被重新定义。基础大模型可以快速迭代，但真机运行所产生的高质量物理交互数据、垂直专家场景、线下落地部署入口，是基座模型短期无法替代的护城河。基模变强，会冲击一部分具身公司的原有业务边界，但能够持续产出独有物理数据、场景闭环落地的厂商，模型迭代可以持续拿到额外的边际增益，数据采集链条的长期价值将持续抬升。\n整条具身产业链正在迎来结构性机会，可以划分为四大主线进行跟踪：\n1. T链（执行器传动链，软硬结合核心赛道）\n传动、结构件、执行器是机器人物理行动的基础硬件，是具身落地最为刚性的一环。重点方向包含减速器、丝杠、轴承、结构件、驱控、手套、设备供应商等。产业链代表标的包括三花智控、拓普集团、恒立液压、双环传动、浙江荣泰、科达利、福赛科技、科森科技、长盈精密、斯菱智驱、金沃股份、新泉股份、田中精机等。硬件是物理AI落地绕不开的载体，行业落地加速阶段，T链的业绩弹性值得持续追踪。\n2. 本体与垂类应用\n机器人整机本体以及垂直场景落地厂商，承载着真机落地、场景闭环、物理数据生成的使命，是物理世界的数据发生器。稀缺材料、整机集成、行业场景服务商处在这一环节，代表上纬新材、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和等。本体厂商最大的价值不单是硬件整机，更是持续运转带来的独家场景数据入口。\n3. 数采链（数据采集闭环）\n高质量真机数据是本轮具身竞赛的核心资源。数采链覆盖传感器、数据采集、信号链路相关企业，代表凡拓数创、奥比中光、芯动联科、华依科技、日盈电子。随着各家具身机型持续试跑、迭代扩容，数据采集需求将会持续放量，数采链是产业军备竞赛里的隐形主线。\n4. OAI供应链条\n直接或是间接供给OpenAI具身项目的国内零部件厂商，兆威机电、长盈精密、立讯精密、中鼎股份、豪鹏科技等，将优先受益其样机迭代、试产放量的订单催化。\n物理AI已经跨过单纯Demo展示阶段，进入落地部署的产业周期。各家大厂的技术路线会持续试错、摇摆、切换，耦合架构、训练数据结构百家争鸣，短期路线具备非常强的不确定性。但整个产业向具身智能前进的长期终点不会改变，一场横跨软硬件的物理AI军备竞赛已经开启。\n行情机会不再是单一主题的脉冲炒作，产业投资主线，应当锚定数据与模型驱动的新叙事，高度把握软硬结合赛道，重点跟踪T链的产业进展。技术路线会不断生变，能够穿越路线波动的硬核硬件、真机场景、物理数据资源，才是具身时代的长期核心资产。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122270961588400152","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":470},{"id":"2122270332170240211","h":"cnfinancewatch","ts":1794823651,"zh":"立个标杆！","en":"立个标杆！","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122270278915145728/vid/avc1/720x1280/ZqVlLfqI8Fg1zOQb.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2122270332170240211","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":566},{"id":"2122270183289147431","h":"hanking66","ts":1794823616,"zh":"明年我会买入大科技、医药、和软件安全，目前手里有一些meta ，未来如果有机会也可能买一些亚马逊。医药目前太高，耐心等机会，现在冲进去怕两头挨揍。软件安全到时候再看吧，现在还在观察了解阶段。\n美光还是绝对仓位，那次卸掉杠杆之后没有任何操作，准备拿到明年。我认为存储明年还是会有一波行情的，毕竟股价和基本面的背离越拉越大了…哪怕市场现在不看业绩看的是预期，但是我认为现在的价格已经充分定价了未来最坏的情况了…退一万步说，哪怕真的是周期股，存储的底部也已经被抬高了很多，不可能再回到原来所谓的周期底部了，其实我认为现在很有可能就是大底…所以不用太担心的。\nBuy the dip，长期持有，Discord在个人资料。","en":"明年我会买入大科技、医药、和软件安全，目前手里有一些meta ，未来如果有机会也可能买一些亚马逊。医药目前太高，耐心等机会，现在冲进去怕两头挨揍。软件安全到时候再看吧，现在还在观察了解阶段。\n美光还是绝对仓位，那次卸掉杠杆之后没有任何操作，准备拿到明年。我认为存储明年还是会有一波行情的，毕竟股价和基本面的背离越拉越大了…哪怕市场现在不看业绩看的是预期，但是我认为现在的价格已经充分定价了未来最坏的情况了…退一万步说，哪怕真的是周期股，存储的底部也已经
