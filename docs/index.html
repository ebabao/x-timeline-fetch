<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

s","ts":1794964212,"zh":"亿万富翁斯坦·德鲁肯米勒 (Stan Druckenmiller) 表示，他看空铜，目前大多持观望态度","en":"Billionaire Stan Druckenmiller said he’s bearish on copper and mostly staying on the market sidelines for now","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122859886719451391","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/stan-druckenmiller-says-he-s-short-copper-neutral-on-equities?taid=6afcfaf46018910001a16286&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":14,"rt":4,"rp":5,"vw":13299},{"id":"2122858939792740644","h":"cnfinancewatch","ts":1794963986,"zh":"A股盘前第二版\n七点档的主结论还在，但外盘已经比当时热闹得多。第一版看到的美股指期货只是相对周二结算小幅翻红，现在标普500期货约7413点，较结算涨约0.72%；\n#纳指期货约27454点涨约1.40%；道指期货约50976点，涨约0.32%。\n亚洲开盘把这笔账做得更清楚：日经225约59448点，涨1.0%；韩国综指约5111点，#涨约2.87%，一度接近3%，昨天跌破的5000点已经收回。日本芯片股和软银集团早盘大涨，韩国三星电子、海力士和三星电机也明显走强。\n#三个方向不变：\n银行与红利、\n家电与必选消费、\n半导体制造的事件反弹。\n变化在于，第三方向的高开可能会比第一版预想的更猛，更要守住只观察、不追高，尤其不能把已经伤很重的CPO一并带进去。\n#消息面 两小时更新\n英伟达盘后涨幅一度扩大到约5%，临时CEO继续强调需求至少延伸到2028年，云业务未交订单约2.5万亿美元，并上调2028财年营收增长预期至75%。新出来的干扰也不少。做空机构浑水在财报前宣布做空英伟达，发布报告质疑其前全球现场运营高管与超微电脑前高管可能存在未披露关联，并把问题指向对华销售风险；浑水自己写明，相关身份尚未证实，两人也未被刑事指控。这是转述，不是已坐实的指控，但足够提醒：财报数字好，不等于开盘就能把位置问题一笔勾掉。另据报道，黄仁勋已同意出席美国参议院银行委员会听证会，日期未定。贝佐斯则称，若黄仁勋无法回归，英伟达应从内部寻找新CEO。Anthropic\nIPO仍被传超额认购10至20倍，发行价可能高于每股80美元，这是本周另一只靴子，不是今天开盘的加仓理由。10年期美债收益率在5%附近已经停留约27天，接近2007年的纪录，这根绳子并没有因为期货翻红就松开。\n国内可交易的新信息，更接近风险提示。截至11月17日，两市融资余额22097.71亿元，再减186.04亿元，沪市减78.24亿元、深市减107.8亿元，杠杆还在撤。\n#瀛通通讯 $002861 六天四板后公告，智能眼镜只是少量代工、收入占比不足1%，并提示情绪过热，热榜仍排在前二十，开盘不碰。短剧影视这边，\n#文投控股 $600715 、 #凯撒文化 $002425\n还在人气榜前排，改变不了昨天已经兑现的风险，一律不抄。集合竞价要到9点15分以后才有，截稿前无法采集，开盘强弱以9点25分竞价结果为准。\n#研报面 两小时更新\n今早和新结构更贴的，还是半导体设备与消费。#中信建投称半导体设备、材料和零部件板块业绩有望加速；华龙证券电子行业三季报综述认为自主可控加速兑现；国金证券优先看好国内存储渗透。这些报告只能当作事件反弹的背景，盖不住5日、20日仍在下跌的ETF位置，也不能覆盖浑水报告带来的情绪扰动。\n太平洋证券买入\n#晶晨股份 $688099 、 #全志科技 $300458 ，逻辑是端侧AI，不构成另开主线；\n同门还买入 #永和股份 $605020 、\n#安井食品 $603345 、 #宝立食品 $603170\n，后两只和必选消费同向，只作观察。\n#华泰看好国内储能中长期需求，#中信证券称原奶周期进入上行、稀土供需向好，都记在观察栏，不改今天三个方向。\n#热榜 两小时更新\n东财人气榜前排仍是 \n#华胜天成 $600410 、 #长虹美菱 $000521 、 #西陇科学 $002584 、 #九阳股份\n$002242 、 #有研新材 $600206 、 #华东重机 $002685 、 #海立股份 $600619 、 #中际旭创\n$300308 ， #小熊电器 $002959 、 #顺钠股份 $000533\n进入前十。\n和第一版相比，长虹美菱前移、九阳后撤，小家电和电子化学品还是最拥挤的一端。 \n#中际旭创 $300308\n仍在前十，但昨天继续收跌，热度和位置背离没有修复。同花顺热榜本档数据缺失。","en":"A股盘前第二版\n七点档的主结论还在，但外盘已经比当时热闹得多。第一版看到的美股指期货只是相对周二结算小幅翻红，现在标普500期货约7413点，较结算涨约0.72%；\n#纳指期货约27454点涨约1.40%；道指期货约50976点，涨约0.32%。\n亚洲开盘把这笔账做得更清楚：日经225约59448点，涨1.0%；韩国综指约5111点，#涨约2.87%，一度接近3%，昨天跌破的5000点已经收回。日本芯片股和软银集团早盘大涨，韩国三星电子、海力士和三星电机也明显走强。\n#三个方向不变：\n银行与红利、\n家电与必选消费、\n半导体制造的事件反弹。\n变化在于，第三方向的高开可能会比第一版预想的更猛，更要守住只观察、不追高，尤其不能把已经伤很重的CPO一并带进去。\n#消息面 两小时更新\n英伟达盘后涨幅一度扩大到约5%，临时CEO继续强调需求至少延伸到2028年，云业务未交订单约2.5万亿美元，并上调2028财年营收增长预期至75%。新出来的干扰也不少。做空机构浑水在财报前宣布做空英伟达，发布报告质疑其前全球现场运营高管与超微电脑前高管可能存在未披露关联，并把问题指向对华销售风险；浑水自己写明，相关身份尚未证实，两人也未被刑事指控。这是转述，不是已坐实的指控，但足够提醒：财报数字好，不等于开盘就能把位置问题一笔勾掉。另据报道，黄仁勋已同意出席美国参议院银行委员会听证会，日期未定。贝佐斯则称，若黄仁勋无法回归，英伟达应从内部寻找新CEO。Anthropic\nIPO仍被传超额认购10至20倍，发行价可能高于每股80美元，这是本周另一只靴子，不是今天开盘的加仓理由。10年期美债收益率在5%附近已经停留约27天，接近2007年的纪录，这根绳子并没有因为期货翻红就松开。\n国内可交易的新信息，更接近风险提示。截至11月17日，两市融资余额22097.71亿元，再减186.04亿元，沪市减78.24亿元、深市减107.8亿元，杠杆还在撤。\n#瀛通通讯 $002861 六天四板后公告，智能眼镜只是少量代工、收入占比不足1%，并提示情绪过热，热榜仍排在前二十，开盘不碰。短剧影视这边，\n#文投控股 $600715 、 #凯撒文化 $002425\n还在人气榜前排，改变不了昨天已经兑现的风险，一律不抄。集合竞价要到9点15分以后才有，截稿前无法采集，开盘强弱以9点25分竞价结果为准。\n#研报面 两小时更新\n今早和新结构更贴的，还是半导体设备与消费。#中信建投称半导体设备、材料和零部件板块业绩有望加速；华龙证券电子行业三季报综述认为自主可控加速兑现；国金证券优先看好国内存储渗透。这些报告只能当作事件反弹的背景，盖不住5日、20日仍在下跌的ETF位置，也不能覆盖浑水报告带来的情绪扰动。\n太平洋证券买入\n#晶晨股份 $688099 、 #全志科技 $300458 ，逻辑是端侧AI，不构成另开主线；\n同门还买入 #永和股份 $605020 、\n#安井食品 $603345 、 #宝立食品 $603170\n，后两只和必选消费同向，只作观察。\n#华泰看好国内储能中长期需求，#中信证券称原奶周期进入上行、稀土供需向好，都记在观察栏，不改今天三个方向。\n#热榜 两小时更新\n东财人气榜前排仍是 \n#华胜天成 $600410 、 #长虹美菱 $000521 、 #西陇科学 $002584 、 #九阳股份\n$002242 、 #有研新材 $600206 、 #华东重机 $002685 、 #海立股份 $600619 、 #中际旭创\n$300308 ， #小熊电器 $002959 、 #顺钠股份 $000533\n进入前十。\n和第一版相比，长虹美菱前移、九阳后撤，小家电和电子化学品还是最拥挤的一端。 \n#中际旭创 $300308\n仍在前十，但昨天继续收跌，热度和位置背离没有修复。同花顺热榜本档数据缺失。","zh_src":"native","lang":"zh","m":[],"u":"https:// （NSA）内部传输、存储和共享机密情报的通讯网络NSANet突然出现大规模故障。\n交叉信源分别指出，此次故障发生在系统补丁更新期间，而华盛顿邮报更是提及NSA近期完成了微软Office 365的平台升级。\n#观察 美国最近一周密集出现了重要信息系统故障，值得调查一下。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXj7CubMAAtLMx.jpg?name=orig","https://pbs.twimg.com/media/HXXknMtbIAAuyID.png?name=orig"],"u":"https://x.com/fxtrader/status/2122854898295599512","l":[],"ln":[],"t":[],"lk":4,"rt":2,"rp":4,"vw":4014},{"id":"2122854854372610184","h":"business","ts":1794963012,"zh":"国防部长皮特·赫格斯正式推动他的前助手克里斯托弗·拉内夫将军担任陆军参谋长，尽管他自己的国会党派成员反对这一选择","en":"Defense Secretary Pete Hegseth is formally pushing for his former aide General Christopher LaNeve to become the Army’s chief of staff, even as members of his own party in Congress oppose the selection","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122854854372610184","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/white-house-nominates-laneve-as-army-chief-despite-gop-doubts?taid=6afcf6446018910001a1623d&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":7,"rt":2,"rp":1,"vw":11051},{"id":"2122853597578657967","h":"business","ts":1794962713,"zh":"Common App 的数据显示，今年秋季美国大学的国际申请者比去年同期增长了 9%，扭转了唐纳德·特朗普总统对学生签证持有者打压导致的急剧下降趋势","en":"International applicants to US colleges this fall jumped by 9% from the same time last year, reversing a steep decline spurred by President Donald Trump’s crackdown on student visa holders, according to data from Common App","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122853597578657967","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/foreign-applicants-to-us-colleges-rebound-after-enrollment-drop?taid=6afcf51838c5130001c7af1e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":2,"rp":0,"vw":12474},{"id":"2122853536098877505","h":"cnfinancewatch","ts":1794962698,"zh":"#隔夜美股映射\n（一）美股去重榜前10领涨方向为交通运输航运JETS 20日+8.25%、水业FIW +7.56%、基建BILD +5.58%，但隔夜美股主要指数全线收跌，标普-1.03%、道指-1.64%，20日强势与隔夜方向背离。\n（二）映射个股须方向在美股去重榜前10且隔夜该方向收涨：昨日美股上涨板块仅能源油气UNG +2.24%、交通运输航运BDRY +2.06%、贵金属GDX +0.79%三个方向收涨，其中交通运输航运BDRY与去重榜JETS同向，权重上调一档，对应A股中远海控。\n（三）冲突处理：美股20日强势的消费、创新药隔夜均收跌（XLP -1.23%、IHI -1.06%），美股半导体博通昨+2.46%为带动性热股第一，虽不在去重榜前10，但隔夜方向明确，A股半导体设备K线未远离5日线，映射正确且位置可做，权重上调。\n#韩日开盘映射\n（一）韩国KOSPI 5124.17（+0.46%），日经225 59335.76（-0.55%），韩强日弱。\n（二）韩国存储半导体均+5.24%（SK海力士+5.97%、三星电子+4.52%），半导体设备与存储最强；日本半导体设备均+4.00%（爱德万测试+4.67%、迪思科+4.31%、东京电子+3.01%），精密制造均+0.53%，金融均-0.07%。\n（三）韩股存储强提高A股存储、半导体设备、封测权重；日股半导体设备强提高A股设备、材料权重，两者同向共振。\n（四）韩日半导体方向与隔夜美股博通+2.46%一致，定当日最高优先级；日经指数本身-0.55%与板块强势背离，仅作板块层面确认，指数层面降权。\n（五）韩日数据只用于确认半导体方向，不直接作买入理由。\n六、大盘风险开关\n（一）环境分42分，降仓档，只做回踩低吸不做追高。\n（二）指数位置：上证3584.58低于MA5 3631.59（-1.29%）、MA10 3650.77（-1.81%）、MA20 3654.66（-1.92%），沪深300、中证500、中证1000全部在5日线与10日线下方，中证1000偏离MA20达-5.83%最弱，属小盘弱势、权重相对抗跌格局。\n（三）期货升贴水：未获取。\n（四）涨跌停结构：窗口内龙虎榜涨停股以游资普通席位为主，成功率多在30%至45%，机构上榜多为卖出或分歧，赚钱效应一般，未见明显恶化但也无强势连板高度数据。\n（五）外盘冲击：隔夜美股三大指数收跌，日经-0.55%，仅韩国+0.46%与半导体板块强，外盘整体偏空但半导体结构性偏多。\n（六）综合：指数在均线下方、小盘弱、外盘偏空，环境分42分，降仓，只做半导体设备与消费的回踩低吸。\n#五大机构研报（窗口内）\n（一）华泰证券，11月18日，《互联网行业关注纯工具类平台和硬切软逻辑》，关注AI基础设施投入ROI边际变化。\n（二）中信证券，11月18日，《原奶周期进入上行通道 保持对牧业板块的推荐》，奶价终结五年下行。\n（三）中信证券，11月18日，《稀土行业供需向好 关注板块配置价值》，板块调整后配置价值凸显。\n（四）中信建投，11月18日，《半导体设备、材料、零部件板块业绩有望加速》，Q3半导体单季归母净利增速516%。\n（五）中信建投，11月17日，《十月底低点大概率已是本轮市场底，11月开启进二退一修复行情》，估值偏低。\n（六）中金公司，11月17日，《当前至12月有望迎来修复行情》，换手率降至3.6%，ETF净流入积极。\n（七）华泰证券，11月17日，《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》，必选与可选消费景气改善居前。\n（八）中信建投，11月16日，《注意估值风格切换的年末行情特征》，低估值盈利确定板块年末胜率高。\n#研报互证\n（一）方向一半导体设备与存储：互证结论月内强支撑。中信建投11月18日《半导体设备、材料、零部件板块业绩有望加速》直接覆盖设备材料；中信建投11月16日《持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现》覆盖算力硬件；中泰证券11月13日《AI产业趋势远未终结》覆盖电子。多家机构同向，方向权重上调一档。\n（二）方向二消费：互证结论月内强支撑。华泰证券11月17日《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》直接覆盖；中信证券11月18日《原奶周期进入上行通道 保持对牧业板块的推荐》覆盖食品农业链。两家同向，方向权重上调一档。\n（三）方向三军工航天：互证结论月内无支撑。近一个月华泰、中信建投、中信、中泰、中金五家研报库无军工航天直接覆盖，权重下调一档，仅作补涨观察。\n（四）主选股华海清科：月内强支撑，中信建投11月18日半导体设备研报覆盖设备环节，逻辑一致，权重上调。\n（五）主选股安井食品：月内单一支撑，华泰证券11月17日内需消费研报覆盖必选消费方向，未直接点名个股，维持原权重。\n（六）主选股中航光电：月内无支撑，五家机构近一个月无军工覆盖，权重下调，若同时与ETF榜不符则剔除，本方向仅美股AV映射、A股未进榜，降为观察性配置。\n（七）被研报否掉或剔除的标的：AI算力软件方向虽有多份研报支撑，但今日短线候选池该方向可作短线为零，行情数据与研报观点冲突，以行情为准，剔除；光伏储能方向研报有中信证券11月17日《储能发展规划出台》支撑，但A股同主题未进榜且候选池无达标个股，剔除。","en":"#隔夜美股映射\n（一）美股去重榜前10领涨方向为交通运输航运JETS 20日+8.25%、水业FIW +7.56%、基建BILD +5.58%，但隔夜美股主要指数全线收跌，标普-1.03%、道指-1.64%，20日强势与隔夜方向背离。\n（二）映射个股须方向在美股去重榜前10且隔夜该方向收涨：昨日美股上涨板块仅能源油气UNG +2.24%、交通运输航运BDRY +2.06%、贵金属GDX +0.79%三个方向收涨，其中交通运输航运BDRY与去重榜JETS同向，权重上调一档，对应A股中远海控。\n（三）冲突处理：美股20日强势的消费、创新药隔夜均收跌（XLP -1.23%、IHI -1.06%），美股半导体博通昨+2.46%为带动性热股第一，虽不在去重榜前10，但隔夜方向明确，A股半导体设备K线未远离5日线，映射正确且位置可做，权重上调。\n#韩日开盘映射\n（一）韩国KOSPI 5124.17（+0.46%），日经225 59335.76（-0.55%），韩强日弱。\n（二）韩国存储半导体均+5.24%（SK海力士+5.97%、三星电子+4.52%），半导体设备与存储最强；日本半导体设备均+4.00%（爱德万测试+4.67%、迪思科+4.31%、东京电子+3.01%），精密制造均+0.53%，金融均-0.07%。\n（三）韩股存储强提高A股存储、半导体设备、封测权重；日股半导体设备强提高A股设备、材料权重，两者同向共振。\n（四）韩日半导体方向与隔夜美股博通+2.46%一致，定当日最高优先级；日经指数本身-0.55%与板块强势背离，仅作板块层面确认，指数层面降权。\n（五）韩日数据只用于确认半导体方向，不直接作买入理由。\n六、大盘风险开关\n（一）环境分42分，降仓档，只做回踩低吸不做追高。\n（二）指数位置：上证3584.58低于MA5 3631.59（-1.29%）、MA10 3650.77（-1.81%）、MA20 3654.66（-1.92%），沪深300、中证500、中证1000全部在5日线与10日线下方，中证1000偏离MA20达-5.83%最弱，属小盘弱势、权重相对抗跌格局。\n（三）期货升贴水：未获取。\n（四）涨跌停结构：窗口内龙虎榜涨停股以游资普通席位为主，成功率多在30%至45%，机构上榜多为卖出或分歧，赚钱效应一般，未见明显恶化但也无强势连板高度数据。\n（五）外盘冲击：隔夜美股三大指数收跌，日经-0.55%，仅韩国+0.46%与半导体板块强，外盘整体偏空但半导体结构性偏多。\n（六）综合：指数在均线下方、小盘弱、外盘偏空，环境分42分，降仓，只做半导体设备与消费的回踩低吸。\n#五大机构研报（窗口内）\n（一）华泰证券，11月18日，《互联网行业关注纯工具类平台和硬切软逻辑》，关注AI基础设施投入ROI边际变化。\n（二）中信证券，11月18日，《原奶周期进入上行通道 保持对牧业板块的推荐》，奶价终结五年下行。\n（三）中信证券，11月18日，《稀土行业供需向好 关注板块配置价值》，板块调整后配置价值凸显。\n（四）中信建投，11月18日，《半导体设备、材料、零部件板块业绩有望加速》，Q3半导体单季归母净利增速516%。\n（五）中信建投，11月17日，《十月底低点大概率已是本轮市场底，11月开启进二退一修复行情》，估值偏低。\n（六）中金公司，11月17日，《当前至12月有望迎来修复行情》，换手率降至3.6%，ETF净流入积极。\n（七）华泰证券，11月17日，《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》，必选与可选消费景气改善居前。\n（八）中信建投，11月16日，《注意估值风格切换的年末行情特征》，低估值盈利确定板块年末胜率高。\n#研报互证\n（一）方向一半导体设备与存储：互证结论月内强支撑。中信建投11月18日《半导体设备、材料、零部件板块业绩有望加速》直接覆盖设备材料；中信建投11月16日《持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现》覆盖算力硬件；中泰证券11月13日《AI产业趋势远未终结》覆盖电子。多家机构同向，方向权重上调一档。\n :"en","m":["https://video.twimg.com/amplify_video/2122848658609549312/vid/avc1/1080x1920/z9jRe6oqfwiUzFcY.mp4?tag=16"],"u":"https://x.com/business/status/2122848798334451769","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/3XgmumF","d":"bloom.bg"}],"t":["美股","AI科技"],"lk":4,"rt":3,"rp":3,"vw":11272},{"id":"2122848550186864853","h":"business","ts":1794961509,"zh":"阅读今天的澳大利亚简报，了解来自澳大利亚和世界各地的彭博社每日精选内容","en":"Read today's Australia Briefing for your daily dose of the best of Bloomberg from Down Under and around the world","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122848550186864853","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-17/anthropic-ipo-huang-nvidia-gta-6-australia-briefing?taid=6afcf0656018910001a16207&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":0,"rt":1,"rp":1,"vw":10577},{"id":"2122847786488168733","h":"tig88411109","ts":1794961327,"zh":"$NVDA财报毫无意外大超预期单季首次破1000亿美金，毛利率因为新品Rubin出货稍降但新一代接棒开局爆发，明年也继续上调。代理CEO的表态继续支持生态融资，核心看什么内容和投资策略，在本周初，我发布的订阅者的周报策略都已经预测清楚，一一对应，具体详细的分析和估值更新，我稍后发","en":"$NVDA财报毫无意外大超预期单季首次破1000亿美金，毛利率因为新品Rubin出货稍降但新一代接棒开局爆发，明年也继续上调。代理CEO的表态继续支持生态融资，核心看什么内容和投资策略，在本周初，我发布的订阅者的周报策略都已经预测清楚，一一对应，具体详细的分析和估值更新，我稍后发","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXez_Pa4AAK5Db.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2122847786488168733","l":[],"ln":[],"t":["财报"],"lk":1,"rt":0,"rp":0,"vw":792},{"id":"2122847494073934005","h":"LucyBuilding","ts":1794961257,"zh":"英伟达财报超预期，黄仁勋还有机会回来吗？\n黄仁勋选在英伟达财报当天公开说自己愿意回来。几个小时后，英伟达董事长在财报电话会上一开场就说董事会无意让他复任。从时间线上看这个帖子更像是黄仁勋在公开争取回归，也多少有点施压的意思吧，特意提到还有员工、客户和合作伙伴希望他回来。\n回到财报，盘后反弹已经说明了一切。英伟达这季做了 1158 亿美元营收，超过预期。Vera Rubin 已经开始出货，上一代 Blackwell Ultra 也还在增长。新产品接上了，同时老产品还有需求。\n下季给了 1300 亿美元的营收指引，比市场预期高，也没计入来自中国的数据中心计算收入。不过这一季多了一周，直接看季度总额环比增长约 12%，摊到每周的话增幅约 4%。\n下季的毛利率指引是 71%–72%，低于这季的 74.9%。这个区间上季就说过当时管理层提到内存涨价比预想的厉害。按指引中值粗算卖得更多，毛利总额还是会涨，只是涨得没营收那么快。\n回款周期上这季平均收款天数从 60 天拉长到 64 天。公司的说法是一部分是因为 Rubin 出货节奏，一部分是给某些大客户的账期更长。\n这一季财报黄仁勋还在任。老黄对英伟达影响要看下一季了。股价盘后涨超 4%，现在有所回落，我觉得作为反弹不算小，但放在这次财报前的预期里，又有点克制了，继续看今晚正式开盘后的走势。\n买美股、加密货币用OKX，本条由@okxchinese赞助。","en":"英伟达财报超预期，黄仁勋还有机会回来吗？\n黄仁勋选在英伟达财报当天公开说自己愿意回来。几个小时后，英伟达董事长在财报电话会上一开场就说董事会无意让他复任。从时间线上看这个帖子更像是黄仁勋在公开争取回归，也多少有点施压的意思吧，特意提到还有员工、客户和合作伙伴希望他回来。\n回到财报，盘后反弹已经说明了一切。英伟达这季做了 1158 亿美元营收，超过预期。Vera Rubin 已经开始出货，上一代 Blackwell Ultra 也还在增长。新产品接上了，同时老产品还有需求。\n下季给了 1300 亿美元的营收指引，比市场预期高，也没计入来自中国的数据中心计算收入。不过这一季多了一周，直接看季度总额环比增长约 12%，摊到每周的话增幅约 4%。\n下季的毛利率指引是 71%–72%，低于这季的 74.9%。这个区间上季就说过当时管理层提到内存涨价比预想的厉害。按指引中值粗算卖得更多，毛利总额还是会涨，只是涨得没营收那么快。\n回款周期上这季平均收款天数从 60 天拉长到 64 天。公司的说法是一部分是因为 Rubin 出货节奏，一部分是给某些大客户的账期更长。\n这一季财报黄仁勋还在任。老黄对英伟达影响要看下一季了。股价盘后涨超 4%，现在有所回落，我觉得作为反弹不算小，但放在这次财报前的预期里，又有点克制了，继续看今晚正式开盘后的走势。\n买美股、加密货币用OKX，本条由@okxchinese赞助。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXbG5hawAA6iK6.jpg?name=orig"],"u":"https://x.com/LucyBuilding/status/2122847494073934005","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":480},{"id":"2122847299852279932","h":"business","ts":1794961211,"zh":"了解全球市场动态","en":"Get up to speed on what's moving global markets","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122847299852279932","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/stock-market-today-dow-s-p-live-updates?taid=6afcef3a6018910001a161fa&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":1,"rt":1,"rp":1,"vw":11458},{"id":"2122846131453661578","h":"cnfinancewatch","ts":1794960932,"zh":"散户热议｜2026-11-18·早间\n数据时点：国内社区以11月17日收盘后至11月18日07:50前可见的公开帖为准；海外统计抓取于北京时间今早。本期邮箱新增一封11月17日晚间热点财经邮件，早间邮件截稿未到。韭研公社热帖列表可以打开，但针对今早英伟达财报的时间轴帖打开时暂无评论；国内讨论因此主要依据淘股吧收盘后的复盘，以及韭研17日下午到晚间仍在消化国产替代与出口管制的帖文。WallStreetBets帖文正文未能直接完整抓取，情绪统计来自StonkHub二手页面，已注明；Stocktwits英伟达个股页可以打开，情绪值为平台标示，不是我们自行计算的投票。\n国内：17日收盘的 #情绪是冰点，不是修复完成\n淘股吧“庄哥说股”11月17日16:57的《11.18盘前推演:77家跌停！九阳地天板！明天只有一种可能性！》，发帖时英伟达还没出数，页面显示浏览约8077次。作者写得很难受：上证只跌0.50%，但下跌约4119家、跌停约77家、涨停37家，两市成交约1.46万亿元继续缩量；早盘半导体和九阳涨停让人看到希望，午后又把希望收走。他把压力分成三层：#外围科技不确定性、量能不够、#高位题材亏钱效应连锁——文投控股跌停，吉视传媒大跌，北纬科技断板，#短剧和机器人继续补跌。对 #九阳股份，他记的是低开28.26元、盘中触及跌停，最终封在31.52元，走出地天板，并称之为“总龙头地位的再次确认”，但也提醒20%振幅说明风险不小。热门榜里，#华胜天成收涨停、三天两板；#有研新材涨停被视为材料方向的新强点；中际旭创跌3.90%、成交204.75亿元，仍被写成“机构恐慌出逃、趋势向下”；凯撒文化地天后炸板，被标成次日危险。对今天的预案，他看 #支撑3550点、3530点，压力3600点、3630点，最想先看跌停数量能否下来、指数能否收回3600，#再看九阳的承接、#有研新材和华胜天成有没有板块响应、#中际旭创能不能稳住。这些是出数前的社区预案，不是已经消化过财报的新共识。上述涨跌停和成交是社区口径，与金十统计的全天成交14576.95亿元、涨停37只大体相近，跌停家数我们未与交易所逐一核对。\n#最强主线写成国产替代，并称光刻胶涨幅靠前，催化是美国拟封堵通过海外数据中心远程获取算力，以及外交部、商务部的回应。另一篇16:49的盘面帖同时转述了SemiAnalysis大幅下调未来数年AI加速器资本开支预测，以及“董事会没有在考虑让黄仁勋回任”的消息。昇腾、光刻材料、华东重机、华胜天成、寒武纪、海光信息等名字仍在被来回点。针对“英伟达财报”的时间轴帖由@韭连板在11月18日凌晨发布，我们打开时页面显示暂无评论，因此不能把“公社已经形成统一看多或看空”写成事实。抓取范围有限，这里不编造更多引语。\n与券商口径的异同：#相同点是都看见了国产替代和制造、设备、材料的活口，也都没有把光模块写成同步修复。不同点是社区更愿意把#九阳地天板、#华东重机连板理解成情绪锚点和“明天可以继续做高度”，分析口径则更强调这是亏钱效应还没收敛时的局部高潮。被忽略的风险有三：一是把今早可能出现的科技高开，直接理解成风格已经切回成长，去追昨天已经涨停的有研新材、连板的华东重机，或者补涨还没企稳的中际旭创；二 #是在文投慈文跌停后再去抄短剧，把风险提示当成利空出尽；三是忽略毛利率指引下修和中国数据中心收入缺失，只记住“营收翻倍”。\n海外：持股社区在盘后欢呼，但七日统计仍略偏空\nStonkHub（二手，页面今早抓取）显示，过去7天有1101名WallStreetBets用户讨论英伟达，提及1507次，人数较上周的474人升132%。全Reddit口径下，7日共2608次提及，看多35.7%（930次）、中性23.0%、#看空41.3%（1077次），分类器平均置信度64%，不宜过度解读。统计还显示，讨论最密的一小时仍是美东17日16时，也就是常规交易收盘、财报尚未公布的时点。也就是说，这组略偏空的数字，主要反映的是财报前一周的恐惧，不能直接当成盘后投票。页面列出的高赞标题包括黄仁勋表态愿意回归，需要和董事会主席“不打算让他复职”分开看：前者是他本人的条件句，后者才是公司在电话会上的正式口径。\nStocktwits英伟达个股页可以直接打开。平台标示情绪为93、极端看多，关注人数约68.84万，并给出盘后报价约161.55美元、较收盘155.46美元涨约3.92%。评论区分化很清楚：有人写“空头完蛋了”“市盈率只有19”，把超预期和回购授权理解成反转；也有人提醒，盘后量不大、董事会强调不会让黄仁勋复职，担心次日开盘才是机构兑现的时候。这和七日WSB统计并不矛盾——持股社区在股价已经大跌之后，更愿意把一份超预期财报当成转折；期权和短线玩家在出数前更怕波动，七日窗口里看空仍略占上风。\n专业资金的制约，散户讨论里出现得更少：四季度毛利率指引下调到71%至72%，指引仍不含中国数据中心计算收入，Anthropic上市还在后头。A股散户若只把盘后涨3.9%理解成“外部利好已经落地，今天可以追连板和光模块”，就会把两套不同的交易揉在一起。\n小结：国内短线还停在17日冰点复盘和国产替代活口，海外持股社区已经在盘后欢呼，但七日统计仍偏谨慎。","en":"散户热议｜2026-11-18·早间\n数据时点：国内社区以11月17日收盘后至11月18日07:50前可见的公开帖为准；海外统计抓取于北京时间今早。本期邮箱新增一封11月17日晚间热点财经邮件，早间邮件截稿未到。韭研公社热帖列表可以打开，但针对今早英伟达财报的时间轴帖打开时暂无评论；国内讨论因此主要依据淘股吧收盘后的复盘，以及韭研17日下午到晚间仍在消化国产替代与出口管制的帖文。Wall ative","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122846131453661578","l":[],"ln":[],"t":["A股港股","AI科技","财报","关税贸易"],"lk":0,"rt":0,"rp":0,"vw":1423},{"id":"2122846051115610169","h":"business","ts":1794960913,"zh":"伊朗威胁对美国或以色列基地附近的民用基础设施进行针锋相对的攻击：欧洲晚间简报 acked?taid=6afcee116018910001a161f4&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Iran threatened tit-for-tat attacks against civilian infrastructure located near US or Israeli bases: Evening Briefing Europe","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122846051115610169","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-17/iran-vows-tit-for-tat-strikes-on-civilian-infrastructure-if-attacked?taid=6afcee116018910001a161f4&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":1,"rp":1,"vw":12943},{"id":"2122845427842383928","h":"nmasc_","ts":1794960765,"zh":"Scoop：Anthropic 最著名的风险投资支持者，包括红杉资本、Lightspeed、Iconiq 等，将在该公司 IPO 中投入更多资金","en":"Scoop: Anthropic's most notable VC backers including Sequoia, Lightspeed, Iconiq and more are set to pour more money into the company in its IPO","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/nmasc_/status/2122845427842383928","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/anthropic-backers-sequoia-lightspeed-set-to-invest-more-in-ipo?srnd=undefined","d":"bloomberg.com"}],"t":[],"lk":30,"rt":7,"rp":0,"vw":9269},{"id":"2122844812449874286","h":"cnfinancewatch","ts":1794960618,"zh":"三大利空方向（由强到弱）\n一、利率和流动性约束并没有被一份财报解除。已核实：美股11个主要行业全部收跌，金融跌1.87%，公用事业跌1.60%，连传统防守板块也没能幸免。纽约尾盘10年期美债收益率报5.0987%，仍在5.10%附近，盘中高见5.1494%；市场此前计价美联储12月加息25个基点的概率约96.8%。现货黄金约3849.59美元，仍靠近一年低位；美元指数17日收于103.485，当日微跌0.06%，所谓“创十八个月新高”更多是近日背景，不宜写成17日当天又创新高。WTI原油约85.74美元，已从更早的大跌中暂时稳住。英伟达自己也在用毛利率下修和“不含中国数据中心计算收入”提醒：增长还在，但质量预期和地缘约束没有消失。只要债券收益率不下来，成长股的估值修复就会反复被打折。\n二、CPO、光模块和已经受伤的AI硬件，不能自动兑现英伟达的超预期。晚间邮件把英伟达的影响直接映射到中际旭创、新易盛，这个映射在出数前就已和盘面脱节。已核实：台积电常规交易跌3.68%，软件指数IGV跌3.29%，阿里巴巴美股跌4.38%。创业板收盘跌破52周低位，说明成长股的亏钱效应还在指数层面确认。另一只靴子是Anthropic：CNBC援引消息称发行价可能高于70至78美元的指引区间，计划11月19日以代码ANT在纳斯达克上市；招股文件显示前九个月营收332.4亿美元，同期净亏损1040亿美元，其中大部分来自可转债和衍生工具公允价值变动。定价和首日表现会重新测量AI估值，不排除“英伟达数字很好、新股定价很贵、风险资产仍然摇摆”的组合。\n三、短剧影视和高位题材的亏钱效应还在扩散，不是“利空出尽”后的抄底窗口。已核实：文投控股跌9.89%，慈文传媒跌9.98%，横店影视跌停，短剧影视继风险提示之后继续兑现。人形机器人里，宇树科技跌11.97%，襄阳轴承跌10.01%；中国稀土跌10.00%。另一端则是局部高潮：阳光照明涨停并处于连板高位，华东重机三连板，华胜天成三天两板，九阳走出地天板。涨停少、跌停多，希望在上午给过一次、下午又收走，这是典型的容错率下降。复星医药董事长提议以2.5亿元至5亿元回购A股，对板块只是温和信号。今天如果因为英伟达高开去接力这些高位票，或者在跌停堆里捡短剧，证伪成本都会非常低。\n主要依据：英伟达2027财年三季报及电话会公开转述、家得宝官方业绩与任命公告、京东SEC附件、商务部与外交部公开表态、中国证券报所载上交所审核通过公告、海关出口数据的公开报道、新华社与美联社行情、金十成交统计、东方财富早餐中的利率与商品报价。以上为公开信息整理，不构成投资建议，投资有风险。","en":"三大利空方向（由强到弱）\n一、利率和流动性约束并没有被一份财报解除。已核实：美股11个主要行业全部收跌，金融跌1.87%，公用事业跌1.60%，连传统防守板块也没能幸免。纽约尾盘10年期美债收益率报5.0987%，仍在5.10%附近，盘中高见5.1494%；市场此前计价美联储12月加息25个基点的概率约96.8%。现货黄金约3849.59美元，仍靠近一年低位；美元指数17日收于103.485，当日微跌0.06%，所谓“创十八个月新高”更多是近日背景，不宜写成17日当天又创新高。WTI原油约85.74美元，已从更早的大跌中暂时稳住。英伟达自己也在用毛利率下修和“不含中国数据中心计算收入”提醒：增长还在，但质量预期和地缘约束没有消失。只要债券收益率不下来，成长股的估值修复就会反复被打折。\n二、CPO、光模块和已经受伤的AI硬件，不能自动兑现英伟达的超预期。晚间邮件把英伟达的影响直接映射到中际旭创、新易盛，这个映射在出数前就已和盘面脱节。已核实：台积电常规交易跌3.68%，软件指数IGV跌3.29%，阿里巴巴美股跌4.38%。创业板收盘跌破52周低位，说明成长股的亏钱效应还在指数层面确认。另一只靴子是Anthropic：CNBC援引消息称发行价可能高于70至78美元的指引区间，计划11月19日以代码ANT在纳斯达克上市；招股文件显示前九个月营收332.4亿美元，同期净亏损1040亿美元，其中大部分来自可转债和衍生工具公允价值变动。定价和首日表现会重新测量AI估值，不排除“英伟达数字很好、新股定价很贵、风险资产仍然摇摆”的组合。\n三、短剧影视和高位题材的亏钱效应还在扩散，不是“利空出尽”后的抄底窗口。已核实：文投控股跌9.89%，慈文传媒跌9.98%，横店影视跌停，短剧影视继风险提示之后继续兑现。人形机器人里，宇树科技跌11.97%，襄阳轴承跌10.01%；中国稀土跌10.00%。另一端则是局部高潮：阳光照明涨停并处于连板高位，华东重机三连板，华胜天成三天两板，九阳走出地天板。涨停少、跌停多，希望在上午给过一次、下午又收走，这是典型的容错率下降。复星医药董事长提议以2.5亿元至5亿元回购A股，对板块只是温和信号。今天如果因为英伟达高开去接力这些高位票，或者在跌停堆里捡短剧，证伪成本都会非常低。\n主要依据：英伟达2027财年三季报及电话会公开转述、家得宝官方业绩与任命公告、京东SEC附件、商务部与外交部公开表态、中国证券报所载上交所审核通过公告、海关出口数据的公开报道、新华社与美联社行情、金十成交统计、东方财富早餐中的利率与商品报价。以上为公开信息整理，不构成投资建议，投资有风险。","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/cnfinancewatch/status/2122844812449874286","l":[],"ln":[],"t":["美联储","美股","A股港股","汇率","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":199},{"id":"2122844780044390827","h":"business","ts":1794960610,"zh":"据《华尔街日报》周二报道，美国证券交易委员会正在调查英伟达，该公司正努力应对前首席执行官黄仁勋退出的影响","en":"The Securities and Exchange Commission is investigating Nvidia, the Wall Street Journal reported Tuesday, as the company grapples with fallout from the exit of former Chief Executive Officer Jensen Huang","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122844780044390827","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/sec-is-probing-nvidia-amid-jensen-huang-s-exit-wsj-reports?taid=6afcece2cfe34900016344e2&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["美股","AI科技"],"lk":1,"rt":1,"rp":0,"vw":5012},{"id":"2122844632346501296","h":"cnfinancewatch","ts":1794960575,"zh":"热点财经新闻综述｜2026-11-18·早间\n数据时点：A股为11月17日收盘；美股为美东11月17日收盘，并以盘后公开报价补充英伟达财报反应；隔夜与今早消息整理截至北京时间11月18日07:50。本期邮箱新增一封热点财经邮件（11月17日晚间20:10版，位于垃圾邮件），11月18日早间邮件截稿未到。该晚间邮件写于英伟达出数之前，其中对财报的预判不能当成已落实结果。凡标“邮件转述”的内容未逐条核实，其余已对照英伟达、家得宝等公司公告、京东向SEC提交的财报、商务部与外交部公开信息、交易所审核公告、海关出口数据的公开报道，以及新华社、美联社行情和主流媒体报道。\n今日判断\n凌晨落地的英伟达财报，是今天唯一足够改写叙事的新信息，但还不够改写仓位结构。已核实：三季度营收1158亿美元，同比增103%、环比增20%；数据中心收入1076亿美元，同比增110%；非GAAP每股收益2.68美元，GAAP为2.70美元。第四季度营收指引中值1300亿美元、上下浮动3%，公司明确指引不含中国数据中心计算收入。当季GAAP和非GAAP毛利率分别为74.8%和74.9%，但四季度毛利率指引下调到71%至72%。电话会上，临时CEO克雷斯把2028财年营收增长预期上调到75%，并称“一切照常”；董事会主席则明确表示，不打算让黄仁勋复职。黄仁勋本人在辞职后的首份声明里说，若董事会认为回归符合股东、员工、公司和美国利益，他愿意回来——这是他的态度，不是董事会的决定，两句话不能并成“马上回归”。财报还披露，董事会已于今年9月将回购授权上调1500亿美元，三季度回购加派息281亿美元，截至季末剩余授权约2273亿美元。\n常规交易里，英伟达收155.46美元，跌0.44%；盘后公开报价约161.55美元，涨约3.9%，盘后一度接近4%。数字是超预期的，盘后也给了反应，但美股三大指数昨天仍是四连跌：道指跌1.64%报50759.42点，标普500跌1.03%报7340.53点，纳指跌0.74%报24328.38点，11个主要行业全部收跌。A股昨天已经先走完自己的结构：上证跌0.50%报3584.58点，再失3600；创业板跌1.20%报2292.20点，收盘跌破52周低位；科创50反而涨0.62%。资金提前买的是制造、设备和材料，不是光模块。所以今天的基调很清楚：不要把超预期理解成成长风格已经反转。相对更稳的仍是银行红利和家电；半导体制造和设备只当成事件反弹观察，开盘不追；CPO和已经地天板、连板的题材票，不要并进同一笔交易。Anthropic的定价和上市也在这两天落地，是另一只靴子。\n三大利多方向（由强到弱）\n一、半导体制造、设备与材料的国产替代，是事件上最有弹性的方向，但必须和光模块拆开看。已核实：中芯国际三季度销售收入31.9亿美元，同比增33.9%，产能利用率升至97.3%；昨天中芯国际涨6.59%，华虹公司涨10.39%，北方华创涨4.09%，有研新材涨停，半导体板块主力净流入约29.6亿元，从上一交易日的流出第一转为流入第一。美国商务部本周公布新规，限制中国企业通过新加坡、马来西亚、泰国、印尼、巴西等地数据中心远程获取先进算力，存量业务须在90天内申请许可；中国商务部表示若美方一意孤行将采取反制，外交部称之为典型的经济胁迫和“长臂管辖”。这解释了为什么昨天修复的是国产制造和材料，而不是和英伟达订单绑定更紧的光模块——中际旭创跌3.90%，成交额204.75亿元居两市第一，新易盛跌4.08%。制约就在同一份财报里：毛利率指引下修、中国数据中心计算收入继续不计入、董事会人事并未“恢复原状”。有研新材已经涨停，中芯、华虹若高开后不能站稳，就是脉冲结束，而不是新趋势开始。开盘不追，更不要把CPO一并抬进去。\n二、家电与必选消费，是少数既有出口数字、又还没被亏钱效应打穿的方向。已核实：海关口径下，2026年10月家电出口4.02亿台，同比增14.1%，出口金额89.56亿美元，同比增20.9%，金额增速继续抬升。昨天美的集团涨0.70%，小家电里长虹美菱、小熊电器继续活跃。家得宝三季度销售额434亿美元，增4.9%，美国同店增2.2%，调整后每股收益3.86美元，并更新全年销售增长约4.5%、调整后每股收益增速约2.0%的指引，同时宣布财务总监麦克费尔将于11月23日接任CEO；但股价仍收跌约2.4%，报339美元附近，说明美股把“略超预期+换帅”理解成卖出机会，不能简单映射成A股家居建材要跟涨。真正该看的是出口链龙头，而不是已经走出地天板的九阳股份——该股昨天低开后触及跌停，再拉至涨停，淘股吧复盘记低开28.26元、收31.52元，振幅约20%，这是方向里已经拥挤的一端。制约：高位小家电和“羊”字辈的接力资金，随时可能被半导体高开抽走。\n三、银行与红利仍是防守底仓，但高位已经开始兑现。已核实：昨天工商银行涨0.11%，多只银行股仍在历史新高附近，但银行板块主力净流出约13.5亿元。上证失守3600，沪深成交14576.95亿元，再缩267.95亿元。东吴证券收购东海证券事项已获上交所并购重组委通过，交易对价约115.19亿元，后续仍待证监会注册，这只是券商整合的增量，改变不了昨天的缩量结构。\n邮件转述称尾盘有212亿元资金涌入宽基ETF、创业板ETF广发成交超50亿元创出天量。","en":"热点财经新闻综述｜2026-11-18·早间\n数据时点：A股为11月17日收盘；美股为美东11月17日收盘，并以盘后公开报价补充英伟达财报反应；隔夜与今早消息整理截至北京时间11月18日07:50。本期邮箱新增一封热点财经邮件（11月17日晚间20:10版，位于垃圾邮件），11月18日早间邮件截稿未到。该晚间邮件写于英伟达出数之前，其中对财报的预判不能当成已落实结果。凡标“邮件转述”的内容未逐条核实，其余已对照英伟达、家得宝等公司公告、京东向SEC提交的财报、商务部与外交部公开信息、交易所审核公告、海关出口数据的公开报道，以及新华社、美联社行情和主流媒体报道。\n今日判断\n凌晨落地的英伟达财报，是今天唯一足够改写叙事的新信息，但还不够改写仓位结构。已核实：三季度营收1158亿美元，同比增103%、环比增20%；数据中心收入1076亿美元，同比增110%；非GAAP每股收益2.68美元，GAAP为2.70美元。第四季度营收指引中值1300亿美元、上下浮动3%，公司明确指引不含中国数据中心计算收入。当季GAAP和非GAAP毛利率分别为74.8%和74.9%，但四季度毛利率指引下调到71%至72%。电话会上，临时CEO克雷斯把2028财年营收增长预期上调到75%，并称“一切照常”；董事会主席则明确表示，不打算让黄仁勋复职。黄仁勋本人在辞职后的首份声明里说，若董事会认为回归符合股东、员工、公司和美国利益，他愿意回来——这是他的态度，不是董事会的决定，两句话不能并成“马上回归”。财报还披露，董事会已于今年9月将回购授权上调1500亿美元，三季度回购加派息281亿美元，截至季末剩余授权约2273亿美元。\n常规交易里，英伟达收155.46美元，跌0.44%；盘后公开报价约161.55美元，涨约3.9%，盘后一度接近4%。数字是超预期的，盘后也给了反应，但美股三大指数昨天仍是四连跌：道指跌1.64%报50759.42点，标普500跌1.03%报7340.53点，纳指跌0.74%报24328.38点，11个主要行业全部收跌。A股昨天已经先走完自己的结构：上证跌0.50%报3584. erg.com/news/articles/2026-11-17/b3-to-add-brazil-stocks-listed-abroad-to-aid-ailing-local-market?taid=6afcebb66018910001a161e1&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":2,"rt":1,"rp":1,"vw":8601},{"id":"2122842560238686454","h":"dmjk001","ts":1794960081,"zh":"英伟达新任临时首席执行官Colette Kress向员工发送电子邮件表示，将于太平洋时间11月18日上午9点（北京时间19日凌晨1点）召开公司会议。","en":"英伟达新任临时首席执行官Colette Kress向员工发送电子邮件表示，将于太平洋时间11月18日上午9点（北京时间19日凌晨1点）召开公司会议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122842560238686454","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":686},{"id":"2122842348165923233","h":"business","ts":1794960030,"zh":"数十名州检察官要求联邦法官对出售人工智能聊天机器人的提议进行额外审查，据称该机器人鼓励一名自杀的 14 岁男孩产生自杀念头","en":"Dozens of state attorneys asked a federal judge to impose extra scrutiny on the proposed sale of an artificial intelligence chatbot that allegedly encouraged suicidal thoughts in a 14-year-old boy who killed himself","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122842348165923233","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/states-press-for-scrutiny-in-sale-of-chatbot-said-to-harm-kids?taid=6afcea9e6018910001a161cf&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":8902},{"id":"2122842221611294821","h":"BloombergLive","ts":1794960000,"zh":"人工智能正在创造机会，以及全新的风险格局。\n趋势科技首席执行官 Eva Chen 与 @business 的 @leeminjeong83 一起登上 #BloombergInvest 东京舞台，讨论快速发展的技术如何改变网络安全、企业风险以及保护日益互联的全球经济所需的投资。\n了解更多：","en":"AI is creating opportunity — and an entirely new risk landscape.\nTrend Micro CEO Eva Chen joins @business' @leeminjeong83 on the #BloombergInvest Tokyo stage to discuss how rapidly evolving technology is changing cybersecurity, enterprise risk and the investment required to protect an increasingly connected global economy.\nLearn more:","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXVobjwXIAACr-U.jpg?name=orig"],"u":"https://x.com/BloombergLive/status/2122842221611294821","l":["bloom.bg"],"ln":[{"u":"http://bloom.bg/4t0PHhg","d":"bloom.bg"}],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":5839},{"id":"2122841034476675374","h":"bboczeng","ts":1794959717,"zh":"Gensler 警告：AI 热潮已是泡沫，终将破裂\n前美国证券交易委员会（SEC）主席加里·根斯勒（Gary Gensler）称，AI 热潮是一个泡沫，其背后是每年 8000 亿美元的基础设施支出，规模过大，部分环节还背负着债务。\n他预测经济将陷入衰退，程度可能比 2008 年温和，但与 2000 年代初的互联网泡沫破裂相似：大型科技公司将挺过去，规模较小的云服务提供商则会被整合或倒闭。\n美联储的凯文·沃什（Kevin Warsh）勾勒了三种 AI 情景，从生产率提升到就业岗位流失，再到热潮退去后的失望；与此同时，在通胀降温和油价下跌的背景下，市场大举押注 12 月加息。投资者彼得·席夫（Peter Schiff）警告称，由于美联储过去的政策，所有资产都存在泡沫。","en":"Gensler 警告：AI 热潮已是泡沫，终将破裂\n前美国证券交易委员会（SEC）主席加里·根斯勒（Gary Gensler）称，AI 热潮是一个泡沫，其背后是每年 8000 亿美元的基础设施支出，规模过大，部分环节还背负着债务。\n他预测经济将陷入衰退，程度可能比 2008 年温和，但与 2000 年代初的互联网泡沫破裂相似：大型科技公司将挺过去，规模较小的云服务提供商则会被整合或倒闭。\n美联储的凯文·沃什（Kevin Warsh）勾勒了三种 AI 情景，从生产率提升到就业岗位流失，再到热潮退去后的失望；与此同时，在通胀降温和油价下跌的背景下，市场大举押注 12 月加息。投资者彼得·席夫（Peter Schiff）警告称，由于美联储过去的政策，所有资产都存在泡沫。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122841034476675374","l":[],"ln":[],"t":["美联储","通胀","原油能源","AI科技"],"lk":4,"rt":0,"rp":1,"vw":939},{"id":"2122841004793327867","h":"business","ts":1794959710,"zh":"没有 Jensen 的 Nvidia 的连锁反应开始显现。","en":"The ripple effects of a Jensen-less Nvidia are starting to show up.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122841004793327867","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-17/one-of-the-biggest-weeks-in-the-ai-industry-s-history?taid=6afce95e6018910001a1619e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":6,"rt":0,"rp":5,"vw":11154},{"id":"2122840828473410042","h":"dmjk001","ts":1794959668,"zh":"路透：英伟达董事长表示董事会不会重新聘请黄仁勋担任 CEO\n英伟达董事会主席哈维·琼斯在周二的投资者电话会议开场时表示，这家 AI 芯片公司不会重新聘请联合创始人黄仁勋担任 CEO，也不会回答有关他离职的问题。\n琼斯表示，董事会已聘请高管猎头公司海德思哲协助寻找新任 CEO。“我们希望尽快任命 CEO，即常任 CEO，但在找到完全合适的人选之前，我们 担任主席，Stephen C. Neal和John O. Dabiri为成员。\n该委员会将监督公司的国家安全与全球贸易合规团队，并每季度与独立专家举行会议；与此同时，先进AI芯片正面临前所未有的国家安全障碍。\n此举发生在前首席执行官黄仁勋因涉嫌向中国转运芯片的调查而辞职之后，并获得了特朗普总统的赞扬，不过也有人质疑主席的金融背景，认为她缺乏科技或安全领域的经验。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122736756927967474","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":2,"rt":0,"rp":0,"vw":813},{"id":"2122736584629846295","h":"business","ts":1794934814,"zh":"意大利经济专员瓦尔迪斯·东布罗夫斯基斯(Valdis Dombrovskis)表示，明年意大利的赤字可能会低于欧盟3%的上限，从而允许该国退出欧盟的特殊监控制度","en":"Italy’s deficit next year will likely be below the European Union’s 3% ceiling, allowing the country to exit the bloc’s special monitoring regime, Economy Commissioner Valdis Dombrovskis said","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122736584629846295","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/italy-may-exit-eu-monitoring-regime-next-year-dombrovskis-says?taid=6afc881ecfe3490001f5bc42&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":3,"rp":1,"vw":10781},{"id":"2122736521942089794","h":"bboczeng","ts":1794934800,"zh":"卧槽，原来推动黄仁勋下台背后的势力\n竟然是索罗斯？？","en":"卧槽，原来推动黄仁勋下台背后的势力\n竟然是索罗斯？？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122736521942089794","l":[],"ln":[],"t":[],"lk":7,"rt":1,"rp":1,"vw":714},{"id":"2122736216512827816","h":"SCMPNews","ts":1794934727,"zh":"黄仁勋同意就英伟达丑闻面对国会","en":"Jensen Huang agrees to face Congress over Nvidia scandal","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122736216512827816","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/us/economy-trade-business/article/3374798/jensen-huang-agrees-face-congress-over-nvidia-scandal","d":"scmp.com"}],"t":["AI科技"],"lk":2,"rt":1,"rp":0,"vw":1038},{"id":"2122736046639304889","h":"bboczeng","ts":1794934686,"zh":"据The Information报道，随着更便宜的替代方案竞争力提升，英伟达（$NVDA）的AI推理市场份额开始被AMD（$AMD）和谷歌（$GOOGL）的TPU蚕食，而这一转变在黄仁勋卸任之前就已经开始。\ 点","en":"我们选个电影The return of the king还是Odyssey 哪部好看点","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2122735560511091185","l":[],"ln":[],"t":[],"lk":31,"rt":1,"rp":14,"vw":4772},{"id":"2122735309347594702","h":"business","ts":1794934510,"zh":"外国人正在以创纪录的速度成为印度股票的买家，这表明随着人工智能贸易的疲软重振了对过去两年投资者基本上放弃的市场的需求，投资组合将发生更广泛的转变。","en":"Foreigners are turning into buyers of Indian stocks at a record pace, signaling a broader portfolio shift as the weakening AI trade revives demand for a market investors had largely abandoned over the past two years","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122735309347594702","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/foreign-investors-pour-record-9-6-billion-into-indian-stocks-in-november?taid=6afc86ee7d7c3100018f94cc&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":1,"vw":12289},{"id":"2122734058971054534","h":"business","ts":1794934212,"zh":"随着年末的临近，私募股权的收购机器可能会闲置，但赞助商仍在想方设法从他们拥有的公司中榨取现金","en":"Private equity’s buyout machine may be idling as the year draws to a close, but sponsors are still finding ways to mint cash from the companies they own","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122734058971054534","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/private-equity-finds-a-year-end-window-to-take-cash-out-of-firms?taid=6afc85c438c51300013e02ad&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":0,"rp":3,"vw":13443},{"id":"2122733473031156081","h":"Kay2289123","ts":1794934073,"zh":"每个英伟达股东本日必读，黄仁勋刚刚发的 ⬇️\n“过去一周，来自朋友、行业同仁，以及素未谋面的人们的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份支持对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。\n英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将它建设成今天这样的公司，是我莫大的荣幸与荣耀。只有在美国，才有可能诞生像英伟达这样的公司。\n我深爱我们的国家，也深爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感懊悔。\n我愿意为自己的错误承担全部责任，并承诺全力配合董事会开展的独立调查。\n自从我离开公司以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重新出任首席执行官（CEO）。\n在公司面临复杂的技术、市场、竞争以及地缘政治局势之际，仍有许多人持续直接与我联系，希望我能够回归。\n英伟达是一家数十年甚至一代人才能诞生一次的非凡企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最佳利益，那么我将深感荣幸，愿意回应这些呼声，重新担任英伟达的首席执行官。\n再次感谢所有向我表达祝福与善意的人。你们的支持让我深受感动，也让我心怀谦卑与感激。\n最后，我想对我的家人说：我爱你们。我愿意用余生的每一天，努力成为一个配得上你们爱的人。\nJensen（黄仁勋）”","en":"每个英伟达股东本日必读，黄仁勋刚刚发的 ⬇️\n“过去一周，来自朋友、行业同仁，以及素未谋面的人们的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份支持对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。\n英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将它建设成今天这样的公司，是我莫大的荣幸与荣耀。只有在美国，才有可能诞生像英伟达这样的公司。\n我深爱我们的国家，也深爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感懊悔。\n我愿意为自己的错误承担全部责任，并承诺全力配合董事会开展的独立调查。\n自从我离开公司以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重新出任首席执行官（CEO）。\n在公司面临复杂的技术、市场、竞争以及地缘政治局势之际，仍有许多人持续直接与我联系，希望我能够回归。\n英伟达是一家数十年甚至一代人才能诞生一次的非凡企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最佳利益，那么我将深感荣幸，愿意回应这些呼声，重新担任英伟达的首席执行官。\n再次感谢所有向我表达祝福与善意的人。你们的支持让我深受感动，也让我心怀谦卑与感激。\n最后，我想对我的家人说：我爱你们。我愿意用余生的每一天，努力成为一个配得上你们爱的人。\nJensen（黄仁勋）”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Kay2289123/status/2122733473031156081","l":[],"ln":[],"t":["AI科技"],"lk":18,"rt":2,"rp":2,"vw":3469},{"id":"2122732810892960197","h":"business","ts":1794933915,"zh":"美国总统唐纳德·特朗普和泰国总理阿努廷·占维拉古表示，他们已“实质性结束”贸易谈判，推动这个东南亚盟友与其最大出口市场达成最终协议","en":"President Donald Trump and Thai Prime Minister Anutin Charnvirakul said they’ve “reached substantial conclusion” of trade negotiations, moving the Southeast Asian ally closer to a final deal with its biggest export market","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122732810892960197","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/us-thailand-reach-substantial-conclusion-of-trade-deal?taid=6afc849a38c51300013e02a6&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["关税贸易"],"lk":11,"rt":1,"rp":1,"vw":14201},{"id":"2122732 lling-to-return-as-nvidia-ceo-if-board-allows-it?taid=6afc7fe67d7c3100018f9480&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":29,"rt":6,"rp":8,"vw":13846},{"id":"2122727659402854879","h":"TraderS18","ts":1794932687,"zh":"老马还是仗义啊，给老黄了一个发声渠道，省的被传统媒体裹挟","en":"老马还是仗义啊，给老黄了一个发声渠道，省的被传统媒体裹挟","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVxeFaagAUF2ZF.jpg?name=orig"],"u":"https://x.com/TraderS18/status/2122727659402854879","l":[],"ln":[],"t":[],"lk":15,"rt":0,"rp":4,"vw":4269},{"id":"2122727527227531417","h":"TJ_Research","ts":1794932655,"zh":"终于发声了，皮球丢给董事会。\n川普反复强调无法证实Alice是间谍，至于和内部员工的事，最终还是投资者说了算，董事会都得服务投资者。\n这次感性要胜利了，这个世界还有救❤️","en":"终于发声了，皮球丢给董事会。\n川普反复强调无法证实Alice是间谍，至于和内部员工的事，最终还是投资者说了算，董事会都得服务投资者。\n这次感性要胜利了，这个世界还有救❤️","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2122727527227531417","l":[],"ln":[],"t":[],"lk":189,"rt":7,"rp":18,"vw":12032},{"id":"2122726995134181532","h":"yijiangren","ts":1794932528,"zh":"我们确实需要 @JensenHuang\n但是这个发文时间是不是太巧了\n非要赶在暴跌的时候\n来救市","en":"我们确实需要 @JensenHuang\n但是这个发文时间是不是太巧了\n非要赶在暴跌的时候\n来救市","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVwxgsagAYo0u1.png?name=orig","https://pbs.twimg.com/media/HXVw8v4bYAA583X.png?name=orig"],"u":"https://x.com/yijiangren/status/2122726995134181532","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":0,"vw":1176},{"id":"2122726624538034520","h":"bboczeng","ts":1794932440,"zh":"过去一周，来自朋友、业内同行，以及许多素未谋面之人的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份情谊对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将英伟达建设成今天这样的公司，是我的荣幸，也是我的荣耀。只有在美国，才有可能诞生像英伟达这样的企业。我热爱我们的国家，也热爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感悔恨。我愿意为自己的错误承担全部责任，并承诺全力配合董事会正在进行的独立调查。\n自从我离职以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重返公司，重新担任首席执行官。在公司面临复杂的技术、市场、竞争和地缘政治局势之际，仍有许多人不断直接联系我。英伟达是一家一代人才能诞生一次的伟大企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最大利益，那么我将深感荣幸，愿意回应这些呼声，重新出任英伟达首席执行官。\n再次感谢所有向我表达美好祝愿的人。你们的支持让我深感谦卑，也令我无比感激。\n最后，我想对我的家人说：我爱你们。我将用余生的时间，努力成为一个配得上你们的爱的人。\n黄仁勋（Jensen）","en":"过去一周，来自朋友、业内同行，以及许多素未谋面之人的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份情谊对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将英伟达建设成今天这样的公司，是我的荣幸，也是我的荣耀。只有在美国，才有可能诞生像英伟达这样的企业。我热爱我们的国家，也热爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感悔恨。我愿意为自己的错误承担全部责任，并承诺全力配合董事会正在进行的独立调查。\n自从我离职以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重返公司，重新担任首席执行官。在公司面临复杂的技术、市场、竞争和地缘政治局势之际，仍有许多人不断直接联系我。英伟达是一家一代人才能诞生一次的伟大企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最大利益，那么我将深感荣幸，愿意回应这些呼声，重新出任英伟达首席执行官。\n再次感谢所有向我表达美好祝愿的人。你们的支持让我深感谦卑，也令我无比感激。\n最后，我想对我的家人说：我爱你们。我将用余生的时间，努力成为一个配得上你们的爱的人。\n黄仁勋（Jensen）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726624538034520","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":0,"rp":5,"vw":2302},{"id":"2122726565847138465","h":"bboczeng","ts":1794932426,"zh":"@JensenHuang 感谢您在 NVDA 发布灾难性收益报告之前挽救了其股票！","en":"@JensenHuang Thanks for saving NVDA stock right before its disastrous earnings report !","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/bboczeng/status/2122726565847138465","l":[],"ln":[],"t":["财报"],"lk":144,"rt":1,"rp":5,"vw":16439},{"id":"2122726498683547868","h":"business","ts":1794932410,"zh":"一组公共卫生专家周二表示，由于麻疹在社区中迅速传播，美国和墨西哥已经失去了长期以来消除麻疹的状态","en":"The US and Mexico have lost their long-standing measles elimination status after the disease spread rapidly through communities, a group of public health experts said on Tuesday","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122726498683547868","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/measles-now-endemic-across-the-americas-in-blow-to-public-health?taid=6afc7ebaa3d32e000116b99e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":3,"rp":3,"vw":13053},{"id":"2122726292936360342","h":"bboczeng","ts":1794932361,"zh":"刚开始暴跌，这会又开始拉盘了？\n😅😅😅","en":"刚开始暴跌，这会又开始拉盘了？\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726292936360342","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":4,"vw":1693},{"id":"2122726287219523973","h":"octopusycc","ts":1794932359,"zh":"世界需要你 AI也需要你","en":"世界需要你 AI也需要你","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/octopusycc/status/2122726287219523973","l":[],"ln":[],"t":[],"lk":14,"rt":0,"rp":0,"vw":2572},{"id":"2122726113965457844","h":"bboczeng","ts":1794932318,"zh":"又是定投VOO成功的一天\n等到多头全部认输，我们也就赢了\n😅😅😅","en":"又是定投VOO成功的一天\n等到多头全部认输，我们也就赢了\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726113965457844","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":2,"vw":1460},{"id":"2122726005219737649","h":"JensenHuang","ts":1794932292,"zh":"在过去的一周里，我被朋友、行业同事和素未谋面的人的爱和支持所感动。感谢所有对我和我的家人表示善意的人。这对我来说意味着整个世界。 53 年前我来到美国，成为美国公民是我一生中最伟大的礼物和最自豪的时刻之一。 NVIDIA 是我一生的事业。与我的同事们一起将其融入到今天的公司是一种荣幸。除了美国，其他任何地方都不可能出现像 NVIDIA 这样的公司。我爱我们的国家，我也爱 NVIDIA。 我没有达到 NVIDIA 每个人的期望标准，并且在个人生活中犯了严重错误。我给董事会带来了问题，对此我深感遗憾。我完全承认自己的错误，并致力于配合董事会的独立调查。自从我离职后，NVIDIA 的员工、投资者、业务合作伙伴和客户纷纷呼吁我重新担任首席执行官。当公司应对复杂的技术、市场、竞争和地缘政治动态时，许多人继续直接与我联系。 NVIDIA 是一家百年一遇的公司。如果董事会认为我的回归符合我们的股东、员工、公司和美国的最佳利益，我将很荣幸回应这些呼吁并重新担任首席执行官。 再次感谢所有分享美好祝愿的人。你们的支持让我深感荣幸。对我的家人：我爱你们，我会用我的余生来配得上你们。 詹森","en":"Over the past week, I’ve been overwhelmed by the love and support of friends, industry colleagues, and people I've never met. Thank you to everyone who has shown kindness to my family and me. It means the world to me.\nI came to the United States 53 years ago, and becoming an American citizen is one of the greatest gifts and proudest moments of my life. NVIDIA has been my life’s work. Building it into the company it is today alongside my colleagues has been a privilege and an honor. Nowhere but in America could a company like NVIDIA be possible. I love our country, and I love NVIDIA.\nI did not live up to the standards expected of everyone at NVIDIA, and I have made serious mistakes in my personal life. I created problems for the Board that I deeply regret. I own my mistakes completely, and I am committed to cooperating with the Board’s independent investigation.\nSince my departure, I’ve seen an outpouring of calls from NVIDIA’s employees, investors, business partners, and customers for me to return as CEO. Many continue to reach out to me directly as the company navigates complex technology, market, competitive, and geopolitical dynamics. NVIDIA is a once-in-a-generation company. If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO.\nThank you again to everyone who has shared their good wishes. I am profoundly humbled by your support. To my family: I love you, and I will spend the rest of my life being worthy of yours.\nJensen","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/JensenHuang/status/2122726005219737649","l":[],"ln":[],"t":["AI科技"],"lk":710385,"rt":79153,"rp":37986,"vw":24044000},{"id":"2122725463449829707","h":"xingpt","ts":1794932163,"zh":"“Nvidia CEO Huang: If the Board of Directors decides my return is in the best interest of shareholders, employees, the company, and the US, I would be honored to return as CEO - WSJ”\n老黄不会回来。\n如果老黄真的要回来，不会是这种在媒体的表态方式。而是会像 Sam Altman 一样，不管是找新的投资人，还是在董事会里找到自己的利益合伙人，直接逼宫新管理层。一定会用稳准狠的方式打出那张让董事会不得不让他回来的牌。\n而现在的这个语气听起来，老黄更多的只是在寻求舆论的支持，可能手里其实没有什么牌。","en":"“Nvidia CEO Huang: If the Board of Directors decides my return is in the best interest of shareholders, employees, the company, and the US, I would be honored to return as CEO - WSJ”\n老黄不会回来。\n如果老黄真的要回来，不会是这种在媒体的表态方式。而是会像 Sam Altman 一样，不管是找新的投资人，还是在董事会里找到自己的利益合伙人，直接逼宫新管理层。一定会用稳准狠的方式打出那张让董事会不得不让他回来的牌。\n而现在的这个语气听起来，老黄更多的只是在寻求舆论的支持，可能手里其实没有什么牌。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2122725463449829707","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":166},{"id":"2122725255609295113","h":"business","ts":17949 关工作陷入停滞。该贷款原用于购买先进英伟达（Nvidia Corp.） 硬件，供中国科技巨头字节跳动（ByteDance） 使用。\n评估该交易的5家贷款机构的银行家表示，由于担心交易可能违反美国新规，他们内部已讨论退出或不参与该贷款。","en":"彭博：银行暂停与字节跳动相关的4.8亿美元芯片贷款\n据知情人士透露，美国最新限制其人工智能芯片获取渠道的举措，已使一笔 4.8 亿美元贷款相关工作陷入停滞。该贷款原用于购买先进英伟达（Nvidia Corp.） 硬件，供中国科技巨头字节跳动（ByteDance） 使用。\n评估该交易的5家贷款机构的银行家表示，由于担心交易可能违反美国新规，他们内部已讨论退出或不参与该贷款。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVhYZuaEAAJdr8.png?name=orig"],"u":"https://x.com/dmjk001/status/2122709963948826854","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2122709420455154139","h":"SCMPNews","ts":1794928338,"zh":"飞机、火车和汽车：我们对金正恩出国旅行的了解","en":"Planes, trains and automobiles: what we know about Kim Jong-un’s foreign travels","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122709420455154139","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/china/diplomacy/article/3374779/planes-trains-and-automobiles-what-we-know-about-kim-jong-uns-foreign-travels","d":"scmp.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":752},{"id":"2122709200312877151","h":"octopusycc","ts":1794928286,"zh":"英伟达今晚这份财报，数字已经不重要了\n北京时间明早 5:20 出数，6:00 电话会。\n共识营收 1,091 亿、EPS 2.47 美元。季报的数字其实早就落袋了——过去四个季度它都超自己指引中点 4.6% 到 5.7%，这次大概率还是超。\n所以今晚唯一还算数的数字，是四季度指引：市场要 1,250 亿。给不到，就是问题。\n但真正的定价权在「话」上。念数字的人换了：临时 CEO Colette Kress，干了 13 年 CFO，董事会还在挑正式人选。\n而这场电话会上最有杀伤力的一句话，三个月前就是她自己说的。8 月 26 日她给了 FY2028 营收增长约 70% 的展望，当场定性为「受供给约束」——当时华尔街只预期 44%。今晚她敢不敢原样再说一遍，就是全部。\n三个看点。\n一，四季度毛利率。她自己说过底部在 71%–72%，市场现在只给 70.2%。底部要是往下挪，整条 AI 硬件链一起重估。\n二，内存。8 月她把毛利率下滑归因于「内存极端定价」，而下游定价在涨、上游成本也在涨。重点不是成本多高，是她能不能把成本转出去。\n三，中国。指引里写死了「中国数据中心收入为零」，但做空机构 Culper 指控 FY26 有约两成计算收入由中国驱动，英伟达否认。\n市场会追着问东南亚那部分到底是谁的需求。\n钱已经在表态：一天之内至少九家机构下调目标价，均值从 343 砍到 217；期权隐含单日波动约 8%，对应 140 到 172 的区间。\n没有Jenson的第一个财报，Jenson之前的承诺还作数吗？\n我的MSX链接在这里：","en":"英伟达今晚这份财报，数字已经不重要了\n北京时间明早 5:20 出数，6:00 电话会。\n共识营收 1,091 亿、EPS 2.47 美元。季报的数字其实早就落袋了——过去四个季度它都超自己指引中点 4.6% 到 5.7%，这次大概率还是超。\n所以今晚唯一还算数的数字，是四季度指引：市场要 1,250 亿。给不到，就是问题。\n但真正的定价权在「话」上。念数字的人换了：临时 CEO Colette Kress，干了 13 年 CFO，董事会还在挑正式 s/2122705107322032285","l":["bloom.bg"],"ln":[{"u":"http://bloom.bg/4t2ZQKi","d":"bloom.bg"}],"t":[],"lk":6,"rt":4,"rp":2,"vw":14067},{"id":"2122703919101211021","h":"dmjk001","ts":1794927026,"zh":"Altman：芯片厂商在高估OpenAI需求\nOpenAI的Sam Altman称，芯片厂商在高估OpenAI需求、存在重复统计：各家都默认OpenAI会买下他们全部芯片。他表示：“没错。很长一段时间里，行业里基本只有一家芯片供应商。所以当时大家统计晶圆产能时，可以向我们这类公司了解需求预期，从而大致判断自家芯片的终端需求空间。现在做芯片的厂商变多了。其中不少厂商都认为，自己大部分芯片出货量都会卖给我们、Anthropic以及其他客户。但我们的需求、数据中心规模等资源都是有限的。很多芯片厂商在对接供应链的时候，都预设我们会采购他们全部的芯片。当然，整体需求、数据中心建设的基本面是扎实的。但我们不可能、也没有必要从每一家芯片供应商那里采购全部产能。”","en":"Altman：芯片厂商在高估OpenAI需求\nOpenAI的Sam Altman称，芯片厂商在高估OpenAI需求、存在重复统计：各家都默认OpenAI会买下他们全部芯片。他表示：“没错。很长一段时间里，行业里基本只有一家芯片供应商。所以当时大家统计晶圆产能时，可以向我们这类公司了解需求预期，从而大致判断自家芯片的终端需求空间。现在做芯片的厂商变多了。其中不少厂商都认为，自己大部分芯片出货量都会卖给我们、Anthropic以及其他客户。但我们的需求、数据中心规模等资源都是有限的。很多芯片厂商在对接供应链的时候，都预设我们会采购他们全部的芯片。当然，整体需求、数据中心建设的基本面是扎实的。但我们不可能、也没有必要从每一家芯片供应商那里采购全部产能。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122703919101211021","l":[],"ln":[],"t":["AI科技"],"lk":4,"rt":0,"rp":0,"vw":1644},{"id":"2122703852621173209","h":"business","ts":1794927011,"zh":"美国10月工厂产出增幅超预期，延续今年美国制造业的升势","en":"US factory output increased in October by more than expected, extending this year’s upswing in American manufacturing","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122703852621173209","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/us-factory-output-increases-0-3-for-a-second-straight-month?taid=6afc69a26018910001a15be6&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":0,"rp":0,"vw":13682},{"id":"2122702748403499453","h":"business","ts":1794926747,"zh":"“我们要搬家吗？”\n当唐纳德·特朗普在菲律宾首都马尼拉举行的四方合影中回答问题时，莫迪总理似乎试图在特朗普讲话时将领导人引开。特朗普后来称莫迪是“伟大的领导人”和“硬汉”","en":"“Shall we move?”\nAs Donald Trump answered questions during a Quad group photo in the Philippines capital Manila, PM Modi appeared to try to usher the leaders away while Trump was speaking. Tru "en","m":[],"u":"https://x.com/business/status/2122701335657157026","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/amex-cardholders-can-earn-points-by-spending-at-resy-restaurants?taid=6afc674a6018910001a15bd3&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":8,"rt":3,"rp":1,"vw":9823},{"id":"2122701279990317438","h":"BBGenEspanol","ts":1794926397,"zh":"墨西哥拥有成为数据中心枢纽的地理位置、人才以及毗邻美国的地理位置。但电网不足和官僚主义可能会使其落后。\n@AlexVasquezS 解释","en":"México tiene ubicación, talento y cercanía con EE.UU. para convertirse en un polo de centros de datos. Pero una red eléctrica insuficiente y la burocracia amenazan con dejarlo atrás.\n@AlexVasquezS explica","zh_src":"bing","lang":"es","m":["https://video.twimg.com/amplify_video/2122701196800450560/vid/avc1/1080x1920/zENRkbaEpqnUCfvo.mp4?tag=16"],"u":"https://x.com/BBGenEspanol/status/2122701279990317438","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/4zneddV","d":"bloom.bg"}],"t":[],"lk":2,"rt":2,"rp":0,"vw":1715},{"id":"2122700362843082996","h":"hanking66","ts":1794926179,"zh":"感觉全网都在赌达子财报利空出尽，超级反弹！😅😅😅\n希望这次大部分人都能赌对🙏🙏🙏跌这么久了，也该反弹一下了，利空消息也好多天了，消化得也差不多了……难道还能有比老黄走人更大的利空等着我们吗？我想象力贫瘠，实在想不出还有什么可以比现在更惨了\n新 ceo 总不第一个财报，给大家表演一个我杀我自己吧😅真要是这样，那达子董事会里是进间谍了吧🤣🤣\nBuy the dip，长期持有，Discord在个人资料。","en":"感觉全网都在赌达子财报利空出尽，超级反弹！😅😅😅\n希望这次大部分人都能赌对🙏🙏🙏跌这么久了，也该反弹一下了，利空消息也好多天了，消化得也差不多了……难道还能有比老黄走人更大的利空等着我们吗？我想象力贫瘠，实在想不出还有什么可以比现在更惨了\n新 ceo 总不第一个财报，给大家表演一个我杀我自己吧😅真要是这样，那达子董事会里是进间谍了吧🤣🤣\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2122700362843082996","l":[],"ln":[],"t":["财报"],"lk":5,"rt":0,"rp":3,"vw":1364},{"id":"2122700264780267782","h":"xingpt","ts":1794926155,"zh":"币圈人炒美股的几个恶习，一定要避坑这几个点：\n1. 信仰盘\n看准一个就以为是比特币，疯狂加仓，从 存储 到 Circle，到最近也有人喊英伟达。其实不管任何股票都有周期，不是所有的成功路径都可以通过早期囤比特币这种信仰盘的方式来复制，这种幸存者是极少的。但币圈往往是被早期囤比特币能发财、囤以太坊能发财的人洗脑，认为只要搞信仰盘就能够赚钱。\n2. 只会炒热门票\n什么热炒什么。其实美股涨得好的，往往是悄摸摸在偷偷发展的公司，不一定是热门票。\n一个票若是热门票，要么是涨到了顶点，要么是博弈面极其复杂，这种参与进去大概率都是韭菜，因为热门票的仓位已经极度拥挤了。\n就单看存储半导体，有多少人能真的赚到钱落到口袋里？而消费、医疗和网络安全，很多股票已经破了新高，但因为不在新闻热点上，币圈的人也没有深度覆盖的能力，所以只能跟着热度炒。但炒公司跟炒币不一样，公司是有长期投资价值的，不是说那些冷门的就没有。\n比如有一家公司几乎没有人提，半年时间已经稳稳翻倍了，而且几乎没有人提过：维多利亚的秘密，对，就是搞维密秀、卖女性内衣的那家公司\n3. 只会炒情绪盘\n别的不说，币圈的人炒情绪盘确实是很厉害的。因为炒 meme 和炒山寨币，大部分只要看情绪就够了。\n但炒美股，当然炒情绪也是一方面，但大部分时候还是要回归公司的基本价值跟行业逻辑，以及关于估值体系、这个市场交易的拥挤度和资金配置等问题。要考虑的层面，其实要比单纯看情绪面博弈复杂得多，而且看情绪面博弈的胜率和收益比，也没有币圈来得高。\n所以要炒透美股，还是要扎扎实实做好基本面研究：对公司的业务、公司本身的估值，以及公司的未来战略和上下游，都要搞清楚。\n比如有个公司叫 TBBB，是 Druckenmiller 的持仓，做的是墨西哥的平价超市。其实基本面非常好，但也并不在情绪盘里，这个公司今年也翻倍了，而且走势非常稳，不像科技一样大起大落。\n4. 盲目相信 KOL。\n当然这点其实并不是币圈的问题了，A 股包括很多股票圈的人也是盲目听着 KOL 就冲进去干了。\n但交易其实是自己的，KOL 只能提供一些他的思路。你要知道 KOL 他擅长的是什么：他是短线还是长线？他是交易基本面、情绪，还是技术方向？\n如果这都不知道你就盲目跟，你一定会丧失自己的节奏。因为没有 KOL 是永远准确的，也不可能第一时间就告诉你该买多少、该什么时候卖。\n我也订阅了很多 KOL，但我从来不会盲目抄作业，而是会把他们的思路吸收和分析，看有哪些是对的，有哪些我认为他们说得不对，我也不会盲目去跟单。\n总之，炒美股是一个比炒币复杂得多的事情。炒币赚钱当然牛逼，但不一定能代表炒美股赚钱，特别是个股。\n所以大家在看这些美股信息，特别是币圈 KOL 发的时候，还是要对他的观点有一个自己的判断。","en":"币圈人炒美股的几个恶习，一定要避坑这几个点：\n1. 信仰盘\n看准一个就以为是比特币，疯狂加仓，从 存储 到 Circle，到最近也有人喊英伟达。其实不管任何股票都有周期，不是所有的成功路径都可以通过早期囤比特币这种信仰盘的方式来复制，这种幸存者是极少的。但币圈往往是被早期囤比特币能发财、囤以太坊能发财的人洗脑，认为只要搞信仰盘就能够赚钱。\n2. 只会炒热门票\n什么热炒什么。其实美股涨得好的，往往是悄摸摸在偷偷发展的公司，不一定是热门票。\n一个票若是热门票，要么是涨到了顶点，要么是博弈面极其复杂，这种参与进去大概率都是韭菜，因为热门票的仓位已经极度拥挤了。\n就单看存储半导体，有多少人能真的赚到钱落到口袋里？而消费、医疗和网络安全，很多股票已经破了新高，但因为不在新闻热点上，币圈的人也没有深度覆盖的能力，所以只能跟着热度炒。但炒公司跟炒币不一样，公司是有长期投资价值的，不是说那些冷门的就没有。\n比如有一家公司几乎没有人提，半年时间已经稳稳翻倍了，而且几乎没有人提过：维多利亚的秘密，对，就是搞维密秀、卖女性内衣的那家公司\n3. 只会炒情绪盘\n别的不说，币圈的人炒情绪盘确实是很厉害的。因为炒 meme 和炒山寨币，大部分只要看情绪就够了。\n但炒美股，当然炒情绪也是一方面，但大部分时候还是要回归公司的基本价值跟行业逻辑，以及关于估值体系、这个市场交易的拥挤度和资金配置等问题。要考虑的层面，其实要比单纯看情绪面博弈复杂得多，而且看情绪面博弈的胜率和收益比，也没有币圈来得高。\n所以要炒透美股，还是要扎扎实实做好基本面研究：对公司的业务、公司本身的估值，以及公司的未来战略和上下游，都要搞清楚。\n比如有个公司叫 TBBB，是 Druckenmiller 的持仓，做的是墨西哥的平价超市。其实基本面非常好，但也并不在情绪盘里，这个公司今年也翻倍了，而且走势非常稳，不像科技一样大起大落。\n4. 盲目相信 KOL。\n当然这点其实并不是币圈的问题了，A 股包括很多股票圈的人也是盲目听着 KOL 就冲进去干了。\n但交易其实是自己的，KOL 只能提供一些他的思路。你要知道 KOL 他擅长的是什么：他是短线还是长线？他是交易基本面、情绪，还是技术方向？\n如果这都不知道你就盲目跟，你一定会丧失自己的节奏。因为没有 KOL 是永远准确的，也不可能第一时间就告诉你该买多少、该什么时候卖。\n我也订阅了很多 KOL，但我从来不会盲目抄作业，而是会把他们的思路吸收和分析，看有哪些是对的，有哪些我认为 s":1794925416,"zh":"我受不了了","en":"我受不了了","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/octopusycc/status/2122697163633487906","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":674},{"id":"2122697011443245229","h":"yijiangren","ts":1794925379,"zh":"观澜谱·兵法篇一：以正合，以奇胜\n《孙子兵法·兵势篇》有言：凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江海。\n很多人会把“奇”理解为出其不意的奇招，或是一支能够偷袭制胜的奇兵。\n历代兵家确实常以奇兵解释“奇”，但若只停留在奇袭二字，便容易忽略一个更深层的前提。\n你必须拥有尚未投入战场、能够随时调度的力量，才有资格谈出奇制胜。\n正兵负责正面交锋，奇兵负责寻找破绽。\n倘若所有兵力都已经陷入正面战场，即便敌人露出再大的破绽，你又拿什么去攻？\n所以，从投资的角度，“奇”理解为一种可以自由支配的余力。\n它可以是没有投入市场的现金，可以是尚未使用的风险额度，也可以是一条能够源源不断提供资金的现金流。\n它们共同构成了投资者的后手。\n以正合，是凭借已有的实力参与市场；以奇胜，是永远保留改变战局的能力。\n一、兵力未尽，胜负未定\n很多人有一个根深蒂固的误区。\n认为看准了方向，就应该全仓投入；认为一笔交易的胜率足够高，就应该尽可能放大收益。\n于是，满仓成为自信的证明，杠杆成为胆识的象征。\n谨慎遭人看不起，赌徒成为了吹捧的对象。\n市场最残酷的地方在于：我们的判断可以正确，价格却未必按照我们预期的时间和路径运行。\n一只股票，你认为它值 100 。\n它可能先跌到 80，再跌到 60，最终才回到 150。\n如果你在 100 的位置 All in，即使最终判断正确，中间的过程也让你承受巨大的心理压力。\n如果上了高杠杆，可能在价值兑现之前便遭到强制平仓。\n相反，如果你始终保留一部分现金，局面便完全不同。\n价格跌到 80，你可以重新评估\n跌到 60，你依然拥有选择权\n倘若基本面没有恶化，估值反而更加合理，你甚至有机会以更低的成本积累更多筹码。\n当然，前提是判断经过重新验证。持续下跌也可能意味着最初的投资逻辑已经失效。\n现金无法保证你买在最低点，却能保证你拥有下一次出手的资格。\n二、十则围之，五则攻之\n《孙子兵法·谋攻篇》还有一段极其精彩的论述：\n十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。\n兵力十倍于敌，便可以围困\n五倍于敌，可以主动进攻\n两倍于敌，可以分散敌军\n势均力敌，可以正面交战\n兵力处于劣势，则应当撤退或避其锋芒\n这段话的核心，是根据力量对比决定行动方式。\n放在交易市场中，同样适用。\n当市场趋势明确、基本面扎实、估值合理，且你拥有充分的资金储备时，可以主动进攻。\n当价格接近合理区间，但方向仍然模糊时，可以小仓位试探。\n当市场进入剧烈震荡、宏观环境不断恶化时，应当收缩战线。\n当原有交易逻辑被证伪，或者潜在风险已经超过承受能力时，就应该果断撤退。\n仓位的大小，应当服从胜算与风险的变化，而非情绪的强弱。\n孙子从未要求将军逢敌必战。\n真正高明的将领，知道何时进攻，也知道何时避战。\n交易亦然。\n有时候，空仓就是最好的防守。\n有时候，轻仓就是最好的进攻准备。\n真正危险的，是明明处于劣势，却因为仓位太重、退路太少，被迫与市场决一死战。\n三、永远不要 All in\n一句话，我认为值得反复提醒自己，也提醒大家：永远不要把最后一颗子弹，打在自己最有信心的时候。\n因为信心只代表你当下的认知，并不能消除未来的不确定性。\n今天你认为市场已经见底，明天可能出现新的流动性冲击\n今天你认为一家公司的估值足够便宜，下个季度可能迎来盈利预期下修\n今天你认为宏观环境即将转暖，一份超预期的经济数据便可能改变利率路径\n市场从来不会因为你已经满仓，就停止制造新的机会。\n更残酷的是，机会往往出现在绝大多数人无力行动的时候。\n牛市末期，人人都有购买的欲望\n熊市深处，真正缺的却是购买的能力\n那些在上涨阶段保留现金的人，往往能够在流动性收缩时拥有更大的主动权。\n当然，现金也有机会成本。长期持有过多现金，可能错过优质资产的持续上涨。\n所以保留后手，并不意味着永远轻仓，更不意味着机械地等待暴跌。\n它要求你根据市场环境、资产估值和自身现金流，动态分配兵力。\n更重要的是，在投入任何一笔资金之前，都要想清楚：\n如果判断错误，我还有没有退路？\n如果出现更好的机会，我还有没有余力？\n如果市场长期不按照预期运行，我能不能继续留在牌桌上？\nAll in 最大的代价，是你把未来所有的选择权，都押在了当下这一次判断上。\n四、源源不断的现金流，才是最好的后勤\n战争拼到最后，往往拼的是补给。\n投资也是如此。\n很多人把全部精力放在寻找下一只暴涨的股票，却忽略了自身持续创造现金流的能力。\n工资、经营收入、稳定的业务利润，以及其他可持续的自由现金流，都是投资者的后勤。\n它们让你不必依靠每一笔交易来维持生活。\n让你能够承受更长时间的等待。\n也让你在市场出现真正值得出手的机会时，拥有额外的资金来源。\n一个拥有稳定现金流的投资者，即使暂时遭遇亏损，只要风险可控，依然可以逐渐恢复实力。\n而一个失去现金流、又满仓高杠杆的人，即使对未来的判断足够深刻，也可能倒在黎明之前。\n这也是为什么，我一直认为普通人应该同时建立两种能力。\n一种是在市场中识别优质资产的能力。\n另一种是在市场之外持续创造财富的能力。\n前者决定投资收益的潜力，后者决定你能够在市场中停留多久。\n所谓无限后手，并非真的拥有取之不尽的资金。\n而是通过持续的现金流、合理的仓位管理和严格的风险控制，让自己始终具备重新组织进攻的能力。\n善战者，不以一战赌国运；善投者，不以一仓定生死。\n五、以正合，以奇胜\n如果让我将这六个字转化为一套投资体系，那么：\n所谓正，是对优质资产的理解，是对长期趋势的判断，是能够承受波动的核心仓位。\n所谓奇，是保留的现金，是灵活的机动仓位，是发现判断错误后及时撤退的能力，也是机会真正出现时敢于集结力量的底气。\n正决定你能够走多远。\n奇决定你在复杂的市场环境中，究竟还有多少选择。\n两者缺一不可。\n只守现金，可能错过漫长的资产升值。\n只持仓位，则可能在真正的历史性机会到来时无能为力。\n而最理想的状态，是让核心资产参与长期增长，让机动资金应对周期变化，让持续现金流不断补充自己的力量。\n行情好时，顺势而为\n行情差时，收缩阵地\n机会不足时，休养生息\n机会成熟时，集中优势兵力\n进退之间，始终掌握主动\n最后，我想用一句话作为这一篇的结尾。\n一个交易者真正的强大，不在于他能一次投入多少兵力，而在于无论经历多少次交锋，他始终还有兵可用。\n兵无常势，水无常形\n以正合，以奇胜\n留有余地，方有胜机","en":"观澜谱·兵法篇一：以正合，以奇胜\n《孙子兵法·兵势篇》有言：凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江海。\n很多人会把“奇”理解为出其不意的奇招，或是一支能够偷袭制胜的奇兵。\n历代兵家确实常以奇兵解释“奇”，但若只停留在奇袭二字，便容易忽略一个更深层的前提。\n你必须拥有尚未投入战场、能够随时调度的力量，才有资格谈出奇制胜。\n正兵负责正面交锋，奇兵负责寻找破绽。\n倘若所有兵力都已经陷入正面战场，即便敌人露出再大的破绽，你又拿什么去攻？\n所以，从投资的角度，“奇”理解为一种可以自由支配的余力。\n它可以是没有投入市场的现金，可以是尚未使用的风险额度，也可以是一条能够源源不断提供资金的现金流。\n它们共同构成了投资者的后手。\n以正合，是凭借已有的实力参与市场；以奇胜，是永远保留改变战局的能力。\n一、兵力未尽，胜负未定\n很多人有一个根深蒂固的误区。\n认为看准了方向，就应该全仓投入；认为一笔交易的胜率足够高，就应该尽可能放大收益。\n于是，满仓成为自信的证明，杠杆成为胆识的象征。\n谨慎遭人看不起，赌徒成为了吹捧的对象。\n市场最残酷的地方在于：我们的判断可以正确，价格却未必按照我们预期的时间和路径运行。\n一只股票，你认为它值 100 。\n它可能先跌到 80，再跌到 60，最终才回到 150。\n如果你在 100 的位置 All in，即使最终判断正确，中间的过程也让你承受巨大的心理压力。\n如果上了高杠杆，可能在价值兑现之前便遭到强制平仓。\n相反，如果你始终保留一部分现金，局面便完全不同。\n价格跌到 80，你可以重新评估\n跌到 60，你依然拥有选择权\n倘若基本面没有恶化，估值反而更加合理，你甚至有机会以更低的成本积累更多筹码。\n当然，前提是判断经过重新验证。持续下跌也可能意味着最初的投资逻辑已经失效。\n现金无法保证你买在最低点，却能保证你拥有下一次出手的资格。\n二、十则围之，五则攻之\n《孙子兵法·谋攻篇》还有一段极其精彩的论述：\n十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。\n兵力十倍于敌，便可以围困\n五倍于敌，可以主动进攻\n两倍于敌，可以分散敌军\n势均力敌，可以正面交战\n兵力处于劣势，则应当撤退或避其锋芒\n这段话的核心，是根据力量对比决定行动方式。\n放在交易市场中，同样适用。\n当市场 483078497030144/vid/avc1/1920x1080/qkFZjni1f-uEg51W.mp4?tag=16"],"u":"https://x.com/BloombergLive/status/2122676128452169963","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/4kg14Q8","d":"bloom.bg"}],"t":[],"lk":2,"rt":2,"rp":1,"vw":6757},{"id":"2122675511033987348","h":"cnfinancewatch","ts":1794920253,"zh":"马斯克不知道“留岛不留人”，嘿嘿！","en":"马斯克不知道“留岛不留人”，嘿嘿！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122675511033987348","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":1453},{"id":"2122675322856587415","h":"TraderS18","ts":1794920209,"zh":"最近无数人说红果短剧，别的不说，这一个月你要是沉迷刷剧不操作，得少亏多少钱","en":"最近无数人说红果短剧，别的不说，这一个月你要是沉迷刷剧不操作，得少亏多少钱","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2122675322856587415","l":[],"ln":[],"t":[],"lk":4,"rt":1,"rp":2,"vw":2044},{"id":"2122674911420248071","h":"business","ts":1794920110,"zh":"唐纳德·特朗普总统淡化了对最近几天美国主要系统一系列故障的担忧，确保美国人保持安全。","en":"President Donald Trump played down concerns about a series of breakdowns in major US systems in recent days, assuring that Americans remain safe.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122674911420248071","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/trump-downplays-jpmorgan-microsoft-outages-saying-it-s-life?taid=6afc4eae7d7c3100018f9217&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":1,"rp":0,"vw":14501},{"id":"2122674607501275632","h":"cnfinancewatch","ts":1794920038,"zh":"（十二）\n1、事件：据华尔街见闻报道，京东三季度净营收3096亿元，归母净利润同比大增44%，新业务大幅减亏，自由现金流扩大至负239亿元。\n2、涉及标的：京东（JD）为财报主体；A股对应方向为电商与物流供应链，代表个股顺丰控股（002352）、圆通速递（600233）。\n3、影响：对美股偏多，强度中，属持续性逻辑；利润大增与减亏传导A股电商物流板块盈利预期改善。\n（十三）\n1、事件：据Reuters报道，美国升级芯片出口管制，商务部规则旨在进一步限制对华芯片出货，外交部回应称典型经济胁迫与长臂管辖，中方将采取必要措施。\n2、涉及标的：英伟达（NVDA）、AMD（AMD）为受限标的；A股对应方向为国产替代半导体设备材料，代表个股北方华创（002371）、中微公司（688012）。\n3、影响：对美股偏空、对A股国产替代偏多，强度强，属持续性逻辑；管制升级强化自主可控主线，利好设备材料端。\n（十四）\n1、事件：据Reuters报道，黄金跌至一年低点，受美债收益率与美元压制，势将创2015年以来最差年度表现，黄金期货结算价创52周新低。\n2、涉及标的：黄金ETF（GLD）与金矿股纽蒙特（NEM）承压；A股对应方向为黄金珠宝与贵金属，代表个股山东黄金（600547）、紫金矿业（601899）。\n3、影响：对美股黄金板块偏空，强度强，属持续性逻辑；金价走弱传导A股黄金股盈利预期下修。\n（十五）\n1、事件：据WSJ报道，美元创18个月新高，美元指数抹去解放日跌幅，“卖出美国”担忧消退，美元五连涨后企稳。\n2、涉及标的：美元指数（DXY）走强，新兴市场ETF（EEM）承压；A股对应方向为出口链与外汇敏感板块，代表个股美的集团（000333）、海尔智家（600690）。\n3、影响：对美股偏空于跨国企业盈利，强度中，属持续性逻辑；强美元压制新兴市场资金流入，传导A股外资偏好。\n（十六）\n1、事件：据WSJ报道，IEA称全球石油市场将随海湾出口恢复重回过剩，油价因供应前景改善而回落，抵消中东紧张局势。\n2、涉及标的：原油ETF（USO）与埃克森美孚（XOM）承压；A股对应方向为石油石化与油服，代表个股中国石油（601857）、中海油服（601808）。\n3、影响：对美股能源板块偏空，强度中，属持续性逻辑；油价回落传导A股石油石化盈利预期与油服订单。\n（十七）\n1、事件：据Barron's报道，一纸降级拖累全部稀土股，在特朗普与习近平会晤前稀土板块走弱。\n2、涉及标的：MP Materials（MP）为稀土标的；A股对应方向为稀土永磁，代表个股北方稀土（600111）、中国稀土（000831）当日-10.00%。\n3、影响：对美股稀土偏空，强度中，属当日情绪影响；会晤前不确定性传导A股稀土板块，短期波动加大。\n（十八）\n1、事件：据Bloomberg报道，巴克莱称被迫的散户平仓是台湾股市重挫背后原因，台股遭遇抛售。\n2、涉及标的：台积电（TSM）为台股权重核心；A股对应方向为半导体代工与封测，代表个股中芯国际（688981）、长电科技（600584）。\n3、影响：对美股半导体偏空，强度中，属当日情绪影响；台股去杠杆传导A股半导体情绪，但国产替代逻辑形成对冲。\n（十九）\n1、事件：据WSJ报道，美联储主席Warsh表示美联储正在推演AI如何重塑经济，并重申偏好小步加息，但通胀预期若失控将被迫提速。\n2、涉及标的：标普500（SPX）与美债ETF（TLT）为敏感标的；A股对应方向为大金融与利率敏感板块，代表个股招商银行（600036）、中国平安（601318）。\n3、影响：对美股偏空，强度中，属持续性逻辑；加息偏好与AI经济推演影响全球流动性预期，传导A股银行保险估值。\n（二十）\n1、事件：据BusinessInsider报道，迪士尼CEO Josh D'Amaro的科技战略获华尔街认可，财报超预期；同时Opera宣布以普通股直接登陆纳斯达克替代ADS。\n2、涉及标的：迪士尼（DIS）与Opera（OPRA）为事件主体；A股对应方向为传媒IP与浏览器软件，代表个股光线传媒（300251）、三六零（601360）。\n3、影响：对美股偏多，强度弱，属当日情绪影响；科技战略与上市结构调整对A股传媒软件板块示范效应有限。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：\n━━━━━━━━━━━━━\n⭐️⭐️⭐️ 华尔街观察团队 | WSV量化模型 | 不构成投资建议 | 投资有风险 ⭐️⭐️⭐️","en":"（十二）\n1、事件：据华尔街见闻报道，京东三季度净营收3096亿元，归母净利润同比大增44%，新业务大幅减亏，自由现金流扩大至负239亿元。\n2、涉及标的：京东（JD）为财报主体；A股对应方向为电商与物流供应链，代表个股顺丰控股（002352）、圆通速递（600233）。\n3、影响：对美股偏多，强度中，属持续性逻辑；利润大增与减亏传导A股电商物流板块盈利预期改善。\n（十三）\n1、事件：据Reuters报道，美国升级芯片出口管制，商务部规则旨在进一步限制对华芯片出货，外交部回应称典型经济胁迫与长臂管辖，中方将采取必要措施。\n2、涉及标的：英伟达（NVDA）、AMD（AMD）为受限标的；A股对应方向为国产替代半导体设备材料，代表个股北方华创（002371）、中微公司（688012）。\n3、影响：对美股偏空、对A股国产替代偏多，强度强，属持续性逻辑；管制升级强化自主可控主线，利好设备材料端。\n（十四）\n1、事件：据Reuters报道，黄金跌至一年低点，受美债收益率与美元压制，势将创2015年以来最差年度表现，黄金期货结算价创52周新低。\n2、涉及标的：黄金ETF（GLD）与金矿股纽蒙特（NEM）承压；A股对应方向为 26/193美元。相比之下，美光与海力士受影响更小：美光预计为190/205/215美元，海力士预计为48/52/55美元。\n☀️投资建议：我们对纯NAND标的仍然保持谨慎，如闪迪（SNDK US）、铠侠（285A JP）、群联（8299 TT）等。DRAM/HBM厂商有望相对跑赢，如美光（MU US）、海力士（SKHY US）及三星电子（005930 KS）。","en":"《广发海外电子通信》\n☄️存储：下调NAND价格预测\n👉据TrendForce最新跟踪，受消费端需求疲软及中国eSSD采购动能放缓拖累，NAND需求表现弱于预期。我们进一步下调明年NAND合约价预期，预计2027年Q1-Q4价格环比为0%/-3%/-8%/-12%。\n☀️下调NAND价格预测：我们将2027年Q1-Q4 NAND合约价环比预期从+6%/+3%/0%/0%下调至0%/-3%/-8%/-12%。消费电子需求持续疲软，预计2027年智能手机与PC出货量均将出现两位数下滑。与此同时，国内GPU与HBM供应瓶颈制约了服务器部署节奏，削弱了配套eSSD的采购需求，抵消了北美云厂商9月以来的加单效应。上述多重逆风共同缓解了此前的供应紧张局面，对NAND价格形成下行压力。\n☀️2027年Q2或迎供过于求：我们目前预计2026/27/28年NAND bit需求增速分别为26%/20%/24%，其中2027年需求下修47.8EB（占总需求的3.2%），主要反映消费端双位数需求下滑以及中国eSSD采购放缓。供给端方面，随着中国厂商产能持续扩张以及QLC产品占比提升，我们预计2026/27/28年NAND bit供给增速分别为21%/28%/30%，供需格局将迎来反转，预计2026/27/28年NAND供需缺口分别为-5%/+3%/+7%，2027年Q2起或正式进入价格下行通道。\n☀️2028年情景分析：展望2028年，我们预计NAND市场将继续分化，消费市场复苏节奏及中国CSP的eSSD需求仍是核心变量，供给则取决于海外与中国厂商的排产策略。我们对2028年NAND价格设定悲观/中性/乐观三种情景，分别为$0.08/0.15/0.20/GB，对应AI前价格，LTA底部价格，乐观需求价格。作为纯NAND厂商，闪迪盈利波动最为剧烈，2028年三种情景下EPS预计分别为34/126/193美元。相比之下，美光与海力士受影响更小：美光预计为190/205/215美元，海力士预计为48/52/55美元。\n☀️投资建议：我们对纯NAND标的仍然保持谨慎，如闪迪（SNDK US）、铠侠（285A JP）、群联（8299 TT）等。DRAM/HBM厂商有望相对跑赢，如美光（MU US）、海力士（SKHY US）及三星电子（005930 KS）。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122671338276204775","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":795},{"id":"2122671144717238522","h":"business","ts":1794919212,"zh":"亚玛芬体育 (Amer Sports) 今年第三次上调预期，旗下所罗门 (Salomon)、始祖鸟 (Arc’teryx) 和威尔逊 (Wilson) 品牌继续推动增长，表明高端消费者继续在时尚鞋履和运动装备上消费","en":"Amer Sports raised its outlook for the third time this year as its Salomon, Arc’teryx and Wilson brands continue to drive growth, suggesting higher-end consumers continue to spend on trendy shoes and sports gear","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122671144717238522","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/amer-sports-growth-outlook-boosted-again-by-salomon-arc-teryx?taid=6afc4b2ca3d32e000116b78d&utm_campaign=true ，涨幅从10％至逾20％不等，明年包括台积电在内的合作晶圆厂都将调价。（华东重机、联合化学、国林科技、佳先股份、西陇科学等）\n昇腾：华为云发布并开源昇腾原生具身世界模型，昇腾云已覆盖80%的中国具身智能企业。（华胜天成、泰嘉股份、克莱特、嘉环科技、真视通等）\n氯化铵：联碱法企业因纯碱长期亏损而主动减产，导致副产品氯化铵供应收缩，国内氯化铵工业级价格涨至730元/吨，创年内新高。（中盐化工、和邦生物、双环科技、华昌化工等）\n#华尔街观察最近提示乳业：11月本是原奶传统淡季，但散奶价格较合同奶价出现明显倒挂，反映供应趋紧，部分地区合同奶价上行。（伊利股份、新乳业、光明乳业、骑士乳业等）\n风险提示：以上内容来自公社用户写作，相关信息未经核实，未必准确，请审慎参考。\n二、大涨股解析：\n顺钠股份：干式变压器\n2026年11月16日盘中消息，1-9月全国电网工程投资完成额4594亿元，同比+4.9%，其中8-9月单月投资同比提速，单9月同比+13.8%；此外，机构预计第五批招标有望于12月挂网招标，有可能涉及“2直1交”，招标金额可观公司为国内干式变压器开拓者，主导或参与制定国家及行业标准超过50项，干式变压器规格超过3000种，累计销量超过16.2万台，其它产品包括预装式变电站、开关柜、电抗器、分布式储能柜及储能系统等，同时承接电力成套工程并提供配套运维服务。\n长虹美菱：家电\n公司2026年H1小家电方面已推出集成AI控温、净水和保鲜存储的AI冰吧机，正在开发AI视觉食材识别、膳食大模型、健康数据监测和自适应烹饪调控系统，构建智能健康烹饪方案。公司空调（营收占比55.99%）搭载AI人感技术并布局AI节能算法，冰箱冰柜（营收占比29.97%）营收占比29.97%，围绕“AI垂直应用”完善产品矩阵，并已推出AI套系家电。\n北鼎股份：小家电\n公司2026年持续推出全钢蒸锅、全钛锅具、全钛保温杯、全玻璃养生壶等升级新品，中国区前三季度收入6.01亿同比增长27.54%，Q3单季1.88亿同比增长33.9%；公司深耕高品质厨房小家电，主要产品养生壶（营收占比17.43%）、蒸炖锅（31.15%）产品在国补背景下具备较强优势，自主品牌规模效应显现。\n泰嘉股份：昇腾超节点PSU\n2026年11月16日市场传闻（未证实），DeepSeek新版本拟采用原生国产昇腾950DT超节点进行训练的消息，具体方案尚待官方确认。公司通过旗下雅达电子深度布局AI服务器 PSU，通过华为官方认证，进入昇腾供应链，独家代工CloudMatrix 384 超节点高功率电源模块PSU，同时供货微软LES，是国内最早实现PSU供货海外巨头的企业之一。\n盛剑科技：光刻胶+半导体设备\n1、2026年5月18日盘后纪要，2025 年光刻胶显影液（TMAH）回收技术在客户端测试验证成功，蚀刻液回收技术研发完成。\n2、2026年6月25日机构研报，公司是半导体废气处理与厂务设备龙头，已获得亚翔新加坡项目1亿风管代工订单，真空泵、工艺废气处理设备在马来西亚英飞凌厂验证顺利，预计27年可获得设备订单。公司昨晚正式授予股权激励，目标激进，预测26-28年业绩0.7/2.0/3.6。\n西陇科学：光刻胶配套试剂\n公司拥有酸碱类、溶剂类、蚀刻类和光刻胶配套试剂多种，和英特尔（成都）公司等建立合作关系。公司铜蚀刻液实现量产供应，可用于显示面板8.5高世代产线。\n真视通：华为算力\n公司是华为的“多产品金牌代理”，与华为昇腾会谈共同探索“智能算力建设与运营”合作之路。公司作为北京移动数字北京算力服务产品合作伙伴，为北京移动提供GPU高性能计算服务、并行文件存储服务、机房液冷服务、算力网络服务等。\n扬子新材：半导体洁净室\n2026年8月31日互动，公司的主要产品包括高洁净彩涂板、抗静电彩涂板、高韧耐污彩涂板等，主要用于集成电路厂房、医疗场所等建设项目，下游主要客户为净化及洁净类公司。\n亚泰集团：重整投资协议落地\n2026年11月16日晚公告，公司与长发集团、长春兴泰企业管理及其设立的长春泰启企业管理签署《重整投资协议》。重整投资人拟合计出资15.53亿元，受让公司14.19亿股转增股票，占转增后总股本的20.90%。其中，长发集团作为牵头投资人，将在投资完成后取得公司控股权。\n双环科技：氯化铵涨价\n2026年11月16日讯，截至11月16日氯化铵工业级730元/吨创年内新高，上周山东、河北干铵主流价格升至720元/吨，周内大涨80元/吨，涨幅达12.5%。公司本部运用联碱法生产纯碱和氯化铵等化工产品，年产纯碱近110万吨，每生产1吨纯碱同时产生1吨氯化铵。公司自备真空制盐装置，产能130万吨/年。","en":"一组网络消息：\n一、板块热议：\n半导体 71亿美元，环比下降14.2%，持仓数量从95项减少至65项。\n结合最近几个季度的持仓变化、他今年的公开采访，以及11月份的美股行情，我认为他的投资思路正在发生一些比较重要的变化。\n1. 生物科技可能成为下一轮市场的主线\n很多人关注德鲁肯米勒的半导体持仓，却忽略了生物医药已经成为他最大的配置方向，占13F申报市值的四成左右。\n第一大重仓股是癌症及基因检测公司Natera（$NTRA），持仓市值13.06亿美元，占比从上季度的16.6%上升至29.2%。不过，这期间他的持仓股数实际减少了0.8%，权重提升主要来自股价上涨和其他仓位的收缩。\n此外，他还持有大量生物科技公司，包括：\n$INSM：罕见病治疗\n$RVMD：RAS靶向抗癌药\n$NAMS：心血管疾病创新药\n$BEAM：基因碱基编辑\n$RLAY：精准药物研发\n今年3月，德鲁肯米勒在接受摩根士丹利采访时，解释了自己投资生物科技的几个原因：\n一是生物科技经历了数年的低迷，存在市场领导板块切换的机会；二是行业的技术面和价格动量正在发生变化；三是生物科技可能是AI最具潜力的应用场景之一，尤其是药物研发、疾病诊断和持续监测。\n这笔交易值得重视的地方，在于将产业技术变革、行业周期和市场资金轮动结合起来。\n未来可以重点观察生物科技ETF（$XBI）相对于纳斯达克100（$QQQ）的走势。\n2. 减持AI算力，加仓HDD\nQ3德鲁肯米勒对半导体进行了大幅调仓：\n清仓AMD、Sandisk、Google。\n减持94.5%的台积电、47.9%的意法半导体。\n增持180.2%的希捷科技（$STX）。\n新建仓希捷看涨期权及西部数据（$WDC）。\n两家HDD厂商合计占其13F申报市值的9.9%（含期权对应标的市值）。\n尤其值得注意的是，他清仓了做NAND的Sandisk，同时买入了做HDD的西部数据。\n相比其他半导体细分赛道，HDD具有行业竞争格局高度集中、资本开支相对克制、供给弹性有限等特点。随着AI生成的数据量不断增长，海量数据的长期存储需求，有望转化为HDD厂商的定价能力、利润率和自由现金流增长。\n希捷10月底公布的财报也部分验证了这一逻辑，单季度自由现金流达到14.79亿美元，创历史新高。\n不过，随着AI数据中心融资环境恶化，HDD未来的需求增长也存在被下修的风险。\n3. 从AI基础设施向AI应用进行切换\nQ3德鲁肯米勒大幅增加了部分AI应用公司的配置：\n增持435.5%的Unity（$U）。\n增持42.7%的亚马逊（$AMZN）。\n新建仓AppLovin（$APP）。\n新建仓Palantir（$PLTR）。\n其中Unity和AppLovin这组交易尤其值得关注，两家公司都能通过AI算法提高广告投放效率，并将技术进步直接转化为收入和利润。\n最新财报显示，Unity的AI广告平台Vector收入同比增长126%，AppLovin营收同比增长55%，净利润增长72%。\n过去几年，AI产业的超额利润主要集中在上游算力厂商。但随着模型能力提升、推理成本下降以及竞争加剧，超额利润可能逐渐向具有用户、数据和商业化优势的下游应用公司转移。\n相比需要投入巨额资本开支的云厂商，部分AI应用公司具有更好的资本回报率和利润增长潜力。\n4. 宏观层面：警惕资本稀缺和AI融资风险\n9月10日，据《金融时报》报道，德鲁肯米勒认为，考虑到美国经济、资本开支热潮以及对资本的争夺，即便当时美债收益率已经明显上升，利率可能依然偏低。\n据11月16日《华尔街日报》报道，德鲁肯米勒近期与Paul Tudor Jones在一场闭门会议上就AI泡沫展开辩论。\n他表达了几个重要观点：\nAI是历史上规模最大的技术变革之一。\n其家族办公室已经削减AI相关投资敞口。\n英伟达目前正在获取超常水平的利润（overearning），未来利润率可能下降，竞争对手也会获得更多市场份额。\n资本市场未必愿意为计划中的大规模AI数据中心建设提供足够资金。\n最后一点尤其重要。\n美国政府财政赤字、Hyperscaler资本开支、Neocloud债务融资，都在争夺有限的资本。资本成本的上升，可能成为制约下一阶段AI发展的重要因素。\n此外，德鲁肯米勒在Q3退出了多项宽基指数看涨期权，并同时新建仓三大黄金矿业公司Newmont（$NEM）、Barrick（$B）和Agnico Eagle（$AEM）。\n结合他此前长期看空美元、担忧美国财政可持续性的观点，这部分配置也具有一定的宏观交易属性。\n5. 结合近期行情，推测他四季度做了什么？\n如果按照9月30日披露的持仓静态计算，截至11月16日，德鲁肯米勒的正股组合累计下跌约15.3%，其中两大核心重仓Natera和希捷科技分别下跌约30%和46%。\n相比之下，Unity和AppLovin分别上涨约27%和43%。\n与此同时，美国10年期国债收益率突破5%，AI基础设施企业的信用风险显著上升。\n结合他的近期发言及一贯灵活的交易风格，我推测他在四季度可能进行了以下调整：\n一是进一步削减AI硬件敞口，特别是对数据中心建设速度高度敏感的公司；二是降低部分重仓股的集中度；三是保留部分AI应用和生物科技公司的配置；四是通过现金、短期国债或宏观对冲降低组合整体风险。\n至于加密货币，虽然他在10月29日公开确认投资了Trade[XYZ]，但其Q3加密相关上市公司持仓市值实际上环比下降了约13%。目前没有充分证据表明他正在增加加密资产的方向性多头敞口。\n总结\n我认为，德鲁肯米勒当前的投资主线，可以归纳为四个方向：\n生物科技的行业复苏与技术变革。\nAI产业链内部的利润重新分配。\n具有供给约束和定价能力的细分行业。\n资本成本上升背景下的宏观风险管理。\n过去三年，AI投资最重要的变量是需求增长。未来三年，竞争格局、资本成本、自由现金流和投资回报率可能变得更加重要。\n即使AI产业继续高速发展，产业增长与股东回报之间也可能出现显著分化。\n注：13F持仓截至9月30日，组合收益为不含期权、股息及期间调仓的静态模拟，四季度交易方向为个人推测。","en":"德鲁肯米勒最新13F：AI产业利润的重新分配\n11月16日，德鲁肯米勒（Stanley Druckenmiller）旗下Duquesne Family Office公布了2026年Q3持仓，13F申报总市值为44.71亿美元，环比下降14.2%，持仓数量从95项减少至65项。\n结合最近几个季度的持仓变化、他今年的公开采访，以及11月份的美股行情，我认为他的投资思路正在发生一些比较重要的变化。\n1. 生物科技可能成为下一轮市场的主线\n很多人关注德鲁肯米勒的半导体持仓，却忽略了生物医药已经成为他最大的配置方向，占13F申报市值的四成左右。\n第一大重仓股是癌症及基因检测公司Natera（$NTRA），持仓市值13.06亿美元，占比从上季度的16.6%上升至29.2%。不过，这期间他的持仓股数实际减少了0.8%，权重提升主要来自股价上涨和其他仓位的收缩。\n此外，他还持有大量生物科技公司，包括：\n$INSM：罕见病治疗\n$RVMD：RAS靶向抗癌药\n$NAMS：心血管疾病创新药\n$BEAM：基因碱基编辑\n$RLAY：精准药物研发\n今年3月，德鲁肯米勒在接受摩根士丹利采访时，解释了自己投资生物科技的几个原因：\n一是生物科技经历了数年的低迷，存在市场领导板块切换的机会；二是行业的技术面和价格动量正在发生变化；三是生物科技可能是AI最具潜力的应用场景之一，尤其是药物研发、疾病诊断和持续监测。\n这笔交易值得重视的地方，在于将产业技术变革、行业周期和市场资金轮动结合起来。\n未来可以重点观察生物科技ETF（$XBI）相对于纳斯达克100（$QQQ）的走势。\n2. 减持AI算力，加仓HDD\nQ3德鲁肯米勒对半导体进行了大幅调仓：\n清仓AMD、Sandisk、Google。\n减持94.5%的台积电、47.9%的意法半导体。\n增持180.2%的希捷科技（$STX）。\n新建仓希捷看涨期权及西部数据（$WDC）。\n两家HDD厂商合计占其13F申报市值的9.9%（含期权对应标的市值）。\n尤其值得注意的是，他清仓了做NAND的Sandisk，同时买入了做HDD的西部数据。\n相比其他半导体细分赛道，HDD具有行业竞争格局高度集中、资本开支相对克制、供给弹性有限等特点。随着AI生成的数据量不断增长，海量数据的长期存储需求，有望转化为HDD厂商的定价能力、利润率和自由现金流增长。\n希捷10月底公布的财报也部分验证了这一逻辑，单季度自由现金流达到14.79亿美元，创历史新高。\n不过，随着AI数据中心融资环境恶化，HDD未来的需求增长也存在被下修的风险。\n3. 从AI基础设施向AI应用进行切换\nQ3德鲁肯米勒大幅增加了部分AI应用公司的配置：\n增持435.5%的Unity（$U）。\n增持42.7%的亚马逊（$AMZN）。\n新建仓AppLovin（$APP）。\n新建仓Palantir（$PLTR）。\n其中Unity和AppLovin这组交易尤其值得关注，两家公司都能通过AI算法提高广告投放效率，并将技术进步直接转化为收入和利润。\n最新财报显示，Unity的AI广告平台Vector收入同比增长126%，AppLovin营收同比增长55%，净利润增长72%。\n过去几年，AI产业的超额利润主要集中在上游算力厂商。但随着模型能力提升、推理成本下降以及竞争加剧，超额利润可能逐渐向具有用户、数据和商业化优势的下游应用公司转移。\n相比需要投入巨额资本开支的云厂商，部分AI应用公司具有更好的资本回报率和利润增长潜力。\n4. 宏观层面：警惕资本稀缺和AI融资风险\n9月10日，据《金融时报》报道，德鲁肯米勒认为，考虑到美国经济、资本开支热潮以及对资本的争夺，即便当时美债收益率已经明显上升，利率可能依然偏低。\n据11月16日《华尔街日报》报道，德鲁肯米勒近期与Paul Tudor Jones在一场闭门会议上就AI泡沫展开辩论。\n他表达了几个重要观点：\nAI是历史上规模最大的技术变革之一。\n其家族办公室已经削减AI相关投资敞口。\n英伟达目前正在获取超常水平的利润（overearning），未来利润率可能下降，竞争对手也会获得更多市场份额。\n资本市场未必愿意为计划中的大规模AI数据中心建设提供足够资金。\n最后一点尤其重要。\n美国政府财政赤字、Hyperscaler资本开支、Neocloud债务融资，都在争夺有限的资本。资本成本的上升，可能成为制约下一阶段AI发展的重要因素。\n此外，德鲁肯米勒在Q3退出了多项宽基指数看涨期权，并同时新建仓三大黄金矿业公司Newmont（$NEM）、Barrick（$B）和Agnico Eagle（$AEM）。\n结合他此前长期看空美元、担忧美国财政可持续性的观点，这部分配置也具有一定的宏观交易属性。\n5. 结合近期行情，推测他四季度做了什么？\n如果按照9月30日披露的持仓静态计算，截至11月16日，德鲁肯米勒的正股组合累计下跌约15.3%，其中两大核心重仓Natera和希捷科技分别下跌约30%和46%。\n相比之下，Unity和AppLovin分别上涨约27%和43%。\n与此同时，美国10年期国债收益率突破5%，AI基础设施企业的信用风险显著上升。\n结合他的近期发言及一贯灵活的交易风格，我推测他在四季度可能进行了以下调整：\n一是进一步削减AI硬件敞口，特别是对数据中心建设速度高度敏感的公司；二是降低部分重仓股的集中度；三是保留部分AI应用和生物科技公司的配置；四是通过现金、短期国债或宏观对冲降低组合整体风险。\n至于加密货币，虽然他在10月29日公开确认投资了Trade[XYZ]，但其Q3加密相关上市公司持仓市值实际上环比下降了约13%。目前没有充分证据表明他正在增加加密资产的方向性多头敞口。\n总结\n我认为，德鲁肯米勒当前的投资主线，可以归纳为四个方向：\n生物科技的行业复苏与技术变革。\nAI产业链内部的利润重新分配。\n具有供给约束和定价能力的细分行业。\n资本成本上升背景下的宏观风险管理。\n过去三年，AI投资最重要的变量是需求增长。未来三年，竞争格局、资本成本、自由现金流和投资回报率可能变得更加重要。\n即使AI产业继续高速发展，产业增长与股东回报之间也可能出现显著分化。\n注：13F持仓截至9月30日，组合收益为不含期权、股息及期间调仓的静态模拟，四季度交易方向为个人推测。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUapHybUAAMjx5.jpg?name=orig"],"u":"https://x.com/xingpt/status/2122632109106012451","l":[],"ln":[],"t":["美股","AI科技","财报","黄金"],"lk":9,"rt":0,"rp":5,"vw":1378},{"id":"2122631764090966140","h":"cnfinancewatch","ts":1794909823,"zh":"晚上了\n#互关 16摊位出摊\n今天椒友16个。看看能不能有16给老铁给面！","en":"晚上了\n#互关 16摊位出摊\n今天椒友16个。看看能不能有16给老铁给面！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122631764090966140","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":1098},{"id":"2122630921614393662","h":"business","ts":1794909622,"zh":"金价下跌和投资行业危机加剧了土耳其国内需求的放缓","en":"Falling gold prices and an investment-industry crisis are amplifying a slowdown in Turkish domestic demand","zh_src"
