<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":7,"rt":2,"rp":3,"vw":12740},{"id":"2123030743408382221","h":"yijiangren","ts":1795004947,"zh":"浑水做空 $NVDA 英伟达：一场由高管关系、出口管制与供应链疑云引发的调查\n在华尔街，有一类机构让上市公司管理层颇为头疼。\n它们专门寻找企业财报、商业关系和经营活动中的漏洞，然后通过做空股票，从市场对这些问题的重新定价中获利。\n浑水研究（Muddy Waters Research），就是其中最有名的一家。\n一、浑水究竟是什么来头？\n浑水研究由 Carson Block 于 2010 年创立，长期以调查研究和做空上市公司闻名。\n它的名字来自一句中国俗语：浑水摸鱼。\n这家机构最擅长的事情，是深入企业经营链条，调查财务数据、客户关系、供应商、资产真实性以及管理层之间的利益联系。\n它曾经让多家上市公司陷入严重的信任危机。\n2011 年，浑水将矛头指向加拿大上市的中国森林（Sino-Forest），质疑其林地资产和经营数据存在重大造假。\n当时，中国森林市值超过 60 亿加元，曾是资本市场备受关注的林业企业。\n浑水发布报告后，股价从报告发布前的 18.21 加元一路跌至 1.99 加元。随后监管机构介入，公司停牌、退市，最终进入债务重组程序。\n这场调查让 Carson Block 一战成名。\n此后，浑水还曾调查中国高速传媒、分众相关企业以及 NQ Mobile 等公司，在海外资本市场建立了相当强的影响力。\n当然，浑水的历史战绩也并非全胜。\n它对部分公司的质疑曾遭到独立调查否定，NQ Mobile 也曾公布独立调查结果，称没有发现浑水所指控的欺诈行为。\n所以，浑水的报告值得认真阅读，但它的结论始终需要独立证据验证。\n还有一个非常重要的细节：浑水本身就持有被调查公司的空头仓位。它通过做空相关证券获得潜在收益，并在报告发布后逐步平仓。\n换句话说，它既是调查者，也是利益相关方。\n这也是为什么每一份浑水报告，都应该同时看证据和利益动机。\n二、这一次，浑水为什么盯上英伟达？\n当地时间 11 月 17 日，浑水正式发布报告：《MW is Short NVIDIA: More Questions About China》。\n宣布已经做空英伟达（NVDA）。\n这份报告的核心，指向了两个人。\n一个是英伟达前全球业务执行副总裁 Ajay K. Puri，另一个是超微电脑（Super Micro，SMCI）前首席增长官 Cenly Chen。\nAjay Puri 曾在英伟达任职 21 年，负责全球销售、业务拓展、合作伙伴关系等重要业务。\n他在 2026 年 6 月宣布卸任原职，转为英伟达高级顾问。\n而 Cenly Chen 曾在超微电脑负责 GPU 采购和分配。\n事情的关键，出现在两人的公开活动照片上。\n浑水发现，2024 年至 2026 年间，一名被活动摄影网站标注为 Cenly Chen 或 Cenly Puri 的女性，多次与 Ajay Puri 同框。\n浑水由此提出一个问题：照片中的女性，是否就是曾经负责超微电脑 NVIDIA GPU 采购和分配的 Cenly Chen？\n这成为此次做空报告的核心切入点。\n三、超微电脑的芯片出口事件\n要理解浑水为什么关注这层关系，需要回到今年 3 月的一起美国刑事案件。\n美国司法部当时宣布，三名与超微电脑有关联的人员涉嫌合谋，将搭载美国先进 AI 技术的服务器非法转运至中国。\n根据美国司法部公布的起诉内容，2024 年至 2025 年期间，相关人员安排一家东南亚公司采购了约 25 亿美元的服务器。\n其中，仅 2025 年 4 月下旬至 5 月中旬，就有约 5.1 亿美元的服务器被非法转运至中国。\n案件还涉及伪造文件、安排虚假服务器接受检查等行为。\n这意味着，事件已经触及美国 AI 芯片出口管制的核心问题。\n随后，2026 年 10 月，一份针对超微电脑的证券集体诉讼文件，又将 Cenly Chen 的名字带入事件。\n诉讼文件援引前员工证词，称她曾负责超微电脑从英伟达采购 GPU，并决定芯片如何分配给不同客户。\n文件还质疑她是否知晓相关非法销售行为。\n浑水将这两条线索连接起来：\n一边是曾经负责英伟达全球业务的高级管理人员 Ajay Puri，另一边是被诉讼文件指向的超微电脑前高管 Cenly Chen。\n如果照片中的两人确实对应上述人物，那么这层关系就值得进一步调查。\n四、这份报告究竟有多少可信度？\n我认为，需要把整件事拆成三个层次。\n第一层，超微电脑相关人员涉嫌违规转运 AI 服务器，有美国司法部的刑事起诉作为依据。\n第二层，Cenly Chen 曾负责超微电脑的 GPU 采购与分配，有前员工证词被写入法院诉讼文件。\n第三层，照片中的女性究竟是不是 Cenly Chen，以及她与 Ajay Puri 的具体关系，目前仍然没有得到独立证实。\n第三层恰恰是浑水这次做空逻辑中最关键的连接点。\n目前没有证据证明 Ajay Puri 参与了芯片违规转运，也没有证据证明英伟达公司参与了相关违法活动。\n浑水自己也在报告中明确承认：Cenly Chen 没有受到任何政府机构的刑事指控，针对她的民事诉讼指控尚未得到证实。\n所以，这份报告目前更多是在提出一系列值得调查的问题。\n五、这件事对英伟达意味着什么？\n我认为，三个方面\n1. 出口管制风险\n英伟达的核心产品涉及美国严格管制的先进 AI 芯片。\n如果供应链中的违规转运持续扩大，监管部门就可能进一步审查芯片销售、终端客户核查和渠道管理。\n2. 管理层与供应链关系\n英伟达高度依赖服务器厂商、云服务商和分销渠道。\n一旦核心供应链合作伙伴出现合规问题，市场自然会重新审视英伟达的渠道管理能力。\n3. 市场信任\n英伟达当前的估值，很大程度上建立在 AI 算力需求持续增长、供应链稳定以及公司治理可靠的基础上。\n如果出口管制和内部管理问题持续发酵，即使短期营收没有变化，也可能影响投资者愿意支付的估值溢价。\n最后，还有一个细节值得注意。\n浑水在报告中明确披露，自己在发布报告时持有英伟达空头仓位，并计划在报告发布后回补相当一部分，甚至全部仓位。\n因此，不能简单地把浑水发布做空报告理解为它会一直持有空单。\n总而言之\n浑水过去确实有过非常漂亮的调查战绩，它的报告值得重视。\n但这次英伟达事件，最关键的证据链仍然存在缺口。\n超微电脑的出口违规案件有司法调查作为基础，高管之间的身份关联却仍待确认。\n接下来值得观察的，是美国司法部、监管机构以及英伟达自身会不会披露更多信息。\n浑水的报告可以成为风险预警，但还不足以单独构成做空英伟达的完整理由。","en":"浑水做空 $NVDA 英伟达：一场由高管关系、出口管制与供应链疑云引发的调查\n在华尔街，有一类机构让上市公司管理层颇为头疼。\n它们专门寻找企业财报、商业关系和经营活动中的漏洞，然后通过做空股票，从市场对这些问题的重新定价中获利。\n浑水研究（Muddy Waters Research），就是其中最有名的一家。\n一、浑水究竟是什么来头？\n浑水研究由 Carson Block 于 2010 年创立，长期以调查研究和做空上市公司闻名。\n它的名字来自一句中国俗语：浑水摸鱼。\n这家机构最擅长的事情，是深入企业经营链条，调查财务数据、客户关系、供应商、资产真实性以及管理层之间的利益联系。\n它曾经让多家上市公司陷入严重的信任危机。\n2011 年，浑水将矛头指向加拿大上市的中国森林（Sino-Forest），质疑其林地资产和经营数据存在重大造假。\n当时，中国森林市值超过 60 亿加元，曾是资本市场备受关注的林业企业。\n浑水发布报告后，股价从报告发布前的 18.21 加元一路跌至 1.99 加元。随后监管机构介入，公司停牌、退市，最终进入债务重组程序。\n这场调查让 Carson Block 一战成名。\n此后，浑水还曾调查中国高速传媒、分众相关企业以及 NQ Mobile 等公司，在海外资本市场建立了相当强的影响力。\n当然，浑水的历史战绩也并非全胜。\n它对部分公司的质疑曾遭到独立调查否定，NQ Mobile 也曾公布独立调查结果，称没有发现浑水所指控的欺诈行为。\n所以，浑水的报告值得认真阅读，但它的结论始终需要独立证据验证。\n还有一个非常重要的细节：浑水本身就持有被调查公司的空头仓位。它通过做空相关证券获得潜在收益，并在报告发布后逐步平仓。\n换句话说，它既是调查者，也是利益相关方。\n这也是为什么每一份浑水报告，都应该同时看证据和利益动机。\n二、这一次，浑水为什么盯上英伟达？\n当地时间 11 月 17 日，浑水正式发布报告：《MW is Short NVIDIA: More Questions About China》。\n宣布已经做空英伟达（NVDA）。\n这份报告的核心，指向了两个人。\n一个是英伟达前全球业务执行副总裁 Ajay K. Puri，另一个是超微电脑（Super Micro，SMCI）前首席增长官 Cenly Chen。\nAjay Puri 曾在英伟达任职 21 年，负责全球销售、业务拓展、合作伙伴关系等重要业务。\n他在 2026 年 6 月宣布卸任原职，转为英伟达高级顾问。\n而 Cenly C 标准差（下图2）\n2）在最大尾部风险票选中，\"AI泡沫\"以34%位居第一，\"AI超大规模运营商信用事件\"以31%紧随其后。两项合计65%，意味着市场上三分之二的资金管理者将AI视为当前股市和信用市场的最大威胁。相比之下，10月的头号风险是债券收益率无序上行。（下图3）\n3）在最可能引发系统性信用事件的来源中，38%的受访者指向AI超大规模运营商债券，30%指向私人信贷。（下图4）\n而在企业应优先怎样使用现金流这一问题里，参与调查的基金经理中42%选择选改善资产负债表、33%选回馈股东、16%选增加资本开支。\n4）现金持仓比例从3.9%降至3.6%，为8月以来最低，处于长期均值以下1.9个标准差的位置。按照美银的\"现金规则\"，当现金比例处于或低于4.0%时，构成全球股市的反向卖出信号。\nHartnett在调查发布前就写过，若现金升破4.2%、经济繁荣预期明显减弱，仓位对市场的压力就会减轻。实际结果是现金降至3.6%，仍落在他认为恐惧不足的区域。\n减仓速度很极端，减仓后的仓位仍有余量。 单月下降25个百分点，超过了2008年金融危机、2022年加息调整以及2025年4月关税冲击期间任何一个月的降幅。但减仓后，科技股仍为净超配，只比自身长期均值低约半个标准差。美银历史上看到的较好科技股入场机会，通常出现在受访者已转为净低配的时候。\n结合最近的几个不同的数据来看这一轮调整资金上是对冲基金先减仓、长线经理随后跟进。能从数据中确认的是，至少三类记录都出现了科技风险下降的迹象，但交易行为各有不同。\n1）德鲁肯米勒的三季度持仓显示，他在AI硬件内部做了很大的取舍。\n2）高盛Prime看到了先降杠杆、再卖反弹。 11月第一周，其美国基本面股票多空基金客户的总杠杆下降8.7个百分点至207.5%，是2020年3月以来最大单周降幅。随后一周，芯片股出现4月以来最强反弹，这批资金仍在卖科技。美国信息技术板块多头与空头敞口之比从6月初的2.14降至1.50，创高盛这组数据自2016年开始统计以来最低。\n3）同期仍有人申购科技基金。 美银11月12日《The Flow Show》引用的EPFR数据显示，截至11月11日的一周全球股票基金净流入983亿美元，其中科技基金净流入89亿美元。基金客户可以继续申购，但主动经理也可以把组合里的科技权重往下调。（见引用的推文）\n核心就是主动性资金在撤退。\n怎么看这几个数据呢？\n高盛客户的科技多空比已经很低，利好消息容易触发回补。美银更广泛的全球经理样本仍然净超配科技，后续也还有减仓空间。 一波有力度的反弹与长线资金继续调整仓位，完全可能出现在同一周期。\n仓位已经为反弹创造了条件，反弹能走多远取决于投资回报。\n中长期还是看周一梳理美银最新一期Flow Show的推文最后部分核心三个层面：\n1）油价/通胀走势；\n2）新的政治生态下AI政策会比预期的还要收紧还是会柔和些；\n3）AI商业化是不是继续处于加速状态。\n核心逻辑是，如果美伊能缓和、俄乌也能结束，油价下来通胀才会下来，市场才会预期利率更宽松，否则又要担心明年上半年联储会继续收紧。\n现在科技杀的这么猛、就是预期新国会生态带来AI基建的大放缓，那就要看明年实际力度比预期的更猛还是更弱。如果民主党搞事力度比现在预期更猛，即使通胀下来了，科技也很难受。但如果比现在预期柔和一些，市场情绪则又起来。\n而AI商业化则是最底层的逻辑支撑：最近大科技还算比较抗跌支撑指数，是因为市场认为政策再收紧他们还是能扛的，如果数据中心放缓大云厂手里的算力稀缺，但根源还是因为云业务增速在加速中，他们能撑的住。真要大幅度降速，那么通胀好转、政策缓和，也都带不动。","en":"最新的美银全球基金经理调查，几个要点：1）基金经理对科技股的热情正在快速消退。调查显示科技股超配比例从10月的净37%降至净12%（见图一），降幅为2006年6月以来最大，超过2008年金融危机、2022年加息周期和今年“对等关税日4月2日”时的任何一次。\n目前科技股仓位已低于长期均值约半个标准差（下图2）\n2）在最大尾部风险票选中，\"AI泡沫\"以34%位居第一，\"AI超大规模运营商信用事件\"以31%紧随其后。两项合计65%，意味着市场上三分之二的资金管理者将AI视为当前股市和信用市场的最大威胁。相比之下，10月的头号风险是债券收益率无序上行。（下图3）\n3）在最可能引发系统性信用事件的来源中，38%的受访者指向AI超大规模运营商债券，30%指向私人信贷。（下图4）\n而在企业应优先怎样使用现金流这一问题里，参与调查的基金经理中42%选择选改善资产负债表、33%选回馈股东、16%选增加资本开支。\n4）现金持仓比例从3.9%降至3.6%，为8月以来最低，处于长 ushTheShorts/status/2122988864881250618","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":414},{"id":"2122988418233974860","h":"cnfinancewatch","ts":1794994856,"zh":"#资金面\nARK方面，最新能核到的公开交易仍是周一（11月16日）。两只及以上基金同买的主要是这几只： #太空探索科技 $SPCX 获ARKK与ARKW同买，合计约5190万美元，金额最大； $XYZ 获ARKK与ARKW同买，合计约2310万美元； #Shopify $SHOP 获ARKK、ARKW与ARKF三只基金同买，合计约1650万美元； $LUNR 获ARKX与ARKQ同买，合计约390万美元。同一天ARKK与ARKW合计卖出约8480万美元的英伟达。这些同买标的的位置都不在突破准备或箱底右侧： $SPCX 周二涨3.16%收到141.70，刚回到20日均线141.27附近，仍在区间47%； $XYZ 和 $SHOP 五日继续回撤，先观察。\n带方向的期权里，没有特别干净的多头共振。 #苹果 最大Call贴近现价、量仓比18.41、Call持仓增仓，但Put持仓同步增加，不能算干净。 #梯瓦制药 P/C成交比0.29、持仓比0.28，多单占优，但最大Call行权价31距现价远了27%，量仓比只有0.61，Call持仓还减了0.3%。 #火箭实验室 $RKLB 最大Call行权价60，量仓比1.56，Call持仓增仓7.0%，方向偏多，可是行权价离现价55.05还有约9%，股价又在区间中部。 $AGX 是Call持仓增仓28.9%、Put持仓减仓13.7%，方向清楚，但事件本身偏谨慎，股价20日跌16%，也不适合当作买点。\n#期货\n周二附近的持仓变化是：标普迷你OI增约11.0万手、量比1.01，纳指迷你OI增约1.76万手、量比1.13，罗素迷你OI增约1.22万手、量比0.88，OI在增加但量能未明确确认，暂不定性。30年期美债价涨OI降约4.78万手，属空头回补。原油价跌OI降约1.38万手，属多头离场；黄金、铜、白银同样是价跌OI降，黄金和铜的量能口径还降了级，先按多头离场看、量能不可完全核对。比特币期货价涨OI降，属空头回补。今天盘前期指只是高开后收窄，原油现价约83.99、黄金期货约3777，继续偏弱，还看不到新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨8.25%、 $FIW 涨7.56%、 $PHO 涨7.24%、 $AGNG 涨5.39%、 $ITB 涨5.05%、 $IHI 涨4.92%、 $IHE 涨4.77%、 $XLP 涨4.23%、 $XLU 涨3.68%、 $KIE 涨3.09%。5日窗口几乎只剩 $XLE 涨1.85%、 $XLP 涨0.47%还在正值。能源是典型的仅5日脉冲，20日仍跌6.78%，慎追。必选消费是目前唯一还算双窗口同现的大类，但美股 $XLP 距20日高只差2.21%，5日涨幅已经缩到0.47%；公用事业昨天还在双窗口，今天5日已经翻到跌0.71%，变成仅20日。A股这边以今天收盘计，消费50ETF涨10.90%、消费ETF涨7.61%、酒ETF涨7.58%、银行ETF涨6.03%，消费和银行都是双窗口同现，而且已经走到20日区间90%以上，映射还在，只是位置高了，不追。住宅建筑是仅20日： $ITB 20日涨5.05%，但5日跌4.64%，距20日高11.66%；A股房地产ETF20日跌9.18%，映射没有启动。医疗器械和制药是仅20日， $IHI 5日跌1.95%，距20日高7.13%，量比只有0.58，等放量；A股纳指生物科技ETF20日涨2.63%、5日跌5.03%，对得不齐。半导体现状仍是双窗口都弱， $SOXX 20日跌15.13%、5日跌3.50%；A股芯片ETF今天收涨约2.3%，只是超跌反弹，20日仍跌7%左右，不构成共振。\n#三个方向\n一是 #必选消费 ，中美双窗口同现，但美股已经走在区间上沿，只作为防守框架，不在这里追高开仓。二是 #大盘消费科技龙头 ，只认 #苹果 这种低波动、仍靠近前高的品种，期权方向这轮不如昨天干净，仓位继续克制。三是 #制药与医疗器械 观察， $IHE 20日涨4.77%、距20日高3.58%， $IHI 还在回调， $TEVA 有FDA加分但位置不到，都不追。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.26失效，半仓。\n #梯瓦制药 $TEVA ，区间中上部，距20日高4.58%，FDA居家适应症和偏多的P/C是加分项，但位置不够突破，放量站上44.57再看，跌破周线十日均线41.52失效，仅观察。\n #太空探索科技 $SPCX ，箱体中部，位置47%，刚回到20日均线附近，ARK两只基金同买还在。站上均线后还要看能否放量离开中部，跌破周一低点135失效，仅观察。\n #Nutex Health $NUTX ，箱底，位置14%，周二长下影收阳，特别股息和双重上市是事件，但没有期权和机构持仓核验，不进只做。放量站上186.26（周线二十日均线）再看，跌破166.08失效，仅观察。\n #HubSpot $HUBS ，距颈线约26%，内部人买入属实，但周二中阴把涨幅吐掉，不构成突破准备。放量站上217.94再看，跌破188.25失效，仅观察。\n #菲利普斯66 $PSX ，箱体下部，位置30%，五日还在反弹，但周二已转弱，距20日均线267.63还有距离，仅观察，跌破近期低点253.74失效。\n#小盘阿尔法\n本期不选。 $NUTX 市值约11.6亿美元，位置是箱底，但事件只是特别股息，期权和13F都没有核到，先不选。 $HUBS 市值约113亿美元，不算小盘，位置也还不够。","en":"#资金面\nARK方面，最新能核到的公开交易仍是周一（11月16日）。两只及以上基金同买的主要是这几只： #太空探索科技 $SPCX 获ARKK与ARKW同买，合计约5190万美元，金额最大； $XYZ 获ARKK与ARKW同买，合计约2310万美元； #Shopify $SHOP 获ARKK、ARKW与ARKF三只基金同买，合计约1650万美元； $LUNR 获ARKX与ARKQ同买，合计约390万美元。同一天ARKK与ARKW合计卖出约8480万美元的英伟达。这些同买标的的位置都不在突破准备或箱底右侧： $SPCX 周二涨3.16%收到141.70，刚回到20日均线141.27附近，仍在区间47%； $XYZ 和 $SHOP 五日继续回撤，先观察。\n带方向的期权里，没有特别干净的多头共振。 #苹果 最大Call贴近现价、量仓比18.41、Call持仓增仓，但Put持仓同步增加，不能算干净。 #梯瓦制药 P/C成交比0.29、持仓比0.28，多单占优，但最大Call行权价31距现价远了27%，量仓比只有0.61，Call持仓还减了0.3%。 #火箭实验室 $RKLB 最大Call行权价60，量仓比1.56，Call持仓增仓7.0%，方向偏多，可是行权价离现价55.05还有约9%，股价又在区间中部。 $AGX 是Call持仓增仓28.9%、Put持仓减仓13.7%，方向清楚，但事件本身偏谨慎，股价20日跌16%，也不适合当作买点。\n#期货\n周二附近的持仓变化是：标普迷你OI增约11.0万手、量比1.01，纳指迷你OI增约1.76万手、量比1.13，罗素迷你OI增约1.22万手、量比0.88，OI在增加但量能未明确确认，暂不定性。30年期美债价涨OI降约4.78万手，属空头回补。原油价跌OI降约1.38万手，属多头离场；黄金、铜、白银同样是价跌OI降，黄金和铜的量能口径还降了级，先按多头离场看、量能不可完全核对。比特币期货价涨OI降，属空头回补。今天盘前期指只是高开后收窄，原油现价约83.99、黄金期货约3777，继续偏弱，还看不到新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨8.25%、 $FIW 涨7.56%、 $PHO 涨7.24%、 $AGNG 涨5.39%、 $ITB 涨5.05%、 $IHI 涨4.92%、 $IHE 涨4.77%、 $XLP 涨4.23%、 $XLU 涨3.68%、 $KIE 涨3.09%。5日窗口几乎只剩 $XLE 涨1.85%、 $XLP 涨0.47%还在正值。能源是典型的仅5日脉冲，20日仍跌6.78%，慎追。必选消费是目前唯一还算双窗口同现的大类，但美股 $XLP 距20日高只差2.21%，5日涨幅已经缩到0.47%；公用事业昨天还在双窗口，今天5日已经翻到跌0.71%，变成仅20日。A股这边以今天收盘计，消费50ETF涨10.90%、消费ETF涨7.61%、酒ETF涨7.58%、银行ETF涨6.03%，消费和银行都是双窗口同现，而且已经走到20日区间90%以上，映射还在，只是位置高了，不追。住宅建筑是仅20日： $ITB 20日涨5.05%，但5日跌4.64%，距20日高11.66%；A股房地产ETF20日跌9.18%，映射没有启动。医疗器械和制药是仅20日， $IHI 5日跌1.95%，距20日高7.13%，量比只有0.58，等放量；A股纳指生物科技ETF20日涨2.63%、5日跌5.03%，对得不齐。半导体现状仍是双窗口都弱， $SOXX 20日跌15.13%、5日跌3.50%；A股芯片ETF今天收涨约2.3%，只是超跌反弹，20日仍跌7%左右，不构成共振。\n#三个方向\n一是 #必选消费 ，中美双窗口同现，但美股已经走在区间上沿，只作为防守框架，不在这里追高开仓。二是 #大盘消费科技龙头 ，只认 #苹果 这种低波动、仍靠近前高的品种，期权方向这轮不如昨天干净，仓位继续克制。三是 #制药与医疗器械 观察， $IHE 20日涨4.77%、距20日高3.58%， $IHI 还在回调， $TEVA 有FDA加分但位置不到，都不追。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.26失效，半仓。\n #梯瓦制药 $TEVA ，区间中上部，距20日高4.58%，FDA居家适应症和偏多的P/C是加分项，但位置不够突破，放量站上44.57再看，跌破周线十日均线41.52失效，仅观察。\n #太空探索科技 $SPCX ，箱体中部，位置47%，刚回到20日均线附近，ARK两只基金同买还在。站上均线后还要看能否放量离开中部，跌破周一低点135失效，仅观察。\n #Nutex Health $NUTX ，箱底，位置14%，周二长下影收阳，特别股息和双重上市是事件，但没有期权和机构持仓核验，不进只做。放量站上186.26（周线二十日均线）再看，跌破166.08失效，仅观察。\n #HubSpot $HUBS ，距颈线约26%，内部人买入属实，但周二中阴把涨幅吐掉，不构成突破准备。放量站上217.94再看，跌破188.25失效，仅观察。\n #菲利普斯66 $PSX ，箱体下部，位置30%，五日还在反弹，但周二已转弱，距20日均线267.63还有距离，仅观察，跌破近期低点253.74失效。\n#小盘阿尔法\n本期不选。 $NUTX 市值约11.6亿美元，位置是箱底，但事件只是特别股息，期权和13F都没有核到，先不选。 $HUBS 市值约113亿美元，不算小盘，位置也还不够。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122988418233974860","l":[],"ln":[],"t":["美股","原油能源","AI科技","黄金"],"lk":0,"rt":0,"rp":0,"vw":261},{"id":"2122988411543785979","h":"cnfinancewatch","ts":1794994855,"zh":"美股盘前下午版｜2026年11月18日 周三 北京时间15:05\n#结论\n今日大类只做两个：必选消费的低波动防守，和大盘消费科技龙头。只做名单仍只给一只，第二、第三个位置空着。候选里能同时过技术位置的，还是靠近前高的苹果；医药事件票和箱底小盘都还没有走到可以开仓的位置。\n #苹果 $AAPL 周二收351.91，跌0.25%，距20日高也是52周高360.83还有2.53%，处在近20日区间75%的位置。比周一的2.28%又远了一点，已经略宽于通常的2%门槛，仍按回撤后的突破准备来看，不突破不进。期权最大Call行权价355，距现价只差0.63%，量仓比18.41，Call持仓增仓4.6%，但这边Put持仓也增了5.8%，做空余额环比升10%，算不上干净的多头共振。卖方目标价均值343.2低于现价，近四周EPS下修16家、上修9家，只给半仓。\n明确不做：半导体和AI硬件先看今夜开盘再定价，不追盘后跳空。 #英伟达 $NVDA 周二收155.46，仍在20日区间底部附近，位置大约只有9%；已经大涨或五日涨幅过大的品种；只有股息、没有资金共振的票；ARK同买但还在箱体中下部、未见右侧的，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指高开幅度已经收窄。纳指期货27242，较周二结算约27075涨约0.62%；标普期货7379，涨约0.28%；道指期货50865，涨约0.10%。早盘亚洲时段纳指期货一度更高，随后回吐了大半。周二美股继续下跌，纳指收24328.38，跌0.74%；标普7340.53，跌1.03%；道指50759.42，跌1.64%，都是四连跌。VIX升至25.46。A股今天收盘，上证3587.83涨0.09%，创业板2311.62涨0.85%，科创50收1247.99，涨2.19%。日经收59024点，涨0.28%；韩国综指5067点，涨1.99%，守住5000点。\n #英伟达 周二盘后交出换帅后第一份三季报：营收1158亿美元，同比增103%，高于市场约1089亿美元的预期；数据中心1076亿美元；非GAAP每股收益2.68美元，高于约2.47美元的预期。第四季度营收指引中值1300亿美元，上下3%，也高于华尔街预期。毛利率指引下调到71%到72%，公司把这说成低点，并且指引不含中国数据中心计算收入。董事会主席表态不打算让黄仁勋复职，黄本人说如果董事会认为符合利益，愿意回归。他已同意出席参议院银行委员会听证会，日期尚未敲定。浑水在财报前宣布做空，质疑前高管关联及对华销售，身份和细节仍待证实。盘后股价一度到约162.56，涨约4.6%，随后有所回吐。截稿时尚未取得完整的盘前报价。\n今晚美股盘前还有 #劳氏 $LOW 、 $TJX 出季报，盘后是 $PANW 。明天盘前有 #沃尔玛 $WMT 和 #阿里巴巴 $BABA 。Anthropic计划周三定价、周四以 $ANT 在纳斯达克挂牌。WTI原油现报约83.99美元，较周二收盘86.01再跌约2.4%。10年期美债收益率周二收5.103%，美元指数约103.70，仍靠近近期高位。 #家得宝 $HD 周二收339.01，跌2.45%； #迪士尼 $DIS 收116.94，跌1.48%，财报后的回吐在常规交易里落地了。\n高权重事件里， #梯瓦制药 $TEVA 的IGALMI已获FDA批准，可用于部分成人急性激越的居家治疗，事件权重大，期权P/C成交比0.29也偏多。但周二只收42.62，涨0.12%，距20日高44.57还有4.58%，处在区间64%，位置不够突破，只观察。 #Nutex Health $NUTX 宣布每股2美元特别股息，并获纳斯达克双重上市批准，市值约11.6亿美元，周二收174.51，涨2.83%，处在近20日区间14%，箱底有长下影，但事件落在股息档，期权和13F都没有核到，不进只做。 #HubSpot $HUBS 内部人Halligan（董事）11月13日约500万美元买入22985股，均价约217.44美元，16日披露；但周二倒跌6.76%，收216.30，距颈线还有约26%，只观察。\n#研报面\n #苹果 卖方均值目标价343.2美元，买入15家、持有8家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。 #梯瓦制药 均值目标价51.53美元，11家全是买入，近四周EPS下修6家、上修5家，略偏下修。 #HubSpot 均值230.5美元，买入从13家降到6家，持有19家，近四周EPS上修24家、下修15家，卖方立场在转弱。","en":"美股盘前下午版｜2026年11月18日 周三 北京时间15:05\n#结论\n今日大类只做两个：必选消费的低波动防守，和大盘消费科技龙头。只做名单仍只给一只，第二、第三个位置空着。候选里能同时过技术位置的，还是靠近前高的苹果；医药事件票和箱底小盘都还没有走到可以开仓的位置。\n #苹果 $AAPL 周二收351.91，跌0.25%，距20日高也是52周高360.83还有2.53%，处在近20日区间75%的位置。比周一的2.28%又远了一点，已经略宽于通常的2%门槛，仍按回撤后的突破准备来看，不突破不进。期权最大Call行权价355，距现价只差0.63%，量仓比18.41，Call持仓增仓4.6%，但这边Put持仓也增了5.8%，做空余额环比升10%，算不上干净的多头共振。卖方目标价均值343.2低于现价，近四周EPS下修16家、上修9家，只给半仓。\n明确不做：半导体和AI硬件先看今夜开盘再定价，不追盘后跳空。 #英伟达 $NVDA 周二收155.46，仍在20日区间底部附近，位置大约只有9%；已经大涨或五日涨幅过大的品种；只有股息、没有资金共振的票；ARK同买但还在箱体中下部、未见右侧的，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指高开幅度已经收窄。纳指期货27242，较周二结算约27075涨约0.62%；标普期货7379，涨约0.28%；道指期货50865，涨约0.10%。早盘亚洲时段纳指期货一度更高，随后回吐了大半。周二美股继续下跌，纳指收24328.38，跌0.74%；标普7340.53，跌1.03%；道指50759.42，跌1.64%，都是四连跌。VIX升至25.46。A股今天收盘，上证3587.83涨0.09%，创业板2311.62涨0.85%，科创50收1247.99，涨2.19%。日经收59024点，涨0.28%；韩国综指5067点，涨1.99%，守住5000点。\n #英伟达 周二盘后交出换帅后第一份三季报：营收1158亿美元，同比增103%，高于市场约1089亿美元的预期；数据中心1076亿美元；非GAAP每股收益2.68美元，高于约2.47美元的预期。第四季度营收指引中值1300亿美元，上下3%，也高于华尔街预期。毛利率指引下调到71%到72%，公司把这说成低点，并且指引不含中国数据中心计算收入。董事会主席表态不打算让黄仁勋复职，黄 e Data Centres 寻求的一笔可能增至 66 亿美元的贷款，规定由借款人负责遵守芯片准入限制。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXZX-Lwa8AAF1ob.png?name=orig"],"u":"https://x.com/dmjk001/status/2122981376454770752","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":930},{"id":"2122980923138552174","h":"cnfinancewatch","ts":1794993069,"zh":"A股：\n截至14:35，上证跌0.15%报3579.33点，深证跌0.10%报10628.37点，创业板翻红涨0.35%报2300.27点，科创50涨1.80%报1243.15点，是今天最清楚的主线。两市成交约1.24万亿元，上涨约1144只、下跌约4124只，涨停40只、跌停约38只。早盘给英伟达财报定价的高开，午后只在半导体制造、设备和算力租赁上留下差价；银行和电力走平，小家电和短剧继续兑现。盘面不是全面反攻，更像科技内部的事件反弹，外加白电龙头自己创新高。美股指期货已经把早盘涨幅吐掉大半，黄金和原油继续回落，尾盘不宜把科创50的反弹理解成风险偏好已经修复。\n#消息面\n隔夜英伟达财报营收和指引都高于预期，常规交易仍收155.46美元、跌0.44%，盘后一度涨约4%至5%。浑水在财报前宣布做空的扰动还在，四季度毛利率指引下调到71%至72%，且指引不含中国数据中心计算收入，开盘并没有把这些折干净。盘中三星电机宣布与英伟达加强合作，范围扩到MLCC；国内有媒体转述\n#中际旭创 $300308 订单能见度延伸到2028年、 #新易盛 $300502\n的1.6T持续放量，但两只股票分别只涨0.12%、跌1.21%，仍在20日低位附近，消息盖不住位置。11月17日工信部批准半导体设备与零部件质量管理体系行业标准，对已经过认证的设备商更有利，帮了制造和设备的忙。\n风格上，小家电和短剧继续出清。 #九阳股份 $002242 走出天地板，午后跌9.99%，换手超过20%，主力净流出约7.5亿元；\n#长虹美菱 $000521 早盘一字后炸板，现只涨0.21%。 #文投控股 $600715 、 #横店影视 $603103 跌停，\n#凯撒文化 $002425 跌9.89%。证监会午间回应，网传“要求基金公司上报全部产品AI敞口”不实；另有“国常会表态不再频繁救市”的传言也被澄清为谣言。北向资金当日净流入仍不披露。\n#研报面\n今天更贴盘面的是华龙证券电子行业三季报综述，认为半导体自主可控加速兑现；万联证券称三季度基金持仓向IT基础设施、软件和网络安全倾斜。这些报告解释了为什么设备和制造能扛住，但盖不住半导体ETF\n5日、20日仍在下跌。太平洋今天继续买入 #晶晨股份 $688099 、 #全志科技 $300458\n，逻辑是端侧AI，只作观察。中银证券点评10月社零同比只增0.4%、增幅回落，对必选消费是提醒，不是推翻。17日华鑫对 #特锐德\n$300001 、 #明阳电气 $301291 的买入，以及太平洋对检测设备和光刻胶的覆盖，仍当作事件背景。\n#热榜\n东财人气榜前排是 #九阳股份 $002242 、 #华胜天成 $600410 、 #常山北明 $000158 、 #有研新材 $600206\n、 #中际旭创 $300308 、 #长虹美菱 $000521 、 #北纬科技 $002148 、 #华东重机 $002685\n。九阳和美菱还在前十，已经是杀估值而不是进攻；华胜天成、华东重机、卡莱特是算力租赁连板的拥挤端。 #沪电股份 $002463\n升到前二十附近，和PCB反弹同向，但20日仍跌7%以上，热度不等于位置修复。同花顺热榜本档数据缺失。\n#资金面\n东财口径，截至约14:35，沪市主力净流出约34.4亿元，深市净流出约47.4亿元，两市合计约流出82亿元；科创50却净流入约37.1亿元，资金明显在指数内部搬家。行业上电子净流入约95亿元，半导体约43亿元，元件约43亿元，印制电路板约42亿元，通信约34亿元，半导体设备约18.6亿元，集成电路制造约11亿元。流出端是有色金属约38.5亿元、医药约32.4亿元、银行约23.5亿元、传媒约22.7亿元、电力设备约17.2亿元、家用电器约13.7亿元。个股上\n#沪电股份 $002463 净流入约11.9亿元， #寒武纪 $688256 、 #华虹公司 $688347 、 #华工科技 $000988\n、 #工业富联 $601138 、 #北方华创 $002371 承接明显； #紫金矿业 $601899 、 #九阳股份 $002242 、\n#有研新材 $600206 则在流出前排，有研新材涨5.4%却净流出约5.8亿元，是高位换手。南向额度显示沪、深各用满420亿元上限，只反映额度状态。融资余额仍是截至11月17日再减186.04亿元至22097.71亿元，没有盘中新数。跌停池接口只返回约38只的数量、未给出完整名单，跌停家数按此口径标注。","en":"A股：\n截至14:35，上证跌0.15%报3579.33点，深证跌0.10%报10628.37点，创业板翻红涨0.35%报2300.27点，科创50涨1.80%报1243.15点，是今天最清楚的主线。两市成交约1.24万亿元，上涨约1144只、下跌约4124只，涨停40只、跌停约38只。早盘给英伟达财报定价的高开，午后只在半导体制造、设备和算力租赁上留下差价；银行和电力走平，小家电和短剧继续兑现。盘面不是全面反攻，更像科技内部的事件反弹，外加白电龙头自己创新高。美股指期货已经把早盘涨幅吐掉大半，黄金和原油继续回落，尾盘不宜把科创50的反弹理解成风险偏好已经修复。\n#消息面\n隔夜英伟达财报营收和指引都高于预期，常规交易仍收155.46美元、跌0.44%，盘后一度涨约4%至5%。浑水在财报前宣布做空的扰动还在，四季度毛利率指引下调到71%至72%，且指引不含中国数据中心计算收入，开盘并没有把这些折干净。盘中三星电机宣布与英伟达加强合作，范围扩到MLCC；国内有媒体转述\n#中际旭创 $300308 订单能见度延伸到2028年、 #新易盛 $300502\n的1.6T持续放量，但两只股票分别只涨0.12%、跌1.21%，仍在20日低位附近，消息盖不住位置。11月17日工信部批准半导体设备与零部件质量管理体系行业标准，对已经过认证的设备商更有利，帮了制造和设备的忙。\n风格上，小家电和短剧继续出清。 #九阳股份 $002242 走出天地板，午后跌9.99%，换手超过20%，主力净流出约7.5亿元；\n#长虹美菱 $000521 早盘一字后炸板，现只涨0.21%。 #文投控股 $600715 、 #横店影视 $603103 跌停，\n#凯撒文化 $002425 跌9.89%。证监会午间回应，网传“要求基金公司上报全部产品AI敞口”不实；另有“国常会表态不再频繁救市”的传言也被澄清为谣言。北向资金当日净流入仍不披露。\n#研报面\n今天更贴盘面的是华龙证券电子行业三季报综述，认为半导体自主可控加速兑现；万联证券称三季度基金持仓向IT基础设施、软件和网络安全倾斜。这些报告解释了为什么设备和制造能扛住，但盖不住半导体ETF\n5日、20日仍在下跌。太平洋今天继续买入 #晶晨股份 $688099 、 #全志科技 $300458\n，逻辑是端侧AI，只作观察。中银证券点评10月社零同比只增0.4%、增幅回落，对必选消费是提醒，不是推翻。17日华鑫对 #特锐德\n$300001 、 #明阳电气 $301291 的买入，以及太平洋对检测设备和光刻胶的覆盖，仍当作事件背景。\n#热榜\n东财人气榜前排是 #九阳股份 $002242 、 #华胜天成 $600410 、 #常山北明 $000158 、 #有研新材 $600206\n、 #中际旭创 $300308 、 #长虹美菱 $000521 、 #北纬科技 $002148 、 #华东重机 $002685\n。九阳和美菱还在前十，已经是杀估值而不是进攻；华胜天成、华东重机、卡莱特是算力租赁连板的拥挤端。 #沪电股份 $002463\n升到前二十附近，和PCB反弹同向，但20日仍跌7%以上，热度不等于位置修复。同花顺热榜本档数据缺失。\n#资金面\n东财口径，截至约14:35，沪市主力净流出约34.4亿元，深市净流出约47.4亿元，两市合计约流出82亿元；科创50却净流入约37.1亿元，资金明显在指数内部搬家。行业上电子净流入约95亿元，半导体约43亿元，元件约43亿元，印制电路板约42亿元，通信约34亿元，半导体设备约18.6亿元，集成电路制造约11亿元。流出端是有色金属约38.5亿元、医药约32.4亿元、银行约23.5亿元、传媒约22.7亿元、电力设备约17.2亿元、家用电器约13.7亿元。个股上\n#沪电股份 $002463 净流入约11.9亿元， #寒武纪 $688256 、 #华虹公司 $688347 、 #华工科技 $000988\n、 #工业富联 $601138 、 #北方华创 $002371 承接明显； #紫金矿业 $601899 、 #九阳股份 $002242 、\n#有研新材 $600206 则在流出前排，有研新材涨5.4% 死自主科技迭代空间，彻底将AI行业收归单一权力掌控。\n奥特曼可以被员工与资本迎回，因为他服从垄断规则；黄仁勋永不回归，因为他掌控的是真正的行业命脉与科技主权。随着他彻底离场，维系全球AI融资循环、供应链稳定、产业创新的唯一核心锚点彻底崩塌。\n产业链信任裂痕、合作摩擦激增、融资闭环断裂、技术迭代减速，所有隐患集中爆发！无需漫长等待，短期1-2个月内，叠加Anthropic IPO落地，全球AI超级泡沫将彻底破裂。本轮AI牛市从来不是纯粹的技术牛市，而是黄仁勋个人信用托举的泡沫，人走茶凉，信仰崩塌，AI行业的结构性寒冬，正式开启！\n#黄仁勋 #AI泡沫崩盘 #英伟达 #全球科技格局 #算力周期拐点","en":"华尔街观察｜AI已经捆绑美股纳指合标普，泡沫迎来精准崩盘时刻\n核心暴论：#黄仁勋绝非被动离职，而是被顶级权力定点清除！ 他的永久离场，不是个人风波，而是全球科技权力洗牌的终极信号！当一个企业家构建出媲美主权大国GDP的跨国AI产业链联盟、足以制衡顶级地缘强权时，超强的个人能力、不受束缚的科技话语权，本身就是最大的原罪，本轮AI史诗级泡沫崩塌已成定局！\n市场始终在低估这场离职事件的致命性！坊间流传的芯片出口、私人风波全是烟雾弹，真实内核是权力忌惮。加拿大华裔学者蒋雪琴精准戳破真相：黄仁勋的离职，是行业、资本、地缘权力的联合围剿，且永久禁止回归，绝无翻盘可能。\n纵观全球商业史，从未有第二位企业家，能搭建出如此恐怖的超主权产业体系！黄仁勋一手缔造的英伟达生态，早已超越单一企业范畴：加州芯片设计、荷兰光刻机设备、东南亚产能增值、中国终端组装，串联起全球最精密的芯片供应链。他以个人极致的人脉、公信力与商业手腕，绑定台湾核心产业支柱，维系着全球AI算力的循环运转，这套产业链体量，足以媲美全球第五、第六大经济体GDP，形成独立于传统政治体系的科技商业联盟。\n更致命的是，他掌控着AI行业的生死命脉！独家搭建“芯片售卖+循环融资”的闭环生态，一手托举OpenAI、Anthropic等所有顶级AI巨头的生存根基。不同于依附资本、妥协权力的奥特曼，黄仁勋是纯粹的技术远见者，坚持开放创新、驱动行业迭代，拒绝沦为单一垄断权力的工具。\n正是这份不可替代、无法受控的绝对产业话语权，彻底触碰了顶级强权底线！在当下“劣币上位、能者出局”的畸形行业生态中，强权绝不允许出现游离于管控之外、足以制衡顶级帝国的科技力量。清除黄仁勋，本质是一场权力对科技的降维收割：扼杀个人超级影响力、拆解跨国产业联盟、锁死自主科技迭代空间，彻底将AI行业收归单一权力掌控。\n奥特曼可以被员工与资本迎回，因为他服从垄断规则；黄仁勋永不回归，因为他掌控的是真正的行业命脉与科技主权。随着他彻底离场，维系全球AI融资循环、供应链稳定、产业创新的唯一核心锚点彻底崩塌。\n产业链信任裂痕、合作摩擦激增、融资闭环断裂、技术迭代减速，所有隐患集中爆发！无需漫长等待，短期1-2个月内，叠加Anthropic IPO落地，全球AI超级泡沫将彻底破裂。本轮AI牛市从来不是纯粹的技术牛市，而是黄仁勋个人信用托举的泡沫，人走茶凉，信仰崩塌，AI行业的结构性寒冬，正式开启！\n#黄仁勋 #AI泡沫崩盘 #英伟达 #全球科技格局 #算力周期拐点","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122912292610449855","l":[],"ln":[],"t":["美股","AI科技"],"lk":5,"rt":1,"rp":1,"vw":1507},{"id":"2122911813826170891","h":"dmjk001","ts":1794976592,"zh":"12:27:19【监管要求基金公司上报全部产品AI敞口？证监会：不属实】财联社11月18日电，中国证监会新闻发言人答记者问。问：近日，发现互联网上传播“监管要求基金公司上报全部产品AI敞口”相关信息，请问这一情况是否属实？答：该信息不属实。公募基金投资运作依照《证券投资基金法》等法律法规和基金合同约定进行，投资标的、投资比例由基金管理人按照基金合同和内部投资决策程序自主确定。中国证监会依法履行监管职责，未向基金管理人提出相关数据报送要求。","en":"12:27:19【监管要求基金公司上报全部产品AI敞口？证监会：不属实】财联社11月18日电，中国证监会新闻发言人答记者问。问：近日，发现互联网上传播“监管要求基金公司上报全部产品AI敞口”相关信息，请问这一情况是否属实？答：该信息不属实。公募基金投资运作依照《证券投资基金法》等法律法规和基金合同约定进行，投资标的、投资比例由基金管理人按照基金合同和内部投 he Bank of Nvidia — which AI startups, computing providers and model developers around the world have come to depend on for multibillion-dollar investments and financial backstops — is becoming more discriminating.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122910221244698996","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-18/the-bank-of-nvidia-is-becoming-more-disciplined-and-selective?taid=6afd29d538c5130001c7b092&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["汇率","AI科技"],"lk":3,"rt":2,"rp":0,"vw":8099},{"id":"2122909626362699976","h":"cnfinancewatch","ts":1794976071,"zh":"X上有一种人！！！\n你关注他，他马上回关\n你评论他，他马上回复\n这种人流量不爆，谁爆？","en":"X上有一种人！！！\n你关注他，他马上回关\n你评论他，他马上回复\n这种人流量不爆，谁爆？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122909626362699976","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":612},{"id":"2122908950882353263","h":"business","ts":1794975910,"zh":"习近平敦促亚太经济体深化合作，同时警告单边主义和保护主义抬头​​，并在中国与全球领导人就贸易和技术举行高风险会谈之际捍卫自由贸易。","en":"Xi Jinping urged Asia-Pacific economies to deepen cooperation as he warned against rising unilateralism and protectionism, setting out a defense of free trade as China hosts global leaders for high-stakes talks on trade and technology.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122908950882353263","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-18/xi-warns-against-rampant-protectionism-ahead-of-trump-talks?taid=6afd28a66018910001a16422&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["关税贸易"],"lk":3,"rt":1,"rp":0,"vw":11574},{"id":"2122908284416053749","h":"tig88411109","ts":1794975751,"zh":"$NVDA 最新Q3财报财务数据和下一季预测全面超预期，粉碎的是空头的“半导体算力周期见顶和估值塌陷”的小作文陷阱。\n一个人能活成黄仁勋这种离职能带崩2万亿自己创业公司市值，还能带崩整个AI泡沫，那真是可以笑傲江湖了。如何真正的解读背后事件以及财报中关键的英伟达投资策略“范式”转移？\n真正的行业专家背景买方投资看的当然不只是一个收入和毛利超预期，这都是大概率。要看到这种英伟达顶级的技术路线和工程实现能力，这才是真正的护城河\n8月启动发售新一代Rubin第一个季度就200亿订单确认，部署效率1个月比上一代快一倍，而且新一代的token/瓦的效率是上一代Blackwell的十倍提升，意味着1GW的Rubin收入就是一年4-500亿。\n这不是简单卖GPU，而是真正的系统工程，自己的CPU/连接/安全芯片/明年上光互连CPO量产又一能效提升。加上模块化工厂，按上接点就挣钱。这个背景就是大的行业需求暴涨，特别是Agentic AI对于算力需求，哪怕老卡早期前2代的租金都在大涨。\n收入多元化除了云大厂占1半，这也是为什么英伟达要扶持第三方新云公司，包括企业/主权等收入，降低依赖于单一大客户风险，何况中国收入为0，目前北美/欧日等需求直接填补空档，供不应求。\n哪怕是市场担心的表外担保生态融资，来虚增收入，完全可以证伪。6400亿表外承诺，近4000亿是供应链采购承诺主要是锁定上游晶圆/HBM存储和封装产能，这是必须的，因为英伟达自己是轻资产，对于上游的供应链掌控重要性。当然老黄不在有短期影响，但对于英伟达这种体量客户，靠个人关系已经不是长久之计，必然规范大势所趋，这方面何况作为最大的客户，英伟达是甲方，不担心台湾供应链不保障的风险\n另外1000亿是自用云服务；真正新云neocloud保底租赁也就是320亿，而且都是有明确前置条件，就是全部上线才担保，现在供不应求之下，风险何在？另外1000多亿是OpenAI的20年独家租约，至少目前看不到证伪。\n目前市场大跌因为黄仁勋的时代落幕，当然作为创始人的远见和个人魄力是有折价，这主要体现在可能未来3-5年战略的选择，但是对于AI时代真正的王者和领头羊，老黄一人独裁的邪修管理风格，也是必然在企业进入系统化竞争的平台后，管理范式的转移，向“开宗立派”转移，只不过，他个人事件离职，加速了这个转移而已。\n从投资策略和估值角度，事件性冲击短期当然是重点，根据不同的事件会有好的买入时点，结合合理的估值，因为基本面虽然强，但是整体的估值溢价需要下调到一个中长期合理的区间，同时也要考虑本质性，一些竞争力丧失的风险，比如法律和治理风险，人才流失风险。\n颗粒度更细的投资策略和估值，见订阅者专享。教育分享。","en":"$NVDA 最新Q3财报财务数据和下一季预测全面超预期，粉碎的是空头的“半导体算力周期见顶和估值塌陷”的小作文陷阱。\n一个人能活成黄仁勋这种离职能带崩2万亿自己创业公司市值，还能带崩整个AI泡沫，那真是可以笑傲江湖了。如何真正的解读背后事件以及财报中关键的英伟达投资策略“范式”转移？\n真正的行业专家背景买方投资看的当然不只是一个收入和毛利超预期，这都是大概率。要看到这种英伟达顶级的技术路线和工程实现能力，这才是真正的护城河\n8月启动发售新一代Rubin第一个季度就200亿订单确认，部署效率1个月比上一代快一倍，而且新一代的token/瓦的效率是上一代Blackwell的十倍提升，意味着1GW的Rubin收入就是一年4-500亿。\n这不是简单卖GPU，而是真正的系统工程，自己的CPU/连接/安全芯片/明年上光互连CPO量产又一能效提升。加上模块化工厂，按上接点就挣钱。这个背景就是大的行业需求暴涨，特别是Agentic AI对于算力需求，哪怕老卡早期前2代的租金都在大涨。\n收入多元化除了云大厂占1半，这也是为什么英伟达要扶持第三方新云公司，包括企业/主权等收入，降低依赖于单一大客户风险，何况中国收入为0，目前北美/欧日等需求直接填补空档，供不应求。\n哪怕是市场担心的表外担保生态融资，来虚增收入，完全可以证伪。6400亿表外承诺，近4000亿是供应链采购承诺主要是锁定上游晶圆/HBM存储和封装产能，这是必须的，因为英伟达自己是轻资产，对于上游的供应链掌控重要性。当然老黄不在有短期影响，但对于英伟达这种体量客户，靠个人关系已经不是长久之计，必然规范大势所趋，这方面何况作为最大的客户，英伟达是甲方，不担心台湾供应链不保障的风险\n另外1000亿是自用云服务；真正新云neocloud保底租赁也就是320亿，而且都是有明确前置条件，就是全部上线才担保，现在供不应求之下，风险何在？另外1000多亿是OpenAI的20年独家租约，至少目前看不到证伪。\n目前市场大跌因为黄仁勋的时代落幕，当然作为创始人的远见和个人魄力是有折价，这主要体现在可能未来3-5年战略的选择，但是对于AI时代真正的王者和领头羊，老黄一人独裁的邪修管理风格，也是必然在企业进入系统化竞争的平台后，管理范式的转移，向“开宗立派”转移，只不过，他个人事件离职，加速了这个转移而已。\n从投资策略和估值角度，事件性冲击短期当然是重点，根据不同的事件会有好的买入时点，结合合理 ox’s gaming platform, the highest-profile examination of its safety record yet in the US","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122885046260437041","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/senate-hearing-condemns-roblox-s-child-safety-record?taid=6afd12626018910001a16360&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":7,"rt":2,"rp":1,"vw":11958},{"id":"2122884639262126465","h":"qinbafrank","ts":1794970113,"zh":"老黄离开后的英伟达三季度财报看点：本季大超预期下季及下一财年指引很强劲，对外新的投资担保谨慎，董事会明确不打算请回老黄。聊聊个人理解。\n1、具体数字很多地方都能看到，只说关键点：\n1）Vera Rubin开始正式交货、创造力英伟达历史上最快的爬坡记录，单季交付超过200亿美金，这个量级与公司本季约196亿美元的整体环比收入增量接近，说明新产品是增量来源，且新产品的交付本没有挤压原有产线的销售；\n2）下一季指引1300亿美元，达到所有买方卖方的最高预期水平。\n3）进一步上调了2028财年增长预期（本季是27财年第三季度），公司目前预计截至2028年1月的2028财年营收同比增长约75%，高于此前提出的70%以上增长目标。今年（2027财年）英伟达的营收应该能超过4200亿美金，那么明年（2028财年）按照75%的增速营收能超过7400亿美金。\n4）公司三财季通过回购和分红向股东返还281亿美元。剩余股票回购授权约2273亿美元，要在28年之前完成，意味着未来五个季度单季平均回购450亿美金的股票，回购力度已经达到单季自由现金流的规模。\n2、电话会议上临时CEO聊到几个关于产业的信息\n1）OpenRouter上的周度Token使用量同比激增35倍，过去三个月内增长了3.5倍。智能体工作负载目前占据约80%的Token量。\n自5月以来Token价格已下降近60%，这推动了Token使用量的加速增长和算力需求的扩张。也带动GPU租用价格跨代上涨——已有老一代GPU在多年期合同中以最高两倍的原价续约，而B300的租用费率自推出以来已上涨逾60%。\n2）CPO路线快速推进，规模化生产已经启动。Lambda宣布了英伟达光子CPO交换机的首个量产部署，连接逾1万颗GB300 GPU。与公开插拔式光模块方案相比，英伟达光子交换机的能效提升5倍，可靠性提升15倍，延迟降低10%。三季度，英伟达的网络业务收入超过210亿美元。这可能是看到的对上游产业链最利好的一个信息。\n3）Vera Rubin Ultra仍按计划于明年发布，Feynman将于2028年推出。\nPOD到货后即可直接连接部署，将上线时间从数月压缩至数周，大幅加快首次Token生成的时间。对于年收入规模达500亿美元的1吉瓦AI工厂而言，仅仅提前一个季度达到首次Token生成，就可能为运营商额外带来逾100亿美元的收入。\n4）云行业积压订单目前已达2.5万亿美元，较三个月前的2万亿美元进一步增长。\n3、资本生态\n截至第三财季末英伟达的供应承诺从上一财季的2790亿美元增加至3900亿美元，主要与多年期内存采购有关。\n此外公司云服务协议和数据中心租赁承诺合计达到1020亿美元，高于上一季度的740亿美元。\n如果进一步计入股权投资、资本开支等项目，英伟达披露的未来各项承诺合计达到5180亿美元。\n而相关融资担保敞口和Neocloud协议由公司另外列示：\n1）披露最高1180亿美元的第三方融资担保敞口。最大的一笔涉及俄亥俄州SB Energy建设的数据中心园区。英伟达提供的相关担保最高达到1050亿美元，项目将建设约4.25吉瓦的数据中心容量，并通过长达20年的租赁安排为OpenAI提供基础设施。\n2）公司还披露与新兴云服务商（Neoclouds）的相关承诺达到320亿美元。\n关于“英伟达是否准备收缩客户融资”，\nKress在会上发出了明确信号：英伟达在支持新兴云客户时将变得更加“克制和挑剔”。她表示公司正在“严格评估”各项投资、承诺和财务担保。\nKress详细划定了英伟达的担保底线：\n如果（数据中心建设）开始了，但不幸的是他们被推迟了，或者在建设方面遇到了挑战，我们的担保就不再存在了。我们对其中大多数项目的担保，实际上是基于它们准备就绪的时候。\n我的理解是：原有的仍在继续，但未来项目的筛选应该会更谨慎和严格。英伟达不再为早期的水泥建设或选址买单，只有当数据中心的土地、电力和外壳等基础设施真正就绪时，财务担保才会生效。\n这向其实发出一个明确信号：部分企业是时候自力更生了。对于Neocloud来说，27年要为生存而战了。\n4、关于老黄回归问题\n董事会主席Harvey Jones在电话会明确表示董事会不打算恢复黄仁勋的CEO职务。他透露，董事会目前正同步考察内外部的CEO候选人，并表示“此次遴选将会全面而审慎”，在“找到真正合适的人选”前，公司绝不会仓促推进。\n“先进芯片技术和国家安全形势正在改变英伟达的经营环境，而新任 CEO 必须能够妥善应对这些变化。”\n虽然昨晚老黄也表态了回归的意愿，但是今年电话会的表态我们也要做好未来老黄不能回归的准备。\n5、怎么看这份财报对市场的影响\n1）短期内强劲财报和下季下一财年的指引会提振市场的情绪，短期内可能会带动市场一波反弹。\n2）但中长期最大的考验还是如果老黄确定不能回归后，新的ceo能不能顶替上来。不然市场还是会对技术迭代的速度，产业生态支持力度心存疑虑。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"老黄离开后的英伟达三季度财报看点：本季大超预期下季及下一财年指引很强劲，对外新的投资担保谨慎，董事会明确不打算请回老黄。聊聊个人理解。\n1、具体数字很多地方都能看到，只说关键点：\n1）Vera Rubin开始正式交货、创造力英伟达历史上最快的爬坡记录，单季交付超过200亿美金，这个量级与公司本季约196亿美元的整体环比收入增量接近，说明新产品是增量来源，且新产品的交付本没有挤压原有产线的销售；\n2）下一季指引1300亿美元，达到所有买方卖方的最高预期水平。\n3）进一步上调了2028财年增长预期（本季是27财年第三季度），公司目前预计截至2028年1月的2028财年营收同比增长约75%，高于此前提出的70%以上增长目标。今年（2027财年）英伟达的营收应该能超过4200亿美金，那么明年（2028财年）按照75%的增速营收能超过7400亿美金。\n4）公司三财季通过回购和分红向股东返还281亿美元。剩余股票回购授权约2273亿美元，要在28年之前完成，意味着未来五个季度单季平均回购450亿美金的股票，回购力度已经达到单季自由现金流的规模。\n2、电话会议上临时CEO聊到几个关于产业的信息\n1）OpenRouter上的周度Token使用量同比激增35倍，过去三个月内增长了3.5倍。智能体工作负载目前占据约80%的Token量。\n自5月以来Token价格已下降近60%，这推动了Token使用量的加速增长和算力需求的扩张。也带动GPU租用价格跨代上涨——已有老一代GPU在多年期合同中以最高两倍的原价续约，而B300的租用费率自推出以来已上涨逾60%。\n2）CPO路线快速推进，规模化生产已经启动。Lambda宣布了英伟达光子CPO交换机的首个量产部署，连接逾1万颗GB300 GPU。与公开插拔式光模块方案相比，英伟达光子交换机的能效提升5倍，可靠性提升15倍，延迟降低10%。三季度，英伟达的网络业务收入超过210亿美元。这可能是看到的对上游产业链最利好的一个信息。\n3）Vera Rubin Ultra仍按计划于明年发布，Feynman将于2028年推出。\nPOD到货后即可直接连接部署，将上线时间从数月压缩至数周，大幅加快首次Token生成的时间。对于年收入规模达500亿美元的1吉瓦AI工厂而言，仅仅提前一个季度达到首次Token生成，就可能为运营商额外带来逾100亿美元的收入。\n4）云行业积压订单目前已达2.5万亿美元，较三个月前的2万亿美元进一步增长。\n3、资本生态\n截至第三财季末英伟达的供应承诺从上一财季的2790亿美元增加至3900亿美元，主要与多年期内存采购有关。\n此外公司云服务协议和数据中心租赁承诺合计达到1020亿美元，高于上一季度的740亿美元。\n如果进一步计入股权投资、资本开支等项目，英伟达披露的未来各项承诺合计达到5180亿美元。\n而相关融资担保敞口和Neocloud协议由公司另外列示：\n1）披露最高1180亿美元的第三方融资担保敞口。最大的一笔涉及俄亥俄州SB Energy建设的数据中心园区。英伟达提供的相关担保最高达到1050亿 news/newsletters/2026-11-17/the-fed-games-out-how-ai-could-reshape-work-and-the-economy?taid=6afcfc216018910001a16297&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":0,"rt":0,"rp":1,"vw":12424},{"id":"2122860388761084376","h":"Balder13946731","ts":1794964332,"zh":"今晚GTA 6发布 $TTWO","en":"今晚GTA 6发布 $TTWO","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2122860388761084376","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1301},{"id":"2122860058417811897","h":"ArtofSpecuycky","ts":1794964253,"zh":"确实，在这种市场环境下，日内交易的价格走势和交易机会更好（控制可接受的仓位就好）。大盘连续三天杀跌1%，反弹估计也是类似的轧空大涨，有波动就是非常好的做期权日内机会。在美国做不了合约，做做日内倒是挺好的。然后博反弹可以用看涨期权博，等诱多到了关键均线高位再大仓位做空","en":"确实，在这种市场环境下，日内交易的价格走势和交易机会更好（控制可接受的仓位就好）。大盘连续三天杀跌1%，反弹估计也是类似的轧空大涨，有波动就是非常好的做期权日内机会。在美国做不了合约，做做日内倒是挺好的。然后博反弹可以用看涨期权博，等诱多到了关键均线高位再大仓位做空","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ArtofSpecuycky/status/2122860058417811897","l":[],"ln":[],"t":[],"lk":7,"rt":2,"rp":0,"vw":3148},{"id":"2122859886719451391","h":"business","ts":1794964212,"zh":"亿万富翁斯坦·德鲁肯米勒 (Stan Druckenmiller) 表示，他看空铜，目前大多持观望态度","en":"Billionaire Stan Druckenmiller said he’s bearish on copper and mostly staying on the market sidelines for now","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122859886719451391","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/stan-druckenmiller-says-he-s-short-copper-neutral-on-equities?taid=6afcfaf46018910001a16286&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":14,"rt":4,"rp":5,"vw":13299},{"id":"2122858939792740644","h":"cnfinancewatch","ts":1794963986,"zh":"A股盘前第二版\n七点档的主结论还在，但外盘已经比当时热闹得多。第一版看到的美股指期货只是相对周二结算小幅翻红，现在标普500期货约7413点，较结算涨约0.72%；\n#纳指期货约27454点涨约1.40%；道指期货约50976点，涨约0.32%。\n亚洲开盘把这笔账做得更清楚：日经225约59448点，涨1.0%；韩国综指约5111点，#涨约2.87%，一度接近3%，昨天跌破的5000点已经收回。日本芯片股和软银集团早盘大涨，韩国三星电子、海力士和三星电机也明显走强。\n#三个方向不变：\n银行与红利、\n家电与必选消费、\n半导体制造的事件反弹。\n变化在于，第三方向的高开可能会比第一版预想的更猛，更要守住只观察、不追高，尤其不能把已经伤很重的CPO一并带进去。\n#消息面 两小时更新\n英伟达盘后涨幅一度扩大到约5%，临时CEO继续强调需求至少延伸到2028年，云业务未交订单约2.5万亿美元，并上调2028财年营收增长预期至75%。新出来的干扰也不少。做空机构浑水在财报前宣布做空英伟达，发布报告质疑其前全球现场运营高管与超微电脑前高管可能存在未披露关联，并把问题指向对华销售风险；浑水自己写明，相关身份尚未证实，两人也未被刑事指控。这是转述，不是已坐实的指控，但足够提醒：财报数字好，不等于开盘就能把位置问题一笔勾掉。另据报道，黄仁勋已同意出席美国参议院银行委员会听证会，日期未定。贝佐斯则称，若黄仁勋无法回归，英伟达应从内部寻找新CEO。Anthropic\nIPO仍被传超额认购10至20倍，发行价可能高于每股80美元，这是本周另一只靴子，不是今天开盘的加仓理由。10年期美债收益率在5%附近已经停留约27天，接近2007年的纪录，这根绳子并没有因为期货翻红就松开。\n国内可交易的新信息，更接近风险提示。截至11月17日，两市融资余额22097.71亿元，再减186.04亿元，沪市减78.24亿元、深市减107.8亿元，杠杆还在撤。\n#瀛通通讯 $002861 六天四板后公告，智能眼镜只是少量代工、收入占比不足1%，并提示情绪过热，热榜仍排在前二十，开盘不碰。短剧影视这边，\n#文投控股 $600715 、 #凯撒文化 $002425\n还在人气榜前排，改变不了昨天已经兑现的风险，一律不抄。集合竞价要到9点15分以后才有，截稿前无法采集，开盘强弱以9点25分竞价结果为准。\n#研报面 两小时更新\n今早和新结构更贴的，还是半导体设备与消费。#中信建投称半导体设备、材料和零部件板块业绩有望加速；华龙证券电子行业三季报综述认为自主可控加速兑现；国金证券优先看好国内存储渗透。这些报告只能当作事件反弹的背景，盖不住5日、20日仍在下跌的ETF位置，也不能覆盖浑水报告带来的情绪扰动。\n太平洋证券买入\n#晶晨股份 $688099 、 #全志科技 $300458 ，逻辑是端侧AI，不构成另开主线；\n同门还买入 #永和股份 $605020 、\n#安井食品 $603345 、 #宝立食品 $603170\n，后两只和必选消费同向，只作观察。\n#华泰看好国内储能中长期需求，#中信证券称原奶周期进入上行、稀土供需向好，都记在观察栏，不改今天三个方向。\n#热榜 两小时更新\n东财人气榜前排仍是 \n#华胜天成 $600410 、 #长虹美菱 $000521 、 #西陇科学 $002584 、 #九阳股份\n$002242 、 #有研新材 $600206 、 #华东重机 $002685 、 #海立股份 $600619 、 #中际旭创\n$300308 ， #小熊电器 $002959 、 #顺钠股份 $000533\n进入前十。\n和第一版相比，长虹美菱前移、九阳后撤，小家电和电子化学品还是最拥挤的一端。 \n#中际旭创 $300308\n仍在前十，但昨天继续收跌，热度和位置背离没有修复。同花顺热榜本档数据缺失。","en":"A股盘前第二版\n七点档的主结论还在，但外盘已经比当时热闹得多。第一版看到的美股指期货只是相对周二结算小幅翻红，现在标普500期货约7413点，较结算涨约0.72%；\n#纳指期货约27454点涨约1.40%；道指期货约50976点，涨约0.32%。\n亚洲开盘把这笔账做得更清楚：日经225约59448点，涨1.0%；韩国综指约5111点，#涨约2.87%，一度接近3%，昨天跌破的5000点已经收回。日本芯片股和软银集团早盘大涨，韩国三星电子、海力士和三星电机也明显走强。\n#三个方向不变：\n银行与红利、\n家电与必选消费、\n半导体制造的事件反弹。\n变化在于，第三方向的高开可能会比第一版预想的更猛，更要守住只观察、不追高，尤其不能把已经伤很重的CPO一并带进去。\n#消息面 两小时更新\n英伟达盘后涨幅一度扩大到约5%，临时CEO继续强调需求至少延伸到2028年，云业务未交订单约2.5万亿美元，并上调2028财年营收增长预期至75%。新出来的干扰也不少。做空机构浑水在财报前宣布做空英伟达，发布报告质疑其前全球现场运营高管与超微电脑前高管可能存在未披露关联，并把问题指向对华销售风险；浑水自己写明，相关身份尚未证实，两人也未被刑事指控。这是转述，不是已坐实的指控，但足够提醒：财报数字好，不等于开盘就能把位置问题一笔勾掉。另据报道，黄仁勋已同意出席美国参议院银行委员会听证会，日期未定。贝佐斯则称，若黄仁勋无法回 laneve-as-army-chief-despite-gop-doubts?taid=6afcf6446018910001a1623d&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":7,"rt":2,"rp":1,"vw":11051},{"id":"2122853597578657967","h":"business","ts":1794962713,"zh":"Common App 的数据显示，今年秋季美国大学的国际申请者比去年同期增长了 9%，扭转了唐纳德·特朗普总统对学生签证持有者打压导致的急剧下降趋势","en":"International applicants to US colleges this fall jumped by 9% from the same time last year, reversing a steep decline spurred by President Donald Trump’s crackdown on student visa holders, according to data from Common App","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122853597578657967","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/foreign-applicants-to-us-colleges-rebound-after-enrollment-drop?taid=6afcf51838c5130001c7af1e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":2,"rp":0,"vw":12474},{"id":"2122853536098877505","h":"cnfinancewatch","ts":1794962698,"zh":"#隔夜美股映射\n（一）美股去重榜前10领涨方向为交通运输航运JETS 20日+8.25%、水业FIW +7.56%、基建BILD +5.58%，但隔夜美股主要指数全线收跌，标普-1.03%、道指-1.64%，20日强势与隔夜方向背离。\n（二）映射个股须方向在美股去重榜前10且隔夜该方向收涨：昨日美股上涨板块仅能源油气UNG +2.24%、交通运输航运BDRY +2.06%、贵金属GDX +0.79%三个方向收涨，其中交通运输航运BDRY与去重榜JETS同向，权重上调一档，对应A股中远海控。\n（三）冲突处理：美股20日强势的消费、创新药隔夜均收跌（XLP -1.23%、IHI -1.06%），美股半导体博通昨+2.46%为带动性热股第一，虽不在去重榜前10，但隔夜方向明确，A股半导体设备K线未远离5日线，映射正确且位置可做，权重上调。\n#韩日开盘映射\n（一）韩国KOSPI 5124.17（+0.46%），日经225 59335.76（-0.55%），韩强日弱。\n（二）韩国存储半导体均+5.24%（SK海力士+5.97%、三星电子+4.52%），半导体设备与存储最强；日本半导体设备均+4.00%（爱德万测试+4.67%、迪思科+4.31%、东京电子+3.01%），精密制造均+0.53%，金融均-0.07%。\n（三）韩股存储强提高A股存储、半导体设备、封测权重；日股半导体设备强提高A股设备、材料权重，两者同向共振。\n（四）韩日半导体方向与隔夜美股博通+2.46%一致，定当日最高优先级；日经指数本身-0.55%与板块强势背离，仅作板块层面确认，指数层面降权。\n（五）韩日数据只用于确认半导体方向，不直接作买入理由。\n六、大盘风险开关\n（一）环境分42分，降仓档，只做回踩低吸不做追高。\n（二）指数位置：上证3584.58低于MA5 3631.59（-1.29%）、MA10 3650.77（-1.81%）、MA20 3654.66（-1.92%），沪深300、中证500、中证1000全部在5日线与10日线下方，中证1000偏离MA20达-5.83%最弱，属小盘弱势、权重相对抗跌格局。\n（三）期货升贴水：未获取。\n（四）涨跌停结构：窗口内龙虎榜涨停股以游资普通席位为主，成功率多在30%至45%，机构上榜多为卖出或分歧，赚钱效应一般，未见明显恶化但也无强势连板高度数据。\n（五）外盘冲击：隔夜美股三大指数收跌，日经-0.55%，仅韩国+0.46%与半导体板块强，外盘整体偏空但半导体结构性偏多。\n（六）综合：指数在均线下方、小盘弱、外盘偏空，环境分42分，降仓，只做半导体设备与消费的回踩低吸。\n#五大机构研报（窗口内）\n（一）华泰证券，11月18日，《互联网行业关注纯工具类平台和硬切软逻辑》，关注AI基础设施投入ROI边际变化。\n（二）中信证券，11月18日，《原奶周期进入上行通道 保持对牧业板块的推荐》，奶价终结五年下行。\n（三）中信证券，11月18日，《稀土行业供需向好 关注板块配置价值》，板块调整后配置价值凸显。\n（四）中信建投，11月18日，《半导体设备、材料、零部件板块业绩有望加速》，Q3半导体单季归母净利增速516%。\n（五）中信建投，11月17日，《十月底低点大概率已是本轮市场底，11月开启进二退一修复行情》，估值偏低。\n（六）中金公司，11月17日，《当前至12月有望迎来修复行情》，换手率降至3.6%，ETF净流入积极。\n（七）华泰证券，11月17日，《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》，必选与可选消费景气改善居前。\n（八）中信建投，11月16日，《注意估值风格切换的年末行情特征》，低估值盈利确定板块年末胜率高。\n#研报互证\n（一）方向一半导体设备与存储：互证结论月内强支撑。中信建投11月18日《半导体设备、材料、零部件板块业绩有望加速》直接覆盖设备材料；中信建投11月16日《持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现》覆盖算力硬件；中泰证券11月13日《AI产业趋势远未终结》覆盖电子。多家机构同向，方向权重上调一档。\n（二）方向二消费：互证结论月内强支撑。华泰证券11月17日《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》直接覆盖；中信证券11月18日《原奶周期进入上行通道 保持对牧业板块的推荐》覆盖食品农业链。两家同向，方向权重上调一档。\n（三）方向三军工航天：互证结论月内无支撑。近一个月华泰、中信建投、中信、中泰、中金五家研报库无军工航天直接覆盖，权重下调一档，仅作补涨观察。\n（四）主选股华海清科：月内强支撑，中信建投11月18日半导体设备研报覆盖设备环节，逻辑一致，权重上调。\n（五）主选股安井食品：月内单一支撑，华泰证券11月17日内需消费研报覆盖必选消费方向，未直接点名个股，维持原权重。\n（六）主选股中航光电：月内无支撑，五家机构近一个月无军工覆盖，权重下调，若同时与ETF榜不符则剔除，本方向仅美股AV映射、A股未进榜，降为观察性配置。\n（七）被研报否掉或剔除的标的：AI算力软件方向虽有多份研报支撑，但今日短线候选池该方向可作短线为零，行情数据与研报观点冲突，以行情为准，剔除；光伏储能方向研报有中信证券11月17日《储能发展规划出台》支撑，但A股同主题未进榜且候选池无达标个股，剔除。","en":"#隔夜美股映射\n（一）美股去重榜前10领涨方向为交通运输航运JETS 20日+8.25%、水业FIW +7.56%、基建BILD +5.58%，但隔夜美股主要指数全线收跌，标普-1.03%、道指-1.64%，20日强势与隔夜方向背离。\n（二）映射个股须方向在美股去重榜前10且隔夜该方向收涨：昨日美股上涨板块仅能源油气UNG +2.24%、交通运输航运BDRY +2.06%、贵金属GDX +0.79%三个方向收涨，其中交通运输航运BDRY与去重榜JETS同向，权重上调一档，对应A股中远海控。\n（三）冲突处理：美股20日强势的消费、创新药隔夜均收跌（XLP -1.23%、IHI -1.06%），美股半导体博通昨+2.46%为带动性热股第一，虽不在去重榜前10，但隔夜方向明确，A股半导体设备K线未远离5日线，映射正确且位置可做，权重上调。\n#韩日开盘映射\n（一）韩国KOSPI 5124.17（+0.46%），日经225 59335.76（-0.55%），韩强日弱。\n（二）韩国存储半导体均+5.24%（SK海力士+5.97%、三星电子+4.52%），半导体设备与存储最强；日本半导体设备均+4.00%（爱德万测试+4.67%、迪思科+4.31%、东京电子+3.01%），精密制造均+0.53%，金融均-0.07%。\n（三）韩股存储强提高A股存储、半导体设备、封测权重；日股半导体设备强提高A股设备、材料权重，两者同向共振。\n（四）韩日半导体方向与隔夜美股博通+2.46%一致，定当日最高优先级；日经指数本身-0.55%与板 22847494073934005","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":480},{"id":"2122847299852279932","h":"business","ts":1794961211,"zh":"了解全球市场动态","en":"Get up to speed on what's moving global markets","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122847299852279932","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/stock-market-today-dow-s-p-live-updates?taid=6afcef3a6018910001a161fa&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":1,"rt":1,"rp":1,"vw":11458},{"id":"2122846131453661578","h":"cnfinancewatch","ts":1794960932,"zh":"散户热议｜2026-11-18·早间\n数据时点：国内社区以11月17日收盘后至11月18日07:50前可见的公开帖为准；海外统计抓取于北京时间今早。本期邮箱新增一封11月17日晚间热点财经邮件，早间邮件截稿未到。韭研公社热帖列表可以打开，但针对今早英伟达财报的时间轴帖打开时暂无评论；国内讨论因此主要依据淘股吧收盘后的复盘，以及韭研17日下午到晚间仍在消化国产替代与出口管制的帖文。WallStreetBets帖文正文未能直接完整抓取，情绪统计来自StonkHub二手页面，已注明；Stocktwits英伟达个股页可以打开，情绪值为平台标示，不是我们自行计算的投票。\n国内：17日收盘的 #情绪是冰点，不是修复完成\n淘股吧“庄哥说股”11月17日16:57的《11.18盘前推演:77家跌停！九阳地天板！明天只有一种可能性！》，发帖时英伟达还没出数，页面显示浏览约8077次。作者写得很难受：上证只跌0.50%，但下跌约4119家、跌停约77家、涨停37家，两市成交约1.46万亿元继续缩量；早盘半导体和九阳涨停让人看到希望，午后又把希望收走。他把压力分成三层：#外围科技不确定性、量能不够、#高位题材亏钱效应连锁——文投控股跌停，吉视传媒大跌，北纬科技断板，#短剧和机器人继续补跌。对 #九阳股份，他记的是低开28.26元、盘中触及跌停，最终封在31.52元，走出地天板，并称之为“总龙头地位的再次确认”，但也提醒20%振幅说明风险不小。热门榜里，#华胜天成收涨停、三天两板；#有研新材涨停被视为材料方向的新强点；中际旭创跌3.90%、成交204.75亿元，仍被写成“机构恐慌出逃、趋势向下”；凯撒文化地天后炸板，被标成次日危险。对今天的预案，他看 #支撑3550点、3530点，压力3600点、3630点，最想先看跌停数量能否下来、指数能否收回3600，#再看九阳的承接、#有研新材和华胜天成有没有板块响应、#中际旭创能不能稳住。这些是出数前的社区预案，不是已经消化过财报的新共识。上述涨跌停和成交是社区口径，与金十统计的全天成交14576.95亿元、涨停37只大体相近，跌停家数我们未与交易所逐一核对。\n#最强主线写成国产替代，并称光刻胶涨幅靠前，催化是美国拟封堵通过海外数据中心远程获取算力，以及外交部、商务部的回应。另一篇16:49的盘面帖同时转述了SemiAnalysis大幅下调未来数年AI加速器资本开支预测，以及“董事会没有在考虑让黄仁勋回任”的消息。昇腾、光刻材料、华东重机、华胜天成、寒武纪、海光信息等名字仍在被来回点。针对“英伟达财报”的时间轴帖由@韭连板在11月18日凌晨发布，我们打开时页面显示暂无评论，因此不能把“公社已经形成统一看多或看空”写成事实。抓取范围有限，这里不编造更多引语。\n与券商口径的异同：#相同点是都看见了国产替代和制造、设备、材料的活口，也都没有把光模块写成同步修复。不同点是社区更愿意把#九阳地天板、#华东重机连板理解成情绪锚点和“明天可以继续做高度”，分析口径则更强调这是亏钱效应还没收敛时的局部高潮。被忽略的风险有三：一是把今早可能出现的科技高开，直接理解成风格已经切回成长，去追昨天已经涨停的有研新材、连板的华东重机，或者补涨还没企稳的中际旭创；二 #是在文投慈文跌停后再去抄短剧，把风险提示当成利空出尽；三是忽略毛利率指引下修和中国数据中心收入缺失，只记住“营收翻倍”。\n海外：持股社区在盘后欢呼，但七日统计仍略偏空\nStonkHub（二手，页面今早抓取）显示，过去7天有1101名WallStreetBets用户讨论英伟达，提及1507次，人数较上周的474人升132%。全Reddit口径下，7日共2608次提及，看多35.7%（930次）、中性23.0%、#看空41.3%（1077次），分类器平均置信度64%，不宜过度解读。统计还显示，讨论最密的一小时仍是美东17日16时，也就是常规交易收盘、财报尚未公布的时点。也就是说，这组略偏空的数字，主要反映的是财报前一周的恐惧，不能直接当成盘后投票。页面列出的高赞标题包括黄仁勋表态愿意回归，需要和董事会主席“不打算让他复职”分开看：前者是他本人的条件句，后者才是公司在电话会上的正式口径。\nStocktwits英伟达个股页可以直接打开。平台标示情绪为93、极端看多，关注人数约68.84万，并给出盘后报价约161.55美元、较收盘155.46美元涨约3.92%。评论区分化很清楚：有人写“空头完蛋了”“市盈率只有19”，把超预期和回购授权理解成反转；也有人提醒，盘后量不大、董事会强调不会让黄仁勋复职，担心次日开盘才是机构兑现的时候。这和七日WSB统计并不矛盾——持股社区在股价已经大跌之后，更愿意把一份超预期财报当成转折；期权和短线玩家在出数前更怕波动，七日窗口里看空仍略占上风。\n专业资金的制约，散户讨论里出现得更少：四季度毛利率指引下调到71%至72%，指引仍不含中国数据中心计算收入，Anthropic上市还在后头。A股散户若只把盘后涨3.9%理解成“外部利好已经落地，今天可以追连板和光模块”，就会把两套不同的交易揉在一起。\n小结：国内短线还停在17日冰点复盘和国产替代活口，海外持股社区已经在盘后欢呼，但七日统计仍偏谨慎。","en":"散户热议｜2026-11-18·早间\n数据时点：国内社区以11月17日收盘后至11月18日07:50前可见的公开帖为准；海外统计抓取于北京时间今早。本期邮箱新增一封11月17日晚间热点财经邮件，早间邮件截稿未到。韭研公社热帖列表可以打开，但针对今早英伟达财报的时间轴帖打开时暂无评论；国内讨论因此主要依据淘股吧收盘后的复盘，以及韭研17日下午到晚间仍在消化国产替代与出口管制的帖文。WallStreetBets帖文正文未能直接完整抓取，情绪统计来自StonkHub二手页面，已注明；Stocktwits英伟达个股页可以打开，情绪值为平台标示，不是我们自行计算的投票。\n国内：17日收盘的 #情绪是冰点，不是修复完成\n淘股吧“庄哥说股”11月17日16:57的《11.18盘前推演:77家跌停！九阳地天板！明天只有一种可能性！》，发帖时英伟达还没出数，页面显示浏览约8077次。作者写得很难受：上证只跌0.50%，但下跌约4119家、跌停约77家、涨停37家，两市成交约1.46万亿元继续缩量；早盘半导体和九阳涨停让人看到希望，午后又把希望收走。他把压力分成三层：#外围科技不确定性、量能不够、#高位题材亏钱效应连锁——文投控股跌停，吉视传媒大跌，北纬科技断板，#短剧和机器人继续补跌。对 #九阳股份，他记的是低开28.26元、盘中触及跌停，最终封在31.52元，走出地天板，并称之为“总龙头地位的再次确认”，但也提醒20%振幅说明风险不小。热门榜里，#华胜天成收涨停、三天两板；#有研新材涨停被视为材料方向的新强点；中际旭创跌3.90%、成交204.75亿元，仍被写成“机构恐慌出逃、趋势向下”；凯撒文化地天后炸板，被标成次日危险。对今天的预案，他看 #支撑3550点、3530点，压力3600点、3630点，最想先看跌停数量能否下来、指数能否收回3600，#再看九阳的承接、#有研新材和华胜天成有没有板块响应、#中际旭创能不能稳住。这些是出数前的社区预案，不是已经消化过财报的新共识。上述涨跌停和成交是社区口径，与金十统计的全天成交14576.95亿元、涨停37只大体相近，跌停家数我们未与交易所逐一核对。\n#最强主线写成国产替代，并称光刻胶涨幅靠前，催化是美国拟封堵通过海外数据中心远程获取算力，以及外交部、商务部的回应。另一篇16:49的盘面帖同时转述了SemiAnalysis大幅下调未来数年AI加速器资本开支预测，以及“董事会没有在考虑让黄仁勋回任”的消息。昇腾、光刻材料、华东重机、华胜天成、寒武纪、海光信息等名字仍在被来回点。针对“英伟达财报”的时间轴帖由@韭连板在11月18日凌晨发布，我们打开时页面显示暂无评论，因此不能把“公社已经 ,"vw":12943},{"id":"2122845427842383928","h":"nmasc_","ts":1794960765,"zh":"Scoop：Anthropic 最著名的风险投资支持者，包括红杉资本、Lightspeed、Iconiq 等，将在该公司 IPO 中投入更多资金","en":"Scoop: Anthropic's most notable VC backers including Sequoia, Lightspeed, Iconiq and more are set to pour more money into the company in its IPO","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/nmasc_/status/2122845427842383928","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/anthropic-backers-sequoia-lightspeed-set-to-invest-more-in-ipo?srnd=undefined","d":"bloomberg.com"}],"t":[],"lk":30,"rt":7,"rp":0,"vw":9269},{"id":"2122844812449874286","h":"cnfinancewatch","ts":1794960618,"zh":"三大利空方向（由强到弱）\n一、利率和流动性约束并没有被一份财报解除。已核实：美股11个主要行业全部收跌，金融跌1.87%，公用事业跌1.60%，连传统防守板块也没能幸免。纽约尾盘10年期美债收益率报5.0987%，仍在5.10%附近，盘中高见5.1494%；市场此前计价美联储12月加息25个基点的概率约96.8%。现货黄金约3849.59美元，仍靠近一年低位；美元指数17日收于103.485，当日微跌0.06%，所谓“创十八个月新高”更多是近日背景，不宜写成17日当天又创新高。WTI原油约85.74美元，已从更早的大跌中暂时稳住。英伟达自己也在用毛利率下修和“不含中国数据中心计算收入”提醒：增长还在，但质量预期和地缘约束没有消失。只要债券收益率不下来，成长股的估值修复就会反复被打折。\n二、CPO、光模块和已经受伤的AI硬件，不能自动兑现英伟达的超预期。晚间邮件把英伟达的影响直接映射到中际旭创、新易盛，这个映射在出数前就已和盘面脱节。已核实：台积电常规交易跌3.68%，软件指数IGV跌3.29%，阿里巴巴美股跌4.38%。创业板收盘跌破52周低位，说明成长股的亏钱效应还在指数层面确认。另一只靴子是Anthropic：CNBC援引消息称发行价可能高于70至78美元的指引区间，计划11月19日以代码ANT在纳斯达克上市；招股文件显示前九个月营收332.4亿美元，同期净亏损1040亿美元，其中大部分来自可转债和衍生工具公允价值变动。定价和首日表现会重新测量AI估值，不排除“英伟达数字很好、新股定价很贵、风险资产仍然摇摆”的组合。\n三、短剧影视和高位题材的亏钱效应还在扩散，不是“利空出尽”后的抄底窗口。已核实：文投控股跌9.89%，慈文传媒跌9.98%，横店影视跌停，短剧影视继风险提示之后继续兑现。人形机器人里，宇树科技跌11.97%，襄阳轴承跌10.01%；中国稀土跌10.00%。另一端则是局部高潮：阳光照明涨停并处于连板高位，华东重机三连板，华胜天成三天两板，九阳走出地天板。涨停少、跌停多，希望在上午给过一次、下午又收走，这是典型的容错率下降。复星医药董事长提议以2.5亿元至5亿元回购A股，对板块只是温和信号。今天如果因为英伟达高开去接力这些高位票，或者在跌停堆里捡短剧，证伪成本都会非常低。\n主要依据：英伟达2027财年三季报及电话会公开转述、家得宝官方业绩与任命公告、京东SEC附件、商务部与外交部公开表态、中国证券报所载上交所审核通过公告、海关出口数据的公开报道、新华社与美联社行情、金十成交统计、东方财富早餐中的利率与商品报价。以上为公开信息整理，不构成投资建议，投资有风险。","en":"三大利空方向（由强到弱）\n一、利率和流动性约束并没有被一份财报解除。已核实：美股11个主要行业全部收跌，金融跌1.87%，公用事业跌1.60%，连传统防守板块也没能幸免。纽约尾盘10年期美债收益率报5.0987%，仍在5.10%附近，盘中高见5.1494%；市场此前计价美联储12月加息25个基点的概率约96.8%。现货黄金约3849.59美元，仍靠近一年低位；美元指数17日收于103. 英伟达财报反应；隔夜与今早消息整理截至北京时间11月18日07:50。本期邮箱新增一封热点财经邮件（11月17日晚间20:10版，位于垃圾邮件），11月18日早间邮件截稿未到。该晚间邮件写于英伟达出数之前，其中对财报的预判不能当成已落实结果。凡标“邮件转述”的内容未逐条核实，其余已对照英伟达、家得宝等公司公告、京东向SEC提交的财报、商务部与外交部公开信息、交易所审核公告、海关出口数据的公开报道，以及新华社、美联社行情和主流媒体报道。\n今日判断\n凌晨落地的英伟达财报，是今天唯一足够改写叙事的新信息，但还不够改写仓位结构。已核实：三季度营收1158亿美元，同比增103%、环比增20%；数据中心收入1076亿美元，同比增110%；非GAAP每股收益2.68美元，GAAP为2.70美元。第四季度营收指引中值1300亿美元、上下浮动3%，公司明确指引不含中国数据中心计算收入。当季GAAP和非GAAP毛利率分别为74.8%和74.9%，但四季度毛利率指引下调到71%至72%。电话会上，临时CEO克雷斯把2028财年营收增长预期上调到75%，并称“一切照常”；董事会主席则明确表示，不打算让黄仁勋复职。黄仁勋本人在辞职后的首份声明里说，若董事会认为回归符合股东、员工、公司和美国利益，他愿意回来——这是他的态度，不是董事会的决定，两句话不能并成“马上回归”。财报还披露，董事会已于今年9月将回购授权上调1500亿美元，三季度回购加派息281亿美元，截至季末剩余授权约2273亿美元。\n常规交易里，英伟达收155.46美元，跌0.44%；盘后公开报价约161.55美元，涨约3.9%，盘后一度接近4%。数字是超预期的，盘后也给了反应，但美股三大指数昨天仍是四连跌：道指跌1.64%报50759.42点，标普500跌1.03%报7340.53点，纳指跌0.74%报24328.38点，11个主要行业全部收跌。A股昨天已经先走完自己的结构：上证跌0.50%报3584.58点，再失3600；创业板跌1.20%报2292.20点，收盘跌破52周低位；科创50反而涨0.62%。资金提前买的是制造、设备和材料，不是光模块。所以今天的基调很清楚：不要把超预期理解成成长风格已经反转。相对更稳的仍是银行红利和家电；半导体制造和设备只当成事件反弹观察，开盘不追；CPO和已经地天板、连板的题材票，不要并进同一笔交易。Anthropic的定价和上市也在这两天落地，是另一只靴子。\n三大利多方向（由强到弱）\n一、半导体制造、设备与材料的国产替代，是事件上最有弹性的方向，但必须和光模块拆开看。已核实：中芯国际三季度销售收入31.9亿美元，同比增33.9%，产能利用率升至97.3%；昨天中芯国际涨6.59%，华虹公司涨10.39%，北方华创涨4.09%，有研新材涨停，半导体板块主力净流入约29.6亿元，从上一交易日的流出第一转为流入第一。美国商务部本周公布新规，限制中国企业通过新加坡、马来西亚、泰国、印尼、巴西等地数据中心远程获取先进算力，存量业务须在90天内申请许可；中国商务部表示若美方一意孤行将采取反制，外交部称之为典型的经济胁迫和“长臂管辖”。这解释了为什么昨天修复的是国产制造和材料，而不是和英伟达订单绑定更紧的光模块——中际旭创跌3.90%，成交额204.75亿元居两市第一，新易盛跌4.08%。制约就在同一份财报里：毛利率指引下修、中国数据中心计算收入继续不计入、董事会人事并未“恢复原状”。有研新材已经涨停，中芯、华虹若高开后不能站稳，就是脉冲结束，而不是新趋势开始。开盘不追，更不要把CPO一并抬进去。\n二、家电与必选消费，是少数既有出口数字、又还没被亏钱效应打穿的方向。已核实：海关口径下，2026年10月家电出口4.02亿台，同比增14.1%，出口金额89.56亿美元，同比增20.9%，金额增速继续抬升。昨天美的集团涨0.70%，小家电里长虹美菱、小熊电器继续活跃。家得宝三季度销售额434亿美元，增4.9%，美国同店增2.2%，调整后每股收益3.86美元，并更新全年销售增长约4.5%、调整后每股收益增速约2.0%的指引，同时宣布财务总监麦克费尔将于11月23日接任CEO；但股价仍收跌约2.4%，报339美元附近，说明美股把“略超预期+换帅”理解成卖出机会，不能简单映射成A股家居建材要跟涨。真正该看的是出口链龙头，而不是已经走出地天板的九阳股份——该股昨天低开后触及跌停，再拉至涨停，淘股吧复盘记低开28.26元、收31.52元，振幅约20%，这是方向里已经拥挤的一端。制约：高位小家电和“羊”字辈的接力资金，随时可能被半导体高开抽走。\n三、银行与红利仍是防守底仓，但高位已经开始兑现。已核实：昨天工商银行涨0.11%，多只银行股仍在历史新高附近，但银行板块主力净流出约13.5亿元。上证失守3600，沪深成交14576.95亿元，再缩267.95亿元。东吴证券收购东海证券事项已获上交所并购重组委通过，交易对价约115.19亿元，后续仍待证监会注册，这只是券商整合的增量，改变不了昨天的缩量结构。\n邮件转述称尾盘有212亿元资金涌入宽基ETF、创业板ETF广发成交超50亿元创出天量。","en":"热点财经新闻综述｜2026-11-18·早间\n数据时点：A股为11月17日收盘；美股为美东11月17日收盘，并以盘后公开报价补充英伟达财报反应；隔夜与今早消息整理截至北京时间11月18日07:50。本期邮箱新增一封热点财经邮件（11月17日晚间20:10版，位于垃圾邮件），11月18日早间邮件截稿未到。该晚间邮件写于英伟达出数之前，其中对财报的预判不能当成已落实结果。凡标“邮件转述”的内容未逐条核实，其余已对照英伟达、家得宝等公司公告、京东向SEC提交的财报、商务部与外交部公开信息、交易所审核公告、海关出口数据的公开报道，以及新华社、美联社行情和主流媒体报道。\n今日判断\n凌晨落地的英伟达财报，是今天唯一足够改写叙事的新信息，但还不够改写仓位结构。已核实：三季度营收1158亿美元，同比增103%、环比增20%；数据中心收入1076亿美元，同比增110%；非GAAP每股收益2.68美元，GAAP为2.70美元。第四季度营收指引中值1300亿美元、上下浮动3%，公司明确指引不含中国数据中心计算收入。当季GAAP和非GAAP毛利率分别为74.8%和74.9%，但四季度毛利率指引下调到71%至72%。电话会上，临时CEO克雷斯把2028财年营收增长预期上调到75%，并称“一切照常”；董事会主席则明确表示，不打算让黄仁勋复职。黄仁勋本人在辞职后的首份声明里说，若董事会认为回归符合股东、员工、公司和美国利益，他愿意回来——这是他的态度，不是董事会的决定，两句话不能并成“马上回归”。财报还披露，董事会已于今年9月将回购授权上调1500亿美元，三季度回购加派息281亿美元，截至季末剩余授权约2273亿美元。\n常规交易里，英伟达收155.46美元，跌0.44%；盘后公开报价约161.55美元，涨约3.9%，盘后一度接近4%。数字是超预期的，盘后也给了反应，但美股三大指数昨天仍是四连跌：道指跌1.64%报50759.42点，标普500跌1.03%报7340.53点，纳指跌0.74%报24328.38点，11个主要行业全部收跌。A股昨天已经先走完自己的结构：上证跌0.50%报3584.58点，再失3600；创业板跌1.20%报2292.20点，收盘跌破52周低位；科创50反而涨0.62%。资金提前买的是制造、设备和材料，不是光模块。所以今天的基调很清楚：不要把超预期理解成成长风格已经反转。相对更稳的仍是银行红利和家电；半导体制造和设备只当成事件反弹观察，开盘不追；CPO和已经地天板、连板的题材票，不要并进同一笔交易。Anthropic的定价和上市也在这两天落地，是另一只靴子。\n三大利多方向（由强到弱）\n一、半导体制造、设备与材料的国产替代，是事件上最有弹性的方向，但必须和光模块拆开看。已核实：中芯国际三季度销售收入31.9亿美元，同比增33.9%，产能利用率升至97.3%；昨天中芯国际涨6.59%，华虹公司涨10.39%，北方华创涨4.09%，有研新材涨停，半导体板块主力净流入约29.6亿元，从上一交易日的流出第一转为流入第一。美国商务部本周公布新规，限制中国企业通过新加坡、马来西亚、泰国、印尼、巴西等地数据中心远程获取先进算力，存量业务须在90天内申请许可；中国商务部表示若美方一意孤行将采取反制，外交部称之为典型的经济胁迫和“长臂管辖”。这解释了为什么昨天修复的是国产制造和材料，而不是和英伟达订单绑定更紧的光模块——中际旭创跌3.90%，成交额204.75亿元居两市第一，新易盛跌4.08%。制约就在同一份财报里：毛利率指引下修、中国数据中心计算收入继续不计入、董事会人事并未“恢复原状”。有研新材已经涨停，中芯、华虹若高开后不能站稳，就是脉冲结束，而不是新趋势开始。开盘不追，更不要把CPO一并抬进去。\n二、家电与必选消费，是少数既有出口数字、又还没被亏钱效应打穿的方向。已核实：海关口径下，2026年10月家电出口4.02亿台，同比增14.1%，出口金额89.56亿美元，同比增20.9%，金额增速继续抬升。昨天美的集团涨0.70%，小家电里长虹美菱、小熊电器继续活跃。家得宝三季度销售额434亿美元，增4.9%，美国同店增2.2%，调整后每股收益3.86美元，并更新全年销售增长约4.5%、调整后每股收益增速约2.0%的指引，同时宣布财务总监麦克费尔将于11月23日接任CEO；但股价仍收跌约2.4%，报339美元附 ged suicidal thoughts in a 14-year-old boy who killed himself","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122842348165923233","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/states-press-for-scrutiny-in-sale-of-chatbot-said-to-harm-kids?taid=6afcea9e6018910001a161cf&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":8902},{"id":"2122842221611294821","h":"BloombergLive","ts":1794960000,"zh":"人工智能正在创造机会，以及全新的风险格局。\n趋势科技首席执行官 Eva Chen 与 @business 的 @leeminjeong83 一起登上 #BloombergInvest 东京舞台，讨论快速发展的技术如何改变网络安全、企业风险以及保护日益互联的全球经济所需的投资。\n了解更多：","en":"AI is creating opportunity — and an entirely new risk landscape.\nTrend Micro CEO Eva Chen joins @business' @leeminjeong83 on the #BloombergInvest Tokyo stage to discuss how rapidly evolving technology is changing cybersecurity, enterprise risk and the investment required to protect an increasingly connected global economy.\nLearn more:","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXVobjwXIAACr-U.jpg?name=orig"],"u":"https://x.com/BloombergLive/status/2122842221611294821","l":["bloom.bg"],"ln":[{"u":"http://bloom.bg/4t0PHhg","d":"bloom.bg"}],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":5839},{"id":"2122841034476675374","h":"bboczeng","ts":1794959717,"zh":"Gensler 警告：AI 热潮已是泡沫，终将破裂\n前美国证券交易委员会（SEC）主席加里·根斯勒（Gary Gensler）称，AI 热潮是一个泡沫，其背后是每年 8000 亿美元的基础设施支出，规模过大，部分环节还背负着债务。\n他预测经济将陷入衰退，程度可能比 2008 年温和，但与 2000 年代初的互联网泡沫破裂相似：大型科技公司将挺过去，规模较小的云服务提供商则会被整合或倒闭。\n美联储的凯文·沃什（Kevin Warsh）勾勒了三种 AI 情景，从生产率提升到就业岗位流失，再到热潮退去后的失望；与此同时，在通胀降温和油价下跌的背景下，市场大举押注 12 月加息。投资者彼得·席夫（Peter Schiff）警告称，由于美联储过去的政策，所有资产都存在泡沫。","en":"Gensler 警告：AI 热潮已是泡沫，终将破裂\n前美国证券交易委员会（SEC）主席加里·根斯勒（Gary Gensler）称，AI 热潮是一个泡沫，其背后是每年 8000 亿美元的基础设施支出，规模过大，部分环节还背负着债务。\n他预测经济将陷入衰退，程度可能比 2008 年温和，但与 2000 年代初的互联网泡沫破裂相似：大型科技公司将挺过去，规模较小的云服务提供商则会被整合或倒闭。\n美联储的凯文·沃什（Kevin Warsh）勾勒了三种 AI 情景，从生产率提升到就业岗位流失，再到热潮退去后的失望；与此同时，在通胀降温和油价下跌的背景下，市场大举押注 12 月加息。投资者彼得·席夫（Peter Schiff）警告称，由于美联储过去的政策，所有资产都存在泡沫。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122841034476675374","l":[],"ln":[],"t":["美联储","通胀","原油能源","AI科技"],"lk":4,"rt":0,"rp":1,"vw":939},{"id":"2122841004793327867","h":"business","ts":1794959710,"zh":"没有 Jensen 的 Nvidia 的连锁反应开始显现。","en":"The ripple effects of a Jensen-less Nvidia are starting to show up.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122841004793327867","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-17/one-of-the-biggest-weeks-in-the-ai-industry-s-history?taid=6afce95e6018910001a1619e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":6,"rt":0,"rp":5,"vw":11154},{"id":"2122840828473410042","h":"dmjk001","ts":1794959668,"zh":"路透：英伟达董事长表示董事会不会重新聘请黄仁勋担任 CEO\n英伟达董事会主席哈维·琼斯在周二的投资者电话会议开场时表示，这家 AI 芯片公司不会重新聘请联合创始人黄仁勋担任 CEO，也不会回答有关他离职的问题。\n琼斯表示，董事会已聘请高管猎头公司海德思哲协助寻找新任 CEO。“我们希望尽快任命 CEO，即常任 CEO，但在找到完全合适的人选之前，我们不会仓促推进，”他补充道。","en":"路透：英伟达董事长表示董事会不会重新聘请黄仁勋担任 CEO\n英伟达董事会主席哈维·琼斯在周二的投资者电话会议开场时表示，这家 AI 芯片公司不会重新聘请联合创始人黄仁勋担任 CEO，也不会回答有关他离职的问题。\n琼斯表示，董事会已聘请高管猎头公司海德思哲协助寻找新任 CEO。“我们希望尽快任命 CEO，即常任 CEO，但在找到完全合适的人选之前，我们不会仓促推进，”他补充道。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXYKNCbsAACWty.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122840828473410042","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1059},{"id":"2122840752397156444","h":"bboczeng","ts":1794959650,"zh":"为何粉丝流失94%后仍有100万粉丝\nX的投资者都是弱智吗？\n谢谢\n😅😅😅\n@aleabitoreddit","en":"Why does he still have 1M followers after losing 94%\nAre all investors in X retarded?\nThanks\n😅😅😅\n@aleabitoreddit","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXXXmaxbYAAOmoQ.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2122840752397156444","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":729},{"id":"2122840541239091505","h":"SCMPNews","ts":179495960 生于2026年6月下旬离开英伟达，而名为Cenly Chen的美超微前高管于2026年4月底或5月初离开美超微。Puri先生目前仍在英伟达担任高级顾问职务。\n目前没有任何政府对名为Cenly Chen的人提起刑事指控或作出其他刑事指控。集体诉讼中的指控尚未得到证实。\n问题在于：照片中与Puri先生同框、被认定为Cenly Chen或Cenly Puri的女子，是否就是曾在美超微任职的那位Cenly Chen。","en":"浑水正式开始做空英伟达\n一名被认定为Cenly Chen的女子（在部分照片标注中被称为Cenly Puri），在2024年至2026年间多次与Ajay K. Puri一同被拍到出现在公共场合。\n直到今年6月，Puri先生很可能都是英伟达的第三号高管，仅次于黄仁勋和Colette Kress。他的职位是全球现场运营执行副总裁（EVP Worldwide Field Operations），在2024至2026财年的总薪酬略高于Kress女士。\nPuri先生是2026年委托书中点名的仅有五位英伟达高管之一。\n另外，2026年10月针对美超微（SMCI）提起的合并集体诉讼起诉书称，美超微前首席增长官、一名叫Cenly Chen的女子\"负责管理SMCI从英伟达采购GPU芯片\"，并\"决定如何在美超微的客户之间分配英伟达的GPU\"。\n今年3月，美国对与美超微有关的三人提起刑事指控，其中包括一名联合创始人，指控他们通过一家东南亚的空壳公司，向中国最终客户非法销售至少约25亿美元搭载英伟达GPU的美超微服务器。针对这名美超微前高管，集体诉讼起诉书称，\"Cenly Chen不可能不知道SMCI的非法销售\"。\nPuri先生于2026年6月下旬离开英伟达，而名为Cenly Chen的美超微前高管于2026年4月底或5月初离开美超微。Puri先生目前仍在英伟达担任高级顾问职务。\n目前没有任何政府对名为Cenly Chen的人提起刑事指控或作出其他刑事指控。集体诉讼中的指控尚未得到证实。\n问题在于：照片中与Puri先生同框、被认定为Cenly Chen或Cenly Puri的女子，是否就是曾在美超微任职的那位Cenly Chen。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122808331026981192","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1140},{"id":"2122808328443113596","h":"business","ts":1794951920,"zh":"今天你玩Alphadots了吗？\n现在你可以看看你的解决能力与其他玩家相比如何！\n🧩 分享您的结果：","en":"Have you played Alphadots today?\nNow you can see how your solving skills compare with other players!\n🧩 Share your results:","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXW67QrXIAEyr9v.jpg?name=orig"],"u":"https://x.com/business/status/2122808328443113596","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/alphadots","d":"bloom.bg"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":13108},{"id":"2122808311850398184","h":"business","ts":1794951916,"zh":"美国突然推动达成全面协议以结束俄罗斯乌克兰战争，令欧洲陷入困境","en":"The sudden US push for a sweeping deal to end Russia’s war in Ukraine has Europe stuck in a bind","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122808311850398184","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/trump-s- 6843926167622","h":"bboczeng","ts":1794934876,"zh":"投资者大幅削减科技股超配仓位，降幅创纪录\n美国银行11月调查显示，投资者对科技股的净超配比例从上月的37%降至12%，为2006年以来的最大单月降幅。\n创纪录的38%受访者认为企业在AI上投资过度，52%预计某家大型超大规模云厂商将很快削减支出；AI泡沫风险成为他们最担忧的问题。\n尽管科技股仓位有所调整，但对经济衰退的担忧依然很低，仅为3%，现金持仓也处于极低水平，基金经理们在关键财报发布前更青睐2027年的国际股票。","en":"投资者大幅削减科技股超配仓位，降幅创纪录\n美国银行11月调查显示，投资者对科技股的净超配比例从上月的37%降至12%，为2006年以来的最大单月降幅。\n创纪录的38%受访者认为企业在AI上投资过度，52%预计某家大型超大规模云厂商将很快削减支出；AI泡沫风险成为他们最担忧的问题。\n尽管科技股仓位有所调整，但对经济衰退的担忧依然很低，仅为3%，现金持仓也处于极低水平，基金经理们在关键财报发布前更青睐2027年的国际股票。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122736843926167622","l":[],"ln":[],"t":["财报"],"lk":2,"rt":0,"rp":2,"vw":654},{"id":"2122736756927967474","h":"bboczeng","ts":1794934856,"zh":"英伟达在出口审查压力下成立国家安全监督委员会\n11月17日，英伟达宣布成立常设的\"国家安全与出口管制监督委员会\"，由新任董事Suzanne Nora Johnson担任主席，Stephen C. Neal和John O. Dabiri为成员。\n该委员会将监督公司的国家安全与全球贸易合规团队，并每季度与独立专家举行会议；与此同时，先进AI芯片正面临前所未有的国家安全障碍。\n此举发生在前首席执行官黄仁勋因涉嫌向中国转运芯片的调查而辞职之后，并获得了特朗普总统的赞扬，不过也有人质疑主席的金融背景，认为她缺乏科技或安全领域的经验。","en":"英伟达在出口审查压力下成立国家安全监督委员会\n11月17日，英伟达宣布成立常设的\"国家安全与出口管制监督委员会\"，由新任董事Suzanne Nora Johnson担任主席，Stephen C. Neal和John O. Dabiri为成员。\n该委员会将监督公司的国家安全与全球贸易合规团队，并每季度与独立专家举行会议；与此同时，先进AI芯片正面临前所未有的国家安全障碍。\n此举发生在前首席执行官黄仁勋因涉嫌向中国转运芯片的调查而辞职之后，并获得了特朗普总统的赞扬，不过也有人质疑主席的金融背景，认为她缺乏科技或安全领域的经验。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122736756927967474","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":2,"rt":0,"rp":0,"vw":813},{"id":"2122736584629846295","h":"business","ts":1794934814,"zh":"意大利经济专员瓦尔迪斯·东布罗夫斯基斯(Valdis Dombrovskis)表示，明年意大利的赤字可能会低于欧盟3%的上限，从而允许该国退出欧盟的特殊监控制度","en":"Italy’s deficit next year will likely be below the European Union’s 3% ceiling, allowing the country to exit the bloc’s special monitoring regime, Economy Commissioner Valdis Dombrovskis said","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122736584629846295","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/italy-may-exit-eu-monitoring-regime-next-year-dombrovskis-says?tai ":"bloomberg.com"}],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":1,"vw":12289},{"id":"2122734058971054534","h":"business","ts":1794934212,"zh":"随着年末的临近，私募股权的收购机器可能会闲置，但赞助商仍在想方设法从他们拥有的公司中榨取现金","en":"Private equity’s buyout machine may be idling as the year draws to a close, but sponsors are still finding ways to mint cash from the companies they own","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122734058971054534","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/private-equity-finds-a-year-end-window-to-take-cash-out-of-firms?taid=6afc85c438c51300013e02ad&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":0,"rp":3,"vw":13443},{"id":"2122733473031156081","h":"Kay2289123","ts":1794934073,"zh":"每个英伟达股东本日必读，黄仁勋刚刚发的 ⬇️\n“过去一周，来自朋友、行业同仁，以及素未谋面的人们的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份支持对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。\n英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将它建设成今天这样的公司，是我莫大的荣幸与荣耀。只有在美国，才有可能诞生像英伟达这样的公司。\n我深爱我们的国家，也深爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感懊悔。\n我愿意为自己的错误承担全部责任，并承诺全力配合董事会开展的独立调查。\n自从我离开公司以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重新出任首席执行官（CEO）。\n在公司面临复杂的技术、市场、竞争以及地缘政治局势之际，仍有许多人持续直接与我联系，希望我能够回归。\n英伟达是一家数十年甚至一代人才能诞生一次的非凡企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最佳利益，那么我将深感荣幸，愿意回应这些呼声，重新担任英伟达的首席执行官。\n再次感谢所有向我表达祝福与善意的人。你们的支持让我深受感动，也让我心怀谦卑与感激。\n最后，我想对我的家人说：我爱你们。我愿意用余生的每一天，努力成为一个配得上你们爱的人。\nJensen（黄仁勋）”","en":"每个英伟达股东本日必读，黄仁勋刚刚发的 ⬇️\n“过去一周，来自朋友、行业同仁，以及素未谋面的人们的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份支持对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。\n英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将它建设成今天这样的公司，是我莫大的荣幸与荣耀。只有在美国，才有可能诞生像英伟达这样的公司。\n我深爱我们的国家，也深爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感懊悔。\n我愿意为自己的错误承担全部责任，并承诺全力配合董事会开展的独立调查。\n自从我离开公司以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重新出任首席执行官（CEO）。\n在公司面临复杂的技术、市场、竞争以及地缘政治局势之际，仍有许多人持续直接与我联系，希望我能够回归。\n英伟达是一家数十年甚至一代人才能诞生一次的非凡企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最佳利益，那么我将深感荣幸，愿意回应这些呼声，重新担任英伟达的首席执行官。\n再次感谢所有向我表达祝福与善意的人。你们的支持让我深受感动，也让我心怀谦卑与感激。\n最后，我想对我的家人说：我爱你们。我愿意用余生的每一天，努力成为一个配得上你们爱的人。\nJensen（黄仁勋）”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Kay2289123/status/2122733473031156081","l":[],"ln":[],"t":["AI科技"],"lk":18,"rt":2,"rp":2,"vw":3469},{"id":"2122732810892960197","h":"business","ts":1794933915,"zh":"美国总统唐纳德·特朗普和泰国总理阿努廷·占维拉古表示，他们已“实质性结束”贸易谈判，推动这个东南亚盟友与其最大出口市场达成最终协议","en":"President Donald Trump and Thai Prime Minister Anutin Charnvirakul said they’ve “reached substantial conclusion” of trade negotiations, moving the Southeast Asian ally closer to a final deal with its biggest export market","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122732810892960197","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/us-thailand-reach-substantial-conclusion-of-trade-deal?taid=6afc849a38c51300013e02a6&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["关税贸易"],"lk":11,"rt":1,"rp":1,"vw":14201},{"id":"2122732717381157312","h":"bboczeng","ts":1794933892,"zh":"据英国《金融时报》报道，黄仁勋之女深度参与了英伟达就其与Megaspeed关系所展开的公开辩护工作。\n前英伟达首席执行官黄仁勋之女Madison Huang（黄敏珊），协助主导了公司应对外界对Megaspeed审视的举措。\n她的丈夫Nico Caprez在英伟达与这家总部位于新加坡的云服务商的交易接受调查期间，迅速晋升至人工智能基础设施领域的高级职位。\nMegaspeed采购了约50亿美元的英伟达硬件，并因芯片可能被转运至中国而受到美国方面的关注。\n英伟达董事会已启动内部调查，并设立了新的国家安全与出口合规委员会。","en":"据英国《金融时报》报道，黄仁勋之女深度参与了英伟达就其与Megaspeed关系所展开的公开辩护工作。\n前英伟达首席执行官黄仁勋之女Madison Huang（黄敏珊），协助主导了公司应对外界对Megaspeed审视的举措。\n她的丈夫Nico Caprez在英伟达与这家总部位于新加坡的云服务商的交易接受调查期间，迅速晋升至人工智能基础设施领域的高级职位。\nMegaspeed采购了约50亿美元的英伟达硬件，并因芯片可能被转运至中国而受到美国方面的关注。\n英伟达董事会已启动内部调查，并设立了新的国家安全与出口合规委员会。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122732717381157312","l":[],"ln":[],"t":["AI科技"],"lk":11,"rt":1,"rp":3,"vw":2215},{"id":"2122732382549868831","h":"CrushTheShorts","ts":1794933813,"zh":"回来吧 Goat！\n市场不需要那个没有睾丸的副 goat","en":"回来吧 Goat！\n市场不需要那个没有睾丸的副 goat","zh_src":"native","lang":"zh","m":["https://pbs.twi ,"t":[],"lk":189,"rt":7,"rp":18,"vw":12032},{"id":"2122726995134181532","h":"yijiangren","ts":1794932528,"zh":"我们确实需要 @JensenHuang\n但是这个发文时间是不是太巧了\n非要赶在暴跌的时候\n来救市","en":"我们确实需要 @JensenHuang\n但是这个发文时间是不是太巧了\n非要赶在暴跌的时候\n来救市","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVwxgsagAYo0u1.png?name=orig","https://pbs.twimg.com/media/HXVw8v4bYAA583X.png?name=orig"],"u":"https://x.com/yijiangren/status/2122726995134181532","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":0,"vw":1176},{"id":"2122726624538034520","h":"bboczeng","ts":1794932440,"zh":"过去一周，来自朋友、业内同行，以及许多素未谋面之人的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份情谊对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将英伟达建设成今天这样的公司，是我的荣幸，也是我的荣耀。只有在美国，才有可能诞生像英伟达这样的企业。我热爱我们的国家，也热爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感悔恨。我愿意为自己的错误承担全部责任，并承诺全力配合董事会正在进行的独立调查。\n自从我离职以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重返公司，重新担任首席执行官。在公司面临复杂的技术、市场、竞争和地缘政治局势之际，仍有许多人不断直接联系我。英伟达是一家一代人才能诞生一次的伟大企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最大利益，那么我将深感荣幸，愿意回应这些呼声，重新出任英伟达首席执行官。\n再次感谢所有向我表达美好祝愿的人。你们的支持让我深感谦卑，也令我无比感激。\n最后，我想对我的家人说：我爱你们。我将用余生的时间，努力成为一个配得上你们的爱的人。\n黄仁勋（Jensen）","en":"过去一周，来自朋友、业内同行，以及许多素未谋面之人的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份情谊对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将英伟达建设成今天这样的公司，是我的荣幸，也是我的荣耀。只有在美国，才有可能诞生像英伟达这样的企业。我热爱我们的国家，也热爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感悔恨。我愿意为自己的错误承担全部责任，并承诺全力配合董事会正在进行的独立调查。\n自从我离职以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重返公司，重新担任首席执行官。在公司面临复杂的技术、市场、竞争和地缘政治局势之际，仍有许多人不断直接联系我。英伟达是一家一代人才能诞生一次的伟大企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最大利益，那么我将深感荣幸，愿意回应这些呼声，重新出任英伟达首席执行官。\n再次感谢所有向我表达美好祝愿的人。你们的支持让我深感谦卑，也令我无比感激。\n最后，我想对我的家人说：我爱你们。我将用余生的时间，努力成为一个配得上你们的爱的人。\n黄仁勋（Jensen）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726624538034520","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":0,"rp":5,"vw":2302},{"id":"2122726565847138465","h":"bboczeng","ts":1794932426,"zh":"@JensenHuang 感谢您在 NVDA 发布灾难性收益报告之前挽救了其股票！","en":"@JensenHuang Thanks for saving NVDA stock right before its disastrous earnings report !","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/bboczeng/status/2122726565847138465","l":[],"ln":[],"t":["财报"],"lk":144,"rt":1,"rp":5,"vw":16439},{"id":"2122726498683547868","h":"business","ts":1794932410,"zh":"一组公共卫生专家周二表示，由于麻疹在社区中迅速传播，美国和墨西哥已经失去了长期以来消除麻疹的状态","en":"The US and Mexico have lost their long-standing measles elimination status after the disease spread rapidly through communities, a group of public health experts said on Tuesday","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122726498683547868","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/measles-now-endemic-across-the-americas-in-blow-to-public-health?taid=6afc7ebaa3d32e000116b99e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":3,"rp":3,"vw":13053},{"id":"2122726292936360342","h":"bboczeng","ts":1794932361,"zh":"刚开始暴跌，这会又开始拉盘了？\n😅😅😅","en":"刚开始暴跌，这会又开始拉盘了？\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726292936360342","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":4,"vw":1693},{"id":"2122726287219523973","h":"octopusycc","ts":1794932359,"zh":"世界需要你 AI也需要你","en":"世界需要你 AI也需要你","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/octopusycc/status/2122726287219523973","l":[],"ln":[],"t":[],"lk":14,"rt":0,"rp":0,"vw":2572},{"id":"2122726113965457844","h":"bboczeng","ts":1794932318,"zh":"又是定投VOO成功的一天\n等到多头全部认输，我们也就赢了\n😅😅😅","en":"又是定投VOO成功的一天\n等到多头全部认输，我们也就赢了\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726113965457844","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":2,"vw":1460},{"id":"2122726005219737649","h":"JensenHuang","ts":1794932292,"zh":"在过去的一周里，我被朋友、行业同事和素未谋面的人的爱和支持所感动。感谢所有对我和我的家人表示善意的人。这对我来说意味着整个世界。 53 年前我来到美国，成为美国公民是我一生中最伟大的礼物和最自豪的时刻之一。 NVIDIA 是我一生的事业。与我的同事们一起将其融入到今天的公司是一种荣幸。除了美国，其他任何地方都不可能出现像 NVIDIA 这样的公司。我爱我们的国家，我也爱 NVIDIA。 我没有达到 NVIDIA 每个人的期望标准，并且在个人生活中犯了严重错误。我给董事会带来了问题，对此我深感遗憾。我完全承认自己的错误，并致力于配合董事会的独立调查。自从我离职后，NVIDIA 的员工、投资者、业务合作伙伴和客户纷纷呼吁我重新担任首席执行官。当公司应对复杂的技术、市场、竞争和地缘政治动态时，许多人继续直接与我联系。 NVIDIA 是一家百年一遇的公司。如果董事会认为我的回归符合我们的股东、员工、公司和美国的最佳利益，我将很荣幸回应这些呼吁并重新担任首席执行官。 再次感谢所有分享美好祝愿的人。你们的支持让我深感荣幸。对我的家人：我爱你们，我会用我的余生来配得上你们。 詹森","en":"Over the past week, I’ve been overwhelmed by the love and support of friends, industry colleagues, and people I've never met. Thank you to everyone who has shown kindness to my family and me. It means the world to me.\nI came to the United States 53 years ago, and becoming an American citizen is one of the greatest gifts and proudest moments of my life. NVIDIA has been my life’s work. Building it into the company it is today alongside my colleagues has been a privilege and an honor. Nowhere but in America could a company like NVIDIA be possible. I love our country, and I love NVIDIA.\nI did not live up to the standards expected of everyone at NVIDIA, and I have made serious mistakes in my personal life. I created problems for the Board that I deeply regret. I own my mistakes completely, and I am committed to cooperating with the Board’s independent investigation.\nSince my departure, I’ve seen an outpouring of calls from NVIDIA’s employees, investors, business partners, and customers for me to return as CEO. Many continue to reach out to me directly as the company navigates complex technology, market, competitive, and geopolitical dynamics. NVIDIA is a once-in-a-generation company. If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO.\nThank you again to everyone who has shared their good wishes. I am profoundly humbled by your support. To my family: I love you, and I will spend the rest of my life being worthy of yours.\nJensen","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/JensenHuang/status/2122726005219737649","l":[],"ln":[],"t":["AI科技"],"lk":710385,"rt":79153,"rp":37986,"vw":24044000},{"id":"2122725463449829707","h":"xingpt","ts":1794932163,"zh":"“Nvidia CEO Huang: If the Board of Directors decides my return is in the best interest of shareholders, employees, the company, and the US, I would be honored to return as CEO - WSJ”\n老黄不会回来。\n如果老黄真的要回来，不会是这种在媒体的表态方式。而是会像 Sam Altman 一样，不管是找新的投资人，还是在董事会里找到自己的利益合伙人，直接逼宫新管理层。一定会用稳准狠的方式打出那张让董事会不得不让他回来的牌。\n而现在的这个语气听起来，老黄更多的只是在寻求舆论的支持，可能手里其实没有什么牌。","en":"“Nvidia CEO Huang: If the Board of Directors decides my return is in the best interest of shareholders, employees, the company, and the US, I would be honored to return as CEO - WSJ”\n老黄不会回来。\n如果老黄真的要回来，不会是这种在媒体的表态方式。而是会像 Sam Altman 一样，不管是找新的投资人，还是在董事会里找到自己的利益合伙人，直接逼宫新管理层。一定会用稳准狠的方式打出那张让董事会不得不让他回来的牌。\n而现在的这个语气听起来，老黄更多的只是在寻求舆论的支持，可能手里其实没有什么牌。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2122725463449829707","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":166},{"id":"2122725255609295113","h":"business","ts":1794932113,"zh":"由于通胀持续放缓，安哥拉央行延长货币宽松周期","en":"Angola’s central bank extended its monetary easing cycle as inflation continues to slow","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122725255609295113","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/angola-cuts-key-rate-for-fourth-time-in-row-as-inflation-slows?taid=6afc7d917d7c3100018f945f&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["通胀"],"lk":6,"rt":0,"rp":0,"vw":14728},{"id":"2122725040487796999","h":"octopusycc","ts":1794932062,"zh":"谢谢你\n谢谢大家","en":"谢谢你\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2122725040487796999","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":500},{"id":"2122725012700627369","h":"xiaomustock","ts":1794932056,"zh":"老黄一句话立马反弹了一小段，\n现在持仓就怕盘后英伟达财报的下季度指引出问题，万一增长跟不上ai交易的想象力，\n那全场完蛋。","en":"老黄 jong-uns-foreign-travels","d":"scmp.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":752},{"id":"2122709200312877151","h":"octopusycc","ts":1794928286,"zh":"英伟达今晚这份财报，数字已经不重要了\n北京时间明早 5:20 出数，6:00 电话会。\n共识营收 1,091 亿、EPS 2.47 美元。季报的数字其实早就落袋了——过去四个季度它都超自己指引中点 4.6% 到 5.7%，这次大概率还是超。\n所以今晚唯一还算数的数字，是四季度指引：市场要 1,250 亿。给不到，就是问题。\n但真正的定价权在「话」上。念数字的人换了：临时 CEO Colette Kress，干了 13 年 CFO，董事会还在挑正式人选。\n而这场电话会上最有杀伤力的一句话，三个月前就是她自己说的。8 月 26 日她给了 FY2028 营收增长约 70% 的展望，当场定性为「受供给约束」——当时华尔街只预期 44%。今晚她敢不敢原样再说一遍，就是全部。\n三个看点。\n一，四季度毛利率。她自己说过底部在 71%–72%，市场现在只给 70.2%。底部要是往下挪，整条 AI 硬件链一起重估。\n二，内存。8 月她把毛利率下滑归因于「内存极端定价」，而下游定价在涨、上游成本也在涨。重点不是成本多高，是她能不能把成本转出去。\n三，中国。指引里写死了「中国数据中心收入为零」，但做空机构 Culper 指控 FY26 有约两成计算收入由中国驱动，英伟达否认。\n市场会追着问东南亚那部分到底是谁的需求。\n钱已经在表态：一天之内至少九家机构下调目标价，均值从 343 砍到 217；期权隐含单日波动约 8%，对应 140 到 172 的区间。\n没有Jenson的第一个财报，Jenson之前的承诺还作数吗？\n我的MSX链接在这里：","en":"英伟达今晚这份财报，数字已经不重要了\n北京时间明早 5:20 出数，6:00 电话会。\n共识营收 1,091 亿、EPS 2.47 美元。季报的数字其实早就落袋了——过去四个季度它都超自己指引中点 4.6% 到 5.7%，这次大概率还是超。\n所以今晚唯一还算数的数字，是四季度指引：市场要 1,250 亿。给不到，就是问题。\n但真正的定价权在「话」上。念数字的人换了：临时 CEO Colette Kress，干了 13 年 CFO，董事会还在挑正式人选。\n而这场电话会上最有杀伤力的一句话，三个月前就是她自己说的。8 月 26 日她给了 FY2028 营收增长约 70% 的展望，当场定性为「受供给约束」——当时华尔街只预期 44%。今晚她敢不敢原样再说一遍，就是全部。\n三个看点。\n一，四季度毛利率。她自己说过底部在 71%–72%，市场现在只给 70.2%。底部要是往下挪，整条 AI 硬件链一起重估。\n二，内存。8 月她把毛利率下滑归因于「内存极端定价」，而下游定价在涨、上游成本也在涨。重点不是成本多高，是她能不能把成本转出去。\n三，中国。指引里写死了「中国数据中心收入为零」，但做空机构 Culper 指控 FY26 有约两成计算收入由中国驱动，英伟达否认。\n市场会追着问东南亚那部分到底是谁的需求。\n钱已经在表态：一天之内至少九家机构下调目标价，均值从 343 砍到 217；期权隐含单日波动约 8%，对应 140 到 172 的区间。\n没有Jenson的第一个财报，Jenson之前的承诺还作数吗？\n我的MSX链接在这里：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2122709200312877151","l":["msx.com"],"ln":[{"u":"http://msx.com/?code=h5cc95","d":"msx.com"}],"t":["AI科技","财报"],"lk":5,"rt":1,"rp":0,"vw":835},{"id":"2122709120315002904","h":"SCMPNews","ts":1794928266,"zh":"“中国问题”：英伟达危机和美国新的芯片限制令华盛顿和硅谷分裂","en":"‘China question’: Nvidia crisis and new US chip curbs split Washington and Silicon Valley","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/stat
