且协议条件更有利于供应商。","en":"韩国《每日经济新闻》报道，三星电子与苹果即将签署DRAM（动态随机存取存储器）长期供应协议（LTA）。作为全球最大的消费电子产品企业，苹果是大型科技公司中唯一一家尚未与三星电子签署LTA的企业。\n据业界17日消息，三星电子与苹果正在进行最后阶段的协议磋商。该协议拟从明年上半年开始生效，期限为4至5年。\n据悉，协议还将设定DRAM供应量下限，同时根据未来市场情况最终确定价格。此次协议背后，被认为是日益严峻的存储芯片供应紧张局面。\n分析认为，为确保iPhone、MacBook等核心产品所需DRAM的稳定供应，苹果最终选择签署长期供应协议。三星电子、SK海力士和美光等三大存储芯片制造商相继与主要客户签署LTA，也对苹果产生了影响。据悉，苹果近期也已与SK海力士签署存储芯片供应长期协议，且协议条件更有利于供应商。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUPqcka0AAe64P.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122620049089544371","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":0,"rp":0,"vw":4086},{"id":"2122619542530662470","h":"business","ts":1794906909,"zh":"澳大利亚政府将调查有关中国以“低于正常价值”出口结构木材产品的指控","en":"The Australian government will investigate allegations that China exported structural timber products at “less than their normal value”","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122619542530662470","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/australia-to-investigate-china-over-alleged-timber-dumping?taid=6afc1b1d38c51300013dfee5&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":2,"rt":0,"rp":3,"vw":12068},{"id":"2122618285468299405","h":"business","ts":1794906610,"zh":"中国铜冶炼产能经过多年快速扩张已接近顶峰","en":"Copper smelting capacity in China is nearing its peak after years of rapid expansion","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122618285468299405","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/china-copper-ore-smelting-capacity-nears-peak-as-margins-shrink?taid=6afc19f238c51300013dfee2&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":5321},{"id":"2122617756684046538","h":"RFI_Cn","ts":1794906484,"zh":"据消息人士向美国消费者新闻与商业频道透露，英伟达已向客户发出警告，称针对中国企业远程访问其人工智能芯片的新立法，可能使其自身及客户面临美国的“法律行动”。","en":"据消息人士向美国消费者 元，较周一再跌约1%，较上周五的88.56已经明显回落。10年期美债收益率周一收5.12%，美元指数约103.47，仍靠近近期高位。VIX周一升至22.91。\n高权重事件里， #CG Oncology $CGON\n公布三期PIVOT-006达到主要终点，膀胱癌复发风险下降68%，事件分最高；但周一放量收84.78，五日涨13.4%，20日涨41%，量比超过8倍，已经伸展，只看不追。\n#Powell工业 $POWL\n周一盘后公布四季度营收3.97亿美元，同比增33%，每股收益2.23美元，新订单7.10亿，积压订单升至27亿美元；周一股价已收151.20，处在20日区间59%，等回踩再看。\n#雷神技术 $RTX 积压订单升至1300亿美元，标普把信用评级上调至A-，但股价在区间中部，距20日高还有5.5%，不追。\n#研报面\n #苹果 卖方均值目标价345.57美元，买入16家、持有8家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。\n#菲利普斯66 $PSX 均值目标价299.13美元，区间258到346美元，买入6家无卖出，近四周EPS上修22家、下修2家。 #Grid\nDynamics $GDYN 均值13.75美元，4家全是买入，近四周EPS上修9家，但今天有律所发布股东调查通知，研报再好也先放一放。\n#资金面\nARK两只及以上基金同买的有三只。 #太空探索科技 $SPCX\n获ARKK与ARKW同买，合计约5190万美元，是本期金额最大的一笔；期权最大Put行权价135，距现价只差1.72%，偏空，和基金买入方向相反，不能算多头共振。\n#Block $XYZ 、 #Shopify $SHOP\n也是多基金同买，但股价分别在20日区间59%和29%，五日仍在回撤，位置不够。邮件还记了ARKQ买入 #火箭实验室 $RKLB\n约90万美元，公开交易记录未核验到；即便算上，期权最大Put行权价57贴着现价57.37，也是偏空，不算共振。\n带方向的期权里，只有 #苹果 最干净：最大Call行权价355距现价-0.36%，量仓比24.14，Call持仓增仓5.5%，三项同向。\n#菲利普斯66 最大Call量仓比4.84、Call持仓增仓1.3%，P/C成交比只有0.04，但行权价220距现价远了17%，只能记偏多、不能当贴价看涨。\n#Grid Dynamics 期权P/C成交比1.82，空单放量，没有多头共振。\n#期货\n邮件给出的持仓变化，量能口径更接近上周五：标普迷你OI增4.88万手、量比0.99，纳指迷你OI增9072手、量比1.05，价跌但量能未确认，暂不定性。微型纳指价跌OI降，属多头离场。10年期美债价涨OI降，属空头回补；30年期美债价跌OI降，属多头离场。原油价跌OI降3.45万手，多头离场；黄金价涨OI降，空头回补。周一股指继续下跌，今天盘前只是纳指期货略高、标普微跌，还看不到新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨13.45%、 $ITB 涨9.98%、 $PHO 与 $FIW 各涨9.61%、 $IHE 涨9.01%、\n$AGNG 涨8.72%、 $XHB 涨7.31%、 $XLV 涨6.96%、 $XLU 涨6.67%、 $XLP 涨6.18%、 $XLF\n涨5.67%。A股这边，消费50ETF涨9.40%、消费ETF涨6.93%、酒ETF涨6.44%、银行ETF涨5.77%领先。5日窗口，美股只有\n$XLE 涨2.83%、 $XLP 涨","en":"美股盘前下午版｜2026年11月17日 周二 北京时间15:05\n#结论\n今日大类只做两个：必选消费与公用事业的低波动防守，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置和资金共振的，只剩靠近前高的苹果；箱底的航天和炼油股还没走出右侧，医药事件票已经伸展，不进只做。\n #苹果 $AAPL 周一收352.78，跌0.98%，距20日高也是52周高360.83还有2.28%，处在近20日区间77%的位置。比上周五的1.3%远了一点，略宽于通常的2%门槛，仍按突破准备的回撤来看，不突破不进。期权最大Call行权价355，距现价只差0.36%，量仓比24.14，Call持仓增仓5.5%，三项同向偏多。卖方目标价均值345.57低于现价，近四周EPS下修16家、上修9家，只给半仓。\n明确不做：半导体和AI硬件，英伟达今晚美股盘后出换帅后第一份财报，周一收156.14，跌4.12%，处在20日区间只剩10%的位置；已经大涨或五日涨幅过大的品种；ARK同买但仍在阴跌的箱底票，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指分化。纳指期 s Marape told Chinese President Xi Jinping on Tuesday that it \"wasn't easy\" to close Taiwan's office in his country, acknowledging he faced domestic challenges in doing so.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122608242698211742","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/papua-new-guineas-prime-minister-says-taiwan-does-not-operate-there-anymore-2026-11-17/?taid=6afc109738c51300013dfeba&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":401},{"id":"2122608231105065080","h":"business","ts":1794904213,"zh":"ING 计划推出自己的 ETF，以迎合市场对快速增长的投资产品的需求","en":"ING is set to introduce its own ETFs as the lender seeks to tap into demand for the fast-growing investment products","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122608231105065080","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/ing-plans-to-break-into-etfs-with-two-debut-funds-in-germany?taid=6afc1095be5ec50001f2851e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":1,"rp":1,"vw":10445},{"id":"2122607980252111077","h":"qinbafrank","ts":1794904153,"zh":"美股又多了一个能影响股票定价的资产类型，永续合约这一币市原创终于在美股登堂入室。这两天才注意到本月初11月3日，CFTC主席Michael S. Selig 正式宣布，美股个股永续合约可以在符合条件的美国交易所开始交易。这些合约被依据CFTCRegulation 40.3 视为已批准定性为《商品期货现代化法案》下的 security futures products（证券期货产品），由 CFTC 和 SEC 联合监管。\n要求交易所必须同时满足：\n1）CFTC 的DCM牌照；\n2）SEC 的 notice-registered national securities exchange备案（针对 security futures）；\n要特别注意，这是直接挂钩美股正股价格的永续期货合约，不是很多加密交易所上的代币化股票（tokenized stocks）合约。这次美股个股永续合约是CFTC/SEC 框架下的 Equity Perps ，与加密交易所上的美股代币合约是安全不同产品。前者是美国监管机构批准能直接面对美国客户的产品，前者是监管灰色地带的产物。\nKalshi 已在11月5日前后上线，覆盖约50只大型个股（如 Nvidia、SpaceX、Micron 等）。上线10天左右名义成交量已达约50亿美元，单日部分热门标的（如 Nvidia）能到上亿美元级别。Coinbase已经在准备、Backpack也计划很快上线美股个股永续合约。\n这个意义还是非常大的，之前美股只有股指期货合约，并没有个股合约而永续合约更是币市原创，大家只能玩正股和期权。现在美股个股永续合约已经被正式批准，美股又多了一个能影响定价的资产类型。\n现在加密永续已经是一个日成交数千美元、年成交几十万亿美元接近百万亿美金级别的成熟市场。从长期天花板来看，美股个股永续合约（Equity Perps）的潜力确实更大，原因很直接：\n1）底层市场规模差距巨大\n美股市值远超加密资产。传统股权衍生品（股票/指数期货和期权）本身就是万亿美元级别的成熟市场，年合约成交量以百亿张计。如果美股永续能分到传统股权衍生品的一部分流量，或吸引新的杠杆/投机需求，规模很容易超过当前的加密永续。\n2）需求场景更广泛 加密永续高度依赖加密圈内的杠杆交易文化；美股永续则可以同时吸引传统股票投资者、对冲基金、散户杠杆需求，以及希望更简单做空的用户。\n当然短期内规模还需要时间，增长不会那么迅速。毕竟也有限制：\n1）目前美国合规版本的杠杆被压得较低（大致 5–7 倍左右），远低于离岸加密永续常见的 20–100 倍。\n2）产品才刚推出，流动性还在建立阶段；\n3）加密永续已经跑了近十年，生态和用户习惯非常成熟；美股永续还需要时间积累流动性、经纪通道和用户教育。\n现在还面临法律挑战：Cboe 和 Citadel 等组成的团体已起诉 CFTC，认为其无权批准这类产品。法官初步认为原告“很可能在实体问题上胜诉”，但拒绝了紧急禁令，最终结果还不确定、还要看双方博弈的情况。\n美股个股永续如果能在监管和法律挑战中站稳，并逐步提升流动性和可接受度，中长期确实有机会成长到比当前加密永续更大的规模，但那应该是几年后的事情了。","en":"美股又多了一个能影响股票定价的资产类型，永续合约这一币市原创终于在美股登堂入室。这两天才注意到本月初11月3日，CFTC主席Michael S. Selig 正式宣布，美股个股永续合约可以在符合条件的美国交易所开始交易。这些合约被依据CFTCRegulation 40.3 视为已批准定性为《商品期货现代化法案》下的 security futures products（证券期货产品），由 CFTC 和 SEC 联合监管。\n要求交易所必须同时满足：\n1）CFTC 的DCM牌照；\n2）SEC 的 notice-registered national securities exchange备案（针对 security futures）；\n要特别注意，这是直接挂钩美股正股价格的永续期货合约，不是很多加密交易所上的代币化股票（tokenized stocks）合约。这次美股个股永续合约是CFTC/SEC 框架下的 Equity Perps ，与加密交易所上的美股代币合约是安全不同产品。前者是美国监管机构批准能直接面对美国客户的产品，前者是监管灰色地带的产物。\nKalshi 已在11月5日前后上线，覆盖约50只大型个股（如 Nvidia、SpaceX、Micron 等）。上线10天左右名义成交量已达约50亿美元，单日部分热门标的（如 Nvidia）能到上亿美元级别。Coinbase已经在准备、Backpack也计划很快上线美股个股永续合约。\n这个意义还是非常大的，之前美股只有股指期货合约，并没有个股合约而永续合约更是币市原创，大家只能玩正股和期权。现在美股个股永续合约已经被正式批准，美股又多了一个能影响定价的资产类型。\n现在加密永续已经是一个日成交数千美元、年成交几十万亿美元接近百万亿美金级别的成熟市场。从长期天花板来看，美股个股永续合约（Equity Perps）的潜力确实更大，原因很直接：\n1）底层市场规模差距巨大\n美股市值远超加密资产。传统股权衍生品（股票/指数期货和期权）本身就是万亿美元级别的成熟市场，年合约成交量以百亿张计。如果美股永续能分到传统股权衍生品的一部分流量，或吸引新的杠杆/投机需求，规模很容易超过当前的加密永续。\n2）需求场景更广泛 加密永续高度依赖加密圈内的杠杆交易文化；美股永续则可以同时吸引传统股票投资者、对冲基金、散户杠杆需求，以及希望更简单做空的用户。\n当然短期内规模还需要时间，增长不会那么迅速。毕竟也有限制：\n1）目前美国合规版本的杠杆被压得较低（大致 5–7 倍左右），远低于离岸加密永续常见的 20–100 倍。\n2）产品才刚推出，流动性还在建立阶段；\n3）加密永续已经跑了近十年，生态和用户习惯非常成熟；美股永续还需要时间积累流动性、经纪通道和用户教育。\n现在还面临法律挑战：Cboe 和 Citadel 等组成的团体已起诉 CFTC，认为其无权批准这类产品。法官初步认为原告“很可能在实体问题上胜诉”，但拒绝了紧急禁令，最终结果还不确定、还要看双方博弈的情况。\n美股个股永续如果能在监管和法律挑战中站稳，并逐步提升流动性和可接受度，中长期确实有机会成长到比当前加密永续更大的规模，但那应该是几年后的事情了。","zh_src": iness&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":0,"rp":1,"vw":10253},{"id":"2122581801206005825","h":"business","ts":1794897911,"zh":"唐纳德·特朗普总统将于周二会见印度、澳大利亚和日本领导人，举行非正式安全小组高层聚会，然后本周晚些时候在中国与习近平举行备受期待的会晤。","en":"President Donald Trump will meet with the leaders of India, Australia, and Japan on Tuesday for a top-level gathering of their informal security group, ahead of his highly anticipated meetings with Xi Jinping later this week in China.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122581801206005825","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/trump-quad-india-australia-japan-economic-security-talks-before-xi-meeting?taid=6afbf7f738c51300013dfe47&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":2,"rp":3,"vw":12436},{"id":"2122581167417540855","h":"yijiangren","ts":1794897760,"zh":"想像玩游戏一样做交易吗？\n大家还记得前两天的 LOL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意思多了。\n二，交易也能像玩游戏一样升级\n这是我个人最喜欢的设计。\n引入了 XP、等级、成就和 Trading Drops 机制。\n交易产生的成交量可以转化为 XP，XP 累积之后可以提升等级。\n随着参与度增加，还能获得不同稀有度的 Mystery Box。\n里面有头像框、专属名牌、称号和弹幕样式等个性化道具。\n从 Common 到 Legendary，一共有四个稀有度。\n你甚至可以通过自己的等级、头像框和称号，让其他人知道你在这个社区里的身份。\n这就有点像 MMORPG 里的角色成长系统。\n每个人都有自己的等级、装备和专属身份。\n交易之外，还多了一层收集和养成的乐趣。\n三，把交易、社交和游戏放进同一个地方\n的底层交易接入 Hyperliquid。\n它把行情、交易执行、实时聊天室、K 线弹幕和游戏化奖励融合在一个界面里。\n这意味着你不需要在行情软件、X、Telegram 和 DEX 之间反复切换。\n看行情、讨论市场、观察其他人的观点，以及执行交易，都可以在同一个地方完成。\n这也是它和传统 DEX 最明显的差异。\n传统 DEX 更像一个交易终端， 则试图把它变成一个有社区、有互动、有成长体系的交易空间。\n我一直认为，加密的特殊之处在于：价格由交易决定，叙事靠社区传播，情绪在社交网络里发酵。\n如果这些东西能够在同一个产品里形成闭环，用户体验自然会发生变化。\n当然，游戏化奖励只是额外体验，没必要为了刷 XP 而过度交易。\n但我确实很喜欢 的产品思路。\n交易本来就可以很有趣。\n一个人盯盘是交易，一群人一起看市场、讨论行情、分享观点，或许才是加密社区更有生命力的样子。\n想体验一下这种交易方式，可以去看看：\nTrade together, farm fun together.","en":"想像玩游戏一样做交易吗？\n大家还记得前两天的 LOL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意思多了。\n二，交易也能像玩游戏一样升级\n这是我个人最喜欢的设计。\n引入了 XP、等级、成就和 Trading Drops 机制。\n交易产生的成交量可以转化为 XP，XP 累积之后可以提升等级。\n随着参与度增加，还能获得不同稀有度的 Mystery Box。\n里面有头像框、专属名牌、称号和弹幕样式等个性化道具。\n从 Common 到 Legendary，一共有四个稀有度。\n你甚至可以通过自己的等级、头像框和称号，让其他人知道你在这个社区里的身份。\n这就有点像 MMORPG 里的角色成长系统。\n每个人都有自己的等级、装备和专属身份。\n交易之外，还多了一层收集和养成的乐趣。\n三，把交易、社交和游戏放进同一个地方\n的底层交易接入 Hyperliquid。\n它把行情、交易执行、实时聊天室、K 线弹幕和游戏化奖励融合在一个界面里。\n这意味着你不需要在行情软件、X、Telegram 和 DEX 之间反复切换。\n看行情、讨论市场、观察其他人的观点，以及执行交易，都可以在同一个地方完成。\n这也是它和传统 DEX 最明显的差异。\n传统 DEX 更像一个交易终端， 则试图把它变成一个有社区、有互动、有成长体系的交易空间。\n我一直认为，加密的特殊之处在于：价格由交易决定，叙事靠社区传播，情绪在社交网络里发酵。\n如果这些东西能够在同一个产品里形成闭环，用户体验自然会发生变化。\n当然，游戏化奖励只是额外体验，没必要为了刷 XP 而过度交易。\n但我确实很喜欢 的产品思路。\n交易本来就可以很有趣。\n一个人盯盘是交易，一群人一起看市场、讨论行情、分享观点，或许才是加密社区更有生命力的样子。\n想体验一下这种交易方式，可以去看看：\nTrade together, farm fun together.","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXTsDEOaMAAZFZF.jpg?name=orig","https://pbs.twimg.com/media/HXTsF4sa4AAdoqe.jpg?name=orig","https://pbs.twimg.com/media/HXTsJZ5bsAAhdoR.jpg?name=orig","https://pbs. ）晚间，台北101外墙打灯声援辉达创办人黄仁勋。此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","en":"周一（11月16日）晚间，台北101外墙打灯声援辉达创办人黄仁勋。此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122554344130363392/vid/avc1/720x1280/yfIQvXLptTLEoPrY.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2122570437024678229","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":2,"vw":1559},{"id":"2122569336527458788","h":"cnfinancewatch","ts":1794894939,"zh":"超跌反弹会很快，所以这里仍然是“等结果”，不是单边看空到底。本周另一只靴子是Anthropic，计划18日定价、19日上市。\n二、短剧和高位题材的亏钱效应，今天已经从提示变成价格。已核实：文投控股开盘即靠近跌停，报3.37元，跌9.89%，盘中最高只到3.57元，午后仍封死跌停；浙文影业跌10.08%，大晟文化跌10.00%，慈文传媒跌近10%。这是对16日风险提示的兑现——前三季度营收1.80亿元、净亏3754.58万元，AI漫剧收入约占2.57%，并提示可能被实施退市风险警示。高位股同样在兑现：闽发铝业午间邮件记为12天7板后跌停（连板天数未逐日复核），大东方跌停，日出东方深跌。对短线交易者，这意味着亏钱效应正在从光模块扩散到连板；对还想接力“羊字辈”、广百、华东重机的人，赔率已经不好看。\n三、外部风险偏好没有转暖，银行红利今天也不是无脑避风港。已核实：港股恒生指数午间收报23571.61点，跌0.77%，恒生科技跌0.46%，科网股普遍调整，哔哩哔哩、百度跌幅靠前，华虹宏力则涨超9%。亚洲股市同步偏弱，FXStreet在北京时间13:01前后称，日经225跌约1.18%、报58960点附近，韩国KOSPI跌约1.79%、接近5000点；我们早间还记录到KOSPI盘中一度跌破5000点。银行板块午间走弱，银行ETF鹏华半日跌0.96%，新浪基金转述其重仓股里工商银行午间跌1.10%；13:28前后工商银行约跌0.33%，只是跌幅收窄，并没有重新走强。黄金、原油隔夜已明显走弱，美元走强的压力还在。邮件转述美联储官员倾向缓慢加息、部分机构喊出连续加息，未逐条核实原话，只作为外部约束的背景。银行和红利可以继续当作底仓，但昨天创历史新高之后，今天更适合看回踩，不适合把防御做成追高。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"超跌反弹会很快，所以这里仍然是“等结果”，不是单边看空到底。本周另一只靴子是Anthropic，计划18日定价、19日上市。\n二、短剧和高位题材的亏钱效应，今天已经从提示变成价格。已核实：文投控股开盘即靠近跌停，报3.37元，跌9.89%，盘中最高只到3.57元，午后仍封死跌停；浙文影业跌10.08%，大晟文化跌10.00%，慈文传媒跌近10%。这是对16日风险提示的兑现——前三季度营收1.80亿元、净亏3754.58万元，AI漫剧收入约占2.57%，并提示可能被实施退市风险警示。高位股同样在兑现：闽发铝业午间邮件记为12天7板后跌停（连板天数未逐日复核），大东方跌停，日出东方深跌。对短线交易者，这意味着亏钱效应正在从光模块扩散到连板；对还想接力“羊字辈”、广百、华东重机的人，赔率已经不好看。\n三、外部风险偏好没有转暖，银行红利今天也不是无脑避风港。已核实：港股恒生指数午间收报23571.61点，跌0.77%，恒生科技跌0.46%，科网股普遍调整，哔哩哔哩、百度跌幅靠前，华虹宏力则涨超9%。亚洲股市同步偏弱，FXStreet在北京时间13:01前后称，日经225跌约1.18%、报58960点附近，韩国KOSPI跌约1.79%、接近5000点；我们早间还记录到KOSPI盘中一度跌破5000点。银行板块午间走弱，银行ETF鹏华半日跌0.96%，新浪基金转述其重仓股里工商银行午间跌1.10%；13:28前后工商银行约跌0.33%，只是跌幅收窄，并没有重新走强。黄金、原油隔夜已明显走弱，美元走强的压力还在。邮件转述美联储官员倾向缓慢加息、部分机构喊出连续加息，未逐条核实原话，只作为外部约束的背景。银行和红利可以继续当作底仓，但昨天创历史新高之后，今天更适合看回踩，不适合把防御做成追高。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122569336527458788","l":[],"ln":[],"t":["美联储","A股港股","原油能源","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":443},{"id":"2122569332261798273","h":"cnfinancewatch","ts":1794894938,"zh":"热点财经新闻综述｜2026-11-17·午间\n数据时点：A股以11月17日午间收盘（北京时间11:30）为主，并用13:28前后的公开行情补充午后变化；港股为午间收盘；外盘与海外消息整理截至北京时间13:30左右。本期邮箱新增两封热点财经邮件（11月17日早间08:10版、午间13:10版），均在垃圾邮件中。凡标“邮件转述”的内容未逐条核实，其余已对照新华财经、中新经纬、每日经济新闻、证券时报、澎湃、公开行情及已披露公司文件。\n今日判断\n今天上午的剧本，几乎是昨天的镜像。指数低开后翻红，半导体和光刻机把昨天的杀跌往回修，银行和短剧则在吐出涨幅。已核实：截至午间收盘，上证报3602.07点，微跌0.01%；深证成指报10764.88点，涨0.69%；创业板指报2336.80点，涨0.72%；科创50报1253.91点，涨3.31%，早盘一度跌超1%。北证50涨2.44%，报857.01点。新华财经称沪深半日成交约8946亿元，较上一交易日半日缩量59亿元；中新经纬则写半日成交约9010亿元、超3500只个股上涨。金融界统计，截至12:30两市约42只涨停。\n但这不是风格已经切回来了。光模块并没有跟上半导体的反弹，英伟达还要到北京时间18日凌晨才公布黄仁勋离职后的首份财报。更直接的信号是午后开盘后反弹明显回吐：截至13:28前后，上证跌约0.26%，创业板由午间的上涨转为下跌约0.72%，科创50涨幅从3.31%收窄到约1.22%。上午的修复，更像财报前的超跌反弹，叠加上国产替代交易，不是可以追高的趋势反转。短剧这边，昨天提示的风险今天兑现了——文投控股、浙文影业、大晟文化跌停，慈文传媒接近跌停。\n三大利多方向（由强到弱）\n一、半导体设备材料与晶圆代工的国产替代，是今天最强的主线，但要把它和光模块分开看。已核实：午间中芯国际、华虹宏力大幅上扬，午间邮件记为分别涨7.43%、11.59%；有研新材、伟测科技涨停，联合化学、国林科技触及20%涨停。新华财经称半导体、光刻机、消费电子、OLED等居前。逻辑上有三条，但要分清新旧：中芯国际三季度营收31.90亿美元、同比增33.9%、环比增6.1%，产能利用率由二季度的93.7%升至97.3%，毛利率29.9%，这是11月12日前后已披露的业绩，不是今天的新财报，四季度指引还略有回落；每日经济新闻提到，上海微电子新一代光刻机日前亮相，称国产前道干式光刻机已在国内量产线运行；另据港股报道，美国商务部16日出台临时规定，限制部分国家通过远程方式访问先进人工智能芯片和服务器，强化了国产算力替代的交易情绪。对谁有影响：晶圆代工、光刻机和电子化学品今天接到了钱；中际旭创、新易盛、东山精密没有一起涨——午间邮件记为分别跌2.93%、3.79%、3.99%，公开行情还显示中际旭创盘中低见385元、跌破400元。投资含义是：今天强的是“国产替代和超跌修复”，不是“全球算力链已经翻多”。制约很硬：英伟达财报今晚落地，午后科创50已经在吐出涨幅，财报前不宜把反弹当成新主线去追。\n二、家电和部分必选消费，资金仍在，但龙头已经走到情绪极限。已核实：九阳股份早盘最低25.79元、触及跌停，随后拉升至31.52元涨停，振幅20%，成交超过34亿元，证券时报e公司报道封单超过13万手，走出“地天板”。阳光照明同步涨停，澎湃称继续引领所谓“羊字辈”炒作；长虹美菱、小熊电器走出2连板，北鼎股份涨超15%，美的集团午后仍小幅上涨。这和昨天的逻辑是连续的：科技股出清时，资金去买有出口和内销故事的家电。但九阳自9月28日以来累计涨幅超230%（证券时报口径；每日经济新闻若从8月底起算则写约294%），此前异常波动公告已说明参股机器人相关公司属财务性投资、对当期营收和利润无重大影响。地天板是情绪交易的极致，不是基本面突变。制约：高位股的赔率已经变差，若半导体午后继续回流，家电的接力资金会被抽走。\n三、流动性和个别政策是托底，不是今天的交易主线。已核实：央行17日开展7140亿元隔夜逆回购，利率1.25%，当日有4600亿元逆回购到期，Wind口径单日净投放2540亿元。商务部等9部门发布意见，推动新能源汽车“车电一体报废”回收拆解，这是中期政策线索。华为算力方向也有局部高潮，华胜天成涨停、走出3天2板，真视通、嘉环科技涨停，拓维信息跟涨。这些能解释为什么下跌之后仍有活钱，但连板股波动加大，广百股份4连板、华东重机3连板，已经是短线博弈而不是配置。邮件转述的“11月16日股票型ETF净申购216亿元、融资余额减少214.1亿元”，是上一交易日的资金数据，不宜写成今日增量。\n三大利空方向（由强到弱）\n一、英伟达财报与管理层真空，仍是本周最硬的空头约束。已核实：公司将于美西时间11月17日13:20、也就是美东16:20左右、北京时间18日凌晨5:20前后公布2027财年第三季度业绩，这是首席财务官科莱特·克雷斯以临时CEO身份主持的首份财报。董事会知情人士向CNBC等表示，暂不考虑让黄仁勋回归，当前重点仍是相关调查。周一英伟达跌4.12%，收156.14美元，纳指跌2.49%。今天A股半导体能反弹，恰恰说明有资金在抢国产替代和超跌，但光模块没有跟上，说明全球算力链的风险并没有被消化。制约的另一面是：若指引稳住，","en":"热点财经新闻综述｜2026-11-17·午间\n数据时点：A股以11月17日午间收盘（北京时间11:30）为主，并用13:28前后的公开行情补充午后变化；港股为午间收盘；外盘与海外消息整理截至北京时间13:30左右。本期邮箱新增两封热点财经邮件（11月17日早间08:10版、午间13:10版），均在垃圾邮件中。凡标“邮件转述”的内容未逐条核实，其余已对照新华财经、中新经纬、每日经济新闻、证券时报、澎湃、公开行情及已披露公司文件。\n今日判断\n今天上午的剧本，几乎是昨天的镜像。指数低开后翻红，半导体和光刻机把昨天的杀跌往回修，银行和短剧则在吐出涨幅。已核实：截至午间收盘，上证报3602.07点，微跌0.01%；深证成指报10764.88点，涨0.69%；创业板指报2336.80点，涨0.72%；科创50报1253.91点，涨3.31%，早盘一度跌超1%。北证50涨2.44%，报857.01点。新华财经称沪深半日成交约8946亿元，较上一交易日半日缩量59亿元；中新经纬则写半日成交约9010亿元、超3500只个股上涨。金融界统计，截至12:30两市约42只涨停。\n但这不是风格已经切回来了。光模块并没有跟上半导体的反弹，英伟达还要到北京时间18日凌晨才公布黄仁勋离职后的首份财报。更直接的信号是午后开盘后反弹明显回吐：截至13:28前后，上证跌约0.26%，创业板由午间的上涨转为下跌约0.72%，科创50涨幅从3.31%收窄到约1.22%。上午的修复，更像财报前的超跌反弹，叠加上国产替代交易，不是可以追高的趋势反转。短剧这边，昨天提示的风险今天兑现了——文投控股、浙文影业、大晟文化跌停，慈文传媒接近跌停。\n三大利多方向（由强到弱）\n一、半导体设备材料与晶圆代工的国产替代，是今天最强的主线，但要把它和光模块分开看。已核实：午间中芯国际、华虹宏力大幅上扬，午间邮件记为分别涨7.43%、11.59%；有研新材、伟测科技涨停，联合化学、国林科技触及20%涨停。新华财经称半导体、光刻机、消费电子、OLED等居前。逻辑上有三条，但要分清新旧：中芯国际三季度营收31.90亿美元、同比增33.9%、环比增6.1%，产能利用率由二季度的93.7%升至97.3%，毛利率29.9%，这是11月12日前后已披露的业绩，不是今天的新财报，四季度指引还略有回落；每日经济新闻提到，上海微电子新一代光刻机日前亮相，称国产前道干式光刻机已在国内量产线运行；另据港股报道，美国商务部16日出台临时规定，限制部分国家通过远程方式访问先进人工智能芯片和服务器，强化了国产算力替代的交易情绪。对谁有 m_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":4,"rt":1,"rp":3,"vw":2329},{"id":"2122515171247534166","h":"business","ts":1794882025,"zh":"来自美国的硬件创新者正在返回中国的科技之都深圳，受到将创意变为现实的速度和较低成本的吸引，即便关税和全球人工智能热潮的担忧使前景蒙上阴影。斯蒂芬·恩格尔报道：","en":"Hardware innovators from the US are returning to China’s tech capital, Shenzhen, drawn by the speed and lower cost of turning ideas into reality, even as tariffs and concerns over the global AI boom cloud the outlook. Stephen Engle has more:","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2122515081980227584/vid/avc1/1080x1920/cS8WNK-IQ-whxOnF.mp4?tag=16"],"u":"https://x.com/business/status/2122515171247534166","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/48HkTch","d":"bloom.bg"}],"t":["AI科技","关税贸易"],"lk":3,"rt":3,"rp":0,"vw":11939},{"id":"2122513833457557740","h":"business","ts":1794881706,"zh":"在涉及英伟达的丑闻之后，美国进一步限制中国获取先进人工智能芯片和服务器的途径，芯片制造商的股票大幅下跌","en":"Chipmaker stocks tumbled after the US moved to further restrict China’s access to advanced artificial intelligence chips and servers in the wake of the scandal involving Nvidia","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122513833457557740","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/chip-stocks-slide-as-us-sets-new-curbs-on-china-s-compute-access?taid=6afbb8aada07f00001ffa565&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":9,"rt":5,"rp":1,"vw":13168},{"id":"2122512993993052324","h":"cnfinancewatch","ts":1794881506,"zh":"国内：都看见了杀跌，但仍有人在短剧里找接力\n周一收盘后，韭研公社置顶仍是长韭杯实盘大赛、站规和“打击吹票等不良行为”专帖。往下翻，讨论几乎围着同一张K线：创业板跌4.37%，银行、保险、家电逆势走强，算力硬件被砸。\n第一类是复盘和情绪宣泄。15:41有帖《2026年11月16日连板个股复盘》，摘要写沪深下跌家数多、创业板跌4.37%，防御方向走强，并点到美的、九阳。17:09的涨停点评帖称超4400只下跌、33涨停、63跌停，资金躲进银行家电，算力硬件与高位股退潮——涨跌停和下跌家数是社区口径，我们未逐一核对官方统计。21:18《晚间A股值得关注的资讯》更直白，摘要写“今天，市场跌的大家都找不到北”，并提到北纬科技连板、九阳与小家电走强，资金“高低切”至固态电池。这是社区里对亏钱效应最直接的表述。\n第二类是短剧和家电，仍被当成“接得住的主线”。热门帖讨论文投控股、AI影视传媒、红果OTT大屏和牌照逻辑，还有帖子问“社零只涨0.4%，资金为什么拼命抢这三条消费线”，摘要称美的创历史新高。最新发布里，11月17日0:07已有帖讨论“九阳13天8板疯涨，谁最有资格接棒”，并引申到“阳”字辈补涨——这是作者自己的连板统计和映射，未见公司或交易所口径，不当作已核实事实。华为云16日发布并开源昇腾原生具身世界模型CloudRobo-WM1.2，也被多篇资讯帖带到，但可见摘要里会后合作细节并不多，热度低于上一交易日发布会之前。\n第三类是风险提示还没成为主流话题。22:44的市场精华汇总摘要提到金科股份、山鹰国际的退市风险提示，关联标注里出现了文投控股，但首页未见专门拆解文投控股退市风险警示的热帖。社区仍在讨论AI漫剧用户扩张和影院渠道，对“收入只占2.57%、前三季度亏损”的公告，消化明显慢于对涨停本身的讨论。\n与券商口径的异同：相同点是都承认16日是一次干脆的风格切换，银行家电是避风港，CPO是杀跌中心。不同点是社区把短剧、九阳补涨和固态电池高低切当成“明天还能做”的方向，而公开公告已经给文投控股标上了退市风险警示；海外董事会口径也不支持把黄仁勋回归写成利多。被忽略的风险有三：一是文投这类高位连板票热度还在、基本面已经揭底，开盘若再接力，亏钱效应可能从光模块扩散到短剧；二是“阳”字辈、OTT牌照这类补涨映射，证伪成本很低；三是今早虽有帖子同步了纳指跌2.49%、费半跌逾5%，但对英伟达财报和董事会调查的讨论仍然偏少，容易把隔夜大跌理解成“又一个低吸点”。","en":"国内：都看见了杀跌，但仍有人在短剧里找接力\n周一收盘后，韭研公社置顶仍是长韭杯实盘大赛、站规和“打击吹票等不良行为”专帖。往下翻，讨论几乎围着同一张K线：创业板跌4.37%，银行、保险、家电逆势走强，算力硬件被砸。\n第一类是复盘和情绪宣泄。15:41有帖《2026年11月16日连板个股复盘》，摘要写沪深下跌家数多、创业板跌4.37%，防御方向走强，并点到美的、九阳。17:09的涨停点评帖称超4400只下跌、33涨停、63跌停，资金躲进银行家电，算力硬件与高位股退潮——涨跌停和下跌家数是社区口径，我们未逐一核对官方统计。21:18《晚间A股值得关注的资讯》更直白，摘要写“今天，市场跌的大家都找不到北”，并提到北纬科技连板、九阳与小家电走强，资金“高低切”至固态电池。这是社区里对亏钱效应最直接的表述。\n第二类是短剧和家电，仍被当成“接得住的主线”。热门帖讨论文投控股、AI影视传媒、红果OTT大屏和牌照逻辑，还有帖子问“社零只涨0.4%，资金为什么拼命抢这三条消费线”，摘要称美的创历史新高。最新发布里，11月17日0:07已有帖讨论“九阳13天8板疯涨，谁最有资格接棒”，并引申到“阳”字辈补涨——这是作者自己的连板统计和映射，未见公司或交易所口径，不当作已核实事实。华为云16日发布并开源昇腾原生具身世界模型CloudRobo-WM1.2，也被多篇资讯帖带到，但可见摘要里会后合作细节并不多，热度低于上一交易日发布会之前。\n第三类是风险提示还没成为主流话题。22:44的市场精华汇总摘要提到金科股份、山鹰国际的退市风险提示，关联标注里出现了文投控股，但首页未见专门拆解文投控股退市风险警示的热帖。社区仍在讨论AI漫剧用户扩张和影院渠道，对“收入只占2.57%、前三季度亏损”的公告，消化明显慢于对涨停本身的讨论。\n与券商口径的异同：相同点是都承认16日是一次干脆的风格切换，银行家电是避风港，CPO是杀跌中心。不同点是社区把短剧、九阳补涨和固态电池高低切当成“明天还能做”的方向，而公开公告已经给文投控股标上了退市风险警示；海外董事会口径也不支持把黄仁勋回归写成利多。被忽略的风险有三：一是文投这类高位连板票热度还在、基本面已经揭底，开盘若再接力，亏钱效应可能从光模块扩散到短剧；二是“阳”字辈、OTT牌照这类补涨映射，证伪成本很低；三是今早虽有帖子同步了纳指跌2.49%、费半跌逾5%，但对英伟达财报和董事会调查的讨论仍然偏少，容易把隔夜大跌理解成“又一个低吸点”。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122512993993052324","l":[],"ln":[],"t":["A股港股","AI科技","财报"],"lk":0,"rt":0,"rp":2,"vw":859},{"id":"2122512990264263018","h":"cnfinancewatch","ts":1794881505,"zh":"热点财经新闻综述｜2026-11-17·早间\n数据时点：A股为11月16日收盘，美股为美东11月16日收盘；隔夜与今早消息整理截至北京时间11月17日07:50。本期邮箱新增一封热点财经邮件（11月16日晚间版），11月17日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照交易所行情、公司公告与主流媒体公开报道。\n今日判断\n周一A股已经先把风格切完了：银行保险创历史新高，算力硬件创年内新低。隔夜美股把同一条裂口又撕大了一截——纳指跌2.49%报24509.76点，标普500跌1.92%报7416.59点，道指跌1.41%报51608.17点，费城半导体跌5.28%，英伟达跌4.12%收156.14美元，光通信股Lumentum、Ciena跌超8%。今早美股期货只是略为回稳，纳指期货涨约0.2%，标普期货基本持平。英伟达将于美东11月17日盘后、也就是北京时间18日早晨公布黄仁勋辞职后的首份财报，市场共识约每股收益2.47美元、营收1091.5亿美元。真空期里，我们对今天的基调是：红利和家电可以做底仓，不抢半导体和光模块的缺口，也不去追已经连板的短剧票。\n三大利多方向（由强到弱）\n一、银行与红利，资金已经用价格确认。已核实：11月16日上证收3602.57点，跌0.87%，盘中失守3600后收回；创业板跌4.37%报2320.02点，科创50跌5.16%，上证50只跌0.30%。沪深京成交约1.49万亿元，较上一交易日缩量1729亿元。工商银行收9.05元，涨2.26%，与建设银行、南京银行、成都银行、杭州银行、江苏银行、青岛银行一起创历史新高；银行ETF华宝涨2.23%。港股同日恒生指数反涨0.49%，收23753.84点，说明外部并不是“中国资产被抛弃”，而是A股成长股在单独消化估值。增量消息还有两条：港交所16日推出首个离岸人民币债券指数，纳入305只债券、名义本金约8500亿元，平均收益率2.08%，挂钩ETF仍在筹备；国家外汇局称10月跨境资金净流入769亿美元，但9至10月月均净流入588亿美元，较8月下降6%，含节假日收支节奏，不宜写成外资大举流入。银行红利是今天相对稳的底仓，但已在历史新高附近，适合持有和回踩，不适合追高。制约：若英伟达财报好于预期，风格可能迅速切回成长。\n二、家电与必选消费，是杀跌里真正接到钱的方向。已核实：16日小家电板块居前，九阳股份收28.65元，涨7.10%；长虹美菱、华帝股份、小熊电器涨停，美的集团创历史新高。这不是主题炒作，而是科技股出清时，资金去买有出口和内销支撑的白马。家电龙头比高位短剧票更经得起波动，但它们也已经走了一段，今天若低开不多而被情绪资金抬升，不要把防御做成追高。\n三、政策托底是中期线索，不是今天的交易主线。已核实：工信部表示，对应付账款规模大、故意拉长账期或投诉较多的车企，将联合部门约谈并督促整改；中汽协同步启动对17家重点车企供应商账款的年度评估，17家是评估范围，不等于已被约谈名单。胜宏科技董事会16日通过1.5亿元至3亿元回购方案。百度三季度营收308亿元，同比下降1%，连续第六个季度下滑，但智能云基础设施收入同比增长94%至82亿元，自由现金流仍为负45.71亿元。这些对零部件现金流和AI应用叙事有帮助，但不足以对冲外部算力链波动，只作为观察项。","en":"热点财经新闻综述｜2026-11-17·早间\n数据时点：A股为11月16日收盘，美股为美东11月16日收盘；隔夜与今早消息整理截至北京时间11月17日07:50。本期邮箱新增一封热点财经邮件（11月16日晚间版），11月17日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照交易所行情、公司公告与主流媒体公开报道。\n今日判断\n周一A股已经先把风格切完了：银行保险创历史新高，算力硬件创年内新低。隔夜美股把同一条裂口又撕大了一截——纳指跌2.49%报24509.76点，标普500跌1.92%报7416.59点，道指跌1.41%报51608.17点，费城半导体跌5.28%，英伟达跌4.12%收156.14美元，光通信股Lumentum、Ciena跌超8%。今早美股期货只是略为回稳，纳指期货涨约0.2%，标普期货基本持平。英伟达将于美东11月17日盘后、也就是北京时间18日早晨公布黄仁勋辞职后的首份财报，市场共识约每股收益2.47美元、营收1091.5亿美元。真空期里，我们对今天的基调是：红利和家电可以做底仓，不抢半导体和光模块的缺口，也不去追已经连板的短剧票。\n三大利多方向（由强到弱）\n一、银行与红利，资金已经用价格确认。已核实：11月16日上证收3602.57点，跌0.87%，盘中失守3600后收回；创业板跌4.37%报2320.02点，科创50跌5.16%，上证50只跌0.30%。沪深京成交约1.49万亿元，较上一交易日缩量1729亿元。工商银行收9.05元，涨2.26%，与建设银 esigned to attract entrepreneurs","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122511307819647297","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-17/uk-migration-advisers-reject-call-for-investor-visa?taid=6afbb650da07f00001ffa554&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":7356},{"id":"2122511062058549484","h":"bbcchinese","ts":1794881046,"zh":"BBC调查发现，有中国顾问公司涉嫌协助富裕移民，伪装成艺术家以虚假资料申请英国的“全球人才签证”。报导揭露，一些移民试图钻制度漏洞，透过支付高额费用予中介伪造作品集，从而冒充为自己的作品。","en":"BBC调查发现，有中国顾问公司涉嫌协助富裕移民，伪装成艺术家以虚假资料申请英国的“全球人才签证”。报导揭露，一些移民试图钻制度漏洞，透过支付高额费用予中介伪造作品集，从而冒充为自己的作品。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122511062058549484","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4t3nOFa","d":"bbc.in"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":1123},{"id":"2122510520691617801","h":"qinbafrank","ts":1794880917,"zh":"拿下CFTC的两张重磅牌照，让Backpack在加密合规层面与Coinbase站在了同一身位。看到Backpack宣布已获得CFTC批准，拿到 DCO（衍生品清算机构）进和DCM（衍生品交易所）两张牌照，意味着Backpack获得早美国合法向零售用户提供衍生品交易与清算服务的资质，正式具备了自己上市自己清算的能力，由此也正式进入全球最大的零售衍生品市场。\nBackpack的DCO牌照获批范围包括全额抵押的期货、期货期权和掉期，以及保证金期货。这意味着它可以处理带杠杆的产品，配套初始保证金、维持保证金、变动保证金和违约管理机制。DCM牌照则解决了产品能不能挂出来的问题。集齐这两张牌照后，Backpack就能够在自己的交易所上线永续合约，并在自己的清算所里完成清结算。\n对比 Coinbase，两边现在的牌照配置已经非常接近：Coinbase拥有交易所、期货经纪商和自有清算所，是目前少数跑通完整链条的平台。但Coinbase的DCO牌照范围仅限全额抵押产品，杠杆相关清算仍需依赖外部伙伴。而Backpack的清算所直接获准保证金期货这比Coinbase的DCO牌照获批范围大得多，这是少有的获准清算保证金期货（margined futures）的新清算所。\n在此之前Backpack 已经持有 FINRA 注册券商 Backpack Securities、FinCEN 货币服务业务（MSB）登记和 22 个州及华盛顿特区的汇款牌照。加上迪拜 VARA 和欧盟 MiFID II，这次 CFTC 批准补上的是美国牌照矩阵里最后、也是最难的一块：衍生品，形成了一个覆盖全球的完备的牌照矩阵，可以说Backpack几乎是要集齐加密领域几乎所有的合规牌照了。\n而且看官方的说法，下一步还要推进美股永续在美国的合约审批与SEC登记，要知道之前美股只有股指期货合约并没有个股的永续合约。美国境内真正的个股永续也是刚刚在本月初被 CFTC 以“deemed approved”的方式放开，需接受 CFTC 和 SEC 的双重监管。监管刚刚放行，Backpack就迅速跟上，加密市场永续合约现在是一个日成交数千亿美金，年成交接近百万亿美金的规模，那么美股个股永续合约市场规模未来只会更大。\n对Backpac 而言，完成DCM+SEC notice registration+具体个股永续合约的审批/认证，这意味着它从“全球平台做美股代币永续”进入“美国监管体系内自己上市、自己清算的真正美股永续”的阶段，妥妥的与Coinbase处于同一监管身位，而且如前面说到它的DCO牌照覆盖保证金期货，清算能力上甚至要更完整一些。\n之前这里","en":"拿下CFTC的两张重磅牌照，让Backpack在加密合规层面与Coinbase站在了同一身位。看到Backpack宣布已获得CFTC批准，拿到 DCO（衍生品清算机构）进和DCM（衍生品交易所）两张牌照，意味着Backpack获得早美国合法向零售用户提供衍生品交易与清算服务的资质，正式具备了自己上市自己清算的能力，由此也正式进入全球最大的零售衍生品市场。\nBackpack的DCO牌照获批范围包括全额抵押的期货、期货期权和掉期，以及保证金期货。这意味着它可以处理带杠杆的产品，配套初始保证金、维持保证金、变动保证金和违约管理机制。DCM牌照则解决了产品能不能挂出来的问题。集齐这两张牌照后，Backpack就能够在自己的交易所上线永续合约，并在自己的清算所里完成清结算。\n对比 Coinbase，两边现在的牌照配置已经非常接近：Coinbase拥有交易所、期货经纪商和自有清算所，是目前少数跑通完整链条的平台。但Coinbase的DCO牌照范围仅限全额抵押产品，杠杆相关清算仍需依赖外部伙伴。而Backpack的清算所直接获准保证金期货这比Coinbase的DCO牌照获批范围大得多，这是少有的获准清算保证金期货（margined futures）的新清算所。\n在此之前Backpack 已经持有 FINRA 注册券商 Backpack Securities、FinCEN 货币服务业务（MSB）登记和 22 个州及华盛顿特区的汇款牌照。加上迪拜 VARA 和欧盟 MiFID II，这次 CFTC 批准补上的是美国牌照矩阵里最后、也是最难的一块：衍生品，形成了一个覆盖全球的完备的牌照矩阵，可以说Backpack几乎是要集齐加密领域几乎所有的合规牌照了。\n而且看官方的说法，下一步还要推进美股永续在美国的合约审批与SEC登记，要知道之前美股只有股指期货合约并没有个股的永续合约。美国境内真正的个股永续也是刚刚在本月初被 CFTC 以“deemed approved”的方式放开，需接受 CFTC 和 SEC 的双重监管。监管刚刚放行，Backpack就迅速跟上，加密市场永续合约现在是一个日成交数千亿美金，年成交接近百万亿美金的规模，那么美股个股永续合约市场规模未来只会更大。\n对Backpac 而言，完成DCM+SEC notice registration+具体个股永续合约的审批/认证，这意味着它从“全球平台做美股代币永续”进入“美国监管体系内自己上市、自己清算的真正美股永续”的阶段，妥妥的与Coinbase处于同一监管身位，而且如前面说到它的DCO牌照覆盖保证金期货，清算能力上甚至要更完整一些。\n之前这里","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2122510520691617801","l":["x.com"],"ln":[{"u":"https://x.com/qinbafrank/status/2061806872114663552?a=NTE3XBygHAUTWPDKfEA&s=20还有聊过Backpack构建了一个加密领域强大的合规天团，Backpack美国总裁Mark在奥巴马时代担任过CFTC代理主席，这意味着随着今年中期选举民主党掌控国会两院，而Backpack的这层政治背景会给业务带来极大的助力，不得不说未来空间可期","d":"x.com"}],"t":["美股"],"lk":47,"rt":7,"rp":28,"vw":26741},{"id":"2122510341171290352","h":"SCMPNews","ts":1794880874,"zh":"日本计划在澳大利亚附近掩埋二氧化碳引发可行性质疑","en":"Japanese plan to bury carbon dioxide off Australia raises feasibility doubts","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122510341171290352","l":["sc.mp"],"ln":[{"u":"https://sc.mp/q9ocd","d":"sc.mp"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":763},{"id":"2122510098857701746","h":"business 2026-11-17，物理AI是人工智能下一波浪潮 建议聚焦优质环节，核心观点为GPT-6加速具身大脑发展，Apple、OpenAI、Meta入局，Tesla推进量产。\n（三）华泰证券，2026-11-17，内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，核心观点为10月全行业景气指数回升，必选消费与可选消费景气改善居前。\n（四）华泰证券，2026-11-17，端侧AI催化密集 看好需求扩容与电池技术升级，核心观点为模型能力向规划与动作执行延伸，带动AI眼镜、无屏穿戴及机器人硬件。\n（五）中信证券，2026-11-16，AI原生广告商业化提速，看好AI影视、AI营销及精品游戏，核心观点为AI模型成本下降，内容平台开放流量入口，AI影视供给增加。\n（六）中信证券，2026-11-16，国家医保谈判持续支持创新药 关注2027年商业化增量，核心观点为新增107种药品其中1类创新药51种，CAR-T首次纳入基本医保。\n（七）华泰证券，2026-11-16，A股策略：底部仍待夯实 配置上建议继续向质量和价值风格切换，核心观点为底部信号体系显示市场处于底部区域，但科技筹码尚未充分出清。\n（八）中信建投，2026-11-16，持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现，核心观点为模型迭代与AI商业化支撑算力需求，国产芯片订单有望转化。\n#研报互证（近一个月）\n（一）方向创新药基因：互证结论为月内强支撑。支撑研报为中信证券2026-11-16国家医保谈判持续支持创新药 关注2027年商业化增量，中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，中泰证券2026-11-12医药产业链景气延续 AI4S有望推动估值持续抬升，三家机构指向同一方向，权重上调一档。\n（二）方向基建建筑：互证结论为月内无支撑。近一个月五大机构无研报覆盖基建工程方向，权重下调；但该方向属美股去重榜第2位映射，未与榜单不符，保留观察不剔除。\n（三）方向消费：互证结论为月内强支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，华泰证券2026-11-11猪价二次探底推动产能去化再加速，两家机构指向消费与农业，权重上调一档。\n（四）个股迈瑞医疗：互证结论为月内单一支撑。支撑研报为中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，提及医疗器械经营改善，维持原权重。\n（五）个股四川路桥：互证结论为月内无支撑。近一个月五大机构无研报覆盖该个股或基建工程细分，权重下调。\n（六）个股美的集团：互证结论为月内单一支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转，提及可选消费景气改善，维持原权重。\n（七）被研报否掉的方向：AI算力软件。中信建投2026-11-16持续看好国产算力产业链，但隔夜NVDA-4.12%、纳指-2.49%，行情数据与研报观点冲突，以真实行情为准，研报观点已滞后，该方向剔除。\n（八）被研报否掉的个股：中际旭创。人气榜第2名但5日-9.53%、昨-12.28%，与中信证券2026-11-14看好中国光通信的长期发展趋势研报方向相悖于短期行情，且总市值4817亿属超大盘，剔除。\n（九）权重调整结果：创新药基因上调一档为最高权重，消费上调一档，基建建筑下调一档仅保留观察。","en":"#五大机构研报（窗口内）\n（一）中信证券，2026-11-17，架构调优中心化，OpenAI加速具身布局，核心观点为具身大脑产业进步是OpenAI调整核心动因，前沿AI实验室加速物理AI布局。\n（二）中信建投，2026-11-17，物理AI是人工智能下一波浪潮 建议聚焦优质环节，核心观点为GPT-6加速具身大脑发展，Apple、OpenAI、Meta入局，Tesla推进量产。\n（三）华泰证券，2026-11-17，内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，核心观点为10月全行业景气指数回升，必选消费与可选消费景气改善居前。\n（四）华泰证券，2026-11-17，端侧AI催化密集 看好需求扩容与电池技术升级，核心观点为模型能力向规划与动作执行延伸，带动AI眼镜、无屏穿戴及机器人硬件。\n（五）中信证券，2026-11-16，AI原生广告商业化提速，看好AI影视、AI营销及精品游戏，核心观点为AI模型成本下降，内容平台开放流量入口，AI影视供给增加。\n（六）中信证券，2026-11-16，国家医保谈判持续支持创新药 关注2027年商业化增量，核心观点为新增107种药品其中1类创新药51种，CAR-T首次纳入基本医保。\n（七）华泰证券，2026-1 亚、新加坡、泰国、巴西出口/再出口/境内转移先进计算芯片均须许可（商务部长可增列其他国家）。美国总部公司可免许可但须月报。审查时会考虑目的国出口管制有效性及执法合作。\n前两天《谁在“倒黄”》这篇长文聊到“境外云算力”越来越受限正在成为现实，\n这两年中国头部公司（阿里、字节/抖音、腾讯等）大量通过马来西亚、新加坡、印尼、泰国等东南亚数据中心租用H100/H200/Blackwell算力进行训练。之前头部大模型公司把东南亚数据中心当作“准国内算力”使用，这次规则把这个主要workaround系统性地纳入许可。对需要十万卡级别训练的模型来说，这是成本、可用性和确定性的同步恶化。\n远程先进算力通道被实质性收紧，会提高中国模型厂商训练的成本和难度，拖慢与美国前沿的追赶速度。\n可以说美国正在试图封堵中国AI追赶过程中几乎所有重要的外部途径：\n芯片管制更严格、\n远程算力通道被压缩、前沿模型的反蒸馏措施越来越严格。\n这算不算中国模型的“艰难时刻”？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"BIS（美国商务部工业与安全局）出台远程算力访问新规，远程算力套利窗口正在关闭。先看新规要点：1）远程访问管制全球任何地区的数据中心中国公司及子公司提供超过1,200万TPP的算力（约相当于750张H100/H200量级，或约300张左右B200，具体视计算方式而定），相关先进计算芯片及服务器的出口、再出口和境内转移就需许可。许可逐案审批。\n2）规则发布前已在提供大规模算力的数据中心，若要继续服务，须在生效后90天内取得许可，否则面临后续出口限制。\n3）有限豁免：仅用于商业推荐系统（电商、社交媒体排名等，不生成文本/图像/音视频/软件）可豁免但须报备；生成式AI系统即使兼有推荐功能也不豁免。\n4）新增五国许可：向印尼、马来西亚、新加坡、泰国、巴西出口/再出口/境内转移先进计算芯片均须许可（商务部长可增列其他国家）。美国总部公司可免许可但须月报。审查时会考虑目的国出口管制有效性及执法合作。\n前两天《谁在“倒黄”》这篇长文聊到“境外云算力”越来越受限正在成为现实，\n这两年中国头部公司（阿里、字节/抖音、腾讯等）大量通过马来西亚、新加坡、印尼、泰国等东南亚数据中心租用H100/H200/Blackwell算力进行训练。之前头部大模型公司把东南亚数据中心当作“准国内算力”使用，这次规则把这个主要workaround系统性地纳入许可。对需要十万卡级别训练的模型来说，这是成本、可用性和确定性的同步恶化。\n远程先进算力通道被实质性收紧，会提高中国模型厂商训练的成本和难度，拖慢与美国前沿的追赶速度。\n可以说美国正在试图封堵中国AI追赶过程中几乎所有重要的外部途径：\n芯片管制更严格、\n远程算力通道被压缩、前沿模型的反蒸馏措施越来越严格。\n这算不算中国模型的“艰难时刻”？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXR-pmdaMAAb4pl.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122477672509100265","l":[],"ln":[],"t":["美股","AI科技","关税贸易"],"lk":73,"rt":10,"rp":32,"vw":24347},{"id":"2122477422125711702","h":"BloombergLive","ts":1794873025,"zh":"全球最大的资本池之一正在改变其投资方式。\n随着日本金融格局的发展，其机构投资者正在超越传统配置，更深入地关注海外私人市场、替代方案和机会。\n在#BloombergInvest Tokyo，我们将研究这种转变对日本乃至世界各地的市场意味着什么。\n了解更多：","en":"One of the world’s biggest pools of capital is changing how it invests.\nAs Japan’s financial landscape evolves, its institutional investors are looking beyond traditional allocations and deeper into private markets, alternatives and opportunities abroad.\nAt #BloombergInvest Tokyo, we’ll examine  涨 1.50%，ADBE 涨 1.20%。UBER 涨 0.43%。\n**焦点**\n据报道，美国商务部计划封堵 AI 算力出口的「第三国」漏洞。此前，中国公司无需直接采购芯片，可以通过租用东南亚数据中心的英伟达算力获取资源，这一渠道将被关闭。英伟达在马来西亚、新加坡等地的客户收入中，有多少实际来自转道而来的中国需求，成为市场重新评估的问题。消息出现在 AI 硬件产业链普遍下跌的交易日，光模块、互联和算力租赁个股跌幅集中。\n**小结**\n本日市场呈现明显的风险偏好收缩。资金撤离高估值的 AI 硬件和题材股，转向医疗、必需消费等防御板块。市宽为 12 涨 95 跌，下跌范围很广。后续需关注出口管制细则的落地进度，以及 AI 硬件板块能否企稳。\n---\n说明：\n- 今天的行情数据中没有英伟达的涨跌幅，所以焦点段只写了出口管制这件事本身，没有写英伟达今天的价格或涨跌。帖子里「2025年7月以来最低收盘」的说法也没有引用。\n- 这次没有提供【财报】名单，所以文中没有用财报解释任何个股的涨跌。\n- 个股只有涨跌幅、没有收盘价，所以「收于 X」的写法只用在四个指数上。\n- 其余几个备选角度（OpenAI Mercury、新台币与寿险、挪威主权基金、美光与海力士）和今天的行情关系不大，没有用进复盘。","en":"【美股复盘 · 11月16日】\n**大市**\n美股三大指数全线下跌，科技股领跌。标普500 ETF（ $SPY ）收于 739.96，跌 1.91%。纳指100 ETF（QQQ）收于 661.75，跌 2.67%，跌幅居主要指数之首。道指 ETF（DIA）收于 515.68，跌 1.43%。罗素2000 ETF（IWM）收于 272.95，跌 1.65%。市场普遍走弱，107 只观察股中仅 12 只上涨，95 只下跌。反向杠杆 ETF 涨幅居前：SOXS 涨 16.35%，SQQQ 涨 8.10%，SPXU 涨 5.73%。半导体做空工具涨幅最大，说明抛压主要集中在芯片板块。\n**板块**\n光模块与互联板块跌幅居前。AAOI 跌 9.48%，LITE 跌 8.48%，CRDO 跌 8.21%，CIEN 跌 8.19%。量子计算板块同步大跌，QBTS 跌 9.31%，IONQ 跌 8.41%。算力与存储相关个股同样承压，IREN 跌 9.80%，SNDK 跌 8.58%，半导体测试设备股 AEHR 跌 10.53%。ASTS 跌 12.33%，在观察股中跌幅最大。\n防御板块相对抗跌。UNH 涨 1.12%，MCD 涨 0.99%，COST 涨 0.68%，WMT 涨 0.25%。软件股中 APP 涨 1.50%，ADBE 涨 1.20%。UBER 涨 0.43%。\n**焦点**\n据报道，美国商务部计划封堵 AI 算力出口的「第三国」漏洞。此前，中国公司无需直接采购芯片，可以通过租用东南亚数据中心的英伟达算力获取资源，这一渠道将被关闭。英伟达在马来西亚、新加坡等地的客户收入中，有多少实际来自转道而来的中国需求，成为市场重新评估的问题。消息出现在 AI 硬件产业链普遍下跌的交易日，光模块、互联和算力租赁个股跌幅集中。\n**小结**\n本日市场呈现明显的风险偏好收缩。资金撤离高估值的 AI 硬件和题材股，转向医疗、必需消费等防御板块。市宽为 12 涨 95 跌，下跌范围很广。后续需关注出口管制细则的落地进度，以及 AI 硬件板块能否企稳。\n---\n说明：\n- 今天的行情数据中没有英伟达的涨跌幅，所以焦点段只写了出口管制这件事本身，没有写英伟达今天的价格或涨跌。帖子里「2025年7月以来最低收盘」的说法也没有引用。\n- 这次没有提供【财报】名单，所以文中没有用财报解释任何个股的涨跌。\n- 个股只有涨跌幅、没有收盘价，所以「收于 X」的写法只用在四个指数上。\n- 其余几个备选角度（OpenAI Mercury、新台币与寿险、挪威主权基金、美光与海力士）和今天的行情关系不大，没有用进复盘。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2122457329413337314","l":[],"ln":[],"t":["美股","AI科技","财报","关税贸易"],"lk":0,"rt":0,"rp":1,"vw":3851},{"id":"2122457225218113579","h":"business","ts":1794868210,"zh":"导致前首席执行官黄仁勋下台的丑闻导致英伟达股价暴跌，为卖空者带来了数百亿美元的收益","en":"Nvidia’s tumble in dium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":10137},{"id":"2122435641090941002","h":"ArtofSpecuycky","ts":1794863064,"zh":"传奇投资人 Stanley Druckenmiller 最新13F曝光\n根据2026年第三季度披露的持仓数据，他正在进行一轮大规模的投资组合调整。首先，最大的变化是大幅削减部分AI半导体和科技股敞口：彻底清仓谷歌（GOOGL）、AMD、ARM、闪迪（SNDK）、泛林集团（LRCX），同时大幅减持台积电（TSM）94%、Palo Alto Networks（PANW）74%、CRH（CRH）71%和礼来（LLY）69%，另外还清仓了联合航空（UAL）、达美航空（DAL）。\n但他没有全面撤离科技板块，将资金转向更有选择性的方向：亚马逊（AMZN）加仓43%、希捷（STX）加仓180%，并建立约9040万美元的STX看涨期权仓位；同时新建仓西部数据（WDC）3680万美元、AppLovin（APP）3180万美元、Palantir（PLTR）1500万美元和SpaceX（SPCX）3050万美元的相关持仓。\n医疗创新还是他的核心押注，Natera（NTRA）以约13.1亿美元稳居第一大持仓，Beam Therapeutics（BEAM）大幅加仓356%，Relay Therapeutics（RLAY）加仓144%。他还大举增持Unity（U）436%，并新建仓Somnigroup（SGI）6170万美元。他还一次性新建仓三家黄金矿企：Newmont（NEM）4390万美元、Barrick（B）4290万美元、Agnico Eagle（AEM）4230万美元，合计约1.29亿美元。\n截至第三季度末，前五大持仓依次为NTRA（13.1亿美元）、STX（3.152亿美元）、AMZN（1.925亿美元）、FOXA（1.908亿美元）和YPF（1.776亿美元），其中FOXA本季度也加仓约38%。\n我对这次调仓的理解是，Druckenmiller是在从部分估值敏感、资本开支依赖较高的科技公司撤出，转向盈利兑现、产业链结构性机会和宏观对冲。 清仓AMD、ARM、LRCX，大幅减持TSM，说明他至少在主动降低半导体周期风险。但大幅加仓STX、买入WDC和STX看涨期权，说明他没有完全放弃AI基础设施需求，仓位不大，可能是怕踏空？加仓AMZN、APP、PLTR和U，说明他愿意参与AI应用和平台公司的增长机会。他还买入三大黄金矿企，可能是在为未来的货币政策变化、通胀风险或市场波动增加防御性配置。医疗方面持续重仓NTRA、加码BEAM和RLAY，说明他还是偏好具有独立技术催化剂的成长公司。\n总结下来，他上个季度的操作逻辑就是降低部分AI芯片和半导体设备敞口，增配AI存储与应用，继续押注创新医疗，同时利用黄金矿企对冲宏观不确定性。 这是上个季度的持仓，可以参考和学习的是他上个季度投资的逻辑。","en":"传奇投资人 Stanley Druckenmiller 最新13F曝光\n根据2026年第三季度披露的持仓数据，他正在进行一轮大规模的投资组合调整。首先，最大的变化是大幅削减部分AI半导体和科技股敞口：彻底清仓谷歌（GOOGL）、AMD、ARM、闪迪（SNDK）、泛林集团（LRCX），同时大幅减持台积电（TSM）94%、Palo Alto Networks（PANW）74%、CRH（CRH）71%和礼来（LLY）69%，另外还清仓了联合航空（UAL）、达美航空（DAL）。\n但他没有全面撤离科技板块，将资金转向更有选择性的方向：亚马逊（AMZN）加仓43%、希捷（STX）加仓180%，并建立约9040万美元的STX看涨期权仓位；同时新建仓西部数据（WDC）3680万美元、AppLovin（APP）3180万美元、Palantir（PLTR）1500万美元和SpaceX（SPCX）3050万美元的相关持仓。\n医疗创新还是他的核心押注，Natera（NTRA）以约13.1亿美元稳居第一大持仓，Beam Therapeutics（BEAM）大幅加仓356%，Relay Therapeutics（RLAY）加仓144%。他还大举增持Unity（U）436%，并新建仓Somnigroup（SGI）6170万美元。他还一次性新建仓三家黄金矿企：Newmont（NEM）4390万美元、Barrick（B）4290万美元、Agnico Eagle（AEM）4230万美元，合计约1.29亿美元。\n截至第三季度末，前五大持仓依次为N ://video.twimg.com/amplify_video/2122379657484079104/vid/avc1/1280x720/U78TP-5734P-f8-4.mp4?tag=29"],"u":"https://x.com/TraderS18/status/2122379915643568621","l":[],"ln":[],"t":[],"lk":9,"rt":0,"rp":2,"vw":20057},{"id":"2122379764522770541","h":"misaENFP","ts":1794849742,"zh":"深夜Misa又来了，聊一聊关于币圈那些没什么粉丝的小 KOL。\n最近听到一句很不舒服的谣言：Misa签约了一堆垃圾KOL。\n第一，没有那么多经费，真的垃圾的账号没有地方会要的，我这里不会，别的地方更不会。\n我的账号大部分是自然流，你像我一样17H泡在X上，你也会有正向反馈，把时间精力花在哪里哪里就逐渐开花结果，如果流量只能用钱堆出来，那么我不是一个合格的员工。\n第二点就是今天想聊的，什么时候开始，一个人在互联网上的价值，只能用用粉丝数量来衡量，没粉丝就是垃圾？\n我第一个账号从7个粉丝开端，从7到100走了很久很久，然后靠模仿短鸟老师迎来第一批对我感兴趣的人，经历了各种磨难，才一步一步走到今天，人微言轻，我缺被看见的机会，我相信你们也是。\nKOL，说白了就是网红的意思，做久了发现这里有一套非常直观的评价体系。\n粉丝多少，阅读多少，互动多少，有没有人认识你。\n这些数字当然重要，我自己做品牌，也要看数据，我很清楚传播是有商业价值的。\n但让我有点难过的是，太多人慢慢把商业价值和人的价值混为一谈了。\n我引用的这条帖子，皮神@Meichin333333 他刚认识我时，压根懒得发东西，连图都懒得自己做，让我们帮他做，通过我不懈的努力说服了他，挖掘出来一个天才，可以去看看他现在的视频质量。\n这样的列子在我的社区里数不胜数，Misa赛道代表人物@hetzerLin 也渐渐取得小结果，做视频也开始接商单了，这需要我们双向努力。\n为什么我一空下来就去“批作业”？不是我闲的没事干，是一个几十几百粉丝的小博主认真写了一篇分析，可能连被看完的机会都没有，没人看，那我来看。\n甚至有时候，粉丝少仿佛成了一种原罪。\n你表达观点，别人问你赚了多少钱。\n你分享研究，别人说你的研究有啥可参考的。\n你想争取一次合作机会，别人还没看你的内容，就已经通过主页上的数字给你定了价。\n这里面有一件事特别值得警惕：\n我们可以给流量定价，但不要习惯性地给人定价。\n这两件事是完全不同的。\n我接触过很多小 KOL，有些人白天上学上班，还有在考研的，带娃的，然后晚上回来研究行情、看数据、写内容。\n可能花了三四个小时做出来的东西，最后只有几十个阅读。\n也有人认真回复每一条评论，哪怕自己的评论区只有三五个老熟人。\n他们可能不懂怎么蹭热点，不擅长制造情绪，也没有什么资源，但这不代表他们的认真就很廉价。\n我们总喜欢讨论早期价值。\n一个项目还没有多少人关注的时候，我们愿意研究它的潜力，愿意想象它未来会发展成什么样。\n可是面对一个刚刚开始做内容的人，我们却经常只看他今天有多少粉丝。\n我们愿意给一个项目成长的时间，为什么有时候却不愿意给一个普通人成长的空间？\n我总是喜欢转发他们的帖子，我希望他们走到大家视野里，希望他们被看到，希望除了我还有赏识他们的人。\n影响力有差异，合作预算有差异，这些都很正常，很多人就是单打独斗，没有被看见，所以我来了。\n我想表达，即使你暂时没有商业价值，也不意味着你的付出不值得尊重。\n更何况，今天那些拥有几十万粉丝的人，谁没有经历过只有几十个人看自己内容的日子呢，穷途末路的时候我发p的不像我的自拍都是三四个浏览。\n我自己也做内容，所以我知道，很多时候真正让人坚持下去的，甚至不是收益。\n而是有人认真看完你写的东西，愿意和你讨论，或者告诉你一句：你这个观点让我有了新的思考，你做的很棒。\n这种被看见的感觉，真的很珍贵。\n做社区不应该只是维护一群已经有影响力的人，他们已经很厉害，一个好的社区，也应该让暂时没有影响力的人，有机会慢慢长出自己的影响力。\n我不希望这个世界最后变成一个只有大网红才有资格说话的地方。\n小账号不需要因为粉丝少而卑微。\n我们可以尊重流量，但不必崇拜流量。\n可以承认差距，但没必要把差距变成羞辱别人的理由。\n张口闭口舔狗论，那其实我更像一个舔狗，想方设法的做对大家有利的事情。\n亲爱的们，你不需要每天证明自己值得被关注，也不用因为没有流量就怀疑自己。\n认真研究过的东西不会白费，真诚建立起来的关系也不应该只用数字衡量，学会的东西都是自己的。\n粉丝数量决定了今天有多少人能听见你，但不应该决定你有没有资格开口。\n希望你以后能有很多很多粉丝。\n但在那之前，也希望你不要放弃，继续做自己。\n晚安宝贝们🌙","en":"深夜Misa又来了，聊一聊关于币圈那些没什么粉丝的小 KOL。\n最近听到一句很不舒服的谣言：Misa签约了一堆垃圾KOL。\n第一，没有那么多经费，真的垃圾的账号没有地方会要的，我这里不会，别的地方更不会。\n我的账号大部分是自然流，你像我一样17H泡在X上，你也会有正向反馈，把时间精力花在哪里哪里就逐渐开花结果，如果流量只能用钱堆出来，那么我不是一个合格的员工。\n第二点就是今天想聊的，什么时候开始，一个人在互联网上的价值，只能用用粉丝数量来衡量，没粉丝就是垃圾？\n我第一个账号从7个粉丝开端，从7到100走了很久很久，然后靠模仿短鸟老师迎来第一批对我感兴趣的人，经历了各种磨难，才一步一步走到今天，人微言轻，我缺被看见的机会，我相信你们也是。\nKOL，说白了就是网红的意思，做久了发现这里有一套非常直观的评价体系。\n粉丝多少，阅读多少，互动多少，有没有人认识你。\n这些数字当然重要，我自己做品牌，也要看数据，我很清楚传播是有商业价值的。\n但让我有点难过的是，太多人慢慢把商业价值和人的价值混为一谈了。\n我引用的这条帖子，皮神@Meichin333333 他刚认识我时，压根懒得发东西，连图都懒得自己做，让我们帮他做，通过我不懈的努力说服了他，挖掘出来一个天才，可以去看看他现在的视频质量。\n这样的列子在我的社区里数不胜数，Misa赛道代表人物@hetzerLin 也渐渐取得小结果，做视频也开始接商单了，这需要我们双向努力。\n为什么我一空下来就去“批作业”？不是我闲的没事干，是一个几十几百粉丝的小博主认真写了一篇分析，可能连被看完的机会都没有，没人看，那我来看。\n甚至有时候，粉丝少仿佛成了一种原罪。\n你表达观点，别人问你赚了多少钱。\n你分享研究，别人说你的研究有啥可参考的。\n你想争取一次合作机会，别人还没看你的内容，就已经通过主页上的数字给你定了价。\n这里面有一件事特别值得警惕：\n我们可以给流量定价，但不要习惯性地给人定价。\n这两件事是完全不同的。\n我接触过很多小 KOL，有些人白天上学上班，还有在考研的，带娃的，然后晚上回来研究行情、看数据、写内容。\n可能花了三四个小时做出来的东西，最后只有几十个阅读。\n也有人认真回复每一条评论，哪怕自己的评论区只有三五个老熟人。\n他们可能不懂怎么蹭热点，不擅长制造情绪，也没有什么资源，但这不代表他们的认真就很廉价。\n我们总喜欢讨论早期价值。\n一个项目还没有多少人关注的时候，我们愿意研究它的潜力，愿意想象它未来会发展成什么样。\n可是面对一个刚刚开始做内容的人，我们却经常只看他今天有多少粉丝。\n我们愿意给一个项目成长的时间，为什么有时候却不愿意给一个普通人成长的空间？\n我总是喜欢转发他们的帖子，我希望他们走到大家视野里，希望他们被看到，希望除了我还有赏识他们的人。\n影响力有差异，合作预算有差异，这些都很正常，很多人就是单打独斗，没有被看见，所以我来了。\n我想表达，即使你暂时没有商业价值，也不意味着你的付出不值得尊重。\n更何况，今天那些拥有几十万粉丝的人，谁没有经历过只有几十个人看自己内容的日子呢，穷途末路的时候我发p的不像我的自拍都是三四个浏览。\n我自己也做内容，所以我知道，很多时候真正让人坚持下去的，甚至不是收益。\n而是有人认真看完你写的东西，愿意和你讨论，或者告诉你一句：你这个观点让我有了新的思考，你做的很棒。\n这种被看见的感觉，真的很珍贵。\n做社区不应该只是维护一群已经有影响力的人，他们已经很厉害，一个好的社区，也应该让暂时没有影响力的人，有机会慢慢长出自己的影响力。\n我不希望这个世界最后变成一个只有大网红才有资格说话的地方。\n小账号不需要因为粉丝少而卑微。\n我们可以尊重流量，但不必崇拜流量。\n可以承认差距，但没必要把差距变成羞辱别人的理由。\n张口闭口舔狗论，那其实我更像一个舔狗，想方设法的做对大家有利的事情。\n亲爱的们，你不需要每天证明自己值得被关注，也不用因为没有流量就怀疑自己。\n认真研究过的东西不会白费，真诚建立起来的关系也不应该只用数字衡量，学会的东西都是自己的。\n粉丝数量决定了今天有多少人能听见你，但不应该决定你有没有资格开口。\n希望你以后能有很多很多粉丝。\n但在那之前，也希望你不要放弃，继续做自己。\n晚安宝贝们🌙","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQ1JNpa8AAqJQA.jpg?name=orig"],"u":"https://x 投入增加是极其巨大的。\n那为什么他必须“死”呢？\n因为美国需要把 AI 的资本开支放缓了，大家实在是没有钱买卡了。\n标普全球算过，六家大厂明年 Capex 加起来 1.3 万亿美元，自由现金流还是正的只剩微软一家。高盛估计明年还得发 4000 亿美元的投资级债。这个钱是花不下去的。\n他下台之后会怎么样？\n中国的开源模型没办法拿卡了，或者说拿卡跟蒸馏的难度会非常大，跟美国frontier lab的差距会扩大。\n美国本土的云厂商也会受益，可以减小 Capex 投入。而且没有中国开源模型在后面追，闭源模型公司也可以放缓买卡和训练，把更多算力放到更高毛利的推理上，不用再拼命赶新模型的进度。\n所以未来一年你会看到，新模型发布的节奏一定是迅速放缓的。\n另外一方面，整个半导体产业链因为老黄赚得盆满钵满，很多下游产业都在被吸血。消费电子因为服务器跟内存涨价，可以说是深受其害吧。\n还有一点跟政治相关。数据中心因为算力竞赛，不断在环保和居民空间上侵害一些人的利益，民主党看到了这个机会，在中期选举上大做文章，把参众两院都拿下了。\n所以你可以看到，老黄下台，对闭源模型大厂有好处，对微软、谷歌、亚马逊、甲骨文这些买卡的大云厂商有好处，对民主党也有好处。\n不利的是中国倒卡的二道贩子、中国的开源大模型厂商，还有靠老黄背书才拿得到融资担保的 New Clouds。\n但是老黄在台上利好的这些力量，完全没有在美国争取选票的能力和政治影响力。受损的这些大厂，都有极强的背景和游说能力。\n所以在 AI 资本开支不得不放缓的时候，老黄必须走，他也必须对此负责。不然大家都会崩盘，整个融资和负债都会出问题。\n在 AI 时代要高歌猛进、堆算力的时候，黄仁勋就是那个被捧上神坛的旗手；当 AI 因为投入过大不得不放缓的时候，黄仁勋也会是第一个被推下神坛祭旗的人。\n所以老黄必须死。","en":"为什么黄仁勋必须死？\n首先我们来看一下，老黄在的时候做了什么、利好了谁。\n他最提倡开源，提倡把芯片卖到全球，特别是通过一些灰色渠道流到中国，他是睁一只眼闭一只眼的，甚至可以说是纵容了这种事情发生。\n他在位的时候，整个亚洲半导体产业链都吃饱了，特别是台湾的供应商。\n所以黄仁勋在位的时期，整个 AI 硬件和半导体的投入增加是极其巨大的。\n那为什么他必须“死”呢？\n因为美国需要把 AI 的资本开支放缓了，大家实在是没有钱买卡了。\n标普全球算过，六家大厂明年 Capex 加起来 1.3 万亿美元，自由现金流还是正的只剩微软一家。高盛估计明年还得发 4000 亿美元的投资级债。这个钱是花不下去的。\n他下台之后会怎么样？\n中国的开源模型没办法拿卡了，或者说拿卡跟蒸馏的难度会非常大，跟美国frontier lab的差距会扩大。\n美国本土的云厂商也会受益，可以减小 Capex 投入。而且没有中国开源模型在后面追，闭源模型公司也可以放缓买卡和训练，把更多算力放到更高毛利的推理上，不用再拼命赶新模型的进度。\n所以未来一年你会看到，新模型发布的节奏一定是迅速放缓的。\n另外一方面，整个半导体产业链因为老黄赚得盆满钵满，很多下游产业都在被吸血。消费电子因为服务器跟内存涨价，可以说是深受其害吧。\n还有一点跟政治相关。数据中心因为算力竞赛，不断在环保和居民空间上侵害一些人的利益，民主党看到了这个机会，在中期选举上大做文章，把参众两院都拿下了。\n所以你可以看到，老黄下台，对闭源模型大厂有好处，对微软、谷歌、亚马逊、甲骨文这些买卡的大云厂商有好处，对民主党也有好处。\n不利的是中国倒卡的二道贩子、中国的开源大模型厂商，还有靠老黄背书才拿得到融资担保的 New Clouds。\n但是老黄在台上利好的这些力量，完全没有在美国争取选票的能力和政治影响力。受损的这些大厂，都有极强的背景和游说能力。\n所以在 AI 资本开支不得不放缓的时候，老黄必须走，他也必须对此负责。不然大家都会崩盘，整个融资和负债都会出问题。\n在 AI 时代要高歌猛进、堆算力的时候，黄仁勋就是那个被捧上神坛的旗手；当 AI 因为投入过大不得不放缓的时候，黄仁勋也会是第一个被推下神坛祭旗的人。\n所以老黄必须死。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2122373371388448791","l":[],"ln":[],"t":["美股","AI科技"],"lk":93,"rt":9,"rp":15,"vw":25600},{"id":"2122373314228502617","h":"ShanghaoJin","ts":1794848204,"zh":"放一个可以在APEC讨价还价的筹码\n其实 g.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/nvidia-backs-genius-grant-winner-s-push-for-cost-efficient-ai?taid=6afb29afc6e521000155c51f&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":0}],"view":{"count":1000,"cn":993}};
const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
