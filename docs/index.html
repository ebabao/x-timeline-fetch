<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经资讯工作台 · X 信源</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d4a24c'/><text x='16' y='23' font-size='19' font-family='system-ui' text-anchor='middle' fill='%230a0d13'>财</text></svg>">
<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
  --hdr:rgba(10,13,19,.88);
  --kpi:#0e131c;
  --hover-bg:#111722;
  --quote:#151c28;
  --toast:#1b2333;
  --body-txt:#dfe5ef; --body-zh:#eef2f8; --meta:#7f93ad;
  --shadow:rgba(0,0,0,.4);
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#eef1f7; --panel:#ffffff; --panel2:#f0f3f9; --hover:#e8edf5;
  --line:#dde3ed; --line2:#c8d1e0;
  --txt:#1a2130; --dim:#5d6779; --dim2:#8893a5;
  --gold:#b8860b; --up:#e03131; --down:#1a9e56; --blue:#1c6fd4; --purple:#6d5bd0;
  --hdr:rgba(255,255,255,.9);
  --kpi:#ffffff; --hover-bg:#f5f8fd;
  --quote:#f0f3f9; --toast:#ffffff;
  --body-txt:#3a4354; --body-zh:#2b3342; --meta:#6d7889;
  --shadow:rgba(20,30,50,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--line)}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:var(--hdr);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
/* 主题切换按钮 */
.theme-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--dim);
  flex-shrink:0;transition:.14s}
.theme-btn:hover{background:var(--hover);color:var(--txt);border-color:var(--line2)}
.theme-btn svg{width:17px;height:17px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px var(--shadow);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),var(--kpi));
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:var(--hover-bg)}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:var(--body-txt)}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:var(--meta);background:var(--quote);border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:var(--body-zh)}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:var(--toast);border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>
</head>

lk":8,"rt":0,"rp":1,"vw":608},{"id":"2126512784687165643","h":"cnfinancewatch","ts":1795835131,"zh":"告诉你个秘密：\n顶级奢服是不能洗的。穿的时候里面穿吸汗内装，不要让汗水粘上。\n穿完，领口袖口处理一下，整衣挂通风处晾干透气，然后用香薰处理！\n这样的顶级奢服不会串色掉色……\n历久如新！","en":"告诉你个秘密：\n顶级奢服是不能洗的。穿的时候里面穿吸汗内装，不要让汗水粘上。\n穿完，领口袖口处理一下，整衣挂通风处晾干透气，然后用香薰处理！\n这样的顶级奢服不会串色掉色……\n历久如新！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126512784687165643","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":786},{"id":"2126511542090756595","h":"ReutersChina","ts":1795834834,"zh":"随着寒冷天气的到来，中国消费者开始抢购廉价羽绒服，由于消费者对高端品牌的价值提出质疑，售价低于 500 元（69 美元）的产品销售旺盛。","en":"Chinese shoppers are snapping up budget down jackets as the cold weather arrives, with products priced below 500 yuan ($69) selling briskly as consumers question the value of premium brands.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2126511542090756595","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/business/retail-consumer/chinas-premium-puffer-jacket-push-meets-consumer-resistance-2026-11-28/?taid=6b0a43d2eacbd000018a8392&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["汇率"],"lk":0,"rt":0,"rp":1,"vw":581},{"id":"2126511406073983014","h":"TheMarketMemo","ts":1795834802,"zh":"首先我想表達一個觀點：相信一個故事，或者說「用信仰做投資」，本質上是一種懶惰。","en":"首先我想表達一個觀點：相信一個故事，或者說「用信仰做投資」，本質上是一種懶惰。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2126123369158545408/vid/avc1/1920x1080/OdptEWxmKTlg72Md.mp4?tag=29"],"u":"https://x.com/TheMarketMemo/status/2126511406073983014","l":[],"ln":[],"t":[],"lk":70,"rt":6,"rp":5,"vw":4343},{"id":"2126507993881854147","h":"cnfinancewatch","ts":1795833989,"zh":"西贡下午的风是真不错。朋友一早就定了船，电话里只说：没外人，你来。\n船是老周的。人在伦敦，钥匙留下。船员已经把竿支好，活饵在阴影里轻轻动。甲板上多了一个人。他还是把她带来了，三十出头，白衬衫，妆很淡，见我踩上跳板，先递过来一块冰过的毛巾。朋友拍了拍我的肩，介绍得很大方：\n“这是我们这边的董事总经理。叫她小唐就行。执行上的事，她看着。”\n董事总经理。头衔在海风里烫了一下。她笑得很得体，不抢话，倒酒的时机却准，像排练过。我跟她点了点头，没问毕业的学校，也没问哪一年入的行。\n出了避风港，水开始变深。朋友兴致很好，讲哪条航道最近有马鲛，又讲某家的并购案被谁截了一手。小唐大多数时候只站在侧舷，该笑的时候笑，话题一转到具体的名字和额度，她就去查看冰桶，或者帮船员收一截线。我随口问她常出海吗。她说，最近才跟着周总的船出来几次。几次，不多也不少，说了也等于没说。\n声音很轻，训练有素。周总的船，她已经会这样称呼了。\n朋友的电话响了两次，都进舱里接。第二次他在门口停了一下，目光扫过来，她才跟进去，把门带上。不到五分钟又出来，脸上什么都没有，只把一杯新的威士忌放到他手边。\n后甲板的小桌上，她的第二部手机始终屏幕朝下。有一次震动，她看了一眼，把屏幕扣回去，什么都没说。朋友倒是说漏了一句，像是随口：“半山那间先让她住着，跑起来方便。”说完自己先笑，又补了一句，“年轻人，有精力。”\n我没接。\n这种安排，圈外的人爱往脸上想，往身上想。脸上的事情最便宜，也最容易讲成故事。可在这种船上，看中的从来不是长相。\n长相是给镜头和饭局用的。\n看中的是她足够听话，足够没有自己的底牌，足够在需要的时候出面，也足够在需要的时候被切开。\n有些话不方便从自己嗓子里出来，有些门不方便用自己的名字去敲。合手的时候，她是董事总经理；不合手的时候，她只是一个刚来两年的名字。\n傍晚我想了想天色，说该往回走。船便调了头。一条不错的红魽进了保温箱，还有两条不够格的，我让船员放了。朋友靠在椅背上，看着海里的光，忽然说：“董事，要懂事，明年后年，让她生个孩子吧。”\n我摇摇头。笑笑：放在西贡？\n我只是知道，手套的好处是合手。脏了，可以脱。真正要往下分的东西，股权、名分、能够过冬的那些绑定，从来不会在这船上。\n回避风塘的时候起了点浪。她站在前面吹风，白衬衫被吹得紧紧的，像一幅很容易被看懂的画面。朋友在后面打电话，声音压得很低。\n海里的鱼，至少还有被放生的时候。有些位置，从一开始上饵，就不会收杆。\n明天去打球！西贡的球场比三亚好多了，便宜多了！还是约两个伴打教练吧！我说。","en":"西贡下午的风是真不错。朋友一早就定了船，电话里只说：没外人，你来。\n船是老周的。人在伦敦，钥匙留下。船员已经把竿支好，活饵在阴影里轻轻动。甲板上多了一个人。他还是把她带来了，三十出头，白衬衫，妆很淡，见我踩上跳板，先递过来一块冰过的毛巾。朋友拍了拍我的肩，介绍得很大方：\n“这是我们这边的董事总经理。叫她小唐就行。执行上的事，她看着。”\n董事总经理。头衔在海风里烫了一下。她笑得很得体，不抢话，倒酒的时机却准，像排练过。我跟她点了点头，没问毕业的学校，也没问哪一年入的行。\n出了避风港，水开始变深。朋友兴致很好，讲哪条航道最近有马鲛，又讲某家的并购案被谁截了一手。小唐大多数时候只站在侧舷，该笑的时候笑，话题一转到具体的名字和额度，她就去查看冰桶，或者帮船员收一截线。我随口问她常出海吗。她说，最近才跟着周总的船出来几次。几次，不多也不少，说了也等于没说。\n声音很轻，训练有素。周总的船，她已经会这样称呼了。\n朋友的电话响了两次，都进舱里接。第二次他在门口停了一下，目光扫过来，她才跟进去，把门带上。不到五分钟又出来，脸上什么都没有，只把一杯新的威士忌放到他手边。\n后甲板的小桌上，她的第二部手机始终屏幕朝下。有一次震动，她看了一眼，把屏幕扣回去，什么都没说。朋友倒是说漏了一句，像是随口：“半山那间先让她住着，跑起来方便。”说完自己先笑，又补了一句，“年轻人，有精力。”\n我没接。\n这种安排，圈外的人爱往脸上想，往身上想。脸上的事情最便宜，也最容易讲成故事。可在这种船上，看中的从来不是长相。\n长相是给镜头和饭局用的。\n看中的是她足够听话，足够没有自己的底牌，足够在需要的时候出面，也足够在需要的时候被切开。\n有些话不方便从自己嗓子里出来，有些门不方便用自己的名字去敲。合手的时候，她是董事总经理；不合手的时候，她只是一个刚来两年的名字。\n傍晚我想了想天色，说该往回走。船便调了头。一条不错的红魽进了保温箱，还有两条不够格的，我让船员放了。朋友靠在椅背上，看着海里的光，忽然说：“董事，要懂事，明年后年，让她生个孩子吧。”\n我摇摇头。笑笑：放在西贡？\n我只是知道，手套的好处是合手。脏了，可以脱。真正要往下分的东西，股权、名分、能够过冬的那些绑定，从来不会在这船上。\n回避风塘的时候起了点浪。她站在前面吹风，白衬衫被吹得紧紧的，像一幅很容易被看懂的画面。朋友在后面打电话，声音压得很低。\n海里的鱼，至少还有被放生的时候。有些位置，从一开始上饵，就不会收杆。\n明天去打球！西贡的球场比三亚好多了，便宜多了！还是约两个伴打教练吧！我说。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126507993881854147","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":581},{"id":"2126507863552168347","h":"bbcchinese","ts":1795833957,"zh":"台湾周六迎来“九合一”选举投票日。民进党籍台北市长候选人沈伯洋与妻女前往金华国中投票所投票。他将在此次选举中，主要挑战国民党籍的现任市长蒋万安。\n沈伯洋因路权风波，取消原定周五的选前之夜大型造势晚会，改为进行线上直播，一度有超过50万人收看。","en":"台湾周六迎来“九合一”选举投票日。民进党籍台北市长候选人沈伯洋与妻女前往金华国中投票所投票。他将在此次选举中，主要挑战国民党籍的现任市长蒋万安。\n沈伯洋因路权风波，取消原定周五的选前之夜大型造势晚会，改为进行线上直播，一度有超过50万人收看。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2126505704953638912/vid/avc1/1080x1920/peuYJIDQbemlvgJa.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2126507863552168347","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":1,"vw":2330},{"id":"2126500800893796800","h":"cnfinancewatch","ts":1795832274,"zh":"性最终还是一场战争：\n统治者和被统治者的战争，主要体现在婚姻和娼妓制度管理上。\n更重要的是女性针对难性的禁锢与反禁锢的战争：\n女性天然需要为孩子和自己的利益而盘剥独占男性及其附带经济政治资源，这种独占常常通过要求男性性忠贞来实现。\n这个战争，无解。而且非常残酷，上海那个朱女士一定要杀死丈夫婚外受精卵，不离婚一定要把丈夫弄到身败名裂净身出户乃至刑事拘留还不算，要他坐牢……\n这是女性针对男性性忠贞的真实战争场景。非常爆裂。\n而武汉大学教授（安徽大学副校长）被前妻鼓动两个女儿举报婚外师生恋➕科研经费贪腐（查无贪污担忧违规），也是战争的残酷真相。","en":"性最终还是一场战争：\n统治者和被统治者的战争，主要体现在婚姻和娼妓制度管理上。\n更重要的是女性针对难性的禁锢与反禁锢的战争：\n女性天然需要为孩子和自己的利益而盘剥独占男性及其附带经济政治资源，这种独占常常通过要求男性性忠贞来实现。\n这个战争，无解。而且非常残酷，上海那个朱女士一定要杀死丈夫婚外受精卵，不离婚一定要把丈夫弄到身败名裂净身出户乃至刑事拘留还不算，要他坐牢……\n这是女性针对男性性忠贞的真实战争场景。非常爆裂。\n而武汉大学教授（安徽大学副校长）被前妻鼓动两个女儿举报婚外师生恋➕科研经费贪腐（查无贪污担忧违规），也是战争的残酷真相。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126500800893796800","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":427},{"id":"2126499478425256013","h":"darrencao2024","ts":1795831958,"zh":"不确定性相对其他大科技肯定多不少，但是股价弹性也更大，潜在上涨空间更高。","en":"不确定性相对其他大科技肯定多不少，但是股价弹性也更大，潜在上涨空间更高。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2126499478425256013","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":467},{"id":"2126498624209342858","h":"cnfinancewatch","ts":1795831755,"zh":"一 劝和，离婚再找还是找一样的男人不是？除非不婚。\n二 说个暴论，婚外性、婚外情，比例超乎想象地高：\n你谅解，可能它就是个婚姻补充，你不谅解，它就是个婚姻地雷！\n不要查对方手机，一查都是血淋淋的地雷，谁没个需要说话和发泄的时候，谁没需要人唠唠嗑的时候？谁没点儿阴暗隐私？\n三 管住边界：家庭责任，尤其是经济责任要强调，情感问题太主观，相互慢慢适应！\n记住：你就是正妻，不一定最好吃，但是主菜；那个外边的，再怎么好吃也就是图个新鲜，多吃两口，再新鲜多吃几次也会厌，厌倦那是必然的，等他倦了，自然，那也就结束了。","en":"一 劝和，离婚再找还是找一样的男人不是？除非不婚。\n二 说个暴论，婚外性、婚外情，比例超乎想象地高：\n你谅解，可能它就是个婚姻补充，你不谅解，它就是个婚姻地雷！\n不要查对方手机，一查都是血淋淋的地雷，谁没个需要说话和发泄的时候，谁没需要人唠唠嗑的时候？谁没点儿阴暗隐私？\n三 管住边界：家庭责任，尤其是经济责任要强调，情感问题太主观，相互慢慢适应！\n记住：你就是正妻，不一定最好吃，但是主菜；那个外边的，再怎么好吃也就是图个新鲜，多吃两口，再新鲜多吃几次也会厌，厌倦那是必然的，等他倦了，自然，那也就结束了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126498624209342858","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":762},{"id":"2126497019267264560","h":"bboczeng","ts":1795831372,"zh":"只要你敢永远持有，永远加仓，当然不慌\n不过有这么好的耐心，为什么不买voo？\n回顾历史，持有20年voo\n你早就是亿万富翁了\n所以，今天的波动我看都不看\n定投完事\n告诉你一个小秘密：\n这才是在我们这个虚拟现实中，\n通关必胜的唯一方法\n其他方法说白了，\n全都是骗局\n就看你有没有Neo般的觉悟了","en":"只要你敢永远持有，永远加仓，当然不慌\n不过有这么好的耐心，为什么不买voo？\n回顾历史，持有20年voo\n你早就是亿万富翁了\n所以，今天的波动我看都不看\n定投完事\n告诉你一个小秘密：\n这才是在我们这个虚拟现实中，\n通关必胜的唯一方法\n其他方法说白了，\n全都是骗局\n就看你有没有Neo般的觉悟了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2126497019267264560","l":[],"ln":[],"t":[],"lk":7,"rt":1,"rp":1,"vw":1387},{"id":"2126496406047432946","h":"cnfinancewatch","ts":1795831226,"zh":"人类基本由性力推动。\n也因此统治者对性力就要加一控制规训：\n控制在生产军士、力工的水平上，控制在必须生产和在生产上；让它为统治阶级、家族集体服务。\n但人类是有反抗的，例如，五四启蒙文化就是反抗，反抗传统婚姻、倡导性解放，这种精神由被上个世纪八十年代新启蒙文化接续！\n目前进入新阶段：男人不追女人；女人看不上男人的性别冷战阶段！取而代之的是：\n1-非婚性性\n2-同性\n3-无性交性快感（性玩具、SM等等）\n4-多人性活动\n这里产生了相当的产业和不同的产业模式，这个细分产及其模式很值得研究。","en":"人类基本由性力推动。\n也因此统治者对性力就要加一控制规训：\n控制在生产军士、力工的水平上，控制在必须生产和在生产上；让它为统治阶级、家族集体服务。\n但人类是有反抗的，例如，五四启蒙文化就是反抗，反抗传统婚姻、倡导性解放，这种精神由被上个世纪八十年代新启蒙文化接续！\n目前进入新阶段：男人不追女人；女人看不上男人的性别冷战阶段！取而代之的是：\n1-非婚性性\n2-同性\n3-无性交性快感（性玩具、SM等等）\n4-多人性活动\n这里产生了相当的产业和不同的产业模式，这个细分产及其模式很值得研究。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126496406047432946","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1045},{"id":"2126489638957445348","h":"cnfinancewatch","ts":1795829612,"zh":"怪论性经济学：闸门松了，禁令却更紧了\n性曾是人类最硬的激励。从前独自生育的代价高到无法承受，女性天然握着准入闸门。男人想要过关，就只能去挣财富、地位和声誉。门槛够不到，就没有入场券。整座社会的“移山”动能，有很大一块是被这道闸门顶起来的。\n然后，避孕药和合法流产把生育与性行为解绑了。性的稀缺性一夜蒸发。最顶级的生理奖赏不再需要移山就能获取，激励链条随之松动。1996年，阿克洛夫、卡茨和后来出任美联储主席的耶伦就写过：\n避孕工具摧毁了以婚姻做担保的传统契约，女性很难再用性换取男人的长期承诺。鲍迈斯特和沃斯随后把它收成一套“性经济学”：性是有价格的，供给一松，价格就跌。\n怪论要从这里拐弯。\n真正决定今天局面的，不是“性变便宜了”这一句话，而是两股力在对拉。\n一边，政府过度干预性，倾向于严禁卖淫嫖娼，生怕享乐主义把社会的奋斗结构拆掉；另一边，女性倾向避孕，从而放松了性管制。\n一边抬价，一边放量。梁木不是被抽掉一根，而是被两头同时拽裂。\n先看政府这头。\n严禁买卖，表面是风化，底下是治理恐惧。一旦性可以明码标价、稳定供给，它就不再是需要用婚姻、忠诚和多年投入去兑换的奖赏，而更接近一种可购买的享乐。对治理者来说，这很危险：\n男人不必再为入场券去积累，家庭作为财政和社会保险的单元也会松动。所以国家往往宁可用刑法去维持一种虚假的稀缺——不许把性做成公开市场。它要的不是没人做爱，而是做爱不能太容易、太组织化、太去掉责任。\n禁的是交易，不是欲望。这正是干预的悖论：它要保住那根激励梁木，却只能去砸最显性的市场。\n再看女性这头。避孕普及后，放松管制几乎是理性选择。既然怀孕不再是默认后果，闸门就不必再为每一次准入上全额保险。个体获得了前所未有的身体主权，集体价格却被摊薄了。旧契约里，性、生育、承诺是捆在一起出售的；解绑之后，女性可以只要其中一两样，男人也可以。\n耶伦他们说的不是道德沦丧，而是合约失效：你无法再稳定地用短期准入，去换取终身担保。于是出现一种很别扭的共存：\n卧室里更自由了，婚姻市场上更难成交了。\n两股力不会互相成全，只会互相拆台。政府把公开的性市场按下去，并没有把价格抬回去，只是把交易赶进影子里：约会应用、短期关系、色情替代，以及各种不登记、不纳税、也不承诺的私下安排。\n女性放松管制，也没有得到更可靠的承诺，只是让“不必移山也能获取”变得更常见。国家越是用严禁来对抗享乐主义，民间越是用低成本替代品来绕开禁令；民间越是绕开，治理者越认定享乐主义在蔓延，禁令就再收紧一圈。\n结果不是旧道德复兴，而是官方清教与私下放纵并行。表面上性很紧，实际上性很散。紧的是许可，散的是意义。\n更怪的是第三股力：一套越来越脱离生育的快感生产。换妻、SM，以及各种把痛感、交换、角色和规则本身当成目的的玩法，并不是简单的“堕落清单”。\n它们是解绑之后的逻辑下游。当性不再必须指向怀孕，快感就可以从生殖脚本里独立出来，自我迭代，追求强度、新奇和可控的冒险。\n生育是一种高成本、强约束的远期回报；这类实践提供的是即时的、可设计的、不必经过婚姻审批的回报。它们进一步改写了价格：奖赏不再来自“被选中去组建家庭”，而来自场景本身。于是奋斗、承诺、生育在激励结构里继续后移。不是所有人都加入其中，但它们改变了整个市场的参照系——既然极致体验可以另辟蹊径，常规追求就更显得“不值得费那份劲”。\n数据也咬合得上，只是时间点常被拿来反驳。\n特温格统计过，2010年代初的美国成年人，每年平均性生活次数比90年代末少了九次。质疑很硬：避孕药都普及半个多世纪了，断崖为什么最近十几年才出现？答案未必是“性经济学破产”，而更像是解绑之后，替代品终于成熟了。智能手机、约会频率萎缩、年轻人更久地赖在父母家，不是另起一套解释，而是把已经便宜的性，再往更低成本、更低摩擦、更不必面向真人的方向推了一截。避孕松开的是供给；手机和平台放大的是替代。政府禁令又堵住了最正式的市场出口。三件事叠在一起，真实配对下降，并不奇怪。\n韦恩斯坦承认，倒退回没有避孕药的过去既不可能，也未必明智。他断定男人的动力架构坏了，却没给出修法。怪论只能把缺口说清楚：政府想用严禁保住稀缺，却保不住承诺；女性用避孕拿回了控制权，却难以再给旧契约定价；非生育向的快感工业继续把奖赏从家庭里抽走。三股力都在解决自己的问题，没有一股在安装新的梁木。\n于是我们停在一个很当代的处境里。性依然强大，只是它推动的不再必然是财富、地位、声誉和抚育，而可能是绕开禁令的聪明、降低风险的技术，以及越来越精致的、不必留下孩子的快感！","en":"怪论性经济学：闸门松了，禁令却更紧了\n性曾是人类最硬的激励。从前独自生育的代价高到无法承受，女性天然握着准入闸门。男人想要过关，就只能去挣财富、地位和声誉。门槛够不到，就没有入场券。整座社会的“移山”动能，有很大一块是被这道闸门顶起来的。\n然后，避孕药和合法流产把生育与性行为解绑了。性的稀缺性一夜蒸发。最顶级的生理奖赏不再需要移山就能获取，激励链条随之松动。1996年，阿克洛夫、卡茨和后来出任美联储主席的耶伦就写过：\n避孕工具摧毁了以婚姻做担保的传统契约，女性很难再用性换取男人的长期承诺。鲍迈斯特和沃斯随后把它收成一套“性经济学”：性是有价格的，供给一松，价格就跌。\n怪论要从这里拐弯。\n真正决定今天局面的，不是“性变便宜了”这一句话，而是两股力在对拉。\n一边，政府过度干预性，倾向于严禁卖淫嫖娼，生怕享乐主义把社会的奋斗结构拆掉；另一边，女性倾向避孕，从而放松了性管制。\n一边抬价，一边放量。梁木不是被抽掉一根，而是被两头同时拽裂。\n先看政府这头。\n严禁买卖，表面是风化，底下是治理恐惧。一旦性可以明码标价、稳定供给，它就不再是需要用婚姻、忠诚和多年投入去兑换的奖赏，而更接近一种可购买的享乐。对治理者来说，这很危险：\n男人不必再为入场券去积累，家庭作为财政和社会保险的单元也会松动。所以国家往往宁可用刑法去维持一种虚假的稀缺——不许把性做成公开市场。它要的不是没人做爱，而是做爱不能太容易、太组织化、太去掉责任。\n禁的是交易，不是欲望。这正是干预的悖论：它要保住那根激励梁木，却只能去砸最显性的市场。\n再看女性这头。避孕普及后，放松管制几乎是理性选择。既然怀孕不再是默认后果，闸门就不必再为每一次准入上全额保险。个体获得了前所未有的身体主权，集体价格却被摊薄了。旧契约里，性、生育、承诺是捆在一起出售的；解绑之后，女性可以只要其中一两样，男人也可以。\n耶伦他们说的不是道德沦丧，而是合约失效：你无法再稳定地用短期准入，去换取终身担保。于是出现一种很别扭的共存：\n卧室里更自由了，婚姻市场上更难成交了。\n两股力不会互相成全，只会互相拆台。政府把公开的性市场按下去，并没有把价格抬回去，只是把交易赶进影子里：约会应用、短期关系、色情替代，以及各种不登记、不纳税、也不承诺的私下安排。\n女性放松管制，也没有得到更可靠的承诺，只是让“不必移山也能获取”变得更常见。国家越是用严禁来对抗享乐主义，民间越是用低成本替代品来绕开禁令；民间越是绕开，治理者越认定享乐主义在蔓延，禁令就再收紧一圈。\n结果不是旧道德复兴，而是官方清教与私下放纵并行。表面上性很紧，实际上性很散。紧的是许可，散的是意义。\n更怪的是第三股力：一套越来越脱离生育的快感生产。换妻、SM，以及各种把痛感、交换、角色和规则本身当成目的的玩法，并不是简单的“堕落清单”。\n它们是解绑之后的逻辑下游。当性不再必须指向怀孕，快感就可以从生殖脚本里独立出来，自我迭代，追求强度、新奇和可控的冒险。\n生育是一种高成本、强约束的远期回报；这类实践提供的是即时的、可设计的、不必经过婚姻审批的回报。它们进一步改写了价格：奖赏不再来自“被选中去组建家庭”，而来自场景本身。于是奋斗、承诺、生育在激励结构里继续后移。不是所有人都加入其中，但它们改变了整个市场的参照系——既然极致体验可以另辟蹊径，常规追求就更显得“不值得费那份劲”。\n数据也咬合得上，只是时间点常被拿来反驳。\n特温格统计过，2010年代初的美国成年人，每年平均性生活次数比90年代末少了九次。质疑很硬：避孕药都普及半个多世纪了，断崖为什么最近十几年才出现？答案未必是“性经济学破产”，而更像是解绑之后，替代品终于成熟了。智能手机、约会频率萎缩、年轻人更久地赖在父母家，不是另起一套解释，而是把已经便宜的性，再往更低成本、更低摩擦、更不必面向真人的方向推了一截。避孕松开的是供给；手机和平台放大的是替代。政府禁令又堵住了最正式的市场出口。三件事叠在一起，真实配对下降，并不奇怪。\n韦恩斯坦承认，倒退回没有避孕药的过去既不可能，也未必明智。他断定男人的动力架构坏了，却没给出修法。怪论只能把缺口说清楚：政府想用严禁保住稀缺，却保不住承诺；女性用避孕拿回了控制权，却难以再给旧契约定价；非生育向的快感工业继续把奖赏从家庭里抽走。三股力都在解决自己的问题，没有一股在安装新的梁木。\n于是我们停在一个很当代的处境里。性依然强大，只是它推动的不再必然是财富、地位、声誉和抚育，而可能是绕开禁令的聪明、降低风险的技术，以及越来越精致的、不必留下孩子的快感！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126489638957445348","l":[],"ln":[],"t":["美联储"],"lk":0,"rt":0,"rp":0,"vw":954},{"id":"2126488692038717843","h":"cnfinancewatch","ts":1795829387,"zh":"在已知的宇宙里，性是人类最强大的驱动力。\n从前独自生养后代的代价高到无法承受，女性天然握着性准入的闸门。\n男人想要博得心仪女性的青睐，就只能逼着自己移山，拼命去挣财富、地位与声誉。\n达不到女性设定的门槛，就拿不到入场券。\n然后，避孕药与合法流产普及了。\n生育与性行为彻底解绑。\n既然不需要节制也能掌控生育，性的稀缺性一夜蒸发。\n当最顶级的生理奖赏不再需要移山就能获取，整个激励链条直接松动。\n越来越多人转头扑向了低成本的替代品，因为现实中的追求“已经不值得费那份劲”。\n这可不是演化生物学家的独家脑洞。\n早在1996年，经济学家乔治·阿克洛夫、迈克尔·卡茨和后来出任美联储主席的珍妮特·耶伦就提出过同样观点。\n避孕工具摧毁了以婚姻做担保的传统契约，女性很难再用性换取男人的长期承诺。\n心理学家罗伊·鲍迈斯特和凯瑟琳·沃斯随后在此基础上，搭建了一整套“性经济学”模型。\n现实里的数据确实在往下掉。\n学者琼·特温格统计发现，2010年代初的美国成年人，每年平均性生活次数比90年代末足足少了9次。\n但质疑声同样有依据。\n避孕药都普及半个多世纪了，为什么这种断崖下跌直到最近十几年才发生？\n智能手机的普及、约会频率的萎缩、年轻人赖在父母家更久，或许才是真正的原因。\n韦恩斯坦自己也承认，倒退回没有避孕药的过去既不可能，也未必明智。\n他断定男人的动力架构坏掉了，却没给出具体的修复办法。\n这根被抽掉的社会梁木该怎么补上，至今依然没有解。为我写个怪论性经济学：一政府会过度干预性（倾向于严禁卖淫嫖娼）避免享乐主义 二女性又倾向避孕而放松了性管制。两者角力……","en":"在已知的宇宙里，性是人类最强大的驱动力。\n从前独自生养后代的代价高到无法承受，女性天然握着性准入的闸门。\n男人想要博得心仪女性的青睐，就只能逼着自己移山，拼命去挣财富、地位与声誉。\n达不到女性设定的门槛，就拿不到入场券。\n然后，避孕药与合法流产普及了。\n生育与性行为彻底解绑。\n既然不需要节制也能掌控生育，性的稀缺性一夜蒸发。\n当最顶级的生理奖赏不再需要移山就能获取，整个激励链条直接松动。\n越来越多人转头扑向了低成本的替代品，因为现实中的追求“已经不值得费那份劲”。\n这可不是演化生物学家的独家脑洞。\n早在1996年，经济学家乔治·阿克洛夫、迈克尔·卡茨和后来出任美联储主席的珍妮特·耶伦就提出过同样观点。\n避孕工具摧毁了以婚姻做担保的传统契约，女性很难再用性换取男人的长期承诺。\n心理学家罗伊·鲍迈斯特和凯瑟琳·沃斯随后在此基础上，搭建了一整套“性经济学”模型。\n现实里的数据确实在往下掉。\n学者琼·特温格统计发现，2010年代初的美国成年人，每年平均性生活次数比90年代末足足少了9次。\n但质疑声同样有依据。\n避孕药都普及半个多世纪了，为什么这种断崖下跌直到最近十几年才发生？\n智能手机的普及、约会频率的萎缩、年轻人赖在父母家更久，或许才是真正的原因。\n韦恩斯坦自己也承认，倒退回没有避孕药的过去既不可能，也未必明智。\n他断定男人的动力架构坏掉了，却没给出具体的修复办法。\n这根被抽掉的社会梁木该怎么补上，至今依然没有解。为我写个怪论性经济学：一政府会过度干预性（倾向于严禁卖淫嫖娼）避免享乐主义 二女性又倾向避孕而放松了性管制。两者角力……","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126488692038717843","l":[],"ln":[],"t":["美联储"],"lk":1,"rt":1,"rp":0,"vw":1372},{"id":"2126485381839454607","h":"TheMarketMemo","ts":1795828597,"zh":"下週將步入 12 月，是美股傳統的聖誕季行情。從 $QQQ 的歷史統計數據上看，12 月是所有上漲的月份中，平均漲幅最小的一個月，而平均漲幅最大的兩個月是10月和 11 月。很顯然，今年這兩個月是拖了歷史的後腿。","en":"下週將步入 12 月，是美股傳統的聖誕季行情。從 $QQQ 的歷史統計數據上看，12 月是所有上漲的月份中，平均漲幅最小的一個月，而平均漲幅最大的兩個月是10月和 11 月。很顯然，今年這兩個月是拖了歷史的後腿。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYLLJl4bwAAFawh.jpg?name=orig"],"u":"https://x.com/TheMarketMemo/status/2126485381839454607","l":[],"ln":[],"t":["美股"],"lk":21,"rt":1,"rp":3,"vw":2425},{"id":"2126483876503785715","h":"cnfinancewatch","ts":1795828238,"zh":"这个判断有两个选项：体面共识，保留慢牛基因；还有一个是破位共识。也许3450-3750这个 報價，市場才看清真實風險——早在多數借款人實際違約之前，資產重估就已摧毀了薄弱的股權緩衝。\n如今，AI 基礎設施的融資模式如出一轍。大量數據中心缺乏公開市場報價，且多數由 OpenAI、Anthropic 等實驗室或新興雲端商使用。由於這些機構無法憑自身信用取得低息融資，科技巨頭便出面「出借信用」提供租約擔保。在這個鏈條中，每日交易的五年期信用違約掉期（CDS）成為外部唯一能即時反映真實風險的定價指標，扮演了當年 ABX 指數的角色。\n過去一年，AI 供應鏈與擔保方的 CDS 全面飆升。截至 2026 年 11 月中旬，市場透過 CDS 換算出的「市場隱含評級」，平均比信評機構給予的評級低了 5.3 個等級，這與 2007 年 2 月至 7 月華爾街大型券商的差距（4.6 至 6.5 個等級）相當。\n若將整體 AI 基礎設施建設（約 2.2 兆至 3.5 兆美元的債務、租約與算力承諾）按義務加權計算，整個體系是以單 A 級的利率進行融資，但在信貸市場上卻是以雙 B 級（高收益債）的風險定價進行交易。\nAI 產業的融資建立在一個高度封閉的循環之上：\n* 實驗室端：OpenAI 與 Anthropic 透過科技巨頭與晶片商主導的融資取得高估值，並藉此簽署巨額的不可取消算力採購承諾。\n* 巨頭端：這些承諾佔了 $MSFT $ORCL $AMZN 與 $GOOGL 總積壓訂單的約 40%。科技巨頭利用這些訂單支撐自身估值與信用評級，再反過來為實驗室的數據中心租約提供擔保。\n在這個體系中，各方的信用互為擔保，缺乏外部基準點。一旦擔保方的 CDS 擴大，實驗室的融資難度增加、估值承壓，進而削弱巨頭積壓訂單的含金量，形成負向循環。","en":"2007年，對沖基金經理約翰·保爾森（John Paulson）透過做空次貸獲利約 150 億美元。他在國會作證時指出，這筆交易的核心在於「寬鬆的信貸審核、過度槓桿，以及對信用風險的根本性錯誤定價」。當年，信評機構將高風險次級房貸評為投資級，讓金融機構得以用極低成本加上超過 30 倍的槓桿。直到 2006 年推出的 ABX 指數為不常交易的次貸債券提供了每日公開報價，市場才看清真實風險——早在多數借款人實際違約之前，資產重估就已摧毀了薄弱的股權緩衝。\n如今，AI 基礎設施的融資模式如出一轍。大量數據中心缺乏公開市場報價，且多數由 OpenAI、Anthropic 等實驗室或新興雲端商使用。由於這些機構無法憑自身信用取得低息融資，科技巨頭便出面「出借信用」提供租約擔保。在這個鏈條中，每日交易的五年期信用違約掉期（CDS）成為外部唯一能即時反映真實風險的定價指標，扮演了當年 ABX 指數的角色。\n過去一年，AI 供應鏈與擔保方的 CDS 全面飆升。截至 2026 年 11 月中旬，市場透過 CDS 換算出的「市場隱含評級」，平均比信評機構給予的評級低了 5.3 個等級，這與 2007 年 2 月至 7 月華爾街大型券商的差距（4.6 至 6.5 個等級）相當。\n若將整體 AI 基礎設施建設（約 2.2 兆至 3.5 兆美元的債務、租約與算力承諾）按義務加權計算，整個體系是以單 A 級的利率進行融資，但在信貸市場上卻是以雙 B 級（高收益債）的風險定價進行交易。\nAI 產業的融資建立在一個高度封閉的循環之上：\n* 實驗室端：OpenAI 與 Anthropic 透過科技巨頭與晶片商主導的融資取得高估值，並藉此簽署巨額的不可取消算力採購承諾。\n* 巨頭端：這些承諾佔了 $MSFT $ORCL $AMZN 與 $GOOGL 總積壓訂單的約 40%。科技巨頭利用這些訂單支撐自身估值與信用評級，再反過來為實驗室的數據中心租約提供擔保。\n在這個體系中，各方的信用互為擔保，缺乏外部基準點。一旦擔保方的 CDS 擴大，實驗室的融資難度增加、估值承壓，進而削弱巨頭積壓訂單的含金量，形成負向循環。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYJacKMaoAAgBHw.jpg?name=orig"],"u":"https://x.com/TheMarketMemo/status/2126362225187475817","l":[],"ln":[],"t":["AI科技"],"lk":32,"rt":2,"rp":5,"vw":4024},{"id":"2126358706573254948","h":"yijiangren","ts":1795798396,"zh":"观澜谱·预期差：市场为何总在共识的反面运行？\n不懂预期差，看这一篇就够了\n这一周的行情，完美诠释【预期差】这三个字。\n周一，黄仁勋回归，美股暴力反弹。\n周二，市场期待反弹延续，美股再度下跌。\n周三，悲观情绪重新蔓延，QQQ触及阶段性低点后迅速反弹。\n周五，A股与港股迎来重磅政策利好。\n发现没有，一切就像提前写好了剧本。\n我现在带大家从预期定价、仓位结构、流动性博弈和政策反应四个角度去理解，就会发现这些看似巧合的行情，存在一定的内在逻辑。\n一、预期定价\n金融市场交易的是未来，而当下的价格，反映的是市场对未来的共识。\n一件事情对价格的影响，取决于事件本身的好坏、实际结果与市场预期之间的差距，以及市场已经为这种预期投入了多少资金。\n当所有人都知道一件事情很糟糕，并且已经为此卖出资产、建立空单，那么即使基本面没有明显改善，只要现实比预期好一点，就可能引发剧烈上涨。\n反过来，当所有人都在等待利好，并且已经提前买入，利好的兑现也可能成为下跌的起点。\n观点上的共识，最终会形成仓位上的拥挤。\n而仓位上的拥挤，往往孕育着下一次预期差。\n二、仓位结构\n根据高盛11月25日披露的数据，其对冲基金客户此前连续五周降低风险敞口，随后一周ETF空头仓位指标大幅增加约19个百分点，为过去十年第三大的单周增幅。\n这意味着黄仁勋回归之前，市场已经积累了相当规模的空头仓位。\n当利好出现，部分空头止损、机构回补仓位、量化策略调整敞口、场外资金入场，多种买盘可能在短时间内形成共振。\n上涨本身又会迫使更多空头买入，从而进一步推动上涨。\n消息只是火种，仓位才是燃料。\n这也解释了为什么有时候企业的基本面仅仅发生了一点变化，股价却能在一天之内出现极其夸张的波动。\n三、流动性博弈\n市场最脆弱的时候，往往是交易方向高度趋同的时候。\n当价格持续下跌，多头不断止损，空头不断入场，市场的仓位结构也在悄然发生变化。\n随着潜在卖盘逐渐释放，大量空头反而成为未来潜在的买盘。\n周三又恰逢感恩节休市前的最后一个完整交易日。\n考虑到休市期间的不确定性，部分机构有动力主动降低风险敞口，而空头回补本身就会产生买盘。\n如果叠加相对薄弱的流动性，价格便可能出现远超预期的反弹。\n我们无法证明每一次反转背后都有主力在刻意洗盘。\n但即使没有统一的操盘者，不同机构的风控机制、止损规则和资金行为，也足以让市场呈现出类似洗盘的效果。\n市场的集体行为，有时比任何单一主力都更具力量。\n四、政策反应函数\n为什么政策利好往往出现在市场极度悲观的时候？\n因为市场价格本身，也会影响政策制定者的决策。\n当市场持续上涨，政策干预的必要性相对较低。\n但当资产价格持续下跌，开始影响居民财富、企业融资、消费信心乃至金融稳定时，政策干预的概率便可能随之提高。\n今天的国常会明确提出强化国家队稳市作用、优化中央汇金的类平准基金功能，并保障市场流动性。\n随着市场不断下跌，资产估值可能越来越低，而政策干预的必要性却越来越高。\n价格与政策干预概率之间的反向变化，本身就在孕育新的预期差。\n有时候，下跌本身就是下一轮利好诞生的原因。\n当然，政策底、市场底和经济底之间，依然可能存在漫长的时间差。\n五、散户真正的优势\n机构拥有更强的信息获取能力、研究能力、资金规模和交易工具。\n但散户也拥有一种极其珍贵的优势：\n自由支配仓位的权利。\n我们没有基金赎回的压力，没有必须维持的风险敞口，也不需要为了季度业绩排名而被迫交易。\n我们可以空仓，可以等待，可以放弃看不懂的行情。\n在所有人悲观的时候寻找机会，在所有人乐观的时候重新审视风险。\n当然，逆向交易并不意味着盲目抄底。\n悲观可以变得更加悲观，低估也可以走向极端低估。\n真正值得参与的机会，需要预期、估值、仓位结构与潜在催化剂共同提供足够好的赔率。\n至于接下来的行情。\n如果美股继续反弹，我倾向于逐步兑现底部抄底仓位的利润，因为空头回补带来的买盘终究有限，而加息预期与AI投资回报率的问题尚未解决。\nA股和港股则可以再观察一段时间，看看新一轮政策预期能否转化为真实的增量资金。\n六、总而言之\n预期差决定交易机会的方向。\n仓位结构决定行情的爆发力。\n市场流动性决定价格波动的幅度。\n基本面决定行情的持续性。\n仓位管理决定我们最终能够获得多少收益。\n交易是一场关于未来的博弈。\n当所有人都在交易同一个未来时，那个未来的价值，往往已经被提前透支。\n而真正具有赔率的机会，通常藏在共识之外。","en":"观澜谱·预期差：市场为何总在共识的反面运行？\n不懂预期差，看这一篇就够了\n这一周的行情，完美诠释【预期差】这三个字。\n周一，黄仁勋回归，美股暴力反弹。\n周二，市场期待反弹延续，美股再度下跌。\n周三，悲观情绪重新蔓延，QQQ触及阶段性低点后迅速反弹。\n周五，A股与港股迎来重磅政策利好。\n发现没有，一切就像提前写好了剧本。\n我现在带大家 多拿拿\n@USD8infinity #USD8 #usd8infinity","en":"预判了一下今天的小方向\n先空再多\n今天美股关门的早\n大家也早点休息\n准备过周末吧\n对于后续行情的话\n我觉得a股和港股如果有低位现货\n可以多拿拿\n@USD8infinity #USD8 #usd8infinity","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYJG89AbMAAPnjH.jpg?name=orig","https://pbs.twimg.com/media/HYJHGakaIAA6C5i.png?name=orig"],"u":"https://x.com/yijiangren/status/2126340832152457512","l":[],"ln":[],"t":["美股","A股港股"],"lk":5,"rt":0,"rp":1,"vw":791},{"id":"2126338198351565182","h":"AntonLaVay","ts":1795793506,"zh":"反正如果 $ANT 真的完蛋我不知道算力还能卖给谁","en":"反正如果 $ANT 真的完蛋我不知道算力还能卖给谁","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2126338198351565182","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":177},{"id":"2126336457006841991","h":"cnfinancewatch","ts":1795793091,"zh":"未来这些行业不要碰：\n近五年收入降幅最大行业排名（按普通人实际到手收入下跌幅度）\n第一名：房产中介（新房+二手房经纪），综合收入下跌70%~90%，全行业跌幅第一\n这是所有行业里收入缩水最极端的群体，完全靠佣金生存，没有稳定绩效兜底：\n巅峰期（2020-2021）一线城市资深中介月入2-5万，豪宅中介年入几十万上百万；普通门店销售月入稳定1.5万以上。\n2022-2026现状：二手房成交量暴跌70%，新房开发商佣金从3个点压缩至0.5-1个点，大量经纪人连续数月零开单，只能拿2000-3000元底薪，很多人每月倒贴端口费、路费。\n收入折算：同等劳动时长，总收入只剩巅峰10%-30%，跌幅70%-90%；大量从业者直接失业转行，彻底失去行业收入来源 。\n第二名：K12学科类教培全职讲师、课程销售，收入下跌60%~85%\n政策直接清零核心业务，行业根基消失：\n双减前头部机构主讲老师月入2-4万，寒暑假峰值5-8万，销售靠提成年入20万+；\n2021年后线下学科班关停，线上大班课取消，大量机构倒闭。留守人员要么转低薪素质教育、成人课，要么只能做低价私教；原高薪主讲转型后普遍月薪5000-8000，收入直接砍半再减半。\n数据：七成从业者收入降幅超40%，核心学科讲师跌幅普遍60%以上，大量人彻底离开教育赛道，收入归零 。\n第三名：房企本部、项目管理、地产策划，收入下跌50%~75%\n房企编制内人员，底薪小幅下调，但奖金、分红、绩效几乎清零：\n地产黄金期区域经理、项目总年薪50-150万，年终奖占年收入一半；普通策划、工程岗月薪1.2-2万，年终3-6个月工资；\n近五年房企大面积降薪、停发年终奖、裁员，留存人员取消项目分红、渠道奖励，年薪直接缩水一半以上；三四线中小房企甚至延迟发薪、只发基础工资。\n第四名：互联网大厂35岁以上业务岗、市场/运营/线下渠道，收入下跌40%~65%\n不靠技术、靠业务提成、股票期权的岗位跌幅最明显：\n2021年前大厂运营、市场岗年终奖丰厚，股票每年兑现，综合年薪25-40万；\n持续降本增效，年终奖砍半、股票缩水、优化35岁以上员工；跳槽再就业薪资普遍只有从前4-6折，同等岗位收入大幅下滑。技术研发岗相对抗跌，跌幅远低于业务线。\n第五名：家装、建材、家居门店从业者，收入下跌40%~60%\n完全绑定新房交付，地产下行直接连带产业链：\n装修工长、门店销售、全屋定制业务员，订单量腰斩，单值下滑，提成大幅减少；从前月入1-2万，现在普遍5000-8000，旺季也很难回到往年水平。\n补充区分：为什么中介、学科教培跌幅远超其他行业\n收入结构问题：中介、学科教培几乎无固定高薪底薪，收入90%靠业绩提成，行业需求消失，收入直接近乎归零；工厂、体制内、技术岗有基础工资兜底，最多砍绩效，不会断崖式下跌。\n行业毁灭性冲击：中介是需求长期萎缩，教培是政策直接取缔核心业务，属于行业逻辑彻底重构；互联网、地产只是收缩调整，依然保留基础业务。\n直观对比\n体制内教师/公务员：基础工资几乎无下降，年终小幅收紧，整体降幅5%-15%；\n制造业流水线工人：只是加班减少，综合收入降20%-30%；","en":"未来这些行业不要碰：\n近五年收入降幅最大行业排名（按普通人实际到手收入下跌幅度）\n第一名：房产中介（新房+二手房经纪），综合收入下跌70%~90%，全行业跌幅第一\n这是所有行业里收入缩水最极端的群体，完全靠佣金生存，没有稳定绩效兜底：\n巅峰期（2020-2021）一线城市资深中介月入2-5万，豪宅中介年入几十万上百万；普通门店销售月入稳定1.5万以上。\n2022-2026现状：二手房成交量暴跌70%，新房开发商佣金从3个点压缩至0.5-1个点，大量经纪人连续数月零开单，只能拿2000-3000元底薪，很多人每月倒贴端口费、路费。\n收入折算：同等劳动时长，总收入只剩巅峰10%-30%，跌幅70%-90%；大量从业者直接失业转行，彻底失去行业收入来源 。\n第二名：K12学科类教培全职讲师、课程销售，收入下跌60%~85%\n政策直接清零核心业务，行业根基消失：\n双减前头部机构主讲老师月入2-4万，寒暑假峰值5-8万，销售靠提成年入20万+；\n2021年后线下学科班关停，线上大班课取消，大量机构倒闭。留守人员要么转低薪素质教育、成人课，要么只能做低价私教；原高薪主讲转型后普遍月薪5000-8000，收入直接砍半再减半。\n数据：七成从业者收入降幅超40%，核心学科讲师跌幅普遍60%以上，大量人彻底离开教育赛道，收入归零 。\n第三名：房企本部、项目管理、地产策划，收入下跌50%~75%\n房企编制内人员，底薪小幅下调，但奖金、分红、绩效几乎清零：\n地产黄金期区域经理、项目总年薪50-150万，年终奖占年收入一半；普通策划、工程岗月薪1.2-2万，年终3-6个月工资；\n近五年房企大面积降薪、停发年终奖、裁员，留存人员取消项目分红、渠道奖励，年薪直接缩水一半以上；三四线中小房企甚至延迟发薪、只发基础工资。\n第四名：互联网大厂35岁以上业务岗、市场/运营/线下渠道，收入下跌40%~65%\n不靠技术、靠业务提成、股票期权的岗位跌幅最明显：\n2021年前大厂运营、市场岗年终奖丰厚，股票每年兑现，综合年薪25-40万；\n持续降本增效，年终奖砍半、股票缩水、优化35岁以上员工；跳槽再就业薪资普遍只有从前4-6折，同等岗位收入大幅下滑。技术研发岗相对抗跌，跌幅远低于业务线。\n第五名：家装、建材、家居门店从业者，收入下跌40%~60%\n完全绑定新房交付，地产下行直接连带产业链：\n装修工长、门店销售、全屋定制业务员，订单量腰斩，单值下滑，提成大幅减少；从前月入1-2万，现在普遍5000-8000，旺季也很难回到往年水平。\n补充区分：为什么中介、学科教培跌幅远超其他行业\n收入结构问题：中介、学科教培几乎无固定高薪底薪，收入90%靠业绩提成，行业需求消失，收入直接近乎归零；工厂、体制内、技术岗有基础工资兜底，最多砍绩效，不会断崖式下跌。\n行业毁灭性冲击：中介是需求长期萎缩，教培是政策直接取缔核心业务，属于行业逻辑彻底重构；互联网、地产只是收缩调整，依然保留基础业务。\n直观对比\n体制内教师/公务员：基础工资几乎无下降，年终小幅收紧，整体降幅5%-15%；\n制造业流水线工人：只是加班减少，综合收入降20%-30%；","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126336457006841991","l":[],"ln":[],"t":["黄金"],"lk":0,"rt":0,"rp":0,"vw":297},{"id":"2126336335279771957","h":"cnfinancewatch","ts":1795793062,"zh":"美股\nCTA抛的差不多了，今天大概有一个方向了吧","en":"美股\nCTA抛的差不多了，今天大概有一个方向了吧","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126336335279771957","l":[],"ln":[],"t":["美股"],"lk":0,"rt":0,"rp":0,"vw":355},{"id":"2126334727384936743","h":"Balder13946731","ts":1795792679,"zh":"今天只有半天交易， 报电话会上，CEO王兴表示，“AI要真正创造价值，关键在于将高价值场景、高质量数据和闭环执行能力深度结合，这正是美团的优势所在。”王兴同时表示，“今年我们通过AI相关的资本支出订单锁定了部分算力用于未来使用，因此我们预计明年AI相关的资本支出将低于今年。”","en":"21:18:41【美团王兴：预计明年AI相关的资本支出将低于今年】财联社11月27日电，“无论前端交互方式如何演进，用户对本地生活服务的核心需求并未改变。”11月27日晚，美团三季度财报电话会上，CEO王兴表示，“AI要真正创造价值，关键在于将高价值场景、高质量数据和闭环执行能力深度结合，这正是美团的优势所在。”王兴同时表示，“今年我们通过AI相关的资本支出订单锁定了部分算力用于未来使用，因此我们预计明年AI相关的资本支出将低于今年。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2126307224884810020","l":[],"ln":[],"t":["AI科技","财报"],"lk":1,"rt":0,"rp":0,"vw":255},{"id":"2126305038968738148","h":"xiaomustock","ts":1795785600,"zh":"昨天是海力士第一次外资净买入，\n今天是整个韩股外资净买入。","en":"昨天是海力士第一次外资净买入，\n今天是整个韩股外资净买入。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYInKUfasAA9y_-.jpg?name=orig"],"u":"https://x.com/xiaomustock/status/2126305038968738148","l":[],"ln":[],"t":[],"lk":14,"rt":0,"rp":9,"vw":6817},{"id":"2126301975507509657","h":"AntonLaVay","ts":1795784870,"zh":"请注意，当MM面对难以对冲的Exposure时，他们的选择很简单，就是非常暴力的直接提高IV。\n这也是为什么末日期权是最贵的，因为末日期权做市商难以对冲。\n你在主升浪末尾赶上MM对于对冲焦头烂额无脑拉IV的时候冲进去，很难活。","en":"请注意，当MM面对难以对冲的Exposure时，他们的选择很简单，就是非常暴力的直接提高IV。\n这也是为什么末日期权是最贵的，因为末日期权做市商难以对冲。\n你在主升浪末尾赶上MM对于对冲焦头烂额无脑拉IV的时候冲进去，很难活。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2126301975507509657","l":[],"ln":[],"t":[],"lk":8,"rt":1,"rp":1,"vw":1680},{"id":"2126301280532394251","h":"AntonLaVay","ts":1795784704,"zh":"Michael Burry 的真实圣经\n其实这套思维放到今年上半年的存储牛市里，实用性拉满，核心就是：在标的之外，给市场情绪本身做低买高卖。\n正常大盘股大多是“跌了才恐慌、IV 飙升”；但高动量主升浪恰恰相反，是典型的 Spot Up, Vol Up\n今年上半年存储板块最狂热的时候，追涨盘疯狂抢筹虚值 Call，逼着做市商陷入 Short Gamma 的境地，只能一边买正股对冲，一边狂拉IV。结果就是 $DRAM 的 IV 一度冲到 100，Call 的溢价贵到离谱。\n到这个阶段，一张 Call 里装的早就不是什么基本面逻辑，而是赤裸裸的踏空焦虑和市场贪婪。\n套用 Burry 在“工具层高卖”的思路，如果你当时手里握着存储正股，已经有了丰厚浮盈，最舒服的策略不是去猜精准的最高点，而是趁着高 IV，分批次备兑 Sell Call 出货。\n这本质上是在向市场收取一笔高昂的“贪婪税”：\n如果行情继续疯涨，你的一部分正股被行权买走，相当于在更高的目标价止盈，同时白赚一大笔被极度高估的权利金，实际离场价远高于当下市价，做了一笔分批止盈。\n如果行情滞涨，横盘或者开始回调，厚实的权利金直接垫高了你的安全垫，等于把一部分情绪泡沫提前折现落袋。\n当然，如果崩盘来得太快，权利金兜不住正股的暴跌，那就是另外的故事了。关键在于分批出货，主动降仓位，把 Sell Call 当作附带高额溢价的限价卖单，顺着 Burry“不走完叙事”的原则，在工具最贵的时候把筹码逐步交给最狂热的人。\n反过来，看看当时站在对手盘，在高点硬追昂贵 Call 的人经历了什么。\n很多人高位买 Call 是冲着“亏损有限、盈利无限”去的，觉得自己占了结构上的便宜。但在 IV 飙到 100 的购买高潮里裸买 Call，你实际上走进了一个盈利条件极其苛刻，胜率和赔率定价严重向对手盘倾斜的陷阱：\n方向看对依然可能亏钱。 100 的 IV 意味着市场已经提前把极其夸张的涨幅写进了期权价格里。你买进去之后，标的不仅要涨，还得涨得比高企的隐含波动率更快、更猛；只要稍微横盘歇口气，或者涨得不够急，高昂的Theta损耗和IV回落就能把你活活磨死。\n能让你在横盘体验期权暴跌30%的滋味。\n崩盘时波动率也不是救场的，而是直接塌方。 上半年存储见顶崩盘后，DRAM 的 IV 一路掉到 50 以下。\n原因很简单：之前把 IV 顶上天的是拥挤的追涨买盘，一旦趋势破位，追涨资金断流，做市商解除逼空警报，市场瞬间切换成 Spot Down, Vol Down。\n高点追 Call 的人直接吃满Delta暴跌，Vega腰斩和Theta的三重绞杀。\n哪怕迎来自然反弹，也往往解不了套。\n暴跌之后的暴力反抽，经常伴随着 IV 继续走低。上方堆满套牢盘，追涨共识已经破裂，股价就算反弹 20%，手里的虚值 Call 也可能纹丝不动，继续阴跌归零。\n同一波行情里，高点追 Call 的人，是在用最苛刻的盈利条件去赌最后一段抛物线，横盘亏、慢涨亏、反弹可能还亏、一跌直接归零；而手里有货、借高 IV 分批备兑 Sell Call 的人，是在工具定价最扭曲的时刻把风险转嫁出去，稳稳收下情绪溢价。\nBurry 在 VIX 飙升时卖掉手里的 Put，收的是市场恐慌的溢价；在存储牛市 IV 破百时分批备兑卖 Call，收的是市场贪婪的溢价。\n看对趋势只赚了一半的钱；看懂手里工具的贵贱，才是交易里最值钱的那一半。\n甚至在Burry的交易理念里，工具不趁手的时候就停止交易，可见在他看来，工具定价本身的合理重要性要强于行情本身。","en":"Michael Burry 的真实圣经\n其实这套思维放到今年上半年的存储牛市里，实用性拉满，核心就是：在标的之外，给市场情绪本身做低买高卖。\n正常大盘股大多是“跌了才恐慌、IV 飙升”；但高动量主升浪恰恰相反，是典型的 Spot Up, Vol Up\n今年上半年存储板块最狂热的时候，追涨盘疯狂抢筹虚值 Call，逼着做市商陷入 Short Gamma 的境地，只能一边买正股对冲，一边狂拉IV。结果就是 $DRAM 的 IV 一度冲到 100，Call 的溢价贵到离谱。\n到这个阶段，一张 Call 里装的早就不是什么基本面逻辑，而是赤裸裸的踏空焦虑和市场贪婪。\n套用 Burry 在“工具层高卖”的思路，如果你当时手里握着存储正股，已经有了丰厚浮盈，最舒服的策略不是去猜精准的最高点，而是趁着高 IV，分批次备兑 Sell Call 出货。\n这本质上是在向市场收取一笔高昂的“贪婪税”：\n如果行情继续疯涨，你的一部分正股被行权买走，相当于在更高的目标价止盈，同时白赚一大笔被极度高估的权利金，实际离场价远高于当下市价，做了一笔分批止盈。\n如果行情滞涨，横盘或者开始回调，厚实的权利金直接垫高了你的安全垫，等于把一部分情绪泡沫提前折现落袋。\n当然，如果崩盘来得太快，权利金兜不住正股的暴跌，那就是另外的故事了。关键在于分批出货，主动降仓位，把 Sell Call 当作附带高额溢价的限价卖单，顺着 Burry“不走完叙事”的原则，在工具最贵的时候把筹码逐步交给最狂热的人。\n反过来，看看当时站在对手盘，在高点硬追昂贵 Call 的人经历了什么。\n很多人高位买 Call 是冲着“亏损有限、盈利无限”去的，觉得自己占了结构上的便宜。但在 IV 飙到 100 的购买高潮里裸买 Call，你实际上走进了一个盈利条件极其苛刻，胜率和赔率定价严重向对手盘倾斜的陷阱：\n方向看对依然可能亏钱。 100 的 IV 意味着市场已经提前把极其夸张的涨幅写进了期权价格里。你买进去之后，标的不仅要涨，还得涨得比高企的隐含波动率更快、更猛；只要稍微横盘歇口气，或者涨得不够急，高昂的Theta损耗和IV回落就能把你活活磨死。\n能让你在横盘体验期权暴跌30%的滋味。\n崩盘时波动率也不是救场的，而是直接塌方。 上半年存储见顶崩盘后，DRAM 的 IV 一路掉到 50 以下。\n原因很简单：之前把 IV 顶上天的是拥挤的追涨买盘，一旦趋势破位，追涨资金断流，做市商解除逼空警报，市场瞬间切换成 Spot Down, Vol Down。\n高点追 Call 的人直接吃满Delta暴跌，Vega腰斩和Theta的三重绞杀。\n哪怕迎来自然反弹，也往往解不了套。\n暴跌之后的暴力反抽，经常伴随着 IV 继续走低。上方堆满套牢盘，追涨共识已经破裂，股价就算反弹 20%，手里的虚值 Call 也可能纹丝不动，继续阴跌归零。\n同一波行情里，高点追 Call 的人，是在用最苛刻的盈利条件去赌最后一段抛物线，横盘亏、慢涨亏、反弹可能还亏、一跌直接归零；而手里有货、借高 IV 分批备兑 Sell Call 的人，是在工具定价最扭曲的时刻把风险转嫁出去，稳稳收下情绪溢价。\nBurry 在 VIX 飙升时卖掉手里的 Put，收的是市场恐慌的溢价；在存储牛市 IV 破百时分批备兑卖 Call，收的是市场贪婪的溢价。\n看对趋势只赚了一半的钱；看懂手里工具的贵贱，才是交易里最值钱的那一半。\n甚至在Burry的交易理念里，工具不趁手的时候就停止交易，可见在他看来，工具定价本身的合理重要性要强于行情本身。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2126301280532394251","l":[],"ln":[],"t":[],"lk":18,"rt":3,"rp":1,"vw":3056},{"id":"2126298834263306411","h":"bbcchinese","ts":1795784121,"zh":"美国对伊朗实施海上封锁，迫使长期依赖廉价伊朗石油的中国独立炼油厂转向伊拉克等产油国，面临成本上升和经营亏损的压力。即使封锁解除，伊朗能否重新赢得这些中国买家，仍取决于油价及美国的制裁政策。","en":"美国对伊朗实施海上封锁，迫使长期依赖廉价伊朗石油的中国独立炼油厂转向伊拉克等产油国，面临成本上升和经营亏损的压力。即使封锁解除，伊朗能否重新赢得这些中国买家，仍取决于油价及美国的制裁政策。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2126298834263306411","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4jETGNl","d":"bbc.in"}],"t":["原油能源","关税贸易"],"lk":2,"rt":0,"rp":0,"vw":1417},{"id":"2126289262819922174","h":"TraderS18","ts":1795781839,"zh":"美股今天盘前的反弹真是不错，相信不少人包括我都在为前天低点没抄底拍断大腿，似乎现在情绪到底了，二探也结束了，一夜之间牛回了，各项标的又全都到反弹关键压力位了。\n那么今晚到底是继续像大A一样开创大奇迹日还是见好就收呢？\n我认为不会是又一个大奇迹日，而更可能是分化行情，AI概念应该是继续跟随英伟达，而加息见顶前大饼不像会保持独立强势的样子。\n美股自身特点及驱动力一向与大A不同，大A今天的反弹主要是靠国常会政策驱动，这是美股当前不具备的基本面。\n中国这边有国家资金明示暗示下场，但美国流动性总水龙头美联储仍然没有动作且12.10又要加息。\n美股最近能倚仗的流动性来源只有财政部TGA账户，但目前TGA账户甚至还在抽水。且美股赶上节后半日交易，活跃度跟今天放量暴涨的大A不可同日而语。\n更何况周一老黄回归的时候已经上演过一次大奇迹日了，一周之内演两次恐怕是后继乏力难以为继了（年龄到了吃药也不行）。\n所以今晚美股大概还是高位震荡，指望一夜牛回收复失地不太现实，更倾向于11月下旬的主跌浪已经阶段性结束，市场正在进入猴市高振幅阶段，切勿追涨杀跌。\n从政治因素看，今天大A反弹可能是对周一美股V反的跟随事件。\n也就是说基于APEC上的沟通，川普鼓足信心对黄进行了有效支持，而黄复职止住了全球 AI 踩踏，客观上让中方托市的成本更低、效果更好。中方也因此对外部冲突的可控性有了更好的判断，更愿意加力稳定市场。\n如果这个假设成立，中美后续市场的下限都会有一个比之前更强的保证。\n@BITstocks_CN 一个账户畅投美港股，真实持仓，秒级出入金","en":"美股今天盘前的反弹真是不错，相信不少人包括我都在为前天低点没抄底拍断大腿，似乎现在情绪到底了，二探也结束了，一夜之间牛回了，各项标的又全都到反弹关键压力位了。\n那么今晚到底是继续像大A一样开创大奇迹日还是见好就收呢？\n我认为不会是又一个大奇迹日，而更可能是分化行情，AI概念应该是继续跟随英伟达，而加息见顶前大饼不像会保持独立强势的样子。\n美股自身特点及驱动力一向与大A不同，大A今天的反弹主要是靠国常会政策驱动，这是美股当前不具备的基本面。\n中国这边有国家资金明示暗示下场，但美国流动性总水龙头美联储仍然没有动作且12.10又要加息。\n美股最近能倚仗的流动性来源只有财政部TGA账户，但目前TGA账户甚至还在抽水。且美股赶上节后半日交易，活跃度跟今天放量暴涨的大A不可同日而语。\n更何况周一老黄回归的时候已经上演过一次大奇迹日了，一周之内演两次恐怕是后继乏力难以为继了（年龄到了吃药也不行）。\n所以今晚美股大概还是高位震荡，指望一夜牛回收复失地不太现实，更倾向于11月下旬的主跌浪已经阶段性结束，市场正在进入猴市高振幅阶段，切勿追涨杀跌。\n从政治因素看，今天大A反弹可能是对周一美股V反的跟随事件。\n也就是说基于APEC上的沟通，川普鼓足信心对黄进行了有效支持，而黄复职止住了全球 AI 踩踏，客观上让中方托市的成本更低、效果更好。中方也因此对外部冲突的可控性有了更好的判断，更愿意加力稳定市场。\n如果这个假设成立，中美后续市场的下限都会有一个比之前更强的保证。\n@BITstocks_CN 一个账户畅投美港股，真实持仓，秒级出入金","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2126289262819922174","l":[],"ln":[],"t":["美联储","美股","A股港股","AI科技"],"lk":5,"rt":0,"rp":2,"vw":1788},{"id":"2126287626655400130","h":"qinbafrank","ts":1795781449,"zh":"第一次参加BBW，期待看看有没有新东西冒出来。\n#Binanceblockchainweek","en":"第一次参加BBW，期待看看有没有新东西冒出来。\n#Binanceblockchainweek","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYIW1j4b0AA0G1t.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2126287626655400130","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":2,"vw":3005},{"id":"2126287299474264232","h":"Brand","ts":1795781371,"zh":"🚨有人问埃隆·马斯克，如果他失去了一切，不得不用 1000 美元重新开始，他会怎么做。忘记5a。米。每天 18 个小时起床、翻旧账、或者用人工智能编码。马斯克指出了白手起家的大师们遗漏的东西：数十年的个人品牌资产。 他开玩笑说，17 岁时带着大约 2,500 加元、衣服和书籍来到蒙特利尔后，如果今天身无分文，那将是一场真正的世界末日：“那一定是《诸神黄昏》。而我输了。”\n 然后他说出了真正的妙语：“如果你给我一美元，我会给你不止一美元。”\n 他的观点很简单：1000 美元无关紧要，因为你无法抹去 30 年的无形资本。 BrandAI 认为，即使现金为零，马斯克也会从以下开始：\n 他的品牌：明天，仅凭他的名字，投资者就会给他 1 亿美元。他的知识：他已经知道如何建造火箭、扩大公司规模以及聘请顶尖工程师。他的网络：他可以直接接触亿万富翁和国家元首。 忙碌的专家们散布着这样的谎言：早起是你与埃隆·马斯克的唯一区别。事实上，这取决于三十年的声誉、专业知识、人脉和时机。","en":"🚨Someone asked Elon Musk what he’d do if he lost everything and had to start over with $1,000. Forget 5 a.m. wakeups, flipping thrift finds, or coding with AI for 18 hours a day. Musk pointed to what the rags-to-riches gurus leave out: decades of personal brand equity.\nHe joked that after arriving in Montreal at 17 with roughly $2,500 CAD, clothes, and books, ending up broke today would require a literal apocalypse: \"It would have to be Ragnarok. And I lost.\"\nThen he delivered the real punchline: \"If you give me a dollar, I'll give you more than a dollar.\"\nHis point is simple: the $1,000 is irrelevant because you can't erase 30 years of intangible capital. BrandAI argues that even with zero cash, Musk would start with:\nHis Brand: Investors would hand him $100 million tomorrow based on his name alone.\nHis Knowledge: He already knows how to build rockets, scale companies, and hire top engineers.\nHis Network: He has direct access to billionaires and heads of state.\nHustle gurus sell the lie that waking up early is the only thing separating you from Elon Musk. In reality, it’s three decades of reputation, expertise, connections, and timing.","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2126287196210581504/vid/avc1/1180x584/80SlBn5gEYXa8i-B.mp4?tag=29"],"u":"https://x.com/Brand/status/2126287299474264232","l":[],"ln":[],"t":["汇率","AI科技"],"lk":16,"rt":6,"rp":4,"vw":9443},{"id":"2126286261606649901","h":"artinmemes","ts":1795781123,"zh":"今天大A国家队暴涨+美股期货跟涨，但斌又唱多了\n但真正轧空，不仅要仓位挤，还要超预期，重点看下面几个时间：\n12月2小非农ADP\n12月4非农\n12月9美联储决议\n12月10 CPI\n12月14 G20\n12月15 PPI\n12月23 PCE\n12月4还有特斯拉股东会，人性机器人还缺一个GPT时刻，也是潜在逆转点","en":"今天大A国家队暴涨+美股期货跟涨，但斌又唱多了\n但真正轧空，不仅要仓位挤，还要超预期，重点看下面几个时间：\n12月2小非农ADP\n12月4非农\n12月9美联储决议\n12月10 CPI\n12月14 G20\n12月15 PPI\n12月23 PCE\n12月4还有特斯拉股东会，人性机器人还缺一个GPT时刻，也是潜在逆转点","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYISt8uaoAAqIVb.jpg?name=orig"],"u":"https://x.com/artinmemes/status/2126286261606649901","l":[],"ln":[],"t":["美联储","通胀","美股"],"lk":11,"rt":3,"rp":4,"vw":1920},{"id":"2126283673896915098","h":"bbcchinese","ts":1795780506,"zh":"最新公布的首批影像显示，一颗曾遭太空船蓄意撞击的小行星，表面留下了一个大小相当于体育场的撞击坑。","en":"最新公布的首批影像显示，一颗曾遭太空船蓄意撞击的小行星，表面留下了一个大小相当于体育场的撞击坑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2126283673896915098","l":["bbc.in"],"ln":[{"u":"https://bbc.in/48EzJ39","d":"bbc.in"}],"t":[],"lk":2,"rt":0,"rp":0,"vw":1387},{"id":"2126280455129567503","h":"fxtrader","ts" 金、社保基金等中长期资金入市支持引导政策，进一步拓宽资金来源、渠道和入市方式，推动全面落实长周期考核等要求，增强股市内在稳定性。\n三要加强输入性风险防范应对。密切关注国际经济金融形势变化，强化跨境跨市场跨行业风险监测应对，动态完善政策工具箱。进一步稳定市场预期。\n四要持续深化资本市场改革。坚持以改革促稳定、促发展，加快多层次资本市场发展，研究构建适配科技创新规律的直接融资制度体系。进一步提高上市公司质量和投资价值。\n五要依法强化全链条监管。严把入口关，强化持续监管和稽查执法，坚决查处财务造假、违规减持等行为，有效保护投资者合法权益。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2126277787405451372","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":386},{"id":"2126277264019185697","h":"bboczeng","ts":1795778978,"zh":"简单来说，对于一个已经在日本工作、而且收入很可能高于日本人平均水平的人来说，任何额外的限制措施都是歧视。\n如果这不算歧视，那同样的措施也应该适用于日本人。\n你能肯定地保证没有任何一个日本本国人，短暂加入这个医保制度钻空子，一上来就产生一笔巨额医疗账单，或者他所缴纳的费用远远低于他享受到的待遇吗?\n至于外国人离开日本的问题，难道不再居住在日本的人。就不能享自己已缴纳保费所对应的健康保险待遇吗?\n那岂不是说，为了防止公民以后离开，日本政府应该对所有日本人禁发护照?\n想想都觉得可笑。","en":"简单来说，对于一个已经在日本工作、而且收入很可能高于日本人平均水平的人来说，任何额外的限制措施都是歧视。\n如果这不算歧视，那同样的措施也应该适用于日本人。\n你能肯定地保证没有任何一个日本本国人，短暂加入这个医保制度钻空子，一上来就产生一笔巨额医疗账单，或者他所缴纳的费用远远低于他享受到的待遇吗?\n至于外国人离开日本的问题，难道不再居住在日本的人。就不能享自己已缴纳保费所对应的健康保险待遇吗?\n那岂不是说，为了防止公民以后离开，日本政府应该对所有日本人禁发护照?\n想想都觉得可笑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2126277264019185697","l":[],"ln":[],"t":[],"lk":2,"rt":1,"rp":0,"vw":132},{"id":"2126277067071472126","h":"bboczeng","ts":1795778931,"zh":"简单来说，对于一个已经在日本工作、而且收入很可能高于日本人平均水平的人来说，任何额外的限制措施都是歧视。\n如果这不算歧视，那同样的措施也应该适用于日本人。\n你能肯定地保证没有任何一个日本本国人，短暂加入这个医保制度钻空子，一上来就产生一笔巨额医疗账单，或者他所缴纳的费用远远低于他享受到的待遇吗?\n至于外国人离开日本的问题，难道不再居住在日本的人。就不能享自己已缴纳保费所对应的健康保险待遇吗?\n那岂不是说，为了防止公民以后离开，日本政府应该对所有日本人禁发护照?\n想想都觉得可笑。","en":"简单来说，对于一个已经在日本工作、而且收入很可能高于日本人平均水平的人来说，任何额外的限制措施都是歧视。\n如果这不算歧视，那同样的措施也应该适用于日本人。\n你能肯定地保证没有任何一个日本本国人，短暂加入这个医保制度钻空子，一上来就产生一笔巨额医疗账单，或者他所缴纳的费用远远低于他享受到的待遇吗?\n至于外国人离开日本的问题，难道不再居住在日本的人。就不能享自己已缴纳保费所对应的健康保险待遇吗?\n那岂不是说，为了防止公民以后离开，日本政府应该对所有日本人禁发护照?\n想想都觉得可笑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2126277067071472126","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":345},{"id":"2126271979690807544","h":"bbcchinese","ts":1795777718,"zh":"台中市长选举由国民党前主席、现任立法院副院长江启臣，对上民进党现任立委何欣纯。台湾选举传统中，素有“决战中台湾”一称，台中市有近三成的中间选民，是主要“摇摆县市”之一。","en":"台中市长选举由国民党前主席、现任立法院副院长江启臣，对上民进党现任立委何欣纯。台湾选举传统中，素有“决战中台湾”一称，台中市有近三成的中间选民，是主要“摇摆县市”之一。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2126271979690807544","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4CrbTFy","d":"bbc.in"}],"t":[],"lk":1,"rt":1,"rp":0,"vw":3446},{"id":"2126271745103634881","h":"dmjk001","ts":1795777662,"zh":"【同花顺数据接口通知】\n尊敬的客户，接到深圳交易所通知，计划将于下周一（2026年11月30日）在实时行情中停止提供ETF实时申购数量，实时申购笔数，实时赎回数量，实时赎回笔数四个指标信息；\n如未使用请忽略。","en":"【同花顺数据接口通知】\n尊敬的客户，接到深圳交易所通知，计划将于下周一（2026年11月30日）在实时行情中停止提供ETF实时申购数量，实时申购笔数，实时赎回数量，实时赎回笔数四个指标信息；\n如未使用请忽略。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2126271745103634881","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1384},{"id":"2126270254552908102","h":"cnfinancewatch","ts":1795777307,"zh":"美股盘前下午版·上 2026年11月27日 周五\n#结论 今天是感恩节后的黑色星期五，现货只做到美东13:00，完整日线仍以11月25日为准。标普500收7182.78点，跌0.25%；纳斯达克综指收23585.80点，跌0.62%；道指收50182.95点，涨0.33%；罗素2000收2704.06点，涨0.71%。标普20日仍跌7.25%，纳指20日跌11.16%，趋势没有转正。截至约15:15北京时间，标普迷你约7321点，较周三结算7195.75点涨约1.74%；纳指迷你约26783点，涨约2.61%。这是假期高水，短会话成交会更稀，不能当成20日趋势已经翻过来。\n今日只做两个大类：生物医药创新和必需消费。AI硬件明确不追。\n如果只做3只：第一只 #纳特拉 $NTRA，收301.33，涨0.84%，20日区间17.9%，箱底企稳，半仓。第二只 #苹果\n$AAPL，收355.58，涨0.43%，距20日和52周高360.83还有1.48%，突破准备，半仓。第三只 #强生\n$JNJ，收273.94，跌0.91%，20日区间36.2%，区间中下部，半仓。 $BBIO\n虽有FDA批准和Call增仓，但收在20日高点附近，短线已伸展，不进只做3只。\n明确不做：AI硬件追涨、已伸展的 $BBIO 和 $KYMR、集体诉讼还在的 $MNTN，以及短会话追涨。\n#消息面\n周三指数早盘大跌后收回。公开报道把压力归到人工智能股回吐，以及白宫对包括中国、欧盟、日本在内的14个贸易伙伴加征新关税。10月PCE同比3.8%，核心PCE同比3.3%，略高于预期；三季度GDP二次估值上修到年化4.3%，初请失业金18.9万。联邦基金期货对12月加息25个基点仍接近完全定价。\n金融时报报道， $NVDA 已要求戴尔、超微等暂停向马来西亚、新加坡、泰国、印度尼西亚交付人工智能服务器。黄仁勋12月1日、3日的国会安排还在。周四特朗普称预计与他通话，并对国家安全风险作了辩解，这是转述，不是出货限制已经解除。荷兰表示将抵制进一步限制阿斯麦对华销售的法案。假期里还有美伊谈判相关的情绪线索，可以解释期指高水，但不能单独当成买点。\n个股上， $BBIO 获FDA批准Welgemda并有优先股发行； $JNJ 有新的FDA批准； $DELL\n给出人工智能服务器积压订单1320亿美元、三季报超预期的口径； $RKLB 的Electron完成第101次发射，积压订单约35.7亿美元。\n$MNTN 有股东集体诉讼警报，偏空。\n#研报面\n近期未见头部大行大幅上调。分析师目标价均值： $BBIO 111.73美元，15家买入； $JNJ 289.88美元，11家买入；\n$AAPL 343.69美元，低于现价约3.3%； $R 305美元，来源一般。中信证券11月25日建议关注 $TSLA FSD\nv15产业链，只作转述。 $NVDA 目标价均值234美元，没有近期大幅上调。\n#资金面\n本档未见两只以上ARK基金同买。给出的是 $NTRA\n在11月25日被ARKK单基金买入约210万美元，占持仓3.19%，按规则降一档，且近3个月内部人净减约29.8万股。 $AMTM\n内部人近3个月净增约21.3万股，但两日涨幅已经过大，先不跟。\n期权只认带方向的变化。 $BBIO\nCall持仓增仓22.5%，最大Call量仓比39.8，P/C成交比0.05，和FDA批准共振，但位置已伸展。 $DELL\n最大Call距现价约1%、量仓比5.37，Call持仓增仓67.9%，三项同向。 $RKLB\nCall持仓增仓63.4%，P/C成交比0.32，同向。 $AAPL\n最大Call行权价360、距现价约1.24%，但Call持仓减仓10.7%，属于多单离场，共振质量一般。 $JNJ\n是Put持仓增加、Call持仓减少，偏空。 $NVDA、 $TSLA 最大Call和最大Put都在放量，方向不一致，不单独当买点。\n#期货\n完整交易日仍看11月25日。原邮件持仓口径未能用公开源独立核对，照录并标明：标普迷你量比0.8、OI减少25556，判定为空头回补；纳指迷你量比1.01、OI增加7825，量能未确认、暂不定性；罗素2000迷你量比1.06、OI减少1797，空头回补。十年期和三十年期美债期货量比1.83和1.48，OI大幅下降，判定为多头离场，属重大异动。黄金、白银、铜、原油按该口径也是价涨OI降的空头回补，部分成交量口径降级。价格上，标普迷你周三收7195.75，跌0.30%；纳指迷你收26100.25，跌0.67%。黄金期货周三收3535.8，目前约3689美元；WTI周三收83.68，目前约86.0美元。十年期美债期货周三涨0.31%，目前较结算回吐。量能结论要等到今晚短会话之后再看。","en":"美股盘前下午版·上 2026年11月27日 周五\n#结论 今天是感恩节后的黑色星期五，现货只做到美东13:00，完整日线仍以11月25日为准。标普500收7182.78点，跌0.25%；纳斯达克综指收23585.80点，跌0.62%；道指收50182.95点，涨0.33%；罗素2000收2704.06点，涨0.71%。标普20日仍跌7.25%，纳指20日跌11.16%，趋势没有转正。截至约15:15北京时间，标普迷你约7321点，较周三结算7195.75点涨约1.74%；纳指迷你约26783点，涨约2.61%。这是假期高水，短会话成交会更稀，不能当成20日趋势已经翻过来。\n今日只做两个大类：生物医药创新和必需消费。AI硬件明确不追。\n如果只做3只：第一只 #纳特拉 $NTRA，收301.33，涨0.84%，20日区间17.9%，箱底企稳，半仓。第二只 #苹果\n$AAPL，收355.58，涨0.43%，距20日和52周高360.83还有1.48%，突破准备，半仓。第三只 #强生\n$JNJ，收273.94，跌0.91%，20日区间36.2%，区间中下部，半仓。 $BBIO\n虽有FDA批准和Call增仓，但收在20日高点附近，短线已伸展，不进只做3只。\n明确不做：AI硬件追涨、已伸展的 $BBIO 和 $KYMR、集体诉讼还在的 $MNTN，以及短会话追涨。\n#消息面\n周三指数早盘大跌后收回。公开报道把压力归到人工智能股回吐，以及白宫对包括中国、欧盟、日本在内的14个贸易伙伴加征新关税。10月PCE同比3.8%，核心PCE同比3.3%，略高于预期；三季度GDP二次估值上修到年化4.3%，初请失业金18.9万。联邦基金期货对12月加息25个基点仍接近完全定价。\n金融时报报道， $NVDA 已要求戴尔、超微等暂停向马来西亚、新加坡、泰国、印度尼西亚交付人工智能服务器。黄仁勋12月1日、3日的国会安排还在。周四特朗普称预计与他通话，并对国家安全风险作了辩解，这是转述，不是出货限制已经解除。荷兰表示将抵制进一步限制阿斯麦对华销售的法案。假期里还有美伊谈判相关的情绪线索，可以解释期指高水，但不能单独当成买点。\n个股上， $BBIO 获FDA批准Welgemda并有优先股发行； $JNJ 有新的FDA批准； $DELL\n给出人工智能服务器积压订单1320亿美元、三季报超预期的口径； $RKLB 的Electron完成第101次发射，积压订单约35.7亿美元。\n$MNTN 有股东集体诉讼警报，偏空。\n#研报面\n近期未见头部大行大幅上调。分析师目标价均值： $BBIO 111.73美元，15家买入； $JNJ 289.88美元，11家买入；\n$AAPL 343.69美元，低于现价约3.3%； / 由于延误和组件短缺，野村证券将其 2026 年 NVIDIA NVL72 机架出货预测从 6.2 万台下调至 6 万台。但其将 2027 年预测从 6.6 万台上调至 7.5 万台，预计 VR200 将在年初实现爬坡，且来自 SpaceX/xAI 和新兴云服务商的订单将增长。\n2/ 野村证券预计全球 AI 服务器收入将在 2027 年增长 143%，达到约 8860 亿美元，而单位出货量增长 54%。在本轮更新中，其将收入预测上调 32%，但单位预测仅上调 5%。更高的内存、代工和组件价格解释了收入上调的大部分原因。\n3/ 台积电的 CoWoS 产能预计将在 2027 年达到约 200 万片晶圆，同比上涨近 80%，并在 2028 年升至约 260 万片晶圆。野村证券预计内存、CPU、PCB 和 IC 基板短缺将限制成品服务器出货，因此其预测实际产量分别为约 181 万片和 234 万片晶圆。\n4/ SpaceX/xAI 是 2027 年机架预测的关键变量。野村证券的基本情景假设其在那一年新增约 7 GW 计算产能。加上其他新兴云服务商，SpaceX/xAI 预计将占 NVIDIA 机架采购的 55–60%。这些订单是否实现取决于数据中心电力、许可和建设进度。\n5/ 谷歌的 TPU 是 2027 年增长的另一主要来源。野村证券预计出货量将从 2026 年的约 380 万片芯片升至 2027 年的 880 万片。AMD 可能面临相反的问题：如果 OpenAI、Meta 和 Anthropic 加速部署计划，野村证券对 2027 年 AMD AI 芯片 13.5 万片 CoWoS 晶圆的预测可能不足。\n6/ 2028 年的主要风险在于数据中心项目和下一代产品是否按计划推进。野村证券追踪的约 79.7 GW AI 数据中心项目中，目前仅有 37 GW 已确认或按计划推进。融资、政策、电力和建设可能导致延误，而 Feynman 的新型封装、冷却和光学技术尚未在大规模上得到验证。野村证券预测当年 AI 服务器单位出货量仅增长 3%。\n7/ 2027 年的支出前景也值得关注。野村证券预测 AI 服务器收入同比增加约 5220 亿美元，而五大云服务商的共识资本支出预测仅增加 3310 亿美元。这些数字覆盖范围不同，但野村证券认为，云支出可能需要超出预期，且新兴云服务商需贡献更多采购，以支撑其收入预测。","en":"【野村证券】NVIDIA 的 Rubin 产品爬坡速度低于预期，因此其下调了 2026 年芯片供应预测。一些原本计划于 2026 年末交付的机架已推迟至 2027 年初。野村证券将 2026 年 Rubin/Rubin Ultra 供应预测从约 202 万片下调至 163 万片，降幅 19%。\n1/ 由于延误和组件短缺，野村证券将其 2026 年 NVIDIA NVL72 机架出货预测从 6.2 万台下调至 6 万台。但其将 2027 年预测从 6.6 万台上调至 7.5 万台，预计 VR200 将在年初实现爬坡，且来自 SpaceX/xAI 和新兴云服务商的订单将增长。\n2/ 野村证券预计全球 AI 服务器收入将在 2027 年增长 143%，达到约 8860 亿美元，而单位出货量增长 54%。在本轮更新中，其将收入预测上调 32%，但单位预测仅上调 5%。更高的内存、代工和组件价格解释了收入上调的大部分原因。\n3/ 台积电的 CoWoS 产能预计将在 2027 年达到约 200 万片晶圆，同比上涨近 80%，并在 2028 年升至约 260 万片晶圆。野村证券预计内存、CPU、PCB 和 IC 基板短缺将限制成品服务器出货，因此其预测实际产量分别为约 181 万片和 234 万片晶圆。\n4/ SpaceX/xAI 是 2027 年机架预测的关键变量。野村证券的基本情景假设其在那一年新增约 7 GW 计算产能。加上其他新兴云服务商，SpaceX/xAI 预计将占 NVIDIA 机架采购的 55–60%。这些订单是否实现取决于数据中心电力、许可和建设进度。\n5/ 谷歌的 TPU 是 2027 年增长的另一主要来源。野村证券预计出货量将从 2026 年的约 380 万片芯片升至 2027 年的 880 万片。AMD 可能面临相反的问题：如果 OpenAI、Meta 和 Anthropic 加速部署计划，野村证券对 2027 年 AMD AI 芯片 13.5 万片 CoWoS 晶圆的预测可能不足。\n6/ 2028 年的主要风险在于数据中心项目和下一代产品是否按计划推进。野村证券追踪的约 79.7 GW AI 数据中心项目中，目前仅有 37 GW 已确认或按计划推进。融资、政策、电力和建设可能导致延误，而 ope/global-markets-view-europe-2026-11-27/?taid=6b093897ea3e5e0001e1e3ae&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":284},{"id":"2126221989320761440","h":"CrushTheShorts","ts":1795765800,"zh":"任老师，是真有东西啊，有点说法","en":"任老师，是真有东西啊，有点说法","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYHVBunaQAAWBt4.jpg?name=orig"],"u":"https://x.com/CrushTheShorts/status/2126221989320761440","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1128},{"id":"2126221090511098121","h":"octopusycc","ts":1795765585,"zh":"今日交易注意事项\n1. 市场流动性很低 所以会高波\n2. 必须带止损\n3. 短线交易 哪里叼做哪里","en":"今日交易注意事项\n1. 市场流动性很低 所以会高波\n2. 必须带止损\n3. 短线交易 哪里叼做哪里","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2126221090511098121","l":[],"ln":[],"t":[],"lk":5,"rt":1,"rp":0,"vw":1359},{"id":"2126219050078589318","h":"fxtrader","ts":1795765099,"zh":"国务院常务会议解读丨国常会关于资本市场部署释放五大鲜明信号（新华社）\n11月27日举行的国务院常务会议研究持续深化资本市场投融资综合改革工作，释放五大鲜明信号。\n第一，明确“资本市场事关经济发展大局”。资本市场一头连着企业融资、产业升级，另一头连着居民资产、消费信心。稳住股市也是稳预期，对于中国经济十分重要。\n第二，“谋划出台增量政策”。新闻稿里有一句信息量拉满的话：持续完善资本市场稳市机制，实施好存量政策，谋划出台增量政策。这段时间，优化增持回购、互换便利，调整融资保证金比例……政策已经出了不少。现在看来，资本市场和宏观政策层面可能还有更多政策值得期待。\n第三，“国家队”要加力。会议明确，加力发挥“国家队”稳市作用，进一步优化中央汇金公司的类“平准基金”功能，提供充足流动性保障。这句话里面有两个关键点，首先，这是“国家队”这个表述第一次出现在国常会的新闻稿里。其次，“提供充足流动性保障”，意味着中央汇金的“弹药”是充足的。\n第四，中长期资金怎么稳得到明确回应：“完善保险、企业年金、社保基金等中长期资金入市支持引导政策，不断壮大中长期投资力量。”A股最需要的，就是拿得住、看重长期回报的钱。但是长期以来，中长期资金本身会受制于考核等因素的影响，市场操作的稳定性有待提升。这次会议也释放了明确信号，要让中长期资金真正稳得下来。\n第五，“加强输入性风险防范应对”。长期以来，A股与海外市场的联动备受关注。外部主要经济体货币政策转向、美债收益率波动、跨境资本流动变化、全球风险偏好扰动，都可能给A股带来阶段性冲击。这意味着稳市不是只盯着国内市场，而是内外统筹、筑牢风险“防波堤”。（完）","en":"国务院常务会议解读丨国常会关于资本市场部署释放五大鲜明信号（新华社）\n11月27日举行的国务院常务会议研究持续深化资本市场投融资综合改革工作，释放五大鲜明信号。\n第一，明确“资本市场事关经济发展大局”。资本市场一头连着企业融资、产业升级，另一头连着居民资产、消费信心。稳住股市也是稳预期，对于中国经济十分重要。\n第二，“谋划出台增量政策”。新闻稿里有一句信息量拉满的话：持续完善资本市场稳市机制，实施好存量政策，谋划出台增量政策。这段时间，优化增持回购、互换便利，调整融资保证金比例……政策已经出了不少。现在看来，资本市场和宏观政策层面可能还有更多政策值得期待。\n第三，“国家队”要加力。会议明确，加力发挥“国家队”稳市作用，进一步优化中央汇金公司的类“平准基金”功能，提供充足流动性保障。这句话里面有两个关键点，首先，这是“国家队”这个表述第一次出现在国常会的新闻稿里。其次，“提供充足流动性保障”，意味着中央汇金的“弹药”是充足的。\n第四，中长期资金怎么稳得到明确回应：“完善保险、企业年金、社保基金等中长期资金入市支持引导政策，不断壮大中长期投资力量。”A股最需要的，就是拿得住、看重长期回报的钱。但是长期以来，中长期资金本身会受制于考核等因素的影响，市场操作的稳定性有待提升。这次会议也释放了明确信号，要让中长期资金真正稳得下来。\n第五，“加强输入性风险防范应对”。长期以来，A股与海外市场的联动备受关注。外部主要经济体货币政策转向、美债收益率波动、跨境资本流动变化、全球风险偏好扰动，都可能给A股带来阶段性冲击。这意味着稳市不是只盯着国内市场，而是内外统筹、筑牢风险“防波堤”。（完）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2126219050078589318","l":[],"ln":[],"t":[],"lk":0,"rt":1,"rp":0,"vw":1177},{"id":"2126216515607486860","h":"tig88411109","ts":1795764495,"zh":"陈吉宁落马，是不是中国A股在明年20大之前，复制06年抓上海市委书记陈良宇之后A股走势，从9月到年底大涨50%，然后随后07年17大历史巅峰6124？\n今天A股/创业板暴涨同样的逻辑，高层重大会议前政治清洗，为了维稳，特别是上海国际金融中心对内和对外龙头，复制当年的超级大牛市么，如何解读和投资策略\n现在国常会开会，相关政策和资金真金白银平准基金肯定要砸下去放水的，刚需维稳下大概率强行拉出大涨。\n但是今天和06年底层完全不一样的基本面和制度层面，除了共产党领导以外。只不过现在更加集权完全不存在当年胡温时代，以及背后江泽民的海派。\n国运还在上升期，WTO入市/股权分置改革/地方官员积极性和放水养鱼，还有房地产刚起。现在是去全球化，进一步中央集权，人口结构/房地产泡沫破灭，地方政府土地财政崩盘，高额债务，没有基本面，更没有长期的“远景”\n很简单，现在就是政策博弈市场，资金推动下暴涨暴跌就是宿命，短期大涨脉冲行情，甚至趋势下可能时间和连续性会超出想象，但是真正的赢家\n一定是不要入戏太深，把维稳意志真当作什么共产主义信仰，可以乐观做波段，但是随时要准备“长的帅不如跑的快”，国资不是给你解套来的。\n当然，目前可以偏乐观一点，安全撤出重仓、拿回现金主动权。把仓位降到睡得着觉的水平，留一点筹码跟着国家队玩波段，才是能在这个市场活过下一轮暴跌的唯一解法。投资有风险，教育分享。长期价值投资，给投资人持续复利回报，唯有美股，详见订阅者专享。","en":"陈吉宁落马，是不是中国A股在明年20大之前，复制06年抓上海市委书记陈良宇之后A股走势，从9月到年底大涨50%，然后随后07年17大历史巅峰6124？\n今天A股/创业板暴涨同样的逻辑，高层重大会议前政治清洗，为了维稳，特别是上海国际金融中心对内和对外龙头，复制当年的超级大牛市么，如何解读和投资策略\n现在国常会开会，相关政策和资金真金白银平准基金肯定要砸下去放水的，刚需维稳下大概率强行拉出大涨。\n但是今天和06年底层完全不一样的基本面和制度层面，除了共产党领导以外。只不过现在更加集权完全不存在当年胡温时代，以及背后江泽民的海派。\n国运还在上升期，WTO入市/股权分置改革/地方官员积极性和放水养鱼，还有房地产刚起。现在是去全球化，进一步中央集权，人口结构/房地产泡沫破灭，地方政府土地财政崩盘，高额债务，没有基本面，更没有长期的“远景”\n很简单，现在就是政策博弈市场，资金推动下暴涨暴跌就是宿命，短期大涨脉冲行情，甚至趋势下可能时间和连续性会超出想象，但是真正的赢家\n一定是不要入戏太深，把维稳意志真当作什么共产主义信仰，可以乐观做波段，但是随时要准备“长的帅不如跑的快”，国资不是给你解套来的。\n当然，目前可以偏乐观一点，安全撤出重仓、拿回现金主动权。把仓位降到睡得着觉的水平，留一点筹码跟着国家队玩波段，才是能在这个市场活过下一轮暴跌的唯一解法。投资有风险，教育分享。长期价值投资，给投资人持续复利回报，唯有美股，详见订阅者专享。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYHWZydbQAAMjRm.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2126216515607486860","l":[],"ln":[],"t":["美股","A股港股","黄金"],"lk 支持优质科技企业发行上市。同时密切跟踪科技产业发展最新趋势，提高相关制度的包容性精准性，严防\"伪科技\"借机上市、无真实业绩公司\"注水\"上市，切实维护公平有序的新股发行秩序。 （记者 林坚）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2126184371077943677","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":1631},{"id":"2126184327633408321","h":"dmjk001","ts":1795756820,"zh":"13:19【监管部门将全力维护资本市场平稳运行 】财联社11月27日电，国常会针对增强股市内在稳定性做了最新部署。记者获悉，下一步监管部门将坚持稳字当头，加强跨境风险监测研判和政策工具储备，巩固完善稳市机制建设，持续筑牢资本市场风险防波堤防浪堤，全力维护资本市场平稳运行。近期重点推进两大方面工作：一是优化股份回购规则，推动上市公司加大回购力度。抓紧修订《上市公司股份回购规则》，进一步提高股份回购便利度，增强护盘式回购的约束力。提高上市公司股票回购增持专项再贷款覆盖率，督促已披露计划的上市公司加快实施进度。支持、鼓励和督促具备条件的上市公司积极实施股份回购，持续做好市值管理。二是持续丰富市场投资产品和工具。持续加大权益类基金产品供给和创新力度，鼓励基金管理人发行更多浮动费率基金，研究推出股债恒定比例等多资产指数基金，丰富场外中低波动型产品。推出更多新指数股票ETF，丰富场内投资工具。 （财联社记者 林坚）","en":"13:19【监管部门将全力维护资本市场平稳运行 】财联社11月27日电，国常会针对增强股市内在稳定性做了最新部署。记者获悉，下一步监管部门将坚持稳字当头，加强跨境风险监测研判和政策工具储备，巩固完善稳市机制建设，持续筑牢资本市场风险防波堤防浪堤，全力维护资本市场平稳运行。近期重点推进两大方面工作：一是优化股份回购规则，推动上市公司加大回购力度。抓紧修订《上市公司股份回购规则》，进一步提高股份回购便利度，增强护盘式回购的约束力。提高上市公司股票回购增持专项再贷款覆盖率，督促已披露计划的上市公司加快实施进度。支持、鼓励和督促具备条件的上市公司积极实施股份回购，持续做好市值管理。二是持续丰富市场投资产品和工具。持续加大权益类基金产品供给和创新力度，鼓励基金管理人发行更多浮动费率基金，研究推出股债恒定比例等多资产指数基金，丰富场外中低波动型产品。推出更多新指数股票ETF，丰富场内投资工具。 （财联社记者 林坚）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2126184327633408321","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":0,"vw":2020},{"id":"2126183524126675111","h":"bboczeng","ts":1795756629,"zh":"https://x.com/i/spaces/1aWRppgRZNXWVQ","en":"","zh_src":"bing","lang":"","m":[],"u":"https://x.com/bboczeng/status/2126183524126675111","l":["x.com"],"ln":[{"u":"https://x.com/i/spaces/1aWRppgRZNXWVQ","d":"x.com"}],"t":[],"lk":0,"rt":0,"rp":1,"vw":1027},{"id":"2126182982327099562","h":"CrushTheShorts","ts":1795756500,"zh":"黑子说，炒HW链是熊市的肌肉记忆。熊市大家基本面都没信心，哪怕一些浓眉大眼的业绩票大家也会质疑是不是要下修\n这时候HW链的优势就出来了，你跟我谈EPS，我跟你谈格局，你跟我谈基本面弹性，我让你看股价弹性，你问我明年怎么看，我带你回顾往昔辉煌，告诉你什么叫十倍票\n2022年，新能源转熊第一年，鸿蒙三剑客初登场，那时候的问界还很好卖。2023年，又是AI硬件休息的时候，Mate60出来了，华力创通横空出世一波300%+，随后高新发展复牌出来，又是翻了几倍。2024年纯血鸿蒙打响了924的前哨，并随着924出来共振连扳，常山赵子龙大杀四方，勃勃生机万物竞发，仿佛在昨天\n后来AI产业井喷，产业牛市随之而来，大家都存为王，站在光里，HW链这种出不来业绩的就 al firms accelerated in October, supported by improving conditions in parts of the manufacturing sector, although broader economic momentum remained subdued.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2126149170033459610","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/markets/asia/chinese-industrial-profit-rises-16-january-october-2026-11-27/?taid=6b08f256ea3e5e0001e1e289&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["财报"],"lk":0,"rt":0,"rp":0,"vw":465},{"id":"2126147368777293974","h":"qinbafrank","ts":1795748009,"zh":"2008年9月雷曼兄弟破产前其CDS飙升最高也才800bp，而现在CRWV当下CDS已经飙升1600bp，市场是过度定价了么？要知道美国房地产2007年上半年就已经出现了大面积违约，07年三季度底层资产的崩溃就通过次贷已经蔓延到各大金融机构。08年上半年贝尔斯登破产，底层资产质量恶化是公开的。\n但雷曼CDS在2007年大部分时间仍在几十到100 bp左右，2008年3月贝尔斯登危机时才冲到400–580 bp，之后回落，直到2008年夏季–9月才再升到300–800 bp区间。\n好好想了下当时市场对雷曼CDS定价相对滞后的原因是当时雷曼很多风险藏在表外和复杂结构化产品里，市场看不清。同时对于这种“大而不能倒”的金融机构市场还有政府会出手救助的期待。\n来看CoreWeave\n其实Coreweave现在经营还正常、也没出现实质性违约。但Crwv是上市公司，数据公开透明，债务规模都很清楚，利息支出远超营业利润。2027年有大额到期、客户集中度高。同时对于crwv市场没有“大而不能倒”的期待，特别是“倒黄”事件后虽然老黄回归但是英伟达对外投资担保估计还是会越来越严格的。\n简单说就是：27年大额到期、没有重要到一定会被救助、市场对AI需求能否持续又充满疑虑，担心一旦AI需求或租金回报不及预期，现金流就可能撑不住债务。\n所以因此一旦杠杆和覆盖指标恶化，定价会更快走极端，市场现在把这些“如果”提前定价了。\n和雷曼相比，市场对CRWV的CDS定价更早、更激进，存在一定技术性推高的成分。但这不能说纯粹的过度定价——因为公司的高杠杆和现金流覆盖问题是公开且持续的，而雷曼当时市场对“会被救”仍有幻觉。\nCRWV利息覆盖差、债务绝对额高、资本开支依赖持续融资，这些都是真实存在的压力。\n短期自然是看如果Meta等大合同顺利、融资渠道保持畅通（比如这次45亿美元贷款成功卖出）、利用率超预期，CDS有回落空间；\n中长期还是要看27年能不能熬过大额到期、并且AI需求继续强势能让现金流能撑住债务。这个最关键。\n本质上现在市场是在提前为“杠杆AI模式可能走不通”这个情景定价，而不是在定价已经发生的违约。","en":"2008年9月雷曼兄弟破产前其CDS飙升最高也才800bp，而现在CRWV当下CDS已经飙升1600bp，市场是过度定价了么？要知道美国房地产2007年上半年就已经出现了大面积违约，07年三季度底层资产的崩溃就通过次贷已经蔓延到各大金融机构。08年上半年贝尔斯登破产，底层资产质量恶化是公开的。\n但雷曼CDS在2007年大部分时间仍在几十到100 bp左右，2008年3月贝尔斯登危机时才冲到400–580 bp，之后回落，直到2008年夏季–9月才再升到300–800 bp区间。\n好好想了下当时市场对雷曼CDS定价相对滞后的原因是当时雷曼很多风险藏在表外和复杂结构化产品里，市场看不清。同时对于这种“大而不能倒”的金融机构市场还有政府会出手救助的期待。\n来看CoreWeave\n其实Coreweave现在经营还正常、也没出现实质性违约。但Crwv是上市公司，数据公开透明，债务规模都很清楚，利息支出远超营业利润。2027年有大额到期、客户集中度高。同时对于crwv市场没有“大而不能倒”的期待，特别是“倒黄”事件后虽然老黄回归但是英伟达对外投资担保估计还是会越来越严格的。\n简单说就是：27年大额到期、没有重要到一定会被救助、市场对AI需求能否持续又充满疑虑，担心一旦AI需求或租金回报不及预期，现金流就可能撑不住债务。\n所以因此一旦杠杆和覆盖指标恶化，定价会更快走极端，市场现在把这些“如果”提前定价了。\n和雷曼相比，市场对CRWV的CDS定价更早、更激进，存在一定技术性推高的成分。但这不能说纯粹的过度定价——因为公司的高杠杆和现金流覆盖问题是公开且持续的，而雷曼当时市场对“会被救”仍有幻觉。\nCRWV利息覆盖差、债务绝对额高、资本开支依赖持续融资，这些都是真实存在的压力。\n短期自然是看如果Meta等大合同顺利、融资渠道保持畅通（比如这次45亿美元贷款成功卖出）、利用率超预期，CDS有回落空间；\n中长期还是要看27年能不能熬过大额到期、并且AI需求继续强势能让现金流能撑住债务。这个最关键。\n本质上现在市场是在提前为“杠杆AI模式可能走不通”这个情景定价，而不是在定价已经发生的违约。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYGRDamaYAAajax.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2126147368777293974","l":[],"ln":[],"t":["AI科技"],"lk":14,"rt":1,"rp":1,"vw":3857},{"id":"2126145722739511720","h":"bboczeng","ts":1795747616,"zh":"因为很多人对投资的理解是，只看你明天赚不赚得到钱，而不看你最后是否破产，\n更别提有没有逻辑，框架，哲理和智商了\n所以，投资的门槛确实很低，非常适合中专生一无所有之后去币圈炒山寨币赌博\n吸何一的奶子\n😅😅😅","en":"因为很多人对投资的理解是，只看你明天赚不赚得到钱，而不看你最后是否破产，\n更别提有没有逻辑，框架，哲理和智商了\n所以，投资的门槛确实很低，非常适合中专生一无所有之后去币圈炒山寨币赌博\n吸何一的奶子\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2126145722739511720","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":0},{"id":"2126145148836880406","h":"dmjk001","ts":1795747480,"zh":"靠谱性尚未知，市场传闻，谨慎参考","en":"靠谱性尚未知，市场传闻，谨慎参考","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYGVtpqbAAAOdsk.png?name=orig"],"u":"https://x.com/dmjk001/status/2126145148836880406","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1983},{"id":"2126144399264657840","h":"dmjk001","ts":1795747301,"zh":"转，靠谱性尚未知，市场传闻，谨慎参考","en":"转，靠谱性尚未知，市场传闻，谨慎参考","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYGVDnqbsAA9-TP.png?name=orig"],"u":"https://x.com/dmjk001/status/2126144399264657840","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":396},{"id":"2126143557727900089","h":"nytchinese","ts":1795747100,"zh":"一年前的火灾造成168人遇难，是近80年来香港最致命的火灾。北京警告称要警惕“以灾乱港”的企图，港府未举行官方纪念活动。这反映出当局担心纪念活动可能会助长反政府情绪。\n但香港民众仍然以自己的方式追思逝者，居民和遇难者家属仍在等待真正的问责。","en":"一年前的火灾造成168人遇难，是近80年来香港最致命的火灾。北京警告称要警惕“以灾乱港”的企图，港府未举行官方纪念活动。这反映出当局担心纪念活动可能会助长反政府情绪。\n但香港民众仍然以自己的 n即便作为空头，我也不会在这个位置继续干等进一步崩盘。\n首先，本来我就不做空\n其次，虽然周一被黄仁勋意外回归耽误了，但周二，周三回调给了我机会，所以其实我已经完成了留给baseline I的抄底计划\n最后，如果最后美股跌回baseline II，我就按照计划买入更多；如果跌不下去，在这个位置短期筑底，我就什么也不做，继续定投。\n反正27年AI还有更多出问题的机会，继续回调只是时间问题\n请注意，在我的定义中：定投是小仓位不择时买入；抄底则是在目标位置按比例大仓位买入。\n这是我结合自己的经验和分析能力，能为大家想到的熊市最佳投资策略\n另外，抄底和定投只买VOO；实在想抄NVDA和半导体个股的当然也可以去赌，但仓位不要超过已买入VOO部分的1/10\n久赌必输，只要有这个觉悟就好\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2126135478231683385","l":[],"ln":[],"t":["美股","AI科技"],"lk":2,"rt":0,"rp":0,"vw":370},{"id":"2126134226672402532","h":"qinbafrank","ts":1795744875,"zh":"下周CRWV这笔45亿美金的贷款是否能成功发售应该对市场走势影响不小，看彭博说大摩和三菱日联金融集团正筹备一笔45亿美元贷款出售，最早可能于下周向投资者推出。\n这是一笔DDTL，用于为佐治亚州Dalton的数据中心购买GPU（专供Meta使用），以供Meta使用的GPU及与Meta的合同为抵押/支撑。尽管CoreWeave自身是垃圾级，但因绑定Meta的强大信用，该贷款预期获得投资级评级，初步讨论区间约7%–7.5%。\n这个重要性在于：作为这一波市场质疑AI债务风险的风暴眼CRWV近期CDS又是大幅飙升，五年期CDS隐含违约概率超过70%。如果发售成功，能降低整体资金成本、支持扩张，并证明在现在市场如此悲观的情绪下、仍能获得相对便宜的资本，缓解融资压力，当然离完全消除债务担忧还有很远距离。但也算是一个积极信号。\n如果发售不成功：会放大融资担忧。公司可能被迫转向更昂贵的无担保债券、ATM增发股票，或放缓资本开支，也进一步强化违约风险定价（CDS和债券收益率已偏高）。\n如果最终定价明显好于7–7.5%、认购倍数很高，正面影响会更强；看看后续cds得走势情况\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"下周CRWV这笔45亿美金的贷款是否能成功发售应该对市场走势影响不小，看彭博说大摩和三菱日联金融集团正筹备一笔45亿美元贷款出售，最早可能于下周向投资者推出。\n这是一笔DDTL，用于为佐治亚州Dalton的数据中心购买GPU（专供Meta使用），以供Meta使用的GPU及与Meta的合同为抵押/支撑。尽管CoreWeave自身是垃圾级，但因绑定Meta的强大信用，该贷款预期获得投资级评级，初步讨论区间约7%–7.5%。\n这个重要性在于：作为这一波市场质疑AI债务风险的风暴眼CRWV近期CDS又是大幅飙升，五年期CDS隐含违约概率超过70%。如果发售成功，能降低整体资金成本、支持扩张，并证明在现在市场如此悲观的情绪下、仍能获得相对便宜的资本，缓解融资压力，当然离完全消除债务担忧还有很远距离。但也算是一个积极信号。\n如果发售不成功：会放大融资担忧。公司可能被迫转向更昂贵的无担保债券、ATM增发股票，或放缓资本开支，也进一步强化违约风险定价（CDS和债券收益率已偏高）。\n如果最终定价明显好于7–7.5%、认购倍数很高，正面影响会更强；看看后续cds得走势情况\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYGKv3waYAAHglv.jpg?name=orig","https://pbs.twimg.com/media/HYGKv3ZbEAAsh3A.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2126134226672402532","l":[],"ln":[],"t":["美股"],"lk":9,"rt":1,"rp":2,"vw":2854},{"id":"2126133418086031523","h":"fxtrader","ts":1795744683,"zh":"特朗普周四在海湖庄园感恩节活动上谈到，黄仁勋称自己重返英伟达是“他的第二任期”，并表示让黄仁勋回归是一件对美国乃至全世界都非常有益的事。\n提问：黄仁勋重返英伟达领导层以来，您和他谈过话吗？\n特朗普：没有。不过，我可能会找他谈谈。我想他基本上是周一开始上任。我觉得他是英伟达非常重要的一员。\nBlackwell芯片，目前最火的，但一年后就会过时。英伟达还有两款新芯片即将推出，性能将远远超越Blackwell。没有黄仁勋，我真不知道会怎样。\n我看到了公司当时的状况，也看到了股价的走势。我觉得他回去是一件非常好的事。我跟他聊过的时候，他非常高兴能回去。他管这叫他的第二任期。他的“第二任期”会比“第一任期”做的更好。\n他的妻子非常出色。她经历了很多。她是个很棒的女士，认识她的人都非常尊重她。他的孩子们也一样，不过我并不认识他们。但我认识他的妻子。她是个非常出色的女人，而他也是个非常出色的男人。\n市场对此感觉很好。昨天看到股价出现一些相当大的跌幅时，我有点担心。不过到收盘时，股价又涨回来了。所以我觉得，我为我们的国家，甚至为全世界，做了一件非常好的事。","en":"特朗普周四在海湖庄园感恩节活动上谈到，黄仁勋称自己重返英伟达是“他的第二任期”，并表示让黄仁勋回归是一件对美国乃至全世界都非常有益的事。\n提问：黄仁勋重返英伟达领导层以来，您和他谈过话吗？\n特朗普：没有。不过，我可能会找他谈谈。我想他基本上是周一开始上任。我觉得他是英伟达非常重要的一员。\nBlackwell芯片，目前最火的，但一年后就会过时。英伟达还有两款新芯片即将推出，性能将远远超越Blackwell。没有黄仁勋，我真不知道会怎样。\n我看到了公司当时的状况，也看到了股价的走势。我觉得他回去是一件非常好的事。我跟他聊过的时候，他非常高兴能回去。他管这叫他的第二任期。他的“第二任期”会比“第一任期”做的更好。\n他的妻子非常出色。她经历了很多。她是个很棒的女士，认识她的人都非常尊重她。他的孩子们也一样，不过我并不认识他们。但我认识他的妻子。她是个非常出色的女人，而他也是个非常出色的男人。\n市场对此感觉很好。昨天看到股价出现一些相当大的跌幅时，我有点担心。不过到收盘时，股价又涨回来了。所以我觉得，我为我们的国家，甚至为全世界，做了一件非常好的事。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2126103864848035840/vid/avc1/854x480/ELbH0a1ZabKExDRW.mp4?tag=29"],"u":"https://x.com/fxtrader/status/2126133418086031523","l":["x.com"],"ln":[{"u":"https://x.com/firesidealpha/status/2126104072256405841/video/1","d":"x.com"}],"t":["AI科技"],"lk":2,"rt":0,"rp":2,"vw":3002},{"id":"2126133380203131068","h":"cnfinancewatch","ts":1795744674,"zh":"问：事实证明，右侧还是最好的机会。但是准确的判断右侧，有时候又很难，在左侧的时候又忍不住。\n答：其实也不难。用中美共振➕均线、底部形态和美元价格定锚。准确率还是很高的 。可以定位大类资产的右侧轮动。今年我们四五六月科技、八月黄金，感觉还是对。不过九月底被A股科技反弹和QQQ新高骗线介入中美科技是止损的。\n你要么做右侧交易者严守纪律 设止损点 右侧机会出来再买。要么像我一样长期持有不管涨跌！不要来回摇摆。\n欢迎订阅大类轮动数据：","en":"问：事实证明，右侧还是最好的机会。但是准确的判断右侧，有时候又很难，在左侧的时候又忍不住。\n答：其实也不难。用中美共振➕均线、底部形态和美元价格定锚。准确率还是很高的 。可以定位大类资产的右侧轮动。今年我们四五六月科技、八月黄金，感觉还是对。不过九月底被A股科技反弹和QQQ新高骗线介入中美科技是止损的。\n你要么做右侧交易者严守纪律 设止损点 右侧机会出来再买。要么像我一样长期持有不管涨跌！不要来回摇摆。\n欢迎订阅大类轮动数据：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126133380203131068","l":["macaostarbridge.com"],"ln":[{"u":"http://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["黄金"],"lk":0,"rt":0,"rp":1,"vw":774},{"id":"2126131863945417036","h":"fxtrader","ts":1795744312,"zh":"国家统计局：1-10月全国规模以上工业企业实现利润总额67373.6亿元，同比增长16.0%。10月利润增长20.1%。\n人工智能算力需求持续增加，带动存储芯片和周边制造等相关行业利润持续增长。1至10月，电子行业利润同比翻倍，拉动全部规模以上工业企业利润增长9.7个百分点，是工业企业利润较快增长的重要支撑。\n计算机制造中，计算机整机制造、计算机外围设备制造行业利润分别增长4.1倍、2倍；电子元件及电子专用材料制造中，电子专用材料制造、电子电路制造行业利润分别增长2.2倍、81.6%；电子器件制造中，光电子器件制造、半导体分立器件制造行业利润分别增长69.7%、57.5%。","en":"国家统计局：1-10月全国规模以上工业企业实现利润总额67373.6亿元，同比增长16.0%。10月利润增长20.1%。\n人工智能算力需求持续增加，带动存储芯片和周边制造等相关行业利润持续增长。1至10月，电子行业利润同比翻倍，拉动全部规模以上工业企业利润增长9.7个百分点，是工业企业利润较快增长的重要支撑。\n计算机制造中，计算机整机制造、计算机外围设备制造行业利润分别增长4.1倍、2倍；电子元件及电子专用材料制造中，电子专用材料制造、电子电路制造行业利润分别增长2.2倍、81.6%；电子器件制造中，光电子器件制造、半导体分立器件制造行业利润分别增长69.7%、57.5%。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYGI09sacAArZ7v.jpg?name=orig","https://pbs.twimg.com/media/HYGJCCIbAAAc7QC.jpg?name=orig","https://pbs.twimg.com/media/HYGJD4taUAA8Dpz.png?name=orig","https://pbs.twimg.com/media/HYGJmIXbAAEnXFA.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2126131863945417036","l":[],"ln":[],"t":["AI科技"],"lk":7,"rt":0,"rp":4,"vw":3573},{"id":"2126131690695450630","h":"bboczeng","ts":1795744271,"zh":"虽然我很佩服这个群直白的标题，但群主的发言真的给我看醉了\n第一，投机就得了，为什么要去币安买。难道他是靠币安手续费为生，拿了何一女士不少钱？\n第二，周期股，等1年太乐观，要做好等5年的准备\n最后，居然认为小币“有价值”，真的就是纯赌了。他知道什么是波动吗，知道波动的方向性和序列性吗？\n方向性，序列性，概率，这些确实都是高中数学的内容。\n一个人如果真的学进去了，做了一定的模拟计算，看到计算结果和自己这辈子注定破产要饭的概率之后\n他应该会很快戒赌\n真的","en":"虽然我很佩服这个群直白的标题，但群主的发言真的给我看醉了\n第一，投机就得了，为什么要去币安买。难道他是靠币安手续费为生，拿了何一女士不少钱？\n第二，周期股，等1年太乐观，要做好等5年的准备\n最后，居然认为小币“有价值”，真的就是纯赌了。他知道什么是波动吗，知道波动的方向性和序列性吗？\n方向性，序列性，概率，这些确实都是高中数学的内容。\n一个人如果真的学进去了，做了一定的模拟计算，看到计算结果和自己这辈子注定破产要饭的概率之后\n他应该会很快戒赌\n真的","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYGHrMtboAACPke.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2126131690695450630","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":0,"vw":779},{"id":"2126131508738130209","h":"nytchinese","ts":1795744227,"zh":"随着特朗普政府进一步加紧切断中国企业获取美国算力的渠道，英伟达已暂停向东南亚四国销售部分最先进人工智能芯片。\n据知情人士透露，马来西亚、新加坡、泰国和印度尼西亚 智商真的很低，按这个逻辑，所有使用医保报销的人，都是用别人的保险费在支付，这不就是保险系统的原理吗？\n难道还要看你是不是外国人，是外国人生病的概率更大，还是缴的保险费更低？\n日本人智商越来越低，我这个美国人都看不下去了，\n可见该国距离彻底破产和亡国，已经时日不久了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2126129483262648653","l":[],"ln":[],"t":[],"lk":3,"rt":1,"rp":0,"vw":271},{"id":"2126127412534743264","h":"bboczeng","ts":1795743251,"zh":"周三市场出现诡异反弹，推特上的各位股神又开始预测下一步走势\n其实稍有经验的人都能看到，股市是不可预测的，也不会受任何人的主观判断影响\n10月份，很多KOL根据AI需求的基本面，预判半导体会“在真正暴跌之前，先涨到你妈都不认识”。导致粉丝看着市场变熊还不离场，想等暴跌之前的那最后一次暴涨\n结果我们也都看到了，暴涨在哪里呢？认错又有什么用呢？\n不要赌。\n假定推特有1000个KOL。周三收盘后，大概500个人预测这就是底部，马上反弹；500个人预测还有第二条腿，年底再创新低；你听谁的？\n如果500个人猜对了，就能说明这500个人的水平吗？如果另外500个人猜错了，你是不是又会为了“沉没成本”和“认知协调”，想方设法去维护他们？\n市场的门槛之低，主要体现在每天确实都有机会。如果你对了，SOXL一天之内可以给带来30%的回报，很有吸引力，这也是某些KOL的营销技巧，比如电鱼\n但你要知道，这并不是一个非此即彼，“如果我对了就如何如何”的一次性猜谜游戏。\n市场的本质在于：涨跌只是“波动”的一部分。\n波动的机制是一个时间序列，而不是一次输赢\n如果你今天对了，明天就会错；如果你这个月对了，下个月就会错；如果你上半年对了，下半年就会错；如果上半辈子财务自由了，下半辈子就会破产亏光\n昔日股神今日破产，这样的故事应该不需要我多说了\n如果只盯着一次赌博的结果看，你当然会觉得炒股很简单，因为只要赌对就好了；但如果你开始看到波动的整个序列，你就会发现炒股赚钱其实很难，非常难，数学上甚至是不可能的\n所以，普通人实际上根本就不应该碰股市，甚至应该把推特上这群投资KOL全部拉黑\n半导体“多头”是一个绝佳的例子。长此以往，如果再不改变“赌博胜负”的心理，最终你将绝对不会从华尔街赚到一分钱，大概率是亏钱\n从华尔街赚到钱，甚至让华尔街给你送钱，有且只有两条路，SGOV和VOO，详细的讨论参见我的戒赌群和之前的置顶文章\n绝对没有第三条路\n这是一种觉悟，\n就看你能什么时候觉醒，以及觉醒前还要交多少学费了\n谢谢大家","en":"周三市场出现诡异反弹，推特上的各位股神又开始预测下一步走势\n其实稍有经验的人都能看到，股市是不可预测的，也不会受任何人的主观判断影响\n10月份，很多KOL根据AI需求的基本面，预判半导体会“在真正暴跌之前，先涨到你妈都不认识”。导致粉丝看着市场变熊还不离场，想等暴跌之前的那最后一次暴涨\n结果我们也都看到了，暴涨在哪里呢？认错又有什么用呢？\n不要赌。\n假定推特有1000个KOL。周三收盘后，大概500个人预测这就是底部，马上反弹；500个人预测还有第二条腿，年底再创新低；你听谁的？\n如果500个人猜对了，就能说明这500个人的水平吗？如果另外500个人猜错了，你是不是又会为了“沉没成本”和“认知协调”，想方设法去维护他们？\n市场的门槛之低，主要体现在每天确实都有机会。如果你对了，SOXL一天之内可以给带来30%的回报，很有吸引力，这也是某些KOL的营销技巧，比如电鱼\n但你要知道，这并不是一个非此即彼，“如果我对了就如何如何”的一次性猜谜游戏。\n市场的本质在于：涨跌只是“波动”的一部分。\n波动的机制是一个时间序列，而不是一次输赢\n如果你今天对了，明天就会错；如果你这个月对了，下个月就会错；如果你上半年对了，下半年就会错；如果上半辈子财务自由了，下半辈子就会破产亏光\n昔日股神今日破产，这样的故事应该不需要我多说了\n如果只盯着一次赌博的结果看，你当然会觉得炒股很简单，因为只要赌对就好了；但如果你开始看到波动的整个序列，你就会发现炒股赚钱其实很难，非常难，数学上甚至是不可能的\n所以，普通人实际上根本就不应该碰股市，甚至应该把推特上这群投资KOL全部拉黑\n半导体“多头”是一个绝佳的例子。长此以往，如果再不改变“赌博胜负”的心理，最终你将绝对不会从华尔街赚到一分钱，大概率是亏钱\n从华尔街赚到钱，甚至让华尔街给你送钱，有且只有两条路，SGOV和VOO，详细的讨论参见我的戒赌群和之前的置顶文章\n绝对没有第三条路\n这是一种觉悟，\n就看你能什么时候觉醒，以及觉醒前还要交多少学费了\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2126127412534743264","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":2,"vw":364},{"id":"2126125818586021911","h":"cnfinancewatch","ts":1795742871,"zh":"这只ETF的全称是“#南方东英富时东西股票精选ETF”，平时大家都叫它“ #南方东西精选”（代码 #03441）。\n你可以把它想象成一个“双拼披萨”🍕：\n· 一半是“香港收租”：大约60% 的钱，买了香港本地经营稳定、愿意分红的公司（像收租一样拿分红），用来求稳。\n· 另一半是“美国现金牛”：大约40% 的钱，买了苹果、微软这类特别能赚钱的美国大公司，用来抓成长机会。\n这两半组合在一起，就是一个求稳、一个求进，互相帮忙。\n📱 在A股账户能买吗？\n可以的。 它已经在2025年11月10日被正式纳入“港股通”名单。只要你开通了A股账户的港股通权限，就可以直接用人民币像买卖普通股票一样交易它，不用换外汇，也不占用QDII额度。\n📈 过去年化收益率是多少？\n因为这只ETF上市时间不算很长（2025年3月31日上市），不同时间点统计的数据会略有浮动：\n· 截至2026年10月14日，自上市以来的年化回报约45.84%。\n· 其他数据源显示，其年平均报酬率大约在36.77% 左右。\n它属于一只比较新的产品，所以“过去年化收益”看的是成立至今的整体表现，和那些成立了十年八年的老基金“过去十年年化”的含义不太一样哦。","en":"这只ETF的全称是“#南方东英富时东西股票精选ETF”，平时大家都叫它“ #南方东西精选”（代码 #03441）。\n你可以把它想象成一个“双拼披萨”🍕：\n· 一半是“香港收租”：大约60% 的钱，买了香港本地经营稳定、愿意分红的公司（像收租一样拿分红），用来求稳。\n· 另一半是“美国现金牛”：大约40% 的钱，买了苹果、微软这类特别能赚钱的美国大公司，用来抓成长机会。\n这两半组合在一起，就是一个求稳、一个求进，互相帮忙。\n📱 在A股账户能买吗？\n可以的。 它已经在2025年11月10日被正式纳入“港股通”名单。只要你开通了A股账户的港股通权限，就可以直接用人民币像买卖普通股票一样交易它，不用换外汇，也不占用QDII额度。\n📈 过去年化收益率是多少？\n因为这只ETF上市时间不算很长（2025年3月31日上市），不同时间点统计的数据会略有浮动：\n· 截至2026年10月14日，自上市以来的年化回报约45.84%。\n· 其他数据源显示，其年平均报酬率大约在36.77% 左右。\n它属于一只比较新的产品，所以“过去年化收益”看的是成立至今的整体表现，和那些成立了十年八年的老基金“过去十年年化”的含义不太一样哦。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126125818586021911","l":[],"ln":[],"t":["A股港股","汇率"],"lk":7,"rt":0,"rp":1,"vw":1792},{"id":"2126125153100960206","h":"cnfinancewatch","ts":1795742712,"zh":"#03441 介绍一只港股哑铃策略ETF\n整个组合里看它的定位（65% 港股本地高股息 + 35% 这个现金流 100）\n产品设计者的思路非常清晰，是一个互补哑铃：\n- 港股端（65%）：传统高股息价值，偏防御、吃稳定分红、和 A 股相关性低\n- 美股端（35%）：**高质量现金牛成长**，不是纯投机成长，用来抓美股科技龙头收益，同时自带质量防御，避免纳指那种巨大回撤\n>\n> 所以 03441 的整体定位不是激进港美成长组合，而是【离岸质量哑铃配置】：一端传统红利防御，一端高质量现金成长。\n## 综合评价（客观，分优点、硬伤、适合谁、不适合谁）\n✅ 优点\n1. **非常适合内地投资者低成本做港美分散**：港股通直接买，不用 QDII 额度、不用换汇、不用抢纳指 ETF 额度；折溢价长期比较平稳，不像很多纳指 ETF 经常大幅溢价被套天天基金\n2. 组合天然有对冲属性：港股高股息防御 + 美股龙头弹性，历史回测的最大回撤显著小于纯纳指，震荡市体验好\n3. 成分特殊：港股部分是香港本地标的，和 A 股、内地地产链相关性比普通 H 股红利低，分散效果和常见红利产品不一样\n⚠️ 缺点 & 风险（非常关键）\n1. **费率很贵：0.99% 管理费**，远高于内地宽基 ETF（0.15% 左右），长期会吃掉不少收益，是论坛吐槽最多的点\n2. 有**合成掉期对手方风险**：美股部分一部分靠投行掉期，不是直接持股；如果交易对手出问题会产生风险，和纯实物 ETF 不一样\n3. 港股高股息本身有行业集中：公用、银行、博彩，会暴露在香港本地利率、博彩监管风险；高股息≠永远抗跌，利率上行周期高股息板块会承压\n4. 指数规则固定，无法主观规避风格回撤：如果同时港股价值杀跌 + 美股科技大跌，这个组合一样会跌，只是幅度可能小一点\n5. 港股通交易限制：50 万门槛、不能融资、交易时间和港股时差、汇兑损耗、港股通税费\n👉 适合：\n港股通投资者，想要**一个打包好的港美分散底仓**，不想自己分别配港股红利 + 美股龙头，追求回撤控制、做长期资产配置的人。\n👉 不适合：\n短线频繁交易（费率高 + 港股通摩擦成本）、想要高现金分红、不想承担掉期对手风险、希望极低持有成本的投资者。","en":"#03441 介绍一只港股哑铃策略ETF\n整个组合里看它的定位（65% 港股本地高股息 + 35% 这个现金流 100）\n产品设计者的思路非常清晰，是一个互补哑铃：\n- 港股端（65%）：传统高股息价值，偏防御、吃稳定分红、和 A 股相关性低\n- 美股端（35%）：**高质量现金牛成长**，不是纯投机成长，用来抓美股科技龙头收益，同时自带质量防御，避免纳指那种巨大回撤\n>\n> 所以 03441 的整体定位不是激进港美成长组合，而是【离岸质量哑铃配置】：一端传统红利防御，一端高质量现金成长。\n## 综合评价（客观，分优点、硬伤、适合谁、不适合谁）\n✅ 优点\n1. **非常适合内地投资者低成本做港美分散**：港股通直接买，不用 QDII 额度、不用换汇、不用抢纳指 ETF 额度；折溢价长期比较平稳，不像很多纳指 ETF 经常大幅溢价被套天天基金\n2. 组合天然有对冲属性：港股高股息防御 + 美股龙头弹性，历史回测的最大回撤显著小于纯纳指，震荡市体验好\n3. 成分特殊：港股部分是香港本地标的，和 A 股、内地地产链相关性比普通 H 股红利低，分散效果和常见红利产品不一样\n⚠️ 缺点 & 风险（非常关键）\n1. **费率很贵：0.99% 管理费**，远高于内地宽基 ETF（0.15% 左右），长期会吃掉不少收益，是论坛吐槽最多的点\n2. 有**合成掉期对手方风险**：美股部分一部分靠投行掉期，不是直接持股；如果交易对手出问题会产生风险，和纯实物 ETF 不一样\n3. 港股高股息本身有行业集中：公用、银行、博彩，会暴露在香港本地利率、博彩监管风险；高股息≠永远抗跌，利率上行周期高股息板块会承压\n4. 指数规则固定，无法主观规避风格回撤：如果同时港股价值杀跌 + 美股科技大跌，这个组合一样会跌，只是幅度可能小一点\n5. 港股通交易限制：50 万门槛、不能融资、交易时间和港股时差、汇兑损耗、港股通税费\n👉 适合：\n港股通投资者，想要**一个打包好的港美分散底仓**，不想自己分别配港股红利 + 美股龙头，追求回撤控制、做长期资产配置的人。\n👉 不适合：\n短线频繁交易（费率高 + 港股通摩擦成本）、想要高现金分红、不想承担掉期对手风险、希望极低持有成本的投资者。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2126125153100960206","l":[],"ln":[],"t":["美股","A股港股","汇率"],"lk":1,"rt":1,"rp":1,"vw":2357},{"id":"2126123596510843233","h":"cnfinancewatch","ts":1795742341,"zh":"订阅区免费数据，介绍了一直年化超过了纳指的美股ETF。\n为什么它能跑赢纳指？定价可以看看！","en":"订阅区免费数据，介绍了一直年化超过了纳指的美股ETF。\n为什么它能跑赢纳指？定价可以看看！","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYGCJBQa4AA79am.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/ 在90%以上，只能防守。红利低波5日只涨0.20%，接近仅20日。消费是仅20日共振：美股\n$XLP 与A股消费、酒都在20日榜上，但后者5日分别跌2.26%、跌2.27%，周四消费ETF还跌1.42%，没有加速。交运ETF\n$561320 20日涨0.53%、5日跌2.16%，对上 $JETS，仅20日且已转弱。A股半导体ETF\n20日跌8.06%、5日跌10.65%，与美股半导体同向走弱，不能写成上车信号。\n#期货\n富时A50期指连续夜盘收12511点，跌0.02%，较周四早盘高点回落。美股股指期货按假期安排在美东8:00前后收市，标普迷你收7249.00点，涨0.74%；纳指迷你收26296.75点，涨0.75%。恒生指数周四收22226.88点，涨1.19%；恒生科技指数收3417.38点，涨1.16%。国内股指期货无夜盘，沪深300期货连续周四收3849.8点，高于前结算3824点。商品方面，沪金连续夜盘约766.00元/克，最高770.76元，属于修复，不当新趋势；SC原油连续约594.8元/桶，与前值594元基本持平；沪铜约89270元，略高于前值88770元。\n#三个方向\n第一，银行与红利低波防守。双窗口还在，但 #农业银行、 #建设银行\n和红利低波的20日分位已到94%以上，只做回撤承接，不追早盘高开。普通红利ETF 20日已转负，要和红利低波分开看。\n第二，必选消费与家电。中美消费仍是20日共振，A股5日转弱、周四消费ETF还在跌，更适合当稳定仓，不追高。\n第三，光模块和能源只跟踪不升级。 #中际旭创、 #新易盛 周四放量反抽，但美股半导体趋势向下，且周五才有早收定价； #中国海油\n20日分位约22%，位置好于已收20日新高的 #中国神华，也不追高开。设备和代工今天不做主方向。\n#六只个股\n #工商银行 $601398 收9.23元，涨0.33%，20日涨5.13%，分位约80%，大行里位置相对低一些。触发看缩量守住9.15元附近，失效看放量跌破8.17元。\n #招商银行 $600036 收43.38元，涨0.42%，20日涨1.02%，分位约68%，股份行里更居中。失效看跌破41.73元。\n #中国平安 $601318 收54.58元，跌0.55%，20日涨2.59%，分位约72%。失效看重新跌破53.70元。\n #美的集团 $000333 收94.51元，涨0.39%，20日涨8.04%，分位约85%，靠近20日高95.99元，回踩再看，不追。\n #贵州茅台 $600519 收1469.00元，跌0.40%，20日涨8.49%，分位约85%，用来跟踪消费方向，失效看跌破1353元附近。\n #中国海油 $600938 收30.87元，涨3.35%，20日跌12.85%，分位约22%。触发看站稳29.87元附近，失效看跌破29.43元；周四已反弹，不追高开。\n#小盘阿尔法\n本档不选。热榜小盘多是连板或高位题材，20日分位偏高，最新财报没有形成互证，不凑数。\n#操作提示\n开盘先看银行、红利是否高开过多，以及光模块能否守住周四收盘。银行若冲20日高点不要追；光模块和设备若再放量跌破周四低点，不要急着抄。创业板周四最低2155.01点、上证最低3455.04点，若再失则降低仓位。美国周五早收，白天不要把假期期指的高水当成趋势反转。回购贷款和两融调整是中期因素，不当成今天的追涨理由。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"======== 下篇 ========\nA股盘前第一版·下 2026年11月27日 周五\n上篇的结论是：周四指数平收是跌破前低后的拉回，不是转势；隔夜美股现货仍停在周三，假期期指虽有高水，但A50夜盘几乎走平，今天银行和红利只做回撤，光模块的反抽不升级主线。\n#中美映射\n美股行业ETF仍用11月25日收盘，周四感恩节休市、没有新的现货定价。20日涨幅靠前的是住宅建设 $ITB 涨10.51%、天然气 $UNG\n涨8.42%、水务 $FIW 涨7.67%、必选消费 $XLP 涨6.29%、制药 $IHE 涨4.54%、航空 $JETS\n涨4.30%。其中 $ITB 是双窗口同现（5日涨6.13%）；$FIW、$XLP、$IHE\n的5日只涨约1个多百分点，趋势未明显加速；$UNG、$JETS 的5日分别跌2.92%、跌1.92%，仅20日。生物科技 $XBI\n20日跌0.58%、5日涨7.97%，是超短脉冲。半导体 $SOXX 20日跌26.44%、5日跌9.78%，科技 $XLK\n20日跌18.43%、5日跌4.90%，都是趋势向下。金融 $XLF 20日只涨0.68%、5日涨 "],"lk":0,"rt":0,"rp":0,"vw":337},{"id":"2126101159966638389","h":"cnfinancewatch","ts":1795736992,"zh":"A股盘前第一版·上 2026年11月27日 周五\n#结论 周四A股几乎平收，但盘中并不轻松。上证收3476.88点，仅涨0.01%，最低3455.04点，跌破周三低点3468.65；深证成指收10084.04点，跌0.02%；创业板指收2189.82点，涨0.29%，最低见到2155.01点，跌破周三低点2183.58后拉回；科创50跌1.36%收1169.99点，上证50涨0.07%，红利指数涨1.38%。沪深成交约1.32万亿元，较周三约1.38万亿元再缩一点。涨停65只。隔夜美股现货仍是周三收盘：道指涨0.33%收50182.95点，标普跌0.25%收7182.78点，纳指跌0.62%收23585.80点，费城半导体跌0.65%，\n#英伟达 $NVDA 跌3.91%收149.30美元。美国周四感恩节休市，周五早收，假期时段股指期货收在高水，但富时A50期指夜盘收12511点、跌0.02%，对今天开盘给不出更强的外部确认。今天的判断是：银行、红利低波位置更高，只做回撤承接，不追周四红盘；必选消费仍是20日共振、5日已转弱；光模块的反抽可以看、不能升级成主线。\n#消息面\n外部仍被假期节奏卡住。美国完整交易日还停在11月25日，10月PCE同比3.8%、核心PCE同比3.3%略超预期，三季度GDP二次估值上修到年化4.3%，12月加息25个基点仍接近完全定价。假期时段标普迷你期货收7249.00点，较周三结算7195.75点涨0.74%；纳指迷你收26296.75点，涨0.75%。公开报道称\n#英伟达 已要求服务器合作伙伴暂停向部分东南亚国家交付人工智能服务器，高盛仍认为现在买入美股为时尚早。韩国有报道称正在评估扩大股市稳定基金。日本JERA计划在电厂附近为Anthropic和Meta建设数据中心，这是中期叙事。\n国内看流动性和机构行为。进出口银行称前10个月科技贷款投放超7000亿元；市场震荡下公募出现新一轮权益基金自购。这些是情绪和中期流动性线索，盖不过眼前的风险偏好。回购增持贷款和11月30日融资保证金比例由100%调至80%，仍按中期口径看，不是当天的买点。在岸人民币兑美元北京时间03:00收6.6609元，较周三夜盘涨72点。\n#研报面\n周四新出的买入仍集中在半导体材料和设备，和短线位置不完全同向。东吴给 #移远通信 $603236、 #广合科技 $001389 买入，华安给\n#三环集团 $300408、 #鹏鼎控股 $002938、 #长电科技 $600584、 #鼎龙股份 $300054 买入，太平洋给\n#长鑫科技 $688825、 #澜起科技 $688008 买入，国金给 #中国核电 $601985 买入。防御一侧，山西给 #中炬高新\n$600872 买入，国金11月24日给 #京沪高铁 $601816 买入，华安11月25日给 #华润三九 $000999\n买入。这些是中期观点，不用来追PCB和光模块的日内反抽，也不用来对抗设备和代工的抛压。\n#热榜\n同花顺热榜仍是题材和连板。前列是 #九阳股份 $002242、 #北纬科技 $002148、 #金牛化工 $600722、 #华胜天成\n$600410、 #常山北明 $000158、 #中京电子 $002579，后面有 #冰山冷热 $000530、 #襄阳轴承\n$000678、 #华东重机 $002685、 #青山纸业 $600103。 #九阳股份\n周四涨8.66%收41.90元，20日涨82.17%、分位约98%； #中京电子 20日涨61.73%、分位约96%； #华东重机\n周四跌停。东财人气榜本档数据缺失。热榜是情绪溢价，不把它当成今天的主方向。\n#资金面\n周四沪市成交约6133亿元，深市约7040亿元，两市合计约1.32万亿元，比周三再缩约600亿元。成交仍集中在光模块： #中际旭创\n约197.1亿元、涨5.18%， #新易盛 约163.2亿元、涨4.26%， #天孚通信\n约91.4亿元、涨2.38%。银行和部分能源相对稳住， #建设银行 涨1.11%， #农业银行 涨0.75%， #中国海油 涨3.35%，\n#紫金矿业 涨3.40%， #中国神华 收53.00元，创20日新高。 #北方华创 跌3.14%， #中芯国际\n跌4.51%，设备和代工没有一起转强。板块主力资金和北向完整净流入本档数据缺失，不编造。","en":"A股盘前第一版·上 2026年11月27日 周五\n#结论 周四A股几乎平收，但盘
