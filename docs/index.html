<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

001127","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":2,"vw":1105},{"id":"2123778472174608545","h":"ReutersChina","ts":1795183220,"zh":"加拿大在北京找到了机会。日本转向亚洲其他地区的合作伙伴。","en":"Canada found an opening in Beijing. Japan turned to partners elsewhere in Asia.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123778472174608545","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/trump-courts-xi-putin-middle-powers-make-their-own-moves-2026-11-20/?taid=6b00527324c5c900014b9f44&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":570},{"id":"2123775267369803858","h":"cnfinancewatch","ts":1795182456,"zh":"必须承认人格性格是有类型的：\n一种是精通人际关系学的政治家人格，他擅长和首先考虑的问题是人的利益诉求差异和协调沟通\n一种是商人性格，精通市场盈利模式观察和营销，哪里能挣到钱和怎么挣钱他有兴趣和直觉，利益主导思维\n一种是深究义理，弄懂来龙去脉的学究型人格，研究能力强能看透，但实战因为看太透人生和历史，反而内耗和悲切，知识大于行动能力\n一种是情感情绪主导人格：啥啥都以当下情绪为主导，瞎胡闹吧！把人生弄成一团糟。没目标也没方略更没意志力，跟谁合作谁倒霉","en":"必须承认人格性格是有类型的：\n一种是精通人际关系学的政治家人格，他擅长和首先考虑的问题是人的利益诉求差异和协调沟通\n一种是商人性格，精通市场盈利模式观察和营销，哪里能挣到钱和怎么挣钱他有兴趣和直觉，利益主导思维\n一种是深究义理，弄懂来龙去脉的学究型人格，研究能力强能看透，但实战因为看太透人生和历史，反而内耗和悲切，知识大于行动能力\n一种是情感情绪主导人格：啥啥都以当下情绪为主导，瞎胡闹吧！把人生弄成一团糟。没目标也没方略更没意志力，跟谁合作谁倒霉","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123775267369803858","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":839},{"id":"2123773507138142664","h":"qinbafrank","ts":1795182036,"zh":"德州新州长：不讨厌数据中心但讨厌利用德州人的方式，期待与马斯克合作。今天FOX新闻对对德克萨斯州新当选州长Gina Hinojos的访访谈值得看看，主要讨论数据中心禁令、移民/边境政策以及与Elon Musk合作等议题。讲话要点：\n1、市场最关心的数据中心禁令问题\n这是她竞选期间的核心议题之一。她明确表示：\n1）将对州政府有控制权的任何新数据中心许可实施禁令（moratorium）。\n2）她认为自己没有权力停止已经获批或正在建设的项目，但可以阻止新的许可通过。\n原话大意：“我不讨厌数据中心。我只是讨厌它们现在利用德州人的方式。我们没有法律来保护德州人。”\n“我们需要对新数据中心许可实施禁令，直到我们能通过法律保护德州人，最重要的是让德州人能坐在谈判桌上，决定数据中心是否以及如何进入他们的社区。”\n她的目标是在立法机构通过水、电、社区参与、补贴等方面的保护措施之前，先暂停新项目。\n2、市场第二关注应该就是她与马斯克的关系\n主持人Baier提到Musk在《纽约时报》DealBook峰会上的言论（称她“相当温和”，不是极左，德州在她治下“会没事”）。Hinojosa回应：“我还没有和Elon Musk谈过。我期待在某个时候和他谈谈。”\n“他在德州有很多业务，我期待与他合作，前提是这种合作能确保德州人过得更好、更繁荣。”\n她自称是“经济民粹主义者”，认为企业利益已经腐蚀了两党，经济必须优先服务于普通德州人。\n3、边境政策与特朗普成果\nHinojosa明确区分“边境安全”与“内陆ICE行动”。她称赞特朗普在边境的成果：“在拜登总统时期，情况是混乱的。这也是为什么人们生气、投票反对民主党的原因。”\n“毫无疑问，正是因为特朗普总统，非法越境人数大幅下降。我为此称赞他。”\n她表示计划与特朗普政府、边境地区警长以及墨西哥官员直接合作，强调“公共安全永远不应该成为党派问题”。她支持联邦政府在边境投入更多资源来维持安全。\n整体看下来，Hinojosa在访谈中试图展现务实、跨党派合作的形象（称赞特朗普边境成果、愿与他合作、区分边境与内陆执法）\n同时坚持她竞选时的核心承诺：数据中心需受监管、不无条件配合ICE内陆行动、优先保护德州纳税人与社区。\n看起来她上任后新数据中心的建设确实要放缓了，这里的核心就是新数据中心建设要暂停多久？之后再重启审批等门槛怎么设定？节奏会如何？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"德州新州长：不讨厌数据中心但讨厌利用德州人的方式，期待与马斯克合作。今天FOX新闻对对德克萨斯州新当选州长Gina Hinojos的访访谈值得看看，主要讨论数据中心禁令、移民/边境政策以及与Elon Musk合作等议题。讲话要点：\n1、市场最关心的数据中心禁令问题\n这是她竞选期间的核心议题之一。她明确表示：\n1）将对州政府有控制权的任何新数据中心许可实施禁令（moratorium）。\n2）她认为自己没有权力停止已经获批或正在建设的项目，但可以阻止新的许可通过。\n原话大意：“我不讨厌数据中心。我只是讨厌它们现在利用德州人的方式。我们没有法律来保护德州人。”\n“我们需要对新数据中心许可实施禁令，直到我们能通过法律保护德州人，最重要的是让德州人能坐在谈判桌上，决定数据中心是否以及如何进入他们的社区。”\n她的目标是在立法机构通过水、电、社区参与、补贴等方面的保护措施之前，先暂停新项目。\n2、市场第二关注应该就是她与马斯克的关系\n主持人Baier提到Musk在《纽约时报》DealBook峰会上的言论（称她“相当温和”，不是极左，德州在她治下“会没事”）。Hinojosa回应：“我还没有和Elon Musk谈过。我期待在某个时候和他谈谈。”\n“他在德州有很多业务，我期待与他合作，前提是这种合作能确保德州人过得更好、更繁荣。”\n她自称是“经济民粹主义者”，认为企业利益已经腐蚀了两党，经济必须优先服务于普通德州人。\n3、边境政策与特朗普成果\nHinojosa明确区分“边境安全”与“内陆ICE行动”。她称赞特朗普在边境的成果：“在拜登总统时期，情况是混乱的。这也是为什么人们生气、投票反对民主党的原因。”\n“毫无疑问，正是因为特朗普总统，非法越境人数大幅下降。我为此称赞他。”\n她表示计划与特朗普政府、边境地区警长以及墨西哥官员直接合作，强调“公共安全永远不应该成为党派问题”。她支持联邦政府在边境投入更多资源来维持安全。\n整体看下来，Hinojosa在访谈中试图展现务实、跨党派合作的形象（称赞特朗普边境成果、愿与他合作、区分边境与内陆执法）\n同时坚持她竞选时的核心承诺：数据中心需受监管、不无条件配合ICE内陆行动、优先保护德州纳税人与社区。\n看起来她上任后新数据中心的建设确实要放缓了，这里的核心就是新数据中心建设要暂停多久？之后再重启审批等门槛怎么设定？节奏会如何？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXkoS2LaAAAEKCt.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123773507138142664","l":[],"ln":[],"t":["美股"],"lk":7,"rt":0,"rp":1,"vw":5114},{"id":"2123773346290844038","h":"xiaomustock","ts":1795181998,"zh":"ant不到24小时破发，正儿八经全球的金融危机。\n这波ant也就龙王赚了把大的，他这个认知是真高。","en":"ant不到24小时破发，正儿八经全球的金融危机。\n这波ant也就龙王赚了把大的，他这个认知是真高。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXkomXTbIAEkKQ6.jpg?name=orig"],"u":"https://x.com/xiaom 初期，美军在欧洲、太平洋节节败退，股市却在1942年4月见底，远早于盟军战局反转。还有80年代初，通胀肆虐、经济深陷泥潭的时候，恰恰是买入股票的时机\n一句话：坏消息是投资者最好的朋友。 它让你可以用打折的价格，买下美国未来的一部分\n长期来看，股市的结局一定是向好的。20世纪，美国经历两次世界大战、多场代价惨重的军事冲突、大萧条、十几次衰退与金融恐慌、石油危机、流感疫情、总统丑闻下台。但道琼斯指数，从66点涨到11497点\n你可能以为，在这样一个涨幅巨大的百年里，投资者很难亏钱。但确实很多人亏了。那些倒霉的投资者，总是在行情舒服、内心安稳的时候买入，等到新闻吓人、心里发慌的时候卖出\n现在手握现金类资产的人觉得安心。他们不该安心。他们选了一个长期很差的资产：几乎没有收益，而且价值一定会缩水。事实上，政府为缓解危机出台的政策，大概率会带来通胀，进一步侵蚀现金账户的真实购买力\n未来十年，股票几乎肯定跑赢现金，而且差距往往很大。现在执着持有现金的投资者，是在赌自己之后能精准择时再进场。他们等着利好消息带来安全感，却忽略了韦恩·格雷茨基那句建议：“我滑向冰球将要到达的位置，而不是它现在所在的地方。”\n我不喜欢对股市发表看法，再次强调，我不知道短期市场会怎么走。但我效仿一家开在空置银行大楼里的餐厅广告：“说到做到，钱跟着话走。”今天，我的资金和我的观点，都指向股票。","en":"大跌其实更需要巴菲特\n给大家分享一篇老巴2008年次贷危机后发在纽约时报的文章：\nBuy American. I Am.（我正在买入美国 2008.10.16 美股暴跌）\n无论美国本土还是海外，金融市场现在一团糟。金融体系的问题正在向实体经济蔓延，渗漏已经变成汹涌的洪流。短期来看，失业率将会上升，商业活动陷入停滞，新闻头条也会持续充斥吓人的消息\n所以……我正在买入美国股票。我说的是我的个人账户，在此之前，这个账户只持有美国国债。（这里不包含我伯克希尔·哈撒韦的持仓，那部分已经确定全部捐赠给慈善事业。）如果股价继续保持吸引力，我伯克希尔以外的净资产很快会100%配置在美国股票上\n为什么？\n我的买入遵循一条简单准则：别人贪婪时我恐惧，别人恐惧时我贪婪\n当下恐惧情绪四处蔓延，就连经验老道的投资者也被裹挟。当然，投资者警惕高杠杆企业、竞争力薄弱的公司，这是合理的。但对国内大量优质企业的长期前景感到恐慌，毫无道理。这些企业盈利短期会出现波动，历来如此。但5年、10年、20年之后，绝大多数头部企业依然会创出利润新高\n有一点我讲清楚：我无法预测股市短期涨跌。一个月、一年之后股市是涨是跌，我完全不知道。但有一件事大概率会发生：在市场情绪、实体经济回暖之前很久，股市就会率先上涨，甚至大幅上涨。如果你等知更鸟飞来才动手，春天已经结束了\n来看一段历史：大萧条期间，道琼斯指数1932年7月8日跌到最低点41点。但经济状况持续恶化，直到1933年3月罗斯福上台。而到那个时候，股市已经上涨30%\n再想想二战初期，美军在欧洲、太平洋节节败退，股市却在1942年4月见底，远早于盟军战局反转。还有80年代初，通胀肆虐、经济深陷泥潭的时候，恰恰是买入股票的时机\n一句话：坏消息是投资者最好的朋友。 它让你可以用打折的价格，买下美国未来的一部分\n长期来看，股市的结局一定是向好的。20世纪，美国经历两次世界大战、多场代价惨重的军事冲突、大萧条、十几次衰退与金融恐慌、石油危机、流感疫情、总统丑闻下台。但道琼斯指数，从66点涨到11497点\n你可能以为，在这样一个涨幅巨大的百年里，投资者很难亏钱。但确实很多人亏了。那些倒霉的投资者，总是在行情舒服、内心安稳的时候买入，等到新闻吓人、心里发慌的时候卖出\n现在手握现金类资产的人觉得安心。他们不该安心。他们选了一个长期很差的资产：几乎没有收益，而且价值一定会缩水。事实上，政府为缓解危机出台的政策，大概率会带来通胀，进一步侵蚀现金账户的真实购买力\n未来十年，股票几乎肯定跑赢现金，而且差距往往很大。现在执着持有现金的投资者，是在赌自己之后能精准择时再进场。他们等着利好消息带来安全感，却忽略了韦恩·格雷茨基那句建议：“我滑向冰球将要到达的位置，而不是它现在所在的地方。”\n我不喜欢对股市发表看法，再次强调，我不知道短期市场会怎么走。但我效仿一家开在空置银行大楼里的餐厅广告：“说到做到，钱跟着话走。”今天，我的资金和我的观点，都指向股票。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXkelmCbUAAvhKQ.jpg?name=orig"],"u":"https://x.com/artinmemes/status/212376485369758 vid/avc1/1370x1080/IImLnRMGahgAeGFk.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2123729813303431327","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":516},{"id":"2123729392279118146","h":"cnfinancewatch","ts":1795171518,"zh":"提供一种华尔街观察视角的解释：\n一旦供应可以被合成创造，稀缺性就消失了。\n当稀缺性消失时，价格不再在链上发现，而是开始在衍生品中被设定。\n这正是发生在比特币身上的事。\n这与已经发生在以下资产上的结构性断裂相同：\n→ 黄金\n→ 白银\n→ 石油\n→ 股票\n一旦衍生品接管。\n比特币的原始论点已经破灭。\n比特币的估值建立在两个想法上：\n→ 2100 万的硬上限\n→ 无再抵押\n当华尔街在链上叠加这些时，该框架就死了：\n→ 现金结算期货\n→ 永续掉期\n→ 期权\n→ ETF\n→ 主经纪商贷款\n→ 包装 BTC\n→ 总回报掉期\n从那时起，比特币供应在理论上变得无限。\n不是在链上。\n而是在价格发现中，这才是真正重要的。\n合成浮动比率 (SFR)。\n解释一切的指标。\n一旦合成供应压倒真实供应，价格就不再对需求做出反应。\n它对仓位、对冲和清算流做出反应。\n华尔街现在可以对冲比特币交易。\n他们不是在猜测方向。\n他们在每个衍生品主导的市场中做他们擅长的事：\n1⃣ 创建无限的纸面 BTC\n2⃣ 在反弹中做空\n3⃣ 强制清算\n4⃣ 在更低价位回补\n5⃣ 重复\n这不是“下注”。\n这是库存制造。\n现在一个真实的 BTC 可以同时支持：\n→ 一个 ETF 份额\n→ 一个期货合约\n→ 一个永续掉期\n→ 一个期权 delta\n→ 一个经纪商贷款\n→ 一个结构性票据\n全部在同一时间。\n那是对一枚币的六个索赔。\n那不是自由市场。\n那是一个戴着比特币面具的部分储备价格系统。\n如果你想忽略它，随你便，但别假装你没有被警告。\n在为时已晚之前关注并开启通知。","en":"提供一种华尔街观察视角的解释：\n一旦供应可以被合成创造，稀缺性就消失了。\n当稀缺性消失时，价格不再在链上发现，而是开始在衍生品中被设定。\n这正是发生在比特币身上的事。\n这与已经发生在以下资产上的结构性断裂相同：\n→ 黄金\n→ 白银\n→ 石油\n→ 股票\n一旦衍生品接管。\n比特币的原始论点已经破灭。\n比特币的估值建立在两个想法上：\n→ 2100 万的硬上限\n→ 无再抵押\n当华尔街在链上叠加这些时，该框架就死了：\n→ 现金结算期货\n→ 永续掉期\n→ 期权\n→ ETF\n→ 主经纪商贷款\n→ 包装 BTC\n→ 总回报掉期\n从那时起，比特币供应在理论上变得无限。\n不是在链上。\n而是在价格发现中，这才是真正重要的。\n合成浮动比率 (SFR)。\n解释一切的指标。\n一旦合成供应压倒真实供应，价格就不再对需求做出反应。\n它对仓位、对冲和清算流做出反应。\n华尔街现在可以对冲比特币交易。\n他们不是在猜测方向。\n他们在每个衍生品主导的市场中做他们擅长的事：\n1⃣ 创建无限的纸面 BTC\n2⃣ 在反弹中做空\n3⃣ 强制清算\n4⃣ 在更低价位回补\n5⃣ 重复\n这不是“下注”。\n这是库存制造。\n现在一个真实的 BTC 可以同时支持：\n→ 一个 ETF 份额\n→ 一个期货合约\n→ 一个永续掉期\n→ 一个期权 delta\n→ 一个经纪商贷款\n→ 一个结构性票据\n全部在同一时间。\n那是对一枚币的六个索赔。\n那不是自由市场。\n那是一个戴着比特币面具的部分储备价格系统。\n如果你想忽略它，随你便，但别假装你没有被警告。\n在为时已晚之前关注并开启通知。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123729392279118146","l":[],"ln":[],"t":["黄金"],"lk":0,"rt":0,"rp":0,"vw":791},{"id":"2123728715360424005","h":"cnfinancewatch","ts":1795171357,"zh":"过去数周，一切避险策略都在失效\n我们的订阅者持有短债大致是唯一的避险成功的\n黄金、油气、股票、长债都在跌\n所谓负相关资产根本不存在\n只是我们的大类轮动数据依然有效\n周日我们将有闭门研讨会 ,"u":"https://x.com/nytchinese/status/2123717996334186914","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/china/20261120/china-japan-propaganda-xi-takaichi/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":2,"rt":0,"rp":6,"vw":2809},{"id":"2123717991221403804","h":"bbcchinese","ts":1795168800,"zh":"10月底，香港教育局公布小学创科课程草拟文件，提出小学二年级学生应该初步掌握以“汉语拼音输入法”（Pinyin）输入中文。过去，教育局没有规定学校应该教哪一种输入法，而仓颉及其简化版速成一直是港人常用选择。\n从仓颉到汉语拼音输入，表面是打字方式的选择，背后却涉及文化改变及语言系统转换。在港府积极推广学校用普通话教授中文科(普教中）的背景下，有反对声音质疑，引入拼音输入法是“消灭正体字”，亦有人担心会影响学童认字能力，甚至改变用语思维。\n有学者向BBC中文指出，输入法本质是一项工具，未必直接左右学童的语言能力。而比起输入法本身，学童早已改变的语言环境更值得关注。\n阅读报导：","en":"10月底，香港教育局公布小学创科课程草拟文件，提出小学二年级学生应该初步掌握以“汉语拼音输入法”（Pinyin）输入中文。过去，教育局没有规定学校应该教哪一种输入法，而仓颉及其简化版速成一直是港人常用选择。\n从仓颉到汉语拼音输入，表面是打字方式的选择，背后却涉及文化改变及语言系统转换。在港府积极推广学校用普通话教授中文科(普教中）的背景下，有反对声音质疑，引入拼音输入法是“消灭正体字”，亦有人担心会影响学童认字能力，甚至改变用语思维。\n有学者向BBC中文指出，输入法本质是一项工具，未必直接左右学童的语言能力。而比起输入法本身，学童早已改变的语言环境更值得关注。\n阅读报导：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXjsS05bMAA5QeQ.jpg?name=orig","https://pbs.twimg.com/media/HXjsS05bUAAms6Y.jpg?name=orig","https://pbs.twimg.com/media/HXjsS1EacAACkBQ.jpg?name=orig","https://pbs.twimg.com/media/HXjsS05aQAArrS7.jpg?name=orig"],"u":"https://x.com/bbcchinese/status/2123717991221403804","l":["bbc.in"],"ln":[{"u":"https://bbc.in/3V0v8Fh","d":"bbc.in"}],"t":[],"lk":4,"rt":0,"rp":2,"vw":3228},{"id":"2123716830678425815","h":"TraderS18","ts":1795168523,"zh":"现在应该算是流动性危机了，黄金原油美股比特币全面下跌，除了政策性救市/宽松应该没有别的反转理由了。\n那么救市就是两条线，以美联储为主财政部为辅，美联储开启回购，财政部释放TGA余额。\n具体观测指标：2年期美债收益率及美元指数。\n如果这两家都不动，那就只能理解为党争之下两党僵持不下只能主被动的挤破泡沫了。\n但好消息是反弹不需要救市，只要卖盘枯竭叠加放出利好预期刺激情绪就可以做到，甚至反弹猛烈的话都足以给人一种小阳春的感觉。不过这种情况难以提前预判，超卖信号之后也许会连续超卖。\n能改变市场恐慌情绪的无非还是重量人物出来讲话、降低加息预期，加大短债回购、11.25PCE、12.4大非农、12.10加息落地及CPI数据。数据都还有点远，看看有没有人出来托市吧。","en":"现在应该算是流动性危机了，黄金原油美股比特币全面下跌，除了政策性救市/宽松应该没有别的反转理由了。\n那么救市就是两条线，以美联储为主财政部为辅，美联储开启回购，财政部释放TGA余额。\n具体观测指标：2年期美债收益率及美元指数。\n如果这两家都不动，那就只能理解为党争之下两党僵持不下只能主被动的挤破泡沫了。\n但好消息是反弹不需要救市，只要卖盘枯竭叠加放出利好预期刺激情绪就可以做到，甚至 大云厂商，\n7月份开始提超大CSP的重估，现在依然这么看。如果新的数据中心放缓、过去一年多砸钱力度不断提高的大云厂商未来一年数据中心陆续建好，业绩兑现。同时超大云厂也是广泛的B端企业采用AI的载体。\n2）应用端\n移动互联网的应用基于AI底层重构，就像X平台、现在X平台跟几年前完全不同。当时X平台几千名员工、现在X只有几十名员工，大量都是AI在背后支撑，现在X整个平台内容分发推荐运营都是AI在驱动、这样算不算已经是AI应用了。\n大家一直期望看到AI时代原生应用，但是大概率老树开新花，但是底层已经在大量消耗token。\n个人Agent自然是一个趋势、已经很明显了。\n然后就是AI医疗健康领域、也值得关注。\n完整内容看对谈视频","en":"3）AI商业化是不是继续处于加速状态。\n而AI商业化则是最底层的逻辑支撑：最近大科技还算比较抗跌支撑指数，是因为市场认为政策再收紧他们还是能扛的，如果数据中心放缓大云厂手里的算力稀缺，但根源还是因为云业务增速在加速中，他们能撑的住。真要大幅度降速，那么通胀好转、政策缓和，也都带不动。\n27年初还要面临美国财政预算谈判的时间表。2026 年的临时拨款覆盖至 12月11日，如无续拨12 日起可能出现资金缺口。现在看来两党都希望再通过一个短期拨款法案，让政府运营维持到明年初，把实质谈判留给新国会，这就与2027 年2月前后的债务上限到期也叠加在一起了。\n所以明年OpenAI能不能上市？一方面看市场情况、另一方面要看要证明 GPT 能持续跟上 Claude。OpenAI 在八、九月追回了一些差距，Claude 在部分场景仍占优，OpenAI 要把企业端和消费端的采用转成实际收入。\n当然，同一家公司在不同市场环境下发行，能拿到的估值可能相差很大。\n5、AI之后看哪些方向\n1）超大云厂商，\n7月份开始提超大CSP的重估，现在依然这么看。如果新的数据中心放缓、过去一年多砸钱力度不断提高的大云厂商未来一年数据中心陆续建好，业绩兑现。同时超大云厂也是广泛的B端企业采用AI的载体。\n2）应用端\n移动互联网的应用基于AI底层重构，就像X平台、现在X平台跟几年前完全不同。当时X平台几千名员工、现在X只有几十名员工，大量都是AI在背后支撑，现在X整个平台内容分发推荐运营都是AI在驱动、这样算不算已经是AI应用了。\n大家一直期望看到AI时代原生应用，但是大概率老树开新花，但是底层已经在大量消耗token。\n个人Agent自然是一个趋势、已经很明显了。\n然后就是AI医疗健康领域、也值得关注。\n完整内容看对谈视频","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2123706150440915359","l":["binance.com"],"ln":[{"u":"https://www.binance.com/zh-CN/square/audio/replay?id=48597016063297","d":"binance.com"}],"t":["通胀","AI科技"],"lk":3,"rt":0,"rp":2,"vw":1008},{"id":"2123706146120999020","h":"qinbafrank","ts":1795165976,"zh":"英伟达的财报以及老黄对英伟达的影响在哪里？中期选举后美国的政治生态怎样的变化？Anthropic上市后走势会如何？未来行情走势的变量是什么？多谢Beca周三晚上在币安广场的AMA聊的内容很多，正好也梳理下当时聊的要点？\n1、英伟达的财报质量和老黄离开的影响\n1）财报本身是超预期、无论是本季的业绩还是下季度和下一财年指引都很强劲。如果28财年，就是明年按照 75% 的增速的话，那它营收能到7400亿美金以上，就相当于 5,000 多亿的毛利，可能是 4,000 多亿的净利润。其实这个体量非常大了。但这次财报没有解决大家最关心的问题，就是老黄。\n2）老黄对英伟达的影响是巨大且不可或缺，体现在三个层面：\n（1）技术远见，比客户更早看到技术方向。 CUDA 商业回报还不清楚时，黄仁勋就持续投入软件和开发者生态，又推动 GPU 从图形计算进入高性能计算。今天的管理层可以执行已经排好的产品路线，下一次技术方向尚未形成共识时，谁有判断和魄力下注，仍待观察。\n（2）让供应商愿意跟着一起赌未来技术方向，英伟达负责设计，一代芯片要如期交付，台积电、鸿海、台达电及材料、封装、测试厂商都得提前投入。老黄的远见和让长期让合作伙伴分享到收益，也积累了兑现承诺的记录。供应商愿意跟着他承担押错路线的风险，才有条件把换代周期从数年压到约一年至一年半。\n（3）同时管技术、供应链、人事和资本的全局视野。数十位高管直接向黄仁勋汇报，几位核心负责人只长期深耕各自领域，很难顶得上。\n3）老黄不能回归的直接影响\n（1）英伟达的技术升级的速度可能会要慢下来。如果未来的人没有这样的魄力、远见，技术方向的选择会多变，产业链上的摩擦越来越大（公事公办）。摩擦最后就会带来时间上的延迟；\n（2）产业资本生态萎缩\n英伟达投资、承诺采购或为基础设施提供担保，会影响银行和债券投资者愿意借多少钱。克雷斯表示对新增投资、采购承诺和担保会更审慎。个人会担心若以后类似支持越来越少，一些新云厂商到 2027 年的首要问题会从扩张变成生存。也会带来融资更难，资金成本更高。\n2、中期选举美国政治生态的变化以及政策的影响\n1）这一次中期选举的惨败程度远超以往\n民主党参议院拿下56席、众议院超过250席（虽然不是绝对多数，但是离绝对多数也不远了），同时民主党还拿到29个州的州长位子。连德克萨斯州、堪萨斯州这些传统接近百年的铁红州都被丢掉，共和党的基本盘这一次被极大的动摇了。可见惨败程度；\n2）中期选举的惨败也极大地削弱了川普的威信和影响力，从“倒黄”事件就能看来，主导改善共和党内部白宫内阁里和国会里的对华强硬派，即使川普一再力保也没能留下老黄。让共和党里的鹰派或者建制派话语权更大了，而前两年川普一统共和党依靠自己的威信和影响力死死压住党内不同意见，现在已经压不住了。\n这也意味着之后美国对华AI政策上越来越严格，往技术封锁的路线上走了、有点八十年代里根时代当时中情局局长比尔.凯西主导的对苏联技术禁运的味道。本周川普访深时的良好气氛，可能是未来两年中美关系的相对高点。\n3）这次共和党中选惨败，伊朗战争、油价和生活成本动摇了部分选民，数据中心带来的电费、用水和噪音也进入社区政治，都说明民意沸腾。这种情况下、不仅民主党、就是共和党内部也会对过去激进的产业政策做出调整、来迎合选民的呼吁。\n4）当然川普也不会完全妥协，他把斯蒂芬.米勒提到白宫幕僚长的位置上，用意很深。米勒对联邦行政法非常熟悉，善于找到各种冷门法律条文来给川普的行为提供法律依据，善于找路洞、钻空子，川普让米勒当白宫幕僚长就是让他来战斗的。未来两年，白宫国会的博弈可能会非常激烈。\n3、Anthropic上市及之後的走勢\n1）IPO定价还可以、前期流动盘不大，但很快开始解锁。跟SpaceX的走势可能类似，先涨再跌。短期定价还 OK，加上申购的情绪可能有一波走势向上。但大概率最终还是要砸下来，最终就是看砸到一个什么样的位置。\n2）如果Anthropic市值之后真的能跌破 1 万亿美金，例如跌倒八九千亿美金，那就是有性价比的位置了。\n4、之后市场走势的三个变量\n虽然8月底9月初提过一个“秋意渐凉”的框架，高油价、高利率、中期选举前就有大震荡，10月初也聊到高Beta会会跌。但也低估了这次中期选举共和党惨败的程度，这个惨败让市场意识美国居民对通胀、对数据中心建设已经到了如此反感的地步，所以市场对此有激烈的定价。\n1）油价、通胀及利率走势；\n核心逻辑是，如果美伊能缓和、俄乌也能结束，油价下来通胀才会下来，市场才会预期利率更宽松，否则又要担心明年上半年联储会继续收紧。\n2）新的政治生态下AI政策会比预期的还要收紧还是会柔和些；\n现在科技杀的这么猛、就是预期新国会生态带来AI基建的大放缓，那就要看明年实际力度比预期的更猛还是更弱。如果民主党搞事力度比现在预期更猛，即使通胀下来了，科技也很难受。但如果比现在预期柔和一些，市场情绪则又起来。\n完整内容看对谈视频","en":"英伟达的财报以及老黄对英伟达的影响在哪里？中期选举后美国的政治生态怎样的变化？Anthropic上市后走势会如何？未来行情走势的变量是什么？多谢Beca周三晚上在币安广场的AMA聊的内容很多，正好也梳理下当时聊的要点？\n1、英伟达的财报质量和老黄离开的影响\n1）财报本身是超预期、无论是本季的业绩还是下季度和下一财年指引都很强劲。如果28财年，就是明年按照 75% 的增速的话，那它营收能到7400亿美金以上，就相当于 5,000 多亿的毛利，可能是 4,000 多亿的净利润。其实这个体量非常大了。但这次财报没有解决大家最关心的问题，就是老黄。\n2）老黄对英伟达的影响是巨大且不可或缺，体现在三个层面：\n（1）技术远见，比客户更早看到技术方向。 CUDA 商业回报还不清楚时，黄仁勋就持续投入软件和开发者生态，又推动 GPU 从图形计算进入高性能计算。今天的管理层可以执行已经排好的产品路线，下一次技术方向尚未形成共识时，谁有判断和魄力下注，仍待观察。\n（2）让供应商愿意跟着一起赌未来技术方向，英伟达负责设计，一代芯片要如期交付，台积电、鸿海、台达电及材料、封装、测试厂 之道：\n1、管高管先统一价值观，底线极其明确，只要撒谎直接开除。2、防风险靠内部数据完全透明，管基层就是让一线员工畅所欲言。3、对待资本极其清醒，钱可以融，但公司控制权必须死死攥在自己手里。4、做生意坚持微利经营，死磕降本，把利润让给供货商，绝不比对手卖得贵。5、当年顶着骂声自建物流，就是为了把效率变成别人抄不走的护城河。6、用人偏爱有冲劲的穷孩子，把管培生当黄埔军校来带，真心对待兄弟。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123679010060440007","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":392},{"id":"2123678003666505753","h":"cnfinancewatch","ts":1795159266,"zh":"美股三个方向\n一是 #大盘消费电子 ，只认 #苹果 这种低波动、仍相对抗跌的品种。它已经离开最干净的颈线窗口，期权转强只够维持观察，不突破不进。二是\n#可选消费箱底 ， $BBWI 的位置和放量长下影是成立的，但缺资金共振，又赶上风险偏好下降，只给降权仓。三是 #AI硬件与利率敏感板块\n只观察：积压订单和期权多头改变不了英伟达、美光的底部杀跌，地产抵押在加息路径被拉长后更不宜作为主方向。\n#六只个股\n #苹果 $AAPL ，回撤后的区间中上部，位置约67%，距20日高也是52周高360.83还有3.33%，已经略离开负2%到正3%的突破窗口，收盘仍略高于20日均线347.74。触发是放量站上360.83，失效是跌破344.43，只给半仓，不突破不进。\n $BBWI ，箱底企稳，位置18%，周四收18.91，涨1.34%，量比约2.39，最低17.80后收回，留下长下影。事件只是四季度指引，中性；期权未形成共振。触发是放量站上19.43，收盘跌破18.66或再失17.80附近则失效，降权半仓。\n $TRTX ，箱底下沿，位置21%，市值约4.9亿美元，是商业地产抵押贷款信托。周四收6.42，跌0.93%，近两日有锤子，但收盘仍弱，董事买入和期权都构不成共振，利率环境也不站在这边。触发是放量站上6.44，跌破20日低6.14失效，仅观察。\n $GEV ，靠近箱底但未企稳，位置约5%，周四收756.28，跌2.06%，是一根中阴，130吉瓦积压订单和三项期权共振都只是加分，先等企稳蜡烛，跌破747附近失效，仅观察。\n #辉瑞 $PFE ，靠近20日低点，位置约2.5%，Call持仓增仓10.2%、Put持仓减仓2.3%，有两项同向，但最近三根都是阴线，没有企稳，仅观察，跌破27.44失效。\n $ACM ，短线已伸展，20日涨32.02%，五日涨14.55%，位置84%，周四收80.31，跌2.51%，积压订单创纪录是事实，但距颈线仍有约9%，不追，仅观察。\n#小盘阿尔法\n本期只把 $TRTX 列入观察，不写入只做。它市值偏小，又有董事买入和箱底下沿的锤子，核验后位置成立，可是没有第二项资金共振，经营利润率也弱，叠加加息预期被拉长，只适合看、不适合当做小盘进攻。\n$WGS 、 $TWST 有单基金买入，但周四都是中阴，没有企稳，不选。 $SLS\n五日仍涨85%，周四再跌17.21%，属于短线伸展后的回吐，不选。 $OFRM 、 $NUAI 不是硬条件命中，而且 $NUAI\n已经走到区间95%附近，不选。\n#操作提示\n亚洲已经先跌了一轮，美股期指截稿仍未翻红，今晚若再高开，先防高开低走，不急着在缺口里动手。苹果只作为贴着前高回撤后的半仓观察单，期权比昨天强，但距离颈线比昨天远，不突破就不进，跌破失效位当天走。\n$BBWI 看的是箱底能否站稳，收在18.66下方就作废，不要因为一根长下影提前加仓。英伟达、美光的事件和期权都在，位置却在杀跌，AI硬件继续只观察。黄金、白银继续被甩，债券期货仍是空头回补，不是风险偏好已经转好。\n$PDD 、 $PANW 这类已经跳空或连续大阳的，要用完整日线确认能否站住，不拿跳空去填只做名单。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"美股三个方向\n一是 #大盘消费电子 ，只认 #苹果 这种低波动、仍相对抗跌的品种。它已经离开最干净的颈线窗口，期权转强只够维持观察，不突破不进。二是\n#可选消费箱底 ， $BBWI 的位置和放量长下影是成立的，但缺资金共振，又赶上风险偏好下降，只给降权仓。三是 #AI硬件与利率敏感板块\n只观察：积压订单和期权多头改变不了英伟达、美光的底部杀跌，地产抵押在 。把次级缓冲当成主升浪，会把赔率做反。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123652030229008446","l":[],"ln":[],"t":["A股港股","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":927},{"id":"2123652026114695626","h":"cnfinancewatch","ts":1795153073,"zh":"热点财经新闻综述｜2026-11-20·午间\n数据时点：A股、港股以11月20日午间收盘（北京时间11:30）为主；富时A50日盘引用汇通财经11:04的盘中报价，完整日盘收盘本档未取到；日经225与韩国KOSPI截稿时尚未见官方收盘，报价为雅虎约13:10的最新价；黄金、原油、美股期货与汇率补充截至约13:20的公开行情；隔夜美股仍为美东11月19日常规交易收盘。本期邮箱新增两封热点财经邮件（11月20日早间08:10版、午间13:10版，均位于垃圾邮件）。凡标“邮件转述”的内容未逐条核实；其余已对照新华社、新华财经、央行授权发布、澎湃新闻、东方财富、界面新闻、财新、路透、彭博及公司公告转载等公开报道。13:00后的午后报价不作为午收使用。\n今日判断\n今天要先把低开的性质说清楚：这不是一次普通的风格轮动，而是隔夜美股把Anthropic上市交易成“卖事实”之后，日韩科技股把同一套定价继续往下传，A股开盘就把昨天科创50的局部高潮还了回去。已核实：上证开盘3527.30点，跌1.41%，上午最低探至3500.88点，跌2.15%；午收3521.40点，跌1.57%。深证午收10365.76点，跌2.05%；创业板2245.61点，跌2.08%，盘中最低2222.77点，一度跌超3%；科创50午收1236.38点，跌2.71%，昨天它是唯一收红的主指数，今天变成跌得最深的一条。上证50午收2722.76点，跌1.83%；沪深300午收3916.96点，跌1.70%；北证50相对抗跌，午收792.34点，跌0.79%。广度很差：东方财富Choice记全市场上涨690家、下跌4808家，31只涨停；界面新闻记6只跌停；澎湃引Wind为689家上涨、4807家下跌。可是半日成交并不冷，新华财经和东方财富都记沪深两市半日成交8558亿元，较上日同期放量约699亿元，已经相当于昨天全天约1.31万亿元的六成以上。今天又是11月第三个周五，是IF、IH、IC、IM\n2611合约的最后交易日暨交割日。金十11:31的早盘收盘快讯里，IF主力跌1.57%，IH跌1.63%，IC跌2.97%，IM跌2.70%。\n所以午间的结论很明确：3500.88是上午真实见到的低点，但不是已经确认的底部；放量也先只说明抛压被交易了，不说明增量已经转向做多。结构上，真正逆势的是PCB和部分农业，不是昨天的晶圆代工高潮，更不是高位算力主题的整体翻红。通富微电午收39.70元，跌9.94%，一度贴近跌停；长电科技跌6.42%；黄金ETF跌约5.3%。另一边，中京电子、超声电子涨停，真视通4连板，这是弱市里的局部抱团，容错率很低。港股同步走弱，恒生指数午收22451.91点，跌1.71%，盘中低见22333点；恒生科技跌3.14%，报3534.6点，一度失守3500点。网易跌17.92%，快手跌9.98%，腾讯跌1.38%；阿里巴巴因业绩午收涨4.28%，是少数例外，不能把它理解成港股科技已经修复。外盘在07:30之后还在恶化：日经225约13:10最新56483.07点，约跌5.0%，最低已低于今早的56703点；KOSPI最新约4862点，约跌5.37%，确认跌破5000点。美股期货截稿仍贴水，标普约跌0.57%，纳指约跌1.12%。对客户的含义是：先按防守框架处理，不要在交割日下午把PCB小票或4连板当成指数反转的信号。\n三大利多方向（由强到弱）\n一、银行、红利与宽基ETF的配置盘，仍是今天容错相对更高的底仓，但只适合持盈和回踩，不适合把盘中新高理解成风格反转。已核实：中国人民银行授权公布，11月1年期LPR为3.0%，5年期以上为3.5%，均未调整；新华社和央视都确认，这是连续第18个月保持不变。利率没有额外宽松，对银行息差至少是稳定，不是新的刺激。澎湃新闻午评和中国基金报早盘稿都写到，工商银行、建设银行、中信银行等盘中创出新高；工商银行上午最高9.20元，但午收9.09元，较昨收9.10元微跌0.11%。高点是盘中事实，收盘并没有把新高坐实。资金面上，澎湃据Wind统计，11月19日全市场1623只可统计股票型ETF（含跨境ETF）合计净流入488.67亿元，11月16日至19日四个交易日累计996.55亿元，前列仍是科创50ETF易方达和多只沪深300ETF。东方财富Choice把同日股票型净流入记为463.67亿元，单只前列数字一致、合计不同，应是样本口径差异，两套数字并列即可，不能把488亿写成已经统一的结论，更不能把它理解成货币基金或者成交额。制约也很清楚：今天是交割日，富时A50夜盘已收跌1.12%报12553点，日盘11:04见到12399点、跌2.33%。配置盘能解释为什么指数没有在3500下方加速崩，解释不了4800只下跌的账户感受。\n二、PCB和元件是今天盘面上唯一同时看到产业线索和涨停梯队的方向，但位置在弱市里被迅速抬高，只适合观察前排，不适合后排追涨。已核实：新华财经、澎湃和中国基金报都记满坤科技、中京电子、澳弘电子、超声电子等涨停。中京电子午收13.39元，涨10.02%，2连板；超声电子午收18.51元，涨9.98%，封住涨停。邮件转述把全球电路板短缺写成中期逻辑，公开报道的方向可以对上，但“持续至2028年年中”或“至少到2027年上半年”的期限并不完全一致，这里只把它当成产业背景，不把年限写成已裁定事实。它为什么重要：在指数低开、算力芯片和CPO都在调整的上午，资金没有回到中际旭创，也没有回到通富微电，而是把最快的涨停给了“带电子”的小板。对","en":"热点财经新闻综述｜2026-11-20·午间\n数据时点：A股、港股以11月20日午间收盘（北京时间11:30）为主；富时A50日盘引用汇通财经11:04的盘中报价，完整日盘收盘本档未取到；日经225与韩国KOSPI截稿时尚未见官方收盘，报价为雅虎约13:10的最新价；黄金、原油、美股期货与汇率补充截至约13:20的公开行情；隔夜美股仍为美东11月19日常规交易收盘。本期邮箱新增两封热点财经邮件（11月20日早间08:10版、午间13:10版，均位于垃圾邮件）。凡标“邮件转述”的内容未逐条核实；其余已对照新华社、新华财经、央行授权发布、澎湃新闻、东方财富、界面新闻、财新、路透、彭博及公司公告转载等公开报道。13:00后的午后报价不作为午收使用。\n今日判断\n今天要先把低开的性质说清楚：这不是一次普通的风格轮动，而是隔夜美股把Anthropic上市交易成“卖事实”之后，日韩科技股把同一套定价继续往下传，A股开盘就把昨天科创50的局部高潮还了回去。已核实：上证开盘3527.30点，跌1.41%，上午最低探至3500.88点，跌2.15%；午收3521.40点，跌1.57%。深证午收10365.76点，跌2.05%；创业板2245.61点，跌2.08%，盘中最低2222.77点，一度跌超3%；科创50午收1236.38点，跌2.71%，昨天它是唯一收红的主指数，今天变成跌得最深的一条。上证50午收2722.76点，跌1.83%；沪深300午收3916.96点，跌1.70%；北证50相对抗跌，午收792.34点，跌0.79%。广度很差：东方财富Choice记全市场上涨690家、下跌4808家，31只涨停；界面新闻记6只跌停；澎湃引Wind为689家上涨、4807家下跌。可是半日成交并不冷，新华财经和东方财富都记沪深两市半日成交8558亿元，较上日同期放量约699亿元，已经相当于昨天全天约1.31万亿元的六成以上。今天又是11月第三个周五，是IF、IH、IC、IM\n2611合约的最后交易日暨交割日。金十11:31的早盘收盘快讯里，IF主力跌1.57%，IH跌1.63%，IC跌2.97%，IM跌2.70%。\n所以午间的结论很明确：3500.88是上午真实见到的低点，但不是已经确认的底部；放量也先只说明抛压被交易了，不说明增量已经转向做多。结构上，真正逆势的是PCB和部分农业，不是昨天的晶圆代工高潮，更不是高位算力主题的整体翻红。通富微电午收39.70元，跌9.94%，一度贴近跌停；长电科技跌6.42%；黄金ETF跌约5.3%。另一边，中京电子、超声电子涨停，真视通4连板，这是弱市里的局部抱团，容错率很低。港股同步走弱，恒生指数午收22451.91点，跌1.71%，盘中低见22333点；恒生科技跌3.14%，报3534.6点，一度失守3500点。网易跌17.92%，快手跌9.98%，腾讯跌1.38%；阿里巴巴因业绩午收涨4.28%，是少数例外，不能把它理解成港股科技已经修复。外盘在07:30之后还在恶化：日经225约13:10最新56483.07点，约跌5.0%，最低已低于今早的56703点；KOSPI最新约4862点，约跌5.37%，确认跌破5000点。美股期货截稿仍贴水，标普约跌0.57%，纳指约跌1.12%。对客户的含义是：先按防守框架处理，不要在交割日下午把PCB小票或4 ueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":307},{"id":"2123618772368114034","h":"qinbafrank","ts":1795145144,"zh":"再看昨晚ANT上市开盘几个感受：\n1、没有破发开盘冲高研究回落，交易量巨大。昨天盘前IPO定价83，链上合约已经到102以上，这次链上合约又一次给开盘定价成功；\n2、但大盘没撑住，纳指高开低走盘中振幅巨大。个人看来，还是昨天下午提的这个问题“作为纯正的AI空投龙头，ANT上线交易后会把哪些板块资金注意力给吸走，毕竟龙头来了还不如去交易这个龙头”。一部分炒硬件、大云、软件saas的资金分仓位去炒ANT这个更直接。这跟SpaceX上市开盘后对整个太空经济板块吸血逻辑是一样。\n3、往后看spcx6月份上市先涨了四个交易日再开始大幅回落、这次ANT上市场环境并没有那么好，能涨几个交易日呢？这次解锁更快，27天之后就会迎来第一批解锁。","en":"再看昨晚ANT上市开盘几个感受：\n1、没有破发开盘冲高研究回落，交易量巨大。昨天盘前IPO定价83，链上合约已经到102以上，这次链上合约又一次给开盘定价成功；\n2、但大盘没撑住，纳指高开低走盘中振幅巨大。个人看来，还是昨天下午提的这个问题“作为纯正的AI空投龙头，ANT上线交易后会把哪些板块资金注意力给吸走，毕竟龙头来了还不如去交易这个龙头”。一部分炒硬件、大云、软件saas的资金分仓位去炒ANT这个更直接。这跟SpaceX上市开盘后对整个太空经济板块吸血逻辑是一样。\n3、往后看spcx6月份上市先涨了四个交易日再开始大幅回落、这次ANT上市场环境并没有那么好，能涨几个交易日呢？这次解锁更快，27天之后就会迎来第一批解锁。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXibgyEbcAElK6C.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123618772368114034","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":2,"vw":3125},{"id":"2123618418058539037","h":"dmjk001","ts":1795145060,"zh":"传黄仁勋可能创立新半导体公司\n11月20日｜自11月12日英伟达宣布黄仁勋辞去CEO、总裁及董事职务以来，关于他下一步去向的猜测就从未停止。近日，一个更具冲击力的预测正在科技圈快速传播：黄仁勋可能不会重返英伟达，而是选择另起炉灶，创办一家全新的半导体公司。这一预测的核心来源是Semafor商业记者Rohan Goswami。他在11月18日播出的《Prof G Markets》节目中给出了一个相当笃定的判断：黄仁勋重返英伟达的概率“为零”。Goswami的理由是，英伟达董事会做出让黄仁勋离开的决定门槛极高——许多董事与他共事已长达30年，不可能仅凭外界声援或请愿就推翻决议。此外，英伟达是上市公司，大量员工的财富与公司股票深度绑定，很难复制OpenAI员工集体施压董事会、迫使奥特曼火速复职的剧本。在Goswami看来，黄仁勋“本质上是创建者”，他最合理的下一步是与长期支持他的朋友一起，筹集并投入高达500亿美元，创办一家新的企业。尽管Goswami的预测仅为记者判断，尚未得到黄仁勋本人或任何官方渠道的确认，但它之所以能迅速发酵，是因为它触及了一个更具想象空间的问题：如果黄仁勋真的创办一家新的芯片公司，他能否在AI芯片领域再造一个足以与英伟达竞争的玩家？","en":"传黄仁勋可能创立新半导体公司\n11月20日｜自11月12日英伟达宣布黄仁勋辞去CEO、总裁及董事职务以来，关于他下一步去向的猜测就从未停止。近日，一个更具冲击力的预测正在科技圈快速传播：黄仁勋可能不会重返英伟达，而是选择另起炉灶，创办一家全新的半导体公司。这一预测的核心来源是Semafor商业记者Rohan Goswami。他在11月18日播出的《Prof G Markets》节目中给出了一个相当笃定的判断：黄仁勋重返英伟达的概率“为零”。Goswami的理由是，英伟达董事会做出让黄仁勋离开的决定门槛极高——许多董事与他共事已长达30年，不可能仅凭外界声援或请愿就推翻决议。此外，英伟达是上市公司，大量员工的财富与公司股票深度绑定，很难复制OpenAI员工集体施压董事会、迫使奥特曼火速复职的剧本。在Goswami看来，黄仁勋“本质上是创建者”，他最合理的下一步是与长期支持他的朋友一起，筹集并投入高达500亿美元，创办一家新的企业。尽管Goswami的预测仅为记者判断，尚未得到黄仁勋本人或任何官方渠道的确认，但它之所以能迅速发酵，是因为它触及了一个更具想象空间的问题：如果黄仁勋真的创办一家新的芯片公司，他能否在AI芯片领域再造一个足以与英伟达竞争的玩家？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123618418058539037","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":911},{"id":"2123616590612554213","h":"TJ_Research","ts":1795144624,"zh":"市场怎么了？情绪面极低！","en":"市场怎么了？情绪面极低！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2123616590612554213","l":["x.com"],"ln":[{"u":"https://x.com/i/broadcasts/2evORejanMboQp","d":"x.com"}],"t":[],"lk":33,"rt":0,"rp":3,"vw":6079},{"id":"2123616270923002337","h":"bboczeng","ts":1795144548,"zh":"https://x.com/i/spaces/1gqObePyKeRLrV","en":"","zh_src":"bing","lang":"","m":[],"u":"https://x.com/bboczeng/status/2123616270923002337","l":["x.com"],"ln":[{"u":"https://x.com/i/spaces/1gqObePyKeRLrV","d":"x.com"}],"t":[],"lk":0,"rt":0,"rp":1,"vw":846},{"id":"2123615951937835258","h":"xingpt","ts":1795144472,"zh":"标普500的P/E Ratio是2020年来最低，估值算是调整到位了。\n但是股价会从此开始上涨吗？我看也不一定。估值调整到位，还有盈利调整呢。\n盈利如果往下修，PE 倍数不就上去了吗？所以核心还是看这些科技公司的盈利能不能回升。但短期内我还是保持谨慎","en":"标普500的P/E Ratio是2020年来最低，估值算是调整到位了。\n但是股价会从此开始上涨吗？我看也不一定。估值调整到位，还有盈利调整呢。\n盈利如果往下修，PE 倍数不就上去了吗？所以核心还是看这些科技公司的盈利能不能回升。但短期内我还是保持谨慎","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2123615951937835258","l":[],"ln":[],"t":["美股"],"lk":0,"rt":0,"rp":0,"vw":607},{"id":"2123615603504381987","h":"bboczeng","ts":1795144389,"zh":"跟大家交个底\n熊市走到今天这步，其实我都已经看不懂了\n我只能看到Baseline I + II，以及半导体整个板块，抹去今年四月Claude Code ARR 以来的全部涨幅\n等他们跌到位之后，再出手\n我们携手共进退\n谢谢大家！","en":"跟大家交个底\n熊市走到今天这步，其实我都已经看不懂了\n我只能看到Baseline I + II，以及半导体整个板块，抹去今年四月Claude Code ARR 以来的全部涨幅\n等他们跌到位之后，再出手\n我们携手共进退\n谢谢大家！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123615603504381987","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":0,"rp":2,"vw":1357},{"id":"2123614163679494554","h":"bboczeng","ts":1795144046,"zh":"？？？","en":"？？？","zh_src":"bing","l 702},{"id":"2123591386050285837","h":"cnfinancewatch","ts":1795138615,"zh":"AI链再平衡，国产替代走强\n在强美元的外部压制下，今日A股呈现“指数分化、个股普跌”：沪指微跌0.28%，科创50逆势上涨1.83%，市场成交额萎缩至1.31万亿元、续创年内新低，近4900只个股下跌。“地量”叠加普跌，反映买盘实质性缺失，存量博弈陷入困局。\n盘面的核心博弈发生在科技内部：美国出口管制新规反向利好国产替代，却打击境外算力依赖，存量资金在AI链条内“再平衡”，半导体、通信设备表现抗跌，算力租赁、IT服务则重挫。同时资金向家电、食品饮料等低估值板块收缩避险，有色则受强美元与金价大跌拖累。资金面的关键变化在ETF端：宽基ETF全天在午盘前与尾盘两次集中买入，力度明显强于前两日的尾盘单次脉冲，但托底只守住下沿、未能拉起指数，个股层面亦无资金承接——资金买的是指数，没有买成“赚钱效应”，这正是存量困局的注脚。\n“地量”往往意味着变盘临近，但右侧信号尚未出现。在套牢筹码未释放、增量资金未入场的环境中，资金只向有真实订单的硬件端集中，远期叙事的容错空间被压至极致——“地量”之后，拼的或许不是方向判断，而是谁能等到量能回归。","en":"AI链再平衡，国产替代走强\n在强美元的外部压制下，今日A股呈现“指数分化、个股普跌”：沪指微跌0.28%，科创50逆势上涨1.83%，市场成交额萎缩至1.31万亿元、续创年内新低，近4900只个股下跌。“地量”叠加普跌，反映买盘实质性缺失，存量博弈陷入困局。\n盘面的核心博弈发生在科技内部：美国出口管制新规反向利好国产替代，却打击境外算力依赖，存量资金在AI链条内“再平衡”，半导体、通信设备表现抗跌，算力租赁、IT服务则重挫。同时资金向家电、食品饮料等低估值板块收缩避险，有色则受强美元与金价大跌拖累。资金面的关键变化在ETF端：宽基ETF全天在午盘前与尾盘两次集中买入，力度明显强于前两日的尾盘单次脉冲，但托底只守住下沿、未能拉起指数，个股层面亦无资金承接——资金买的是指数，没有买成“赚钱效应”，这正是存量困局的注脚。\n“地量”往往意味着变盘临近，但右侧信号尚未出现。在套牢筹码未释放、增量资金未入场的环境中，资金只向有真实订单的硬件端集中，远期叙事的容错空间被压至极致——“地量”之后，拼的或许不是方向判断，而是谁能等到量能回归。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123591386050285837","l":[],"ln":[],"t":["A股港股","AI科技","关税贸易","黄金"],"lk":0,"rt":0,"rp":1,"vw":951},{"id":"2123590587832283159","h":"cnfinancewatch","ts":1795138425,"zh":"标普500今天跌破了7月份的平台位置！\n我们核心的微盘股指数昨天也刚刚跌破7月份的成交密集区，目前政策底已经明确了，需要通过微盘股补跌到位，才能形成市场底和12月来年经济工作中释放出来的消息，引发的情绪底。\n513330恒生互联网周线，周线是我们定位投入资源最关键的风控点，昨天中金公司对于腾讯大幅度从666港元目标位置下调到470港元。\n就在开盘前中金也大幅度下调了阿里巴巴的目标价128港元。\n在低位大幅度下调这两家最重要权重公司，有利于利空的尽快出清，保持好心态，股价在低位重来都是利空为主，我们怕的是不确定，中金总算接近一年时间同时大幅调整了他们的目标价格。","en":"标普500今天跌破了7月份的平台位置！\n我们核心的微盘股指数昨天也刚刚跌破7月份的成交密集区，目前政策底已经明确了，需要通过微盘股补跌到位，才能形成市场底和12月来年经济工作中释放出来的消息，引发的情绪底。\n513330恒生互联网周线，周线是我们定位投入资源最关键的风控点，昨天中金公司对于腾讯大幅度从666港元目标位置下调到470港元。\n就在开盘前中金也大幅度下调了阿里巴巴的目标价128港元。\n在低位大幅度下调这两家最重要权重公司，有利于利空的尽快出清，保持好心态，股价在低位重来都是利空为主，我们怕的是不确定，中金总算接近一年时间同时大幅调整了他们的目标价格。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXiCYVYboAAOmR4.jpg?name=orig","https://pbs.twimg.com/media/HXiCYVjaQAAVK7G.jpg?name=orig","https://pbs.twimg.com/media/HXiCYVWaIAAh5Ar.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2123590587832283159","l":[],"ln":[],"t":["美股","A股港股"],"lk":1,"rt":0,"rp":1,"vw":1974},{"id":"2123590167529414807","h":"Balder13946731","ts":1795138324,"zh":"今晚的视频复盘：标普高开 0.9%、收跌 2%，开盘就是全天最高点。讲了负 Gamma 为什么会把高开变成大跌，还有昨天两张财报雷达卡的结果。","en":"今晚的视频复盘：标普高开 0.9%、收跌 2%，开盘就是全天最高点。讲了负 Gamma 为什么会把高开变成大跌，还有昨天两张财报雷达卡的结果。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123590167529414807","l":["youtu.be"],"ln":[{"u":"https://youtu.be/OkxAFzV2I1I","d":"youtu.be"}],"t":["美股","财报"],"lk":0,"rt":0,"rp":0,"vw":577},{"id":"2123590145307988132","h":"bboczeng","ts":1795138319,"zh":"当然和黄仁勋的婚外情无关，\n是因为黄仁勋明显看到自己订的存储和台积电产能用不完了，估计才孤注一掷和阿里巴巴媾和\nAMD也是一样\n这里反映的都不是什么排华的问题，完全是库存问题！\n这一次，都是空头Burry是真的对了","en":"当然和黄仁勋的婚外情无关，\n是因为黄仁勋明显看到自己订的存储和台积电产能用不完了，估计才孤注一掷和阿里巴巴媾和\nAMD也是一样\n这里反映的都不是什么排华的问题，完全是库存问题！\n这一次，都是空头Burry是真的对了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123590145307988132","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":413},{"id":"2123588861687402538","h":"fxtrader","ts":1795138013,"zh":"#行情 A股开盘，上证指数低开1.41%，深证成指低开1.71%，创业板指低开2.15%。","en":"#行情 A股开盘，上证指数低开1.41%，深证成指低开1.71%，创业板指低开2.15%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123588861687402538","l":[],"ln":[],"t":["A股港股"],"lk":4,"rt":0,"rp":0,"vw":1377},{"id":"2123585145567658294","h":"fxtrader","ts":1795137127,"zh":"继英伟达后，AMD成为被做空目标。Hunterbrook Capital发布调查报告，提出三大指控，质疑AMD存在与中国受美国制裁企业的业务关联，以及AI业务中存在潜在的循环融资风险。\n第一项指控是，被美国拉黑的中国服务器制造商浪潮信息，旗下服务器仍然在持续使用AMD的新版本固件。与Maginfra、Kaytus和Aivres的三家关联企业也使用了几乎相同的AMD固件。（Hunterbrook承认不能证明AMD违反了出口管制规定）\n第二项指控是，AMD与中国受制裁芯片企业存在收入联系。通过对比海光此前的招股书及财报，发现相关款项与AMD的知识产权授权费用记录吻合。推断AMD仍在从这两家中国合资企业获得知识产权授权收益。估算2021—2025 年累计支付约2.7亿美元，与AMD披露的同期约 2.63 亿美元授权收益接近。\n第三项指控是，AMD的AI业务可能存在循环融资。AMD向客户与合作伙伴作出的承诺规模已远超英伟达，而其现金储备却相对不足。警告如果围绕英伟达的相关风险持续发酵、演变为AI基础设施建设的一场更大危机，AMD将难以幸免。\nAMD盘中一度大跌11%，尾盘收窄跌幅，但盘后继续下跌。\nAMD对此回应称，Hunterbrook的指控歪曲了AMD的业务实践与合作关系。","en":"继英伟达后，AMD成为被做空目标。Hunterbrook Capital发布调查报告，提出三大指控，质疑AMD存在与中国受美国制裁企业的业务关联，以及AI业务中存在潜在的循环融资风险。\n第一项指控是，被美国拉黑的中国服务器制造商浪潮信息，旗下服务器仍然在持续使用AMD的新版本固件。与Maginfra、Kaytus和Aivres的三家关联企业也使用了几乎相同的AMD固件。（Hunterbrook承认不能证明AMD违反了出口管制规定）\n第二项指控是，AMD与中国受制裁芯片企业存在收入联系。通过对比海光此前的招股书及财报，发现相关款项与AMD的知识产权授权费用记录吻合。推断AMD仍在从这两家中国合资企业获得知识产权授权收益。估算2021—2025 年累计支付约2.7亿美元，与AMD披露的同期约 2.63 亿美元授权收益接近。\n第三项指控是，AMD的AI业务可能存在循环融资。AMD向客户与合作伙伴作出的承诺规模已远超英伟达，而其现金储备却相对不足。警告如果围绕英伟达的相关风险持续发酵、演变为AI基础设施建设的一场更大危机，AMD将难以幸免。\nAMD盘中一度大跌11%，尾盘收窄跌幅，但盘后继续下跌。\nAMD对此回应称，Hunterbrook的指控歪曲了AMD的业务实践与合作关系。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123580444113608704/vid/avc1/1532x1328/98wodbhdGs_IBJcb.mp4?tag=29","https://pbs.twimg.com/media/HXh6rgubYAARHWW.jpg?name=orig","https://pbs.twimg.com/media/HXh6uDubcAA-D6a.jpg?name=orig","https://pbs.twimg.com/media/HXh7_n3bYAAGKM_.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123585145567658294","l":[],"ln":[],"t":["AI科技","财报","关税贸易"],"lk":15,"rt":2,"rp":2,"vw":4664},{"id":"2123584304529981484","h":"TraderS18","ts":1795136927,"zh":"障眼法还在继续，即使抛开 ANT 本身高开低走不谈，谁能想到借着 ANT 在台前吸引眼球，后面 AMD 突然给你来个大跳水再次引发崩盘呢","en":"障眼法还在继续，即使抛开 ANT 本身高开低走不谈，谁能想到借着 ANT 在台前吸引眼球，后面 AMD 突然给你来个大跳水再次引发崩盘呢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123584304529981484","l":[],"ln":[],"t":[],"lk":6,"rt":1,"rp":1,"vw":3115},{"id":"2123582297139986527","h":"ReutersChina","ts":1795136448,"zh":"美国众议院外交事务委员会周四表示，特朗普政府批准从 2025 年 12 月到 2026 年 5 月向中国企业运送近 90 万个由 Nvidia 和 AMD 制造的先进人工智能芯片。","en":"The Trump administration approved shipments of nearly 900,000 advanced AI chips made by Nvidia and AMD for Chinese companies from December 2025 through May 2026, the House Foreign Affairs Committee said on Thursday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123582297139986527","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/license-information-ai-chips-sent-china-released-by-us-house-comm 伴，已被美国拉黑，但每年还给 AMD 交几千万美元许可费。\n3. 浪潮系（IEIT/Aivres 等）：用 AMD 芯片做服务器，被拉黑后疑似通过关联公司继续拿 AMD 的技术。\n4. 中科曙光（Cancon）：被拉黑的公司，产品却出现在 AMD 官网目录里。","en":"1. 通富微电：给 AMD 封装测试芯片，干了大部分后道工序（命脉供应商）。\n2. 海光：AMD 的合资伙伴，已被美国拉黑，但每年还给 AMD 交几千万美元许可费。\n3. 浪潮系（IEIT/Aivres 等）：用 AMD 芯片做服务器，被拉黑后疑似通过关联公司继续拿 AMD 的技术。\n4. 中科曙光（Cancon）：被拉黑的公司，产品却出现在 AMD 官网目录里。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123573457694929206","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1004},{"id":"2123572944739897597","h":"cnfinancewatch","ts":1795134218,"zh":"三大利空方向（由强到弱）\n一、AI交易的定价权已经从“上市催化”回到“回报能不能覆盖投入”，这是今天外部最硬的空头约束。已核实：Anthropic开盘后指数很快打到日内最低。科技巨头按市值排列，苹果跌0.92%，微软跌1.78%，英伟达跌3.3%，谷歌C跌2.93%，亚马逊跌3.87%，SpaceX跌3.53%，Meta跌3.27%，特斯拉跌2.43%。费城半导体30只成分股仅英特尔、高通和Coherent三家收涨。做空机构Hunterbrook盘中宣布做空AMD，并警告其存在与英伟达类似的“循环交易”，这是空头指控，不是已裁决事实，但AMD收跌7.72%，说明市场愿意给这个叙事定价。网络安全是少数逆势，Palo\nAlto Networks涨6.42%，因其前一日季度业绩超预期并上调全年指引。纳斯达克金龙指数跌1.86%，网易跌11.39%。对A股的直接映射，是昨天已经退潮的国产GPU和算力租赁可能继续被核：燧原科技20厘米跌停，沐曦股份跌超14%，摩尔线程跌8.34%，海光信息、寒武纪也下跌。共进股份、星网锐捷昨天已经跌停。今天若再低开，先要分清哪些是代工和材料的产业票，哪些是高位主题票，不能再混为一谈。\n二、利率和流动性约束不但没有解除，反而被会议纪要和公开表态重新钉死，贵金属已经先倒下。已核实：美联储10月会议以10比2维持3.75%至4.00%的利率区间，库克理事和克利夫兰联储主席哈马克主张加息25个基点。纪要显示，几乎所有与会者认为，按基准情景，为把通胀及时拉回2%，后续进一步加息可能是合适的；部分委员在会上就主张加息25个基点，少数委员还提到12月或需要更大的加息幅度。纪要同时把人工智能写成通胀和金融稳定的风险来源，并提醒表外租赁和循环融资可能放大亏损。理事沃勒11月18日对CNBC表示，通胀“正朝错误方向走，而且在扩散”，12月8日至9日的会议可能需要一次50个基点的加息“震惊市场”；若只加25个基点，则需明确释放明年1月再加息的信号。期货此前已充分计价12月加25个基点并预期1月再动一次，沃勒的表态是把上沿打开，不是把加息从零写成必然。现货黄金11月19日盘中跌破3620美元，最低3619.81美元，收跌2.7%报3624.4美元；现货白银收跌4.83%报42.88美元。WTI原油收83.21美元，跌0.06%；布伦特收91.98美元，涨0.03%，油价本身不是主摔的资产，金和银才是。邮件把Comex黄金写成收跌3.16%报3736.80美元，对应的是更早一轮跌势，不能和19日夜盘收盘混用。对A股，黄金和有色昨天已经承压，紫金矿业成交额高达99.20亿元，今天还要面对外盘补跌的风险。\n三、A股内部的亏钱效应比指数更危险，今天又是交割日，微盘和高位题材的负反馈还没有收敛。已核实：影视院线、数字媒体和厨卫电器跌幅居前，慈文传媒、横店影视、金逸影视、文投控股跌停，冰雪经济里龙江交通、冰山冷热、长白山等跌停。北证50有复盘口径显示跌近4%。连续多个交易日超过四千只个股下跌，社区称之为“六连冰”。成交再缩到约1.31万亿元，说明不是大举换手后的见底，而是增量不愿入场、存量也不愿意加价。邮件转述三星拟在CES\n2027发布两款人形机器人、马斯克更新Optimus进展，这能解释九阳、襄阳轴承一类主题为什么还能脉冲，但解释不了为什么同一天里跌停家数远多于涨停。今天的约束是：低开之后如果跌停继续扩容，银行和红利也会被倒逼着提供流动性；如果只是指数低开、结构还在，才有条件重新讨论代工和材料的回踩。在看到量能和跌停家数收敛之前，先把仓位和预期都降下来。\n（来源：新华社、财联社、中国证券报、每经、21世纪经济报道、金十数据、公司公告、CNBC等公开报道，以及本期晚间热点财经邮件中已标明的转述线索。以上内容仅供参考，不构成投资建议，市场有风险，决策需谨慎。）","en":"三大利空方向（由强到弱）\n一、AI交易的定价权已经从“上市催化”回到“回报能不能覆盖投入”，这是今天外部最硬的空头约束。已核实：Anthropic开盘后指数很快打到日内最低。科技巨头按市值排列，苹果跌0.92%，微软跌1.78%，英伟达跌3.3%，谷歌C跌2.93%，亚马逊跌3.87%，SpaceX跌3.53%，Meta跌3.27%，特斯拉跌2.43%。费城半导体30只成分股仅英特尔、高通和Coherent三家收涨。做空机构Hunterbrook盘中宣布做空AMD，并警告其存在与英伟达类似的“循环交易”，这是空头指控，不是已裁决事实，但AMD收跌7.72%，说明市场愿意给这个叙事定价。网络安全是少数逆势，Palo\nAlto Networks涨6.42%，因其前一日季度业绩超预期并上调全年指引。纳斯达克金龙指数跌1.86%，网易跌11.39%。对A股的直接映射，是昨天已经退潮的国产GPU和算力租赁可能继续被核：燧原科技20厘米跌停，沐曦股份跌超14%，摩尔线程跌8.34%，海光信息、寒武纪也下跌。共进股份、星网锐捷昨天已经跌停。今天若再低开，先要分清哪些是代工和材料的产业票，哪些是高位主题票，不能再混为一谈。\n二、利率和流动性约束不但没有解除，反而被会议纪要和公开表态重新钉死，贵金属已经先倒下。已核实：美联储10月会议以10比2维持3.75%至4.00%的利率区间，库克理事和克利夫兰联储主席哈马克主张加息25个基点。纪要显示，几乎所有与会者认为，按基准情景，为把通胀及时拉回2%，后续进一步加息可能是合适的；部分委员在会上就主张加息25个基点，少数委员还提到12月或需要更大的加息幅度。纪要同时把人工智能写成通胀和金融稳定的风险来源，并提醒表外租赁和循环融资可能放大亏损。理事沃勒11月18日对CNBC表示，通胀“正朝错误方向走，而且在扩散”，12月8日至9日的会议可能需要一次50个基点的加息“震惊市场”；若只加25个基点，则需明确释放明年1月再加息的信号。期货此前已充分计价12月加25个基点并预期1月再动一次，沃勒的表态是把上沿打开，不是把加息从零写成必然。现货黄金11月19日盘中跌破3620美元，最低3619.81美元，收跌2.7%报3624.4美元；现货白银收跌4.83%报42.88美元。WTI原油收83.21美元，跌0.06%；布伦特收91.98美元，涨0.03%，油价本身不是主摔的资产，金和银才是。邮件把Comex黄金写成收跌3.16%报3736.80美元，对应的是更早一轮跌势，不能和19日夜盘收盘混用。对A股，黄金和有色昨天已经承压，紫金矿业成交额高达99.20亿元，今天还要面对外盘补跌的风险。\n三、A股内部的亏钱效应比指数更危险，今天又是交割日，微盘和高位题材的负反馈还没有收敛。已核实：影视院线、数字媒体和厨卫电器跌幅居前，慈文传媒、横店影视、金逸影视、文投控股跌停，冰雪经济里龙江交通、冰山冷热、长白山等跌停。北证50有复盘口径显示跌近4%。连续多个交易日超过四千只个股下跌，社区称之为“六连冰”。成交再缩到约1.31万亿元，说明不是大举换手后的见底，而是增量不愿入场、存量也不愿意加价。邮件转述三星拟在CES\n2027发布两款人形机器人、马斯克更新Optimus进展，这能解释九阳、襄阳轴承一类主题为什么还能脉冲，但解释不了为什么同一天里跌停家数远多于涨停。今天的约束是：低开之后如果跌停继续扩容，银行和红利也会被倒逼着提供流动性；如果只是指数低开、结构还在，才有条件重新讨论代工和材料的回踩。在看到量能和跌停家数收敛之前，先把仓位和预期都降下来。\n（来源：新华社、财联社、中国证券报、每经、21世纪经济报道、金十数据、公司公告、CNBC等公开报道，以及本期晚间热点财经邮件中已标明的转述线索。以上内容仅供参考，不构成投资建议，市场有风险，决策需谨慎。）","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/cnfinancewatch/status/2123572944739897597","l":[],"ln":[],"t":["美联储","通胀","美股","原油能源","AI科技","黄金"],"lk":1,"rt":0,"rp":0,"vw":479},{"id":"2123572940449190194","h":"cnfinancewatch","ts":1795134217,"zh":"三、必选消费与云业务的盈利验证还在，但它是中期逻辑，不是今天用来对抗低开的武器。已核实：沃尔玛截至10月31日的第三财季营收1888.35亿美元，同比增5.2%，略高于分析师预期的1872.7亿美元；调整后每股收益0.65美元，略高于预期的0.64美元；营业利润77.7亿美元，同比增16%。中国市场按固定汇率净销售79亿美元，同比增28.5%，可比销售增14.3%，电商增31%。公司年内第三次上调指引，全年净销售增速调至4.9%至5.2%，调整后每股收益调至2.84至2.89美元。但沃尔玛当天仍收跌1.04%，报126.04美元，说明即便是质量较高的零售财报，也挡不住风险偏好回落。阿里巴巴2027财年第二季度收入2715.19亿元，同比增10%；阿里云外部商业化收入同比增64%，经常性收入（不含算力设备解决方案）同比增67%，经调整EBITA同比增121%，利润率升至14.5%，AI相关产品收入连续第13个季度三位数增长。同时，资本开支走高，自由现金流阶段性承压。拼多多第三季度营收1083亿元，归母净利295亿元，大致持平去年的293亿元，美股收涨11.04%，是中概股里少有的例外。对A股的含义是：美的、格力这类有盈利和分红的龙头，比高位小家电更经得起波动；云和AI需求没有消失，但投入正在改写利润表。九阳股份昨天再次走出地天板，盘中炸板超16次，收31.21元，已经连续三个交易日在地天板和天地板之间切换，这一端不是消费逻辑，是情绪投机，今天必须拆开看。","en":"三、必选消费与云业务的盈利验证还在，但它是中期逻辑，不是今天用来对抗低开的武器。已核实：沃尔玛截至10月31日的第三财季营收1888.35亿美元，同比增5.2%，略高于分析师预期的1872.7亿美元；调整后每股收益0.65美元，略高于预期的0.64美元；营业利润77.7亿美元，同比增16%。中国市场按固定汇率净销售79亿美元，同比增28.5%，可比销售增14.3%，电商增31%。公司年内第三次上调指引，全年净销售增速调至4.9%至5.2%，调整后每股收益调至2.84至2.89美元。但沃尔玛当天仍收跌1.04%，报126.04美元，说明即便是质量较高的零售财报，也挡不住风险偏好回落。阿里巴巴2027财年第二季度收入2715.19亿元，同比增10%；阿里云外部商业化收入同比增64%，经常性收入（不含算力设备解决方案）同比增67%，经调整EBITA同比增121%，利润率升至14.5%，AI相关产品收入连续第13个季度三位数增长。同时，资本开支走高，自由现金流阶段性承压。拼多多第三季度营收1083亿元，归母净利295亿元，大致持平去年的293亿元，美股收涨11.04%，是中概股里少有的例外。对A股的含义是：美的、格力这类有盈利和分红的龙头，比高位小家电更经得起波动；云和AI需求没有消失，但投入正在改写利润表。九阳股份昨天再次走出地天板，盘中炸板超16次，收31.21元，已经连续三个交易日在地天板和天地板之间切换，这一端不是消费逻辑，是情绪投机，今天必须拆开看。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123572940449190194","l":[],"ln":[],"t":["美股","汇率","AI科技","财报"],"lk":1,"rt":0,"rp":2,"vw":533},{"id":"2123572936149983381","h":"cnfinancewatch","ts":1795134216,"zh":"今日判断\n今天的关键不是昨天科创50红了没有，而是隔夜美股把Anthropic上市这笔“最大IPO”交易成了一次卖事实。已核实：Anthropic发行9.8亿股、定价83美元，公开募资约813亿美元，超过今年6月SpaceX创下的纪录；另有约260亿美元私募，合计约1073亿美元。股票代码ANT于11月19日在纳斯达克开盘报111.50美元，较发行价高约34%，盘中一度约115.10美元、涨约39%，收97.17美元，仍较发行价涨17.07%，但较开盘价回落约12.9%，完全稀释市值约1.8万亿美元。指数没有留下这份热度。三大指数高开低走，均跌超2%：道指跌1101.11点、跌2.19%，收49097.06点，为5月5日以来最低，也是6月以来首次收在5万点下方；标普500跌2.02%，收7175.83点，连跌六个交易日；纳指跌2.25%，收23879.20点。标普与纳指同创4月以来收盘新低。VIX收涨15.8%报28.44，盘中触及29.13，为4月1日以来最高。Miller\nTabak策略师马特·马利的概括很直白：市场上出现了“买预期、卖事实”，催化因素已经兑现。\nA股昨天已经先走完自己的结构分化，没有能力再去接隔夜这一棒。已核实：上证跌0.28%报3577.62点，深成指跌0.71%报10583.20点，创业板跌0.79%报2293.34点，科创50逆势涨1.83%报1270.78点，上证50尾盘拉回涨0.32%。沪深成交约1.31万亿元，金十口径为13051.47亿元，较上日缩约646亿元，再创年内地量。21财经雷达统计，沪深两市638只上涨、4532只下跌，28只涨停、83只跌停；连板网与淘股吧复盘把全部A股记为上涨649家、下跌4876家，涨停23家、跌停68家，炸板率约51%。口径不同，方向一致：指数跌得不多，账户很难过关。港股更弱，恒生指数跌1.95%报22841.62点，恒生科技跌2.33%报3649.14点，腾讯收跌6.55%。富时A50连续夜盘收跌1.12%报12553点，指数端今早有低开压力。所以今天的基调很清楚：不要把昨天晶圆代工和光刻胶的局部高潮，理解成成长风格已经翻过来；更不要把隔夜史上最大IPO，当成A股算力链的开盘加仓信号。先看低开后的承接，再谈结构。相对更稳的仍是银行红利和宽基配置盘；半导体制造只作为事件余波观察，开盘不追昨天已经大涨的方向。\n三大利多方向（由强到弱）\n一、银行、红利与宽基ETF的配置盘，是今天容错相对更高的底仓，但只适合持盈和回踩，不适合把尾盘拉升理解成反转。已核实：11月19日临近收盘，科创50与上证50发力，上证跌幅收窄。中国证券报报道，多只宽基ETF尾盘约15分钟放量，科创50ETF易方达（588080）成交127.25亿元，创上市以来第三高、较上日放量超4倍；中证500ETF南方、科创50ETF华夏、创业板ETF易方达、沪深300ETF华夏全天成交均超过百亿元；沪深300ETF嘉实较上日放量超8倍。机场航运、白酒和国有大型银行等板块相对抗跌，券商股尾盘也有拉升。邮件转述称沪深300ETF与创业板ETF近5日净流入超100亿元，我们未独立核对全部申赎细节，只把它当成护盘线索，不是已经确认的增量反转。制约很明确：今天是11月第三个周五，也是期指交割日，又叠着A50夜盘低开，尾盘的ETF放量只能说明有资金不愿砸在地板上，不能说明增量已经进场。银行和红利适合作为低开后的防守框架，高位个股内部已经分化，邮件转述里阳光照明跌停，说明这条线也不是铁板一块。\n二、半导体制造、先进封装与材料，仍是昨天盘面里唯一能同时看到产业逻辑和真金白银的方向，但位置已经抬高，今天只观察、不追高。已核实：中芯国际涨6.21%、成交104.96亿元，华虹公司涨8.05%、成交84.2亿元；中微公司涨超5%，长电科技、北方华创涨超4%。光刻胶与先进封装活跃，格林达、红宝丽、大港股份涨停，蓝箭电子20厘米涨停，盛剑科技3连板。21世纪经济报道称，主力净流入前十个股均为科技股，新易盛、中芯国际、中际旭创净流入均超10亿元。中芯国际联合CEO赵海军在三季度业绩说明会上表示，2027年半导体代工仍将供需紧平衡，人工智能相关存储器要到2028年中期及下半年才可能平衡，算力和配套芯片仍缺。长鑫科技董事会已审议通过把回购金额上调至25亿元至50亿元、价格不超过63.78元/股，尚需12月9日股东会审议，这是对存储链情绪的支撑，还不是已经实施的买盘。邮件转述还提到14只基金在震荡市中加仓国产替代，我们未逐只核对持仓，不把它写成机构已经集体转向。制约在隔夜：费城半导体指数盘初一度涨逾4.7%，收跌2.41%；英伟达跌3.3%，AMD跌7.72%，台积电ADR跌约2.9%。A股昨天涨得好的，正是今天最容易被低开检验的。开盘不追中芯、华虹，更不要把已经连板的光刻胶和设备票并进同一笔交易。","en":"今日判断\n今天的关键不是昨天科创50红了没有，而是隔夜美股把Anthropic上市这笔“最大IPO”交易成了一次卖事实。已核实：Anthropic发行9.8亿股、定价83美元，公开募资约813亿美元，超过今年6月SpaceX创下的纪录；另有约260亿美元私募，合计约1073亿美元。股票代码ANT于11月19日在纳斯达克开盘报111.50美元，较发行价高约34%，盘中一度约115.10美元、涨约39%，收97.17美元，仍较发行价涨17.07%，但较开盘价回落约12.9%，完全稀释市值约1.8万亿美元。指数没有留下这份热度。三大指数高开低走，均跌超2%：道指跌1101.11点、跌2.19%，收49097.06点，为5月5日以来最低，也是6月以来首次收在5万点下方；标普500跌2.02%，收7175.83点，连跌六个交易日；纳指跌2.25%，收23879.20点。标普与纳指同创 twimg.com/media/HXhx_Vwa0AA7bdV.jpg?name=orig"],"u":"https://x.com/TheMarketMemo/status/2123572646050971707","l":[],"ln":[],"t":[],"lk":29,"rt":2,"rp":5,"vw":4138},{"id":"2123572420087030178","h":"dmjk001","ts":1795134093,"zh":"中际交流反馈\n🔹1、2027 年业务能见度以及 2028 年展望：2027 年大部分合同已经敲定，数量与价格均确认落地。部分核心客户已经给出 2028 年指引，公司预计 2028 年需求将维持正向增长。\n🔹2、1.6T 光模块订单获得上调，800G 订单小幅下调；整体在手订单依旧十分充足，未出现订单取消情况。\n🔹3、NPO（近封装光学）业务取得更为积极的进展：近数周 NPO 产品需求获得上调，计划 2027 年下半年实现规模化量产，2028 年迎来更大规模增长。NPO 产品极有可能同时对产品平均售价与毛利率带来正向贡献。\n🔹4、2027 年毛利率展望具备韧性：光收发模块产品会遵循行业惯例出现年度降价。但公司持续依靠技术创新以及成本优化去抵消降价带来的负面影响，维持具备韧性的盈利水平。除硅光方案以及 1.6T 产品占比提升之外，公司在 1:4 CW 激光器方案（单颗 CW 激光器支持 4 条通道）上取得进展，该方案相比现有 1:2 方案成本优势更强。\n🔹5、跨行业周期的优异表现：公司预计 2027 年供给紧张格局仍将延续。除此之外，公司与头部云服务商建立深度合作关系，有助于维持充足在手订单；持续的技术创新将助力公司在新产品领域维持较高市场份额。","en":"中际交流反馈\n🔹1、2027 年业务能见度以及 2028 年展望：2027 年大部分合同已经敲定，数量与价格均确认落地。部分核心客户已经给出 2028 年指引，公司预计 2028 年需求将维持正向增长。\n🔹2、1.6T 光模块订单获得上调，800G 订单小幅下调；整体在手订单依旧十分充足，未出现订单取消情况。\n🔹3、NPO（近封装光学）业务取得更为积极的进展：近数周 NPO 产品需求获得上调，计划 2027 年下半年实现规模化量产，2028 年迎来更大规模增长。NPO 产品极有可能同时对产品平均售价与毛利率带来正向贡献。\n🔹4、2027 年毛利率展望具备韧性：光收发模块产品会遵循行业惯例出现年度降价。但公司持续依靠技术创新以及成本优化去抵消降价带来的负面影响，维持具备韧性的盈利水平。除硅光方案以及 1.6T 产品占比提升之外，公司在 1:4 CW 激光器方案（单颗 CW 激光器支持 4 条通道）上取得进展，该方案相比现有 1:2 方案成本优势更强。\n🔹5、跨行业周期的优异表现：公司预计 2027 年供给紧张格局仍将延续。除此之外，公司与头部云服务商建立深度合作关系，有助于维持充足在手订单；持续的技术创新将助力公司在新产品领域维持较高市场份额。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123572420087030178","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":1009},{"id":"2123571643423527119","h":"dmjk001","ts":1795133908,"zh":"近期和渠道交流量化私募申赎情况，核心要点如下：\n1、下半年以来，预计量化私募赎回约占存量规模的10-15%，除了8-9月有小幅申购外，其余均呈现净流出，近期客户基本深套躺平，尤其是今年入场的客户，新增申购降至冰点，机构和渠道普遍反馈权益类策略新发募集难度明显加大。\n2、6月底根据各家宣传规模预估量化规模3.5万e左右，但是考虑到多家管理人把自己的管理规模往低了申报（虚报自己策略容量额度），预计实际规模可能在4-5万e左右，考虑近期回撤约25%，预计余下3-4万e，如若出现强反弹，预计去年申购的目前已经进入开放期的产品将出现赎回压力。\n3、此外，和两家头部股份行沟通中性产品的赎回情况，均表示不明显，但是部分券商自营资金开始赎回，我们认为这部分风险仍有待进一步观察。","en":"近期和渠道交流量化私募申赎情况，核心要点如下：\n1、下半年以来，预计量化私募赎回约占存量规模的10-15%，除了8-9月有小幅申购外，其余均呈现净流出，近期客户基本深套躺平，尤其是今年入场的客户，新增申购降至冰点，机构和渠道普遍反馈权益类策略新发募集难度明显加大。\n2、6 .86%，CRDO 跌 4.21%。量子计算股 QBTS 跌 4.94%。半导体内部分化明显，INTC 涨 1.92%，QCOM 涨 1.38%，与 AMD 的大跌形成对比。存储板块逆势上涨，WDC 涨 2.98%，STX 涨 1.06%。网络安全板块表现最强。医疗方面，UNH 跌 5.55%，MRNA 涨 1.29%。出行平台 UBER 跌 4.60%。\n焦点\nPANW 涨 6.44%，是观察池中涨幅最大的个股（反向 ETF 除外）。公司于前一交易日盘后公布财报，财报是今天上涨的主因。同板块的 CRWD 跟涨 2.71%，网络安全成为大跌行情中少数的避险方向。\nAI 基础设施股集体下跌的同时，市场对 AI 资本开支的讨论仍在继续。微软、Alphabet 把服务器折旧年限拉长到 6 年，Meta 定在 5.5 年，而 GPU 的迭代周期约为一年。这一错配是近期争议的焦点之一，但今天的跌幅是否与此直接相关，盘面数据不足以确认。\n小结\n今天是一个普跌日。指数跌约 2%，下跌个股数量是上涨个股的五倍多，反向杠杆 ETF 走强说明避险需求上升。AI 算力链是主要的抛压来源。资金只在网络安全和存储两个方向形成局部支撑，其中 PANW 的上涨由财报推动。后续需观察 AI 基础设施股能否企稳，以及市宽能否修复。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123544469568204805","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":1,"rt":0,"rp":1,"vw":741},{"id":"2123544178395418661","h":"bboczeng","ts":1795127360,"zh":"这些东西还是少看，看的越多，人会变得越蠢","en":"这些东西还是少看，看的越多，人会变得越蠢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123544178395418661","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":503},{"id":"2123542388211625984","h":"AntonLaVay","ts":1795126933,"zh":"目前，远期市场有巨大的不确定性，就像我数据中心的文章提到的：\n27年计划内的数据中心大概率不会受到影响（这还是是在数据中心拥有者没有受到 $NVDA 供应商融资出问题的前提下），但是28年的，和没有走完流程的不确定性很大，一个例子就是德州新州长提出要对数据中心建设争议立法解决，在共和党控制德州参院的情况下，立法进展高度不确定。\n然后 $NVDA 这公司短期内，应该没啥问题，毕竟还在Jensen Huang时代的惯性中，但是同样28年非常不可控。除了经营方向还没有CEO以外，Jensen 搞得大量的供应商融资，循环融资三角债在离开的Jensen之后能否玩得转也说不明白。\n远期如果有明显的不确定性，反应在股价上就是压缩估值。","en":"目前，远期市场有巨大的不确定性，就像我数据中心的文章提到的：\n27年计划内的数据中心大概率不会受到影响（这还是是在数据中心拥有者没有受到 $NVDA 供应商融资出问题的前提下），但是28年的，和没有走完流程的不确定性很大，一个例子就是德州新州长提出要对数据中心建设争议立法解决，在共和党控制德州参院的情况下，立法进展高度不确定。\n然后 $NVDA 这公司短期内，应该没啥问题，毕竟还在Jensen Huang时代的惯性中，但是同样28年非常不可控。除了经营方向还没有CEO以外，Jensen 搞得大量的供应商融资，循环融资三角债在离开的Jensen之后能否玩得转也说不明白。\n远期如果有明显的不确定性，反应在股价上就是压缩估值。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2123542388211625984","l":["x.com"],"ln":[{"u":"https://x.com/antonlavay/status/2118698780891500734?a=tcnwgLqujnujw35hkoY&s=46","d":"x.com"}],"t":[],"lk":0,"rt":1,"rp":1,"vw":1100},{"id":"2123541558930882874","h":"bboczeng" 不稳定。\n美国可能正在从一个政治高度极化、但党内权力结构相对稳定的体系\n转向\n一个政治高度极化，而且两党内部权力结构也不稳定的体系。\n原本共和党对民主党的优势来自于民主党内部高度分裂，而共和党被Maga整合，但是现在这种整合明显已经崩盘。\n原本，对抗政府导致政策相对稳定，双方都很难改变现状，市场反而可能获得政策确定性，但是我觉得这不符合当下的事实。\n更可能的是政治失序：各方不仅无法达成协议，连各自会采取什么行动，谁能约束谁都变得难以预测。\n共和党如今发现，Trump对伊朗行动在美国不得人心，靠近都会不幸，谁Maga谁输选举。\n民主党虽然赢了，但是这种胜利是建立在民众对于高油价，伊朗战争和数据中心的极度厌恶中带来的民意反弹。\n民主党面对一个麻烦的处境，他们知道选民烦什么，膈应什么，但是选举到底希望民主党实施什么政策，这一点并不清楚。\n其中一个明显的证明当前在走向政治失序而不是对抗国会的僵局的证据就在于：中期选举完还没有超过一个月，一个管理五万亿美元市值公司的CEO就被干掉了..\n头皮发麻。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2123487410483073135","l":[],"ln":[],"t":["美股","原油能源"],"lk":1,"rt":2,"rp":0,"vw":540},{"id":"2123486210689761623","h":"Balder13946731","ts":1795113539,"zh":"目前 $QQQ 的参考区间下滑到了636-661","en":"目前 $QQQ 的参考区间下滑到了636-661","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123486210689761623","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":653},{"id":"2123485127338828212","h":"Balder13946731","ts":1795113281,"zh":"！这个时候我们应该听到伯克希尔哈撒韦入股 $NVDA 🫪 没有比这更有性价比的交易了。","en":"！这个时候我们应该听到伯克希尔哈撒韦入股 $NVDA 🫪 没有比这更有性价比的交易了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123485127338828212","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":3,"vw":1259},{"id":"2123484696206295100","h":"wufantouzi","ts":1795113178,"zh":"又这样啊\n还不如永续直接买\n一天的资金费率还是付得起的\n也能撸到十几个点\n这样搞破发就给你了\n开盘35%就没你的份了\n引用：","en":"又这样啊\n还不如永续直接买\n一天的资金费率还是付得起的\n也能撸到十几个点\n这样搞破发就给你了\n开盘35%就没你的份了\n引用：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXgiEKTacAADiJp.png?name=orig"],"u":"https://x.com/wufantouzi/status/2123484696206295100","l":["web.timestore.vip"],"ln":[{"u":"https://web.timestore.vip/#/time/pages/timeDetail/index?timeid=184520","d":"web.timestore.vip"}],"t":[],"lk":3,"rt":0,"rp":1,"vw":1606},{"id":"2123483927201648932","h":"bboczeng","ts":1795112995,"zh":"你持有，或者最近抄底的股票，比如neocloud，nvda，intc，还要再跌多少你才会止损，放弃，跑路？\n请说实话：","en":"你持有，或者最近抄底的股票，比如neocloud，nvda，intc，还要再跌多少你才会止损，放弃，跑路？\n请说实话：","zh_src":"native","lang":"zh","m":[],"u": 000 亿至 9500 亿美元市值，背后的推动力是市场对 Anthropic 创纪录 IPO 定价的热情。\n比特币随股市上涨同步反弹，短暂提振了加密市场情绪。但在 15 至 45 分钟内，近 1 万亿美元市值又迅速蒸发，标普 500 指数从接近 7420 点急挫至约 7320 点，热力图由绿转红，市场陷入获利了结。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123455923956203692","l":[],"ln":[],"t":["美股","AI科技"],"lk":3,"rt":0,"rp":1,"vw":905},{"id":"2123455785351180459","h":"bboczeng","ts":1795106285,"zh":"AMD最大砸了10%，现收-5%","en":"AMD最大砸了10%，现收-5%","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123455785351180459","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":679},{"id":"2123454590352081034","h":"bboczeng","ts":1795106000,"zh":"Hunterbrook 报告指出 AMD 在做空头寸背景下面临对华出口风险\nHunterbrook Media 于 2026 年 11 月 19 日发布的报告显示，被美国列入黑名单的 IEIT Systems 在 2025 年被列入黑名单之后，仍发布了 AMD 固件更新，其关联公司 Aivres 和 Kaytus 也存在类似代码。\nAMD 2025 财年有 22.4% 的收入（77.5 亿美元）来自中国大陆和香港，另有 6700 万美元的授权收入来自被列入黑名单的合资企业，不过目前并未确认存在任何出口违规行为。\nAMD 在承诺回应置评请求后却不再理会 Hunterbrook，股价最多下跌 2.9%；Hunterbrook 披露其持有 AMD 空头头寸，而此时美国的相关规定正在进一步收紧。","en":"Hunterbrook 报告指出 AMD 在做空头寸背景下面临对华出口风险\nHunterbrook Media 于 2026 年 11 月 19 日发布的报告显示，被美国列入黑名单的 IEIT Systems 在 2025 年被列入黑名单之后，仍发布了 AMD 固件更新，其关联公司 Aivres 和 Kaytus 也存在类似代码。\nAMD 2025 财年有 22.4% 的收入（77.5 亿美元）来自中国大陆和香港，另有 6700 万美元的授权收入来自被列入黑名单的合资企业，不过目前并未确认存在任何出口违规行为。\nAMD 在承诺回应置评请求后却不再理会 Hunterbrook，股价最多下跌 2.9%；Hunterbrook 披露其持有 AMD 空头头寸，而此时美国的相关规定正在进一步收紧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123454590352081034","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":0,"vw":1738},{"id":"2123453677650559282","h":"yijiangren","ts":1795105783,"zh":"Gate\n这次打新把口碑打出来了\n配售率能到 5%","en":"Gate\n这次打新把口碑打出来了\n配售率能到 5%","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/yijiangren/status/2123453677650559282","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":855},{"id":"2123450078472073262","h":"octopusycc","ts":1795104925,"zh":"一个重点， $ANT 今天收盘后的下一个交易日就会进入NDX","en":"一个重点， $ANT 今天收盘后的下一个交易日就会进入NDX","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/212345007847207 0亿美元募资规模完成史上最大IPO，估值达1.5万亿美元，定价83美元。\n2、涉及标的：Anthropic为未上市转上市AI龙头，代码素材未给出；美股AI方向可参考英伟达（NVDA）；A股对应方向为AI算力与CPO，代表个股中际旭创（300308）与新易盛（300502）。\n3、影响：偏多，强度强，属当日情绪影响，对A股算力与AI应用板块形成情绪提振，但需警惕虹吸效应。\n（二）\n1、事件：据彭博社报道，Anthropic上调IPO发行规模，欧洲散户抢购11亿美元IPO股票，暗盘最高暴涨26%。\n2、涉及标的：Anthropic代码素材未给出；杠杆ETF方向已有20只产品抢跑；A股对应方向为AI应用与云计算，代表个股华胜天成（600410）。\n3、影响：偏多，强度强，属当日情绪影响，全球AI风险偏好回升，对A股云计算与AI应用形成正向传导。\n（三）\n1、事件：据华尔街见闻报道，阿里巴巴2027财年第二季度营收2715.2亿元同比增长10%，云业务收入增长53%，AI资本开支增60%。\n2、涉及标的：阿里巴巴（BABA）；A股对应方向为云计算与算力租赁，代表个股常山北明（000158）与四川长虹（600839）。\n3、影响：偏多，强度中等，属持续性逻辑，云业务高增验证AI需求，对A股算力租赁板块形成中期支撑。\n（四）\n1、事件：据MarketWatch报道，阿里巴巴云业务蓬勃发展，但AI实验室亏损完全抵消了云业务利润。\n2、涉及标的：阿里巴巴（BABA）；A股对应方向为AI应用与云服务，代表个股拓维信息（002261）属华为昇腾概念。\n3、影响：中性偏空，强度中等，属持续性逻辑，AI投入拖累利润的叙事对A股AI应用盈利预期形成压制。\n（五）\n1、事件：据华尔街见闻报道，腾讯三季度WorkBuddy成中国使用量最大AI应用，但元宝不及预期，AI成本大增且现金流转负。\n2、涉及标的：腾讯（TCEHY）；A股对应方向为AI应用与办公软件，代表个股金山办公（688111）为办公软件方向代表。\n3、影响：中性偏空，强度中等，属持续性逻辑，AI投入产出比受质疑，对A股AI应用估值形成压制。\n（六）\n1、事件：据路透社报道，英伟达财报强劲前景未能消除不确定性，股价继续回落，市场对AI交易分歧加大。\n2、涉及标的：英伟达（NVDA）；A股对应方向为CPO与算力硬件，代表个股中际旭创（300308）与新易盛（300502）当日逆势上涨。\n3、影响：偏空，强度较强，属当日情绪影响，英伟达走弱对A股算力链形成压制，但CPO方向当日表现分化。\n（七）\n1、事件：据巴伦周刊报道，英伟达股票被认为是当前最佳交易之一，但存在一个关键隐患。\n2、涉及标的：英伟达（NVDA）；A股对应方向为AI服务器与PCB，代表个股沪电股份（002463）与东山精密（002384）。\n3、影响：中性，强度中等，属持续性逻辑，估值与增长匹配度是核心变量，对A股PCB方向形成间接指引。\n（八）\n1、事件：据巴伦周刊报道，CoreWeave与IREN因英伟达对新云厂商融资释放谨慎信号而下跌。\n2、涉及标的：CoreWeave（CRWV）与IREN（IREN）；A股对应方向为算力租赁，代表个股利通电子（603629）与美利云（000815）。\n3、影响：偏空，强度中等，属当日情绪影响，新云厂商融资收紧对A股算力租赁概念形成负面映射。\n（九）\n1、事件：据路透社报道，美联储理事Waller称美联储需要在通胀应对上更加激进，鹰派表态升温。\n2、涉及标的：标普500指数（SPX）与纳斯达克100指数（NDX）；A股对应方向为贵金属与有色，代表个股紫金矿业（601899）。\n3、影响：偏空，强度较强，属当日情绪影响，加息预期升温压制风险资产，对A股资源与成长板块形成双重压力。\n（十）\n1、事件：据华尔街见闻报道，10月美联储FOMC会议纪要强烈指引12月至少加息25基点，同时为10月未加息找理由。\n2、涉及标的：美国10年期国债收益率方向，对应ETF可参考TLT；A股对应方向为高股息红利，代表个股华能蒙电（600863）。\n3、影响：偏空，强度较强，属持续性逻辑，加息路径明确对全球估值形成压制，红利资产相对抗跌。","en":"今日美股与全球热点二十条\n（一）\n1、事件：据路透社报道，Anthropic以810亿美元募资规模完成史上最大IPO，估值达1.5万亿美元，定价83美元。\n2、涉及标的：Anthropic为未上市转上市AI龙头，代码素材未给出；美股AI方向可参考英伟达（NVDA）；A股对应方向为AI算力与CPO，代表个股中际旭创（300308）与新易盛（300502）。\n3、影响：偏多，强度强，属当日情 倒进去😄","en":"发现很多事情都是信息差智商税\n买那个咖啡液倒到杯子里\n然后再倒入冰镇矿泉水\n直接就是冰美式\n我估计奶茶店 蜜雪 库迪 瑞幸那些\n也都是这么干的\n所以为什么我们要在外卖买了\n然后还要等1小送过来\n而不是自己拿个杯子倒进去😄","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2123416739820240978","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":4,"vw":2369},{"id":"2123416614263775302","h":"cnfinancewatch","ts":1795096946,"zh":"【热点财经新闻 · 晚间】2026年11月19日\n数据源：A股十大财经源 + 英文十大财经源（本次共取用 391 条素材）\n一、今日中国A股热点二十条\n（一）\n1、事件：据新浪财经报道，消息称三星电子计划在CES 2027发布2款人形机器人，机器人产业商业化预期再度升温。\n2、涉及个股：九阳股份（002242）属厨房小家电叠加机器人投资概念，当日涨停；襄阳轴承（000678）属减速器与机器人轴承概念，当日涨停；宇树科技（688836）属人形机器人概念。\n3、影响：偏多，强度中等，属当日情绪影响叠加产业趋势的持续性逻辑，资金沿机器人零部件与整机两条线扩散。\n（二）\n1、事件：据韭研公社报道，马斯克更新Optimus机器人进展，强调手部能力与真实任务验证，华源机器人团队跟进解读。\n2、涉及个股：襄阳轴承（000678）机器人轴承方向，九阳股份（002242）机器人投资方向，柯力传感（603662）为机器人传感器方向代表。\n3、影响：偏多，强度中等，属持续性产业逻辑，灵巧手与传感器环节是资金关注重点，但当日板块内部分化明显。\n（三）\n1、事件：据新浪财经报道，Counterpoint数据显示2025下半年全球智能眼镜出货量同比增长139%，消费电子新品类放量。\n2、涉及个股：立讯精密（002475）为消费电子精密制造代表，歌尔股份（002241）为声学与智能硬件方向代表，板块归属消费电子与AI硬件概念。\n3、影响：偏多，强度中等，属持续性逻辑，智能眼镜放量对光学、声学与整机组装环节形成中期拉动。\n（四）\n1、事件：据新浪财经报道，互联网行业2027年AI展望提出双寡头格局定调ARR稳健放量，Agent-Infra成破局迭代主线。\n2、涉及个股：华胜天成（600410）属云计算与网络安全概念，常山北明（000158）属算力租赁与华为盘古概念，四川长虹（600839）属华为欧拉概念。\n3、影响：偏多，强度中等，属持续性逻辑，Agent基础设施方向对算力租赁与云服务板块形成中期支撑。\n（五）\n1、事件：据韭研公社报道，东吴电子陈海进指出海外通道收紧、国产替代提速，继续强call国产算力。\n2、涉及个股：海光信息（688041）属中国AI 50与芯片概念，拓维信息（002261）属华为昇腾概念，真视通（002771）属液冷算力概念当日三连板。\n3、影响：偏多，强度较强，属持续性逻辑，国产算力是本轮资金主线之一，但海光信息当日下跌显示高位分歧。\n（六）\n1、事件：据东方财富报道，海外利空激发国产替代，先进封装概念走强，半导体自主可控方向获资金追捧。\n2、涉及个股：江化微（603078）属光刻胶与湿电子化学品概念当日涨停，西陇科学（002584）属光刻胶与氟化工概念，有研新材（600206）属国家大基金持股概念。\n3、影响：偏多，强度较强，属当日情绪影响叠加持续性逻辑，材料与封装环节是国产替代最直接受益方向。\n（七）\n1、事件：据韭研公社报道，华辰装备光刻机镜片磨床石锤出货，长春光机所合资叠加华字辈铲子股进入兑现期。\n2、涉及个股：华辰装备（300809）属光刻机镜片磨床方向，华微电子（600360）被官媒点名功率半导体专用光刻方向，西陇科学（002584）属光刻胶概念。\n3、影响：偏多，强度中等，属当日情绪影响，光刻环节题材属性强，兑现节奏需跟踪订单落地。\n（八）\n1、事件：据新浪财经报道，14只基金扛住市场震荡，押注半导体国产替代主线，基金调仓方向明确。\n2、涉及个股：中芯国际（688981）与华虹公司（688347）当日大涨，属晶圆代工方向；长鑫科技（688981除外，代码未在素材中给出）回购方案上调至最高50亿元。\n3、影响：偏多，强度中等，属持续性逻辑，机构资金在缩量市中向半导体集中，形成结构性抱团。\n（九）\n1、事件：据华尔街见闻报道，长鑫科技大幅上调回购金额至最高50亿元，回购价格不超过63.78元每股。\n2、涉及个股：长鑫科技为存储芯片方向代表，属半导体板块；同方向可关注有研新材（600206）与江化微（603078）。\n3、影响：偏多，强度中等，属持续性逻辑，大额回购对存储产业链情绪形成支撑，但个股代码素材未给出需注意。\n（十）\n1、事件：据新浪财经报道，英伟达澄清新云厂商融资担保规则，称担保有生效条件，后续筛选对象将更加审慎。\n2、涉及个股：利通电子（603629）属英伟达概念与OLED概念，中际旭创（300308）属CPO概念，新易盛（300502）属CPO与5G概念。\n3、影响：偏空，强度中等，属当日情绪影响，算力租赁与CPO板块午后承压，共进股份（603118）当日跌停。","en":"【热点财经新闻 · 晚间】2026年11月19日\n数据源：A股十大财经源 + 英文十大财经源（本次共取用 391 条素材）\n一、今日中国A股热点二十条\n（一）\n1、事件：据新浪财经报道，消息称三星电子计划在CES 2027发布2款人形机器人，机器人产业商业化预期再度升温。\n2、涉及个股：九阳股份（002242）属厨房小家电叠加机器人投资概念，当日涨停；襄阳轴承（000678）属减速器与机器人轴承概念，当日涨停；宇树科技（688836）属人形机器人概念。\n3、影响：偏多，强度中等，属当日情绪影响叠加产业趋势的持续性逻辑，资金沿机器人零部件与整机两条线扩散。\n（二）\n1、事件：据韭研公社报道，马斯克更新Optimus机器人进展，强调手部能力与真实任务验证，华源机器人团队跟进解读。\n2、涉及个股：襄阳轴承（000678）机器人轴承方向，九阳股份（002242）机器人投资方向，柯力传感（603662）为机器人传感器方向代表。\n3、影响：偏多，强度中等，属持续性产业逻辑，灵巧手与传感器环节是资金关注重点，但当日板块内部分化明显。\n（三）\n1、事件：据新浪财经报道，Counterpoint数据显示2025下半年全球智能眼镜出货量同比增长139%，消费电子新品类放量。\n2、涉及个股：立讯精密（002475）为消费电子精密制造代表，歌尔股份（002241）为声学与智能硬件方向代表，板块归属消费电子与AI硬件概念。\n3、影响：偏多，强度中等，属持续性逻辑，智能眼镜放量对光学、声学与整机组装环节形成中期拉动。\n（四）\n1、事件：据新浪财经报道，互联网行业2027年AI展望提出双寡头格局定调ARR稳健放量，Agent-Infra成破局迭代主线。\n2、涉及个股：华胜天成（600410）属云计算与网络安全概念，常山北明（000158）属算力租赁与华为盘古概念，四川长虹（600839）属华为欧拉概念。\n3、影响：偏多，强度中等，属持续性逻辑，Agent基础设施方向对算力租赁与云服务板块形成中期支撑。\n（五）\n1、事件：据韭研公社报道，东吴电子陈海进指出海外通道收紧、国产替代提速，继续强call国产算力。\n2、涉及个股：海光信息（688041）属中国AI 50与芯片概念，拓维信息（002261）属华为昇腾概念，真视通（002771）属液冷算力概念当日三连板。\n3、影响：偏多，强度较强，属持续性逻辑，国产算力是本轮资金主线之一，但海光信息当日下跌显示高位分歧。\n（六）\n1、事件：据东方财富报道，海外利空激发国产替代，先进封装概念走强，半导体自主可控方向获资金追捧。\n2、涉及个股：江化微（603078）属光刻胶与湿电子化学品概念当日涨停，西陇科学（002584）属光刻胶与氟化工概念，有研新材（600206）属国家大基金持股概念。\n3、影响：偏多，强度较强，属当日情绪影响叠加持续性逻辑，材料与封装环节是国产替代最直接受益方向。\n（七）\n1、事件：据韭研公社报道，华辰装备光刻机镜片磨床石锤出货，长春光机所合资叠加华字辈铲子股进入兑现期。\n2、涉及个股：华辰装备（300809）属光刻机镜片磨床方向，华微电子（600360）被官媒点名功率半导体专用光刻方向，西陇科学（002584）属光刻胶概念。\n3、影响：偏多，强度中等，属当日情绪影响，光刻环节题材属性强，兑现节奏需跟踪订单落地。\n（八）\n1、事件：据新浪财经报道，14只基金扛住市场震荡，押注半导体国产替代主线，基金调仓方向明确。\n2、涉及个股：中芯国际（688981）与华虹公司（688347）当日大涨，属晶圆代工方向；长鑫科技（688981除外，代码未在素材中给出）回购方案上调至最高50亿元。\n3、影响：偏多，强度中等，属持续性逻辑，机构资金在缩量市中向半导体集中，形成结构性抱团。\n（九）\n1、事件：据华尔街见闻报道，长鑫科技大幅上调回购金额至最高50亿元，回购价格不超过63.78元每股。\n2、涉及个 ","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":1833},{"id":"2123414290539610468","h":"ShanghaoJin","ts":1795096392,"zh":"我学到了一个有意思的名字叫 Daroio","en":"我学到了一个有意思的名字叫 Daroio","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2123414290539610468","l":[],"ln":[],"t":[],"lk":22,"rt":0,"rp":8,"vw":4626},{"id":"2123412731739127834","h":"qinbafrank","ts":1795096021,"zh":"美国对中国AI技术管制与封锁三板斧：\n1）芯片出口管制和BIS新出台的远程算力访问新规；\n2）昨天美中经济与安全审查委员会正式发布《2026 年年度报告》。其中第八章围绕中美 AI 技术竞争展开，并通过第 18—20 条政策建议，提出限制中国开放权重 AI 模型在美国敏感领域的部署、要求披露中国 AI 模型的使用情况（配图1）\n3）限制中国先进制程芯片在台积电和三星的流片。\n看今天路透报道台积电和三星已通知部分中国客户在向美国商务部工业与安全局（BIS）申请出口许可证期间，暂停特定处理器的出货。原因是美国商务部BIS于11月19日生效的临时最终规则（Interim Final Rule，文件号2026-23529）。现在相关先进逻辑芯片被推定为受控（需许可证），除非设计商在美国批准名单上。先进制程（尤其是16nm及以下）面向中国客户/设计商的流片与出货，目前处于“先暂停、等许可证”状态。（见图二）\n至此三板斧都已经砍下来：\n第一板斧卡先进芯片/服务器和远程算力访问，让你拿不到先进算力；\n第二板斧卡中国开源模型在美国的采用，卡住全球采用和削弱影响力；\n第三板斧卡中国自研芯片，能设计先进制程芯片但不能流片，制造受阻；\n三板斧环环相扣，川普晚上才刚从深圳离开。\n这里有特别值得说的一点：16号美国商务部工业与安全局（BIS）发布的远程算力访问新规，官方明确说到这项规则由美国财政部和白宫国家安全委员会指导并起草，由商务部BIS署名对外发布，这在出口管制规则里比较少见。意味着远程算力访问新规其实是贝森特和鲁比奥主导，倒闭卢特尼克去推动落实。\n这一次中期选举的结果、以及“倒黄”时间无一不透露着、前几天这里\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"美国对中国AI技术管制与封锁三板斧：\n1）芯片出口管制和BIS新出台的远程算力访问新规；\n2）昨天美中经济与安全审查委员会正式发布《2026 年年度报告》。其中第八章围绕中美 AI 技术竞争展开，并通过第 18—20 条政策建议，提出限制中国开放权重 AI 模型在美国敏感领域的部署、要求披露中国 AI 模型的使用情况（配图1）\n3）限制中国先进制程芯片在台积电和三星的流片。\n看今天路透报道台积电和三星已通知部分中国客户在向美国商务部工业与安全局（BIS）申请出口许可证期间，暂停特定处理器的出货。原因是美国商务部BIS于11月19日生效的临时最终规则（Interim Final Rule，文件号2026-23529）。现在相关先进逻辑芯片被推定为受控（需许可证），除非设计商在美国批准名单上。先进制程（尤其是16nm及以下）面向中国客户/设计商的流片与出货，目前处于“先暂停、等许可证”状态。（见图二）\n至此三板斧都已经砍下来：\n第一板斧卡先进芯片/服务器和远程算力访问，让你拿不到先进算力；\n第二板斧卡中国开源模型在美国的采用，卡住全球采用和削弱影响力；\n第三板斧卡中国自研芯片，能设计先进制程芯片但不能流片，制造受阻；\n三板斧环环相扣，川普晚上才刚从深圳离开。\n这里有特别值得说的一点：16号美国商务部工业与安全局（BIS）发布的远程算力访问新规，官方明确说到这项规则由美国财政部和白宫国家安全委员会指导并起草，由商务部BIS署名对外发布，这在出口管制规则里比较少见。意味着远程算力访问新规其实是贝森特和鲁比奥主导，倒闭卢特尼克去推动落实。\n这一次中期选举的结果、以及“倒黄”时间无一不透露着、前几天这里\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXff9nzacAAqVta.jpg? Q买入\n$KDK 约53.64万美元，ARKG买入 $TWST 约32.99万美元，ARKK买入 $WGS 约22.44万美元，ARKG买入\n$SCTX 约16.21万美元，权重已经降档。加仓榜上新出现 $CRCL\n，也是单基金记录，再叠加USDC在非洲推进的多年协议，事件权重一般，不进名单。周一 $SPCX 、 $XYZ 、 $SHOP\n的同买还在，位置仍没有走到右侧。\n带方向的期权里，干净的多头并不多。 $ESTC\n最大Call行权价85，距周三收盘83.01约2.35%，量仓比2.72，成交527张，Call成交放量646.5%，P/C成交比0.06，这项是清楚的，但要跟K线位置一起看。\n#苹果 期权已经转弱，不能再按多头共振去理解。 #梯瓦制药 P/C成交比0.13，只算一项偏多。 $FPS\n的P/C成交比0.09虽然偏多，但最大Call行权价24距现价已有10.6%，量仓比只有0.79，仓单变化还没有基线，构不成带方向的期权共振；内部人CAO买入3000股，金额很小，只能降权记录。\n$NVDA 最大Call行权价160量仓比4.54，同时最大Put行权价150量仓比1.87，多空都在放量，股价又砸回区间底部。 $MSFT\n最大Call行权价420量仓比3.51、P/C成交比0.22，只作为记录。\n#期货\n周三完整交易日：标普迷你成交量约226万手、量比1.13，OI增约1.07万手，OI在增加但量能未明确确认，暂不定性。纳指迷你成交量约96万手、量比1.19，OI降约5415手，价涨OI降，属空头回补。微型标普OI降约2801手，同样是价涨OI降，属空头回补。10年期美债期货量比0.95，OI降约8.36万手，价跌OI降，属多头离场。原油量比0.81、OI大幅增加约15.0万手，价跌且量能未确认，暂不定性。黄金量比0.42、OI降约1.58万手，价跌OI降，属多头离场，而且是缩量的。白银和铜的成交量口径降级，周三公开日线分别收跌约4.84%和约5.30%，按价跌、持仓下降更接近多头离场，不能按价涨去写成空头回补。今晚盘前期指比下午更强，原油回到约83.16、黄金跌到约3717，这笔股指反弹要看今晚常规交易能否站住，盘前还不能说已经出现新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨8.60%、 $FIW 涨7.73%、 $PHO 涨7.58%、 $ITB 涨7.03%、 $IHI\n涨6.50%、 $UNG 涨6.42%、 $XHB 涨5.39%、 $AGNG 涨4.82%、 $XLP 涨4.67%、 $IHE\n涨4.15%、 $XLU 涨3.69%。5日窗口只剩下 $UNG 涨3.82%还在比较明显的正值， $XLP\n已经翻到跌0.30%。天然气是目前唯一双窗口同现的品种，但 $UNG\n距20日高只差0.75%，位置95%，量比不足1，已经走在上沿，慎追。必选消费从双窗口变成仅20日， $XLP\n距20日高2.52%。水业、住宅建筑、医疗器械都是仅20日，而且五日已经转弱； $ITB\n距20日高10.54%，行业ETF在回调。半导体双窗口都更弱， $SOXX\n20日跌16.62%、5日跌8.72%。A股这边以今日收盘计，消费ETF20日涨约8.56%、5日涨约2.90%，银行ETF20日涨约6.03%、5日涨约3.39%，酒ETF20日涨约8.91%、5日涨约1.38%，消费和银行仍是双窗口同现，但已经走到20日区间90%以上，映射还在，位置高了，不追。住宅建筑美股仅20日，A股房地产ETF20日跌约7.75%，映射没有启动。医疗这边对不齐：\n$IHI 仅20日、5日跌2.20%，A股纳指生物科技ETF20日涨2.31%、5日跌7.82%，创新药ETF双窗口都是负的。芯片A股今日收涨约1.1%，20日仍跌约3.6%，和美股\n$SOXX 一样构不成共振。美股今晚没有新的完整日线，这组窗口与下午相同，结论也不改。\n#三个方向\n一是 #大盘消费科技龙头 ，只认 #苹果 这种低波动、仍靠近前高的品种，期权这轮没有转强，仓位继续克制，不突破不进。二是 #必选消费\n，中美映射还在，但美股五日已经翻绿， $TJX 把箱底一次走完， $WMT\n财报虽然略超预期并上调指引，位置却在区间中上部，只作为防守框架，不在这里追高开仓。三是 #制药与医疗器械 观察， $IHI 、 $IHE\n都是仅20日回调， $TEVA 和 $CGON 有事件加分但位置都在区间中部，都不追。软件和电气设备今晚不单列方向。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.69失效，半仓。晚间原邮件给的失效位是周线十日均线345.08，更为宽松 不齐：\n$IHI 仅20日、5日跌2.20%，A股纳指生物科技ETF20日涨2.31%、5日跌7.82%，创新药ETF双窗口都是负的。芯片A股今日收涨约1.1%，20日仍跌约3.6%，和美股\n$SOXX 一样构不成共振。美股今晚没有新的完整日线，这组窗口与下午相同，结论也不改。\n#三个方向\n一是 #大盘消费科技龙头 ，只认 #苹果 这种低波动、仍靠近前高的品种，期权这轮没有转强，仓位继续克制，不突破不进。二是 #必选消费\n，中美映射还在，但美股五日已经翻绿， $TJX 把箱底一次走完， $WMT\n财报虽然略超预期并上调指引，位置却在区间中上部，只作为防守框架，不在这里追高开仓。三是 #制药与医疗器械 观察， $IHI 、 $IHE\n都是仅20日回调， $TEVA 和 $CGON 有事件加分但位置都在区间中部，都不追。软件和电气设备今晚不单列方向。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.69失效，半仓。晚间原邮件给的失效位是周线十日均线345.08，更为宽松，这里仍用更近的20日均线。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123411814927192551","l":[],"ln":[],"t":["美股","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":1,"vw":216},{"id":"2123411806077198489","h":"cnfinancewatch","ts":1795095800,"zh":"美股盘前晚间版｜2026年11月19日 周四 北京时间21:00\n#结论\n今日大类只做两个：大盘消费科技龙头，以及暂时只作为防守框架的必选消费。只做名单仍只给一只，第二、第三个位置空着。用周三完整日线核下来，能同时过位置的还是靠近前高的苹果。晚间原邮件把\n$ESTC 和 $FPS 放到只做前两位，并给ESTC记了箱底放量阳和Call共振，但独立核验后，这两只都还不能进只做。\n #苹果 $AAPL 周三收352.45，涨0.15%，距20日高也是52周高360.83还有2.38%，处在近20日区间76%的位置。仍按回撤后的突破准备来看，不突破不进。期权没有转强：最大Call行权价360，距现价2.14%，量仓比只有0.68，Call持仓减仓7.0%，P/C成交比0.98、持仓比1.19，资金面未形成共振。13F机构持股76.82%、Fmr增持，不能单独算共振。卖方目标价均值343.2仍低于现价，只给半仓。本档未能从公开源核到可靠的苹果盘前报价，先按周三收盘位置处理。\n明确不做：半导体和AI硬件不改回主方向。 #英伟达 $NVDA\n周三收150.96，跌2.89%，几乎砸回20日低点148.80附近，位置大约只有3%。有报道称盘前反弹约1.5%，改变不了这根长阴，要等常规交易。\n$ESTC 是软件不是医疗器械， $FPS 是电气设备，不能拿 $IHI\n的框架给这两只开仓；已经大涨或五日涨幅过大的、只有股息没有资金共振的、ARK同买但还在下跌并收在区间最低的，先观察不追。\n#消息面\n截至北京时间21时出头，美股期指比下午见到的位置更强一点。纳指期货约27793，较周三收盘27186.75涨约2.23%；标普期货约7432，较周三7340.50涨约1.25%；道指期货约50591，涨约0.63%。下午15时附近纳指期货大约还在27723、涨约1.97%，这几个小时里纳指端又抬了一截。周三美股分化收盘没有变：纳指24429.88，涨0.42%；标普7323.63，跌0.23%；道指50198.17，跌1.11%，道指和标普都是五连跌。VIX收24.56，10年期美债收益率收5.066%，美元指数收103.86，仍靠近近期高位。这三项本档未核到盘前最新报价。\nA股和港股已经收盘：上证3577.62跌0.28%，深证10583.20跌0.71%，创业板2293.34跌0.79%，科创50收1270.78，涨1.83%；中证1000跌1.88%。恒生约22833点，跌约1.98%；恒生科技约3648点，跌约2.36%。日经225今日收59444.21，涨0.71%；韩国综指收约5107点，涨约0.78%。\n盘前最重要的新信息是零售和中概财报落地，以及Anthropic即将上市。 #沃尔玛 $WMT\n财政三季度营收1888.4亿美元，高于约1872.7亿的预期；调整后每股收益0.65美元，略高于0.64美元。公司第三次上调全年指引：净销售增长4.9%到5.2%，调整后每股收益2.84到2.89美元，调整后营业利润增长8.0%到8.6%。全球电商增17%，美国可比销售不含燃油增2.9%。但公开盘前报价并不一致，有报道称股价在126.5美元一带小幅低开。\n$WMT 周三收127.36，处在区间68%，距20日高3.50%，本来就不是箱底也不是突破准备，财报再好也不拿盘前去填只做。\n #阿里巴巴 $BABA 9月季度营收2715.2亿元，同比增10%，略超预期；调整后净利润199.1亿元，低于约266.1亿的预期，调整后每股美国存托凭证收益8.10元，低于约10.75元。阿里云相关收入609.7亿元，同比增53%，但自由现金流转为流出344.7亿元。周三已经收在84.37，跌2.63%，几乎贴着20日低点，位置只有0.6%。有报道称盘前先拉后砸，这种位置先看常规交易，不抄下跌中的缺口。\n $PDD 三季度营收1083亿元，同比持平，低于约1152亿的预期；调整后每股美国存托凭证收益21.04元，高于约18.54元，非公认会计准则营业利润326亿元，也高于预期。利润主要来自销售费用下降，交易服务收入同比减12%。有报道称盘前一度涨7%到9%。周三收77.45，位置大约13%，即使跳空也不等于已经突破，完整日线确认后再看。\nAnthropic定价每股83美元，发行9.80亿股A类股，有报道按充分稀释估值约1.5万亿美元，今晚以 $ANT\n在纳斯达克挂牌，北京时间22:30才开始常规交易，截稿时还没有可写的公开成交价。这是外部扰动，先看上市后的交易，不把它映射成现有AI硬件的买点。\n #帕洛阿尔托 $PANW 下午已经写过一季报超预期。晚间补上的是：全年营收指引上调到145.2亿到145.7亿美元，此前是141.0亿到142.0亿美元，并宣布以约45亿美元收购Applied\nCompute。周三常规交易收339.92，涨9.90%，处在区间37%，距20日高还有19.70%。盘后和盘前都有继续走高的报道，要用今晚完整日线看缺口能否站住，不提前写入只做。有报道称\n#英伟达 盘前约涨1.5%， #超威 $AMD 约涨2.9%，都要等常规交易。\n高权重事件里，位置多数没有改善。 #梯瓦制药 $TEVA\n的IGALMI已获FDA批准，期权P/C成交比0.13偏多，但周三收42.23，跌0.92%，距20日高44.57还有5.54%，处在区间57%，是中部不是突破，只观察。\n$CGON 膀胱癌三期PIVOT-006达主要终点，周三收80.00，涨1.34%，处在区间59%，距20日高17.44%，也不够。\n$ACM 积压订单创纪录280亿美元，但20日已经涨38.48%、五日涨17.27%，周三收82.38，处在区间93%，短线已经伸展，不追。","en":"美股盘前晚间版｜2026年11月19日 周四 北京时间21:00\n#结论\n今日大类只做两个：大盘消费科技龙头，以及暂时只作为防守框架的必选消费。只做名单仍只给一只，第二、第三个位置空着。用周三完整日线核下来，能同时过位置的还是靠近前高的苹果。晚间原邮件把\n$ESTC 和 $FPS 放到只做前两位，并给ESTC记了箱底放量阳和Call共振，但独立核验后，这两只都还不能进只做。\n #苹果 $AAPL 周三收352.45，涨0.15%，距20日高也是52周高360.83还有2.38%，处在近20日区间76%的位置。仍按回撤后的突破准备来看，不突破不进。期权没有转强：最大Call行权价360，距现价2.14%，量仓比只有0.68，Call持仓减仓7.0%，P/C成交比0.98、持仓比1.19，资金面未形成共振。13F机构持股76.82%、Fmr增持，不能单独算共振。卖方目标价均值343.2仍低于现价，只给半仓。本档未能从公开源核到可靠的苹果盘前报价，先按周三收盘位置处理。\n明确不做：半导体和AI硬件不改回主方向。 #英伟达 $NVDA\n周三收150.96，跌2.89%，几乎砸回20日低点148.80附近，位置大约只有3%。有报道称盘前反弹约1.5%，改变不了这根长阴，要等常规交易。\n$ESTC 是软件不是医疗器械， $FPS 是电气设备，不能拿 $IHI\n的框架给这两只开仓；已经大涨或五日涨幅过大的、只有股息没有资金共振的、ARK同买但还在下跌并收在区间最低的，先观察不追。\n#消息面\n截至北京时间21时出头，美股期指比下午见到的位置更强一点。纳指期货约27793，较周三收盘27186.75涨约2.23%；标普期货约7432，较周三7340.50涨约1.25%；道指期货约50591，涨约0.63%。下午15时附近纳指期货大约还在27723、涨约1.97%，这几个小时里纳指端又抬了一截。周三美股分化收盘没有变：纳指244 media/HXfdvM7bkAAa6Me.jpg?name=orig"],"u":"https://x.com/xiaomustock/status/2123409559389933622","l":[],"ln":[],"t":[],"lk":26,"rt":1,"rp":11,"vw":10977},{"id":"2123407523416076398","h":"tychozzz","ts":1795094779,"zh":"Anthropic 今晚就要上市了，人类历史上最大的 IPO。\n认购价是 83，而暗盘价格已经到了 100 上方。尽管最近大盘跌了不少，但 Anthropic IPO 的情绪还是非常高。\n对于很多准备今天现价买入的朋友来说，一定要清楚什么时候离场。我感觉 ANT 很有可能会像 SpaceX 一样，IPO 前几天冲高，后面几周开始回落，甚至最后暴跌破发，一切皆有可能。\nIPO 之后的半年时间里，有几个比较关键的时间节点，给大家梳理一下。\n上市的第一天，非创始人的董事、高管和员工就可以卖掉手里 10% 的股份，对于股价绝对是潜在的卖压。\n12 月 10 号左右，也就是上市后的第 15 个交易日，ANT 大概率会被纳入纳斯达克 100 指数，这是今年 5 月出来的新规定，SpaceX 就是这样在上市后不到一个月被纳入的。这是利好，被动资金买入会带来一波支撑，但可能也是短期利好出尽的信号。\n12 月 15 号，上市后第 27 天，持股 0.5% 以下的其他老股东开始解禁第一批 6%。之后 1 月 5 号再解禁 6%，1 月 19号 7%，2 月 2 号 7%。每一批量不大，但会持续给股价带来卖压。按照我自己的投资风格来看，这个阶段肯定是不碰了，风险盈亏比都不站在我们散户这边。\n明年 2 到 3 月，第一份年度财报，具体日期还没公布，这是最关键的一个节点。财报发布后第二个交易日，员工再解禁 35%，小股东再解禁 12.5%，之后每两周左右再放 9.5%。有分析估计财报后两天内最多可能有 17 亿股解禁，这是整个解禁表里最大的一次。\n这里一方面是关注财报本身的数据，另一方面是解禁相关的利空，二者可能会有相互抵消，这得结合到时候股价的具体情况来分析。如果这个时候 ANT 破发，我觉得会是很不错的买入时机。\n我们也可以看看几个月前 SpaceX 走过的路，发行价 135，第三天盘中最高涨到 225，7 月份就跌破发行价，8 月出现阶段性低点，其实整个过程还是很快的，留给高位出货的时间很短暂。\nAnthropic 也可能会遇到类似的情况，还是得谨慎一些。不过把时间拉长来看，我认为 Anthropic 是最值得投资的 AI 标的，应该也会是我未来长期的 AI 核心仓位。这段时间最重要的还是耐心，等一个好的点位建仓买入。\n📈 投资美股用 BIT，稳定币直接入金，持有真实股票，终身免佣，丝滑交易美股。","en":"Anthropic 今晚就要上市了，人类历史上最大的 IPO。\n认购价是 83，而暗盘价格已经到了 100 上方。尽管最近大盘跌了不少，但 Anthropic IPO 的情绪还是非常高。\n对于很多准备今天现价买入的朋友来说，一定要清楚什么时候离场。我感觉 ANT 很有可能会像 SpaceX 一样，IPO 前几天冲高，后面几周开始回落，甚至最后暴跌破发，一切皆有可能。\nIPO 之后的半年时间里，有几个比较关键的时间节点，给大家梳理一下。\n上市的第一天，非创始人的董事、高管和员工就可以卖掉手里 10% 的股份，对于股价绝对是潜在的卖压。\n12 月 10 号左右，也就是上市后的第 15 个交易日，ANT 大概率会被纳入纳斯达克 100 指数，这是今年 5 月出来的新规定，SpaceX 就是这样在上市后不到一个月被纳入的。这是利好，被动资金买入会带来一波支撑，但可能也是短期利好出尽的信号。\n12 月 15 号，上市后第 27 天，持股 0.5% 以下的其他老股东开始解禁第一批 6%。之后 1 月 5 号再解禁 6%，1 月 19号 7%，2 月 2 号 7%。每一批量不大，但会持续给股价带来卖压。按照我自己的投资风格来看，这个阶段肯定是不碰了，风险盈亏比都不站在我们散户这边。\n明年 2 到 3 月，第一份年度财报，具体日期还没公布，这是最关键的一个节点。财报发布后第二个交易日，员工再解禁 35%，小股东再解禁 12.5%，之后每两周左右再放 9.5%。有分析估计财报后两天内最多可能有 17 亿股解禁，这是整个解禁表里最大的一次。\n这里一方面是关注财报本身的数据，另一方面是解禁相关的利空，二者可能会有相互抵消，这得结合到时候股价的具体情况来分析。如果这个时候 ANT 破发，我觉得会 安全局表示，使用美国技术生产先进芯片的芯片制造商，若销售最终运往中国客户的产品，必须申请许可证。\n新规切断了中国芯片设计公司此前利用台积电和三星代工生产对 AI 数据中心至关重要的高性能芯片的途径。\n据两位知情人士透露，台积电和三星也已通知消费电子客户，它们已暂停发货。","en":"FT：台积电和三星暂停向部分中国客户发货芯片\n暂停发生在美国商务部出台新出口管制之后\n据多位知情人士透露，这两家芯片制造商近日已告知中国客户，将暂停某些处理器的发货，同时向美国商务部申请许可证。\n周一，负责监管敏感技术的美国商务部下属机构工业与安全局表示，使用美国技术生产先进芯片的芯片制造商，若销售最终运往中国客户的产品，必须申请许可证。\n新规切断了中国芯片设计公司此前利用台积电和三星代工生产对 AI 数据中心至关重要的高性能芯片的途径。\n据两位知情人士透露，台积电和三星也已通知消费电子客户，它们已暂停发货。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXe1zX2awAAJHf0.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123366097571492217","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":0,"rt":0,"rp":0,"vw":1148},{"id":"2123365738186690903","h":"octopusycc","ts":1795084816,"zh":"只是做了一些微小的工作，谢谢大家\n未来财报工作 大的节点 也会持续做下去\n@yuyue_chris 也是我们这一批币圈里转型美股里做美股做的最好最敏捷的\n完全没有韭菜盲目抄底的惯性思维，很多Catalyst也抓得很准；其实补齐了我对于抓反弹趋势的视角。\n6月以来，几乎每个趋势节点，我们都会进行充分的讨论。当观点共振的时候，正确率也陡然上升。\n未来这些共振时刻也会在推文中额外标注。\n能够完全顶住整个抄底的惯性思维而自产交易思路的人都是值得关注的。","en":"只是做了一些微小的工作，谢谢大家\n未来财报工作 大的节点 也会持续做下去\n@yuyue_chris 也是我们这一批币圈里转型美股里做美股做的最好最敏捷的\n完全没有韭菜盲目抄底的惯性思维，很多Catalyst也抓得很准；其实补齐了我对于抓反弹趋势的视角。\n6月以来，几乎每个趋势节点，我们都会进行充分的讨论。当观点共振的时候，正确率也陡然上升。\n未来这些共振时刻也会在推文中额外标注。\n能够完全顶住整个抄底的惯性思维而自产交易思路的人都是值得关注的。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2123365738186690903","l":[],"ln":[],"t":["美股","财报"],"lk":2,"rt":0,"rp":2,"vw":1240},{"id":"2123365627805172111","h":"octopusycc","ts":1795084790,"zh":"仅在第四季度下降","en":"only down in q4","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/octopusycc/status/2123365627805172111","l":[],"ln":[],"t":[],"lk":7,"rt":1,"rp":2,"vw":1147},{"id":"2123364908096237959","h":"CrushTheShorts","ts":1795084618,"zh":"长鑫第一版发回购是 10 月 30 号，收盘54 块，又跌了半个月到 37， 再上修回购金额\n毕竟才上市几个月，人家ipo融资是8.66 块融的，现在三四十的价格回购，也算是有诚意了\n大 A 如果多点这样的公司，何至于此？","en":"长鑫第一版发回购是 10 月 30 号，收盘54 块，又跌了半个月到 37， 再上修回购金额\n毕竟才上市几个月，人家ipo融资是8.66 块融的，现在三四十的价格回购，也算是有诚意了\n大 A 如果多点这样的公司，何至于此？","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXe1IKYbgAAPg4g.jpg?name=orig"],"u":"https://x.com/CrushTheS 克和《纽约时报》的主持人 Andrew 连线聊了 47 分钟。\n1. Anthropic 可能再租 10 GW 算力\n马斯克判断，Anthropic 大概率会继续租用 SpaceX 的算力，追加规模可能达到 10 GW。按他的说法，现有协议可以提前约 3 至 6 个月通知终止。\n跟 Anthropic 的员工打过交道后，他对这个团队改观了。他说这些人有原则、肯干，还专门夸了 Opus 和 Fable。\n2. SpaceX 和 Tesla 合并，马斯克现在觉得有价值\nTesla 在做自动驾驶和 Optimus，SpaceX 有大模型、算力基础设施和芯片研发。两家在 AI 上能一起做的事比 5 年前多了。他甚至认为，未来大部分超级智能的算力可能部署在太空轨道上。\n合并最终得双方股东点头。马斯克也说，他自己的 Tesla 股票奖励应该按公司的经营和估值目标来兑现。\n3. Cybertruck 给 Cybercab 腾产能\nCybertruck 计划在 2027 年年中逐步停产。马斯克说，平均每辆车约有 1.2 名乘客，双座 Cybercab 就能覆盖约 90% 的乘客出行里程。\n多人出行怎么办？Tesla 计划做一款 6 至 7 座、没有方向盘和踏板的自动驾驶版 Model Y，量产时间还没公布。\n4. Starlink 手机直连，接下来要解决室内信号\n第 2 代手机直连卫星计划从 2027 年起发射，带宽预计是第 1 代的约 40 倍。SpaceX 还计划在 2027 年量产使用 800 MHz 频段的屋顶微型基站，补上室内覆盖。\n马斯克认为，AI 和机器人会带来更多通信需求，AT&T 和 Verizon 依然有生意做。他也希望用 Starlink 的收入继续支持 Starship。\n5. 换掉黄仁勋，像连胜球队送走巅峰期的乔丹\n马斯克觉得，黄仁勋最难替代的地方，是几十年积累下来的供应商关系，以及核心员工对他的信任。他说自己当然愿意聘请黄仁勋，也判断对方眼下无意找工作。\n6. 中期选举花了数亿美元，重来一次会少捐\n如果 MAGA 意味着无条件支持共和党，马斯克说自己拒绝这个标签。他说，这次花了数亿美元支持共和党候选人，结果远低于预期，重来一次会少捐 😅\n他希望共和党守住参议院多数席位，理由是美国需要两党互相制衡。\n7. Starlink 全面停服，乌克兰前线可能迅速崩溃\n这是马斯克的判断。他说，Starlink 应用于民用通信，进攻性军事用途应交给 Starshield，相关决策由美国军事指挥体系负责。至于塞瓦斯托波尔，他给出的解释是，当地当时受制裁，Starlink 服务原本就没开通。\nBuy the dip，长期持有，Discord在个人资料","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2123311336134484359","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":2,"vw":511},{"id":"2123310347385753702","h":"ReutersChina","ts":1795071610,"zh":"在华盛顿宣布新的高性能半导体出货限制后，贸易部长佐哈里·阿卜杜勒·加尼周三表示，马来西亚的数据中心运营商应遵守美国对先进人工智能芯片的新限制。","en":"Malaysia's data centre operators should comply with new US restrictions on advanced artificial intelligence chips, Trade Minister Johari Abdul Ghani said on Wednesday after Washington announced fresh curbs on shipments of high-performance semiconductors.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123310347385753702","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/business/finance/malaysia-says-data-centres-must-comply-with-us-ai-chip-rules-2026-11-18/?taid=6afe9e7a4f7b1a0001e4aee7&ut
