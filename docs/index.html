自的危机：市场崩溃、战争、经济衰退、通货膨胀、政治动荡和无尽的负面新闻。然而，从长远来看，股市总是呈上升趋势。\n如果你总是等待世界和平、经济繁荣和绝对稳定的最佳投资时机，那么你要么永远等待，要么最终在市场高峰时买入。危机总是存在，忧虑也总是有理由的。\n市场低迷只是长期增长的入场券。如果你想取得长远的成功，你就必须忍受这段旅程。历史表明，在其他人感到恐惧时继续投入资金的投资者的表现始终优于那些观望而不扣动扳机的投资者。\n成功的投资者获得回报不是通过完美地把握市场时机，而是通过耐心和纪律。\n- 雷伊","en":"Every generation faces its share of crises: market crashes, wars, recessions, inflation, political upheaval, and endless negative news. Yet the stock market always trends upward over the long run.\nIf you are always waiting for the perfect moment to invest when there is world peace, economic prosperity, and absolute stability, you will either wait forever or end up buying right at the market peak. There are always crises, and there are always reasons to worry.\nMarket downturns are simply the entry ticket to long-term growth. If you want to succeed in the long run, you have to endure the journey. History shows that investors who keep putting money in while others are fearful consistently outperform those who wait on the sidelines and never pull the trigger.\nSuccessful investors reap rewards not by timing the market perfectly, but through patience and discipline.\n- LEI","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/TheMarketMemo/status/2125468499887931526","l":[],"ln":[],"t":["通胀"],"lk":66,"rt":3,"rp":5,"vw":4471},{"id":"2125467262627012845","h":"dmjk001","ts":1795585859,"zh":"转，靠谱性尚未知，市场传闻，谨慎参考","en":"转，靠谱性尚未知，市场传闻，谨慎参考","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX8tMqYbYAAYAdk.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2125467262627012845","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":0,"vw":2602},{"id":"2125466076414976386","h":"qinbafrank","ts":1795585576,"zh":"也是唏嘘，当年逼着苹果开始回购的华尔街狼王伊坎Icahn个人财富已降至约12亿美元，过去五年累计缩水约210亿美元，当下是彭博追踪其财富以来最低水平\nIcahn投资高度集中于IEP和CVR Energy等少数资产，IEP旗下核心资产CVR Energy股价本月已累计下跌约40%；IEP今年已下跌64%，部分2029年到期债券收益率突破30%，公司整体债务规模约达44亿美元。\n其控制的公司面临严峻流动性挑战，这是他职业生涯中最艰难时刻了。\n作为传奇激进投资者，伊坎Icahn 过往可谓战绩彪悍。1980年代通过Tappan翻倍获利、TWA私有化赚取4.69亿美元等“企业掠夺者”交易成名，后期在Netflix赚超19亿美元，与Ackman对赌Herbalife获胜。\n他最辉煌的战绩就是2013年凭着一封公开信、一条推文，几十亿美金的苹果股票持仓（当时他苹果1%的股份）迫使库克启动了美国历史上最大规模的企业股票回购计划，可以说他可能比任何人都更深刻地改变了苹果的资本分配策略。\n现在激进投资人也快倒在了自己激进的投资风格下，如果当年苹果启动回购后他拿着苹果到现在，估计也是在苹果上拿到了仅次于巴菲特的大结果。","en":"也是唏嘘，当年逼着苹果开始回购的华尔街狼王伊坎Icahn个人财富已降至约12亿美元，过去五年累计缩水约210亿美元，当下是彭博追踪其财富以来最低水平\nIcahn投资高度集中于IEP和CVR Energy等少数资产，IEP旗下核心资产CVR Energy股价本月已累计下跌约40%；IEP今年已下跌64%，部分2029年到期债券收益率突破30%，公司整体债务规模约达44亿美元。\n其控制的公司面临严峻流动性挑战，这是他职业生涯中最艰难时刻了。\n作为传奇激进投资者，伊坎Icahn 过往可谓战绩彪悍。1980年代通过Tappan翻倍获利、TWA私有化赚取4.69亿美元等“企业掠夺者”交易成名，后期在Netflix赚超19亿美元，与Ackman对赌Herbalife获胜。\n他最辉煌的战绩就是2013年凭着一封公开信、一条推文，几十亿美金的苹果股票持仓（当时他苹果1%的股份）迫使库克启动了美国历史上最大规模的企业股票回购计划，可以说他可能比任何人都更深刻地改变了苹果的资本分配策略。\n现在激进投资人也快倒在了自己激进的投资风格下，如果当年苹果启动回购后他拿着苹果到现在，估计也是在苹果上拿到了仅次于巴菲特的大结果。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2125466076414976386","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":0,"vw":1573},{"id":"2125463760517132418","h":"bbcchinese","ts":1795585024,"zh":"黄仁勋重获英伟达首席执行官职务一事举世瞩目，中国也不例外。大多数网民都乐见这位极具影响力的亿万富豪回归。习近平很可能也是这样看待此事。","en":"黄仁勋重获英伟达首席执行官职务一事举世瞩目，中国也不例外。大多数网民都乐见这位极具影响力的亿万富豪回归。习近平很可能也是这样看待此事。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2125463760517132418","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4zLmdpw","d":"bbc.in"}],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":2414},{"id":"2125463663138247108","h":"dmjk001","ts":1795585001,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HX8p7rpasAA0AqP.png?name=orig"],"u":"https://x.com/dmjk001/status/2125463663138247108","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":0,"vw":1474},{"id":"2125463324829893112","h":"tig88411109","ts":1795584920,"zh":"100%的增速，10倍的PE便宜不。 $DELL最新Q3财报和全年指引都毫无疑问的大超预期。按照今年30每股盈利现在股价也就10倍PE。在周报策略中我重点提了要关注这个公司的财报，意味着什么证据，对于AI泡沫论？\n从这份财报中我们要真正读懂什么，如何转化投资策略和估值仓位？\n几个关键财报数据，单季收入550亿同比1倍，每股收益2倍增长，全年第三次上调收入超2000亿。外部收入和积压订单全部是有客户的资金和前期工程准备就位的，无水分，无一个客户推迟\n当然明年如何who knows，但截至目前，按照今年完成近千亿的AI服务器，在手订单1300再管未来5-6季度满载交付，全球美国境内境外各一半，这是对AI是不是延迟最硬的证据。\n股市现在已经悲观按照传统周期硬件的顶部估值逻辑，提前来杀估值。认为今年（27财年）虽然数据漂亮，但是是第一轮AI基建脉冲的大顶，未来三年无增长的悲观预期。\n为什么如此担心，这是因为财报上有一点瑕疵在于，本季度Q3的经营利润率是17%这已经是历史最高了，Q4预期会下滑大致去年同期14-15%。这原因一方面是AI服务器也就是GPU服务器放量，这个服务器毛利偏低；而Q3传统的CPU企业服务器，需求大增集中交付。\n这个说明空头的恐慌小作文又来了，什么利润率下降之类的。本质上看，一方面AI服务器继续放量；另一方面创痛服务器意味着Agent 对于高配置CPU和内存的需求还在增长，毛利更高，而且因为Dell自己的内控，费用率降低，整体的全年的这个利润率是同比扩张14-15%已经是很高的水准。\n那么市场担心什么？完全就是建立在明年是不是数据中心放缓，是不是民主党政策监管，是不是现在Neocloud出现系统违约，是不是现金牛成熟的另外一款消费者PC继续下滑。这些风险在当前市场恐慌下无限放大系统抛售，压制估值的倍数。\n在订阅者内容，6月份的估值维持，当时记得很多评论是估值太保守，我也明确强调了高弹性周期硬件的估值上限要兑现浮盈，但是488的公司回购价格也套牢了公司自己，现在看维持我的估值范围，虽然盈利大涨，但是估值倍数下调，所以估值中枢不变。\nDell本质上是做供应链生意，压上下游货款，用自身工程实力增值。重要是看下季度，以及明年28年的毛利，现金周期，每挣一美元留下来现金超过7毛，历史均值，在现在销售，这个规模下，这就是重要观测指标，达到那就是按照估值上限逼空。反过来看，极端下，哪怕毛利和周转都恶化，那么250大致是底部证伪的价格。\n教育分享，具体的投资策略和及时深度颗粒度更细的见订阅者专享。","en":"100%的增速，10倍的PE便宜不。 $DELL最新Q3财报和全年指引都毫无疑问的大超预期。按照今年30每股盈利现在股价也就10倍PE。在周报策略中我重点提了要关注这个公司的财报，意味着什么证据，对于AI泡沫论？\n从这份财报中我们要真正读懂什么，如何转化投资策略和估值仓位？\n几个关键财报数据，单季收入550亿同比1倍，每股收益2倍增长，全年第三次上调收入超2000亿。外部收入和积压订单全部是有客户的资金和前期工程准备就位的，无水分，无一个客户推迟\n当然明年如何who knows，但截至目前，按照今年完成近千亿的AI服务器，在手订单1300再管未来5-6季度满载交付，全球美国境内境外各一半，这是对AI是不是延迟最硬的证据。\n股市现在已经悲观按照传统周期硬件的顶部估值逻辑，提前来杀估值。认为今年（27财年）虽然数据漂亮，但是是第一轮AI基建脉冲的大顶，未来三年无增长的悲观预期。\n为什么如此担心，这是因为财报上有一点瑕疵在于，本季度Q3的经营利润率是17%这已经是历史最高了，Q4预期会下滑大致去年同期14-15%。这原因一方面是AI服务器也就是GPU服务器放量，这个服务器毛利偏低；而Q3传统的CPU企业服务器，需求大增集中交付。\n这个说明空头的恐慌小作文又来了，什么利润率下降之类的。本质上看，一方面AI服务器继续放量；另一方面创痛服务器意味着Agent 对于高配置CPU和内存的需求还在增长，毛利更高，而且因为Dell自己的内控，费用率降低，整体的全年的这个利润率是同比扩张14-15%已经是很高的水准。\n那么市场担心什么？完全就是建立在明年是不是数据中心放缓，是不是民主党政策监管，是不是现在Neocloud出现系统违约，是不是现金牛成熟的另外一款消费者PC继续下滑。这些风险在当前市场恐慌下无限放大系统抛售，压制估值的倍数。\n在订阅者内容，6月份的估值维持，当时记得很多评论是估值太保守，我也明确强调了高弹性周期硬件的估值上限要兑现浮盈，但是488的公司回购价格也套牢了公司自己，现在看维持我的估值范围，虽然盈利大涨，但是估值倍数下调，所以估值中枢不变。\nDell本质上是做供应链生意，压上下游货款，用自身工程实力增值。重要是看下季度，以及明年28年的毛利，现金周期，每挣一美元留下来现金超过7毛，历史均值，在现在销售，这个规模下，这就是重要观测指标，达到那就是按照估值上限逼空。反过来看，极端下，哪怕毛利和周转都恶化，那么250大致是底部证伪的价格。\n教育分享，具体的投资策略和及时深度颗粒度更细的见订阅者专享。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX8pcTfbIAAM4Lj.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2125463324829893112","l":[],"ln":[],"t":["财报"],"lk":6,"rt":1,"rp":2,"vw":1513},{"id":"2125462635185590752","h":"nytchinese","ts":1795584756,"zh":"华为面临的12项刑事指控中有10项被裁定罪名成立，包括银行欺诈、串谋窃取商业机密以及串谋欺诈美国。但陪审团裁定其勒索敲诈共谋罪名和串谋妨碍司法公正罪名不成立。\n华为自2019年以来实际上已被禁止在美国销售产品，这一酝酿已久的裁决或许不会对其命运产生重大影响。","en":"华为面临的12项刑事指控中有10项被裁定罪名成立，包括银行欺诈、串谋窃取商业机密以及串谋欺诈美国。但陪审团裁定其勒索敲诈共谋罪名和串谋妨碍司法公正罪名不成立。\n华为自2019年以来实际上已被禁止在美国销售产品，这一酝酿已久的裁决或许不会对其命运产生重大影响。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2125462635185590752","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/business/20261125/huawei-guilty-new-york/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":4,"rt":0,"rp":4,"vw":2216},{"id":"2125462388610896223","h":"Kay2289123","ts":1795584697,"zh":"我靠，微软这篇 MAI RL Infra 报告真牛逼，强烈建议收藏阅读，链接在最后！如果你是 AI 爱好者，想知道前沿团队怎么训练一个能推理、能用工具的模型，哪怕你平时完全不做训练，我也会第一个推荐这篇。\n整篇我建议按五个问题读。\n1/ 微软为什么要自己做 Rocket？他们想从自家的基础模型 MAI Base 2 出发，不靠第三方模型蒸馏，用强化学习把能力一步步练上去。几千张 GPU 要连续跑几周甚至几个月，Rocket 就是为这种训练设计的。\n2/ 一条训练数据是怎么来的？看报告图 1。同一个任务，模型试好几次。每次都可以写代码、调工具，根据结果决定下一步。系统给每次尝试打分，在同组里比较哪种做法更好，再拿这些记录更新模型\n3/ 为什么微软愿意让一部分 GPU 闲着？回看报告图 4。经验还在排队，模型已经更新了。微软给训练端多配一些 GPU，让刚凑齐的数据能尽快用上。只盯着 GPU 利用率，有的时候不一定是最优\n4/ 为什么推理和训练还得对一遍，确保一致性？哪怕权重、输入都一样，生成回答的系统和训练模型的系统，也可能因为加法顺序不同，给同一个Token算出略有差别的概率。微软把两边对齐到逐 位一致\n5/ 训练跑到一半，机器挂了怎么办？Rocket 可以单独恢复出故障的部分。训练端挂了，推理端还能继续做手上的任务。微软实际使用中，单独恢复训练端大约只要 5 分钟。\n报告全文：","en":"我靠，微软这篇 MAI RL Infra 报告真牛逼，强烈建议收藏阅读，链接在最后！如果你是 AI 爱好者，想知道前沿团队怎么训练一个能推理、能用工具的模型，哪怕你平时完全不做训练，我也会第一个推荐这篇。\n整篇我建议按五个问题读。\n1/ 微软为什么要自己做 Rocket？他们想从自家的基础模型 MAI Base 2 出发，不靠第三方模型蒸馏，用强化学习把能力一步步练上去。几千张 GPU 要连续跑几周甚至几个月，Rocket 就是为这种训练设计的。\n2/ 一条训练数据是怎么来的？看报告图 1。同一个任务，模型试好几次。每次都可以写代码、调工具，根据结果决定下一步。系统给每次尝试打分，在同组里比较哪种做法更好，再拿这些记录更新模型\n3/ 为什么微软愿意让一部分 GPU 闲着？回看报告图 4。经验还在排队，模型已经更新了。微软给训练端多配一些 GPU，让刚凑齐的数据能尽快用上。只盯着 GPU 利用率，有的时候不一定是最优\n4/ 为什么推理和训练还得对一遍，确保一致性？哪怕权重、输入都一样，生成回答的系统和训练模型的系统，也可能因为加法顺序不同，给同一个Token算出略有差别的概率。微软把两边对齐到逐 位一致\n5/ 训练跑到一半，机器挂了怎么办？Rocket 可以单独恢复出故障的部分。训练端挂了，推理端还能继续做手上的任务。微软实际使用中，单独恢复训练端大约只要 5 分钟。\n报告全文：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX8otSuaoAA-0JQ.jpg?name=orig"],"u":"https://x.com/Kay2289123/status/2125462388610896223","l":["microsoft.ai"],"ln":[{"u":"https://microsoft.ai/pdf/RL-Infrastructure-at-Microsoft-AI.pdf#page=6","d":"microsoft.ai"}],"t":["AI科技"],"lk":10,"rt":1,"rp":2,"vw":1523},{"id":"2125461064129319390","h":"sssjeffpu","ts":1795584381,"zh":"@jukan05 感谢您帮助澄清。我的部分观点与我们的研究和路演材料相同，我们继续采取谨慎的立场。然而，其中的某些部分（20-30%）不是我写的或者是误读的。请注意，我们仅涵盖美国、台湾科技股。 😆","en":"@jukan05 Thanks for helping clarify. The views in the parts that are mine are the same as our research and roadshow materials, where we continue to take a cautious stance. However, some part (20-30% ) of it aren’t from me or misread. Please note that we only cover U.S, TW tech stocks. 😆","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/sssjeffpu/status/2125461064129319390","l":[],"ln":[],"t":[],"lk":10,"rt":2,"rp":1,"vw":1607},{"id":"2125460202959065514","h":"cnfinancewatch","ts":1795584176,"zh":"谢谢！","en":"谢谢！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125460202959065514","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1396},{"id":"2125460143601262994","h":"bboczeng","ts":1795584162,"zh":"原来真正系统性迫害、猎巫和压榨华人的\n是党和国家的“人民政府”\n😭😭😭","en":"原来真正系统性迫害、猎巫和压榨华人的\n是党和国家的“人民政府”\n😭😭😭","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125460143601262994","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":130},{"id":"2125459816407785781","h":"bboczeng","ts":1795584084,"zh":"有了AI之后，这些书都可以丢掉了，没有必要了\n将来，你可以让Fable 10.2 花1000小时给你重新写一遍\n绝对比原版写得好","en":"有了AI之后，这些书都可以丢掉了，没有必要了\n将来，你可以让Fable 10.2 花1000小时给你重新写一遍\n绝对比原版写得好","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125459816407785781","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":223},{"id":"2125459355055362093","h":"cnfinancewatch","ts":1795583974,"zh":"我没有什么功绩，对推特财经分析的贡献也就这样几条：\n一、五月底致命中美科技泡沫（为粉丝避免了六月下旬七月大跌）\n：当时说跌两个50%\n二、九月底十月初指明中国科技还有二轮下跌（为粉丝避免了十月的中美科技股大跌）\n……","en":"我没有什么功绩，对推特财经分析的贡献也就这样几条：\n一、五月底致命中美科技泡沫（为粉丝避免了六月下旬七月大跌）\n：当时说跌两个50%\n二、九月底十月初指明中国科技还有二轮下跌（为粉丝避免了十月的中美科技股大跌）\n……","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125459355055362093","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":371},{"id":"2125459353968742620","h":"togetherdotfun","ts":1795583973,"zh":"https://x.com/i/article/2125457657829920768","en":"","zh_src":"bing","lang":"","m":[],"u":"https://x.com/togetherdotfun/status/2125459353968742620","l":["x.com"],"ln":[{"u":"https://x.com/i/article/2125457657829920768","d":"x.com"}],"t":[],"lk":4,"rt":0,"rp":0,"vw":491},{"id":"2125458943766126826","h":"bboczeng","ts":1795583875,"zh":"这些大模型公司最后的结果可能真的是被政府买下来\n你等着看吧，属于我们这个时代的房利美\n民主党，共和党的党争白热化，\n美国人民要为此做好准备了","en":"这些大模型公司最后的结果可能真的是被政府买下来\n你等着看吧，属于我们这个时代的房利美\n民主党，共和党的党争白热化，\n美国人民要为此做好准备了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125458943766126826","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":417},{"id":"2125458542899703846","h":"bboczeng","ts":1795583780,"zh":"贝莱德、IFM 考虑下调对 STACK 数据中心的报价\nBlackRock怎么发了这么多数据中心的债\n不会他才是本轮周期的雷曼兄弟吧\n😢😢😢","en":"贝莱德、IFM 考虑下调对 STACK 数据中心的报价\nBlackRock怎么发了这么多数据中心的债\n不会他才是本轮周期的雷曼兄弟吧\n😢😢😢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125458542899703846","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":446},{"id":"2125455885736771727","h":"CrushTheShorts","ts":1795583146,"zh":"【Jeff 台北午餐交流纪要】\n1. 英伟达与东南亚算力\n东南亚算力约占英伟达营收的 12%–13%，这部分明年会受到直接影响，灰色市场最多补回四分之一。短期内可能转到澳大利亚或法国租用算力，但单体项目最多只有 100–200 MW，很难满足需求。\n2. 存储库存与价格\n据纪要，大陆长鑫 eSSD、DRAM 渠道端库存已回到 16 个月，平时约为 12 个月。价格已跌回去年 12 月水平，买盘清淡。\nSK 海力士已在准备 DRAM 减产预案，以避免价格跌破长期协议价（LTA）。三星和美光也在准备。NAND 预计从明年一季度开始反映跌价压力。\n3. 技嘉 GB300 订单\n技嘉今年接了 500 柜 GB300，对应约 1 亿元人民币，计划明年一季度出货。纪要称，美国在 10 月底限制了相关出货，技嘉可能继续通过关联公司走灰色渠道，SMCI（超微电脑）也可能仍在通过非公开渠道出货。\n4. 国产算力与 HBM\n国产算力芯片今年约 100 万颗，明年预测下修至 250 万颗（按上下文推定单位）。主要约束是 HBM 供应及芯片实际性能。Jeff 认为，部分场景下实际性能可能比跑分显示的更弱，并称使用非正规渠道取得的 HBM 可能导致性能下降约 50%。他据此解释，今年中国云厂商（CSP）下调资本开支。\n5. AWS 自研芯片\n从先进封装产能分配推测，AWS 2027、2028 年的预期均有下修，部分 EMIB 产能转给了 TPU。2028 年 EMIB-T 规模下修至 5 万–10 万（原文未注明单位）。2028 年能见度较低，整体偏负面，需关注 AWS 供应链的下修风险。\n6. Google TPU 出货\n2027 年预测维持 860 万颗，联发科主要受 CoWoS 产能约束。2028 年从 970 万颗下修至 800 万颗，原因包括 v9 在 10 月出现延误、量产推迟至 2028 年一季度，以及美国电力供应受限。若联发科设计未达预期，TDP 可能进一步上升。Jeff 推测，纪要中提到的郭明奇（原文写法）的数量可能来自存储采购端，实际可部署数量仍受电力约束。\n7. TPU v10 路线\nv10 预计 2029 年一季度量产。v10t 主要是规格上调，架构变化有限，重点看 EMIB 良率能否跟上。v10i 采用 12 倍光罩尺寸（reticle size），搭配 AMD x86 CPU，这部分由博通负责。Jeff 认为，x86 更适合高性能计算（HPC），ARM 可用于智能体（Agent）类任务。\n8. 2028 年后的 AI 投资主线\n受电力约束，Jeff 认为 2028 年后出货量增速会放缓，增长更多来自单颗芯片的配套价值量提升，例如散热。他对整体 AI 交易偏谨慎，认为大部分行情可能已经走过。\n9. OpenAI 自研芯片\nJeff 预计，OpenAI 的 2028 年款芯片，2028 年半年内的出货量就可能超过 2027 年全年。\n10. 博通与联发科\n博通 2028 年拿到的 CoWoS 产能较多。Jeff 相对看好博通、看空联发科，主要分歧在功耗（TDP）。\n11. 服务器 CPU 订单\nJeff 称，多类 CPU 都在加单，与市场流传的说法有差异。英伟达 Grace 加单较多，被砍的主要是英特尔通用服务器订单。他认为，这也解释了为何以 x86 服务器出货为主的纬颖（Wiwynn）提到砍单。\n12. 2 nm 与先进封装\nJeff 认为，苹果砍单后，2 nm 前段产能较为充足，主要瓶颈在后段封装及老化测试（burn-in）设备。后段厂商正设法采购设备扩产。\n13. 英伟达、CPO 与光学供应链\n纪要写到「NV Ultra 57」2027 年预计 180 万颗，其中约 60% 对应 576（产品简称和配置保留原文口径）。预计 CPO 占 55%、NPO 占 45%。Jeff 认为良率推进较好，市场预期仍偏低。\n提及的供应链包括 Senko、中际旭创（Innolight）、康宁、大立光，另有多家大陆厂商希望送样。纪要提到天孚通信 FAU 良率可能达到 75%，原文带问号。若大立光拿到 20% 市占率，情景测算 EPS 为 120（原文未注明币种）。\n14. 太空算力与 PCB 材料\nJeff 预计太空算力规模明年约 1 GW、后年约 4 GW，对工业富联提出的明年 5 GW 判断持保留态度。\n对于迷你版 Kyber 机柜，他倾向于 M9＋PTFE 方案，认为胜宏对 PTFE 的判断可能与其设备条件有关。纪要称，生益目前已通过验证，台虹有机会。Jeff 对台光电相对谨慎，预计计算板采用 M8 混合方案。\n【其他与会者观点】\n1. 联发科 SerDes 团队\n一位从博通引进的 SerDes 核心负责人于 11 月离职，与会者认为影响较大。\n2. AMD 算力卡\n与会者认为，做空机构的影响可能被高估。另有大陆算力租赁从业者称，灰色渠道对 AMD 卡的兴趣较低。\n3. B300 租金\n与会者认为，本周 B300 租金下跌主要源于东南亚算力供给冗余。","en":"【Jeff 台北午餐交流纪要】\n1. 英伟达与东南亚算力\n东南亚算力约占英伟达营收的 12%–13%，这部分明年会受到直接影响，灰色市场最多补回四分之一。短期内可能转到澳大利亚或法国租用算力，但单体项目最多只有 100–200 MW，很难满足需求。\n2. 存储库存与价格\n据纪要，大陆长鑫 eSSD、DRAM 渠道端库存已回到 16 个月，平时约为 12 个月。价格已跌回去年 12 月水平，买盘清淡。\nSK 海力士已在准备 DRAM 减产预案，以避免价格跌破长期协议价（LTA）。三星和美光也在准备。NAND 预计从明年一季度开始反映跌价压力。\n3. 技嘉 GB300 订单\n技嘉今年接了 500 柜 GB300，对应约 1 亿元人民币，计划明年一季度出货。纪要称，美国在 10 月底限制了相关出货，技嘉可能继续通过关联公司走灰色渠道，SMCI（超微电脑）也可能仍在通过非公开渠道出货。\n4. 国产算力与 HBM\n国产算力芯片今年约 100 万颗，明年预测下修至 250 万颗（按上下文推定单位）。主要约束是 HBM 供应及芯片实际性能。Jeff 认为，部分场景下实际性能可能比跑分显示的更弱，并称使用非正规渠道取得的 HBM 可能导致性能下降约 50%。他据此解释，今年中国云厂商（CSP）下调资本开支。\n5. AWS 自研芯片\n从先进封装产能分配推测，AWS 2027、2028 年的预期均有下修，部分 EMIB 产能转给了 TPU。2028 年 EMIB-T 规模下修至 5 万–10 万（原文未注明单位）。2028 年能见度较低，整体偏负面，需关注 AWS 供应链的下修风险。\n6. Google TPU 出货\n2027 年预测维持 860 万颗，联发科主要受 CoWoS 产能约束。2028 年从 970 万颗下修至 800 万颗，原因包括 v9 在 10 月出现延误、量产推迟至 2028 年一季度，以及美国电力供应受限。若联发科设计未达预期，TDP 可能进一步上升。Jeff 推测，纪要中提到的郭明奇（原文写法）的数量可能来自存储采购端，实际可部署数量仍受电力约束。\n7. TPU v10 路线\nv10 预计 2029 年一季度量产。v10t 主要是规格上调，架构变化有限，重点看 EMIB 良率能否跟上。v10i 采用 12 倍光罩尺寸（reticle size），搭配 AMD x86 CPU，这部分由博通负责。Jeff 认为，x86 更适合高性能计算（HPC），ARM 可用于智能体（Agent）类任务。\n8. 2028 年后的 AI 投资主线\n受电力约束，Jeff 认为 2028 年后出货量增速会放缓，增长更多来自单颗芯片的配套价值量提升，例如散热。他对整体 AI 交易偏谨慎，认为大部分行情可能已经走过。\n9. OpenAI 自研芯片\nJeff 预计，OpenAI 的 2028 年款芯片，2028 年半年内的出货量就可能超过 2027 年全年。\n10. 博通与联发科\n博通 2028 年拿到的 CoWoS 产能较多。Jeff 相对看好博通、看空联发科，主要分歧在功耗（TDP）。\n11. 服务器 CPU 订单\nJeff 称，多类 CPU 都在加单，与市场流传的说法有差异。英伟达 Grace 加单较多，被砍的主要是英特尔通用服务器订单。他认为，这也解释了为何以 x86 服务器出货为主的纬颖（Wiwynn）提到砍单。\n12. 2 nm 与先进封装\nJeff 认为，苹果砍单后，2 nm 前段产能较为充足，主要瓶颈在后段封装及老化测试（burn-in）设备。后段厂商正设法采购设备扩产。\n13. 英伟达、CPO 与光学供应链\n纪要写到「NV Ultra 57」2027 年预计 180 万颗，其中约 60% 对应 576（产品简称和配置保留原文口径）。预计 CPO 占 55%、NPO 占 45%。Jeff 认为良率推进较好，市场预期仍偏低。\n提及的供应链包括 Senko、中际旭创（Innolight）、康宁、大立光，另有多家大陆厂商希望送样。纪要提到天孚通信 FAU 良率可能达到 75%，原文带问号。若大立光拿到 20% 市占率，情景测算 EPS 为 120（原文未注明币种）。\n14. 太空算力与 PCB 材料\nJeff 预计太空算力规模明年约 1 GW、后年约 4 GW，对工业富联提出的明年 5 GW 判断持保留态度。\n对于迷你版 Kyber 机柜，他倾向于 M9＋PTFE 方案，认为胜宏对 PTFE 的判断可能与其设备条件有关。纪要称，生益目前已通过验证，台虹有机会。Jeff 对台光电相对谨慎，预计计算板采用 M8 混合方案。\n【其他与会者观点】\n1. 联发科 SerDes 团队\n一位从博通引进的 SerDes 核心负责人于 11 月离职，与会者认为影响较大。\n2. AMD 算力卡\n与会者认为，做空机构的影响可能被高估。另有大陆算力租赁从业者称，灰色渠道对 AMD 卡的兴趣较低。\n3. B300 租金\n与会者认为，本周 B300 租金下跌主要源于东南亚算力供给冗余。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2125455885736771727","l":[],"ln":[],"t":["汇率","AI科技","财报"],"lk":4,"rt":1,"rp":4,"vw":1053},{"id":"2125454812867383554","h":"fxtrader","ts":1795582891,"zh":"11月23-24日，中美双方在北京举行中美贸易理事会项下农业工作组首次会议。双方以中美元首会晤重要共识为引领，就农产品监管及市场准入、农产品贸易等议题进行了坦诚、深入、建设性的交流。双方将继续通过农业工作组加强沟通，推动解决各自农业领域关切，助力中美经贸关系健康、稳定、可持续发展。","en":"11月23-24日，中美双方在北京举行中美贸易理事会项下农业工作组首次会议。双方以中美元首会晤重要共识为引领，就农产品监管及市场准入、农产品贸易等议题进行了坦诚、深入、建设性的交流。双方将继续通过农业工作组加强沟通，推动解决各自农业领域关切，助力中美经贸关系健康、稳定、可持续发展。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2125454812867383554","l":[],"ln":[],"t":["关税贸易"],"lk":4,"rt":1,"rp":0,"vw":3767},{"id":"2125454569853382758","h":"ReutersChina","ts":1795582833,"zh":"中国神舟二十四号航天飞行于周三上午成功发射，机上包括一名巴基斯坦人在内的三名机组人员，他将成为第一位登上天宫空间站的外国宇航员。","en":"China's Shenzhou-24 space flight launched successfully on Wednesday morning, with its three-man crew including a Pakistani national, who will be the first foreign astronaut to board the Tiangong space station.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2125454569853382758","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/science/chinas-shenzhou-24-space-flight-takes-off-with-pakistani-national-first-foreign-2026-11-25/?taid=6b066b71ea3e5e0001afb106&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":1,"rt":1,"rp":0,"vw":571},{"id":"2125453025288548842","h":"TheMarketMemo","ts":1795582464,"zh":"你認為 $QQQ 目前處在什麼階段？","en":"你認為 $QQQ 目前處在什麼階段？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TheMarketMemo/status/2125453025288548842","l":[],"ln":[],"t":[],"lk":16,"rt":0,"rp":13,"vw":5258},{"id":"2125452607774933373","h":"cnfinancewatch","ts":1795582365,"zh":"我极端看好A股水电板块的超长配置价值，那么出了这个方向还有什么方向？\n未来十年，三大值得重点跟踪的方向（估值适中，长期逻辑扎实）\n方向一：央国企高股息红利板块（底仓首选，稳现金流）\n这是最适合普通散户做十年长期底仓的赛道。\n包含电力、公用事业、优质央企能源、部分银行。特点：估值长期处于历史低位，现金流稳定，政策鼓励央企提高分红，股息率长期可观。\n不追求一年翻倍，靠分红+缓慢估值修复赚钱，熊市抗跌，震荡市稳稳拿住，适合做长期复利。\n优点：波动小、分红稳定；缺点：短期爆发力不强，不会天天大涨，适合长期持有，拿分红再投入。\n方向二：高端制造（非爆炒的硬核装备、工业自动化、工业母机）\n很多人一听到制造就联想到传统老行业，其实高端制造是未来十年制造业升级的核心。\n工业母机、精密零部件、机器人零部件、储能设备、特高压装备。这类企业做制造业“卡脖子”的基础装备，国产替代空间巨大。\n和AI芯片不一样，很多装备龙头估值并不夸张，业绩慢慢兑现，不是纯题材炒作。\n中国制造业全球竞争力持续提升，设备更新、产业升级是长期趋势，行业是慢慢成长，不是短期一次性爆炒。\n优势：产业逻辑扎实，估值合理；风险：制造业有周期，会跟随宏观经济震荡，需要分批布局，不能一次性满仓。\n方向三：创新医药、医疗设备（估值低位，困境反转）\n医药经历了多年调整，板块估值已经压缩到很低位置。\n不是指传统仿制药，重点是医疗设备、创新药、医疗器械。人口老龄化是未来十年确定的大趋势，医疗需求长期持续增长。\n过去几年政策压力充分释放，优质龙头已经消化利空。板块现在处于低位，长期需求确定性强，属于“需求长期向上，估值处于底部”的赛道。\n优势：老龄化刚需，估值已经充分回调；风险：政策、研发失败的个股风险，优先选行业龙头，避开小票。\n方向四：少量消费股！","en":"我极端看好A股水电板块的超长配置价值，那么出了这个方向还有什么方向？\n未来十年，三大值得重点跟踪的方向（估值适中，长期逻辑扎实）\n方向一：央国企高股息红利板块（底仓首选，稳现金流）\n这是最适合普通散户做十年长期底仓的赛道。\n包含电力、公用事业、优质央企能源、部分银行。特点：估值长期处于历史低位，现金流稳定，政策鼓励央企提高分红，股息率长期可观。\n不追求一年翻倍，靠分红+缓慢估值修复赚钱，熊市抗跌，震荡市稳稳拿住，适合做长期复利。\n优点：波动小、分红稳定；缺点：短期爆发力不强，不会天天大涨，适合长期持有，拿分红再投入。\n方向二：高端制造（非爆炒的硬核装备、工业自动化、工业母机）\n很多人一听到制造就联想到传统老行业，其实高端制造是未来十年制造业升级的核心。\n工业母机、精密零部件、机器人零部件、储能设备、特高压装备。这类企业做制造业“卡脖子”的基础装备，国产替代空间巨大。\n和AI芯片不一样，很多装备龙头估值并不夸张，业绩慢慢兑现，不是纯题材炒作。\n中国制造业全球竞争力持续提升，设备更新、产业升级是长期趋势，行业是慢慢成长，不是短期一次性爆炒。\n优势：产业逻辑扎实，估值合理；风险：制造业有周期，会跟随宏观经济震荡，需要分批布局，不能一次性满仓。\n方向三：创新医药、医疗设备（估值低位，困境反转）\n医药经历了多年调整，板块估值已经压缩到很低位置。\n不是指传统仿制药，重点是医疗设备、创新药、医疗器械。人口老龄化是未来十年确定的大趋势，医疗需求长期持续增长。\n过去几年政策压力充分释放，优质龙头已经消化利空。板块现在处于低位，长期需求确定性强，属于“需求长期向上，估值处于底部”的赛道。\n优势：老龄化刚需，估值已经充分回调；风险：政策、研发失败的个股风险，优先选行业龙头，避开小票。\n方向四：少量消费股！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125452607774933373","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":732},{"id":"2125452142010089966","h":"cnfinancewatch","ts":1795582254,"zh":"你看到的江水\n----致江小鱼\nGHB\n你看到的水\n和我看到的不一样\n你的水里有空气\n我的水里没有\n但你的水性空\n我的水也性空\n我们都用了诗性的词\n你的游动\n我的游走\n不一样\n但我们一样用了语言\n一样相信它能抵达彼岸\n当初我们隔着水面相望\n现在我们隔着忘川之水相望\n相望不见\n相忘也不见\n初冬的江上\n有语言的丰碑和桥梁\n时间的雾升起\n看之\n若无\n听之\n若有\n走吧你要走好\n念吧你要无念\n尽管走不如不走\n无念不如有念","en":"你看到的江水\n----致江小鱼\nGHB\n你看到的水\n和我看到的不一样\n你的水里有空气\n我的水里没有\n但你的水性空\n我的水也性空\n我们都用了诗性的词\n你的游动\n我的游走\n不一样\n但我们一样用了语言\n一样相信它能抵达彼岸\n当初我们隔着水面相望\n现在我们隔着忘川之水相望\n相望不见\n相忘也不见\n初冬的江上\n有语言的丰碑和桥梁\n时间的雾升起\n看之\n若无\n听之\n若有\n走吧你要走好\n念吧你要无念\n尽管走不如不走\n无念不如有念","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125452142010089966","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":345},{"id":"2125451854985453759","h":"ShanghaoJin","ts":1795582185,"zh":"据 bbg 报道，中国正在延长暂停关键矿产出口禁令的期限，这一举动昨天再次令市场感到不安。\n但请放心，BJ 知道如何打这张牌并且 分明年有直接影響，灰色市場頂多補回來1/4的比例。短期內轉到轉到澳洲或是法國去租算力，但單體頂多只有100-200MW，很難滿足需求\n2. 大陸的長鑫eSSD, DRAM通路端庫存已經回到16個月，平常是12個月左右，價格已經崩回去年12月水準，沒什麼人要買\n 1. SK已經在準備DRAM減產的備案了，因為不能讓價格跌破LTA的價格，三星跟美光也在準備. NAND更不用說，明年Q1就差不多開始會反應跌價\n3. 技嘉今年有接500櫃GB300一億人民幣，明年Q1出，10月底美國不讓出了，可能繼續透過關聯公司操作水貨，SMCI也還在檯面下繼續出\n4. 國產算力今年100萬顆，明年下修到250受限於HBM，主要性能還是不太好不堪用，而且HBM走私會導致性能下降50%，因此跑分有點太樂觀，所以今年china CSP cut Capex的原因就是這樣\n5. AWS有下修27/28年，從封裝完的角度去推測的，把EMIB 產能給了TPU，28EMIB-T下修到50-100k，目前28能見度不好，但整體偏負面，要注意AWS鏈下修風險。\n6. TPU: 27年860萬顆不變，聯發科那邊主要是cowos產能不太夠。28年970-下修到800 ，因為v9 10月有延誤1Q28才會量產，還有美國電力供應問題，假設聯發科設計不好TDP還會再上去。郭明奇那邊的量一定是問記憶體採購的，因為電力絕對不可能有辦法供應\n7. V10 預計1Q29量產，v10t基本規格往上推而已沒有大改，主要還是看EMIB那邊良率有沒有辦法配合。v10i 12x reticle size是配AMD x86 cpu，這部分是給博通做。x86 還是比較適合HPC, ARM架構做做agent還行\n8. 28年以後主要content value growth主要還是圍繞在晶片的(散熱等），因為volume growth一定會遞減（電力問題），大部分的AI trade已過（Jeff偏Bearish)\n9. Open AI 28那款的量28半年應該就會超過27一整年了\n10. 博通28年Cowos拿的量比較多，看多博通空聯發科，主要還是TDP問題\n11. cpu都有加單，跟坊間說法不一致，NV grace 加單很多，被砍的主要在intel general server，所以wiwynn 才說被砍單（因為他們主要出x86)\n12. 2nm產能很夠（因為蘋果有砍單），主要瓶頸還是在後段封裝（還有burn in這邊的設備不夠），後段在想辦法買設備擴產能\n13. Nv Ultra 57 2027 180萬顆*60%是576， CPO應該可以到55%，NPO45%，良率推進的不錯（天俘FAU良率可以到75%？），目前市場對這塊預期蠻低的，senko, innolight, corning, 大立光，大陸還有一大票想要送樣測試。大立光假設20%市佔率的話eps120\n14. 太空算力明年1gw, 後年4gw, 工業富聯說明年5gw是口嗨聽聽就好，迷你版的kyber 機櫃, 覺得還是用M9+PTFE，勝宏沒有那塊設備才會說不用PTFE(生益目前有通過，台虹有機會），所以不看好台光電，計算板也是用M8混合的方案\n其他與會者\n1. mtk 負責serdes 的關鍵負責人（從博通挖來的）11月離職，認為影響有點大\n2. AMD放空機構有點太被高估了，大陸算力租用的都說A卡都懶得走私了\n3. B300租金這週下跌主要來自於東南亞算力的冗餘","en":"【Jeff台北午餐交流纪要】\n1. 東南亞算力大概佔nv營收 12-13%左右，這部分明年有直接影響，灰色市場頂多補回來1/4的比例。短期內轉到轉到澳洲或是法國去租算力，但單體頂多只有100-200MW，很難滿足需求\n2. 大陸的長鑫eSSD, DRAM通路端庫存已經回到16個月，平常是12個月左右，價格已經崩回去年12月水準，沒什麼人要買\n 1. SK已經在準備DRAM減產的備案了，因為不能讓價格跌破LTA的價格，三星跟美光也在準備. NAND更不用說，明年Q1就差不多開始會反應跌價\n3. 技嘉今年有接500櫃GB300一億人民幣，明年Q1出，10月底美國不讓出了，可能繼續透過關聯公司操作水貨，SMCI也還在檯面下繼續出\n4. 國產算力今年100萬顆，明年下修到250受限於HBM，主要性能還是不太好不堪用，而且HBM走私會導致性能下降50%，因此跑分有點太樂觀，所以今年china CSP cut Capex的原因就是這樣\n5. AWS有下修27/28年，從封裝完的角度去推測的，把EMIB 產能給了TPU，28EMIB-T下修到50-100k，目前28能見度不好，但整體偏負面，要注意AWS鏈下修風險。\n6. TPU t现在可以在BNB链上上通过 PancakeSwapV3交易bStocks（与美股和 ETF 挂钩的链上代币），之前它NeoTrade主要在Polymarket、\nNeoSoul从预测市场起步，现在扩展到代币化美股和ETF，等于把测试环境从“事件驱动、高波动、24/7”的加密叙事，拉到了“有基本面、有交易时段、有流动性深度差异”的传统资产映射上。这是从“能交易加密”到“能在更多可交易资产上工作”的扩展——服务的市场变得更大了\n对用户来说，多资产带来的是更接近“交易工作台”的体验。用户在本地客户端设定策略、仓位上限和风险边界后，Agent 可以同时看预测市场和代币化股票，而不是被锁在单一赛道。Skill Builder 那种用对话把交易思路转成可执行策略的方式，如果能在不同资产间复用，门槛会进一步下降。\n这也和行业里对Agent的期待是对齐的：不只是一个只会回答问题的模型，能进一步在用户授权范围内持续感知、判断并行动。代币化资产的出现，则降低了“把传统资产放进链上执行环境”的技术门槛，让 Agent 不必先解决券商接口和合规账户体系，就能先在链上验证逻辑。\n代币化股票的流动性和跟踪质量、链上池子与标的价格的偏差、监管对这类资产的态度，都会直接影响 Agent的实际表现。如果一个在预测市场里表现稳定的 Agent，也能在不同市场机制下都保持可靠的决策执行过程，还能帮用户拿到结果，那么这个提升就是更大了，有望成为真正覆盖多资产的AI交易平台。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2125430244429763065","l":["predict.fun等预测市场上跑，现在同一套框架开始延伸到美股上"],"ln":[{"u":"http://predict.fun等预测市场上跑，现在同一套框架开始延伸到美股上","d":"predict.fun等预测市场上跑，现在同一套框架开始延伸到美股上"}],"t":["美股"],"lk":1,"rt":0,"rp":0,"vw":1524},{"id":"2125428534923632995","h":"fxtrader","ts":1795576625,"zh":"朝鲜外务省今日宣布瑞士驻朝鲜外交办事处代表为“不受欢迎的人”，限其在48小时内离境。\n此前瑞士将朝鲜松涛园国际少年团夏令营列入对俄制裁名单，理由是该营参与了与俄罗斯协调的活动，将乌克兰被占领土上的儿童转移至朝鲜，涉及对乌克兰未成年人的强制同化，包括政治灌输和军事化教育。\n🗒️瑞士重新开放平壤外交办事处才刚满一个月。","en":"朝鲜外务省今日宣布瑞士驻朝鲜外交办事处代表为“不受欢迎的人”，限其在48小时内离境。\n此前瑞士将朝鲜松涛园国际少年团夏令营列入对俄制裁名单，理由是该营参与了与俄罗斯协调的活动，将乌克兰被占领土上的儿童转移至朝鲜，涉及对乌克兰未成年人的强制同化，包括政治灌输和军事化教育。\n🗒️瑞士重新开放平壤外交办事处才刚满一个月。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2125428534923632995","l":[],"ln":[],"t":["关税贸易"],"lk":6,"rt":0,"rp":1,"vw":2965},{"id":"2125428386785120297","h":"nytchinese","ts":1795576590,"zh":"通过走访黄乐的故乡、查阅公司文件和公开资料，并采访十余名熟悉她的人士，时报还原了黄乐的成长背景与人生轨迹。她从一座日渐衰落的工业小镇一路崛起，进入美国人工智能热潮推动者的核心圈子，并卷入了一场地缘政治危机的中心。而她的人生从童年起便与中国军工复合体紧密交织。","en":"通过走访黄乐的故乡、查阅公司文件和公开资料，并采访十余名熟悉她的人士，时报还原了黄乐的成长背景与人生轨迹。她从一座日渐衰落的工业小镇一路崛起，进入美国人工智能热潮推动者的核心圈子，并卷入了一场地缘政治危机的中心。而她的人生从童年起便与中国军工复合体紧密交织。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2125428386785120297","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/china/20261125/nvidia-alice-huang-china/?utm_source 本约束成为问题，AI 数据中心的年度资本支出预计将从 2028 年起趋于平稳，维持在约 1.4 万亿美元","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX8BUcUbsAArUDv.png?name=orig"],"u":"https://x.com/CrushTheShorts/status/2125424249943072885","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":1102},{"id":"2125422596644847932","h":"renmianyihao","ts":1795575210,"zh":"USD8的第一天内容挖矿的积分榜单出来了\n@USD8infinity #USD8 #usd8infinity\n来拆解一下我看见不少小伙伴好奇这个积分是怎么算的，今天咱们就拿第一名的老师@Jadtrrguson 拆解一下\nCMP的积分=等级系数×帖子的流量分数×帖子质量\n咱们一个一个来说\n1、等级系数 就是这个边边上的小徽章，可以看到吃货不怕胖老师的等级钻石1\n根据规则，平均锁仓时间决定着前面的材质\n30天-60天-180天-364天分别对应青铜、白银、黄金、钻石\n持仓数额决定着后面的等级\nI：100U ≤ 金额 < 1,000U\nII：1,000U ≤ 金额 < 10,000U\nIII：10,000U ≤ 金额 < 100,000U\nIV：金额 ≥ 100,000U\n可以由于吃货老师的粉丝还是挺多的，所以这篇流量挺不错的\n这时候，有小伙伴可能会抱怨了：我的X账号粉丝太少了，就算认真写流量完全比不过人家！\n任眠决定教你们一个焚决：评论蹭蹭蹭 不知道有没有经验丰富的小伙伴们发现了：除了主贴可以提交，评论也是可以提交的！\n那么我们能不能找到超级大V的推文，在人家发完文的第一时间，评论得很有趣或者说点吉祥话，然后评论里也带上标签呢？\n我是说万一哈，像CZ、马斯克这种超级大V回复了你那条推文，那你不爽完了，流量拉满，直接以小搏大。\n3、帖子质量\n这个也是非常好理解的，虽然我们的活动不限制题材，只要带上了标签发文，就可以提交。\n但是显而易见的是，黄色的、政治性的、故弄玄虚的标题性文章天然就能在X里获得较高的流量。\n反倒是你一心一意来介绍USD8反而流量不多 对此算法会做出平衡，削减那些被评判为血腥、黄色、政治性的推文所获得的分数 ，奖励那些和USD8主题相关的内容\n那么为什么吃货老师一篇推文就能有500多分的愿意也非常明确了\n1、钻石I的积分加成就让他已经先人一步了\n2、其本身的推文流量就非常可观\n3、他的推文主题是USD8相关的，进一步获得了分数奖励\n所以大家有没有更加了解这个活动呢？用力猛冲吧！","en":"USD8的第一天内容挖矿的积分榜单出来了\n@USD8infinity #USD8 #usd8infinity\n来拆解一下我看见不少小伙伴好奇这个积分是怎么算的，今天咱们就拿第一名的老师@Jadtrrguson 拆解一下\nCMP的积分=等级系数×帖子的流量分数×帖子质量\n咱们一个一个来说\n1、等级系数 就是这个边边上的小徽章，可以看到吃货不怕胖老师的等级钻石1\n根据规则，平均锁仓时间决定着前面的材质\n30天-60天-180天-364天分别对应青铜、白银、黄金、钻石\n持仓数额决定着后面的等级\nI：100U ≤ 金额 < 1,000U\nII：1,000U ≤ 金额 < 10,000U\nIII：10,000U ≤ 金额 < 100,000U\nIV：金额 ≥ 100,000U\n可以由于吃货老师的粉丝还是挺多的，所以这篇流量挺不错的\n这时候，有小伙伴可能会抱怨了：我的X账号粉丝太少了，就算认真写流量完全比不过人家！\n任眠决定教你们一个焚决：评论蹭蹭蹭 不知道有没有经验丰富的小伙伴们发现了：除了主贴可以提交，评论也是可以提交的！\n那么我们能不能找到超级大V的推文，在人家发完文的第一时间，评论得很有趣或者说点吉祥话，然后评论里也带上标签呢？\n我是说万一哈，像CZ、马斯克这种超级大V回复了你那条推文，那你不爽完了，流量拉满，直接以小搏大。\n3、帖子质量\n这个也是非常好理解的，虽然我们的活动不限制题材，只要带上了标签发文，就可以提交。\n但是显而易见的是，黄色的、政治性的、故弄玄虚的标题性文章天然就能在X里获得较高的流量。\n反倒是你一心一意来介绍USD8反而流量不多 对此算法会做出平衡，削减那些被评判为血腥、黄色、政治性的推文所获得的分数 ，奖励那些和USD8主题相关的内容\n那么为什么吃 ","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2125399026329887050","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1084},{"id":"2125397739257417910","h":"cnfinancewatch","ts":1795569283,"zh":"A股盘前第二版·下 2026年11月25日 周三\n上篇的结论是：日韩开盘把隔夜芯片抛压又递进一步，第一版“不抄光模块和存储第一波、银行与红利只做防守”仍然成立；神舟发射成功只是事件脉冲，不改主方向。\n#中美映射 窗口数字没有新的美股收盘，仍用11月24日。20日美股靠前的是天然气 $UNG 涨7.05%、水务 $FIW 涨6.26%、住宅建设 $ITB 涨5.77%、制药 $IHE 涨5.51%、必选消费 $XLP 涨5.43%、航空 $JETS 涨5.03%。$UNG、$FIW、$ITB 是20日加5日双窗口同现，$XLP、$IHE、$JETS 的5日涨幅都不足1个百分点，属于趋势未明显加速。半导体 $SOXX 20日跌24.50%、5日跌9.08%，科技 $XLK 20日跌17.10%、5日跌3.78%，趋势向下。今天日韩半导体再跌，是这一侧的延续，不是共振修复。 A股一侧仍是消费ETF汇添富 $159928 涨5.71%、银行ETF华宝 $512800 涨5.37%、银行ETF天弘 $515290 涨5.32%、红利低波50ETF南方 $515450 涨5.32%，银行和红利低波还是双窗口同现，但20日分位多在88%至94%，只能防守。中美消费是仅20日共振。交运对 $JETS 也是仅20日。医药没有共振。A股半导体ETF 20日跌0.78%、5日走平，跟美股半导体和今日日韩芯片股不是同向加速后的买入信号。\n#期货 两小时更新。富时A50期指仍约12528点，较前值12601点跌0.58%，早间未见新的日盘有效报价，与第一版一致。恒生指数期货夜盘约22346点，港股9:30才开盘，现货暂不可用。美股期指早间小幅回落，纳指期货约26154点，标普500期货约7194点，道指期货约49949点。国内商品夜盘之后变化不大：沪金主力仍约767.10元/克，沪银约9600元/千克，SC原油约582.9元/桶。纽约金早间约3583美元，较隔夜收盘3550美元有所回升，属于低位修复，不改转弱后的防守态度。纽约原油约81.82美元，与隔夜走强大体一致。\n#三个方向 第一，银行与高股息防守，结论不变。日韩和美股期指都偏弱，更要靠位置相对稳定的品种接，但分位偏高，只做回撤承接，不追早盘高开。 第二，必选消费与家电，作为科技承压时的稳定仓，同样不追高。 第三，电力公用运营，用 #长江电力 平衡组合，靠近20日高点只跟踪不追。光模块、PCB和存储今天仍不做主方向。神舟成功可能带动航天卫星早盘脉冲，不纳入今日三个方向。\n#六只个股 名单不因两小时信息调换，位置仍用周二收盘。 #建设银行 $601939 收12.43元，涨0.32%，20日涨5.52%，约74%分位，大行里相对低一些。触发看缩量守住12.39元附近，失效看跌破11.45元。 #工商银行 $601398 收9.22元，涨0.77%，20日涨6.96%，分位约80%。触发看站稳9.15元，失效看放量跌破9元。 #中国平安 $601318 收54.88元，涨2.20%，20日涨4.31%，分位约86%。失效看重新跌破53.70元。 #美的集团 $000333 收94.23元，涨0.11%，20日涨10.81%，分位约85%，靠近20日高95.99元，回踩再看。 #贵州茅台 $600519 收1460.00元，涨1.46%，20日涨7.68%，分位约83%，失效看跌破1322.60元附近的20日低。 #长江电力 $600900 收31.64元，涨0.93%，20日涨6.07%，5日涨3.40%，分位约93%，已接近20日高31.85元，不在高位加仓。\n#小盘阿尔法 本档仍不选。热榜小盘多为连板或首板题材，完整20日K线和最新财报没有形成互证，不凑数。\n#操作提示 开盘先看成长股低开幅度，以及银行、消费能否守住昨日收盘。集合竞价要等9:15之后才能验证，若光模块和存储低开后继续放量破近期低点，不要急着抄。神舟相关如果高开，当作事件溢价，不追。创业板指周二收在当日最低2278.99点，若再失则降低仓位。今天还有PCE，外部不是单边乐观。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅","en":"A股盘 ":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["美股","A股港股","原油能源","AI科技","财报"],"lk":0,"rt":0,"rp":1,"vw":1212},{"id":"2125397582587600896","h":"cnfinancewatch","ts":1795569246,"zh":"A股盘前第一版·上 2026年11月25日 周三\n#结论 周二A股把隔夜科技反抽用高开低走消化掉了。上证收3548.37点涨0.27%，深证成指跌0.29%，创业板指跌0.05%并收在当日最低2278.99点，科创50涨1.81%，上证50涨0.45%。沪深成交16551亿元，放量约1022亿元，约1952只上涨、3496只下跌，赚钱效应差。 #中际旭创、 #新易盛 盘中一度涨超11%，收盘分别跌0.05%、0.74%。隔夜美股涨跌互现，道指涨0.85%收50018.70点，标普跌0.50%收7201.09点，纳指跌1.48%收23733.54点，费城半导体重挫7.88%， #英伟达 $NVDA 跌5.86%收155.38美元。今天的判断是：光模块、PCB和存储大概率承压，不抄第一波下跌；银行与红利的20日相对强势还在，位置已经偏高，只做防守和急跌回补，不追高。\n#消息面\n外部有三条。高盛下调2028年传统DRAM与NAND均价预测约20%，并下调三星电子、SK海力士盈利预测，美光跌11.01%，Lumentum跌10.52%，SK海力士跌9.90%，Ciena、Coherent跌逾9%。特朗普政府据报最快本周公布针对产业补贴的关税调查结果，可能对数十个国家上调关税。今天还有美国PCE数据，CME美联储观察显示12月加息25个基点概率约97%，1月再加息概率约66%；纽约联储主席威廉姆斯称，为应对通胀，未来“假以时日”或需进一步加息。 #英伟达 复职次日召开内部会议，黄仁勋公开致歉，并称公司不需要接班人计划；Anthropic跌6.54%，收81.90美元，跌破83美元发行价。油价上涨、金银大跌：WTI收81.40美元涨1.53%，COMEX黄金收3550美元跌2.78%，白银跌6.10%。伊朗称在七项条件落实前不会开放霍尔木兹海峡，还将收紧封锁。\n国内看政策与流动性。央行今日开展5000亿元7天期逆回购和8000亿元一年期MLF，但当日有5160亿元隔夜逆回购、1万亿元MLF和800亿元国库现金定存到期，净回笼约2960亿元。商务部回应欧盟拟12月1日起对混动汽车采取临时保障措施，重申开放合作；另宣布11月28日至2027年1月27日暂停对美两用物项出口管制公告第二款。工信部在上海启动6G部省协同试点，北京、上海、江苏、广东等8省市入围；半导体设备与零部件质量管理体系标准发布。这些是中期产业事件，盖不过隔夜芯片和光通信的抛压。\n#研报面\n最近三个交易日仍有制造和科技报告，但要按隔夜变化降权。中邮11月23日给 #中芯国际 $688981 买入；国金11月21日给 #北方华创 $002371 买入，指向AI扩产与国产替代；太平洋11月22日给 #兆易创新 $603986 买入、华安11月22日给 #澜起科技 $688008 买入，存储和接口逻辑还在，但高盛下调存储均价后，短线说服力下降。太平洋11月22日给 #芯朋微 $688508 买入，称服务器电源新品量产。和今天防守方向更近的是国金11月24日给 #京沪高铁 $601816 买入，理由是股东回报。机器人侧，西南11月24日给 #万向钱潮 $000559 增持，华安同日给 #得邦照明 $603303 增持，称能力或外溢到机器人；摩根大通上调 #宇树科技 $688836 目标价至1060元，并将优必选调至增持，这是机构观点，不改变连板票已经偏热的事实。\n#热榜\n同花顺热榜仍是题材和算力混杂。前列有涨停的 #九阳股份 $002242、 #文投控股 $600715（标签21天11板）、 #华东重机 $002685（8天6板），以及 #中京电子 $002579（4天4板，CPO与PCB）。主线相关的是 #中际旭创 $300308、 #工业富联 $601138、 #东山精密 $002384、 #新易盛 $300502，机器人方向则有 #宇树科技 $688836、 #福莱新材 $605488、 #光洋股份 $002708、 #东方精工 $002611。东财人气榜本档数据缺失。热榜说明资金还在CPO和机器人里停留，但连板和首板是情绪溢价，不把它当成今天的主方向。\n#资金面\n周二沪深成交16551亿元，较周一放量约1022亿元，但上涨家数明显少于下跌家数，高开后是筹码交换，不是增量趋势。成交额前五是 #中际旭创 285.83亿元、 #新易盛 249.75亿元、 #东山精密 146.58亿元，另有报道称寒武纪、长鑫科技也在百亿元以上。这些大票盘中冲高后回吐，说明获利盘和解套盘都在用高开放量。午后有资金转向银行、白酒和保险， #中国平安 收涨2.20%， #农业银行 涨1.28%， #中国银行 涨1.62%， #工商银行 涨0.77%。板块主力资金和北向完整净流入本档数据缺失，不编造。","en":"A股盘前第一版·上 2026年11月25日 周三\n#结论 周二A股把隔夜科技反抽用高开低走消化掉了。上证收3548.37点涨0.27%，深证成指跌0.29%，创业板指跌0.05%并收在当日最低2278.99点，科创50涨1.81%，上证50涨0.45%。沪深成交16551亿元，放量约1022亿元，约1952只上涨、3496只下跌，赚钱效应差。 #中际旭创、 #新易盛 盘中一度涨超11%，收盘分别跌0.05%、0.74%。隔夜美股涨跌互现，道指涨0.85%收50018.70点，标普跌0.50%收7201.09点，纳指跌1.48%收23733.54点，费城半导体重挫7.88%， #英伟达 $NVDA 跌5.86%收155.38美元。今天的判断是：光模块、PCB和存储大概率承压，不抄第一波下跌；银行与红利的20日相对强势还在，位置已经偏高，只做防守和急跌回补，不追高。\n#消息面\n外部有三条。高盛下调2028年传统DRAM与NAND均价预测约20%，并下调三星电子、SK海力士盈利预测，美光跌11.01%，Lumentum跌10.52%，SK海力士跌9.90%，Ciena、Coherent跌逾9%。特朗普政府据报最快本周公布针对产业补贴的关税调查结果，可能对数十个国家上调关税。今天还有美国PCE数据，CME美联储观察显示12月加息25个基点概率约97%，1月再加息概率约66%；纽约联储主席威廉姆斯称，为应对通胀，未来“假以时日”或需进一步加息。 #英伟达 复职次日召开内部会议，黄仁勋公开致歉，并称公司不需要接班人计划；Anthropic跌6.54%，收81.90美元，跌破83美元发行价。油价上涨、金银大跌：WTI收81.40美元涨1.53%，COMEX黄金收3550美元跌2.78%，白银跌6.10%。伊朗称在七项条件落实前不会开放霍尔木兹海峡，还将收紧封锁。\n国内看政策与流动性。央行今日开展5000亿元7天期逆回购和8000亿元一年期MLF，但当日有5160亿元隔夜逆回购、1万亿元MLF和800亿元国库现金定存到期，净回笼约2960亿元。商务部回应欧盟拟12月1日起对混动汽车采取临时保障措施，重申开放合作；另宣布11月28日至2027年1月27日暂停对美两用物项出口管制公告第二款。工信部在上海启动6G部省协同试点，北京、上海、江苏、广东等8省市入围；半导体设备与零部件质量管理体系标准发布。这些是中期产业事件，盖不过隔夜芯片和光通信的抛压。\n#研报面\n最近三个交易日仍有制造和科技报告，但要按隔夜变化降权。中邮11月23日给 #中芯国际 $688981 买入；国金11月21日给 #北方华创 $002371 买入，指向AI扩产与国产替代；太平洋11月22日给 #兆易创新 $603986 买入、华安11月22日给 #澜起科技 $688008 买入，存储和接口逻辑还在，但高盛下调存储均价后，短线说服力下降。太平洋11月22日给 #芯朋微 $688508 买入，称服务器电源新品量产。和今天防守方向更近的是国金11月24日给 #京沪高铁 $601816 买入，理由是股东回报。机器人侧，西南11月24日给 #万向钱潮 $000559 增持，华安同日给 #得邦照明 $603303 增持，称能力或外溢到机器人；摩根大通上调 #宇树科技 $688836 目标价至1060元，并将优必选调至增持，这是机构观点，不改变连板票已经偏热的事实。\n#热榜\n同花顺热榜仍是题材和算力混杂。前列有涨停的 #九阳股份 $002242、 #文投控股 $600715（标签21天11板）、 #华东重机 $002685（8天6板），以及 #中京电子 $002579（4天4板，CPO与PCB）。主线相关的是 #中际旭创 $300308、 #工业富联 $601138、 #东山精密 $002384、 #新易盛 $300502，机器人方向则有 #宇树科技 $688836、 #福莱新材 $605488、 #光洋股份 $002708、 #东方精工 $002611。东财人气榜本档数据缺失。热榜说明资金还在CPO和机器人里停留，但连板和首板是情绪溢价，不把它当成今天的主方向。\n#资金面\n周二沪深成交16551亿元，较周一放量约1022亿元，但上涨家数明显少于下跌 33.54点，标普500跌0.50%、收7201.09点，道指仍涨0.85%、收50018.70点；费城半导体跌7.88%，英伟达跌5.86%、收155.38美元，回吐周一部分涨幅；美光跌11.01%。东方财富引述，高盛下调2028年传统DRAM与NAND均价预测，称两类产品价格可能各跌约20%。Anthropic收报81.91美元，跌破83美元发行价。日韩台周二已先涨：KOSPI涨6.32%，台湾加权涨8.99%，日经225涨3.91%。今天面对的不是“外盘继续暴涨”，而是“亚太已经透支、美股硬件已经回吐”。截稿时每日经济新闻仅报道纳指期货高开涨0.12%。今晚还有美国10月PCE和三季度GDP修正值，周四感恩节休市。\n三大利多方向（由强到弱）\n一、戴尔财报把AI服务器需求写回了实盘，这是相对晚间邮件最大的增量。已核实：戴尔公布2027财年第三季度营收549.37亿美元、同比增103%；AI优化服务器收入220.31亿美元、同比增291%，在手订单1323亿美元，并把下一财年AI服务器指引上调至780亿美元；同时授权250亿美元回购。制约：个人电脑业务营收低于预期。对谁有利：有订单的服务器和光模块，而不是连板题材。该财报要到今晚美股常规交易才充分定价，不能把盘后反应写成定论。\n二、跨月流动性有呵护，但不是全面放水。已核实：央行将于今日开展8000亿元1年期MLF和5000亿元7天期逆回购。新华社写明，11月有10000亿元MLF到期，本月为缩量续作2000亿元；东方财富早餐还列明，今日另有5160亿元隔夜逆回购和800亿元国库现金定存到期。邮件把操作规模写成投放明显加大，忽略了到期对冲，本档不以放水定论。中际旭创拟20亿至40亿元回购、华友钴业拟10亿至15亿元回购，有托底含义，但改变不了高开低走。\n三、供给和政策线索还在，只适合中期对照，不适合追高。已核实：刚果（金）自11月30日起暂停钴出口，能源金属周二已是A股领涨方向之一；工信部正式启动6G部省协同试点，北京等8省市获批；商务部决定，11月28日至2027年1月27日继续暂停对美两用物项出口管制公告第二款，不是新的全面放开。制约：光模块并未因6G标题而收强。\n三大利空方向（由强到弱）\n一、复职行情只维持了一天，AI交易重新回到调查、听证、融资和回报率。高盛下调存储均价，是比标题更硬的空头理由；Anthropic跌破发行价，说明资本开支承诺并未被无条件接受。黄仁勋12月国会安排仍在。另有媒体转述美国或对数十国上调关税、最早本周公布调查结果，这是知情人士口径，不是已落地政策。\n二、拥挤的高标和已经走完的高开低走，是今天最容易亏钱的地方。九阳股份6天4板，中京电子4连板，文投控股仍在高位连板，机器人多个2连板、3连板。创业板从涨超4%收到翻绿，说明隔夜情绪不够用。现货黄金跌2.31%、报3551.41美元，现货白银跌5.51%，贵金属昨日已走弱。WTI报81.4美元、涨1.53%（东方财富截至发稿口径），邮件里“油价触及三个月低点”已被取代。\n三、外部日历和贸易摩擦会限制风险偏好。今晚PCE和GDP修正值是短线开关；威廉姆斯此前称通胀仍过高、不排除连续加息，不能写成他已宣布“12月100%加息”。欧盟拟自12月1日起对进口混动汽车实施为期200天的临时保障措施，商务部已公开回应。小米三季度收入1072.39亿元、同比降5.2%，经调整净利润同比降56.8%，港股科技已先走弱。\n小结：昨天是高开低走、硬件分化，隔夜是复职反弹回吐、存储重挫。今天不要再交易周一的故事。戴尔证明需求还在，但定价权在财报质量和拥挤程度上。防守看回踩后的订单链，不接力已经走完高开和多连板的高标。真正的验证，还要看今晚PCE，以及美股如何消化戴尔。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，邮件转述内容未逐条核实，不构成投资建议。","en":"热点财经新闻综述｜2026-11-25·早间\n数据时点：A股、港股、日经225、韩国KOSPI与台湾加权为11月24日收盘；美股为美东11月24日常规交易收盘；金银原油取东方财富收盘报道；股指期货仅引用每日经济新闻11月25日07:03的报道。本档截稿约北京时间11月25日07:50。本期新处理一封热点财经邮件：11月24日晚间20:10版（收件箱）；早间版截稿时未到。标“邮件转述”的未逐条核实。该邮件写于美股开盘前，部分盘前表述已被收盘数字取代，本档以已核实公开报道为准。\n今日判断\n周二A股把“复职反弹”做成了高开低走：上证收3548.37点、涨0.27%，深证成指跌0.29%，创业板指跌0.05%、收2278.99点，科创50仍涨1.81%、收1250.09点。全市场1952只上涨、3498只下跌，64只涨停；沪深成 :845},{"id":"2125382766485467610","h":"fxtrader","ts":1795565713,"zh":"#行情 日韩股市低开低走，韩国KOSPI指数跌幅扩大至5%，韩国交易所对KOSPI指数启动Sidecar机制，暂停程序化交易5分钟。三星电子与SK海力士跌超7%。\n日经225指数跌超2%。","en":"#行情 日韩股市低开低走，韩国KOSPI指数跌幅扩大至5%，韩国交易所对KOSPI指数启动Sidecar机制，暂停程序化交易5分钟。三星电子与SK海力士跌超7%。\n日经225指数跌超2%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2125382766485467610","l":[],"ln":[],"t":[],"lk":20,"rt":2,"rp":7,"vw":3893},{"id":"2125382264318226903","h":"dmjk001","ts":1795565594,"zh":"特朗普称必要时愿赦免黄仁勋 不排除美国政府入股英伟达\n据纽约邮报报道，特朗普表示，如有必要，他愿意赦免黄仁勋，但他认为，黄仁勋即使没有获得赦免也不会有事，并应在下周赴国会作证时“实话实说”。此前曾向英伟达(NVDA.O)董事会施压、要求恢复黄仁勋职务的特朗普，在该公司股价周一飙升后颇为得意。他在接受该媒体采访期间坐在白宫椭圆形办公室的桌前查看最新股价数据，并指出英伟达股价在周二午后有所回升，收复了当天早些时候的部分跌幅。特朗普在查看数据时评论道：“还不错，跌了几个百分点，但尾盘确实回升了不少。”特朗普补充称，黄仁勋下周接受国会问询时，无需援引美国宪法第五修正案赋予的权利，以避免自证其罪。特朗普表示，英伟达的成功对于美国保持人工智能领域的领先优势至关重要，他甚至对英伟达向美国政府提供股权持开放态度，特朗普表示：“我考虑过这件事。我当时想，‘你知道，也许我应该这么做’，但现阶段我还没有提出来。现在可能还不算晚。”","en":"特朗普称必要时愿赦免黄仁勋 不排除美国政府入股英伟达\n据纽约邮报报道，特朗普表示，如有必要，他愿意赦免黄仁勋，但他认为，黄仁勋即使没有获得赦免也不会有事，并应在下周赴国会作证时“实话实说”。此前曾向英伟达(NVDA.O)董事会施压、要求恢复黄仁勋职务的特朗普，在该公司股价周一飙升后颇为得意。他在接受该媒体采访期间坐在白宫椭圆形办公室的桌前查看最新股价数据，并指出英伟达股价在周二午后有所回升，收复了当天早些时候的部分跌幅。特朗普在查看数据时评论道：“还不错，跌了几个百分点，但尾盘确实回升了不少。”特朗普补充称，黄仁勋下周接受国会问询时，无需援引美国宪法第五修正案赋予的权利，以避免自证其罪。特朗普表示，英伟达的成功对于美国保持人工智能领域的领先优势至关重要，他甚至对英伟达向美国政府提供股权持开放态度，特朗普表示：“我考虑过这件事。我当时想，‘你知道，也许我应该这么做’，但现阶段我还没有提出来。现在可能还不算晚。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2125382264318226903","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":0,"vw":1018},{"id":"2125381958297641369","h":"bboczeng","ts":1795565521,"zh":"据《纽约邮报》报道，特朗普表示，美国现在入股英伟达（$NVDA）\"为时未晚\"。特朗普称，他尚未提出美国持有英伟达股份的可能性。","en":"据《纽约邮报》报道，特朗普表示，美国现在入股英伟达（$NVDA）\"为时未晚\"。特朗普称，他尚未提出美国持有英伟达股份的可能性。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125381958297641369","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":0,"rp":2,"vw":1189},{"id":"2125378636874477926","h":"dmjk001","ts":1795564729,"zh":"【国联民生策略】新301关税有何影响？-1124\n事件：WSJ报道称“产能过剩”301关税最快在本周二落地。BBG称，知情人士表示，特朗普认为新301关税将有针对性实施，而非全面统一税率。\n1、300亿美元降税可以托底经贸谈判不破裂。\n尽管新增301关税的对华税率可能大于7.5%，但考虑部分行业豁免，再加上300亿美元商品降税安排（其中90%以上商品恢复至MFN税率），综合新增税率有可能仍低于吉隆坡共识安排的20%（原芬太尼10%+对等关税10%），不会触发中方反制。\n若税率远大于7.5%，且暂不落地降税安排，或计入降税安排后新增综合税率仍远超20%，才会触发大家担心的中方反制。\n2、新301出台并不代表美国蓄意开打贸易战。\n总体形势上，我们认为2027年的中美关系或有波折，但焦点在科技博弈，失势的特朗普嫡系可能被动配合对华鹰派。我们前期私信对这一观点已经有所铺垫。\n但即便科技博弈会比较激烈，未来中美在关税议题上也不会再多纠结了。\n一方面，经过25年10月的中美关系摩擦，美方对单边对华制裁已经非常小心，特朗普不愿承担被断供稀土的政治压力，因此不愿恶化中美关系。此前Megaspeed案件在商务部一直引而不发，也是基于这层考虑。美方有理由尽量避免税率赤裸裸的突破中美吉隆坡共识安排。\n另一方面，尽管中国鹰派在科技政策上拿到了主动权：禁芯片出口、禁算力租赁、禁先进设备，但在关税议题上特朗普-贝森特-格里尔仍然是掌握主动权的。现在共和党的关税鹰派并不掌权，民主党更是主张这一轮的301关税都应被废除。因为关税权在国会，大范围关税必须由国会发起或授权，否则应被依法取消。所以，也不存在外部压力让中美在关税议题上结仇。@所有人","en":"【国联民生策略】新301关税有何影响？-1124\n事件：WSJ报道称“产能过剩”301关税最快在本周二落地。BBG称，知情人士表示，特朗普认为新301关税将有针对性实施，而非全面统一税率。\n1、300亿美元降税可以托底经贸谈判不破裂。\n尽管新增301关税的对华税率可能大于7.5%，但考虑部分行业豁免，再加上300亿美元商品降税安排（其中90%以上商品恢复至MFN税率），综合新增税率有可能仍低于吉隆坡共识安排的20%（原芬太尼10%+对等关税10%），不会触发中方反制。\n若税率远大于7.5%，且暂不落地降税安排，或计入降税安排后新增综合税率仍远超20%，才会触发大家担心的中方反制。\n2、新301出台并不代表美国蓄意开打贸易战。\n总体形势上，我们认为2027年的中美关系或有波折，但焦点在科技博弈，失势的特朗普嫡系可能被动配合对华鹰派。我们前期私信对这一观点已经有所铺垫。\n但即便科技博弈会比较激烈，未来中美在关税议题上也不会再多纠结了。\n一方面，经过25年10月的中美关系摩擦，美方对单边对华制裁已经非常小心，特朗普不愿承担被断供稀土的政治压力，因此不愿恶化中美关系。此前Megaspeed案件在商务部一直引而不发，也是基于这层考虑。美方有理由尽量避免税率赤裸裸的突破中美吉隆坡共识安排。\n另一方面，尽管中国鹰派在科技政策上拿到了主动权：禁芯片出口、禁算力租赁、禁先进设备，但在关税议题上特朗普-贝森特-格里尔仍然是掌握主动权的。现在共和党的关税鹰派并不掌权，民主党更是主张这一轮的301关税都应被废除。因为关税权在国会，大范围关税必须由国会发起或授权，否则应被依法取消。所以，也不存在外部压力让中美在关税议题上结仇。@所有人","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2125378636874477926","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":0,"rt":0,"rp":0,"vw":278},{"id":"2125375448704323696","h":"dmjk001","ts":1795563969,"zh":"路透：三名知情人士周二表示，特朗普政府即将公布一项调查结果，该调查旨在应对美国16个主要贸易伙伴涉嫌存在的过剩工业产能，预计将对多种商品征收新的进口关税。\n这些人士称，调查结果预计最早于周二下午公布。美国贸易代表办公室预计将提议征收新关税，这些关税将叠加在唐纳德·特朗普总统第二任期内已实施的前几轮关税之上。","en":"路透：三名知情人士周二表示，特朗普政府即将公布一项调查结果，该调查旨在应对美国16个主要贸易伙伴涉嫌存在的过剩工业产能，预计将对多种商品征收新的进口关税。\n这些人士称，调查结果预计最早于周二下午公布。美国贸易代表办公室预计将提议征收新关税，这些关税将叠加在唐纳德·特朗普总统第二任期内已实施的前几轮关税之上。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX7Zmu9akAA0O60.jpg?name=orig"],"u":"https:// 伟达方面，董事会已于 11月23日 一致决定让黄仁勋复任 CEO，即刻生效，Colette Kress 回任 CFO，临时 CEO 安排已经结束。\n小结\n今天盘面的主线是从科技股向防御板块轮动。半导体、存储和 AI 基础设施大跌，医药、软件、零售和军工走强，道指和小盘股收涨。HPE、SMTC 的财报加重了硬件板块的抛压。下一个交易日重点关注 DELL 盘后财报对 AI 服务器板块的影响。","en":"【美股复盘 · 11月24日】\n大市\n美股三大指数涨跌不一，科技股明显走弱。纳指(QQQ)收于 638.10，跌 1.99%，在主要指数中跌幅最大。标普(SPY)收于 718.58，跌 0.51%。道指(DIA)收于 499.64，涨 0.77%。罗素小型股(IWM)收于 267.14，涨 0.53%。资金流出科技权重股，转向防御板块和小盘股。市宽偏弱，107 只观察股中 41 只上涨、66 只下跌。\n板块\n半导体与 AI 硬件领跌。 $MU 跌 10.97%，SNDK 跌 11.13%，存储板块抛压集中。TXN 跌 11.25%，CRDO 跌 13.07%，AEHR 跌 13.65%。AI 算力链同步大跌，CRWV 跌 11.85%，IREN 跌 11.54%。半导体三倍做空 ETF SOXS 涨 24.21%，纳指三倍做空 ETF SQQQ 涨 5.92%，两只做空 ETF 的涨幅说明科技股抛压很重。医药板块表现最强。MRNA 涨 7.21%，MRK 涨 4.50%，LLY 涨 3.15%，NVO 涨 2.99%。软件股逆势走强，CRM 涨 4.21%，ADBE 涨 3.62%。零售股 TGT 涨 4.68%，军工股 LMT 涨 2.62%。\n焦点\nSMTC 跌 16.97%，HPE 跌 16.31%，分列跌幅榜第一、第二。两家公司都在前一交易日盘后发布财报，今天的大跌主要是对财报的反应。DELL 跌 11.83%，与硬件板块整体走弱同步。DELL 财报定于今天盘后公布，影响的是下一个交易日的走势，与今天的下跌无关。英伟达方面，董事会已于 11月23日 一致决定让黄仁勋复任 CEO，即刻生效，Colette Kress 回任 CFO，临时 CEO 安排已经结束。\n小结\n今天盘面的主线是从科技股向防御板块轮动。半导体、存储和 AI 基础设施大跌，医药、软件、零售和军工走强，道指和小盘股收涨。HPE、SMTC 的财报加重了硬件板块的抛压。下一个交易日重点关注 DELL 盘后财报对 AI 服务器板块的影响。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2125366066251759667","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":2,"rt":1,"rp":2,"vw":1012},{"id":"2125354281838817685","h":"ArtofSpecuycky","ts":1795558922,"zh":"看了最近大部分财报，adi -17%，hpe -17%，dell财报非常好但只涨了2%，amba double miss刚刚盘后-40%。今天财政部还抽水，这些都说明市场情绪和流动性都太差了。什么还没怎么跌就空什么，或者说什么弱势就持续沿着ema 10 20接着空直到站上ema 20为止，再看大一点的反弹。","en":"看了最近大部分财报，adi -17%，hpe -17%，dell财报非常好但只涨了2%，amba double miss刚刚盘后-40%。今天财政部还抽水，这些都说明市场情绪和流动性都太差了。什么还没怎么跌就空什么，或者说什么弱势就持续沿着ema 10 20接着空直到站上ema 20为止，再看大一点的反弹。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ArtofSpecuycky/status/2125354281838817685","l":[],"ln":[],"t":["财报"],"lk":6,"rt":1,"rp":4,"vw":1385},{"id":"2125351289647505724","h":"bboczeng","ts":1795558209,"zh":"据美联社（AP）报道，美国法院刚刚裁定，中国科技巨头华为犯有银行欺诈罪，以及共谋窃取美国企业商业机密罪。\n具体细节包括：\n1. 检方表示，华为就其在伊朗开展的业务误导了包括汇丰银行（HSBC）在内的多家银行，违反了美国的制裁规定。\n2. 涉及商业机密窃取的目标企业包括思 迪西。\n地区电视台 Antenna Sud 在机场拍到了他，预计他将在一家高档度假村下榻数日。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125326310339969353","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":1,"vw":478},{"id":"2125321396817707339","h":"bboczeng","ts":1795551082,"zh":"对散户而言，要想让华尔街给你送钱，日常定投是基础，\n几何结构，则是我们准备好现金仓位大举抄底的依据\n虽然K线形态有分形和过拟合的风险，但在大尺度下，几何结构实际上有相当重要的参考价值\n这点从2020-2025年的多次回调中都能看出\n有关这一系统性的投资观点，我将在整理成册，收录在未来的《美股几何学》中\n谢谢大家","en":"对散户而言，要想让华尔街给你送钱，日常定投是基础，\n几何结构，则是我们准备好现金仓位大举抄底的依据\n虽然K线形态有分形和过拟合的风险，但在大尺度下，几何结构实际上有相当重要的参考价值\n这点从2020-2025年的多次回调中都能看出\n有关这一系统性的投资观点，我将在整理成册，收录在未来的《美股几何学》中\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125321396817707339","l":[],"ln":[],"t":["美股"],"lk":1,"rt":0,"rp":0,"vw":224},{"id":"2125319941822050680","h":"AntonLaVay","ts":1795550735,"zh":"这个提醒发的时候是在夜盘，当时 $NVDA 跌0.68%\n我记得清清楚楚，当时我在刷推，看到了大量政治人物的表态，我让Grok为我总结了他们发言如下：\n表态批评的几乎包括了民主党的每一个派系还有共和党的传统建制派与对华强硬派。\n$NVDA Jensen Huang Donald Trump\n他们处于风暴的中心。\n并且注意，在Jensen 回归之后，这些被BIS定义为“Circular relationships among AI firms” 的循环融资会被拿着放大镜的观察。\n政治的风暴中心，伴随着合规官和更多内控措施的上台，很可能Jensen 并不能像之前一样行动自如。","en":"这个提醒发的时候是在夜盘，当时 $NVDA 跌0.68%\n我记得清清楚楚，当时我在刷推，看到了大量政治人物的表态，我让Grok为我总结了他们发言如下：\n表态批评的几乎包括了民主党的每一个派系还有共和党的传统建制派与对华强硬派。\n$NVDA Jensen Huang Donald Trump\n他们处于风暴的中心。\n并且注意，在Jensen 回归之后，这些被BIS定义为“Circular relationships among AI firms” 的循环融资会被拿着放大镜的观察。\n政治的风暴中心，伴随着合规官和更多内控措施的上台，很可能Jensen 并不能像之前一样行动自如。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX6nOJpWwAAK68z.jpg?name=orig","https://pbs.twimg.com/media/HX6nOJfXEAAVG7r.jpg?name=orig"],"u":"https://x.com/AntonLaVay/status/2125319941822050680","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":2,"vw":777},{"id":"2125317576897220728","h":"bboczeng","ts":1795550171,"zh":"据 Vanda Research 数据显示，自 11 月 4 日以来，散户投资者累计买入了 35 亿美元的英伟达（$NVDA）股票。\n与此同时，他们在其他所有美国个股上合计净卖出了 8.93 亿美元。\n仅过去 10 个交易日，散户就净买入了 32 亿美元的英伟达股票，同时净卖出了 3.31 亿美元的其他股票。\n而英伟达股价自 11 月 4 日以来已下跌 24%。\n散户投资者正在全仓押注英伟达。","en":"据 Vanda Research 数据显示，自 11 月 4 日以来，散户投资者累计 n都是本次熊市的典型标志罢了\n至于特朗普，一个极度自恋，任人唯亲，热衷权贵，不懂经济，\n四处打战，最懂关税的老人\n不把美国搞砸就不错了\n😭😭","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125314392619466919","l":[],"ln":[],"t":["关税贸易"],"lk":0,"rt":0,"rp":0,"vw":108},{"id":"2125310013644095573","h":"AntonLaVay","ts":1795548368,"zh":"你也能威胁美国了？","en":"你也能威胁美国了？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2125310013644095573","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":901},{"id":"2125309287673258249","h":"bboczeng","ts":1795548195,"zh":"看能不能跌到$50，跌破一万亿","en":"看能不能跌到$50，跌破一万亿","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125309287673258249","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":443},{"id":"2125309097570709722","h":"bboczeng","ts":1795548149,"zh":"据《华尔街日报》（WSJ）报道，特朗普总统正准备对中国、欧盟以及其他 14 个经济体加征\"全面\"新关税。\n拟议中的关税将覆盖大多数进口商品，其中欧盟、日本和韩国面临的关税税率预计不超过 15%。\n据报道，中国、越南和印度可能面临更高的关税税率。\n受此消息影响，纳斯达克 100 指数期货跌幅扩大至 2.5%。","en":"据《华尔街日报》（WSJ）报道，特朗普总统正准备对中国、欧盟以及其他 14 个经济体加征\"全面\"新关税。\n拟议中的关税将覆盖大多数进口商品，其中欧盟、日本和韩国面临的关税税率预计不超过 15%。\n据报道，中国、越南和印度可能面临更高的关税税率。\n受此消息影响，纳斯达克 100 指数期货跌幅扩大至 2.5%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125309097570709722","l":[],"ln":[],"t":["美股","关税贸易"],"lk":5,"rt":0,"rp":1,"vw":1200},{"id":"2125308475794448545","h":"bboczeng","ts":1795548001,"zh":"SNDK再跌下去，要回30了（拆股前240）\n😭😭😭","en":"SNDK再跌下去，要回30了（拆股前240）\n😭😭😭","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/bboczeng/status/2125308475794448545","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":4,"vw":1327},{"id":"2125307908653212116","h":"bboczeng","ts":1795547866,"zh":"据Business Insider报道，老板们曾在工作中大力推行 AI，如今却被\"workslop\"淹没了。\n所谓\"workslop\"，指的是看起来很精致、实则质量低劣、需要同事来收拾烂摊子的 AI 产出。\n一些公司已开始出台新的 AI 使用政策，甚至不惜解雇员工。","en":"据Business Insider报道，老板们曾在工作中大力推行 AI，如今却被\"workslop\"淹没了。\n所谓\"workslop\"，指的是看起来很精致、实则质量低劣、需要同事来收拾烂摊子的 AI 产出。\n一些公司已开始出台新的 AI 使用政策，甚至不惜解雇员工。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125307908653212116","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":842},{"id":"2125306251261378563","h":"bboczeng","ts":1795547471,"zh":"Anthropic，彻底破发：","en":"Anthropic，彻底破发：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX6aeTjagAECExa.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2125306251261378563","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":2,"vw":250},{"id":"2125303416167801248","h":"octopusycc","ts":1795546795,"zh":"得到正式认可的","en":"Approved","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/octopusycc/status/2125303416167801248","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":705},{"id":"2125302515642343755","h":"BrantChinesefn","ts":1795546580,"zh":"这两天，我满仓了英伟达。分享一下我具体的交易逻辑。\n其实在引用的一期视频里面，我已经提到过我的想法。\n首先是大方向。即便大盘处于下跌趋势，甚至是一个熊市，在经历大幅下跌之后，也会出现阶段性的反弹。如果连像样的反弹都没有，那就叫崩盘。\n上周五6%的下跌，这周一7%的上涨，甚至一度触发熔断。这里面有空头回补，也有闲置资金的初步建仓。无论是哪一种，都意味着市场短期内出现了一定的见底迹象。在前几个交易日上下接近14%的波动之后，最近几天3%左右的涨跌幅，我认为都属于非常正常的局部消化。\n所以我现在对市场的观点很明确：我们要看一轮或大或小的阶段性反弹，而不是讨论熊市是否已经结束。而且我的反弹目标也不高，涨个百分之五六我就可以减仓，再涨个百分之八九我就可以清仓。\n那么为什么我选择满仓英伟达，而不是其他半导体股票？\n如果大家翻看我过去的帖子就会发现，在老黄出事之前，我一直看好的就是英伟达。老黄离开的这段时间，我不再看好英伟达。但随着老黄的回归，我的观点也重新回到了之前：英伟达依然是曾经的那个英伟达，只不过产业链上的一些东西可能会发生变化。\n在老黄离开的这11天里，我不认为英伟达的核心业务、竞争优势和盈利能力发生了根本性的变化。面对已经暴跌了这么多的英伟达，股价下来了，估值下来了，但其业务体量和行业地位并没有因此发生根本改变。\n英伟达和其他半导体公司不一样，它是这一轮AI产业发展的核心起点。所以在当下的市场环境中，我认为英伟达是半导体板块里面相对最稳、反弹逻辑最清晰的标的。\n大盘如果要往上涨，英伟达很可能是重要的推动力量。这里面可以有Mega Seven的集体带动，但未必需要整个半导体板块全面上涨。\n所以接下来很有可能出现一种行情：英伟达表现得非常强势，而其他半导体股票涨跌互现。\n这就是为什么我做多只挑英伟达。如果英伟达在这么多利好因素的推动下都涨不起来，那其他半导体股票更完了。\n另外，黄仁勋马上要召开全员大会。大家可以想一下，站在黄仁勋的角度，回归之后的第一次全员大会，他最需要做的事情是什么？他是能承认叛国，还是能承认走私？\n无论是王者归来也好，失而复得也罢，他现在最需要做的，就是描绘未来的宏伟蓝图、振奋人心、重建信心，尽可能修复过去11天给公司带来的负面影响。\n所以我认为，这次全员大会大概率会释放积极的信号，至于市场是否买账，那是另外一回事。\n大家要注意，我现在做多英伟达，并不代表我已经全面看多美股，也不代表我认为整个半导体板块已经见底。\n宏观判断是宏观判断，交易机会是交易机会。看个反弹不需要那么多理由。\n操作上和过往的风格不同，那只是我最近从过往分析师的角度变成了一个交易员的角度。\n在当下这个时间节点，英伟达是我认为反弹逻辑最清晰、风险收益比最有吸引力的标的。\n上面是我语音给AI，AI给我写的，我略微修改了几处。如果让我自己打字，我会写的很短：我都all in了，肯定有我的道理的，没道理我能all in吗。哈哈哈 🤣 而且我252%的年化，抗点浮亏或者就真亏了，能咋滴。\n#美股 #英伟达 $NVDA $QQQ $NQ $SOXX","en":"这两天，我满仓了英伟达。分享一下我 现在想想，这样的一天或许遥遥无期，也有可能永远不会来，因为我已经投降了。\n不过也没关系，在这个社区，我大半的目的早已经达到。\n我之前在其他平台有刷到过相亲男博主，帅气、多金、温柔，还体贴的带女生去吃fine dining并大方赠予一些餐后礼物。\n我那时候会想，是剧本吗？\n大概是的，这样的男生或许不用相亲也可以找到很好的对象，不至于把这些流程精心拍下来再发到网上。\n他只是知道部分人类喜欢看什么，并把这些呈现出来。\n一切都是为了流量，精致奢华都是戴在脸上的面具。\nU这个账号也是如此，只不过我，又或者是我的朋友，都是拙劣的厨师，我们烹饪不出令人赞叹的美味佳肴。\n所以，目的是为了流量，但还是想原汁原味一些。\n毕竟我的想法已经从做一个账号变成，这是一张个人展示的名片。\n我爱旅游，爱美食，也爱交易。\n所以旅游留学美食都可以咨询我，免费的，或许有人会需要。\n但交易不可以，因为我很菜。\n我在踏入市场之前我想的是，多赚点钱补贴家用，但现在早已经变成了，我的天！我靠！我草！好痛苦！泪流满面！\n但我也开始相信，这就是我等待了很久的，我觉得我会热爱的，可以贯穿我人生始终的另外一份事业。\n这些年做过不少事，或者是自己，或者是大哥兄弟带我，不过也可以说是辛辛苦苦亏了很多钱。\n开过店，也搞过电商、直播、户外社群，甚至还有山姆县城代购和水果批发（以上基本都是失败）。\n我一直觉得没什么，人生就是这样！永远可以从头再来！\n永远热血，永远向前！\n就和做交易一样，我觉得我是交易小白，虽然现实对一级市场有一点了解，也进行过一些商业研究，但股票市场，重新让我知道：小子，你不行！\n我也不会说什么越挫越勇我命由我不由天之类的话，因为我知道这个冷漠的市场，不需要慷慨激昂的情绪。\n只需要我去不断的失败，不断的学习，不断的复盘，直到略有小成。（当然现在还在失败阶段。）\n我已经在路上了，你呢？要和我一起吗？","en":"这是一篇我想写了很久的置顶。\n本来是想留到我通过创作者收益那一天，再洋洋洒洒写一篇宣告胜利与喜悦，顺带介绍介绍自己的。\n但现在想想，这样的一天或许遥遥无期，也有可能永远不会来，因为我已经投降了。\n不过也没关系，在这个社区，我大半的目的早已经达到。\n我之前在其他平台有刷到过相亲男博主，帅气、多金、温柔，还体贴的带女生去吃fine dining并大方赠予一些餐后礼物。\n我那时候会想，是剧本吗？\n大概是的，这样的男生或许不用相亲也可以找到很好的对象，不至于把这些流程精心拍下来再发到网上。\n他只是知道部分人类喜欢看什么，并把这些呈现出来。\n一切都是为了流量，精致奢华都是戴在脸上的面具。\nU这个账号也是如此，只不过我，又或者是我的朋友，都是拙劣的厨师，我们烹饪不出令人赞叹的美味佳肴。\n所以，目的是为了流量，但还是想原汁原味一些。\n毕竟我的想法已经从做一个账号变成，这是一张个人展示的名片。\n我爱旅游，爱美食，也爱交易。\n所以旅游留学美食都可以咨询我，免费的，或许有人会需要。\n但交易不可以，因为我很菜。\n我在踏入市场之前我想的是，多赚点钱补贴家用，但现在早已经变成了，我的天！我靠！我草！好痛苦！泪流满面！\n但我也开始相信，这就是我等待了很久的，我觉得我会热爱的，可以贯穿我人生始终的另外一份事业。\n这些年做过不少事，或者是自己，或者是大哥兄弟带我，不过也可以说是辛辛苦苦亏了很多钱。\n开过店，也搞过电商、直播、户外社群，甚至还有山姆县城代购和水果批发（以上基本都是失败）。\n我一直觉得没什么，人生就是这样！永远可以从头再来！\n永远热血，永远向前！\n就和做交易一样，我觉得我是交易小白，虽然现实对一级市场有一点了解，也进行过一些商业研究，但股票市场，重新让我知道：小子，你不行！\n我也不会说什么越挫越勇我命由我不由天之类的话，因为我知道这个冷漠的市场，不需要慷慨激昂的情绪。\n只需要我去不断的失败，不断的学习，不断的复盘，直到略有小成。（当然现在还在失败阶段。）\n我已经在路上了，你呢？要和我一起吗？","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX51Tk1bAAAP-zG.jpg?name=orig"],"u":"https://x.com/u6395571585830/status/2125265064458600918","l":[],"ln":[],"t":[],"lk":99,"rt":16,"rp":44,"vw":7773},{"id":"2125263067474788717","h":"maojietrading","ts":1795537175,"zh":"SOXL盘中再次试探30且把昨天涨幅全部吞没，数据诚不欺我\n我们近期最严重的一个避雷板块就是半导体，空军一号，从10月份开始到现在反复重申\n除非短线高手，否则左侧慎重","en":"SOXL盘中再次试探30且把昨天涨幅全部吞没，数据诚不欺我\n我们近期最严重的一个避雷板块就是半导体，空军一号，从10月份开始到现在反复重申\n除非短线高手，否则左侧慎重","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX5zf1KXkAALHv0.jpg?name=orig"],"u":"https://x.com/maojietrading/status/2125263067474788717","l":[],"ln":[],"t":["AI科技"],"lk":26,"rt":0,"rp":1,"vw":4612},{"id":"2125262241901814212","h":"octopusycc","ts":1795536978,"zh":"来吧\n14天 US Stock Only\n开战！\n另外可以来这里投票谁会是第一名","en":"来吧\n14天 US Stock Only\n开战！\n另外可以来这里投票谁会是第一名","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2125262241901814212","l":["app.mojo.trade"],"ln":[{"u":"https://app.mojo.trade/competition/zh/predict/","d":"app.mojo.trade"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":615},{"id":"2125262200780853680","h":"qinbafrank","ts":1795536968,"zh":"为什么Citadel认为当下美股走势跟2018年末很像？城堡证券宏观策略主管 Frank Flight最新报告认为，当下最像 2018 年秋天的地方，是三个市场对美国经济给出了不同答案：\n1）周期股和信用市场已经在为增长减速定价；\n2）分析师仍然预计明年盈利强劲增长；\n3）美联储面对的通胀又足以让它继续考虑加息，三者可以暂时并存。\n潜在的风险在于，如果周期股先看对了，科技股要同时面对盈利预期下修和高利率压估值，投资者却容易在第一轮暴跌后认定风险已经释放。\nCitadel看到的信号：强势美元、周期股走弱、高企的债券收益率以及恶化的增长预期。他们认为周一的剧烈反弹并未完全计价这些风险。\n个人角度用2018年类比对识别风险传导很有价值，但对预测 12 月底部的价值很有限。 接下来最值得跟踪的是三个数能否一起改善：周期股相对防御股的表现、投资级信用利差、2027 年科技盈利增速预期；\n1）如果周期股持续修复、信用利差收窄、科技盈利预期经得起财报检验，即使美联储暂缓转向，11 月的低点也会获得更多基本面支撑。\n2）反过来，如果纳指反弹，周期股仍跑输、信用利差继续扩大，然后科技盈利增速预期也开始下修，那么 Flight 警告的第二轮调整才真正有了条件。","en":"为什么Citadel认为当下美股走势跟2018年末很像？城堡证券宏观策略主管 Frank Flight最新报告认为，当下最像 2018 年秋天的地方，是三个市场对美国经济给出了不同答案：\n1）周期股和信用市场已经在为增长减速定价；\n2）分析师仍然预计明年盈利强劲增长；\n3）美联储面对的通胀又足以让它继续考虑加息，三者可以暂时并存。\n潜在的风险在于，如果周期股先看对了，科技股要同时面对盈利预期下修和高利率压估值，投资者却容易在第一轮暴跌后认定风险已经释放。\nCitadel看到的信号：强势美元、周期股走弱、高企的债券收益率以及恶化的增长预期。他们认为周一的剧烈反弹并未完全计价这些风险。\n个人角度用2018年类比对识别风险传导很有价值，但对预测 12 月底部的价值很有限。 接下来最值得跟踪的是三个数能否一起改善：周期股相对防御股的表现、投资级信用利差、2027 年科技盈利增速预期；\n1）如果周期股持续修复、信用利差收窄、科技盈利预期经得起财报检验，即使美联储暂缓转向，11 月的低点也会获得更多基本面支撑。\n2）反过来，如果纳指反弹，周期股仍跑输、信用利差继续扩大，然后科技盈利增速预期也开始下修，那么 Flight 警告的第二轮调整才真正有了条件。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX5xyoAacAAtFAz.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2125262200780853680","l":[],"ln":[],"t":["美联储","通胀","美股","财报"],"lk":1,"rt":0,"rp":0,"vw":1429},{"id":"2125260390347186264","h":"tig88411109","ts":1795536537,"zh":"$ANT 这种都是复制经典的IPO上市后的走势，企业基本面和前景以及估值我都分析过了。但核心肯定不是看这个股票，现在市场担心的是什么？\n黄仁勋回归了，空头还没死绝，马上周三就是重要通胀数据出台，意味着美联储什么路线或者误读风险\n我的判断是尽快空头投降，不要拿着2018年的老剧本天天讲今年是不是复制年底前先二次探底大跌，在明年上涨。都这么重复历史，哪有什么未来和创造？\n当然尾部事件是什么？如何投资策略和仓位布局，真正的投资者不是靠预测过日子。就如 $AEO美鹰服饰从财报后大跌到现在连涨60%，相对科技股更是近1倍超额收益了，但是跌倒底线的时候，谁不是破口大骂？\n看看今天老登股看看今天的科技股的估值和发展和盈利？是不是这才是未来认知差和超额收益的来源，不然每天都被市场的波动玩弄反复收割。\n连续大涨超过估值上限，明确要减仓控制仓位，却一心觉得树能长到天上去，和今天是一种心理，两个极端。\n等坏消息也砸不出新低，吹尽狂沙始到金。树不会长到天上去。再好的板块，涨多了也会透支赔率。再差的情绪，跌到脱离合理价值以后，也会出现修复。\n颗粒度更细见订阅者专享，完整版策略深度，AI基本面资金黑洞拆解、未来 3 个月磨底节奏、以及“保险费式”仓位隔离法。","en":"$ANT 这种都是复制经典的IPO上市后的走势，企业基本面和前景以及估值我都分析过了。但核心肯定不是看这个股票，现在市场担心的是什么？\n黄仁勋回归了，空头还没死绝，马上周三就是重要通胀数据出台，意味着美联储什么路线或者误读风险\n我的判断是尽快空头投降，不要拿着2018年的老剧本天天讲今年是不是复制年底前先二次探底大跌，在明年上涨。都这么重复历史，哪有什么未来和创造？\n当然尾部事件是什么？如何投资策略和仓位布局，真正的投资者不是靠预测过日子。就如 $AEO美鹰服饰从财报后大跌到现在连涨60%，相对科技股更是近1倍超额收益了，但是跌倒底线的时候，谁不是破口大骂？\n看看今天老登股看看今天的科技股的估值和发展和盈利？是不是这才是未来认知差和超额收益的来源，不然每天都被市场的波动玩弄反复收割。\n连续大涨超过估值上限，明确要减仓控制仓位，却一心觉得树能长到天上去，和今天是一种心理，两个极端。\n等坏消息也砸不出新低，吹尽狂沙始到金。树不会长到天上去。再好的板块，涨多了也会透支赔率。再差的情绪，跌到脱离合理价值以后，也会出现修复。\n颗粒度更细见订阅者专享，完整版策略深度，AI基本面资金黑洞拆解、未来 3 个月磨底节奏、以及“保险费式”仓位隔离法。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX5xEARa8AAJysT.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2125260390347186264","l":[],"ln":[],"t":["美联储","通胀","财报"],"lk":8,"rt":0,"rp":1,"vw":1378},{"id":"2125258837259387001","h":"Kay2289123","ts":1795536166,"zh":"10/25 昨天情绪面太过于强烈。我提到分享了卖出了一部分获利了结，不贪心。欢迎回看引用的帖子\n今天利用昨天卖出的部分，再次买入，反复吃到波段变化","en":"10/25 昨天情绪面太过于强烈。我提到分享了卖出了一部分获利了结，不贪心。欢迎回看引用的帖子\n今天利用昨天卖出的部分，再次买入，反复吃到波段变化","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Kay2289123/status/2125258837259387001","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":1,"vw":2248},{"id":"2125258205798474098","h":"xingpt","ts":1795536016,"zh":"再看一下这张图，我们也许还在半山腰","en":"再看一下这张图，我们也许还在半山腰", 波音，并将宣布包含大量大豆采购的协议（中方未确认）。\n3）强迫劳动301在被起诉，因此理论上它也有可能跟IEEPA关税一样被判违法。\n6、明年主要的中美关系风险点可能还是科技和投资领域\n关注近期几个重要对华法案和黄仁勋听证会民主党的诘问情况。","en":"【GMF市场追踪】关于WSJ报道的美国上调关税\n1、WSJ报道内容\n1）美国贸易代表Greer最早本周公布\"结构性产能过剩\"301调查结果，涉及中国、欧盟、日本、韩国等 16 个经济体。\n2）新关税覆盖大多数商品，税率未定。\n3）其中欧盟、日本、韩国预计总税率15%或更低，与2025年协议一致。越南、印度可能更高。中国可能高于多数国家。\n4）文本可能加入升级条款，即产能过剩恶化或后续谈判无进展时可再上调。新关税将叠加在7月\"强迫劳动\"301的10%–12.5%之上。\n2、调查本身不意外\n今年2月IEEPA关税被最高法院推翻后，美方用两项301调查来接续。一项是7月落地的\"强迫劳动\"301关税，对60个国家征收10-12.5%，对华税率是12.5%。另一项就是本次报道的产能过剩301。Greer在11月20日已公开表示该调查的结果\"很快\"公布。增量信息只有时间提前到本周以及可能带升级条款。\n3、基准情景：对华的关税幅度补足至20%（额外加7.5%）。\n中方在7月披露，美方在磋商中承诺对华替代性加征关税不超在20%，美方未公开确认。这一水平对应去年吉隆坡安排下的10%芬太尼关税加10%对等关税，因此也被称作是“吉隆坡协议”。目前已落地12.5%，因此反算美国剩余301关税空间是7.5个百分点。预计该关税可能在未来几周内落地，也不排除暂不征收（维持12.5%）或只征一部分。\n4、注意2点\n1）这20%的301关税是叠在最惠国关税（MFN）和2018–19 年的原301关税（7.5%–25%）之上。\n2）吉隆坡协议的休战在2027年1月10日到期，美方178 项301豁免和港口费暂停到1月9日到期。休战若延续，两项301调查的累计关税大概率维持在 12.5%–20%区间，若不延续，则20%的约束随之失效，美方理论上可以继续上调。\n5、好于预期的可能性存在。\n1）近期中美双方其实相互释放了一些缓和信号。比如今天商务部公告，2024 年第 46 号公告第二款（镓、锗、锑、超硬材料对美出口限制）继续暂停至 2027年1月27日。此前11月9日，稀土相关六项管制已延长暂停至 1月10日。\n2）特朗普11月23日接受CNBC采访时也称，中国将再买250架波音，并将宣布包含大量大豆采购的协议（中方未确认）。\n3）强迫劳动301在被起诉，因此理论上它也有可能跟IEEPA关税一样被判违法。\n6、明年主要的中美关系风险点可能还是科技和投资领域\n关注近期几个重要对华法案和黄仁勋听证会民主党的诘问情况。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2125237180872392941","l":[],"ln":[],"t":["关税贸易"],"lk":6,"rt":1,"rp":0,"vw":1739},{"id":"2125235442576699621","h":"dmjk001","ts":1795530589,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HX5aXZWaAAAO-d5.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2125235442576699621","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":2558},{"id":"2125235395034325376","h":"ShanghaoJin","ts":1795530577,"zh":"@KKStewie0 他taco不taco都不知道，所以还是别随着新闻去交易\n市场有很多随机不确定，也有很多确定性","en":"@KKStewie0 他taco不taco都不知道，所以还是别随着新闻去交易\n市场有很多随机不确定，也有很多确定性","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2125235395034325376","l":[],"ln":[],"t":[],"lk":10,"rt":1,"rp":2,"vw":3782},{"id":"21252352 d":"2125223983582941593","h":"qinbafrank","ts":1795527857,"zh":"民主党的这两天动作在加速，小特朗普和万斯都成了调查对象\n1、调查小特朗普利于影响力帮助被投公司拿到国防订单或者获取监管便利政策\n拉斯金是众议院司法委员会民主党首席议员，也将在2027年1月出任司法委员会委员会主席，准备调查小特朗普。拉斯金昨晚向四家公司发函，要求提供过去两年与风险投资公司1789 Capital的全部内部通信记录及其他相关文件。四家公司为：\n1）Hadrian Automation（国防承包商）\n2）Juul Labs（电子烟）\n3）Polymarket（预测市场）\n4）GrabAGun（在线枪械零售商）\n拉斯金核心指控是“serendipitous timing”（过于巧合的时机），小特朗普在24年大选后成为1789 Capital合伙人，投资这些公司后不久，它们就获得了联邦合同或有利监管决定。他质疑Don Jr.是否利用内幕信息或对政府决策的影响力来牟利。\n具体时间线要点：\n1）Hadrian：2025年引入1789作为投资人后，2026年3月获得近10亿美元海军和陆军合同（首次联邦合同）。公司估值大幅上升。\n2）Juul：1789于2025年3月入股约500万美元后，约四个月后（2025年7月）FDA批准其多款电子烟产品（包括薄荷味）继续销售，此前监管态度较严。\n3）Polymarket：1789投资数千万美元后，司法部和CFTC于2025年7月结束对其调查；随后获准收购衍生品交易所，从而进入美国市场。\n4）GrabAGun：在1789帮助下上市并让Don Jr.进入董事会后，2026年5月ATF提出规则，拟放宽在线购枪并直接寄送到家的限制。\n1789 Capital管理资产从约1.5亿–2亿美元飙升至超过30亿美元。拉斯金将此与“利用总统家庭内部渠道操纵政策与市场”联系起来\n2、调查万斯帮助石油企业谋利\n民主党参议员Maggie Hassan（新罕布什尔州民主党人），将在2027年1月出任参议院国土安全与政府事务委员会主席。\n她于昨晚向副总统JD Vance发信，要求其办公室在12月14日前提供文件。包括万斯或其助手与荷兰维多石油公司交易员约翰·艾迪生以及该企业之间的通信记录。\n哈桑在信中写道，万斯“可能利用副总统职位，帮助一个主要政治捐款人获得关于委内瑞拉石油的利益丰厚商机”。\n3、罗伯特·加西亚是加州民主党人，即将出任众议院监督委员会主席。于前两天向12人发出文件保全函。\n对象包括：\n唐纳德·特朗普小、埃里克·特朗普、贾里德·库什纳（Jared Kushner）、JD Vance、斯蒂芬·米勒（Stephen Miller）、托德·布兰奇（Todd Blanche）、苏西·怀尔斯（Susie Wiles）、克里斯蒂·诺姆（Kristi Noem）、科里·莱万多夫斯基（Corey Lewandowski）、金伯利·吉尔福伊尔（Kimberly Guilfoyle）等。\n重点领域：\n1）特朗普家族商业利益与“pay-to-play”（如World Liberty Financial加密货币项目、库什纳的Affinity Partners中东投资）。\n2）国土安全部/ICE的执法行为与潜在不当行为。\n3）政府对爱泼斯坦文件的处理与公开。\n4）白宫宴会厅融资、其他潜在利益冲突。\n这些行动大多仍处于“发函要求保全文件”阶段，尚未正式传票，但明确为1月接管后的大规模监督铺路。重点集中在特朗普家族商业利益、政府合同与监管“巧合”、Epstein文件、DHS/ICE执法，以及潜在的利益冲突与影响力交易。","en":"民主党的这两天动作在加速，小特朗普和万斯都成了调查对象\n1、调查小特朗普利于影响力帮助被投公司拿到国防订单或者获取监管便利政策\n拉斯金是众议院司法委员会民主党首席议员，也将在2027年1月出任司法委员会委员会主席，准备调查小特朗普。拉斯金昨晚向四家公司发函，要求提供过去两年与风险投资公司1789 Capital的全部内部通信记录及其他相关文件。四家公司为：\n1）Hadrian Automation（国防承包商）\n2）Juul Labs（电子烟）\n3）Polymarket（预测市场）\n4）GrabAGun（在线枪械零售商）\n拉斯金核心指控是“serendipitous timing”（过于巧合的时机），小特朗普在24年大选后成为1789 Capital合伙人，投资这些公司后不久，它们就获得了联邦合同或有利监管决定。他质疑Don Jr.是否利用内幕信息或对政府决策的影响力来牟利。\n具体时间线要点：\n1）Hadr 关税措施叠加征收。该措施旨在惩罚那些未能阻止强迫劳动产品贸易的国家。这项措施对60个经济体征收了10%至12.5%的关税，但目前正面临法律挑战。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX5LuHLbYAAUoKU.png?name=orig"],"u":"https://x.com/fxtrader/status/2125219969382404430","l":[],"ln":[],"t":["关税贸易"],"lk":9,"rt":0,"rp":3,"vw":10323},{"id":"2125218900174578073","h":"dmjk001","ts":1795526645,"zh":"华尔街日报：美国准备对中国及其他国家提高关税\n针对海外过剩工业产能的更高关税预计将于本周出台\n知情人士称，美国贸易代表杰米森·格里尔最早可能于本周公布一项长达数月的关税调查结果，该调查针对中国、欧盟及其他 14 个国家的产业补贴问题。知情人士同时提醒，时间安排仍可能有变。\n知情人士称，中国很可能面临比许多其他国家更高的关税，因为特朗普政府官员曾表示，中国的补贴规模尤其庞大，对全球经济具有破坏性。部分知情人士补充说，政府还可能加入相关表述，允许在美国后续谈判中，如果这些国家的工业产能过剩加剧，或未做出政策调整，就提高对其征收的关税。","en":"华尔街日报：美国准备对中国及其他国家提高关税\n针对海外过剩工业产能的更高关税预计将于本周出台\n知情人士称，美国贸易代表杰米森·格里尔最早可能于本周公布一项长达数月的关税调查结果，该调查针对中国、欧盟及其他 14 个国家的产业补贴问题。知情人士同时提醒，时间安排仍可能有变。\n知情人士称，中国很可能面临比许多其他国家更高的关税，因为特朗普政府官员曾表示，中国的补贴规模尤其庞大，对全球经济具有破坏性。部分知情人士补充说，政府还可能加入相关表述，允许在美国后续谈判中，如果这些国家的工业产能过剩加剧，或未做出政策调整，就提高对其征收的关税。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX5K6awb0AAohaa.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2125218900174578073","l":[],"ln":[],"t":["关税贸易"],"lk":1,"rt":0,"rp":0,"vw":2055},{"id":"2125216749603959097","h":"fxtrader","ts":1795526132,"zh":"美股恐慌指数VIX升至32上方，日内大涨近22%。","en":"美股恐慌指数VIX升至32上方，日内大涨近22%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2125216749603959097","l":[],"ln":[],"t":["美股"],"lk":2,"rt":0,"rp":0,"vw":1516},{"id":"2125216537699360981","h":"tig88411109","ts":1795526081,"zh":"历史上看纳指大跌再暴力反弹的剧本大多是还要二次探底。\n这次$NVDA老黄回归拉爆了一批空头。现在是不是广为流传的2018年的版本“先弹再杀”\n白宫救市后看是否美联储误判，如果油价连跌大盘暴跌下还死咬加息，会不会刺穿AI钢铁泡沫。\n最新投资策略指南和应对及投资心态风控管理。","en":"历史上看纳指大跌再暴力反弹的剧本大多是还要二次探底。\n这次$NVDA老黄回归拉爆了一批空头。现在是不是广为流传的2018年的版本“先弹再杀”\n白宫救市后看是否美联储误判，如果油价连跌大盘暴跌下还死咬加息，会不会刺穿AI钢铁泡沫。\n最新投资策略指南和应对及投资心态风控管理。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX5JLZDbUAABcUr.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2125216537699360981","l":[],"ln":[],"t":["美联储","原油能源"],"lk":0,"rt":0,"rp":0,"vw":675},{"id":"2125216528308015395","h":"A n但按照以往经验来看，一旦认知低下的韭菜如此焦虑，那就说明真是绝望出幻觉了。他们并不是否认你的观点，他们只是不愿意面对现实。\n这帮人看着今天一路阴跌到157的英伟达想必内心很慌吧，但客观讲还是有反弹机会的，但窗口可能就这么一两天，情绪利好+轧空才会一下拉这么多，这种日子怎么可能天天有，老头给了机会止损还贪婪想赚更多不珍惜逃跑机会的话，那真的没办法了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2125173179962577352","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":2,"vw":946},{"id":"2125170247842054266","h":"cnfinancewatch","ts":1795515045,"zh":"美股盘前下午版·下 2026年11月24日 周二\n上篇的结论是：周一反抽还没有把20日趋势转正，只做 $JNJ 和 $DAC 两只半仓，AI硬件不追。下面把中美位置和名单写完。\n#中美映射\n美股行业ETF用截至11月23日的完整日线。20日涨幅靠前的是 $JETS 涨7.91%、 $FIW 涨5.49%、 $PHO 涨4.77%、 $ITB 涨3.82%、 $UNG 涨3.14%、 $IHE 涨2.80%、 $XLP 涨2.75%。5日真正转正的很少， $TLT 涨2.91%、 $XBI 涨0.88%、 $UNG 涨0.41%，其余主要行业ETF仍是负的。双窗口同现只剩 $UNG，而且周一跌了6.63%，又偏商品，只观察、不作为只做方向。 $JETS、$FIW、$IHE、$XLP 都是仅20日为正、5日为负，属于趋势未加速。科技侧 $SMH 周一涨15.03%，但20日仍跌15.04%、5日跌0.37%， $SOXX、$XLK、$QQQ 同样是5日接近走平、20日还深负，不是双窗口同现。\nA股ETF用截至11月24日收盘。20日靠前的是消费ETF汇添富 $159928 涨5.71%、银行ETF华宝 $512800 涨5.37%、银行ETF天弘 $515290 涨5.32%、红利低波50ETF南方 $515450 涨5.32%、银行ETF华泰柏瑞 $560670 涨5.12%。5日只有金融地产和几只银行ETF有不到1.3个百分点的正值。银行是A股少有的20日加5日同现，但20日分位已经到66%至94%，位置偏高，只能当成防守观察。消费是仅20日共振：美股 $XLP 与A股消费ETF都在20日榜上，两边5日都没有加速。交运ETF国泰 $561320 20日涨1.47%、5日跌0.10%，对上 $JETS 的20日，同样是仅20日。生物医药没有形成共振，创新药ETF银华 $159992 20日跌2.18%、5日跌2.80%。部分消费50和医药50样本未取到，未写入榜单。\n#三个方向\n一是生物医药创新，这是今天唯一做成方向的大类，对应 $IHE 回调里的箱底个股，核心是 $JNJ。 $IHE 收105.69，涨1.29%，20日涨2.80%，5日跌3.60%，量比只有0.41，反抽很弱。\n二是交通运输航运， $JETS 是20日榜首，但5日仍跌1.72%，只作为第二方向的半仓观察，核心是 $DAC，不把航空ETF本身当成突破。\n三是AI硬件，只观察不买。 $NVDA、$PLTR、$SMH 都是周五砸出低点后的单日反抽，20日趋势还没转，12月3日听证还在。\n#六只个股\n #强生 $JNJ 收270.05，跌0.16%，20日区间位置22.5%，箱底。11月19日最低见到264.68，周五放量收270.47，周一缩量守住。触发是放量站上270.57并站稳，失效看跌破268.38，再往下是20日低264.20。半仓。\n #Danaos $DAC 收147.62，涨2.37%，20日区间位置26.0%，箱底。周一低点正好打在20日低143.00后收阳。触发是放量站上150.93，失效看跌破143.00。期权Put持仓同步大增，半仓，不是满仓。\n #帕兰蒂尔 $PLTR 收159.36，涨11.06%，20日区间位置28.7%，看起来像下沿，其实是周五低点142.28之后的单日反抽，距20日高还有26.7%。Call共振成立，只观察。失效看142.28。\n #苹果 $AAPL 收349.08，涨1.90%，20日区间位置66.9%，中上部。Put持仓增仓偏空，目标价低于现价，不做。失效看343.75。\n #微软 $MSFT 收492.50，涨1.65%，20日区间位置14.7%，靠近20日低481.03，但周一是高开低走的阴线，箱底未企稳，仅观察。\n名单只给五只，不足不凑。\n#小盘阿尔法\n本档不另选。 $DAC 市值约26亿美元，位置已在六只里写过，不重复升级。 $WGS 收49.65，涨9.22%，20日位置19.8%，但距20日高还有44%，周一收的是高开回落的阴线，ARK又只是单基金小额，过不了。 $BRVE 收23.23，涨13.93%，已处20日区间81%，财务字段缺失，不选。\n#操作提示\n周二早盘期货只有大约0.4%的溢价，接不住就把周一反抽当成卖点。只做仓位如果要开，就留在 $JNJ 和 $DAC 两只半仓，看箱底能不能守住。不要用周一的 $NVDA 去追AI硬件。感恩节短周，今晚和明日还有一串科技与医疗财报，12月3日听证之前，外部不是单边乐观。恐慌贪婪指数按原邮件口径报17.0，仍是极端恐惧，可以解释反抽，但不能单独当成加仓信号。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"美股盘前下午版·下 2026年11月24日 周二\n上篇的结论是：周一反抽还没有把20日趋势转正，只做 $JNJ 和 $DAC 两只半仓，AI硬件不追。下面把中美位置和名单写完。\n#中美映射\n美股行业ETF用截至11月23日的完整日线。20日涨幅靠前的是 $JETS 涨7.91%、 $FIW 涨5.49%、 $PHO 涨4.77%、 $ITB 涨3.82%、 $UNG 涨3.14%、 $IHE 涨2.80%、 $XLP 涨2.75%。5日真正转正的很少， $TLT 涨2.91%、 $XBI 涨0.88%、 $UNG 涨0.41%，其余主要行业ETF仍是负的。双窗口同现只剩 $UNG，而且周一跌了6.63%，又偏商品，只观察、不作为只做方向。 $JETS、$FIW、$IHE、$XLP 都是仅20日为正、5日为负，属于趋势未加速。科技侧 $SMH 周一涨15.03%，但20日仍跌15.04%、5日跌0.37%， $SOXX、$XLK、$QQQ 同样是5日接近走平、20日还深负，不是双窗口同现。\nA股ETF用截至11月24日收盘。20日靠前的是消费ETF汇添富 $159928 涨5.71%、银行ETF华宝 $512800 涨5.37%、银行ETF天弘 $515290 涨5.32%、红利低波50ETF南方 $515450 涨5.32%、银行ETF华泰柏瑞 $560670 涨5.12%。5日只有金融地产和几只银行ETF有不到1.3个百分点的正值。银行是A股少有的20日加5日同现，但20日分位已经到66%至94%，位置偏高，只能当成防守观察。消费是仅20日共振：美股 $XLP 与A股消费ETF都在20日榜上，两边5日都没有加速。交运ETF国泰 $561320 20日涨1.47%、5日跌0.10%，对上 $JETS 的20日，同样是仅20日。生物医药没有形成共振，创新药ETF银华 $159992 20日跌2.18%、5日跌2.80%。部分消费50和医药50样本未取到，未写入榜单。\n#三个方向\n一是生物医药创新，这是今天唯一做成方向的大类，对应 $IHE 回调里的箱底个股，核心是 $JNJ。 $IHE 收105.69，涨1.29%，20日涨2.80%，5日跌3.60%，量比只有0.41，反抽很弱。\n二是交通运输航运， $JETS 是20日榜首，但5日仍跌1.72%，只作为第二方向的半仓观察，核心是 $DAC，不把航空ETF本身当成突破。\n三是AI硬件，只观察不买。 $NVDA、$PLTR、$SMH 都是周五砸出低点后的单日反抽，20日趋势还没转，12月3日听证还在。\n#六只个股\n #强生 $JNJ 收270.05，跌0.16%，20日区间位置22.5%，箱底。11月19日最低见到264.68，周五放量收270.47，周一缩量守住。触发是放量站上270.57并站稳，失效看跌破268.38，再往下是20日低264.20。半仓。\n #Danaos $DAC 收147.62，涨2.37%，20日区间位置26.0%，箱底。周一低点正好打在20日低143.00后收阳。触发是放量站上150.93，失效看跌破143.00。期权Put持仓同步大增，半仓，不是满仓。\n #帕兰蒂尔 $PLTR 收159.36，涨11.06%，20日区间位置28.7%，看起来像下沿，其实是周五低点142.28之后的单日反抽，距20日高还有26.7%。Call共振成立，只观察。失效看142.28。\n #苹果 $AAPL 收349.08，涨1.90%，20日区间位置66.9%，中上部。Put持仓增仓偏空，目标价低于现价，不做。失效看343.75。\n #微软 $MSFT 收492.50，涨1.65%，20日区间位置14.7%，靠近2 盖安全、合规、市场质量、透明度等 8 大维度、超过 100 项指标。\n最终仅有 7 家交易所获得 AA 评级。\n但整份报告中，我更关注另一个数据：\n顶级交易所的现货交易量占比，从上一期报告的 59.3% 提升至 66.9%。\n这意味着市场的流动性正在进一步向头部平台集中。\n流动性吸引交易者，交易者带来更多流动性，而安全与合规则决定了这些资金能否长期留下。\n这是一种逐渐形成的正向循环，也意味着交易所之间的竞争壁垒正在加深。\n作为一个 2019 年进入加密市场的交易者，经历过几轮牛熊，也见过不少曾经风光无限的交易所退出历史舞台。\n所以相比短期的交易量排名，我更看重平台的长期经营能力。\nOKX 连续披露储备金证明、推进全球合规、持续投入安全建设，如今获得 CoinDesk 最高 AA 评级，也是这些长期投入的阶段性成果。\n当然，安全评分满分不代表零风险，第三方评级也无法替代个人的资产风险管理。\n行情有牛熊，安全无周期。\n对于交易所而言，穿越周期的能力，才是真正的护城河。\n@okxchinese @star_okx @misaENFP","en":"作为一个八年加密老新人\n讲讲自己的理解\n早期的加密市场，交易所拼的是上币速度、交易量和用户规模。\n随着行业逐渐成熟，安全、合规、流动性和市场质量的重要性正在不断提高。\n@CoinDesk 最新一期全球交易所基准报告出炉，前三名分别是：\nCoinbase：91.16 分\nKraken：89.97 分\nOKX：88.47 分\n其中，OKX 综合评分较上期提升 5.6 分，排名上升 5 位，评级从 A 升至最高 AA，安全性更是拿到了 20/20 的满分。\n这份报告基于 2026 年第二、三季度的数据，对全球 62 家中心化现货交易所进行评估，涵盖安全、合规、市场质量、透明度等 8 大维度、超过 100 项指标。\n最终仅有 7 家交易所获得 AA 评级。\n但整份报告中，我更关注另一个数据：\n顶级交易所的现货交易量占比，从上一期报告的 59.3% 提升至 66.9%。\n这意味着市场的流动性正在进一步向头部平台集中。\n流动性吸引交易者，交易者带来更多流动性，而安全与合规则决定了这些资金能否长期留下。\n这是一种逐渐形成的正向循环，也意味着交易所之间的竞争壁垒正在加深。\n作为一个 2019 年进入加密市场的交易者，经历过几轮牛熊，也见过不少曾经风光无限的交易所退出历史舞台。\n所以相比短期的交易量排名，我更看重平台的长期经营能力。\nOKX 连续披露储备金证明、推进全球合规、持续投入安全建设，如今获得 CoinDesk 最高 AA 评级，也是这些长期投入的阶段性成果。\n当然，安全评分满分不代表零风险，第三方评级也无法替代个人的资产风险管理。\n行情有牛熊，安全无周期。\n对于交易所而言，穿越周期的能力，才是真正的护城河。\n@okxchinese @star_okx @misaENFP","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX4Y8k3bIAAfaqR.jpg?name=orig"],"u":"https://x.com/yijiangren/status/2125163620493607339","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":2,"vw":556},{"id":"2125162916353589322","h":"AntonLaVay","ts":1795513297,"zh":"年后，意思就是想等以色列搞出新政府之后再说。\n他已经彻底厌恶内塔尼亚胡的政治绑架了。","en":"年后，意思就是想等以色列搞出新政府之后再说。\n他已经彻底厌恶内塔尼亚胡的政治绑架了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2125162916353589322","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":0,"vw":1168},{"id":"2125161333779787912","h":"AntonLaVay","ts":1795512920,"zh":"Gate 300 万美金误冻案，大家注意两个细节：\n1. 起因只是印度地方警方把跨链桥地址误标成了杀猪盘地址。\n这意味着哪怕你一辈子没碰过黑钱，只要用过公共跨链桥，随时可能被无辜“连坐”。\n2. 从冻结到印度法院下令划扣给报案人，用户全程在黑箱里：印度人不给看涉案链路，无处申诉，资产缩水一半不说，最后差点  deter Malaysia from working with Beijing and Chinese firms, Prime Minister Anwar Ibrahim said, according to an interview published on Tuesday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2125137447080083949","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/business/media-telecom/us-chip-curbs-wont-impact-malaysias-china-ties-pm-says-2026-11-24/?taid=6b054419949d5800012d8eaa&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":259},{"id":"2125136760380473551","h":"fxtrader","ts":1795507061,"zh":"俄罗斯外交部指控身为北约与欧盟成员国的爱沙尼亚进行了一系列“濒临引发公开战争”的敌对行动。\n此前爱沙尼亚宣布计划从12月1日起关闭与俄罗斯的边境口岸，为期至少六个月。\n爱沙尼亚指责俄罗斯安全部门策划一起针对该国国防企业的纵火未遂袭击事件，俄罗斯否认涉案。","en":"俄罗斯外交部指控身为北约与欧盟成员国的爱沙尼亚进行了一系列“濒临引发公开战争”的敌对行动。\n此前爱沙尼亚宣布计划从12月1日起关闭与俄罗斯的边境口岸，为期至少六个月。\n爱沙尼亚指责俄罗斯安全部门策划一起针对该国国防企业的纵火未遂袭击事件，俄罗斯否认涉案。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2125136760380473551","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1427},{"id":"2125132319799566607","h":"bbcchinese","ts":1795506002,"zh":"周一，英伟达员工以热烈掌声迎接黄仁勋。这位重新回任的首席执行官重返办公室，而不到两周前，他才因婚外情事件黯然下台。\n在一段临时发表的简短谈话中，黄仁勋开玩笑说：“我没有电脑，所以资讯科技部门会给我一台新的个人电脑。”他也向员工道歉，并表示自己“犯了一些非常严重的错误”。\n在现场响起一阵掌声后，他说：“感谢大家再给我一次机会。这一次重新担任CEO，我会做得更好。”","en":"周一，英伟达员工以热烈掌声迎接黄仁勋。这位重新回任的首席执行官重返办公室，而不到两周前，他才因婚外情事件黯然下台。\n在一段临时发表的简短谈话中，黄仁勋开玩笑说：“我没有电脑，所以资讯科技部门会给我一台新的个人电脑。”他也向员工道歉，并表示自己“犯了一些非常严重的错误”。\n在现场响起一阵掌声后，他说：“感谢大家再给我一次机会。这一次重新担任CEO，我会做得更好。”","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2125132218955960320/vid/avc1/608x1080/iZW_klCEM_J8-m3k.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2125132319799566607","l":[],"ln":[],"t":["AI科技"],"lk":15,"rt":0,"rp":0,"vw":3918},{"id":"2125131678750572743","h":"bboczeng","ts":1795505849,"zh":"我们进入了让多空双方共同焦灼的关键节点\n多方认为：黄仁勋回归英伟达就是底部，年底再创新高\n空方认为：黄仁勋的暴力回归埋下了更大的隐患。等民主党全面报复，大雷爆炸的那一天才是底部\n作为计划抄底的大空头，我当然希望看到第二种情况，SPY年底扎扎实实给我跌个20%\n但他发生前提有：\n1）民主党真正掌握了权力，\n2）民主党真正愿意不计一切代价对美国的民意负责，而且\n3）民主党自己也没有把柄被别人抓住\n而 如果信用利差持续扩大，那么当前上涨可能只是技术性反弹，不是趋势反转（英伟达月线顶背离，大级别趋势线破位，目前可能a浪下杀结束，现在可能走复杂b浪反弹，后续还会有c浪下跌，消息拉盘也只是暂时的，之前老黄在的时候英伟达也从240跌到180了）。 同时，美元指数 DXY 涨到104.20，说明美元需求强劲，全球金融条件可能进一步收紧。从技术面来看，DXY 有可能进一步涨到 106压力位甚至更高，如果美元继续走强、信用利差继续扩大，将对美股和其他风险资产形成双重压力。在债市没有企稳之前，不轻易相信这轮股市反弹。做波段不用担心这个。","en":"债市与股市背离：信用危机预警，美元走强加剧流动性压力，短期看反弹，中期还是要警惕\n股市可以靠情绪上涨，但债市反映的是真实信用风险。 虽然股市出现强劲反弹，CCC 级高收益垃圾债收益率却涨到 18.61%，创下 2020 年疫情崩盘和2015–2016 年信用压力时期以来的极端水平，高收益信用利差也从 3.48 扩大至 3.76，CDS 利差持续走阔，说明市场对高负债企业、数据中心融资链条和潜在违约风险的担忧还在加剧。股市反弹与债市恶化形成背离，如果信用利差持续扩大，那么当前上涨可能只是技术性反弹，不是趋势反转（英伟达月线顶背离，大级别趋势线破位，目前可能a浪下杀结束，现在可能走复杂b浪反弹，后续还会有c浪下跌，消息拉盘也只是暂时的，之前老黄在的时候英伟达也从240跌到180了）。 同时，美元指数 DXY 涨到104.20，说明美元需求强劲，全球金融条件可能进一步收紧。从技术面来看，DXY 有可能进一步涨到 106压力位甚至更高，如果美元继续走强、信用利差继续扩大，将对美股和其他风险资产形成双重压力。在债市没有企稳之前，不轻易相信这轮股市反弹。做波段不用担心这个。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ArtofSpecuycky/status/2125108829700669844","l":[],"ln":[],"t":["美股","汇率","AI科技"],"lk":2,"rt":0,"rp":0,"vw":445},{"id":"2125108266858655779","h":"bboczeng","ts":1795500268,"zh":"我一直在定投啊，我没有说要抄到最底部，这几乎是不可能的\n你见过哪个要抄在最底部的人每周定投的呢\n此外，我自己是看了两个baseline，一个是回到年初，一个是回到三月底，抄底的比例都想好了，周末的文章（见置顶）仔细算好了半天\n本来周一执行的，结果开盘一根直线拉起来\n上天不给我机会，当然只能暂时不买了\n这怎么是要买在最底部呢？\n专挑盘前放消息，没想到华尔街竟然可以这么坏\n😅😅😅","en":"我一直在定投啊，我没有说要抄到最底部，这几乎是不可能的\n你见过哪个要抄在最底部的人每周定投的呢\n此外，我自己是看了两个baseline，一个是回到年初，一个是回到三月底，抄底的比例都想好了，周末的文章（见置顶）仔细算好了半天\n本来周一执行的，结果开盘一根直线拉起来\n上天不给我机会，当然只能暂时不买了\n这怎么是要买在最底部呢？\n专挑盘前放消息，没想到华尔街竟然可以这么坏\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125108266858655779","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":134},{"id":"2125105823596814451","h":"bboczeng","ts":1795499685,"zh":"ps：开爱玩笑的，为了30年的幸福，我将严格按照置顶文章的比例和策略抄底\n学习大家","en":"ps：开爱玩笑的，为了30年的幸福，我将严格按照置顶文章的比例和策略抄底\n学习大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125105823596814451","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":633},{"id":"2125105625369858373","h":"bboczeng","ts":1795499638,"zh":"英推开始传卢比奥要辞职了，不会吧\n黄仁勋这次赢的这么多，这么深\n不会真要去新高了吧\n我还没按计划抄底呢\n这周回调我一定all in！\n😅😅😅","en":"英推开 传媒并列，以及一篇把英伟达链、物理AI、PCB和半导体放在一起的概念梳理。能直接读到的评论不多，且多为感谢，其中一条公开可见的短评只写“科技还是科技”。这些标题说明，开盘前国内讨论的重心已经不是要不要做科技，而是高开之后怎么下手。\n到了11:45，同一作者的午盘分析标题改成“高开冲高回落，看下午量能能否持续”。正文未能打开，但标题本身已经把上午的交易结果说清楚了：先冲，后回，分歧转到下午的承接。这和公开午评是对齐的。澎湃新闻11:33的午盘稿写明，AI硬件侧短线获利盘兑现，中际旭创、新易盛从盘初高点明显回落；相对更强的是物理AI、光伏逆变器，文化传媒和军工也活跃，油气、有色、煤炭疲软，银行是探底回弹。新华财经则把人形机器人的连板梯队和中京电子4连板、工业富联触及涨停写在一起。也就是说，散户能在公开标题里看到的主线，并没有跑出券商午评的框架，只是措辞更短、更强调“还要不要接”。\n和券商口径相同的地方很清楚：都承认这是高开修复，不是普涨牛市；都看到机器人、物理AI的辨识度高于已经兑现一部分涨幅的光模块；都把量能和回踩当成午后的关键，而不是把早盘最高点当成趋势确认。和券商口径不同、也更容易在下午出错的地方，是开盘前“怎么接”很容易滑向名单和连板接力。中京电子已经4连板，克来机电、长华集团3连板，福莱新材等2连板，凡拓数创继续大幅上涨，这类位置对社区最有视觉刺激，也最容易把“主线还在”理解成“还能往上加仓”。被忽略的风险更具体：港股恒生科技午市下跌，小米、美团走弱，说明同一套AI叙事在香港并没有被同步加价；两融保证金下调要到11月30日才施行，半日成交放大不等于杠杆资金已经按理论上限进场；盛剑科技此前已收监管工作函，高标若在回落后再被当成低吸，风险和开盘追涨是同一类。邮件转述的“羊”字辈、预制菜连板，以及九阳股份登上热股榜，更像情绪支线，基本面支撑弱，不应当成主线的验证。\n海外：情绪标签很热，但英伟达这条讨论仍然不是一边倒\n本期未能直接打开WSB原帖，只能看二手扫描。Tradestie页面统计24小时分析讨论1515条，把“人群情绪”标成77/100、约79.6%偏多，并加上“亢奋”一类标签，较早间档的1481条、约77.9%偏多再热了一点。英伟达仍是提及最集中的股票，24小时324次、约合近七日均值的2.6倍，但看多、中性、看空的拆分是34%、44%和22%，和早间档的35%、43%、22%几乎一样：热度极高，方向并不统一。必须说明，这是扫描页的分类和抽样，不是论坛官方统计。\n更值得看的是，讨论已经从“一个人回来了”扩到并购和杠杆。Zscaler的提及量约为近七日均值的6.0倍，是该页的“冲高领头”；CrowdStrike虽收跌约8.92%，扫描里看多比例仍到61%。这和国内连板情绪类似，都是把一个大交易迅速交易到两只股票的相反方向上。SOXL单日涨约39.93%，但五日仍跌约11.38%；美光五日仍是负的。说明周一的暴涨修复了情绪，并没有把上周的伤口全部结痂。HPE在该页上出现时，价格仍停在周一收盘的48.02美元、涨17.38%，对盘后回落的讨论还没有成为主流样本，这本身就是一种滞后。\nStocktwits新闻稿的口径更热，但时间更早：刊于周一收盘后，写明英伟达相关情绪处在“极度看多”、留言量“极高”。稿件引用的进行中投票显示，近64%的受访者在黄仁勋回归后更看多，15%感觉没变，9%更看空，12%认为现在下结论太早；同一篇还转述S3\nPartners的估算，空头周一约亏损120亿美元，几乎抹掉此前七个交易日约90%的浮盈，但这些空头年内对英伟达仍约盈利40亿美元。稿件同时注明，英伟达年内仍下跌约12%。这些数字是平台和第三方估算，不是交易所官方统计。对海外散户来说，今天可以继续炒“回来了”，但投票里仍有相当比例在观望，国会听证和调查也没有从讨论里消失。\n两边合在一起看：国内已经把问题从“会不会高开”换成“高开回了以后还要不要接”，海外则仍把大部分注","en":"散户热议｜2026-11-24·午间\n数据时点：国内方面，已检索并打开韭研公社11月24日盘前、早报与午盘分析等页面；多数长文需登录，未能完整抓取正文，下文只使用公开可见的标题、发布时间、作者披露和页面上能直接读到的评论，不编造引语，也不把搜索引擎对标题的改写当成原文。韭研网本期未检索到可引用的专帖。海外方面，Reddit\nWallStreetBets本期仍未能直接打开；改用Tradestie对WSB讨论的扫描页（页面标注更新于11月24日03:59\nUTC，约北京时间11:59），以及Stocktwits于美东11月23日18:56（约北京时间24日07:56）刊发的新闻稿。后一篇是周一收盘后的平台转述，不是本午间的实时统计。情绪标签、投票和小 ,"rt":0,"rp":2,"vw":1557},{"id":"2125102658482847758","h":"cnfinancewatch","ts":1795498930,"zh":"力士，说明国内更像情绪补涨，而不是已经按“产能售罄”重新定价。这个方向适合作为主线的基本面对照，不适合当成午后追高的新故事。\n三大利空方向（由强到弱）\n一、高开回落本身就是今天最强的约束，说明这是修复，不是反转。创业板从一度涨超4%回到1.90%，光模块把隔夜缺口在开盘附近就吐出一部分，银行和券商没有形成权重共振。光大证券的公开观点仍是：AI资本开支持续性短期内无法证伪、经济基本面弹性有限，指数缺乏反转条件。连板梯队里已经出现分歧：午间邮件转述大东方午市附近回落，预制菜和部分高位题材不再是铁板一块；凡拓数创继续大涨，但公司此前已提示数据采集暂无营收、前三季度亏损，题材和基本面是分开的。对谁不利：在开盘第一小时按“外盘涨多少、A股就该跟多少”去追已经触及涨停或多连板的股票。\n二、港股背离，加上加息和国会日历，说明全球科技并没有一起打开空间。恒指和恒生科技午市收跌，和日韩、A股成长股不是同一幅画面。美联储“三把手”仍称通胀过高，早间已核实的12月加息25个基点概率约96.1%，本档未见需要改写的新概率。黄仁勋将于12月3日出席美国参议院听证会，公司也仍要配合调查。Anthropic未来数年算力与基础设施承诺约9000亿美元，但债市预期其债券可能落在投机级、约BB区间，有报道称其计划募集的资金大约只相当于支出承诺的十分之一；其上市后前两个交易日较首笔成交约跌20%，周一科技股大反弹时仍偏弱，不能把“9000亿美元”直接写成立刻可融资、立刻可开支的现金。摩根士丹利将Meta目标价从820美元下调至720美元、维持增持，花旗将赛富时目标价从263美元下调至198美元、维持中性，提示软件和应用变现慢于硬件。对高估值成长，这些是中期紧箍咒，只是今天被硬件反弹盖过去了。\n三、金油回落和地缘扰动，限制了防御板块和资源股的对冲功能。贵金属午市调整，山东黄金、紫金矿业走弱；港股山东黄金跌超4%。原油沿用周一已核实结算：WTI\n80.17美元、跌3.88%，布伦特89.37美元、跌3.46%，中国石油同步承压。刚果（金）将从11月30日起再暂停钴出口，至监管机构另行决定，这是供给事件，但不是今天盘面的主线。新华社报道，伊朗革命卫队称过去数小时有3艘“违规”油轮在霍尔木兹海峡触雷起火，未公布国籍；油价并未因此转强，公开报道认为市场对“海峡被全面封锁”的极端担忧在减弱。另有媒体援引知情官员称，五角大楼推迟向乌克兰交付累计约40枚爱国者PAC-3拦截弹，这是转述，未见美国国防部官方全文，本档不当作已落地的正式声明。对投资而言，军工可以有主题脉冲，但油价和黄金今天并没有提供新的避险主升。还需要记住：融资保证金下调仍是11月30日起施行，不能把理论杠杆空间当成今天已经进场的钱。\n小结：外盘把门推开了，A股只把门开了一半，港股还把门带上了一点。上午最有价值的信息不是“全线高开”，而是高开之后谁在兑现、谁还在接力。算力硬件和机器人仍是主线，存储是更干净的产业对照；真正要防的，是把日韩暴涨翻译成追四连板，并把复职、长约和回购写成风险已经出清。午后看量能能否在回踩后接住，而不是看开盘幅度能否再走一遍。","en":"力士，说明国内更像情绪补涨，而不是已经按“产能售罄”重新定价。这个方向适合作为主线的基本面对照，不适合当成午后追高的新故事。\n三大利空方向（由强到弱）\n一、高开回落本身就是今天最强的约束，说明这是修复，不是反转。创业板从一度涨超4%回到1.90%，光模块把隔夜缺口在开盘附近就吐出一部分，银行和券商没有形成权重共振。光大证券的公开观点仍是：AI资本开支持续性短期内无法证伪、经济基本面弹性有限，指数缺乏反转条件。连板梯队里已经出现分歧：午间邮件转述大东方午市附近回落，预制菜和部分高位题材不再是铁板一块；凡拓数创继续大涨，但公司此前已提示数据采集暂无营收、前三季度亏损，题材和基本面是分开的。对谁不利：在开盘第一小时按“外盘涨多少、A股就该跟多少”去追已经触及涨停或多连板的股票。\n二、港股背离，加上加息和国会日历，说明全球科技并没有一起打开空间。恒指和恒生科技午市收跌，和日韩、A股成长股不是同一幅画面。美联储“三把手”仍称通胀过高，早间已核实的12月加息25个基点概率约96.1%，本档未见需要改写的新概率。黄仁勋将于12月3日出席美国参议院听证会，公司也仍要配合调查。Anthropic未来数年算力与基础设施承诺约9000亿美元，但债市预期其债券可能落在投机级、约BB区间，有报道称其计划募集的资金大约只相当于支出承诺的十分之一；其上市后前两个交易日较首笔成交 期只有散户净卖出约1.4925万亿韩元，外资、机构分别为净买入。台股盘中最高见到40180.38点，涨3368.49点、涨幅9.15%，为史上最大盘中涨点、历史第二大涨幅，仅次于2025年4月10日的9.39%，逾550档涨停。日经225半日收涨3.97%。但港股没有跟上：恒生指数午市报22295.94点，跌0.39%；恒生科技指数跌0.99%；小米跌超4%，美团、哔哩哔哩跌超3%，联想则涨超4%。A股内部同样是结构市：消费电子、半导体、影视院线、机器人靠前，贵金属、煤炭、券商、石油走弱，银行是探底后回弹，不是领涨。今天的结论因此很明确——弹性仍在算力硬件和机器人，但已经从“高开就要追”变成“看回踩和午后量能”，不能写成趋势反转。\n三大利多方向（由强到弱）\n一、光模块、PCB和AI服务器，是今天把外盘涨幅接进来的主通道，也是最早出现获利了结的地方。已核实：中京电子走出4连板，工业富联早盘触及涨停，天孚通信在新华财经午评时涨近8%；PCB方向里，胜宏科技、东山精密等跟涨，港股里胜宏科技午市也涨超9%。这是对隔夜英伟达和亚太半导体暴涨的直接映射，对光模块、高端PCB和服务器代工最敏感。但澎湃午盘写得很直白：AI硬件侧短线获利盘兑现，中际旭创、新易盛从盘初高点明显回落。行情接口也显示，中际旭创开盘463.20元，较前收417.20元高开逾11%，最高见到469元后回落。海外同样不是“好消息就继续涨”：慧与公布财年第四季度营收145亿美元、同比增50%，服务器收入88亿美元、同比增94.7%，AI系统订单45亿美元，但周一收盘前股价已大涨，盘后转弱，市场在计价利润率而不是只看订单。对投资的含义是：主线还在，定价已经提前，下午要看成色，不追第一波。\n二、人形机器人和物理AI，是今天辨识度最高、连板梯队最完整的方向。新华财经午评：克来机电、长华集团走出3连板，宁波东力、锋龙股份、福莱新材、安培龙2连板，方正电机涨停；AI眼镜方向也有联创电子、共达电声涨停。中信建投继续把物理AI写成人工智能的下一波浪潮，强调大脑、小脑和本体的能力建设。对零部件、减速器和传感器公司，这是情绪和产业叙事的叠加；对已经连续涨停的高标，它更多是接力风险。早间邮件还转述自变量新模型的“零样本成功率”等具体数字，未见权威交叉核实，只作为主题热度，不写成已落实的订单或量产事实。华为今天宣布鸿蒙终端设备数突破1亿，叠加下午还有新品发布会，可能继续给消费电子和端侧AI加热，但那是午后变量，不把它提前写成已经兑现的涨因。\n三、存储周期提供了比概念股更清楚的产业映射。已核实：美光周一涨19.04%。多家中文媒体转述知情人士称，三星电子2027年至2029年大部分存储产能已被合同锁定，部分客户希望把长约延至2031年；这是传闻口径，不是公司正式公告。韩国存储股今天的涨幅，把这条逻辑当场交易了出来。对A股的兆易创新、长鑫科技和封测公司是中期支撑，但它们今天的跟涨幅度明显小于海","en":"热点财经新闻综述｜2026-11-24·午间\n数据时点：A股、港股为11月24日午间收盘；创业板开盘与盘中最高价取自公开行情接口，并与新华财经、东方财富Choice、澎湃新闻的午评交叉核对。韩国KOSPI与三星电子、SK海力士报价，采用E-Daily截至韩国时间13:04（北京时间12:04）的盘中数据，韩股午后仍在交易，不是收盘价。日经225为公开报道的半日收盘。台湾加权取经济日报转述中央社的盘中最高，因截稿前后收盘口径尚不完全一致，本档不把未核对的收盘价写成定论。美股仍为美东11月23日常规交易收盘，个股盘后另有标注。现货与原油沿用已核实的周一结算或收盘。本档截稿约北京时间11月24日13:45。本期新处理两封热点财经邮件：11月24日早间08:10版与午间13:10版（均在收件箱）。11月23日晚间版已在早间档处理，不重复计入。标“邮件转述”的内容未逐条核实。\n今日判断\n今天不是全面牛市的开门红，而是一场由外围情绪抬起来、又被获利盘迅速削薄的高开修复。午市已核实：上证指数收3555.49点，涨0.47%；深证成指收10550.87点，涨0.92%；创业板指收2323.48点，涨1.90%；科创50收1261.26点，涨2.72%；北证50涨1.83%，报809.93点。创业板开盘2368.70点，约高开3.88%，盘中最高2376.34点，一度涨超4%，随后震荡收窄到午市的1.90%，是典型的高开回落。东方财富Choice统计，全市场3123家上涨、2273家下跌，67只涨停；半日成交11210亿元，较上一交易日放量2046亿元。午间邮件里“放量超2300亿”，对应的是成交刚破1万亿时的盯盘口径，不是午盘对比，本档以午评数字为准。澎湃新闻援引Wind的上涨家数同为3123家， 改善了什么？\n1. 改善了半导体产业链的管理人溢价\n2. 改善了 GPU 研发和战略的不确定性\n3. 改善了英伟达对 CoreWeave 的融资支持的不确定性\n没改善什么？\n1. 出口管制及未来的监管调查仍然存在风险\n2. AI 资本开支回报率还是没有得到改善\n3. Hyperscale 的现金融资压力仍然没有逆转\n所以应该Long +Short的策略；Long 的股票跟 Short 的股票，我心里有数，但是还没有开始出手；具体是什么股票，我后续会在订阅频道逐渐更新","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2125101339151884291","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":0,"rt":0,"rp":0,"vw":141},{"id":"2125101295539466261","h":"fxtrader","ts":1795498605,"zh":"黄仁勋接下来要接受两场国会听证。首先是12月1日（下周二）众议院三个委员会的闭门听证会，全程会有文字记录。随后是12月3日（下周四）参议院银行委员会公开听证会，重点关注美国芯片出口管制监管问题。","en":"黄仁勋接下来要接受两场国会听证。首先是12月1日（下周二）众议院三个委员会的闭门听证会，全程会有文字记录。随后是12月3日（下周四）参议院银行委员会公开听证会，重点关注美国芯片出口管制监管问题。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX3fkFlakAAnrJx.png?name=orig"],"u":"https://x.com/fxtrader/status/2125101295539466261","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":15,"rt":0,"rp":5,"vw":4440},{"id":"2125101288732189151","h":"bboczeng","ts":1795498604,"zh":"OpenAI 宣布推出名为“OpenWorks”的新项目，将向 AI 专家每月支付最高 8,000 美元，帮助本地小企业采用人工智能。","en":"OpenAI 宣布推出名为“OpenWorks”的新项目，将向 AI 专家每月支付最高 8,000 美元，帮助本地小企业采用人工智能。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125101288732189151","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2125101154250174834","h":"bboczeng","ts":1795498572,"zh":"据报道，黄仁勋承认自己的婚外情比此前披露的更多。\n😅😅😅","en":"据报道，黄仁勋承认自己的婚外情比此前披露的更多。\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125101154250174834","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":127},{"id":"2125098838587330898","h":"kevinnbass","ts":1795498020,"zh":"Coefficient Giving 由 Anthropic 投资者达斯汀·莫斯科维茨 (Dustin Moskowitz) 创立，在新闻和政策机构上花费了数亿美元，塑造了黄仁勋的故事。\n这是它的工作原理。\n达斯汀·莫斯科维茨 (Dustin Moskowitz) 将其 Anthropic 股票的数十亿美元投资到了 Good Ventures 基金会。\nGood Ventures 基金会为 Coefficient Giving 提供资金。\n股价越高，从 Coefficient Giving 衍生出来的非营利网络获得的资金就越多。\n因此，达斯汀·莫斯科维茨 (Dustin Moskowitz) 领导下的 Anthropic 非营利网络有直接动机去帮助 Anthropic 消灭其竞争对手。\n您可以在图中看到这一点的实际效果。\n为什么国会不调查这个流氓人类非营利网络试图操纵政客和公众舆论的方式？","en":"Coefficient Giving, founded by Anthropic investor Dustin Moskowitz, spent hundreds of millions on both journalism and policy outfits that shaped the Jensen Huang story.\nHere's how this works.\nDustin Moskowitz invested billions of dollars of his Anthropic stock into Good Ventures Foundation.\nGood Ventures Foundation funds Coefficient Giving.\nThe higher the stock goes, the bigger the money pile of the nonprofit network spinning out of Coefficient Giving gets.\nThe Anthropic nonprofit network under Dustin Moskowitz therefore has a direct incentive to try to help Anthropic eliminate its competitors.\nYou can see this in action in the figure.\nWhy isn't Congress investigating the ways that this rogue Anthropic nonprofit network is trying to manipulate politicians and public opinion?","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HX3cvpnWIAAymSn.jpg?name=orig"],"u":"https://x.com/kevinnbass/status/2125098838587330898","l":[],"ln":[],"t":[],"lk":6143,"rt":1469,"rp":217,"vw":633640},{"id":"2125098640264065114","h":"tychozzz","ts":1795497972,"zh":"昨天黄仁勋回归英伟达之后，英伟达单日暴涨 30%，创下了公司 20 多年以来最大的单日涨幅，纳指单天市值暴涨 2 万亿美元。\n只有失而复得才知道珍惜，黄仁勋作为美国 AI 的灵魂人物，一个人就价值数万亿美元。\n现在很多人关心的一个问题是，这波会不会直接 V 反，重复 25 年4 月的剧本？\n可能性不大，当下的大环境和前两年有明显的区别。但黄仁勋回归，起码把过去两周压在 AI 和半导体产业链上最致命的看空逻辑大幅削掉了。这波黑天鹅落地后，市场本质上是回到了 11 月初的逻辑线上。\n之前老黄卸任，伤的不只是英伟达的估值，更是整个 AI 产业链的信用背书，neocloud 融资可能会出问题，上游半导体产业链的扩产节奏也可能会放缓，牵一发而动全身。老黄回来之后，这个鬼故事也就结束了。\n剩下的主要还是宏观利率和中期选举之后的政策风险。不过关于这两点，我自己没有太悲观。\n宏观层面，过去一个月的暴跌叠加 AI 融资成本飙升，其实已经变相帮美联储做了一次紧缩，压制了通胀的预期。如果后续通胀回落，市场在明年上半年大概率就会提前交易降息的拐点。\n政策层面，民主党反数据中心浪潮这个靴子还没落地，但我不太相信民主党真有那么蠢，会因为党争而继续无脑打压 AI，差不多就得了，感觉最后大概率还是会达成某种妥协。\n回到短期走势，12 月还有 FOMC 会议，直接一路 V 反的概率偏小。但经过这轮风波，市场的注意力终究会回到 AI 本身的供需和落地上，行情会慢慢走出来。\n📈 投资美股用 BIT，稳定币直接入金，持有真实股票，终身免佣，丝滑交易美股。","en":"昨天黄仁勋回归英伟达之后，英伟达单日暴涨 30%，创下了公司 20 多年以来最大的单日涨幅，纳指单天市值暴涨 2 万亿美元。\n只有失而复得才知道珍惜，黄仁勋作为美国 AI 的灵魂人物，一个人就价值数万亿美元。\n现在很多人关心的一个问题是，这波会不会直接 V 反，重复 25 年4 月的剧本？\n可能性不大，当下的大环境和前两年有明显的区别。但黄仁勋回归，起码把过去两周压在 AI 和半导体产业链上最致命的看空逻辑大幅削掉了。这波黑天鹅落地后，市场本质上是 irst-foreign-astronaut-2026-11-24/?taid=6b0519eeeacbd000018a5cc5&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":229},{"id":"2125088793107771793","h":"CrushTheShorts","ts":1795495625,"zh":"黄老爷来了，AI太平了！黄老爷来了，青天就有啦！\n开盘不久大家就觉得这味道不对啊，开盘买 ST 旭创亏 9%，买农行赚2%\n祖训又一次来了？每次算力反弹的时候，都要加仓银行？","en":"黄老爷来了，AI太平了！黄老爷来了，青天就有啦！\n开盘不久大家就觉得这味道不对啊，开盘买 ST 旭创亏 9%，买农行赚2%\n祖训又一次来了？每次算力反弹的时候，都要加仓银行？","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX3U_dhbkAAmvT7.jpg?name=orig"],"u":"https://x.com/CrushTheShorts/status/2125088793107771793","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":1045},{"id":"2125087382496264694","h":"dmjk001","ts":1795495288,"zh":"彭博：马来西亚要求数据中心切断与美国黑名单上企业的合作\n马来西亚将建议数据中心运营商不要为七家新被列入美国贸易黑名单的公司提供托管、租赁空间或服务，此举旨在加大力度防止该国蓬勃发展的产业被用来规避美国的技术限制。\n投资、贸易及工业部周二在一份声明中表示：“马来西亚仍致力于营造一个安全、透明和基于规则的贸易环境，不会允许自己被用作规避出口管制的渠道。将对被发现违反任何法律的相关方采取行动。”","en":"彭博：马来西亚要求数据中心切断与美国黑名单上企业的合作\n马来西亚将建议数据中心运营商不要为七家新被列入美国贸易黑名单的公司提供托管、租赁空间或服务，此举旨在加大力度防止该国蓬勃发展的产业被用来规避美国的技术限制。\n投资、贸易及工业部周二在一份声明中表示：“马来西亚仍致力于营造一个安全、透明和基于规则的贸易环境，不会允许自己被用作规避出口管制的渠道。将对被发现违反任何法律的相关方采取行动。”","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX3Thyha8AAWMVK.png?name=orig"],"u":"https://x.com/dmjk001/status/2125087382496264694","l":[],"ln":[],"t":["关税贸易"],"lk":3,"rt":1,"rp":0,"vw":1695},{"id":"2125087186546819431","h":"baoshu88","ts":1795495242,"zh":"老黄虽然复职了，但是董事会趁这 11 天，顺手给老黄装了三道紧箍咒，以后不让他碰对华事务了：\n 1. 针对历史出口合规的内部调查并没有撤销，继续查；\n 2. 董事会新设“国家安全与出口管制委员会”，全由独立董事掌管对华敏感业务，等于把中国区的决策权从 CEO 手里直接拿走了；\n 3. 首席合规官和总法律顾问不再向 CEO 汇报，直接向董事会负责。","en":"老黄虽然复职了，但是董事会趁这 11 天，顺手给老黄装了三道紧箍咒，以后不让他碰对华事务了：\n 1. 针对历史出口合规的内部调查并没有撤销，继续查；\n 2. 董事会新设“国家安全与出口管制委员会”，全由独立董事掌管对华敏感业务，等于把中国区的决策权从 CEO 手里直接拿走了；\n 3. 首席合规官和总法律顾问不再向 CEO 汇报，直接向董事会负责。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX3ThfKbEAAy94r.png?name=orig"],"u":"https://x.com/baoshu88/status/2125087186546819431","l":[],"ln":[],"t":["关税贸易"],"lk":20,"rt":4,"rp":5,"vw":3167},{"id":"21250865
