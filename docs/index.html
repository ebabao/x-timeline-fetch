<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经资讯工作台 · X 信源</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d4a24c'/><text x='16' y='23' font-size='19' font-family='system-ui' text-anchor='middle' fill='%230a0d13'>财</text></svg>">
<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>
</head>

切分给员工。\n海外存储厂商的共识是：回购注销是给股东的回报，股权激励属于经营成本，两条资金池分开。长鑫这套方案，等于拿本该归于全体股东的回购资金，划出一半作为激励，在周期景气、营收利润爆发的阶段，优先倾斜内部团队。\n存储是强周期赛道，本轮DRAM涨价红利窗口有限。当景气下行、自由现金流收缩时，这类安排对股东权益的侵蚀会更加突出。10亿注销的情绪价值大于实质价值，对标美光、Sandisk成熟的股东回报框架，长鑫在资本分配上，优先顺序明显站在管理层激励一侧。","en":"长鑫二十亿回购！\n华尔街观察｜长鑫回购：数字之下的股东回报标尺\n长鑫抛出上限20亿元回购，市场第一眼看到“注销”利好，拆开看却是对半拆分：10亿用于股权激励，仅10亿用来注销，本质是动用股东资金完成内部激励。按前三季度2690亿营收测算，用于注销的10亿，占营收比重不足1%，属于对总股本稀释影响微弱的“毛毛雨”，很难给存量股东带来实质性增厚。\n对比海外存储同行的资本分配逻辑，差异清晰。Sandisk最新回购授权合计155亿美元，回购资金优先用于注销缩股，股权激励单独列支，不占用回购注销额度，回购直接服务存量股东；美光同样将回购定位为对冲稀释、回馈股东的工具，激励预算独立，不会把回购资金对半切分给员工。\n海外存储厂商的共识是：回购注销是给股东的回报，股权激励属于经营成本，两条资金池分开。长鑫这套方案，等于拿本该归于全体股东的回购资金，划出一半作为激励，在周期景气、营收利润爆发的阶段，优先倾斜内部团队。\n存储是强周期赛道，本轮DRAM涨价红利窗口有限。当景气下行、自由现金流收缩时，这类安排对股东权益的侵蚀会更加突出。10亿注销的情绪价值大于实质价值，对标美光、Sandisk成熟的股东回报框架，长鑫在资本分配上，优先顺序明显站在管理层激励一侧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117636890996400214","l":[],"ln":[],"t":["财报"],"lk":2,"rt":0,"rp":1,"vw":1442},{"id":"2117636695961096440","h":"business","ts":1793718906,"zh":"币安周二表示，这起 63 亿美元抢劫案背后的黑客使用了社会工程技术，包括虚假求职面试以及恶意软件，并在迄今为止有关事件进展的最详细报告中表示。","en":"Binance said Tuesday that the hackers behind a $6.3 billion heist used social engineering techniques including fake job interviews, as well as malicious software, in the most detailed report yet on how the incident unfolded.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2117636695961096440","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-03/binance-hackers-used-fake-job-interviews-in-6-3-billion-heist?taid=6ae9fa7a1b8d710001836553&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":8,"rt":4,"rp":2,"vw":13870},{"id":"2117635921390575892","h":"RFI_Cn","ts":1793718722,"zh":"美国中期选举对特朗普及剩余任期至关重要/特朗普称将赦免马斯克以防其遭调查/美国空袭霍峡伊朗格什姆岛/美中俄是否谈俄乌战争各方关注/日台今年年底签署全面经贸协定/中国前央视主持人程万军在台跳机寻求庇护转第三国/捷克法院判中国公民杨艺明间谍案无罪当庭释放检方提上诉/英伟达要求数据中心客户降低对中国业务比重/平壤否认对币安实施创纪录黑客攻击","en":"美国中期选举对特朗普及剩余任期至关重要/特朗普称将赦免马斯克以防其遭调查/美国空袭霍峡伊朗格什姆 两三个月光景，市场这个吊样了\n当时帮你们省的钱，现在可以V我50吗？助我去crazy的周四 KFC party放纵一把","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2117628210406154242","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":259},{"id":"2117627944374059016","h":"cnfinancewatch","ts":1793716820,"zh":"华尔街观察｜乌镇信号：AI二波牛市，硬件与应用双轮重定价\n当全球市场正在对AI资本开支进行一轮剧烈的杠杆出清，很多资金开始怀疑算力资本开支的持续性，乌镇递出了一条清晰的产业分界线：第一波AI牛市，是GPU、算力集群的卖铲人行情；而正在酝酿的第二波行情，主线落在端侧硬件、具身载体，以及能够产生真实现金流的AI应用。\n本届乌镇峰会创下多项首次：首次把开源放在大会核心主题，新设机器人与具身智能、时空智能独立分论坛，同步开启国内首个具身智能专场赛BOT SHOW场，六百余家企业展出上千项技术成果，从十万卡国产智算超节点、液冷机柜、加速卡，到可以自主打羽毛球、分拣搬运的人形机器人、触觉舵机、传感指环、脑机头环，硬件不再停留在机房里的算力芯片，而是走向物理世界的执行终端。\n这是最重要的拐点。此前市场把AI简化成一张算力供需的计算题，资金扎堆上游，只要资本开支增速放缓，估值就立刻杀跌。但乌镇给出的叙事是：算力基建完成阶段性铺垫之后，价值传导链条开始向下游溢出。硬件端的红利，从训练卡，切换到减速器、伺服、传感、执行器、轻量化端侧芯片这批物理AI零部件；产业不再追求纸面参数，而是批量验证进厂、入户的可行性，工业产线、仓储物流、康养辅助、消费级智能硬件，全部进入小规模落地试点。\n另一边，AI应用正在脱离Demo阶段。从工业质检、企业数字化智能体，到单人即可完成的AIGC生产链路、教育、医疗辅助工具，开源生态大幅降低应用开发门槛。过去市场质疑应用没有付费意愿，现在产业侧的变化是：AI开始成为企业降本的刚性工具，从“可选项”变成“必选项”，这是应用赛道兑现收入、走出独立行情的底层基础。\n资金层面，这一轮二波牛市不会复刻第一波普涨狂欢。第一波是流动性驱动、凡是算力皆上涨；第二波是业绩筛选的结构性牛市，两条主线各有定价逻辑：做多AI硬件，押注具身智能放量带来的零部件订单兑现，优先看有量产交付、进入产业试点的标的；做多AI应用，优先锁定已经跑通付费闭环、单模型边际成本持续下行的场景化智能体公司。\n风险同样清晰。短期全球科技的去杠杆情绪没有完全结束，市场依旧会对“订单预期”反复摇摆；人形机器人量产节奏、商业应用付费转化率，都会成为阶段性的检验标尺。但乌镇释放的信号已经足够明确：AI产业没有终结于算力，它正从数字世界，踏入物理世界。\n上半场买铲子，下半场买载体与场景。这一轮，是硬件承载智能、应用兑现价值的牛市。","en":"华尔街观察｜乌镇信号：AI二波牛市，硬件与应用双轮重定价\n当全球市场正在对AI资本开支进行一轮剧烈的杠杆出清，很多资金开始怀疑算力资本开支的持续性，乌镇递出了一条清晰的产业分界线：第一波AI牛市，是GPU、算力集群的卖铲人行情；而正在酝酿的第二波行情，主线落在端侧硬件、具身载体，以及能够产生真实现金流的AI应用。\n本届乌镇峰会创下多项首次：首次把开源放在大会核心主题，新设机器人与具身智能、时空智能独立分论坛，同步开启国内首个具身智能专场赛BOT SHOW场，六百余家企业展出上千项技术成果，从十万卡国产智算超节点、液冷机柜、加速卡，到可以自主打羽毛球、分拣搬运的人形机器人、触觉舵机、传感指环、脑机头环，硬件不再停留在机房里的算力芯片，而是走向物理世界的执行终端。\n这是最重要的拐点。此前市场把AI简化成一张算力供需的计算题，资金扎堆上游，只要资本开支增速放缓，估值就立刻杀跌。但乌镇给出的叙事是：算力基建完成阶段性铺垫之后，价值传导链条开始向下游溢出。硬件端的红利，从训练卡，切换到减速器、伺服、传感、执行器、轻量化端侧芯片这批物理AI零部件；产业不再追求纸面参数，而是批量验证进厂、入户的可行性，工业产线、仓储物流、康养辅助、消费级智能硬件，全部进入小规模落地试点。\n另一边，AI应用正在脱离Demo阶段。从工业质检、企业数字化智能体，到单人即可完成的AIGC生产链路、教育、医疗辅助工具，开源生态大幅降低应用开发门槛。过去市场质疑应用没有付费意愿，现在产业侧的变化是：AI开始成为企业降本的刚性工具，从“可选项”变成“必选项”，这是应用赛道兑现收入、走出独立行情的底层基 爆仓等声音频出，近期跌到这个位置更偏向情绪化的资金流动性问题。AI产业景气度仍在有序演绎，2027年需求指引尚未出现下调的信号。市场情绪化容易使得股价在过高和过低两极演绎，目前已超跌，对于悲观预期演绎较为极致，遵循产业规律，情绪化宣泄完又会回归理性。","en":"【西部通信】中际旭创对于不实传言的辟谣\n不实传言：\n1、传言海外客户的800g需求砍单，目前绝大部分客户都没有下修，个别的有一些结构性调整。比如减少800g，增加1.6t。2027年的行业需求没有任何下修。\n2、传言外资券商下调评级，是虚假谣言。\n#关于未来需求指引： 2028年有一家客户给了明确指引，仍然很强劲。其他客户仍然在收集。四季度和明年一季度的拉货节奏：没有放缓情况，供给还是很紧张。\n#价格：2027年价格比较坚挺，小幅度降价。\n#股东回报上的考虑和回购：前期有比较大规模的回购，最近也有提案进行50亿规模的注销。后续是否继续回购会再判定。分红比例会继续加大，会加大分红回报。\n#物料问题： 前三季度紧张，后续逐渐改善，环比持续提升。DSP物料：公司锁定的物料是和订单需求接近的，整体的行业供给紧张，公司的大客户拥有分配的话语权，可以和市场份额匹配，价格整体还好，不会影响bom结构。\n#marvell收购lumentum事件点评：判定事件对竞争格局没有影响。\n#英伟达展示oio的技术方案： 对于新的应用场景，公司都有针对性的开发，协助客户定义新的领域，无论采用新的产品形态，公司都在准备中。\n#NPO： 明年下半年起量，更多需求会出现在2028年，需要良率爬坡的过程。上游更高功率的光源和其他物料有良率爬坡的过程，都是全新的物料。\n#xpo的产品：今年OFC大会上就已经展示了解决方案，明年就会产生需求。\n#scale in： 还需要较长时间去部署，技术标准现在还不清晰。\n#关于毛利率： 零部件紧张会导致盈利能力下降吗？bom成本涨幅相对有限，毛利率能不能保持稳定还要看达成的价格、出货结构、良率、生产效率、技术能力的管控水平（比如硅光产品里面对方案的优化）。\n[太阳]西部通信观点：近期AI硬件赛道从前期的极度拥挤，到去拥挤度，到接近恐慌式的流动性危机，资金去杠杆、减仓、赎回、爆仓等声音频出，近期跌到这个位置更偏向情绪化的资金流动性问题。AI产业景气度仍在有序演绎，2027年需求指引尚未出现下调的信号。市场情绪化容易使得股价在过高和过低两极演绎，目前已超跌，对于悲观预期演绎较为极致，遵循产业规律，情绪化宣泄完又会回归理性。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117619754144072036","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":967},{"id":"2117619575181435039","h":"dmjk001","ts":1793714824,"zh":"中际旭创交流要点总结-20261103\n1、砍单传闻辟谣：公司明确表示，#绝大部分客户没有下调2027年订单，个别客户仅进行结构性调整（下调800G、上调1.6T），旭创自身订单未受影响。整体需求仍在此前预测范围内，且原有预测相对保守。\n2、2028年指引：已有一家重点客户给出明确的2028年需求指引，另一家预计年底给出。#目前看2028年需求仍将保持非常强劲的增长，客户拉货节奏正常，未见放缓。\n3、价格/毛利率：2027年800G、1.6T价格整体良好，部分产品小幅年降，部分维持原价。DSP、光芯片、mSAP供应逐季改善，BOM涨幅有限，#高端产品及硅光占比提升有望支撑毛利率稳定。\n4、NPO/XPO：NPO预计2027H2起量、2028年加速，主要受良率及高功率CW光源等物料爬坡影响；XPO预计2027H2开始释放需求。#未来CPO与NPO、可插拔方案将长期并存。**\n5、其他：外资券商下调旭创评级的传闻不实；Marvell拟收购Lumentum预计不会影响现有供应格局","en":"中际旭创交流要点总结-20261103\n1、砍单传闻辟谣：公司明确表示，#绝大部分客户没有下调2027年订单，个别客户仅进行结构性调整（下调800G、上调1.6T），旭创自身订单未受影响。整体需求仍在此前预测范围内，且原有预测相对保守。\n2、2028年指引：已有一家重点客户给出明确的2028年需求指引，另一家预计年底给出。#目前看2028年需求仍将保持非常强劲的增长，客户拉货节奏正常，未见放缓。\n3、价格/毛利率：2027年800G、1.6T价格整体良好，部分产品小幅年降，部分维持原价。DSP、光芯 m"}],"t":[],"lk":3,"rt":0,"rp":1,"vw":1436},{"id":"2117603450129379443","h":"cnfinancewatch","ts":1793710980,"zh":"2026中期选举决胜2030人口普查，改写美国数十年大选格局\n2026美国中期选举核心博弈，是锁定2028执政权、掌控2030年4月1日十年一度人口普查规则，新席位规则将从2032年大选生效、沿用十年。\n美国1929年《永久分配法案》锁定众议院固定435席，叠加参院100席+特区3票，组成大选538张选举人票，270票即可胜选，席位变动是零和博弈。\n过往蓝州长期靠双重优势锁票：一是2020普查统计误差，红州佛罗里达、德州被少算人口，蓝州纽约、明尼苏达多算，直接流失3个众议院席位；二是普查计入非法移民、临时签证人员，CIS数据显示26个席位从公民州流入庇护蓝州，加州虚增11席，稀释合法公民票权。\n当下人口自然流动已致蓝州缩水：基准预测加州、纽约、伊利诺伊合计流失7席，德州、佛罗里达等红州新增席位，让民主党经典蓝墙票仓组合不足270胜选线。\n今年9月10日人口普查局发布新规（11月2日评议截止），2030普查席位分配仅统计绿卡合法居民，剔除非法移民、临时签证人群，叠加国会《平等代表权法案》推进公民计票规则。新规落地将让加州最多丢10席、纽约5–7席、伊利诺伊4–5席，红州净增20席，彻底改写美国未来数十年大选数学，目前蓝州多州检察长正司法阻挠新规落地。","en":"2026中期选举决胜2030人口普查，改写美国数十年大选格局\n2026美国中期选举核心博弈，是锁定2028执政权、掌控2030年4月1日十年一度人口普查规则，新席位规则将从2032年大选生效、沿用十年。\n美国1929年《永久分配法案》锁定众议院固定435席，叠加参院100席+特区3票，组成大选538张选举人票，270票即可胜选，席位变动是零和博弈。\n过往蓝州长期靠双重优势锁票：一是2020普查统计误差，红州佛罗里达、德州被少算人口，蓝州纽约、明尼苏达多算，直接流失3个众议院席位；二是普查计入非法移民、临时签证人员，CIS数据显示26个席位从公民州流入庇护蓝州，加州虚增11席，稀释合法公民票权。\n当下人口自然流动已致蓝州缩水：基准预测加州、纽约、伊利诺伊合计流失7席，德州、佛罗里达等红州新增席位，让民主党经典蓝墙票仓组合不足270胜选线。\n今年9月10日人口普查局发布新规（11月2日评议截止），2030普查席位分配仅统计绿卡合法居民，剔除非法移民、临时签证人群，叠加国会《平等代表权法案》推进公民计票规则。新规落地将让加州最多丢10席、纽约5–7席、伊利诺伊4–5席，红州净增20席，彻底改写美国未来数十年大选数学，目前蓝州多州检察长正司法阻挠新规落地。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117603450129379443","l":[],"ln":[],"t":[],"lk":0,"rt":1,"rp":0,"vw":1572},{"id":"2117602768370201013","h":"business","ts":1793710817,"zh":"瑞典代理总理乌尔夫·克里斯特森获得新的授权，尝试组建政府","en":"Sweden’s acting prime minister Ulf Kristersson received a fresh mandate to try to form a government","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2117602768370201013","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-03/sweden-hands-caretaker-prime-minister-a-shot-to-form-government?taid=6ae9dae1c52de3000126039c&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":2,"rt":0,"rp":0,"vw":12206},{"id":"2117601462142279895","h" atus/2117539246781370471","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":2,"vw":945},{"id":"2117538879322603967","h":"dmjk001","ts":1793695585,"zh":"这半个月来，传音阁已经向各峰发了十几道诏令。\n无一例外，全是喜讯。\n先是说，西域须弥寺的几位佛门圣者，已经动身赶来驰援。\n又说，镇守北境的九位剑仙，早在数日前便抵达了山门附近。\n甚至连归墟深处那些闭关千年的老祖，也决定破例出山。\n总之，援兵不是已经到了，就是正在路上。\n----\n与此同时，内门又流传起另一种说法。\n据几位掌教亲传透露，眼下发生的一切，其实早就在掌教的算计之中。\n此前宗门几次反击，之所以时断时续，并非力有不逮，而是有意为之。\n说白了，就是试探。\n试探哪些峰主忠心，哪些峰主藏有二心。\n摸清哪座峰还有剑可出，哪座峰已经无剑可用。\n等那些心志不坚的人主动撤走，再集中宗门全部力量，放手一搏。\n到那时，既没有人从中作梗，也不必再顾忌各峰的利益。\n如此看来，近些日子虽然险象环生，却始终没有超出掌教的掌控。\n一切，不过是在下一盘大棋。\n然而，山脚下的杂役和外门弟子，听到的却是另外一个故事。\n他们说，掌教压根没打算真正守住这座山。\n他只想让山门晚些倒下。\n能撑一天，便多撑一天。\n毕竟，只要山门还在，便能以守山之名，向各峰继续征收灵石。\n灵石交不起了，就拿灵器抵。\n灵器也交不起了，还有本命飞剑。\n总归能榨出些东西。\n至于山门最后守不守得住，反倒没那么重要。\n因为不管结局如何，掌教都不会亏。\n更有甚者，说得神乎其神。\n说掌教早已与天庭暗中立下誓约。\n只要献上足够多的灵石和法宝，便能换来一个飞升名额。\n听说天庭的御马监，恰好还缺一位管马的仙官。\n----\n两种传闻，截然相反。\n可怪就怪在，无论相信哪一种的人，都还在不断受伤。\n伤了又伤。\n死了又死。\n午后，传音阁再次举起紫金喇叭。\n声音再次传遍五十峰。\n说是掌门正在召诸宗议事，要研造更多护山法器。\n只是，此次情况不一样了！\n往日，喇叭一响，众弟子翘首。\n如今，就连外门新晋的弟子，也没了喜色。\n角落里，蜷着一群断臂缺腿的师兄师姐。\n“会不会，我们便是那护山的法器？”\n紫金喇叭也是法器。\n只要听得人信了，便有言出法随的效果。\n信的人越多，效果便漫溢到不信者身上，改变其原先的想法。\n反之，若没人信了。\n紫金喇叭，也就是个喇叭。\n而且喇叭吹得多了，便成了唢呐。","en":"这半个月来，传音阁已经向各峰发了十几道诏令。\n无一例外，全是喜讯。\n先是说，西域须弥寺的几位佛门圣者，已经动身赶来驰援。\n又说，镇守北境的九位剑仙，早在数日前便抵达了山门附近。\n甚至连归墟深处那些闭关千年的老祖，也决定破例出山。\n总之，援兵不是已经到了，就是正在路上。\n----\n与此同时，内门又流传起另一种说法。\n据几位掌教亲传透露，眼下发生的一切，其实早就在掌教的算计之中。\n此前宗门几次反击，之所以时断时续，并非力有不逮，而是有意为之。\n说白了，就是试探。\n试探哪些峰主忠心，哪些峰主藏有二心。\n摸清哪座峰还有剑可出，哪座峰已经无剑可用。\n等那些心志不坚的人主动撤走，再集中宗门全部力量，放手一搏。\n到那时，既没有人从中作梗，也不必再顾忌各峰的利益。\n如此看来，近些日子虽然险象环生，却始终没有超出掌教的掌控。\n一切，不过是在下一盘大棋。\n然而，山脚下的杂役和外门弟子，听到的却是另外一个故事。\n他们说，掌教压根没打算真正守住这座山。\n他只想让山门晚些倒下。\n能撑一天，便多撑一天。\n毕竟，只要山门还在，便能以守山之名，向各峰继续征收灵石。\n灵石交不起了，就拿灵器抵。\n灵器也交不起了，还有本命飞剑。\n总归能榨出些东西。\n至于山门最后守不守得住，反倒没那么重要。\n因为不管结局如何，掌教都不会亏。\n更有甚者，说得神乎其神。\n说掌教早已与天庭暗中立下誓约。\n只要献上足够多的灵石和法宝，便能换来一个飞升名额。\n听说天庭的御马监，恰好还缺一位管马的仙官。\n----\n两种传闻，截然相反。\n可怪就怪在，无论相信哪一种的人，都还在不断受伤。\n伤了又伤。\n死了又死。\n午后，传音阁再次举起紫金喇叭。\n声音再次传遍五十峰。\n说是掌门正在召诸宗议事，要研造更多护山法器。\n只是，此次情况不一样了！\n往日，喇叭一响，众弟子翘首。\n如今，就连外门新晋的弟子，也没了喜色。\n角落里，蜷着一群断臂缺腿的师兄师姐。\n“会不会，我们便是那护山的法器？”\n紫金喇叭也是法器。\n只要听得人信了，便有言出法随的效 hreatening criminal prosecutions before and after Tuesday’s midterm contests.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2117470604911645172","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-03/block-on-us-warnings-to-election-workers-lifted-by-court?taid=6ae95fcb13e4ae0001614420&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":1,"rp":0,"vw":13462},{"id":"2117469697784401972","h":"AnnaEconomist","ts":1793679091,"zh":"一个既个人又专业的公告：\n 18 个月前，我们开始实时收集在线价格，以追踪解放日关税如何加剧通胀。 从那以后发生了很多事情。劳工统计局专员被解雇。美国历史上最长的政府关门意味着消费物价指数首次没有公布。独立衡量通货膨胀的理由变得更加充分。 最初是关税通胀追踪器，后来发展成为更大的东西：\n 彭博价格项目 (BPP)，我们尝试使用替代数据从头开始构建美国 CPI。 如今，BPP 涵盖了 CPI 篮子的 87%，涵盖商品和服务（未来几周将添加更多新数据）。每个月，我们都会从卡交易、电子商务网站、杂货店、药房、租赁列表、公司数据、彭博终端市场价格和政府记录中收集数百万个价格。更多数据即将到来。 回报是细节。官方 CPI 数据可让您深入了解“生牛排”等类别。BPP 更深入——将 CPI 篮子分解为近 700 个项目，而官方数据中大约有 200 个项目。 由我本人、彭博经济研究公司的 Troy Durie、Daniel Ripperger-Suhler、Joshua Danial 和 Scott Johnson 提供。 在 BECO MODELS BPP <GO> 探索 Bloomberg 价格项目，或在 ECAN US BPI <GO> 下载数据。 我相信 上的付费专区。 com 即将关闭，因此您无需订阅即可阅读本文（但您应该订阅！）\n utm_source=网站&utm_medium=分享&utm_campaign=twitter","en":"An announcement that is as personal as professional:\n18 months ago, we started collecting online prices in real time to track how Liberation Day tariffs were feeding into inflation.\nA lot has happened since. The BLS commissioner was fired. The longest government shutdown in US history meant CPI wasn’t published for the first time. And the case for an independent measure of inflation became much stronger.\nWhat started as a tariff inflation tracker has since grown into something much bigger:\nThe Bloomberg Price Project (BPP), our attempt to build the US CPI from the ground up using alternative data.\nToday, BPP covers 87% of the CPI basket, across both goods and services (more new data will be added in coming weeks). Every month, we collect millions of prices from card transactions, e-commerce sites, grocery stores, pharmacies, rental listings, corporate data, Bloomberg Terminal market prices and government records. And more data are coming.\nThe payoff is detail. Official CPI data let you drill down to categories such as “uncooked beef steaks.” BPP goes much deeper — breaking the CPI basket into almost 700 line items, compared with roughly 200 in the official data.\nBrought to you by: myself, Troy Durie, Daniel Ripperger-Suhler, Joshua Danial and Scott Johnson from across Bloomberg Economics.\nExplore the Bloomberg Price Project at BECO MODELS BPP <GO>, or download the data at ECAN US BPI <GO>.\nI believe the paywall on is coming down briefly so you can read this without a subscription (but you should subscribe!)","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/AnnaEconomist/status/2117469697784401972","l":["Bloomberg.com","bloomberg.com"],"ln":[{"u":"http://Bloomberg.com","d":"Bloomberg.com"},{"u":"https://www.bloomberg.com/graphics/2026-inflation-price-index/?utm_source=website&utm_medium=share&utm_campaign=twitter","d":"bloomberg.com"}],"t":["通胀","关税贸易"],"lk":2495,"rt":288,"rp":77,"vw":264189},{"id":"2117469520432615564","h":"CrushTheShorts","ts":1793679049,"zh":"关于外围，现在A最需要的刺激是\n川哥输了中选，两院全丢\n美股科技剧烈调整，费半回撤到8500平台\nFCC制裁尽快正式落地\n毕竟大A对以上预期利空，都已经130%的充分计提，能明确落地，都是利空转利好，最差情况就是悬而未决","en":"关于外围，现在A最需要的刺激是\n川哥输了中选，两院全丢\n美股科技剧烈调整，费半回撤到8500平台\nFCC制裁尽快正式落地\n毕竟大A对以上预期利空，都已经130%的充分计提，能明确落地，都是利空转利好，最差情况就是悬而未决","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2117469520432615564","l":[],"ln":[],"t":["美股","关税贸易"],"lk":5,"rt":0,"rp":0,"vw":1158},{"id":"2117469347023053137","h":"business","ts":1793679007,"zh":"@AndreaFelsted（来自 @opinion）写道，亿万富翁对 Delfin Sarl 的收购都无法解决雷朋眼镜制造商 EssilorLuxottica 背后的控股公司的困境。","en":"Neither of the billionaire bids for Delfin Sarl will fix the woes of the holding company behind Ray-Ban maker EssilorLuxottica, writes @AndreaFelsted (via @opinion)","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/statu ial&utm_source=Twitter#Echobox=1793624239","d":"scmp.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":652},{"id":"2117238325975175306","h":"RFI_Cn","ts":1793623927,"zh":"美国中期选举1天倒计时超5300万人提前投票/冲绳美军酒驾被捕/台北市长选举辩论后沈伯洋民调首破五成/独立指数中国制造业活动连续11个月增长/中国化工产品出口飙升或将引发新贸易战/法国中学秋假后返校首日堵校罢课重启吁再游行/路透社发现伊朗隐秘军购网绕过美国封锁/乌克兰和俄罗斯都报告遭网攻","en":"美国中期选举1天倒计时超5300万人提前投票/冲绳美军酒驾被捕/台北市长选举辩论后沈伯洋民调首破五成/独立指数中国制造业活动连续11个月增长/中国化工产品出口飙升或将引发新贸易战/法国中学秋假后返校首日堵校罢课重启吁再游行/路透社发现伊朗隐秘军购网绕过美国封锁/乌克兰和俄罗斯都报告遭网攻","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2117238059427119104/vid/avc1/720x720/Xbm3Hweh-peORlzk.mp4?tag=29"],"u":"https://x.com/RFI_Cn/status/2117238325975175306","l":[],"ln":[],"t":["关税贸易"],"lk":0,"rt":0,"rp":0,"vw":405},{"id":"2117234665170129062","h":"dmjk001","ts":1793623055,"zh":"20:36:51【近期证监会拟对护盘式回购作调整优化】财联社11月2日电，中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。在监管部门的号召和推动下，近年来不少上市公司积极开展股份回购，请问上市公司回购的整体实施情况如何？下一步在支持上市公司股份回购、优化回购规则方面有什么考虑？\n答：开展股份回购是上市公司进行市值管理的重要工具，也是上市公司稳定自身股价、展现和传递发展前景及信心的重要途径。2023年12月，证监会修订《上市公司股份回购规则》，提升了股份回购便利度，完善了上市公司股份回购的常态化机制性安排，回购规模数量总体呈上升态势。2024年至2026年前10个月，上市公司回购股份的积极性稳步提升，沪深两市累计披露回购计划金额和实际实施金额均较前三年（2021年-2023年）增长50%。今年前10个月，沪深两市645家上市公司披露700单2377亿元股份回购计划，其中回购注销金额1150亿元，占比近50%，747家公司实际实施回购1345亿元，回购计划金额、实际回购金额、回购注销金额及占比均创历史新高。\n为进一步提高上市公司开展股份回购的便利度，发挥市场内在稳市功能，经广泛深入调研，近期证监会拟对为维护公司价值及股东权益所必需而回购股份（简称护盘式回购）作以下调整优化：一是新增股价“破发”作为可以开展护盘式回购的情形之一，规定护盘式回购不适用“公司股票上市已满六个月”的限制，取消护盘式回购中开盘和收盘集合竞价阶段不得申报的限制等。二是要求上市36个月内的上市公司当股价触及护盘式回购情形的，严格认真履行上市承诺中的稳定股价措施。三是要求存在超募资金的上市公司在触及护盘式回购时及时实施回购。四是要求上市公司在年度现金分红计划中明确一定比例资金纳入回购专项基金，要求存在超募资金的上市公司将一定比例的超募资金纳入回购专项基金并专项用于股份回购注销，要求上市公司通过集中竞价卖出护盘式回购股份的所得收益纳入回购专项基金。\n下一步，我们将在深入研究论证的基础上，抓紧修订《上市公司股份回购规则》，增强护盘式回购的约束力。规则正式修订前，证监会将加大和有关方面协调配合，支持、鼓励和督促具备条件的上市公司，特别是重要指数成份股公司、龙头科技股公司按照上述要求结合自身实际积极实施股份回购，持续做好市值管理。","en":"20:36:51【近期证监会拟对护盘式回购作调整优化】财联社11月2日电，中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。在监管部门的号召和推动下，近年来不少上市公司积极开展股份回购，请问上市公司回购的整体实施情况如何？下一步在支持上市公司股份回购、优化回购规则方面有什么考虑？\n答：开展股份回购是上市公司进行市值管理的重要工具，也是上市公司稳定自身股价、展现和传递发展前景及信心的重要途径。2023年12月，证监会修订《上市公司股份回购规则》，提升了股份回购便利度，完善了上市公 标进行统筹研究，进一步优化，保持弹性。在风险总体可控的基础上，根据法定的逆周期调节安排，适度释放融资空间，盘活存量资金，提升市场流动性。\n投资者应当继续秉持理性投资理念，根据自身风险承受能力，合理运用融资工具。证监会将继续督促证券公司切实加强风险管理，保护投资者合法权益。","en":"20:33:38【证监会：证监会将会同证券交易所指导证券公司对融资保证金比例、可充抵保证金证券折算率、维持担保比例等风险控制指标进行统筹研究，进一步优化，保持弹性】财联社11月2日电，中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。在发挥好融资融券业务逆周期调节功能作用方面，请问证监会近期有何考虑？\n答：融资融券是资本市场重要的基础性制度之一，对平抑非理性波动，促进价格发现，吸引中长期资金入市，满足投资者融资需求具有积极作用。2026年1月，根据当时的市场形势，沪深北交易所将融资保证金比例由80%提高至100%，对减缓杠杆风险顺周期积累、促进理性交易和提前防控风险起到积极作用。近期，融资余额和交易活跃度明显下降，整体杠杆水平趋于稳健。为稳定资本市场、提振投资者信心，促进融资融券业务功能发挥，证监会将会同证券交易所指导证券公司对融资保证金比例、可充抵保证金证券折算率、维持担保比例等风险控制指标进行统筹研究，进一步优化，保持弹性。在风险总体可控的基础上，根据法定的逆周期调节安排，适度释放融资空间，盘活存量资金，提升市场流动性。\n投资者应当继续秉持理性投资理念，根据自身风险承受能力，合理运用融资工具。证监会将继续督促证券公司切实加强风险管理，保护投资者合法权益。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117233926460821980","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1267},{"id":"2117233672373825943","h":"dmjk001","ts":1793622818,"zh":"20:32:55【中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问】财联社11月2日电，中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。一、今日金融管理部门召开座谈会，就用好用足两项结构性货币政策工具作出安排，请问证监会对后续工作有何考虑？\n答：2024年9月，人民银行会同证监会、金融监管总局推出证券、基金、保险公司互换便利和股票回购增持专项再贷款两项新的货币政策工具。两年多来，证券公司、基金管理公司和上市公司等市场主体积极响应，两项工具运作良好。截至今年10月底，已开展了两批次互换便利操作，28家证券公司和基金管理公司参与，合计金额1050亿元。全市场已有902家上市公司披露1110单回购增持贷款公告，加上中国国新、中国诚通两家国有资本运营公司申请的增持贷款，目前申请贷款额度上限已累计约4400亿元。两项货币政策工具的设立实施，为引入市场增量资金、盘活机构存量资产、促进完善市场内在稳定机制发挥了重要作用。\n今天人民银行宣布将开展第三批证券、基金、保险公司互换便利操作，股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率降低至1%，我们将会同人民银行组织相关市场主体用好用足这两项工具，协同发挥好稳市支持作用。\n一是扩大互换便利业务的参与机构范围和资金额度。经相关机构申请，证监会商人民银行已经同意31家证券公司和基金管理公司开展第三批互换便利操作，申请额度超过1000亿元，近日就开始操作。证监会将继续督促证券公司和基金管理公司加强合规风控管理，充分发挥专业投资能力，更好稳定资本市场。\n二是提高上市公司股票回购增持专项再贷款覆盖率。证监会将引导推出更多权重指数公司、龙头科技股等具有较强市场影响的标志性案例。同时，督促已披露回购增持贷款计划的上市公司加快实施进度，已经申请贷款的公司加大回购实施力度，延续当前贷款回购增持的良好势头，为资本市场稳定积极贡献力量。\n二、在监管部门的号召和推动下，近年来不少上市公司积极开展股份回购，请问上市公司回购的整体实施情况如何？下一步在支持上市公司股份回购、优化回购规则方面有什么考虑？\n答：开展股份回购是上市公司进行市值管理的重要工具，也是上市公司稳定自身股价、展现和传递发展前景及信心的重要途径。2023年12月，证监会修订《上市公司股份回购规则》，提升了股份回购便利度，完善了上市公司股份回购的常态化机制性安排，回购规模数量总体呈上升态势。2024年至2026年前10个月，上市公司回购股份的积极性稳步提升，沪深两市累计披露回购计划金额和实际实施金额均较前三年（2021年-2023年）增长50%。今年前10个月，沪深两市645家上市公司披露700单2377亿元股份回购计划，其中回购注销金额1150亿元，占比近50%，747家公司实际实施回购1345亿元，回购计划金额、实际回购金额、回购注销金额及占比均创历史新高。\n为进一步提高上市公司开展股份回购的便利度，发挥市场内在稳市功能，经广泛深入调研，近期证监会拟对为维护公司价值及股东权益所必需而回购股份（简称护盘式回购）作以下调整优化：一是新增股价“破发”作为可以开展护盘式回购的情形之一，规定护盘式回购不适用“公司股票上市已满六个月”的限制，取消护盘式回购中开盘和收盘集合竞价阶段不得申报的限制等。二是要求上市36个月内的上市公司当股价触及护盘式回购情形的，严格认真履行上市承诺中的稳定股价措施。三是要求存在超募资金的上市公司在触及护盘式回购时及时实施回购。四是要求上市公司在年度现金分红计划中明确一定比例资金纳入回购专项基金，要求存在超募资金的上市公司将一定比例的超募资金纳入回购专项基金并专项用于股份回购注销，要求上市公司通过集中竞价卖出护盘式回购股份的所得收益纳入回购专项基金。\n下一步，我们将在深入研究论证的基础上，抓紧修订《上市公司股份回购规则》，增强护盘式回购的约束力。规则正式修订前，证监会将加大和有关方面协调配合，支持、鼓励和督促具备条件的上市公司，特别是重要指数成份股公司、龙头科技股公司按照上述要求结合自身实际积极实施股份回购，持续做好市值管理。\n三、前期监管部门已宣布推出主动ETF，目前进展情况如何？下一步在丰富市场投资工具等方面还有哪些工作考虑？\n答：主动ETF是基金经理依托专业投研能力自主开展选股、择时与配置，不以跟踪特定指数为目标，同时可以进行场内实时交易、实物申赎的公募基金产品，兼具普通基金主动管理和ETF交易灵活、透明度高的特点，可满足不同风险偏好投资者的需求，为市场持续引入增量资金。自今年6月份我会宣布推出主动ETF后，基金公司踊跃申报。首批18只主动ETF于10月19日注册，10月23日启动募集，整体募集态势良好。截至11月2日，合计募集资金超过350亿元，其中已有16只产品达到20亿元的单只募集规模上限并结束募集。\n下一步，证监会将引导和鼓励已完成募集的18只主动ETF加快开展投资建仓。同时，持续加大权益类基金产品供给和创新力度，支持基金管理人逆周期布局。推出更多新指数股票ETF，丰富场内投资工具。研究推出股债恒定比例等多资产指数基金，丰富场外中低波动型产品，更好满足不同投资者投资需求。鼓励基金管理人发行更多浮动费率基金，进一步强化基金管理人与持有人利益相绑定。\n四、在发挥好融资融券业务逆周期调节功能作用方面，请问证监会近期有何考虑？\n答：融资融券是资本市场重要的基础性制度之一，对平抑非理性波动，促进价格发现，吸引中长期资金入市，满足投资者融资需求具有积极作用。2026年1月，根据当时的市场形势，沪深北交易所将融资保证金比例由80%提高至100%，对减缓杠杆风险顺周期积累、促进理性交易和提前防控风险起到积极作用。近期，融资余额和交易活跃度明显下降，整体杠杆水平趋于稳健。为稳定资本市场、提振投资者信心，促进融资融券业务功能发挥，证监会将会同证券交易所指导证券公司对融资保证金比例、可充抵保证金证券折算率、维持担保比例等风险控制指标进行统筹研究，进一步优化，保持弹性。在风险总体可控的基础上，根据法定的逆周期调节安排，适度释放融资空间，盘活存量资金，提升市场流动性。","en":"20:32:55【中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问】财联社11月2日电，中国证监会有关部门负责人就近期稳市场稳预期相关工作答记者问。一、今日金融管理部门召开座谈会，就用好用足两项结构性货币政策工具作出安排，请问证监会对后续工作有何考虑？\n答：2024年9月，人民银行会同证监会、金融监管总局推出证券、基金、保险公司互换便利和股票回购增持专项再贷款两项新的货币政策工具。两年多来，证券公司、基金管理公司和上市公司等市场主体积极响应，两项工具运作良好。截至今年10月底，已开展了两批次互换便利操作，28家证券公司和基金管理公司参与，合计金额1050亿元。全市场已有902家上市公司披露1110单回购增持贷款公告，加上中国国新、中国诚通两家国有资本运营公司申请的增持贷款，目前申请贷款额度上限已累计约4400亿元。两项货币政策工具的设立实施，为引入市场增量资金、盘活机构存量资产、促进完善市场内在稳定机制发挥了重要作用。\n今天人民银行宣布将开展第三批证券、基金、保险公司互换便利操作，股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率降低至1%，我们将会同人民银行组织相关市场主体用好用足这两项工具，协同发挥好稳市支持作用。\n一是扩大互换便利业务的参与机构范围和资金额度。经相关机构申请，证监会商人民银行已经同意31家证券公司和基金管理公司开展第三批互换便利操作，申请额度超过1000亿元，近日就开始操作。证监会将继续督促证券公司和基金管理公司加强合规风控管理，充分发挥专业投资能力，更好稳定资本市场。\n二是提高上市公司股票回购增持专项再贷款覆盖率。证监会将引导推出更多权重指数公司、龙头科技股等具有较强市场影响的标志性案例。同时，督促已披露回购增持贷款计划的上市公司加快实施进度，已经申请贷款的公司加大回购实施力度，延续当前贷款回购增持的良好势头，为资本市场稳定积极贡献力量。\n二、在监管部门的号召和推动下，近年来不少上市公司积极开展股份回购，请问上市公司回购的整体实施情况如何？下一步在支持上市公司股份回购、优化回购规则方面有什么考虑？\n答：开展股份回购是上市公司进行市值管理的重要工具，也是上市公司稳定自身股价、展现和传递发展前景及信心的重要途径。2023年12月，证监会修订《上市公司股份回购规则》，提升了股份回购便利度，完善了上市公司股份回购的常态化机制性安排，回购规模数量总体呈上升态势。2024年至2026年前10个月，上市公司回购股份的积极性稳步提升，沪深两市累计披露回购计划金额和实际实施金额均较前三年（2021年-2023年）增长50%。今年前10个月，沪深两市645家上市公司披露700单2377亿元股份回购计划，其中回购注销金额1150亿元，占比近50%，747家公司实际实施回购1345亿元，回购计划金额、实际回购金额、回购注销金额及占比均创历史新高。\n为进一步提高上市公司开展股份回购的便利度，发挥市场内在稳市功能，经广泛深入调研，近期证监会拟对为维护公司价值及股东权益所必需而回购股份（简称护盘式回购）作以下调整优化：一是新增股价“破发”作为可以开展护盘式回购的情形之一，规定护盘式回购不适用“公司股票上市已满六个月”的限制，取消护盘式回购中开盘和收盘集合竞价阶段不得申报的限制等。二是要求上市36个月内的上市公司当股价触及护盘式回购情形的，严格认真履行上市承诺中的稳定股价措施。三是要求存在超募资金的上市公司在触及护盘式回购时及时实施回购。四是要求上市公司在年度现金分红计划中明确一定比例资金纳入回购专项基金，要求存在超募资金的上市公司将一定比例的超募资金纳入回购专项基金并专项用于股份回购注销，要求上市公司通过集中竞价卖出护盘式回购股份的所得收益纳入回购专项基金。\n下一步，我们将在深入研究论证的基础上，抓紧修订《上市公司股份回购规则》，增强护盘式回购的约束力。规则正式修订前，证监会将加大和有关方面协调配合，支持、鼓励和督促具备条件的上市公司，特别是重要指数成份股公司、龙头科技股公司按照上述要求结合自身实际积极实施股份回购，持续做好市值管理。\n三、前期监管部门已宣布推出主动ETF，目前进展情况如何？下一步在丰富市场投资工具等方面还有哪些工作考虑？\n答：主动ETF是基金经理依托专业投研能力自主开展选股、择时与配置，不以跟踪特定指数为目标，同时可以进行场内实时交易、实物申赎的公募基金产品，兼具普通基金主动管理和ETF交易灵活、透明度高的特点，可满足不同风险偏好投资者的需求，为市场持续引入增量资金。自今年6月份我会宣布推出主动ETF后，基金公司踊跃申报。首批18只主动ETF于10月19日注册，10月23日启动募集，整体募集态势良好。截至11月2日，合计募集资金超过350亿元，其中已有16只产品达到20亿元的单只募集规模上限并结束募集。\n下一步，证监会将引导和鼓励已完成募集的18只主动ETF加快开展投资建仓。同时，持续加大权益类基金产品供给和创新力度，支持基金管理人逆周期布局。推出更多新指数股票ETF，丰富场内投资工具。研究推出股债恒定比例等多资产指数基金，丰富场外中低波动型产品，更好满足不同投资者投资需求。鼓励基金管理人发行更多浮动费率基金，进一步强化基金管理人与持有人利益相绑定。\n四、在发挥好融资融券业务逆周期调节功能作用方面，请问证监会近期有何考虑？\n答：融资融券是资本市场重要的基础性制度之一，对平抑非理性波动，促进价格发现，吸引中长期资金入市，满足投资者融资需求具有积极作用。2026年1月，根据当时的市场形势，沪深北交易所将融资保证金比例由80%提高至100%，对减缓杠杆风险顺周期积累、促进理性交易和提前防控风险起到积极作用。近期，融资余额和交易活跃度明显下降，整体杠杆水平趋于稳健。为稳定资本市场、提振投资者信心，促进融资融券业务功能发挥，证监会将会同证券交易所指导证券公司对融资保证金比例、可充抵保证金证券折算率、维持担保比例等风险控制指标进行统筹研究，进一步优化，保持弹性。在风险总体可控的基础上，根据法定的逆周期调节安排，适度释放融资空间，盘活存量资金，提升市场流动性。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117233672373825943","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":0,"vw":1385},{"id":"2117231855753892273","h":"cnfinancewatch","ts":1793622385,"zh":"10月去杠杆的余震与11月的机会窗口：中性偏多地看AI资本开支交易\n10月对很多投资者来说是一次残酷的压力测试。摩根士丹利的数据显示，最近一轮对冲基金去杠杆化是过去10年最高，强度超过了2016年中国股市崩盘、2018年“波动地狱”、2020年3月COVID崩盘、2021年Archegos/恒大危机以及2022年熊市。高盛主经纪业务部门在26日报告称，两周内观察到约200亿美元抛售，而7月整个去杠杆期间约为230亿美元。换句话说，10月的抛售在极短时间内集中释放，情绪和仓位都经历了剧烈出清。\n与此同时，空头力量明显抬头。根据HOOD空头持仓数据，从9月到10月，多只股票的空头浮动比率显著上升：AAOI从12.5%升至19.84%以上，AEVA从11%升至25.64%以上，CBRS从12.25%升至20.12%以上，AEHR从14.33%升至17.93%以上，TSEM从2.15%升至4.73%以上，CIFR从19.94%升至25.39%以上，LWLG从15.24%升至19.12%以上，OKLO从17.72%升至22.93%以上，CRWV从17.91%升至26.58%以上。大量去杠杆与空头持仓激增同时发生，确实让人联想到事件落地后出现过的“7月式”格局——仓位先极端收缩，随后再根据基本面和宏观不确定性重新定价。但需要强调，空头比率上升本身不等于方向判断，它更多反映的是市场分歧和防御性仓位。\n轮动层面也出现了一些值得警惕的泡沫化迹象。近期资金把$CRWD和网络安全等股票推向数百倍远期市盈率的估值区间，说明市场在追逐确定性增长时，愿意支付很高的溢价。这种估值结构意味着，一旦宏观风险偏好回落或财报不及预期，波动会被放大。\n不过，从AI资本开支和瓶颈环节的基本面看，许多财报（并非全部，例如INTC）仍然强劲。比如AXTI给出的年化四季度指引对应约23.7倍市盈率，这还没有计入InP衬底潜在涨价和产能扩张，若这些因素兑现，估值可能被压缩到个位数。SKHY约591亿美元运营利润，轻松超过亚马逊281亿美元运营利润，并且有5年长期协议支持。更关键的是，目前没有迹象表明MSFT或AMZN会大幅削减资本支出，而SPCX又为GPU采购额外锁定400亿美元。这些信号说明，AI基础设施的资本开支周期仍有较强支撑，尤其是光子和内存等瓶颈环节。\n宏观上，市场正在等待下周以后美国中期选举结束。选举落地通常有助于降低一部分政策不确定性，让资金重新回到基本面和盈利趋势上。伊朗问题如果随后走向明朗化，也可能缓和此前积累的地缘风险溢价。当然，这只是一种偏积极的基准假设，地缘政治仍有反复可能，不能把“明朗化”等同于风险完全消失。\n综合来看，10月的极端去杠杆和空头激增说明市场已经释放了相当一部分压力，但估值泡沫和宏观不确定性仍在，短期波动不会小。中性偏多的看法是：在中期选举结束、伊朗问题趋于明朗化的窗口里，市场风险偏好可能边际改善；而AI资本开支交易，特别是光子和内存等瓶颈环节，仍是一个具备世代级产业逻辑的机会，只是路径会伴随极端波动。更合理的姿态不是追涨，而是在波动中甄别真正有盈利兑现和产能瓶颈支撑的公司，同时对资本开支削减、地缘反复和高估值消化保持警惕。\n以上为市场观点梳理，不构成投资建议。参考了网络意见。并非全部原创。","en":"10月去杠杆的余震与11月的机会窗口：中性偏多地看AI资本开支交易\n10月对很多投资者来说是一次残酷的压力测试。摩根士丹利的数据显示，最近一轮对冲基金去杠杆化是过去10年最高，强度超过了2016年中国股市崩盘、2018年“波动地狱”、2020年3月COVID崩盘、2021年Archegos/恒大危机以及2022年熊市。高盛主经纪业务部门在26日报告称，两周内观察到约200亿美元抛售，而7月整个去杠杆期间约为230亿美元。换句话说，10月的抛售在极短时间内集中释放，情绪和仓位都经历了剧烈出清。\n与此同时，空头力量明显抬头。根据HOOD空头持仓数据，从9月到10月，多只股票的空头浮动比率显著上升：AAOI从12.5%升至19.84%以上，AEVA从11%升至25.64%以上，CBRS从12.25%升至20.12%以上，AEHR从14.33%升至17.93%以上，TSEM 操作，进一步增加参与机构数量，适当降低互换费率等。股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率由1.25%降至1%。","en":"中国央行、金融监管总局、证监会今日召开支持资本市场两项工具座谈会。会议提出，适时开展证券、基金、保险公司互换便利操作，进一步增加参与机构数量，适当降低互换费率等。股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率由1.25%降至1%。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWHntt5bAAA2-Pg.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2117228088987992428","l":[],"ln":[],"t":[],"lk":10,"rt":0,"rp":2,"vw":3849},{"id":"2117227608433893848","h":"RFI_Cn","ts":1793621372,"zh":"中国经济：独立指数显示制造业活动连续11个月扩张 rfi.​my/DBZL","en":"中国经济：独立指数显示制造业活动连续11个月扩张 rfi.​my/DBZL","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWHnSlXawAARqyv.jpg?name=orig"],"u":"https://x.com/RFI_Cn/status/2117227608433893848","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":1137},{"id":"2117226870060302611","h":"dmjk001","ts":1793621196,"zh":"20:04:57【央行：股票回购增持再贷款政策由阶段性安排转为长期制度性安排 再贷款利率由1.25%降至1%】财联社11月2日电，中国人民银行、金融监管总局、中国证监会召开支持资本市场两项工具座谈会，会议提出，为维护资本市场稳定，提升市场韧性和信心，中国人民银行、金融监管总局、中国证监会将继续加强政策支持，进一步优化政策要素和实施细则，激励金融机构用好用足政策工具。适时开展证券、基金、保险公司互换便利操作，进一步增加参与机构数量，适当降低互换费率，优化质押和操作模式。股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率由1.25%降至1%；金融机构坚持市场化定价原则，在再贷款利率基础上合理加点并增加贷款投放。","en":"20:04:57【央行：股票回购增持再贷款政策由阶段性安排转为长期制度性安排 再贷款利率由1.25%降至1%】财联社11月2日电，中国人民银行、金融监管总局、中国证监会召开支持资本市场两项工具座谈会，会议提出，为维护资本市场稳定，提升市场韧性和信心，中国人民银行、金融监管总局、中国证监会将继续加强政策支持，进一步优化政策要素和实施细则，激励金融机构用好用足政策工具。适时开展证券、基金、保险公司互换便利操作，进一步增加参与机构数量，适当降低互换费率，优化质押和操作模式。股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率由1.25%降至1%；金融机构坚持市场化定价原则，在再贷款利率基础上合理加点并增加贷款投放。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117226870060302611","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2117226242785349710","h":"dmjk001","ts":1793621047,"zh":"20:02:19【中国人民银行 金融监管总局 中国证监会召开支持资本市场两项工具座谈会】财联社11月2日电，中国人民银行会同金融监管总局、中国证监会等部门先后召开证券、基金、保险公司互换便利座谈会和股票回购增持再贷款座谈会，听取金融机构业务进展及意见建议，研究部署用好用足政策工具有关工作，支持资本市场健康稳定发展。中国人民银行副行长邹澜，金融监管总局副局长丛林，中国证监会副主席刘浩凌出席会议并讲话。\n会议认为，支持资本市场两项工具自2024年10月推出以来，证券、基金、保险公司互换便利已多次展期，目前余额为1050亿元，充分发挥了行业机构的专业投资能力和带动效应；政策支持下，股票回购增持贷款签约金额约4400亿元，累计发放量超2800亿元，满足上市公司市值管理的融资需求。两项工具的市场内在稳定机制作用逐步显现，行业机构稳市和上市公司市值管理的意识、能力持续提升。\n会议提出，为维护资本市场稳定，提升市场韧性和信心，中国人民银行、金融监管总局、中国证监会将继续加强政策支持，进一步优化政策要素和实施细则，激励金融机构用好用足政策工具。适时开展证券、基金、保险公司互换便利操作，进一步增加参与机构数量，适当降低互换费率，优化质押和操作模式。股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率由1.25%降至1%；金融机构坚持市场化定价原则，在再贷款利率基础上合理加点并增加贷款投放。\n23家证券和基金公司、26家银行参会，中金公司、国泰海通证券、中信证券、易方达基金，以及工商银行、建设银行、中信银行、兴业银行等机构代表发言。中国人民银行、金融监管总局、中国证监会、国务院国资委有关司局负责同志参会。","en":"20:02:19【中国人民银行 金融监管总局 中国证监会召开支持资本市场两项工具座谈会】财联社11月2日电，中国人民银行会同金融监管总局、中国证监会等部门先后召开证券、基金、保险公司互换便利座谈会和股票回购增持再贷款座谈会，听取金融机构业务进展及意见建议，研究部署用好用足政策工具有关工作，支持资本市场健康稳定发展。中国人民银行副行长邹澜，金融监管总局副局长丛林，中国证监会副主席刘浩凌出席会议并讲话。\n会议认为，支持资本市场两项工具自2024年10月推出以来，证券、基金、保险公司互换便利已多次展期，目前余额为1050亿元，充分发挥了行业机构的专业投资能力和带动效应；政策支持下，股票回购增持贷款签约金额约4400亿元，累计发放量超2800亿元，满足上市公司市值管理的融资需求。两项工具的市场内在稳定机制作用逐步显现，行业机构稳市和上市公司市值管理的意识、能力持续提升。\n会议提出，为维护资本市场稳定，提升市场韧性和信心，中国人民银行、金融监管总局、中国证监会将继续加强政策支持，进一步优化政策要素和实施细则，激励金融机构用好用足政策工具。适时开展证券、基金、保险公司互换便利操作，进一步增加参与机构数量，适当降低互换费率，优化质押和操作模式。股票回购增持再贷款政策由阶段性安排转为长期制度性安排，再贷款利率由1.25%降至1%；金融机构坚持市场化定价原则，在再贷款利率基础上合理加点并增加贷款投放。\n23家证券和基金公司、26家银行参会，中金公司、国泰海通证券、中信证券、易方达基金，以及工商银行、建设银行、中信银行、兴业银行等机构代表发言。中国人民银行、金融监管总局、中国证监会、国务院国资委有关司局负责同志参会。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117226242785349710","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":346},{"id":"2117225627854176595","h":"cnfinancewatch","ts":1793620900,"zh":"小鱼儿财经经常有很深刻的见解。\n这是一个很深刻的认知模型。\n多数人看不懂这个世界的三股力量。\n看不到自己的位置。\n一会儿禁欲一会儿纵欲，被政治折磨，几头不讨好又下不了决心。\n一生把以上各种拿捏。","en":"小鱼儿财经经常有很深刻的见解。\n这是一个很深刻的认知模型。\n多数人看不懂这个世界的三股力量。\n看不到自己的位置。\n一会儿禁欲一会儿纵欲，被政治折磨，几头不讨好又下不了决心。\n一生把以上各种拿捏。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117225627854176595","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":405},{"id":"2117225012407173486","h":"cnfinancewatch","ts":1793620753,"zh":"是的。我们调研了几家。感觉一年内会放量。","en":"是的。我们调研了几家。感觉一年内会放量。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117225012407173486","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":588},{"id":"2117222014343680397","h":"SCMPNew ,{"id":"2117191067179385006","h":"dmjk001","ts":1793612660,"zh":"《关于第三次互换便利（SFISF）启动招标》的解读\n[烟花] 央行这次SFISF招标，不是直接印钱买股票，而是给券商、基金、保险开了一条更顺畅的融资通道。机构把手里流动性偏弱的股票ETF、沪深300成分股、债券等资产抵押给央行，换回国债、央票这类高等级资产，再去银行间市场质押融资，最后把资金投向股票、股票ETF和做市。\n平时市场波动大的时候，机构手里虽然有股票、ETF，但拿去融资并不方便，质押折扣也可能较低。SFISF相当于先把这些“不太好借钱”的资产，换成“更好借钱”的国债/央票，再让机构获得资金继续配置权益资产。资金用途有明确限制，只能用于资本市场投资，不能随意挪作他用。\n[烟花] 这次招标有什么新变化？\n央行将于11月3日启动第三次SFISF操作招标，前期已有超过30家机构表达申报意向，申报家数和意向额度均高于前两批。前两次操作分别为500亿元和550亿元，合计1050亿元，首期额度框架为5000亿元。本次参与范围进一步扩大，互换费率也有望维持低位甚至继续下调，监管也要求机构“报足、做实”，尽快把资金投向市场。\n[烟花] 对市场的实质影响怎么看？\n短期： 有助于提振市场信心，缓解非银机构在波动中的流动性压力。\n中期： 如果机构持续使用，会形成一笔可循环的权益市场增量资金，降低大跌时的被动卖出压力。\n结构上： 资金主要流向股票、股票ETF和做市，更可能利好流动性较好的权重板块、宽基ETF和高股息资产；中小盘不一定直接受益。\n长期： 它更像资本市场的“稳定器”，不是单靠它就能制造持续大牛市的“发动机”。后续仍需跟踪企业盈利、科技与周期板块景气度、AI产业链兑现、外资流向和宏观政策组合。\n[烟花] 后续重点观察：\n1、第三次招标实际中标规模；\n2、互换费率是否继续下降；\n3、机构融资后资金实际投向哪些板块；\n4、是否进一步扩围至更多券商、基金、保险机构。\nSFISF对A股是“托底+改善流动性”的工具，能降低极端下跌时的脆弱性，但不宜简单理解成“央行直接给股市发钱”。真正值得跟踪的是机构申报规模、费率变化和资金最终流向。\n（数据截至2026年11月2日，仅供参考。非营销材料，仅供合作机构及特定私募合格投资人内部交流，不构成投资建议。相关数据请以托管复核发布为准）","en":"《关于第三次互换便利（SFISF）启动招标》的解读\n[烟花] 央行这次SFISF招标，不是直接印钱买股票，而是给券商、基金、保险开了一条更顺畅的融资通道。机构把手里流动性偏弱的股票ETF、沪深300成分股、债券等资产抵押给央行，换回国债、央票这类高等级资产，再去银行间市场质押融资，最后把资金投向股票、股票ETF和做市。\n平时市场波动大的时候，机构手里虽然有股票、ETF，但拿去融资并不方便，质押折扣也可能较低。SFISF相当于先把这些“不太好借钱”的资产，换成“更好借钱”的国债/央票，再让机构获得资金继续配置权益资产。资金用途有明确限制，只能用于资本市场投资，不能随意挪作他用。\n[烟花] 这次招标有什么新变化？\n央行将于11月3日启动第三次SFISF操作招标，前期已有超过30家机构表达申报意向，申报家数和意向额度均高于前两批。前两次操作分别为500亿元和550亿元，合计1050亿元，首期额度框架为5000亿元。本次参与范围进一步扩大，互换费率也有望维持低位甚至继续下调，监管也要求机构“报足、做实”，尽快把资金投向市场。\n[烟花] 对市场的实质影响怎么看？\n短期： 有助于提振市场信心，缓解非银机构在波动中的流动性压力。\n中期： 如果机构持续使用，会形成一笔可循环的权益市场增量资金，降低大跌时的被动卖出压力。\n结构上： 资金主要流向股票、股票ETF和做市，更可能利好流动性较好的权重板块、宽基ETF和高股息资产；中小盘不一定直接受益。\n长期： 它更像资本市场的“稳定器”，不是单靠它就能制造持续大牛市的“发动机”。后续仍需跟踪企业盈利、科技与周期板块景气度、AI产业链兑现、外资流向和宏观政策组合。\n[烟花] 后续重点观察：\n1、第三次招标实际中标规模；\n2、互换费率是否继续下降；\n3、机构融资后资金实际投向哪些板块；\n4、是否进一步扩围至更多券商、基金、保险机构。\nSFISF对A股是“托底+改善流动性”的工具，能降低极端下跌时的脆弱性，但不宜简单理解成“央行直接给股市发钱”。真正值得跟踪的是机构申报规模、费率变化和资金最终流向。\n（数据截至2026年11月2日，仅供参考。非营销材料，仅供合作机构及特定私募合格投资人内部交流，不构成投资建议。相关数据请以托管复核发布为准）"," 93602488,"zh":"当献血者碰到“吸血鬼” 🧛🏻‍♀️\n在泰国曼谷，献血者们遭遇了一场万圣节“惊魂”。泰国红十字会工作人员周六装扮成万圣节主题人物，这使得献血者人数比普通周末增加一倍以上。","en":"当献血者碰到“吸血鬼” 🧛🏻‍♀️\n在泰国曼谷，献血者们遭遇了一场万圣节“惊魂”。泰国红十字会工作人员周六装扮成万圣节主题人物，这使得献血者人数比普通周末增加一倍以上。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2117147805949325312/vid/avc1/1080x1920/cmEEZmh04zlnLwW_.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2117148400609271985","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":2,"vw":3862},{"id":"2117147416332009651","h":"cnfinancewatch","ts":1793602253,"zh":"#A股盘中分析（2026年11月2日 14:30）\n## 一、盘面速览\n**指数全线飘红，成长风格显著占优。** 截至14:30，上证指数报3632.92点（+0.94%），深证成指11034.11点（+1.85%），创业板指2467.8点（+2.24%），科创50报1198.33点（+3.23%）领涨全场，中证A500报4844.0点（+1.06%），沪深300报4014.79点（+0.73%）。指数呈现\"科创>创业板>深成指>上证>沪深300\"的清晰梯度，说明资金今日明显偏向科技成长与中小盘，权重蓝筹相对滞涨。\n**个股分化剧烈，龙头与权重背离。** 活跃个股中，中信证券大涨5.31%领跑权重，贵州茅台+3.57%、宁德时代+3.14%、比亚迪+2.99%、中芯国际+2.43%同步走强；但招商银行-1.70%、紫金矿业-3.51%、美的集团-1.63%、平安银行-1.12%走弱。**\"科技+消费龙头强、银行+资源弱\"** 的格局清晰，紫金矿业大跌与中信证券研报\"原油易涨难跌\"的资源逻辑形成短期背离，需警惕资源股高位分歧。\n**涨跌判断：** 指数层面偏多，但结构上呈现\"高低切换\"特征——前期强势的银行、资源回调，资金回流科技制造与消费龙头。东财人气榜中芒果超媒+20.00%、银之杰+20.02%、襄阳轴承+10.01%等多股涨停，题材活跃度高，市场情绪偏暖。\n## 二、板块实时\n**资金流向特征：科技制造吸金，金融资源承压。** 从活跃个股看，半导体（中芯国际+2.43%）、新能源（宁德时代+3.14%、比亚迪+2.99%）、券商（中信证券+5.31%）构成今日三大吸金方向；银行（招商银行、平安银行）与资源（紫金矿业）资金流出明显。\n**热点板块：** ①**券商板块**——中信证券+5.31%领涨，与中信证券研报\"11月以进攻思路寻找结构性机会\"形成呼应；②**半导体/科创**——科创50+3.23%，中芯国际+2.43%，呼应中信证券\"半导体硬件为首要方向\"；③**消费龙头**——茅台+3.57%，与中信证券\"消费板块左侧配置价值\"研报共振；④**机器人/传媒题材**——东财人气榜宇树科技-W、芒果超媒（+20%）活跃，韭研公社广发机械\"看好机器人行情持续性\"帖文印证。\n## 三、热点追踪\n**韭研公社盘中热点：** ①11:46\"流感季提前确认\"帖，一品红、特一药业相关，医药主题活跃；②11:27\"智元+上纬新材核心供应商\"帖，东方电热（机器人散热）受关注；③广发机械周度观点\"看好机器人行情持续性，关注船舶海工\"；④午盘涨停简图显示题材轮动活跃。**财联社数据未在本次抓取范围内，相关盘中快讯数据不足，以韭研公社及东财人气榜替代观察。**","en":"#A股盘中分析（2026年11月2日 14:30）\n## 一、盘面速览\n**指数全线飘红，成长风格显著占优。** 截至14:30，上证指数报3632.92点（+0.94%），深证成指11034.11点（+1.85%），创业板指2467.8点（+2.24%），科创50报1198.33点（+3.23%）领涨全场，中证A500报4844.0点（+1.06%），沪深300报4014.79点（+0.73%）。指数呈现\"科创>创业板>深成指>上证>沪深300\"的清晰梯度，说明资金今日明显偏向科技成长与中小盘，权重蓝筹相对滞涨。\n**个股分化剧烈，龙头与权重背离。** 活跃个股中，中信证券大 "h":"cnfinancewatch","ts":1793598928,"zh":"说个技术（今日可观测美股A股是否出现）：\n单阳测顶\n是一种通过观察股票阶段性底部的大阳线来预测行情高点的技术分析方法。其核心公式为\na=c*c/c1/0.9，\n其中c为大阳线收盘价，c1为前一日收盘价，a为预测的高点位置。该方法基于\"压抑后的爆发\"原理，即长期下跌后多方反击的力度决定了反弹高度。\n通常需满足两个条件：\n大阳线出现在阶段性底部，且单日涨幅超过2%。\n例如2022年4月27日上证指数大阳线预测高点3368点，实际最高点3400点。\n需注意该方法仅提供参考区间，需结合量能、结构等其他指标综合判断。","en":"说个技术（今日可观测美股A股是否出现）：\n单阳测顶\n是一种通过观察股票阶段性底部的大阳线来预测行情高点的技术分析方法。其核心公式为\na=c*c/c1/0.9，\n其中c为大阳线收盘价，c1为前一日收盘价，a为预测的高点位置。该方法基于\"压抑后的爆发\"原理，即长期下跌后多方反击的力度决定了反弹高度。\n通常需满足两个条件：\n大阳线出现在阶段性底部，且单日涨幅超过2%。\n例如2022年4月27日上证指数大阳线预测高点3368点，实际最高点3400点。\n需注意该方法仅提供参考区间，需结合量能、结构等其他指标综合判断。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117133469298094451","l":[],"ln":[],"t":["美股","A股港股"],"lk":0,"rt":0,"rp":0,"vw":441},{"id":"2117132434362044632","h":"dmjk001","ts":1793598681,"zh":"13:50【金融科技ETF午后批量涨停 多只创业板金融科技ETF涨超10%】财联社11月2日电，午后金融科技相关ETF持续走高，金融科技ETF华宝（159851）、金融科技ETF博时（516860）、金融科技ETF易方达（159299）、金融科技ETF汇添富（159103）等纷纷涨停，创业板金融科技ETF华泰柏瑞（158058）、创业板金融科技ETF景顺（158052）等涨超10%。","en":"13:50【金融科技ETF午后批量涨停 多只创业板金融科技ETF涨超10%】财联社11月2日电，午后金融科技相关ETF持续走高，金融科技ETF华宝（159851）、金融科技ETF博时（516860）、金融科技ETF易方达（159299）、金融科技ETF汇添富（159103）等纷纷涨停，创业板金融科技ETF华泰柏瑞（158058）、创业板金融科技ETF景顺（158052）等涨超10%。","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/dmjk001/status/2117132434362044632","l":[],"ln":[],"t":["A股港股"],"lk":1,"rt":0,"rp":0,"vw":846},{"id":"2117131000585023651","h":"SCMPNews","ts":1793598339,"zh":"韩国如何能在菲律宾军事升级行动中发挥核心作用","en":"How South Korea can play central role in Philippines’ military upgrading drive","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2117131000585023651","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/week-asia/politics/article/3372945/how-south-korea-can-play-pivotal-role-philippines-military-modernisation-drive?utm_medium=Social&utm_source=Twitter#Echobox=1793598339","d":"scmp.com"}],"t":[],"lk":1,"rt":1,"rp":0,"vw":1149},{"id":"2117130055705088088","h":"cnfinancewatch","ts":1793598114,"zh":"目前银行跟大盘可以作为对冲板块来用","en":"目前银行跟大盘可以作为对冲板块来用","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117130055705088088","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":1315},{"id":"2117126487442882921","h":"dmjk001","ts":1793597263,"zh":"这种时候，政策小作文特别多，真真假假难辨，谨慎参考","en":"这种时候，政策小作文特别多，真真假假难辨，谨慎参考","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117126487442882921","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":682},{"id":"2117126286120509796","h":"dmjk001","ts":1793597215,"zh":"转（出处未知）：\n会议核心定位：不是推出全新救市工具，而是把已经存在的两大央行存量工具，解决落地卡点、提升使用率；一共分两场会。证金公司没有参会，不是本次会议执行主体。\n第一场：央行+证监会，召集券商、公募基金（上午）\n核心议题：证券、基金、保险公司互换便利（SF­I­SF，5000亿）优化\n1. 讨论现存痛点：目前工具申请门槛、抵押品范围、审批流程、费率问题，很多机构申请意愿不强，额度使用不足。\n2. 可能讨论优化方向：\n- 放宽抵押标的范围，简化内部审批手续\n- 降低互换费率，提升券商、公募用这个工具加仓、做市的动力\n- 扩大符合资格的机构名单，不止局限少数头部机构\n- 明确资金用途，只能用于股票、ETF投资，防止资金外流\n3. 附带配套议题（次要）：公募基金的流动性应急机制，防范集中赎回带来的被动抛售踩踏；讨论权益类基金产品发行提速，引导资金入市。\n关于量化：不属于本次会议主线\n券商、公募代表可以口头提出建议，讨论程序化交易顺周期卖出放大波动的问题；但不会在本次会议讨论一刀切限制量化规模、停止量化产品发行。最多只是讨论加强对程序化交易监控、下跌环境约束自动止损这类行为监管。\n第二场：央行+金融监管总局+证监会，召集各大银行（同日）\n核心议题：股票回购增持再贷款（3000亿）优化\n1. 当前卡点：银行顾虑风险，放贷意愿偏弱，很多上市公司大股东想借钱回购增持，但银行审批慢、门槛高。\n2. 可能讨论优化方向：\n- 简化银行审批流程、降低对上市公司/大股东准入门槛\n- 优化风险分担机制，打消银行坏账顾虑，鼓励银行放款\n- 落实专款专用，资金只能用于回购、增持股票，封闭运行。\n不在本次会议重点的内容\n1. 不讨论证金公司直接下场买股票，不讨论证金加码转融资（证金未受邀参会）；\n2. 不会新增全新大规模救市工具；\n3. 不会出台直接限制量化基金总规模的重磅新政。\n利好强度排序\n1. 最大利好：SF­I­SF互换便利降低门槛、扩大抵押品范围，让机构低成本拿到资金买股票；\n2. 次一级利好：回购增持再贷款优化，降低产业资本增持的融资成本，带动上市公司回购；\n3. 偏长期利好：基金流动性保护，防止赎回踩踏；\n4. 微弱预期：口头探讨程序化交易（量化）的顺周期风险，属于现有监管延续，短期力度有限。\n一句话总括\n今天会议重心是盘活已经存在的8000亿两大央行工具，打通机构、银行的落地堵点，提高资金实际投放量，而不是出新大招。会上可以顺带聊量化交易波动风险，但不会直接出台限制量化规模的政策。","en":"转（出处未知）：\n会议核心定位：不是推出全新救市工具，而是把已经存在的两大央行存量工具，解决落地卡点、提升使用率；一共分两场会。证金公司没有参会，不是本次会议执行主体。\n第一场：央行+证监会，召集券商、公募基金（上午）\n核心议题：证券、基金、保险公司互换便利（SF­I­SF，5000亿）优化\n1. 讨论现存痛点：目前工具申请门槛、抵押品范围、审批流程、费率问题，很多机构申请意愿不强，额度使用不足。\n2. 可能讨论优化方向：\n- 放宽抵押标的范围，简化内部审批手续\n- 降低互换费率，提升券商、公募用这个工具加仓、做市的动力\n- 扩大符合资格的机构名单，不止局限少数头部机构\n- 明确资金用途，只能用于股票、ETF投资，防止资金外流\n3. 附带配套议题（次要）：公募基金的流动性应急机制，防范集中赎回带来的被动抛售踩踏；讨论权益类基金产品发行提速，引导资金入市。\n关于量化：不属于本次会议主线\n券商、公募代表可以口头提出建议，讨论程序化交易顺周期卖出放大波动的问题；但不会在本次会议讨论一刀切限制量化规模、停止量化产品发行。最多只是讨论加强对程序化交易监控、下跌环境约束自动止损这类行为监管。\n第二场：央行+金融监管总局+证监会，召集各大银行（同日）\n核心议题：股票回购增持再贷款（3000亿）优化\n1. 当前卡点：银行顾虑风险，放贷意愿偏弱，很多上市公司大股东想借钱回购增持，但银行审批慢、门槛高。\n2. 可能讨论优化方向：\n- 简化银行审批流程、降低对上市公司/大股东准入门槛\n- 优化风险分担机制，打消银行坏账顾虑，鼓励银行放款\n- 落实专款专用，资金只能用于回购、增持股票，封闭运行。\n不在本次会议重点的内容\n1. 不讨论证金公司直接下场买股票，不讨论证金加码转融资（证金未受邀参会）；\n2. 不会新增全新大规模救市工具；\n3. 不会出台直接限制量化基金总规模的重磅新政。\n利好强度排序\n1. 最大利好：SF­I­SF互换便利降低门槛、扩大抵押品范围，让机构低成本拿到资金买股票；\n2. 次一级利好：回购增持再贷款优化，降低产业资本增持的融资成本，带动上市公司回购；\n3. 偏长期利好：基金流动性保护，防止赎回踩踏；\n4. 微弱预期：口头探讨程序化交易（量化）的顺周期风险，属于现有监管延续，短期力度有限。\n一句话总括\n今天会议重心是盘活已经存在的8000亿两大央行工具，打通机构、银行的落地堵点，提高资金实际投放量，而不是出新大招。会上可以顺带聊量化交易波动风险，但不会直接出台限制量化规模的政策。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2117126286120509796","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":882},{"id":"2117119623367680211","h":"ReutersChina","ts":1793595627,"zh":"中国国家主席习近平周一对阿曼苏丹表示，中国视与阿曼扩大和深化关系为两国的“共同战略选择”。","en":"China sees expanding and deepening ties with Oman as a \"shared strategic choice\" for both countries, Chinese President Xi Jinping told the Sultan of Oman on Monday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2117119623367680211","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/deeper-china-oman-ties-strategic-both-sides-xi-says-2026-11-02/?taid=6ae818ea25edfb000178502a&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":345},{"id":"2117119535937413415","h":"bbcchinese","ts":1793595606,"zh":"根据11月生效的规定，爱彼迎（Airbnb）房东不得再要求房客清洗餐具或倒垃圾。","en":"根据11月生效的规定，爱彼迎（Airbnb）房东不得再要求房客清洗餐具或倒垃圾。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2117119535937413415","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4AbZpQt","d":"bbc.in"}],"t":[],"lk":0,"rt":1,"rp":2,"vw":1388},{"id":"2117115530272198697","h":"SCMPNews","ts":1793594651,"zh":"马来西亚警方调查吉隆坡购物中心一段父亲掌掴女子的病毒视频","en":"Malaysian police probe viral video of father sl ?taid=6ae7f5bd1d3fbb0001703e49&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":581},{"id":"2117080747399930051","h":"SCMPNews","ts":1793586358,"zh":"在韩国，李的海外旅行引发关于总统特权的熟悉争议","en":"In South Korea, Lee’s overseas trips fuel familiar spat over presidential perks","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2117080747399930051","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/asia/east-asia/article/3372915/south-korea-lees-overseas-trips-fuel-familiar-battle-over-presidential-perks?utm_medium=Social&utm_source=Twitter#Echobox=1793586355","d":"scmp.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":687},{"id":"2117080703640977849","h":"nytchinese","ts":1793586347,"zh":"中国前副总理刘延东去世。刘延东是迄今为止中共中央政治局仅有过的六位女性之一，但其职业生涯也凸显了中国统治精英阶层中女性所面临的局限。她于上周三在北京逝世，享年80岁。","en":"中国前副总理刘延东去世。刘延东是迄今为止中共中央政治局仅有过的六位女性之一，但其职业生涯也凸显了中国统治精英阶层中女性所面临的局限。她于上周三在北京逝世，享年80岁。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2117080703640977849","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/obits/20261102/liu-yandong-dead/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":3,"rt":0,"rp":1,"vw":651},{"id":"2117074986724897237","h":"cnfinancewatch","ts":1793584984,"zh":"南非陨落启示：高等文明的温柔，从来抵不过野蛮的激进\n人类近代史上，最魔幻的国运反差，莫过于南非。\n三十多年前，它是非洲唯一的工业强国。在全球全面武器禁运、美苏双重封锁的绝境下，南非靠自主技术，研发出独创的铀提纯工艺，造出6枚可实战空投的原子弹，打磨出可改造成洲际导弹的RSA-3运载火箭，集齐了核威慑、航天侦察、高端军工的完整硬核体系，是南半球当之无愧的技术霸主。\n三十多年后，曾经能造核弹火箭的国家，连基础民生都难以维系。全国常态化大停电、市政管网瘫痪停水、铁路电缆频频被盗、工业体系彻底萎缩。从顶尖核武航天强国，跌落到发展中国家末流，断崖式崩塌的背后，从不是资源与技术的流失，而是文明维度的致命冲突。\n南非的巅峰，是欧洲基督教理性文明的产物。白人治理时代，承袭西式契约精神、工业逻辑、规则秩序与极致理性。这套高等文明体系，擅长深耕精密工业、搭建制度框架、突破科技壁垒，造就了南非逆天的硬核国力。但这种文明有一个致命短板：高度文明必然伴随包容、克制、温和与守序，自带柔性与妥协性。\n这是所有高阶文明的共性：追求秩序、崇尚理性、信奉规则、厌恶极端冲突。可在更低阶、更原始的族群文化面前，这份温柔与克制，会直接沦为软弱。\n非洲本土原生文化，带着原始族群的生存本能，重掠夺、轻建设、重私利、轻规则，缺乏长期制度建设与工业沉淀的耐心。当讲究契约、深耕积累的西式高等文明，对上随性野蛮、逐利短视的原生族群文化，前者的理性守序毫无招架之力。\n高等文明擅长建设，野蛮文明擅长破坏。建一座核工厂、打磨一套航天技术需要数十年深耕；毁掉百年工业体系、掏空国家基建，只需短短数年。西式文明搭建的精密工业秩序，无法约束原生文明的无序掠夺，最终层层崩塌，造就了南非如今的残局。\n纵观历史，这种文明降维碾压的悲剧，从未停止。\n千年大宋，是华夏文明的巅峰。经济繁荣、文化璀璨、制度完善、人文昌盛，儒学教化下的宋人，理性、温和、重礼、守序，文明进化程度冠绝当世。可就是这样顶级的高等文明，在崇尚掠夺、骁勇好战、不讲规则的北方游牧野蛮族群面前，节节溃败。\n宋的软肋和今日南非如出一辙：文明越高，底线越高、顾虑越多、妥协越多；野性越强，底线越低、手段越狠、掠夺越烈。文明负责创造财富，野蛮负责抢夺成果，前者负重前行，后者坐享其成，胜负从一开始就注定。\n把视角拉到当下全球格局，一场无声的文明博弈正在上演。\n曾经强势扩张的基督教文明，如今在欧美全面软化：白左思潮泛滥、过度包容、去军事化、放弃博弈、追求安逸，丧失了曾经的铁血进取性。\n传承千年的儒教文明，在日韩、港台乃至内地，也逐渐褪去刚硬风骨，变得温和内敛、极致守序、包容退让。\n两大人类顶级高等文明，双双陷入“文明温柔病”：重规则、轻杀伐，重包容、轻制衡，重发展、轻掠夺。\n反观当下崛起的诸多新兴势力，大多保留着原始的野性竞争逻辑：不讲过多规则、不惧舆论束缚、擅长极限博弈、敢于打破秩序。\n这就是全球格局最残酷的真相：文明的进步，必然伴随性格的软化；野蛮的留存，必然自带扩张的攻击性。\n高等文明负责创造繁荣，野蛮力量负责重塑格局。温柔守序的文明，永远玩不过无底线的激进野性。\n南非的陨落、大宋的覆灭、当下全球文明的强弱置换，最终都指向同一个历史铁律：文明的高度，从来不等同于博弈的强度。所有高阶文明的衰落，从来不是输在创造能力，而是输在过于温柔的善良与克制。\n用以上观点看伊美和俄乌战争，谁赢谁输？光脚的不怕穿鞋的，后者赢不了，赢了也算输。","en":"南非陨落启示：高等文明的温柔，从来抵不过野蛮的激进\n人类近代史上，最魔幻的国运反差，莫过于南非。\n三十多年前，它是非洲唯一的工业强国。在全球全面武器禁运、美苏双重封锁的绝境下，南非靠自主技术，研发出独创的铀提纯工艺，造出6枚可实战空投的原子弹，打磨出可改造成洲际导弹的RSA-3运载火箭，集齐了核威慑、航天侦察、高端军工的完整硬核体系，是南半球当之无愧的技术霸主。\n三十多年后，曾经能造核弹火箭的国家，连基础民生都难以维系。全国常态化大停电、市政管网瘫痪停水、铁路电缆频频被盗、工业体系彻底萎缩。从顶尖核武航天强国，跌落到发展中国家末流，断崖式崩塌的背后，从不是资源与技术的流失，而是文明维度的致命冲突。\n南非的巅峰，是欧洲基督教理性文明的产物。白人治理时代，承袭西式契约精神、工业逻辑、规则秩序与极致理性。这套高等文明体系，擅长深耕精密工业、搭建制度框架、突破科技壁垒，造就了南非逆天的硬核国力。但这种文明有一个致命短板：高度文明必然伴随包容、克制、温和与守序，自带柔性与妥协性。\n这是所有高阶文明的共性：追求秩序、崇尚理性、信奉规则、厌恶极端冲突。可在更低阶、更原始的族群文化面前，这份温柔与克制，会直接沦为软弱。\n非洲本土原生文化，带着原始族群的生存本能，重掠夺、轻建设、重私利、轻规则，缺乏长期制度建设与工业沉淀的耐心。当讲究契约、深耕积累的西式高等文明，对上随性野蛮、逐利短视的原生族群文化，前者的理性守序毫无招架之力。\n高等文明擅长建设，野蛮文明擅长破坏。建一座核工厂、打磨一套航天技术需要数十年深耕；毁掉百年工业体系、掏空国家基建，只需短短数年。西式文明搭建的精密工业秩序，无法约束原生文明的无序掠夺，最终层层崩塌，造就了南非如今的残局。\n纵观历史，这种文明降维碾压的悲剧，从未停止。\n千年大宋，是华夏文明的巅峰。经济繁荣、文化璀璨、制度完善、人文昌盛，儒学教化下的宋人，理性、温和、重礼、守序，文明进化程度冠绝当世。可就是这样顶级的高等文明，在崇尚掠夺、骁勇好战、不讲规则的北方游牧野蛮族群面前，节节溃败。\n宋的软肋和今日南非如出一辙：文明越高，底线越高、顾虑越多、妥协越多；野性越强，底线越低、手段越狠、掠夺越烈。文明负责创造财富，野蛮负责抢夺成果，前者负重前行，后者坐享其成，胜负从一开始就注定。\n把视角拉到当下全球格局，一场无声的文明博弈正在上演。\n曾经强势扩张的基督教文明，如今在欧美全面软化：白左思潮泛滥、过度包容、去军事化、放弃博弈、追求安逸，丧失了曾经的铁血进取性。\n传承千年的儒教文明，在日韩、港台乃至内地，也逐渐褪去刚硬风骨，变得温和内敛、极致守序、包容退让。\n两大人类顶级高等文明，双双陷入“文明温柔病”：重规则、轻杀伐，重包容、轻制衡，重发展、轻掠夺。\n反观当下崛起的诸多新兴势力，大多保留着原始的野性竞争逻辑：不讲过多规则、不惧舆论束缚、擅长极限博弈、敢于打破秩序。\n这就是全 ewatch","ts":1793582870,"zh":"上海仪电(集团)有限公司公告，本公司拟分别向上海国盛(集团)有限公司、上海国茂控股有限公司转让所持有\n华鑫股份22.00%和4.99%的股份。\n本次股份转让前，本公司直接持有华鑫股份34.12%的股份，并通过本公司全资子公司华鑫置业(集团)有限公司持有华鑫股份13.15%的股份，合计持股比例为47.27%。本次股份转让完成后，本公司合计持有华鑫股份20.28%的股份。华鑫股份的控股股东将由本公司变更为国盛集团，实际控制人保持不变，仍为上海市国有资产监督管理委员会。截至本公告披露日，上述子公司股权转让事项已经本公司董事会审议通过，本公司与国盛集团、国茂控股签署了《关于上海华鑫股份有限公司之股份转让框架协议》。正式股权转让协议尚未签署，相关工作正在推进中。","en":"上海仪电(集团)有限公司公告，本公司拟分别向上海国盛(集团)有限公司、上海国茂控股有限公司转让所持有\n华鑫股份22.00%和4.99%的股份。\n本次股份转让前，本公司直接持有华鑫股份34.12%的股份，并通过本公司全资子公司华鑫置业(集团)有限公司持有华鑫股份13.15%的股份，合计持股比例为47.27%。本次股份转让完成后，本公司合计持有华鑫股份20.28%的股份。华鑫股份的控股股东将由本公司变更为国盛集团，实际控制人保持不变，仍为上海市国有资产监督管理委员会。截至本公告披露日，上述子公司股权转让事项已经本公司董事会审议通过，本公司与国盛集团、国茂控股签署了《关于上海华鑫股份有限公司之股份转让框架协议》。正式股权转让协议尚未签署，相关工作正在推进中。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117066120490541064","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":618},{"id":"2117064340071485766","h":"cnfinancewatch","ts":1793582446,"zh":"FDA 批准了一种每日一次的眼药水，名叫 VIZZ，它能在约 30 分钟内去除近视，让视力保持清晰长达 10 小时。临床试验没有发现明显副作用。\n每只眼睛只要 1 滴，每天一次就可以了。","en":"FDA 批准了一种每日一次的眼药水，名叫 VIZZ，它能在约 30 分钟内去除近视，让视力保持清晰长达 10 小时。临床试验没有发现明显副作用。\n每只眼睛只要 1 滴，每天一次就可以了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117064340071485766","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":1007},{"id":"2117062987244822988","h":"cnfinancewatch","ts":1793582123,"zh":"AI硬件科技（铲子股）的涨跌已经因为机构集中度而变得影响大盘\n目前中美韩都是如此\n但情绪杀跌让人痛苦，未来回来时乐观又会支持股市上涨和AI科技的发展\n管住手。不买。但心理上不要悲观。","en":"AI硬件科技（铲子股）的涨跌已经因为机构集中度而变得影响大盘\n目前中美韩都是如此\n但情绪杀跌让人痛苦，未来回来时乐观又会支持股市上涨和AI科技的发展\n管住手。不买。但心理上不要悲观。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117062987244822988","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1063},{"id":"2117062343079456903","h":"fxtrader","ts":1793581970,"zh":"周一，日本存储芯片制造商铠侠控股的股价一度暴跌15%。\n铠侠上周五给出的谨慎业绩指引令投资者大失所望，再次引发市场对AI驱动的爆发式增长可能正在放缓的担忧。公司预计12月季度的营业利润为2万亿日元，低于分析师普遍预期的2.35万亿日元。该预测暗示，其业绩较9月季度的1.99万亿日元几乎没有增长。而在过去几个季度里，铠侠的营业利润一直保持着陡峭的增长态势。","en":"周一，日本存储芯片制造商铠侠控股的股价一度暴跌15%。\n铠侠上周五给出的谨慎业绩指引令投资者大失所望，再次引发市场对AI驱动的爆发式增长可能正在放缓的担忧。公司预计12月季度的营业利润为2万亿日元，低于分析师普遍预期的2.35万亿日元。该预测暗示，其业绩较9月季度的1.99万亿日元几乎没有增长。而在过去几个季度里，铠侠的营业利润一直保持着陡峭的增长态势。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWFQ-U3bkAAU5d9.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2117062343079456903","l":[],"ln":[],"t":["AI科技"],"lk":13,"rt":1,"rp":2,"vw":4151},{"id":"2117061901578612952","h":"baoshu88","ts":1793581865,"zh":"GPU价格见顶了，市场供需格局马上要变天了","en":"GPU价格见顶了，市场供需格局马上要变天了","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWFQkGxbAAEb9r0.jpg?name=orig","https://pbs.twimg.com/media/HWFQkpLagAEgq2I.jpg?name=orig"],"u":"https://x.com/baoshu88/status/2117061901578612952","l":[],"ln":[],"t":[],"lk":13,"rt":1,"rp":3,"vw":2125},{"id":"2117061560002867350","h":"cnfinancewatch","ts":1793581783,"zh":"市场最怕一致\n机构交易一致是暴跌甚至股灾的根源\nAI硬件的股灾就是如此\n买在分歧，卖在一致（六月中旬高度一致的买入，交易集中度打倒60%以上）\n迄今为止两轮暴跌还没出清这种一致（极致报团，现在依然占比50%以上）","en":"市场最怕一致\n机构交易一致是暴跌甚至股灾的根源\nAI硬件的股灾就是如此\n买在分歧，卖在一致（六月中旬高度一致的买入，交易集中度打倒60%以上）\n迄今为止两轮暴跌还没出清这种一致（极致报团，现在依然占比50%以上）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117061560002867350","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":83},{"id":"2117060255796678703","h":"cnfinancewatch","ts":1793581472,"zh":"做官家，就生活真的美吗？不见得。\n小民有时候更见快乐！","en":"做官家，就生活真的美吗？不见得。\n小民有时候更见快乐！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117060255796678703","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":581},{"id":"2117059568060830125","h":"cnfinancewatch","ts":1793581308,"zh":"弘一法师:\n终有一天你会知道，\n这世间什么都是假的，\n而你却认真了一辈子","en":"弘一法师:\n终有一天你会知道，\n这世间什么都是假的，\n而你却认真了一辈子","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117059568060830125","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":726},{"id":"2117054112097513847","h":"dmjk001","ts":1793580007,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HWFJekja8AAngBF.jpg?name=orig","https://pbs.twimg.com/media/HWFJfMvacAADhaw.jpg?name=o 股股指期货小幅高开，纳指期货涨0.36%。\n2、涉及标的：纳指、QQQ、A股科技成长。\n3、影响分析：对A股科技方向偏多，强度弱，属当日情绪影响，仅缓和恐慌。\n（九）美股科技股隔夜重挫\n1、事件：Yahoo与CNBC报道，隔夜纳指-2.86%、QQQ-3.47%、NVDA-4.22%，市场关注中期选举与AI资本开支。\n2、涉及标的：纳斯达克指数、半导体硬件、A股AI算力软件。\n3、影响分析：对A股半导体与AI算力方向偏空，强度强，属当日情绪影响。\n（十）美国原油基金20日领涨美股ETF\n1、事件：Seeking Alpha报道，油价在中东霍尔木兹袭击再起背景下于中期选举前回落，USO 20日+14.56%仍居美股去重榜首位。\n2、涉及标的：USO、XLE、XOP、A股油服链。\n3、影响分析：对A股能源油气方向偏多，强度中，属持续逻辑，但当日油价回落需观察。","en":"二、今日中美股市重要新闻事件\n（一）美联储12月加息概率升至72%\n1、事件：据CME美联储观察，财联社11月2日22:13:55报道，美联储12月加息25个基点概率为72%，维持不变概率28%。\n2、涉及标的：沪深300、创业板指、成长风格ETF。\n3、影响分析：对A股成长方向偏空，强度强，属持续逻辑，压制估值端。\n（二）央行与证监会将开两场会议优化稳市工具\n1、事件：Google新闻援引BigGo Finance报道，中国央行与证券监管机构11月2日召开两场会议，8000亿元稳市工具进一步优化。\n2、涉及标的：上证指数、券商板块、沪深300。\n3、影响分析：对A股整体偏多，强度中，属当日情绪影响，托底预期升温。\n（三）上市银行三季报收官息差企稳\n1、事件：财联社11月2日22:22:26报道，42家A股上市银行前三季度营收4.66万亿元同比+7.81%，归母净利1.75万亿元同比+3.78%。\n2、涉及标的：银行ETF华夏（sh515020）、成都银行（sh601838）、江苏银行（sh600919）。\n3、影响分析：对银行方向偏多，强度中，属持续逻辑，支撑红利底仓。\n（四）上市券商三季报逾六成营利双增\n1、事件：财联社11月2日22:23:40报道，41家上市券商前三季度营收4924.42亿元同比+19.16%，归母净利2065.74亿元同比+24.02%。\n2、涉及标的：券商板块、中信证券（sh600030）、东方财富（sz300059）。\n3、影响分析：对券商方向偏多，强度弱，属持续逻辑，但当日量能未起。\n（五）A股三季报AI算力与新能源动能向新\n1、事件：财联社11月2日22:36:45报道，AI算力产业链芯片、存储、光模块、PCB头部公司业绩爆发式增长，新能源板块结构性复苏。\n2、涉及标的：光模块、PCB、锂电材料相关ETF。\n3、影响分析：对AI算力与新能源方向偏多，强度中，属持续逻辑，但当日盘面未承接。\n（六）现货黄金突破3900美元\n1、事件：财联社11月2日23:06:47报道，现货黄金突破3900美元，日内上涨0.6%；现货白银报49.59美元/盎司涨1%。\n2、涉及标的：黄金ETF、山东黄金（sh600547）、中金黄金（sh600489）。\n3、影响分析：对贵金属方向偏多，强度中，属持续逻辑，但A股同主题未进去重榜前10。\n（七）布伦特原油期货跌幅扩大至1%\n1、事件：财联社11月2日23:01:26报道，布伦特原油期货跌幅扩大至1%，报112.191美元/桶。\n2、涉及标的：标普油气ETF嘉实（sz159518）、中海油服（sh601808）。\n3、影响分析：对能源油气方向偏空，强度弱，属当日情绪影响，与20日强势形成短线背离。\n（八）美股股指期货小幅高开纳指期货涨0.36%\n1、事件：财联社11月2日23:00:59报道，美股股指期货小幅高开，纳指期货涨0.36%。\n2、涉及标的：纳指、QQQ、A股科技成长。\n3、影响分析：对A股科技方向偏多，强度弱，属当日情绪影响，仅缓和恐慌。\n（九）美股科技股隔夜重挫\n1、事件：Yahoo与CNBC报道，隔夜纳指-2.86%、QQQ-3.47%、NVDA-4.22%，市场关注中期选举与AI资本开支。\n2、涉及标的：纳斯达克指数、半导体硬件、A股AI算力软件。\n3、影响分析：对A股半导体与AI算力方向偏空，强度强，属当日情绪影响。\n（十）美国原油基金20日领涨美股ETF\n1、事件：Seeking Alpha报道，油价在中东霍尔木兹袭击再起背景下于中期选举前回落，USO 20日+14.56%仍居美股去重榜首位。\n2、涉及标的：USO、XLE、XOP、A股油服链。\n3、影响分析：对A股能源油气方向偏 y Siri, Grok Bot”，直接进 Grok Bot 语音对话，后面全是它在跟你聊，不用再听 Siri 答非所问。\n上次评论区诟病的屏幕上一直挂着橙色小点，这次也没有了，既省电又方便\n我按照作者方法真机录了实操视频，做法是超级简单\n设置只要 4 步：\n1. 打开“快捷指令”→ 右上角 + → 添加操作 → 搜 Grok Bot → 选 Start a Voice Chat with Bot\n2. 把这条快捷指令改名叫“Grok Bot”\n3. 在快捷指令详情里打开“锁定时允许运行”\n4. 对着手机喊：Hey Siri, Grok Bot\n设置完，你的 iPhone 就多了一个真正能聊的语音助手","en":"转：\n起飞了，Grok Bot 这次真的完整顶替 Siri 了！\n喊一声“Hey Siri, Grok Bot”，直接进 Grok Bot 语音对话，后面全是它在跟你聊，不用再听 Siri 答非所问。\n上次评论区诟病的屏幕上一直挂着橙色小点，这次也没有了，既省电又方便\n我按照作者方法真机录了实操视频，做法是超级简单\n设置只要 4 步：\n1. 打开“快捷指令”→ 右上角 + → 添加操作 → 搜 Grok Bot → 选 Start a Voice Chat with Bot\n2. 把这条快捷指令改名叫“Grok Bot”\n3. 在快捷指令详情里打开“锁定时允许运行”\n4. 对着手机喊：Hey Siri, Grok Bot\n设置完，你的 iPhone 就多了一个真正能聊的语音助手","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116961421875618202","l":[],"ln":[],"t":[],"lk":0,"rt":1,"rp":0,"vw":152},{"id":"2116957815235543513","h":"RFI_Cn","ts":1793557048,"zh":"美国期中选举提前投票逾5300万人 rfi.​my/DBQ7","en":"美国期中选举提前投票逾5300万人 rfi.​my/DBQ7","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWDx6irbUAATFpI.jpg?name=orig"],"u":"https://x.com/RFI_Cn/status/2116957815235543513","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":352},{"id":"2116951491160244352","h":"RFI_Cn","ts":1793555541,"zh":"波兰政治危机：布鲁塞尔向波兰总统施压\n欧盟委员会周六站在波兰总理唐纳德·图斯克一边，呼吁波兰总统卡罗尔·纳夫罗茨基批准新法官的任命，以化解华沙的严重政治危机。","en":"波兰政治危机：布鲁塞尔向波兰总统施压\n欧盟委员会周六站在波兰总理唐纳德·图斯克一边，呼吁波兰总统卡罗尔·纳夫罗茨基批准新法官的任命，以化解华沙的严重政治危机。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/RFI_Cn/status/2116951491160244352","l":["rfi.my"],"ln":[{"u":"https://rfi.my/DBPr","d":"rfi.my"}],"t":[],"lk":0,"rt":0,"rp":1,"vw":410},{"id":"2116948771007541654","h":"cnfinancewatch","ts":1793554892,"zh":"https://x.com/i/article/2116948393985724416","en":"","zh_src":"bing","lang":"","m":[],"u":"https://x.com/cnfinancewatch/status/2116948771007541654","l":["x.com"],"ln":[{"u":"https://x.com/i/article/2116948393985724416","d":"x.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":643},{"id":"2116946040113050079","h":"cnfinancewatch","ts":1793554241,"zh":"光伏世界第一，利润是负数。\n汽车利润率是4%。\n动力电池产能利用率是40%。\n只要现金流为正，不管有没有利润，都能做。政策补贴、免税、免地皮费……只要有税收和就业，有GDP，就能存在。\n这是问题,也是成功的秘诀。制造利润和技术无人区，最终才能胜利。\n未来政策出手，让钱变贵，行业会转正。","en":"光伏世界第一，利润是负数。\n汽车利润率是4%。\n动力电池产能利用率是40%。\n只要现金流为正，不管有没有利润，都能做。政策补贴、免税、免地皮费……只要有税收和就业，有GDP，就能存在。\n这是问题,也是成功的秘诀。制造利润和技术无人区，最终才能胜利。\n未来政策出手，让钱变贵，行业会转正。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWDmQZUacAAFMDc.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2116946040113050079","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":394},{"id":"2116943860668796963","h":"cnfinancewatch","ts":1793553721,"zh":"10月25艘油轮在霍尔姆斯海峡遭到袭击。\n这些运力什么时候能恢复？","en":"10月25艘油轮在霍尔姆斯海峡遭到袭击。\n这些运力什么时候能恢复？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116943860668796963","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":594},{"id":"2116943528832139491","h":"cnfinancewatch","ts":1793553642,"zh":"说点儿干货：\n明天看3574点时的抛压和接货力度，大东家愿意出多少资金买入，2000亿以上，才能算有力道。\n整体大东家的力度需要达到1.5-2万亿，再配合重大利好，才能走出绝境。目前大概已经介入了5000亿吧。","en":"说点儿干货：\n明天看3574点时的抛压和接货力度，大东家愿意出多少资金买入，2000亿以上，才能算有力道。\n整体大东家的力度需要达到1.5-2万亿，再配合重大利好，才能走出绝境。目前大概已经介入了5000亿吧。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWDkfTTaUAAAHUv.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2116943528832139491","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":645},{"id":"2116940918591041875","h":"cnfinancewatch","ts":1793553020,"zh":"现在全球的经济命運似乎都被这几个人主导了！","en":"现在全球的经济命運似乎都被这几个人主导了！","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWDiOhia0AEycNp.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2116940918591041875","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":241},{"id":"2116937801250046245","h":"cnfinancewatch","ts":1793552277,"zh":"有些人你对他尊重，也赢得尊重\n有些人，你礼貌和尊重换来恶毒糟蹋，你只有同样以恶制恶","en":"有些人你对他尊重，也赢得尊重\n有些人，你礼貌和尊重换来恶毒糟蹋，你只有同样以恶制恶","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116937801250046245","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":562},{"id":"21169341631442578 0bUAAuJlS.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2116928242041205036","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":192},{"id":"2116927391218237930","h":"cnfinancewatch","ts":1793549795,"zh":"上海商办续期费，你觉得贵还是不贵？\n空置商办楼、个人商住公寓未来怎么办？","en":"上海商办续期费，你觉得贵还是不贵？\n空置商办楼、个人商住公寓未来怎么办？","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWDVwG4bMAA_QSQ.png?name=orig","https://pbs.twimg.com/media/HWDWAv_aIAAHPUv.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2116927391218237930","l":[],"ln":[],"t":[],"lk":0,"rt":1,"rp":0,"vw":324},{"id":"2116926384623034516","h":"cnfinancewatch","ts":1793549555,"zh":"先预判开会，看早盘反馈。","en":"先预判开会，看早盘反馈。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWDVSGMbMAAtEPx.png?name=orig"],"u":"https://x.com/cnfinancewatch/status/2116926384623034516","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":201},{"id":"2116923707868258761","h":"RFI_Cn","ts":1793548917,"zh":"美国FBI指控朝鲜策划了币安加密货币63亿美元世纪盗窃案/日本外务省遭网攻3600个人信息外泄/特朗普威胁打击伊朗一两个目标/美媒称糟糕的中期选举或促特朗普对伊朗发动大规模攻击/法国释放战略柴油储备/欧盟对小包裹征税后叠加处理费/台湾称中国海警在东部海域骚扰船只台方派船监视/莫迪政府再遭挑战反对党及“蟑螂党”抗议审查选民信息/波兰危机欧盟委员会支持总理图斯克吁总统纳夫罗茨基批准新法官任命","en":"美国FBI指控朝鲜策划了币安加密货币63亿美元世纪盗窃案/日本外务省遭网攻3600个人信息外泄/特朗普威胁打击伊朗一两个目标/美媒称糟糕的中期选举或促特朗普对伊朗发动大规模攻击/法国释放战略柴油储备/欧盟对小包裹征税后叠加处理费/台湾称中国海警在东部海域骚扰船只台方派船监视/莫迪政府再遭挑战反对党及“蟑螂党”抗议审查选民信息/波兰危机欧盟委员会支持总理图斯克吁总统纳夫罗茨基批准新法官任命","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2116923561008848897/vid/avc1/720x720/KHhvMpXK4QuvqN2G.mp4?tag=29"],"u":"https://x.com/RFI_Cn/status/2116923707868258761","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":926},{"id":"2116923570593153352","h":"cnfinancewatch","ts":1793548884,"zh":"川普中期选举打败可能很大。国会调查铺天盖地，他可能面临困境。他的财政钱袋子可能被限制。\n他可能会用特赦、更加激烈的关税、更加激烈的美伊战争烈度，国际舞台上用更加激烈的举措。","en":"川普中期选举打败可能很大。国会调查铺天盖地，他可能面临困境。他的财政钱袋子可能被限制。\n他可能会用特赦、更加激烈的关税、更加激烈的美伊战争烈度，国际舞台上用更加激烈的举措。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116923570593153352","l":[],"ln":[],"t":["关税贸易"],"lk":1,"rt":0,"rp":2,"vw":1170},{"id":"2116923396910920051","h":"ReutersChina","ts":1793548843,"zh":"中国电动汽车制造商比亚迪10月份销量连续第六个月增长，依靠海外市场来应对国内需求疲软和激烈的价格竞争。","en":"Chinese electric vehicle maker BYD , posted a sixth straight month of sales growth in October, relying on overseas markets to counter sluggish demand and intense price competition at home.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2116923396910920051","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/business/autos-transportation/chinas-byd-extends-sales-growth-streak-strong-exports-2026-11-01/?taid=6ae7622a25edfb0001784c2d&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":1,"rp":1,"vw":555},{"id":"2116922451762561176","h":"cnfinancewatch","ts":1793548617,"zh":"A股市场的美元基金只占10%，已经微乎其微。外国势力已经基本没话语权了，所以A更容易管理了。内部化了么。\n人民币基金国有属性的，政府引导、国企、央地政府……26年三季度国资市场基金LP认缴比例60%以上。\n市场游戏规则正在国资特征化。利益格局变化很大。IPO高定价、高溢价；上市后热炒作；上市节奏越来越快，……\n土地财政、让位股权财政，合肥是个例子。IPO变成邀请制，节奏和定价，等等都跟这个有关吧。","en":"A股市场的美元基金只占10%，已经微乎其微。外国势力已经基本没话语权了，所以A更容易管理了。内部化了么。\n人民币基金国有属性的，政府引导、国企、央地政府……26年三季度国资市场基金LP认缴比例60%以上。\n市场游戏规则正在国资特征化。利益格局变化很大。IPO高定价、高溢价；上市后热炒作；上市节奏越来越快，……\n土地财政、让位股权财政，合肥是个例子。IPO变成邀请制，节奏和定价，等等都跟这个有关吧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116922451762561176","l":[],"ln":[],"t":["汇率"],"lk":0,"rt":0,"rp":2,"vw":1070},{"id":"2116921192645025902","h":"cnfinancewatch","ts":1793548317,"zh":"说个阴谋论：\n中国的Ai大模型，为什么紧跟美国，就是不超越呢？\n故意的？当年里根的“星球大战计划”，听说过么？会不会DS们也在用这个策略？就在后面追，用猎狗追兔的战术？\n你提升一代，我也跟着提升一代，立即用工程化能力和廉价电力让它变得极其便宜。逼得你只能跑得更快！直到你精疲力竭。","en":"说个阴谋论：\n中国的Ai大模型，为什么紧跟美国，就是不超越呢？\n故意的？当年里根的“星球大战计划”，听说过么？会不会DS们也在用这个策略？就在后面追，用猎狗追兔的战术？\n你提升一代，我也跟着提升一代，立即用工程化能力和廉价电力让它变得极其便宜。逼得你只能跑得更快！直到你精疲力竭。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116921192645025902","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":324},{"id":"2116918726457180623","h":"cnfinancewatch","ts":1793547729,"zh":"达闼机器人机器人倒闭\n估值140亿的深兰科技，欠薪2000万\n……\n机器人行业到底是冬天还是春天？A股再不让他们上市，是不是他们就基本没活路了？\n同理，你细想想商业航天。\n你会惊出一身冷汗，你在股市亏钱，它们在科技赛道更亏钱，它们是一定要来上市圈钱的，所以，这个场子不能翻，桌子不能掀……\n救市就一定是在路上。\n你就一定能理解，我为什么大盘破3800点，就能预测政策面会救市。","en":"达闼机器人机器人倒闭\n估值140亿的深兰科技，欠薪2000万\n……\n机器人行业到底是冬天还是春天？A股再不让他们上市，是不是他们就基本没活路了？\n同理，你细想想商业航天。\n你会惊出一身冷汗，你在股市亏钱，它们在科技赛道更亏钱，它们是一定要来上市圈钱的，所以，这个场子不能翻，桌子不能掀……\n救市就一定是在路上。\n你就一定能理解，我为什么大盘破3800点，就能预测政策面会救市。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116918726457180623","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":733},{"id":"2116917338893357518","h":"RFI_Cn","ts":1793547398,"zh":"施泰因迈尔：当被问及是否将就乌克兰问题举行中美俄峰会? 习近平面露不悦之色 rfi.​my/DBOn","en":"施泰因迈尔：当被问及是否将就乌克兰问题举行中美俄峰会? 习近平面露不悦之色 rfi.​my/DBOn","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWDNGilbsAESC5K.jpg?name=orig"],"u":"https://x.com/RFI_Cn/status/2116917338893357518","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":966},{"id":"2116917303371538578","h":"RFI_Cn","ts":1793547390,"zh":"施泰因迈尔：当被问及是否将就乌克兰问题举行中美俄峰会? 习近平面露不悦之色\n德国联邦总统弗兰克-瓦尔特·施泰因迈尔表示，根据他上周在北京与习近平会面的情况来看，中国对与美俄就乌克兰问题举行三方峰会不感兴趣。","en":"施泰因迈尔：当被问及是否将就乌克兰问题举行中美俄峰会? 习近平面露不悦之色\n德国联邦总统弗兰克-瓦尔特·施泰因迈尔表示，根据他上周在北京与习近平会面的情况来看，中国对与美俄就乌克兰问题举行三方峰会不感兴趣。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/RFI_Cn/status/2116917303371538578","l":["rfi.my"],"ln":[{"u":"https://rfi.my/DBOn","d":"rfi.my"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":849},{"id":"2116916431787065557","h":"cnfinancewatch","ts":1793547182,"zh":"现在房子跌多少了？30-40%？\n现在股市跌多少了？40%？\n黄金跌多少了？20%？\n现在是吃现金的时候，所以，我们的大类轮动主仓是BIL和银华日利。\n未来呢？你能看懂我们大类轮动的规律吗？欢迎订阅，我们会有课程提示：","en":"现在房子跌多少了？30-40%？\n现在股市跌多少了？40%？\n黄金跌多少了？20%？\n现在是吃现金的时候，所以，我们的大类轮动主仓是BIL和银华日利。\n未来呢？你能看懂我们大类轮动的规律吗？欢迎订阅，我们会有课程提示：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116916431787065557","l":["macaostarbridge.com"],"ln":[{"u":"https://macaostarbridge.com/","d":"macaostarbridge.com"}],"t":["黄金"],"lk":1,"rt":0,"rp":1,"vw":1213},{"id":"2116915758647365767","h":"cnfinancewatch","ts":1793547021,"zh":"危机时：股票指数跌50%以上；房产跌 aise Japan’s new tax refund at airports","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2116905928960446809","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/hong-kong/society/article/3372903/less-minute-hong-kong-travellers-praise-japans-new-tax-refund-airports","d":"scmp.com"}],"t":[],"lk":2,"rt":1,"rp":0,"vw":1205},{"id":"2116905894248374451","h":"cnfinancewatch","ts":1793544670,"zh":"看到了新一轮924行情的预兆了吗？","en":"看到了新一轮924行情的预兆了吗？","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWDCm2fbgAAAIep.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2116905894248374451","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":772},{"id":"2116905630665711638","h":"cnfinancewatch","ts":1793544607,"zh":"上海中心城区（尤其是黄浦老城厢、静安张园周边等）不少石库门/里弄地块已经完成居民动迁（保护性征收），但长期围挡封存、未大规模开建，形成“人走房空”的过渡状态。\n为什么动迁完却迟迟不开建？\n政策彻底转向“留改拆并举，以保留保护为主”\n2017年后，上海明确从过去以拆除为主的旧改，转向保护优先。中心城区大量石库门里弄被划入历史文化风貌区、风貌保护街坊或优秀历史建筑范畴，实行“征而不拆、人走房留”。不能像过去那样整片推平建高楼，必须修缮、保留肌理、有时还要整体平移。\n施工本身极其复杂、周期长\n典型如张园：2018年启动保护性征收，2020年完成动迁，西区2022年才开放。东区为了在老建筑下方开发地下三层空间（停车、商业、地铁2/12/13号线站内换乘），不得不把部分建筑群临时平移出去（最著名的是7500吨“华严里”用432个机器人日行约10米移动），地下结构做完再归位修缮。这类“地上行走、地下生长”的工程，从动迁到全面运营往往要5-10年。\n经济账难算平\n动迁成本极高（黄浦区2025年相关支出预算就很高），保护修缮+地下开发费用巨大，而地上可新增建筑面积被严格限制。过去“毛地批租”模式因成本倒挂早已停摆，现在多用政府土地储备+平台公司主导。商业回报依赖高端消费/文化IP，市场一旦冷却，开发商就更谨慎。黄浦老西门、乔家路、方浜中路一带就有不少被描述为“无人区”的围挡地块。\n规划和审批链条长\n风貌保护专项规划、控规调整、地下空间、文保审批等层层叠加，加上历史风貌保护资金统筹、开发权转移等机制还在完善中。\n以后怎么解决？城市规划方向\n上海已经明确进入存量更新阶段，大规模成片旧里改造基本收官（2022-2025年基本完成成片及零星二级旧里以下改造），未来不会再走过去“拆完就建高楼”的老路。\n续文脉 + 留韵活化：黄浦等核心区明确从“拆改腾地”转向“留韵活化、价值深耕”。重点是历史建筑保护性修缮、里弄街坊基础设施升级、功能置换（商业、文化、办公、体验空间）。张园、海玥黄浦源·十八里、顺昌路等项目就是样本：保留原生石库门肌理，用平移、原位托换、修旧如旧+局部新建，再配地下空间。⁠\n地下空间补偿地上受限：这是核心区解决密度与保护矛盾的主要手段，同时解决停车、地铁换乘等城市功能。\n资金与机制：土地出让收入专项用于风貌保护；探索开发权转移；政府主导或政企合作；对重点旧改和风貌地块有财政支持。\n其他重点：城中村改造（未来几年最后一波大规模动迁窗口）、不成套职工住宅改造、老旧小区大规模修缮（计划2400万㎡级别）。\n中心区土地其实不稀缺，文化IP（石库门里弄）是否有溢价？张园西区客流和品牌表现说明活化路径是可行的。但保护项目利润薄、周期长，纯市场化动力不足，需要政策持续托底。经济下行周期，这个托底，谁也没底气。\n功能淘汰和城市发展方式的淘汰——从增量扩张、大拆大建转向存量提质、精细更新。老石库门作为海派城市记忆的一部分，不会被简单清除，但原住民的生活方式和低效空间会逐步被现代功能替代。短期这些围挡地块还会持续存在，是必要的“等待期”；中长期会以保护性活化项目逐步打开。\n上海中心城区的石库门更新已经从“拆得快”进入“留得住、活得好”的阶段。但过程确实漫长；逻辑是清晰的：先保护，再活化，地下补功能，经济靠文化+商业慢慢回本。具体地块进度差异很大，张园这种标杆项目推进相对明确，老城厢一些复杂地块可能更慢。\n这是个两难，暂时在地产下行阶段还无解。","en":"上海中心城区（尤其是黄浦老城厢、静安张园周边等）不少石库门/里弄地块已经完成居民动迁（保护性征收），但长期围挡封存、未大规模开建，形成“人走房空”的过渡状态。\n为什么动迁完却迟迟不开建？\n政策彻底转向“留改拆并举，以保留保护为主”\n2017年后，上海明确从过去以拆除为主的旧改，转向保护优先。中心城区大量石库门里弄被划入历史文化风貌区、风貌保护街坊或优秀历史建筑范畴，实行“征而不拆、人走房留”。不能像过去那样整片推平建高楼，必须修缮、保留肌理、有时还要整体平移。\n施工本身极其复杂、周期长\n典型如张园：2018年启动保护性征收，2020年完成动迁，西区2022年才开放。东区为了在老建筑下方开发地下三层空间（停车、商业、地铁2/12/13号线站内换乘），不得不把部分建筑群临时平移出去（最著名的是7500吨“华严里”用432个机器人日行约10米移动），地下结构做完再归位修缮。这类“地上行走、地下生长”的工程，从动迁到全面运营往往要5-10年。\n经济账难算平\n动迁成本极高（黄浦区2025年相关支出预算就很高），保护修缮+地下开发费用巨大，而地上可新增建筑面积被严格限制。过去“毛地批租”模式因成本倒挂早已停摆，现在多用政府土地储备+平台公司主导。商业回报依赖高端消费/文化IP，市场一旦冷却，开发商就更谨慎。黄浦老西门、乔家路、方浜中路一带就有不少被描述为“无人区”的围挡地块。\n规划和审批链条长\n风貌保护专项规划、控规调整、地下空间、文保审批等层层叠加，加上历史风貌保护资金统筹、开发权转移等机制还在完善中。\n以后怎么解决？城市规划方向\n上海已经明确进入存量更新阶段，大规模成片旧里改造基本收官（2022-2025年基本完成成片及零星二级旧里以下改造），未来不会再走过去“拆完就建高楼”的老路。\n续文脉 + 留韵活化：黄浦等核心区明确从“拆改腾地”转向“留韵活化、价值深耕”。重点是历史建筑保护性修缮、里弄街坊基础设施升级、功能置换（商业、文化、办公、体验空间）。张园、海玥黄浦源·十八里、顺昌路等项目就是样本：保留原生石库门肌理，用平移、原位托换、修旧如旧+局部新建，再配地下空间。⁠\n地下空间补偿地上受限：这是核心区解决密度与保护矛盾的主要手段，同时解决停车、地铁换乘等城市功能。\n资金与机制：土地出让收入专项用于风貌保护；探索开发权转移；政府主导或政企合作；对重点旧改和风貌地块有财政支持。\n其他重点：城中村改造（未来几年最后一波大规模动迁窗口）、不成套职工住宅改造、老旧小区大规模修缮（计划2400万㎡级别）。\n中心区土地其实不稀缺，文化IP（石库门里弄）是否有溢价？张园西区客流和品牌表现说明活化路径是可行的。但保护项目利润薄、周期长，纯市场化动力不足，需要政策持续托底。经济下行周期，这个托底，谁也没底气。\n功能淘汰和城市发展方式的淘汰——从增量扩张、大拆大建转向存量提质、精细更新。老石库门作为海派城市记忆的一部分，不会被简单清除，但原住民的生活方式和低效空间会逐步被现代功能替代。短期这些围挡地块还会持续存在，是必要的“等待期”；中长期会以保护性活化项目逐步打开。\n上海中心城区的石库门更新已经从“拆得快”进入“留得住、活得好”的阶段。但过程确实漫长；逻辑是清晰的：先保护，再活化，地下补功能，经济靠文化+商业慢慢回本。具体地块进度差异很大，张园这种标杆项目推进相对明确，老城厢一些复杂地块可能更慢。\n这是个两难，暂时在地产下行阶段还无解。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116905630665711638","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":666},{"id":"2116905479138058538","h":"RFI_Cn","ts":1793544571,"zh":"法国释放战略柴油储备 加油站预计开始降价\n继道达尔能源之后，E. Leclerc公司周六宣布从11月1日起柴油降价。","en":"法国释放战略柴油储备 加油站预计开始降价\n继道达尔能源之后，E. Leclerc公司周六宣布从11月1日起柴油降价。"," 回地球。\n利好 $GOOG 和 $SPCX","en":"谷歌真把AI算力搬到太空了。10月1号部署的卫星算力中心，搭载4台自研TPU，跑起Gemma 4，完成人类第一次太空AI问答。地面发句\"写首太空短诗\"，卫星直接在轨道上推理，把诗传回地球。\n利好 $GOOG 和 $SPCX","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116875803493564453","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":1,"vw":1109},{"id":"2116866872830497165","h":"fxtrader","ts":1793535366,"zh":"#观察 明天是农历九月廿四。","en":"#观察 明天是农历九月廿四。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2116866872830497165","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":3,"vw":1585},{"id":"2116866312031158445","h":"fxtrader","ts":1793535232,"zh":"上证报：央行、金融监管总局、证监会，明日将召开会议研究推动支持资本市场工具使用。有证券公司、基金公司接到通知，11月2日中国人民银行、中国证监会召开会议，研究推动支持资本市场工具使用。同一天，中国人民银行、金融监管总局、中国证监会还将召集各大银行开会研究优化股票回购增持再贷款政策。股票回购增持再贷款是支持资本市场的两项货币政策工具之一。\n2024年10月18日，中国人民银行联合金融监管总局、中国证监会发布《关于设立股票回购增持再贷款有关事宜的通知》，设立股票回购增持再贷款，激励引导金融机构向符合条件的上市公司和主要股东提供贷款，支持其回购和增持上市公司股票。","en":"上证报：央行、金融监管总局、证监会，明日将召开会议研究推动支持资本市场工具使用。有证券公司、基金公司接到通知，11月2日中国人民银行、中国证监会召开会议，研究推动支持资本市场工具使用。同一天，中国人民银行、金融监管总局、中国证监会还将召集各大银行开会研究优化股票回购增持再贷款政策。股票回购增持再贷款是支持资本市场的两项货币政策工具之一。\n2024年10月18日，中国人民银行联合金融监管总局、中国证监会发布《关于设立股票回购增持再贷款有关事宜的通知》，设立股票回购增持再贷款，激励引导金融机构向符合条件的上市公司和主要股东提供贷款，支持其回购和增持上市公司股票。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2116866312031158445","l":[],"ln":[],"t":["A股港股"],"lk":4,"rt":0,"rp":1,"vw":2800},{"id":"2116863581933404190","h":"dmjk001","ts":1793534582,"zh":"中国最高监管机构将在香港峰会上向全球银行家发表讲话","en":"中国最高监管机构将在香港峰会上向全球银行家发表讲话","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWCcJbUasAAnWBe.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2116863581933404190","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1136},{"id":"2116863450551124115","h":"fxtrader","ts":1793534550,"zh":"一家国有超大型银行近日计划向中国国新、中国诚通两家央企新增股票回购增持贷款额度，单家新增额度或可达到1000亿元。据悉，此次新增的再贷款额度规模，或将超过2024年该政策工具设立时该行向上述主体发放的首期额度。（证券时报）","en":"一家国有超大型银行近日计划向中国国新、中国诚通两家央企新增股票回购增持贷款额度，单家新增额度或可达到1000亿元。据悉，此次新增的再贷款额度规模，或将超过2024年该政策工具设立时该行向上述主体发放的首期额度。（证券时报）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2116863450551124115","l":[],"ln":[],"t":[],"lk":10,"rt":0,"rp":0,"vw":4597},{"id":"2116859773425742233","h":"cnfinancewatch","ts":1793533673,"zh":"1、事件：据新浪财经报道，泸州老窖前三季度新增30亿元短期借款，经营现金流同比回落，引发市场对白酒企业现金流质量的关注。\n2、涉及个股：泸州老窖（000568）属高端白酒板块，同板块五粮液（000858）、贵州茅台（600519）为对照标的，皇台酒业（000995）属白酒概念小市值品种。\n3、影响：偏空，强度中等，属持续性逻辑。短期借款补充流动性反映渠道回款与库存去化压力，但当日泸州老窖仍涨停，说明市场更关注业绩环比改善，现金流瑕疵构成后续估值压制，宜区分龙头与小票。\n1、事件：据东方财富报道，白酒上市公司三季报出炉，头部酒企位次再度反转，行业内部竞争格局出现新变化。\n2、涉及个股：贵州茅台（600519）属超级品牌白酒龙头，五粮液（000858）属高端白酒，泸州老窖（000568）属高端白酒，皇台酒业（000995）属白酒概念小票，位次变化直接影响资金在龙头间的再平衡。\n3、影响：偏多，强度中等，属当日情绪影响。位次反转带来龙头间的相对估值重估，茅台三季度净利增3.78%且增长动力转向批发渠道，说明高端酒韧性仍在，交易上宜配置位次上移的龙头而非跟风小票。","en":"1、事件：据新浪财经报道，泸州老窖前三季度新增30亿元短期借款，经营现金流同比回落，引发市场对白酒企业现金流质量的关注。\n2、涉及个股：泸州老窖（000568）属高端白酒板块，同板块五粮液（000858）、贵州茅台（600519）为对照标的，皇台酒业（000995）属白酒概念小市值品种。\n3、影响：偏空，强度中等，属持续性逻辑。短期借款补充流动性反映渠道回款与库存去化压力，但当日泸州老窖仍涨停，说明市场更关注业绩环比改善，现金流瑕疵构成后续估值压制，宜区分龙头与小票。\n1、事件：据东方财富报道，白酒上市公司三季报出炉，头部酒企位次再度反转，行业内部竞争格局出现新变化。\n2、涉及个股：贵州茅台（600519）属超级品牌白酒龙头，五粮液（000858）属高端白酒，泸州老窖（000568）属高端白酒，皇台酒业（000995）属白酒概念小票，位次变化直接影响资金在龙头间的再平衡。\n3、影响：偏多，强度中等，属当日情绪影响。位次反转带来龙头间的相对估值重估，茅台三季度净利增3.78%且增长动力转向批发渠道，说明高端酒韧性仍在，交易上宜配置位次上移的龙头而非跟风小票。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116859773425742233","l":[],"ln":[],"t":["财报"],"lk":0,"rt":0,"rp":2,"vw":196},{"id":"2116859400052994168","h":"cnfinancewatch","ts":1793533584,"zh":"险资与社保偏好的方向集中在金融与高股息蓝筹，招商银行（600036）属银行板块，中国平安（601318）属保险板块，贵州茅台（600519）属白酒板块，均为机构长线配置的代表品种。","en":"险资与社保偏好的方向集中在金融与高股息蓝筹，招商银行（600036）属银行板块，中国平安（601318）属保险板块，贵州茅台（600519）属白酒板块，均为机构长线配置的代表品种。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116859400052994168","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":551},{"id":"2116859123639968237","h":"dmjk001","ts":1793533519,"zh":"19:44:53【独家|国有某大行计划向中国国新和中国诚通各新增千亿级股票回购增持专项贷款额度】财联社11月1日电，财联社记者今日从相关渠道了解到，一家国有超大型银行近日计划向中国国新、中国诚通两家央企新增股票回购增持贷款额度，单家新增额度或可达到1000亿元。据悉，此次新增的再贷款额度规模，或将超过2024年该政策工具设立时该行向上述主体发放的首期额度。（财联社 lmer，目前身家超 1200 亿美元）活成了所有投资人最羡慕的样子。\n他既不像马斯克那样天天睡在工厂里造火箭，也不像贝索斯那样到处折腾新公司；他从微软退休之后干的最核心一件事，就是死死抱住自己手里那大约 3.33 亿股（约占微软 4%）的微软股票一股不卖。\n按照微软最新上调的季度分红标准计算，鲍尔默哪怕一年到头天天在家里睡觉打高尔夫球，微软公司每年光通过股票现金分红（Dividend），就要往他的个人银行账户里自动打入超过 11 亿美元的纯现金！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2116839174515163245","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":505},{"id":"2116836468283089378","h":"cnfinancewatch","ts":1793528117,"zh":"订阅区更新了本周《周报》《华尔街观察内部闭门会议纪要》\n一、大类资产轮动主仓如何避险（我们是从10月15日开始避险的，会员资金应该基本没有受损）。\n二、行业轮动仓位：四个中美共振方向。\n三、#一个确定性机会方向投资价值显现，非常值得重视：不仅仅是短期避险，相反提示我们需要长期重视风险资产中的非科技成长板块的稳定的年化表现，提示股市长期主义，不应该只押注科技成长。尽管是辅助仓，但，值得重视。\n四、科技成长方向，AI基建之后，谁将是从1走向10的未来王者？\n敬请订阅者点阅：","en":"订阅区更新了本周《周报》《华尔街观察内部闭门会议纪要》\n一、大类资产轮动主仓如何避险（我们是从10月15日开始避险的，会员资金应该基本没有受损）。\n二、行业轮动仓位：四个中美共振方向。\n三、#一个确定性机会方向投资价值显现，非常值得重视：不仅仅是短期避险，相反提示我们需要长期重视风险资产中的非科技成长板块的稳定的年化表现，提示股市长期主义，不应该只押注科技成长。尽管是辅助仓，但，值得重视。\n四、科技成长方向，AI基建之后，谁将是从1走向10的未来王者？\n敬请订阅者点阅：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWCBrntacAAUZ_H.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2116836468283089378","l":["macaostarbridge.com"],"ln":[{"u":"https://macaostarbridge.com","d":"macaostarbridge.com"}],"t":[],"lk":0,"rt":0,"rp":1,"vw":3823},{"id":"2116835981210841197","h":"SCMPNews","ts":1793528001,"zh":"97岁高龄的中国第一位女指挥家仍在公共场合演出，令观众惊叹不已","en":"At 97, China’s first female conductor still performs in public, wowing audiences","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2116835981210841197","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/people-culture/china-personalities/article/3372882/97-chinas-first-female-conductor-still-performs-public-wowing-audiences?utm_medium=Social&utm_source=Twitter#Echobox=1793527998","d":"scmp.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":1358},{"id":"2116832623439847669","h":"nytchinese","ts":1793527200,"zh":"作为少有的几乎拥有无限资源的重罪犯，赵长鹏处境理想，可以尽量少受点苦。他被分配到加利福尼亚州低安全级别的洛姆波克II监狱。赵长鹏于2024年5月30日上午抵达洛姆波克。他很快融入了一个被称为“车”的非正式社交团体。亚裔囚犯为能接近一位亿万富翁而兴奋
