<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经资讯工作台 · X 信源</title>
<meta name="robots" content="noindex,nofollow">

<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
  --hdr:rgba(10,13,19,.88);
  --kpi:#0e131c;
  --hover-bg:#111722;
  --quote:#151c28;
  --toast:#1b2333;
  --body-txt:#dfe5ef; --body-zh:#eef2f8; --meta:#7f93ad;
  --shadow:rgba(0,0,0,.4);
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#eef1f7; --panel:#ffffff; --panel2:#f0f3f9; --hover:#e8edf5;
  --line:#dde3ed; --line2:#c8d1e0;
  --txt:#1a2130; --dim:#5d6779; --dim2:#8893a5;
  --gold:#b8860b; --up:#e03131; --down:#1a9e56; --blue:#1c6fd4; --purple:#6d5bd0;
  --hdr:rgba(255,255,255,.9);
  --kpi:#ffffff; --hover-bg:#f5f8fd;
  --quote:#f0f3f9; --toast:#ffffff;
  --body-txt:#3a4354; --body-zh:#2b3342; --meta:#6d7889;
  --shadow:rgba(20,30,50,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--line)}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:var(--hdr);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
/* 主题切换按钮 */
.theme-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--dim);
  flex-shrink:0;transition:.14s}
.theme-btn:hover{background:var(--hover);color:var(--txt);border-color:var(--line2)}
.theme-btn svg{width:17px;height:17px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px var(--shadow);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),var(--kpi));
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:var(--hover-bg)}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:var(--body-txt)}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:var(--meta);background:var(--quote);border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:var(--body-zh)}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:var(--toast);border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>
</head>

33,"zh":"所以还是最早的思路对了，美股休克的话两党谁也顶不住谁都得吃亏，维护美股稳定是两党的最大公约数。\n对川普个人来说还多了一层，那些人今天能搞黄仁勋，明天就能搞马斯克，后天就敢咬懂王了，必须及时刹车不然肯定会引火烧身。\n跟民主党的斗争可以败，但不能上来就滑跪，要一城一池的防守，即使败也得让民主党付出代价才能保住底线。","en":"所以还是最早的思路对了，美股休克的话两党谁也顶不住谁都得吃亏，维护美股稳定是两党的最大公约数。\n对川普个人来说还多了一层，那些人今天能搞黄仁勋，明天就能搞马斯克，后天就敢咬懂王了，必须及时刹车不然肯定会引火烧身。\n跟民主党的斗争可以败，但不能上来就滑跪，要一城一池的防守，即使败也得让民主党付出代价才能保住底线。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2124897566815039606","l":[],"ln":[],"t":["美股"],"lk":9,"rt":0,"rp":0,"vw":2292},{"id":"2124896864126587148","h":"wufantouzi","ts":1795449865,"zh":"做好自己的交易\n远离纷扰\n他人笑你蠢和傻\n其实改变不了你的生活\n只有自己做错了交易\n亏掉了钱才会让你的生活变差\n观点可以是对立的\n但钱是自己的\n守护好自己的钱包\n认识好自己的主线任务\n有没有老黄这个消息\n其实市场都要反弹了\n只不过老黄让反弹来得更快更猛\n12月10号等cpi是熊转牛逆转信号\n观点依然不变","en":"做好自己的交易\n远离纷扰\n他人笑你蠢和傻\n其实改变不了你的生活\n只有自己做错了交易\n亏掉了钱才会让你的生活变差\n观点可以是对立的\n但钱是自己的\n守护好自己的钱包\n认识好自己的主线任务\n有没有老黄这个消息\n其实市场都要反弹了\n只不过老黄让反弹来得更快更猛\n12月10号等cpi是熊转牛逆转信号\n观点依然不变","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX0mbSiaYAAFt_m.jpg?name=orig"],"u":"https://x.com/wufantouzi/status/2124896864126587148","l":[],"ln":[],"t":[],"lk":18,"rt":1,"rp":5,"vw":2783},{"id":"2124896233009586480","h":"fxtrader","ts":1795449715,"zh":"伯恩斯坦：将英伟达评级从与大市一致上调至跑赢大市评级，批评英伟达董事会的治理与应对方式。\nMelius Research：将英伟达评级从持有上调至买入。\nWedbush：维持英伟达跑赢大市评级，目标价225美元。调查解决后可能看到更高路径（如300美元）。\n$NVDA","en":"伯恩斯坦：将英伟达评级从与大市一致上调至跑赢大市评级，批评英伟达董事会的治理与应对方式。\nMelius Research：将英伟达评级从持有上调至买入。\nWedbush：维持英伟达跑赢大市评级，目标价225美元。调查解决后可能看到更高路径（如300美元）。\n$NVDA","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2124896233009586480","l":[],"ln":[],"t":["AI科技"],"lk":11,"rt":0,"rp":2,"vw":2958},{"id":"2124896222716764634","h":"octopusycc","ts":1795449712,"zh":"最近研究了一家比较有意思的美股公司，$OPNW（OpenWorld）。@openworld_HQ\n我一直有个观点：RWA 下一阶段真正值得关注的，不是把多少资产搬到链上，而是谁能解决传统金融市场真实存在的融资需求。\nOPNW 就是一个值得研究的案例。\n1. 公司背景\nOPNW 今年 10 月正式以新代码在 Nasdaq 交易，主要通过 OpenWorld Enterprise 为企业提供资产代币化、融资结构设计和技术服务。\n团队有一定传统金融背景。CEO Matthew Shaw 曾任职 UBS，也创立过加密资产管理公司 Protos；Russel McMeekin 则有 Honeywell 的企业技术管理经验。\n2. AI CapEx 的二阶传导，可能是 RWA 的新机会\n我之前反复讲过，AI CapEx 的二阶增速不可能永远加速。\n未来市场关注的重点，会逐渐从算力投入规模转向资本效率、融资成本和资产回报率。\nOPNW 目前推进的两个项目恰好切中了这个方向：\nMeridian：拟通过上限 10 亿美元的代币化融资，建设光伏、储能支持的分布式 AI 算力网络。\nBeyondAI：拟以知识产权作为抵押品，进行上限 1.3 亿美元的代币化融资。\n两个项目都不能直接视为已完成融资或已确认收入。\n但我认为背后的逻辑值得关注：当 AI 企业开始更加重视资本效率，知识产权、算力设备、能源资产等，都可能成为新的融资标的。\nRWA 的机会可能不只在国债和传统信贷。\n3. Solana 生态的参与\n11 月 10 日，代币化 OPNW 上线 Solana，由 Backpack Securities 发行。\nSolana 官方账号进行了相关直播，Frontier Traders 也推出了 OPNW 交易奖励活动。\n我更关注的是，传统上市公司的股票开始获得新的链上交易渠道。这不等于 Solana 对股价背书，但确实让 OPNW 获得了一定的生态曝光。\n4. 估值差距与我的研究框架\n按照 11 月 16 日收盘市值及 Q3 收入年化口径计算：\nSecuritize：16.1x P/S\nFigure：5.0x P/S\nOPNW：0.28x P/S\nOPNW 当时市值约 835 万美元，Q3 收入约 740 万美元。\n估值倍数差距确实很大，但我不认为简单套用同行估值，就能证明公司被低估。\n尤其 OPNW Q3 约 89% 的收入来自关联方，相关 RWA 收入截至季末尚未开票或回款，收入质量仍然需要验证。\n按照我的研究框架，接下来主要关注三个变量：\n宏观流动性：利率和融资环境是否支持项目交割？\n现金流兑现：项目能否从融资意向变成实际收入和回款？\n估值预期差：第三方客户增长、收入质量改善，能否支撑市场重新定价？\n——————————————\n我认为 AI CapEx 周期的下一阶段，不只是半导体和数据中心之间的利润重新分配，也可能带来融资结构和资本市场服务的新需求。\nOPNW 正好处在 RWA 与 AI 资产融资的交叉点上。\n但融资规模不等于收入，收入也不等于现金流。低估值背后也可能是市场对执行风险的定价。\n我更愿意把 OPNW 当作一个需要持续验证的预期差案例。未来几个季度，真正重要的不是宣布了多少亿美元的项目，而是有多少项目完成交割、多少收入最终变成现金流。","en":"最近研究了一家比较有意思的美股公司，$OPNW（OpenWorld）。@openworld_HQ\n我一直有个观点：RWA 下一阶段真正值得关注的，不是把多少资产搬到链上，而是谁能解决传统金融市场真实存在的融资需求。\nOPNW 就是一个值得研究的案例。\n1. 公司背景\nOPNW 今年 10 月正式以新代码在 Nasdaq 交易，主要通过 OpenWorld Enterprise 为企业提供资产代币化、融资结构设计和技术服务。\n团队有一定传统金融背景。CEO Matthew Shaw 曾任职 UBS，也创立过加密资产管理公司 Protos；Russel McMeekin 则有 Honeywell 的企业技术管理经验。\n2. AI CapEx 的二阶传导，可能是 RWA 的新机会\n我之前反复讲过，AI CapEx 的二阶增速不可能永远加速。\n未来市场关注的重点，会逐渐从算力投入规模转向资本效率、融资成本和资产回报率。\nOPNW 目前推进的两个项目恰好切中了这个方向：\nMeridian：拟通过上限 10 亿美元的代币化融资，建设光伏、储能支持的分布式 AI 算力网络。\nBeyondAI：拟以知识产权作为抵押品，进行上限 1.3 亿美元的代币化融资。\n两个项目都不能直接视为已完成融资或已确认收入。\n但我认为背后的逻辑值得关注：当 AI 企业开始更加重视资本效率，知识产权、算力设备、能源资产等，都可能成为新的融资标的。\nRWA 的机会可能不只在国债和传统信贷。\n3. Solana 生态的参与\n11 月 10 日，代币化 OPNW 上线 Solana，由 Backpack Securities 发行。\nSolana 官方账号进行了相关直播，Frontier Traders 也推出了 OPNW 交易奖励活动。\n我更关注的是，传统上市公司的股票开始获得新的链上交易渠道。这不等于 Solana 对股价背书，但确实让 OPNW 获得了一定的生态曝光。\n4. 估值差距与我的研究框架\n按照 11 月 16 日收盘市值及 Q3 收入年化口径计算：\nSecuritize：16.1x P/S\nFigure：5.0x P/S\nOPNW：0.28x P/S\nOPNW 当时市值约 835 万美元，Q3 收入约 740 万美元。\n估值倍数差距确实很大，但我不认为简单套用同行估值，就能证明公司被低估。\n尤其 OPNW Q3 约 89% 的收入来自关联方，相关 RWA 收入截至季末尚未开票或回款，收入质量仍然需要验证。\n按照我的研究框架，接下来主要关注三个变量：\n宏观流动性：利率和融资环境是否支持项目交割？\n现金流兑现：项目能否从融资意向变成实际收入和回款？\n估值预期差：第三方客户增长、收入质量改善，能否支撑市场重新定价？\n——————————————\n我认为 AI CapEx 周期的下一阶段，不只是半导体和数据中心之间的利润重新分配，也可能带来融资结构和资本市场服务的新需求。\nOPNW 正好处在 RWA 与 AI 资产融资的交叉点上。\n但融资规模不等于收入，收入也不等于现金流。低估值背后也可能是市场对执行风险的定价。\n我更愿意把 OPNW 当作一个需要持续验证的预期差案例。未来几个季度，真正重要的不是宣布了多少亿美元的项目，而是有多少项目完成交割、多少收入最终变成现金流。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX0l1d2awAAkJvG.jpg?name=orig"],"u":"https://x.com/octopusycc/status/2124896222716764634","l":[],"ln":[],"t":["美股","AI科技"],"lk":6,"rt":1,"rp":3,"vw":1762},{"id":"2124895989236658559","h":"tig88411109","ts":1795449657,"zh":"杀不死你的让你更强大。这才是真正的顶级买方策略。看看市场上一旦大跌三根阴线，就开始如大摩、UBS和那个什么印度分析师的Semianalysis疯狂挑低AI需求预测。都是比散户还是更韭菜风格的大号机构投资。在市场最恐慌之时，这是最根本的底层逻辑分析，告诉你什么叫做AI钢铁泡沫，什么叫做投资策略和仓位应对。难的，从来不是看懂一次暴跌。而是当市场重新热起来、重新顺起来、重新让你觉得自己无所不能的时候，你还能不能记得，在最黑的时候到底学到了什么。多数人不是死在底部。多数人死在从底部活过来以后，以为自己刀枪不入。","en":"杀不死你的让你更强大。这才是真正的顶级买方策略。看看市场上一旦大跌三根阴线，就开始如大摩、UBS和那个什么印度分析师的Semianalysis疯狂挑低AI需求预测。都是比散户还是更韭菜风格的大号机构投资。在市场最恐慌之时，这是最根本的底层逻辑分析，告诉你什么叫做AI钢铁泡沫，什么叫做投资策略和仓位应对。难的，从来不是看懂一次暴跌。而是当市场重新热起来、重新顺起来、重新让你觉得自己无所不能的时候，你还能不能记得，在最黑的时候到底学到了什么。多数人不是死在底部。多数人死在从底部活过来以后，以为自己刀枪不入。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tig88411109/status/2124895989236658559","l":[],"ln":[],"t":[],"lk":17,"rt":3,"rp":2,"vw":2265},{"id":"2124895673875415290","h":"tig88411109","ts":1795449581,"zh":"当时是市场杠杆或者量化机构被迫清仓\nAI科技股再一次恐慌性大跌，往往现实教学是最有效的，散户的优势在于你不用像机构一样被迫杠杆清仓\n这是所有散户和专业投资者的必读\n具体的投资策略和仓位买入管理更新见11月订阅投资 订阅者专享\n真正的问题，从来不是“市场会不会跌”，而是你有没有用一种会把自己先弄死的方式参与市场。\n很多人最容易犯的错，是把“长期看对”误当成“短期可以无所谓”。这是最危险的自我安慰。\n长期看好一家公司，不等于你可以用失控的仓位去持有它。看对行业趋势，不等于你就有资格加杠杆。\n判断最终被证明正确，也不代表你中间那段路径扛得住。\n市场里死掉的人，很多不是方向错了。是仓位先坏了，心态先坏了，现金流先坏了。最后等不到自己的判断兑现。\n很多人总想要一个完美答案：\n现在是不是最低点？\n现在是不是要 all in？\n现在是不是该清仓？\n市场从来不给这种答案。\n你卖的时候，不会刚好卖在最高点。你买的时候，也不会刚好买在最低点。\n真正成熟的投资，不是执着于那个神话般的最优点，而是用你自己活得下去的仓位结构，持续做高赔率的事。\n树不会长到天上去。再好的板块，涨多了也会透支赔率。再差的情绪，跌到脱离合理价值以后，也会出现修复。\n所以最难的，从来不是看懂一次暴跌。\n而是当市场重新热起来、重新顺起来、重新让你觉得自己无所不能的时候，你还能不能记得，在最黑的时候到底学到了什么。\n多数人不是死在底部。多数人死在从底部活过来以后，以为自己刀枪不入。\n市场会反复奖励勇敢。但它最终只长期奖励有纪律的人。","en":"当时是市场杠杆或者量化机构被迫清仓\nAI科技股再一次恐慌性大跌，往往现实教学是最有效的，散户的优势在于你不用像机构一样被迫杠杆清仓\n这是所有散户和专业投资者的必读\n具体的投资策略和仓位买入管理更新见11月订阅投资 订阅者专享\n真正的问题，从来不是“市场会不会跌”，而是你有没有用一种会把自己先弄死的方式参与市场。\n很多人最容易犯的错，是把“长期看对”误当成“短期可以无所谓”。这是最危险的自我安慰。\n长期看好一家公司，不等于你可以用失控的仓位去持有它。看对行业趋势，不等于你就有资格加杠杆。\n判断最终被证明正确，也不代表你中间那段路径扛得住。\n市场里死掉的人，很多不是方向错了。是仓位先坏了，心态先坏了，现金流先坏了。最后等不到自己的判断兑现。\n很多人总想要一个完美答案：\n现在是不是最低点？\n现在是不是要 all in？\n现在是不是该清仓？\n市场从来不给这种答案。\n你卖的时候，不会刚好卖在最高点。你买的时候，也不会刚好买在最低点。\n真正成熟的投资，不是执着于那个神话般的最优点，而是用你自己活得下去的仓位结构，持续做高赔率的事。\n树不会长到天上去。再好的板块，涨多了也会透支赔率。再差的情绪，跌到脱离合理价值以后，也会出现修复。\n所以最难的，从来不是看懂一次暴跌。\n而是当市场重新热起来、重新顺起来、重新让你觉得自己无所不能的时候，你还能不能记得，在最黑的时候到底学到了什么。\n多数人不是死在底部。多数人死在从底部活过来以后，以为自己刀枪不入。\n市场会反复奖励勇敢。但它最终只长期奖励有纪律的人。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tig88411109/status/2124895673875415290","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":0,"vw":1878},{"id":"2124894361620209921","h":"darrencao2024","ts":1795449269,"zh":"还有线性外推的 说amd 博通和英特尔的CEO也会有类似下场😂","en":"还有线性外推的 说amd 博通和英特尔的CEO也会有类似下场😂","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2124894361620209921","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1248},{"id":"2124893975895228496","h":"octopusycc","ts":1795449177,"zh":"没有开通过tv会员的可以走这个链接 减免15刀\n普通用户开通Premium那一档就够了","en":"没有开通过tv会员的可以走这个链接 减免15刀\n普通用户开通Premium那一档就够了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2124893975895228496","l":["cn.tradingview.com"],"ln":[{"u":"https://cn.tradingview.com/black-friday/?share_your_love=zhangyuhang991","d":"cn.tradingview.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":2122},{"id":"2124893862829371638","h":"TraderS18","ts":1795449150,"zh":"近期行情之惨烈毋庸多言，纳指全年涨幅归零；英伟达股价腰斩；BTC下探55K。美联储9月重启加息之后市场风格180度大转向。后续12月至少还要再加一次。钱一贵，市场对故事的耐心就短了。\nRWA赛道默默发育很久了，链上已有 409 亿美元。问题是谁的收入已经落袋？OpenWorld @o 2124867598118707670","h":"fxtrader","ts":1795442888,"zh":"（全文）《英伟达董事会恢复黄仁勋总裁、首席执行官及董事职务》\n美国加利福尼亚州圣克拉拉，2026年11月23日——英伟达（NASDAQ： $NVDA ）今日宣布，即时生效，黄仁勋已恢复担任总裁兼首席执行官以及董事会成员。在与黄仁勋进行一系列讨论和会面后，董事会一致投票决定恢复其职务；此后，董事会对黄仁勋的坦诚以及领导英伟达的能力表示满意。在作出决定的过程中，董事会听取了美国政府高层的意见；基于这些意见，董事会确信黄仁勋的复职不构成国家安全风险。\n“董事会认为，黄仁勋是领导英伟达的合适人选，他的复职符合我们股东、员工、合作伙伴和客户的最佳利益，”董事会主席Harvey C. Jones表示，“我们对黄仁勋充满信心，期待在他恢复领导公司之际与他共事。我们感谢Colette Kress在担任临时首席执行官期间的出色服务，以及她继续履行英伟达首席财务官的职责。”Harvey Jones将继续担任董事会主席。\n“我很荣幸重返英伟达，并在新一轮工业革命开端之际，领导世界上最具影响力的科技公司之一，”黄仁勋表示，“我以最大的谦逊之心和全新的承诺承担这一责任。我要感谢英伟达董事会在这一过程中给予的信任与审慎考量。我特别感谢Harvey Jones作为主席所展现的领导力，感谢Colette Kress和我们的管理团队在此期间领导英伟达。我也要 deeply 感谢我们的员工、股东、业界领袖以及全球合作伙伴给予的非凡支持。最重要的是，感谢家人的爱与支持。我已迫不及待要回到工作中。”\n此前已宣布，鉴于近期有报道称黄仁勋已成为外国情报行动的目标，董事会成立了一个完全由独立董事组成的委员会进行调查，该委员会聘请了独立法律顾问协助调查。董事会重申，该委员会的调查将继续推进直至得出结论。黄仁勋完全支持这项调查，并承诺予以配合。\n董事会近期还成立了一个完全由独立董事组成的国家安全与出口管制委员会，负责监督贸易合规与国家安全风险。该委员会正在聘请具有国家安全事务经验的律师，这些律师将再行聘请具备国家安全事务专业知识的顾问。英伟达正在启动招聘程序，以填补一个新设职位——首席合规官，该职位将负责监督英伟达的整体合规事务，并向提名与公司治理委员会汇报。英伟达将继续配合正在进行的政府调查与问询。","en":"（全文）《英伟达董事会恢复黄仁勋总裁、首席执行官及董事职务》\n美国加利福尼亚州圣克拉拉，2026年11月23日——英伟达（NASDAQ： $NVDA ）今日宣布，即时生效，黄仁勋已恢复担任总裁兼首席执行官以及董事会成员。在与黄仁勋进行一系列讨论和会面后，董事会一致投票决定恢复其职务；此后，董事会对黄仁勋的坦诚以及领导英伟达的能力表示满意。在作出决定的过程中，董事会听取了美国政府高层的意见；基于这些意见，董事会确信黄仁勋的复职不构成国家安全风险。\n“董事会认为，黄仁勋是领导英伟达的合适人选，他的复职符合我们股东、员工、合作伙伴和客户的最佳利益，”董事会主席Harvey C. Jones表示，“我们对黄仁勋充满信心，期待在他恢复领导公司之际与他共事。我们感谢Colette Kress在担任临时首席执行官期间的出色服务，以及她继续履行英伟达首席财务官的职责。”Harvey Jones将继续担任董事会主席。\n“我很荣幸重返英伟达，并在新一轮工业革命开端之际，领导世界上最具影响力的科技公司之一，”黄仁勋表示，“我以最大的谦逊之心和全新的承诺承担这一责任。我要感谢英伟达董事会在这一过程中给予的信任与审慎考量。我特别感谢Harvey Jones作为主席所展现的领导力，感谢Colette Kress和我们的管理团队在此期间领导英伟达。我也要 deeply 感谢我们的员工、股东、业界领袖以及全球合作伙伴给予的非凡支持。最重要的是，感谢家人的爱与支持。我已迫不及待要回到工作中。”\n此前已宣布，鉴于近期有报道称黄仁勋已成为外国情报行动的目标，董事会成立了一个完全由独立董事组成的委员会进行调查，该委员会聘请了独立法律顾问协助调查。董事会重申，该委员会的调查将继续推进直至得出结论。黄仁勋完全支持这项调查，并承诺予以配合。\n董事会近期还成立了一个完全由独立董事组成的国家安全与出口管制委员会，负责监督贸易合规与国家安全风险。该委员会正在聘请具有国家安全事务经验的律师，这些律师将再行聘请具备国家安全事务专业知识的顾问。英伟达正在启动招聘程序，以填补一个新设职位——首席合规官，该职位将负责监督英伟达的整体合规事务，并向提名与公司治理委员会汇报。英伟达将继续配合正在进行的政府调查与问询。","zh_src":"native","lang":"zh","m":[],"  automakers face months of contentious labour talks and strikes over job cuts and potential factory closures as the model that underpinned the country's highly paid auto workforce breaks down.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2124797660267757590","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/business/world-at-work/german-automakers-face-winter-discontent-union-battles-loom-2026-11-23/?taid=6b0407a55f9bc3000128c530&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":214},{"id":"2124795087700074703","h":"CrushTheShorts","ts":1795425600,"zh":"摩根大通｜存储市场更新：全球TIG大会核心纪要\n摩根大通在香港全球TIG大会上分别会晤三星电子、SK海力士与铠侠。三家传递的信息高度一致：\n① 美国中期选举以来订单未发生变化；\n② 未来数年难以新增有意义的位元供给；\n③ 多年期长期协议（LTA）覆盖50%—70%的销售量。\n当前存储供给满足率仅60%—70%，三家均不认为2027年会改善。需求疲弱仅局限于消费级NAND，企业级市场已明显脱钩。\n摩根大通认为，当前出现了自2023年末AI兴起以来，投资界与企业界之间最大的情绪落差。尽管股价反映相反叙事，未来12—18个月存储供需仍将相当紧俏，维持全部存储制造商的增持评级。\n一、AI需求：订单稳定，推理拓宽存储需求\n三家制造商均对订单保持信心，铠侠甚至表示美国中期选举以来需求获得上修。\n供应商将数据中心建设延迟归因于监管环境变化（云服务商承担用电成本），认为AI建设放缓迹象有限。即便需求潜在放缓，非超大规模客户仍愿意承接当前未获满足的供给。\n今年AI训练仍占存储需求一半以上，预计2027年起推理将成为主要需求来源。\nKV-cache卸载主要发生在DRAM，但未来将形成分层化存储需求，与SK海力士的存储分层观点一致。\n二、传统DRAM最紧：满足率仅60%—70%\n多家供应商表示，2027年晶圆供给实质上已售罄，DRAM位元供给最大同比增幅约20%—25%。\n预计2027年供需缺口较2026年进一步扩大，2028年才有望部分缓解。\n各细分市场满足率：\n服务器DRAM/NAND及HBM： 处于60%以下或区间下沿；\n消费级DRAM/NAND： 处于区间上沿，其中消费级NAND最高；\n整体存储市场： 60%—70%，预计明年进一步恶化。\n即使采购需求放缓，供应商也仅将其视为缓解极端短缺。相比疫情期间约90%的满足率，当前供需仍极度紧张。\n三、HBM：重新定价成功，利润率差距收窄\n针对HBM由12层降至8层甚至4层的担忧，三星与SK海力士表示，降规格主要是为了增加HBM堆叠产品数量，确保终端系统出货。\n实际HBM含量下降可能有限：\n① 12层SKU仍在推进，占比可能高于市场预期；\n② DRAM核心裸片由24Gb升级至32Gb，提升单堆叠容量；\n③ ASIC需求更强，支撑HBM需求。\n供应商一致表示，2027年HBM价格谈判取得成功，有望显著收窄传统DRAM与HBM之间的利润率差距。\n与此同时，HBM晶圆配置比例未来数年仍将提高，持续挤占传统DRAM产能。\n即便DRAM晶圆月产能增长达到百分之十几，整体位元供给增幅仍受限于20%出头至中段区间。\n四、NAND：消费级与企业级明显分化\n与过去下行周期不同，本轮NAND市场呈现明显分层。\n消费级NAND需求走弱、现货价格下跌，但企业级SSD供需依然紧张。\n企业级SSD： 供给满足率仅50%出头；\n消费级NAND： 满足率70%以上；\n企业级SSD价格： 较客户端SSD存在约30%的溢价。\n中国NAND厂商主要集中于消费级NAND和客户端SSD，占其位元出货95%以上，对企业级SSD市场影响有限。\n现货交易占全球NAND制造商营收比例处于低个位数水平，企业级高密度TLC/QLC产品基本不存在现货市场。\n摩根大通不排除2027年消费级NAND定价情绪转弱，但受企业级SSD强劲需求支撑，整体NAND混合ASP仍有望上行。\n五、供给与资本开支：新增产能最早2028年明显释放\n洁净室不足、绿地晶圆厂建设周期延长、供给纪律及每比特资本开支上升，持续限制2027—2028年位元产出。\n各厂产能时间线：\n三星： P4剩余两个象限为2027年唯一可得洁净室空间，P5位元贡献最早2028年；\nSK海力士： Y1一期最早2027年末贡献产出；\n铠侠： 位元增长主要依赖技术迁移，新绿地厂最早2029年贡献产出。\n针对2027年位元供给超预期加速的可能性，三家均表示增产空间有限。\n摩根大通模型预计，至2028年DRAM供给年复合增长24%，晶圆月产能由2026年末210万片增至2028年末290万片，增加约78万片。\n六、长期协议：50%—70%销售量覆盖，设置价格下限\n本季LTA讨论热度有所下降，投资者更关注客户违约、放弃照付不议预付款或保证金等下行风险。\n价格区间成为判断LTA盈利可持续性的关键。\n虽然供应商未披露具体定价，但摩根大通认为，其暗示的利润率区间可能接近或高于AI时代之前的历史峰值。\n企业及服务器计算需求是LTA的核心领域，部分供应商也在企业级与消费级客户之间采取均衡策略。\n七、股东回报：增量更新有限\n三星电子： 重申2026年90万亿—110万亿韩元股东回报，正权衡剩余55万亿—75万亿韩元用于回购或分红，可能偏向优先股，预计2027年1月前更新政策。\nSK海力士： 公布2026财年100万亿韩元目标，并设定此后自由现金流50%的下限。公司表示，100万亿韩元现金目标约相当于两年资本开支，但随着投资承诺增加，净现金需求也在上升。\n铠侠： 维持超额现金100%返还目标，预计2027年3月季度披露增量股东回报政策。\nADR方面，SK海力士认为空间较大但存在监管瓶颈；三星视为中长期选项；铠侠预计最早2027年4月上市。","en":"摩根大通｜存储市场更新：全球TIG大会核心纪要\n摩根大通在香港全球TIG大会上分别会晤三星电子、SK海力士与铠侠。三家传递的信息高度一致：\n① 美国中期选举以来订单未发生变化；\n② 未来数年难以新增有意义的位元供给；\n③ 多年期长期协议（LTA）覆盖50%—70%的销售量。\n当前存储供给满足率仅60%—70%，三家均不认为2027年会改善。需求疲弱仅局限于消费级NAND，企业级市场已明显脱钩。\n摩根大通认为，当前出现了自2023年末AI兴起以来，投资界与企业界之间最大的情绪落差。尽管股价反映相反叙事，未来12—18个月存储供需仍将相当紧俏，维持全部存储制造商的增持评级。\n一、AI需求：订单稳定，推理拓宽存储需求\n三家制造商均对订单保持信心，铠侠甚至表示美国中期选举以来需求获得上修。\n供应商将数据中心建设延迟归因于监管环境变化（云服务商承担用电成本），认为AI建设放缓迹象有限。即便需求潜在放缓，非超大规模客户仍愿意承接当前未获满足的供给。\n今年AI训练仍占存储需求一半以上，预计2027年起推理将成为主要需求来源。\nKV-cache卸载主要发生在DRAM，但未来将形成分层化存储需求，与SK海力士的存储分层观点一致。\n二、传统DRAM最紧：满足率仅60%—70%\n多家供应商表示，2027年晶圆供给实质上已售罄，DRAM位元供给最大同比增幅约20%—25%。\n预计2027年供需缺口较2026年进一步扩大，2028年才有望部分缓解。\n各细分市场满足率：\n服务器DRAM/NAND及HBM： 处于60%以下或区间下沿；\n消费级DRAM/NAND： 处于区间上沿，其中消费级NAND最高；\n整体存储市场： 60%—70%，预计明年进一步恶化。\n即使采购需求放缓，供应商也仅将其视为缓解极端短缺。相比疫情期间约90%的满足率，当前供需仍极度紧张。\n三、HBM：重新定价成功，利润率差距收窄\n针对HBM由12层降至8层甚至4层的担忧，三星与SK海力士表示，降规格主要是为了增加HBM堆叠产品数量，确保终端系统出货。\n实际HBM含量下降可能有限：\n① 12层SKU仍在推进，占比可能高于市场预期；\n② DRAM核心裸片由24Gb升级至32Gb，提升单堆叠容量；\n③ ASIC需求更强，支撑HBM需求。\n供应商一致表示，2027年HBM价格谈判取得成功，有望显著收窄传统DRAM与HBM之间的利润率差距。\n与此同时，HBM晶圆配置比例未来数年仍将提高，持续挤占传统DRAM产能。\n即便DRAM晶圆月产能增长达到百分之十几，整体位元供给增幅仍受限于20%出头至中段区间。\n四、NAND：消费级与企业级明显分化\n与过去下行周期不同，本轮NAND市场呈现明显分层。\n消费级NAND需求走弱、现货价格下跌，但企业级SSD供需依然紧张。\n企业级SSD： 供给满足率仅50%出头；\n消费级NAND： 满足率70%以上；\n企业级SSD价格： 较客户端SSD存在约30%的溢价。\n中国NAND厂商主要集中于消费级NAND和客户端SSD，占其位元出货95%以上，对企业级SSD市场影响有限。\n现货交易占全球NAND制造商营收比例处于低个位数水平，企业级高密度TLC/QLC产品基本不存在现货市场。\n摩根大通不排除2027年消费级NAND定价情绪转弱，但受企业级SSD强劲需求支撑，整体NAND混合ASP仍有望上行。\n五、供给与资本开支：新增产能最早2028年明显释放\n洁净室不足、绿地晶圆厂建设周期延长、供给纪律及每比特资本开支上升，持续限制2027—2028年位元产出。\n各厂产能时间线：\n三星： P4剩余两个象限为2027年唯一可得洁净室空间，P5位元贡献最早2028年；\nSK海力士： Y1一期最早2027年末贡献产出；\n铠侠： 位元增长主要依赖技术迁移，新绿地厂最早2029年贡献产出。\n针对2027年位元供给超预期加速的可能性，三家均表示增产空间有限。\n摩根大通模型预计，至2028年DRAM供给年复合增长24%，晶圆月产能由2026年末210万片增至2028年末290万片，增加约78万片。\n六、长期协议：50%—70%销售量覆盖，设置价格下限\n本季LTA讨论热度有所下降，投资者更关注客户违约、放弃照付不议预付款或保证金等下行风险。\n价格区间成为判断LTA盈利可持续性的关键。\n虽然供应商未披露具体定价，但摩根大通认为，其暗示的利润率区间可能接近或高于AI时代之前的历史峰值。\n企业及服务器计算需求是LTA的核心领域，部分供应商也在企业级与消费级客户之间采取均衡策略。\n七、股东回报：增量更新有限\n三星电子： 重申2026年90万亿—110万亿韩元股东回报，正权衡剩余55万亿—75万亿韩元用于回购或分红，可能偏向优先股，预计2027年1月前更新政策。\nSK海力士： 公布2026财年100万亿韩元目标，并设定此后自由现金流50%的下限。公司表示，100万亿韩元现金目标约相当于两年资本开支，但随着投资承诺增加，净现金需求也在上升。\n铠侠： 维持超额现金100%返还目标，预计2027年3月季度披露增量股东回报政策。\nADR方面，SK海力士认为空间较大但存在监管瓶颈；三星视为中长期选项；铠侠预计最早2027年4月上市。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2124795087700074703","l":[],"ln":[],"t":["财报"],"lk":0,"rt":0,"rp":1,"vw":484},{"id":"2124793661917638740","h":"cnfinancewatch","ts":1795425260,"zh":"一直在 #回关\n没有回关到的，请等待。每天都有总量限制！","en":"一直在 #回关\n没有回关到的，请等待。每天都有总量限制！","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXzIkVtbUAAevqW.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2124793661917638740","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":852},{"id":"2124792327067541793","h":"AntonLaVay","ts":1795424942,"zh":"很简单，对吧，老黄回来概率提升就是涨，概率下降就是跌…\n直接去Polymarket猜下一任CEO不变，是一种不错的期权，输了归零，赢了接近6倍。","en":"很简单，对吧，老黄回来概率提升就是涨，概率下降就是跌…\n直接去Polymarket猜下一任CEO不变，是一种不错的期权，输了归零，赢了接近6倍。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXzHW9wXAAAD1ym.jpg?name=orig"],"u":"https://x.com/AntonLaVay/status/2124792327067541793","l":[],"ln":[],"t":[], 体很薄，更像止跌。触发是放量站上270.57并站稳，失效是跌破268.42，再往下是20日低264.20。半仓。\n #TJX公司 $TJX 收139.62涨0.15%，20日区间位置59.0%，区间中部。11月18日已经反弹8.05%，距20日高146.73还有5.09%，董事买入约20万美元只是轻量利多，资金共振0项。观察，不是突破准备。触发要放量接近或站上146.73，失效看138.31。\n #摩托罗拉解决方案 $MSI\n收520.21跌0.33%，20日区间位置61.7%，中上部。积压订单和提高股息是中等事件，期权三项偏多共振成立，但距20日高548.29还有5.40%，位置不够。仅观察。失效看487.11。\n #微软 $MSFT 收484.52跌2.77%，20日区间位置4.5%，靠近20日低481.03，箱底未企稳，最近一根是阴线，期权只有单项Call，不进只做。观察。失效看481.03。\n #苹果 $AAPL 收342.56跌1.90%，20日区间位置48.5%，中部。最大Put贴近现价，P/C成交比2.27偏空，不做。观察。失效看335.53。\n名单只给五只，不足不凑。\n#小盘阿尔法\n本档不选。 $OFRM 市值偏小且有董事买入，但收在20日区间中部，近五日已经反弹26.11%，周五收弱，近四周EPS下修14家，经营现金流仍为负，位置和基本面都过不了。\n$LUXE、$RSKD 有内部人卖出，同样不选。\n#操作提示\n周一早盘期货反弹幅度不小，但对应的是周五已经完成的暴跌，不宜把反弹当成AI硬件的买点。只做仓位如果要开，就留在 $JNJ\n半仓，看它能不能站稳箱底。感恩节短周流动性会变差，周三PCE和本周科技财报都可能重新定价。恐慌贪婪指数按原邮件口径报9.7，极端恐惧可以解释反弹，但不能单独当成抄底信号。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124777516166758524","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["财报"],"lk":1,"rt":0,"rp":1,"vw":561},{"id":"2124777232459764054","h":"cnfinancewatch","ts":1795421343,"zh":"美股盘前第一版\n周五把三大指数都打进了技术性调整。标普500收6910.39跌3.70%，近五日跌8.61%；纳指收22617.73跌5.28%，近五日跌10.02%，并转年内下跌；道指收48147.33跌1.93%，近五日跌8.02%。波动率指数收35.89。\n#英伟达 $NVDA 收125.53跌14.01%，几乎打在20日低点124.50。今日不硬做进攻。只做一个大类：生物医药创新，代表 #强生\n$JNJ。消费相对抗跌，只观察。AI硬件明确不做。\n如果只做3只：第一只 #强生 $JNJ，箱底企稳，CAPLYTA补充申报已交到FDA，期权两项偏多共振。第二、第三位空着。原邮件把\n$TJX、$MSI 也列入只做，但用截至11月20日的完整日线核验后， $TJX 收在20日区间中部、距20日高仍有5.09%， $MSI\n收在区间中上部、距20日高5.40%，都不算突破准备或箱底，事件和期权不能改写位置。\n明确不做：AI硬件追涨、已经走在20日高位附近的天然气商品、没有企稳蜡烛的箱底左侧，以及期权偏空的 #苹果 $AAPL。\n#消息面\n周末到周一早盘，股指期货自周五低位反弹。北京时间约15:17，标普迷你约7088.5点，较周五期货收盘6935点涨约2.21%；纳指迷你约25868点涨约2.95%；道指迷你约48969点涨约1.56%；罗素2000迷你约2638.5点涨约1.97%。这是连跌多个交易日后的超卖反弹，还不是新的趋势信号。公开报道把本轮调整主要归因于对AI资本开支回报的担忧、Anthropic上市后表现偏弱，以及中期选举后的政策预期变化。特朗普公开呼吁英伟达重新聘用黄仁勋，这是消息，不是买点。本周是感恩节短周，周三有10月PCE，今晚有\n$HPE 等财报，周二盘后还有\n$DELL。A股周一并未跟砸，上证3538.95涨0.15%，深证10454.37涨1.93%，创业板2280.20涨3.08%，科创50\n1227.89跌0.26%。\n#强生 $JNJ 在11月19日向FDA提交CAPLYTA用于成人双相I障碍躁狂或混合发作的补充新药申请，两份三期显示躁狂症状改善最早可在第3天出现，若获批将成为该药在成人中的第五个适应症。这是已发生的中等权重事件，不是当天批准。\n#研报面\n近12至24小时未见头部大行对名单股大幅上调目标价，事件权重最高档本轮是空的。卖方共识按分析师库口径： $JNJ\n目标价均值289.88，买入11家、持有6家、卖出0家，近四周EPS上修1家下修2家； $TJX\n目标价均值162.69，买入9家持有6家，近四周上修5家下修7家； $MSFT\n目标价均值632.48，买入34家，近四周上修39家，但股价仍在寻底，研报再乐观也要等企稳； $AAPL\n目标价均值343.69几乎贴着现价342.56，近四周下修16家多于上修9家。 $MSI 目标价共识未采集。\n#资金面\nARK在11月20日出现多只两基金同买，必须写入：ARKK与ARKW同买 $SPCX 合计约2240万美元、 $CRWV 约2170万美元、\n$CBRS 约2120万美元、 $AMD 约2110万美元；ARKG与ARKK同买 $TWST\n约1000万美元。同买成立，但这五只周五都还在下跌通道里，没有企稳蜡烛，不能因为ARK就改成只做。带方向的期权： $JNJ\n最大Call行权价282.5、量仓比25.73，P/C成交比0.26，两项同向，算共振； $MSI\nCall持仓增仓8.9%、Call成交放量278%、P/C成交比0.19，三项同向，但位置偏高，只记资金、不升级名单； $SPCX\n最大Call行权价131距现价约+2.51%、量仓比926.04，与ARK同买构成共振，K线未过。 $TWST\n的Put成交放量不算偏多期权。 $AAPL 最大Put行权价340距现价-0.75%，P/C成交比2.27，偏空。 $NVDA、$TSLA\n最大Call距离现价分别约9.06%、7.71%，且Call持仓大幅减仓，不把裸量仓比写成多头共振。做空余额按原邮件口径， $AAPL\n环比增10.03%， $CBRS 环比增11.77%，与多头共振相反，要留神。\n#期货\n周五完整交易日，股指期货与现货一起下跌，标普迷你收6935跌3.64%，纳指迷你收25126.5跌5.54%。原邮件给出的OI是增加的：标普迷你未平仓量213.92万、日增8.04万、量比1.28；纳指迷你未平仓量30.97万、日增2.46万、量比1.22。按价跌、OI增，更接近新空进场，但量比刚过放量线，不宜写太死。黄金期货周五收3515.4跌4.62%，原油收83.98涨0.93%，与原邮件按盘前价格做的OI定性并不一致，本档以完整日线核对价格，OI数字照录、方向标暂不沿用。周一早盘是另一回事：黄金约3634.9，较周五收盘涨约3.40%；原油约83.14，跌约1.00%；铜约5.543，涨约1.21%；白银约42.77，涨约4.23%；比特币期货约61470，涨约5.43%；十年期美债期货约106.58，较周五收盘106.84跌约0.25%。反弹日的OI要等完整交易日再看。\n#中美映射\n美股行业ETF用截至11月20日的完整日线。20日涨幅靠前的是 $UNG 涨10.23%、 $JETS 涨3.91%、 $FIW\n涨2.78%、 $XLP 涨2.49%、 $KIE 涨1.81%、 $IHE 涨1.79%。5日只有 $UNG 涨4.04%、 $TLT\n涨2.61%还是正的，其余主要行业ETF都是负的。双窗口同现只有\n$UNG，但它已经收在20日区间92.6%、距20日高仅1.23%，又偏商品属性，只观察、不作为只做方向。 $XLP\n仅20日为正、5日跌2.05%，属于趋势还在、尚未加速。 $IHE 20日仅涨1.79%，5日跌6.03%，制药也在回撤。科技侧更弱：\n$SMH 20日跌24.12%、5日跌17.81%， $SOXX、$XLK、$ARKK 都在20日区间底部。","en":"美股盘前第一版\n周五把三大指数都打进了技术性调整。标普500收6910.39跌3.70%，近五日跌8.61%；纳指收22617.73跌5.28%，近五日跌10.02%，并转年内下跌；道指收48147.33跌1.93%，近五日跌8.02%。波动率指数收35.89。\n#英伟达 $NVDA 收125.53跌14.01%，几乎打在20日低点124.50。今日不硬做进攻。只做一个大类：生物医药创新，代表 #强生\n$JNJ。消费相对抗跌，只观察。AI硬件明确不做。\n如果只做3只：第一只 #强生 $JNJ，箱底企稳，CAPLYTA补充申报已交到FDA，期权两项偏多共振。第二、第三位空着。原邮件把\n$TJX、$MSI 也列入只做，但用截至11月20日的完整日线核验后， $TJX 收在20日区间中部、距20日高仍有5.09%， $MSI\n收在区间中上部、距20日高5.40%，都不算突破准备或箱底，事件和期权不能改写位置。\n明确不做：AI硬件追涨、已经走在20日高位附近的天然气商品、没有企稳蜡烛的箱底左侧，以及期权偏空的 #苹果 $AAPL。\n#消息面\n周末到周一早盘，股指期货自周五低位反弹。北京时间约15:17，标普迷你约7088.5点，较周五期货收盘6935点涨约2.21%；纳指迷你约25868点涨约2.95%；道指迷你约48969点涨约1.56%；罗素2000迷你约2638.5点涨约1.97%。这是连跌多个交易日后的超卖反弹，还不是新的趋势信号。公开报道把本轮调整主要归因于对AI资本开支回报的担忧、Anthropic上市后表现偏弱，以及中期选举后的政策预期变化。特朗普公开呼吁英伟达重新聘用黄仁勋，这是消息，不是买点。本周是感恩节短周，周三有10月PCE，今晚有\n$HPE 等财报，周二盘后还有\n$DELL。A股周一并未跟砸，上证3538.95涨0.15%，深证10454.37涨1.93%，创业板2280.20涨3.08%，科创50\n1227.89跌0.26%。\n#强生 $JNJ 在11月19日向FDA提交CAPLYTA用于成人双相I障碍躁狂或混合发作的补充新药申请，两份三期显示躁狂症状改善最早可在第3天出现，若获批将成为该药在成人中的第五个适应症。这是已发生的中等权重事件，不是当天批准。\n#研报面\n近12至24小时未见头部大行对名单股大幅上调目标价，事件权重最高档本轮是空的。卖方共识按分析师库口径： $JNJ\n目标价均值289.88，买入11家、持有6家、卖出0家，近四周EPS上修1家下修2家； $TJX\n目标价均值162.69，买入9家持有6家，近四周上修5家下修7家； $MSFT\n目标价均值632.48，买入34家，近四周上修39家，但股价仍在寻底，研报再乐观也要等企稳； $AAPL\n目标价均值343.69几乎贴着现价342.56，近四周下修16家多于上修9家。 $MSI 目标价共识未采集。\n#资金面\nARK在11月20日出现多只两基金同买，必须写入：ARKK与ARKW同买 $SPCX 合计约2240万美元、 $CRWV 约2170万美元、\n$CBRS 约2120万美元、 $AMD 约2110万美元；ARKG与ARKK同买 $TWST\n约1000万美元。同买成立，但这五只周五都还在下跌通道里，没有企稳蜡烛，不能因为ARK就改成只做。带方向的期权： $JNJ\n最大Call行权价282.5、量仓比25.73，P/C成交比0.26，两项同向，算共振； $MSI\nCall持仓增仓8.9%、Call成交放量278%、P/C成交比0.19，三项同向，但位置偏高，只记资金、不升级名单； $SPCX\n最大Call行权价131距现价约+2.51%、量仓比926.04，与ARK同买构成共振，K线未过。 $TWST\n的Put成交放量不算偏多期权。 $AAPL 最大Put行权价340距现价-0.75%，P/C成交比2.27，偏空。 $NVDA、$TSLA\n最大Call距离现价分别约9.06%、7.71%，且Call持仓大幅减仓，不把裸量仓比写成多头共振。做空余额按原邮件口径， $AAPL\n环比增10.03%， $CBRS 环比增11.77%，与多头共振相反，要留神。\n#期货\n周五完整交易日，股指期货与现货一起下跌，标普迷你收6935跌3.64%，纳指迷你收25126.5跌5.54%。原邮件给出的OI是增加的：标普迷你未平仓量213.92万、日增8.04万、量比1.28；纳指迷你未平仓量30.97万、日增2.46万、量比1.22。按价跌、OI增，更接近新空进场，但量比刚过放量线，不宜写太死。黄金期货周五收3515.4跌4.62%，原油收83.98涨0.93%，与原邮件按盘前价格做的OI定性并不一致，本档以完整日线核对价格，OI数字照录、方向标暂不沿用。周一早盘是另一回事：黄金约3634.9，较周五收盘涨约3.40%；原油约83.14，跌约1.00%；铜约5.543，涨约1.21%；白银约42.77，涨约4.23%；比特币期货约61470，涨约5.43%；十年期美债期货约106.58，较周五收盘106.84跌约0.25%。反弹日的OI要等完整交易日再看。\n#中美映射\n美股行业ETF用截至11月20日的完整日线。20日涨幅靠前 "u":"https://x.com/cnfinancewatch/status/2124762423483908605","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":2,"vw":1330},{"id":"2124762089822789658","h":"cnfinancewatch","ts":1795417733,"zh":"我们说过，股市要反弹，说先要观察黄金\n黄金会走在股市的前面","en":"我们说过，股市要反弹，说先要观察黄金\n黄金会走在股市的前面","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXyrwmzb0AAU-gf.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2124762089822789658","l":[],"ln":[],"t":["黄金"],"lk":0,"rt":0,"rp":0,"vw":1142},{"id":"2124761473750859982","h":"CrushTheShorts","ts":1795417586,"zh":"Bloom Energy的成长之路\n1、创业期（2001-2010）\nNASA航天技术起步，顶级VC超6亿美元注资，完成SOFC专利布局，联合谷歌、沃尔玛等完成技术实证。\n2、商业扩张期（2010-2018）\nPPA模式降低客户门槛，锁定全球头部企业，登陆纳斯达克。\n3、上市后阵痛期（2018-2021）\nPPA重资产拖累，早期产品寿命与预期存在差距，2018-2021年累计亏损超9亿$；靠PPA出清、降本增效、与韩国SK合作推进SOEC商业化走出低谷。\n4、转折与放量期（2021-2023）\n电堆寿命改善与韩国市场规模效应，2022年营收首破10亿$、积压订单超100亿$，SOEC产能全球领先，2021Q1服务毛利率历史性转正。\n5、高速增长期（2024至今）\n直击AI缺电痛点，以“55-90天交付、99.999%可用性、原生800V直供”跃升为主电源平台，CoreWeave、AEP、Equinix、Oracle、Brookfield、Nebius等头部客户订单集中落地，完成向AI核心基础设施供应商的定位升级。\n⸻\nBloom Energy全景分析\n1、产品全景\nEnergy Server（发电）+ Electrolyzer（电解制氢）。\nBloom SOFC发电效率达65%，热电联产超90%，优于其他燃料电池路线；SOEC制氢效能优于PEM、碱性电解。\n2、商业模式\n由重资产PPA转向轻资产直销。截至2025年末累计装机超1.5GW，总积压订单约200亿$，新增产品100%附带长期服务合同。\n3、客户结构\n形成三角支撑格局，传统工商业提供存量；韩国SK长协锁定海外业绩；AI数据中心以GW级订单成增长引擎。\n4、订单情况\n量级由2024年MW级试点跨越至2025年后GW级，AEP、BFC Power、Oracle、NTT DATA框架合计超5GW。\n5、降本空间\n采用YSZ+SCSZ复合电解质兼顾性能与成本；原生800V直供省去变流设备；目前单位系统成本已接近联合循环燃气轮机（~2000美元/kW）；在燃机排产积压至2030年后背景下，伴随规模化降本，SOFC经济性有望超越燃气轮机。\n⸻\n核心逻辑\nAI数据中心供电需求激增与电网扩容周期漫长形成错配，SOFC凭借高效、快部署、高可靠及离网运行优势，迎来规模化放量机遇。\n叠加政策支持，具备核心材料壁垒及系统集成能力的厂商将显著受益。","en":"Bloom Energy的成长之路\n1、创业期（2001-2010）\nNASA航天技术起步，顶级VC超6亿美元注资，完成SOFC专利布局，联合谷歌、沃尔玛等完成技术实证。\n2、商业扩张期（2010-2018）\nPPA模式降低客户门槛，锁定全球头部企业，登陆纳斯达克。\n3、上市后阵痛期（2018-2021）\nPPA重资产拖累，早期产品寿命与预期存在差距，2018-2021年累计亏损超9亿$；靠PPA出清、降本增效、与韩国SK合作推进SOEC商业化走出低谷。\n4、转折与放量期（2021-2023）\n电堆寿命改善与韩国市场规模效应，2022年营收首破10亿$、积压订单超100亿$，SOEC产能全球领先，2021Q1服务毛利率历史性转正。\n5、高速增长期（2024至今）\n直击AI缺电痛点，以“55-90天交付、99.999%可用性、原生800V直供”跃升为主电源平台，CoreWeave、AEP、Equinix、Oracle、Brookfield、Nebius等头部客户订单集中落地，完成向AI核心基础设施供应商的定位升级。\n⸻\nBloom Energy全景分析\n1、产品全景\nEnergy Server（发电）+ Electrolyzer（电解制氢）。\nBloom SOFC发电效率达65%，热电联产超90%，优于其他燃料电池路线；SOEC制氢效能优于PEM、碱性电解。\n2、商业模式\n由重资产PPA转向轻资产直销。截至2025年末累计装机超1.5GW，总积压订单约200亿$，新增产品100%附带长期服务合同。\n3、客户结构\n形成三角支撑格局，传统工商业提供存量；韩国SK长协锁定海外业绩；AI数据中心以GW级订单成增长引擎。\n4、订单情况\n量级由2024年MW级试点跨越至2025年后GW级，AEP、BFC Power、Oracle、NTT DATA框架合计超5GW。\n5、降本空间\n采用YSZ+SCSZ复合电解质兼顾性能与成本；原生800V直供省去变流设备；目前单位系统成本已接近联合循环燃气轮机（~2000美元/kW）；在燃机排产积压至2030年后背景下，伴随规模化降本，SOFC经济性有望超越燃气轮机。\n⸻\n核心逻辑\nAI数据中心供电需求激增与电网扩容周期漫长形成错配，SOFC凭借高效、快部署、高可靠及离网运行优势，迎来规模化放量机遇。\n叠加政策支持，具备核心材料壁垒及系统集成能力的厂商将显著受益。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2124761473750859982","l":[],"ln":[],"t":["美股","原油能源","财报"],"lk":5,"rt":0,"rp":0,"vw":1441},{"id":"2124760597657166278","h":"cnfinancewatch","ts":1795417377,"zh":"关于基金和券商的关系：\n本轮科技成长4-6月中旬大涨，基金券商研报合力推动。\n五月底六月初我从美日韩考察结束，关闭订阅提出科技成长要跌两次50%的判断。\n但是在七月八月大跌中，基金券商联手发布看多科技研报，鼓励散户基民逆势加仓！这个过程实际上保险资金是受害的，他们按照卖方研报加仓之后突然发现加错了，立即转手亏本也卖，导致七八月a轮大跌之后科技成长十月十一继续c轮大跌，a和c轮都是-30%以上的快速暴跌，锁死散户和基民。\n这个过程中一直伴随着券商和基金的看多研报。\n结论是什么？报团行情多数由券商基金结合发起，最终也由他们多杀多终结，但股民基民永远受伤。","en":"关于基金和券商的关系：\n本轮科技成长4-6月中旬大涨，基金券商研报合力推动。\n五月底六月初我从美日韩考察结束，关闭订阅提出科技成长要跌两次50%的判断。\n但是在七月八月大跌中，基金券商联手发布看多科技研报，鼓励散户基民逆势加仓！这个过程实际上保险资金是受害的，他们按照卖方研报加仓之后突然发现加错了，立即转手亏本也卖，导致七八月a轮大跌之后科技成长十月十一继续c轮大跌，a和c轮都是-30%以上的快速暴跌，锁死散户和基民。\n这个过程中一直伴随着券商和基金的看多研报。\n结论是什么？报团行情多数由券商基金结合发起，最终也由他们多杀多终结，但股民基民永远受伤。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124760597657166278","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":302},{"id":"2124759952916963343","h":"ReutersChina","ts":1795417223,"zh":"周一公布的一份政府蓝图显示，中国正在出台措施，到2030年升级老年人和儿童护理设施，旨在适应人口迅速老龄化和出生率下降的情况。","en":"China is introducing measures to upgrade care facilities for older people and children by 2030, aiming to adapt to a rapidly aging population and falling birth rates, a government blueprint showed on Monday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/Reute ":1795417061,"zh":"A股盘中 2026年11月23日 周一 数据截至约14:44\n#结论 今天是周五的对倒日。上证低开3503.52之后，盘中最低见到3476.65，跌破周五低点3500.83，随后收回，截至14:44报3525.61，跌0.23%。结构完全翻过来：创业板报2274.75，涨2.83%；中证1000报5799.29，涨2.67%；上证50报2751.23，跌1.25%；科创50报1225.50，跌0.45%，被半导体制造和设备拖住。两市上涨约4405家、下跌约848家，涨停约139家、跌停约4家，和周五普跌正好相反。银行和高股息在回吐周五的涨幅，\n#工商银行 $601398 跌破早盘提示的9.2元；资金转到PCB、光模块，以及机器人、影视这些超跌方向。这是超跌修复加风格切换，还不是趋势反转，连板和20厘米涨停不要追。\n#消息面\n盘中韩国综指收跌3.32%，亚洲芯片股没有跟上A股的反弹，早盘提示过的背离还在。美股期指继续维持反抽，给了成长股修复的气氛，但美股要到晚上才开盘，期指涨幅还不能当成已经兑现。国内方面，首批主动ETF今日挂牌，国家发改委等部门发布“一老一小”服务体系建设方案；\n#复星医药 $600196 披露回购方案。盘中快讯称通信板块资金净流入较多，和行情对得上。外部仍要看中东和美联储：有报道称12月加息概率不再是百分之百，高盛则认为三大条件满足之前市场难言触底，这两条都是转述，不是已核事实。\n#研报面\n今日新出的研报里，开源给 #巨化股份 $600160 买入，看点是控股股东拟增持和制冷剂需求；华鑫给 #川润股份 $002272\n增持，逻辑是加码液冷。周末到今天，半导体一侧仍有太平洋给 #兆易创新 $603986、华安给 #澜起科技 $688008、国金给 #北方华创\n$002371 的买入评级。研报偏中期，今天价格已经走出短线修复，但 #北方华创 $002371 跌超6%，设备这条还没跟上。\n#热榜\n东财人气榜前列是 #中京电子 $002579、 #九阳股份 $002242、 #宇树科技 $688836、 #冰山冷热 $000530、\n#新易盛 $300502、 #中际旭创 $300308、 #东山精密 $002384、 #天孚通信\n$300394，和PCB、光模块、机器人、小家电涨停共振。同花顺热榜本档未取到。\n#资金面\n截至约14:44，沪市成交约6889.56亿元，深市约7651.31亿元，两市合计约1.45万亿元，和周五的1.42万亿元相当，是放量翻脸而不是缩量修补。主力资金口径，上证净流入约80.3亿元，深证约143.3亿元，两市合计净流入约223.6亿元。印制电路板净流入约44.2亿元，涨4.76%；元件净流入约50.3亿元，涨4.85%。个股上，\n#中际旭创 $300308、 #新易盛 $300502、 #天孚通信 $300394、 #东山精密 $002384\n排在流入前列。北向实时数据本档未披露。跌停名单未完整返回。","en":"A股盘中 2026年11月23日 周一 数据截至约14:44\n#结论 今天是周五的对倒日。上证低开3503.52之后，盘中最低见到3476.65，跌破周五低点3500.83，随后收回，截至14:44报3525.61，跌0.23%。结构完全翻过来：创业板报2274.75，涨2.83%；中证1000报5799.29，涨2.67%；上证50报2751.23，跌1.25%；科创50报1225.50，跌0.45%，被半导体制造和设备拖住。两市上涨约4405家、下跌约848家，涨停约139家、跌停约4家，和周五普跌正好相反。银行和高股息在回吐周五的涨幅，\n#工商银行 $601398 跌破早盘提示的9.2元；资金转到PCB、光模块，以及机器人、影视这些超跌方向。这是超跌修复加风格切换，还不是趋势反转，连板和20厘米涨停不要追。\n#消息面\n盘中韩国综指收跌3.32%，亚洲芯片股没有跟上A股的反弹，早盘提示过的背离还在。美股期指继续维持反抽，给了成长股修复的气氛，但美股要到晚上才开盘，期指涨幅还不能当成已经兑现。国内方面，首批主动ETF今日挂牌，国家发改委等部门发布“一老一小”服务体系建设方案；\n#复星医药 $600196 披露回购方案。盘中快讯称通信板块资金净流入较多，和行情对得上。外部仍要看中东和美联储：有报道称12月加息概率不再是百分之百，高盛则认为三大条件满足之前市场难言触底，这两条都是转述，不是已核事实。\n#研报面\n今日新出的研报里，开源给 #巨化股份 $600160 买入，看点是控股股东拟增持和制冷剂需求；华鑫给 #川润股份 $002272\n增持，逻辑是加码液冷。周末到今天，半导体一侧仍有太平洋 断的资本供给时，最大的风险并不是黄仁勋能否回归，而是放贷方是否还会回来。","en":"大多数投资者都在盯着科技股，却忽略了 AI 信贷市场正在发生的事：\n据报道，汇丰以约 85 美分兑 1 美元的价格出售了 3 亿美元的数据中心贷款，折价 15%。荷兰国际集团（ING）也试图出售另外 5 亿美元，但未能以可接受的价格吸引到足够的买盘，目前正在逐笔协商出售。\n路透社还报道称，银行越来越不愿意为新增的 AI 项目提供融资，即使这些项目有大型科技公司作为后盾。\n时机再糟糕不过。高盛估计，超大规模云厂商（hyperscaler）的债券发行量将激增 68%，从 2026 年的 2500 亿美元增至 2027 年的 4200 亿美元，而这恰恰是贷款机构变得更加谨慎的时候。\n这场戏我以前看过。正如我在书中所讨论的，页岩油热潮和加拿大大麻产业都建立在对未来增长的巨大预期之上，并假定资金会一直唾手可得。我亲眼见证了这两个行业在预期与实际交付之间出现落差时，会发生什么。\nAI 或许真的会改变世界，就像页岩技术改变了美国的能源生产一样。但这并不意味着每一美元的投资都能获得足够的回报。当一轮投资热潮依赖于源源不断的资本供给时，最大的风险并不是黄仁勋能否回归，而是放贷方是否还会回来。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124731634012590550","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":167},{"id":"2124731257829675164","h":"bboczeng","ts":1795410382,"zh":"Meta 2049 年到期的AI债券回报率在7.4%，也就是说，如果拿满，你能用22年的时间赚162%\n前提是Meta不会倒闭破产，你会去买嘛？\n谢谢大家","en":"Meta 2049 年到期的AI债券回报率在7.4%，也就是说，如果拿满，你能用22年的时间赚162%\n前提是Meta不会倒闭破产，你会去买嘛？\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124731257829675164","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":215},{"id":"2124730551718564013","h":"dmjk001","ts":1795410213,"zh":"13:01【两融保证金下调11月30日实施 频繁异常交易、涉嫌违法违规投资者将被依法采取限制性措施】财联社11月23日电，沪深北交易所将于11月30日正式下调两融保证金比例，从现行的100%下调至80%。记者最新获悉，监管已向券商下发通知，要求做好两融逆周期调节，包括券商要确保政策稳妥实施，要求各公司基于交易所公布的标准范围，对保证金比例实施动态管理与差异化控制，及时完成系统参数调整与测试验证，并做好政策解读与风险揭示。值得关注的是，通知明确本次保证金比例调整同时适用于新开仓合约及存量合约，投资者不必了结存量合约即可适用新的指标，券商需将相关安排有效传达至投资者，避免因政策理解偏差引发不必要的调仓交易。监管明确，券商要做好客户交易行为管理。通知要求对存在异常交易行为的投资者采取差异化管控，从严适用保证金比例、折算率等风控指标，审慎控制授信规模及交易费率，对频繁异常交易或涉嫌违法违规的投资者依法采取必要限制性措施。 （财联社记者 林坚）","en":"13:01【两融保证金下调11月30日实施 频繁异常交易、涉嫌违法违规投资者将被依法采取限制性措施】财联社11月23日电，沪深北交易所将于11月30日正式下调两融保证金比例，从现行的100%下调至80%。记者最新获悉，监管已向券商下发通知，要求做好两融逆周期调节，包括券商要确保政策稳妥实施，要求各公司基于交易所公布的标准范围，对保证金比例实施动态管理与差异化控制，及时完成系统参数调整与测试验证，并做好政策解读与风险揭示。值得关注的是，通知明确本次保证金比例调整同时适用于新开仓合约及存量合约，投资者不必了结存量合约即可适用新的指标，券商需将相关安排有效传达至投资者，避免因政策理解偏差引发不必要的调仓交易。监管明确，券商要做好客户交易行为管理。通知要求对存在异常交易行为的投资者采取差异化管控，从严适用保证金比例、折算率等风控指标，审慎控制授信规模及交易费率，对频繁异常交易或涉嫌违法违规的投资者依法采取必要限制性措施。 （财联社记者 林坚）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2124730551718564013","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":379},{"id":"2124730262408012145","h":"bboczeng","ts":1795410144,"zh":"将本周文章的精华部分摘抄如下：\nSNDK，KOSPI和ARKK相似，都是在第一次接近90度垂直上涨的大峰后，因去杠杆等技术性原因下跌，随后迎来了第二次圆顶反弹。但反弹失败意味着机构资金正式跑路，接下来就开启了真正的下跌。\n这是一种类似双顶的结构，但又不是真正的M顶，因为第一个顶明显比第二个顶更尖锐。从这些观察出发，我们可以得出如下有参考意义的结论：\n1. 在动量行情的炒作中，第一个顶部出现是技术性的，也就是所谓的blow off the top + deleveraging。股价因为gamma squeeze而大涨，也是因为做多杠杆爆仓而下跌。一旦杠杆被清理干净，第一批正股抄底者入场，引发了随后的反弹。这给我们的教训是，在第一次暴跌后，确实可以等待第二次反弹再清仓。\n2. 第二个圆弧顶则是机构派发导致的。抄底资金接盘，但是真正的早期投资者和机构资金实际上已经开始跑路。最终接盘能量不足，引发流动性危机，最后开启了真正的暴跌。在这个过程中，我们能够总结出的教训是：绝对不能抄底，不能接飞刀，而是要坚决止损，尽早离场。\n这两个阶段，实际上可以归纳在动量崩盘几何学中，他几乎是一个不变量。不仅在ARKK中有效，在SNDK中有效，在KOSPI中有效，甚至在最后下跌的SOXX中我们都能看到他的影子 动量崩盘的机制，本质上是第一次杠杆崩塌+主力资金撤退导致的。\n这种形态的出现，实际上也意味着整个行情的结束。我们会发现，ARKK随后跌回来2019年的起点，要在接近4年之后才开始了一次有意义的触底反弹","en":"将本周文章的精华部分摘抄如下：\nSNDK，KOSPI和ARKK相似，都是在第一次接近90度垂直上涨的大峰后，因去杠杆等技术性原因下跌，随后迎来了第二次圆顶反弹。但反弹失败意味着机构资金正式跑路，接下来就开启了真正的下跌。\n这是一种类似双顶的结构，但又不是真正的M顶，因为第一个顶明显比第二个顶更尖锐。从这些观察出发，我们可以得出如下有参考意义的结论：\n1. 在动量行情的炒作中，第一个顶部出现是技术性的，也就是所谓的blow off the top + deleveraging。股价因为gamma squeeze而大涨，也是因为做多杠杆爆仓而下跌。一旦杠杆被清理干净，第一批正股抄底者入场，引发了随后的反弹。这给我们的教训是，在第一次暴跌后，确实可以等待第二次反弹再清仓。\n2. 第二个圆弧顶则是机构派发导致的。抄底资金接盘，但是真正的早期投资者和机构资金实际上已经开始跑路。最终接盘能量不足，引发流动性危机，最后开启了真正的暴跌。在这个过程中，我们能够总结出的教训是：绝对不能抄底，不能接飞刀，而是要坚决止损，尽早离场。\n这两个阶段，实际上可以归纳在动量崩盘几何学中，他几乎是一个不变量。不仅在ARKK中有效，在SNDK中有效，在KOSPI中有效，甚至在最后下跌的SOXX中我们都能看到他的影子 动量崩盘的机制，本质上是第一次杠杆崩塌+主力资金撤退导致的。\n这种形态的出现，实际上也意味着整个行情的结束。我们会发现，ARKK随后跌回来2019年的起点，要在接近4年之后才开始了一次有意义的触底反弹","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124730262408012145","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":439},{"id":"2124729653550325829","h":"bboczeng","ts":1795409999,"zh":"subscriber 全文 Article ：","en":"subscriber 全文 Article ：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124729653550325829","l":["x.com"],"ln":[{"u":"https://x.com/bboczeng/status/2124729466933088293","d":"x.com"}],"t":[],"lk":1,"rt":1,"rp":0,"vw":106},{"id":"2124729160967049537","h":"qinbafrank","ts":1795409882,"zh":"贝森特真是“急智”的改口，表示离任的老黄现在就是外部人，同时假设老黄此前对涉事人物的疑似间谍身份并不知情。虽然没有明确给老黄复职背书，但这个改口相比之前也是大变样。当然这也是迎合川普更早表态，要求英伟达董事会重新考虑创始人的去留。川普已经从之前的支持老黄，升级到公开要求董事会给他第二次机会。已经是其实是明显的施压，贝森特再不“急智”，估计得让老大不快了。\n虽然回归之路阻力还不少，但不妨碍市场来一段交易老黄归来的时间窗口。\n关于“老黄”回归未来关键的几个时间点：\n1）12月初，老黄将分别接受众院情报、外交和对中共特设委员会的闭门记录问询。以及之后的参院银行委员会公开作证。要看国会听证完了\n2）董事会自己的独立调查也得有个结果，才能会给董事会一个台阶和理由；\n3）现在还有个就是民主党的态度了，民主党议员已提前取证。Warren、Coons要求行政部门保存记录，众院民主党人Meeks在追问商务部如何处理Megaspeed。","en":"贝森特真是“急智”的改口，表示离任的老黄现在就是外部人，同时假设老黄此前对涉事人物的疑似间谍身份并不知情。虽然没有明确给老黄复职背书，但这个改口相比之前也是大变样。当然这也是迎合川普更早表态，要求英伟达董事会重新考虑创始人的去留。川普已经从之前的支持老黄，升级到公开要求董事会给他第二次机会。已经是其实是明显的施压，贝森特再不“急智”，估计得让老大不快了。\n虽然回归之路阻力还不少，但不妨碍市场来一段交易老黄归来的时间窗口。\n关于“老黄”回归未来关键的几个时间点：\n1）12月初，老黄将分别接受众院情报、外交和对中共特设委员会的闭门记录问询。以及之后的参院银行委员会公开作证。要看国会听证完了\n2）董事会自己的独立调查也得有个结果，才能会给董事会一个台阶和理由；\n3）现在还有个就是民主党的态度了，民主党议员已提前取证。Warren、Coons要求行政部门保存记录，众院民主党人Meeks在追问商务部如何处理Megaspeed。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXyN6MkawAEvxqn.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2124729160967049537","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":0,"rp":4,"vw":2613},{"id":"2124725413771698382","h":"yijiangren","ts":1795408988,"zh":"上周的GTA6发布火爆全网\n我认识的人都有直接请假在家打游戏的\nTOFU @togetherdotfun 这周的交易赛直接送！\n前三名直接送GTA6\n反正我是要争取拿个前三的\n而且也让我们群的小伙伴参加了\n还有1000刀的奖池\n🥇 230$\n🥈 140$\n🥉100$\n 四 75$\n 五 55$\n 六到十 30$\n还有十个幸运抽奖的名额 一人25$\n只要交易量达到1000$ 就能参与排名\n目前这个DEX还非常早期\n所以拿奖真的不难\n建议大家冲一下 包赚钱的","en":"上周的GTA6发布火爆全网\n我认识的人都有直接请假在家打游戏的\nTOFU @togetherdotfun 这周的交易赛直接送！\n前三名直接送GTA6\n反正我是要争取拿个前三的\n而且也让我们群的小伙伴参加了\n还有1000刀的奖池\n🥇 230$\n🥈 140$\n🥉100$\n 四 75$\n 五 55$\n 六到十 30$\n还有十个幸运抽奖的名额 一人25$\n只要交易量达到1000$ 就能参与排名\n目前这个DEX还非常早期\n所以拿奖真的不难\n建议大家冲一下 包赚钱的","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXyIpFYakAAsP6_.jpg?name=orig","https://pbs.twimg.com/media/HXyIrTaacAA0MdI.jpg?name=orig","https://pbs.twimg.com/media/HXyKNLabIAABw8b.jpg?name=orig","https://pbs.twimg.com/media/HXyKb2KaUAEB6u8.jpg?name=orig"],"u":"http ,"t":[],"lk":1,"rt":0,"rp":0,"vw":471},{"id":"2124722457034830005","h":"bboczeng","ts":1795408283,"zh":"在本文的末尾，包含了三种熊市情况的抄底策略和抄底仓位比例模拟，我将按照计划抄底，谢谢大家：","en":"在本文的末尾，包含了三种熊市情况的抄底策略和抄底仓位比例模拟，我将按照计划抄底，谢谢大家：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXyHi1vawAARvQy.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2124722457034830005","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":249},{"id":"2124721156125245904","h":"bboczeng","ts":1795407973,"zh":"subscriber 全文：","en":"subscriber 全文：","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/bboczeng/status/2124721156125245904","l":["x.com"],"ln":[{"u":"https://x.com/bboczeng/status/2124720816101449802","d":"x.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":97},{"id":"2124721093009416432","h":"bboczeng","ts":1795407958,"zh":"动量出逃的几何结构，和熊市的抄底计划\n一直以来，熊市都会以一种出人意料，猝不及防的方式出现。周五的暴跌，可能是机构做空AMD，可能是NAND价格被首次下调，也可能是SEC对英伟达财务问题进行调查。当市场进入熊市，任何一个轻微的扰动都会引发暴雷。\n相比之下，美联储加息的鹰派态度可能具有威胁性。不论如何，纠结熊市发生的原因其实并没有什么价值，因为“每次都不一样”，所谓流动性危机和Ant破发也只能是熊市的结果。但从机构资金出逃的本质，大盘下跌的形态甚至速度等现象出发，我们或许还是能够得到一些对未来投资有普适意义的启发。这也是将本文将要讨论的重点。\n即便作为空仓5个月，全仓SGOV的“大空头”，我也是没想到市场会在黄仁勋离职后来上演这么一出爆仓大戏。周五，英伟达最大跌幅14%，令人瞩目；刚正式启动“拆股”的SNDK直接忽略一切利好大跌16%，回到了四月前的价格。实际上，包括台积电，SOXX等半导体指数也都悉数回到了4月初“旱地拔葱”的起点。今年的AI行情刚好走了一个来回，完成了预想之中的全面洗盘。就连QQQ都在当日内下跌5%。从今年的高点算起，纳指累计下跌17%，标普500累计下跌10%，已经进入“美股几何学”得出的baseline I 范围。\n现在，可以抄底了吗？\n回答这个问题之前，我们先要探讨一下，为什么散户总是在牛市中亏钱？即便是4-6月份抄底半导体的，如果9月之前没跑掉，现在恐怕都已经出现了亏损。\n其实“牛市逃顶”和“熊市抄底”一样，都是反人性的。在牛市最巅峰的日子里，谁会破坏氛围想着逃顶呢？大家都佩服自己的选股能力，佩服自己关注KOL的水平；都都盯着自己的账户余额发呆，幻想能再翻10倍吗。所以说，牛市之所以危险，大家之所以会被套牢，其实依然是人的思维惯性，和市场风险不可预测的长尾本质所共同导致的。\n在市场刚跌2%的时候，你会以为这和之前一样，只是牛市中正常回调；在市场跌去10%的时候，你会觉得既然都跌了这么多了，现在实在跑太亏了。应该再坚持一下，至少等出现一个反弹，甚至回到前高形成双顶再走。等市场跌了20%，抹去你全年盈利甚至开始出现亏损的时候，大部分人才开始意识到不对劲，准备跑路——然而，这时候往往才是华尔街机构叙事反转的开始\n抄底其实也是一样，只不过它恰好是逃顶流程的镜像。在熊市底部出现第一次反弹的时候，你会以为这只是普通的波动，要再等一等；等跳空高开出现一个大缺口的时候，你又会觉得这是死猫跳， 要等second leg再测试前低；等股指一飞冲天一去不复返之后，你又会觉得：现在这个价格抄底，太亏了。最后就是没抄到底，反而只能在高点追高。\n人性如此。纵观推特这么多不同风格的大V，大家应该已经发现，这一缺陷并不是能力和水平所能改变的。只不过多空双方都有运气好的那一天，当市场走势符合自己的风格，顺风顺水，恰好踩到了上涨或者下跌的区间。\n所以对待熊市唯一可行的方法，其实也就只有定投抄底了。下跌刚开始的时候就可以启动定投，越跌越买，而且绝对不能暂停。如果能跌到关键目标击球区还可以加大仓位，直接按照总仓位的固定比例买入。当然最后这一步因人而异，取决于你还剩多少现金。\n对于还有90%SGOV现金等价物的我来说，既然本周已经跌到baseline I击球区，即便未来还有继续下探baseline II的可能性，我也不得不出手了。具体计划我会在文末专题讨论。\n从历史上看，2025，2022和2020下跌幅度距离200日平均线都达到了正态分布的3-sigma位置，而本次下跌才刚超过1-sigma一点。从下跌速度来看，本次熊市已经完全超过了今年3月底的“伊朗战争”形成的bear trap，因此我觉得，本次跌幅大概至少会达到2-sigma，周五的还没有跌完。周一的反弹是预料之中的，主要是因为周五下跌有点过于夸张了，空头都在回补。在最糟糕的情况下，也完全可以去3sigma，也就是重演2018年特朗普第一任期的感恩节+圣诞节大回调。这两者之前的确有很多相似之处，我们下文将仔细分析。\n动量出逃的几何结构\n在之前的周末文章中我们说过，26年AI交易的疯狂，特别是半导体指数4月份旱地拔葱的翻倍行情，其实在美股历史上也并非没有先例。最典型的一次其实是2021年的成长股之春。当时，以ARKK为首的高PE成长股交易震撼了华尔街，木头姐一年的收益率远超巴菲特60倍，达到惊人的152%，她也被捧上了“女股神”的神坛。然而后面的故事我们都很熟悉了，成长股遭遇2022年熊市，ARKK腰斩之后再腰斩，五年年化回报收负为-2.66%，最终回归到连巴菲特都不如的水平。\n大家终于发现笑到最后的还是巴菲特老爷子。而这其实也不是巴菲特自己的本事，只是炒作资金出逃之后，市场必然会发生的均值回归罢了。我们之前说过，华尔街资金精明得很，好马不吃回头草，炒过一次的板块绝对不会再炒第二次。中概股是一个例子，2021年的成长股是第二个。而现在同样的故事恐怕就要轮到AI了\n经过历史诗级的暴涨和暴跌之后，ARKK随后进入长时间的震荡，在躺平4年之后，终于在2025年出现了企稳反弹的迹象。这其实就是动量炒作崩盘之后的普遍特征。\n观察一下SNDK，KOSPI和ARKK的形态，你是否发现了惊人的相似之处？你是否觉得，半导体真的要步入木头姐的后尘？\nSNDK，KOSPI和ARKK相似，都是在第一次接近90度垂直上涨的大峰后，因去杠杆等技术性原因下跌，随后迎来了第二次圆顶反弹。但反弹失败意味着机构资金正式跑路，接下来就开启了真正的下跌。这是一种类似双顶的结构，但又不是真正的M顶，因为第一个顶明显比第二个顶更尖锐。从这些观察出发，我们可以得出如下有参考意义的结论：\n1. 在动量行情的炒作中，第一个顶部出现是技术性的，也就是所谓的blow off the top + deleveraging。股价因为gamma squeeze而大涨，也是因为做多杠杆爆仓而下跌。一旦杠杆被清理干净，第一批正股抄底者入场，引发了随后的反弹。这给我们的教训是，在第一次暴跌后，确实可以等待第二次反弹再清仓。\n2. 第二个圆弧顶则是机构派发导致的。抄底资金接盘，但是真正的早期投资者和机构资金实际上已经开始跑路。最终接盘能量不足，引发流动性危机，最后开启了真正的暴跌。在这个过程中，我们能够总结出的教训是：绝对不能抄底，不能接飞刀，而是要坚决止损，尽早离场。\n这两个阶段，实际上可以归纳在动量崩盘几何学中，他几乎是一个不变量。不仅在ARKK中有效，在SNDK中有效，在KOSPI中有效，甚至在最后下跌的SOXX中我们都能看到他的影子\n动量崩盘的机制，本质上是第一次杠杆崩塌+主力资金撤退导致的。这种形态的出现，实际上也意味着整个行情的结束。我们会发现，ARKK随后跌回来2019年的起点，要在接近4年之后才开始了一次有意义的触底反弹。\n同样的道理，半导体作为周期性如此强的行业，在经历了这么一次非理性、非正常的动量炒作之后，已经元气大伤，也给广大投资这造成了极大的伤害。它极有可能迎来和ARKK类似的结局：跌回本轮翻倍增长的起点，并在长期的低波动，低成交量的大横盘中，等待下一个周期到来。实际上KOSPI和SOXL已经走出了这样的趋势。下一个值得关注的板块是存储，GPU和SOXX本身。\n下周的抄底计划\n先公开一下我现在持仓情况，因为我几乎是在空仓等暴跌，所以我的抄底计划有一点激进，并不一定不适合所有人。已经有美股仓位的可以再等一等，或者在反弹中继续减仓。\n以下内容为会员可见。会员可以阅读全站会员可见内容，并加入我们的会员群参与更多讨论。对会员项目感兴趣的读者可以阅读本文了解详情。下文将探讨熊市进一步发展的三种可能，以及在对应的可能性下，在不同目标位置以不同抄底比例的风险和平均回报，从而得到我下周一的抄底方案。注意，在我的语境下，抄底和定投是两种不同的策略，我自10月初以来已经开始定投，但抄底尚未开始。他们之间并不矛盾。\n包含图文的全文链接如下，subscriber post将发在评论区：","en":"动量出逃的几何结构，和熊市的抄底计划\n一直以来，熊市都会以一种出人意料，猝不及防的方式出现。周五的暴跌，可能是机构做空AMD，可能是NAND价格被首次下调，也可能是SEC对英伟达财务问题进行调查。当市场进入熊市，任何一个轻微的扰动都会引发暴雷。\n相比之下，美联储加息的鹰派态度可能具有威胁性。不论如何，纠结熊市发生的原因其实并没有什么价值，因为“每次都不一样”，所谓流动性危机和Ant破发也只能是熊市的结果。但从机构资金出逃的本质，大盘下跌的形态甚至速度等现象出发，我们或许还是能够得到一些对未来投资有普适意义的启发。这也是将本文将要讨论的重点。\n即便作为空仓5个月，全仓SGOV的“大空头”，我也是没想到市场会在黄仁勋离职后来上演这么一出爆仓大戏。周五，英伟达最大跌幅14%，令人瞩目；刚正式启动“拆股”的SNDK直接忽略一切利好大跌16%，回到了四月前的价格。实际上，包括台积电，SOXX等半导体指数也都悉数回到了4月初“旱地拔葱”的起点。今年的AI行情刚好走了一个来回，完成了预想之中的全面洗盘。就连QQQ都在当日内下跌5%。从今年的高点算起，纳指累计下跌17%，标普500累计下跌10%，已经进入“美股几何学”得出的baseline I 范围。\n现在，可以抄底了吗？\n回答这个问题之前，我们先要探讨一下，为什么散户总是在牛市中亏钱？即便是4-6月份抄底半导体的，如果9月之前没跑掉，现在恐怕都已经出现了亏损。\n其实“牛市逃顶”和“熊市抄底”一样，都是反人性的。在牛市最巅峰的日子里，谁会破坏氛围想着逃顶呢？大家都佩服自己的选股能力，佩服自己关注KOL的水平；都都盯着自己的账户余额发呆，幻想能再翻10倍吗。所以说，牛市之所以危险，大家之所以会被套牢，其实依然是人的思维惯性，和市场风险不可预测的长尾本质所共同导致的。\n在市场刚跌2%的时候，你会以为这和之前一样，只是牛市中正常回调；在市场跌去10%的时候，你会觉得既然都跌了这么多了，现在实在跑太亏了。应该再坚持一下，至少等出现一个反弹，甚至回到前高形成双顶再走。等市场跌了20%，抹去你全年盈利甚至开始出现亏损的时候，大部分人才开始意识到不对劲，准备跑路——然而，这时候往往才是华尔街机构叙事反转的开始\n抄底其实也是一样，只不过它恰好是逃顶流程的镜像。在熊市底部出现第一次反弹的时候，你会以为这只是普通的波动，要再等一等；等跳空高开出现一个大缺口的时候，你又会觉得这是死猫跳， 要等second leg再测试前低；等股指一飞冲天一去不复返之后，你又会觉得：现在这个价格抄底，太亏了。最后就是没抄到底，反而只能在高点追高。\n人性如此。纵观推特这么多不同风格的大V，大家应该已经发现，这一缺陷并不是能力和水平所能改变的。只不过多空双方都有运气好的那一天，当市场走势符合自己的风格，顺风顺水，恰好踩到了上涨或者下跌的区间。\n所以对待熊市唯一可行的方法，其实也就只有定投抄底了。下跌刚开始的时候就可以启动定投，越跌越买，而且绝对不能暂停。如果能跌到关键目标击球区还可以加大仓位，直接按照总仓位的固定比例买入。当然最后这一步因人而异，取决于你还剩多少现金。\n对于还有90%SGOV现金等价物的我来说，既然本周已经跌到baseline I击球区，即便未来还有继续下探baseline II的可能性，我也不得不出手了。具体计划我会在文末专题讨论。\n从历史上看，2025，2022和2020下跌幅度距离200日平均线都达到了正态分布的3-sigma位置，而本次下跌才刚超过1-sigma一点。从下跌速度来看，本次熊市已经完全超过了今年3月底的“伊朗战争”形成的bear trap，因此我觉得，本次跌幅大概至少会达到2-sigma，周五的还没有跌完。周一的反弹是预料之中的，主要是因为周五下跌有点过于夸张了，空头都在回补。在最糟糕的情况下，也完全可以去3sigma，也就是重演2018年特朗普第一任期的感恩节+圣诞节大回调。这两者之前的确有很多相似之处，我们下文将仔细分析。\n动量出逃的几何结构\n在之前的周末文章中我们说过，26年AI交易的疯狂，特别是半导体指数4月份旱地拔葱的翻倍行情，其实在美股历史上也并非没有先例。最典型的一次其实是2021年的成长股之春。当时，以ARKK为首的高PE成长股交易震撼了华尔街，木头姐一年的收益率远超巴菲特60倍，达到惊人的152%，她也被捧上了“女股神”的神坛。然而后面的故事我们都很熟悉了，成长股遭遇2022年熊市，ARKK腰斩之后再腰斩，五 AI接连解决数学问题的一年里，一名Anthropic员工表示，他使用公司的AI聊天机器人，证明了著名的黎曼猜想。","en":"在AI接连解决数学问题的一年里，一名Anthropic员工表示，他使用公司的AI聊天机器人，证明了著名的黎曼猜想。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2124704336349438124","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4ANHvnl","d":"bbc.in"}],"t":[],"lk":2,"rt":0,"rp":1,"vw":3284},{"id":"2124704274798288967","h":"nytchinese","ts":1795403948,"zh":"#新新世界 中国“盯上”所有人的钱包：网络上最近流传一个笑话，中国经济新引擎是查官员的家、让富人补缴税款，以及向穷人征收社保。经济增长乏力，人口老龄化严重，中国政府为支付各项开支进一步榨取民众的钱财，包括提高养老金缴费标准、对离岸资产征税等。无论贫富，中国民众都感到生活压力增加。","en":"#新新世界 中国“盯上”所有人的钱包：网络上最近流传一个笑话，中国经济新引擎是查官员的家、让富人补缴税款，以及向穷人征收社保。经济增长乏力，人口老龄化严重，中国政府为支付各项开支进一步榨取民众的钱财，包括提高养老金缴费标准、对离岸资产征税等。无论贫富，中国民众都感到生活压力增加。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2124704274798288967","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/business/20261123/china-economy-pensions/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["汇率"],"lk":6,"rt":0,"rp":3,"vw":2814},{"id":"2124702990812774404","h":"qinbafrank","ts":1795403642,"zh":"Anthropic的绿鞋行使，保险”过早失掉。上周五上市第二个交易日、大摩作为稳定代理人已经代表承销商行驶了全部超额配售选择权（“绿鞋”），又额外从市场拿走122亿美元。此次IPO共募集935亿美金，加上私募配售的260亿美金，这一把A社拿到了1195亿美的资金。\n正常来说、承销商对是否行使绿鞋拥有唯一裁量权。但按经验，牵头行几乎总会与公司协商并尽量配合其意愿，很少有投行单方面行动，而且根据招股说明书，承销商不会就超额配售部分获得佣金。因此Anthropic很可能批准甚至鼓励了提前行权。\n绿鞋机制是在IPO中，承销商通常会向投资者超额发售15%的股份，形成空头头寸。若股价上涨，承销商行使选择权，按发行价向发行人增购股份以平仓；若股价下跌，则在市场买入股票平仓，从而为股价提供支撑。\n而一旦行使选择权，承销商便无法再通过在市场买入股票平掉空头头寸来支撑股价。批评者认为，在股价尚未企稳、市况仍在恶化之际提前行权，使这层“保险”过早失效。\n上周五市场大跌，ANT股价在首日冲高回落后并不强势。这个时机只能说明官方急于拿到钱，短期内ANT股价大概率易跌难涨了。\n如上周在币安广场AMA聊到的如果Anthropic市值掉掉到八九千亿美金的位置、个人角度就跌出了性价比、届时中长期向上空间也被打开了。","en":"Anthropic的绿鞋行使，保险”过早失掉。上周五上市第二个交易日、大摩作为稳定代理人已经代表承销商行驶了全部超额配售选择权（“绿鞋”），又额外从市场拿走122亿美元。此次IPO共募集935亿美金，加上私募配售的260亿美金，这一把A社拿到了1195亿美的资金。\n正常来说、承销商对是否行使绿鞋拥有唯一裁量权。但按经验，牵头行几乎总会与公司协商并尽量配合其意愿，很少有投行单方面行动，而且根据招股说明书，承销商不会就超额配售部分获得佣金。因此Anthropic很可能批准甚至鼓励了提前行权。\n绿鞋机制是在IPO中，承销商通常会向投资者超额发售15%的股份，形成空头头寸。若股价上涨，承销商行使选择权，按发行价向发行人增购股份以平仓；若股价下跌，则在市场买入股票平仓，从而为股价提供支撑。\n而一旦行使选择权，承销商便无法再通过在市场买入股票平掉空头头寸来支撑股价。批评者认为，在股价尚未企稳、市况仍在恶化之际提前行权，使这层“保险”过早失效。\n上周五市场大跌，ANT股价在首日冲高回落后并不强势。这个时机只能说明官方急于拿到钱，短期内ANT股价大概率易跌难涨了。\n如上周在币安广场AMA聊到的如果Anthropic市值掉掉到八九千亿美金的位置、个人角度就跌出了性价比、届时中长期向上空间也被打开了。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXx17Y-awAAiK7k.jpg?name=orig","https://pbs.twimg.com/media/HXx17Y-aEAAppvq.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2124702990812774404","l":[],"ln":[],"t":[],"lk":18,"rt":0,"rp":6,"vw":5382},{"id":"2124702522191536131","h":"cnfinancewatch","ts":1795403531,"zh":"感觉现在红利板块进去的话后市力度不够；机器人、影视死扛，将来也不一定领军。\n大盘接近3440第一目标位。这个位置守住守不住还存疑。","en":"感觉现在红利板块进去的话后市力度不够；机器人、影视死扛，将来也不一定领军。\n大盘接近3440第一目标位。这个位置守住守不住还存疑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124702522191536131","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":3,"vw":1471},{"id":"2124702028320694344","h":"TraderS18","ts":1795403413,"zh":"对贝森特暗示黄仁勋回归这事不乐观，他们不是知道错了，而是被跌怕了，但你们搞老黄之前就没想到股市会大跌吗？还是知道会跌但不知道会跌这么多？要么就纯属嘴炮安抚市场。\n不论是哪种，即使现在立刻马上把老黄弄回去，也只会反弹不会反转了，谁见过把破碎的泡泡重新用万能胶粘起来？\n最多是重新换一个题材吹泡泡，但AI赛道确实后继乏力了","en":"对贝森特暗示黄仁勋回归这事不乐观，他们不是知道错了，而是被跌怕了，但你们搞老黄之前就没想到股市会大跌吗？还是知道会跌但不知道会跌这么多？要么就纯属嘴炮安抚市场。\n不论是哪种，即使现在立刻马上把老黄弄回去，也只会反弹不会反转了，谁见过把破碎的泡泡重新用万能胶粘起来？\n最多是重新换一个题材吹泡泡，但AI赛道确实后继乏力了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2124702028320694344","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":0,"vw":569},{"id":"2124701547796001044","h":"cnfinancewatch","ts":1795403298,"zh":"下午一点半可能出现强平杀跌\n注意券商护盘力度","en":"下午一点半可能出现强平杀跌\n注意券商护盘力度","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124701547796001044","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":229},{"id":"2124700311860236574","h":"TJ_Research","ts":1795403004,"zh":"续集：刚刚川普“我希望英伟达董事会把黄仁勋招回去，对公司好，对美国好”上价值，上压力了","en":"续集：刚刚川普“我希望英伟达董事会把黄仁勋招回去，对公司好，对美国好”上价值，上压力了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2124700311860236574","l":[],"ln":[],"t":["AI科技"],"lk":41,"rt":0,"rp":3,"vw":3080},{"id":"2124699985136779646"," nancewatch","ts":1795396681,"zh":"三、涨停事件\n1、国产替代（7）\n4板：真视通、盛剑科技\n1板：东晶电子、鼎龙科技、建业股份、易天股份、华微电子\n事件1：美国商务部发布规则，规范对美国超级智能技术的远程访问，海外数据中心向国外公司提供超1,200万TPP算力须申请许可，同时收紧先进芯片的FAB和OSAT规定等。\n事件2：消息称三星开始穿透严查代工。\n2、PCB（6）\n2板：中京电子\n1板：光华科技、超声电子、澳弘电子、满坤科技、骏亚科技\n事件：全球电子协会在预警报告中指出，全球电子产业正面临印刷电路板（PCB）的严重短缺。这种零部件几乎存在于所有含有电子元件的消费产品中，其供应缺口可能对全球经济造成广泛影响。在2028年年中之前，供应紧张局面不太可能得到实质性缓解。\n3、农林牧渔（5）\n1板：东方海洋、国光股份、万向德农、金 新 农、好 当 家\n事件：厄尔尼诺带来全球农产品价格扰动预期。\n4、机器人（3）\n1板：长华集团、克来机电、风 语 筑、凡拓数创\n事件：马斯克预计未来12-18个月Optimus机器人能做家务劳动。\n5、短剧传媒（2）\n1板：龙版传媒、华媒控股\n事件：红果短剧日活破1亿，板块反复活跃。","en":"三、涨停事件\n1、国产替代（7）\n4板：真视通、盛剑科技\n1板：东晶电子、鼎龙科技、建业股份、易天股份、华微电子\n事件1：美国商务部发布规则，规范对美国超级智能技术的远程访问，海外数据中心向国外公司提供超1,200万TPP算力须申请许可，同时收紧先进芯片的FAB和OSAT规定等。\n事件2：消息称三星开始穿透严查代工。\n2、PCB（6）\n2板：中京电子\n1板：光华科技、超声电子、澳弘电子、满坤科技、骏亚科技\n事件：全球电子协会在预警报告中指出，全球电子产业正面临印刷电路板（PCB）的严重短缺。这种零部件几乎存在于所有含有电子元件的消费产品中，其供应缺口可能对全球经济造成广泛影响。在2028年年中之前，供应紧张局面不太可能得到实质性缓解。\n3、农林牧渔（5）\n1板：东方海洋、国光股份、万向德农、金 新 农、好 当 家\n事件：厄尔尼诺带来全球农产品价格扰动预期。\n4、机器人（3）\n1板：长华集团、克来机电、风 语 筑、凡拓数创\n事件：马斯克预计未来12-18个月Optimus机器人能做家务劳动。\n5、短剧传媒（2）\n1板：龙版传媒、华媒控股\n事件：红果短剧日活破1亿，板块反复活跃。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124673793717407871","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":798},{"id":"2124673789585981742","h":"cnfinancewatch","ts":1795396680,"zh":"No.1 盘前热点事件\n一、昨日热点\n算力：真视通\n光刻胶：盛剑科技\nPCB：中京电子\n短剧：龙版传媒\n二、周末稳市场举措\nA股：\n1、沪深北交易所降低融资保证金比例下限至80%，自2026年11月30日起施行，理论上可带来增量资金近4000亿元。\n2、沪深交易所推出新一批降费措施，包括免收交易单元使用费等，并将今年年初已实施的免收上市费、债券交易经手费等措施有效期再延长两年至2028年。\n3、中国结算明确，自2027年1月1日起至2028年12月31日，继续暂免收取绿色公司债券、科技创新公司债券和民营企业公司债券（不含可转换公司债券）发行人服务费及债券结算费。\n4、创业板拟引入做市商制度。\n5、上交所正推动修订科创板做市商规则。\n韩国\n高层金融官员在周日召开的紧急会议后表示，鉴于市场波动加剧，韩国宣布了分阶段措施以稳定市场，其中包括确保股票稳定基金就绪，以便在必要时采取行动。韩国财政部表示，将放宽每日股票回购限额和密切监控非法卖空行为，为期三个月。\n台\n正式推出“禁止平盘以下放空”规则，从11月23日开始，所有投资者都不能以低于前一交易日收盘价的价格提交融券卖出委托。最低融资维持保证金比例将从目前的130%下调至120%。\n三、行业要闻\n1、台：九合一投票将于11月28日举行，选举进入最后冲刺阶段。（福建）\n2、特朗普称将与伊朗达成一项永久性协议。（美伊）\n3、Neuralink 展示脑机接口新成果，瘫痪患者成功在《GTA 6》里自由驾驶、射击。（脑机接口）\n4、游戏《GTA 6》发售首日销售额达37.9亿美元。（游戏）\n5、我国启动具身智能数据国家标准研制。（机器人数据）\n6、22日起，新一轮冷空气自北向南影响我国中东部地区，带来大范围雨雪降温。（供热）\n7、特斯拉宣布在美国市场推出FSD v15。（无人驾驶）\n8、量子计算机高速内存全球首次真机实现。（量子计算）\n9、黄仁勋据称将创办新的半导体公司，或将筹资500亿美元用于创业。\n10、戴尔、惠普企业、联想及超微电脑等厂商正要求客户为已签订的AI服务器订单支付更高价格，部分订单涨幅达到25%至45%。\n11、特朗普表示，将对在海外建设数据中心的美国公司征税。\n12、美方拟禁止中国电信运营商直接获取美国互联网电话号码资源。\n13、美国证券交易委员会据悉正对英伟达潜在会计问题展开调查。\nNo.2 公告精选\n一、日常公告\n魅视科技：签署算力服务项目备忘录 最高金额11.64亿元\n弘信电子：控股子公司签署7.45亿元算力技术服务协议\n木 林 森：拟投资22.5亿元建设半导体芯片封测项目\n易天股份：拟收购艾晨数字能源37%股权\n奥 来 德：全资子公司预中标京东方8.6代AMOLED生产线项目\n鼎龙股份：已有10款高端晶圆光刻胶取得国内多家主流晶圆厂批量订单\n摩尔线程：实控人提议回购5亿-10亿元股份\n华友钴业：拟10亿-15亿元回购股份\n通威股份：拟10亿元-20亿元回购股份\n荣盛石化：控股股东拟增持10亿-20亿元股份","en":"No.1 盘前热点事件\n一、昨日热点\n算力：真视通\n光刻胶：盛剑科技\nPCB：中京电子\n短剧：龙版传媒\n二、周末稳市场举措\nA股：\n1、沪深北交易所降低融资保证金比例下限至80%，自2026年11月30日起施行，理论上可带来增量资金近4000亿元。\n2、沪深交易所推出新一批降费措施，包括免收交易单元使用费等，并将今年年初已实施的免收上市费、债券交易经手费等措施有效期再延长两年至2028年。\n3、中国结算明确，自2027年1月1日起至2028年12月31日，继续暂免收取绿色公司债券、科技创新公司债券和民营企业公司债券（不含可转换公司债券）发行人服务费及债券结算费。\n4、创业板拟引入做市商制度。\n5、上交所正推动修订科创板做市商规则。\n韩国\n高层金融官员在周日召开的紧急会议后表示，鉴于市场波动加剧，韩国宣布了分阶段措施以稳定市场，其中包括确保股票稳定基金就绪，以便在必要时采取行动。韩国财政部表示，将放宽每日股票回购限额和密切监控非法卖空行为，为期三个月。\n台\n正式推出“禁止平盘以下放空”规则，从11月23日开始，所有投资者都不能以低于前一交易日收盘价的价格提交融券卖出委托。最低融资维持保证金比例将从目前的130%下调至120%。\n三、行业要闻\n1、台：九合一投票将于11月28日举行，选举进入最后冲刺阶段。（福建）\n2、特朗普称将与伊朗达成一项永久性协议。（美伊）\n3、Neuralink 展示脑机接口新成果，瘫痪患者成功在《GTA 6》里自由驾驶、射击。（脑机接口）\n4、游戏《GTA 6》发售首日销售额达37.9亿美元。（游戏）\n5、我国启动具身智能数据国家标准研制。（机器人数据）\n6、22日起，新一轮冷空气自北向南影响我国中东部地区，带来大范围雨雪降温。（供热）\n7、特斯拉宣布在美国市场推出FSD v15。（无人驾驶）\n8、量子计算机高速内存全球首次真机实现。（量子计算）\n9、黄仁勋据称将创办新的半导体公司，或将筹资500亿美元用于创业。\n10、戴尔、惠普企业、联想及超微电脑等厂商正要求客户为已签订的AI服务器订单支付更高价格，部分订单涨幅达到25%至45%。\n11、特朗普表示，将对在海外建设数据中心的美国公司征税。\n12、美方拟禁止中国电信运营商直接获取美国互联网电话号码资源。\n13、美国证券交易委员会据悉正对英伟达潜在会计问题展开调查。\nNo.2 公告精选\n一、日常公告\n魅视科技：签署算力服务项目备忘录 最高金额11.64亿元\n弘信电子：控股子公司签署7.45亿元算力技术服务协议\n木 林 森：拟投资22.5亿元建设半导体芯片封测项目\n易天股份：拟收购艾晨数字能源37%股权\n奥 来 德：全资子公司预中标京东方8.6代AMOLED生产线项目\n鼎龙股份：已有10款高端晶圆光刻胶取得国内多家主流晶圆厂批量订单\n摩尔线程：实控人提议回购5亿-10亿元股份\n华友钴业：拟10亿-15亿元回购股份\n通威股份：拟10亿元-20亿元回购股份\n荣盛石化：控股股东拟增持10亿-20亿元股份","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124673789585981742","l":[],"ln":[],"t":["A股港股","AI科技"],"lk":2,"rt":0,"rp":2,"vw":1516},{"id":"2124672863592734820","h":"cnfinancewatch","ts":1795396459,"zh":"一生一定要去一次挪威","en":"一生一定要去一次挪威","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2124672834341609472/vid/avc1/480x852/4pswpNBYk7tWgiXv.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2124672863592734820","l":[],"ln":[],"t":[],"lk":6,"rt":1,"rp":2,"vw":1253},{"id":"2124671795907465459","h":"fxtrader","ts":1795396205,"zh":"#行情 韩国KOSPI指数跌3%。三星电子、SK海力士跌3%。\n日本股市因劳动感恩节假期休市一日。","en":"#行情 韩国KOSPI指数跌3%。三星电子、SK海力士跌3%。\n日本股市因劳动感恩节假期休市一日。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2124671795907465459","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":770},{"id":"2124671103276855306","h":"cnfinancewatch","ts":1795396040,"zh":"A股盘前第二版 2026年11月23日 周一\n#结论 两小时里最大的变化是美股期指继续往上走。标普期货约7085，较上周五结算涨约2.2%，纳指期货约25871涨约3.0%，比第一版时的涨1.2%和1.9%又抬了一截。但亚洲开盘没有跟着走，\n#韩国综指 开盘跌2.8%，随后跌幅扩大到3%， #三星电子 和 #SK海力士\n都跌约3%，日本今天休市。外盘反抽和亚洲情绪背离，第一版的判断不变：防守和高股息当压舱石，科技成长等止跌信号，开盘先看韩股这种背离会不会传到A股。\n#消息面 两小时更新\n偏利好的有三条。一是首批18只主动ETF今天上市，全部顶格募满20亿元，合计约360亿元增量资金将逐步入场。二是上周ETF整体净流入1908.02亿元，宽基型净流入1895.60亿元，华泰柏瑞沪深300ETF一只就净流入385.41亿元，托底资金很清楚。三是宁泉资产今天起恢复新投资者申购，停了一年多，私募老将重新开门收钱，算是一个情绪信号。\n偏利空的是杠杆还在出清：截至11月20日两市融资余额21437.91亿元，单日减少417.24亿元。本周还有3795亿元逆回购到期，周三1万亿元一年期MLF到期，流动性要看央行怎么续作。\n外部方面，特朗普称伊朗上周发射的无人机和导弹数量创一年多新高，中东风险仍在。产业上，戴尔、HPE、联想、超微等厂商在签约数月后上调AI服务器售价，最高涨45%，成本压力在往下游传导；韩国11月前20天半导体出口同比增长294.4%，硬件需求本身没塌，跌的是估值和资金。另外深交所港股通名单调入\n#东山精密 $002384，今天生效。\n#研报面\n两小时内新增的研报不多。11月23日开源证券给 #巨化股份 $600160 买入，控股股东拟增持，制冷剂需求明显改善；华鑫证券11月23日给\n#川润股份 $002272 增持，看点是加码液冷。中信建投今晨连发几篇：一篇认为探底阶段防御品种仍有较高配置价值，点名银行、白电、白酒、保险、铁路公路、电信运营等，红利交易热度升高但未拥挤；一篇看全球封测景气上行，三季度国内封测板块营收同比增长28%。银河证券认为ETF放量净流入显示托底意愿，但增量资金回补节奏还要看外部缓和。研报口径和第一版的防守主线一致。\n#热榜\n东财人气榜和同花顺热榜本档接口均未取到，数据缺失。第一版时榜单前列以PCB涨停股和低价题材为主，这一判断暂无新数据更新。\n#资金面\n集合竞价数据要到9点15分后才有，本稿截止时数据缺失。能确认的增量是上周ETF净流入1908亿元和今天上市的主动ETF，流向以沪深300等宽基为主，利好大市值权重；融资盘单日减少417亿元，流出集中在电子、电力设备等泛AI成长股，这和周五的结构一致。北向盘前数据缺失。\n#中美映射\n20日和5日双窗口沿用第一版数据：A股只有银行、红利、电力ETF在两个窗口都为正，美股半导体和科技ETF双窗口同步走弱，没有进攻方向的共振。两小时新增的是纳指期货涨约3%，若今晚美股能兑现，科技的5日窗口才有修复可能，现在只算期待，不算信号。\n#期货 两小时更新\n标普期货约7085，较前结算涨约2.2%；纳指期货约25871涨约3.0%；道指期货约48920涨约1.5%。纽约金约3576美元涨约1.7%，原油约82.9美元跌约0.6%。离岸人民币约6.6743，基本持平。富时A50期货最新报价本档未取到，第一版时夜盘收12515跌约0.85%。\n#三个方向\n维持不变。一是银行与红利，ETF资金和券商防御观点继续互证。二是水电与核电，防守属性，20日占优。三是PCB与元件，AI服务器涨价和韩国芯片出口数据是新的佐证，但只做回踩不追涨停。半导体与存储仍只观察，韩股芯片股今早下跌，说明资金还没回来。\n#六只个股\n维持第一版名单，两小时内无需调整的新信息。\n #工商银行 $601398 宽基ETF资金的直接受益者，回落不破9.2元可持有。\n #建设银行 $601939 与工行同步，看高股息资金是否延续。\n #长江电力 $600900 水电现金流稳定，防守首选之一。\n #中国广核 $003816 核电防守，弹性略大。\n #沪电股份 $002463 服务器板逻辑因AI服务器涨价加强，回踩企稳再看。\n #深南电路 $002916 与PCB短缺共振，不追高。\n #东山精密 $002384 今日调入港股通，可作PCB方向观察，不进六只。\n#小盘阿尔法\n今天不选。两小时内没有能通过20日K线和财报互证的小盘标的，不凑数。\n#操作提示\n9点15分看竞价：若上证50和银行继续高开、中证1000竞价跌幅不超过1%，说明美股期指的反抽传过来了，防守仓可持有；若跟着韩股跌，小票先减仓。科技股要等放量止跌，不因期指涨就抢反弹。今天的外部变量还是伊朗和周三的MLF续作。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘前第二版 2026年11月23日 周一\n#结论 两小时里最大的变化是美股期指继续往上走。标普期货约7085，较上周五结算涨约2.2%，纳指期货约25871涨约3.0%，比第一版时的涨1.2%和1.9%又抬了一截。但亚洲开盘没有跟着走，\n#韩国综指 开盘跌2.8%，随后跌幅扩大到3%， #三星电子 和 #SK海力士\n都跌约3%，日本今天休市。外盘反抽和亚洲情绪背离，第一版的判断不变：防守和高股息当压舱石，科技成长等止跌信号，开盘先看韩股这种背离会不会传到A股。\n#消息面 两小时更新\n偏利好的有三条。一是首批18只主动ETF今天上市，全部顶格募满20亿元，合计约360亿元增量资金将逐步入场。二是上周ETF整体净流入1908.02亿元，宽基型净流入1895.60亿元，华泰柏瑞沪深300ETF一只就净流入385.41亿元，托底资金很清楚。三是宁泉资产今天起恢复新投资者申购，停了一年多，私募老将重新开门收钱，算是一个情绪信号。\n偏利空的是杠杆还在出清：截至11月20日两市融资余额21437.91亿元，单日减少417.24亿元。本周还有3795亿元逆回购到期，周三1万亿元一年期MLF到期，流动性要看央行怎么续作。\n外部方面，特朗普称伊朗上周发射的无人机和导弹数量创一年多新高，中东风险仍在。产业上，戴尔、HPE、联想、超微等厂商在签约数月后上调AI服务器售价，最高涨45%，成本压力在往下游传导；韩国11月前20天半导体出口同比增长294.4%，硬件需求本身没塌，跌的是估值和资金。另外深交所港股通名单调入\n#东山精密 $002384，今天生效。\n#研报面\n两小时内新增的研报不多。11月23日开源证券给 #巨化股份 $600160 买入，控股股东拟增持，制冷剂需求明显改善；华鑫证券11月23日给\n#川润股份 $002272 增持，看点是加码液冷。中信建投今晨连发几篇：一篇认为探底阶段防御品种仍有较高配置价值，点名银行、白电、白酒、保险、铁路公路、电信运营等，红利交易热度升高但未拥挤；一篇看全球封测景气上行，三季度国内封测板块营收同比增长28%。银河证券认为ETF放量净流入显示托底意愿，但增量资金回补节奏还要看外部缓和。研报口径和第一版的防守主线一致。\n#热榜\n东财人气榜和同花顺热榜本档接口均未取到，数据缺失。第一版时榜单前列以PCB涨停股和低价题材为主，这一判断暂无新数据更新。\n#资金面\n集合竞价数据要到9点15分后才有，本稿截止时数据缺失。能确认的增量是上周ETF净流入1908亿元和今天上市的主动ETF，流向以沪深300等宽基为主，利好大市值权重；融资盘单日减少417亿元，流出 ewatch。\n我告诉你们 #叫你们定投标普的几乎都是业余和民科分析师，身份存疑，是不是博士、是不是证券行业从业资格试通过者？非常存疑。\n真正让散户能穿越牛熊超长持仓，跑赢标普的策略，跟本不是定投，定投是跑不赢的，只会跑输标普本身。\n#你们应该订阅我，看我订阅区第一条：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124670774951006478","l":["macaostarbridge.com"],"ln":[{"u":"http://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["美股","汇率"],"lk":0,"rt":0,"rp":0,"vw":569},{"id":"2124668379386753257","h":"qinbafrank","ts":1795395390,"zh":"历史上美股恐慌贪婪指数跌到9进入极度恐慌区间后美股会怎么走？上周五美股值得看的一个数据就是CNN恐慌贪婪指数跌到9的进入极度恐慌区间，印象中去年关税战指数跌倒3是过去这么多年恐贪指数一个极值。让GPT做了一个统计自2011年以来，美股共有136个交易日恐惧贪婪指数低于10，构成40段连续信号。把密集出现的信号合并成17轮行情，除去刚触发的本轮，已走完的 16 轮里：7 轮快速V 反，5轮反弹后二探或破底，4 轮继续下跌延后见底。尽管如此，16轮中有14轮在第21个交易日收涨。\n这次最值得对照的是2025年11月和2018年四季度：\n1）前者说明AI估值担忧遇上货币政策预期改善，可以很快止跌；\n2）后者说明一旦风险从股票估值传向盈利和融资成本即使出现强反弹，也可能要回头再二探一次。\n本轮已经出现了值得跟踪的信用市场证据。上周五CNN七个分项中，标普动量只有0.2，避险需求0.8，波动率分项 1.32，期权分项2.0，短期避险已经相当集中。与此同时，美国高收益债利差从 11/13 的323个基点扩大到11/19的\n352个基点。到 11/20，投资级信用违约互换指数CDX IG的利差盘中一度达到 65.5个基点，为 3月底以来最高。高收益债数据截至周四，CDX 是周五盘中读数，两者都指向融资风险开始被重新定价。\n所以反弹时信用利差怎么走来区分这两个历史参照：\n1）如果纳指反弹、科技债和广义信用利差同步收窄，更接近2025 年11月的快速稳定；\n2）如果纳指大涨几天，信用保护成本却继续上升，2018年四季度的经验就更有参考价值。\n所以整体上：\n市场进入极度恐慌区间，短线反弹是大概率的，是直接V反还是二探甚至延后见底还要再看。这一次个人更倾向会有二探或者延后见底，核心还是宏观和产业政策都还没明朗（上周推文聊到市场未来走出来要看宏观产业的三个层面，见引用推文最后部分），如果之后真能出现如去年10月恐慌贪婪指数被打倒5以下，市场恐慌到无以复加，那可能真是绝佳机会。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"历史上美股恐慌贪婪指数跌到9进入极度恐慌区间后美股会怎么走？上周五美股值得看的一个数据就是CNN恐慌贪婪指数跌到9的进入极度恐慌区间，印象中去年关税战指数跌倒3是过去这么多年恐贪指数一个极值。让GPT做了一个统计自2011年以来，美股共有136个交易日恐惧贪婪指数低于10，构成40段连续信号。把密集出现的信号合并成17轮行情，除去刚触发的本轮，已走完的 16 轮里：7 轮快速V 反，5轮反弹后二探或破底，4 轮继续下跌延后见底。尽管如此，16轮中有14轮在第21个交易日收涨。\n这次最值得对照的是2025年11月和2018年四季度：\n1）前者说明AI估值担忧遇上货币政策预期改善，可以很快止跌；\n2）后者说明一旦风险从股票估值传向盈利和融资成本即使出现强反弹，也可能要回头再二探一次。\n本轮已经出现了值得跟踪的信用市场证据。上周五CNN七个分项中，标普动量只有0.2，避险需求0.8，波动率分项 1.32，期权分项2.0，短期避险已经相当集中。与此同时，美国高收益债利差从 11/13 的323个基点扩大到11/19的\n352个基点。到 11/20，投资级信用违约互换指数CDX IG的利差盘中一度达到 65.5个基点，为 3月底以来最高。高收益债数据截至周四，CDX 是周五盘中读数，两者都指向融资风险开始被重新定价。\n所以反弹时信用利差怎么走来区分这两个历史参照：\n1）如果纳指反弹、科技债和广义信用利差同步收窄，更接近2025 年11月的快速稳定；\n2）如果纳指大涨几天，信用保护成 货开门如期反弹，但是VIX很高，还是要谨慎观察。","en":"大家好🫪 期货开门如期反弹，但是VIX很高，还是要谨慎观察。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXw_2ElbIAAxZWn.jpg?name=orig"],"u":"https://x.com/Balder13946731/status/2124643324795773315","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2124643264225812513","h":"cnfinancewatch","ts":1795389402,"zh":"A股盘前第一版 2026年11月23日 周一\n#结论 周五A股放量杀跌，上证收3533.79跌1.23%，盘中最低3500.83，深证成指跌3.09%，创业板指跌3.54%，中证1000跌4.89%，只有上证50收涨0.45%。随后美股同日继续出清，标普跌3.70%，纳指跌5.28%，\n#英伟达 $NVDA 跌14.01%。好在周末到今晨，美股期指明显反抽，标普期货约7020涨约1.2%，纳指期货约25597涨约1.9%。今天的判断是低开或平开后分化，防守和高股息继续当压舱石，科技成长先看止跌信号，不抄刀。\n#消息面\n周末偏利空的是外部：特朗普称若新年后与伊朗仍无协议倾向动武，伊朗方面称两艘超大型油轮在霍尔木兹海峡附近触雷，中东风险抬头。马斯克警告人工智能行业明年可能面临严重资金短缺，与上周的AI出清情绪叠加。CME美联储观察显示12月加息25个基点的概率为91.4%（转述），而美财长贝森特警告美联储过度紧缩风险。\n偏利好的是国内：创业板将引入做市商制度，科创板做市规则同步酝酿修订；首批主动ETF今日上市；年内新发基金规模突破万亿元，24家公募同日上报ETF新品；回购增持密集落地。十大券商策略普遍认为不必过度悲观、市场或逐步企稳。个股层面\n#思特威 拟入股晶圆厂加码CIS代工产能， #天孚通信 拟在南昌投建高速光器件项目，但其股价自年内高点回撤超七成。\n#研报面\n周末研报集中在业绩修复和半导体。11月22日太平洋给 #兆易创新 $603986\n买入，逻辑是存储量价齐升，华安11月19日同样给买入；华安11月22日给 #澜起科技 $688008 买入；国金11月21日给 #北方华创\n$002371 买入，指向AI扩产与国产替代；太平洋11月22日给 #龙源电力 $001289\n买入，认为盈利底部逐渐清晰；太平洋11月19日给 #鹏鼎控股 $002938 买入，汽车与服务器用板增长快。开源11月19日首次覆盖\n#寒武纪 $688256 给买入。研报多数仍站在半导体与电力一侧，但上周价格已经否定了短线，研报只当中期参考。\n#热榜\n东财人气榜前列以PCB和小盘题材为主：周五涨停的 #中京电子 $002579、 #超声电子 $000823、 #骏亚科技 $603386、\n#光华科技 $002741、 #华微电子 $600360 都在榜上，另有 #冰山冷热 $000530、 #好当家 $600467\n等低价题材。 #中际旭创 $300308\n周五跌3.72%仍在榜，说明光模块人气在退潮。热榜和PCB短缺逻辑共振，但多是涨停后的人气，追高胜率低。\n#资金面\n周五两市成交约1.42万亿元，较前一日放量，上涨约313家下跌约5236家，资金明显往大市值防守集中。 #工商银行 $601398\n涨3.30%， #建设银行 $601939 涨3.07%， #长江电力 $600900 涨2.40%， #中国广核 $003816\n涨3.45%。周一北向与主力资金盘前数据缺失。\n#中美映射\n20日窗口：美股半导体ETF SOXX跌22.58%、SMH跌24.12%、科技XLK跌18.68%，几乎全部贴在20日低点；只有公用事业XLU、住宅建筑ITB、航空JETS在20日维度微涨。A股20日领先的是银行ETF涨9.07%、红利ETF涨3.60%、电力ETF涨2.55%，通信ETF跌29.57%、人工智能ETF跌17.10%。\n5日窗口：美股板块全线下跌，A股只有银行ETF涨3.23%、红利ETF涨1.63%、电力ETF涨1.45%。\n对照下来，没有进攻方向的双窗口共振，公用事业与电力只算20日的防守共振，趋势没加速；科技在两边都是双窗口同步走弱。\n#期货\n富时A50期货夜盘收12515，跌约0.85%。今晨美股期指反弹，标普期货涨约1.2%，纳指期货涨约1.9%；纽约金约3560美元，涨约1.3%；原油约83.2美元，基本持平。离岸人民币约6.6748。\n#三个方向\n一是银行与红利，20日和5日都在走强，周五逆势放量，继续当底仓。二是水电与核电，偏防守，20日小幅占优。三是PCB与元件，供给短缺加研报加热榜三方互证，但只做回踩不追涨停。半导体设备与存储研报偏多，价格还没止跌，只观察。\n#六只个股\n #工商银行 $601398 周五涨3.30%，大市值防守首选，回落不破9.2元可持有。\n #建设银行 $601939 涨3.07%，与工行同步，看高股息资金是否延续。\n #长江电力 $600900 涨2.40%，电力ETF20日领先，水电现金流稳定。\n #中国广核 $003816 涨3.45%，核电防守属性，低价股弹性稍大。\n #沪电股份 $002463 周五跌0.96%，PCB龙头，服务器板逻辑在，回踩企稳再看。\n #深南电路 $002916 跌0.59%，与PCB短缺逻辑共振，不追高。\n#小盘阿尔法\n今天不选。热榜小盘多是连板人气，缺少完整20日K线核验和财报互证，不凑数。\n#操作提示\n开盘先看A50和美股期指的反抽能否传到A股，若上证守住3500点、上证50继续红，防守线可以持有；若中证1000再跌超2%，减少小票仓位。科技股等出现缩量止跌再说，伊朗风险和美联储加息预期是今天两个外部变量。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘前第一版 2026年11月23日 周一\n#结论 周五A股放量杀跌，上证收3533.79跌1.23%，盘中最低3500.83，深证成指跌3.09%，创业板指跌3.54%，中证1000跌4.89%，只有上证50收涨0.45%。随后美股同日继续出清，标普跌3.70%，纳指跌5.28%，\n#英伟达 $NVDA 跌14.01%。好在周末到今晨，美股期指明显反抽，标普期货约7020涨约1.2%，纳指期货约25597涨约1.9%。今天的判断是低开或平开后分化，防守和高股息继续当压舱石，科技成长先看止跌信号，不抄刀。\n#消息面\n周末偏利空的是外部：特朗普称若新年后与伊朗仍无协议倾向动武，伊朗方面称两艘超大型油轮在霍尔木兹海峡附近触雷，中东风险抬头。马斯克警告人工智能行业明年可能面临严重资金短缺，与上周的AI出清情绪叠加。CME美联储观察显示12月加息25个基点的概率为91.4%（转述），而美财长贝森特警告美联储过度紧缩风险。\n偏利好的是国内：创业板将引入做市商制度，科创板做市规则同步酝酿修订；首批主动ETF今日上市；年内新发基金规模突破万亿元，24家公募同日上报ETF新品；回购增持密集落地。十大券商策略普遍认为不必过度悲观、市场或逐步企稳。个股层面\n#思特威 拟入股晶圆厂加码CIS代工产能， #天孚通信 拟在南昌投建高速光器件项目，但其股价自年内高点回撤超七成。\n#研报面\n周末研报集中在业绩修复和半导体。11月22日太平洋给 #兆易创新 $603986\n买入，逻辑是存储量价齐升，华安11月19日同样给买入；华安11月22日给 #澜起科技 $688008 买入；国金11月21日给 #北方华创\n$002371 买入，指向AI扩产与国产替代；太平洋11月22日给 #龙源电力 $001289\n买入，认为盈利底部逐渐清晰；太平洋11月19日给 #鹏鼎控股 $002938 买入，汽车与服务器用板增长快。开源11月19日首次覆盖\n#寒武纪 $688256 给买入。研报多数仍站在半导体与电力一侧，但上周价格已经否定了短线，研报只当中期参考。\n#热榜\n东财人气榜前列以PCB和小盘题材为主：周五涨停的 #中京电子 $002579、 #超声电子 $000823、 #骏亚科技 $603386、\n#光华科技 $002741、 #华微电子 $600360 都在榜上，另有 #冰山冷热 $000530、 #好当家 $600467\n等低价题材。 #中际旭创 $300308\n周五跌3.72%仍在榜，说明光模块人气在退潮。热榜和PCB短缺逻辑共振，但多是涨停后的人气，追高胜率低。\n#资金面\n周五两市成交约1.42万亿元，较前一日放量，上涨约313家下跌约5236家，资金明显往大市值防守集中。 #工商银行 $601398\n涨3.30%， #建设银行 $601939 涨3.07%， #长江电力 $600900 涨2.40%， #中国广核 $003816\n涨3.45%。周一北向与主力资金盘前数据缺失。\n#中美映射\n20日窗口：美股半导体ETF SOXX跌22.58%、SMH跌24.12%、科技XLK跌18.68%，几乎全部贴在20日低点；只有公用事业XLU、住宅建筑ITB、航空JETS在20日维度微涨。A股20日领先的是银行ETF涨9.07%、红利ET tive","lang":"zh","m":["https://pbs.twimg.com/media/HXwp9ZQbwAA0Dic.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2124621102932799687","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":177},{"id":"2124567835766624716","h":"AntonLaVay","ts":1795371419,"zh":"312 那天，我就是空头。\n我记得当时我是在 6000–7000 刀区间开的 $BTC 空单。\n我清楚地记得那个清晨，Aicoin还是币Coin的警报像疯了一样把我炸醒，抓起手机看了一眼，瞬间清醒跑到电脑前。\n我激动的双手发抖地打开电脑，死死盯着 BitMEX 的订单簿。\n价格砸穿 4000 刀，3开头的时候时，卖盘上接连挂出好几笔千万美元以上级别的强平单，而盘口毫无承接，价格还在自由落体，越砸这种排队枪毙单越多。\n那一刻我毫不怀疑：今天我很可能能看到 $BTC 接近归零… 那币不特么全是我的了。\n然后下一秒，BitMEX 拔网线了。\n我瞬间慌了神，疯狂点着重连，最后只能眼睁睁看着价格在断网的缝隙里弹了回去。\n从此以后我对于做空有了深深的心理阴影，PTSD，我特别怕自己做空砸场子然后被超自然力量制裁…救场的力量很可能会使用盘外招。\n现在的新人可能很难理解，为什么一家交易所宕机就能救下下比特币。\n因为 312 之前，江湖规矩是“永续BitMEX，交割OKEx”，当时币安合约才刚起步，不久前 CZ 和何一还表态过不做合约（不信可以去翻翻币安 BTCUSDT.P 的 K 线起点）。\n当时的 BitMEX 就是全球衍生品的绝对定价中心，加上它是在每天固定时间人工审核提币的机制，极端行情下跨所搬砖根本来不及补血。\n老黑拔掉的那根网线，断掉空头一夜暴富的梦，也改写了整个币圈的权力版图，从此BitMEX 沦为二流，币安合约，FTX等一骑绝尘，都是 312 之后的故事了。","en":"312 那天，我就是空头。\n我记得当时我是在 6000–7000 刀区间开的 $BTC 空单。\n我清楚地记得那个清晨，Aicoin还是币Coin的警报像疯了一样把我炸醒，抓起手机看了一眼，瞬间清醒跑到电脑前。\n我激动的双手发抖地打开电脑，死死盯着 BitMEX 的订单簿。\n价格砸穿 4000 刀，3开头的时候时，卖盘上接连挂出好几笔千万美元以上级别的强平单，而盘口毫无承接，价格还在自由落体，越砸这种排队枪毙单越多。\n那一刻我毫不怀疑：今天我很可能能看到 $BTC 接近归零… 那币不特么全是我的了。\n然后下一秒，BitMEX 拔网线了。\n我瞬间慌了神，疯狂点着重连，最后只能眼睁睁看着价格在断网的缝隙里弹了回去。\n从此以后我对于做空有了深深的心理阴影，PTSD，我特别怕自己做空砸场子然后被超自然力量制裁…救场的力量很可能会使用盘外招。\n现在的新人可能很难理解，为什么一家交易所宕机就能救下下比特币。\n因为 312 之前，江湖规矩是“永续BitMEX，交割OKEx”，当时币安合约才刚起步，不久前 CZ 和何一还表态过不做合约（不信可以去翻翻币安 BTCUSDT.P 的 K 线起点）。\n当时的 BitMEX 就是全球衍生品的绝对定价中心，加上它是在每天固定时间人工审核提币的机制，极端行情下跨所搬砖根本来不及补血。\n老黑拔掉的那根网线，断掉空头一夜暴富的梦，也改写了整个币圈的权力版图，从此BitMEX 沦为二流，币安合约，FTX等一骑绝尘，都是 312 之后的故事了。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXv7L37XcAI2KNi.jpg?name=orig"],"u":"https://x.com/AntonLaVay/status/2124567835766624716","l":[],"ln":[],"t":["关税贸易"],"lk":0,"rt":0,"rp":1,"vw":326},{"id":"2124565443751121252","h":"wufantouzi","ts":1795370848,"zh":"最近两周可能震荡\n但周一周二估计反弹\n12月9号加息0.25%\n就是靴子落地\n12月10号cpi出来\n会是利好涨\n反转最晚就在12月9号","en":"最近两周可能震荡\n但周一周二估计反弹\n12月9号加息0.25%\n就是靴子落地\n12月10号cpi出来\n会是利好涨\n反转最晚就 95362422,"zh":"右侧确认观察条件(多条共振再动手)\n1.下跌后持续缩量,抛压衰竭\n2.指数不再创新低(至少2~3日验证)\n3.反弹阳线要放量;无量反弹=诱多\n4.跌停数量大幅减少,赚钱效应回暖\n5.有连续2~3天的持续主线,不是一日游\n6.利空出来大盘不再大跌(利空钝化)\n不进场:单根大阳线、板块快速轮动、反复批量跌停\n铁律:试仓只用小仓位，禁用杠杆/满融，不猜底满足条件再出手","en":"右侧确认观察条件(多条共振再动手)\n1.下跌后持续缩量,抛压衰竭\n2.指数不再创新低(至少2~3日验证)\n3.反弹阳线要放量;无量反弹=诱多\n4.跌停数量大幅减少,赚钱效应回暖\n5.有连续2~3天的持续主线,不是一日游\n6.利空出来大盘不再大跌(利空钝化)\n不进场:单根大阳线、板块快速轮动、反复批量跌停\n铁律:试仓只用小仓位，禁用杠杆/满融，不猜底满足条件再出手","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2124530102558249227","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":0,"vw":865},{"id":"2124527945364783555","h":"cnfinancewatch","ts":1795361908,"zh":"啥叫“卷”？\n没活？硬干！\n没钱？也干！\n不干？农村的，就得回家种地饿死！\n关于卷这个事儿，目前最神奇的解释！\n从小不知道啥叫休息，没有休息的需要。\n反驳？还真驳不了！","en":"啥叫“卷”？\n没活？硬干！\n没钱？也干！\n不干？农村的，就得回家种地饿死！\n关于卷这个事儿，目前最神奇的解释！\n从小不知道啥叫休息，没有休息的需要。\n反驳？还真驳不了！","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2124527774719492096/vid/avc1/720x1280/-diw8JXQsnHP0nM7.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2124527945364783555","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":1,"vw":1323},{"id":"2124520664828895399","h":"dmjk001","ts":1795360172,"zh":"彭博：强劲财报也挡不住 AI 交易的崩盘\n标普500指数大幅下挫，尽管企业连续第二个季度实现超过30%的利润增长，因为仅凭强劲的财报业绩不足以抵御围绕人工智能交易日益加剧的焦虑情绪。\n对盈利增长已经见顶的担忧并未消散，分析师们已大幅压缩了对下一轮盈利的预期，明年盈利放缓正成为华尔街的共识观点。\n科技板块的估值按市盈率计算已缩水逾40%，这是近三十年来最剧烈的估值重置之一，投资者对此的回应是大幅削减科技仓位。","en":"彭博：强劲财报也挡不住 AI 交易的崩盘\n标普500指数大幅下挫，尽管企业连续第二个季度实现超过30%的利润增长，因为仅凭强劲的财报业绩不足以抵御围绕人工智能交易日益加剧的焦虑情绪。\n对盈利增长已经见顶的担忧并未消散，分析师们已大幅压缩了对下一轮盈利的预期，明年盈利放缓正成为华尔街的共识观点。\n科技板块的估值按市盈率计算已缩水逾40%，这是近三十年来最剧烈的估值重置之一，投资者对此的回应是大幅削减科技仓位。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXvQKWbbMAE5NAS.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2124520664828895399","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":1,"rt":0,"rp":0,"vw":1524},{"id":"2124519983506133298","h":"cnfinancewatch","ts":1795360010,"zh":"问：高尔夫球场生态问题有哪些？中国为什么更加重视这一问题？\n答：\n高尔夫球场确实存在一些普遍的生态危害，但“美国、日本没有出现这种说法”这个印象并不完全准确。争议和监管在三国都存在，真正的差异在于问题的紧迫性、监管的成熟度，以及产业与生态空间的冲突程度。\n🌍 高尔夫球场普遍的生态代价\n无论在哪里，高标准草坪的维护都意味着对自然的深度干预：\n· 巨大的水资源消耗：单个球场每日耗水可达3,000立方米，足以满足1.5万人的需求。在中国，北京球场年耗水曾接近4000万吨，相当于一座百万人口城市的居民用水量。\n· 化学品污染风险：为维持草坪，球场会大量使用化肥、杀虫剂和除草剂。一个千亩球场每月施用的这类化学品可达13吨，其中大部分未被吸收，会随雨水渗入地下水或流入河流。全球范围内，球场每年农药化肥用量可达1,500公斤。\n· 栖息地破坏与水资源竞争：建设过程往往需要清除原生植被，破坏野生动物栖息地，并在缺水地区与农业、居民争夺水源。\n🔍 为什么会有“美日没有危害”的印象？\n这主要源于认知偏差和发展阶段差异，而非美日不存在问题。\n在美国，争议一直以不同形式存在，且常进入公共视野。近期就有抗议活动，反对大学高尔夫设施可能带来的农药径流污染当地水井和河流；在干旱的亚利桑那州，球场用水也持续引发争论；佛罗里达州甚至在2024年因计划在州立公园内建球场而面临濒危物种保护的法律挑战。美国早已建立起相对成熟的管理框架，通过《清洁水法》许可、最佳管理实践（BMPs）和缓冲带要求等，将许多问题内化为合规成本和运营标准，而非任其演变为公共危机。\n在日本，环境争议同样存在，且监管颇为细致。日本环境省专门制定了指导方针，对球场排出水中的农药浓度设定“水浊指針值”和“水産指針值”进行双重管控。近期，世界自然基金会（WWF）也强烈反对冲绳石垣岛的大型高尔夫度假村计划，因其可能威胁拉姆萨尔湿地和特别天然纪念物冠鹫的栖息地，并带来地下水与水质污染风险。日本的争议更多聚焦于新建项目对敏感生态的冲击，而非已建球场的日常运营污染。\n⚠️ 为什么在中国被突出为“严重生态危害”？\n在中国，高尔夫球场的问题被放大，根源在于资源禀赋、治理环境和产业模式的叠加效应。\n第一，水资源约束极其刚性。 中国北方普遍缺水，而高尔夫球场的高耗水特性直接触碰了生存底线。在华北等地，球场偷采地下水用于灌溉的现象曾被频繁曝光，这不仅是资源浪费，更是对子孙后代水源的战略性透支。\n第二，监管缺位与违规建设形成恶性循环。 自2004年起，国家多次发文明令禁止新建高尔夫球场。然而，球场数量却在此期间从约170家逆势增长到约600家。大量项目以“体育公园”“绿化”之名违规上马，这意味着它们的污染治理设施和环保标准往往完全缺失，污染处于失控状态。\n第三，生态脆弱区的冲突格外尖锐。 许多违规球场直接建在生态极度敏感的区域。在内蒙古鄂尔多斯，球场建在了国家投入巨资治理的砒砂岩沙棘生态林中，为了建设甚至将防风固沙的沙棘林连根挖除，直接摧毁了脆弱的生态屏障。这种将生态工程成果转化为少数人娱乐场所的冲突，在舆论中具有极强的象征意义和冲击力。\n所以，美日并非没有生态危害的“净土”，而是它们的争议在既有框架内被消化和管控。中国的“严重危害”叙事，是对在极端缺水与生态脆弱条件下，资本驱动的违规开发可能造成不可逆损害的真实警示。这种警示的严厉程度，本质上与资源环境的承载底线是成正比的。","en":"问：高尔夫球场生态问题有哪些？中国为什么更加重视这一问题？\n答：\n高尔夫球场确实存在一些普遍的生态危害，但“美国、日本没有出现这种说法”这个印象并不完全准确。争议和监管在三国都存在，真正的差异在于问题的紧迫性、监管的成熟度，以及产业与生态空间的冲突程度。\n🌍 高尔夫球场普遍的生态代价\n无论在哪里，高标准草坪的维护都意味着对自然的深度干预：\n· 巨大的水资源消耗：单个球场每日耗水可达3,000立方米，足以满足1.5万人的需求。在中国，北京球场年耗水曾接近4000万吨，相当于一座百万人口城市的居民用水量。\n· 化学品污染风险：为维持草坪，球场会大量使用化肥、杀虫剂和除草剂。一个千亩球场每月施用的这类化学品可达13吨，其中大部分未被吸收，会随雨水渗入地下水或流入河流。全球范围内，球场每年农药化肥用量可达1,500公斤。\n· 栖息地破坏与水资源竞争：建设过程往往需要清除原生植被，破坏野生动物栖息地，并在缺水地区与农业、居民争夺水源。\n🔍 为什么会有“美日没有危害”的印象？\n这主要源于认知偏差和发展阶段差异，而非美日不存在问题。\n在美国，争议一直以不同形式存在，且常进入公共视野。近期就有抗议活动，反对大学高尔夫设施可能带来的农药径流污染当地水井和河流；在干旱的亚利桑那州，球场用水也持续引发争论；佛罗里达州甚至在2024年因计划在州立公园内建球场而面临濒危物种保护的法律挑战。美国早已建立起相对成熟的管理框架，通过《清洁水法》许可、最佳管理实践（BMPs）和缓冲带要求等，将许多问题内化为合规成本和运营标准，而非任其演变为公共危机。\n在日本，环境争议同样存在，且监管颇为细 这里核心07年初开始，房贷已经大面积开始违约。\n当下的状态是企业的债务、采购承诺、租赁合约、担保整体规模确实很大；11月13号的美联储报告也有提到。但周期都很长。采购承诺、租约、担保都是五年起步持续十几年的周期，并不是立马就兑现。举几个例子：\n1）Meta有2,789.9亿美元尚未起租的租约，2026年余下时间至2036年陆续开始，租约基二三十年，最长30年。\n2）谷歌披露 披露一年期以上的未来固定或担保承诺为7,070亿美元，绝大部分是长期供应协议。能源协议期限为2–26年，最远至2054年。\n3）再如英伟达\n本周三季度财报披露的 5,180亿美元未来承诺，数据截至10月25日。公司另列 320亿美元算力云商协议和 1,180亿美元担保敞口。这里需要说明320亿美元买的是满足条件后才开始计算。\n其中3900多亿美金都是的采购承诺其中2700亿美金是未来一年半的采购承诺，看着很可大。但实际上按照英伟达现在的业务体量、他确实需要这么大的采购量。今年英伟达大概有4200亿美金营收、74%的毛利、那么成本至少就是1100亿美金这都是采购成本。英伟达官方预计下一年75%的增速，如果毛利保持不变、意味着下一年采购成本就到了1900亿美金。\n而给OpenAI／SB Energy 担保的俄亥俄州项目，首批预计到2028年才生效。本周代理ceo也说只有当数据中心的土地、电力和外壳等基础设施真正就绪时，担保才会生效。\n4）美联储报告里先进计算相关公司债务累计1.1万亿美金，规模确实很大但是期限也很长。\n富时罗素统计过几家美国云巨头172 只面值合计 4,230.2 亿美元债券，平均本金回收年限是 17.27 年。 微软最长平均 22.69 年；大家最担心的甲骨文债务期限最短平均 15.70 年。\n说到这点能说明什么？\n2007年美国房贷已经大面积违约，违约层层传导到了房贷、次贷以及各种基于抵达贷款通过搭积木形成的各类金融衍生品上。\n而当下至少我们并没有看到哪一家大云厂商、新云厂商、大科技开始实质性的违约，美联储金融稳定报告也是在提前做预防，以防AI收入不及预期会如何影响金融稳定；\n其实市场跟美联储一样、都是把未来潜在的风险提前拿来计价。\n当然同一个数据，不同的人看到的反应也不一样。\n正面反应：这些债务、采购承诺、租赁合约、融资担保，要么期限很长、要么还没开始生效；\n负面反应：这么大的融资体量、生态担保，一旦商业化不及预期一定会爆一个大的。\n所以整体上来看，\n部分半导体上半年抛物线形态、但基本面商业化趋势远远好于2000年时期。\n虽然整体债务、承诺担保规模庞大，但是周期很长、然后也没实质性违约。达不到2008年、可能也就05年。而且未来如果商业化继续加速、商业化增速超过资本开支增速、这种潜在风险回比消除很多。\n所以当下是这对债务风险和28年开支断崖的担心，然后中选后政治生态剧变带动政策逆转的强烈担心，导致集中仓位出清。\n但就此照搬零零年和零八年也并不准确。\n短期看仓位出清程度，\n还是引用推文聊的中长期看：\n1）油价/通胀走势决定联储利率走向；\n2）新政治生态下AI政策比当下市场预期的要更收紧和会略缓和些；\n3）AI商业化是不是继续处于加速状态；","en":"现在是2000年还是2008年？最近市场大跌，大家对此争论又起。从几个点来看当下跟00年或者08年的差异点。\n1、与2000年对比\n上半年半导体板块很多标的股价确实走出了抛物线的形态、跟2000年有一定相似之处。\n但看本质的差异：\n2000年前后的互联网行业并没找到商业模式，从00年一直到06、07年 ，游戏、广告、电商、增值服务这四大商业模式才真正被确立。当下的状态是基础设施非常完善、信息传递速度很快，所以AI商业化的速度很快。年初这里\n当下AI的商业化进展其实还是可以的，几个例证：\n1）之前这里 聊到Anthropic今年做到500～600亿美是没问题明年大概率能突破1000亿美金的实际营收体量，这其实是一个很大的体量了。\n2）之前这里\n互联网的商业化就是这样，一旦被验证后渗透率和商业化会一路提升到饱和阶段，现在看商业化应该还没到饱和阶段。\n2、跟2008年的对比\n2006年下半年美国房价见顶，2007 年 4月2日，美国第二大房地产抵押贷款机构新世纪金融申请破产，整个二三季度美国一大半抵押贷款机构破产，07年8 月，美国浮息房贷的严重拖欠率已接近 20%，同月法国巴黎银行三只基金暂停赎回，9月英国北岩银行破产，花旗、瑞信等披露在次贷上巨额亏损。次贷证券的买家也在借短钱，资产一旦难估值，资金方不肯续作，持有人只能补抵押品或卖资产，家庭月供的缺口就这样传到了原本指望随时能赎回的投资者。底层资产价格崩溃开始一步步往上层传
