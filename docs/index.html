<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经资讯工作台 · X 信源</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d4a24c'/><text x='16' y='23' font-size='19' font-family='system-ui' text-anchor='middle' fill='%230a0d13'>财</text></svg>">
<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

ewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120410165862400476","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["A股港股","AI科技","财报"],"lk":3,"rt":0,"rp":3,"vw":1436},{"id":"2120410027118989511","h":"cnfinancewatch","ts":1794380120,"zh":"A股盘中｜2026-11-11 北京时间14:30\n#结论\n今天是光通信的单边日。CPO概念单板块主力净流入约194亿元，光通信模块、光纤概念也都在120亿元以上，创业板指涨3.07%，上证50反而翻绿，权重和题材两头冷、中间的AI硬件独热。驱动很清楚：微软公开游说放弃对中国光收发器的进口禁令，压在板块头上一个多月的最大利空松动。但要分清性质，通信ETF近20日仍跌16%，这是超跌后的5日反弹，不是趋势反转。尾盘重点看中际旭创、新易盛能不能稳住15%以上的涨幅，守住就是明天还有接力的信号，冲高回落就按脉冲处理。\n#盘面速览\n截至14:30前后，上证指数3682.40点涨0.51%，深证成指涨1.29%，创业板指涨3.07%，科创50涨2.43%，创业板50涨3.77%，上证50跌0.19%，沪深300涨0.47%，中证1000涨1.26%。两市上涨约3234家、下跌约1845家，沪深两市成交合计约1.48万亿元（按上证指数与深证成指口径相加）。涨停82家，跌停0家，炸板20家，封板率尚可。恒生指数同期跌0.71%，港股科网普跌，光通信同样逆势走强。\n#板块与风格\n领涨行业为通信网络设备及器件涨7.12%、通信线缆涨6.0%、印制电路板涨5.57%、元件涨4.71%、激光设备涨4.47%、集成电路封测涨4.14%。概念端 #CPO 涨5.69%、 #光通信模块 涨5.14%、 #光纤 涨4.55%。领跌的是白酒跌3.14%、光伏主材跌2.57%，茅指数跌1.45%、宁组合跌1.04%。风格是大盘成长加中小盘科技，消费和老核心资产被当作资金来源。\n#资金面\n沪深两市主力合计净流入约163亿元。行业层面电子净流入159.7亿元、通信设备126.5亿元、元件74.8亿元、半导体65.3亿元；流出端医药生物净流出39.9亿元、电力设备32.5亿元、白酒10.6亿元。个股主力净流入前列是 #中际旭创 29.5亿元、 #新易盛 29.0亿元、 #东山精密 22.4亿元、 #天孚通信 14.7亿元、 #兆易创新 10.7亿元、 #沪电股份 10.4亿元。北向实时数据暂不可用。\n#涨停分布\n82家涨停里汽车零部件10家、通用设备8家、专用设备7家、通信设备6家、元件5家。连板高度在4板，大东方、日出东方领衔，亚玛顿、文投控股、锋龙股份、光洋股份、东方环宇3板。光模块主力多是20cm大涨而非一字，说明是机构型资金在推，不是游资接力。游戏因腾讯新动作有4家涨停，属于支线。\n#盘中消息\n一是微软向美国政府施压要求放弃中国光收发器进口禁令，这是今天的总开关。二是存储厂商酝酿新一轮涨价，先从企业级开始，兆易创新与长鑫科技放量。三是台积电10月营收同比增60%，并批准向Anthropic和OpenAI合计投资10亿美元，AI资本开支叙事没有降温。四是北京发布具身智能支持政策，提升具身数据供给与专用算力保障，但机器人板块盘中只是温和跟涨。偏空的一面，美国10月CPI超预期，高盛把美联储第三次加息预期放到明年3月，现货黄金逼近4000美元关口，海外流动性仍是悬在成长股头上的变量。午后《会计改革与发展十五五规划》发布，严打财务造假，对题材股中的业绩瑕疵标的是约束。\n#研报面\n11月11日华安证券给 #三花智控 买入评级，理由是收入增速回升、液冷与机器人业务推进；华鑫证券覆盖 #科士达 买入，看点在数据中心项目。11月10日中邮证券给 #奥士康 买入，题目直接写算力PCB起量；中邮证券给 #强一股份 买入，提到算力探针份额提升与存储进展；太平洋给 #新亚电子 买入，提到高频高速线缆放量与光芯片布局。今天领涨的光模块龙头两日内没有新出的个股研报，行情先于研报。\n#中美映射\n美股近20日最强的是住房建筑ITB涨13.65%、医疗XLV涨11.33%、医疗器械IHI涨10.21%，同口径半导体SMH近20日跌17.77%、近5日跌6.73%，科技XLK近20日跌13.94%。A股机器人ETF近20日涨约11%、近5日涨约3.6%，是A股这边少有的双窗口同现。通信ETF近5日涨5.05%但近20日跌16.42%，半导体设备ETF近5日涨约10%、近20日跌约11.7%，都属仅5日的短线脉冲，美股同类方向也没有给出共振，追高要克制。纳指期货盘中涨约1.3%，标普期货涨约0.5%，外盘对今天的A股科技算是顺风。\n#三个方向\n第一，光模块与CPO。利空松动加超跌反弹，资金最集中，但20日趋势仍弱，看反弹空间不看反转。第二，PCB与元件。算力PCB有研报和资金双重印证，沪电、东山精密双双涨停，节奏比光模块稳。第三，存储芯片。涨价消息加兆易创新、长鑫科技放量，是今天新冒出来的线索，持续性待验证。\n#六只个股\n #中际旭创 $300308 盘中涨约15%，主力净流入29.5亿元居全市场第一，光模块风向标。\n #新易盛 $300502 涨约17%，主力净流入29亿元，弹性最大，PE不到20倍，估值不算贵。\n #天孚通信 $300394 涨约14%，光器件平台，主力净流入近15亿元。\n #沪电股份 $002463 涨停，算力PCB核心，主力净流入10.4亿元。\n #东山精密 $002384 涨停，主力净流入22.4亿元，PCB叠加光模块业务。\n #兆易创新 $603986 涨约5.9%，存储涨价最直接的受益标的之一，主力净流入近11亿元。","en":"A股盘中｜2026-11-11 北京时间14:30\n#结论\n今天是光通信的单边日。CPO概念单板块主力净流入约194亿元，光通信模块、光纤概念也都在120亿元以上，创业板指涨3.07%，上证50反而翻绿，权重和题材两头冷、中间的AI硬件独热。驱动很清楚：微软公开游说放弃对中国光收发器的进口禁令，压在板块头上一个多月的最大利空松动。但要分清性质，通信ETF近20日仍跌16%，这是超跌后的5日反弹，不是趋势反转。尾盘重点看中际旭创、新易盛能不能稳住15%以上的涨幅，守住就是明天还有接力的信号，冲高回落就按脉冲处理。\n#盘面速览\n截至14:30前后，上证指数3682.40点涨0.51%，深证成指涨1.29%，创业板指涨3.07%，科创50涨2.43%，创业板50涨3.77%，上证50跌0.19%，沪深300涨0.47%，中证1000涨1.26%。两市上涨约3234家、下跌约1845家，沪深两市成交合计约1.48万亿元（按上证指数与深证成指口径相加）。涨停82家，跌停0家，炸板20家，封板率尚可。恒生指数同期跌0.71%，港股科网普跌，光通信同样逆势走强。\n#板块与风格\n领涨行业为通信网络设备及器件涨7.12%、通信线缆涨6.0%、印制电路板涨5.57%、元件涨4.71%、激光设备涨4.47%、集成电路封测涨4.14%。概念端 #CPO 涨5.69%、 #光通信模块 涨5.14%、 #光纤 涨4.55%。领跌的是白酒跌3.14%、光伏主材跌2.57%，茅指数跌1.45%、宁组合跌1.04%。风格是大盘成长加中小盘科技，消费和老核心资产被当作资金来源。\n#资金面\n沪深两市主力合计净流入约163亿元。行业层面电子净流入159.7亿元、通信设备126.5亿元、元件74.8亿元、半导体65.3亿元；流出端医药生物净流出39.9亿元、电力设备32.5亿元、白酒10.6亿元。个股主力净流入前列是 #中际旭创 29.5亿元、 #新易盛 29.0亿元、 #东山精密 22.4亿元、 #天孚通信 14.7亿元、 #兆易创新 10.7亿元、 #沪电股份 10.4亿元。北向实时数据暂不可用。\n#涨停分布\n82家涨停里汽车零部件10家、通用设备8家、专用设备7家、通信设备6家、元件5家。连板高度在4板，大东方、日出东方领衔，亚玛顿、文投控股、锋龙股份、光洋股份、东方环宇3板。光模块主力多是20cm大涨而非一字，说明是机构型资金在推，不是游资接力。游戏因腾讯新动作有4家涨停，属于支线。\n#盘中消息\n一是微软向美国政府施压要求放弃中国光收发器进口禁令，这是今天的总开关。二是存储厂商酝酿新一轮涨价，先从企业级开始，兆易创新与长鑫科技放量。三是台积电10月营收同比增60%，并批准向Anthropic和OpenAI合计投资10亿美元，AI资本开支叙事没有降温。四是北京发布具身智能支持政策，提升具身数据供给与专用算力保障，但机器人板块盘中只是温和跟涨。偏空的一面，美国10月CPI超预期，高盛把美联储第三次加息预期放到明年3月，现货黄金逼近4 今有锋龙股份”，于是推荐同带“龙”字的低位股。昨天的“东方系”也是同一种名字炒作。这和券商讲的产业逻辑基本无关，是高低切换里最该警惕的部分。\n四、其他事件帖：平头哥分拆带出的“合作商”挖掘，华为新型存储试商用，深圳APEC概念股，峨眉山的猴年加冰雪。共同点是事件驱动、周期短。\n被忽略的风险：上午沪指收跌、成交缩量、两千六百多只个股下跌，但社区几乎没人讨论白酒、医药、贵金属的亏钱效应，也很少提美国利率。监管方面，韭研公社置顶了打击吹票的专帖，平台自身也在约束荐股；连续涨停股被交易所重点监控、发异动公告的可能性同样要算进去。\n海外：Stocktwits与WSB\n一、Stocktwits。热门榜第一是CoreWeave，其后是英伟达、Zeta、HPE，微软、Rocket Lab也在榜上，Anthropic相关代码同样上榜。CoreWeave最新30条消息中，带标签的14条看多、1条看空，情绪偏亢奋：有人喊“到月球”，有人说还要再涨两成才能回本，也有人在拆它的资产抵押贷款融资结构。英伟达最新30条里，带标签的7条看多、3条看空，大部分没标注。讨论明显分化：一边是“错过的人该上车了”“GPU需求不会消失，替代品在哪”，一边是围绕CEO私事和国家安全的调侃与担忧，还夹着未经证实的收购传闻。\n二、WSB（二手转述）。据Buzzberg整理，11月10日美股盘中有WSB用户披露在178美元买入100股英伟达，另有人晒出2027年3月到期、行权价100美元的看跌期权；还有帖子讨论标普远期市盈率17.7倍与席勒市盈率接近40的矛盾，以及AMD低位挂单成交、认为200日均线附近有人接。\n与券商口径的异同：机构盯利率路径和资本开支回报，散户更盯个股弹性和抄底时点。被忽略的风险也很具体：英伟达已收在168.80美元，低于那位用户的买入价；利率仍在上行，CoreWeave的高杠杆融资在加息周期里会更贵。\n小结：国内散户在高低切换和题材接力中情绪偏热，海外散户在抄底和对冲之间来回摇摆。两边都低估了同一个变量，就是利率。\n以上为公开讨论的整理与编辑判断，不构成投资建议。","en":"散户热议｜2026-11-11·午间\n数据时点：北京时间11月11日约13:15–13:17抓取。国内依据韭研公社首页公开帖（发帖时间为11月10日晚至11日中午）；海外依据Stocktwits公开数据（热门榜，以及英伟达、CoreWeave两只股票各最新30条消息，时间约北京时间12:00–13:16）。Reddit WallStreetBets直接抓取被拦截，WSB部分引自第三方汇总站Buzzberg对11月10日美股盘中帖子的整理，属二手转述。下文帖子观点只代表发帖人，内容未经核实；情绪统计只限所列样本，不代表全体。\n国内：韭研公社\n一、光模块“利空出尽”。昨晚有用户转发券商机械团队观点，标题是海外大厂反对FCC、板块有望反弹。核心论点是选举之后FCC规则制定阻力会变大，光板块从高点回调七成以上，近日外围利空下却很坚挺，说明筹码结构改善。今天上午这条逻辑兑现得很充分。和券商口径的差别在于：券商讲订单和产能，社区更爱讲“平权”，有帖子直接推荐二十亿市值的光模块配套小票，理由只是一笔收购。这种低市值补涨思路在龙头大涨日最活跃，也最容易接最后一棒。\n二、AI游戏与AI漫剧。午间有多篇帖子集中讨论“AI游戏”，引用的说法是Anthropic新模型八小时生成一款可运行的射击游戏，用来论证游戏开发门槛大幅下降，并点名富春股份、凯撒文化、名臣健康等。该说法本文未核实。另有帖子把腾讯鹅次元内测、沙特财团收购沐瞳获批、京东短剧串成“AI内容变现”主线。情绪明显偏多，但这是典型的题材扩散阶段：高标文投控股已走出多日连板（各来源对板数统计不一），后排跟风多是首板。\n三、机器人与玄学。机器人帖子里有偏研究的零部件拆解，比如柔轮、面罩、灵巧手电机；也有纯名字联想，比如“前有龙江交通，今有锋龙股份”，于是推荐同带“龙”字的低位股。昨天的“东方系”也是同一种名字炒作。这和券商讲的产业逻辑基本无关，是高低切换里最该警惕的部分。\n四、其他事件帖：平头哥分拆带出的“合作商”挖掘，华为新型存储试商用，深圳APEC概念股，峨眉山的猴年加冰雪。共同点是事件驱动、周期短。\n被忽略的风险：上午沪指收跌、成交缩量、两千六百多只个股下跌，但社区几乎没人讨论白酒、医药、贵金属的亏钱效应，也很少提美国利率。监管方面，韭研公社置顶了打击吹票的专帖，平台自身也在约束荐股；连续涨停股被交易所重点监控、发异动公告的可能性同样要算进去。\n海外：Stocktwits与WSB\n一、Stocktwits。热门榜第一是CoreWeave，其后是英伟达、Zeta、HPE，微软、Rocket Lab也在榜上，An 还要至少两次加息。需要更正一点：邮件称10年期美债收益率“突破5%”，实际收盘为4.986%，是逼近而非突破。首当其冲的是高估值成长股和外资重仓资产，港股科技今天就是例子。截至中午美股期货小幅回升，但只要长端收益率贴着5%，任何反弹都会被质疑。\n第二，英伟达风波与AI资本开支情绪。英伟达周二跌5.53%收168.80美元，围绕CEO的董事会调查继续发酵，国会议员已把矛头指向其对华芯片销售。软银公布4至9月亏损，今天东京盘中一度跌10.5%。对A股而言，光模块今天逆势走强说明传导出现分化，但不代表免疫，美股科技若继续杀估值，A股算力链的高位筹码会先松动。\n第三，消费权重、避险资产走弱叠加缩量。白酒、乳业、贵金属、航空领跌，金价随实际利率回落；【邮件转述】两融余额前一交易日减少13.85亿元。缩量下的题材抱团，最怕高位股集中兑现。\n操作上，仓位中性偏低，主线集中在光模块龙头和机器人中有订单的标的，不追连板。下午重点看两件事：创业板能否守住1%左右的涨幅，港股科技能否止跌。\n另需说明：邮件称Take-Two“指引令人失望”，与公开收盘数据不符（该股周二涨8.31%，重申全年指引），本文未采用。\n以上为基于公开信息的分析与推测，不构成投资建议。","en":"热点财经新闻综述｜2026-11-11·午间\n数据时点：北京时间2026年11月11日约13:15–13:18采集。依据：本期新收到的两封热点财经邮件（早间件08:10、午间件13:10），交叉核对新华财经、智通财经、上海证券报、中新经纬、新浪港股、钛媒体、路透、CNBC、TechCrunch、美联社、日经等公开报道。标注【邮件转述】的内容未经独立核实，不作定论。\n今日判断\n上午是“外冷内热、指数分化”。已核实的数据：沪指午间跌0.24%报3654.95点，深成指涨0.11%，创业板指涨0.99%报2519.14点，沪深两市半日成交约9283亿元，比上一交易日同期缩量约320亿元；港股恒指跌0.83%报24352.69点，恒生科技指数跌1.36%。隔夜美国10月CPI环比0.4%、核心0.3%，都比预期高0.1个百分点，10年期美债收益率收在4.986%，2年期一天升17个基点到4.73%，期货已把12月加息当成定局。利率这么紧，A股资金却没有离场，而是从白酒、贵金属、创新药里撤出来，挤进光模块、机器人和AI内容。我们的看法是：下午沪指仍会被消费权重拖着走，创业板的强势只靠少数高景气方向撑着，缩量环境下别把结构行情当成全面反转。\n三大利多方向（由强到弱）\n第一，光模块与CPO：政策尾部风险后移，订单有验证。路透11月10日报道，微软等公司和行业团体正游说特朗普政府叫停对中国新型光收发器的进口禁令；据报道FCC考虑的门槛是3.2T规格，这一代产品要到2028年才量产。一个悬了几个月的尾部风险被往后推了。加上中际旭创称主要客户订单已基本覆盖2027年，剑桥科技披露大幅扩产计划，午间中际旭创涨8.26%报509.89元，市值重回6000亿元，港股中际旭创也涨超7%。受益的是光模块龙头、光器件和高端PCB。投资含义：业绩能对上的龙头优于小市值跟风。制约在于游说不等于政策落地，FCC至今没有公开表态；英伟达若继续下跌，情绪会反复。\n第二，人形机器人与物理AI：催化密集。机器人板块早盘反复活跃，锋龙股份、光洋股份走出3连板。【邮件转述】谷歌机器人模型进入奔驰产线、具身智能标准化提速、国资与机构扎堆调研。含义：零部件里有订单或送样进度的标的更有支撑。制约：连板股多是情绪接力，业绩兑现期还远。\n第三，AI内容与游戏：大厂入局。腾讯“鹅次元”AI陪伴产品内测，【邮件转述】京东内测短剧产品，AI漫剧、游戏板块走强。Anthropic已启动IPO路演，发行区间70至78美元，按完全摊薄口径估值最高约1.4万亿美元，预计11月19日在纳斯达克挂牌，给AI应用叙事提供了一个估值锚。制约：题材扩散快、变现慢，高位连板股分歧在加大。\n三大利空方向（由强到弱）\n第一，美国利率重定价。核心CPI连续第三个月环比0.3%，美联储理事沃勒表示12月可考虑加息50个基点，达拉斯联储主席洛根认为可能还要至少两次加息。需要更正一点：邮件称10年期美债收益率“突破5%”，实际收盘为4.986%，是逼近而非突破。首当其冲的是高估值成长股和外资重仓资产，港股科技今天就是例子。截至中午美股期货小幅回升，但只要长端收益率贴着5%，任何反弹都会被质疑。\n第二，英伟达风波与AI资本开支情绪。英伟达周二跌5.53%收168.80美元，围绕CEO的董事会调查继续发酵，国会议员已把矛头指向其对华芯片销售。软银公布4至9月亏损，今天东京盘中一度跌10.5%。对A股而言，光模块今天逆势走强说明传导出现分化，但不代表免疫，美股科技若继续杀估值，A股算力链的高位筹码会先松动。\n第三，消费权重、避险资产走弱叠加缩量。白酒、乳业、贵金属、航空领跌，金价随实际利率回落；【邮件转述】两融余额前一交易日减少13.85亿元。缩量下的题材抱团，最怕高位股集中兑现。\n操作上，仓位中性偏低，主线集中在光模块龙头和机器人中有订单的标的，不追连板。下午重点看两件事：创业板能否守住1%左右的涨幅，港股科技能否止跌。\n另需说明：邮件称Take-Two“指引令人失望”，与公开收盘数据不符（该股周二涨8.31%，重申全年指引），本文未采用。\n以上为基于公开信息的分析与推测，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120386565910446149","l":[],"ln":[],"t":["美联储","美股","A股港股","AI科技","黄金"],"lk":0,"rt":0,"rp":1,"vw":1714},{"id":"2120386057447395797","h":"business","ts":1794374405,"zh":"正如 @bethkowitt 所说（via @opinion），在英伟达 CEO 黄仁勋的层面上，不存在所谓的私生活","en":"At Nvidia CEO Jensen Huang’s level, there is no such thing as a private life, @bethkowitt says (via @opinion)","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120386057447395797","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/opinion/articles/2026-11-10/jensen-huang-affair-nvidia-ceo-should-have-known-better?taid=6af3fb05c6e52100014ae680&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":8,"rt":1,"rp":2,"vw":11454},{"id":"2120385751678648698","h":"cnfinancewatch","ts":1794374332,"zh":"热点财经新闻 午间\n2026-11-11 13:10:49 北京时间\n【热点财经新闻 · 午间】2026年11月11日\n数据源：A股十大财经源 + 英文十大财经源（本次共取用 420 条素材）\n一、今日中国A股热点二十条\n（一）\n1、事件：据同花顺热股榜，文投控股（600715）当日+10.18%，录得12天8板，居热股榜第3名、东财人气榜第1名，题材为AI漫剧、剧集发行与北京国资。\n2、涉及个股：文投控股（600715），传媒短剧游戏板块；慈文传媒（002343）+4.72%、掌阅科技（603533）-2.62%同属短剧游戏与AI语料方向。\n3、影响：偏多，强度中，属当日情绪影响，连板高度已高，追高需防分歧，持续性取决于短剧与AI内容题材能否扩散。\n（二）\n1、事件：据同花顺热股榜，日出东方（603366）当日+10.02%，4天4板，题材为“东方系”、空气能热泵、储能与三季报增长。\n2、涉及个股：日出东方（603366），热泵与储能概念；大东方（600327）+9.93%同属“东方系”4天4板，东方海洋（002086）+0.65%亦在榜。\n3、影响：偏多，强度中，属当日情绪影响，“东方系”名称炒作特征明显，缺乏基本面支撑的连板股回撤风险大。\n（三）\n1、事件：据同花顺热股榜，襄阳轴承（000678）当日+10.02%，2天2板，题材为机器人轴承、汽车轴承与湖北国资，东财人气榜排名升9位。\n2、涉及个股：襄阳轴承（000678），减速器与机器人零部件方向；光洋股份（002708）+10.01%3天3板、锋龙股份（002931）+10.01%3天3板同属人形机器人关节与机电组件。\n3、影响：偏多，强度中，属情绪与产业逻辑叠加，机器人零部件是当日资金主线之一，需跟踪订单与送样进展能否兑现。\n（四）\n1、事件：据同花顺热股榜与东财人气榜，中际旭创（30030 "ts":1794369956,"zh":"Anthropic IPO：估值约1.26-1.41T，企业需求支撑增长，新模型进一步提效\n公司拟公开发售8.25亿股A类普通股，定价70—78美元，对应发售总额577.5—643.5亿美元，按约180.13亿股扩展稀释口径估算，#估值约1.26—1.41T美元。\n路演材料要点：\n#增长基础拓宽。10月年化收入810亿美元、环比+14.1%，Q3收入169.6亿美元，同比+1127%、环比+46.7%。截至9月底，年贡献收入超10万美元客户由去年底约1,500家增至11,900余家，非前五大客户贡献79%收入，新增客户与扩单共同驱动增长。\n#Cowork打开第二增长曲线。按发布后相同时长比较，年化收入曲线领先Claude Code。超50%财富500强企业年支出达10万美元，应用向办公、金融、医药研发扩散，生命科学、机器人进一步拓展业务边界。增长空间从开发者工具延伸至更广泛的知识劳动（40万亿空间）。\n#提效改善盈利，短期算力拖累利润。前三季度毛利率超85%、扣算力后利润率43%、调整后经营利润率12%。Q3调整后经营利润24.63亿美元，利润率由19%降至15%，主要受50亿美元高成本短期算力支出影响。GAAP经营亏损5.67亿美元。公司目标35%以上调整后经营利润率。\n#资金充裕，长期承诺仍需需求兑现。 现金及短期投资约1,320亿美元，算力承诺约9,009亿美元、延伸至2045年，包含现有合同、未起租租赁及部分可取消或短期安排，压力取决于付款节奏与退出条件。\n此外，#发布Fable 5.2，能力提升、成本下降。输入/输出价格降至8/40美元/百万Token，降价20%、生成速度最高提升30%。FrontierCode成绩32.4%→49.1%。该评测中，较低思考投入下以约半数费用达到Opus 5.5近似成绩。\n科研工程突破，完整RSI仍待验证。科学任务成绩52.6%→74.6%，三款电子设备设计经人工制造验证可运行，能力由代码延伸至科研、硬件。公司同时限制部分直接加速AI研发的能力，内核优化及模型架构改进约维持Opus 5.5水平。\n#总结：Anthropic IPO估值由于AI板块回调后有所下修（从此前2T到目前1.26-1.41T）。商业化逻辑来自企业客户扩张和模型提效，使用不再集中于少数大客户，新模型继续以低成本换更多用量。后续增长重点看code以外的增量，cowork和科研工程进展顺利。","en":"Anthropic IPO：估值约1.26-1.41T，企业需求支撑增长，新模型进一步提效\n公司拟公开发售8.25亿股A类普通股，定价70—78美元，对应发售总额577.5—643.5亿美元，按约180.13亿股扩展稀释口径估算，#估值约1.26—1.41T美元。\n路演材料要点：\n#增长基础拓宽。10月年化收入810亿美元、环比+14.1%，Q3收入169.6亿美元，同比+1127%、环比+46.7%。截至9月底，年贡献收入超10万美元客户由去年底约1,500家增至11,900余家，非前五大客户贡献79%收入，新增客户与扩单共同驱动增长。\n#Cowork打开第二增长曲线。按发布后相同时长比较，年化收入曲线领先Claude Code。超50%财富500强企业年支出达10万美元，应用向办公、金融、医药研发扩散，生命科学、机器人进一步拓展业务边界。增长空间从开发者工具延伸至更广泛的知识劳动（40万亿空间）。\n#提效改善盈利，短期算力拖累利润。前三季度毛利率超85%、扣算力后利润率43%、调整后经营利润率12%。Q3调整后经营利润24.63亿美元，利润率由19%降至15%，主要受50亿美元高成本短期算力支出影响。GAAP经营亏损5.67亿美元。公司目标35%以上调整后经营利润率。\n#资金充裕，长期承诺仍需需求兑现。 现金及短期投资约1,320亿美元，算力承诺约9,009亿美元、延伸至2045年，包含现有合同、未起租租赁及部分可取消或短期安排，压力取决于付款节奏与退出条件。\n此外，#发布Fable 5.2，能力提升、成本下降。输入/输出价格降至8/40美元/百万Token，降价20%、生成速度最高提升30%。FrontierCode成绩32.4%→49.1%。该评测中，较低思考投入下以约半数费用达到Opus 5.5近似成绩。\n科研工程突破，完整RSI仍待验证。科学任务成绩52.6%→74.6%，三款电子设备设计经人工制造验证可运行，能力由代码延伸至科研、硬件。公司同时限制部分直接加速AI研发的能力，内核优化及模型架构改进约维持Opus 5.5水平。\n#总结：Anthropic IPO估值由于AI板块回调后有所下修（从此前2T到目前1.26-1.4 率约11.8%（经济日报、路透转述）。两年期美债收益率单日上行约19个基点至4.736%，十年期收于约4.99%。美股三大指数小幅收跌，道指跌0.30%、标普500跌0.38%、纳指跌0.74%；英伟达再跌约5.5%，纳斯达克金龙中国指数跌1.2%，恒指夜盘跌0.95%。对A股而言，今天大概率是外部降温、内部题材自转的格局：指数层面承压，资金仍在机器人、AI应用、端侧硬件里打转，但追高的性价比在下降。\n三大利多方向（从强到弱）\n一、出口与AI硬件链的基本面背书。海关数据显示，10月货物贸易进出口4.87万亿元、增长31.2%，其中出口增28.7%、进口增34.7%，进出口已连续6个月两位数增长（每经引海关总署）。邮件称美元口径出口增35.2%、贸易顺差突破1万亿美元，路透也以\"AI热潮推动出口、顺差突破1万亿美元\"为题报道，口径不同但方向一致。对光模块、PCB、服务器零部件这类出口链，这是业绩层面的支撑，比单日情绪可靠。隔夜台积电涨约2%、博通涨约3.9%，说明海外资金是在芯片内部切换，而非全面撤离。代表方向：中际旭创、新易盛、沪电股份、东山精密。\n二、AI算力需求再获实锤：CoreWeave财报。Q3营收36.6亿美元、同比增168%，高于预期；全年营收指引上调至130亿至133亿美元，积压订单约1325亿美元，盘后一度涨约8%（CNBC、雅虎财经）。它回应了\"数据中心是否降温\"的疑问；但该公司单季利息支出8.46亿美元、部分债券收益率一度超16%，说明需求强与融资贵并存。对A股算力链是情绪托底，不是新的加速器。\n三、增量资金与政策底。邮件称第三批互换便利资金入市、至少10家券商官宣买入股票；新浪财经统计股票型ETF曾连续25日净流入超6200亿元；此前国常会提出\"完善资本市场稳市机制\"。这条利多决定的是\"跌不深\"，而不是\"涨得快\"。\n三大利空方向（从强到弱）\n一、美联储重回加息通道。这是今天最大的变量。高估值成长股、港股科技、中概股首当其冲；ICE美元指数涨0.6%至102.26，在岸人民币兑美元回落至6.68附近，外资风险偏好承压。若后续数据继续超预期，50个基点的讨论会升温。\n二、英伟达治理风波外溢。公开报道的事实是：英伟达董事会就黄仁勋婚外情对象涉嫌情报背景一事启动独立调查，股价两日累计跌近10%，市值降至约4.07万亿美元（CNBC）。邮件将其表述为\"股东集体诉讼、涉嫌欺诈\"，该说法未能在主流报道中核实，请按未证实处理。影响在于可能拖慢投资决策与产品节奏，并让出口管制话题再度被讨论，对国内CPO链是情绪扰动。\n三、贵金属与题材高位的双重回撤风险。现货黄金跌2.6%至约4032美元，白银跌3.5%，邮件中\"黄金站稳4100美元\"的判断已被隔夜行情改写，贵金属板块今日承压。国内方面，邮件统计昨日95只涨停（另有统计为93只），闽发铝业7连板、文投控股15天8板，\"东方系\"\"羊字辈\"等名称炒作扎堆，金杯汽车已公告澄清机器人组装业务收入仅50万元。高标一旦断板，跟风股回撤会很快。\n多空如何制约\n利率是压估值的力量，出口与算力订单是托业绩的力量。今天更可能看到指数窄幅震荡、偏弱整理，资金从纯题材向有订单的硬件回流。操作上，宜降低对连板高标的接力，优先业绩可验证的方向。油价跌至两个月低位（布油约91.5美元）对中下游制造是缓冲，但霍尔木兹海峡油轮触雷事件可能带来反向扰动，需要盯住。\n事实与推测：以上指数、宏观数据、财报数字来自公开报道；\"指数承压、资金回流硬件\"等属分析推测。以上内容不构成投资建议，市场有风险，决策请独立判断。","en":"热点财经新闻综述｜2026-11-11·早间\n数据时点：北京时间2026年11月11日07:40前。依据：本期新收到的晚间热点财经邮件（11月10日20:11），并交叉核对每经、新浪财经、路透、CNBC、雅虎财经、经济日报等公开报道。邮件转述与已核实事实分开标注。\n今日判断\n隔夜的主线只有一条：利率。美国10月CPI环比0.4%、核心CPI环比0.3%，均比预期高0.1个百分点；美联储理事沃勒公开支持12月加息，通胀若恶化可考虑50个基点。据CME FedWatch，12月至少加息25个基点已被完全定价，50个基点的概率约11.8%（经济日报、路透转述）。两年期美债收益率单日上行约19个基点至4.736%，十年期收于约4.99%。美股三大指数小幅收跌，道指跌0.30%、标普500跌0.38%、纳指跌0.74%；英伟达再跌约5.5%，纳斯达克金龙中国指数跌1.2%，恒指夜盘跌0.95%。对A股而言，今天大概率是外部降温、内部题材自转的格局：指数层面承压，资金仍在机器人、AI应用、端侧硬件里打转，但追高的性价比在下降。\n三大 密、歌尔股份、沪电股份，和眼镜、光模块能对上。连板和亏损传媒股热度高，但不作为方向仓。\n#资金面\n风格偏向创业板和题材。主力净流入前排：新易盛约13.54亿元、中际旭创约9.84亿元、瑞芯微约6.19亿元、立讯精密约4.58亿元、歌尔股份约3.57亿元、沪电股份约3.02亿元。龙虎榜净买入居前为富瀚微约2.68亿元，且为两家机构买入。北向当日完整净流入口径未完整采集，不作判断。开盘要看眼镜和光模块是继续高开，还是把隔夜压力消化在竞价里。\n#中美映射\n美股行业ETF用11月10日收盘：20日靠前为住房建设 $ITB 约+13.7%、医疗 $XLV 约+11.3%、医疗器械 $IHI\n约+10.2%；5日黄金股 $GDX 约+11.5%但当日跌5.4%， $ITB 当日跌3.3%。半导体 $SMH\n近20日约-17.8%、近5日约-6.7%，机器人 $BOTZ\n近20日约-9.7%、近5日约-2.3%。A股主题ETF至11月10日：5日靠前为半导体约+11.8%、芯片约+10.7%至+11.1%、机器人约+7.3%、光伏约+6.5%、黄金约+5.1%；20日靠前为酒约+7.5%、机器人约+6.6%、汽车约+4.4%、医疗约+3.9%，半导体和芯片20日仍约-11%至-13%。\n标注：20日共振（趋势）是医药和医疗器械，美股更强、A股温和，不是今天最热主线。5日共振已削弱：半导体只剩A股短端还强，美股 $SMH\n五日转负，不能再当双侧超短共振，更不能当趋势仓。双窗口同现偏事件是机器人，A股ETF双侧为正，美股 $BOTZ\n双侧仍弱。仅5日慎追贵金属和光伏，黄金隔夜已经在回吐。住房是美股独立行情，A股地产不是同步买入信号。AI眼镜是A股短线主线，美股没有对等主题ETF，映射弱。\n#期货\n富时中国A50当月连续报12879点，跌约0.29%，外盘对A股情绪略偏压制。截至北京时间约07:15，标普期货约7556点较前值涨约0.16%，纳指期货约27924点涨约0.32%，道指期货约52378点涨约0.12%，只是现货收跌后的轻微修复。黄金期货约4039美元，现货约4032美元；国内黄金期货夜盘回落至865元/克附近。WTI约86.23美元。股指期货夜盘报价未完整采集，开盘以现货和A50为锚。\n#三个方向\nAI眼镜与消费电子：昨天午后十余股涨停，品牌消费电子20日和5日都在走强，端侧AI研报可作旁证。这是短线主线，位置已经偏热，只做没封板的龙头，不追连板。\n光模块与PCB算力硬件：新易盛、中际旭创、沪电资金领先，并有电子和算力PCB研报互证。A股半导体五日仍强、二十日仍深负，隔夜美股芯片转弱，只按脉冲和业绩回撤处理，不加趋势仓。\n人形机器人与物理AI：A股机器人ETF五日、二十日双窗口为正，美股机器人ETF仍弱，零部件利润还没跟上，适合低仓跟踪。","en":"A股盘前第一版 11月11日\n先说结论：隔夜美国10月CPI高于预期，美股转跌，金价随利率回吐，今天不是追涨日。昨天A股是创业板和题材占优，但那是CPI公布前的交易。主线三条：AI眼镜与消费电子、光模块与PCB算力硬件、人形机器人。前两条只在回撤和未封板的票里做，后一条有ETF双窗口，但零部件利润还没跟上。贵金属从超短主线降为观察。总仓中性偏低，涨停板只当温度计。\n#消息面\n美国10月CPI环比上涨0.4%、核心上涨0.3%，均高于预期的0.3%和0.2%；因去年同期政府停摆缺基数，官方未公布同比。沃勒在数据前表示，若核心通胀在0.3%附近，12月应把加息50个基点放上桌。10年期美债收益率收在约4.99%、上行约13个基点，2年期约4.74%、上行约18个基点；12月加息25个基点几乎完全定价。美股三大指数收跌，道指跌0.30%报52231.89点，标普跌0.38%报7520.93点，纳指跌0.74%报25065.88点，费城半导体跌0.35%；英伟达跌5.47%收168.89美元，博通涨3.91%，AMD和台积电ADR跟涨，半导体内部分化。现货黄金跌约2.7%至4032美元附近；WTI约86.23美元。A股11月10日沪指涨0.08%报3663.72点，深成指涨0.86%，创业板指涨1.46%，科创50涨0.64%，上证50跌0.58%；两市成交约1.49万亿元，放量约222亿元。影视院线、游戏和AI视频走强，午后AI眼镜爆发，十余只眼镜链涨停；港口航运和油气偏弱。公开新闻转述前10个月货物进出口同比增长20%。今日公司公告未见能改主线的新重磅。\n#研报面\n最近三个交易日公开口径：11月10日国金证券电子行业维持买入，称市场已充分反映悲观预期；中邮证券给奥士康买入，逻辑落在算力PCB起量；太平洋首次覆盖新亚电子买入，关注高频高速线缆和光芯 9%，近5日约+1.8%，距20日高约3.7%。住房备选，CPI公布前不加仓。\n#小盘阿尔法\n罗素2000期货基本平盘，风险偏好没有变得更热。期权方向和多基金同买仍缺互证。火箭实验室营收超预期、利润不及预期，盘前继续回吐，只当事件。CoreWeave要到周二美股收盘后才出报，不升格执行票。本轮不单列小盘标的。\n#操作提示\n不是空仓日，更不是把周一没跟上的半导体一次性补齐的日子。核心试错留给史赛克和美敦力，普尔特等CPI后再决定是否回踩承接。仓位中性，单票设好退出，总仓必须留给今晚21:30的CPI。英伟达调查没有结论前，AI硬件整体不加仓。沃勒已经把12月加息的门槛说得很硬，即便CPI略低于预期，也不要把住房和黄金的短线脉冲当趋势加速。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#三个方向\n医疗器械：20日趋势还在，盘前小幅高开且有研报支撑，利率抬升时它比住房更稳，作为今晚首选。\n住房建设：20日仍是最强主线，政策逻辑没有被证伪，但已靠近近20日高点，叠加短端收益率跳升和CPI临近，只保留回踩，不在数据前追。\n光伏与AI硬件：继续观察。纳指期货转跌，英伟达盘前未站稳，第一太阳能目标价下调后仍弱，Anthropic的IPO定价改变不了这组的位置。\n#六只个股\n1. #史赛克 $SYK ：周一收325.73美元几乎平盘，盘前约327.51美元涨约0.55%。近20日约+15.3%，近5日约+6.2%，距20日高约6.8%，周一量比约0.68。触发看放量重新站上330，失效看跌破周五低点322.56附近。\n2. #美敦力 $MDT ：周一收102.79美元涨0.97%，盘前约103.01美元小涨0.21%。近20日约+11.8%，近5日约+3.5%，距20日高约3.2%。位置比史赛克更靠近近期高点，作器械主线补位。\n3. #直觉外科 $ISRG ：周一收460.56美元涨1.71%，盘前约461.29美元小涨0.16%。近20日约+7.7%，近5日约+5.4%，距20日高约5.2%。器械旗舰，适合回撤确认。\n4. #普尔特 $PHM ：周一收135.88美元涨2.56%，盘前约134.20美元跌约1.24%，但仅约176股，价格只作参考。近20日约+22.3%，近5日约+3.5%，距20日高约2.9%，周一量比约1.22。触发看CPI后再站稳周一低点134附近，失效看跌破周五收盘132.49。\n5. #托尔兄弟 $TOL ：周一收156.33美元涨2.47%，盘前几乎没有成交。近20日约+18.3%，近5日约+1.9%，距20日高约3.9%，周一量比约1.58。跟随普尔特，不单独追高。\n6. #霍顿房屋 $DHI ：周一收155.61美元涨2.19%，盘前约157.18美元但只有约347股，参考价值有限。近20日约+15.9%，近5日约+1.8%，距20日高约3.7%。住房备选，CPI公布前不加仓。\n#小盘阿尔法\n罗素2000期货基本平盘，风险偏好没有变得更热。期权方向和多基金同买仍缺互证。火箭实验室营收超预期、利润不及预期，盘前继续回吐，只当事件。CoreWeave要到周二美股收盘后才出报，不升格执行票。本轮不单列小盘标的。\n#操作提示\n不是空仓日，更不是把周一没跟上的半导体一次性补齐的日子。核心试错留给史赛克和美敦力，普尔特等CPI后再决定是否回踩承接。仓位中性，单票设好退出，总仓必须留给今晚21:30的CPI。英伟达调查没有结论前，AI硬件整体不加仓。沃勒已经把12月加息的门槛说得很硬，即便CPI略低于预期，也不要把住房和黄金的短线脉冲当趋势加速。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120143287499776091","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["美联储","美股","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":721},{"id":"2120143248660611175","h":"cnfinancewatch","ts":1794316515,"zh":"美股盘前 11月10日晚间版\n先说结论：距开盘大约一个半小时，结构比下午版更拧。周一美股是超跌反弹，不是英伟达带领的科技翻身日。道指收52389点涨2.15%，标普收7550点涨2.35%，纳指收25253点涨2.74%，费城半导体涨约6.9%。但盘前期货已经走分：截至北京时间约21:05，标普期货约7573.5点几乎平盘，道指期货约52674点涨0.34%，纳指期货约27882.5点跌0.47%，罗素2000期货约2848.4点基本持平。下午版之后最大的新变量是利率。美联储理事沃勒称12月加息倾向落地，若通胀高于预期应考虑50个基点，否则只加25个基点会损害信誉。2年期美债收益率现约4.637%，较前值上行约6.9个基点，也明显高于下午版看到的4.559%；10年期约4.894%，凌晨那一截回落已经被收了回去。今晚21:30公布美国10月CPI，市场预期环比0.3%、核心0.2%，没有同比口径。今日最多做两类——医疗器械趋势、住房建设。如果只做3只：\n#史赛克 $SYK → #美敦力 $MDT → #普尔特 $PHM 。明确不做：抄底 $NVDA\n、把周一半导体反弹当趋势反转、在CPI前追住房股、追已下调目标价的光伏、追近5日涨幅过陡且盘前转弱的黄金股。\n#消息面\n沃勒讲话是下午版之后的硬事件，CPI还没出来，短端收益率已经先按偏鹰定价。原油继续减压，WTI约84.88美元跌2.23%，布伦特约90.14美元跌2.63%，CNBC称特朗普表示对伊朗再出手的可能性不大。黄金期货约4084.6美元跌0.75%，下午版还在小涨，方向已经翻了。\n#英伟达 $NVDA 盘前约177.38美元，较周一收盘178.67美元跌约0.72%，成交已放到约919万股，早盘一度转绿的报道没有守住。路透转述The\nInformation称，相关关系被指为至少75亿美元芯片经中资渠道出货提供便利，这是转述，不是已证实事实。半导体盘前偏弱， $INTC\n约跌2.64%，迈威尔约跌2.81%， $SMH\n约481.70美元跌约1.17%。Anthropic公布IPO定价区间70至78美元，这是情绪事件，不是今晚加仓AI硬件的理由。CoreWeave季报要到周二美东收盘后才出，盘前约48.13美元跌约1.74%，只观察。火箭实验室继续消化季报，盘前约54.17美元，较周一常规交易收盘跌约8.0%。思科在周三，应用材料在周四，英伟达下周二。\n#研报面\n和今天方向对得上的口径，没有看到下午版之后的新调整。仍是Piper\nSandler周一把史赛克目标价从325上调到350，维持增持；同一家把第一太阳能目标价从251下调到222，仍维持增持。住房链上，Stephens此前上调Installed\nBuilding Products目标价，属于同向微调，不是头部大行集体上调。CoreWeave一侧，富国把目标价从160下调到115、维持增持，出报前只观察。这些都是中等权重，不能单独覆盖技术位置。\n#资金面\n期权有方向的增仓、ARK多基金同买本轮仍未采集，不能用裸成交量凑共振。能确认的弱共振里，医疗器械相对更干净：20日趋势还在，史赛克有目标价上调，盘前\n$SYK 约涨0.55%、器械ETF $IHI 约涨0.60%，虽然量都很小。住房的中期逻辑没有被证伪，选举政策预期叠加 $ITB\n近20日约+18.4%仍居行业榜首，但短端收益率突然抬升， $PHM 盘前约跌1.24%、 $ITB\n几乎平盘，成交都极薄，说明CPI前资金没有给出加仓确认。黄金股ETF $GDX 盘前约跌2.69%，近5日约+15.6%的脉冲正在回吐。\n#期货\n截至北京时间约21:05：标普期货7573.5点几乎平盘，纳指期货27882.5点跌132.25点、跌0.47%，道指期货52674点涨176点、涨0.34%，罗素2000期货约2848.4点基本持平。黄金约4084.6美元跌0.75%，白银约52.23美元跌0.90%，铜约6.2975美元跌0.73%，WTI约84.88美元跌2.23%，布伦特约90.14美元跌2.63%，美元指数约101.66涨0.12%。10年期美债收益率约4.894%，2年期约4.637%、上行约6.9个基点。VIX上收19.92，较早的盘前报价约20.00，变化不大。股指期货成交量本轮未采集；公开页能看到持仓量，但与下午版为同一数值、缺前值对比，不做增减仓定论。\n#中美映射\n美股行业ETF用11月9日收盘测算：20日靠前为住房建设 $ITB 约+18.4%、房屋建筑商 $XHB 约+12.7%、医疗器械 $IHI\n约+11.0%、医疗 $XLV 约+9.5%、必选消费约+7.7%；5日榜黄金股 $GDX 约+15.6%领先，光伏 $TAN\n约+7.4%但周一已跌0.88%、盘前再跌约0.84%。半导体 $SMH\n近20日约-19.2%、近5日约-4.1%，周一涨5.05%、盘前又吐出约1.17%，没有改中期结构；机器人 $BOTZ\n近20日约-8.7%、近5日约-1.2%。A股主题用11月10日收盘：20日偏强的是酒约+7.5%、机器人ETF约+6.3%至+16.2%、医疗与医疗器械约+3.0%至+3.9%；5日领跑的是半导体设备约+18.3%、芯片与半导体约+10.5%至+11.8%、科创50约+10.0%、机器人约+7.1%至+10.9%、光伏约+6.2%至+6.6%、黄金约+5.1%。A股房地产ETF近20日仍约-7.7%至-7.9%，5日只有约1.5%的反弹。标注：20日共振——医疗器械与医药，美股更强、A股温和；5日共振——半导体和芯片，A股短端领跑，美股周一只是修复、盘前转弱，20日仍深负，慎当趋势仓；双窗口同现偏事件——机器人，A股双侧强，美股机器人ETF中期仍弱；仅5日慎追——贵金属与光伏，黄金盘前已在回吐；住房是美股独立行情，映射不是同步买入信号。","en":"美股盘前 11月10日晚间版\n先说结论：距开盘大约一个半小时，结构比下午版更拧。周一美股是超跌反弹，不是英伟达带领的科技翻身日。道指收52389点涨2.15%，标普收7550点涨2.35%，纳指收25253点涨2.74%，费城半导体涨约6.9%。但盘前期货已经走分：截至北京时间约21:05，标普期货约7573.5点几乎平盘，道指期货约52674点涨0.34%，纳指期货约27882.5点跌0.47%，罗素2000期货约2848.4点基本持平。下午版之后最大的新变量是利率。美联储理事沃勒称12月加息倾向落地，若通胀高于预期应考虑50个基点，否则只加25个基点会损害信誉。2年期美债收益率现约4.637%，较前值上行约6.9个基点，也明显高于下午版看到的4.559%；10年期约4.894%，凌晨那一截回落已经被收了回去。今晚21:30公布美国10月CPI，市场预期环比0.3%、核心0.2%，没有同比口径。今日最多做两类——医疗器械趋势、住房建设。如果只做3只：\n#史赛克 $SYK → #美敦力 $MDT → #普尔特 $PHM 。明确不做：抄底 $NVDA\n、把周一半导体反弹当趋势反转、在CPI前追住房股、追已下调目标价的光伏、追近5日涨幅过陡且盘前转弱的黄金股。\n#消息面\n沃勒讲话是下午版之后的硬事件，CPI还没出来，短端收益率已经先按偏鹰定价。原油继续减压，WTI约84.88美元跌2.23%，布伦特约90.14美元跌2.63%，CNBC称特朗普表示对伊朗再出手的可能性不大。黄金期货约4084.6美元跌0.75%，下午版还在小涨，方向已经翻了。\n#英伟达 $NVDA 盘前约177.38美元，较周一收盘178.67美元跌约0.72%，成交已放到约919万股，早盘一度转绿的报道没有守住。路透转述The\nInformation称，相关关系被指为至少75亿美元芯片经中资渠道出货提供便利，这是转述，不是已证实事实。半导体盘前偏弱， $INTC\n约跌2.64%，迈威尔约跌2.81%， $SMH\n约481.70美元跌约1.17%。Anthropic公布IPO定价区间70至78美元，这是情绪事件，不是今晚加仓AI硬件的理由。CoreWeave季报要到周二美东收盘后才出，盘前约48.13美元跌约1.74%，只观察。火箭实验室继续消化季报，盘前约54.17美元，较周一常规交易收盘跌约8.0%。思科在周三，应用材料在周四，英伟达下周二。\n#研报面\n和今天方向对得上的口径，没有看到下午版之后的新调整。仍是Piper\nSandler周一把史赛克目标价从325上调到350，维持增持；同一家把第一太阳能目标价从251下调到222，仍维持增持。住房链上，Stephens此前上调Installed\nBuilding Products目标价，属于同向微调，不是头部大行集体上调。CoreWeave一侧，富国把目标价从160下调到115、维持增持，出报前只观察。这些都是中等权重，不能单独覆盖技术位置。\n#资金面\n期权有方向的增仓、ARK多基金同买本轮仍未采集，不能用裸成交量凑共振。能确认的弱共振里，医疗器械相对更干净：20日趋势还在，史赛克有目标价上调，盘前\n$SYK 约涨0.55%、器械ETF $IHI 约涨0.60%，虽然量都很小。住房的中期逻辑没有被证伪，选举政策预期叠加 $ITB\n近20日约+18.4%仍居行业榜首，但短端收益率突然抬升， $PHM 盘前约跌1.24%、 $ITB\n几乎平盘，成交都极薄，说明CPI前资 涨0.22%，道指期货约52702点涨0.39%，纳指期货约28014点几乎平盘；罗素2000期货时点较早，约15:03为2856点涨0.25%。今晚21:30公布美国10月CPI，市场预期环比0.3%、核心0.2%，没有同比口径；CME\nFedWatch显示12月加息概率仍在约84%。今日最多做两类——医疗器械趋势、住房建设。如果只做3只： #史赛克 $SYK → #普尔特\n$PHM → #美敦力 $MDT 。明确不做：抄底 $NVDA 、把周一半导体反弹当趋势反转、追 $NVR\n式跳空、追已下调目标价的光伏、追近5日涨幅过陡的黄金股。\n#消息面\n周一是修复日。 $AMD 涨13.26%， $AVGO 涨8.78%， $AMAT 涨11.37%，半导体ETF $SMH\n涨5.05%，只收回了上周一部分跌幅。英伟达的问题已经从董事会调查扩到诉讼和白宫表态，短线仍是个股风险，不是板块已经翻多。火箭实验室盘后交出三季报：营收约2.68亿美元高于预期，每股亏损0.12美元差于预期，积压订单约35.7亿美元；常规交易涨10.91%，盘后约跌6.6%，只当事件看。今晚还有CoreWeave季报，思科在周三，应用材料在周四，英伟达下周二。油价继续给通胀叙事减压，WTI周一收86.85美元，此时期货约85.19美元再跌约1.9%。\n#研报面\n和今天方向对得上的，是Piper\nSandler周一把史赛克目标价从325上调到350，维持增持；同一家把第一太阳能目标价从251下调到222，仍维持增持，但股价已经给出答案，周一收跌4.74%。住房链上，Stephens此前上调Installed\nBuilding Products目标价，属于同向微调，不是头部大行集体上调。CoreWeave一侧，富国把目标价从160下调到115、维持增持，出报前只观察。这些都是中等权重，不能单独覆盖技术位置。\n#资金面\n期权有方向的增仓、ARK多基金同买本轮均未采集，不能用裸成交量凑共振。能确认的只有弱共振：住房是中期选举政策预期叠加住房ETF近20日约+18.4%仍居行业榜首，周一\n$ITB 涨3.02%，成交量大约放大到前一日的2.1倍；医疗器械是20日趋势叠加史赛克目标价上调，器械ETF $IHI\n周一再涨1.70%。都还缺期权或机构持仓的第二项硬确认。黄金股ETF近5日约+15.6%仍最陡，只有短端脉冲，没有趋势翻多的资金证据。\n#期货\n截至北京时间16:00至16:38的公开报价：标普期货7591点涨16.75点、涨0.22%，纳指期货28014.25点几乎持平，道指期货52702点涨204点、涨0.39%。黄金期货约4125.9美元涨0.28%，铜约6.312美元跌0.51%，WTI约85.19美元跌1.91%，美元指数约101.43跌0.10%。10年期美债收益率约4.865%，下行约3个基点；2年期约4.559%，下行约0.9个基点。VIX上收19.92，一日回落5.72点，约跌22%，是2025年4月14日以来最大单日下降。股指期货成交量本轮未采集；公开页能看到持仓量，但缺前值对比，不做增减仓定论。\n#中美映射\n美股行业ETF用11月9日收盘测算：20日靠前为住房建设 $ITB 约+18.4%、房屋建筑商 $XHB 约+12.7%、医疗器械 $IHI\n约+11.0%、医疗 $XLV 约+9.5%、必选消费约+7.7%；5日榜黄金股 $GDX 约+15.6%领先，光伏 $TAN\n约+7.4%但周一已跌0.88%。半导体 $SMH 近20日约-19.2%、近5日约-4.1%，周一涨5.05%没有改中期结构；机器人\n$BOTZ 近20日约-8.7%、近5日约-1.2%，周一涨2.67%。A股主题用11月10日收盘：20日偏强的是酒约+7.5%、机器人ETF约+6.3%至+16.2%（不同产品差异大）、医疗与医疗器械约+3.0%至+3.9%、医药约+2.5%至+3.2%；5日领跑的是半导体设备约+18.3%、芯片与半导体约+10.5%至+11.8%、科创50约+10.0%、机器人约+7.1%至+10.9%、光伏约+6.2%至+6.6%、黄金约+5.1%。A股房地产ETF近20日仍约-7.7%至-7.9%，5日只有约1.5%的反弹。标注：20日共振——医疗器械与医药，美股更强、A股温和，今日不是A股主战场；5日共振——半导体和芯片，A股短端领跑，美股周一只是修复，20日仍深负，慎当趋势仓；双窗口同现偏事件——机器人，A股双侧强，美股机器人ETF中期仍弱；仅5日慎追——贵金属与光伏；住房是美股独立行情，映射不是同步买入信号。\n#三个方向\n医疗器械：20日趋势还在，周一史赛克几乎走平、成交萎缩，正好把周五回调后的分歧留给有研报支撑的龙头，而不是追已经走陡的品种。\n住房建设：20日仍是最强主线，周一放量跟进，政策逻辑没有被证伪，但已靠近近20日高点，今晚CPI对收益率敏感，只做回踩，不追跳空。\n光伏与AI硬件：降为观察。第一太阳能目标价下调并收跌，半导体周一反弹没有修掉20日跌幅，英伟达事件还在扩散，等CPI和本周财报。\n#六只个股\n1. #史赛克 $SYK ：收325.73美元，几乎平盘，近20日约+15.3%，近5日约+6.2%，距20日高约6.8%，量比约0.68。触发看放量重新站上330，失效看跌破周五低点322.56附近。\n2. #美敦力 $MDT ：收102.79美元涨0.97%，近20日约+11.8%，近5日约+3.5%，距20日高约3.2%。位置比史赛克更靠近近期高点，作器械主线补位。\n3. #直觉外科 $ISRG ：收460.56美元涨1.71%，近20日约+7.7%，近5日约+5.4%，距20日高约5.2%。器械旗舰，适合回撤确认。\n4. #普尔特 $PHM ：收135.88美元涨2.56%，近20日约+22.3%，近5日约+3.5%，距20日高约2.9%，量比约1.22。住房链代表，触发看回踩后仍站稳周一低点134附近，失效看跌破周五收盘132.49。\n5. #托尔兄弟 $TOL ：收156.33美元涨2.47%，近20日约+18.3%，近5日约+1.9%，距20日高约3.9%，量比约1.58。跟随普尔特，不单独追高。\n6. #霍顿房屋 $DHI ：收155.61美元涨2.19%，近20日约+15.9%，近5日约+1.8%，距20日高约3.7%。住房备选，CPI公布前不加仓。\n#小盘阿尔法\n罗素2000期货小幅高开，风险偏好还在，但期权方向和多基金同买仍缺互证。火箭实验室营收超预期、利润不及预期，盘后回吐，只当事件，不升格执行票。本轮不单列小盘标的。\n#操作提示\n不是空仓日，也不是把周一没跟上的半导体一次性补齐的日子。核心试错留给史赛克和普尔特，美敦力补位。仓位中性，单票设好退出，总仓留余地给今晚CPI。英伟达调查没有结论前，AI硬件整体不加仓。CoreWeave、应用材料和思科都只观察，不进只做3只名单。高开过猛的住房股等第一次回踩再进。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"周一美股是超跌反弹，不是英伟达带领的科技翻身日。道指收52389点涨2.15%，标普收7550点涨2.35%，纳指收25253点涨2.74%，费城半导体涨约6.9%，11个板块全红。\n但\n#英伟达 $NVDA 收178.67美元跌4.27%，是费半成分里唯一收跌的，也是4月7日以来最低收盘，成交放到约4.63亿股。亚洲时段又多出两条新变量：股东已对英伟达和黄仁勋提起集体诉讼，特朗普称联邦调查局正在了解相关传闻，中方继续否认所谓间谍叙事。股指期货现在只给温和高开。截至北京时间16:01前后，标普期货约7591点涨0.22%，道指期货约52702点涨0.39%，纳指期货约28014点几乎平盘；罗素2000期货时点较早，约15:03为2856点涨0.25%。今晚21:30公布美国10月CPI，市场预期环比0.3%、核心0.2%，没有同比口径；CME\nFedWatch显示12月加息概率仍在约84%。今日最多做两类——医疗器械趋势、住房建设。如果只做3只： #史赛克 $SYK → #普尔特\n$PHM → #美敦力 $MDT 。明确不做：抄底 $NVDA 、把周一半导体反弹当趋势反转、追 $NVR\n式跳空、追已下调目标价的光伏、追近5日涨幅过陡的黄金股。\n#消息面\n周一是修复日。 $AMD 涨13.26%， $AVGO 涨8.78%， $AMAT 涨11.37%，半导体ETF $SMH\n涨5.05%，只收回了上周一部分跌幅。英伟达的问题已经从董事会调查扩到诉讼和白宫表态，短线仍是个股风险，不是板块已经翻多。火箭实验室盘后交出三季报：营收约2.68亿美元高于预期，每股亏损0.12美元差于预期，积压订单约35.7亿美元；常规交易涨10.91%，盘后约跌6.6%，只当事件看。今晚还有CoreWeave季报，思科在周三，应用材料在周四，英伟达下周二。油价继续给通胀叙事减压，WTI周一收86.85美元，此时期货约85.19美元再跌约1.9%。\n#研报面\n和今天方向对得上的，是Piper\nSandler周一把史赛克目标价从325上调到350，维持增持；同一家把第一太阳能目标价从251下调到222，仍维持增持，但股价已经给出答案，周一收跌4.74%。住房链上，Stephens此前上调Installed\nBuilding Products目标价，属于同向微调，不是 和机器人，周期股在撤。光伏概念仍小涨但净流出，贵金属几乎走平，都不再是今天的主战场。\n#资金面\n行业主力净流入靠前：电子约86亿、传媒约45亿、半导体约38亿、通信网络设备约35亿、机械设备约32亿、通信设备约31亿，消费电子约22亿。净流出侧有色与铝、石油石化、国防军工、航运、非银靠前。概念上机器人概念净流入约88亿，人形机器人约56亿，CPO和光通信模块合计约90亿，AI眼镜约41亿。光伏净流出约15亿。北向实时接口全日返回占位零值，北向数据暂不可用。\n#涨停\n东财收盘涨停池93家、炸板19家，封板率约83%，情绪偏热。7板是闽发铝业，三板里东方新能、日出东方、大东方、龙江交通仍偏字辈或情绪定价，不升格主线。涨停扩散较多的是汽车零部件、光学光电、消费电子和影视游戏。高位连板和字辈票不宜再追。\n#盘中消息\n隔夜美股大涨、韩股半导体链早盘暴涨的风险偏好延续到A股，但指数没有走成普涨。更直接的催化是Anthropic发布新模型、英伟达发布世界动作模型GR00T\n2，抬升机器人溢价；AI短剧与金鸡电影节首次设立AI单元，对影视传媒有事件驱动。海关总署公布前10个月进出口同比增20%、10月出口同比增35.2%，偏中期利好。药明康德移出美国国防部1260H名单对医药偏暖，但医药今天不是主战场。现货黄金回落至约4128美元，WTI约85.2美元续跌。今晚21:30还有美国10月CPI。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #宇树科技 $688836 、 #日出东方 $603366 、 #冰山冷热 $000530 、 #东方海洋\n$002086 、 #文投控股 $600715 、 #雪人集团 $002639 、 #大东方 $600327 、 #华策影视 $300133\n、 #东方新能 $002310\n等。同花顺热榜亦见冰山冷热、阳光照明、宇树、中际旭创、新易盛。东方新能涨停是算力板卡合同的情绪定价，不宜算进硬件主线。\n#中美映射\n美股主题ETF用11月9日收盘：SMH收涨5.05%，近5日仍跌4.1%、近20日跌17.5%；SOXX收涨7.49%，近5日跌约3.0%、近20日跌约19%；机器人BOTZ收涨2.67%，近5日跌1.2%、近20日跌8.7%。A股刷新至收盘：近5日领跑的是半导体设备与芯片，消费电子、机器人、传媒紧随其后；近20日仍是酒、机器人、医药医疗、汽车和传媒相对占优，半导体与光伏的20日仍为负。今日对早盘映射有修正：5日领先的贵金属和光伏明显掉队，短线脉冲慎追；20日医药医疗没有成为主战场；机器人是双窗口同现且今日继续走强，只是美股BOTZ中期仍弱。半导体是5日共振，20日趋势尚未转正。\n#三个方向\n消费电子与AI眼镜：板块涨幅和AI眼镜净流入都靠前，端侧硬件是今天新抬上来的主线，优先有订单和芯片能力的，不追亏损情绪票。\n人形机器人与物理AI：隔夜模型和资金净流入都对得上，本体只当方向观察，执行与自动化里挑有业绩的，不追高位连板。\n光通信与PCB：早盘算力硬件这条线还在，但设备已经走弱，胜宏高开回吐、中微收跌；真正有成交和净流入的是光模块与PCB，短线已启动，注意回撤。\n#六只个股\n1. #沪电股份 $002463\n：收81.30元、涨5.45%。近5日约+4.0%，近20日仍约-30%。三季报营收同比约+72%、净利约+107%，是早盘六只里盘中唯一明显走强的业绩仓。\n2. #新易盛 $300502\n：收183.80元、涨4.43%，成交约163亿、主力净流入约14亿。近5日约+6.0%，近20日仍约-48%。三季报营收同比约+93%、净利约+80%，对应CPO成交最集中的位置。\n3. #富瀚微 $300613\n：收80.02元、涨20.01%封板。近5日约+29%，近20日约+10%。三季报营收同比约+124%、净利约+845%，消费电子与CIS弹性最大，已涨停只作方向样本，不宜再追。\n4. #歌尔股份 $002241 ：收25.69元、涨3.84%。近5日约+15%，近20日约+25%。三季报营收与净利大致持平，是未涨停的消费电子龙头观察仓。\n5. #赛腾股份 $603283\n：收40.23元、涨10.01%封板。近5日约+23%，近20日约+10%。三季报营收同比约+12%、净利约+28%，作为机器人执行侧的业绩样本，同样不追板。\n6. #宇树科技 $688836\n：收761.01元、涨6.29%，市值约3078亿，人气榜第一。近5日约+22%，近20日约+74%。三季报营收同比约+56%、净利约+271%，增长快但估值极高，只作方向观察，不宜单押。\n#小盘阿尔法\n #清溢光电 $688138 ：收32.16元、涨13.68%，市值约101亿，掩膜版配套半导体与先进封装。近5日约+20%，近20日约+4.3%。三季报营收同比约+4.9%、净利约+11%，尾盘有回吐，不宜加仓。竞价曾尝试连板的\n#超声电子 $000823 回落到涨3.25%并净流出，暂不作为阿尔法。\n#操作提示\n不是空仓日，也不是把上午没跟上的方向一次性补齐的日子。商业航天竞价高潮已退，西部材料和中科星图都从高开大幅回吐；贵金属只剩弱反弹，山东黄金不必再当超短主攻。胜宏收涨约1.1%、中微收跌，设备端并未同步。核心仓留给PCB、光模块和消费电子里能对上业绩的，机器人只拿执行侧或观察仓，传媒与字辈严格止盈。今晚CPI或扰动外盘，仓位中性。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘中 11月10日 复盘，请和A股盘前预测对战：\n先说结论：指数高开后回吐，上证只收出0.08%的微红，深成和创业板更强，这是中小盘与题材的赚钱日，不是权重趋势日。早盘三条线里，算力硬件还在，但主战场已从设备切到光模块和PCB；商业航天竞价高潮明显退潮，贵金属只剩弱反弹，不宜再当进攻仓。盘中真正共振的是消费电子与AI眼镜、人形机器人，外加一条资金仍扎实的光通信与PCB。不要追连板字辈和已封死的高标，仓位中性偏多，盯今晚CPI。\n#盘面速览\n截至收盘，上证3663.72点涨0.08%，深成指11241.54点涨0.86%，创业板指2494.40点涨1.46%，科创50报1265.02点涨0.64%，沪深300涨0.07%。上证开在3682.04点、冲高3683.73点后一路回吐，指数平淡、个股不弱：上证口径上涨1656家、下跌622家，中证全指上涨3933家、下跌1054家。两市成交额合计约1.50万亿元。国证2000涨1.75%，上证50跌0.58%，中小盘显著强于权重。\n#板块风格\n行业涨幅靠前的是影视动漫、影视院线、传媒、消费电子、机器人、光学光电子和通信网络设备。概念侧智能音箱、短剧互动游戏、影视、AI眼镜、苹果概念、虚拟现实、人形机器人居前。跌幅侧钾肥、民爆、煤炭和航运油气靠后。进攻落在传媒情绪、端侧硬件和机器人，周期股在撤。光伏概念仍小涨但净流出，贵金属几乎走平，都不再是今天的主战场。\n#资金面\n行业主力净流入靠前：电子约86亿、传媒约45亿、半导体约38亿、通信网络设备约35亿、机械设备约32亿、通信设备约31亿，消费电子约22亿。净流出侧有色与铝、石油石化、国防军工、航运、非银靠前。概念上机器人概念净流入约88亿，人形机器人约56亿，CPO和光通信模块合计约90亿，AI眼镜约41亿。光伏净流出约15亿。北向实时接口全日返回占位零值，北向数据暂不可用。\n#涨停\n东财收盘涨停池93家、炸板19家，封板率约83%，情绪偏热。7板是闽发铝业，三板里东方新能、日出东方、大东方、龙江交通仍偏字辈或情绪定价，不升格主线。涨停扩散较多的是汽车零部件、光学光电、消费电子和影视游戏。高位连板和字辈票不宜再追。\n#盘中消息\n隔夜美股大涨、韩股半导体链早盘暴涨的风险偏好延续到A股，但指数没有走成普涨。更直接的催化是Anthropic发布新模型、英伟达发布世界动作模型GR00T\n2，抬升机器人溢价；AI短剧与金鸡电影节首次设立AI单元，对影视传媒有事件驱动。海关总署公布前10个月进出口同比增20%、10月出口同比增35.2%，偏中期利好。药明康德移出美国国防部1260H名单对医药偏暖，但医药今天不是主战场。现货黄金回落至约4128美元，WTI约85.2美元续跌。今晚21:30还有美国10月CPI。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #宇树科技 $688836 、 #日出东方 $603366 、 #冰山冷热 $000530 、 #东方海洋\n$002086 、 #文投控股 $600715 、 #雪人集团 $002639 、 #大东方 $600327 、 #华策影视 $300133\n、 #东方新能 $002310\n等。同花顺热榜亦见冰山冷热、阳光照明、宇树、中际旭创、新易盛。东方新能涨停是算力板卡合同的情绪定价，不宜算进硬件主线。\n#中美映射\n美股主题ETF用11月9日收盘：SMH收涨5.05%，近5日仍跌4.1%、近20日跌17.5%；SOXX收涨7.49%，近5日跌约3.0%、近20日跌约19%；机器人BOTZ收涨2.67%，近5日跌1.2%、近20日跌8.7%。A股刷新至收盘：近5日领跑的是半导体设备与芯片，消费电子、机器人、传媒紧随其后；近20日仍是酒、机器人、医药医疗、汽车和传媒相对占优，半导体与光伏的20日仍为负。今日对早盘映射有修正：5日领先的贵金属和光伏明显掉队，短线脉冲慎追；20日医药医疗没有成为主 权重。\n#板块风格\n行业涨幅靠前的是影视动漫、影视院线、传媒、消费电子、机器人、光学光电子和通信网络设备。概念侧智能音箱、短剧互动游戏、影视、AI眼镜、苹果概念、虚拟现实、人形机器人居前。跌幅侧钾肥、民爆、煤炭和航运油气靠后。进攻落在传媒情绪、端侧硬件和机器人，周期股在撤。光伏概念仍小涨但净流出，贵金属几乎走平，都不再是今天的主战场。\n#资金面\n行业主力净流入靠前：电子约86亿、传媒约45亿、半导体约38亿、通信网络设备约35亿、机械设备约32亿、通信设备约31亿，消费电子约22亿。净流出侧有色与铝、石油石化、国防军工、航运、非银靠前。概念上机器人概念净流入约88亿，人形机器人约56亿，CPO和光通信模块合计约90亿，AI眼镜约41亿。光伏净流出约15亿。北向实时接口全日返回占位零值，北向数据暂不可用。\n#涨停\n东财收盘涨停池93家、炸板19家，封板率约83%，情绪偏热。7板是闽发铝业，三板里东方新能、日出东方、大东方、龙江交通仍偏字辈或情绪定价，不升格主线。涨停扩散较多的是汽车零部件、光学光电、消费电子和影视游戏。高位连板和字辈票不宜再追。\n#盘中消息\n隔夜美股大涨、韩股半导体链早盘暴涨的风险偏好延续到A股，但指数没有走成普涨。更直接的催化是Anthropic发布新模型、英伟达发布世界动作模型GR00T\n2，抬升机器人溢价；AI短剧与金鸡电影节首次设立AI单元，对影视传媒有事件驱动。海关总署公布前10个月进出口同比增20%、10月出口同比增35.2%，偏中期利好。药明康德移出美国国防部1260H名单对医药偏暖，但医药今天不是主战场。现货黄金回落至约4128美元，WTI约85.2美元续跌。今晚21:30还有美国10月CPI。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #宇树科技 $688836 、 #日出东方 $603366 、 #冰山冷热 $000530 、 #东方海洋\n$002086 、 #文投控股 $600715 、 #雪人集团 $002639 、 #大东方 $600327 、 #华策影视 $300133\n、 #东方新能 $002310\n等。同花顺热榜亦见冰山冷热、阳光照明、宇树、中际旭创、新易盛。东方新能涨停是算力板卡合同的情绪定价，不宜算进硬件主线。\n#中美映射\n美股主题ETF用11月9日收盘：SMH收涨5.05%，近5日仍跌4.1%、近20日跌17.5%；SOXX收涨7.49%，近5日跌约3.0%、近20日跌约19%；机器人BOTZ收涨2.67%，近5日跌1.2%、近20日跌8.7%。A股刷新至收盘：近5日领跑的是半导体设备与芯片，消费电子、机器人、传媒紧随其后；近20日仍是酒、机器人、医药医疗、汽车和传媒相对占优，半导体与光伏的20日仍为负。今日对早盘映射有修正：5日领先的贵金属和光伏明显掉队，短线脉冲慎追；20日医药医疗没有成为主战场；机器人是双窗口同现且今日继续走强，只是美股BOTZ中期仍弱。半导体是5日共振，20日趋势尚未转正。\n#三个方向\n消费电子与AI眼镜：板块涨幅和AI眼镜净流入都靠前，端侧硬件是今天新抬上来的主线，优先有订单和芯片能力的，不追亏损情绪票。\n人形机器人与物理AI：隔夜模型和资金净流入都对得上，本体只当方向观察，执行与自动化里挑有业绩的，不追高位连板。\n光通信与PCB：早盘算力硬件这条线还在，但设备已经走弱，胜宏高开回吐、中微收跌；真正有成交和净流入的是光模块与PCB，短线已启动，注意回撤。\n#六只个股\n1. #沪电股份 $002463\n：收81.30元、涨5.45%。近5日约+4.0%，近20日仍约-30%。三季报营收同比约+72%、净利约+107%，是早盘六只里盘中唯一明显走强的业绩仓。\n2. #新易盛 $300502\n：收183.80元、涨4.43%，成交约163亿、主力净流入约14亿。近5日约+6.0%，近20日仍约-48%。三季报营收同比约+93%、净利约+80%，对应CPO成交最集中的位置。\n3. #富瀚微 $300613\n：收80.02元、涨20.01%封板。近5日约+29%，近20日约+10%。三季报营收同比约+124%、净利约+845%，消费电子与CIS弹性最大，已涨停只作方向样本，不宜再追。\n4. #歌尔股份 $002241 ：收25.69元、涨3.84%。近5日约+15%，近20日约+25%。三季报营收与净利大致持平，是未涨停的消费电子龙头观察仓。\n5. #赛腾股份 $603283\n：收40.23元、涨10.01%封板。近5日约+23%，近20日约+10%。三季报营收同比约+12%、净利约+28%，作为机器人执行侧的业绩样本，同样不追板。\n6. #宇树科技 $688836\n：收761.01元、涨6.29%，市值约3078亿，人气榜第一。近5日约+22%，近20日约+74%。三季报营收同比约+56%、净利约+271%，增长快但估值极高，只作方向观察，不宜单押。\n#小盘阿尔法\n #清溢光电 $688138 ：收32.16元、涨13.68%，市值约101亿，掩膜版配套半导体与先进封装。近5日约+20%，近20日约+4.3%。三季报营收同比约+4.9%、净利约+11%，尾盘有回吐，不宜加仓。竞价曾尝试连板的\n#超声电子 $000823 回落到涨3.25%并净流出，暂不作为阿尔法。\n#操作提示\n不是空仓日，也不是把上午没跟上的方向一次性补齐的日子。商业航天竞价高潮已退，西部材料和中科星图都从高开大幅回吐；贵金属只剩弱反弹，山东黄金不必再当超短主攻。胜宏收涨约1.1%、中微收跌，设备端并未同步。核心仓留给PCB、光模块和消费电子里能对上业绩的，机器人只拿执行侧或观察仓，传媒与字辈严格止盈。今晚CPI或扰动外盘，仓位中性。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘中 11月10日\n先说结论：指数高开后回吐，上证只收出0.08%的微红，深成和创业板更强，这是中小盘与题材的赚钱日，不是权重趋势日。早盘三条线里，算力硬件还在，但主战场已从设备切到光模块和PCB；商业航天竞价高潮明显退潮，贵金属只剩弱反弹，不宜再当进攻仓。盘中真正共振的是消费电子与AI眼镜、人形机器人，外加一条资金仍扎实的光通信与PCB。不要追连板字辈和已封死的高标，仓位中性偏多，盯今晚CPI。\n#盘面速览\n截至收盘，上证3663.72点涨0.08%，深成指11241.54点涨0.86%，创业板指2494.40点涨1.46%，科创50报1265.02点涨0.64%，沪深300涨0.07%。上证开在3682.04点、冲高3683.73点后一路回吐，指数平淡、个股不弱：上证口径上涨1656家、下跌622家，中证全指上涨3933家、下跌1054家。两市成交额合计约1.50万亿元。国证2000涨1.75%，上证50跌0.58%，中小盘显著强于权重。\n#板块风格\n行业涨幅靠前的是影视动漫、影视院线、传媒、消费电子、机器人、光学光电子和通信网络设备。概念侧智能音箱、短剧互动游戏、影视、AI眼镜、苹果概念、虚拟现实、人形机器人居前。跌幅侧钾肥、民爆、煤炭和航运油气靠后。进攻落在传媒情绪、端侧硬件和机器人，周期股在撤。光伏概念仍小涨但净流出，贵金属几乎走平，都不再是今天的主战场。\n#资金面\n行业主力净流入靠前：电子约86亿、传媒约45亿、半导体约38亿、通信网络设备约35亿、机械设备约32亿、通信设备约31亿，消费电子约22亿。净流出侧有色与铝、石油石化、国防军工、航运、非银靠前。概念上机器人概念净流入约88亿，人形机器人约56亿，CPO和光通信模块合计约90亿，AI眼镜约41亿。光伏净流出约15亿。北向实时接口全日返回占位零值，北向数据暂不可用。\n#涨停\n东财收盘涨停池93家、炸板19家，封板率约83%，情绪偏热。7板是闽发铝业，三板里东方新能、日出东方、大东方、龙江交通仍偏字辈或情绪定价，不升格主线。涨停扩散较多的是汽车零部件、光学光电、消费电子和影视游戏。高位连板和字辈票不宜再追。\n#盘中消息\n隔夜美股大涨、韩股半导体链早盘暴涨的风险偏好延续到A股，但指数没有走成普涨。更直接的催化是Anthropic发布新模型、英伟达发布世界动作模型GR00T\n2，抬升机器人溢价；AI短剧与金鸡电影节首次设立AI单元，对影视传媒有事件驱动。海关总署公布前10个月进出口同比增20%、10月出口同比增35.2%，偏中期利好。药明康德移出美国国防部1260H名单对医药偏暖，但医药今天不是主战场。现货黄金回落至约4128美元，WTI约85.2美元续跌。今晚21:30还有美国10月CPI。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #宇树科技 $688836 、 #日出东方 $603366 、 #冰山冷热 $000530 、 #东方海洋\n$002086 、 #文投控股 $600715 、 #雪人集团 $002639 、 #大东方 $600327 、 #华策影视 $300133\n、 #东方新能 $002310\n等。同花顺热榜亦见冰山冷热、阳光照明、宇树、中际旭创、新易盛。东方新能涨停是算力板卡合同的情绪定价，不宜算进硬件主线。\n#中美映射\n美股主题ETF用11月9日收盘：SMH收涨5.05%，近5日仍跌4.1%、近20日跌17.5%；SOXX收涨7.49%，近5日跌约3.0%、近20日跌约19%；机器人BOTZ收涨2.67%，近5日跌1.2%、近20日跌8.7%。A股刷新至收盘：近5日领跑的 ure build-out.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120029960345645469","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-10/tsmc-taiwan-semiconductor-manufacturing-revenue-earnings-ai-chip-demand?taid=6af2af617186690001d9166f&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":8,"rt":1,"rp":0,"vw":10605},{"id":"2120029101058904223","h":"dmjk001","ts":1794289300,"zh":"美媒爆猎头或已开始物色英伟达CEO潜在人选\n11月10日｜英伟达CEO黄仁勋爆出“出轨”丑闻，市场关注这间晶片巨头接任人安排，有分析文章指，猎头公司或已开始在业界物色人选，潜在人选包括超微半导体(AMD)行政总裁苏姿丰、晶片设计公司ARM行政总裁哈斯(Rene Haas)等重磅人物。The Information分析文章指，猎头公司或已开始物色人选，以防英伟达董事会一旦决定撤换黄仁勋时，可提出替代方案。其中AMD在苏姿丰领导下收入大幅上升，然而，两家公司存在竞争关系或令其过档较为复杂，加上她与黄仁勋有亲属关系，亦是障碍之一。哈斯或是更佳选择，因其早年曾在英伟达任职7年，以及对半导体行业非常熟悉。文章提到，由于英伟达并无明显的“第二把交椅”可随时接替黄仁勋，虽然财务总监克雷斯可出任临时替代人选，但非长期接班安排。黄仁勋最终很可能需要退下来，作为重要股东，他或意识到公司重新出发更符合其自身及全体股东利益。有媒体引述分析师及前员工提出数名接任人选，包括英伟达副总裁巴克(Ian Buck)、克雷斯，至于黄仁勋两名子女均在英伟达任职，是否能接手或胜任，则存在较大疑问。有分析认为，英伟达没有明显可接替黄仁勋人选，因黄仁勋影响力远不止于CEO一职，该公司约60位高层主管可直接向他汇报，他本人亦密切参与公司日常营运，高层能够直接与他沟通，意味没有明显第二把手，Bernstein分析员对媒体直言，“黄仁勋就是英伟达，英伟达就是黄仁勋。”","en":"美媒爆猎头或已开始物色英伟达CEO潜在人选\n11月10日｜英伟达CEO黄仁勋爆出“出轨”丑闻，市场关注这间晶片巨头接任人安排，有分析文章指，猎头公司或已开始在业界物色人选，潜在人选包括超微半导体(AMD)行政总裁苏姿丰、晶片设计公司ARM行政总裁哈斯(Rene Haas)等重磅人物。The Information分析文章指，猎头公司或已开始物色人选，以防英伟达董事会一旦决定撤换黄仁勋时，可提出替代方案。其中AMD在苏姿丰领导下收入大幅上升，然而，两家公司存在竞争关系或令其过档较为复杂，加上她与黄仁勋有亲属关系，亦是障碍之一。哈斯或是更佳选择，因其早年曾在英伟达任职7年，以及对半导体行业非常熟悉。文章提到，由于英伟达并无明显的“第二把交椅”可随时接替黄仁勋，虽然财务总监克雷斯可出任临时替代人选，但非长期接班安排。黄仁勋最终很可能需要退下来，作为重要股东，他或意识到公司重新出发更符合其自身及全体股东利益。有媒体引述分析师及前员工提出数名接任人选，包括英伟达副总裁巴克(Ian Buck)、克雷斯，至于黄仁勋两名子女均在英伟达任职，是否能接手或胜任，则存在较大疑问。有分析认为，英伟达没有明显可接替黄仁勋人选，因黄仁勋影响力远不止于CEO一职，该公司约60位高层主管可直接向他汇报，他本人亦密切参与公司日常营运，高层能够直接与他沟通，意味没有明显第二把手，Bernstein分析员对媒体直言，“黄仁勋就是英伟达，英伟达就是黄仁勋。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2120029101058904223","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":892},{"id":"2120028699907047697","h":"business","ts":1794289204,"zh":"中国正接近富裕国家的地位，经济规模达20万亿美元。但与即将成为同龄人的国家相比，许多人仍然很穷 ely-poor?taid=6af2ae34191e68000106e0f5&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"China is nearing rich-country status with a $20 trillion economy. But compared with its soon-to-be peers, many of its people are still poor","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120028699907047697","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-09/china-s-economy-is-nearly-20-trillion-but-its-citizens-remain-relatively-poor?taid=6af2ae34191e68000106e0f5&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":1,"rp":0,"vw":11844},{"id":"2120027625909559631","h":"cnfinancewatch","ts":1794288948,"zh":"散户热议｜2026-11-10·午间\n数据时点：2026-11-10 约13:15–13:40\n北京时间。国内优先访问韭研公社公开页；《11月10日午间复盘》《午间网络热门题材1110》等帖可以打开标题和发布时间，但正文未能稳定抓取（页面偏登录/图片），故不编造引语或情绪统计，只依据帖名、时间戳与公开检索摘要，并补充可核验的公开盘面数据。海外依据Stocktwits英伟达公开页（同期抓取）。Reddit\nWallStreetBets热门页本期仍未能稳定读到11月10日当日帖文正文，二手汇总数据互相打架，故不转述具体评论或提及次数。本文区分【社区观点】与【可核事实】。\n【国内：韭研公社 + 公开盘面】\n1. 社区午间讨论明显转向“主线有了”，焦点是机器人、AI影视，而不是早盘还在说的太空算力。【社区观点／检索摘要】署名“彤彤姐姐”的《11月10日午间复盘》于12:37发布，署名“survivor35”的《午间网络热门题材1110》于12:44发布；公开检索对热门题材帖的摘要称，AI影视相关讨论由约2篇增至约12篇，机器人由约11篇增至约17篇，航天热度回落，福莱新材为当日较高频标的之一。另有短剧、端侧AI等相关推荐帖出现。【可核事实】公开午评确认影视院线、人形机器人、CPO走强，慈文传媒、掌阅科技、上海电影、文投控股等涨停或走强；金融界据交易所盘中数据，午间机器人概念主力资金净流入68.49亿元居首，CPO\n51.79亿元，短剧互动游戏23.40亿元。与券商口径的异同：机构更强调量能回升、外贸和关税窗口；社区更快把交易落在“哪条主线能接力、哪只是龙头”。被忽略的风险：主线成立，不等于高价股和涨停股都可以追——宇树自低点已接近翻倍，利润增速还在回落。\n2. “东方”系和“羊”字辈仍是情绪垃圾桶，也是最容易出现亏钱效应的地方。【社区观点／检索摘要】公社盘前到午间仍有“东方”系、羊字辈补涨与退潮的讨论，检索结果把它写成名称玄学与高位风险并存，不能当作已核实的逐条评论。【可核事实】日出东方、东方新能等公开报道录得3连板，阳光照明被报道为九个交易日七个涨停且早盘再封，公司近日多次发风险提示。与券商口径几乎不在同一个市场：一边在给光模块和出口链做基本面定价，一边在做名字接力。追高风险很具体——高位换手一旦对倒结束，跟风盘会先被留下。\n3. 赚钱效应半日看起来很好，但结构极不均匀。【可核事实】超3800只个股上涨，公开报道涨停约53家、跌停0家，半日成交约9682亿元；同时沪指只涨0.06%，油气、煤炭、海运、保险偏弱。社区若把“差不多都在涨”理解成指数行情，会漏掉权重并未跟上、高低切换随时能发生这一点。药明康德被移出美国国防部1260H名单，A股午间只涨约0.5%，也说明并非所有利好都会被立刻炒起来。\n【海外：Stocktwits｜社区观点 + 可核事实】\n1. 英伟达页情绪读数仍标注为95、Extremely\nBullish，但内容并不一边倒。【可核事实】页面显示前收178.67美元，隔夜报价约179.73美元、涨0.59%，财报定在11月17日。【社区观点】多条公开留言仍是“需求还在、适合抄底、丑闻会过去、等财报”；也有人追问调查期间谁来主持业绩会、董事会会不会动管理层，以及“知情资金是否早已出货”。指控本身仍在调查中，不能把社区争论写成事实。被忽略的风险：情绪读数偏多，只说明愿意说话的人偏多，不代表事件风险已经定价完毕；财报周和调查重叠，波动不对称。\n2. WSB：本期未能稳定读取当日热门帖正文，因此不作细节转述，以免把旧帖或互相冲突的二手统计想象成今日观点。\n【小结】\n国内散户午间交易的是机器人、AI影视和还在蹦的名称连板；海外散户交易的是英伟达该不该抄底。券商口径更靠近量能、外贸与事件周风险管理，社区口径更靠近主线和板。把太空算力、微末参股或名字写成订单，或把CEO调查直接等同于AI需求证伪，都是当前最常见的过度解读。公社正文抓取缺口、WSB读取失败已标明；Stocktwits为公开页整理，引述以原帖为准。\n以上不构成投资建议，投资有风险。","en":"散户热议｜2026-11-10·午间\n数据时点：2026-11-10 约13:15–13:40\n北京时间。国内优先访问韭研公社公开页；《11月10日午间复盘》《午间网络热门题材1110》等帖可以打开标题和发布时间，但正文未能稳定抓取（页面偏登录/图片），故不编造引语或情绪统计，只依据帖名、时间戳与公开检索摘要，并补充可核验的公开盘面数据。海外依据Stocktwits英伟达公开页（同期抓取）。Reddit\nWallStreetBets热门页本期仍未能稳定读到11月10日当日帖文正文，二手汇总数据互相打架，故不转述具体评论或提及次数。本文区分【社区观点】与【可核事实】。\n【国内：韭研公社 + 公开盘面】\n1. 社区午间讨论明显转向“主线有了”，焦点是机器人、AI影视，而不是早盘还在说的太空算力。【社区观点／检索摘要】署名“彤彤姐姐”的《11月10日午间复盘》于12:37发布，署名“survivor35”的《午间网络热门题材1110》于12:44发布；公开检索对热门题材帖的摘要称，AI影视相关讨论由约2篇增至约12篇，机器人由约11篇增至约17篇，航天热度回落，福莱新材为当日较高频标的之一。另有短剧、端侧AI等相关推荐帖出现。【可核事实】公开午评确认影视院线、人形机器人、CPO走强，慈文传媒、掌阅科技、上海电影、文投控股等涨停或走强；金融界据交易所盘中数据，午间机器人概念主力资金净流入68.49亿元居首，CPO\n51.79亿元，短剧互动游戏23.40亿元。与券商口径的异同：机构更强调量能回升、外贸和关税窗口；社区更快把交易落在“哪条主线能接力、哪只是龙头”。被忽略的风险：主线成立，不等于高价股和涨停股都可以追——宇树自低点已接近翻倍，利润增速还在回落。\n2. “东方”系和“羊”字辈仍是情绪垃圾桶，也是最容易出现亏钱效应的地方。【社区观点／检索摘要】公社盘前到午间仍有“东方”系、羊字辈补涨与退潮的讨论，检索结果把它写成名称玄学与高位风险并存，不能当作已核实的逐条评论。【可核事实】日出东方、东方新能等公开报道录得3连板，阳光照明被报道为九个交易日七个涨停且早盘再封，公司近日多次发风险提示。与券商口径几乎不在同一个市场：一边在给光模块和出口链做基本面定价，一边在做名字接力。追高风险很具体——高位换手一旦对倒结束，跟风盘会先被留下。\n3. 赚钱效应半日看起来很好，但结构极不均匀。【可核事实】超3800只个股上涨，公开报道涨停约53家、跌停0家，半日成交约9682亿元；同时沪指只涨0.06%，油气、煤炭、海运、保险偏弱。社区若把“差不多都在涨”理解成指数行情，会漏掉权重并未跟上、高低切换随时能发生这一点。药明康德被移出美国国防部1260H名单，A股午间只涨约0.5%，也说明并非所有利好都会被立刻炒起来。\n【海外：Stocktwits｜社区观点 + 可核事实】\n1. 英伟达页情绪读数仍标注为95、Extremely\nBullish，但内容并不一边倒。【可核事实】页面显示前收178.67美元，隔夜报价约179.73美元、涨0.59%，财报定在11月17日。【社区观点】多条公开留言仍是“需求还在、适合抄底、丑闻会过去、等财报”；也有人追问调查期间谁来主持业绩会、董事会会不会动管理层，以及“知情资金是否早已出货”。指控本身仍在调查中，不能把社区争论写成事实。被忽略的风险：情绪读数偏多，只说明愿意说话的人偏多，不代表事件风险已经定价完毕；财报周和调查重叠，波动不对称。\n2. WSB：本期未能稳定读取当日热门帖正文，因此不作细节转述，以免把旧帖或互相冲突的二手统计想象成今日观点。\n【小结】\n国内散户午间交易的是机器人、AI影视和还在蹦的名称连板；海外散户交易的是英伟达该不该抄底。券商口径更靠近量能、外贸与事件周风险管理，社区口径更靠近主线和板。把太空算力、微末参股或名字写成订单，或把CEO调查直接等同于AI需求证伪，都是当前最常见的过度解读。公社正文抓取缺口、WSB读取失败已标明；Stocktwits为公开页整理，引述以原帖为准。\n以上不构成投资建议，投资有风险。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120027625909559631","l":[],"ln":[],"t":["A股港股","AI科技","财报","关税贸易"],"lk":0,"rt":0,"rp":1,"vw":671},{"id":"2120027621727859042","h":"cnfinancewatch","ts":1794288947,"zh":"热点财经新闻综述｜2026-11-10·午间\n数据时点：2026-11-10 约13:15–13:40\n北京时间。本稿交叉核实今日午间热点财经邮件、早间档发出后送达的早间热点财经邮件，以及公开网页。【已核实】附来源，【邮件转述】不作硬事实。自今日13时01分起，对美加征24%关税继续暂停、保留10%的措施已正式生效。\n今日判断：上午是“指数平、结构热、量能回来了”。【已核实】截至午间，上证指数报3662.81点、涨0.06%，深证成指涨0.76%，创业板指报2495.29点、涨1.49%，科创综指涨1.32%；全市场半日成交约9682亿元，超3800只个股上涨，公开报道涨停约53家、跌停0家。油气、煤炭、海运、保险、酒类拖累沪指，影视院线、人形机器人、CPO与PCB抬升成长风格。隔夜美股修复已在A股成长股里兑现一截，但沪指几乎走平，说明权重和资源品没有跟上。把半日反弹写成全面转势，或在高价股、连板和名称炒作上加仓，都过早。下午看量能能否守住，以及出口链对关税暂停正式生效的反应。\n【三大利多方向】（由强到弱）\n1. 算力硬件与光通信修复，成交和上涨家数同时改善。【已核实】公开午评中，CPO、PCB、光通信、半导体涨幅居前；早盘报道中际旭创、新易盛涨超6%。金融界据交易所盘中数据：午间题材主力资金净流入前五为机器人概念68.49亿元、5G概念62.27亿元、CPO\n51.79亿元、人形机器人49.44亿元，PCB为35.86亿元。这是对隔夜费城半导体大涨、英伟达却独跌的分散映射：资金买的是光模块、PCB和机器人链条，而不是单押一个海外龙头。意义在于，周一全天成交跌破1.5万亿后，今日半日已接近9700亿元，修复有量配合。制约是持续性仍取决于海外AI资本开支和订单，不能把早盘反弹写成调整结束。\n2. 人形机器人成为当日最强定价主线。【已核实】宇树科技盘中一度涨超11%、股价回到800元上方、市值突破3200亿元；公开报价约778.50元、涨约8.73%，自10月15日低点404.03元反弹接近100%，盘中成为A股第三高价股。福莱新材等机器人相关股涨停。公司三季度营收6.65亿元、同比增69.93%，归母净利1.13亿元、同比降17.37%。物理AI已进入高价股定价阶段，弹性最大，也最容易透支；低点附近翻倍后再追，回撤会放大。\n3. 外贸数据超预期，叠加关税暂停正式生效，出口链有基本面垫子。【已核实】海关总署：前10个月货物贸易进出口44.81万亿元、同比增20%，出口25.99万亿元、增17.6%，进口18.82万亿元、增23.6%；10月当月进出口4.87万亿元、增31.2%。对美加征24%关税自13时01分起继续暂停两个月，保留10%。同期，卫健委等四部门通知优化创新药配备使用，不对医疗机构总药品品种品规数量作硬性限制；药明康德公告被移出美国国防部1260H名单，但A股午间仅约涨0.5%，利好已被部分消化。制约是关税窗口可逆，出口改善也掩盖不了内需和资源品走弱。\n【三大利空方向】（由强到弱）\n1. 英伟达治理事件尚未结束，指数与龙头继续背离。【已核实】周一英伟达收跌约4.27%、报178.67美元；公司董事会已启动独立董事调查，11月17日将发布财报。盘前/隔夜报价仅小幅反弹。相关指控仍在调查中，不能写成定论。对A股的含义是：今天可以交易算力链修复，但不能假设海外龙头风险已经出清。若财报周再出不利信息，今天买得最热的CPO与机器人也会先波动。\n2. 名称炒作与高位连板仍在争夺流动性。【已核实】“东方”系再掀涨停潮，日出东方、东方新能等公开报道录得3连板；阳光照明被报道为九个交易日七个涨停，早盘再度封板，公司近日多次提示风险。这与机器人、CPO不是同一类交易：前者靠名字和情绪接力，后者至少有产业映射。一旦高位股分化，跟风盘会先出现亏钱效应，并抽走题材资金。\n3. 外部去杠杆余波与通胀数据真空仍在。【已核实】公开报道转述高盛对上周美国基本面对冲基金仓位的解读：总杠杆单周下降约8.7个百分点至约207.5%，净杠杆约43.3%，接近2020年3月以来最显著的单周去杠杆。这是上周已发生的事，周一美股大涨说明部分抛压已被对冲，但不能当成风险消失。另据劳工统计局相关说明，原定本周公布的美国10月CPI将缺少同比数据（2025年政府停摆导致基期缺失），市场只能更多看环比。【邮件转述】个别联储官员偏鹰表态本期未全部核对原文，先作观察。不宜把半日反弹外推成趋势反转。\n多空如何制约：量能回升、外贸与关税窗口，对冲的是指数失速；对冲不了“英伟达事件周”和“高位名称接力”。沪指几乎平盘、创业板偏强，本身就是提醒——钱在结构里，不在权重里。下午重点看半日近9700亿元的量能否延续，以及13:01之后出口链是否有增量，而不是连板梯队有多热闹。\n来源主要为新华财经/中国金融信息网午评、中新网、海关总署、财政部关税公告、央视新闻与证券时报、公司公告、金融界盘中资金以及凤凰网等公开报道，交叉今日午间及早间热点财经邮件线索。不构成投资建议，投资有风险。\n================","en":"热点财经新闻综述｜2026-11-10·午间\n数据时点：2026-11-10 约13:15–13:40\n北京时间。本稿交叉核实今日午间热点财经邮件、早间档发出后送达的早间热点财经邮件，以及公开网页。【已核实】附来源，【邮件转述】不作硬事实。自今日13时01分起，对美加征24%关税继续暂停、保留10%的措施已正式生效。\n今日判断：上午是“指数平、结构热、量能回来了”。【已核实】截至午间，上证指数报3662.81点、涨0.06%，深证成指涨0.76%，创业板指报2495.29点、涨1.49%，科创综指涨1.32%；全市场半日成交约9682亿元，超3800只个股上涨，公开报道涨停约53家、跌停0家。油气、煤炭、海运、保险、酒类拖累沪指，影视院线、人形机器人、CPO与PCB抬升成长风格。隔夜美股修复已在A股成长股里兑现一截，但沪指几乎走平，说明权重和资源品没有跟上。把半日反弹写成全面转势，或在高价股、连板和名称炒作上加仓，都过早。下午看量能能否守住，以及出口链对关税暂停正式生效的反应。\n【三大利多方向】（由强到弱）\n1. 算力硬件与光通信修复，成交和上涨家数同时改善。【已核实】公开午评中，CPO、PCB、光通信、半导体涨幅居前；早盘报道中际旭创、新易盛涨超6%。金融界据交易所盘中数据：午间题材主力资金净流入前五为机器人概念68.49亿元、5G概念62.27亿元、CPO\n51.79亿元、人形机器人49.44亿元，PCB为35.86亿元。这是对隔夜费城半导体大涨、英伟达却独跌的分散映射：资金买的是光模块、PCB和机器人链条，而不是单押一个海外龙头。意义在于，周一全天成交跌破1.5万亿后，今日半日已接近9700亿元，修复有量配合。制约是持续性仍取决于海外AI资本开支和订单，不能把早盘反弹写成调整结束。\n2. 人形机器人成为当日最强定价主线。【已核实】宇树科技盘中一度涨超11%、股价回到800元上方、市值突破3200亿元；公开报价约778.50元、涨约8.73%，自10月15日低点404.03元反弹接近100%，盘中成为A股第三高价股。福莱新材等机器人相关股涨停。公司三季度营收6.65亿元、同比增69.93%，归母净利1.13亿元、同比降17.37%。物理AI已进入高价股定价阶段，弹性最大，也最容易透支；低点附近翻倍后再追，回撤会放大。\n3. 外贸数据超预期，叠加关税暂停正式生效，出口链有基本面垫子。【已核实】海关总署：前10个月货物贸易进出口44.81万亿元、同比增20%，出口25.99万亿元、增17.6%，进口18.82万亿元、增23.6%；10月当月进出口4.87万亿元、增31.2%。对美加征24%关税自13时01分起继续暂停两个月，保留10%。同期，卫健委等四部门通知优化创新药配备使用，不对医疗机构总药品品种品规数量作硬性限制；药明康德公告被移出美国国防部1260H名单，但A股午间仅约涨0.5%，利好已被部分消化。制约是关税窗口可逆，出口改善也掩盖不了内需和资源品走弱。\n【三大利空方向】（由强到弱）\n1. 英伟达治理事件尚未结束，指数与龙头继续背离。【已核实】周一英伟达收跌约4.27%、报178.67美元；公司董事会已启动独立董事调查，11月17日将发布财报。盘前/隔夜报价仅小幅反弹。相关指控仍在调查中，不能 日\n先说结论：对照第一版，三条主线没有被证伪，集合竞价把权重写得更清楚了。隔夜美股和费半修复之后，韩股早盘大涨并曾触发sidecar、台股加权涨约2.1%，算力硬件在竞价里明显高开；太空算力里材料和星图抢跑，中国卫星只温和高开；黄金仍在4100美元上方，山东黄金小高开。指数尚未正式开盘，上证虚拟匹配几乎平开在3660.74点。风险偏好还在，但字辈里东方海洋竞价跌停，说明情绪票已经分化，更不适合追连板。主线仍是AI算力硬件、太空算力与商业航天、贵金属超短。总仓中性，高开的先看回撤再动手。\n#消息面\n两小时更新为主。韩综指现涨约3.8%，早盘报道一度涨超5%并启动sidecar，SK海力士、三星电子跟涨；台股加权涨约2.1%。这是对隔夜费半大涨的亚太接力，强化算力硬件开盘定价。\n#药明康德 $603259 公告美国国防部将其从1260H项下中国军工企业名单移除，对CXO情绪偏正面。 #东方新能 $002310\n隔夜签署约9.12亿元算力板卡采购合同，用于AI推理、微调及渲染，同时提示算力服务尚处起步、未形成相关收入和确定订单，合同执行有不确定性；今早异常波动公告同步流通，竞价仍按涨停附近定价，属于情绪票贴上算力标签，不把它升格为主线样本。联想宣布首个混合词元母本工厂落地张家口；Anthropic据悉拟IPO募资至多693亿美元。快舟六号可重复使用火箭拟2027年首飞回收，商业航天降本叙事延续。国内商品期货开盘燃油跌超5%、SC原油跌超4%，沪银涨超1%。今日13时01分继续暂停对美加征24%关税，第一版已提示，按点生效。美东今晚仍有10月CPI。\n#研报面\n今早新公开的行业口径：开源证券计算机2027年度策略强调从大模型竞赛到算力需求井喷；国新证券计算机三季报称景气向算力集中；中信建投计算机2027年策略建议关注国产算力等方向。国新证券另有高端制造点评，称美国人形机器人第一股上市，产业定价从演示转向交付。第一版援引的万联电子跟踪和华安对胜宏科技等PCB标的买入评级仍在，未见被新报告推翻。与六只样本直接对应的新个股研报两小时内未见。\n#热榜\n东财人气榜较第一版变化不大：前十仍是雪人集团、日出东方、顺灏股份、东方新能、冰山冷热、东方海洋、大东方、龙江交通、文投控股、超声电子。\n#西部材料 $002149 升至第11， #中国卫星 $600118 从第12降至第14， #上纬新材 $688585\n从第11降至第13。冰雪与字辈情绪仍重，但西部材料前移、东方海洋竞价跌停，说明同一热度池子已经开始分流。\n#资金面\n截至11月9日两市融资余额约22595亿元，较前一日增加约120.69亿元；当日ETF整体净申购约108.35亿元，其中股票型约54.04亿元。第一版提到的互换便利券商买入和龙虎榜情绪票净买入格局没有新的盘前修正。集合竞价里昨日涨停、昨日连板概念虚拟涨幅约8%至9%，资金愿意接力情绪，但也在东方海洋上给出反向定价。\n#中美映射\n映射沿用早盘快照，开盘后未重算。半导体ETF\nSMH收涨约5.0%，近5日仍约-4%、近20日约-18%；机器人BOTZ收涨约2.7%，近5日约-1%、近20日约-9%。A股主题至11月9日：5日靠前为光伏、黄金、电池、半导体，20日靠前为酒、医药、汽车、医疗。亚太开盘后韩股半导体链大涨，相当于把5日半导体脉冲又确认了一遍；20日趋势仓仍看医药医疗，药明康德摘牌消息对这一侧偏暖。太空算力仍是A股事件驱动，中美ETF映射弱。\n#期货\n富时中国A50相关报价约13024点，较前值12906约高0.91%，比第一版所见的约13045点略回吐，夜盘涨约1.06%后早盘低开。现货黄金在约4140至4145美元波动，与第一版所见4100上方格局一致；WTI约86.3美元，较第一版的86.5附近再软一点。国内股指期货日盘尚未开始，仍以9日收盘为参考。恒生指数尚未开盘，前收约24449点。\n#三个方向\nAI算力硬件：竞价验证最强。PCB概念约+2.1%，CPO约+2.8%，光通信模块约+2.7%，光刻机约+2.7%，印制电路板行业约+3.3%。\n#胜宏科技 $300476 竞价约+5.7%， #沪电股份 $002463 约+3.8%， #中微公司 $688012\n约+2.0%，光模块里 #新易盛 $300502 约+5.7%、 #中际旭创 $300308\n约+4.0%。逻辑仍是美股芯片修复加电子链回购，只是高开后更要等回撤，不要把东方新能这类情绪票算进这条主线。\n太空算力与商业航天：星云星座计划叙事还在，快舟六号补充了商业航天降本想象。竞价里 #西部材料 $002149 约+10%， #中科星图\n$688568 约+15.8%， #中国卫星 $600118 只约+1.5%。 在10%以上，我们认为公司辣椒红提价逻辑即将逐步兑现，2027年叶黄素、辣椒红提价或将带来1e以上的毛利改善，同时叠加公司高毛利定制化产品占比提升，高毛利梯队产品快速放量，我们看好27年公司利润弹性，预计26/27年利润3.7/5.4亿元，对应PE17X/11X，持续推荐！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119937934782763460","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":250},{"id":"2119937676245913658","h":"cnfinancewatch","ts":1794267503,"zh":"#1109复盘汇总\n1️⃣机器人概念：午后涨停潮，全天最强主线\n据外媒报道，三星、SK海力士、美光三大存储原厂正与SEMI磋商晶圆厂内机器人充电系统标准化，叠加国产人形机器人量产预期持续发酵\n相关个股：上纬新材、阿尔特、宇树科技、光洋股份\n2️⃣冰雪产业：第28届哈尔滨冰雪大世界，携手华特迪士尼（中国），以《冰雪奇缘》为主题打造专属冰雪区域这是该主题冰雪雕塑在全球范围内，首次于哈尔滨呈现\n相关个股：冰山冷热、晶雪节能、雪人股份、龙建集团\n3️⃣：钛板：太空算力最新分支根据天风证券，NVSpace-1太空机柜需要用到钛板，一是用于抗发射时的随机振动和冲击，二是给GPU做局部辐射屏蔽，价值量高达4W/机柜\n相关个股：西部材料、宝钛股份、金天钛业、天力复合\n#今日前瞻\n1️⃣李强签署国务院令公布《中医药传统知识保护条例》，对列入保护名录的中医药传统知识，支持传承传播，加强推广应用，促进研究创新\n相关个股：盘龙药业、太龙药业、陇神戎发、佛慈制药\n2️⃣美国政府将就英伟达CEO黄仁勋相关事宜向国会作情况通报美对外AI芯片出口限制或将持续升级，国产算力有望受益\n相关个股：燧原科技、大胜达、寒武纪、沐曦股份\n银行2027年度策略出炉\n去年策略报告中几点预测都有应验，我们在今年报告中也对2027提出四大预测：\n1️⃣上市银行是最核心的优质红利资产明年上半年息差好于下半年，利润增速稳定在4%-5%\n2️⃣分红率稳步提速，贷款降速提质给予银行更高分红能力\n3️⃣A股银行有望再现“1倍PB”，国有大行提振估值中枢、优质城商行率先站上1倍，同时2027年关注头部股份行“适时重生”\n4️⃣2027银行资金面还有预期差，欠配权重股有更大机会“稳稳的幸福”更强于“东张西望”\n【国盛张一鸣】积极配置机器人\nOptimus将是27年最大科技单品，用于训练的V3已经开启量产并初步亮相，供应链积累的越来越多的订单已经无法掩盖，10月份爬坡的斜率会很陡峭Q4诸多大厂（包括T、英伟达、Meta、hw、小鹏等）都可能有重磅发布，节前建议积极配置\n高确定性高价值量标的：田中精机、科森科技、斯菱智驱、浙江荣泰、北特科技、鸣志电器等同时关注常州链的进展：光洋科技、新泉股份、凯迪股份；\n核心tier2:恒锋工具（谐波、丝杠刀具，订单已排产至三个月后，对日替代）、正强股份（手腕关节总成+谐波波发生器）；\n国产C端：上纬新材、中坚科技等\nAI眼镜&手表ZJ要点更新1109\nAI眼镜痛点与解决路径\n⚜️体积重量：比较重，体积大路径：3D堆叠封装，工艺制程提升\n⚜️功耗续航：2h充电一次路径：低功耗芯片、多电源域\n⚜️显示成本：MicroLED2027年有机会降至500-600元\n北美CSPAI眼镜进展\n⚜️Meta：2027Q23D模型落地，用于植物、动物等本地识别\n⚜️三星与谷歌：Gemini最晚2027Q3发布谷歌端侧拟将音频、视频等体系像安卓一样整合，有生态闭环\n⚜️苹果：2027Q3发布产品\nAI眼镜成本与渠道\n⚜️整机定价：带显示产品目前普遍要四五千元，不带显示约3000多元；安卓体系带显示整机需做到2000元左右才可能爆发\n⚜️不带显示的BOM：主控AR1约60美金、恒玄2800约15美金，合计约75美金，主控约占BOM的70%；电源约5美金；其他\nAI眼镜芯片竞争格局\n芯海科技、炬芯做ISP但缺蓝牙/WiFi无线能力，高通低功耗目前不是很好，杰里、中科蓝讯做不了ISP和安卓系统，恒玄相对最有优势；但高通2027年出MCU加框架芯片、先进制程功耗更低，格局可能变化\n2026智能手表行业出货\n2027总量：599元以上手表2027年可能约9000万台，年增长约10%；华为和苹果合计占约60%\nAI手表芯片竞争格局\n⚜️华为苹果：华为因美国商务部/中美关系及自用难进入，苹果因自研芯片、 消息，立陶宛外交部在 9 月份要求台湾驻维尔纽斯代表处在一周内更改其名称。中国外交官预计于11月11日至12日访立陶宛，与立陶宛外交部代表及一群寻求与北京恢复外交关系的议员会晤。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/RFI_Cn/status/2119784815276786115","l":["rfi.my"],"ln":[{"u":"https://rfi.my/DCoO","d":"rfi.my"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":402},{"id":"2119784708620108049","h":"cnfinancewatch","ts":1794231032,"zh":"今日美股与全球热点二十条\n（一）\n1、据Reuters与Barron's 11月9日报道，英伟达董事会就CEO黄仁勋相关间谍指控报道启动调查，英伟达股价盘前下跌约5%，盘后与永续期货交易中跌约3%。\n2、涉及标的：NVDA；A股对应方向为算力硬件与CPO，代表个股中际旭创（300308）、新易盛（300502）、工业富联（601138）。\n3、影响：偏空美股，强度强，属当日情绪影响。CEO层面治理风险属典型黑天鹅，对A股算力硬件形成情绪压制，但A股CPO方向当日仍上涨，传导存在时滞。\n（二）\n1、据Bloomberg 11月9日报道，对冲基金以史上最快速度之一抛售科技股；据WSJ报道AI恐慌笼罩股市，科技股经历疫情以来最惨烈一周。\n2、涉及标的：QQQ、SPY；A股对应方向为AI算力与半导体，代表个股长鑫科技（688825）-1.04%、有研新材（600206）+0.03%。\n3、影响：偏空美股，强度强，属持续性逻辑。机构系统性降仓科技股意味着AI交易进入去杠杆阶段，对A股半导体与算力板块构成中期估值压制。\n（三）\n1、据Bloomberg 11月9日报道，花旗策略师在AI动荡后下调美股评级并上调欧洲股市评级。\n2、涉及标的：SPY、VGK；A股对应方向为外资配置的中国资产，代表方向为沪深300宽基，沪深300ETF易方达（510310）获资金连续布局。\n3、影响：偏空美股，偏多欧洲，强度中等，属持续性逻辑。区域再平衡利好非美市场，A股宽基ETF逆市吸金与这一逻辑方向一致，但传导强度取决于汇率与风险偏好。\n（四）\n1、据Bloomberg 11月9日报道，中国国家队ETF买入规模升至纪录高位；据中国基金报报道A股宽基ETF逆市吸金，包揽亚洲周度吸金榜前四。\n2、涉及标的：沪深300ETF易方达（510310）、科创50ETF；A股对应方向为宽基指数与科创板，代表个股为科创次新股长鑫科技（688825）。\n3、影响：偏多A股，强度强，属持续性逻辑。国家队与被动资金在外部冲击下形成托底，是当日A股缩量但仍收红的关键变量，对宽基权重构成支撑。\n（五）\n1、据Bloomberg 11月9日报道，美国中期选举结果出炉，民主党取得中期选举胜利，“蓝色浪潮”重创AI交易；据WSJ报道民主党胜利将给AI交易增加波动。\n2、涉及标的：NVDA、AMD；A股对应方向为AI算力与数据中心，代表个股工业富联（601138）+4.57%、亨通光电（600487）+3.20%。\n3、影响：偏空美股AI板块，强度强，属持续性逻辑。选举结果改变AI监管与算力扩张的政策预期，是本周科技股波动的核心宏观变量，对A股AI板块构成外部扰动。\n（六）\n1、据Reuters 11月9日报道，美国地方公投几乎全部对数据中心扩张亮起红灯，北达科他Harwood小镇成为唯一例外；据东方财富引述，人工智能推动电力需求急剧增长，服务商正疯狂寻找二手和翻新涡轮机。\n2、涉及标的：CEG、VST；A股对应方向为电力设备与数据中心液冷，代表个股冰山冷热（000530）+10.00%，题材含数据中心液冷。\n3、影响：偏空美国数据中心扩张，偏多电力设备，强度中等，属持续性逻辑。地方公投阻力推升电力稀缺性溢价，A股液冷与电力设备方向受益于同一产业逻辑。\n（七）\n1、据格隆汇11月9日报道，KKR三季度调整后净利润同比增长29%至16.45亿美元，管理资产规模达8040亿美元同比增长11%，但季度总营收45.64亿美元同比下降17.4%。\n2、涉及标的：KKR；A股对应方向为券商与多元金融，代表方向为头部券商板块。\n3、影响：中性偏多美股另类资管，强度弱，属持续性逻辑。AUM与调整后利润增长显示募资韧性，营收下滑暴露退出端压力，对A股券商板块传导有限。\n（八）\n1、据格隆汇11月9日报道，花旗恢复覆盖Uber并给予买入评级，目标价105美元 银行息差逻辑构成支撑。\n（十七）\n1、据Reuters 11月9日报道，美国中期选举后加密货币跌至两个月低点；据WSJ报道一种源自加密领域的热门新押注引发华尔街地盘争夺战。\n2、涉及标的：COIN、MSTR；A股对应方向为数字货币与区块链概念，素材中无直接对应个股，最贴近方向为金融科技板块。\n3、影响：偏空加密相关美股，强度中等，属当日情绪影响。选举结果改变加密监管预期，对A股金融科技板块传导有限，更多体现为风险偏好指标。\n（十八）\n1、据Seeking Alpha 11月9日报道，三井化学将与日本开发银行以88亿美元收购芯片材料制造商JSR；据东方财富报道三星蚀刻核心配方严重泄露，泛林韩国多次违规获取机密工艺文件。\n2、涉及标的：JSR为非美股上市标的，相关方为三井化学；A股对应方向为半导体材料与光刻胶，代表方向为电子化学品板块。\n3、影响：偏多半导体材料，强度中等，属持续性逻辑。日本芯片材料整合与配方泄露事件共同强化半导体材料自主可控叙事，对A股光刻胶与电子化学品构成中期主题支撑。\n（十九）\n1、据格隆汇11月9日报道，英国首相伯纳姆表示尚未就下调2030年电动汽车销售目标作出决定；据Bloomberg报道中国汽车出口增速预计从超高速放缓。\n2、涉及标的：TSLA、NIO；A股对应方向为电动车与锂电，代表方向为锂电池产业链，第十七届国际先进电动车锂电池大会于11月9日至12日举行。\n3、影响：中性偏空电动车，强度弱，属持续性逻辑。英国目标可能松动与中国出口放缓共同压制全球电动车增长预期，对A股锂电板块构成中期需求端压力。\n（二十）\n1、据Reuters 11月9日报道，受油价下跌与AI轮动推动，花旗与汇丰押注印度市场复苏，印度股市收于八个月高位，外资流入创纪录。\n2、涉及标的：INDA、EPI；A股对应方向为外资配置的中国资产，代表方向为沪深300宽基，沪深300ETF易方达（510310）获资金连续布局。\n3、影响：偏多印度股市，强度中等，属持续性逻辑。油价下行对印度这一原油进口国构成显著利好，形成对A股外资分流的竞争压力，需关注北向资金流向变化。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：","en":"今日美股与全球热点二十条\n（一）\n1、据Reuters与Barron's 11月9日报道，英伟达董事会就CEO黄仁勋相关间谍指控报道启动调查，英伟达股价盘前下跌约5%，盘后与永续期货交易中跌约3%。\n2、涉及标的：NVDA；A股对应方向为算力硬件与CPO，代表个股中际旭创（300308）、新易盛（300502）、工业富联（601138）。\n3、影响：偏空美股，强度强，属当日情绪影响。CEO层面治理风险属典型黑天鹅，对A股算力硬件形成情绪压制，但A股CPO方向当日仍上涨，传导存在时滞。\n（二）\n1、据Bloomberg 11月9日报道，对冲基金以史上最快速度之一抛售科技股；据WSJ报道AI恐慌笼罩股市，科技股经历疫情以来最惨烈一周。\n2、涉及标的：QQQ、SPY；A股对应方向为AI算力与半导体，代表个股长鑫科技（688825）-1.04%、有研新材（600206）+0.03%。\n3、影响：偏空美股，强度强，属持续性逻辑。机构系统性降仓科技股意味着AI交易进入去杠杆阶段，对A股半导体与算力板块构成中期估值压制。\n（三）\n1、据Bloomberg 11月9日报道，花旗策略师在AI动荡后下调美股评级并上调欧洲股市评级。\n2、涉及标的：SPY、VGK；A股对应方向为外资配置的中国资产，代表方向为沪深300宽基，沪深300ETF易方达（510310）获资金连续布局。\n3、影响：偏空美股，偏多欧洲，强度中等，属持续性逻辑。区域再平衡利好非美市场，A股宽基ETF逆市吸金与这一逻辑方向一致，但传导强度取决于汇率与风险偏好。\n（四）\n1、据Bloomberg 11月9日报道，中国国家队ETF买入规模升至纪录高位；据中国基金报报道A股宽基ETF逆市吸金，包揽亚洲周度吸金榜前四。\n2、涉及标的：沪深300ETF易方达（510310）、科创50ETF；A股对应方向为宽基指数与科创板，代表个股为科创次新股长鑫科技（688825）。\n3、影响：偏多A股，强度强，属持续性逻辑。国家队与被动资金在外部冲击下形成托底，是当日A股缩量但仍收红的关键变量，对宽基权重构成支撑。\n（五）\n1、据Bloomberg 11月9日报道，美国中期选举结果出炉，民主党取得中期选举胜利，“蓝色浪潮”重创AI交易；据WSJ报道民主党胜利将给AI交易增加波动。\n2、涉及标的：NVDA、AMD；A股对应方向为AI算力与数据中心，代表个股工业富联（601138）+4.57%、亨通光电（600487）+3.20%。\n3、影响：偏空美股AI板块，强度强，属持续性逻辑。选举结果改变AI监管与算力扩张的政策预期，是本周科技股波动的核心宏观变量，对A股AI板块构成外部扰动。\n（六）\n1、据Reuters 11月9日报道，美国地方公投几乎全部对数据中心扩张亮起红灯，北达科他Harwood小镇成为唯一例外；据东方财富引述，人工智能推动电力需求急剧增长，服务商正疯狂寻找二手和翻新涡轮机。\n2、涉及标的：CEG、VST；A股对应方向为电力设备与数据中心液冷，代表个股冰山冷热（000530）+10.00%，题材含数据中心液冷。\n3、影响：偏空美国数据中心扩张，偏多电力设备，强度中等，属持续性逻辑。地方公投阻力推升电力稀缺性溢价，A股液冷与电力设备方向受益于同一产业逻辑。\n（七）\n1、据格隆汇11月9日报道，KKR三季度调整后净利润同比增长29%至16.45亿美元，管理资产规模达8040亿美元同比增长11%，但季度总营收45.64亿美元同比下降17.4%。\n2、涉及标的：KKR；A股对应方向为券商与多元金融，代表方向为头部券商板块。\n3、影响：中性偏多美股另类资管，强度弱，属持续性逻辑。AUM与调整后利润增长显示募资韧性，营收下滑暴露退出端压力，对A股券商板块传导有限。\n（八）\n1、据格隆汇11月9日报道，花旗恢复覆盖Uber并给予买入评级，目标价105美元。\n2、涉及标的：UBER；A股对应方向为出行平台与网约车产业链，素材中无直接对应个股，最贴近方向为交通出行与本地生活服务板块。\n3、影响：偏多美股，强度弱，属持续性逻辑。单一券商评级对股价影响有限，对A股无实质传导，仅具情绪参照意义。\n（九）\n1、据格隆汇11月9日报道，伯克希尔哈撒韦将发行三系列日元计价高级票据；据WSJ报道伯克希尔季度利润在投资收益缩水后下滑；据MarketWatch报道其最新季度最大看点并非3570亿美元现金或股票回购。\n2、涉及标的：BRK.A、BRK.B；A股对应方向为高股息红利资产，代表方向为煤炭与银行，当日煤炭掀起涨停潮、银行股再度走强多只标的逼近新高。\n3、影响：中性，强度弱，属持续性逻辑。伯克希尔现金规模与日元融资动作强化全球高股息比价逻辑，A股煤炭与银行走强与这一风格方向一致。\n（十）\n1、据WSJ 11月9日报道，特斯拉Cybertruck因销量疲软将停产，马斯克表示产能转向Cybercab；据BusinessInsider报道马斯克称特斯拉将不得不退还大量Cybertruck订金。\n2、涉及标的：TSLA；A股对应方向为特斯拉产业链与皮卡零部件，代表个股新亚制程（002388）+2.25%，题材含富士康概念与有机硅；东方嘉盛（002889）+9.99%，题材含特斯拉概念。\n3、影响：偏空美股特斯拉，强度中等，属持续性逻辑。Cybertruck停产是产品线收缩信号，对A股特斯拉产业链中皮卡相关配套构成负面预期，但Cybercab方向可能带来新配套需求。\n（十一）\n1、据Barron's 11月9日报道，SpaceX计划进行星舰第15次试飞；据华尔街见闻报道SpaceX解禁潮撞上指数调仓，高盛测算12月调仓或带来109亿美元被动买盘。\n2、涉及标的：SpaceX为非上市标的，相关ETF与持仓方包括Ark Invest；A股对应方向为商业航天，代表个股中国卫星（600118）+4.55%、顺灏股份（002565）+10.02%、西部材料（002149）+9.99%。\n3、影响：偏多商业航天，强度中等，属持续性逻辑。星舰试飞与指数调仓买盘共同强化全球商业航天叙事，与A股快舟规划形成跨市场共振。\n（十二）\n1、据Seeking Alpha 11月9日报道，Cathie Wood旗下Ark Invest买入9600万美元SpaceX，增持英伟达与AMD，减持博通。\n2、涉及标的：ARKK、NVDA、AMD、AVGO；A股对应方向为AI算力与半导体，代表个股长鑫科技（688825）、有研新材（600206）。\n3、影响：偏多美股AI，强度弱，属当日情绪影响。木头姐在暴跌中逆势加仓属典型左侧行为，对市场情绪的稳定作用有限，对A股传导更弱。\n（十三）\n1、据Bloomberg 11月9日报道，Alphabet考虑亚洲债券发行，因AI担忧加剧市场波动；据Reuters报道Alphabet股价可能迎来修正性反弹。\n2、涉及标的：GOOGL；A股对应方向为AI应用与云计算，代表个股昆仑万维（300418）+3.59%、芒果超媒（300413）+2.79%。\n3、影响：中性，强度弱，属持续性逻辑。科技巨头债券融资反映AI资本开支的债务依赖上升，是信用市场压力的观察窗口，对A股AI应用板块传导间接。\n（十四）\n1、据格隆汇11月9日报道，布伦特原油下跌逾3%至每桶95美元附近，延续自2020年4月以来最大单周跌势；据WSJ报道油价在特朗普淡化对伊朗新打击前景后下跌并维持在100美元下方。\n2、涉及标的：USO、XLE；A股对应方向为石油开采偏空、航空交运偏多，代表方向为航空公司与炼化板块。\n3、影响：偏空能源股，偏多航空股，强度强，属当日情绪影响。油价历史性周跌是本周最大的宏观变量之一，对A股航空与化工成本端构成利好，对石油开采构成压制。\n（十五）\n1、据格隆汇11月9日报道，克罗地亚境内输油线路受损，亚得里亚海输油管道自11月6日起暂停向塞尔维亚潘切沃炼油厂输送原油。\n2、涉及标的：无直接对应美股个股，最贴近方向为欧洲炼化与原油运输，A股对应方向为炼化与油运板块。\n3、影响：偏多油运，强度弱，属当日情绪影响。管道中断推升替代性海运需求，但涉及体量有限，对A股油运板块仅构成边际情绪提振。\n（十六）\n1、据WSJ 11月9日报道，强劲就业数据推动美债收益率上升；据Bloomberg报道黄金在美国就业数据强化12月加息押注后维持跌势。\n2、涉及标的：TLT、GLD；A股对应方向为黄金采选偏空、银行偏多，当日银行股再度走强多只标的逼近新高。\n3、影响：偏空黄金，偏多美元与银行，强度中等，属持续性逻辑。就业数据强劲推后降息预期，对A股黄金板块构成压制，对银行息差逻辑构成支撑。\n（十七）\n1、据Reuters 11月9日报道，美国中期选举后加密货币跌至两个月低点；据WSJ报道一种源自加密领域的热门新押注引发华尔街地盘争夺战。\n2、涉及标的：COIN、MSTR；A股对应方向为数字货币与区块链概念，素材中无直接对应个股，最贴近方向为金融科技板块。\n3、影响：偏空加密相关美股，强度中等，属当日情绪影响。选举结果改变加密监管预期，对A股金融科技板块传导有限，更多体现为风险偏好指标。\n（十八）\n1、据Seeking Alpha 11月9日报道，三井化学将与日本开发银行以88亿美元收购芯片材料制造商JSR；据东方财富报道三星蚀刻核心配方严重泄露，泛林韩国多次违规获取机密工艺文件。\n2、涉及标的：JSR为非美股上市标的，相关方为三井化学；A股对应方向为半导体材料与光刻胶，代表方向为电子化学品板块。\n3、影响：偏多半导体材料，强度中等，属持续性逻辑。日本芯片材料整合与配方泄露事件共同强化半导体材料自主可控叙事，对A股光刻胶与电子化学品构成中期主题支撑。\n（十九）\n1、据格隆汇11月9日报道，英国首相伯纳姆表示尚未就下调2030年电动汽车销售目标作出决定；据Bloomberg报道中国汽车出口增速预计从超高速放缓。\n2、涉及标的：TSLA、NIO；A股对应方向为电动车与锂电，代表方向为锂电池产业链，第十七届国际先进电动车锂电池大会于11月9日至12日举行。\n3、影响：中性偏空电动车，强度弱，属持续性逻辑。英国目标可能松动与中国出口放缓共同压制全球电动车增长预期，对A股锂电板块构成中期需求端压力。\n（二十）\n1、据Reuters 11月9日报道，受油价下跌与AI轮动推动，花旗与汇丰押注印度市场复苏，印度股市收于八个月高位，外资流入创纪录。\n2、涉及标的：INDA、EPI；A股对应方向为外资配置的中国资产，代表方向为沪深300宽基，沪深300ETF易方达（510310）获资金连续布局。\n3、影响：偏多印度股市，强度中等，属持续性逻辑。油价下行对印度这一原油进口国构成显著利好，形成对A股外资分流的竞争压力，需关注北向资金流向变化。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119784708620108049","l":["macaostarbridge.com"],"ln":[{"u":"https://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["美联储","美股","A股港股","汇率","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":1,"vw":542},{"id":"2119784121014919172","h":"cnfinancewatch","ts":1794230892,"zh":"今日中国A股热点二十条\n（一）\n1、据格隆汇11月9日报道，快舟航天公布快舟系列运载火箭后续发展规划，未来三年快舟一号甲、快舟十一号两型火箭计划完成50次以上发射任务，2027年快舟十二号固液混合火箭、快舟六号可重复使用液体火箭计划实现首飞。\n2、涉及个股：中国卫星（600118），属商业航天与卫星导航板块；顺灏股份（002565），属商业航天与卫星导航概念，当日+10.02%，4天3板；航天产业链配套方向可关注火箭制造与卫星总装环节。\n3、影响：偏多，强度中等，属持续性逻辑。发射频次规划落地强化商业航天产业节奏预期，与当日东财人气榜中国卫星排名升135位形成呼应，短期情绪与中期订单逻辑共振。\n（二）\n1、据东方财富11月9日报道，“星云星座计划”发布，我国太空算力网加快部署，商业航天与算力基础设施出现交叉叙事。\n2、涉及个股：顺灏股份（002565）题材含太空算力与商业航天，当日+10.02%；中国卫星（600118）当日+4.55%；超声电子（000823）题材含商业航天与印制电路板，当日+9.98%首板涨停。\n3、影响：偏多，强度中等，属当日情绪影响为主。太空算力属新概念嫁接，资金以题材轮动方式介入，持续性需观察后续订单与项目落地公告。\n（三）\n1、据格隆汇11月9日报道，广合科技公告拟使用自有资金及或自筹资金以集中竞价方式回购A股股份，回购资金总额不低于2亿元且不超过4亿元，回购价格不超过204元每股，回购期限为董事会审议通过之日起3个月内。\n2、涉及个股：广合科技（001389），属印制电路板与算力硬件产业链；同日公司审议通过终止实施2026年A股股票期权相关议案。\n3、影响：偏多，强度中等，属持续性逻辑。回购用于维护公司价值及股东权益，在PCB与算力硬件板块中形成个股层面的资金托底信号，但需注意同期终止期权计划可能带来的治理层面解读分歧。\n（四）\n1、据格隆汇11月9日报道，聚灿光电公告拟向特定对象发行股票，募集资金总额不超过15亿元，扣除发行费用后用于年产300万片高性能红黄光外延片及芯片扩产升级项目及研发中心建设项目。\n2、涉及个股：聚灿光电（300708），属LED芯片与化合物半导体板块；同产业链可关注半导体设备与材料方向。\n3、影响：偏多，强度中等，属持续性逻辑。定增扩产指向红黄光外延片细分赛道，产能释放周期较长，短期对股价的影响更多体现为板块内半导体扩产叙事的情绪提振。\n（五）\n1、据格隆汇11月9日报道，章源钨业发布关于调整硬质合金类产品价格的通知函，称因钨原材料价格持续上涨致使生产成本大幅增长，决定从2026年11月10日起对硬质合金类产品按新价格执行。\n2、涉及个股：章源钨业（002378），属钨与硬质合金板块；同方向可关注稀有金属与刀具材料产业链。\n3、影响：偏多，强度中等，属持续性逻辑。原材料涨价向下游传导成功，体现钨价上行周期中的议价能力，对钨板块整体构成价格逻辑支撑，但需警惕下游需求对提价的接受度。\n（六）\n1、据格隆汇11月9日报道，广合科技之外，A股再掀回购小高潮，捷佳伟创拟最高5亿元回购股份，据Google中文引述观点网统计，A股一周99家公司新增回购增持计划，涉及金额156.5亿元。\n2、涉及个股：捷佳伟创（300724），属光伏设备板块；广合科技（001389）属PCB板块；*ST国中（600187）回购A股股份用于注销并减少注册资本。\n3、影响：偏多，强度中等，属当日情绪影响。回购增持密集披露对市场情绪形成托底，但当日两市成交额跌破1.5万亿，量能不足限制回购利好的扩散效果。\n（七）\n1、据同花顺财经与金融界11月9日收评，A股缩量整理，沪指微涨0.32%，创业板指跌0.27%，煤炭开采加工、燃气、元件板块涨幅居前，光伏概念股震荡调整，两市成交1.48万亿。\n2、涉及个股：煤炭方向当日掀起涨停潮；元件方向超声电子（000823）+9.98%、信维通信（300136）+12.77%；光伏方向东方日升（300118）+5.65%。\n3、影响：偏多煤炭与元件，偏空光伏，强度中等，属当日情绪影响。缩量轮动格局下资金向低估值高股息与算力硬件集中，风格切换特征明显。\n（八）\n1、据东方财富11月9日报道，“东方”系个股集体走强，多股两连板，日出东方、大东方、东方海洋、东方新能、东方嘉盛等名称含“东方”的个股集中异动。\n2、涉及个股：日出东方（603366）+10.01%，2天2板，题材含储能与光伏；大东方（600327）+9.98%，2天2板，题材含百货零售与儿科医疗；东方海洋（002086）+10.08%居东财人气榜第一；东方新能（002310）+9.91%；东方嘉盛（002889）+9.99%。\n3、影响：偏多，强度弱，属当日情绪影响。名称炒作属典型游资行为，缺乏基本面支撑，持续性弱，参与需严控仓位与止损。\n（九）\n1、据同花顺热股榜11月9日数据，宇树科技-W（688836）当日+9. 、涉及个股：无直接对应A股个股，最贴近方向为日元利率与日本资产配置相关的外资流入逻辑，可关注A股高股息与红利资产方向。\n3、影响：中性，强度弱，属持续性逻辑。日元债发行反映伯克希尔对日本资产的持续加码，对A股无直接传导，仅在高股息资产比价层面存在间接参照。\n（十四）\n1、据格隆汇11月9日报道，KKR公布2026年第三季度业绩，季度总营收45.64亿美元同比下降17.4%，归属于普通股股东的净利润11.21亿美元同比增长30.4%，调整后净利润16.45亿美元同比增长29%，管理资产规模达8040亿美元同比增长11%。\n2、涉及个股：无直接对应A股个股，最贴近方向为私募股权与另类资产管理概念，A股可关注券商与多元金融板块。\n3、影响：中性偏多，强度弱，属持续性逻辑。AUM增长与调整后净利润增长显示另类资管韧性，但营收下滑反映退出环境仍偏弱，对A股金融板块传导有限。\n（十五）\n1、据格隆汇11月9日报道，NRG将以40亿美元现金向美国输电系统运营商LS Power出售4.9吉瓦天然气资产。\n2、涉及个股：无直接对应A股个股，最贴近方向为天然气发电与电力运营板块，A股可关注燃气与电力方向，当日燃气板块涨幅居前。\n3、影响：中性，强度弱，属持续性逻辑。美国天然气资产交易反映电力资产重估活跃，对A股燃气板块仅构成情绪层面的比价参照，当日燃气走强更多源于寒潮催化。\n（十六）\n1、据格隆汇11月9日报道，霍尔木兹海峡现缓和信号，一则未经证实的报道称伊朗已作出让步，布伦特原油价格下跌逾3%至每桶95美元附近，延续自2020年4月以来最大单周跌势。\n2、涉及个股：无直接对应A股个股，最贴近方向为航空与交运等油价敏感板块，以及石油开采板块的偏空方向；当日煤炭与燃气走强与油价下行形成分化。\n3、影响：偏空石油开采，偏多航空交运，强度中等，属当日情绪影响。油价历史性周跌降低输入性通胀压力，但地缘缓和消息未经证实，反复风险高。\n（十七）\n1、据财联社11月9日报道，新一批10只ETF调入港股通标的，11月9日起生效；同时科创50ETF上周份额大增，多路资金联手抢筹超声电子。\n2、涉及个股：超声电子（000823）+9.98%首板涨停，题材含印制电路板、覆铜板与商业航天；科创50ETF份额大增指向科创板宽基资金流入。\n3、影响：偏多，强度中等，属当日情绪影响。ETF纳入港股通与科创50份额增长显示被动资金持续布局，超声电子获多路资金抢筹是资金与题材共振的典型样本。\n（十八）\n1、据财联社11月9日报道，国务院关税税则委员会公告，11月10日13时01分起在2个月内继续暂停实施24%的对美加征关税税率，保留10%的对美加征关税税率；据Reuters报道中国延长对美贸易休战两个月。\n2、涉及个股：无直接对应单一龙头个股，最贴近方向为出口链与跨境电商，可关注东方嘉盛（002889）+9.99%，题材含光刻机保税维修与智慧仓；以及家电与消费电子出口方向。\n3、影响：偏多，强度中等，属持续性逻辑。关税暂停延长稳定出口企业盈利预期，对跨境电商与保税物流构成中期支撑，但保留10%税率意味着缓和幅度有限。\n（十九）\n1、据财联社11月9日报道，金价波动加大，多家银行上线积存金挂单功能；据WSJ报道黄金升破每盎司4100美元，市场聚焦美国通胀数据。\n2、涉及个股：无直接对应A股金矿龙头在素材中列明，最贴近方向为黄金采选与贵金属板块；白银ETF两倍做多当日+4.55%显示贵金属杠杆资金活跃。\n3、影响：偏多贵金属，强度中等，属持续性逻辑。金价高位叠加银行积存金功能完善提升居民配置便利度，但波动加大意味着追高风险上升。\n（二十）\n1、据东方财富11月9日报道，商务部就调整不可靠实体清单措施、调整出口管制管控名单措施答记者问，并继续暂停对韩华海洋株式会社5家美国相关子公司实施反制措施2个月。\n2、涉及个股：无直接对应A股个股，最贴近方向为船舶制造与航运板块，以及受出口管制影响的稀土与稀有金属方向。\n3、影响：偏多，强度弱，属持续性逻辑。反制措施暂停释放缓和信号，对船舶与航运情绪偏暖，但措施仅为2个月暂停，属可逆安排，不宜线性外推。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119784121014919172","l":[],"ln":[],"t":["通胀","美股","A股港股","原油能源","AI科技","财报","关税贸易","黄金"],"lk":0,"rt":0,"rp":0,"vw":628},{"id":"2119781654633885860","h":"SCMPNews","ts":1794230304,"zh":"土耳其钢铁厂爆炸造成 6 人死亡","en":"Turkey steel factory blast kills 6","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119781654633885860","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/world/europe/article/3373832/turkey-steel-factory-blast-kills-6?utm_medium=Social&utm_source=Twitter#Echobox=1794230302-1","d":"scmp.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":1305},{"id":"2119779355853574280","h":"dmjk001","ts":1794229756,"zh":"路透：美国国会借许可法案首次在“蓝色浪潮”后对数据中心出手\n一项涵盖广泛的跨党派能源法案意外成为美国国会在如何应对公众对数据中心及不断上涨的电费所表达的不满方面的首次考验，而这种不满曾帮助民主党在上周取得压倒性选举胜利。\n这项酝酿多年的立法将于周一提交参议院辩论，它将加快新电厂和输电线路的审批，同时要求大型数据中心运营商承担更多为其服务所需的电网升级成本。\n支持者表示，该法案可能是国会在近期内应对 AI 基础设施建设成本的最佳机会。但一些民主党人——他们曾在竞选中承诺限制数据中心，且其政党明年将掌控国会两院——对其中一些条款持怀疑态度，认为这些条款可能鼓励更多建设。\n据投资公司 TD Cowen 称，这项名为《两党美国可负担性与就业法案》的立法通过几率已从选举前的 40%降至 25%。\n但这场争论可能有助于界定围绕数据中心的辩论，因为预计民主党明年掌控国会后将推出一系列针对 AI 和数据中心发展的法案。对 AI 监管力度加大的担忧导致上周科技股遭遇大幅抛售。","en":"路透：美国国会借许可法案首次在“蓝色浪潮”后对数据中心出手\n一项涵盖广泛的跨党派能源法案意外成为美国国会在如何应对公众对数据中心及不断上涨的电费所表达的不满方面的首次考验，而这种不满曾帮助民主党在上周取得压倒性选举胜利。\n这项酝酿多年的立法将于周一提交参议院辩论，它将加快新电厂和输电线路的审批，同时要求大型数据中心运营商承担更多为其服务所需的电网升级成本。\n支持者表示，该法案可能是国会在近期内应对 AI 基础设施建设成本的最佳机会。但一些民主党人——他们曾在竞选中承诺限制数据中心，且其政党明年将掌控国会两院——对其中一些条款持怀疑态度，认为这些条款可能鼓励更多建设。\n据投资公司 TD Cowen 称，这项名为《两党美国可负担性与就业法案》的立法通过几率已从选举前的 40%降至 25%。\n但这场争论可能有助于界定围绕数据中心的辩论，因为预计民主党明年掌控国会后将推出一系列针对 AI 和数据中心发展的法案。对 AI 监管力度加大的担忧导致上周科技股遭遇大幅抛售。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWr31aXXcAAjVKt.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2119779355853574280","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":118},{"id":"2119779177343660339","h":"SCMPNews","ts":1794229714,"zh":"佛得角世界杯英雄沃齐尼亚努力应对智利的名声","en":"Cabo Verde World Cup hero Vozinha struggles to cope with glare of fame in Chile","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119779177343660339","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/sport/football/article/3373816/cabo-verde-world-cup-hero-vozinha-struggles-cope-glare-new-found-fame-chile?utm_medium= ":"2119727156435603546","h":"dmjk001","ts":1794217311,"zh":"彭博：中国“国家队”加大 ETF 购买力度，创下历史新高\n根据彭博汇编的数据，在截至 11 月 6 日的一周内，流入 9 只据知由所谓“国家队”积极交易的交易所交易基金的资金超过 1560 亿元人民币（230 亿美元）。这超过了 2025 年 4 月贸易战暴跌期间创下的近 1400 亿元的此前单周最高纪录，也超过了 10 月下旬的 1280 亿元，当时螺旋式下跌引发了更紧迫的一轮国家买入。","en":"彭博：中国“国家队”加大 ETF 购买力度，创下历史新高\n根据彭博汇编的数据，在截至 11 月 6 日的一周内，流入 9 只据知由所谓“国家队”积极交易的交易所交易基金的资金超过 1560 亿元人民币（230 亿美元）。这超过了 2025 年 4 月贸易战暴跌期间创下的近 1400 亿元的此前单周最高纪录，也超过了 10 月下旬的 1280 亿元，当时螺旋式下跌引发了更紧迫的一轮国家买入。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWrIgMdWgAA4p2E.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2119727156435603546","l":[],"ln":[],"t":["汇率","关税贸易"],"lk":6,"rt":0,"rp":0,"vw":1564},{"id":"2119724230992396506","h":"ReutersChina","ts":1794216613,"zh":"中国周一宣布将原定于本月到期的出口管制豁免延长两个月，保留了习近平主席和特朗普总统峰会后达成的广泛协议的一部分。","en":"China on Monday announced a two-month extension of export-control waivers due to expire this month, preserving part of a wide-ranging deal struck after a summit between Presidents Xi Jinping and Donald Trump.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2119724230992396506","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/china-extends-suspension-new-rare-earth-controls-until-january-2026-11-09/?taid=6af192a5c6e521000165b87c&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["关税贸易"],"lk":0,"rt":0,"rp":0,"vw":376},{"id":"2119721539813740804","h":"SCMPNews","ts":1794215972,"zh":"香港电梯承包商因防火门框缺失欺诈而接受调查","en":"Hong Kong lift contractor under probe for fraud over missing fire door frames","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119721539813740804","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/hong-kong/law-and-crime/article/3373802/hong-kong-lift-contractor-under-probe-fraud-over-missing-fire-safety-frames?utm_medium=Social&utm_source=Twitter#Echobox=1794215971","d":"scmp.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":1243},{"id":"2119721524471214479","h":"CrushTheShorts","ts":1794215968,"zh":"●GB300 生产与交付\n一家全球 AI 服务器 OEM 在 2026 年第三季度实现约 700 机架的 GB300 NVL72 产能，按计划交付约 600 机架，其中 90% 供应给云服务提供商。\n●Vera Rubin 推迟至 2027 年 Q1\n下一代 Vera Rubin 产量原定 2026 年 12 月少于 100 机架，因电网瓶颈和 HBM4 良率低，推迟至 2027 年第一季度；2027 年目标为 5,000–6,000 机架，平均售价约 800 万美元。\n●电力：广泛延误\n数据中心电网连接积压，导致所有客户层级的部署延误 1–3 个月，具体取决于公用事业队列。\n●Neocloud 管道高风险\n计算租赁客户的第三季度谅解备忘录环比增长不到 50%，仅有 30–40% 转化为具有约束力的采购订单，原因是融资紧张和单位经济性疲软。\n●价格战风险与超大规模商稳定性\n商品计算租赁引发价格战，并导致 Neocloud 在 2027 年上半年对后续采购订单犹豫不决；而自筹资金的超大规模商则保持高转化率。\n●2027 年 OEM 配额调整\nDell 的 GB300 / Vera Rubin 分配将持平至适度增长；Lenovo 的 NVL 配额将从 7% 上升至 10%，继系统审计和 NVIDIA 认证之后。\n●消费硬件严重下滑\n2026 年 PC 出货量预计为 6,300 万台（50% 为 AI PC）；2026 年第三季度 PC 出货量同比下降 22–23%，手机出货量同比下降 40–50%，原因是内存成本膨胀。\n●内存成本激增与 ASP 策略\nDRAM 现货价格较 2025 年第二季度翻了四倍，推动内存 BOM 占比从 18–20% 上升至 35–38%；供应商依赖更高的平均售价和高端产品组合来抵消入门级需求疲软。\n●三星晶圆转移与 2027 年复苏\n预计三星将在 2026 年第四季度将产能从 HBM 转移回 DRAM，因为 DRAM 利润率与 HBM 相当，这将有助于在 2027 年第一季度稳定内存价格，并引发 2027 年第三季度的 PC 出货量复苏。\n●OEM 激进的库存去风险\n一线 PC OEM 将 DRAM 覆盖从 6 个月削减至 3–4 个月，CPU 覆盖至 2 个月，将成品库存保持在 30–40 天，以避免高成本库存敞口。","en":"●GB300 生产与交付\n一家全球 AI 服务器 OEM 在 2026 年第三季度实现约 700 机架的 GB300 NVL72 产能，按计划交付约 600 机架，其中 90% 供应给云服务提供商。\n●Vera Rubin 推迟至 2027 年 Q1\n下一代 Vera Rubin 产量原定 2026 年 12 月少于 100 机架，因电网瓶颈和 HBM4 良率低，推迟至 2027 年第一季度；2027 年目标为 5,000–6,000 机架，平均售价约 800 万美元。\n●电力：广泛延误\n数据中心电网连接积压，导致所有客户层级的部署延误 1–3 个月，具体取决于公用事业队列。\n●Neocloud 管道高风险\n计算租赁客户的第三季度谅解备忘录环比增长不到 50%，仅有 30–40% 转化为具有约束力的采购订单，原因是融资紧张和单位经济性疲软。\n●价格战风险与超大规模商稳定性\n商品计算租赁引发价格战，并导致 Neocloud 在 2027 年上半年对后续采购订单犹豫不决；而自筹资金的超大规模商则保持高转化率。\n●2027 年 OEM 配额调整\nDell 的 GB300 / Vera Rubin 分配将持平至适度增长；Lenovo 的 NVL 配额将从 7% 上升至 10%，继系统审计和 NVIDIA 认证之后。\n●消费硬件严重下滑\n2026 年 PC 出货量预计为 6,300 万台（50% 为 AI PC）；2026 年第三季度 PC 出货量同比下降 22–23%，手机出货量同比下降 40–50%，原因是内存成本膨胀。\n●内存成本激增与 ASP 策略\nDRAM 现货价格较 2025 年第二季度翻了四倍，推动内存 BOM 占比从 18–20% 上升至 35–38%；供应商依赖更高的平均售价和高端产品组合来抵消入门级需求疲软。\n●三星晶圆转移与 2027 年复苏\n预计三星将在 2026 年第四季度将产能从 HBM 转移回 DRAM，因为 DRAM 利润率与 HBM 相当，这将有助于在 2027 年第一季度稳定内存价格，并引发 2027 年第三季度的 PC 出货量复苏。\n●OEM 激进的库存去风险\n一线 PC OEM 将 DRAM 覆盖从
