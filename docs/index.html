<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经资讯工作台 · X 信源</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d4a24c'/><text x='16' y='23' font-size='19' font-family='system-ui' text-anchor='middle' fill='%230a0d13'>财</text></svg>">
<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

分享。","en":"看最新公布的10月份美联储会议纪要，就知道对冲基金这种墙头草过去6周月创纪录的卖出，背后恐慌在哪里？\n但是基金经理错误在于，没有理解美联储这种“就怕流氓有文化”\n美联储理事好比足球裁判给艺术体操打分。一帮搞货币的懂科技创新这种非线性的预测？\n全篇纪要中，美联储理事大谈AI投资过度的什么表外融资，循环融资风险，AI投资回报不及预期将导致系统风险\n这种无知者无畏的精神，历史上美联储多次犯错。最著名就是格林斯潘96年警告“非理性繁荣”，内部美联储预测股市大跌20%会刺穿泡沫，结果呢，2000年拐点提前整整4年。\n其他比如08年次贷危机前，还说次贷风险“相对有限”，21年通胀失控前，还说疫情放水没关系。\n我一直强调很多遍，就是美联储本身就是制造市场波动的最大风险。太多滥竽充数的理事，或许懂货币懂信用市场，但是对于这种非连续性的指数型的变化，人类从来没有预测能力。\n表外融资，不是等于黑市造假；循环融资不是等于庞氏骗局。根本性在于要理解，科技革命带来的生产率的提升，短期和中期的矛盾。美联储如果没有任何证据，直接判断当前AI融资是脆弱的，这就是误导整个市场，加剧市场波动。\n而且更重要在于，大幅提升风险溢价和信用的瓶颈，反而让科技本身能够提升供给，压缩通胀的能力下降，恶化长期通胀前景。\n特别是一些胡说八道的理事，去年那个沃勒还说要降息，今年就说12月要加0.5%。这意味着什么对于投资策略？\n市场有大量的认知差超额收益的空间。空头的最大炸弹就在于是不是美联储连续加息犯错刺穿泡沫。当然概率不大，政策风险叙事压缩短期估值，正是出现长期买点的重大机会。特别是对冲基金这种墙头草过去6周月创纪录的卖出恐慌下。\n具体颗粒度更细见投资策略周报订阅者分享。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcudxAaQAAgo95.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2123217424313114797","l":[],"ln":[],"t":["美联储","通胀"],"lk":12,"rt":1,"rp":0,"vw":1530},{"id":"2123216211429437800","h":"fxtrader","ts":1795049166,"zh":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","en":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcpTTQbIAAca6R.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123216211429437800","l":[],"ln":[],"t":["美股"],"lk":6,"rt":1,"rp":3,"vw":3629},{"id":"2123215835527532873","h":"darrencao2024","ts":1795049077,"zh":"我只看前瞻pe 不是ttm","en":"我只看前瞻pe 不是ttm","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123215835527532873","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":797},{"id":"2123215824458838166","h":"qinbafrank","ts":1795049074,"zh":"感觉AI时代最硬的需求应该还是安全了，每发生一次重大安全事故，企业对安全的需求就又多了一分。这个板块调整的时候跌的少、反弹也是最快最猛的。","en":"感觉AI时代最硬的需求应该还是安全了，每发生一次重大安全事故，企业对安全的需求就又多了一分。这个板块调整的时候跌的少、反弹也是最快最猛的。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXctiTubsAADO8v.jpg?name=orig","https://pbs.twimg.com/media/HXctiTsbMAA-fMM.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123215824458838166","l":[],"ln":[],"t":[],"lk":12,"rt":1,"rp":5,"vw":3859},{"id":"2123212487546020124","h":"dmjk001","ts":1795048279,"zh":"OpenAI首款AI硬件或于年底启动出货，立讯精密等中国供应商参与\n11月19日，据供应链消息，OpenAI首款AI端侧硬件产品或将于今年年底启动出货，多家中国厂商参与该项目。其中，立讯精密独家承担整机制造，并供应核心零部件。关于这款产品形态OpenAI尚未正式公布。不过，此前有消息称，OpenAI与苹果前首席设计官Jony Ive团队合作开发的首款消费级硬件，将是一款类似“甜甜圈”形状的无屏AI设备，集成麦克风、扬声器、摄像头及多种传感器，主要通过语音与用户交互，并具备感知周围环境的能力，但具体产品信息仍有待进一步确认。（每经）","en":"OpenAI首款AI硬件或于年底启动出货，立讯精密等中国供应商参与\n11月19日，据供应链消息，OpenAI首款AI端侧硬件产品或将于今年年底启动出货，多家中国厂商参与该项目。其中，立讯精密独家承担整机制造，并供应核心零部件。关于这款产品形态OpenAI尚未正式公布。不过，此前有消息称，OpenAI与苹果前首席设计官Jony Ive团队合作开发的首款消费级硬件，将是一款类似“甜甜圈”形状的无屏AI设备，集成麦克风、扬声器、摄像头及多种传感器，主要通过语音与用户交互，并具备感知周围环境的能力，但具体产品信息仍有待进一步确认。（每经）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123212487546020124","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":494},{"id":"2123212168661483899","h":"dmjk001","ts":1795048203,"zh":"【关于昇腾扩产预期与GPU代工风险汇报】\n一、华为昇腾：2027年国产算力供给有望大幅提升\n据产业链测算，昇腾950DT采用双芯片设计，960DT采用四芯片设计，单颗芯片面积约400—430mm²。按照12英寸晶圆、60%—70%良率估算，单片晶圆可产出约80—90颗有效芯片。若2027年中芯国际N+2工艺分配给昇腾的产能达到2万片/月，全年理论产出约1920万—2160万颗芯片，对应950DT约960万—1080万颗，或960DT约480万—540万颗。960DT虽然数量减半，但凭借HBM、互联及封装升级，系统性能有望实现3—4倍提升。 #市场另有先进制程产能提升至10万片/月的传闻、实际供给还需考虑良率、封装及其他芯片产能竞争（华丰科技、航天电器）\n二、国产GPU厂商：海外代工依赖成为核心变量\n近期产业链传闻，#三星可能加强晶圆代工及终端客户穿透审查，若属实，部分国产GPU企业2027年收入兑现面临风险。\n1、寒武纪： 690/580以国内代工为主，部分产品涉及台积电、三星。\n2、海光信息： CPU以国内代工为主，DCU据传依赖三星。\n3、摩尔线程： 新一代产品逐步转向中芯国际，仍需关注良率和交付。\n4、沐曦股份： 据传对三星依赖较高，国内工艺产品商业化尚待验证。\n5、天数智芯、燧原科技等： 海外先进制程依赖风险值得关注。\n6、壁仞科技、平头哥、昆仑芯： 代工来源存在差异，需分别评估技术成熟度及产能兑现。\n三、我们判断：国产晶圆制造战略价值进一步提升\n若海外代工限制升级，国产AI芯片产业链将加速向中芯国际、华虹等本土晶圆厂集中。华为昇腾凭借国内制造体系及超节点架构，有望强化国产算力竞争优势。\n结论：#重点跟踪华为昇腾国产链、中芯国际、华虹半导体，以及国产GPU厂商的实际代工来源和交付能力。以上代工信息及扩产数字，仅供内部研判，不宜作为确定性事实。","en":"【关于昇腾扩产预期与GPU代工风险汇报】\n一、华为昇腾：2027年国产算力供给有望大幅提升\n据产业链测算，昇腾950DT采用双芯片设计，960DT采用四芯片设计，单颗芯片面积约400—430mm²。按照12英寸晶圆、60%—70%良率估算，单片晶圆可产出约80—90颗有效芯片。若2027年中芯国际N+2工艺分配给昇腾的产能达到2万片/月，全年理论产出约1920万—2160万颗芯片，对应950DT约960万—1080万颗，或960DT约480万—540万颗。960DT虽然数量减半，但凭借HBM、互联及封装升级，系统性能有望实现3—4倍提升。 #市场另有先进制程产能提升至10万片/月的传闻、实际供给还需考虑良率、封装及其他芯片产能竞争（华丰科技、航天电器）\n二、国产GPU厂商：海外代工依赖成为核心变量\n近期产业链传闻，#三星可能加强晶圆代工及终端客户穿透审查，若属实，部分国产GPU企业2027年收入兑现面临风险。\n1、寒武纪： 690/580以国内代工为主，部分产品涉及台积电、三星。\n2、海光信息： CPU以国内代工为主，DCU据传依赖三星。\n3、摩尔线程： 新一代产品逐步转向中芯国际，仍需关注良率和交付。\n4、沐曦股份： 据传对三星依赖较高，国内工艺产品商业化尚待验证。\n5、天数智芯、燧原科技等： 海外先进制程依赖风险值得关注。\n6、壁仞科技、平头哥、昆仑芯： 代工来源存在差异，需分别评估技术成熟度及产能兑现。\n三、我们判断：国产晶圆制造战略价值进一步提升\n若海外代工限制升级，国产AI芯片产业链将加速向中芯国际、华虹等本土晶圆厂集中。华为昇腾凭借国内制造体系及超节点架构，有望强化国产算力竞争优势。\n结论：#重点跟踪华为昇腾国产链、中芯国际、华虹半导体，以及国产GPU厂商的实际代工来源和交付能力。以上代工信息及扩产数字，仅供内部研判，不宜作为确定性事实。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123212168661483899","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":621},{"id":"2123212074537152647","h":"fxtrader","ts":1795048180,"zh":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n另外，Anthropic设置了F类股，拥有公司普通股东投票事项中合计50.1%的投票权。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","en":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n另外，Anthropic设置了F类股，拥有公司普通股东投票事项中合计50.1%的投票权。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcpTTQbIAAca6R.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123212074537152647","l":[],"ln":[],"t":["美股"],"lk":0,"rt":0,"rp":1,"vw":1789},{"id":"2123210083861672428","h":"darrencao2024","ts":1795047705,"zh":"你的名字这家公司 今天我买了点😂","en":"你的名字这家公司 今天我买了点😂","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123210083861672428","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":666},{"id":"2123209353364971819","h":"TheMarketMemo","ts":1795047531,"zh":"我們普通投資者和馬斯克所掌握的資訊完全不在一個層面，所以圖形對我們來說就是非常重要的線索。我們無法做到先知先覺，但至少要做到後知先覺，圖形就會告訴我們具體怎麼做。\n用白話來講，馬斯克正在做什麼，以及他打算做什麼，我們不可能知道，但是一定有人知道。如果他們採取動作（買入或者賣出）就會反映在圖形上，如果你懂得看圖，就可以根據圖形來做攻防策略。\n毫不誇口地說，美股市場的重大趨勢轉折，我從來沒有誤判過。","en":"我們普通投資者和馬斯克所 （JD Vance）、白宫办公厅主任斯蒂芬·米勒（Stephen Miller）、司法部长托德·布兰奇（Todd Blanche）以及总统的女婿贾里德·库什纳（Jared Kushner）。\n白宫多次反驳民主党提出的调查意图，官员们表示，对于他们认为正当的监督调查，愿意配合，但不会配合那些被认定出于政治动机的调查。\n白宫发言人劳伦·比斯（Lauren Bis）说，总统\"愿意与任何人合作，继续为勤劳的美国人民带来胜利\"。\"如果民主党人选择推进虚假的调查和激进左翼的政策，那他们就是选择与美国人民作对\"","en":"民主党议员正式启动对共和党高管的调查：\n众议院监督委员会的首席民主党人正在为长期承诺的、针对特朗普政府的调查打下基础，这些调查将在 1 月新一届国会开始时启动。\n加州众议员罗伯特·加西亚（Robert Garcia）预计将在民主党掌控众议院后出任该委员会主席。他发出多封信函，要求特朗普总统的家人和政府高级官员保存文件。这是对这位共和党总统及其政府展开调查的早期步骤。\n周三公布的这些信函涵盖了一系列可能的调查事项，包括涉及特朗普家人的所谓财务利益冲突、国土安全部的不当行为，以及政府对杰弗里·爱泼斯坦（Jeffrey Epstein）相关档案的处理。\n加西亚在声明中说：\"监督委员会民主党人正在努力终结本届政府的自肥、不当行为和滥用权力。\"他还说：\"这些调查将为惠及全体美国人的立法奠定基础。这只是开始。\"\n信函的对象包括特朗普的两个儿子、副总统 JD 万斯（JD Vance）、白宫办公厅主任斯蒂芬·米勒（Stephen Miller）、司法部长托德·布兰奇（Todd Blanche）以及总统的女婿贾里德·库什纳（Jared Kushner）。\n白宫多次反驳民主党提出的调查意图，官员们表示，对于他们认为正当的监督调查，愿意配合，但不会配合那些被认定出于政治动机的调查。\n白宫发言人劳伦·比斯（Lauren Bis）说，总统\"愿意与任何人合作，继续为勤劳的美国人民带来胜利\"。\"如果民主党人选择推进虚假的调查和激进左翼的政策，那他们就是选择与美国人民作对\"","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123192663369564659","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1193},{"id":"2123191520492986754","h":"bboczeng","ts":1795043280,"zh":"美国医保新规提案引发保险公司股价大幅下跌\n美国医疗保险和医疗补助服务中心（CMS）于11月16日公布了一项名为 CRUSH 的新规提案，计划通过加强对 Medicare Advantage（联邦医疗保险优势计划）的审计和监管，每年追回约90亿美元资金，未来十年累计追回近900亿美元。\n作为 Medicare Advantage 市场的最大参与者，联合健康集团（UnitedHealth）的股价暴跌至350美元附近；Humana 股价下跌13%，Elevance Health 等其他大型医疗保险公司也纷纷跟跌。\n该提案的公众意见征集期将持续至 2027年1月19日。由于可能面临法律挑战，最终规则仍存在调整的可能性。\n不过，投资者已经开始提前计入潜在的监管和财务风险，尤其是那些高度依赖 Medicare Advantage 业务的保险公司。\n市场担忧的核心在于：更严格的审计可能迫使保险公司退还更多医保资金，从而压缩其利润及未来盈利预期。","en":"美国医保新规提案引发保险公司股价大幅下跌\n美国医疗保险和医疗补助服务中心（CMS）于11月16日公布了一项名为 CRUSH 的新规提案，计划通过加强对 Medicare Advantage（联邦医疗保险优势计划）的审计和监管，每年追回约90亿美元资金，未来十年累计追回近900亿美元。\n作为 Medicare Advantage 市场的最大参与者，联合健康集团（UnitedHealth）的股价暴跌至350美元附近；Humana 股价下跌13%，Elevance Health 等其他大型医疗保险公司也纷纷跟跌。\n该提案的公众意见征集期将持续至 2027年1月19日。由于可能面临法律挑战，最终规则仍存在调整的可能性。\n不过，投资者已经开始提前计入潜在的监管和财务风险，尤其是那些高度依赖 Medicare Advantage 业务的保险公司。\n市场担忧的核心在于：更严格的审计可能迫使保险公司退还更多医保资金，从而压缩其利润及未来盈利预期。","zh_src":"nat 在【今日行情】里，所以只写了财报和董事会事件，没有写涨跌，也没有写\"超预期\"。\n- **UNH**：今天大跌的原因数据里没有，正文只写了它对道指的拖累，没有编造原因。","en":"【美股复盘 · 11月18日】\n**大市**\n三大指数涨跌不一。标普(SPY) 收于 730.20，跌 0.31%。纳指(QQQ) 收于 659.51，涨 0.39%。道指(DIA) 收于 501.64，跌 1.12%，跌幅在主要指数中最大。罗素小型股(IWM) 收于 270.11，涨 0.39%。市宽偏弱，107 只观察股中 36 只上涨、71 只下跌，下跌家数约为上涨家数的两倍。指数层面科技权重股提供支撑，但多数个股承压。\n**板块**\n网络安全板块表现最强。 $PANW 涨 9.90%，领涨观察池。CRWD 涨 7.95%，NET 涨 5.66%。半导体与网络设备走强，AMD 涨 5.31%，ANET 涨 4.03%，AVGO 涨 3.65%。软件股同步上涨，MDB 涨 2.71%，SNOW 涨 2.45%。AMZN 涨 3.82%，TGT 涨 4.01%。\n能源板块领跌。OXY 跌 4.88%，CVX 跌 4.74%。量子计算概念股走弱，IONQ 跌 5.48%，QBTS 跌 4.83%。AAOI 跌 9.80%，ASTS 跌 7.61%，CRWV 跌 4.13%，QCOM 跌 4.12%。MRNA 跌 4.84%。\n**焦点**\nUNH 大跌 10.21%，为观察池中跌幅最大的个股。UNH 是道指成分股，是道指今日跌幅明显大于其他指数的主要拖累之一。\nNVDA 于前一交易日盘后公布第三财季业绩，今日盘中交易反映的就是这份财报。与财报同时受关注的是公司治理：董事会主席表示已接受黄仁勋辞职，且无意让其回归；黄仁勋此前对《华尔街日报》表示，若董事会邀请，他愿意回任。\nAVGO 上涨，定制芯片是市场持续讨论的方向。谷歌、Meta 等大厂推进自研芯片，以降低对英伟达的依赖，这部分订单的主要承接方正是博通。\nPANW 将于今日盘后公布财报，结果影响的是下一个交易日的走势。\n**小结**\n今日市场结构分化。科技成长方向偏强，网络安全、半导体和软件领涨。能源、医疗保险和量子计算概念承压。纳指与小型股小幅上涨，道指受个股拖累明显下跌，市宽显示多数个股走弱。后续关注 NVDA 管理层事件的进展，以及 PANW 盘后财报。\n---\n几点处理说明：\n- **PANW**：今日涨 9.90% 没有归因于财报，财报只作为盘后事项提及，符合铁律第 5 条。\n- **NVDA**：今日涨跌幅不在【今日行情】里，所以只写了财报和董事会事件，没有写涨跌，也没有写\"超预期\"。\n- **UNH**：今天大跌的原因数据里没有，正文只写了它对道指的拖累，没有编造原因。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123182094021169511","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":503},{"id":"2123174895177896180","h":"wufantouzi","ts":1795039316,"zh":"都有逆风期","en":"都有逆风期","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/wufantouzi/status/2123174895177896180","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":359},{"id":"2123174308029821168","h":"bboczeng","ts":1795039176,"zh":"西雅图好冷，冬天好冷\n我想离开这个地方\n和我的爱人\n我的小獭獭\n永远在一起\n5555","en":"西雅图好冷，冬天好冷\n我想离开这个地方\n和我的爱人\n我的小獭獭\n永远在一起\n5555","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcHyA8aIAAd1qd.png?name=orig"],"u":"https://x.com/bboczeng/status/2123174308029821168","l":[],"ln":[],"t":[],"lk":2,"rt":1,"rp":2,"vw":185},{"id":"212317338769463 胀，股票、债券和房地产的跌幅可能比黄金更大，甚至可能引发比 2008 年更严重的衰退；不过也有交易员质疑，加息是否会过度收紧，反而导致通胀过度回落。","en":"金银在美联储鹰派通胀信号下暴跌\n此次暴跌在一天之内抹去了黄金和白银合计逾 1.17 万亿美元的市值，两者均跌至 14 个月低点，同时美元飙升至 2025 年 4 月以来的最高水平。\n沃勒（Waller）在接受 CNBC 采访时表示，为应对年化约 3.5% 的通胀，美联储 12 月可能需要加息 50 个基点，或发出更强的政策信号，并呼吁以\"冲击\"来重置市场预期。\n经济学家彼得·席夫（Peter Schiff）警告称，如果真正开始抗击通胀，股票、债券和房地产的跌幅可能比黄金更大，甚至可能引发比 2008 年更严重的衰退；不过也有交易员质疑，加息是否会过度收紧，反而导致通胀过度回落。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123167719155798265","l":[],"ln":[],"t":["美联储","通胀","黄金"],"lk":0,"rt":0,"rp":0,"vw":188},{"id":"2123164308712661020","h":"bboczeng","ts":1795036792,"zh":"你的观察很准确，现在是白宫护盘，所以资金只能去价值股拉SPY\nSPY的回调一般都比QQQ晚1-3个月\n我们最迟明年2月就知道，这次大崩盘最深能跌到哪里去了\n某些人，某些KOL，以价值股PE过高为借口，证明半导体一定会反弹\n这是很可笑的，就算因为Pair Trade collapse，半导体反弹也是给你跑路的机会\n是绝对回不到前高，也可能长期建仓的\n这群人就这么想回本吗？\n历史上，买错了想回本的人比比皆是，\n但他们基本都逃不过腰斩再腰斩，最后需要翻10倍才能回本的命运\n虽然很遗憾，但这就是事实","en":"你的观察很准确，现在是白宫护盘，所以资金只能去价值股拉SPY\nSPY的回调一般都比QQQ晚1-3个月\n我们最迟明年2月就知道，这次大崩盘最深能跌到哪里去了\n某些人，某些KOL，以价值股PE过高为借口，证明半导体一定会反弹\n这是很可笑的，就算因为Pair Trade collapse，半导体反弹也是给你跑路的机会\n是绝对回不到前高，也可能长期建仓的\n这群人就这么想回本吗？\n历史上，买错了想回本的人比比皆是，\n但他们基本都逃不过腰斩再腰斩，最后需要翻10倍才能回本的命运\n虽然很遗憾，但这就是事实","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123164308712661020","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":1,"rp":0,"vw":401},{"id":"2123163269452226629","h":"Balder13946731","ts":1795036544,"zh":"今天没法给早上的判断打分：今早只公布了锚点 27,196，区间因为当时宽度超过上限没有给，所以也无从验证。\n收盘 27,116.26，相对锚点 -0.29%，全天 +0.42%。收盘仍在我们跟踪的所有价位下方，这个状态在前几天就已经形成，不是今天才跌破的。现在距近期高点 -13.16%。\n2005 年以来，距近期高点跌了 11.7% 到 14.7% 的交易日有 200 个。这些日子之后 20 个交易日内，摸到近期高点 31,224 的只有 1%（所有交易日平均 55%）；跌破 25,760 的有 44%（平均 27%）；跌破 24,405 的有 22%（平均 8%）。\n下一交易日区间 26,899–27,334。","en":"今天没法给早上的判断打分：今早只公布了锚点 27,196，区间因为当时宽度超过上限没有给，所以也无从验证。\n收盘 27,116.26，相对锚点 -0.29%，全天 +0.42%。收盘仍在我们跟踪的所有价位下方，这个状态在前几天就已经形成，不是今天才跌破的。现在距近期高点 -13.16%。\n2005 年以来，距近期高点跌了 11.7% 到 14.7% 的交易日有 200 个。这些日子之后 20 个交易日内，摸到近期高点 31,224 的只有 1%（所有交易日平均 55%）；跌破 25,760 的有 44%（平均 27%）；跌破 24,405 的有 22%（平均 8%）。\n下一交易日区间 26,899–27,334。","zh_src":"  if the board wants to draw a line between risk taking and compliance, the conflict will inevitably escalate beyond its control","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ShanghaoJin/status/2123153356835508346","l":[],"ln":[],"t":[],"lk":16,"rt":1,"rp":2,"vw":2181},{"id":"2123152329524531459","h":"bboczeng","ts":1795033936,"zh":"我很好奇，买不买为什么要等你来说\n这群人的大脑是被摘除了吗？\n如果这种人占中国人口的99%\n中国这个国家还有救吗？\n谢谢","en":"我很好奇，买不买为什么要等你来说\n这群人的大脑是被摘除了吗？\n如果这种人占中国人口的99%\n中国这个国家还有救吗？\n谢谢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123152329524531459","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":203},{"id":"2123150204098736536","h":"bboczeng","ts":1795033429,"zh":"英伟达是真的要死绝了\n可能要在120-150反复震荡很久时间，一直持续到2027\n谢谢大家","en":"英伟达是真的要死绝了\n可能要在120-150反复震荡很久时间，一直持续到2027\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123150204098736536","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":488},{"id":"2123144356941205756","h":"ShanghaoJin","ts":1795032035,"zh":"蒂姆·库克（Tim Cook）继承了史蒂夫·乔布斯（Steve Jobs）的遗产，但内华达州董事会必须解散詹森（Jensen）才能继续掌权。\n通过将领导层过渡转变为权力斗争，他们不可避免地改变了 NV 的文化\n乔布斯是苹果公司的传奇人物，而库克的工作就是为了保存这一遗产。\n但内华达州董事会拒绝了詹森的回归，现在必须证明没有他也能取得成功，并以不同的方式做事。您可以期待更多的合规性、更严格的控制、共识驱动的决策和官僚主义。\n短期财务收益可能会成为证明自己合理性的方式，但代价是牺牲让内华达变得非凡的激进冒险精神。\n结果呢？你会看到一个更加官僚化、规避风险、政治正确的 NV。它可能会在几年内保持盈利，但它不会是詹森建造的。\n这就是为什么首席财务官克雷斯或任何董事会指定的继任者可能注定会失败","en":"Tim Cook inherited Steve Jobs’ legacy, but NV board will have to dismantle Jensen’s to stay in power.\nBy turning a leadership transition into a power struggle, they are inevitably changing NV’s culture\nJobs was a legend in AAPL, and Cook’s job was just to preserve this legacy.\nBut NV’s board, having rejected Jensen’s return, must now prove it can succeed without him, and do things differently. You can expect more compliance, tighter controls, consensus driven decisions, and bureaucracy.\nShort term financial earnings will likely become the way to justify itself, at the expense of the aggressive risk taking that made NV extraordinary.\nThe result? You will see a more bureaucratic, risk averse, politically correct NV. It may remain profitable for a few more years, but it won’t be the one Jensen built.\nThat’s why Kress the CFO, or any board-appointed successor, may be doomed to fail","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ShanghaoJin/status/2123144356941205756","l":[],"ln":[],"t":["财报"],"lk":14,"rt":1,"rp":1,"vw":1350},{"id":"2123138337653637591","h":"octopusycc","ts":1795030600,"zh":"我认为瓶颈交易早就结束了\nAI也在事实放缓\n市场关于AI和半导体的定价是这个市场更重要的事情","en":"我认为瓶颈交易早就结束了\nAI也在事实放缓\n市场关于AI和半导体的定价是这个市场更重要的事情","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2123138337653637591","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":1,"vw":251},{"id":"2123132870718062629","h":"bboczeng","ts":1795029296,"zh":"黄仁勋真的有间谍，至少是走私嫌疑的，这不是开玩笑\n他肯定不可能回去做CEO了\n谢谢大家","en":"黄仁勋真的有间谍，至少是走私嫌疑的，这不是开玩笑\n他肯定不可能回去做CEO了\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123132870718062629","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":687},{"id":"2123130704678822314","h":"ShangwenLi1","ts":1795028780,"zh":"我对我们的董事会深感失望","en":"I’m deeply disappointed in our board","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ShangwenLi1/status/2123130704678822314","l":[],"ln":[],"t":[],"lk":2099,"rt":154,"rp":64,"vw":41123},{"id":"2123129748079648791","h":"wufantouzi","ts":1795028552,"zh":"ANT把散户认购额度搞到1000亿美金\n一方面说明市场热度很高\n大家抢着要\n另外一方面也锁死了开盘后的涨幅\n因为想要的人都拿到额度了\n去追涨的人就少了\n其实IPO的时候融资\n还是要让市场饥渴一点的\n这样很多机构散户手里没有票\n必须去二级市场买\n就会形成良好的涨幅\nANT还是对现金太饥渴了\n一看到超额认购\n马上就提高了资金募集的总量\n本来预计能干到2.5-3万亿\n现在看开盘估计只能冲到2万亿左右了","en":"ANT把散户认购额度搞到1000亿美金\n一方面说明市场热度很高\n大家抢着要\n另外一方面也锁死了开盘后的涨幅\n因为想要的人都拿到额度了\n去追涨的人就少了\n其实IPO的时候融资\n还是要让市场饥渴一点的\n这样很多机构散户手里没有票\n必须去二级市场买\n就会形成良好的涨幅\nANT还是对现金太饥渴了\n一看到超额认购\n马上就提高了资金募集的总量\n本来预计能干到2.5-3万亿\n现在看开盘估计只能冲到2万亿左右了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2123129748079648791","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":337},{ 张上涨了50%\nMSTR 12/18 95 P\n从8刀涨到12刀\n$MSTR","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbHpyTagAEbGkL.jpg?name=orig"],"u":"https://x.com/octopusycc/status/2123103941118599357","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":1559},{"id":"2123101979375235386","h":"BillAckman","ts":1795021931,"zh":"我认为 @nvidia 董事会的行事方式既不符合股东的最佳利益，也不符合其信托义务。 我们所知道的是，董事会因违反公司政策和/或回应与间谍有染的指控而解雇了詹森或迫使他辞职。 他们这样做时没有仔细考虑对公司、客户、股东或其他利益相关者的影响。 他们仓促做出判断，没有经过仔细的尽职调查，甚至没有对事实的基本了解。 我们怎么知道这一点？ 我们从詹森被解雇的速度有多快以及他被解雇时的情况知之甚少就知道了这一点。 召开董事会会议需要时间。也许有时间进行一次 Zoom。 这是一个应该由董事会亲自出席并在了解事实后仔细审议后做出的决定。他们应该在做出决定后就睡觉，并在第二天再次开会讨论事实、风险以及他们决定的其他影响。 由于时间安排和信息缺乏，董事会无法进行仔细的审议。 虽然董事会可以因首席执行官与下属的不当关系而解雇首席执行官，但这不应该是一个自动的决定。这就是为什么我们的董事会由人类而非代理人组成。 董事会应考虑这种关系是否是双方自愿的，或者是否滥用权力。董事会必须考虑解雇对所有利益相关者的影响。 如果我是这个董事会成员，我就不会根据媒体文章匆忙做出判断。我会确保董事会了解所有事实，以便能够做出谨慎且明智的决定。特拉华州公司董事会有谨慎义务，这意味着他们必须做出知情、审慎和善意的决定。这显然没有发生在这里。 哪家律师事务所为该委员会提供咨询服务？ 或者董事会是否听取了良好的法律建议？ 看起来不像。 现在，董事会坚称詹森不可能重新担任首席执行官，这让董事会的失败雪上加霜。 为什么在所有事实都清楚之前排除詹森回归的可能性才符合公司的最佳利益？这是他们又一次违反注意义务。 此外，董事会还发起了一项调查，调查范围尚不清楚。调查可能会对公司造成极大的损害，因此应谨慎定位，以解决任何需要了解的事实，而不是范围过于广泛。简而言之，这看起来像是董事因媒体头条新闻而惊慌失措的一系列重大治理失败。他们可能觉得有必要做某事，因为他们害怕在媒体上看起来很糟糕，而不是因为这对他们的公司来说是正确的事情。 他们受不了高温。 对于一家如此规模且对我们国家和整个世界如此重要的公司来说，董事会的行为令人震惊，特别是在历史的这个时刻。","en":"I believe the @nvidia board is not acting in the best interest of shareholders nor in a manner consistent with their fiduciary duties.\nWhat we know is that the board fired Jensen or forced his resignation for violating company policy and/or in response to the accusation of an affair with a spy.\nThey did so without careful consideration of the impact on the company, its customers, its shareholders or other stakeholders.\nThey rushed to judgment without the benefit of careful due diligence or even with a basic understanding of the facts.\nHow do we know this?\nWe know this by how quickly Jensen was fired and how little was known at the time of his firing.\nIt takes time to convene a board meeting. There was time, maybe, for one Zoom.\nAnd this is a decision that should have been made by a board sitting in person and carefully deliberating the facts once they are known.\nAnd they should have slept on the decision and met again the day after to discuss the facts, the risks and the other implications of their decision.\nThe timing and lack of information did not allow for careful board deliberation.\nWhile boards can fire a CEO for an inappropriate relationship with a subordinate, it should not be an automatic decision. That is why we have boards comprised of humans and not agents.\nA board should consider whether or not such a relationship was consensual or whether it was an abuse of power dynamics. And a board has to consider what the impact of the firing is on all stakeholders.\nIf I were in this board, I would not have rushed to judgment based on articles in the media. I would have made sure the board had all of the facts so it could make a careful and informed decision.\nBoards of Delaware companies have a duty of care which means they must make informed, prudent and good faith decisions. This clearly did not happen here.\nWhat law firm is advising this board?\nOr is the board even taken good legal advice?\nIt doesn’t look like it.\nAnd now the board is compounding its failures by insisting that there is no possibility for Jensen’s return as CEO.\nWhy is it in the best interest of the company to foreclose the possibility of Jensen’s return and to do so before all of the facts are known? This is yet another breach of their duty of care.\nFurthermore, the board has launched an investigation whose scope is unknown. Investigations can be extremely damaging to a company and should be carefully targeted to address whatever facts need to be known rather than be overly broad in scope.\nIn short, this looks like a series of major governance failures by directors that panicked due to headlines in the media. They likely felt compelled to do something because they were afraid of looking bad in the media, not because it was the right thing for them company.\nThey couldn’t stand the heat.\nThe board’s conduct here is shocking for a company of this scale and importance to our country and the world at large, particularly at this moment in history.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/BillAckman/status/2123101979375235386","l":[],"ln":[],"t":["AI科技"],"lk":5703,"rt":838,"rp":544,"vw":154106},{"id":"2123101157887475839","h":"bboczeng","ts":1795021736,"zh":"和我的看法几乎是完全一样的，首先去$150，随后$120，最差情况可以到$80（再来一次大解放日）\n其实技术面、特别是图形这种东西，你说准吧也不准，你说不准吧，还真不能不看\n因为他就摆在你面前\n看不到结构那就是无知了\n尺度越大的结构越有效","en":"和我的看法几乎是完全一样的，首先去$150，随后$120，最差情况可以到$80（再来一次大解放日）\n其实技术面、特别是图形这种东西，你说准吧也不准，你说不准吧，还真不能不看\n因为他就摆在你面前\n看不到结构那就是无知了\n尺度越大的结构越有效","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123101157887475839","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":242},{"id":"2123101026077315446","h":"bboczeng","ts":1795021704,"zh":"不知不觉，贵金属的行情已经彻底结束了：","en":"不知不觉，贵金属的行情已经彻底结束了：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbFGGMa8AAe3Je.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2123101026077315446","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":249},{"id":"2123100834603180310","h":"bboczeng","ts":1795021658,"zh":"据 Semafor 报道，尽管英伟达（$NVDA）董事会此前公开表示不考虑让黄仁勋重返CEO职位，但董事会内部已有“一派”成员正在推动黄仁勋重新出任首席执行官。\n据悉，黄仁勋近期已与多位科技行业高管会面，并与至少一名英伟达董事会成员讨论了重新担任CEO的可能性。","en":"据 Semafor 报道，尽管英伟达（$NVDA）董事会此前公开表示不考虑让黄仁勋重返CEO职位，但董事会内部已有“一派”成员正在推动黄仁勋重新出任首席执行官。\n据悉，黄仁勋近期已与多位科技行业高管会面，并与至少一名英伟达董事会成员讨论了重新担任CEO的可能性。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123100834603180310","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":319},{"id":"2123100781213794541","h":"bboczeng","ts":1795021646,"zh":"标普500指数（$SPX）七个月来首次收盘跌破200日移动平均线","en":"标普500指数（$SPX）七个月来首次收盘跌破200日移动平均线","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123100781213794541","l":[],"ln":[],"t":["美股"],"lk":2,"rt":0,"rp":0,"vw":252},{"id":"2123100159936791009","h":"Balder13946731","ts":1795021498,"zh":"每个人都将定制芯片描述为谷歌和 Meta 逃离 Nvidia 的收费站。看看他们要逃到谁那里去。\nHock Tan 以大约 69B 美元的价格收购了 VMware，取消了永久许可证并将每个人都捆绑在一起。 AT&T 告诉法庭，其续约报价上涨了 1,050%。客户尖叫了一年，但他们中的大多数人还是付了钱，因为将 VMware 从数据中心中剥离比吃掉账单更糟糕。\n正是这个人共同设计了 Google 的 TPU、Meta 的芯片和 OpenAI 的 10GW 定制芯片交易。在 VMware 中，他发现了一些客户无法轻易拆除并以这种方式定价的东西，并且他在整个职业生涯中一直在做这样的事情。\n一旦你的模型堆栈被调整到只有一家商店可以为你构建的芯片，离开就像离开 VMware 一样痛苦，而他就是那个在未来十年向你报价的人。","en":"Everyone frames custom chips as Google and Meta escaping Nvidia's toll booth. Look at who they're escaping to.\nHock Tan bought VMware for ~$69B, killed the perpetual licenses and pushed everyone onto bundles. AT&T told a court its renewal quote went up 1,050%. Customers screamed for a year, and most of them paid anyway, because ripping VMware out of a data center is worse than eating the bill.\nThat's the same guy co-designing Google's TPUs, Meta's chips and OpenAI's 10GW custom silicon deal. With VMware he found something customers couldn't easily rip out and priced it that way, and he's been doing some version of that his whole career.\nOnce your model stack is tuned to a chip only one shop can build for you, leaving gets about as painful as leaving VMware was, and he's the one who'll be quoting you the renewal for the next decade.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/Balder13946731/status/2123100159936791009","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":596},{"id":"2123100002985898311","h":"bboczeng","ts":1795021460,"zh":"至此，日本所有大型企业，包括三菱银行的数据库系统全部被攻陷\n全体日本人的私人信息估计都被泄露十几遍了，可以被做成游戏了\n这就是外包IT的后果吗？\n谢谢大家","en":"至此，日本所有大型企业，包括三菱银行的数据库系统全部被攻陷\n全体日本人的私人信息估计都被泄露十几遍了，可以被做成游戏了\n这就是外包IT的后果吗？\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123100002985898311","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":502},{"id":"2123099584373399836","h":"yijiangren","ts":1795021360,"zh":"QQQ $QQQ\n开盘前说的650附近\n今天最低点654\n还是有点误差","en":"QQQ $QQQ\n开盘前说的650附近\n今天最低点654\n还是有点误差","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbDpj1a0AAWdzz.png?name=orig","https://pbs.twimg.com/media/HXbDrw-agAALxtj.png?name=orig"],"u":"https://x.com/yijiangren/status/2123099584373399836","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":1,"vw":459},{"id":"2123099362435936730","h":"bboczeng","ts":1795021307,"zh":"黄金已经结束了\n正如半导体\n希望陶老师迷途知返，不要和Herman Jin一样不断纠缠了\n如果半个月前听了您的建议去抄底存储\n现在岂不是亏麻了？\n结束了就是结束\n改变立场比坚持更值得尊敬！\n不要为了维持人设陷入泥潭，意识形态挂帅，价值观先行\n请和我一样，做一个真诚，诚实，情绪化的人\n谢谢","en":"黄金已经结束了\n正如半导体\n希望陶老师迷途知返，不要和Herman Jin一样不断纠缠了\n如果半个月前听了您的建议去抄底存储\n现在岂不是亏麻了？\n结束了就是结束\n改变立场比坚持更值得尊敬！\n不要为了维持人设陷入泥潭，意识形态挂帅，价值观先行\n请和我一样，做一个真诚，诚实，情绪化的人\n谢谢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123099362435936730","l":[],"ln":[],"t":["AI科技","黄金"],"lk":2,"rt":1,"rp":2,"vw":652},{"id":"2123098165742309412","h":"bboczeng","ts":1795021022,"zh":"看来只有等到明天的IPO结束之后，\n半导体和NVDA才可能迎来11月份的第一次反弹","en":"看来只有等到明天的IPO结束之后，\n半导体和NVDA才可能迎来11月份的第一次反弹","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123098165742309412","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":675},{"id":"2123097645539553592","h":"bboczeng","ts":1795020898,"zh":"美联储理事沃勒呼吁12月加息50个基点\n美联储理事克里斯托弗·沃勒（Christopher Waller）呼吁，在12月8日至9日举行的联邦公开市场委员会（FOMC）会议上，大幅加息50个基点（0.5个百分点）。\n沃勒指出，美国核心消费者价格指数（Core CPI）已连续三个月环比上涨0.3%，按年化计算，通胀率接近3.5%，明显高于美联储2%的通胀目标。此外，超过70%的核心服务类项目价格涨幅超过3%。\n他警告称，通胀压力正在向更广泛的经济领域蔓延，而不仅仅是受到油价影响。因此，他主张美联储现在就采取激进的紧缩措施，或者至少明确释放未来将加快加息步伐的信号，以防止高通胀变得根深蒂固。\n市场对此作出反应，美国国债收益率上升，黄金价格下跌。\n不过，批评人士认为，考虑到油价正在下跌、整体通胀呈现放缓趋势，沃勒的鹰派立场可能为时过早。\n这一争论凸显了美联储当前面临的政策两难：究竟应该通过更激进的紧缩政策维护抗通胀的公信力，还是避免过度加息对经济造成不必要的冲击。","en":"美联储理事沃勒呼吁12月加息50个基点\n美联储理事克里斯托弗·沃勒（Christopher Waller）呼吁，在12月8日至9日举行的联邦公开市场委员会（FOMC）会议上，大幅加息50个基点（0.5个百分点）。\n沃勒指出，美国核心消费者价格指数（Core CPI）已连续三个月环比上涨0.3%，按年化计算，通胀率接近3.5%，明显高于美联储2%的通胀目标。此外，超过70%的核心服务类项目价格涨幅超过3%。\n他警告称，通胀压力正在向更广泛的经济领域蔓延，而不仅仅是受到油价影响。因此，他主张美联储现在就采取激进的紧缩措施，或者至少明确释放未来将加快加息步伐的信号，以防止高通胀变得根深蒂固。\n市场对此作出反应，美国国债收益率上升，黄金价格下跌。\n不过，批评人士认为，考虑到油价正在下跌、整体通胀呈现放缓趋势，沃勒的鹰派立场可能为时过早。\n这一争论凸显了美联储当前面临的政策两难：究竟应该通过更激进的紧缩政策维护抗通胀的公信力，还是避免过度加息对经济造成不必要的冲击。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123097645539553592","l":[],"ln":[],"t":["美联储","通胀","原油能源","黄金"],"lk":3,"rt":0,"rp":2,"vw":962},{"id":"2123097456787530207","h":"bboczeng","ts":1795020853,"zh":"Anthropic IPO 吸引近 5000 亿美元认购，超越 SpaceX 纪录\n开发 Claude 聊天机器人的这家 AI 公司，共收到机构投资者 4000 亿美元和散户投资者 1000 亿美元的认购，目前正商讨将发行价定在 78 美元以上，并扩大发行规模。\n公司前九个月营收 330 亿美元，同比增长 1200%，10 月年化收入run rate达 810 亿美元，股票将于明天在纳斯达克开始交易，股票代码为 $ANT。\n观察人士指出，散户的热情通过代币化产品得以体现，同时也有人将比特币的回落与资金流入此次 IPO 联系起来。","en":"Anthropic IPO 吸引近 5000 亿美元认购，超越 SpaceX 纪录\n开发 Claude 聊天机器人的这家 AI 公司，共收到机构投资者 4000 亿美元和散户投资者 1000 亿美元的认购，目前正商讨将发行价定在 78 美元以上，并扩大发行规模。\n公司前九个月营收 330 亿美元，同比增长 1200%，10 月年化收入run rate达 810 亿美元，股票将于明天在纳斯达克开始交易，股票代码为 $ANT。\n观察人士指出，散户的热情通过代币化产品得以体现，同时也有人将比特币的回落与资金流入此次 IPO 联系起来。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123097456787530207","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":5,"rt":0,"rp":1,"vw":1520},{"id":"2123096878363611329","h":"octopusycc","ts":1795020715,"zh":"帮着扩散一下，杨超越老师 365天盈利榜第一","en":"帮着扩散一下，杨超越老师 365天盈利榜第一","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2123096878363611329","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":0,"vw":1661},{"id":"2123095059633733782","h":"TraderS18","ts":1795020282,"zh":"是“糟心”不是“招新”，手速太快打错了","en":"是“糟心”不是“招新”，手速太快打错了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123095059633733782","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1135},{"id":"2123094172668490175","h":"bboczeng","ts":1795020070,"zh":"英伟达跌破150，那就是120见了","en":"英伟达跌破150，那就是120见了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123094172668490175","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":153},{"id":"2123093122423128338","h":"bboczeng","ts":1795019820,"zh":"事实证明，美股确实已经完了\n大家节哀吧\n只有定投voo是你们的唯一出路","en":"事实证明，美股确实已经完了\n大家节哀吧\n只有定投voo是你们的唯一出路","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123093122423128338","l":[],"ln":[],"t":["美股"],"lk":3,"rt":0,"rp":3,"vw":507},{"id":"2123089479921787104","h":"wufantouzi","ts":1795018951,"zh":"英伟达财报也没有拉起美股\n短期美股反弹的机会渺茫了\n只能装死等加息之后了","en":"英伟达财报也没有拉起美股\n短期美股反弹的机会渺茫了\n只能装死等加息之后了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2123089479921787104","l":[],"ln":[],"t":["美联储","美股","AI科技","财报"],"lk":10,"rt":0,"rp":6,"vw":2490},{"id":"2123088711030366217","h":"yijiangren","ts":1795018768,"zh":"A社 IPO：市场愿意给 AI 多高的估值\nAnthropic 即将登陆纳斯达克，股票代码 ANT。\n目前公开招股文件给出的发行区间为 70—78 美元。\n此前有媒体报道称，承销商正在考虑将发行价上调至 80 美元以上。\n市场讨论的估值已经达到约 1.4 万亿美元，如果最终定价继续上调，估值还会进一步抬升。\n但这 1.4 万亿美元究竟贵不贵？\n先看基本面\nAnthropic 的收入增长\n2025 年全年收入约 45.9 亿美元，2026 年前九个月已经达到 332.4 亿美元，同比增长约 12 倍。\n企业客户对 Claude 的需求正在快速增长，AI 编程、企业自动化和 API 服务都在推动商业化。\n但另一面也值得注意。\n2026 年前九个月，算力与基础设施费用达到 188.1 亿美元，占收入的 57%。\n同期经营亏损约 12.6 亿美元。\n账面净亏损约 1040 亿美元，其中约 943 亿美元来自可转换票据、衍生负债等金融工具的公允价值变动，不是实际现金烧掉了 1040 亿美元。\n这恰恰说明，AI 行业的商业化速度虽然很快，但算力投入依然是一笔庞大的长期成本。\n再看估值\n按照路透社报道的约 1.4 万亿美元估值计算，Anthropic 对应过去 12 个月收入约 40 倍。\n这个价格已经包含了市场对未来多年增长的预期。\n投资者买入的，是 Claude 在企业市场的持续渗透，是 AI Agent 带来的生产力变革，也是 Anthropic 未来争夺全球 AI 基础设施市场的可能性。\n但高估值也意味着更高的兑现要求。\n模型竞争、算力成本、融资环境、企业客户的实际付费意愿，任何一个环节出现变化，都可能影响估值。\n所以，两件事：\n最终发行价能否突破 80 美元\n首日交易能否承接如此高的估值\nIPO 首日的涨跌只能反映资金当下的态度。\n真正决定 Anthropic 长期价值的，是它能否把 AI 的技术优势，持续转化为收入、利润和现金流。","en":"A社 IPO：市场愿意给 AI 多高的估值\nAnthropic 即将登陆纳斯达克，股票代码 ANT。\n目前公开招股文件给出的发行区间为 70—78 美元。\n此前有媒体报道称，承销商正在考虑将发行价上调至 80 美元以上。\n市场讨论的估值已经达到约 1.4 万亿美元，如果最终定价继续上调，估值还会进一步抬升。\n但这 1.4 万亿美元究竟贵不贵？\n先看基本面\nAnthropic 的收入增长\n2025 年全年收入约 45.9 亿美元，2026 年前九个月已经达到 332.4 亿美元，同比增长约 12 倍。\n企业客户对 Claude 的需求正在快速增长，AI 编程、企业自动化和 API 服务都在推动商业化。\n但另一面也值得注意。\n2026 年前九个月，算力与基础设施费用达到 188.1 亿美元，占收入的 57%。\n同期经营亏损约 12.6 亿美元。\n账面净亏损约 1040 亿美元，其中约 943 亿美元来自可转换票据、衍生负债等金融工具的公允价值变动，不是实际现金烧掉了 1040 亿美元。\n这恰恰说明，AI 行业的商业化速度虽然很快，但算力投入依然是一笔庞大的长期成本。\n再看估值\n按照路透社报道的约 1.4 万亿美元估值计算，Anthropic 对应过去 12 个月收入约 40 倍。\n这个价格已经包含了市场对未来多年增长的预期。\n投资者买入的，是 Claude 在企业市场的持续渗透，是 AI Agent 带来的生产力变革，也是 Anthropic 未来争夺全球 AI 基础设施市场的可能性。\n但高估值也意味着更高的兑现要求。\n模型竞争、算力成本、融资环境、企业客户的实际付费意愿，任何一个环节出现变化，都可能影响估值。\n所以，两件事：\n最终发行价能否突破 80 美元\n首日交易能否承接如此高的估值\nIPO 首日的涨跌只能反映资金当下的态度。\n真正决定 Anthropic 长期价值的，是它能否把 AI 的技术优势，持续转化为收入、利润和现金流。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXa5c_yawAAv0av.png?name=orig"],"u":"https://x.com/yijiangren/status/2123088711030366217","l":[],"ln":[],"t":["美股","AI科技"],"lk":5,"rt":0,"rp":3,"vw":851},{"id":"2123083555953836116","h":"TraderS18","ts":1795017539,"zh":"那么我们想要的终极答案也就呼之欲出了，真正的反转点是利率何时从加息变降息，在能看到加息周期终点之前，只会有反弹而不会有反转。\n再回顾下本轮周期：9.16号加了25BP，10月没加，12月会加25BP，然后大概会在明年3月再加25BP后暂停。\n也就是说行情要到明年春节后才会开始好转，这跟市场一贯印象也很吻合。但不排除12月会随着TGA账户水位下降有一轮小宽松带来的行情回暖。\n好消息是油价还在下跌，如果趋势可以维持，宏观数据也会随之改善。如果11月12月的PCE/CPI都得到改善，行情的回暖也许会提前到来。毕竟市场会提前交易预期，而不会等利率决议那一刻才去博弈。","en":"那么我们想要的终极答案也就呼之欲出了，真正的反转点是利率何时从加息变降息，在能看到加息周期终点之前，只会有反弹而不会有反转。\n再回顾下本轮周期：9.16号加了25BP，10月没加，12月会加25BP，然后大概会在明年3月再加25BP后暂停。\n也就是说行情要到明年春节后才会开始好转，这跟市场一贯印象也很吻合。但不排除12月会随着TGA账户水位下降有一轮小宽松带来的行情回暖。\n好消息是油价还在下跌，如果趋势可以维持，宏观数据也会随之改善。如果11月12月的PCE/CPI都得到改善，行情的回暖也许会提前到来。毕竟市场会提前交易预期，而不会等利率决议那一刻才去博弈。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123083555953836116","l":[],"ln":[],"t":["美联储","原油能源"],"lk":31,"rt":2,"rp":2,"vw":5223},{"id":"2123081783269113949","h":"CrushTheShorts","ts":1795017116,"zh":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星开始穿透严查代工，据了解此事大概率为真\n2）只看代工来源，理论上说摩尔和壁仞相对还行，但其实都有各自的问题\n3）理论上说该把中芯华虹拉满，但腾讯给了2028年资本开支下滑的展望，尽管买国产卡的钱预计能增长2年，但在大beta向下的预期下，交易这两标的也是个难题","en":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星开始穿透严查代工，据了解此事大概率为真\n2）只看代工来源，理论上说摩尔和壁仞相对还行，但其实都有各自的问题\n3）理论上说该把中芯华虹拉满，但腾讯给了2028年资本开支下滑的展望，尽管买国产卡的钱预计能增长2年，但在大beta向下的预期下，交易这两标的也是个难题","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2123081783269113949","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":0,"rp":4,"vw":1345},{"id":"2123081479987302659","h":"Gabrysia_eth","ts":1795017044,"zh":"看到一个70岁老奶奶对ai时代的评论：\n「以后，年轻人也可能会没有工作机会，相信社会不会让人饿死。个体需要解决的就是打发时间。」\n「对抗虚无和无意义感的方法，就是让生活充满细节。」\n我一直觉得，我们正在经历的不只是生产力的进步，而可能是整个社会生产关系、阶级结构，甚至人类价值体系的重新洗牌。\n未来，人或许不再需要像过去几千年一样，终其一生都在为基本生存需求奔波。\n当劳动不再是人获取价值的主要方式，价值会是那些过去很容易被忽略的东西：人的思想、情感、创造力、审美、好奇心，以及与其他人建立真实连接的能力。\n我们为什么会被一朵花、一场雨打动，为什么想去探索、表达、创造，为什么愿意花时间去爱一个人、经营一段关系。\n生产力进步的终点，是让人终于有时间重新成为人。","en":"看到一个70岁老奶奶对ai时代的评论：\n「以后，年轻人也可能会没有工作机会，相信社会不会让人饿死。个体需要解决的就是打发时间。」\n「对抗虚无和无意义感的方法，就是让生活充满细节。」\n我一直觉得，我们正在经历的不只是生产力的进步，而可能是整个社会生产关系、阶级结构，甚至人类价值体系的重新洗牌。\n未来，人或许不再需要像过去几千年一样，终其一生都在为基本生存需求奔波。\n当劳动不再是人获取价值的主要方式，价值会是那些过去很容易被忽略的东西：人的思想、情感、创造力、审美、好奇心，以及与其他人建立真实连接的能力。\n我们为什么会被一朵花、一场雨打动，为什么想去探索、表达、创造，为什么愿意花时间去爱一个人、经营一段关系。\n生产力进步的终点，是让人终于有时间重新成为人。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Gabrysia_eth/status/2123081479987302659","l":[],"ln":[],"t":[],"lk":12,"rt":1,"rp":2,"vw":785},{"id":"2123081181730324877","h":"dmjk001","ts":1795016973,"zh":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星开始穿透严查代工，据了解此事大概率为真\n2）只看代工来源，理论上说摩尔和壁仞相对还行，但其实都有各自的问题\n3）理论上说该把中芯华虹拉满，但腾讯给了2028年资本开支下滑的展望，尽管买国产卡的钱预计能增长2年，但在大beta向下的预期下，交易这两标的也是个难题、","en":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/58 w":452},{"id":"2123043914676666371","h":"xingpt","ts":1795008088,"zh":"2016 年至 2024 年，阿里巴巴在中国电商市场的份额从 80% 降至 40%，流失的市场份额主要被拼多多、抖音和快手蚕食。（图表来源：Momentum Works）\n图表标题：2016 年以来，中国电商平台的竞争格局发生了持续的结构性变化。\n2016 年，阿里巴巴以 80% 的市场份额占据中国电商市场的绝对主导地位。当时，分析师甚至宣称：“竞争已经结束”（Game Over）。\n然而到了 2024 年，阿里巴巴的市场份额已下降至约 40%。\n从图表估算，各大电商平台在 2024 年的市场份额分别为：\n阿里巴巴（淘宝、天猫）：约 36%\n拼多多：约 23%\n京东：约 20%\n抖音：约 15%\n快手：约 6%\n短短八年时间，阿里巴巴丧失了近一半的市场份额。即便是拥有强大规模效应、网络效应和先发优势的互联网巨头，其竞争护城河也可能随着商业模式创新和用户消费习惯的改变而逐渐瓦解。","en":"2016 年至 2024 年，阿里巴巴在中国电商市场的份额从 80% 降至 40%，流失的市场份额主要被拼多多、抖音和快手蚕食。（图表来源：Momentum Works）\n图表标题：2016 年以来，中国电商平台的竞争格局发生了持续的结构性变化。\n2016 年，阿里巴巴以 80% 的市场份额占据中国电商市场的绝对主导地位。当时，分析师甚至宣称：“竞争已经结束”（Game Over）。\n然而到了 2024 年，阿里巴巴的市场份额已下降至约 40%。\n从图表估算，各大电商平台在 2024 年的市场份额分别为：\n阿里巴巴（淘宝、天猫）：约 36%\n拼多多：约 23%\n京东：约 20%\n抖音：约 15%\n快手：约 6%\n短短八年时间，阿里巴巴丧失了近一半的市场份额。即便是拥有强大规模效应、网络效应和先发优势的互联网巨头，其竞争护城河也可能随着商业模式创新和用户消费习惯的改变而逐渐瓦解。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXaRLQWawAA2HUy.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123043914676666371","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":830},{"id":"2123038830424916044","h":"bbcchinese","ts":1795006875,"zh":"你有玩《GTA》吗？ 引颈以待13年，这款全球知名的动作冒险游戏11月19日强势回归，推出新一代《GTA 6》掀起国际热话。\nBBC曾于1996年到访初代《GTA》的诞生地——苏格兰邓迪，见证这款经典游戏的制作过程。三十年后，BBC重返当地并专访元祖级共同创作者以及当时的编剧，分享如何打造出这个全球文化现象。","en":"你有玩《GTA》吗？ 引颈以待13年，这款全球知名的动作冒险游戏11月19日强势回归，推出新一代《GTA 6》掀起国际热话。\nBBC曾于1996年到访初代《GTA》的诞生地——苏格兰邓迪，见证这款经典游戏的制作过程。三十年后，BBC重返当地并专访元祖级共同创作者以及当时的编剧，分享如何打造出这个全球文化现象。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/ext_tw_video/2123038708798468096/pu/vid/avc1/720x1280/XmvmIugIbIXBczip.mp4?tag=12"],"u":"https://x.com/bbcchinese/status/2123038830424916044","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":3047},{"id":"2123035887361794268","h":"darrencao2024","ts":1795006174,"zh":"和我的操作差不多，我最近也一直在加台积电","en":"和我的操作差不多，我最近也一直在加台积电","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123035887361794268","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":1,"v 息指的是估值水平，不是公司质量。我知道Anthropic是一家好公司，我也是他们产品的忠实用户，但好公司不代表好估值，我不确定1.2T的上市价格，是不是好的入场位置。\n我会耐心等待，至少几次财报之后，再决定是否入手。Space X上市后应该套了不少人，很多人因为看到Space X巨大市场前景，200以上还无脑冲，我不会去做这样的事。\n保持耐心，保持冷静。美股现在打折的好股票很多，我不会去参与这波热炒。","en":"Anthropic本周四即将上市，不少朋友给我留言问我怎么看，这里统一回复，就是只看不参与。\n我没有追IPO的习惯，之前Cerebras SpaceX上市 我都没有参与。不过我已经在130-140的位置分批入场了space x.\n热门股IPO第一天甚至前几天会受到市场追捧，股价飙升一波，这很常见。我不知道这会不会同样发生在ANT身上，但我不会参与，因为这和赌博没什么区别，是在没有任何信息的情况下作出的盲目选择。\n这里的信息指的是估值水平，不是公司质量。我知道Anthropic是一家好公司，我也是他们产品的忠实用户，但好公司不代表好估值，我不确定1.2T的上市价格，是不是好的入场位置。\n我会耐心等待，至少几次财报之后，再决定是否入手。Space X上市后应该套了不少人，很多人因为看到Space X巨大市场前景，200以上还无脑冲，我不会去做这样的事。\n保持耐心，保持冷静。美股现在打折的好股票很多，我不会去参与这波热炒。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123034150080811378","l":[],"ln":[],"t":["美股","财报"],"lk":0,"rt":0,"rp":0,"vw":316},{"id":"2123030743408382221","h":"yijiangren","ts":1795004947,"zh":"浑水做空 $NVDA 英伟达：一场由高管关系、出口管制与供应链疑云引发的调查\n在华尔街，有一类机构让上市公司管理层颇为头疼。\n它们专门寻找企业财报、商业关系和经营活动中的漏洞，然后通过做空股票，从市场对这些问题的重新定价中获利。\n浑水研究（Muddy Waters Research），就是其中最有名的一家。\n一、浑水究竟是什么来头？\n浑水研究由 Carson Block 于 2010 年创立，长期以调查研究和做空上市公司闻名。\n它的名字来自一句中国俗语：浑水摸鱼。\n这家机构最擅长的事情，是深入企业经营链条，调查财务数据、客户关系、供应商、资产真实性以及管理层之间的利益联系。\n它曾经让多家上市公司陷入严重的信任危机。\n2011 年，浑水将矛头指向加拿大上市的中国森林（Sino-Forest），质疑其林地资产和经营数据存在重大造假。\n当时，中国森林市值超过 60 亿加元，曾是资本市场备受关注的林业企业。\n浑水发布报告后，股价从报告发布前的 18.21 加元一路跌至 1.99 加元。随后监管机构介入，公司停牌、退市，最终进入债务重组程序。\n这场调查让 Carson Block 一战成名。\n此后，浑水还曾调查中国高速传媒、分众相关企业以及 NQ Mobile 等公司，在海外资本市场建立了相当强的影响力。\n当然，浑水的历史战绩也并非全胜。\n它对部分公司的质疑曾遭到独立调查否定，NQ Mobile 也曾公布独立调查结果，称没有发现浑水所指控的欺诈行为。\n所以，浑水的报告值得认真阅读，但它的结论始终需要独立证据验证。\n还有一个非常重要的细节：浑水本身就持有被调查公司的空头仓位。它通过做空相关证券获得潜在收益，并在报告发布后逐步平仓。\n换句话说，它既是调查者，也是利益相关方。\n这也是为什么每一份浑水报告，都应该同时看证据和利益动机。\n二、这一次，浑水为什么盯上英伟达？\n当地时间 11 月 17 日，浑水正式发布报告：《MW is Short NVIDIA: More Questions About China》。\n宣布已经做空英伟达（NVDA）。\n这份报告的核心，指向了两个人。\n一个是英伟达前全球业务执行副总裁 Ajay K. Puri，另一个是超微电脑（Super Micro，SMCI）前首席增长官 Cenly Chen。\nAjay Puri 曾在英伟达任职 21 年，负责全球销售、业务拓展、合作伙伴关系等重要业务。\n他在 2026 年 6 月宣布卸任原职，转为英伟达高级顾问。\n而 Cenly Chen 曾在超微电脑负责 GPU 采购和分配。\n事情的关键，出现在两人的公开活动照片上。\n浑水发现，2024 年至 2026 年间，一名被活动摄影网站标注为 Cenly Chen 或 Cenly Puri 的女性，多次与 Ajay Puri 同框。\n浑水由此提出一个问题：照片中的女性，是否就是曾经负责超微电脑 NVIDIA GPU 采购和分配的 Cenly Chen？\n这成为此次做空报告的核心切入点。\n三、超微电脑的芯片出口事件\n要理解浑水为什么关注这层关系，需要回到今年 3 月的一起美国刑事案件。\n美国司法部当时宣布，三名与超微电脑有关联的人员涉嫌合谋，将搭载美国先进 AI 技术的服务器非法转运至中国。\n根据美国司法部公布的起诉内容，2024 年至 2025 年期间，相关人员安排一家东南亚公司采购了约 25 亿美元的服务器。\n其中，仅 2025 年 4 月下旬至 5 月中旬，就有约 5.1 亿美元的服务器被非法转运至中国。\n案件还涉及伪造文件、安排虚假服务器接受检查等行为。\n这意味着，事件已经触及美国 AI 芯片出口管制的核心问题。\n随后，2026 年 10 月，一份针对超微电脑的证券集体诉讼文件，又将 Cenly Chen 的名字带入事件。\n诉讼文件援引前员工证词，称她曾负责超微电脑从英伟达采购 GPU，并决定芯片如何分配给不同客户。\n文件还质疑她是否知晓相关非法销售行为。\n浑水将这两条线索连接起来：\n一边是曾经负责英伟达全球业务的高级管理人员 Ajay Puri，另一边是被诉讼文件指向的超微电脑前高管 Cenly Chen。\n如果照片中的两人确实对应上述人物，那么这层关系就值得进一步调查。\n四、这份报告究竟有多少可信度？\n我认为，需要把整件事拆成三个层次。\n第一层，超微电脑相关人员涉嫌违规转运 AI 服务器，有美国司法部的刑事起诉作为依据。\n第二层，Cenly Chen 曾负责超微电脑的 GPU 采购与分配，有前员工证词被写入法院诉讼文件。\n第三层，照片中的女性究竟是不是 Cenly Chen，以及她与 Ajay Puri 的具体关系，目前仍然没有得到独立证实。\n第三层恰恰是浑水这次做空逻辑中最关键的连接点。\n目前没有证据证明 Ajay Puri 参与了芯片违规转运，也没有证据证明英伟达公司参与了相关违法活动。\n浑水自己也在报告中明确承认：Cenly Chen 没有受到任何政府机构的刑事指控，针对她的民事诉讼指控尚未得到证实。\n所以，这份报告目前更多是在提出一系列值得调查的问题。\n五、这件事对英伟达意味着什么？\n我认为，三个方面\n1. 出口管制风险\n英伟达的核心产品涉及美国严格管制的先进 AI 芯片。\n如果供应链中的违规转运持续扩大，监管部门就可能进一步审查芯片销售、终端客户核查和渠道管理。\n2. 管理层与供应链关系\n英伟达高度依赖服务器厂商、云服务商和分销渠道。\n一旦核心供应链合作伙伴出现合规问题，市场自然会重新审视英伟达的渠道管理能力。\n3. 市场信任\n英伟达当前的估值，很大程度上建立在 AI 算力需求持续增长、供应链稳定以及公司治理可靠的基础上。\n如果出口管制和内部管理问题持续发酵，即使短期营收没有变化，也可能影响投资者愿意支付的估值溢价。\n最后，还有一个细节值得注意。\n浑水在报告中明确披露，自己在发布报告时持有英伟达空头仓位，并计划在报告发布后回补相当一部分，甚至全部仓位。\n因此，不能简单地把浑水发布做空报告理解为它会一直持有空单。\n总而言之\n浑水过去确实有过非常漂亮的调查战绩，它的报告值得重视。\n但这次英伟达事件，最关键的证据链仍然存在缺口。\n超微电脑的出口违规案件有司法调查作为基础，高管之间的身份关联却仍待确认。\n接下来值得观察的，是美国司法部、监管机构以及英伟达自身会不会披露更多信息。\n浑水的报告可以成为风险预警，但还不足以单独构成做空英伟达的完整理由。","en":"浑水做空 $NVDA 英伟达：一场由高管关系、出口管制与供应链疑云引发的调查\n在华尔街，有一类机构让上市公司管理层颇为头疼。\n它们专门寻找企业财报、商业关系和经营活动中的漏洞，然后通过做空股票，从市场对这些问题的重新定价中获利。\n浑水研究（Muddy Waters Research），就是其中最有名的一家。\n一、浑水究竟是什么来头？\n浑水研究由 Carson Block 于 2010 年创立，长期以调查研究和做空上市公司闻名。\n它的名字来自一句中国俗语：浑水摸鱼。\n这家机构最擅长的事情，是深入企业经营链条，调查财务数据、客户关系、供应商、资产真实性以及管理层之间的利益联系。\n它曾经让多家上市公司陷入严重的信任危机。\n2011 年，浑水将矛头指向加拿大上市的中国森林（Sino-Forest），质疑其林地资产和经营数据存在重大造假。\n当时，中国森林市值超过 60 亿加元，曾是资本市场备受关注的林业企业。\n浑水发布报告后，股价从报告发布前的 18.21 加元一路跌至 1.99 加元。随后监管机构介入，公司停牌、退市，最终进入债务重组程序。\n这场调查让 Carson Block 一战成名。\n此后，浑水还曾调查中国高速传媒、分众相关企业以及 NQ Mobile 等公司，在海外资本市场建立了相当强的影响力。\n当然，浑水的历史战绩也并非全胜。\n它对部分公司的质疑曾遭到独立调查否定，NQ Mobile 也曾公布独立调查结果，称没有发现浑水所指控的欺诈行为。\n所以，浑水的报告值得认真阅读，但它的结论始终需要独立证据验证。\n还有一个非常重要的细节：浑水本身就持有被调查公司的空头仓位。它通过做空相关证券获得潜在收益，并在报告发布后逐步平仓。\n换句话说，它既是调查者，也是利益相关方。\n这也是为什么每一份浑水报告，都应该同时看证据和利益动机。\n二、这一次，浑水为什么盯上英伟达？\n当地时间 11 月 17 日，浑水正式发布报告：《MW is Short NVIDIA: More Questions About China》。\n宣布已经做空英伟达（NVDA）。\n这份报告的核心，指向了两个人。\n一个是英伟达前全球业务执行副总裁 Ajay K. Puri，另一个是超微电脑（Super Micro，SMCI）前首席增长官 Cenly Chen。\nAjay Puri 曾在英伟达任职 21 年，负责全球销售、业务拓展、合作伙伴关系等重要业务。\n他在 2026 年 6 月宣布卸任原职，转为英伟达高级顾问。\n而 Cenly Chen 曾在超微电脑负责 GPU 采购和分配。\n事情的关键，出现在两人的公开活动照片上。\n浑水发现，2024 年至 2026 年间，一名被活动摄影网站标注为 Cenly Chen 或 Cenly Puri 的女性，多次与 Ajay Puri 同框。\n浑水由此提出一个问题：照片中的女性，是否就是曾经负责超微电脑 NVIDIA GPU 采购和分配的 Cenly Chen？\n这成为此次做空报告的核心切入点。\n三、超微电脑的芯片出口事件\n要理解浑水为什么关注这层关系，需要回到今年 3 月的一起美国刑事案件。\n美国司法部当时宣布，三名与超微电脑有关联的人员涉嫌合谋，将搭载美国先进 AI 技术的服务器非法转运至中国。\n根据美国司法部公布的起诉内容，2024 年至 2025 年期间，相关人员安排一家东南亚公司采购了约 25 亿美元的服务器。\n其中，仅 2025 年 4 月下旬至 5 月中旬，就有约 5.1 亿美元的服务器被非法转运至中国。\n案件还涉及伪造文件、安排虚假服务器接受检查等行为。\n这意味着，事件已经触及美国 AI 芯片出口管制的核心问题。\n随后，2026 年 10 月，一份针对超微电脑的证券集体诉讼文件，又将 Cenly Chen 的名字带入事件。\n诉讼文件援引前员工证词，称她曾负责超微电脑从英伟达采购 GPU，并决定芯片如何分配给不同客户。\n文件还质疑她是否知晓相关非法销售行为。\n浑水将这两条线索连接起来：\n一边是曾经负责英伟达全球业务的高级管理人员 Ajay Puri，另一边是被诉讼文件指向的超微电脑前高管 Cenly Chen。\n如果照片中的两人确实对应上述人物，那么这层关系就值得进一步调查。\n四、这份报告究竟有多少可信度？\n我认为，需要把整件事拆成三个层次。\n第一层，超微电脑相关人员涉嫌违规转运 AI 服务器，有美国司法部的刑事起诉作为依据。\n第二层，Cenly Chen 曾负责超微电脑的 GPU 采购与分配，有前员工证词被写入法院诉讼文件。\n第三层，照片中的女性究竟是不是 Cenly Chen，以及她与 Ajay Puri 的具体关系，目前仍然没有得到独立证实。\n第三层恰恰是浑水这次做空逻辑中最关键的连接点。\n目前没有证据证明 Ajay Puri 参与了芯片违规转运，也没有证据证明英伟达公司参与了相关违法活动。\n浑水自己也在报告中明确承认：Cenly Chen 没有受到任何政府机构的刑事指控，针对她的民事诉讼指控尚未得到证实。\n所以，这份报告目前更多是在提出一系列值得调查的问题。\n五、这件事对英伟达意味着什么？\n我认为，三个方面\n1. 出口管制风险\n英伟达的核心产品涉及美国严格管制的先进 AI 芯片。\n如果供应链中的违规转运持续扩大，监管部门就可能进一步审查芯片销售、终端客户核查和渠道管理。\n2. 管理层与供应链关系\n英伟达高度依赖服务器厂商、云服务商和分销渠道。\n一旦核心供应链合作伙伴出现合规问题，市场自然会重新审视英伟达的渠道管理能力。\n3. 市场信任\n英伟达当前的 基金经理中42%选择选改善资产负债表、33%选回馈股东、16%选增加资本开支。\n4）现金持仓比例从3.9%降至3.6%，为8月以来最低，处于长期均值以下1.9个标准差的位置。按照美银的\"现金规则\"，当现金比例处于或低于4.0%时，构成全球股市的反向卖出信号。\nHartnett在调查发布前就写过，若现金升破4.2%、经济繁荣预期明显减弱，仓位对市场的压力就会减轻。实际结果是现金降至3.6%，仍落在他认为恐惧不足的区域。\n减仓速度很极端，减仓后的仓位仍有余量。 单月下降25个百分点，超过了2008年金融危机、2022年加息调整以及2025年4月关税冲击期间任何一个月的降幅。但减仓后，科技股仍为净超配，只比自身长期均值低约半个标准差。美银历史上看到的较好科技股入场机会，通常出现在受访者已转为净低配的时候。\n结合最近的几个不同的数据来看这一轮调整资金上是对冲基金先减仓、长线经理随后跟进。能从数据中确认的是，至少三类记录都出现了科技风险下降的迹象，但交易行为各有不同。\n1）德鲁肯米勒的三季度持仓显示，他在AI硬件内部做了很大的取舍。\n2）高盛Prime看到了先降杠杆、再卖反弹。 11月第一周，其美国基本面股票多空基金客户的总杠杆下降8.7个百分点至207.5%，是2020年3月以来最大单周降幅。随后一周，芯片股出现4月以来最强反弹，这批资金仍在卖科技。美国信息技术板块多头与空头敞口之比从6月初的2.14降至1.50，创高盛这组数据自2016年开始统计以来最低。\n3）同期仍有人申购科技基金。 美银11月12日《The Flow Show》引用的EPFR数据显示，截至11月11日的一周全球股票基金净流入983亿美元，其中科技基金净流入89亿美元。基金客户可以继续申购，但主动经理也可以把组合里的科技权重往下调。（见引用的推文）\n核心就是主动性资金在撤退。\n怎么看这几个数据呢？\n高盛客户的科技多空比已经很低，利好消息容易触发回补。美银更广泛的全球经理样本仍然净超配科技，后续也还有减仓空间。 一波有力度的反弹与长线资金继续调整仓位，完全可能出现在同一周期。\n仓位已经为反弹创造了条件，反弹能走多远取决于投资回报。\n中长期还是看周一梳理美银最新一期Flow Show的推文最后部分核心三个层面：\n1）油价/通胀走势；\n2）新的政治生态下AI政策会比预期的还要收紧还是会柔和些；\n3）AI商业化是不是继续处于加速状态。\n核心逻辑是，如果美伊能缓和、俄乌也能结束，油价下来通胀才会下来，市场才会预期利率更宽松，否则又要担心明年上半年联储会继续收紧。\n现在科技杀的这么猛、就是预期新国会生态带来AI基建的大放缓，那就要看明年实际力度比预期的更猛还是更弱。如果民主党搞事力度比现在预期更猛，即使通胀下来了，科技也很难受。但如果比现在预期柔和一些，市场情绪则又起来。\n而AI商业化则是最底层的逻辑支撑：最近大科技还算比较抗跌支撑指数，是因为市场认为政策再收紧他们还是能扛的，如果数据中心放缓大云厂手里的算力稀缺，但根源还是因为云业务增速在加速中，他们能撑的住。真要大幅度降速，那么通胀好转、政策缓和，也都带不动。","en":"最新的美银全球基金经理调查，几个要点：1）基金经理对科技股的热情正在快速消退。调查显示科技股超配比例从10月的净37%降至净12%（见图一），降幅为2006年6月以来最大，超过2008年金融危机、2022年加息周期和今年“对等关税日4月2日”时的任何一次。\n目前科技股仓位已低于长期均值约半个标准差（下图2）\n2）在最大尾部风险票选中，\"AI泡沫\"以34%位居第一，\"AI超大规模运营商信用事件\"以31%紧随其后。两项合计65%，意味着市场上三分之二的资金管理者将AI视为当前股市和信用市场的最大威胁。相比之下，10月的头号风险是债券收益率无序上行。（下图3）\n3）在最可能引发系统性信用事件的来源中，38%的受访者指向AI超大规模运营商债券，30%指向私人信贷。（下图4）\n而在企业应优先怎样使用现金流这一问题里，参与调查的基金经理中42%选择选改善资产负债表、33%选回馈股东、16%选增加资本开支。\n4）现金持仓比例从3.9%降至3.6%，为8月以来最低，处于长期均值以下1.9个标准差的位置。按照美银的\"现金规则\"，当现金比例处于或低于4.0%时，构成全球股市的反向卖出信号。\nHartnett在调查发布前就写过，若现金升破4.2%、经济繁荣预期明显减弱，仓位对市场的压力就会减轻。实际结果是现金降至3.6%，仍落在他认为恐惧不足的区域。\n减仓速度很极端，减仓后的仓位仍有余量。 单月下降25个百分点，超过了2008年金融危机、2022年加息调整以及2025年4月关税冲击期间任何一个月的降幅。但减仓后，科技股仍为净超配，只比自身长期均值低约半个标准差。美银历史上看到的较好科技股入场机会，通常出现在受访者已转为净低配的时候。\n结合最近的几个不同的数据来看这一轮调整资金上是对冲基金先减仓、长线经理随后跟进。能从数据中确认的是，至少三类记录都出现了科技风险下降的迹象，但交易行为各有不同。\n1）德鲁肯米勒的三季度持仓显示，他在AI硬件内部做了很大的取舍。\n2）高盛Prime看到了先降杠杆、再卖反弹。 11月第一周，其美国基本面股票多空基金客户的总杠杆下降8.7个百分点至207.5%，是2020年3月以来最大单周降幅。随后一周，芯片股出现4月以来最强反弹，这批资金仍在卖科技。美国信息技术板块多头与空头敞口之比从6月初的2.14降至1.50，创高盛这组数据自2016年开始统计以来最低。\n3）同期仍有人申购科技基金。 美银11月12日《The Flow Show》引用的EPFR数据显示，截至11月11日的一周全球股票基金净流入983亿美元，其中科技基金净流入89亿美元。基金客户可以继续申购，但主动经理也可以把组合里的科技权重往下调。（见引用的推文）\n核心就是主动性资金在撤退。\n怎么看这几个数据呢？\n高盛客户的科技多空比已经很低，利好消息容易触发回补。美银更广泛的全球经理样本仍然净超配科技，后续也还有减仓空间。 一波有力度的反弹与长线资金继续调整仓位，完全可能出现在同一周期。\n仓位已经为反弹创造了条件，反弹能走多远取决于投资回报。\n中长期还是看周一梳理美银最新一期Flow Show的推文最后部分核心三个层面：\n1）油价/通胀走势；\n2）新的政治生态下AI政策会比预期的还要收紧还是会柔和些；\n3）AI商业化是不是继续处于加速状态。\n核心逻辑是，如果美伊能缓和、俄乌也能结束，油价下来通胀才会下来，市场才会预期利率更宽松，否则又要担心明年上半年联储会继续收紧。\n现在科技杀的这么猛、就是预期新国会生态带来AI基建的大放缓，那就要看明年实际力度比预期的更猛还是更弱。如果民主党搞事力度比现在预期更猛，即使通胀下来了，科技也很难受。但如果比现在预期柔和一些，市场情绪则又起来。\n而AI商业化则是最底层的逻辑支撑：最近大科技还算比较抗跌支撑指数，是因为市场认为政策再收紧他们还是能扛的，如果数据中心放缓大云厂手里的算力稀缺，但根源还是因为云业务增速在加速中，他们能撑的住。真要大幅度降速，那么通胀好转、政策缓和，也都带不动。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXZgWD2b0AE0v0C.jpg?name=orig","https://pbs.twimg.com/media/HXZgWD8bUAAP46M.jpg?name=orig","https://pbs.twimg.com/media/HXZgWD3aMAADZ-0.jpg?name=orig","https://pbs.twimg.com/media/HXZgWDyagAAqZLy.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122993645234311502","l":[],"ln":[],"t":["美联储","通胀","原油能源","AI科技","关税贸易"],"lk":11,"rt":2,"rp":5,"vw":3185},{"id":"2122993272226226658","h":"bbcchinese","ts":1794996014,"zh":"美国时隔26年失去麻疹消除状态，今年病例达5400例、死亡10人，创1990年代以来新高。“疫苗怀疑论”持续遭到质疑。","en":"美国时隔26年失去麻疹消除状态，今年病例达5400例、死亡10人，创1990年代以来新高。“疫苗怀疑论”持续遭到质疑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122993272226226658","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4jn1xiy","d":"bbc.in"}],"t":[],"lk":2,"rt":0,"rp":1,"vw":2884},{"id":"2122991800063521226","h":"yijiangren","ts":1794995663,"zh":"目前全服第三\n欢迎成为500个创世中的一员\n我们群友还挺感兴趣的\n@togetherdotfun 什么时候出来简体中文\n大家都在问","en":"目前全服第三\n欢迎 义气和老黄人格魅力的因素吧\n问题是，到现在这些良率问题并没有完全解决，老黄不在了，大家以后在商言商，对继任者还会讲江湖义气吗？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2122988864881250618","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":414},{"id":"2122988418233974860","h":"cnfinancewatch","ts":1794994856,"zh":"#资金面\nARK方面，最新能核到的公开交易仍是周一（11月16日）。两只及以上基金同买的主要是这几只： #太空探索科技 $SPCX 获ARKK与ARKW同买，合计约5190万美元，金额最大； $XYZ 获ARKK与ARKW同买，合计约2310万美元； #Shopify $SHOP 获ARKK、ARKW与ARKF三只基金同买，合计约1650万美元； $LUNR 获ARKX与ARKQ同买，合计约390万美元。同一天ARKK与ARKW合计卖出约8480万美元的英伟达。这些同买标的的位置都不在突破准备或箱底右侧： $SPCX 周二涨3.16%收到141.70，刚回到20日均线141.27附近，仍在区间47%； $XYZ 和 $SHOP 五日继续回撤，先观察。\n带方向的期权里，没有特别干净的多头共振。 #苹果 最大Call贴近现价、量仓比18.41、Call持仓增仓，但Put持仓同步增加，不能算干净。 #梯瓦制药 P/C成交比0.29、持仓比0.28，多单占优，但最大Call行权价31距现价远了27%，量仓比只有0.61，Call持仓还减了0.3%。 #火箭实验室 $RKLB 最大Call行权价60，量仓比1.56，Call持仓增仓7.0%，方向偏多，可是行权价离现价55.05还有约9%，股价又在区间中部。 $AGX 是Call持仓增仓28.9%、Put持仓减仓13.7%，方向清楚，但事件本身偏谨慎，股价20日跌16%，也不适合当作买点。\n#期货\n周二附近的持仓变化是：标普迷你OI增约11.0万手、量比1.01，纳指迷你OI增约1.76万手、量比1.13，罗素迷你OI增约1.22万手、量比0.88，OI在增加但量能未明确确认，暂不定性。30年期美债价涨OI降约4.78万手，属空头回补。原油价跌OI降约1.38万手，属多头离场；黄金、铜、白银同样是价跌OI降，黄金和铜的量能口径还降了级，先按多头离场看、量能不可完全核对。比特币期货价涨OI降，属空头回补。今天盘前期指只是高开后收窄，原油现价约83.99、黄金期货约3777，继续偏弱，还看不到新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨8.25%、 $FIW 涨7.56%、 $PHO 涨7.24%、 $AGNG 涨5.39%、 $ITB 涨5.05%、 $IHI 涨4.92%、 $IHE 涨4.77%、 $XLP 涨4.23%、 $XLU 涨3.68%、 $KIE 涨3.09%。5日窗口几乎只剩 $XLE 涨1.85%、 $XLP 涨0.47%还在正值。能源是典型的仅5日脉冲，20日仍跌6.78%，慎追。必选消费是目前唯一还算双窗口同现的大类，但美股 $XLP 距20日高只差2.21%，5日涨幅已经缩到0.47%；公用事业昨天还在双窗口，今天5日已经翻到跌0.71%，变成仅20日。A股这边以今天收盘计，消费50ETF涨10.90%、消费ETF涨7.61%、酒ETF涨7.58%、银行ETF涨6.03%，消费和银行都是双窗口同现，而且已经走到20日区间90%以上，映射还在，只是位置高了，不追。住宅建筑是仅20日： $ITB 20日涨5.05%，但5日跌4.64%，距20日高11.66%；A股房地产ETF20日跌9.18%，映射没有启动。医疗器械和制药是仅20日， $IHI 5日跌1.95%，距20日高7.13%，量比只有0.58，等放量；A股纳指生物科技ETF20日涨2.63%、5日跌5.03%，对得不齐。半导体现状仍是双窗口都弱， $SOXX 20日跌15.13%、5日跌3.50%；A股芯片ETF今天收涨约2.3%，只是超跌反弹，20日仍跌7%左右，不构成共振。\n#三个方向\n一是 #必选消费 ，中美双窗口同现，但美股已经走在区间上沿，只作为防守框架，不在这里追高开仓。二是 #大盘消费科技龙头 ，只认 #苹果 这种低波动、仍靠近前高的品种，期权方向这轮不如昨天干净，仓位继续克制。三是 #制药与医疗器械 观察， $IHE 20日涨4.77%、距20日高3.58%， $IHI 还在回调， $TEVA 有FDA加分但位置不到，都不追。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.26失效，半仓。\n #梯瓦制药 $TEVA ，区间中上部，距20日高4.58%，FDA居家适应症和偏多的P/C是加分项，但位置不够突破，放量站上44.57再看，跌破周线十日均线41.52失效，仅观察。\n #太空探索科技 $SPCX ，箱体中部，位置47%，刚回到20日均线附近，ARK两只基金同买还在。站上均线后还要看能否放量离开中部，跌破周一低点135失效，仅观察。\n #Nutex Health $NUTX ，箱底，位置14%，周二长下影收阳，特别股息和双重上市是事件，但没有期权和机构持仓核验，不进只做。放量站上186.26（周线二十日均线）再看，跌破166.08失效，仅观察。\n #HubSpot $HUBS ，距颈线约26%，内部人买入属实，但周二中阴把涨幅吐掉，不构成突破准备。放量站上217.94再看，跌破188.25失效，仅观察。\n #菲利普斯66 $PSX ，箱体下部，位置30%，五日还在反弹，但周二已转弱，距20日均线267.63还有距离，仅观察，跌破近期低点253.74失效。\n#小盘阿尔法\n本期不选。 $NUTX 市值约11.6亿美元，位置是箱底，但事件只是特别股息，期权和13F都没有核到，先不选。 $HUBS 市值约113亿美元，不算小盘，位置也还不够。","en":"#资金面\nARK方面，最新能核到的公开交易仍是周一（11月16日）。两只及以上基金同买的主要是这几只： #太空探索科技 $SPCX 获ARKK与ARKW同买，合计约5190万美元，金额最大； $XYZ 获ARKK与ARKW同买，合计约2310万美元； #Shopify $SHOP 获ARKK、ARKW与ARKF三只基金同买，合计约1650万美元； $LUNR 获ARKX与ARKQ同买，合计约390万美元。同一天ARKK与ARKW合计卖出约8480万美元的英伟达。这些同买标的的位置都不在突破准备或箱底右侧： $SPCX 周二涨3.16%收到141.70，刚回到20日均线141.27附近，仍在区间47%； $XYZ 和 $SHOP 五日继续回撤，先观察。\n带方向的期权里，没有特别干净的多头共振。 #苹果 最大Call贴近现价、量仓比18.41、Call持仓增仓，但Put持仓同步增加，不能算干净。 #梯瓦制药 P/C成交比0.29、持仓比0.28，多单占优，但最大Call行权价31距现价远了27%，量仓比只有0.61，Call持仓还减了0.3%。 #火箭实验室 $RKLB 最大Call行权价60，量仓比1.56，Call持仓增仓7.0%，方向偏多，可是行权价离现价55.05还有约9%，股价又在区间中部。 $AGX 是Call持仓增仓28.9%、Put持仓减仓13.7%，方向清楚，但事件本身偏谨慎，股价20日跌16%，也不适合当作买点。\n#期货\n周二附近的持仓变化是：标普迷你OI增约11.0万手、量比1.01，纳指迷你OI增约1.76万手、量比1.13，罗素迷你OI增约1.22万手、量比0.88，OI在增加但量能未明确确认，暂不定性。30年期美债价涨OI降约4.78万手，属空头回补。原油价跌OI降约1.38万手，属多头离场；黄金、铜、白银同样是价跌OI降，黄金和铜的量能口径还降了级，先按多头离场看、量能不可完全核对。比特币期货价涨OI降，属空头回补。今天盘前期指只是高开后收窄，原油现价约83.99、黄金期货约3777，继续偏弱，还看不到新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨8.25%、 $FIW 涨7.56%、 $PHO 涨7.24%、 $AGNG 涨5.39%、 $ITB 涨5.05%、 $IHI 涨4.92%、 $IHE 涨4.77%、 $XLP 涨4.23%、 $XLU 涨3.68%、 $KIE 涨3.09%。5日窗口几乎只剩 $XLE 涨1.85%、 $XLP 涨0.47%还在正值。能源是典型的仅5日脉冲，20日仍跌6.78%，慎追。必选消费是目前唯一还算双窗口同现的大类，但美股 $XLP 距20日高只差2.21%，5日涨幅已经缩到0.47%；公用事业昨天还在双窗口，今天5日已经翻到跌0.71%，变成仅20日。A股这边以今天收盘计，消费50ETF涨10.90%、消费ETF涨7.61%、酒ETF涨7.58%、银行ETF涨6.03%，消费和银行都是双窗口同现，而且已经走到20日区间90%以上，映射还在，只是位置高了，不追。住宅建筑是仅20日： $ITB 20日涨5.05%，但5日跌4.64%，距20日高11.66%；A股房地产ETF20日跌9.18%，映射没有启动。医疗器械和制药是仅20日， $IHI 5日跌1.95%，距20日高7.13%，量比只有0.58，等放量；A股纳指生物科技ETF20日涨2.63%、5日跌5.03%，对得不齐。半导体现状仍是双窗口都弱， $SOXX 20日跌15.13%、5日跌3.50%；A股芯片ETF今天收涨约2.3%，只是超跌反弹，20日仍跌7%左右，不构成共振。\n#三个方向\n一是 #必选消费 ，中美双窗口同现，但美股已经走在区间上沿，只作为防守框架，不在这里追高开仓。二是 #大盘消费科技龙头 ，只认 #苹果 这种低波动、仍靠近前高的品种，期权方向这轮不如昨天干净，仓位继续克制。三是 #制药与医疗器械 观察， $IHE 20日涨4.77%、距20日高3.58%， $IHI 还在回调， $TEVA 有FDA加分但位置不到，都不追。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.26失效，半仓。\n #梯瓦制药 $TEVA ，区间中上部，距20日高4.58%，FDA居家适应症和偏多的P/C是加分项，但位置不够突破，放量站上44.57再看，跌破周线十日均线41.52失效，仅观察。\n #太空探索科技 $SPCX ，箱体中部，位置47%，刚回到20日均线附近，ARK两只基金同买还在。站上均线后还要看能否放量离开中部，跌破周一低点135失效，仅观察。\n #Nutex Health $NUTX ，箱底，位置14%，周二长下影收阳，特别股息和双重上市是事件，但没有期权和机构持仓核验，不进只做。放量站上186.26（周线二十日均线）再看，跌破166.08失效，仅观察。\n #HubSpot $HUBS ，距颈线约26%，内部人买入属实，但周二中阴把涨幅吐掉，不构成突破准备。放量站上217.94再看，跌破188.25失效，仅观察。\n #菲利普斯66 $PSX ，箱体下部，位置30%，五日还在反弹，但周二已转弱，距20日均线267.63还有距离，仅观察，跌破近期低点253.74失效。\n#小盘阿尔法\n本期不选。 $NUTX 市值约11.6亿美元，位置是箱底，但事件只是特别股息，期权和13F都没有核到，先不选。 $HUBS 市值约113亿美元，不算小盘，位置也还不够。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122988418233974860","l":[],"ln":[],"t":["美股","原油能源","AI科技","黄金"],"lk":0,"rt":0,"rp":0,"vw":261},{"id":"2122988411543785979","h":"cnfinancewatch","ts":1794994855,"zh":"美股盘前下午版｜2026年11月18日 周三 北京时间15:05\n#结论\n今日大类只做两个：必选消费的低波动防守，和大盘消费科技龙头。只做名单仍只给一只，第二、第三个位置空着。候选里能同时过技术位置的，还是靠近前高的苹果；医药事件票和箱底小盘都还没有走到可以开仓的位置。\n #苹果 $AAPL 周二收351.91，跌0.25%，距20日高也是52周高360.83还有2.53%，处在近20日区间75%的位置。比周一的2.28%又远了一点，已经略宽于通常的2%门槛，仍按回撤后的突破准备来看，不突破不进。期权最大Call行权价355，距现价只差0.63%，量仓比18.41，Call持仓增仓4.6%，但这边Put持仓也增了5.8%，做空余额环比升10%，算不上干净的多头共振。卖方目标价均值343.2低于现价，近四周EPS下修16家、上修9家，只给半仓。\n明确不做：半导体和AI硬件先看今夜开盘再定价，不追盘后跳空。 #英伟达 $NVDA 周二收155.46，仍在20日区间底部附近，位置大约只有9%；已经大涨或五日涨幅过大的品种；只有股息、没有资金共振的票；ARK同买但还在箱体中下部、未见右侧的，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指高开幅度已经收窄。纳指期货27242，较周二结算约27075涨约0.62%；标普期货7379，涨约0.28%；道指期货50865，涨约0.10%。早盘亚洲时段纳指期货一度更高，随后回吐了大半。周二美股继续下跌，纳指收24328.38，跌0.74%；标普7340.53，跌1.03%；道指50759.42，跌1.64%，都是四连跌。VIX升至25.46。A股今天收盘，上证3587.83涨0.09%，创业板2311.62涨0.85%，科创50收1247.99，涨2.19%。日经收59024点，涨0.28%；韩国综指5067点，涨1.99%，守住5000点。\n #英伟达 周二盘后交出换帅后第一份三季报：营收1158亿美元，同比增103%，高于市场约1089亿美元的预期；数据中心1076亿美元；非GAAP每股收益2.68美元，高于约2.47美元的预期。第四季度营收指引中值1300亿美元，上下3%，也高于华尔街预期。毛利率指引下调到71%到72%，公司把这说成低点，并且指引不含中国数据中心计算收入。董事会主席表态不打算让黄仁勋复职，黄本人说如果董事会认为符合利益，愿意回归。他已同意出席参议院银行委员会听证会，日期尚未敲定。浑水在财报前宣布做空，质疑前高管关联及对华销售，身份和细节仍待证实。盘后股价一度到约162.56，涨约4.6%，随后有所回吐。截稿时尚未取得完整的盘前报价。\n今晚美股盘前还有 #劳氏 $LOW 、 $TJX 出季报，盘后是 $PANW 。明天盘前有 #沃尔玛 $WMT 和 #阿里巴巴 $BABA 。Anthropic计划周三定价、周四以 $ANT 在纳斯达克挂牌。WTI原油现报约83.99美元，较周二收盘86.01再跌约2.4%。10年期美债收益率周二收5.103%，美元指数约103.70，仍靠近近期高位。 #家得宝 $HD 周二收339.01，跌2.45%； #迪士尼 $DIS 收116.94，跌1.48%，财报后的回吐在常规交易里落地了。\n高权重事件里， #梯瓦制药 $TEVA 的IGALMI已获FDA批准，可用于部分成人急性激越的居家治疗，事件权重大，期权P/C成交比0.29也偏多。但周二只收42.62，涨0.12%，距20日高44.57还有4.58%，处在区间64%，位置不够突破，只观察。 #Nutex Health $NUTX 宣布每股2美元特别股息，并获纳斯达克双重上市批准，市值约11.6亿美元，周二收174.51，涨2.83%，处在近20日区间14%，箱底有长下影，但事件落在股息档，期权和13F都没有核到，不进只做。 #HubSpot $HUBS 内部人Halligan（董事）11月13日约500万美元买入22985股，均价约217.44美元，16日披露；但周二倒跌6.76%，收216.30，距颈线还有约26%，只观察。\n#研报面\n #苹果 卖方均值目标价343.2美元，买入15家、持有8家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。 #梯瓦制药 均值目标价51.53美元，11家全是买入，近四周EPS下修6家、上修5家，略偏下修。 #HubSpot 均值230.5美元，买入从13家降到6家，持有19家，近四周EPS上修24家、下修15家，卖方立场在转弱。","en":"美股盘前下午版｜2026年11月18日 周三 北京时间15:05\n#结论\n今日大类只做两个：必选消费的低波动防守，和大盘消费科技龙头。只做名单仍只给一只，第二、第三个位置空着。候选里能同时过技术位置的，还是靠近前高的苹果；医药事件票和箱底小盘都还没有走到可以开仓的位置。\n #苹果 $AAPL 周二收351.91，跌0.25%，距20日高也是52周高360.83还有2.53%，处在近20日区间75%的位置。比周一的2.28%又远了一点，已经略宽于通常的2%门槛，仍按回撤后的突破准备来看，不突破不进。期权最大Call行权价355，距现价只差0.63%，量仓比18.41，Call持仓增仓4.6%，但这边Put持仓也增了5.8%，做空余额环比升10%，算不上干净的多头共振。卖方目标价均值343.2低于现价，近四周EPS下修16家、上修9家，只给半仓。\n明确不做：半导体和AI硬件先看今夜开盘再定价，不追盘后跳空。 #英伟达 $NVDA 周二收155.46，仍在20日区间底部附近，位置大约只有9%；已经大涨或五日涨幅过大的品种；只有股息、没有资金共振的票；ARK同买但还在箱体中下部、未见右侧的，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指高开幅度已经收窄。纳指期货27242，较周二结算约27075涨约0.62%；标普期货7379，涨约0.28%；道指期货50865，涨约0.10%。早盘亚洲时段纳指期货一度更高，随后回吐了大半。周二美股继续下跌，纳指收24328.38，跌0.74%；标普7340.53，跌1.03%；道指50759.42，跌1.64%，都是四连跌。VIX升至25.46。A股今天收盘，上证3587.83涨0.09%，创业板2311.62涨0.85%，科创50收1247.99，涨2.19%。日经收59024点，涨0.28%；韩国综指5067点，涨1.99%，守住5000点。\n #英伟达 周二盘后交出换帅后第一份三季报：营收1158亿美元，同比增103%，高于市场约1089亿美元的预期；数据中心1076亿 te 出售算力，后者是一家受到美国司法部与商务部就 Megaspeed 调查发布联合声明关注的新云服务商，因涉嫌向中国走私芯片。\n据知情人士透露，花旗集团和摩根大通在融资文件中加入了新的措辞，针对贝恩资本旗下的 Bridge Data Centres 寻求的一笔可能增至 66 亿美元的贷款，规定由借款人负责遵守芯片准入限制。","en":"彭博：美国银行寻求在向贝恩数据中心公司贷款中加入芯片限制条款\n美国银行花旗集团和摩根大通在一笔潜在贷款的融资文件中新增条款，要求借款方负责遵守芯片获取限制。\n美国银行要求获得额外保护，以扩大对一家数据中心运营商的融资，该运营商此前曾向 Megaspeed International Pte 出售算力，后者是一家受到美国司法部与商务部就 Megaspeed 调查发布联合声明关注的新云服务商，因涉嫌向中国走私芯片。\n据知情人士透露，花旗集团和摩根大通在融资文件中加入了新的措辞，针对贝恩资本旗下的 Bridge Data Centres 寻求的一笔可能增至 66 亿美元的贷款，规定由借款人负责遵守芯片准入限制。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXZX-Lwa8AAF1ob.png?name=orig"],"u":"https://x.com/dmjk001/status/2122981376454770752","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":930},{"id":"2122980923138552174","h":"cnfinancewatch","ts":1794993069,"zh":"A股：\n截至14:35，上证跌0.15%报3579.33点，深证跌0.10%报10628.37点，创业板翻红涨0.35%报2300.27点，科创50涨1.80%报1243.15点，是今天最清楚的主线。两市成交约1.24万亿元，上涨约1144只、下跌约4124只，涨停40只、跌停约38只。早盘给英伟达财报定价的高开，午后只在半导体制造、设备和算力租赁上留下差价；银行和电力走平，小家电和短剧继续兑现。盘面不是全面反攻，更像科技内部的事件反弹，外加白电龙头自己创新高。美股指期货已经把早盘涨幅吐掉大半，黄金和原油继续回落，尾盘不宜把科创50的反弹理解成风险偏好已经修复。\n#消息面\n隔夜英伟达财报营收和指引都高于预期，常规交易仍收155.46美元、跌0.44%，盘后一度涨约4%至5%。浑水在财报前宣布做空的扰动还在，四季度毛利率指引下调到71%至72%，且指引不含中国数据中心计算收入，开盘并没有把这些折干净。盘中三星电机宣布与英伟达加强合作，范围扩到MLCC；国内有媒体转述\n#中际旭创 $300308 订单能见度延伸到2028年、 #新易盛 $300502\n的1.6T持续放量，但两只股票分别只涨0.12%、跌1.21%，仍在20日低位附近，消息盖不住位置。11月17日工信部批准半导体设备与零部件质量管理体系行业标准，对已经过认证的设备商更有利，帮了制造和设备的忙。\n风格上，小家电和短剧继续出清。 #九阳股份 $002242 走出天地板，午后跌9.99%，换手超过20%，主力净流出约7.5亿元；\n#长虹美菱 $000521 早盘一字后炸板，现只涨0.21%。 #文投控股 $600715 、 #横店影视 $603103 跌停，\n#凯撒文化 $002425 跌9.89%。证监会午间回应，网传“要求基金公司上报全部产品AI敞口”不实；另有“国常会表态不再频繁救市”的传言也被澄清为谣言。北向资金当日净流入仍不披露。\n#研报面\n今天更贴盘面的是华龙证券电子行业三季报综述，认为半导体自主可控加速兑现；万联证券称三季度基金持仓向IT基础设施、软件和网络安全倾斜。这些报告解释了为什么设备和制造能扛住，但盖不住半导体ETF\n5日、20日仍在下跌。太平洋今天继续买入 #晶晨股份 $688099 、 #全志科技 $300458\n，逻辑是端侧AI，只作观察。中银证券点评10月社零同比只增0.4%、增幅回落，对必选消费是提醒，不是推翻。17日华鑫对 #特锐德\n$300001 、 #明阳电气 $301291 的买入，以及太平洋对检测设备和光刻胶的覆盖，仍当作事件背景。\n#热榜\n东财人气榜前排是 #九阳股份 $002242 、 #华胜天成 $600410 、 #常山北明 $000158 、 #有研新材 $600206\n、 #中际旭创 $300308 、 #长虹美菱 $000521 、 #北纬科技 $002148 、 #华东重机 $002685\n。九阳和美菱还在前十，已经是杀估值而不是进攻；华胜天成、华东重机、卡莱特是算力租赁连板的拥挤端。 #沪电股份 $002463\n升到前二十附近，和PCB反弹同向，但20日仍跌7%以上，热度不等于位置修复。同花顺热榜本档数据缺失。\n#资金面\n东财口径，截至约14:35，沪市主力净流出约34.4亿元，深市净流出约47.4亿元，两市合计约流出82亿元；科创50却净流入约37.1亿元，资金明显在指数内部搬家。行业上电子净流入约95亿元，半导体约43亿元，元件约43亿元，印制电路板约42亿元，通信约34亿元，半导体设备约18.6亿元，集成电路制造约11亿元。流出端是有色金属约38.5亿元、医药约32.4亿元、银行约23.5亿元、传媒约22.7亿元、电力设备约17.2亿元、家用电器约13.7亿元。个股上\n#沪电股份 $002463 净流入约11.9亿元， #寒武纪 $688256 、 #华虹公司 $688347 、 #华工科技 $000988\n、 #工业富联 $601138 、 #北方华创 $002371 承接明显； #紫金矿业 $601899 、 #九阳股份 $002242 、\n#有研新材 $600206 则在流出前排，有研新材涨5.4%却净流出约5.8亿元，是高位换手。南向额度显示沪、深各用满420亿元上限，只反映额度状态。融资余额仍是截至11月17日再减186.04亿元至22097.71亿元，没有盘中新数。跌停池接口只返回约38只的数量、未给出完整名单，跌停家数按此口径标注。","en":"A股：\n截至14:35，上证跌0.15%报3579.33点，深证跌0.10%报10628.37点，创业板翻红涨0.35%报2300.27点，科创50涨1.80%报1243.15点，是今天最清楚的主线。两市成交约1.24万亿元，上涨约1144只、下跌约4124只，涨停40只、跌停约38只。早盘给英伟达财报定价的高开，午后只在半导体制造、设备和算力租赁上留下差价；银行和电力走平，小家电和短剧继续兑现。盘面不是全面反攻，更像科技内部的事件反弹，外加白电龙头自己创新高。美股指期货已经把早盘涨幅吐掉大半，黄金和原油继续回落，尾盘不宜把科创50的反弹理解成风险偏好已经修复。\n#消息面\n隔夜英伟达财报营收和指引都高于预期，常规交易仍收155.46美元、跌0.44%，盘后一度涨约4%至5%。浑水在财报前宣布做空的扰动还在，四季度毛利率指引下调到71%至72%，且指引不含中国数据中心计算收入，开盘并没有把这些折干净。盘中三星电机宣布与英伟达加强合作，范围扩到MLCC；国内有媒体转述\n#中际旭创 $300308 订单能见度延伸到2028年、 #新易盛 $300502\n的1.6T持续放量，但两只股票分别只涨0.12%、跌1.21%，仍在20日低位附近，消息盖不住位置。11月17日工信部批准半导体设备与零部件质量管理体系行业标准，对已经过认证的设备商更有利，帮了制造和设备的忙。\n风格上，小家电和短剧继续出清。 #九阳股份 $002242 走出天地板，午后跌9.99%，换手超过20%，主力净流出约7.5亿元；\n#长虹美菱 $000521 早盘一字后炸板，现只涨0.21%。 #文投控股 $600715 、 #横店影视 $603103 跌停，\n#凯撒文化 $002425 跌9.89%。证监会午间回应，网传“要求基金公司上报全部产品AI敞口”不实；另有“国常会表态不再频繁救市”的传言也被澄清为谣言。北向资金当日净流入仍不披露。\n#研报面\n今天更贴盘面的是华龙证券电子行业三季报综述，认为半导体自主可控加速兑现；万联证券称三季度基金持仓向IT基础设施、软件和网络安全倾斜。这些报告解释了为什么设备和制造能扛住，但盖不住半导体ETF\n5日、20日仍在下跌。太平洋今天继续买入 #晶晨股份 $688099 、 #全志科技 $300458\n，逻辑是端侧AI，只作观察。中银证券点评10月社零同比只增0.4%、增幅回落，对必选消费是提醒，不是推翻。17日华鑫对 #特锐德\n$300001 、 #明阳电气 $301291 的买入，以及太平洋对检测设备和光刻胶的覆盖，仍当作事件背景。\n#热榜\n东财人气榜前排是 #九阳股份 $002242 、 #华胜天成 $600410 、 #常山北明 $000158 、 #有研新材 $600206\n、 #中际旭创 $300308 、 #长虹美菱 $000521 、 #北纬科技 $002148 、 #华东重机 $002685\n。九阳和美菱还在前十，已经是杀估值而不是进攻；华胜天成、华东重机、卡莱特是算力租赁连板的拥挤端。 #沪电股份 $002463\n升到前二十附近，和PCB反弹同向，但20日仍跌7%以上，热度不等于位置修复。同花顺热榜本档数据缺失。\n#资金面\n东财口径，截至约14:35，沪市主力净流出约34.4亿元，深市净流出约47.4亿元，两市合计约流出82亿元；科创50却净流入约37.1亿元，资金明显在指数内部搬家。行业上电子净流入约95亿元，半导体约43亿元，元件约43亿元，印制电路板约42亿元，通信约34亿元，半导体设备约18.6亿元，集成电路制造约11亿元。流出端是有色金属约38.5亿元、医药约32.4亿元、银行约23.5亿元、传媒约22.7亿元、电力设备约17.2亿元、家用电器约13.7亿元。个股上\n#沪电股份 $002463 净流入约11.9亿元， #寒武纪 $688256 、 #华虹公司 $688347 、 #华工科技 $000988\n、 #工业富联 $601138 、 #北方华创 $002371 承接明显； #紫金矿业 $601899 、 #九阳股份 $002242 、\n#有研新材 $600206 则在流出前排，有研新材涨5.4%却净流出约5.8亿元，是高位换手。南向额度显示沪、深各用满420亿元上限，只反映额度状态。融资余额仍是截至11月17日再减186.04亿元至22097.71亿元，没有盘中新数。跌停池接口只返回约38只的数量、未给出完整名单，跌停家数按此口径标注。","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/cnfinancewatch/status/2122980923138552174","l":[],"ln":[],"t":["美股","A股港股","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":1,"vw":875},{"id":"2122980405540180224","h":"SYU77996","ts":1794992946,"zh":"#三个方向\n一是 #必选消费 ，中美双窗口同现，但美股已经走在区间上沿，只作为防守框架，不在这里追高开仓。二是 #大盘消费科技龙头 ，只认 #苹果\n这种低波动、仍靠近前高的品种，期权方向这轮不如昨天干净，仓位继续克制。三是 #制药与医疗器械 观察， $IHE\n20日涨4.77%、距20日高3.58%， $IHI 还在回调， $TEVA 有FDA加分但位置不到，都不追。\n#六只个股\n #苹果 $AAPL ，回撤后的突破准备，站上360.83放量触发，跌破20日均线347.26失效，半仓。\n #梯瓦制药 $TEVA ，区间中上部，距20日高4.58%，FDA居家适应症和偏多的P/C是加分项，但位置不够突破，放量站上44.57再看，跌破周线十日均线41.52失效，仅观察。\n #太空探索科技 $SPCX ，箱体中部，位置47%，刚回到20日均线附近，ARK两只基金同买还在。站上均线后还要看能否放量离开中部，跌破周一低点135失效，仅观察。\n #Nutex Health $NUTX\n，箱底，位置14%，周二长下影收阳，特别股息和双重上市是事件，但没有期权和机构持仓核验，不进只做。放量站上186.26（周线二十日均线）再看，跌破166.08失效，仅观察。\n #HubSpot $HUBS ，距颈线约26%，内部人买入属实，但周二中阴把涨幅吐掉，不构成突破准备。放量站上217.94再看，跌破188.25失效，仅观察。\n #菲利普斯66 $PSX ，箱体下部，位置30%，五日还在反弹，但周二已转弱，距20日均线267.63还有距离，仅观察，跌破近期低点253.74失效。\n#小盘阿尔法\n本期不选。 $NUTX 市值约11.6亿美元，位置是箱底，但事件只是特别股息，期权和13F都没有核到，先不选。 $HUBS\n市值约113亿美元，不算小盘，位置也还不够。\n#操作提示\n英伟达的数字过了，但完整日线还没有走出来，今夜开盘先看跳空能不能站住，不提前把AI硬件改回主方向。苹果仍是贴着前高的半仓突破单，不突破就不进，跌破失效位当天走。期指涨幅已经比早盘收窄，若开盘重新转弱，这张单继续推迟。箱底和中部的\n$NUTX 、 $SPCX 只看到企稳或回到均线，不猜右侧。今晚还有零售相关财报，先看完再动手。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#三个方向\n一是 #必选消费 ，中美双窗口同现，但美股已经走在区间上沿，只作为防守框架，不在这里追高开仓。二是 #大盘消费科技龙头 ，只认 #苹果\n这种低波动、仍靠近前高的品种，期权方向这轮不如昨天干净，仓位继续克制。三是 #制药与医疗器械 观察， $IHE\n20日涨4.77%、距20日高3.58%， $IHI 还在回调， $TEVA 有FDA加分 报前后全部清仓，订阅频道已经提示）：\nCircle的北极星指标是稳定币的发行量，T-Bills收益率和发行量从22年开始显著负相关，因为T-bill收益率更高吸引了资金去买债而不是持有不直接分发收益的稳定币（这也是Clarity Act的核心争议点，如果让稳定币变相发收益，被Genius Act规定的不能派息的限制就被突破了）。\nCircle这个公司如果既没有收益发放的吸引力去增加TVL，支付上又没有类似Tether有灰产这种强需求的长期（所谓Agent支付，x402似乎还是空中楼阁）；那么USDC的稳定币发行量是很难上去的，Circle的业绩是很难上去的，三季报只能把Arc收入提前计价。\n那么什么时候我会考虑买回来呢？\n- 清晰法案的条款有利于Circle派发激励；\n- USDC真的找到支付或者类似DeFi的GTM新场景\n- Arc大获成功\n以上三个出现至少一个我才考虑买回，否则价格再低也不抄底，不以价格论买点。","en":"为什么我卖了Circle（大概在财报前后全部清仓，订阅频道已经提示）：\nCircle的北极星指标是稳定币的发行量，T-Bills收益率和发行量从22年开始显著负相关，因为T-bill收益率更高吸引了资金去买债而不是持有不直接分发收益的稳定币（这也是Clarity Act的核心争议点，如果让稳定币变相发收益，被Genius Act规定的不能派息的限制就被突破了）。\nCircle这个公司如果既没有收益发放的吸引力去增加TVL，支付上又没有类似Tether有灰产这种强需求的长期（所谓Agent支付，x402似乎还是空中楼阁）；那么USDC的稳定币发行量是很难上去的，Circle的业绩是很难上去的，三季报只能把Arc收入提前计价。\n那么什么时候我会考虑买回来呢？\n- 清晰法案的条款有利于Circle派发激励；\n- USDC真的找到支付或者类似DeFi的GTM新场景\n- Arc大获成功\n以上三个出现至少一个我才考虑买回，否则价格再低也不抄底，不以价格论买点。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXYpOBRa0AAhr51.jpg?name=orig"],"u":"https://x.com/xingpt/status/2122934039925670201","l":[],"ln":[],"t":["财报"],"lk":1,"rt":0,"rp":0,"vw":140},{"id":"2122932822931575289","h":"nytchinese","ts":1794981601,"zh":"间谍丑闻、贸易失衡：习近平的APEC“高光”会否蒙尘？习近平希望通过峰会展示中国的科技雄心，证明中国的增长可以惠及世界。但黄仁勋丑闻和对北京的间谍指控可能会转移外界的注意力，中国也需要缓解其他国家的贸易担忧。","en":"间谍丑闻、贸易失衡：习近平的APEC“高光”会否蒙尘？习近平希望通过峰会展示中国的科技雄心，证明中国的增长可以惠及世界。但黄仁勋丑闻和对北京的间谍指控可能会转移外界的注意力，中国也需要缓解其他国家的贸易担忧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2122932822931575289","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/china/20261118/xi-apec/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["关税贸易"],"lk":0,"rt":1,"rp":0,"vw":701},{"id":"2122931447434756480","h":"tig88411109","ts":1794981273,"zh":"你问我支持不支持，我肯定支持。因为我知道英伟达可能对于黄仁勋的重要性，在他自己所有的亲人之上，宛如长子。\n真回来，反而是风险。我独家给你答疑解惑\n但是任何市场小作文或者一厢情愿他能回来，都是不切实际。首先法律也不容许，股东没有投票权来换CEO，要换就要现在的董事会同意，但是大概率不可能。\n因为现在董事会里面独立董事最怕就是连带的法律责任，让老黄再回来，不谈间谍，就是内部乱搞关系，他自己今天离职，明天你们又让他回来，说明内控失灵，一定引起重大连带诉讼，都要这个独董个人承担\n而且老黄位置坐长了，内部一定不是“一个声音”，现在真回来反而加速内部割裂。现在已经开始公司的估值和故事，往AI核心企业的二次转型，从创始人邪修到系统制度化垄断王者的路子上走，估值降低很正常，只要能未来2/3年利润增长，再长期，谁也看不到。如果再强势回归，这种个人失控和治理风险挥之不去，反而估值混乱。\n能不能回，当然可能。只要3%的股东投票把董事会目前2/3董事换一遍，虽然老黄自己有3.5%可以提名，但2/3以上股东的票数门槛，都是机构投资者，这些机构重要的是合规底线，现在财报没问题，短期基本面也看不到问题，有什么理由换董事会？机构投资者不会冒自己风险，为一个“上下级不正常关系和涉间谍活动”的老黄砸自己饭碗。\n而且真的投票权大战，所有内部信息都摊开，内部割裂，外部小作文，真损失第一是黄仁勋自己1400亿的股票市值，他会干么，另立山头？\n所以真正的投资可能的路线，就是祈祷黄仁勋好好反思享受家人之乐，配合国安调查，公司选出新的CEO行业大佬，做好切割和赔偿和解，估值没了创始人溢价，至少业绩和情绪平稳，回到我说的估值区间。","en":"你问我支持不支持，我肯定支持。因为我知道英伟达可能对于黄仁勋的重要性，在他自己所有的亲人之上，宛如长子。\n真回来，反而是风险。我独家给你答疑解惑\n但是任何市场小作文或者一厢情愿他能回来，都是不切实际。首先法律也不容许，股东没有投票权来换CEO，要换就要现在的董事会同意，但是大概率不可能。\n因为现在董事会里面独立董事最怕就是连带的法律责任，让老黄再回来，不谈间谍，就是内部乱搞关系，他自己今天离职，明天你们又让他回来，说明内控失灵，一定引起重大连带诉讼，都要这个独董个人承担\n而且老黄位置坐长了，内部一定不是“一个声音”，现在真回来反而加速内部割裂。现在已经开始公司的估值和故事，往AI核心企业的二次转型，从创始人邪修到系统制度化垄断王者的路子上走，估值降低很正常，只要能未来2/3年利润增长，再长期，谁也看不到。如果再强势回归，这种个人失控和治理风险挥之不去，反而估值混乱。\n能不能回，当然可能。只要3%的股东投票把董事会目前2/3董事换一遍，虽然老黄自己有3.5%可以提名，但2/3以上股东的票数门槛，都是机构投资者，这些机构重要的是合规底线，现在财报没问题，短期基本面也看不到问题，有什么理由换董事会？机构投资者不会冒自己风险，为一个“上下级不正常关系和涉间谍活动”的老黄砸自己饭碗。\n而且真的投票权大战，所有内部信息都摊开，内部割裂，外部小作文，真损失第一是黄仁勋自己1400亿的股票市值，他会干么，另立山头？\n所以真正的投资可能的路线，就是祈祷黄仁勋好好反思享受家人之乐，配合国安调查，公司选出新的CEO行业大佬，做好切割和赔偿和解，估值没了创始人溢价，至少业绩和情绪平稳，回到我说的估值区间。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tig88411109/status/2122931447434756480","l":[],"ln":[],"t":["AI科技","财报"],"lk":4,"rt":1,"rp":1,"vw":1109},{"id":"2122931202688745687","h":"dmjk001","ts":1794981215,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXYqlv7aMAAyA0Z.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122931202688745687","l":[],"ln":[],"t":[],"lk":2,"rt":1,"rp":0,"vw":1047},{"id":"2122930292835127323","h":"fxtrader","ts":1794980998,"zh":"中国上市公司协会承办的“资本市场辟谣平台”，今日发文辟谣，称近日关于“国常会上有人表态不会再频繁救市了”相关信息为谣言，系编造会议内容、歪曲炒作政策，严重扰乱资本市场预期，影响极其恶劣。","en":"中国上市公司协会承办的“资本市场辟谣平台”，今日发文辟谣，称近日关于“国常会上有人表态不会再频繁救市了”相关信息为谣言，系编造会议内容、歪曲炒作政策，严重扰乱资本市场预期，影响极其恶劣。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXYplDebsAAkt-k.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122930292 大的原罪，本轮AI史诗级泡沫崩塌已成定局！\n市场始终在低估这场离职事件的致命性！坊间流传的芯片出口、私人风波全是烟雾弹，真实内核是权力忌惮。加拿大华裔学者蒋雪琴精准戳破真相：黄仁勋的离职，是行业、资本、地缘权力的联合围剿，且永久禁止回归，绝无翻盘可能。\n纵观全球商业史，从未有第二位企业家，能搭建出如此恐怖的超主权产业体系！黄仁勋一手缔造的英伟达生态，早已超越单一企业范畴：加州芯片设计、荷兰光刻机设备、东南亚产能增值、中国终端组装，串联起全球最精密的芯片供应链。他以个人极致的人脉、公信力与商业手腕，绑定台湾核心产业支柱，维系着全球AI算力的循环运转，这套产业链体量，足以媲美全球第五、第六大经济体GDP，形成独立于传统政治体系的科技商业联盟。\n更致命的是，他掌控着AI行业的生死命脉！独家搭建“芯片售卖+循环融资”的闭环生态，一手托举OpenAI、Anthropic等所有顶级AI巨头的生存根基。不同于依附资本、妥协权力的奥特曼，黄仁勋是纯粹的技术远见者，坚持开放创新、驱动行业迭代，拒绝沦为单一垄断权力的工具。\n正是这份不可替代、无法受控的绝对产业话语权，彻底触碰了顶级强权底线！在当下“劣币上位、能者出局”的畸形行业生态中，强权绝不允许出现游离于管控之外、足以制衡顶级帝国的科技力量。清除黄仁勋，本质是一场权力对科技的降维收割：扼杀个人超级影响力、拆解跨国产业联盟、锁死自主科技迭代空间，彻底将AI行业收归单一权力掌控。\n奥特曼可以被员工与资本迎回，因为他服从垄断规则；黄仁勋永不回归，因为他掌控的是真正的行业命脉与科技主权。随着他彻底离场，维系全球AI融资循环、供应链稳定、产业创新的唯一核心锚点彻底崩塌。\n产业链信任裂痕、合作摩擦激增、融资闭环断裂、技术迭代减速，所有隐患集中爆发！无需漫长等待，短期1-2个月内，叠加Anthropic IPO落地，全球AI超级泡沫将彻底破裂。本轮AI牛市从来不是纯粹的技术牛市，而是黄仁勋个人信用托举的泡沫，人走茶凉，信仰崩塌，AI行业的结构性寒冬，正式开启！\n#黄仁勋 #AI泡沫崩盘 #英伟达 #全球科技格局 #算力周期拐点","en":"华尔街观察｜AI已经捆绑美股纳指合标普，泡沫迎来精准崩盘时刻\n核心暴论：#黄仁勋绝非被动离职，而是被顶级权力定点清除！ 他的永久离场，不是个人风波，而是全球科技权力洗牌的终极信号！当一个企业家构建出媲美主权大国GDP的跨国AI产业链联盟、足以制衡顶级地缘强权时，超强的个人能力、不受束缚的科技话语权，本身就是最大的原罪，本轮AI史诗级泡沫崩塌已成定局！\n市场始终在低估这场离职事件的致命性！坊间流传的芯片出口、私人风波全是烟雾弹，真实内核是权力忌惮。加拿大华裔学者蒋雪琴精准戳破真相：黄仁勋的离职，是行业、资本、地缘权力的联合围剿，且永久禁止回归，绝无翻盘可能。\n纵观全球商业史，从未有第二位企业家，能搭建出如此恐怖的超主权产业体系！黄仁勋一手缔造的英伟达生态，早已超越单一企业范畴：加州芯片设计、荷兰光刻机设备、东南亚产能增值、中国终端组装，串联起全球最精密的芯片供应链。他以个人极致的人脉、公信力与商业手腕，绑定台湾核心产业支柱，维系着全球AI算力的循环运转，这套产业链体量，足以媲美全球第五、第六大经济体GDP，形成独立于传统政治体系的科技商业联盟。\n更致命的是，他掌控着AI行业的生死命脉！独家搭建“芯片售卖+循环融资”的闭环生态，一手托举OpenAI、Anthropic等所有顶级AI巨头的生存根基。不同于依附资本、妥协权力的奥特曼，黄仁勋是纯粹的技术远见者，坚持开放创新、驱动行业迭代，拒绝沦为单一垄断权力的工具。\n正是这份不可替代、无法受控的绝对产业话语权，彻底触碰了顶级强权底线！在当下“劣币上位、能者出局”的畸形行业生态中，强权绝不允许出现游离于管控之外、足以制衡顶级帝国的科技力量。清除黄仁勋，本质是一场权力对科技的降维收割：扼杀个人超级影响力、拆解跨国产业联盟、锁死自主科技迭代空间，彻底将AI行业收归单一权力掌控。\n奥特曼可以被员工与资本迎回，因为他服从垄断规则；黄仁勋永不回归，因为他掌控的是真正的行业命脉与科技主权。随着他彻底离场，维系全球AI融资循环、供应链稳定、产业创新的唯一核心锚点彻底崩塌。\n产业链信任裂痕、合作摩擦激增、融资闭环断裂、技术迭代减速，所有隐患集中爆发！无需漫长等待，短期1-2个月内，叠加Anthropic IPO落地，全球AI超级泡沫将彻底破裂。本轮AI牛市从来不是纯粹的技术牛市，而是黄仁勋个人信用托举的泡沫，人走茶凉，信仰崩塌，AI行业的结构性寒冬，正式开启！\n#黄仁勋 #AI泡沫崩盘 #英伟达 #全球科技格局 #算力周期拐点","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122912292610449855","l":[],"ln":[],"t":["美股","AI科技"],"lk":5,"rt":1,"rp":1,"vw":1507},{"id":"2122911813826170891","h":"dmjk001","ts":1794976592,"zh":"12:27:19【监管要求基金公司上报全部产品AI敞口？证监会：不属实】财联社11月18日电，中国证监会新闻发言人答记者问。问：近日，发现互联网上传播“监管要求基金公司上报全部产品AI敞口”相关信息，请问这一情况是否属实？答：该信息不属实。公募基金投资运作依照《证券投资基金法》等法律法规和基金合同约定进行，投资标的、投资比例由基金管理人按照基金合同和内部投资决策程序自主确定。中国证监会依法履行监管职责，未向基金管理人提出相关数据报送要求。","en":"12:27:19【监管要求基金公司上报全部产品AI敞口？证监会：不属实】财联社11月18日电，中国证监会新闻发言人答记者问。问：近日，发现互联网上传播“监管要求基金公司上报全部产品AI敞口”相关信息，请问这一情况是否属实？答：该信息不属实。公募基金投资运作依照《证券投资基金法》等法律法规和基金合同约定进行，投资标的、投资比例由基金管理人按照基金合同和内部投资决策程序自主确定。中国证监会依法履行监管职责，未向基金管理人提出相关数据报送要求。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122911813826170891","l":[],"ln":[],"t":[],"lk":3,"rt":1,"rp":0,"vw":1953},{"id":"2122911403451543973","h":"qinbafrank","ts":1794976495,"zh":"要说这次英伟达财报有瑕疵除了资本生态外（采购承诺和担保），应该就是毛利率的下降了。尽管下季收入指引强劲，但对第四财季毛利率的展望却相对谨慎。公司预计第四财季GAAP和非GAAP口径的毛利率分别为71%至72%，明显低于第三财季的74.8%和74.9%。\n这意味着毛利率可能环比下降约3个百分点。\n毛利率承压主要与两方面因素有关：\n一是内存价格上涨；\n二是新一代Rubin产品处于初期爬坡阶段，相关生产和供应链成本相对较高。\n这也意味着增长是有成本的。\n需要关注未来Rubin规模化出货后，毛利率能否逐步恢复。","en":"要说这次英伟达财报有瑕疵除了资本生态外（采购承诺和担保），应该就是毛利率的下降了。尽管下季收入指引强劲，但对第四财季毛利率的展望却相对谨慎。公司预计第四财季GAAP和非GAAP口径的毛利率分别为71%至72%，明显低于第三财季的74.8%和74.9%。\n这意味着毛利率可能环比下降约3个百分点。\n毛利率承压主要与两方面因素有关：\n一是内存价格上涨；\n二是新一代Rubin产品处于初期爬坡阶段，相关生产和供应链成本相对较高。\n这也意味着增长是有成本的。\n需要关注未来Rubin规模化出货后，毛利率能否逐步恢复。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXYPxZ_akAApjxj.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122911403451543973","l":[],"ln":[],"t":["AI科技","财报"],"lk":1,"rt":0,"rp":0,"vw":670},{"id":"2122911057807335507","h":"cnfinancewatch","ts":1794976412,"zh":"就这样，实现了奢侈品珠宝自由？","en":"就这样，实现了奢侈品珠宝自由？","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122362031563223040/vid/avc1/1080x1920/IVH7exMEHFLxLqfF.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2122911057807335507","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2122910244699304249","h":"fxt
