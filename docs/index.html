 Hoarding）：这是一种被广泛研究的心理障碍，患者会收集远超照料能力的动物，却往往无法提供基本福利。数据显示，动物囤积者中70%-83%为女性。这种女性多数伴随激素紊乱和心理健康问题。","en":"暴论，看起来收集宠物喂养是爱心表现，实质：\n宠物癖（Petophilia）：有西班牙语文献将其描述为一种对动物过度依恋的障碍，表现为将动物完全“人类化”、为了宠物而与社会隔绝、只有和宠物在一起才感到满足。该文献甚至提到，这种极端的人类化对待“可能导致严重的社会化问题甚至激素性质的病理”，暗示极端行为长期可能反过来扰乱生理节律。‌￼\n• 动物囤积（Animal Hoarding）：这是一种被广泛研究的心理障碍，患者会收集远超照料能力的动物，却往往无法提供基本福利。数据显示，动物囤积者中70%-83%为女性。这种女性多数伴随激素紊乱和心理健康问题。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125083750241534057","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":592},{"id":"2125082960135352781","h":"cnfinancewatch","ts":1795494234,"zh":"我一直说有种女人是内分泌失调，有病：\n孕激素、催产素、雌激素不正常，是病要治疗。\n这个视频，女性与自己的狗互动产生一种类似母婴的感觉，对小狗的依赖成瘾超过了儿子。","en":"我一直说有种女人是内分泌失调，有病：\n孕激素、催产素、雌激素不正常，是病要治疗。\n这个视频，女性与自己的狗互动产生一种类似母婴的感觉，对小狗的依赖成瘾超过了儿子。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2124724419394441216/vid/avc1/540x720/_94fLqXPOeSJvRCV.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2125082960135352781","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":825},{"id":"2125081898708050176","h":"cnfinancewatch","ts":1795493981,"zh":"今天看到女员工上前拥抱黄仁勋回归，激动的哭泣\n可以断定纽时的文章是有人故意放出来狙击黄仁勋的\n资本主义媒体，你要说新闻自由、新闻良知\n那要看是哪种自由和良知\n那是利益的自由和功利的良知","en":"今天看到女员工上前拥抱黄仁勋回归，激动的哭泣\n可以断定纽时的文章是有人故意放出来狙击黄仁勋的\n资本主义媒体，你要说新闻自由、新闻良知\n那要看是哪种自由和良知\n那是利益的自由和功利的良知","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125081898708050176","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":929},{"id":"2125081729291399286","h":"AntonLaVay","ts":1795493941,"zh":"老黄已经回来了，当下我的一些观察。\n我认为价格能回到Jensen离任之前的位置，但是不认为能简单地突破这个位置持续向上，原因在于：\n1. 我们不要忘了，黄的模式是已经被质疑的了，在他走之前nvda的估值就已经低于历史平均水平了。\n2. 请不要忘记他供应商融资这个模式被质疑不是在他走之后被质疑的，是很早就被质疑了，只是数月前还是只有Michael Burry或是BIS很注意这个问题。\n而现在，这个问题已经众所周知，这并不太好，这会被放在放大镜下检视。\n3. 你们有没有发现\n当前就Jensen回来这个事儿做表态的政治家，议员真的有点太多了… Mike Pence 希拉里 Sanders Schumer 等等等等全都来表态了。\n我整个时间线都是各种政治家的表态..\n他仍然是纷争的中央…\n他已经成为两党争斗的靶子。","en":"老黄已经回来了，当下我的一些观察。\n我认为价格能回到Jensen离任之前的位置，但是不认为能简单地突破这个位置持续向上，原因在于：\n1. 我们不要忘了，黄的模式是已经被质疑的了，在他走之前 n黄仁勋在离职11天后重掌英伟达，带动美国股市大涨。美国总统特朗普表示，他“促成了交易”。那么，民众怎么看待他的回归？","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2125075656191213569/vid/avc1/1080x1920/cnmKhd6N2_tMBQ05.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2125075761925411212","l":[],"ln":[],"t":["AI科技"],"lk":6,"rt":1,"rp":0,"vw":2128},{"id":"2125075475458613591","h":"tig88411109","ts":1795492449,"zh":"这当然不是好莱坞式的英雄归来，希望下一次 $NVDA 换CEO的时候，不用上上下下几万亿来证明\n有多少爱可以从来，黄仁勋2.0时代，我对老黄5点忠告，也是所有投资英伟达股东首先要考虑的机遇和风险所在\n第一，刚回去，别急着搞内部清洗。独立调查和证监会还在继续，不要给对手送弹药，真真假假内部人爆料都是腥风血雨。最关键是现在就要考虑建立系统接班人，你下次有点意外走了，谁知道怎么办\n第二，你现在最大对手不是政治和小报空头打手，而是你的大客户。这些云大厂都在上面自研芯片，当CUDA护城河不在，推理大时代，拼的是谁的算力最高效\n第三，美国给予了你一切，你也要看到世界单极化在台湾的供应链风险，下一次如果台海战争，你是否能有足够的美国本地产能代工和封装\n第四，所有都是政治，但你大而不能倒的时候。但不是免死金牌，一旦进入宫斗环节，国会审查还在继续，民主党远远不会放过你，从现在开始就要把所有纪录和订单讲清楚。\n第五，半导体央行地位还要保，毕竟多少行业人一起为你摇旗呐喊。从扶持新云第三方的算力服务商，多元化是必要的；但是到处江湖意气当老大，表外输血冲动要管住，他们也要有自身造血，不能你无限兜底，有多余资金，还不如回购股票，让股东发财\n市场当然爱听“王者归来”的桥段，但世上没有免费午餐，对于投资人，这时候你也不要希望，政治保驾护航下，你的估值还能回到30-40倍，这就是政治管制和参与的代价，也是一个英伟达的成就未来百年帝国的“成人礼”。\n最后，对待你的家人，她们付出了太多。你把爱洒满人间和AI行业，唯独没有给你的家人。","en":"这当然不是好莱坞式的英雄归来，希望下一次 $NVDA 换CEO的时候，不用上上下下几万亿来证明\n有多少爱可以从来，黄仁勋2.0时代，我对老黄5点忠告，也是所有投资英伟达股东首先要考虑的机遇和风险所在\n第一，刚回去，别急着搞内部清洗。独立调查和证监会还在继续，不要给对手送弹药，真真假假内部人爆料都是腥风血雨。最关键是现在就要考虑建立系统接班人，你下次有点意外走了，谁知道怎么办\n第二，你现在最大对手不是政治和小报空头打手，而是你的大客户。这些云大厂都在上面自研芯片，当CUDA护城河不在，推理大时代，拼的是谁的算力最高效\n第三，美国给予了你一切，你也要看到世界单极化在台湾的供应链风险，下一次如果台海战争，你是否能有足够的美国本地产能代工和封装\n第四，所有都是政治，但你大而不能倒的时候。但不是免死金牌，一旦进入宫斗环节，国会审查还在继续，民主党远远不会放过你，从现在开始就要把所有纪录和订单讲清楚。\n第五，半导体央行地位还要保，毕竟多少行业人一起为你摇旗呐喊。从扶持新云第三方的算力服务商，多元化是必要的；但是到处江湖意气当老大，表外输血冲动要管住，他们也要有自身造血，不能你无限兜底，有多余资金，还不如回购股票，让股东发财\n市场当然爱听“王者归来”的桥段，但世上没有免费午餐，对于投资人，这时候你也不要希望，政治保驾护航下，你的估值还能回到30-40倍，这就是政治管制和参与的代价，也是一个英伟达的成就未来百年帝国的“成人礼”。\n最后，对待你的家人，她们付出了太多。你把爱洒满人间和AI行业，唯独没有给你的家人。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX3IxohaQAA9IJ8.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2125075475458613591","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":2,"rp":0,"vw":1292},{"id":"2125074884669907192","h":"peng_hellen","ts":17 5%：黄金10%：短债10%：跨境55%","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125045232106664140","l":[],"ln":[],"t":["黄金"],"lk":0,"rt":0,"rp":0,"vw":476},{"id":"2125045228432421047","h":"cnfinancewatch","ts":1795485238,"zh":"ETF轮动策略重点观察A股名单：\n第一步：A股核心，四只各管一段\n这四只的分工是“大盘稳、小盘弹、创业板吃制造、科创50吃芯片”。先看各自的分量（全收益口径，含股息再投资）\n沪深300\n创业板指\n中证1000\n科创50\n年化波动从17%到28.6%，最大回撤从-72.8%到-79.3%。你想多赚那2个点，代价是回撤能多扛10个点。\n四只的行业暴露完全不同。 科创50里电子一个行业就占70.35%；创业板指里电力设备和通信合计超50%；沪深300是金融、消费、工业分散；中证1000是1000只小盘，谁冒头谁进来。\n这就是为什么四只都要留：它们覆盖的是产业周期的不同阶段。AI和芯片周期来了，科创50领跑；新能源和制造周期来了，创业板领跑；风格转向大盘防守，沪深300扛住；流动性宽松、小盘活跃，中证1000跟上。\n顺便看一眼当前位置：截至2026年10月30日，沪深300的PE（TTM）约12.87倍，处在近十年约53%分位。不贵，也不便宜了。\n第二步：跨境四只\n标普500：管“面”。 十一个行业的经济体切片，美国整体经济。1985年以来含股息年化约11.5%。\n纳指100：管“尖”。 全球科技龙头，1985年以来含股息年化13.4%~14.8%，长期回报最高，波动也最大。\n日经225：管“另一个时区”。亚太核心市场，2026年涨了33%~36%。\n德国DAX：管“欧洲制造”。 40只德国大盘股，集中在汽车、化工、工业，驱动逻辑跟美股科技、A股制造都不一样。\n第三步：黄金ETF+短债ETF\n债券管通缩和流动性危机。 2020年3月疫情冲击，股票、黄金、红利全被抛售，只有债券维持正收益。\n黄金管通胀和货币信用。 2022年俄乌冲突推高能源价格，黄金涨9.80%，同期海外股债双杀。","en":"ETF轮动策略重点观察A股名单：\n第一步：A股核心，四只各管一段\n这四只的分工是“大盘稳、小盘弹、创业板吃制造、科创50吃芯片”。先看各自的分量（全收益口径，含股息再投资）\n沪深300\n创业板指\n中证1000\n科创50\n年化波动从17%到28.6%，最大回撤从-72.8%到-79.3%。你想多赚那2个点，代价是回撤能多扛10个点。\n四只的行业暴露完全不同。 科创50里电子一个行业就占70.35%；创业板指里电力设备和通信合计超50%；沪深300是金融、消费、工业分散；中证1000是1000只小盘，谁冒头谁进来。\n这就是为什么四只都要留：它们覆盖的是产业周期的不同阶段。AI和芯片周期来了，科创50领跑；新能源和制造周期来了，创业板领跑；风格转向大盘防守，沪深300扛住；流动性宽松、小盘活跃，中证1000跟上。\n顺便看一眼当前位置：截至2026年10月30日，沪深300的PE（TTM）约12.87倍，处在近十年约53%分位。不贵，也不便宜了。\n第二步：跨境四只\n标普500：管“面”。 十一个行业的经济体切片，美国整体经济。1985年以来含股息年化约11.5%。\n纳指100：管“尖”。 全球科技龙头，1985年以来含股息年化13.4%~14.8%，长期回报最高，波动也最大。\n日经225：管“另一个时区”。亚太核心市场，2026年涨了33%~36%。\n德国DAX：管“欧洲制造”。 40只德国大盘股，集中在汽车、化工、工业，驱动逻辑跟美股科技、A股制造都不一样。\n第三步：黄金ETF+短债ETF\n债券管通缩和流动性危机。 2020年3月疫情冲击，股票、黄金、红利全被抛售，只有债券维持正收益。\n黄金管通胀和货币信用。 2022年俄乌冲突推高能源价格，黄金涨9.80%，同期海外股债双杀。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125045228432421047","l":[],"ln":[],"t":["通胀","美股","A股港股","AI科技","黄金"],"lk":2,"rt":2,"rp":3,"vw":1060},{"id":"2125045016007774618", 的战车在狂飙，公司、华尔街和员工心里都清楚，这台机器离了谁都能转，唯独现在离不了他。\n从奥特曼到黄仁勋，你们觉得超级创始人的不可替代性，对一家巨头公司到底是护城河，还是最大的定时炸弹？","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2125041333551132672/vid/avc1/1080x1818/Dz2MFuZ20rJSWClP.mp4?tag=29"],"u":"https://x.com/Love1mothe/status/2125041903879979044","l":[],"ln":[],"t":["AI科技"],"lk":17240,"rt":1499,"rp":552,"vw":2454464},{"id":"2125041835060191442","h":"AntonLaVay","ts":1795484429,"zh":"其实没有那么麻烦\n就是实际上没有人能替代Jensen，找不到能替代的人。\n黄仁勋的面子没有替代品\n虽然看上去这不够现代西方公司管理学，但是呢，也不要装外宾，马斯克，乔布斯都是这种Keyman。\n其实挺常见的。","en":"其实没有那么麻烦\n就是实际上没有人能替代Jensen，找不到能替代的人。\n黄仁勋的面子没有替代品\n虽然看上去这不够现代西方公司管理学，但是呢，也不要装外宾，马斯克，乔布斯都是这种Keyman。\n其实挺常见的。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX2qSDKXAAAF3UB.jpg?name=orig"],"u":"https://x.com/AntonLaVay/status/2125041835060191442","l":[],"ln":[],"t":[],"lk":21,"rt":0,"rp":0,"vw":2062},{"id":"2125041715228942803","h":"Balder13946731","ts":1795484400,"zh":"今天的美股复盘视频：美股为什么暴涨？黄仁勋回归，英伟达一天涨 31%，是反转还是轧空；明天看戴尔财报。","en":"今天的美股复盘视频：美股为什么暴涨？黄仁勋回归，英伟达一天涨 31%，是反转还是轧空；明天看戴尔财报。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2125041715228942803","l":["youtu.be"],"ln":[{"u":"https://youtu.be/YNWr0G2cEgo","d":"youtu.be"}],"t":["美股","AI科技","财报"],"lk":3,"rt":0,"rp":0,"vw":1507},{"id":"2125040115764330721","h":"AntonLaVay","ts":1795484019,"zh":"OK，现在所有的事情都应该显而易见了吧？\n我们综合Rubio和民主党Chuck Schumer的反应应该足以绘制出“Jensen Huang incident”的整个图景：\n共和党内建制强硬派对Jensen 展开调查，但是除了发现Jensen和Alice有一腿以外并没有查到什么东西，他们早已预计川普会输掉中期选举\n请注意以内斗的角度来看\n川普的失败是Maga党人的失败而不是传统共和党人的失败，Maga的失败反而凸显了传统共和党人的伟光正和川普的小丑。\n而传统的共和党强硬派和民主党强硬派是有两党共识的，反而在当前这个各方势力群魔乱舞的时候没有什么太大的矛盾。\n请再次注意，如果我们继续以内斗的角度来看问题：民主党本次的胜利并不一定对于民主党是好事，除了这次胜利基本完全来自对川普不满的反弹的原因以外更重要的原因来自“大获全胜”本胜。\n民主党的各个派系都在中选中获胜了，那特么既然大家的路线都能获胜，那凭什么你们的路线能走我的路线就走不得呢？\n均匀的胜利，无益于解决内部的纷争。\n这次胜利并不能帮助民主党人结束内斗，反而会增强内斗，你们能看到，民主党刚刚大胜，就马上有人跳出来挑战Schumer了。\nRudio这个人，没什么意思，她在我看来就是一个古墓派的保守强硬共和党人，感觉像来自上个世纪。\n新一代民粹右翼（美国的 MAGA/万斯派，以及欧洲的德国选择党 AfD、奥地利自由党等），已经把主要敌人重新定义了。\n在他们眼里，头号敌人不再是克里姆林宫的威权扩张，而是布鲁塞尔，华盛顿，达沃斯所代表的“跨国自由主义精英、大规模移民与觉醒文化”。\n哇，这之后，得斗成啥样呀，分裂的左翼，分裂的人右翼，美国现在这个政治氛围太热闹了。","en":"OK，现在所有的事情都应该显而易见了吧？\n我们综合Rubio和民主党Chuck Schumer的反应应该足以绘制出“Jensen Huang incident”的整个图景：\n共和党内建制强硬派对Jensen 展开调查，但是除了发现Jensen和Alice有一腿以外并没有查到什么东西，他们早已预计川普会输掉中期选举\n请注意以内斗的角度来看\n川普的失败是Maga党人的失败而不是传统共和党人的失败，Maga的失败反而凸显了传统共和党人的伟光正和川普的小丑。\n而传统的共和党强硬派和民主党强硬派是有两党共识的，反而在当前这个各方势力群魔乱舞的时候没有什么太大的矛盾。\n请再次注意，如果我们继续以内斗的角度来看问题：民主党本次的胜利并不一定对于民主党是好事，除了这次胜利基本完全来自对川普不满的反弹的原因以外更重要的原因来自“大获全胜”本胜。\n民主党的各个派系都在中选中获胜了，那特么既然大家的路线都能获胜，那凭什么你们的路线能走我的路线就走不得呢？\n均匀的胜利，无益于解决内部的纷争。\n这次胜利并不能帮助民主党人结束内斗，反而会增强内斗，你们能看到，民主党刚刚大胜，就马上有人跳出来挑战Schumer了。\nRudio这个人，没什么意思，她在我看来就是一个古墓派的保守强硬共和党人，感觉像来自上个世纪。\n新一代民粹右翼（美国的 MAGA/万斯派，以及欧洲的德国选择党 AfD、奥地利自由党等），已经把主要敌人重新定义了。\n在他们眼里，头号敌人不再是克里姆林宫的威权扩张，而是布鲁塞尔，华盛顿，达沃斯所代表的“跨国自由主义精英、大规模移民与觉醒文化”。\n哇，这之后，得斗成啥样呀，分裂的左翼，分裂的人右翼，美国现在这个政治氛围太热闹了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2125040115764330721","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":402},{"id":"2125036801215865054","h":"bboczeng","ts":1795483229,"zh":"其实那些最近看到美股暴跌，开始做空的空头KOL们\n蛮惨的，\n周五刚翻空，今天就爆拉30%\n都不知道怎么转型了\n当然，这并不是他们的错\n这是这个市场疯狂，不可预测，大家都在每天算命，跳大神的错\n今天的事情揭露了这一本质\n希望大家看清之后\n选择好自己未来的保命策略","en":"其实那些最近看到美股暴跌，开始做空的空头KOL们\n蛮惨的，\n周五刚翻空，今天就爆拉30%\n都不知道怎么转型了\n当然，这并不是他们的错\n这是这个市场疯狂，不可预测，大家都在每天算命，跳大神的错\n今天的事情揭露了这一本质\n希望大家看清之后\n选择好自己未来的保命策略","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125036801215865054","l":[],"ln":[],"t":["美股"],"lk":16,"rt":0,"rp":0,"vw":1367},{"id":"2125035508099407923","h":"bboczeng","ts":1795482921,"zh":"我没说他要继续跌啊，我周末的文章和space，以及我的推特\n说的难道不是已经跌的足够多，跌到baseline I之后，可以大举按比例抄底了吗\n还有人说我反手做多了\n跌到100我就all in，可惜没给我机会\n😅😅😅","en":"我没说他要继续跌啊，我周末的文章和space，以及我的推特\n说的难道不是已经跌的足够多，跌到baseline I之后，可以大举按比例抄底了吗\n还有人说我反手做多了\n跌到100我就all in，可惜没给我机会\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125035508099407923","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":2,"vw":1322},{"id":"2125034427273379866","h":"bboczeng","ts":1795482663,"zh":"美股真的是越来越诡异了，其实我也知道周五跌到120已经算是非常便宜，周五Space有人说要跌回50我也觉得不可能\n毕竟都回到了2025年1月分，我和粉红打赌跌不破120，跌破就回国的那个时候\n但我估计就算是个多头，也不可能想到黄仁勋能在12月听证会之前就回归——而且还是特朗普直接要求，董事会被迫决定的\n董事会之前的态度呢？\n股价大涨30%，最大的多头都做不出这样的梦\n所以，不论你是多头还是空头，周一的行情其实说明不了任何问题，毕竟上周的暴跌本质上也是出人意料的\n唯一能确定的事情时，美股在“不要脸”这件事是已经是登峰造极，载入史册了\n在这种行情中，只有定投，才能养活自己30年\n让我们一起戒赌，一起按计划抄底、定投\n谢谢大家","en":"美股真的是越来越诡异了，其实我也知道周五跌到120已经算是非常便宜，周五Space有人说要跌回50我也觉得不可能\n毕竟都回到了2025年1月分，我和粉红打赌跌不破120，跌破就回国的那个时候\n但我估计就算是个多头，也不可能想到黄仁勋能在12月听证会之前就回归——而且还是特朗普直接要求，董事会被迫决定的\n董事会之前的态度呢？\n股价大涨30%，最大的多头都做不出这样的梦\n所以，不论你是多头还是空头，周一的行情其实说明不了任何问题，毕竟上周的暴跌本质上也是出人意料的\n唯一能确定的事情时，美股在“不要脸”这件事是已经是登峰造极，载入史册了\n在这种行情中，只有定投，才能养活自己30年\n让我们一起戒赌，一起按计划抄底、定投\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125034427273379866","l":[],"ln":[],"t":["美股"],"lk":1,"rt":0,"rp":0,"vw":45},{"id":"2125034356712575124","h":"qinbafrank","ts":1795482646,"zh":"再聊聊老黄的回归，昨天上午说看周日川普和贝森特的表态市场会有一段交易老黄回归的时间窗口，但没想昨晚就直接回归了。借着昨晚跟朋友聊的内容说说这场回归是如何发生的：\n1、川普发力，亲自出面说服了英伟达董事会，同时力压贝森特被迫改口，看报道万斯和卢特尼克也参与斡旋。这个好理解、万斯虽然反对伊朗战争，但还是共和党科技派，卢特尼克更是如此本身这次就积极内阁被指责最多的，自然也要积极出力。\n川普发力一方面他本身就支持老黄，跟老黄算是商业盟友，股市暴跌他自己利益受损。\n2、市场发力，本质还是一次“跌给你看”甚至叫“死给你看”，美国是高度金融化，股市已经成为美国社会财富第一大支撑。股市可以跌可以调整，但是不能大跌不能真“死了”，只要“以死相逼”才能逼着博弈的几方里要么积极斡旋、要么退让；市场死了、共和党、民主党、董事会都害怕。\n3、共和党对华强硬派的分化和禁声，作为白宫里对华强硬派的代表，贝森特已经改口，鲁比奥沉默。为什么贝森特改口？其实很好理解，贝森特在华盛顿没有政治根基、虽然他主张对华强硬、但他的权力完全来自川普。鲁比奥不一样、在川普胜选总统之前就已经是联邦参议员了，他有自己的势力范围，国会里盟友就不少例如众议院外交事务委员会主席马斯特就是鲁比奥的亲密盟友。\n所以昨天鲁比奥在会见卡塔尔首相时，有记者问“黄发回归有国家安全分风险么”，鲁比奥就完全岔开忽略了这个问题。上周五市场暴跌也让他认识到了老黄的重要性，上周还在币安广场ama还聊最后要么英伟达让市场很难受、要么发现真找不到一个能替代老黄的人、最后不得不又请老黄回归。当然当时也没有认为这是短期就能发生的。\n4、很多人说民主党也有参与老黄回归，正如之前\n过去两周半中期选举后，发生的事情很多人归结为党争。其实更多还是共和党党内博弈，两党之间的争斗其实还没开始，就像27年财政预算法案一样现在民主党的思路就是12月再通过一个临时拨款协议、等到27年1月民主党真正掌控国会后再跟共和党内谈判。\n对民主党来说。遏制中国是长期战略必须一定要去做的，但现在趁着民众对AI的民意去搞川普压制共和党却是首要之事。不会说就停下来、当然民主党也怕市场真的“死给你看”。\n5、整体上来，老黄回归估计内部整顿，之后再被迫辞职的概率很小。12月共和党主导的国会听证会估计也就没啥大问题了。但27年民主党应该还是会调查老黄，只是可能也不敢真的把老黄给干走，但估计能制造波动。\n从昨天交易老黄回归到老黄真的回归，市场信心提振是巨大的、这一波📈估计会持续一段时间。\n后面继续看三个维度：\n油价/通胀/利率、\n民主党的数据中心政策比预想的更严还是会略弱、\nAI商业化是不是在加速（这一点我之前一直认为是加速，但市场要看更多的证据）。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"再聊聊老黄的回归，昨天上午说看周日川普和贝森特的表态市场会有一段交易老黄回归的时间窗口，但没想昨晚就直接回归了。借着昨晚跟朋友聊的内容说说这场回归是如何发生的：\n1、川普发力，亲自出面说服了英伟达董事会，同时力压贝森特被迫改口，看报道万斯和卢特尼克也参与斡旋。这个好理解、万斯虽然反对伊朗战争，但还是共和党科技派，卢特尼克更是如此本身这次就积极内阁被指责最多的，自然也要积极出力。\n川普发力一方面他本身就支持老黄，跟老黄算是商业盟友，股市暴跌他自己利益受损。\n2、市场发力，本质还是一次“跌给你看”甚至叫“死给你看”，美国是高度金融化，股市已经成为美国社会财富第一大支撑。股市可以跌可以调整，但是不能大跌不能真“死了”，只要“以死相逼”才能逼着博弈的几方里要么积极斡旋、要么退让；市场死了、共和党、民主党、董事会都害怕。\n3、共和党对华强硬派的分化和禁声，作为白宫里对华强硬派的代表，贝森特已经改口，鲁比奥沉默。为什么贝森特改口？其实很好理解，贝森特在华盛顿没有政治根基、虽然他主张对华强硬、但他的权力完全来自川普。鲁比奥不一样、在川普胜选总统之前就已经是联邦参议员了，他有自己的势力范围，国会里盟友就不少例如众议院外交事务委员会主席马斯特就是鲁比奥的亲密盟友。\n所以昨天鲁比奥在会见卡塔尔首相时，有记者问“黄发回归有国家安全分风险么”，鲁比奥就完全岔开忽略了这个问题。上周五市场暴跌也让他认识到了老黄的重要性，上周还在币安广场ama还聊最后要么英伟达让市场很难受、要么发现真找不到一个能替代老黄的人、最后不得不又请老黄回归。当然当时也没有认为这是短期就能发生的。\n4、很多人说民主党也有参与老黄回归，正如之前\n过去两周半中期选举后，发生的事情很多人归结为党争。其实更多还是共和党党内博弈，两党之间的争斗其实还没开始，就像27年财政预算法案一样现在民主党的思路就是12月再通过一个临时拨款协议、等到27年1月民主党真正掌控国会后再跟共和党内谈判。\n对民主党来说。遏制中国是长期战略必须一定要去做的，但现在趁着民众对AI的民意去搞川普压制共和党却是首要之事。不会说就停下来、当然民主党也怕市场真的“死给你看”。\n5、整体上来，老黄回归估计内部整顿，之后再被迫辞职的概率很小。12月共和党主导的国会听证会估计也就没啥大问题了。但27年民主党应该还是会调查老黄，只是可能也不敢真的把老黄给干走，但估计能制造波动。\n从昨天交易老黄回归到老黄真的回归，市场信心提振是巨大的、这一波📈估计会持续一段时间。\n后面继续看三个维度：\n油价/通胀/利率、\n民主党的数据中心政策比预想的更严还是会略弱、\nAI商业化是不是在加速（这一点我之前一直认为是加速，但市场要看更多的证据）。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX2fo4AasAAqcBW.jpg?name=orig","https://pbs.twimg.com/media/HX2fo4Fa8AADiAi.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2125034356712575124","l":["x.com"],"ln":[{"u":"https://x.com/qinbafrank/status/2121523434400461090?a=fOYRr-vWbkt2w96qwt0&s=46这里聊到的“倒黄”主力还是共和党内强硬派，那么老黄回归还是川普挟着市场暴跌的余威压制住了党内强硬派，民主党其实没怎么使劲。反倒凌晨参议院民主党领袖舒默还表态民主党将动用全部力量调查老黄和美国政府","d":"x.com"}],"t":["通胀","美股","原油能源","AI科技"],"lk":25,"rt":0,"rp":4,"vw":3977},{"id":"2125034116072804704","h":"qinbafrank","ts":1795482589,"zh":"再聊聊老黄的回归，昨天上午说看周日川普和贝森特的表态市场会有一段交易老黄回归的时间窗口，但没想昨晚就直接回归了。借着昨晚跟朋友聊的内容说说这场回归是如何发生的：\n1、川普发力，亲自出面说服了英伟达董事会，同时力压贝森特被迫改口，看报道万斯和卢特尼克也参与斡旋。这个好理解、万斯虽然反对伊朗战争，但还是共和党科技派，卢特尼克更是如此本身这次就积极内阁被指责最多的，自然也要积极出力。\n川普发力一方面他本身就支持老黄，跟老黄算是商业盟友， 43093","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["美股","A股港股","财报"],"lk":0,"rt":1,"rp":0,"vw":916},{"id":"2125031843820982528","h":"ReutersChina","ts":1795482047,"zh":"消息人士称，特朗普将英伟达的黄仁勋视为开放权重AI模型的保护者","en":"Trump saw Nvidia's Huang as protector of open-weight AI models, sources say","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2125031843820982528","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/us/trump-saw-nvidias-huang-protector-open-weight-ai-models-sources-say-2026-11-23/?taid=6b04e1bf5f9bc30001dc0a79&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":395},{"id":"2125029504456536575","h":"bboczeng","ts":1795481489,"zh":"充分证明了木头姐确实没有内幕消息\n是纯粹的 Outside Trading\n😅😅😅","en":"充分证明了木头姐确实没有内幕消息\n是纯粹的 Outside Trading\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125029504456536575","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":1179},{"id":"2125029328283201557","h":"dmjk001","ts":1795481447,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HX2e5lBa4AAyvo1.png?name=orig"],"u":"https://x.com/dmjk001/status/2125029328283201557","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":954},{"id":"2125027349154705840","h":"cnfinancewatch","ts":1795480975,"zh":"三大利空方向（由强到弱） 一、复职不是风险出清，AI交易仍要过国会、调查和财报三关。已核实：英伟达声明写明将继续配合政府调查和问询，并新设国家安全与出口管制委员会、开始招聘首席合规官。Stocktwits援引报道称，黄仁勋将于12月1日接受三个众议院委员会闭门问询，12月3日出席参议院银行委员会公开听证，议题包括出口管制；参议员沃伦批评复职“鲁莽”，称公司和本人仍需向国会说明。另有彭博报道称，董事会周日下午在特朗普施压后作出决定，且未咨询公司高管层，这一说法来自转述，本档不当作公司已确认的事实。同一天，Anthropic不涨反跌约3%；华尔街日报等报道指，其未来数年算力与基础设施承诺约9000亿美元，债市预期债券可能落在投机级、约BB区间，评级机构尚未正式公开表态。对谁不利：把复职写成“问题已经结束”的交易，以及仍按“资本开支只增不减、融资无约束”定价的高位标的。\n二、上周五的去杠杆没有被一天抹平，亚洲内部还在分化。已核实：韩国KOSPI收4708.54点，跌3.31%，维稳承诺没有挡住跌势。台湾加权涨2.16%、收36811.89点，但要放到上周五的背景里看：彭博报道，台股上周最大跌幅接近18%，为1991年以来最差一周；11月20日融资余额单日减少约15亿美元，为1996年有数据以来最大降幅；当天追缴保证金64.6亿新台币，超过一个月前的200倍，6462个账户受影响，632个账户被强制平仓、约14.95亿新台币。台北时报转述，约5000亿新台币的国家安定基金周一介入，才帮助指数收涨。外资上月净卖创纪录约300亿美元，本月已超过250亿美元。台积电ADR涨约14%，补的是上周约15%的跌幅，不是新高启动。A股硬件链如果今天高开过多，仍可能跟韩台的节奏重新对齐。\n三、最容易在今天出错的，是把隔夜暴涨和政策标题当成追连板的理由。两融保证金比例下调仍是11月30日起施行，“近4000亿元”是理论上限，不是已经进场的钱。创业板做市和回购潮，邮件里写得很满，本档未逐条核实规模，不写成今日开盘的决定性买盘。已经能核实的是拥挤：盛剑科技5连板后，11月17日至23日累计上涨61.01%，上交所就其股价波动下发监管工作函，公司提示存在非理性炒作和短期快速下跌风险；真视通5连板，中京电子3连板，机器人与短剧的20CM也已经定价了情绪。WTI 1月合约结算80.17美元、跌3.88%，布伦特89.37美元、跌3.46%；邮件转述特朗普就伊朗表态，未作为定论。港股并未先于美股翻红，恒生指数收22383.74点、跌0.12%，恒生科技指数跌0.09%，零跑、小鹏、理想走弱。若出现高开低走，先受伤的会是昨天已经连板、今天又被隔夜情绪加码的高标。\n小结：周一A股给出的是“权重弱、题材修”，隔夜美股给出的是“黄仁勋回来、科技股暴涨”。今天开盘方向并不难猜，难的是把反弹当成趋势、把复职当成出清、把连板当成产业。防守仓不必因外围大涨就加回银行和保险；进攻只看回踩后的硬需求，不接力已收监管函和多连板的高标。真正的验证，还要看今晚戴尔、周三PCE，以及黄仁勋12月的国会安排。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，邮件转述内容未逐条核实，不构成投资建议。","en":"三大利空方向（由强到弱） 一、复职不是风险出清，AI交易仍要过国会、调查和财报三关。已核实：英伟达声明写明将继续配合政府调查和问询，并新设国家安全与出口管制委员会、开始招聘首席合规官。Stocktwits援引报道称，黄仁勋将于12月1日接受三个众议院委员会闭门问询，12月3日出席参议院银行委员会公开听证，议题包括出口管制；参议员沃伦批评复职“鲁莽”，称公司和本人仍需向国会说明。另有彭博报道称，董事会周日下午在特朗普施压后作出决定，且未咨询公司高管层，这一说法来自转述，本档不当作公司已确认的事实。同一天，Anthropic不涨反跌约3%；华尔街日报等报道指，其未来数年算力与基础设施承诺约9000亿美元，债市预期债券可能落在投机级、约BB区间，评级机构尚未正式公开表态。对谁不利：把复职写成“问题已经结束”的交易，以及仍按“资本开支只增不减、融资无约束”定价的高位标的。\n二、上周五的去杠杆没有被一天抹平，亚洲内部还在分化。已核实：韩国KOSPI收4708.54点，跌3.31%，维稳承诺没有挡住跌势。台湾加权涨2.16%、收36811.89点，但要放到上周五的背景里看：彭博报道，台股上周最大跌幅接近18%，为1991年以来最差一周；11月20日融资余额单日减少约15亿美元，为1996年有数据以来最大降幅；当天追缴保证金64.6亿新台币，超过一个月前的200倍，6462个账户受影响，632个账户被强制平仓、约14.95亿新台币。台北时报转述，约5000亿新台币的国家安定基金周一介入，才帮助指数收涨。外资上月净卖创纪录约300亿美元，本月已超过250亿美元。台积电ADR涨约14%，补的是上周约15%的跌幅，不是新高启动。A股硬件链如果今天高开过多，仍可能跟韩台的节奏重新对齐。\n三、最容易在今天出错的，是把隔夜暴涨和政策标题当成追连板的理由。两融保证金比例下调仍是11月30日起施行，“近4000亿元”是理论上限，不是已经进场的钱。创业板做市和回购潮，邮件里写得很满，本档未逐条核实规模，不写成今日开盘的决定性买盘。已经能核实的是拥挤：盛剑科技5连板后，11月17日至23日累计上涨61.01%，上交所就其股价波动下发监管工作函，公司提示存在非理性炒作和短期快速下跌风险；真视通5连板，中京电子3连板，机器人与短剧的20CM也已经定价了情绪。WTI 1月合约结算80.17美元、跌3.88%，布伦特89.37美元、跌3.46%；邮件转述特朗普就伊朗表态，未作为定论。港股并未先于美股翻红，恒生指数收22383.74点、跌0.12%，恒生科技指数跌0.09%，零跑、小鹏、理想走弱。若出现高开低走，先受伤的会是昨天已经连板、今天又被隔夜情绪加码的高标。\n小结：周一A股给出的是“权重弱、题材修”，隔夜美股给出的是“黄仁勋回来、科技股暴涨”。今天开盘方向并不难猜，难的是把反弹当成趋势、把复职当成出清、把连板当成产业。防守仓不必因外围大涨就加回银行和保险；进攻只看回踩后的硬需求，不接力已收监管函和多连板的高标。真正的验证，还要看今晚戴尔、周三PCE，以及黄仁勋12月的国会安排。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，邮件转述内容未逐条核实，不构成投资建议。","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/cnfinancewatch/status/2125027349154705840","l":[],"ln":[],"t":["美股","A股港股","原油能源","AI科技","财报","关税贸易"],"lk":2,"rt":0,"rp":0,"vw":869},{"id":"2125027345744658571","h":"cnfinancewatch","ts":1795480974,"zh":"热点财经新闻综述｜2026-11-24·早间\n数据时点：A股、港股、韩国KOSPI与台湾加权为11月23日收盘；日经225因23日勤劳感谢日休市，仍为11月20日收盘，今日恢复交易；美股为美东11月23日常规交易收盘；现货黄金、现货白银与原油为同日收盘或结算；美股股指期货仅引用每日经济新闻11月24日07:01的报道。本档截稿约北京时间11月24日07:50，亚太股市尚未开盘。本期新处理一封热点财经邮件：11月23日晚间20:10版（收件箱）；11月24日早间版截稿时尚未送达。标“邮件转述”的内容未逐条核实。晚间邮件写于美股开盘前，其中“英伟达盘前涨近8%”“特朗普希望董事会重新聘用黄仁勋”等表述，已被此后的公司公告和美股收盘数字取代，本档以已核实的公开报道为准。\n今日判断 周一A股先探底再靠成长和题材翻红：上证收3538.95点、仅涨0.15%，深证成指涨1.93%、收10454.37点，创业板指涨3.08%、收2280.20点，科创50仍跌0.26%。钛媒体统计全市场4658只上涨、783只下跌，151只涨停、7只跌停；沪深成交15528.8亿元，较上一交易日放量约1307亿元。机器人、影视院线、贵金属、PCB和CPO是买盘，保险和核电是卖盘。午间档已经看到这幅结构——政策托底没有变成权重反攻，但逢低资金在题材上是真的。\n隔夜美股把另一半答案交了出来，而且比期货更猛。已核实：英伟达董事会一致投票，立即恢复黄仁勋担任总裁、首席执行官和董事；主席哈维·琼斯称，已听取美国政府高层意见，并认为复职不会构成国家安全风险。特朗普对CNBC说，自己说服了董事会，并称黄仁勋“没有做错”。新华社、中国新闻网和公司声明确认，科莱特·克雷斯继续任首席财务官，相关调查仍将进行，公司将新设首席合规官，并已成立由独立董事组成的国家安全与出口管制委员会。英伟达收涨31.48%、报165.05美元，为2003年5月以来最大单日涨幅；纳指涨6.51%、收24089.56点，标普500涨4.73%、收7237.17点，道指涨3.01%、收49595.31点，纳指与标普均为2025年4月以来最佳单日。美光涨19.04%，英特尔涨16.34%，台积电ADR涨约14%，特斯拉涨11.46%。今天A股开盘大概率高开，弹性会集中在光模块、PCB、存储和机器人，而不是银行和保险。但不要写成趋势反转已经确认：科创50昨天还在跌，调查和国会安排都还在，连板股已经拥挤。\n三大利多方向（由强到弱） 一、黄仁勋正式复职，把上周五被拆掉的AI交易在实盘里重新接了起来。这是相对晚间邮件最大的增量。晚间邮件还停在期货反弹和“希望复职”，现在已是董事会公告和收盘数字。为什么重要：上周五纳指跌5.28%、英伟达跌14%，定价的是治理真空和交易出清；现在定价的是关键人物回来、供应链和需求叙事暂时回到桌上。Gabelli Funds的基金经理对CNBC说，这有助于修复对AI生态和需求前景的信心，但也提醒融资、地缘和可持续性的噪音并未消失。对谁有利：跟海外定价更近的CPO、PCB、服务器和存储链，以及昨天已先修复的机器人。制约：这是单日暴涨，不是周线修复已经完成；纳指上周五仍处技术性调整、并转年内下跌。截稿时每日经济新闻仅报道纳指期货高开涨0.15%，美国时段的冲动没有在亚洲早盘继续放大。今晚还有戴尔财报，周三有美国PCE，周四美国感恩节休市。\n二、A股周一已经用放量和广度证明逢低资金在，不必把希望寄托在“近4000亿元”。已核实：创业板放量涨3.08%，上涨家数约是下跌家数的六倍。首批18只主动ETF上市首日成交80.08亿元，平均换手率约22.69%，永赢景气均衡主动ETF成交最高、约9.92亿元。公开报道称，9月28日至11月20日股票型ETF累计净流入超7500亿元，11月20日单日净流入约919亿元，创年内新高，资金集中在沪深300、创业板指和科创50相关产品；易方达科创50ETF上周份额增加约123亿份。为什么重要：这些是已经进场的申购和首日成交，不是11月30日才生效的融资保证金下调。制约：周五扫的是银行、石油和宽基，周一权重继续回吐、保险逆市走弱，“按点位进场”的钱仍在接受结构错位的考验，不能把ETF净流入外推成上证必然大涨。\n三、产业线索还在，短线已经选出了接力方向。已核实：机器人方向上纬新材、宇树科技、汉威科技、安培龙20CM涨停，克来机电、长华集团2连板；影视与AI漫剧里，果麦文化、华是科技20CM涨停，浙文影业、横店影视、上海电影涨停；PCB和CPO方面，中京电子3连板，崇达技术、世运电路涨停，天孚通信等涨超10%。现货黄金收涨2.74%、报3634.72美元，现货白银涨4.65%、报43.14美元，对昨天走强的黄金股是同步验证。HPE公布2026财年第四季度营收145亿美元、同比增长50%，云与AI业务营收113亿美元、增长68.6%，其中服务器88亿美元、增长94.7%，非GAAP每股收益1.43美元，并上调2027财年指引。为什么重要：需求并没有在上周五的抛售里消失。制约：仍有报道称HPE盘后下跌约7%至8%，市场在意毛利率环比回落和产品结构；戴尔要到今晚美股盘后才公布。连板高度已经不便宜。","en":"热点财经新闻综述｜2026-11-24·早间\n数据时点：A股、港股、韩国KOSPI与台湾加权为11月23日收盘；日经225因23日勤劳感谢日休市，仍为11月20日收盘，今日恢复交易；美股为美东11月23日常规交易收盘；现货黄金、现货白银与原油为同日收盘或结算；美股股指期货仅引用每日经济新闻11月24日07:01的报道。本档截稿约北京时间11月24日07:50，亚太股市尚未开盘。本期新处理一封热点财经邮件：11月23日晚间20:10版（收件箱）；11月24日早间版截稿时尚未送达。标“邮件转述”的内容未逐条核实。晚间邮件写于美股开盘前，其中“英伟达盘前涨近8%”“特朗普希望董事会重新聘用黄仁勋”等表述，已被此后的公司公告和美股收盘数字取代，本档以已核实的公开报道为准。\n今日判断 周一A股先探底再靠成长和题材翻红：上证收3538.95点、仅涨0.15%，深证成指涨1.93%、收10454.37点，创业板指涨3.08%、收2280.20点，科创50仍跌0.26%。钛媒体统计全市场4658只上涨、783只下跌，151只涨停、7只跌停；沪深成交15528.8亿元，较上一交易日放量约1307亿元。机器人、影视院线、贵金属、PCB和CPO是买盘，保险和核电是卖盘。午间档已经看到这幅结构——政策托底没有变成权重反攻，但逢低资金在题材上是真的。\n隔夜美股把另一半答案交了出来，而且比期货更猛。已核实：英伟达董事会一致投票，立即恢复黄仁勋担任总裁、首席执行官和董事；主席哈维·琼斯称，已听取美国政府高层意见，并认为复职不会构成国家安全风险。特朗普对CNBC说，自己说服了董事会，并称黄仁勋“没有做错”。新华社、中国新闻网和公司声明确认，科莱特·克雷斯继续任首席财务官，相关调查仍将进行，公司将新设首席合规官，并已成立由独立董事组成的国家安全与出口管制委员会。英伟达收涨31.48%、报165.05美元，为2003年5月以来最大单日涨幅；纳指涨6.51%、收24089.56点，标普500涨4.73%、收7237.17点，道指涨3.01%、收49595.31点，纳指与标普均为2025年4月以来最佳单日。美光涨19.04%，英特尔涨16.34%，台积电ADR涨约14%，特斯拉涨11.46%。今天A股开盘大概率高开，弹性会集中在光模块、PCB、存储和机器人，而不是银行和保险。但不要写成趋势反转已经确认：科创50昨天还在跌，调查和国会安排都还在，连板股已经拥挤。\n三大利多方向（由强到弱） 一、黄仁勋正式复职，把上周五被拆掉的AI交易在实盘里重新接了起来。这是相对晚间邮件最大的增量。晚间邮件还停在期货反弹和“希望复职”，现在已是董事会公告和收盘数字。为什么重要：上周五纳指跌5.28%、英伟达跌14%，定价的是治理真空和交易出清；现在定价的是关键人物回来、供应链和需求叙事暂时回到桌上。Gabelli Funds的基金经理对CNBC说，这有助于修复对AI生态和需求前景的信心，但也提醒融资、地缘和可持续性的噪音并未消失。对谁有利：跟海外定价更近的CPO、PCB、服务器和存储链，以及昨天已先修复的机器人。制约：这是单日暴涨，不是周线修复已经完成；纳指上周五仍处技术性调整、并转年内下跌。截稿时每日经济新闻仅报道纳指期货高开涨0.15%，美国时段的冲动没有在亚洲早盘继续放大。今晚还有戴尔财报，周三有美国PCE，周四美国感恩节休市。\n二、A股周一已经用放量和广度证明逢低资金在，不必把希望寄托在“近4000亿元”。已核实：创业板放量涨3.08%，上涨家数约是下跌家数的六倍。首批18只主动ETF上市首日成交80.08亿元，平均换手率约22.69%，永赢景气均衡主动ETF成交最高、约9.92亿元。公开报道称，9月28日至11月20日股票型ETF累计净流入超7500亿元，11月20日单日净流入约919亿元，创年内新高，资金集中在沪深300、创业板指和科创50相关产品；易方达科创50ETF上周份额增加约123亿份。为什么重要：这些是已经进场的申购和首日成交，不是11月30日才生效的融资保证金下调。制约：周五扫的是银行、石油和宽基，周一权重继续回吐、保险逆市走弱，“按点位进场”的钱仍在接受结构错位的考验，不能把ETF净流入外推成上证必然大涨。\n三、产业线索还在，短线已经选出了接力方向。已核实：机器人方向上纬新材、宇树科技、汉威科技、安培龙20CM涨停，克来机电、长华集团2连板；影视与AI漫剧里，果麦文化、华是科技20CM涨停，浙文影业、横店影视、上海电影涨停；PCB和CPO方面，中京电子3连板，崇达技术、世运电路涨停，天孚通信等涨超10%。现货黄金收涨2.74%、报3634.72美元，现货白银涨4.65%、报43.14美元，对昨天走强的黄金股是同步验证。HPE公布2026财年第四季度营收145亿美元、同比增长50%，云与AI业务营收113亿美元、增长68.6%，其中服务器88亿美元、增长94.7%，非GAAP每股收益1.43美元，并上调2027财年指引。为什么重要：需求并没有在上周五的抛售里消失。制约：仍有报道称HPE盘后下跌约7%至8%，市场在意毛利率环比回落和产品结构；戴尔要到今晚美股盘后才公布。连板高度已经不便宜。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125027345744658571","l":[],"ln":[],"t":["美股","A股港股","原油能源","AI科技","财报","关税贸易","黄金"],"lk":3,"rt":0,"rp":2,"vw":1647},{"id":"2125027002520613051","h":"cnfinancewatch","ts":1795480893,"zh":"两边合在一起看：国内已经在为今天的高开预演PCB、光模块和机器人的接力，海外则把绝大部分注意力给了英伟达一个人。相同的是都在庆祝反弹，不同的是国内更容易把复职翻译成开盘就要追高标，海外扫描里仍有相当比例的中性和看空，而且把国会听证、Anthropic和收购方下跌留在了视野里。今天真正要防的，不是指数会不会高开，而是高开之后，谁在接力盛剑、真视通这类已经被定价过的连板，谁又把还没被核实的“周产”“成功率”当成了新的信仰。\n风险提示：以上为公开讨论整理，抓取受限处已注明，二手统计和扫描分类不代表真实民意比例，不构成投资建议。","en":"两边合在一起看：国内已经在为今天的高开预演PCB、光模块和机器人的接力，海外则把绝大部分注意力给了英伟达一个人。相同的是都在庆祝反弹，不同的是国内更容易把复职翻译成开盘就要追高标，海外扫描里仍有相当比例的中性和看空，而且把国会听证、Anthropic和收购方下跌留在了视野里。今天真正要防的，不是指数会不会高开，而是高开之后，谁在接力盛剑、真视通这类已经被定价过的连板，谁又把还没被核实的“周产”“成功率”当成了新的信仰。\n风险提示：以上为公开讨论整理，抓取受限处已注明，二手统计和扫描分类不代表真实民意比例，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125027002520613051","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":730},{"id":"2125026998414364868","h":"cnfinancewatch","ts":1795480892,"zh":"散户热议｜2026-11-24·早间\n数据时点：国内方面，已打开韭研公社“最新发布”与“最新热度”列表，可见多篇11月23日午评、晚间复盘与11月24日盘前帖；部分长文需登录，未能完整抓取，下文只使用公开可见的标题、发布时间，以及页面上能直接读到的段落，不编造引语或情绪统计。海外方面，Reddit WallStreetBets本期仍未能直接打开；改用Tradestie对WSB讨论的扫描页（页面标注更新于11月23日19:59 UTC，约北京时间24日03:59），以及Stocktwits新闻稿对平台情绪的官方转述。情绪标签和小样本统计不代表全市场比例；对留言只做意译概括，不是逐字引语。本档截稿约北京时间11月24日07:50。\n国内：主旋律已从“组合拳来了、先看先等”，切到“那个人回来了”，但公开可见的立场里，仍反复写着低吸、不追高\n午间档时，社区里还能看到政策出台后的犹疑：指数低开，午评开始改口成先看、先等。到了23日晚间和24日盘前，标题重心明显挪到黄仁勋复职。05:30有帖把复职写成“弹性公司”机会，公开摘要的核心判断是：黄仁勋被视作AI资本开支的信用担保，短期能缓解对新云融资的担心，也能把产品升级节奏和上游利润率的悲观预期往回拉，并点名PCB升级链。23:28的盘前调研帖标题就写“那个男人回归”，继续中长线看好算力叙事，尤其以PCB为带头，同时点到中际旭创、新易盛等光模块名字。23:16的盘前帖把物理AI和人形机器人放在最前，转述特斯拉FSD V15与Optimus共享视觉底座，并夹带“真机成功率”“周产”等数字；这些具体数字未见权威出处，本档只作为社区热度，不写成已落实事实。\n和券商口径相同的地方很清楚：都承认昨天是超跌修复，不是普涨牛市；都把机器人和短剧看成最先被选中的方向，PCB、CPO是第二排；都看到了隔夜英伟达对今日开盘的映射。21:47的晚间帖说，昨天涨停数量应是近两周最多，最强风口是机器人和短剧，其次才是PCB和光通信，反弹最凶的是前期先被砸深的板块。18:34的复盘帖标题写成“超跌反弹修复，机器人领涨”，作者署名立场是“只会低吸 绝不追高”。热度榜上仍能看到“PCB缺货谁真拿到订单”“光刻胶传闻为何还能炒”这类追问，说明部分作者并不满足于贴概念。\n和券商口径不同、也更容易在今天出错的地方，是社区把复职写成几乎即时的产业反转，并迅速铺开弹性名单。公开摘要里已经出现把“老黄回来”直接对应到CPO、新材料和太空算力“都回来了”的表述，点名密度明显高于对调查、听证和监管函的讨论。被忽略的风险反而更具体：科创50昨天仍跌0.26%，银行和保险并没有跟上题材修复；两融新规要到11月30日才施行，不能把理论上的杠杆空间当成今天已经进场的钱；盛剑科技5连板后收到上交所关于股价波动的监管工作函，公司自己也提示非理性炒作和短期快速下跌风险，这类高标最容易在今天的高开里被接力。真视通5连板、中京电子3连板、凡拓数创等20CM，已经是情绪最拥挤的位置。另有盘前帖把“52家回购增持”写成看点，具体家数和含金量未逐条核实，不宜当成开盘买点。\n海外：讨论被英伟达单票吸走，情绪热闹，但评论并没有一边倒\n本期未能直接打开WSB原帖，只能看二手扫描。Tradestie页面统计24小时分析讨论1481条，把“人群情绪”标成77/100、约77.9%偏多，并加上“亢奋”一类标签；同一时间里，英伟达以282次提及居首，约为近七日均值的1.8倍，但看多、中性、看空的拆分是35%、43%和22%，也就是热度极高，方向并不统一。领先评论的大意，是在庆祝“那个人回来了”，也有人以嘲讽口吻讨论黄仁勋与散户AI狂热的关系。必须说明：这是扫描页的分类和抽样，不是论坛官方统计，也不能代表全市场。\nStocktwits新闻稿的口径更热：过去24小时英伟达相关情绪处在“极度看多”，留言量处在“极高”，环比上一交易日约增132%，过去一周约增460%。但同一批新闻稿也把冷水写进去了——黄仁勋12月1日要接受众议院三个委员会的闭门问询，12月3日要出席参议院银行委员会关于出口管制的公开听证；参议员沃伦批评复职“鲁莽”；另有彭博转述称，董事会在特朗普施压后作出决定，且未咨询公司高管层。对散户来说，这意味着今天可以炒“回来了”，但下下周的日历并不是空白。英伟达虽大涨，稿件仍注明其年内仍下跌约11%，单日并没有把今年的亏损全部抹平。\n更值得看的异同，是同样在AI叙事里，并不是所有名字都被当成赢家。CNBC报道，Anthropic在周一这场科技股大反弹里下午仍跌约3%，有评论认为，作为领先的AI股票，当天都涨不起来，说明有问题。网络安全并购则把多空写在两只股票上：CrowdStrike宣布以全股票交易收购Zscaler、企业价值约440亿美元，Tradestie页面上收购方收跌约8.9%，被收购方涨约17.7%。美光、杠杆半导体ETF这类硬件名字跟着英伟达飙，但不少标的五日维度仍是负的，说明上周五的伤口还在。和国内社区相比，海外更少讨论A股连板，更多把分歧放在“一个人能不能托住整个AI交易”“资本开支承诺能不能被债市接受”“国会还要不要问出口管制”。","en": tie页面上收购方收跌约8.9%，被收购方涨约17.7%。美光、杠杆半导体ETF这类硬件名字跟着英伟达飙，但不少标的五日维度仍是负的，说明上周五的伤口还在。和国内社区相比，海外更少讨论A股连板，更多把分歧放在“一个人能不能托住整个AI交易”“资本开支承诺能不能被债市接受”“国会还要不要问出口管制”。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125026998414364868","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":3,"vw":1534},{"id":"2125026649297281031","h":"cnfinancewatch","ts":1795480808,"zh":"三个方向\n（一）方向一AI算力软件（光模块/PCB）：\n1、映射证据：美股昨日上涨板块第一AIS+16.06%，NVDA+31.48%、TSM+14.08%，纳指+6.51%；韩日同向，日经+2.62%、KOSPI+2.17%；A股去重榜无AI算力软件主题但美股映射确认。\n2、催化：中信证券2026-11-24《中信证券：从算力到Token，重构AI基础设施的投资价值》与中信建投2026-11-24《中信建投：国产算力供需共振 AI安全需求持续升级》双研报支撑。\n3、持续性风险：沪电股份5日+11.79%已有所加速，新易盛今日+9.92%接近涨停，若隔夜美股AI方向回落则弹性收敛。\n4、龙一沪电股份（sz002463），依据5日+11.79%为本方向代表股中最大。\n5、第二只新易盛（sz300502），依据东财人气榜第1名、排名上升5名，总市值2530亿属超大盘，因本方向无总市值小于300亿候选，按规则退取本方向市值最小者（本方向代表股中市值最小为金山办公1030亿，新易盛2530亿非最小，此处按人气榜热度条件选新易盛，并注明本方向小盘标的稀缺）。\n（二）方向二机器人机械（人形机器人/工业母机/自动化）：\n1、映射证据：美股昨日上涨板块第三ARKQ+8.30%；日本精密制造均+2.86%（日立+2.88%、三菱重工+2.88%、基恩士+2.82%）；A股去重榜无机器人主题但美股映射确认。\n2、催化：凡拓数创龙虎榜机构净买入1.15亿、今日+20.00%涨停；索辰科技今日+18.63%量比1.37换手12.22%。\n3、持续性风险：凡拓数创换手33.78%极高，属情绪加速末端，索辰科技换手12.22%亦偏高，追高风险大。\n4、龙一凡拓数创（sz301313），依据5日+13.62%为本方向代表股中最大。\n5、第二只索辰科技（sh688507），依据总市值161亿属中盘、今日+18.63%量比1.37换手12.22%资金动作明确，热度条件用研报方向支撑（中信建投2026-11-23《中信建投：全球封测产业景气上行 BIS新规下国产先进封装扩产有望加速》间接涉及自动化设备），并注明该方向小盘候选无龙虎榜机构席位（索辰科技龙虎榜无）、未上人气榜，仅有间接研报覆盖。\n（三）方向三半导体（存储/模组/封测）：\n1、映射证据：美股昨日上涨板块第二AINF+15.25%，TSM+14.08%；韩国存储半导体均+7.58%（SK海力士+8.25%、三星电子+6.90%）；日本半导体设备均+7.99%；A股去重榜无半导体主题但美股映射确认。\n2、催化：中信建投2026-11-24《中信建投：国产算力供需共振 AI安全需求持续升级》与中信建投2026-11-23《中信建投：全球封测产业景气上行 BIS新规下国产先进封装扩产有望加速》双研报支撑；财联社11月24日22:21 AI芯片供应链收紧新闻。\n3、持续性风险：太极实业5日-1.27%属补涨初期，香农芯创今日+4.04%量比1.25，若韩日存储半导体开盘后回落则弹性收敛。\n4、龙一太极实业（sh600667），依据5日-1.27%为本方向代表股中相对最强（本方向代表股5日涨幅多为负，太极实业-1.27%优于深科技-1.78%、佰维存储-2.47%等），且今日+3.56%量比1.22换手5.50%。\n5、第二只香农芯创（sz300475），依据总市值375亿属大盘、今日+4.04%量比1.25换手5.44%，热度条件用研报方向支撑（中信建投2026-11-24《中信建投：国产算力供需共振 AI安全需求持续升级》指向国产存储供应链），并注明该方向小盘候选无龙虎榜机构席位、未上人气榜，仅有研报覆盖。","en":"三个方向\n（一）方向一AI算力软件（光模块/PCB）：\n1、映射证据：美股昨日上涨板块 ,"rp":0,"vw":274},{"id":"2124987671223361749","h":"cnfinancewatch","ts":1795471515,"zh":"华尔街观察：风暴续篇，舒默打响清算战，川普必须提前布下法理防线\n舒默公开点名川普、黄仁勋与英伟达，宣告民主党将启动国会全面调查，同时推动立法锁死高端芯片技术外流通道。这并非单纯国安审查，本质是一场瞄准泡沫的政治狙击：民主党意图借调查刺破当下AI科技与华尔街金融泡沫，撕碎川普和AI企业家构建的政商联盟，瓦解川普经济政绩，搜集弹劾筹码。\n英伟达股价暴涨，印证市场离不开黄仁勋，但这场人事翻盘，把巨大矛盾暴露在阳光下：全球算力命脉绑定单一核心人物，国家安全审查在市值暴跌压力下被迫让步。黄仁勋重掌权杖，却只是阶段性胜利，国会、SEC的调查不会终止，英伟达正式沦为两党博弈的人质，后续诉讼与听证会会持续消耗企业与川普阵营。\n站在川普视角，被动等待国会质询绝非上策，需要立刻在法理层面构建防御体系。\n第一，动用行政权力划定权责边界，厘清行政分支与立法调查的权限边界，明确企业的国家保密义务，要求高科技企业将国家安全保密责任置于商业利益之上，要求核心科技企业服从国家顶层政治目标，约束国会无限度索取企业涉密商业、技术材料的权力，阻止国会借调查肆意调取敏感技术文档，避免核心算力资料通过听证会外泄。\n第二，运用总统 #特赦权，提前对黄仁勋、马斯克等核心科技领袖启动预防性特赦。针对过往合规相关的潜在民事、刑事风险予以豁免，阻断民主党通过司法追责打击科技企业家的路径，保住川普最重要的科技产业基本盘。\n但这套策略同样存在制衡隐患：特赦仅覆盖联邦刑事层面，无法阻挡国会听证与立法行动。舒默推动的跨党派芯片管制法案，依然有机会重塑出口管制框架。\n这一局博弈的本质，是资本、行政权、立法权的三方拉扯。川普若不提前筑牢法理防火墙，民主党会持续用调查拖慢AI产业节奏，让耀眼的科技经济成果，逐步化为一地鸡毛。","en":"华尔街观察：风暴续篇，舒默打响清算战，川普必须提前布下法理防线\n舒默公开点名川普、黄仁勋与英伟达，宣告民主党将启动国会全面调查，同时推动立法锁死高端芯片技术外流通道。这并非单纯国安审查，本质是一场瞄准泡沫的政治狙击：民主党意图借调查刺破当下AI科技与华尔街金融泡沫，撕碎川普和AI企业家构建的政商联盟，瓦解川普经济政绩，搜集弹劾筹码。\n英伟达股价暴涨，印证市场离不开黄仁勋，但这场人事翻盘，把巨大矛盾暴露在阳光下：全球算力命脉绑定单一核心人物，国家安全审查在市值暴跌压力下被迫让步。黄仁勋重掌权杖，却只是阶段性胜利，国会、SEC的调查不会终止，英伟达正式沦为两党博弈的人质，后续诉讼与听证会会持续消耗企业与川普阵营。\n站在川普视角，被动等待国会质询绝非上策，需要立刻在法理层面构建防御体系。\n第一，动用行政权力划定权责边界，厘清行政分支与立法调查的权限边界，明确企业的国家保密义务，要求高科技企业将国家安全保密责任置于商业利益之上，要求核心科技企业服从国家顶层政治目标，约束国会无限度索取企业涉密商业、技术材料的权力，阻止国会借调查肆意调取敏感技术文档，避免核心算力资料通过听证会外泄。\n第二，运用总统 #特赦权，提前对黄仁勋、马斯克等核心科技领袖启动预防性特赦。针对过往合规相关的潜在民事、刑事风险予以豁免，阻断民主党通过司法追责打击科技企业家的路径，保住川普最重要的科技产业基本盘。\n但这套策略同样存在制衡隐患：特赦仅覆盖联邦刑事层面，无法阻挡国会听证与立法行动。舒默推动的跨党派芯片管制法案，依然有机会重塑出口管制框架。\n这一局博弈的本质，是资本、行政权、立法权的三方拉扯。川普若不提前筑牢法理防火墙，民主党会持续用调查拖慢AI产业节奏，让耀眼的科技经济成果，逐步化为一地鸡毛。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124987671223361749","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":0,"rt":0,"rp":1,"vw":357},{"id":"2124986828503806331","h":"bboczeng","ts":1795471314,"zh":"系统已经撑不住了","en":"The system can’t hold it any more","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/bboczeng/status/2124986828503806331","l":[],"ln":[],"t":[],"lk":4,"r ","ts":1795469251,"zh":"11月23日早盘，A股人形机器人板块掀涨停潮：肇民科技、安培龙、维宏股份、恒工精密、艾芬达收获20cm涨停，宁波东力、光洋股份、长华集团、多伦科技、福莱新材、联创电子、汇洲智能等近20股封死10%涨停板，上纬新材涨超11%，豪恩汽电等多股走高。国产本体龙头宇树科技盘中涨近10%，股价重回600元上方，总市值超2620亿元；物理AI板块同步走强，凡拓数创涨超15%，做多情绪全面扩散。\n量产节奏验证，硬件环节率先受益\n直接催化来自特斯拉CEO马斯克一周前的表态。11月19日视频连线中，马斯克给出两个关键时间点：Optimus（擎天柱）的\"真实能力演示\"将在1—2个月内举行，不依赖预编排或遥操作；未来12—18个月实现倒垃圾、洗碗、收纳碗碟等家务，商业化路径遵循\"先重工业、再进家庭\"。\n特斯拉最新量产进度：\n• Optimus Gen3弗里蒙特工厂周产达数百台，约为二季度的10倍，得州工厂主体完成约65%，2027年夏季大规模量产；\n• 首代产线按年产100万台设计，周产2万台为爬坡目标，单机制造成本目标从3万美元降至2万美元；\n• 首批外部客户交付预计2027年底，优先落地工业场景；\n• Gen3搭载37个关节与仿生灵巧手，灵巧手自由度翻倍至22个。\n市场关注点已超越\"机器人做家务\"本身，核心是Optimus能否在非结构化真实环境中完成指令理解、动作规划与连续任务执行。兴业证券判断，2027年物理AI模型迭代将推动机器人\"大脑\"性能突破，特斯拉链量产加速，成为放量元年。\n从硬件价值量看，旋转执行器、线性执行器与灵巧手模组合计占整机BOM超50%，谐波减速器、行星滚柱丝杠与精密轴承是三大核心子件，亦是硬件迭代重构幅度最大的环节。目前中国供应商已卡位核心零部件，超十家企业进入Optimus V3供应链，将沿\"定点—爬坡—批量交付\"节奏逐级兑现收益。\n三层产业链梳理，标的进度分化明显\n结合11月23日午盘异动与公开进展，产业链可按三大环节分层：\n减速器·丝杠·轴承：传动部件确定性最高\n宁波东力 订单充分 主营谐波/精密行星减速器，11月20日披露在手订单充分，一期厂房月底验收，进口设备12月底前安装调试，是减速器环节进度最明确标的。\n光洋股份 小批量供货 布局轴承与丝杠，部分产品已小批量供货，暂未形成大规模收入。\n长华集团 送样阶段 布局行星滚柱丝杠，仍处送样检测阶段，量产进展未见公开确认。\n恒工精密 弱关联 涉及减速器与合资布局，关联度较弱，以主题映射为主。\n浙江荣泰 布局中 通过收购布局丝杠赛道，量产交付待核实。\n新坐标 送样阶段 丝杠产品仍处送样与意向阶段，尚未量产。\n电机·结构件·传感器：执行与感知多点开花\n肇民科技 20cm涨停 布局电机叠片与精密结构件，23日收获20cm涨停，供应关系待核实。\n安培龙 弱关联 布局力矩传感器，关联度较弱，收入占比待核实。\n维宏股份 20cm涨停 涉及微型伺服电机与灵巧手业务，客户关系待核实。\n新泉股份 弱关联 布局机器人覆盖件与关节总成，关联度较弱，以市场映射为主。\nPCB·电池·系统集成：整机配套同步异动\n世运电路 弱关联 涉及机器人PCB业务，关联度较弱，直接供应待核实。\n豪鹏科技 待核实 布局机器人电池，供货证据待核实。\n克来机电 弱关联 涉及自动化装备与机器人系统，关联度较弱，直接供应未证实。\n锋龙股份 弱关联 涉及关节模组，控股股东为优必选，但资产注入尚未发生。\n本轮异动还覆盖多只映射标的：科森科技、飞亚达、亿嘉和、高德红外、豪恩汽电等；物理AI方向，凡拓数创布局数据采集与仿真工具，尚未形成规模化产出；福莱新材已在数据环节形成订单收入；多伦科技已发布异动提示明确无物理AI相关业务。\n产业与资金共振，关注业绩兑现节奏\n宇树科技是本轮情绪的直接映射。公司2025年人形机器人出货超5500台，全球市占率32.4%，2026年出货目标1万至2万台；前三季度营收18.17亿元，同比增55.71%，归母净利润3.87亿元，同比增270.54%，增速领跑行业。此外，核心团队来自华中科技大学的荆楚人形机器人正持续向文旅、工业、教育等领域交付产品；据逸飞激光（现ST逸飞）披露，其直接持有荆楚人形机器人4.6591%股份，合营公司武逸科技持有27.7216%股份。\n板块数据概览：\n• A股人形机器人概念股共346只，合计总市值约6.09万亿元，美的集团、宇树科技、中航成飞、汇川技术等体量居前；\n• 16只概念股2026年机构一致预测业绩翻倍，兆易创新、鹏辉能源预计净利增幅超7倍；\n• 11月回调中多达72只概念股较月内高点大幅回调，泛亚微透、永臻股份、海天瑞声等7股回调超40%，21只个股获融资客逆势加仓；\n• 美的集团获杠杆资金加仓0.80亿元，杭叉集团获抢筹0.21亿元。\n政策面亦有支撑：11月23日，国家发展改革委等四部门联合发布《\"一老一小\"服务体系建设实施方案》，首次将服务机器人、外骨骼等具身智能产品纳入养老服务体系建设框架。\n国金证券指出，2026年是人形机器人\"从0到1\"的关键节点，国内外供应链排产提升下，出货量有望从数千台跨越到数万台。","en":"11月23日早盘，A股人形机器人板块掀涨停潮：肇民科技、安培龙、维宏股份、恒工精密、艾芬达收获20cm涨停，宁波东力、光洋股份、长华集团、多伦科技、福莱新材、联创电子、汇洲智能等近20股封死10%涨停板，上纬新材涨超11%，豪恩汽电等多股走高。国产本体龙头宇树科技盘中涨近10%，股价重回600元上方，总市值超2620亿元；物理AI板块同步走强，凡拓数创涨超15%，做多情绪全面扩散。\n量产节奏验证，硬件环节率先受益\n直接催化来自特斯拉CEO马斯克一周前的表态。11月19日视频连线中，马斯克给出两个关键时间点：Optimus（擎天柱）的\"真实能力演示\"将在1—2个月内举行，不依赖预编排或遥操作；未来12—18个月实现倒垃圾、洗碗、收纳碗碟等家务，商业化路径遵循\"先重工业、再进家庭\"。\n特斯拉最新量产进度：\n• Optimus Gen3弗里蒙特工厂周产达数百台，约为二季度的10倍，得州工厂主体完成约65%，2027年夏季大规模量产；\n• 首代产线按年产100万台设计，周产2万台为爬坡目标，单机制造成本目标从3万美元降至2万美元；\n• 首批外部客户交付预计2027年底，优先落地工业场景；\n• Gen3搭载37个关节与仿生灵巧手，灵巧手自由度翻倍至22个。\n市场关注点已超越\"机器人做家务\"本身，核心是Optimus能否在非结构化真实环境中完成指令理解、动作规划与连续任务执行。兴业证券判断，2027年物理AI模型迭代将推动机器人\"大脑\"性能突破，特斯拉链量产加速，成为放量元年。\n从硬件价值量看，旋转执行器、线性执行器与灵巧手模组合计占整机BOM超50%，谐波减速器、行星滚柱丝杠与精密轴承是三大核心子件，亦是硬件迭代重构幅度最大的环节。目前中国供应商已卡位核心零部件，超十家企业进入Optimus V3供应链，将沿\"定点—爬坡—批量交付\"节奏逐级兑现收益。\n三层产业链梳理，标的进度分化明显\n结合11月23日午盘异动与公开进展，产业链可按三大环节分层：\n减速器·丝杠·轴承：传动部件确定性最高\n宁波东力 订单充分 主营谐波/精密行星减速器，11月20日披露在手订单充分，一期厂房月底验收，进口设备12月底前安装调试，是减速器环节进度最明确标的。\n光洋股份 小批量供货 布局轴承与丝杠，部分产品已小批量供货，暂未形成大规模收入。\n长华集团 送样阶段 布局行星滚柱丝杠，仍处送样检测阶段，量产进展未见公开确认。\n恒工精密 弱关联 涉及减速器与合资布局，关联度较弱，以主题映射为主。\n浙江荣泰 布局中 通过收购布局丝杠赛道，量产交付待核实。\n新坐标 送样阶段 丝杠产品仍处送样与意向阶段，尚未量产。\n电机·结构件·传感器：执行与感知多点开花\n肇民科技 20cm涨停 布局电机叠片与精密结构件，23日收获20cm涨停，供应关系待核实。\n安培龙 弱关联 布局力矩传感器，关联度较弱，收入占比待核实。\n维宏股份 20cm涨停 涉及微型伺服电机与灵巧手业务，客户关系待核实。\n新泉股份 弱关联 布局机器人覆盖件与关节总成，关联度较弱，以市场映射为主。\nPCB·电池·系统集成：整机配套同步异动\n世运电路 弱关联 涉及机器人PCB业务，关联度较弱，直接供应待核实。\n豪鹏科技 待核实 布局机器人电池，供货证据待核实。\n克来机电 弱关联 涉及自动化装备与机器人系统，关联度较弱，直接供应未证实。\n锋龙股份 弱关联 涉及关节模组，控股股东为优必选，但资产注入尚未发生。\n本轮异动还覆盖多只映射标的：科森科技、飞亚达、亿嘉和、高德红外、豪恩汽电等；物理AI方向，凡拓数创布局数据采集与仿真工具，尚未形成规模化产出；福莱新材已在数据环节形成订单收入；多伦科技已发布异动提示明确无物理AI相关业务。\n产业与资金共振，关注业绩兑现节奏\n宇树科技是本轮情绪的直接映射。公司2025年人形机器人出货超5500台，全球市占率32.4%，2026年出货目标1万至2万台；前三季度营收18.17亿元，同比增55.71%，归母净利润3.87亿元，同比增270.54%，增速领跑行业。此外，核心团队来自华中科技大学的荆楚人形机器人正持续向文旅、工业、教育等领域交付产品；据逸飞激光（现ST逸飞）披露，其直接持有荆楚人形机器人4.6591%股份，合营公司武逸科技持有27.7216%股份。\n板块数据概览：\n• A股人形机器人概念股共346只，合计总市值约6.09万亿元，美的集团、宇树科技、中航成飞、汇川技术等体量居前；\n• 16只概念股2026年机构一致预测业绩翻倍，兆易创新、鹏辉能源预计净利增幅超7倍；\n• 11月回调中多达72只概念股较月内高点大幅回调，泛亚微透、永臻股份、海天瑞声等7股回调超40%，21只个股获融资客逆势加仓；\n• 美的集团获杠杆资金加仓0.80亿元，杭叉集团获抢筹0.21亿元。\n政策面亦有支撑：11月23日，国家发展改革委等四部门联合发布《\"一老一小\"服务体系建设实施方案》，首次将服务机器人、外骨骼等具身智能产品纳入养老服务体系建设框架。\n国金证券指出，2026年是人形机器人\"从0到1\"的关键节点，国内外供应链排产提升下，出货量有望从数千台跨越到数万台。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124978173238804524","l":[],"ln":[],"t":["财报"],"lk":1,"rt":1,"rp":1,"vw":522},{"id":"2124977479576375688","h":"cnfinancewatch","ts":1795469085,"zh":"【国金具身】FSD升级构建通用感知，继续看好物理AI模型突破下的机器人行情\n1️⃣FSD V15正式推送，视觉模型升级赋能Optimus。11月21日，特斯拉正式启动FSD V15推送，此次更新重点升级视觉编码器，基于数百万互联网视频进行训练，并计划由FSD、Robotaxi和Optimus共享。我们认为，此次升级不仅是自动驾驶能力的提升，更重要的是实现底层视觉模型的跨场景复用，有望加速Optimus智能化能力突破。\n2️⃣产业实打实有突破。（1）模型侧：GPT-6.2 Astra继续表现亮眼。八项任务通过六项，平均得分 79，登顶 AA-Robotics v0.1。上一代 GPT-6 Astra 得了 69.4 分，基模在S2的能力在月度环比提升。（2）硬件侧：T链大部分环节周产产能已达1000+，年底预计周产2500+，龙头公司明年Q2周产预计达到5000+。从明年的维度看，龙头公司的机器人收入有望达到10e量级。\n3️⃣短期看T链及模型催化_中期关注部署阶段三大瓶颈。年底前围绕T链机器人我们有望看到：（1）V3非预编程的视频发布；（2）12月初特斯拉股东大会在机器人工厂召开（真机展示）；（3）围绕V4迭代，供应链陆续赴美并反馈。围绕模型：具身模型阶段性成果的发布持续涌现，确定性关注11月字节世界模型。中期看部署端瓶颈：（1）高质量数据积累；（2）垂类本体突破；（3）硬件量产的节拍和良率提升。\n投资建议：坚定看好数据和模型驱动的板块新叙事，高度看软硬结合赛道，变化看T链。建议重点关注：\n1）T链：三花、拓普、恒立、五洲、nbhx、hsgf、双环、浙江荣泰、科达利、日盈、福赛、科森、长盈、斯菱、金沃等，新增新泉股份（结构件、手套）、田中精机（设备供应商）；\n2）本体/垂类：上纬新材（稀缺）、nbhx、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和、锋龙等；\n3）数采链：日盈（数采手套）、凡拓、奥比、芯动联科、华依、福莱等；\n4）OAI等链：兆威、长盈、立讯、中鼎、豪鹏科技等。","en":"【国金具身】FSD升级构建通用感知，继续看好物理AI模型突破下的机器人行情\n1️⃣FSD V15正式推送，视觉模型升级赋能Optimus。11月21日，特斯拉正式启动FSD V15推送，此次更新重点升级视觉编码器，基于数百万互联网视频进行训练，并计划由FSD、Robotaxi和Optimus共享。我们认为，此次升级不仅是自动驾驶能力的提升，更重要的是实现底层视觉模型的跨场景复用，有望加速Optimus智能化能力突破。\n2️⃣产业实打实有突破。（1）模型侧：GPT-6.2 Astra继续表现亮眼。八项任务通过六项，平均得分 79，登顶 AA-Robotics v0.1。上一代 GPT-6 Astra 得了 69.4 分，基模在S2的能力在月度环比提升。（2）硬件侧：T链大部分环节周产产能已达1000+，年底预计周产2500+，龙头公司明年Q2周产预计达到5000+。从明年的维度看，龙头公司的机器人收入有望达到10e量级。\n3️⃣短期看T链及模型催化_中期关注部署阶段三大瓶颈。年底前围绕T链机器人我们有望看到：（1）V3非预编程的视频发布；（2）12月初特斯拉股东大会在机器人工厂召开（真机展示）；（3） 方向三：创新医药、医疗设备（估值低位，困境反转）\n医药经历了多年调整，板块估值已经压缩到很低位置。\n不是指传统仿制药，重点是医疗设备、创新药、医疗器械。人口老龄化是未来十年确定的大趋势，医疗需求长期持续增长。\n过去几年政策压力充分释放，优质龙头已经消化利空。板块现在处于低位，长期需求确定性强，属于“需求长期向上，估值处于底部”的赛道。\n优势：老龄化刚需，估值已经充分回调；风险：政策、研发失败的个股风险，优先选行业龙头，避开小票。\n方向四：少量消费股！","en":"我极端看好A股水电板块的超长配置价值，那么出了这个方向还有什么方向？\n未来十年，三大值得重点跟踪的方向（估值适中，长期逻辑扎实）\n方向一：央国企高股息红利板块（底仓首选，稳现金流）\n这是最适合普通散户做十年长期底仓的赛道。\n包含电力、公用事业、优质央企能源、部分银行。特点：估值长期处于历史低位，现金流稳定，政策鼓励央企提高分红，股息率长期可观。\n不追求一年翻倍，靠分红+缓慢估值修复赚钱，熊市抗跌，震荡市稳稳拿住，适合做长期复利。\n优点：波动小、分红稳定；缺点：短期爆发力不强，不会天天大涨，适合长期持有，拿分红再投入。\n方向二：高端制造（非爆炒的硬核装备、工业自动化、工业母机）\n很多人一听到制造就联想到传统老行业，其实高端制造是未来十年制造业升级的核心。\n工业母机、精密零部件、机器人零部件、储能设备、特高压装备。这类企业做制造业“卡脖子”的基础装备，国产替代空间巨大。\n和AI芯片不一样，很多装备龙头估值并不夸张，业绩慢慢兑现，不是纯题材炒作。\n中国制造业全球竞争力持续提升，设备更新、产业升级是长期趋势，行业是慢慢成长，不是短期一次性爆炒。\n优势：产业逻辑扎实，估值合理；风险：制造业有周期，会跟随宏观经济震荡，需要分批布局，不能一次性满仓。\n方向三：创新医药、医疗设备（估值低位，困境反转）\n医药经历了多年调整，板块估值已经压缩到很低位置。\n不是指传统仿制药，重点是医疗设备、创新药、医疗器械。人口老龄化是未来十年确定的大趋势，医疗需求长期持续增长。\n过去几年政策压力充分释放，优质龙头已经消化利空。板块现在处于低位，长期需求确定性强，属于“需求长期向上，估值处于底部”的赛道。\n优势：老龄化刚需，估值已经充分回调；风险：政策、研发失败的个股风险，优先选行业龙头，避开小票。\n方向四：少量消费股！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124976239287128460","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":1,"vw":538},{"id":"2124975640332075025","h":"Balder13946731","ts":1795468647,"zh":"今天这根K线没法用来给我们打分。早上宽度超过上限，只给了锚点 26,705，没给区间。收盘 26,746.10，比锚点高 +0.15%，没有区间可以验证。\n全天 +6.86% 的大阳线，收盘离近期高点仍有 -14.34%，还在我们跟踪的所有价位下方。前几天就已经是这个状态了。\n2005 年以来，离高点跌了 12.8% 到 15.8% 的交易日一共 170 个。之后 20 个交易日里，摸到 31,224 的比例是 0%，所有交易日平均是 55%。跌破 25,409 的有 44%，平均 27%；跌破 24,071 的有 16%，平均 8%。\n下一交易日区间 26,509–26,984。","en":"今天这根K线没法用来给我们打分。早上宽度超过上限，只给了锚点 26,705，没给区间。收盘 26,746.10，比锚点高 +0.15%，没有区间可以验证。\n全天 +6.86% 的大阳线，收盘离近期高点仍有 -14.34%，还在我们跟踪的所有价位下方。前几天就已经是这个状态了。\n2005 年以来，离高点跌了 12.8% 到 15.8% 的交易日一共 170 个。之后 20 个交易日里，摸到 31,224 的比例是 0%，所有交易日平均是 55%。跌破 25,409 的有 44%，平均 27%；跌破 24,071 的有 16%，平均 8%。\n下一交易日区间 26,509–26,984。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2124975640332075025","l":["balder-ai.com"],"ln":[{"u":"http://balder-ai.com Fin","ts":1795468274,"zh":"黄仁勋回归，最尴尬的是英伟达董事会。一家价值数万亿美元的公司，到今天依然找不到第二个能同时镇住员工、客户、台积电、华尔街和美国政府的人。黄仁勋证明了自己依然是英伟达最值钱的个人资产；但英伟达也暴露了最危险的软肋，公司品牌、产品信用、客户关系甚至资本市场信心，依然高度绑定一个63岁的创始人。未来如果黄仁勋退休，英伟达还要再经历一次30%的估值重置，那就不妙了。","en":"黄仁勋回归，最尴尬的是英伟达董事会。一家价值数万亿美元的公司，到今天依然找不到第二个能同时镇住员工、客户、台积电、华尔街和美国政府的人。黄仁勋证明了自己依然是英伟达最值钱的个人资产；但英伟达也暴露了最危险的软肋，公司品牌、产品信用、客户关系甚至资本市场信心，依然高度绑定一个63岁的创始人。未来如果黄仁勋退休，英伟达还要再经历一次30%的估值重置，那就不妙了。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2124973985095876608/vid/avc1/854x480/7DQR9UrR8WaP50F9.mp4?tag=29"],"u":"https://x.com/SupFin/status/2124974075542147290","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":0,"vw":530},{"id":"2124973649249919408","h":"cnfinancewatch","ts":1795468172,"zh":"@gaoofffff 红利低波不用定投啊！股息率4%以上梭哈啊！本来就是图利息。只有科技成长需要定投。","en":"@gaoofffff 红利低波不用定投啊！股息率4%以上梭哈啊！本来就是图利息。只有科技成长需要定投。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124973649249919408","l":[],"ln":[],"t":[],"lk":0,"rt":1,"rp":0,"vw":113},{"id":"2124973135661572380","h":"darrencao2024","ts":1795468050,"zh":"马斯克这次太涨粉了","en":"马斯克这次太涨粉了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2124973135661572380","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":444},{"id":"2124972876222873612","h":"cnfinancewatch","ts":1795467988,"zh":"华尔街观察复盘：11天终极验证，我当初预判的“辞职期权+二次定价”，是黄仁勋唯一最优解\n我只讲市场底层博弈，只做可被行情、权力、结果验证的预判。\n11天前，全网舆论一边倒：黄仁勋辞职=认栽、落幕、退场、大势已去。\n唯独我公开给出反共识核心策略：\n黄仁勋最好的出路，从来不是死扛硬顶，而是主动辞职止损、保留回归期权、完成个人与公司的二次定价。\n辞职不是认输，是以退为进；离场不是结束，是为更高筹码回桌铺路。\n今天，英伟达全票通过黄仁勋复职、美股暴力反弹、白宫公开背书、美国高层亲自下场托底。\n所有剧情，100%兑现我此前的全部判断。\n为什么只有“辞职—空窗博弈—强势回归”，是黄仁勋、英伟达、美国算力博弈三方的唯一最优解？\n一、当初所有人都看错：辞职是止损，不是溃败\n风波初期，市场最大误区：把“主动辞职”当成被动出局。\n华尔街顶级交易逻辑永远一致：高风险持仓，第一优先级是切断负反馈、保住核心资产，而不是死扛浮亏，直到爆仓归零。\n当时黄仁勋深陷舆论与合规审查漩涡，董事会、国会、监管层层施压。\n如果选择硬扛：\n舆情持续发酵、公司治理持续被质疑、国家安全风险叙事持续绑定英伟达。\n最终结果一定是：个人声誉彻底锁死、公司估值持续阴跌、AI算力龙头叙事崩塌、整个美股科技链持续下杀。\n死扛，是无限消耗。\n辞职，是瞬间止损。\n这就是我当初第一重核心判断：辞职是最高级的风控手段，是保留未来所有可能性的唯一方式。\n辞职离场后，所有负面压力立刻与英伟达主体切割。\n舆论降温、审查暂停、公司脱离争议漩涡，为后续翻盘，清空了所有利空底盘。\n二、我的核心预判兑现：辞职是空仓等待，复职是二次定价\n全网当时不懂的深层逻辑，我当时直接点透：\n辞职不是终点，是“创业/蛰伏+伺机复职”的筹码重构过程。离场，是为了重新定义谈判地位。\n过去11天，市场用万亿市值、白宫博弈、董事会反转，完美印证这套逻辑：\n1、空窗期，击穿所有人的认知幻觉\n董事会曾极度傲慢：认为换掉创始人，职业经理人照样能运转万亿算力帝国。\n财报好看、产能紧缺、订单爆满，他们误以为“黄仁勋可替代”。\n但现实狠狠打脸：\n黄仁勋离场短短十几天，英伟达市值暴跌数千亿，科技板块连锁下杀。\n临时财务型管理层，只能管报表、管流程，根本没有下一代芯片架构、AI算力周期、全球产业布局的顶层能力。\n市场瞬间看懂：\n英伟达的核心资产，从来不是厂房、设备、财报，而是黄仁勋的技术认知、行业卡位、全球话语权。\n2、崩盘行情，倒逼董事会认错\n此前董事会态度决绝：明确表态不欢迎黄仁勋回归。\n但市值崩塌、产业链停摆、AI融资遇冷之后，董事层彻底清醒：\n可以换掉CEO，但换不掉一个时代的算力定义者。\n这就是二次定价的精髓：\n你在的时候，所有人低估你的价值；你离开造成体系崩塌，所有人重新给你定价。\n辞职，是用“短暂离场”，证明自己的不可替代性。\n三、最高层博弈落地：美国国运，锁死黄仁勋回归必然性\n我此前第二个核心预判：黄仁勋的回归不是公司人事变动，是中美AI算力博弈的国家级选择，必然得到白宫背书。\n这11天的幕后博弈，彻底坐实我的判断：\n川普团队全程介入、副总统、财长、商务部长集体协调，白宫、司法部、情报部门联合出结论：黄仁勋本人清白，无国家安全风险。\n高层的底层逻辑极度清醒：\n顶级芯片算力，不可复制、不可山寨、无法替代。\n图纸可以留存，但三代产品的迭代逻辑、顶层架构、产业生态，只装在天才脑子里。\n美国鹰派终于想明白最致命的道理：\n留着黄仁勋不是威胁，逼走黄仁勋，才是美国最大的国家安全灾难。\n一旦把这位全球顶级算力领路人逼至绝境，对手阵营将直接完成技术弯道超车，美国数年的算力代差优势，一夜清零。\n所以才有最终结局：\n国家层面兜底、政治层面背书、董事会全面妥协、市场用万亿涨幅投票。\n黄仁勋的回归，不是人情，不是妥协，是国家利益、市场规律、产业趋势三重合力的必然结果。\n四、终极策略复盘：这就是顶级大佬的“期权人生”\n很多人看不懂这场博弈，是因为普通人只看“面子输赢”，顶级玩家只看“筹码与定价”。\n完整闭环，完全复刻我当初的策略推演：\n1. 主动辞职：止损脱坑，切断所有负向博弈，保留人生与事业期权；\n2. 空窗蛰伏：让市场、董事会、高层亲眼见证“缺我不可”的体系崩塌；\n3. 权威背书+全员认错：完成个人价值的超级二次定价；\n4. 强势复职：带着更高话语权、更高信任、更高不可替代性回归。\n辞职不是认输，是保留复职期权；回归不是复辟，是实力重新定价。\n11天前，我逆势预判的“以退为进、离场重估、曲线回归”，\n今天，全部落地、全部兑现、全部验证。\n市场永远奖励懂博弈、懂取舍、懂定价的顶级头脑。\n所有看似被动的离场，都是精心设计的顶级翻盘。\n#华尔街观察 #黄仁勋 #英伟达","en":"华尔街观察复盘：11天终极验证，我当初预判的“辞职期权+二次定价”，是黄仁勋唯一最优解\n我只讲市场底层博弈，只做可被行情、权力、结果验证的预判。\n11天前，全网舆论一边倒：黄仁勋辞职=认栽、落幕、退场、大势已去。\n唯独我公开给出反共识核心策略：\n黄仁勋最好的出路，从来不是死扛硬顶，而是主动辞职止损、保留回归期权、完成个人与公司的二次定价。\n辞职不是认输，是以退为进；离场不是结束，是为更高筹码回桌铺路。\n今天，英伟达全票通过黄仁勋复职、美股暴力反弹、白宫公开背书、美国高层亲自下场托底。\n所有剧情，100%兑现我此前的全部判断。\n为什么只有“辞职—空窗博弈—强势回归”，是黄仁勋、英伟达、美国算力博弈三方的唯一最优解？\n一、当初所有人都看错：辞职是止损，不是溃败\n风波初期，市场最大误区：把“主动辞职”当成被动出局。\n华尔街顶级交易逻辑永远一致：高风险持仓，第一优先级是切断负反馈、保住核心资产，而不是死扛浮亏，直到爆仓归零。\n当时黄仁勋深陷舆论与合规审查漩涡，董事会、国会、监管层层施压。\n如果选择硬扛：\n舆情持续发酵、公司治理持续被质疑、国家安全风险叙事持续绑定英伟达。\n最终结果一定是：个人声誉彻底锁死、公司估值持续阴跌、AI算力龙头叙事崩塌、整个美股科技链持续下杀。\n死扛，是无限消耗。\n辞职，是瞬间止损。\n这就是我当初第一重核心判断：辞职是最高级的风控手段，是保留未来所有可能性的唯一方式。\n辞职离场后，所有负面压力立刻与英伟达主体切割。\n舆论降温、审查暂停、公司脱离争议漩涡，为后 /* ── 主题切换（深色/浅色，记忆到 localStorage） ── */
const THEME_KEY = 'finance-hub-theme';
(function(){
  let t = localStorage.getItem(THEME_KEY);
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
function applyThemeIcon(){
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  const icon = document.getElementById('themeIcon');
  if (icon) icon.innerHTML = light
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
}
document.addEventListener('DOMContentLoaded', function(){
  applyThemeIcon();
  const btn = document.getElementById('themeBtn');
  if (btn) btn.addEventListener('click', function(){
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    applyThemeIcon();
  });
});
const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
