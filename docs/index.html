<head>

<title>财经资讯工作台 · X 信源</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">

<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>

w":11293},{"id":"2120174293745336549","h":"cnfinancewatch","ts":1794323917,"zh":"你以为最营养的肉是鸡胸肉？错。它连前二都进不去。\n按“综合营养密度+日常买得到”排个趣味榜，每种肉到底能干啥：\n🥩第5 虾：低脂高蛋白，每100克蛋白质约16.8克，脂肪不到1克；还含硒和碘，减脂期换口味的好选择。白灼、清炒都行，别油炸。\n🍗第4 鸡胸肉：蛋白质标杆，每100克约22—23克，脂肪不到1克；维生素B6含量突出，帮蛋白质代谢、支持免疫。煎之前拍松或低温慢煮，别煎成柴。\n🥩第3 牛肉：血红素铁在畜肉里排第一，锌也高；补铁、补锌、维持肌肉，对容易累、气色差的人实在。选里脊或后腿，少油快炒，别配大量黄油。\n🐟第2 三文鱼：Omega-3断层领先，DHA超1000毫克/100克、EPA超800毫克/100克；护心血管、抗炎、支持大脑。香煎或烤，别煎到油全出来。\n🥇第1 猪肝：真正的“天然复合维生素”，维生素A、B12、血红素铁、锌、铜全在线；鸭肝铁23.1毫克/100克，猪肝22.6毫克/100克，补铁效率极高。但胆固醇高，每周1—2次、每次50—100克足够，必须煮熟炒透。\n记住：没有“神肉”，轮着吃、控份量、少油盐，比死盯第一名重要。\n保存这张买菜清单；转给家里做饭的人；点赞收藏，别让好肉只停在收藏夹。#肉类营养 #蛋白质 #补铁 #三文鱼 #猪肝 #家常菜 #陈树玄鹤","en":"你以为最营养的肉是鸡胸肉？错。它连前二都进不去。\n按“综合营养密度+日常买得到”排个趣味榜，每种肉到底能干啥：\n🥩第5 虾：低脂高蛋白，每100克蛋白质约16.8克，脂肪不到1克；还含硒和碘，减脂期换口味的好选择。白灼、清炒都行，别油炸。\n🍗第4 鸡胸肉：蛋白质标杆，每100克约22—23克，脂肪不到1克；维生素B6含量突出，帮蛋白质代谢、支持免疫。煎之前拍松或低温慢煮，别煎成柴。\n🥩第3 牛肉：血红素铁在畜肉里排第一，锌也高；补铁、补锌、维持肌肉，对容易累、气色差的人实在。选里脊或后腿，少油快炒，别配大量黄油。\n🐟第2 三文鱼：Omega-3断层领先，DHA超1000毫克/100克、EPA超800毫克/100克；护心血管、抗炎、支持大脑。香煎或烤，别煎到油全出来。\n🥇第1 猪肝：真正的“天然复合维生素”，维生素A、B12、血红素铁、锌、铜全在线；鸭肝铁23.1毫克/100克，猪肝22.6毫克/100克，补铁效率极高。但胆固醇高，每周1—2次、每次50—100克足够，必须煮熟炒透。\n记住：没有“神肉”，轮着吃、控份量、少油盐，比死盯第一名重要。\n保存这张买菜清单；转给家里做饭的人；点赞收藏，别让好肉只停在收藏夹。#肉类营养 #蛋白质 #补铁 #三文鱼 #猪肝 #家常菜 #陈树玄鹤","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120174293745336549","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":1088},{"id":"2120173400874213494","h":"business","ts":1794323704,"zh":"以下是美国 10 月份 CPI 报告的主要要点 e-index?taid=6af334f7c6e521000183a19d&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Here are the key takeaways from the US CPI report for October","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120173400874213494","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-10/us-cpi-report-october-2026-key-takeaways-on-inflation-consumer-price-index?taid=6af334f7c6e521000183a19d&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter"," 20日高约5.2%。器械旗舰，适合回撤确认。\n4. #普尔特 $PHM ：周一收135.88美元涨2.56%，盘前约134.20美元跌约1.24%，但仅约176股，价格只作参考。近20日约+22.3%，近5日约+3.5%，距20日高约2.9%，周一量比约1.22。触发看CPI后再站稳周一低点134附近，失效看跌破周五收盘132.49。\n5. #托尔兄弟 $TOL ：周一收156.33美元涨2.47%，盘前几乎没有成交。近20日约+18.3%，近5日约+1.9%，距20日高约3.9%，周一量比约1.58。跟随普尔特，不单独追高。\n6. #霍顿房屋 $DHI ：周一收155.61美元涨2.19%，盘前约157.18美元但只有约347股，参考价值有限。近20日约+15.9%，近5日约+1.8%，距20日高约3.7%。住房备选，CPI公布前不加仓。\n#小盘阿尔法\n罗素2000期货基本平盘，风险偏好没有变得更热。期权方向和多基金同买仍缺互证。火箭实验室营收超预期、利润不及预期，盘前继续回吐，只当事件。CoreWeave要到周二美股收盘后才出报，不升格执行票。本轮不单列小盘标的。\n#操作提示\n不是空仓日，更不是把周一没跟上的半导体一次性补齐的日子。核心试错留给史赛克和美敦力，普尔特等CPI后再决定是否回踩承接。仓位中性，单票设好退出，总仓必须留给今晚21:30的CPI。英伟达调查没有结论前，AI硬件整体不加仓。沃勒已经把12月加息的门槛说得很硬，即便CPI略低于预期，也不要把住房和黄金的短线脉冲当趋势加速。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2120143287499776091","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["美联储","美股","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":721},{"id":"2120143248660611175","h":"cnfinancewatch","ts":1794316515,"zh":"美股盘前 11月10日晚间版\n先说结论：距开盘大约一个半小时，结构比下午版更拧。周一美股是超跌反弹，不是英伟达带领的科技翻身日。道指收52389点涨2.15%，标普收7550点涨2.35%，纳指收25253点涨2.74%，费城半导体涨约6.9%。但盘前期货已经走分：截至北京时间约21:05，标普期货约7573.5点几乎平盘，道指期货约52674点涨0.34%，纳指期货约27882.5点跌0.47%，罗素2000期货约2848.4点基本持平。下午版之后最大的新变量是利率。美联储理事沃勒称12月加息倾向落地，若通胀高于预期应考虑50个基点，否则只加25个基点会损害信誉。2年期美债收益率现约4.637%，较前值上行约6.9个基点，也明显高于下午版看到的4.559%；10年期约4.894%，凌晨那一截回落已经被收了回去。今晚21:30公布美国10月CPI，市场预期环比0.3%、核心0.2%，没有同比口径。今日最多做两类——医疗器械趋势、住房建设。如果只做3只：\n#史赛克 $SYK → #美敦力 $MDT → #普尔特 $PHM 。明确不做：抄底 $NVDA\n、把周一半导体反弹当趋势反转、在CPI前追住房股、追已下调目标价的光伏、追近5日涨幅过陡且盘前转弱的黄金股。\n#消息面\n沃勒讲话是下午版之后的硬事件，CPI还没出来，短端收益率已经先按偏鹰定价。原油继续减压，WTI约84.88美元跌2.23%，布伦特约90.14美元跌2.63%，CNBC称特朗普表示对伊朗再出手的可能性不大。黄金期货约4084.6美元跌0.75%，下午版还在小涨，方向已经翻了。\n#英伟达 $NVDA 盘前约177.38美元，较周一收盘178.67美元跌约0.72%，成交已放到约919万股，早盘一度转绿的报道没有守住。路透转述The\nInformation称，相关关系被指为至少75亿美元芯片经中资渠道出货提供便利，这是转述，不是已证实事实。半导体盘前偏弱， $INTC\n约跌2.64%，迈威尔约跌2.81%， $SMH\n约481.70美元跌约1.17%。Anthropic公布IPO定价区间70至78美元，这是情绪事件，不是今晚加仓AI硬件的理由。CoreWeave季报要到周二美东收盘后才出，盘前约48.13美元跌约1.74%，只观察。火箭实验室继续消化季报，盘前约54.17美元，较周一常规交易收盘跌约8.0%。思科在周三，应用材料在周四，英伟达下周二。\n#研报面\n和今天方向对得上的口径，没有看到下午版之后的新调整。仍是Piper\nSandler周一把史赛克目标价从325上调到350，维持增持；同一家把第一太阳能目标价从251下调到222，仍维持增持。住房链上，Stephens此前上调Installed\nBuilding Products目标价，属于同向微调，不是头部大行集体上调。CoreWeave一侧，富国把目标价从160下调到115、维持增持，出报前只观察。这些都是中等权重，不能单独覆盖技术位置。\n#资金面\n期权有方向的增仓、ARK多基金同买本轮仍未采集，不能用裸成交量凑共振。能确认的弱共振里，医疗器械相对更干净：20日趋势还在，史赛克有目标价上调，盘前\n$SYK 约涨0.55%、器械ETF $IHI 约涨0.60%，虽然量都很小。住房的中期逻辑没有被证伪，选举政策预期叠加 $ITB\n近20日约+18.4%仍居行业榜首，但短端收益率突然抬升， $PHM 盘前约跌1.24%、 $ITB\n几乎平盘，成交都极薄，说明CPI前资金没有给出加仓确认。黄金股ETF $GDX 盘前约跌2.69%，近5日约+15.6%的脉冲正在回吐。\n#期货\n截至北京时间约21:05：标普期货7573.5点几乎平盘，纳指期货27882.5点跌132.25点、跌0.47%，道指期货52674点涨176点、涨0.34%，罗素2000期货约2848.4点基本持平。黄金约4084.6美元跌0.75%，白银约52.23美元跌0.90%，铜约6.2975美元跌0.73%，WTI约84.88美元跌2.23%，布伦特约90.14美元跌2.63%，美元指数约101.66涨0.12%。10年期美债收益率约4.894%，2年期约4.637%、上行约6.9个基点。VIX上收19.92，较早的盘前报价约20.00，变化不大。股指期货成交量本轮未采集；公开页能看到持仓量，但与下午版为同一数值、缺前值对比，不做增减仓定论。\n#中美映射\n美股行业ETF用11月9日收盘测算：20日靠前为住房建设 $ITB 约+18.4%、房屋建筑商 $XHB 约+12.7%、医疗器械 $IHI\n约+11.0%、医疗 $XLV 约+9.5%、必选消费约+7.7%；5日榜黄金股 $GDX 约+15.6%领先，光伏 $TAN\n约+7.4%但周一已跌0.88%、盘前再跌约0.84%。半导体 $SMH\n近20日约-19.2%、近5日约-4.1%，周一涨5.05%、盘前又吐出约1.17%，没有改中期结构；机器人 $BOTZ\n近20日约-8.7%、近5日约-1.2%。A股主题用11月10日收盘：20日偏强的是酒约+7.5%、机器人ETF约+6.3%至+16.2%、医疗与医疗器械约+3.0%至+3.9%；5日领跑的是半导体设备约+18.3%、芯片与半导体约+10.5%至+11.8%、科创50约+10.0%、机器人约+7.1%至+10.9%、光伏约+6.2%至+6.6%、黄金约+5.1%。A股房地产ETF近20日仍约-7.7%至-7.9%，5日只有约1.5%的反弹。标注：20日共振——医疗器械与医药，美股更强、A股温和；5日共振——半导体和芯片，A股短端领跑，美股周一只是修复、盘前转弱，20日仍深负，慎当趋势仓；双窗口同现偏事件——机器人，A股双侧强，美股机器人ETF中期仍弱；仅5日慎追——贵金属与光伏，黄金盘前已在回吐；住房是美股独立行情，映射不是同步买入信号。","en":"美股盘前 11月10日晚间版\n先说结论：距开盘大约一个半小时，结构比下午版更拧。周一美股是超跌反弹，不是英伟达带领的科技翻身日。道指收52389点涨2.15%，标普收7550点涨2.35%，纳指收25253点涨2.74%，费城半导体涨约6.9%。但盘前期货已经走分：截至北京时间约21:05，标普期货约7573.5点几乎平盘，道指期货约52674点涨0.34%，纳指期货约27882.5点跌0.47%，罗素2000期货约2848.4点基本持平。下午版之后最大的新变量是利率。美联储理事沃勒称12月加息倾向落地，若通胀高于预期应考虑50个基点，否则只加25个基点会损害信誉。2年期美债收益率现约4.637%，较前值上行约6.9个基点，也明显高于下午版看到的4.559%；10年期约4.894%，凌晨那一截回落已经被收了回去。今晚21 sc.mp/zprl8","d":"sc.mp"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":604},{"id":"2120077763369480383","h":"business","ts":1794300902,"zh":"美国汽油价格自 7 月以来首次跌破每加仑 4 美元，尽管季节性价格仍大幅上涨，但消费者的加油压力有所缓解","en":"US gasoline dropped below $4 a gallon for the first time since July, offering consumers some relief at the pump, although prices remain significantly elevated on a seasonal basis","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120077763369480383","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-10/us-gasoline-prices-drop-below-4-a-gallon-after-months-of-pain?taid=6af2dbe6c6e52100017b3dd8&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["原油能源"],"lk":7,"rt":2,"rp":1,"vw":9265},{"id":"2120076758418694537","h":"cnfinancewatch","ts":1794300662,"zh":"周一美股是超跌反弹，不是英伟达带领的科技翻身日。道指收52389点涨2.15%，标普收7550点涨2.35%，纳指收25253点涨2.74%，费城半导体涨约6.9%，11个板块全红。\n但\n#英伟达 $NVDA 收178.67美元跌4.27%，是费半成分里唯一收跌的，也是4月7日以来最低收盘，成交放到约4.63亿股。亚洲时段又多出两条新变量：股东已对英伟达和黄仁勋提起集体诉讼，特朗普称联邦调查局正在了解相关传闻，中方继续否认所谓间谍叙事。股指期货现在只给温和高开。截至北京时间16:01前后，标普期货约7591点涨0.22%，道指期货约52702点涨0.39%，纳指期货约28014点几乎平盘；罗素2000期货时点较早，约15:03为2856点涨0.25%。今晚21:30公布美国10月CPI，市场预期环比0.3%、核心0.2%，没有同比口径；CME\nFedWatch显示12月加息概率仍在约84%。今日最多做两类——医疗器械趋势、住房建设。如果只做3只： #史赛克 $SYK → #普尔特\n$PHM → #美敦力 $MDT 。明确不做：抄底 $NVDA 、把周一半导体反弹当趋势反转、追 $NVR\n式跳空、追已下调目标价的光伏、追近5日涨幅过陡的黄金股。\n#消息面\n周一是修复日。 $AMD 涨13.26%， $AVGO 涨8.78%， $AMAT 涨11.37%，半导体ETF $SMH\n涨5.05%，只收回了上周一部分跌幅。英伟达的问题已经从董事会调查扩到诉讼和白宫表态，短线仍是个股风险，不是板块已经翻多。火箭实验室盘后交出三季报：营收约2.68亿美元高于预期，每股亏损0.12美元差于预期，积压订单约35.7亿美元；常规交易涨10.91%，盘后约跌6.6%，只当事件看。今晚还有CoreWeave季报，思科在周三，应用材料在周四，英伟达下周二。油价继续给通胀叙事减压，WTI周一收86.85美元，此时期货约85.19美元再跌约1.9%。\n#研报面\n和今天方向对得上的，是Piper\nSandler周一把史赛克目标价从325上调到350，维持增持；同一家把第一太阳能目标价从251下调到222，仍维持增持，但股价已经给出答案，周一收跌4.74%。住房链上，Stephens此前上调Installed\nBuilding Products目标价，属于同向微调，不是头部大行集体上调。CoreWeave一侧，富国把目标价从160下调到115、维持增持，出报前只观察。这些都是中等权重，不能单独覆盖技术位置。\n#资金面\n期权有方向的增仓、ARK多基金同买本轮均未采集，不能用裸成交量凑共振。能确认的只有弱共振：住房是中期选举政策预期叠加住房ETF近20日约+18.4%仍居行业榜首，周一\n$ITB 涨3.02%，成交量大约放大到前一日的2.1倍；医疗器械是20日趋势叠加史赛克目标价上调，器械ETF $IHI\n周一再涨1.70%。都还缺期权或机构持仓的第二项硬确认。黄金股ETF近5日约+15.6%仍最陡，只有短端脉冲，没有趋势翻多的资金证据。\n#期货\n截至北京时间16:00至16:38的公开报价：标普期货7591点涨16.75点、涨0.22%，纳指期货28014.25点几乎持平，道指期货52702点涨204点、涨0.39%。黄金期货约4125.9美元涨0.28%，铜约6.312美元跌0.51%，WTI约85.19美元跌1.91%，美元指数约101.43跌0.10%。10年期美债收益率约4.865%，下行约3个基点；2年期约4.559%，下行约0.9个基点。VIX上收19.92，一日回落5.72点，约跌22%，是2025年4月14日以来最大单日下降。股指期货成交量本轮未采集；公开页能看到持仓量，但缺前值对比，不做增减仓定论。\n#中美映射\n美股行业ETF用11月9日收盘测算：20日靠前为住房建设 $ITB 约+18.4%、房屋建筑商 $XHB 约+12.7%、医疗器械 $IHI\n约+11.0%、医疗 $XLV 约+9.5%、必选消费约+7.7%；5日榜黄金股 $GDX 约+15.6%领先，光伏 $TAN\n约+7.4%但周一已跌0.88%。半导体 $SMH 近20日约-19.2%、近5日约-4.1%，周一涨5.05%没有改中期结构；机器人\n$BOTZ 近20日约-8.7%、近5日约-1.2%，周一涨2.67%。A股主题用11月10日收盘：20日偏强的是酒约+7.5%、机器人ETF约+6.3%至+16.2%（不同产品差异大）、医疗与医疗器械约+3.0%至+3.9%、医药约+2.5%至+3.2%；5日领跑的是半导体设备约+18.3%、芯片与半导体约+10.5%至+11.8%、科创50约+10.0%、机器人约+7.1%至+10.9%、光伏约+6.2%至+6.6%、黄金约+5.1%。A股房地产ETF近20日仍约-7.7%至-7.9%，5日只有约1.5%的反弹。标注：20日共振——医疗器械与医药，美股更强、A股温和，今日不是A股主战场；5日共振——半导体和芯片，A股短端领跑，美股周一只是修复，20日仍深负，慎当趋势仓；双窗口同现偏事件——机器人，A股双侧强，美股机器人ETF中期仍弱；仅5日慎追——贵金属与光伏；住房是美股独立行情，映射不是同步买入信号。\n#三个方向\n医疗器械：20日趋势还在，周一史赛克几乎走平、成交萎缩，正好把周五回调后的分歧留给有研报支撑的龙头，而不是追已经走陡的品种。\n住房建设：20日仍是最强主线，周一放量跟进，政策逻辑没有被证伪，但已靠近近20日高点，今晚CPI对收益率敏感，只做回踩，不追跳空。\n光伏与AI硬件：降为观察。第一太阳能目标价下调并收跌，半导体周一反弹没有修掉20日跌幅，英伟达事件还在扩散，等CPI和本周财报。\n#六只个股\n1. #史赛克 $SYK ：收325.73美元，几乎平盘，近20日约+15.3%，近5日约+6.2%，距20日高约6.8%，量比约0.68。触发看放量重新站上330，失效看跌破周五低点322.56附近。\n2. #美敦力 $MDT ：收102.79美元涨0.97%，近20日约+11.8%，近5日约+3.5%，距20日高约3.2%。位置比史赛克更靠近近期高点，作器械主线补位。\n3. #直觉外科 $ISRG ：收460.56美元涨1.71%，近20日约+7.7%，近5日约+5.4%，距20日高约5.2%。器械旗舰，适合回撤确认。\n4. #普尔特 $PHM ：收135.88美元涨2.56%，近20日约+22.3%，近5日约+3.5%，距20日高约2.9%，量比约1.22。住房链代表，触发看回踩后仍站稳周一低点134附近，失效看跌破周五收盘132.49。\n5. #托尔兄弟 $TOL ：收156.33美元涨2.47%，近20日约+18.3%，近5日约+1.9%，距20日高约3.9%，量比约1.58。跟随普尔特，不单独追高。\n6. #霍顿房屋 $DHI ：收155.61美元涨2.19%，近20日约+15.9%，近5日约+1.8%，距20日高约3.7%。住房备选，CPI公布前不加仓。\n#小盘阿尔法\n罗素2000期货小幅高开，风险偏好还在，但期权方向和多基金同买仍缺互证。火箭实验室营收超预期、利润不及预期，盘后回吐，只当事件，不升格执行票。本轮不单列小盘标的。\n#操作提示\n不是空仓日，也不是把周一没跟上的半导体一次性补齐的日子。核心试错留给史赛克和普尔特，美敦力补位。仓位中性，单票设好退出，总仓留余地给今晚CPI。英伟达调查没有结论前，AI硬件整体不加仓。CoreWeave、应用材料和思科都只观察，不进只做3只名单。高开过猛的住房股等第一次回踩再进。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"周一美股是超跌反弹，不是英伟达带领的科技翻身日。道指收52389点涨2.15%，标普收7550点涨2.35%，纳指收25253点涨2.74%，费城半导体涨约6.9%，11个板块全红。\n但\n#英伟达 $NVDA 收178.67美元跌4.27%，是费半成分里唯一收跌的，也是4月7日以来最低收盘，成交放到约4.63亿股。亚洲时段又多出两条新变量：股东已对英伟达和黄仁勋提起集体诉讼，特朗普称联邦调查局正在了解相关传闻，中方继续否认所谓间谍叙事。股指期货现在只给温和高开。截至北京时间16:01前后，标普期货约7591点涨0.22%，道指期货约52702点涨0.39%，纳指期货约28014点几乎平盘；罗素2000期货时点较早，约15:03为2856点涨0.25%。今晚21:30公布美国10月CPI，市场预期环比0.3%、核心0.2%，没有同比口径；CME\nFedWatch显示12月加息概率仍在约84%。今日最多做两类——医疗器械趋势、住房建设。如果只做3只： #史赛克 $SYK → #普尔特\n$PHM → #美敦力 $MDT 。明确不做：抄底 $NVDA 、把周一半导体反弹当趋势反转、追 $NVR\n式跳空、追已下调目标价的光伏、追近5日涨幅过陡的黄金股。\n#消息面\n周一是修复日。 $AMD 涨13.26%， $AVGO 涨8.78%， $AMAT 涨11.37%，半导体ETF $SMH\n涨5.05%，只收回了上周一部分跌幅。英伟达的问题已经从董事会调查扩到诉讼和白宫表态，短线仍是个股风险，不是板块已经翻多。火箭实验室盘后交出三季报：营收约2.68亿美元高于预期，每股亏损0.12美元差于预期，积压订单约35.7亿美元；常规交易涨10.91%，盘后约跌6.6%，只当事件看。今晚还有CoreWeave季报，思科在周三，应用材料在周四，英伟达下周二。油价继续给通胀叙事减压，WTI周一收86.85美元，此时期货约85.19美元再跌约1.9%。\n#研报面\n和今天方向对得上的，是Piper\nSandler周一把史赛克目标价从325上调到350，维持增持；同一家把第一太阳能目标价从251下调到222，仍维持增持，但股价已经给出答案，周一收跌4.74%。住房链上，Stephens此前上调Installed\nBuilding Products目标价，属于同向微调，不是头部大行集体上调。CoreWeave一侧，富国把目标价从160下调到115、维持增持，出报前只观察。这些都是中等权重，不能单独覆盖技术位置。\n#资金面\n期权有方向的增仓、ARK多基金同买本轮均未采集，不能用裸成交量凑共振。能确认的只有弱共振：住房是中期选举政策预期叠加住房ETF近20日约+18.4%仍居行业榜首，周一\n$ITB 涨3.02%，成交量大约放大到前一日的2.1倍；医疗器械是20日趋势叠加史赛克目标价上调，器械ETF $IHI\n周一再涨1.70%。都还缺期权或机构持仓的第二项硬确认。黄金股ETF近5日约+15.6%仍最陡，只有短端脉冲，没有趋势翻多的资金证据。\n#期货\n截至北京时间16:00至16:38的公开报价：标普期货7591点涨16.75点、涨0.22%，纳指期货28014.25点几乎持平，道指期货52702点涨204点、涨0.39%。黄金期货约4125.9美元涨0.28%，铜约6.312美元跌0.51%，WTI约85.19美元跌1.91%，美元指数约101.43跌0.10%。10年期美债收益率约4.865%，下行约3个基点；2年期约4.559%，下行约0.9个基点。VIX上收19.92，一日回落5.72点，约跌22%，是2025年4月14日以来最大单日下降。股指期货成交量本轮未采集；公开页能看到持仓量，但缺前值对比，不做增减仓定论。\n#中美映射\n美股行业ETF用11月9日收盘测算：20日靠前为住房建设 $ITB 约+18.4%、房屋建筑商 $XHB 约+12.7%、医疗器械 $IHI\n约+11.0%、医疗 $XLV 约+9.5%、必选消费约+7.7%；5日榜黄金股 $GDX 约+15.6%领先，光伏 $TAN\n约+7.4%但周一已跌0.88%。半导体 $SMH 近20日约-19.2%、近5日约-4.1%，周一涨5.05%没有改中期结构；机器人\n$BOTZ 近20日约-8.7%、近5日约-1.2%，周一涨2.67%。A股主题用11月10日收盘：20日偏强的是酒约+7.5%、机器人ETF约+6.3% ay’s underlying inflation eased last month as estimated","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120061408888934769","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-10/norway-core-prices-cool-likely-reducing-pressure-for-rate-hike?taid=6af2ccab191e68000106e16f&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["通胀"],"lk":4,"rt":3,"rp":1,"vw":11313},{"id":"2120060242386178169","h":"cnfinancewatch","ts":1794296725,"zh":"A股盘中 11月10日 复盘，请和A股盘前预测对战：\n先说结论：指数高开后回吐，上证只收出0.08%的微红，深成和创业板更强，这是中小盘与题材的赚钱日，不是权重趋势日。早盘三条线里，算力硬件还在，但主战场已从设备切到光模块和PCB；商业航天竞价高潮明显退潮，贵金属只剩弱反弹，不宜再当进攻仓。盘中真正共振的是消费电子与AI眼镜、人形机器人，外加一条资金仍扎实的光通信与PCB。不要追连板字辈和已封死的高标，仓位中性偏多，盯今晚CPI。\n#盘面速览\n截至收盘，上证3663.72点涨0.08%，深成指11241.54点涨0.86%，创业板指2494.40点涨1.46%，科创50报1265.02点涨0.64%，沪深300涨0.07%。上证开在3682.04点、冲高3683.73点后一路回吐，指数平淡、个股不弱：上证口径上涨1656家、下跌622家，中证全指上涨3933家、下跌1054家。两市成交额合计约1.50万亿元。国证2000涨1.75%，上证50跌0.58%，中小盘显著强于权重。\n#板块风格\n行业涨幅靠前的是影视动漫、影视院线、传媒、消费电子、机器人、光学光电子和通信网络设备。概念侧智能音箱、短剧互动游戏、影视、AI眼镜、苹果概念、虚拟现实、人形机器人居前。跌幅侧钾肥、民爆、煤炭和航运油气靠后。进攻落在传媒情绪、端侧硬件和机器人，周期股在撤。光伏概念仍小涨但净流出，贵金属几乎走平，都不再是今天的主战场。\n#资金面\n行业主力净流入靠前：电子约86亿、传媒约45亿、半导体约38亿、通信网络设备约35亿、机械设备约32亿、通信设备约31亿，消费电子约22亿。净流出侧有色与铝、石油石化、国防军工、航运、非银靠前。概念上机器人概念净流入约88亿，人形机器人约56亿，CPO和光通信模块合计约90亿，AI眼镜约41亿。光伏净流出约15亿。北向实时接口全日返回占位零值，北向数据暂不可用。\n#涨停\n东财收盘涨停池93家、炸板19家，封板率约83%，情绪偏热。7板是闽发铝业，三板里东方新能、日出东方、大东方、龙江交通仍偏字辈或情绪定价，不升格主线。涨停扩散较多的是汽车零部件、光学光电、消费电子和影视游戏。高位连板和字辈票不宜再追。\n#盘中消息\n隔夜美股大涨、韩股半导体链早盘暴涨的风险偏好延续到A股，但指数没有走成普涨。更直接的催化是Anthropic发布新模型、英伟达发布世界动作模型GR00T\n2，抬升机器人溢价；AI短剧与金鸡电影节首次设立AI单元，对影视传媒有事件驱动。海关总署公布前10个月进出口同比增20%、10月出口同比增35.2%，偏中期利好。药明康德移出美国国防部1260H名单对医药偏暖，但医药今天不是主战场。现货黄金回落至约4128美元，WTI约85.2美元续跌。今晚21:30还有美国10月CPI。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #宇树科技 $688836 、 #日出东方 $603366 、 #冰山冷热 $000530 、 #东方海洋\n$002086 、 #文投控股 $600715 、 #雪人集团 $002639 、 #大东方 $600327 、 #华策影视 $300133\n、 #东方新能 $002310\n等。同花顺热榜亦见冰山冷热、阳光照明、宇树、中际旭创、新易盛。东方新能涨停是算力板卡合同的情绪定价，不宜算进硬件主线。\n#中美映射\n美股主题ETF用11月9日收盘：SMH收涨5.05%，近5日仍跌4.1%、近20日跌17.5%；SOXX收涨7.49%，近5日跌约3.0%、近20日跌约19%；机器人BOTZ收涨2.67%，近5日跌1.2%、近20日跌8.7%。A股刷新至收盘：近5日领跑的是半导体设备与芯片，消费电子、机器人、传媒紧随其后；近20日仍是酒、机器人、医药医疗、汽车和传媒相对占优，半导体与光伏的20日仍为负。今日对早盘映射有修正：5日领先的贵金属和光伏明显掉队，短线脉冲慎追；20日医药医疗没有成为主战场；机器人是双窗口同现且今日继续走强，只是美股BOTZ中期仍弱。半导体是5日共振，20日趋势尚未转正。\n#三个方向\n消费电子与AI眼镜：板块涨幅和AI眼镜净流入都靠前，端侧硬件是今天新抬上来的主线，优先有订单和芯片能力的，不追亏损情绪票。\n人形机器人与物理AI：隔夜模型和资金净流入都对得上，本体只当方向观察，执行与自动化里挑有业绩的，不追高位连板。\n光通信与PCB：早盘算力硬件这条线还在，但设备已经走弱，胜宏高开回吐、中微收跌；真正有成交和净流入的是光模块与PCB，短线已启动，注意回撤。\n#六只个股\n1. #沪电股份 $002463\n：收81.30元、涨5.45%。近5日约+4.0%，近20日仍约-30%。三季报营收同比约+72%、净利约+107%，是早盘六只里盘中唯一明显走强的业绩仓。\n2. #新易盛 $300502\n：收183.80元、涨4.43%，成交约163亿、主力净流入约14亿。近5日约+6.0%，近20日仍约-48%。三季报营收同比约+93%、净利约+80%，对应CPO成交最集中的位置。\n3. #富瀚微 $300613\n：收80.02元、涨20.01%封板。近5日约+29%，近20日约+10%。三季报营收同比约+124%、净利约+845%，消费电子与CIS弹性最大，已涨停只作方向样本，不宜再追。\n4. #歌尔股份 $002241 ：收25.69元、涨3.84%。近5日约+15%，近20日约+25%。三季报营收与净利大致持平，是未涨停的消费电子龙头观察仓。\n5. #赛腾股份 $603283\n：收40.23元、涨10.01%封板。近5日约+23%，近20日约+10%。三季报营收同比约+12%、净利约+28%，作为机器人执行侧的业绩样本，同样不追板。\n6. #宇树科技 $688836\n：收761.01元、涨6.29%，市值约3078亿，人气榜第一。近5日约+22%，近20日约+74%。三季报营收同比约+56%、净利约+271%，增长快但估值极高，只作方向观察，不宜单押。\n#小盘阿尔法\n #清溢光电 $688138 ：收32.16元、涨13.68%，市值约101亿，掩膜版配套半导体与先进封装。近5日约+20%，近20日约+4.3%。三季报营收同比约+4.9%、净利约+11%，尾盘有回吐，不宜加仓。竞价曾尝试连板的\n#超声电子 $000823 回落到涨3.25%并净流出，暂不作为阿尔法。\n#操作提示\n不是空仓日，也不是把上午没跟上的方向一次性补齐的日子。商业航天竞价高潮已退，西部材料和中科星图都从高开大幅回吐；贵金属只剩弱反弹，山东黄金不必再当超短主攻。胜宏收涨约1.1%、中微收跌，设备端并未同步。核心仓留给PCB、光模块和消费电子里能对上业绩的，机器人只拿执行侧或观察仓，传媒与字辈严格止盈。今晚CPI或扰动外盘，仓位中性。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘中 11月10日 复盘，请和A股盘前预测对战：\n先说结论：指数高开后回吐，上证只收出0.08%的微红，深成和创业板更强，这是中小盘与题材的赚钱日，不是权重趋势日。早盘三条线里，算力硬件还在，但主战场已从设备切到光模块和PCB；商业航天竞价高潮明显退潮，贵金属只剩弱反弹，不宜再当进攻仓。盘中真正共振的是消费电子与AI眼镜、人形机器人，外加一条资金仍扎实的光通信与PCB。不要追连板字辈和已封死的高标，仓位中性偏多，盯今晚CPI。\n#盘面速览\n截至收盘，上证3663.72点涨0.08%，深成指11241.54点涨0.86%，创业板指2494.40点涨1.46%，科创50报1265.02点涨0.64%，沪深300涨0.07%。上证开在3682.04点、冲高3683.73点后一路回吐，指数平淡、个股不弱：上证口径上涨1656家、下跌622家，中证全指上涨3933家、下跌1054家。两市成交额合计约1.50万亿元。国证2000涨1.75%，上证50跌0.58%，中小盘显著强于权重。\n#板块风格\n行业涨幅靠前的是影视动漫、影视院线、传媒、消费电子、机器人、光学光电子和通信网络设备。概念侧智能音箱、短剧互动游戏、影视、AI眼镜、苹果概念、虚拟现实、人形机器人居前。 能源"],"lk":1,"rt":0,"rp":0,"vw":9214},{"id":"2120056385782141107","h":"business","ts":1794295805,"zh":"以下是您开始新的一天需要了解的内容：欧洲早间简报","en":"Here’s what you need to know to start your day: Morning Briefing Europe","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120056385782141107","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-10/nvidia-s-intervention-in-chip-probe-brings-fresh-scrutiny?taid=6af2c7fd191e68000106e15e&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":1,"rp":1,"vw":9659},{"id":"2120056003190227011","h":"cnfinancewatch","ts":1794295714,"zh":"A股盘中 11月10日\n先说结论：指数高开后回吐，上证只收出0.08%的微红，深成和创业板更强，这是中小盘与题材的赚钱日，不是权重趋势日。早盘三条线里，算力硬件还在，但主战场已从设备切到光模块和PCB；商业航天竞价高潮明显退潮，贵金属只剩弱反弹，不宜再当进攻仓。盘中真正共振的是消费电子与AI眼镜、人形机器人，外加一条资金仍扎实的光通信与PCB。不要追连板字辈和已封死的高标，仓位中性偏多，盯今晚CPI。\n#盘面速览\n截至收盘，上证3663.72点涨0.08%，深成指11241.54点涨0.86%，创业板指2494.40点涨1.46%，科创50报1265.02点涨0.64%，沪深300涨0.07%。上证开在3682.04点、冲高3683.73点后一路回吐，指数平淡、个股不弱：上证口径上涨1656家、下跌622家，中证全指上涨3933家、下跌1054家。两市成交额合计约1.50万亿元。国证2000涨1.75%，上证50跌0.58%，中小盘显著强于权重。\n#板块风格\n行业涨幅靠前的是影视动漫、影视院线、传媒、消费电子、机器人、光学光电子和通信网络设备。概念侧智能音箱、短剧互动游戏、影视、AI眼镜、苹果概念、虚拟现实、人形机器人居前。跌幅侧钾肥、民爆、煤炭和航运油气靠后。进攻落在传媒情绪、端侧硬件和机器人，周期股在撤。光伏概念仍小涨但净流出，贵金属几乎走平，都不再是今天的主战场。\n#资金面\n行业主力净流入靠前：电子约86亿、传媒约45亿、半导体约38亿、通信网络设备约35亿、机械设备约32亿、通信设备约31亿，消费电子约22亿。净流出侧有色与铝、石油石化、国防军工、航运、非银靠前。概念上机器人概念净流入约88亿，人形机器人约56亿，CPO和光通信模块合计约90亿，AI眼镜约41亿。光伏净流出约15亿。北向实时接口全日返回占位零值，北向数据暂不可用。\n#涨停\n东财收盘涨停池93家、炸板19家，封板率约83%，情绪偏热。7板是闽发铝业，三板里东方新能、日出东方、大东方、龙江交通仍偏字辈或情绪定价，不升格主线。涨停扩散较多的是汽车零部件、光学光电、消费电子和影视游戏。高位连板和字辈票不宜再追。\n#盘中消息\n隔夜美股大涨、韩股半导体链早盘暴涨的风险偏好延续到A股，但指数没有走成普涨。更直接的催化是Anthropic发布新模型、英伟达发布世界动作模型GR00T\n2，抬升机器人溢价；AI短剧与金鸡电影节首次设立AI单元，对影视传媒有事件驱动。海关总署公布前10个月进出口同比增20%、10月出口同比增35.2%，偏中期利好。药明康德移出美国国防部1260H名单对医药偏暖，但医药今天不是主战场。现货黄金回落至约4128美元，WTI约85.2美元续跌。今晚21:30还有美国10月CPI。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #宇树科技 $688836 、 #日出东方 $603366 、 #冰山冷热 $000530 、 #东方海洋\n$002086 、 #文投控股 $600715 、 #雪人集团 $002639 、 #大东方 $600327 、 #华策影视 $300133\n、 #东方新能 $002310\n等。同花顺热榜亦见冰山冷热、阳光照明、宇树、中际旭创、新易盛。东方新能涨停是算力板卡合同的情绪定价，不宜算进硬件主线。\n#中美映射\n美股主题ETF用11月9日收盘：SMH收涨5.05%，近5日仍跌4.1%、近20日跌17.5%；SOXX收涨7.49%，近5日跌约3.0%、近20日跌约19%；机器人BOTZ收涨2.67%，近5日跌1.2%、近20日跌8.7%。A股刷新至收盘：近5日领跑的是半导体设备与芯片，消费电子、机器人、传媒紧随其后；近20日仍是酒、机器人、医药医疗、汽车和传媒相对占优，半导体与光伏的20日仍为负。今日对早盘映射有修正：5日领先的贵金属和光伏明显掉队，短线脉冲慎追；20日医药医疗没有成为主战场；机器人是双窗口同现且今日继续走强，只是美股BOTZ中期仍弱。半导体是5日共振，20日趋势尚未转正。\n#三个方向\n消费电子与AI眼镜：板块涨幅和AI眼镜净流入都靠前，端侧硬件是今天新抬上来的主线，优先有订单和芯片能力的，不追亏损情绪票。\n人形机器人与物理AI：隔夜模型和资金净流入都对得上，本体只当方向观察，执行与自动化里挑有业绩的，不追高位连板。\n光通信与PCB：早盘算力硬件这条线还在，但设备已经走弱，胜宏高开回吐、中微收跌；真正有成交和净流入的是光模块与PCB，短线已启动，注意回撤。\n#六只个股\n1. #沪电股份 $002463\n：收81.30元、涨5.45%。近5日约+4.0%，近20日仍约-30%。三季报营收同比约+72%、净利约+107%，是早盘六只里盘中唯一明显走强的业绩仓。\n2. #新易盛 $300502\n：收183.80元、涨4.43%，成交约163亿、主力净流入约14亿。近5日约+6.0%，近20日仍约-48%。三季报营收同比约+93%、净利约+80%，对应CPO成交最集中的位置。\n3. #富瀚微 $300613\n：收80.02元、涨20.01%封板。近5日约+29%，近20日约+10%。三季报营收同比约+124%、净利约+845%，消费电子与CIS弹性最大，已涨停只作方向样本，不宜再追。\n4. #歌尔股份 $002241 ：收25.69元、涨3.84%。近5日约+15%，近20日约+25%。三季报营收与净利大致持平，是未涨停的消费电子龙头观察仓。\n5. #赛腾股份 $603283\n：收40.23元、涨10.01%封板。近5日约+23%，近20日约+10%。三季报营收同比约+12%、净利约+28%，作为机器人执行侧的业绩样本，同样不追板。\n6. #宇树科技 $688836\n：收761.01元、涨6.29%，市值约3078亿，人气榜第一。近5日约+22%，近20日约+74%。三季报营收同比约+56%、净利约+271%，增长快但估值极高，只作方向观察，不宜单押。\n#小盘阿尔法\n #清溢光电 $688138 ：收32.16元、涨13.68%，市值约101亿，掩膜版配套半导体与先进封装。近5日约+20%，近20日约+4.3%。三季报营收同比约+4.9%、净利约+11%，尾盘有回吐，不宜加仓。竞价曾尝试连板的\n#超声电子 $000823 回落到涨3.25%并净流出，暂不作为阿尔法。\n#操作提示\n不是空仓日，也不是把上午没跟上的方向一次性补齐的日子。商业航天竞价高潮已退，西部材料和中科星图都从高开大幅回吐；贵金属只剩弱反弹，山东黄金不必再当超短主攻。胜宏收涨约1.1%、中微收跌，设备端并未同步。核心仓留给PCB、光模块和消费电子里能对上业绩的，机器人只拿执行侧或观察仓，传媒与字辈严格止盈。今晚CPI或扰动外盘，仓位中性。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘中 11月10日\n先说结论：指数高开后回吐，上证只收出0.08%的微红，深成和创业板更强，这是中小盘与题材的赚钱日，不是权重趋势日。早盘三条线里，算力硬件还在，但主战场已从设备切到光模块和PCB；商业航天竞价高潮明显退潮，贵金属只剩弱反弹，不宜再当进攻仓。盘中真正共振的是消费电子与AI眼镜、人形机器人，外加一条资金仍扎实的光通信与PCB。不要追连板字辈和已封死的高标，仓位中性偏多，盯今晚CPI。\n#盘面速览\n截至收盘，上证3663.72点涨0.08%，深成指11241.54点涨0.86%，创业板指2494.40点涨1.46%，科创50报1265.02点涨0.64%，沪深300涨0.07%。上证开在3682.04点、冲高3683.73点后一路回吐，指数平淡、个股不弱：上证口径上涨1656家、下跌622家，中证全指上涨3933家、下跌1054家。两市成交额合计约1.50万亿元。国证2000涨1.75%，上 来，作为重要股东，他或意识到公司重新出发更符合其自身及全体股东利益。有媒体引述分析师及前员工提出数名接任人选，包括英伟达副总裁巴克(Ian Buck)、克雷斯，至于黄仁勋两名子女均在英伟达任职，是否能接手或胜任，则存在较大疑问。有分析认为，英伟达没有明显可接替黄仁勋人选，因黄仁勋影响力远不止于CEO一职，该公司约60位高层主管可直接向他汇报，他本人亦密切参与公司日常营运，高层能够直接与他沟通，意味没有明显第二把手，Bernstein分析员对媒体直言，“黄仁勋就是英伟达，英伟达就是黄仁勋。”","en":"美媒爆猎头或已开始物色英伟达CEO潜在人选\n11月10日｜英伟达CEO黄仁勋爆出“出轨”丑闻，市场关注这间晶片巨头接任人安排，有分析文章指，猎头公司或已开始在业界物色人选，潜在人选包括超微半导体(AMD)行政总裁苏姿丰、晶片设计公司ARM行政总裁哈斯(Rene Haas)等重磅人物。The Information分析文章指，猎头公司或已开始物色人选，以防英伟达董事会一旦决定撤换黄仁勋时，可提出替代方案。其中AMD在苏姿丰领导下收入大幅上升，然而，两家公司存在竞争关系或令其过档较为复杂，加上她与黄仁勋有亲属关系，亦是障碍之一。哈斯或是更佳选择，因其早年曾在英伟达任职7年，以及对半导体行业非常熟悉。文章提到，由于英伟达并无明显的“第二把交椅”可随时接替黄仁勋，虽然财务总监克雷斯可出任临时替代人选，但非长期接班安排。黄仁勋最终很可能需要退下来，作为重要股东，他或意识到公司重新出发更符合其自身及全体股东利益。有媒体引述分析师及前员工提出数名接任人选，包括英伟达副总裁巴克(Ian Buck)、克雷斯，至于黄仁勋两名子女均在英伟达任职，是否能接手或胜任，则存在较大疑问。有分析认为，英伟达没有明显可接替黄仁勋人选，因黄仁勋影响力远不止于CEO一职，该公司约60位高层主管可直接向他汇报，他本人亦密切参与公司日常营运，高层能够直接与他沟通，意味没有明显第二把手，Bernstein分析员对媒体直言，“黄仁勋就是英伟达，英伟达就是黄仁勋。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2120029101058904223","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":892},{"id":"2120028699907047697","h":"business","ts":1794289204,"zh":"中国正接近富裕国家的地位，经济规模达20万亿美元。但与即将成为同龄人的国家相比，许多人仍然很穷 ely-poor?taid=6af2ae34191e68000106e0f5&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"China is nearing rich-country status with a $20 trillion economy. But compared with its soon-to-be peers, many of its people are still poor","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2120028699907047697","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-09/china-s-economy-is-nearly-20-trillion-but-its-citizens-remain-relatively-poor?taid=6af2ae34191e68000106e0f5&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":1,"rp":0,"vw":11844},{"id":"2120027625909559631","h":"cnfinancewatch","ts":1794288948,"zh":"散户热议｜2026-11-10·午间\n数据时点：2026-11-10 约13:15–13:40\n北京时间。国内优先访问韭研公社公开页；《11月10日午间复盘》《午间网络热门题材1110》等帖可以打开标题和发布时间，但正文未能稳定抓取（页面偏登录/图片），故不编造引语或情绪统计，只依据帖名、时间戳与公开检索摘要，并补充可核验的公开盘面数据。海外依据Stocktwits英伟达公开页（同期抓取）。Reddit\nWallStreetBets热门页本期仍未能稳定读到11月10日当日帖文正文，二手汇总数据互相打架，故不转述具体评论或提及次数。本文区分【社区观点】与【可核事实】。\n【国内：韭研公社 + 公开盘面】\n1. 社区午间讨论明显转向“主线有了”，焦点是机器人、AI影视，而不是早盘还在说的太空算力。【社区观点／检索摘要】署名“彤彤姐姐”的《11月10日午间复盘》于12:37发布，署名“survivor35”的《午间网络热门题材1110》于12:44发布；公开检索对热门题材帖的摘要称，AI影视相关讨论由约2篇增至约12篇，机器人由约11篇增至约17篇，航天热度回落，福莱新材为当日较高频标的之一。另有短剧、端侧AI等相关推荐帖出现。【可核事实】公开午评确认影视院线、人形机器人、CPO走强，慈文传媒、掌阅科技、上海电影、文投控股等涨停或走强；金融界据交易所盘中数据，午间机器人概念主力资金净流入68.49亿元居首，CPO\n51.79亿元，短剧互动游戏23.40亿元。与券商口径的异同：机构更强调量能回升、外贸和关税窗口；社区更快把交易落在“哪条主线能接力、哪只是龙头”。被忽略的风险：主线成立，不等于高价股和涨停股都可以追——宇树自低点已接近翻倍，利润增速还在回落。\n2. “东方”系和“羊”字辈仍是情绪垃圾桶，也是最容易出现亏钱效应的地方。【社区观点／检索摘要】公社盘前到午间仍有“东方”系、羊字辈补涨与退潮的讨论，检索结果把它写成名称玄学与高位风险并存，不能当作已核实的逐条评论。【可核事实】日出东方、东方新能等公开报道录得3连板，阳光照明被报道为九个交易日七个涨停且早盘再封，公司近日多次发风险提示。与券商口径几乎不在同一个市场：一边在给光模块和出口链做基本面定价，一边在做名字接力。追高风险很具体——高位换手一旦对倒结束，跟风盘会先被留下。\n3. 赚钱效应半日看起来很好，但结构极不均匀。【可核事实】超3800只个股上涨，公开报道涨停约53家、跌停0家，半日成交约9682亿元；同时沪指只涨0.06%，油气、煤炭、海运、保险偏弱。社区若把“差不多都在涨”理解成指数行情，会漏掉权重并未跟上、高低切换随时能发生这一点。药明康德被移出美国国防部1260H名单，A股午间只涨约0.5%，也说明并非所有利好都会被立刻炒起来。\n【海外：Stocktwits｜社区观点 + 可核事实】\n1. 英伟达页情绪读数仍标注为95、Extremely\nBullish，但内容并不一边倒。【可核事实】页面显示前收178.67美元，隔夜报价约179.73美元、涨0.59%，财报定在11月17日。【社区观点】多条公开留言仍是“需求还在、适合抄底、丑闻会过去、等财报”；也有人追问调查期间谁来主持业绩会、董事会会不会动管理层，以及“知情资金是否早已出货”。指控本身仍在调查中，不能把社区争论写成事实。被忽略的风险：情绪读数偏多，只说明愿意说话的人偏多，不代表事件风险已经定价完毕；财报周和调查重叠，波动不对称。\n2. WSB：本期未能稳定读取当日热门帖正文，因此不作细节转述，以免把旧帖或互相冲突的二手统计想象成今日观点。\n【小结】\n国内散户午间交易的是机器人、AI影视和还在蹦的名称连板；海外散户交易的是英伟达该不该抄底。券商口径更靠近量能、外贸与事件周风险管理，社区口径更靠近主线和板。把太空算力、微末参股或名字写成订单，或把CEO调查直接等同于AI需求证伪，都是当前最常见的过度解读。公社正文抓取缺口、WSB读取失败已标明；Stocktwits为公开页整理，引述以原帖为准。\n以上不构成投资建议，投资有风险。","en":"散户热议｜2026-11-10·午间\n数据时点：2026-11-10 约13:15–13:40\n北京时间。国内优先访问韭研公社公开页；《11月10日午间复盘》《午间网络热门题材1110》等帖可以打开标题和发布时间，但正文未能稳定抓取（页面偏登录/图片），故不编造引语或情绪统计，只依据帖名、时间戳与公开检索摘要，并补充可核验的公开盘面数据。海外依据Stocktwits英伟达公开页（同期抓取）。Reddit\nWallStreetBets热门页本期仍未能稳定读到11月10日当日帖文正文，二手汇总数据互相打架，故不转述具体评论或提及次数。本文区分【社区观点】与【可核事实】。\n【国内：韭研公社 + 公开盘面】\n1. 社区午间讨论明显转向“主线有了”，焦点是机器人、AI影视，而不是早盘还在说的太空算力。【社区观点／检索摘要】署名 、连板和名称炒作上加仓，都过早。下午看量能能否守住，以及出口链对关税暂停正式生效的反应。\n【三大利多方向】（由强到弱）\n1. 算力硬件与光通信修复，成交和上涨家数同时改善。【已核实】公开午评中，CPO、PCB、光通信、半导体涨幅居前；早盘报道中际旭创、新易盛涨超6%。金融界据交易所盘中数据：午间题材主力资金净流入前五为机器人概念68.49亿元、5G概念62.27亿元、CPO\n51.79亿元、人形机器人49.44亿元，PCB为35.86亿元。这是对隔夜费城半导体大涨、英伟达却独跌的分散映射：资金买的是光模块、PCB和机器人链条，而不是单押一个海外龙头。意义在于，周一全天成交跌破1.5万亿后，今日半日已接近9700亿元，修复有量配合。制约是持续性仍取决于海外AI资本开支和订单，不能把早盘反弹写成调整结束。\n2. 人形机器人成为当日最强定价主线。【已核实】宇树科技盘中一度涨超11%、股价回到800元上方、市值突破3200亿元；公开报价约778.50元、涨约8.73%，自10月15日低点404.03元反弹接近100%，盘中成为A股第三高价股。福莱新材等机器人相关股涨停。公司三季度营收6.65亿元、同比增69.93%，归母净利1.13亿元、同比降17.37%。物理AI已进入高价股定价阶段，弹性最大，也最容易透支；低点附近翻倍后再追，回撤会放大。\n3. 外贸数据超预期，叠加关税暂停正式生效，出口链有基本面垫子。【已核实】海关总署：前10个月货物贸易进出口44.81万亿元、同比增20%，出口25.99万亿元、增17.6%，进口18.82万亿元、增23.6%；10月当月进出口4.87万亿元、增31.2%。对美加征24%关税自13时01分起继续暂停两个月，保留10%。同期，卫健委等四部门通知优化创新药配备使用，不对医疗机构总药品品种品规数量作硬性限制；药明康德公告被移出美国国防部1260H名单，但A股午间仅约涨0.5%，利好已被部分消化。制约是关税窗口可逆，出口改善也掩盖不了内需和资源品走弱。\n【三大利空方向】（由强到弱）\n1. 英伟达治理事件尚未结束，指数与龙头继续背离。【已核实】周一英伟达收跌约4.27%、报178.67美元；公司董事会已启动独立董事调查，11月17日将发布财报。盘前/隔夜报价仅小幅反弹。相关指控仍在调查中，不能写成定论。对A股的含义是：今天可以交易算力链修复，但不能假设海外龙头风险已经出清。若财报周再出不利信息，今天买得最热的CPO与机器人也会先波动。\n2. 名称炒作与高位连板仍在争夺流动性。【已核实】“东方”系再掀涨停潮，日出东方、东方新能等公开报道录得3连板；阳光照明被报道为九个交易日七个涨停，早盘再度封板，公司近日多次提示风险。这与机器人、CPO不是同一类交易：前者靠名字和情绪接力，后者至少有产业映射。一旦高位股分化，跟风盘会先出现亏钱效应，并抽走题材资金。\n3. 外部去杠杆余波与通胀数据真空仍在。【已核实】公开报道转述高盛对上周美国基本面对冲基金仓位的解读：总杠杆单周下降约8.7个百分点至约207.5%，净杠杆约43.3%，接近2020年3月以来最显著的单周去杠杆。这是上周已发生的事，周一美股大涨说明部分抛压已被对冲，但不能当成风险消失。另据劳工统计局相关说明，原定本周公布的美国10月CPI将缺少同比数据（2025年政府停摆导致基期缺失），市场只能更多看环比。【邮件转述】个别联储官员偏鹰表态本期未全部核对原文，先作观察。不宜把半日反弹外推成趋势反转。\n多空如何制约：量能回升、外贸与关税窗口，对冲的是指数失速；对冲不了“英伟达事件周”和“高位名称接力”。沪指几乎平盘、创业板偏强，本身就是提醒——钱在结构里，不在权重里。下午重点看半日近9700亿元的量能否延续，以及13:01之后出口链是否有增量，而不是连板梯队有多热闹。\n来源主要为新华财经/中国金融信息网午评、中新网、海关总署、财政部关税公告、央视新闻与证券时报、公司公告、金融界盘中资金以及凤凰网等公开报道，交叉今日午间及早间热点财经邮件线索。不构成投资建议，投资有风险。\n================","en":"热点财经新闻综述｜2026-11-10·午间\n数据时点：2026-11-10 约13:15–13:40\n北京时间。本稿交叉核实今日午间热点财经邮件、早间档发出后送达的早间热点财经邮件，以及公开网页。【已核实】附来源，【邮件转述】不作硬事实。自今日13时01分起，对美加征24%关税继续暂停、保留10%的措施已正式生效。\n今日判断：上午是“指数平、结构热、量能回来了”。【已核实】截至午间，上证指数报3662.81点、涨0.06%，深证成指涨0.76%，创业板指报2495.29点、涨1.49%，科创综指涨1.32%；全市场半日成 。\n订阅","en":"#六只个股\n1. #沪电股份 $002463 ：竞价约80.00元、+3.76%，回购加芯片修复逻辑被高开定价，等回撤再看量价。\n2. #胜宏科技 $300476 ：竞价约138.88元、+5.68%，六只里弹性最大，也是最容易被情绪放大的，不宜追高开。\n3. #中微公司 $688012 ：竞价约253.00元、+2.02%，昨跌约2.4%后修复，订单与回购故事未变。\n4. #中国卫星 $600118 ：竞价约58.36元、+1.50%，弱于西材和星图，仍按事件仓纪律。\n5. #捷佳伟创 $300724 ：竞价约59.49元、+1.24%，回购观察仓，没有新的强化信息。\n6. #山东黄金 $600547 ：竞价约27.05元、+1.24%，跟金价小高开，继续当超短工具。\n#小盘阿尔法\n #清溢光电 $688138 ：竞价约29.09元、+2.83%，今早仍有掩膜版三期扩产报道在流通，逻辑与第一版相同，看审批和订单，不把高开当确认。\n#超声电子 $000823 ：竞价约19.65元、+10.02%，尝试连板。人气榜仍第十，短线资金和PCB热度叠在一起，连板外溢风险比第一版更高，小仓试错、破位即出。\n#操作提示\n第一版的判断还成立：不是空仓日，更不是追高开日。算力硬件用回撤做，太空算力看开盘分歧，贵金属当超短。字辈和冰雪只当温度计，东方海洋竞价跌停就是提醒。美东CPI在今晚，外盘翻脸要收缩题材仓。总仓中性，单票试错并预设退出。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119978612531384778","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["AI科技","黄金"],"lk":0,"rt":0,"rp":0,"vw":12},{"id":"2119978608672522667","h":"cnfinancewatch","ts":1794277262,"zh":"A股盘前第二版 11月10日\n先说结论：对照第一版，三条主线没有被证伪，集合竞价把权重写得更清楚了。隔夜美股和费半修复之后，韩股早盘大涨并曾触发sidecar、台股加权涨约2.1%，算力硬件在竞价里明显高开；太空算力里材料和星图抢跑，中国卫星只温和高开；黄金仍在4100美元上方，山东黄金小高开。指数尚未正式开盘，上证虚拟匹配几乎平开在3660.74点。风险偏好还在，但字辈里东方海洋竞价跌停，说明情绪票已经分化，更不适合追连板。主线仍是AI算力硬件、太空算力与商业航天、贵金属超短。总仓中性，高开的先看回撤再动手。\n#消息面\n两小时更新为主。韩综指现涨约3.8%，早盘报道一度涨超5%并启动sidecar，SK海力士、三星电子跟涨；台股加权涨约2.1%。这是对隔夜费半大涨的亚太接力，强化算力硬件开盘定价。\n#药明康德 $603259 公告美国国防部将其从1260H项下中国军工企业名单移除，对CXO情绪偏正面。 #东方新能 $002310\n隔夜签署约9.12亿元算力板卡采购合同，用于AI推理、微调及渲染，同时提示算力服务尚处起步、未形成相关收入和确定订单，合同执行有不确定性；今早异常波动公告同步流通，竞价仍按涨停附近定价，属于情绪票贴上算力标签，不把它升格为主线样本。联想宣布首个混合词元母本工厂落地张家口；Anthropic据悉拟IPO募资至多693亿美元。快舟六号可重复使用火箭拟2027年首飞回收，商业航天降本叙事延续。国内商品期货开盘燃油跌超5%、SC原油跌超4%，沪银涨超1%。今日13时01分继续暂停对美加征24%关税，第一版已提示，按点生效。美东今晚仍有10月CPI。\n#研报面\n今早新公开的行业口径：开源证券计算机2027年度策略强调从大模型竞赛到算力需求井喷；国新证券计算机三季报称景气向算力集中；中信建投计算机2027年策略建议关注国产算力等方向。国新证券另有高端制造点评，称美国人形机器人第一股上市，产业定价从演示转向交付。第一版援引的万联电子跟踪和华安对胜宏科技等PCB标的买入评级仍在，未见被新报告推翻。与六只样本直接对应的新个股研报两小时内未见。\n#热榜\n东财人气榜较第一版变化不大：前十仍是雪人集团、日出东方、顺灏股份、东方新能、冰山冷热、东方海洋、大东方、龙江交通、文投控股、超声电子。\n#西部材料 $002149 升至第11， #中国卫星 $600118 从第12降至第14， #上纬新材 $688585\n从第11降至第13。冰雪与字辈情绪仍重，但西部材料前移、东方海洋竞价跌停，说明同一热度池子已经开始分流。\n#资金面\n截至11月9日两市融资余额约22595亿元，较前一日增加约120.69亿元；当日ETF整体净申购约108.35亿元，其中股票型约54.04亿元。第一版提到的互换便利券商买入和龙虎榜情绪票净买入格局没有新的盘前修正。集合竞价里昨日涨停、昨日连板概念虚拟涨幅约8%至9%，资金愿意接力情绪，但也在东方海洋上给出反向定价。\n#中美映射\n映射沿用早盘快照，开盘后未重算。半导体ETF\nSMH收涨约5.0%，近5日仍约-4%、近20日约-18%；机器人BOTZ收涨约2.7%，近5日约-1%、近20日约-9%。A股主题至11月9日：5日靠前为光伏、黄金、电池、半导体，20日靠前为酒、医药、汽车、医疗。亚太开盘后韩股半导体链大涨，相当于把5日半导体脉冲又确认了一遍；20日趋势仓仍看医药医疗，药明康德摘牌消息对这一侧偏暖。太空算力仍是A股事件驱动，中美ETF映射弱。\n#期货\n富时中国A50相关报价约13024点，较前值12906约高0.91%，比第一版所见的约13045点略回吐，夜盘涨约1.06%后早盘低开。现货黄金在约4140至4145美元波动，与第一版所见4100上方格局一致；WTI约86.3美元，较第一版的86.5附近再软一点。国内股指期货日盘尚未开始，仍以9日收盘为参考。恒生指数尚未开盘，前收约24449点。\n#三个方向\nAI算力硬件：竞价验证最强。PCB概念约+2.1%，CPO约+2.8%，光通信模块约+2.7%，光刻机约+2.7%，印制电路板行业约+3.3%。\n#胜宏科技 $300476 竞价约+5.7%， #沪电股份 $002463 约+3.8%， #中微公司 $688012\n约+2.0%，光模块里 #新易盛 $300502 约+5.7%、 #中际旭创 $300308\n约+4.0%。逻辑仍是美股芯片修复加电子链回购，只是高开后更要等回撤，不要把东方新能这类情绪票算进这条主线。\n太空算力与商业航天：星云星座计划叙事还在，快舟六号补充了商业航天降本想象。竞价里 #西部材料 $002149 约+10%， #中科星图\n$688568 约+15.8%， #中国卫星 $600118 只约+1.5%。事件热度向材料和测绘扩散，主样本并没有被资金抢筹到失控。\n贵金属：金价仍在4100上方，沪银期货早盘转强， #山东黄金 $600547 竞价约+1.2%，维持超短共振仓，不加杠杆。","en":"A股盘前第二版 11月10日\n先说结论：对照第一版，三条主线没有被证伪，集合竞价把权重写得更清楚了。隔夜美股和费半修复之后，韩股早盘大涨并曾触发sidecar、台股加权涨约2.1%，算力硬件在竞价里明显高开；太空算力里材料和星图抢跑，中国卫星只温和高开；黄金仍在4100美元上方，山东黄金小高开。指数尚未正式开盘，上证虚拟匹配几乎平开在3660.74点。风险偏好还在，但字辈里东方海洋竞价跌停，说明情绪票已经分化，更不适合追连板。主线仍是AI算力硬件、太空算力与商业航天、贵金属超短。总仓中性，高开的先看回撤再动手。\n#消息面\n两小时更新为主。韩综指现涨约3.8%，早盘报道一度涨超5%并启动sidecar，SK海力士、三星电子跟涨；台股加权涨约2.1%。这是对隔夜费半大涨的亚太接力，强化算力硬件开盘定价。\n#药明康德 $603259 公告美国国防部将其从1260H项下中国军工企业名单移除，对CXO情绪偏正面。 #东方新能 $002310\n隔夜签署约9.12亿元算力板卡采购合同，用于AI推理、微调及渲染，同时提示算力服务尚处起步、未形成相关收入和确定订单，合同执行有不确定性；今早异常波动公告同步流通，竞价仍按涨停附近定价，属于情绪票贴上算力标签，不把它升格为主线样本。联想宣布首个混合词元母本工厂落地张家口；Anthropic据悉拟IPO募资至多693亿美元。快舟六号可重复使用火箭拟2027年首飞回收，商业航天降本叙事延续。国内商品期货开盘燃油跌超5%、SC原油跌超4%，沪银涨超1%。今日13时01分继续暂停对美加征24%关税，第一版已提示，按点生效。美东今晚仍有10月CPI。\n#研报面\n今早新公开的行业口径：开源证券计算机2027年度策略强调从大模型竞赛到算力需求井喷；国新证券计算机三季报称景气向算力集中；中信建投计算机2027年策略 2027年度策略出炉\n去年策略报告中几点预测都有应验，我们在今年报告中也对2027提出四大预测：\n1️⃣上市银行是最核心的优质红利资产明年上半年息差好于下半年，利润增速稳定在4%-5%\n2️⃣分红率稳步提速，贷款降速提质给予银行更高分红能力\n3️⃣A股银行有望再现“1倍PB”，国有大行提振估值中枢、优质城商行率先站上1倍，同时2027年关注头部股份行“适时重生”\n4️⃣2027银行资金面还有预期差，欠配权重股有更大机会“稳稳的幸福”更强于“东张西望”\n【国盛张一鸣】积极配置机器人\nOptimus将是27年最大科技单品，用于训练的V3已经开启量产并初步亮相，供应链积累的越来越多的订单已经无法掩盖，10月份爬坡的斜率会很陡峭Q4诸多大厂（包括T、英伟达、Meta、hw、小鹏等）都可能有重磅发布，节前建议积极配置\n高确定性高价值量标的：田中精机、科森科技、斯菱智驱、浙江荣泰、北特科技、鸣志电器等同时关注常州链的进展：光洋科技、新泉股份、凯迪股份；\n核心tier2:恒锋工具（谐波、丝杠刀具，订单已排产至三个月后，对日替代）、正强股份（手腕关节总成+谐波波发生器）；\n国产C端：上纬新材、中坚科技等\nAI眼镜&手表ZJ要点更新1109\nAI眼镜痛点与解决路径\n⚜️体积重量：比较重，体积大路径：3D堆叠封装，工艺制程提升\n⚜️功耗续航：2h充电一次路径：低功耗芯片、多电源域\n⚜️显示成本：MicroLED2027年有机会降至500-600元\n北美CSPAI眼镜进展\n⚜️Meta：2027Q23D模型落地，用于植物、动物等本地识别\n⚜️三星与谷歌：Gemini最晚2027Q3发布谷歌端侧拟将音频、视频等体系像安卓一样整合，有生态闭环\n⚜️苹果：2027Q3发布产品\nAI眼镜成本与渠道\n⚜️整机定价：带显示产品目前普遍要四五千元，不带显示约3000多元；安卓体系带显示整机需做到2000元左右才可能爆发\n⚜️不带显示的BOM：主控AR1约60美金、恒玄2800约15美金，合计约75美金，主控约占BOM的70%；电源约5美金；其他\nAI眼镜芯片竞争格局\n芯海科技、炬芯做ISP但缺蓝牙/WiFi无线能力，高通低功耗目前不是很好，杰里、中科蓝讯做不了ISP和安卓系统，恒玄相对最有优势；但高通2027年出MCU加框架芯片、先进制程功耗更低，格局可能变化\n2026智能手表行业出货\n2027总量：599元以上手表2027年可能约9000万台，年增长约10%；华为和苹果合计占约60%\nAI手表芯片竞争格局\n⚜️华为苹果：华为因美国商务部/中美关系及自用难进入，苹果因自研芯片、可上3nm且低功耗做得可以，难进入\n⚜️竞争与新品：品牌端主要竞争对手是高通W5及下一代产品，联发科此前未重点参与；强劲对手还有阿波罗；低端手环竞争较分散新功能看AI录音和大模型整理会议纪要\n端侧芯片成本与存储影响\n晶圆成本：2026年芯片成本涨约10%-15%，目前没有向下游顺价存储占比不高，影响也不大","en":"#1109复盘汇总\n1️⃣机器人概念：午后涨停潮，全天最强主线\n据外媒报道，三星、SK海力士、美光三大存储原厂正与SEMI磋商晶圆厂内机器人充电系统标准化，叠加国产人形机器人量产预期持续发酵\n相关个股：上纬新材、阿尔特、宇树科技、光洋股份\n2️⃣冰雪产业：第28届哈尔滨冰雪大世界，携手华特迪士尼（中国），以《冰雪奇缘》为主题打造专属冰雪区域这是该主题冰雪雕塑在全球范围内，首次于哈尔滨呈现\n相关个股：冰山冷热、晶雪节能、雪人股份、龙建集团\n3️⃣：钛板：太空算力最新分支根据天风证券，NVSpace-1太空机柜需要用到钛板，一是用于抗发射时的随机振动和冲击，二是给GPU做局部辐射屏蔽，价值量高达4W/机柜\n相关个股：西部材料、宝钛股份、金天钛业、天力复合\n#今日前瞻\n1️⃣李强签署国务院令公布《中医药传统知识保护条例》，对列入保护名录的中医药传统知识，支持传承传播，加强推广应用，促进研究创新\n相关个股：盘龙药业、太龙药业、陇神戎发、佛慈制药\n2️⃣美国政府将就英伟达CEO黄仁勋相关事宜向国会作情况通报美对外AI芯片出口限制或将持续升级，国产算力有望受益\n相关个股：燧原科技、大胜达、寒武纪、沐曦股份\n银行2027年度策略出炉\n去年策略报告中几点预测都有应验，我们在今年报告中也对2027提出四大预测：\n1️⃣上市银行是最核心的优质红利资产明年上半年息差好于下半年，利润增速稳定在4%-5%\n2️⃣分红率稳步提速，贷款降速提质给予银行更高分红能力\n3️⃣A股银行有望再现“1倍PB”，国有大行提振估值中枢、优质城商行率先站上1倍，同时2027年关注头部股份行“适时重生”\n4️⃣2027银行资 方达（510310）、科创50ETF；A股对应方向为宽基指数与科创板，代表个股为科创次新股长鑫科技（688825）。\n3、影响：偏多A股，强度强，属持续性逻辑。国家队与被动资金在外部冲击下形成托底，是当日A股缩量但仍收红的关键变量，对宽基权重构成支撑。\n（五）\n1、据Bloomberg 11月9日报道，美国中期选举结果出炉，民主党取得中期选举胜利，“蓝色浪潮”重创AI交易；据WSJ报道民主党胜利将给AI交易增加波动。\n2、涉及标的：NVDA、AMD；A股对应方向为AI算力与数据中心，代表个股工业富联（601138）+4.57%、亨通光电（600487）+3.20%。\n3、影响：偏空美股AI板块，强度强，属持续性逻辑。选举结果改变AI监管与算力扩张的政策预期，是本周科技股波动的核心宏观变量，对A股AI板块构成外部扰动。\n（六）\n1、据Reuters 11月9日报道，美国地方公投几乎全部对数据中心扩张亮起红灯，北达科他Harwood小镇成为唯一例外；据东方财富引述，人工智能推动电力需求急剧增长，服务商正疯狂寻找二手和翻新涡轮机。\n2、涉及标的：CEG、VST；A股对应方向为电力设备与数据中心液冷，代表个股冰山冷热（000530）+10.00%，题材含数据中心液冷。\n3、影响：偏空美国数据中心扩张，偏多电力设备，强度中等，属持续性逻辑。地方公投阻力推升电力稀缺性溢价，A股液冷与电力设备方向受益于同一产业逻辑。\n（七）\n1、据格隆汇11月9日报道，KKR三季度调整后净利润同比增长29%至16.45亿美元，管理资产规模达8040亿美元同比增长11%，但季度总营收45.64亿美元同比下降17.4%。\n2、涉及标的：KKR；A股对应方向为券商与多元金融，代表方向为头部券商板块。\n3、影响：中性偏多美股另类资管，强度弱，属持续性逻辑。AUM与调整后利润增长显示募资韧性，营收下滑暴露退出端压力，对A股券商板块传导有限。\n（八）\n1、据格隆汇11月9日报道，花旗恢复覆盖Uber并给予买入评级，目标价105美元。\n2、涉及标的：UBER；A股对应方向为出行平台与网约车产业链，素材中无直接对应个股，最贴近方向为交通出行与本地生活服务板块。\n3、影响：偏多美股，强度弱，属持续性逻辑。单一券商评级对股价影响有限，对A股无实质传导，仅具情绪参照意义。\n（九）\n1、据格隆汇11月9日报道，伯克希尔哈撒韦将发行三系列日元计价高级票据；据WSJ报道伯克希尔季度利润在投资收益缩水后下滑；据MarketWatch报道其最新季度最大看点并非3570亿美元现金或股票回购。\n2、涉及标的：BRK.A、BRK.B；A股对应方向为高股息红利资产，代表方向为煤炭与银行，当日煤炭掀起涨停潮、银行股再度走强多只标的逼近新高。\n3、影响：中性，强度弱，属持续性逻辑。伯克希尔现金规模与日元融资动作强化全球高股息比价逻辑，A股煤炭与银行走强与这一风格方向一致。\n（十）\n1、据WSJ 11月9日报道，特斯拉Cybertruck因销量疲软将停产，马斯克表示产能转向Cybercab；据BusinessInsider报道马斯克称特斯拉将不得不退还大量Cybertruck订金。\n2、涉及标的：TSLA；A股对应方向为特斯拉产业链与皮卡零部件，代表个股新亚制程（002388）+2.25%，题材含富士康概念与有机硅；东方嘉盛（002889）+9.99%，题材含特斯拉概念。\n3、影响：偏空美股特斯拉，强度中等，属持续性逻辑。Cybertruck停产是产品线收缩信号，对A股特斯拉产业链中皮卡相关配套构成负面预期，但Cybercab方向可能带来新配套需求。\n（十一）\n1、据Barron's 11月9日报道，SpaceX计划进行星舰第15次试飞；据华尔街见闻报道SpaceX解禁潮撞上指数调仓，高盛测算12月调仓或带来109亿美元被动买盘。\n2、涉及标的：SpaceX为非上市标的，相关ETF与持仓方包括Ark Invest；A股对应方向为商业航天，代表个股中国卫星（600118）+4.55%、顺灏股份（002565）+10.02%、西部材料（002149）+9.99%。\n3、影响：偏多商业航天，强度中等，属持续性逻辑。星舰试飞与指数调仓买盘共同强化全球商业航天叙事，与A股快舟规划形成跨市场共振。\n（十二）\n1、据Seeking Alpha 11月9日报道，Cathie Wood旗下Ark Invest买入9600万美元SpaceX，增持英伟达与AMD，减持博通。\n2、涉及标的：ARKK、NVDA、AMD、AVGO；A股对应方向为AI算力与半导体，代表个股长鑫科技（688825）、有研新材（600206）。\n3、影响：偏多美股AI，强度弱，属当日情 （002388）+2.25%，题材含富士康概念与有机硅；东方嘉盛（002889）+9.99%，题材含特斯拉概念。\n3、影响：偏空美股特斯拉，强度中等，属持续性逻辑。Cybertruck停产是产品线收缩信号，对A股特斯拉产业链中皮卡相关配套构成负面预期，但Cybercab方向可能带来新配套需求。\n（十一）\n1、据Barron's 11月9日报道，SpaceX计划进行星舰第15次试飞；据华尔街见闻报道SpaceX解禁潮撞上指数调仓，高盛测算12月调仓或带来109亿美元被动买盘。\n2、涉及标的：SpaceX为非上市标的，相关ETF与持仓方包括Ark Invest；A股对应方向为商业航天，代表个股中国卫星（600118）+4.55%、顺灏股份（002565）+10.02%、西部材料（002149）+9.99%。\n3、影响：偏多商业航天，强度中等，属持续性逻辑。星舰试飞与指数调仓买盘共同强化全球商业航天叙事，与A股快舟规划形成跨市场共振。\n（十二）\n1、据Seeking Alpha 11月9日报道，Cathie Wood旗下Ark Invest买入9600万美元SpaceX，增持英伟达与AMD，减持博通。\n2、涉及标的：ARKK、NVDA、AMD、AVGO；A股对应方向为AI算力与半导体，代表个股长鑫科技（688825）、有研新材（600206）。\n3、影响：偏多美股AI，强度弱，属当日情绪影响。木头姐在暴跌中逆势加仓属典型左侧行为，对市场情绪的稳定作用有限，对A股传导更弱。\n（十三）\n1、据Bloomberg 11月9日报道，Alphabet考虑亚洲债券发行，因AI担忧加剧市场波动；据Reuters报道Alphabet股价可能迎来修正性反弹。\n2、涉及标的：GOOGL；A股对应方向为AI应用与云计算，代表个股昆仑万维（300418）+3.59%、芒果超媒（300413）+2.79%。\n3、影响：中性，强度弱，属持续性逻辑。科技巨头债券融资反映AI资本开支的债务依赖上升，是信用市场压力的观察窗口，对A股AI应用板块传导间接。\n（十四）\n1、据格隆汇11月9日报道，布伦特原油下跌逾3%至每桶95美元附近，延续自2020年4月以来最大单周跌势；据WSJ报道油价在特朗普淡化对伊朗新打击前景后下跌并维持在100美元下方。\n2、涉及标的：USO、XLE；A股对应方向为石油开采偏空、航空交运偏多，代表方向为航空公司与炼化板块。\n3、影响：偏空能源股，偏多航空股，强度强，属当日情绪影响。油价历史性周跌是本周最大的宏观变量之一，对A股航空与化工成本端构成利好，对石油开采构成压制。\n（十五）\n1、据格隆汇11月9日报道，克罗地亚境内输油线路受损，亚得里亚海输油管道自11月6日起暂停向塞尔维亚潘切沃炼油厂输送原油。\n2、涉及标的：无直接对应美股个股，最贴近方向为欧洲炼化与原油运输，A股对应方向为炼化与油运板块。\n3、影响：偏多油运，强度弱，属当日情绪影响。管道中断推升替代性海运需求，但涉及体量有限，对A股油运板块仅构成边际情绪提振。\n（十六）\n1、据WSJ 11月9日报道，强劲就业数据推动美债收益率上升；据Bloomberg报道黄金在美国就业数据强化12月加息押注后维持跌势。\n2、涉及标的：TLT、GLD；A股对应方向为黄金采选偏空、银行偏多，当日银行股再度走强多只标的逼近新高。\n3、影响：偏空黄金，偏多美元与银行，强度中等，属持续性逻辑。就业数据强劲推后降息预期，对A股黄金板块构成压制，对银行息差逻辑构成支撑。\n（十七）\n1、据Reuters 11月9日报道，美国中期选举后加密货币跌至两个月低点；据WSJ报道一种源自加密领域的热门新押注引发华尔街地盘争夺战。\n2、涉及标的：COIN、MSTR；A股对应方向为数字货币与区块链概念，素材中无直接对应个股，最贴近方向为金融科技板块。\n3、影响：偏空加密相关美股，强度中等，属当日情绪影响。选举结果改变加密监管预期，对A股金融科技板块传导有限，更多体现为风险偏好指标。\n（十八）\n1、据Seeking Alpha 11月9日报道，三井化学将与日本开发银行以88亿美元收购芯片材料制造商JSR；据东方财富报道三星蚀刻核心配方严重泄露，泛林韩国多次违规获取机密工艺文件。\n2、涉及标的：JSR为非美股上市标的，相关方为三井化学；A股对应方向为半导体材料与光刻胶，代表方向为电子化学品板块。\n3、影响：偏多半导体材料，强度中等，属持续性逻辑。日本芯片材料整合与配方泄露事件共同强化半导体材料自主可控叙事，对A股光刻胶与电子化学品构成中期主题支撑。\n（十九）\n1、据格隆汇11月9日报道，英国首相伯纳姆表示尚未就下调2030年电动汽车销售目标作出决定；据Bloomberg报道中国汽车出口增速预计从超高速放缓。\n2、涉及标的：TSLA、NIO；A股对应方向为电动车与锂电，代表方向为锂电池产业链，第十七届国际先进电动车锂电池大会于11月9日至12日举行。\n3、影响：中性偏空电动车，强度弱，属持续性逻辑。英国目标可能松动与中国出口放缓共同压制全球电动车增长预期，对A股锂电板块构成中期需求端压力。\n（二十）\n1、据Reuters 11月9日报道，受油价下跌与AI轮动推动，花旗与汇丰押注印度市场复苏，印度股市收于八个月高位，外资流入创纪录。\n2、涉及标的：INDA、EPI；A股对应方向为外资配置的中国资产，代表方向为沪深300宽基，沪深300ETF易方达（510310）获资金连续布局。\n3、影响：偏多印度股市，强度中等，属持续性逻辑。油价下行对印度这一原油进口国构成显著利好，形成对A股外资分流的竞争压力，需关注北向资金流向变化。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119784708620108049","l":["macaostarbridge.com"],"ln":[{"u":"https://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["美联储","美股","A股港股","汇率","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":1,"vw":542},{"id":"2119784121014919172","h":"cnfinancewatch","ts":1794230892,"zh":"今日中国A股热点二十条\n（一）\n1、据格隆汇11月9日报道，快舟航天公布快舟系列运载火箭后续发展规划，未来三年快舟一号甲、快舟十一号两型火箭计划完成50次以上发射任务，2027年快舟十二号固液混合火箭、快舟六号可重复使用液体火箭计划实现首飞。\n2、涉及个股：中国卫星（600118），属商业航天与卫星导航板块；顺灏股份（002565），属商业航天与卫星导航概念，当日+10.02%，4天3板；航天产业链配套方向可关注火箭制造与卫星总装环节。\n3、影响：偏多，强度中等，属持续性逻辑。发射频次规划落地强化商业航天产业节奏预期，与当日东财人气榜中国卫星排名升135位形成呼应，短期情绪与中期订单逻辑共振。\n（二）\n1、据东方财富11月9日报道，“星云星座计划”发布，我国太空算力网加快部署，商业航天与算力基础设施出现交叉叙事。\n2、涉及个股：顺灏股份（002565）题材含太空算力与商业航天，当日+10.02%；中国卫星（600118）当日+4.55%；超声电子（000823）题材含商业航天与印制电路板，当日+9.98%首板涨停。\n3、影响：偏多，强度中等，属当日情绪影响为主。太空算力属新概念嫁接，资金以题材轮动方式介入，持续性需观察后续订单与项目落地公告。\n（三）\n1、据格隆汇11月9日报道，广合科技公告拟使用自有资金及或自筹资金以集中竞价方式回购A股股份，回购资金总额不低于2亿元且不超过4亿元，回购价格不超过204元每股，回购期限为董事会审议通过之日起3个月内。\n2、涉及个股：广合科技（001389），属印制电路板与算力硬件产业链；同日公司审议通过终止实施2026年A股股票期权相关议案。\n3、影响：偏多，强度中等，属持续性逻辑。回购用于维护公司价值及股东权益，在PCB与算力硬件板块中形成个股层面的资金托底信号，但需注意同期终止期权计划可能带来的治理层面解读分歧。\n（四）\n1、据格隆汇11月9日报道，聚灿光电公告拟向特定对象发行股票，募集资金总额不超过15亿元，扣除发行费用后用于年产300万片高性能红黄光外延片及芯片扩产升级项目及研发中心建设项目。\n2、涉及个股：聚灿光电（300708），属LED芯片与化合物半导体板块；同产业链可关注半导体设备与材料方向。\n3、影响：偏多，强度中等，属持续性逻辑。定增扩产指向红黄光外延片细分赛道，产能释放周期较长，短期对股价的影响更多体现为板块内半导体扩产叙事的情绪提振。\n（五）\n1、据格隆汇11月9日报道，章源钨业发布关于调整硬质合金类产品价格的通知函，称因钨原材料价格持续上涨致使生产成本大幅增长，决定从2026年11月10日起对硬质合金类产品按新价格执行。\n2、涉及个股：章源钨业（002378），属钨与硬质合金板块；同方向可关注稀有金属与刀具材料产业链。\n3、影响：偏多，强度中等，属持续性逻辑。原材料涨价向下游传导成功，体现钨价上行周期中的议价能力，对钨板块整体构成价格逻辑支撑，但需警惕下游需求对提价的接受度。\n（六）\n1、据格隆汇11月9日报道，广合科技之外，A股再掀回购小高潮，捷佳伟创拟最高5亿元回购股份，据Google中文引述观点网统计，A股一周99家公司新增回购增持计划，涉及金额156.5亿元。\n2、涉及个股：捷佳伟创（300724），属光伏设备板块；广合科技（001389）属PCB板块；*ST国中（600187）回购A股股份用于注销并减少注册资本。\n3、影响：偏多，强度中等，属当日情绪影响。回购增持密集披露对市场情绪形成托底，但当日两市成交额跌破1.5万亿，量能不足限制回购利好的扩散效果。\n（七）\n1、据同花顺财经与金融界11月9日收评，A股缩量整理，沪指微涨0.32%，创业板指跌0.27%，煤炭开采加工、燃气、元件板块涨幅居前，光伏概念股震荡调整，两市成交1.48万亿。\n2、涉及个股：煤炭方向当日掀起涨停潮；元件方向超声电子（000823）+9.98%、信维通信（300136）+12.77%；光伏方向东方日升（300118）+5.65%。\n3、影响：偏多煤炭与元件，偏空光伏，强度中等，属当日情绪影响。缩量轮动格局下资金向低估值高股息与算力硬件集中，风格切换特征明显。\n（八）\n1、据东方财富11月9日报道，“东方”系个股集体走强，多股两连板，日出东方、大东方、东方海洋、东方新能、东方嘉盛等名称含“东方”的个股集中异动。\n2、涉及个股：日出东方（603366）+10.01%，2天2板，题材含储能与光伏；大东方（600327）+9.98%，2天2板，题材含百货零售与儿科医疗；东方海洋（002086）+10.08%居东财人气榜第一；东方新能（002310）+9.91%；东方嘉盛（002889）+9.99%。\n3、影响：偏多，强度弱，属当日情绪影响。名称炒作属典型游资行为，缺乏基本面支撑，持续性弱，参与需严控仓位与止损。\n（九）\n1、据同花顺热股榜11月9日数据，宇树科技-W（688836）当日+9.04%，东财人气榜排名升124位，同花顺热股榜排名第2，概念为人形机器人与科创次新股。\n2、涉及个股：宇树科技（688836）属人形机器人板块；同日东方财富报道苹果加宇树加千问的机器人大脑HALO来了，物理AI方向爆发；西部材料（002149）+9.99%首板，题材含可控核聚变与商业航天。\n3、影响：偏多，强度强，属当日情绪影响与持续性逻辑叠加。机器人板块获产业催化与资金共振，宇树科技人气跃升显示增量资金介入，是当日最强主线之一。\n（十）\n1、据韭研公社11月9日盘中信息，多重消息共振下寒潮降温双线行情发酵，采暖龙头与流感医药梯队受关注，当日缩量轮动日54家涨停。\n2、涉及个股：日出东方（603366）+10.01%为采暖方向龙头，2天2板；冰山冷热（000530）+10.00%首板涨停，题材含冰雪工程与数据中心液冷；雪人集团（002639）+10.00%首板涨停，题材含冰雪产业与氦气压缩机。\n3、影响：偏多，强度中等，属当日情绪影响。寒潮属季节性催化，采暖与冰雪产业具备短期爆发力但缺乏持续业绩支撑，需关注降温天气预报的持续性。\n（十一）\n1、据同花顺热股榜11月9日数据，共封装光学CPO方向多股上榜，东山精密（002384）+1.62%、中际旭创（300308）+0.90%、新易盛（300502）+2.27%、工业富联（601138）+4.57%、亨通光电（600487）+3.20%、烽火通信（600498）+6.78%。\n2、涉及个股：中际旭创（300308）当日成交额居A股第一，据21财经报道；超声电子（000823）+9.98%首板，题材含印制电路板与CPO；信维通信（300136）+12.77%属MLCC概念。\n3、影响：偏多，强度中等，属持续性逻辑。CPO与算力硬件是AI产业链中业绩兑现度较高的环节，但当日美股AI交易剧烈波动，传导风险需警惕。\n（十二）\n1、据格隆汇11月9日报道，花旗称对铝市场总体维持中性观点，并维持未来0至3个月铝价每吨3000美元的目标价。\n2、涉及个股：闽发铝业（002578）+9.98%，6天6板，题材含光伏边框与液冷铝材；铝板块整体受海外铝价目标价锚定影响。\n3、影响：中性偏多，强度弱，属持续性逻辑。花旗中性观点限制铝价上行想象空间，但闽发铝业连板显示题材资金仍在博弈光伏边框与液冷铝材的复合概念。\n（十三）\n1、据格隆汇11月9日报道，伯克希尔哈撒韦将发行三系列日元计价高级票据，据Bloomberg报道这是该公司自4月以来首次日本债券发行。\n2、涉及个股：无直接对应A股个股，最贴近方向为日元利率与日本资产配置相关的外资流入逻辑，可关注A股 保留10%的对美加征关税税率；据Reuters报道中国延长对美贸易休战两个月。\n2、涉及个股：无直接对应单一龙头个股，最贴近方向为出口链与跨境电商，可关注东方嘉盛（002889）+9.99%，题材含光刻机保税维修与智慧仓；以及家电与消费电子出口方向。\n3、影响：偏多，强度中等，属持续性逻辑。关税暂停延长稳定出口企业盈利预期，对跨境电商与保税物流构成中期支撑，但保留10%税率意味着缓和幅度有限。\n（十九）\n1、据财联社11月9日报道，金价波动加大，多家银行上线积存金挂单功能；据WSJ报道黄金升破每盎司4100美元，市场聚焦美国通胀数据。\n2、涉及个股：无直接对应A股金矿龙头在素材中列明，最贴近方向为黄金采选与贵金属板块；白银ETF两倍做多当日+4.55%显示贵金属杠杆资金活跃。\n3、影响：偏多贵金属，强度中等，属持续性逻辑。金价高位叠加银行积存金功能完善提升居民配置便利度，但波动加大意味着追高风险上升。\n（二十）\n1、据东方财富11月9日报道，商务部就调整不可靠实体清单措施、调整出口管制管控名单措施答记者问，并继续暂停对韩华海洋株式会社5家美国相关子公司实施反制措施2个月。\n2、涉及个股：无直接对应A股个股，最贴近方向为船舶制造与航运板块，以及受出口管制影响的稀土与稀有金属方向。\n3、影响：偏多，强度弱，属持续性逻辑。反制措施暂停释放缓和信号，对船舶与航运情绪偏暖，但措施仅为2个月暂停，属可逆安排，不宜线性外推。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119784121014919172","l":[],"ln":[],"t":["通胀","美股","A股港股","原油能源","AI科技","财报","关税贸易","黄金"],"lk":0,"rt":0,"rp":0,"vw":628},{"id":"2119781654633885860","h":"SCMPNews","ts":1794230304,"zh":"土耳其钢铁厂爆炸造成 6 人死亡","en":"Turkey steel factory blast kills 6","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119781654633885860","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/world/europe/article/3373832/turkey-steel-factory-blast-kills-6?utm_medium=Social&utm_source=Twitter#Echobox=1794230302-1","d":"scmp.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":1305},{"id":"2119779355853574280","h":"dmjk001","ts":1794229756,"zh":"路透：美国国会借许可法案首次在“蓝色浪潮”后对数据中心出手\n一项涵盖广泛的跨党派能源法案意外成为美国国会在如何应对公众对数据中心及不断上涨的电费所表达的不满方面的首次考验，而这种不满曾帮助民主党在上周取得压倒性选举胜利。\n这项酝酿多年的立法将于周一提交参议院辩论，它将加快新电厂和输电线路的审批，同时要求大型数据中心运营商承担更多为其服务所需的电网升级成本。\n支持者表示，该法案可能是国会在近期内应对 AI 基础设施建设成本的最佳机会。但一些民主党人——他们曾在竞选中承诺限制数据中心，且其政党明年将掌控国会两院——对其中一些条款持怀疑态度，认为这些条款可能鼓励更多建设。\n据投资公司 TD Cowen 称，这项名为《两党美国可负担性与就业法案》的立法通过几率已从选举前的 40%降至 25%。\n但这场争论可能有助于界定围绕数据中心的辩论，因为预计民主党明年掌控国会后将推出一系列针对 AI 和数据中心发展的法案。对 AI 监管力度加大的担忧导致上周科技股遭遇大幅抛售。","en":"路透：美国国会借许可法案首次在“蓝色浪潮”后对数据中心出手\n一项涵盖广泛的跨党派能源法案意外成为美国国会在如何应对公众对数据中心及不断上涨的电费所表达的不满方面的首次考验，而这种不满曾帮助民主党在上周取得压倒性选举胜利。\n这项酝酿多年的立法将于周一提交参议院辩论，它将加快新电厂和输电线路的审批，同时要求大型数据中心运营商承担更多为其服务所需的电网升级成本。\n支持者表示，该法案可能是国会在近期内应对 AI 基础设施建 uters.com"],"ln":[{"u":"https://www.reuters.com/world/china/china-extends-suspension-new-rare-earth-controls-until-january-2026-11-09/?taid=6af192a5c6e521000165b87c&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["关税贸易"],"lk":0,"rt":0,"rp":0,"vw":376},{"id":"2119721539813740804","h":"SCMPNews","ts":1794215972,"zh":"香港电梯承包商因防火门框缺失欺诈而接受调查","en":"Hong Kong lift contractor under probe for fraud over missing fire door frames","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119721539813740804","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/hong-kong/law-and-crime/article/3373802/hong-kong-lift-contractor-under-probe-fraud-over-missing-fire-safety-frames?utm_medium=Social&utm_source=Twitter#Echobox=1794215971","d":"scmp.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":1243},{"id":"2119721524471214479","h":"CrushTheShorts","ts":1794215968,"zh":"●GB300 生产与交付\n一家全球 AI 服务器 OEM 在 2026 年第三季度实现约 700 机架的 GB300 NVL72 产能，按计划交付约 600 机架，其中 90% 供应给云服务提供商。\n●Vera Rubin 推迟至 2027 年 Q1\n下一代 Vera Rubin 产量原定 2026 年 12 月少于 100 机架，因电网瓶颈和 HBM4 良率低，推迟至 2027 年第一季度；2027 年目标为 5,000–6,000 机架，平均售价约 800 万美元。\n●电力：广泛延误\n数据中心电网连接积压，导致所有客户层级的部署延误 1–3 个月，具体取决于公用事业队列。\n●Neocloud 管道高风险\n计算租赁客户的第三季度谅解备忘录环比增长不到 50%，仅有 30–40% 转化为具有约束力的采购订单，原因是融资紧张和单位经济性疲软。\n●价格战风险与超大规模商稳定性\n商品计算租赁引发价格战，并导致 Neocloud 在 2027 年上半年对后续采购订单犹豫不决；而自筹资金的超大规模商则保持高转化率。\n●2027 年 OEM 配额调整\nDell 的 GB300 / Vera Rubin 分配将持平至适度增长；Lenovo 的 NVL 配额将从 7% 上升至 10%，继系统审计和 NVIDIA 认证之后。\n●消费硬件严重下滑\n2026 年 PC 出货量预计为 6,300 万台（50% 为 AI PC）；2026 年第三季度 PC 出货量同比下降 22–23%，手机出货量同比下降 40–50%，原因是内存成本膨胀。\n●内存成本激增与 ASP 策略\nDRAM 现货价格较 2025 年第二季度翻了四倍，推动内存 BOM 占比从 18–20% 上升至 35–38%；供应商依赖更高的平均售价和高端产品组合来抵消入门级需求疲软。\n●三星晶圆转移与 2027 年复苏\n预计三星将在 2026 年第四季度将产能从 HBM 转移回 DRAM，因为 DRAM 利润率与 HBM 相当，这将有助于在 2027 年第一季度稳定内存价格，并引发 2027 年第三季度的 PC 出货量复苏。\n●OEM 激进的库存去风险\n一线 PC OEM 将 DRAM 覆盖从 6 个月削减至 3–4 个月，CPU 覆盖至 2 个月，将成品库存保持在 30–40 天，以避免高成本库存敞口。","en":"●GB300 生产与交付\n一家全球 AI 服务器 OEM 在 2026 年第三季度实现约 700 机架的 GB300 NVL72 产能，按计划交付约 600 机架，其中 90% 供应给云服务提供商。\n●Vera Rubin 推迟至 2027 年 Q1\n下一代 Vera Rubin 产量原定 2026 年 12 月少于 100 机架，因电网瓶颈和 HBM4 良率低，推迟至 2027 年第一季度；2027 年目标为 5,000–6,000 机架，平均售价约 800 万美元。\n●电力：广泛延误\n数据中心电网连接积压，导致所有客户层级的部署延误 1–3 个月，具体取决于公用事业队列。\n●Neocloud 管道高风险\n计算租赁客户的第三季度谅解备忘录环比增长不到 50%，仅有 30–40% 转化为具有约束力的采购订单，原因是融资紧张和单位经济性疲软。\n●价格战风险与超大规模商稳定性\n商品计算租赁引发价格战，并导致 Neocloud 在 2027 年上半年对后续采购订单犹豫不决；而自筹资金的超大规模商则保持高转化率。\n●2027 年 OEM 配额调整\nDell 的 GB300 / Vera Rubin 分配将持平至适度增长；Lenovo 的 NVL 配额将从 7% 上升至 10%，继系统审计和 NVIDIA 认证之后。\n●消费硬件严重下滑\n2026 年 PC 出货量预计为 6,300 万台（50% 为 AI PC）；2026 年第三季度 PC 出货量同比下降 22–23%，手机出货量同比下降 40–50%，原因是内存成本膨胀。\n●内存成本激增与 ASP 策略\nDRAM 现货价格较 2025 年第二季度翻了四倍，推动内存 BOM 占比从 18–20% 上升至 35–38%；供应商依赖更高的平均售价和高端产品组合来抵消入门级需求疲软。\n●三星晶圆转移与 2027 年复苏\n预计三星将在 2026 年第四季度将产能从 HBM 转移回 DRAM，因为 DRAM 利润率与 HBM 相当，这将有助于在 2027 年第一季度稳定内存价格，并引发 2027 年第三季度的 PC 出货量复苏。\n●OEM 激进的库存去风险\n一线 PC OEM 将 DRAM 覆盖从 6 个月削减至 3–4 个月，CPU 覆盖至 2 个月，将成品库存保持在 30–40 天，以避免高成本库存敞口。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2119721524471214479","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":591},{"id":"2119718130914107561","h":"SCMPNews","ts":1794215159,"zh":"在马来西亚，纳吉布的软禁使宫殿与检察官对立","en":"In Malaysia, Najib’s house arrest pits palace against prosecutors","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119718130914107561","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/week-asia/people/article/3373784/malaysia-najibs-house-arrest-pits-palace-against-prosecutors?utm_medium=Social&utm_source=Twitter#Echobox=1794215158","d":"scmp.com"}],"t":[],"lk":1,"rt":1,"rp":1,"vw":951},{"id":"2119717209417171383","h":"SCMPNews","ts":1794214939,"zh":"印度尼西亚考虑在总统窃听后进行宫殿窃听","en":"Indonesia mulls palace bug sweeps after presidential wiretaps","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119717209417171383","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/asia/southeast-asia/article/3373795/indonesia-mulls-palace-bug-sweeps-after-presidential-wiretaps?utm 盘中 11月9日\n先说结论：指数小幅分化，赚钱效应集中在题材与电子硬件，不是普涨日。上证微红、深成和创业板翻绿，涨少跌多，风格略偏中小盘。盘中主线仍是商业航天与卫星、人形机器人，另加一条资金最扎实的PCB与光通信；早盘提过的光伏设备今日走弱并净流出，尾盘不宜再当进攻仓。仓位中性，只跟消息和资金共振的方向，高位连板与字辈情绪票防兑现。\n#盘面速览\n截至约14:53，上证3661.88点涨0.35%，深成指11155.76点跌0.18%，创业板指2461.35点跌0.16%，科创50报1258.83点涨0.45%，沪深300涨约0.08%。上证口径上涨约959家、下跌约1331家，指数靠权重与局部热点撑着，多数个股并不舒服。两市成交额合计约1.43万亿元，量能尚可但结构极不均衡。国证2000涨约0.32%，上证50几乎走平，中小盘略强于权重，却谈不上全面风险偏好回升。\n#板块风格\n行业涨幅靠前的是焦炭、卫浴电器、煤炭与动力煤、印制电路板、燃气。概念侧6G、纳米银、毫米波、机器人执行器、光通信模块、人形机器人、卫星互联网、商业航天居前。跌幅侧教育、宠物食品、钾肥、锂、逆变器、光伏电池组件与光伏设备靠后。进攻落在航天机器人与PCB硬件，煤炭燃气偏周期脉冲；成长里光伏链今日是撤的。整体更像主题轮动，而不是指数趋势日。\n#资金面\n行业主力净流入靠前：电子约91亿、通信设备约37亿、元件与印制电路板各约36亿、通信约32亿，半导体与消费电子也有流入。净流出侧电力设备、电池与锂电池、光伏设备、逆变器、计算机靠前，非银与证券同步失血。光通信模块、商业航天、卫星互联网、CPO等概念净流入也靠前，说明钱在硬件与航天事件里打转。北向实时接口全日返回占位零值，北向净流入数据暂不可用。\n#涨停\n东财涨停池接口今日暂不可用；公开情绪统计约14:44口径涨停约54家、炸板约44、封板率约五成五，主线标注航天与机器人，PCB亦有涨停扩散。人气端东方字辈、制冷冰雪、航天材料仍活跃，封板质量一般，炸板偏多说明情绪已过脉冲高峰，追高性价比低。\n#盘中消息\n周末催化延续到盘中：太空算力与星舰叙事抬升商业航天；苹果HALO人形控制系统在宇树G1验证，推高机器人溢价。PCB则交易供应偏紧与松下湖口厂火灾扰动，覆铜板和电子布涨价链被反复定价，景旺、胜宏、沪电等业绩链同步走强。汽车出口冲高、进博会与中美经贸缓和偏宏观，对当日主线映射弱于航天、机器人、PCB。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #东方海洋 002086 、 #日出东方 603366 、 #宇树科技 $688836 、 #中国卫星 $600118 、 #信维通信 $300136 、 #大东方 600327 、 #东方新能 002310 、 #东方日升 300118 等。同花顺热榜亦见东方海洋、宇树、冰山冷热、东山精密、中际旭创。字辈与主线交叉票权重大，需区分纯情绪与有订单映射；字辈票可以提供流动性，不宜当基本面仓。\n#中美映射\n美股主题ETF仍用11月6日收盘窗口：5日光伏TAN领先，20日偏医疗与必选消费；半导体中期仍弱。A股今日刷新：机器人相关ETF近20日与近5日都强；卫星偏5日；光伏设备近5日涨幅仍高，但今日板块资金流出，超短共振松动。盘中更干净的是航天事件驱动加PCB供需，而非早盘的光伏修复。医疗器械与创新药的20日趋势共振今天没有成为主战场。\n#三个方向\n商业航天与卫星通信：消息与人气共振，优先组网、载荷与材料，避开纯联想票。\n人形机器人与具身智能：HALO催化仍在，本体作方向观察，执行与热管理里挑有辨识度的，不追亏损高标。\nPCB与光通信：资金净流入最集中，供需与涨价可核验，是今日最扎实的硬件仓，但短线已经启动，注意回撤。\n#六只个股\n1. #中国卫星 $600118 ：约57.7元、涨约4.9%；近20日约+10%、5日约+3.6%。三季报营收同比约+28%，利润大幅改善，位置低于部分连板情绪票。\n2. #信维通信 $300136 ：涨约12.6%；近5日约+11%、20日基本持平。三季报营收微增、利润略承压，短线属性更重，适合当卫星通信弹性观察。\n3. #西部材料 $002149 ：涨停；近20日约+35%、5日约+20%，市值约200亿。三季报营收略降、净利下滑，按航天材料主题仓看钛材订单，不按业绩趋势仓。\n4. #宇树科技 $688836 ：涨约9%；近20日约+70%，市值与人气都顶格，适合观察方向，不宜单押，更不宜当小仓唯一工具。\n5. #景旺电子 $603228 ：涨约7.2%。三季报营收同比约+37%、净利约+70%，对应PCB涨价链；近20日仍处深回撤后的反弹，属业绩与资金交叉。\n6. #雪人集团 $002639 ：涨停；近20日约+20%、5日约+15%。三季报仍亏，机器人与制冷交叉，只作情绪观察，不做中线基本面叙事。\n#小盘阿尔法\n #西部材料 $002149 见上，今日涨停且与航天材料互证。 #再升科技 $603601 涨约4%，气凝胶热控叙事，近5日约+5%、近20日仍负，验证看出货与毛利率。 #苏轴股份 $920418 涨约3.4%，北交所小市值轴承，近20日约+4%，验证看航空航天送样订单。\n#操作提示\n不是空仓日，也不是抬杠杆日。尾盘盯封板是否松动，以及光伏与锂电有没有继续砸情绪。核心仓留给航天材料与PCB里能对上业绩的，题材仓严格止盈。字辈连板与亏损龙头，退潮会很快。总仓中性，单票试错并设好退出。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘中 11月9日\n先说结论：指数小幅分化，赚钱效应集中在题材与电子硬件，不是普涨日。上证微红、深成和创业板翻绿，涨少跌多，风格略偏中小盘。盘中主线仍是商业航天与卫星、人形机器人，另加一条资金最扎实的PCB与光通信；早盘提过的光伏设备今日走弱并净流出，尾盘不宜再当进攻仓。仓位中性，只跟消息和资金共振的方向，高位连板与字辈情绪票防兑现。\n#盘面速览\n截至约14:53，上证3661.88点涨0.35%，深成指11155.76点跌0.18%，创业板指2461.35点跌0.16%，科创50报1258.83点涨0.45%，沪深300涨约0.08%。上证口径上涨约959家、下跌约1331家，指数靠权重与局部热点撑着，多数个股并不舒服。两市成交额合计约1.43万亿元，量能尚可但结构极不均衡。国证2000涨约0.32%，上证50几乎走平，中小盘略强于权重，却谈不上全面风险偏好回升。\n#板块风格\n行业涨幅靠前的是焦炭、卫浴电器、煤炭与动力煤、印制电路板、燃气。概念侧6G、纳米银、毫米波、机器人执行器、光通信模块、人形机器人、卫星互联网、商业航天居前。跌幅侧教育、宠物食品、钾肥、锂、逆变器、光伏电池组件与光伏设备靠后。进攻落在航天机器人与PCB硬件，煤炭燃气偏周期脉冲；成长里光伏链今日是撤的。整体更像主题轮动，而不是指数趋势日。\n#资金面\n行业主力净流入靠前：电子约91亿、通信设备约37亿、元件与印制电路板各约36亿、通信约32亿，半导体与消费电子也有流入。净流出侧电力设备、电池与锂电池、光伏设备、逆变器、计算机靠前，非银与证券同步失血。光通信模块、商业航天、卫星互联网、CPO等概念净流入也靠前，说明钱在硬件与航天事件里打转。北向实时接口全日返回占位零值，北向净流入数据暂不可用。\n#涨停\n东财涨停池接口今日暂不可用；公开情绪统计约14:44口径涨停约54家、炸板约44、封板率约五成五，主线标注航天与机器人，PCB亦有涨停扩散。人气端东方字辈、制冷冰雪、航天材料仍活跃，封板质量一般，炸板偏多说明情绪已过脉冲高峰，追高性价比低。\n#盘中消息\n周末催化延续到盘中：太空算力与星舰叙事抬升商业航天；苹果HALO人形控制系统在宇树G1验证，推高机器人溢价。PCB则交易供应偏紧与松下湖口厂火灾扰动，覆铜板和电子布涨价链被反复定价，景旺、胜宏、沪电等业绩链同步走强。汽车出口冲高、进博会与中美经贸缓和偏宏观，对当日主线映射弱于航天、机器人、PCB。以上为公开报道转述。\n#热榜\n东财人气榜盘中前排： #东方海洋 002086 、 #日出东方 603366 、 #宇树科技 $688836 、 #中国卫星 $600118 、 #信维通信 $300136 、 #大东方 600327 、 #东方新能 002310 、 #东方日升 300118 等。同花顺热榜亦见东方海洋、宇树、冰山冷热、东山精密、中际旭创。字辈与主线交叉票权重大，需区分纯情绪与有订单映射；字辈票可以提供流动性，不宜当基本面仓。\n#中美映射\n美股主题ETF仍用11月6日收盘窗口：5日光伏TAN领先，20日偏医疗与必选消费；半导体中期仍弱。A股今日刷新：机器人相关ETF近20日与近5日都强；卫星偏5日；光伏设备近5日涨幅仍高，但今日板块资金流出，超短共振松动。盘中更干净的是航天事件驱动加PCB供需，而非早盘的光伏修复。医疗器械与创新药的20日趋势共振今天没有成为主战场。\n#三个方向\n商业航天与卫星通信：消息与人气共振，优先组网、载荷与材料，避开纯联想票。\n人形机器人与具身智能：HALO催化仍在，本体作方向观察，执行与热管理里挑有辨识度的，不追亏损高标。\nPCB与光通信：资金净流入最集中，供需与涨价可核验，是今日最扎实的硬件仓，但短线已经启动，注意回撤。\n#六只个股\n1. #中国卫星 $600118 ：约57.7元、涨约4.9%；近20日约+10%、5日约+3.6% 空置、无人办公，且与被美国政府列入黑名单的公司有关联。","en":"英伟达先进芯片流向中国“空壳”公司：美国商务部已批准数十家中国公司购买和处理英伟达芯片，但时报调查发现，两家获批企业在中国的登记办公室空置、无人办公，且与被美国政府列入黑名单的公司有关联。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2119683957021360599","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/business/20261109/nvidia-chips-chinese-firms/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":43,"rt":7,"rp":10,"vw":15731},{"id":"2119682953613598777","h":"cnfinancewatch","ts":1794206772,"zh":"美股盘前 11月9日\n先说结论：周末 #英伟达 $NVDA 董事会就黄仁勋相关调查发声，盘后与永续合约大约跌3%出头，但股指期货整体偏强修复，市场在把龙头治理风险和宽基反弹拆开看。今日交易焦点最多两类——医疗器械趋势、光伏超短；半导体、AI算力、存储、机器人并作AI硬件一个大类，只观察相对强者与本周财报，不做 $NVDA 情绪多空。如果只做3只： #史赛克 $SYK → #第一太阳能 $FSLR → #普尔特 $PHM 。明确不做：追 $NVDA 、追5日脉冲贵金属、把周五半导体反弹当趋势反转、追 BOTZ 。\n#消息面\n上周五三大指数分化收盘：标普约+0.31%、纳指约+1.09%、道指约-0.46%，费城半导体ETF $SMH 约+3.6%，属超跌反弹不是趋势翻多。上周中段AI交易大幅回撤后，周五只是修复日。周末焦点在 $NVDA ：公司称就黄仁勋是否遭境外情报针对性接触启动独立调查，并称暂无证据显示国家机密或公司内部信息泄露；公开报道盘后约180美元附近、较周五收盘约186.6美元跌逾3%。同业隔夜更多偏修复，公开报道 AMD 约涨1%出头、半导体ETF小涨，资金有从单一龙头切向其他芯片名的迹象，但仍是情绪层。本周催化密度高：周二美国10月CPI， CRWV 盘后；周四 CSCO 、 AMAT ；周一盘后还有 RKLB 。非农偏强后，公开口径里12月加息概率抬到约八成附近，宏观仍偏紧，高估值成长更怕通胀再热。\n#研报面\n头部大行可核：摩根士丹利将 AMAT 从等权上调至增持，目标价自172上调至209，主因上调晶圆设备尤其是存储资本开支假设，并对 KLAC 、 LRCX 盈利预测同步上修，权重高于普通点评。商业航天侧， RKLB 盘后出财报前：Cantor维持偏多目标122，摩根士丹利维持买入目标105，Citizens维持跑赢但目标自130下调至90并点出Neutron延期至2027——目标分歧大，当事件仓而非趋势仓。 CRWV 一侧Citigroup近日维持买入但下调目标价，属盈利与融资成本担忧下的目标下修，不是新翻多。非头部自媒体目标价一律降权，不单独开仓。\n#资金面\n期权异动与ARK多基金同买本轮未采集，不能用裸成交量凑共振。按规则， AMAT 仅有大行上调一项，缺第二项同向资金，暂不算完整资金共振。行业层面用涨幅代替资金流观察：住房 $ITB 、医疗器械 IHI 、医疗 XLV 、必选 XLP 近20日仍居前；光伏 $TAN 近5日领涨。AI硬件ETF与龙头近20日、近5日仍深回撤， $SMH 20日约-23%、5日约-11%， BOTZ 20日仍负，周五反弹未改中期结构。散户情绪平台热帖未做逐条核验，不作硬证据。上周五现金指数与ETF结构上，防御与住房仍强于科技宽基；今日若期指高开，优先核对医疗与光伏成分股是否同步放量，避免只追期货溢价。\n#期货\n现金指数以上周五收盘为准。隔夜股指期货多家公开口径偏强：有报道道指期货约+0.7%、标普与纳指期货约+0.6%一带，也有时段显示涨幅更窄，价格随新闻波动，开盘前以实时报价为准。VIX上周五约25.6，回落但仍不低。黄金与WTI原油公开报道口径不一，大致原油仍在90美元附近。ES/NQ成交量与持仓量方向未采集，不做OI定论，避免把报价涨跌误读成新多进场。\n#中美映射\n美股行业ETF截至11月6日收盘：20日靠前为住房 $ITB 约+13.9%、医疗器械 IHI 约+11.3%、医疗 XLV 约+8.2%、必选 XLP 约+8.0%、保险 KIE 、地产 XLRE 、材料 XLB ，光伏 $TAN 约+4.2%；5日榜黄金股 GDX 、光伏 $TAN 大幅领先，其次清洁能源、游戏、航空、医疗器械、通信、黄金ETF。半导体 $SMH 20日约-23%、5日约-11%。A股主题（含11月9日）：20日偏强机器人、创新药、航天、银行；5日偏强贵金属脉冲、光伏、黄金、科创50与芯片反弹、机器人与卫星、创新药。标注：20日共振——医疗器械/创新药；5日共振——光伏；双窗口同现偏事件——机器人（A股双侧强、美股 BOTZ 仍弱）；仅5日慎追——贵金属与芯片反弹。映射是观察框架，不是同步买入信号。\n#三个方向\n医疗器械与医疗防御： IHI /XLV 20日趋势仍在，周五回调提供分歧，优先器械龙头而非纯主题ETF追价。\n光伏设备：中美5日共振最干净，作超短修复仓，不升格为已确认大趋势。\n住房建设： $ITB 20日居首但周五转弱，作备选趋势仓，等量能与利率预期再确认。\n#六只个股\n1. #史赛克 $SYK ：近20日约+17.5%、5日约+11.7%，距20日高约6.8%；周五约-2.7%。医疗器械主线代表，触发看能否在回调后重新放量收复短期均线，失效看跌破本轮5日低点区间。\n2. #直觉外科 $ISRG ：近20日约+6.8%、5日约+4.8%，周五约-3.4%，量能偏弱。器械旗舰，适合趋势回撤观察，不追反弹第一根。\n3. #雅培 $ABT ：近20日约+11.1%、5日约+3.5%，周五约-3.2%。医疗防御属性，作 IHI 映射补位。\n4. #第一太阳能 $FSLR ：近20日约+13.1%、5日约+15.3%，周五约+2.7%，距20日高约6.4%。光伏主线中期与超短都强，当5日共振执行票，严格止盈。\n5. #普尔特 $PHM ：近20日约+18.2%、5日约+6.2%，周五约-2.0%，距20日高约5.3%。住房链里20日最强之一，量比大约0.8，等放量再加。\n6. #霍顿 $DHI ：近20日约+12.9%、5日约+4.3%，周五约-3.4%。住房备选，逻辑同 $ITB ，不做无量追高。\n#操作提示\n不是恐慌空仓日，也不是把AI超跌当趋势反转日。仓位中性：核心试错留给 $SYK 与 $FSLR ， $PHM 等住房量能。 AMAT 有大行上调但缺资金第二项且距高点深回撤，财报前最多观察。 RKLB 今日盘后、 CRWV 本周财报，事件波动大、位置仍弱，不进只做3只名单。CPI公布前避免加杠杆，单票设好退出，总仓留余地应对通胀与AI龙头新闻的双向扰动。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"美股盘前 11月9日\n先说结论：周末 #英伟达 $NVDA 董事会就黄仁勋相关调查发声，盘后与永续合约大约跌3%出头，但股指期货整体偏强修复，市场在把龙头治理风险和宽基反弹拆开看。今日交易焦点最多两类——医疗器械趋势、光伏超短；半导体、AI算力、存储、机器人并作AI硬件一个大类，只观察相对强者与本周财报，不做 $NVDA 情绪多空。如果只做3只： #史赛克 $SYK → #第一太阳能 $FSLR → #普尔特 $PHM 。明确不做：追 $NVDA 、追5日脉冲贵金属、把周五半导体反弹当趋势反转、追 BOTZ 。\n#消息面\n上周五三大指数分化收盘：标普约+0.31%、纳指约+1.09%、道指约-0.46%，费城半导体ETF $SMH 约+3.6%，属超跌反弹不是趋势翻多。上周中段AI交易大幅回撤后，周五只是修复日。周末焦点在 $NVDA ：公司称就黄仁勋是否遭境外情报针对性接触启动独立调查，并称暂无证据显示国家机密或公司内部信息泄露；公开报道盘后约180美元附近、较周五收盘约186.6美元跌逾3%。同业隔夜更多偏修复，公开报道 AMD 约涨1%出头、半导体ETF小涨，资金有从单一龙头切向其他芯片名的迹象，但仍是情绪层。本周催化密度高：周二美国10月CPI， CRWV 盘后；周四 CSCO 、 AMAT ；周一盘后还有 RKLB 。非农偏强后，公开口径里12月加息概率抬到约八成附近，宏观仍偏紧，高估值成长更怕通胀再热。\n#研报面\n头部大行可核：摩根士丹利将 AMAT 从等权上调至增持，目标价自172上调至209，主因上调晶圆设备尤其是存储资本开支假设，并对 KLAC 、 LRCX 盈利预测同步上修，权重高于普通点评。商业航天侧， RKLB 盘后出财报前：Cantor维持偏多目标122，摩根士丹利维持买入目标105，Citizens维持跑赢但目标自130下调至90并点出Neutron延期至2027——目标分歧大，当事件仓而非趋势仓。 CRWV 一侧 整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["美联储","通胀","美股","原油能源","AI科技","财报","黄金"],"lk":3,"rt":0,"rp":6,"vw":4586},{"id":"2119681948842914240","h":"SCMPNews","ts":1794206533,"zh":"一名医生在韩国被谋杀。 8 年过去了，“一切都没有改变”","en":"A doctor was murdered in South Korea. 8 years on, ‘nothing has changed’","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2119681948842914240","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/week-asia/health-environment/article/3373762/doctor-was-murdered-south-korea-8-years-nothing-has-changed?utm_medium=Social&utm_source=Twitter#Echobox=1794206532","d":"scmp.com"}],"t":[],"lk":2,"rt":0,"rp":0,"vw":2651},{"id":"2119680809359798662","h":"fxtrader","ts":1794206261,"zh":"美银首席策略师Michael Hartnett在最新一期周报中，将2026年中期选举定性为“AI股票集中度见顶”的历史节点，上调明年超大规模云厂商资本开支预期，预示未来现金流恶化。美银还为明年初债务上限做准备，看多黄金。\n根据美银7月全球基金经理调查，七成投资者认为中期选举前美联储不会加息，八成认为民主党不会横扫，九成认为AI资本开支不会削减。而这些预期正在逐一被打破，美联储9月已经加息，民主党中期选举完成横扫，而随着多位民主党当选州长承诺暂停数据中心建设，“AI资本开支不会削减”的信念也岌岌可危。\nHartnett的市场逻辑是，云计算大厂资本开支高企，现金流急剧恶化（美银一周内将2027年超大规模云厂商资本开支从1.2万亿美元上调至1.3万亿）。债券市场期待AI资本开支放缓；科技债券将跑赢科技股，利空芯片、云计算建设端，利好AI使用方资产负债表。\n芯片股方面，费城半导体指数目前跌至200日均线下方 17%，根据历史规律，优质买点一般在20%‑25%区间；英伟达、台积电ADR均跌破关键支撑价位，仍有进一步调整空间。\n在宏观交易方面，美银押注黄金，警惕债务上限危机，理由是2027年2月美国或将触及41.1万亿美元债务上限，而历史上前两次债务上限博弈前三个月黄金大幅上涨，黄金从当前约4000美元起算，有望在债务上限博弈高峰期触及4500至4700美元区间。\n在中期选举后，Hartnett的交易清单方向是黄金 > 石油、收益率下行、科技债券 > 科技股、消费股 > 能源股、小盘股 > 垄断股、做多欧洲、做多中国科技股。\n美银对标普500是否会崩盘设定了三个衰退预警指标，分别是银行ETF（IXG）守住125美元、中小盘ETF（MDY）守住666美元、高收益债ETF（JNK）守住92美元。而MDY目前已告破，而且需要警惕的是，标普500目前距离Hartnett“全球广度法则”买入信号触发线（7323点）仅不足1%。","en":"美银首席策略师Michael Hartnett在最新一期周报中，将2026年中期选举定性为“AI股票集中度见顶”的历史节点，上调明年超大规模云厂商资本开支预期，预示未来现金流恶化。美银还为明年初债务上限做准备，看多黄金。\n根据美银7月全球基金经理调查，七成投资者认为中期选举前美联储不会加息，八成认为民主党不会横扫，九成认为AI资本开支不会削减。而这些预期正在逐一被打破，美联储9月已经加息，民主党中期选举完成横扫，而随着多位民主党当选州长承诺暂停数据中心建设，“AI资本开支不会削减”的信念也岌岌可危。\nHartnett的市场逻辑是，云计算大厂资本开支高企，现金流急剧恶化（美银一周内将2027年超大规模云厂商资本开支从1.2万亿美元上调至1.3万亿）。债券市场期待AI资本开支放缓；科技债券将跑赢科技股，利空芯片、云计算建设端，利好AI使用方资产负债表。\n芯片股方面，费城半导体指数目前跌至200日均线下方 17%，根据历史规律，优质买点一般在20%‑25%区间；英伟达、台积电ADR均跌破关键支撑价位，仍有进一步调整空间。\n在宏观交易方面，美银押注黄金，警惕债务上限危机，理由是2027年2月美国或将触及41.1万亿美元债务上限，而历史上前两次债务上限博弈前三个月黄金大幅上涨，黄金从当前约4000美元起算，有望在债务上限博弈高峰期触及4500至4700美元区间。\n在中期选举后，Hartnett的交易清单方向是黄金 > 石油、收益率下行、科技债券 > 科技股、消费股 > 能源股、小盘股 > 垄断股、做多欧洲、做多中国科技股。\n美银对标普500是否会崩盘设定了三个衰退预警指标，分别是银行ETF（IXG）守住125美元、中小盘ETF（MDY）守住666美元、高收益债ETF（JNK）守住92美元。而MDY目前已告破，而且需要警惕的是，标普500目前距离Hartnett“全球广度法则”买入信号触发线（7323点）仅不足1%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2119680809359798662","l":[],"ln":[],"t":["美联储","美股","AI科技","黄金"],"lk":22,"rt":3,"rp":3,"vw":13071},{"id":"2119676561162920222","h":"bbcchinese","ts":1794205248,"zh":"“黄仁勋被人算计了，他上当了。”美国调查记者、《黄仁勋传》作者史帝芬·维特（Stephen Witt）对BBC说。\n美国科技巨头英伟达表示，已对公司CEO黄仁勋展开调查。黄仁勋已在公司内部信中承认对妻子“不忠”。\n此前，《纽约时报》报导称黄仁勋的外遇对象是名为Alice Huang（中文名音译：黄乐）的商人，美国情报部门认定她是中国间谍，而中国否认该指控。","en":"“黄仁勋被人算计了，他上当了。”美国调查记者、《黄仁勋传》作者史帝芬·维特（Stephen Witt）对BBC说。\n美国科技巨头英伟达表示，已对公司CEO黄仁勋展开调查。黄仁勋已在公司内部信中承认对妻子“不忠”。\n此前，《纽约时报》报导称黄仁勋的外遇对象是名为Alice Huang（中文名音译：黄乐）的商人，美国情报部门认定她是中国间谍，而中国否认该指控。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2119675904053870592/vid/avc1/1080x1920/_lItNQFUiPREtE9N.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2119676561162920222","l":[],"ln":[],"t":["AI科技"],"lk":73,"rt":7,"rp":24,"vw":24894},{"id":"2119671509396717784","h":"cnfinancewatch","ts":1794204044,"zh":"美国卡车公司倒闭增多，未必只说明需求变冷。\n还要看运价、利率、燃料成本，以及前几年是否涌入了太多新运力。\n货运常被看作实体经济的温度计，但温度计也会受季节和行业结构影响。看到“倒闭潮”，你会先下衰退结论，还是先拆原因？","en":"美国卡车公司倒闭增多，未必只说明需求变冷。\n还要看运价、利率、燃料成本，以及前几年是否涌入了太多新运力。\n货运常被看作实体经济的温度计，但温度计也会受季节和行业结构影响。看到“倒闭潮”，你会先下衰退结论，还是先拆原因？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119671509396717784","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":3507},{"id":"2119671405772194115","h":"cnfinancewatch","ts":1794204019,"zh":"看通胀数据，别只看CPI涨了多少。\nCPI更接近消费端价格，PPI更接近工厂端价格。两者走势出现分化时，往往要追问：成本压力到了谁身上？企业能不能转嫁？利润会不会被压缩？\n一个指标给答案，两个指标才看到链条。你更关注物价，还是企业利润？\n对今天中国的两个数据你怎么看？","en":"看通胀数据，别只看CPI涨了多少。\nCPI更接近消费端价格，PPI更接近工厂端价格。两者走势出现分化时，往往要追问：成本压力到了谁身上？企业能不能转嫁？利润会不会被压缩？\n一个指标给答案，两个指标才看到链条。你更关注物价，还是企业利润？\n对今天中国的两个数据你怎么看？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119671405772194115","l":[],"ln":[],"t":["通胀"],"lk":1,"rt":0,"rp":0,"vw":2904},{"id":"2119671211643023561","h":"cnfinancewatch","ts":1794203973,"zh":"老板买了自家股票，你就该跟吗？\n先查是自掏现金，还是股权奖励；是主动买入，还是预设计划；金额相对他的持仓又有多大。\n内部人买入值得研究，却不能替利润、现金流和估值作答。信心是信号，不是底部证明。","en":"老板买了自家股票，你就该跟吗？\n先查是自掏现金，还是股权奖励；是主动买入，还是预设计划；金额相对他的持仓又有多大。\n内部人买入值得研究，却不能替利润、现金流和估值作答。信心是信号，不是底部证明。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119671211643023561","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":3053},{"id":"2119671140914541017","h":"cnfinancewatch","ts":1794203956,"zh":"看机构研报，别只截图“上调评级”四个字。\n真正值得保存的是：它假设利润增长多少、估值能到多少、什么情况会推翻判断。\n市场变了，旧结论未必还成立。比追问谁被打脸更有用的，是检查自己买入时的假设，还剩几条站得住。\n要看目标价是提升了还是下降了？\n要看评级是维持还是提升？\n最重要的是看逻辑是不是顺。","en":"看机构研报，别只截图“上调评级”四个字。\n真正值得保存的是：它假设利润增长多少、估值能到多少、什么情况会推翻判断。\n市场变了，旧结论未必还成立。比追问谁被打脸更有用的，是检查自己买入时的假设，还剩几条站得住。\n要看目标价是提升了还是下降了？\n要看评级是维持还是提升？\n最重要的是看逻辑是不是顺。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119671140914541017","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":2533},{"id":"2119670888694214804","h":"cnfinancewatch","ts":1794203896,"zh":"美国还在盖楼，但资金追逐的未必是写字楼。\n数据中心建设热，值得关注的不只是投入多少，还有谁来付电费、谁来租算力、现金流何时覆盖成本。\n建得快，是投资力度；赚得回来，才是商业闭环。看AI基建，你更关心开工规模，还是客户回款？","en":"美国还在盖楼，但资金追逐的未必是写字楼。\n数据中心建设热，值得关注的不只是投入多少，还有谁来付电费、谁来租算力、现金流何时覆盖成本。\n建得快，是投资力度；赚得回来，才是商业闭环。看AI基建，你更关心开工规模，还是客户回款？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119670888694214804","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":2952},{"id":"2119670785862508929","h":"cnfinancewatch","ts":1794203871,"zh":"看好一项技术，不等于看准一只股票。\n先分清三问：技术会不会扩散？谁能赚到持续利润？现在的价格是否已透支未来？\n很多人答完第一问，就急着下单。技术成功、公司赚钱、股东获利，是三件不同的事。你买的是其中哪一件？","en":"看好一项技术，不等于看准一只股票。\n先分清三问：技术会不会扩散？谁能赚到持续利润？现在的价格是否已透支未来？\n很多人答完第一问，就急着下单。技术成功、公司赚钱、股东获利，是三件不同的事。你买的是其中哪一件？","zh_src":"native","lang":"z ，市场传闻，谨慎参考\n二级传言：\n电池一哥\n12月排产环降13%\n27Q1环26Q4排产环降30%","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2119595566497976746","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":0,"vw":3953},{"id":"2119595542389096546","h":"cnfinancewatch","ts":1794185932,"zh":"加州是共同财产制州，婚后积累的资产原则上平分。黄仁勋1985年结婚，英伟达1993年创立，几乎全部身家（约1500-2000亿美元，主要是股票）属婚内共同财产。 活信托等结构不改变定性，基金会股份除外。出轨不影响财产分割比例。按现行法，妻子理论上可分走约一半，即750-1000亿美元量级，实际还需清算信托细节、税务和协议。\n离婚黄失去企业控制权是一定的。","en":"加州是共同财产制州，婚后积累的资产原则上平分。黄仁勋1985年结婚，英伟达1993年创立，几乎全部身家（约1500-2000亿美元，主要是股票）属婚内共同财产。 活信托等结构不改变定性，基金会股份除外。出轨不影响财产分割比例。按现行法，妻子理论上可分走约一半，即750-1000亿美元量级，实际还需清算信托细节、税务和协议。\n离婚黄失去企业控制权是一定的。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119595542389096546","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":3418},{"id":"2119595371081146491","h":"fxtrader","ts":1794185891,"zh":"英伟达CEO黄仁勋在向公司员工发出的一封道歉信中，承认自己对妻子不忠，并就此向家人、公司员工、董事会及股东公开道歉。\n英伟达董事会已启动独立调查。黄仁勋在道歉信中强调，自己将继续全力投入英伟达的工作。\n据此前媒体报道，女方是黄乐（Alice Huang），中国籍，曾任新加坡数据中心公司Megaspeed高管。而Megaspeed是英伟达在东南亚的重要客户，过去两年购买了数十亿美元的英伟达芯片，并因涉嫌将受出口管制的先进AI芯片转往中国而受美国调查。\n美国情报认为黄乐受中国指派收集情报，并可能推动放宽英伟达先进芯片对华出口限制。\n而英伟达董事会目前的立场是，没有理由认为美国国家安全或公司机密已受损。黄仁勋会继续担任CEO，并全力配合调查。强调此事不会影响运营。\n黄仁勋与妻子Lori Huang（洛莉）大学相识（俄勒冈州立大学），结婚约40年，黄仁勋也曾以“爱妻人设”闻名。\n据悉黄仁勋女儿黄敏珊出发前突然取消韩国行，只透露是“家庭原因”。原定计划会见韩国副总理兼科技信息通信部长官裴庆勋，并出席英伟达与SK等韩企合作的签订仪式，目前已临时改由其他人员代劳。","en":"英伟达CEO黄仁勋在向公司员工发出的一封道歉信中，承认自己对妻子不忠，并就此向家人、公司员工、董事会及股东公开道歉。\n英伟达董事会已启动独立调查。黄仁勋在道歉信中强调，自己将继续全力投入英伟达的工作。\n据此前媒体报道，女方是黄乐（Alice Huang），中国籍，曾任新加坡数据中心公司Megaspeed高管。而Megaspeed是英伟达在东南亚的重要客户，过去两年购买了数十亿美元的英伟达芯片，并因涉嫌将受出口管制的先进AI芯片转往中国而受美国调查。\n美国情报认为黄乐受中国指派收集情报，并可能推动放宽英伟达先进芯片对华出口限制。\n而英伟达董事会目前的立场是，没有理由认为美国国家安全或公司机密已受损。黄仁勋会继续担任CEO，并全力配合调查。强调此事不会影响运营。\n黄仁勋与妻子Lori Huang（洛莉）大学相识（俄勒冈州立大学），结婚约40年，黄仁勋也曾以“爱妻人设”闻名。\n据悉黄仁勋女儿黄敏珊出发前突然取消韩国行，只透露是“家庭原因”。原定计划会见韩国副总理兼科技信息通信部长官裴庆勋，并出席英伟达与SK等韩企合作的签订仪式，目前已临时改由其他人员代劳。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWpPIyBbYAAQ1SF.png?name=orig","https://pbs.twimg.com/media/HWpPSqAbYAAOqGO.png?name=o /3373723/trump-says-only-kidding-about-naming-ufcs-dana-white-press-secretary?utm_medium=Social&utm_source=Twitter#Echobox=1794184992","d":"scmp.com"}],"t":[],"lk":2,"rt":0,"rp":1,"vw":2371},{"id":"2119590924535861612","h":"cnfinancewatch","ts":1794184831,"zh":"《热点财经新闻综述｜11月9日·早间》\n北京时间08:15。今日判断：国内稳市政策与海外科技股压力形成拉锯。指数获得承接，不代表高估值赛道已经止跌。重点区分政策支持、资金流入与企业盈利，避免把三者混为一谈。\n三大利多方向，由强到弱\n稳市机制制度化。11月6日国常会提出完善资本市场稳市机制；第三批证券、基金、保险公司互换便利操作规模为1000亿元，31家机构参与。部分券商已披露完成相关股票买入。对券商和宽基权重而言，政策支持更具体，但操作额度不等于即时入市资金，不能据此推算指数必然上涨。\n被动资金形成承接。据中国基金报11月8日报道，股票ETF连续23个交易日净流入，累计约6215亿元。分析上，这有助于缓冲指数抛压，但ETF申购并不代表所有投资者看多，也不保证资金均匀流向中小盘。观察重点应是宽基成交、申赎持续性与市场上涨家数能否同步改善。\n半导体设备与国产替代。公开报道显示，中微公司获密集机构调研，公司提及新签订单增长。相较依赖海外AI资本开支的硬件环节，国产设备有不同的需求来源。不过，订单增长仍需转化为收入、利润和现金流，不能只凭调研数量判断买点。邮件关于杠杆资金调仓、光刻机模型的说法尚缺独立核验，不作为交易依据。\n三大利空方向，由强到弱\n海外科技交易降温。上周纳指约跌3.4%、标普约跌2.7%，国内部分光模块个股亦明显调整。需区分估值压缩与盈利下修：前者可能随风险偏好修复，后者则要等订单与业绩证据。不能把一次反弹直接认定为趋势反转。\n英伟达事件风险。英伟达董事会11月8日声明启动独立调查，并表示目前没有理由认为国家安全或公司机密受到损害。相关情报指控仍属报道与调查事项，不能当成定论。投资判断应跟踪公司正式披露、治理安排和业务影响，而不是围绕未经证实的个人细节交易。\n利率与宏观数据扰动。公开报道显示，10月美国非农新增16.5万、失业率4.1%。就业数据与通胀预期会影响利率定价，成长股对贴现率变化更敏感。本周应关注CPI及债券收益率反应，不能只看科技股自身消息，也不能把利率期货概率当成美联储承诺。\n多空如何制约\n政策与ETF资金主要缓冲指数风险，并不替个别公司的估值兜底。券商、宽基权重与国产设备各有催化，但仍需成交和业绩确认；高位算力硬件要重点辨别订单兑现与估值压力。油价下跌可能改善部分运输企业成本，却也可能反映需求担忧，不能机械归为全市场利多。\n操作上，先看开盘后的承接与市场宽度，再看板块强弱。已有仓位应关注持仓逻辑是否变化，新增仓位不宜只因政策标题追高。\n主要来源：国常会、互换便利、ETF报道、英伟达董事会声明。\n@cnfinancewatch 以上为信息整理与分析，不构成投资建议。","en":"《热点财经新闻综述｜11月9日·早间》\n北京时间08:15。今日判断：国内稳市政策与海外科技股压力形成拉锯。指数获得承接，不代表高估值赛道已经止跌。重点区分政策支持、资金流入与企业盈利，避免把三者混为一谈。\n三大利多方向，由强到弱\n稳市机制制度化。11月6日国常会提出完善资本市场稳市机制；第三批证券、基金、保险公司互换便利操作规模为1000亿元，31家机构参与。部分券商已披露完成相关股票买入。对券商和宽基权重而言，政策支持更具体，但操作额度不等于即时入市资金，不能据此推算指数必然上涨。\n被动资金形成承接。据中国基金报11月8日报道，股票ETF连续23个交易日净流入，累计约6215亿元。分析上，这有助于缓冲指数抛压，但ETF申购并不代表所有投资者看多，也不保证资金均匀流向中小盘。观察重点应是宽基成交、申赎持续性与市场上涨家数能否同步改善。\n半导体设备与国产替代。公开报道显示，中微公司获密集机构调研，公司提及新签订单增长。相较依赖海外AI资本开支的硬件环节，国产设备有不同的需求来源。不过，订单增长仍需转化为收入、利润和现金流，不能只凭调研数量判断买点。邮件关于杠杆资金调仓、光刻机模型的说法尚缺独立核验，不作为交易依据。\n三大利空方向，由强到弱\n海外科技交易降温。上周纳指约跌3.4%、标普约跌2.7%，国内部分光模块个股亦明显调整。需区分估值压缩与盈利下修：前者可能随风险偏好修复 不构成投资建议。","en":"《散户热议｜11月9日·早间》\n北京时间08:15。以下区分社区观点与可核事实，不将零散帖子当作全体散户的态度。国内参考韭研公社，海外参考Stocktwits；本期未能直接核对Reddit WallStreetBets原帖，不据二手摘要替其下结论。本篇尚未发布到X。\n国内讨论：题材接力与高低切换\n名字题材重新受到关注。公社公开帖讨论“东方”系个股，并延伸出补涨猜测。这类讨论反映短线资金寻找辨识度，并不构成公司盈利改善的证据。名字相近不意味着业务相关，更不意味着估值可以互相套用。与基本面研究相比，这类交易更依赖情绪和承接，断板后的流动性风险尤其值得注意。\n国内算力重估叙事升温。部分帖子围绕欧美数据中心建设压力，讨论国内算力、算力租赁与Token出海，也有人认为市场对算力已经过度悲观。需要拆开看：海外资本开支变化、国内新增需求和具体公司的订单，不是同一件事。即便方向成立，也要检查合同质量、利用率、回款及折旧压力，不能只凭“东升西降”四个字判断盈利。\n资金寻找低位催化。盘前讨论涉及传媒、AI短剧、机器人、商业航天及半导体国产替代。社区同时存在两种思路：一派寻找新题材承接资金，另一派认为高位光模块调整后可能出现机会。两者的验证条件不同：新题材要看催化是否兑现，原主线要看订单与盈利预期是否止跌。板块涨跌并不能单独回答这些问题。\n稳市政策获得重视，但额度容易被误读。部分帖子把互换便利操作规模直接描述为已经入市的资金。公开信息能确认操作规模和部分机构买入，不能据此认定全部额度已转为股票购买。政策支持有助于改善承接预期，却不能保证每个题材、每只股票都得到资金支持。\n海外讨论：龙头信心与事件风险\nStocktwits英伟达页面出现较强看多情绪，平台读数属于其自身指标，不能代表全部投资者。部分讨论强调芯片需求与生态优势，也有声音担忧治理事件带来的管理层不确定性。判断时应分开业务竞争力和事件风险：前者较强，并不意味着后者可以忽略；后者引发波动，也不自动证明业务已经受损。\n“抄底还是反弹”仍有分歧。围绕科技股调整，有观点着眼长期需求，有观点更重视短期估值和利率压力。长期看好与短期仓位控制并不矛盾。尤其使用期权时，方向判断之外还要考虑到期日、隐含波动率和亏损上限，不能把看好公司等同于看好任何价格的看涨合约。\n本期没有完成WSB一手核验，因此不提供其看多看空比例，也不将第三方总结包装成社区共识。零散热门帖、点赞数与情绪标签，都不能替代有明确样本和方法的统计。\n综合判断\n国内讨论更关注题材轮动，海外讨论更关注龙头估值与事件。共同需要补上的一环是盈利验证：政策额度不是已入市资金，社区热度不是订单，长期叙事也不是短期收益保证。观察订单、现金流与风险承受能力，比猜测下一轮最热口号更有意义。\n参考：韭研公社公开广场、Stocktwits英伟达讨论页。\n@cnfinancewatch 以上为公开讨论整理与分析，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2119590651318985136","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":2,"vw":2156},{"id":"2119590504463773839","h":"cnfinancewatch","ts":1794184731,"zh":"【A股盘前｜2026年11月9日】\n结论：邮件给出的环境评分为42分，归入其“降仓档”；这是底稿自定义评分，不是经验证的择时指标。其总体建议是控制仓位、不追高，关注房地产链、机器人机械与传媒娱乐三个方向。\n以下行情、资金及研报数据均为邮件转述，未逐项独立核实，不代表实时盘口。周一稿中的“昨日”“隔夜”没有统一明确日期，因此不据此判断最新跨市场涨跌。\n#消息面 邮件提到外资机构看多A股、有色金属ETF发行、限售股解禁以及算力相关材料需求。分析上应区分长期需求与短期交易：机构观点不等于实际增量资金，ETF发行规模不等于即时买入，解禁规模也不等于股东必然减持。核能和商业航天的海外催化，还需进一步确认具体合同与A股公司的业务关联。\n#研报面 邮件引用中信证券、中信建投、华泰等机构观点，涉及估值、稳投资、盈利改善及医疗器械。但三个主选方向在底稿中均被标为研报互证不足，主选个股亦缺少近期直接覆盖。行业观点不能直接替代个股盈利预测，更不能据此证明买入时点。\n#资金面 邮件称上海电影获机构净买入1.19亿元，索辰科技获游资净买入1.73亿元，并列出影视、消费龙头、机器人ETF的20日表现。上述数字需核对交易日期和统计口径。龙虎榜只能反映特定交易日的部分席位，不能据此认定机构持续加仓；板块阶段涨幅较高，也可能意味着交易拥挤。\n#期货 邮件提及纳指期货反弹，但缺少清晰报价时间；股指期货升贴水数据未取得。这部分不作确定方向判断，不能以一条无时点期货报价覆盖整个盘前风险判断。\n#中美映射 底稿比较了美国住宅建筑、机器人、半导体与日韩制造业表现。其思路是用海外行业走势辅助筛选A股方向，但价格同向不等于盈利联动。不同市场的交易日期、汇率、估值与业务结构均可能造成偏差，跨市场映射只作观察线索。\n#三个方向 一、房地产链。底稿权重最高，理由是海外住宅建筑映射与潜在补涨。需要验证国内销售、订单、回款与板块成交，不能只因海外ETF上涨推导国内公司盈利改善。\n二、机器人机械。底稿强调美日相关资产同向，但其筛选结果没有符合“可作短线”条件的标的。因此方向可以观察，不必为了覆盖主题强行下单。\n三、传媒娱乐。底稿认为更多由A股资金驱动，缺少海外互证。连续上涨后尤其要关注成交承接、业绩兑现和资金撤离风险。\n#六只个股 顾家家居（603816）：底稿列为短线候选，关注量价承接与家居需求。\n三棵树（603737）：列入地产链观察名单。底稿一处给出低吸描述，但最终短线池未包含它，口径有冲突，不将其表述为明确买入标的。\n上海电影（601595）：底稿列为短线候选，同时提示短期涨幅较大、偏离均线，不宜忽略回撤风险。\n索辰科技（688507）：底稿认为位置偏高且不满足短线条件，仅观察。\n芒果超媒（300413）：虽被列入短线池，底稿又提示处于加速阶段、仅作备选。应保留这项风险提示，而非只强调入选。\n凡拓数创（301313）：底稿称热度条件不成立，仅观察，不设置买点。\n#操作提示 上述名单是邮件筛选结果，不是独立验证后的推荐。底稿具体价位未完成行情及复权口径核验，本稿不直接给出挂单价。先检查数据日期、原始研报与公司公告，再判断交易逻辑是否成立；不因题材齐全而凑足持仓。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅","en":"【A股盘前｜2026年11月9日】\n结论：邮件给出的环境评分为42分，归入其“降仓档”；这是底稿自定义评分，不是经验证的择时指标。其总体建议是控制仓位、不追高，关注房地产链、机器人机械与传媒娱乐三个方向。\n以下行情、资金及研报数据均为邮件转述，未逐项独立核实，不代表实时盘口。周一稿中的“昨日”“隔夜”没有统一明确日期，因此不据此判断最新跨市场涨跌。\n#消息面 邮件提到外资机构看多A股、有色金属ETF发行、限售股解禁以及算力相关材料需求。分析上应区分长期需求与短期交易：机构观点不等于实际增量资金，ETF发行规模不等于即时买入，解禁规模也不等于股东必然减持。核能和商业航天的海外催化，还需进一步确认具体合同与A股公司的业务关联。\n#研报面 邮件引用中信证券、中信建投、华泰等机构观点，涉及估值、稳投资、盈利改善及医疗器械。但三个主选方向在底稿中均被标为研报互证不足，主选个股亦缺少近期直接覆盖。行业观点不能直接替代个股盈利预测，更不能据此证明买入时点。\n#资金面 邮件称上海电影获机构净买入1.19亿元，索辰科技获游资净买入1.73亿元，并列出影视、消费龙头、机器人ETF的20日表现。上述数字需核对交易日期和统计口径。龙虎榜只能反映特定交易日的部分席位，不能据此认定机构持续加仓；板块阶段涨幅较高，也可能意味着交易拥挤。\n#期货 邮件提及纳指期货反弹，但缺少清晰报价时间；股指期货升贴水数据未取得。这部分不作确定方向判断，不能以一条无时点期货报价覆盖整个盘前风险判断。\n#中美映射 底稿比较了美国住宅建筑、机器人、半导体与日韩制造业表现。其思路是用海外行业走势辅助筛选A股方向，但价格同向不等于盈利联动。不同市场的交易日期、汇率、估值与业务结构均可能造成偏差，跨市场映射只作观察线索。\n#三个方向 一、房地产链。底稿权重最高，理由是海外住宅建筑映射与潜在补涨。需要验证国内销售、订单、回款与板块成交，不能只因海外ETF上涨推导国内公司盈利改善。\n二、机器人机械。底稿强调美日相关资产同向，但其筛选结果没有符合“可作短线”条件的标的。因此方向可以观察，不必为了覆盖主题强行下单。\n三、传媒娱乐。底稿认为更多由A股资金驱动，缺少海外互证。连续上涨后尤其要关注成交承接、业绩兑现和资金撤离风险。\n#六只个股 顾家家居（603816）：底稿列为短线候选，关注量价承接与家居需求。\n三棵树（603737）：列入地产链观察名单。底稿一处给出低吸描述，但最终短线池未包含它，口径有冲突，不将其表述为明确买入标的。\n上海电影（601595）：底稿列为短线候选，同时提示短期涨幅较大、偏离均线，不宜忽略回撤风险。\n索辰科技（688507）：底稿
