95708088,"zh":"貌似不少人把这条新闻理解错了，并不是荷兰放松了对光刻机的管控。荷兰其实是抵制美国正在推进match法案，这个法案比现在的管制措施更严格（深紫外线光刻机DUV也纳入管控），荷兰的意思是保持现有的管制边界（EUV管住，DUV还能卖），不希望再进一步收紧，不是主动放松。\n中国仍是ASML重要市场，预计占2026年销售额约20%（此前更高，有年份接近1/3）。现有管制下ASML可向中国销售部分DUV机型（受荷兰许可管理），但先进机型和维护已受限制。所以荷兰的反应自然可以理解，要是DUV也不能卖给中国了，阿斯麦的业绩估计得大滑坡。阿斯麦在荷兰经济版图中的重要性又不言而喻。荷兰政府自然也不希望美国的管控在现有基础上进一步收紧。\n现在荷兰政府积极活动希望确保MATCH法案不通过，同时夜不会被纳入美国年度《国防授权法案》（NDAA）。","en":"貌似不少人把这条新闻理解错了，并不是荷兰放松了对光刻机的管控。荷兰其实是抵制美国正在推进match法案，这个法案比现在的管制措施更严格（深紫外线光刻机DUV也纳入管控），荷兰的意思是保持现有的管制边界（EUV管住，DUV还能卖），不希望再进一步收紧，不是主动放松。\n中国仍是ASML重要市场，预计占2026年销售额约20%（此前更高，有年份接近1/3）。现有管制下ASML可向中国销售部分DUV机型（受荷兰许可管理），但先进机型和维护已受限制。所以荷兰的反应自然可以理解，要是DUV也不能卖给中国了，阿斯麦的业绩估计得大滑坡。阿斯麦在荷兰经济版图中的重要性又不言而喻。荷兰政府自然也不希望美国的管控在现有基础上进一步收紧。\n现在荷兰政府积极活动希望确保MATCH法案不通过，同时夜不会被纳入美国年度《国防授权法案》（NDAA）。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYD_ekHaAAAaCsu.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2125979930274173371","l":[],"ln":[],"t":[],"lk":33,"rt":3,"rp":10,"vw":11684},{"id":"2125975393878565032","h":"ShanghaoJin","ts":1795707007,"zh":"其实Masa san的风险比crwv还大\n他可流通股权全质押了，OpenAI的股权不能卖put hedge，抵押不掉的\n他估计在后悔，当时梭哈怎么被Sam忽悠了，为什么不去梭Anthropic、或留在NV","en":"其实Masa san的风险比crwv还大\n他可流通股权全质押了，OpenAI的股权不能卖put hedge，抵押不掉的\n他估计在后悔，当时梭哈怎么被Sam忽悠了，为什么不去梭Anthropic、或留在NV","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2125975393878565032","l":[],"ln":[],"t":[],"lk":4,"rt":1,"rp":2,"vw":1552},{"id":"2125973722373009777","h":"ShanghaoJin","ts":1795706608,"zh":"如果真没有了Jensen这样的人，去推着整个产业链走，给一个个配件厂下risk production订单，对行业有多大影响","en":"如果真没有了Jensen这样的人，去推着整个产业链走，给一个个配件厂下risk production订单，对行业有多大影响","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2125973722373009777","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":3,"vw":2276},{"id":"2125972569828491694","h":"ShanghaoJin","ts":1795706333,"zh":"币圈交易所们的衰弱始于一个个都想挤进美股prep\ncrypto ex没有定价权，服务器在东京，就等于把辛辛苦苦揽新的客户入金拱手让人（跨区套利机构）\n一窝蜂去做黄金、美股，币圈交易所存在的意义又何在呢？客户是愿意把钱放在IB，还是天天被网络攻击的币所？","en":"币圈交易所们的衰弱始于一个个都想挤进美股prep\ncrypto ex没有定价权，服 合作\n此外，公司高端芯片算力储备丰富，万卡950DT集群用于大模型预训练前期准备顺利，预计明年能够跑通","en":"【国联民生计算机】智谱：GLM5.5模型研发进展顺利，市场传言系谣言\n[太阳] 路透社报道GLM5.5发布延后至27Q1消息为不实消息，我们预测GLM5.5将在12月发布，并具备以下亮点：\n1）参数量2-3T之间，性能真实达到Fable级别\n2）具身智能表现突出，与国内主流机器人公司持续深化合作\n此外，公司高端芯片算力储备丰富，万卡950DT集群用于大模型预训练前期准备顺利，预计明年能够跑通","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYDfO3hbAAAxlO6.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2125944480264258027","l":[],"ln":[],"t":["AI科技"],"lk":8,"rt":2,"rp":0,"vw":3103},{"id":"2125942387587592268","h":"fxtrader","ts":1795699137,"zh":"11月26日晚，网传照片显示，马云来到平头哥视察，在工位与一群年轻工程师交流、合影。\n据说团队最初提的方案叫本来叫“蜂鸟”（取小而快、低功耗的意思），后来被马云否决。马云此前去过一趟非洲，听说了蜜獾，体型不大却敢挑战远大于自己的动物，觉得这股“生死看淡、不服就干”的尽头适合做自研芯片的心气，于是定名“平头哥”。\n阿里巴巴此前已公告，拟分拆全资子公司平头哥在港交所主板独立上市。据悉计划明年挂牌。","en":"11月26日晚，网传照片显示，马云来到平头哥视察，在工位与一群年轻工程师交流、合影。\n据说团队最初提的方案叫本来叫“蜂鸟”（取小而快、低功耗的意思），后来被马云否决。马云此前去过一趟非洲，听说了蜜獾，体型不大却敢挑战远大于自己的动物，觉得这股“生死看淡、不服就干”的尽头适合做自研芯片的心气，于是定名“平头哥”。\n阿里巴巴此前已公告，拟分拆全资子公司平头哥在港交所主板独立上市。据悉计划明年挂牌。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYDaVpKaQAA00mH.jpg?name=orig","https://pbs.twimg.com/media/HYDaWqObYAADwL5.jpg?name=orig","https://pbs.twimg.com/media/HYDaXvVbIAEk6bD.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2125942387587592268","l":[],"ln":[],"t":["AI科技"],"lk":12,"rt":0,"rp":1,"vw":4545},{"id":"2125937630584136059","h":"RichTerry123","ts":1795698003,"zh":"不要让市场恐惧将你从持仓中震出。\n美国华尔街最著名、最成功的宏观对冲基金经理之一，也是乔治·索罗斯曾经最重要的投资搭档德鲁肯米勒的建议：\n当一项投资出现亏损时，不要急于加仓以求迅速回本；\n相反，应减少仓位规模，并通过较小的交易来重新找回与市场的节奏。\n下面是我总结的他的四项关键交易经验：\n1. 永远不要追损。仅仅为了弥补亏损而加大仓位，是情绪化的决定，而非理性的交易策略。\n2. 认清自己的交易状态。了解自己是处于连胜还是连亏。即使是最优秀的投资者，也会经历判断失误的时期。\n3. 亏损时减小仓位。减少单笔交易规模，保护本金，专注于找回交易节奏，而不是追逐高额利润。\n4. 重新赢得大仓位交易的资格。先用较小的仓位确认自己的市场判断力已经恢复，再逐步加大仓位。","en":"不要让市场恐惧将你从持仓中震出。\n美国华尔街最著名、最成功的宏观对冲基金经理之一，也是乔治·索罗斯曾经最重要的投资搭档德鲁肯米勒的建议：\n当一项投资出现亏损时，不要急于加仓以求迅速回本；\n相反，应减少仓位规模，并通过较小的交易来重新找回与市场的节奏。\n下面是我总结的他的四项关键交易经验：\n1. 永远不要追损。仅仅为了弥补亏损而加大仓位，是情绪化的决定，而非理性的交易策略。\n2. 认清自己的交易状态。了解自己是处于连胜还是连亏。即使是最优秀的投资者，也会经历判断失误的时期。\n3. 亏损时减小仓位。减少单笔交易规模，保护本金，专注于找回交易节奏，而不是追逐高额利润。\n4. 重新赢得大仓位交易的资格。先用较小的仓位确认自己的市场判断力已经恢复，再逐步加大仓位。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/RichTerry123/status/2125937630584136059","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":378},{"id":"2125934523083047173","h":"wufantouzi","ts":1795697262,"zh":"老有人争执什么左侧右侧\n最普及的说法就是\n从高点画一条垂直线\n高点左边的就是左侧交易\n高点右边的就是右侧交易\n也有其他解释刚好相反的\n但我认为这个说法最通俗易懂\n我说的左侧和右侧\n是按照这个说法来的","en":"老有人争执什么左侧右侧\n最普及的说法就是\n从高点画一条垂直线\n高点左边的就是左侧交易\n高点右边的就是右侧交易\n也有其他解释刚好相反的\n但我认为这个说法最通俗易懂\n我说的左侧和右侧\n是按照这个说法来的","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2125934523083047173","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":3,"vw":1876},{"id":"2125932171135537248","h":"dmjk001","ts":1795696702,"zh":"彭博：荷兰政府表示，将抵制美国进一步限制阿斯麦控股对华销售的计划，称拟议规则对这家欧洲市值最高的公司构成威胁。","en":"彭博：荷兰政府表示，将抵制美国进一步限制阿斯麦控股对华销售的计划，称拟议规则对这家欧洲市值最高的公司构成威胁。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYDT9zpbUAEphWb.png?name=orig"],"u":"https://x.com/dmjk001/status/2125932171135537248","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":76},{"id":"2125930805948039399","h":"darrencao2024","ts":1795696376,"zh":"根据基本面情况计算出来目标价格，跑到中性目标价减仓，跑到乐观价清仓","en":"根据基本面情况计算出来目标价格，跑到中性目标价减仓，跑到乐观价清仓","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2125930805948039399","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":0,"vw":937},{"id":"2125927263841726813","h":"misaENFP","ts":1795695532,"zh":"今晚美股放假，但 Crypto 的市场永远不打烊～\n今天是美国感恩节，美股全天休市，明天黑色星期五也只有3.5小时的常规交易时间。\n这也是传统金融与加密金融一个很有意思的区别。\n目前 OKX TradFi 的股票永续合约支持 7×24 小时交易，让大家在传统市场休市期间，也多了一种管理风险的选择。当然，休市期间的流动性、价差和定价机制有所不同，大家也要注意合约交易风险。\n交易时间的自由，不应该成为另一种时间上的束缚。\n借着今天感恩节，也想认真地感谢一下大家。\n从最开始自己摸索着做活动，到现在有了一群愿意陪我体验产品、认真给我写反馈、帮我出主意的小伙伴。\n每次做活动看到熟悉的头像，每次推广新产品收到大家认认真真的体验反馈，包括平时在社区里看到大家互相解答问题、分享经验，我都会觉得，这份工作给我带来的收获，远远不只是工作本身。\n好的社区从来不是一个人的独角戏，而是一群人的双向奔赴。\n谢谢大家对我的支持，也谢谢大家愿意对我们的产品提出批评和建议。比起一句简单的好用，那些花时间认真写下的改进建议，同样珍贵。\n最近行情低迷，也希望大家不要因为账户里的数字而影响自己的生活。\n我们努力赚钱，是为了拥有更好的生活，而不是让生活只剩下赚钱。\n市场可以永不打烊，但是生活不止交易。\n随意评论，周边10份回馈给大家🙏","en":"今晚美股放假，但 Crypto 的市场永远不打烊～\n今天是美国感恩节，美股全天休市，明天黑色星期五也只有3.5小时的常规交易时间。\n这也是传统金融与加密金融一个很有意思的区别。\n目前 OKX TradFi 的股票永续合约支持 7×24 小时交易，让大家在传统市场休市期间，也多了一种管理风险的选择。当然，休市期间的流动性、价差和定价机制有所不同，大家也要注意合约交易风险。\n交易时间的自由，不应该成为另一种时间上的束缚。\n借着今天感恩节，也想认真地感谢一下大家。\n从最开始自己摸索着做活动，到现在有了一群愿意陪我体验产品、认真给我写反馈、帮我出主意的小伙伴。\n每次做活动看到熟悉的头像，每次推广新产品收到大家认认真真的体验反馈，包括平时在社区里看到大家互相解答问题、分享经验，我都会觉得，这份工作给我带来的收获，远远不只是工作本身。\n好的社区从来不是一个人的独角戏，而是一群人的双向奔赴。\n谢谢大家对我的支持，也谢谢大家愿意对我们的产品提出批评和建议。比起一句简单的好用，那些花时间认真写下的改进建议，同样珍贵。\n最近行情低迷，也希望大家不要因为账户里的数字而影响自己的生活。\n我们努力赚钱，是为了拥有更好的生活，而不是让生活只剩下赚钱。\n市场可以永不打烊，但是生活不止交易。\n随意评论，周边10份回馈给大家🙏","zh_src":"native","lang":"zh","m":["https://video.twimg.com/tweet_video/HYDPhHwacAA_yQD.mp4"],"u":"https://x.com/misaENFP/status/2125927263841726813","l":[],"ln":[],"t":["美股"],"lk":33,"rt":4,"rp":38,"vw":672},{"id":"2125922540241424412","h":"bbcchinese","ts":1795694405,"zh":"英国政府强制将一名已获难民身份、曾因性犯罪被定罪的男子安置到一个与其毫无关联的非洲国家，而这项安排既未向英国国会公开，也未告知当地社区。\n这被认为是目前已知首起英国政府将难民永久强制重新安置到海外的案例。","en":"英国政府强制将一名已获难民身份、曾因性犯罪被定罪的男子安置到一个与其毫无关联的非洲国家，而这项安排既未向英国国会公开，也未告知当地社区。\n这被认为是目前已知首起英国政府将难民永久强制重新安置到海外的案例。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2125922540241424412","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4CnKxjx","d":"bbc.in"}],"t":[],"lk":3,"rt":0,"rp":0,"vw":2048},{"id":"2125916778777964984","h":"hanking66","ts":1795693032,"zh":"难道还放鹰吗😅😅😅死了算了","en":"难道还放鹰吗😅😅😅死了算了","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYDGCbWaUAAHWn5.jpg?name=orig"],"u":"https://x.com/hanking66/status/2125916778777964984","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":498},{"id":"2125915733100245346","h":"Kay2289123","ts":1795692783,"zh":"如果你有很强烈的学习能力，想进 AI 行业，做高薪方向，该学什么？\n我真心建议你学 AI 推理工程，可以从下面的步骤来。\n1. 先挑一个方向钻进去。 GPU 编程（比如 CUDA）、模型优化、量化、分布式推理，都可以选。\n• 可以先看 GPU 的线程和内存是怎么组织的。NVIDIA《CUDA 编程指南》\n2. 把基础学透。 一个请求进来，GPU 跑了哪些计算？模型怎么一个 token 一个 token 地生成答案？\n• 可以跟着 Karpathy 写一个小 GPT，重点看它怎么预测下一个 token。\n3. 上手 PyTorch、Triton、vLLM 和 TensorRT-LLM。 试着把模型部署成一个能接真实请求的推理服务。\n• 服务部署可以先从跑通一个 API 开始。vLLM 官方教程\n4. 做 3 到 5 个项目。 试着压低推理成本、缩短回复延迟，或者让同样的 GPU 扛住更多请求。\n• 举个例子，拿一个开源模型做量化，用同一套问题对照测试，看看省了多少显存，回答表现有没有变化。\n• 也可以先跑通一版小型推理引擎，再动手改一处调度或缓存。Nano-vLLM\n5. 每个项目都跑 benchmark。 固定 GPU 和测试条件，记录每张卡的吞吐、延迟和每百万 token 的成本。\n• 举个例子，假设同一张卡跑同一批请求，输出从每秒 100 个 token 提到 130 个，吞吐就是多了 30%。也把首 token 延迟和回答质量记下来。\n• 可以照着文档跑一次压测。vLLM Benchmark CLI\n6. 列出 50 家你真想去的公司。 AI 创业公司、GPU 云厂商、专门做推理的团队都可以。\n• 可以先从公司目录里找做推理和 GPU 云的团队。YC 基础设施公司目录\n7. 看看这些公司的系统卡在哪儿。 从工程博客或公开 issue 里挑一个具体问题，做个能复现、能对比的项目。\n• 举个例子，如果一个文档问答服务反复把同一份长文放进提示词，可以用公开文档搭个 demo，测测复用这段前缀能不能缩短首 token 延迟。\n• 可以看看实际团队怎么用缓存路由减少排队和长尾延迟。Modal 与 Sakana AI 的上线复盘\n8. 直接联系创始人或工程负责人。 给他们看项目、代码和测试结果，然后问问有没有实习机会。\n• 消息可以这样写，「看到你们工程博客提到长文档请求慢，我用公开数据做了个小实验。这里是代码和测试结果，请问团队有推理方向的实习机会吗？」\n• 可以参考 YC 对第一封联系邮件的建议。\n9. 花 12 到 18 个月扎扎实实做一线工程。 亲手部署、看监控、排查故障，搞清楚 AI 系统在线上到底怎么跑。\n• 可以看推理服务怎么部署到 Kubernetes、怎么路由请求、怎么做监控。vLLM Production Stack\n10. 有了这些经验，再考虑自己出来做。 可以做推理服务，帮别的团队做性能优化咨询，或者做 GPU 基础设施。\n• 可以先学怎么判断一个创业点子有没有真实需求。YC《如何找到创业点子》\n模型会越来越聪明。要让更多人用上它，每次调用得够便宜，用户等回复的时间得够短，流量上来时服务还得扛得住。\n谁能把这些问题解决，谁就有机会在 AI 产业里做成一门大生意。","en":"如果你有很强烈的学习能力，想进 AI 行业，做高薪方向，该学什么？\n我真心建议你学 AI 推理工程，可以从下面的步骤来。\n1. 先挑一个方向钻进去。 GPU 编程（比如 CUDA）、模型优化、量化、分布式推理，都可以选。\n• 可以先看 GPU 的线程和内存是怎么组织的。NVIDIA《CUDA 编程指南》\n2. 把基础学透。 一个请求进来，GPU 跑了哪些计算？模型怎么一个 token 一个 token 地生成答案？\n• 可以跟着 Karpathy 写一个小 GPT，重点看它怎么预测下一个 token。\n3. 上手 PyTorch、Triton、vLLM 和 TensorRT-LLM。 试着把模型部署成一个能接真实请求的推理服务。\n• 服务部署可以先从跑通一个 API 开始。vLLM 官方教程\n4. 做 3 到 5 个项目。 试着压低推理成本、缩短回复延迟，或者让同样的 GPU 扛住更多请求。\n• 举个例子，拿一个开源模型做量化，用同一套问题对照测试，看看省了多少显存，回答表现有没有变化。\n• 也可以先跑通一版小型推理引擎，再动手改一处调度或缓存。Nano-vLLM\n5. 每个项目都跑 benchmark。 固定 GPU 和测试条件，记录每张卡的吞吐、延迟和每百万 token 的成本。\n• 举个例子，假设同一张卡跑同一批请求，输出从每秒 100 个 token 提到 130 个，吞吐就是多了 30%。也把首 token 延迟和回答质量记下来。\n• 可以照着文档跑一次压测。vLLM Benchmark CLI\n6. 列出 50 家你真想去的公司。 AI 创业公司、GPU 云厂商、专门做推理的团队都可以。\n• 可以先从公司目录里找做推理和 GPU 云的团队。YC 基础设施公司目录\n7. 看看这些公司的系统卡在哪儿。 从工程博客或公开 issue 里挑一个具体问题，做个能复现、能对比的项目。\n• 举个例子，如果一个文档问答服务反复把同一份长文放进提示词，可以用公开文档搭个 demo，测测复用这段前缀能不能缩短首 token 延迟。\n• 可以看看实际团队怎么用缓存路由减少排队和长尾延迟。Modal 与 Sakana AI 的上线复盘\n8. 直接联系创始人或工程负责人。 给他们看项目、代码和测试结果，然后问问有没有实习机会。\n• 消息可以这样写，「看到你们工 然还有脸上台\n此人“子弹打光，应买尽买”，跟着他9月份买入网友现在都吊死在山顶上了\n现在突然又有钱来“抄底”了。啥意思，难道你也和我一样空仓？\nJin大师为了维持自己的生计，宣传自己看得到牌，有内幕消息，断言美联储加息不重要\n疯狂唱多甚至一直唱到现在，本次熊市一路走来， 从不承认自己的错误，也完全不披露自己AEHR BE NBIS 亏了多少钱\n毫无廉耻，毫不悔改，之前明嘲暗讽空头的事情就当没发生过\n其脸皮之厚，令人震惊\n利用赌徒韭菜想回本的心理，越亏越信，越信越亏，最终练成PUA大师\n真的就把推特粉丝当NPC，当成自己的提款机了？\n我从未见过如此厚颜无耻之人\n当然，这非常符合高盛操盘手的特色\n毕竟他也没有别的职业，只能以此为生了\n贵机构在培植“大师”，放纵他们忽悠韭菜这方面，真的太典了，把好不容易来推特获取信息的中国网友当刚来缅甸电诈中心对待\n建议大家为了自己的人生未来和30年后的体面生活，将此频道和X Space账号全体拉黑，\n否则你也真的彻底没救了\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125867130537316407","l":[],"ln":[],"t":["美联储"],"lk":5,"rt":1,"rp":1,"vw":562},{"id":"2125866580152107339","h":"RichTerry123","ts":1795681064,"zh":"真正的复利，不只是钱生钱，而是让人生持续增值\n很多人理解复利，就是利息生利息，本金滚本金。但这只是复利最表层的应用。\n我认为，真正的复利，是一套让自己持续增值的底层逻辑。\n判断一件事情值不值得长期投入，不只是看它今天能带来多少收益，而是看它能不能随着时间积累，让未来的自己变得更强，让下一次做得更好。\n这种复利，不只存在于金钱，也存在于知识、关系、信誉和健康。\n一、知识的复利\n知识不是简单的堆积，而是不断建立连接。\n今天学到一个原理，明天就可能用它理解另一个问题；今天积累一次经验，下一次决策就可能少走一些弯路。\n低水平的学习是学完就忘，高水平的学习是不断把新知识和旧经验连接起来，再通过实践和复盘修正自己的认知。\n时间越长，判断力的差距就越明显。\n真正有价值的学习，不是让自己知道得更多，而是让自己解决问题的能力越来越强。\n二、关系的复利\n关系不是一次性的交换，而是长期信任的积累。\n每一次可靠的交付、每一次兑现承诺、每一次真正为别人创造价值，都在增加彼此的信任。\n信任越深，沟通成本越低，合作越容易，机会也越容易产生。\n所以，真正有价值的人脉，不是你认识多少人，而是有多少人愿意在关键时刻和你合作。\n三、信誉的复利\n信誉是一个人最重要的隐性资产之一。\n你说过的话是否算数，做过的事情是否可靠，遇到问题是否愿意承担责任，这些都会逐渐形成外界对你的评价。\n信誉越好，别人越愿意相信你，把资源和机会交给你，你也不需要每次都从零开始证明自己。\n建立信誉需要很多年，但破坏信誉可能只需要一次失信。\n所以，不要为了短期利益透支长期信用。因为信誉的价值，往往在关键时刻才真正体现出来。\n四、健康的复利\n健康是所有复利的基础。\n知识、关系、信誉和财富，都需要时间和精力去积累。如果身体长期透支，判断力、执行力和持续创造价值的能力都会受到影响。\n规律运动、充足睡眠、合理饮食，短期看不到太多收益，但长期会影响一个人的精力、情绪和决策质量。\n不要为了眼前的收益，提前消耗未来创造价值的能力。\n五、金钱的复利\n金钱复利最容易理解，就是让资本通过投资和再投入，持续创造更多资本。\n但复利真正重要的，不只是追求收益率，而是控制风险，让自己始终拥有参与下一轮增长的资格。\n一次严重亏损，可能抵消很多年的积累。\n所以，长期投资最重要的不是每次都赚得最多，而是在合理控制风险的前提下，让时间持续发挥作用。\n六、让五种复利形成正循环\n这五种复利并不是孤立存在的。\n知识提高判断力，判断力帮助你创造更好的结果；好的结果积累信誉，信誉带来关系和机会；关系带来资源，资源帮助财富增长；而健康则决定你能不能长期维持这一切。\n它们相互加强，形成一个正向循环。\n我觉得，真正厉害的人，并不是某一方面特别突出，而是懂得让自己的各项优势相互促进。\n最后，复利思维其实可以归结为一个问题：\n今天做的事情，能不能让未来的自己变得更强、更稳、更有选择权？\n如果可以，即使短期看不到回报，也值得长期投入。\n如果一件事情只能带来眼前的好处，却不断消耗自己的能力、信誉和健康，就要警惕它的长期成本。\n人生真正的差距，往往不是某一次抓住了多大的机会，而是长期坚持积累了什么，又避免透支了什么。\n钱生钱是财富的复利，认知增长是知识的复利，信任积累是关系的复利，而持续创造价值，是整个人生的复利。\n不要只想着让自己的钱越来越多，更要让自己成为一个持续增值的人。\n因为真正值得投资的长期资产，除了金钱，还有你自己。","en":"真正的复利，不只是钱生钱，而是让人生持续增值\n很多人理解复利，就是利息生利息，本金滚本金。但这只是复利最表层的应用。\n我认为，真正的复利，是一套让自己持续增值的底层逻辑。\n判断一件事情值不值得长期投入，不只是看它今天能带来多少收益，而是看它能不能随着时间积累，让未来的自己变得更强，让下一次做得更好。\n这种复利，不只存在于金钱，也存在于知识、关系、信誉和健康。\n一、知识的复利\n知识不是简单的堆积，而是不断建立连接。\n今天学到一个原理，明天就可能用它理解另一个问题；今天积累一次经验，下一次决策就可能少走一些弯路。\n低水平的学习是学完就忘，高水平的学习是不断把新知识和旧经验连接起来，再通过实践和复盘修正自己的认知。\n时间越长，判断力的差距就越明显。\n真正有价值的学习，不是让自己知道得更多，而是让自己解决问题的能力越来越强。\n二、关系的复利\n关系不是一次性的交换，而是长期信任的积累。\n每一次可靠的交付、每一次兑现承诺、每一次真正为别人创造价值，都在增加彼此的信任。\n信任越深，沟通成本越低，合作越容易，机会也越容易产生。\n所以，真正有价值的人脉，不是你认识多少人，而是有多少人愿意在关键时刻和你合作。\n三、信誉的复利\n信誉是一个人最重要的隐性资产之一。\n你说过的话是否算数，做过的事情是否可靠，遇到问题是否愿意承担责任，这些都会逐渐形成外界对你的评价。\n信誉越好，别人越愿意相信你，把资源和机会交给你，你也不需要每次都从零开始证明自己。\n建立信誉需要很多年，但破坏信誉可能只需要一次失信。\n所以，不要为了短期利益透支长期信用。因为信誉的价值，往往在关键时刻才真正体现出来。\n四、健康的复利\n健康是所有复利的基础。\n知识、关系、信誉和财富，都需要时间和精力去积累。如果身体长期透支，判断力、执行力和持续创造价值的能力都会受到影响。\n规律运动、充足睡眠、合理饮食，短期看不到太多收益，但长期会影响一个人的精力、情绪和决策质量。\n不要为了眼前的收益，提前消耗未来创造价值的能力。\n五、金钱的复利\n金钱复利最容易理解，就是让资本通过投资和再投入，持续创造更多资本。\n但复利真正重要的，不只是追求收益率，而是控制风险，让自己始终拥有参与下一轮增长的资格。\n一次严重亏损，可能抵消很多年的积累。\n所以，长期投资最重要的不是每次都赚得最多，而是在合理控制风险的前提下，让时间持续发挥作用。\n六、让五种复利形成正循环\n这五种复利并不是孤立存在的。\n知识提高判断力，判断力帮助你创造更好的结果；好的结果积累信誉，信誉带来关系和机会；关系带来资源，资源帮助财富增长；而健康则决定你能不能长期维持这一切。\n它们相互加强，形成一个正向循环。\n我觉得，真正厉害的人，并不是某一方面特别突出，而是懂得让自己的各项优势相互促进。\n最后，复利思维其实可以归结为一个问题：\n今天做的事情，能不能让未来的自己变得更强、更稳、更有选择权？\n如果可以，即使短期看不到回报，也值得长期投入。\n如果一件事情只能带来眼前的好处，却不断消耗自己的能力、信誉和健康，就要警惕它的长期成本。\n人生真正的差距，往往不是某一次抓住了多大的机会，而是长期坚持积累了什么，又避免透支了什么。\n钱生钱是财富的复利，认知增长是知识的复利，信任积累是关系的复利，而持续创造价值，是整个人生的复利。\n不要只想着让自己的钱越来越多，更要让自己成为一个持续增值的人。\n因为真正值得投资的长期资产，除了金钱，还有你自己。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/RichTerry123/status/2125866580152107339","l":[],"ln":[],"t":[],"lk":2,"rt":1,"rp":0,"vw":640},{"id":"2125866181647368559","h":"bboczeng","ts":1795680969,"zh":"你们这走穴机构能不能别发太监了？\n此人“子弹打光，应买尽买”，跟着他9月份买入网友现在都吊死在山顶上了\n突然又有钱来抄底了是吧？\nJin老师为了维持自己的生计，宣传自己看得到牌，有内幕消息，宣传美联储加息不重要\n疯狂唱多甚至一直唱到现在，本次熊市一路走来， 从不承认自己的错误，也完全不披露自己AEHR BE NBIS YA3vTmXoAAAdel.jpg?name=orig"],"u":"https://x.com/SupFin/status/2125834733598773277","l":[],"ln":[],"t":["财报"],"lk":0,"rt":0,"rp":0,"vw":240},{"id":"2125832796698771746","h":"nytchinese","ts":1795673009,"zh":"这起凶杀案在世界各地引发了震动，死者麦金西是一名跨性别男性，当时正与妻子陷入激烈的离婚诉讼和子女监护权争夺战。\n女方77岁的父母被指控共同实施谋杀。辩方律师援引对麦金西虐待儿童的指控，称这对夫妇选择杀人是出于安全担忧。","en":"这起凶杀案在世界各地引发了震动，死者麦金西是一名跨性别男性，当时正与妻子陷入激烈的离婚诉讼和子女监护权争夺战。\n女方77岁的父母被指控共同实施谋杀。辩方律师援引对麦金西虐待儿童的指控，称这对夫妇选择杀人是出于安全担忧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2125832796698771746","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/usa/20261126/jonathan-mckinsey-shooting-in-laws/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":2,"rt":0,"rp":2,"vw":2404},{"id":"2125832596022337643","h":"cnfinancewatch","ts":1795672961,"zh":"散户热议｜2026-11-26·午间\n数据时点：国内方面，已打开韭研公社“公社广场”最新列表，可见多篇11月26日盘前与午盘帖；午盘涨停简图、盘前长文需登录，未能完整抓取，下文只使用公开可见的标题、时间及页面能直接读到的段落，不编造引语或情绪统计。海外方面，Reddit\nWallStreetBets本期仍未能直接打开；改用Tradestie对WSB讨论的扫描页（页面标注更新于11月26日03:52\nUTC，约北京时间11:52）。情绪标签和小样本统计不代表全市场比例；对留言只做意译概括，不是逐字引语。Stocktwits未能获得带明确今日时点的官方情绪统计。本档截稿约北京时间11月26日13:45。\n国内：主旋律已从“退潮日不要抄第一波”，切到“有主题可做，但指数还不可信”\n盘前仍有谨慎声音。09:08的策略帖把盘面拆成三股力量：量化跟着外盘走，超级资金只托不拉，杠杆和风控机构可能被动减仓，因此不急于出手，更想等连续冰点或恐慌再挑辨识度高的机会。09:04的复盘把周三定性为“开始杀信用”，并写今晨日韩高开后，修复还要看成交能不能跟上。竞价帖则把九阳股份当成龙头，把好当家列为“龙回头”，说明短线资金并没有离开高度股。\n和券商口径相同的地方很清楚：都承认这不是趋势反转，都看到通信网、卫星和PCB是今天的真线索。09:45已有帖把主线提前锚在三部委通信网方案，与已核实的公开文件方向一致。11:08的《昨天砸下去的不是AI》长文正文需登录，但广场可见开头写：早盘现货黄金失守3560美元、白银失守41美元，随后纽约期银突破42美元、伦敦金现重新逼近3600美元，并提到台股早盘一度涨3%。能公开读到的意思是，昨天更像去杠杆和避险资产被砸，不是单一的AI故事。这与金价先砸后拉、台股盘中大涨的公开报道可以互相对照。\n和券商口径不同、也更容易在午后出错的地方，是社区更快把政策翻译成补涨名单。11:33已有人发布“午后补涨机会”，称机器人板块在扩散，午盘6只、封单约17.29亿元、最高5板，并列出当日未涨停、涨幅不到9%的前日龙头。10:16还有帖把金百泽、金牛化工等归到“金字+新春跨年”，这是情绪发散，不是新的基本面。被忽略的风险是：创业板盘中涨超2%后回吐，华东重机开盘跌停，九阳和高位连板仍在吸引接力；美股休市，外盘无法盘中对证，补涨名单可能只是退潮后的高低切换。\n海外：感恩节休市，讨论仍停在昨天的英伟达，整体略偏多、个股偏中性\n本期未能直接打开WSB原帖，只能看二手扫描。Tradestie页面统计24小时分析讨论975条，把“人群情绪”标成62/100，并写约40.5%偏多。同一页里，英伟达以93次提及居首，但看多、中性、看空为28%、41%和31%，标签是中性，提及量只有近七日均值的0.85倍；标普500ETF和纳指100ETF同样被标成中性。戴尔和台积电都是该页“热度相对7日均值”靠前的名字，倍数均为3.18倍，标签偏多；扫描页录得戴尔上日收涨0.60%、台积电收跌1.96%。必须说明：这是扫描页的分类和抽样，不是论坛官方统计。短端国债ETF也出现提及放大，更像假期前对现金替代的讨论，不是新的风险偏好共识。\nStocktwits没有可用的、带今日时点的官方情绪数字，本档不引用无时点的平台标签。和国内相比，海外更少讨论A股连板和通信网主题，更多把分歧留在“英伟达的信用观察意味着什么”“指数ETF是中性还是还能抄”。\n两边合在一起看：国内已经在交易新主题和补涨名单，海外扫描的整体标签仍略偏多，但对英伟达本身仍是中性。相同的是都还没有形成“趋势已经转好”的共识；不同的是国内更容易把政策文件、亚太反弹和涨停简图翻译成午后接力。今天真正要防的，不是指数会不会因休市而少跌一点，而是谁在没有美股对证的日子里，去追已经提示风险的高标和尚未封板的高位硬件股。\n风险提示：以上为公开讨论整理，抓取受限处已注明，二手统计和扫描分类不代表真实民意比例，不构成投资建议。","en":"散户热议｜2026-11-26·午间\n数据时点：国内方面，已打开韭研公社“公社广场”最新列表，可见多篇11月26日盘前与午盘帖；午盘涨停简图、盘前长文需登录，未能完整抓取，下文只使用公开可见的标题、时间及页面能直接读到的段落，不编造引语或情绪统计。海外方面，Reddit\nWallStreetBets本期仍未能直接打开；改用Tradestie对WSB讨论的扫描页（页面标注更新于11月26日03:52\nUTC，约北京时间11:52）。情绪标签和小样本统计不代表全市场比例；对留言只做意译概括，不是逐字引语。Stocktwits未能获得带明确今日时点的官方情绪统计。本档截稿约北京时间11月26日13:45。\n国内：主旋律已从“退潮日不要抄第一波”，切到“有主题可做，但指数还不可信”\n盘前仍有谨慎声音。09:08的策略帖把盘面拆成三股力量：量化跟着外盘走，超级资金只托不拉，杠杆和风控机构可能被动减仓，因此不急于出手，更想等连续冰点或恐慌再挑辨识度高的机会。09:04的复盘把周三定性为“开始杀信用”，并写今晨日韩高开后，修复还要看成交能不能跟上。竞价帖则把九阳股份当成龙头，把好当家列为“龙回头”，说明短线资金并没有离开高度股。\n和券商口径相同的地方很清楚：都承认这不是趋势反转，都看到通信网、卫星和PCB是今天的真线索。09:45已有帖把主线提前锚在三部委通信网方案，与已核实的公开文件方向一致。11:08的《昨天砸下去的不是AI》长文正文需登录，但广场可见开头写：早盘现货黄金失守3560美元、白银失守41美元，随后纽约期银突破42美元、伦敦金现重新逼近3600美元，并提到台股早盘一度涨3%。能公开读到的意思是，昨天更像去杠杆和避险资产被砸，不是单一的AI故事。这与金价先砸后拉、台股盘中大涨的公开报道可以互相对照。\n和券商口径不同、也更容易在午后出错的地方，是社区更快把政策翻译成补涨名单。11:33已有人发布“午后补涨机会”，称机器人板块在扩散，午盘6只、封单约17.29亿元、最高5板，并列出当日未涨停、涨幅不到9%的前日龙头。10:16还有帖把金百泽、金牛化工等归到“金字+新春跨年”，这是情绪发散，不是新的基本面。被忽略的风险是：创业板盘中涨超2%后回吐，华东重机开盘跌停，九阳和高位连板仍在吸引接力；美股休市，外盘无法盘中对证，补涨名单可能只是退潮后的高低切换。\n海外：感恩节休市，讨论仍停在昨天的英伟达，整体略偏多、个股偏中性\n本期未能直接打开WSB原帖，只能看二手扫描。Tradestie页面统计24小时分析讨论975条，把“人群情绪”标成62/100，并写约40.5%偏多。同一页里，英伟达以93次提及居首，但看多、中性、看空为28%、41%和31%，标签是中性，提及量只有近七日均值的0.85倍；标普500ETF和纳指100ETF同样被标成中性。戴尔和台积电都是该页“热度相对7日均值”靠前的名字，倍数均为3.18倍，标签偏多；扫描页录得戴尔上日收涨0.60%、台积电收跌1.96%。必须说明：这是扫描页的分类和抽样，不是论坛官方统计。短端国债ETF也出现提及放大，更像假期前对现金替代的讨论，不是新的风险偏好共识。\nStocktwits没有可用的、带今日时点的官方情绪数字，本档不引用无时点的平台标签。和国内相比，海外更少讨论A股连板和通信网主题，更多把分歧留在“英伟达的信用观察意味着什么”“指数ETF是中性还是还能抄”。\n两边合在一起看：国内已经在交易新主题和补涨名单，海外扫描的整体标签仍略偏多，但对英伟达本身仍是中性。相同的是都还没有形成“趋势已经转好”的共识；不同的是国内更容易把政策文件、亚太反弹和涨停简图翻译成午后接力。今天真正要防的，不是指数会不会因休市而少跌一点，而是谁在没有美股对证的日子里，去追已经提示风险的高标和尚未封板的高位硬件股。\n风险提示：以上为公开讨论整理，抓取受限处已注明，二手统计和扫描分类不代表真实民意比例，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125832596022337643","l":[],"ln":[],"t":["美股","A股港股","AI科技","黄金"],"lk":0,"rt":0,"rp":0,"vw":911},{"id":"2125832484441235657","h":"cnfinancewatch","ts":1795672935,"zh":"热点财经新闻综述｜2026-11-26·午间\n数据时点：A股午间收盘取新华财经、新浪午评；午后盘中取新浪与腾讯行情约13:34。港股、韩国KOSPI、现货黄金与WTI取新浪约13:34。日经225仅引用香港电台10:49的半日收市报道。台湾加权仅引用中央社截至10:52的盘中报道及盘中最高，收盘价未交叉核对，不写成定论。美股现货仍为美东11月25日收盘，美国因感恩节休市。本档截稿约北京时间11月26日13:45。本期新处理两封热点财经邮件：11月26日早间08:10版与午间13:10版（均在收件箱）。标“邮件转述”的未逐条核实。午间邮件把晓程科技映射为300444，公开行情显示该代码为双杰电气，不以该映射为准。\n今日判断\n今天不是趋势反转，是破位后的结构性修复。午间收盘，沪指3475.46点、微跌0.03%，仍在3500点下方，全天最高只到3497.81点；深证成指涨0.15%、报10101.72点；创业板指涨0.06%、报2184.99点，盘中一度涨超2%后回吐；科创50午评称跌0.93%。新华财经统计，沪深半日成交7963亿元，较上日半日放量332亿元；含北交所的午评写8017亿元。新浪午评写下跌个股超2900只，钛媒体等写上涨超2300只，都指向跌多涨少。午后约13:34，沪指翻红报3484.22点、涨0.22%，深证成指涨0.34%，创业板指涨0.21%，科创50仍跌0.35%。\n港股更强：恒指约22397.81点、涨1.97%，恒生科技指数约3474.69点、涨2.85%。已核实韩国央行今日加息25个基点至3.25%；新浪行情约13:34显示KOSPI报4765.64点、涨1.45%，最高4817.77点，韩股午后仍在交易。日经225半日收57886点、涨1.54%。中央社称，台股受301调查拟议税率最高15%且不叠加刺激，10:52报38904.71点、涨1.86%，盘中最高39396.66点。现货黄金早盘见3551.13美元后回升，约13:34报3604.84美元；WTI约84.37美元，高于上日结算83.68美元。美股休市，亚太反弹不能当成外盘已经翻多。\n三大利多方向（由强到弱）\n一、政策给出了新的交易出口，资金从“只杀算力”切到通信网、卫星和AI服务出海。已核实：商务部等八部门《服务贸易发展“十五五”规划》提出，稳妥有序推动云计算、大模型等人工智能相关服务出海；工信部等三部门《新一代通信网建设实施方案》提出，到2030年建成覆盖完善、性能领先的新一代通信网，适时建设6G，低轨卫星互联网基本建成。美国联邦通信委员会有条件批准SpaceX部署最多100万颗卫星用于轨道数据中心，授权期至2040年，要求7年内首星入轨、14年内完成部署。这解释了顺灏股份、西部材料涨停，常山北明、证通电子涨停。对谁有利：卫星互联网、商业航天、6G与算力应用，而不是已经拥挤的光模块主峰。制约：官方说法是“稳妥有序”“适时建设”，不是立刻商用。\n二、PCB短缺是可核对的产业事实，元件是今天最扎实的硬件主线。全球电子协会已发警报：过去一年订单增56.1%、出货只增13.3%，短缺或至少持续到2027年上半年，供给明显改善可能要到2028年年中以后。午评可见金百泽20厘米涨停，崇达技术、骏亚科技等涨停。约13:30，青山纸业涨停，中京电子涨8.70%但未封板，中际旭创涨3.33%。对谁有利：供需真正紧张的板材和元件，不是所有连板标的。制约：中京电子已在高位，未封板说明分歧加大。邮件所称“排单延至2028年”比协会原文更满，本档以已核实口径为准。\n三、黄金和商品接住了避险与通胀定价，港股修复提供情绪对照。伦敦金现货从3551.13美元拉回3604.84美元附近，黄金ETF华安约涨2.06%；油气和煤炭走强，中国海油约涨3.15%，金牛化工3连板。交通银行约涨1.20%，说明防守资金没有消失。制约：金价盘中仍先砸后拉，工行、农行并不齐涨。\n三大利空方向（由强到弱）\n一、指数结构仍弱，不能把翻红写成反转。沪指没有站上3500点，创业板冲高回落，科创50仍弱，宁德时代A股约跌1.70%、H股仅小涨。成长股是弱修复，不是主线回归。美股休市，没有现货对证。制约：半日成交略放量，港股和台股盘中更强，风险偏好并非冻结，但A股指数没有跟上。\n二、高位股的亏钱效应没有结束，今天最容易亏钱的仍是接力。华东重机开盘跌停并封住，跌10.01%；九阳股份约涨8.95%但未封板；好当家涨停，邮件称11天7板；克来机电5连板涨停；冰山冷热涨停。制约：机器人、冰雪和化工仍有封板，短线情绪没有死，但高度已够用风险提示。\n三、宏观约束没有解开。10月PCE同比3.8%、核心同比3.3%，12月加息预期仍高；标普全球将英伟达列入负面信用观察；对14个贸易伙伴的301方案仍在征求意见。韩国今天加息，说明亚洲不是单边宽松。邮件里“纳指100已入熊市”等表述未逐条核实，不以该口径定论。\n小结：今天是政策主题和PCB、黄金、商品的结构性修复，不是3500点失而复得。先辨认有文件、有供需的方向，让高位连板自己消化。真正的外盘定价，要等到周五美股半日交易。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，邮件转述内容未逐条核实，不构成投资建议。","en":"热点财经新闻综述｜2026-11-26·午间\n数据时点：A股午间收盘取新华财经、新浪午评；午后盘中取新浪与腾讯行情约13:34。港股、韩国KOSPI、现货黄金与WTI取新浪约13:34。日经225仅引用香港电台10:49的半日收市报道。台湾加权仅引用中央社截至10:52的盘中报道及盘中最高，收盘价未交叉核对，不写成定论。美股现货仍为美东11月25日收盘，美国因感恩节休市。本档截稿约北京时间11月26日13:45。本期新处理两封热点财经邮件：11月26日早间08:10版与午间13:10版（均在收件箱）。标“邮件转述”的未逐条核实。午间邮件把晓程科技映射为300444，公开行情显示该代码为双杰电气，不以该映射为准。\n今日判断\n今天不是趋势反转，是破位后的结构性修复。午间收盘，沪指3475.46点、微跌0.03%，仍在3500点下方，全天最高只到3497.81点；深证成指涨0.15%、报10101.72点；创业板指涨0.06%、报2184.99点，盘中一度涨超2%后回吐；科创50午评称跌0.93%。新华财经统计，沪深半日成交7963亿元，较上日半日放量332亿元；含北交所的午评写8017亿元。新浪午评写下跌个股超2900只，钛媒体等写上涨超2300只，都指向跌多涨少。午后约13:34，沪指翻红报3484.22点、涨0.22%，深证成指涨0.34%，创业板指涨0.21%，科创50仍跌0.35%。\n港股更强：恒指约22397.81点、涨1.97%，恒生科技指数约3474.69点、涨2.85%。已核实韩国央行今日加息25个基点至3.25%；新浪行情约13:34显示KOSPI报4765.64点、涨1.45%，最高4817.77点，韩股午后仍在交易。日经225半日收57886点、涨1.54%。中央社称，台股受301调查拟议税率最高15%且不叠加刺激，10:52报38904.71点、涨1.86%，盘中最高39396.66点。现货黄金早盘见3551.13美元后回升，约13:34报3604.84美元；WTI约84.37美元，高于上日结算83.68美元。美股休市，亚太反弹不能当成外盘已经翻多。\n三大利多方向（由强到弱）\n一、政策给出了新的交易出口，资金从“只杀算力”切到通信网、卫星和AI服务出海。已核实：商务部等八部门《服务贸易发展“十五五”规划》提出，稳妥有序推动云计算、大模型等人工智能相关服务出海；工信部等三部门《新一代通信网建设实施方案》提出，到2030年建成覆盖完善、性能领先的新一代通信网，适时建设6G，低轨卫星互联网基本建成。美国联邦通信委员会有条件批准SpaceX部署最多100万颗卫星用于轨道数据中心，授权期至2040年，要求7年内首星入轨、14年内完成部署。这解释了顺灏股份、西部材料涨停，常山北明、证通电子涨停。对谁有利：卫星互联网、商业航天、6G与算力应用，而不是已经拥挤的光模块主峰。制约：官方说法是“稳妥有序”“适时建设”，不是立刻商用。\n二、PCB短缺是可核对的产业事实，元件是今天最扎实的硬件主线。全球电子协会已发警报：过去一年订单增56.1%、出货只增13.3%，短缺或至少持续到2027年上半年，供给明显改善可能要到2028年年中以后。午评可见金百泽20厘米涨停，崇达技术、骏亚科技等涨停。约13:30，青 n2. 经济弱复苏+流动性宽松的大逻辑没变： 2026年11月以来，本轮赎回体量（约数千亿级）远小于 2022 年底的 5 万亿级别，且央行在公开市场持续保持净投放呵护跨月资金面。历史上纯债基金即便遭遇阶段性回撤，平均修复周期也就在 2～3 个月左右，只要底层债券按时付息，净值都会靠票息慢慢爬回来。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125831634482282970","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":907},{"id":"2125830691732758977","h":"CrushTheShorts","ts":1795672507,"zh":"经常打德州的朋友都知道，要是一直拿垃圾牌入不了池也不会亏多少，自己真拿到超大牌碰上人家更大的牌，属于 cooler撞牌，遇上了也没办法，毕竟小概率低频。多数情况下我们是拿中等牌力，有点东西但不多，如同我们的爱股，牛市能涨，熊市里就现了原形\n最怕的是总拿着这些不大不小的牌强行硬上，打一个自己控制不住的底池，觉得自己有技术，各种操作讲故事，讲到后面自己都信了，仓位也随着自信 raise进去了\n遇到人家空头暴力raise，本可以轻松弃牌，没多少损失，结果硬是拿着自己都没信心的底牌推人家的钢板，原本空头也没想着能赢那么多，奈何我们自己送出去了满满的value\n大多数人类都是本地小模型，稀疏的注意力，500字上下文，缓慢的token输出，严重的幻觉，但是，对自己的答案又充满了自信","en":"经常打德州的朋友都知道，要是一直拿垃圾牌入不了池也不会亏多少，自己真拿到超大牌碰上人家更大的牌，属于 cooler撞牌，遇上了也没办法，毕竟小概率低频。多数情况下我们是拿中等牌力，有点东西但不多，如同我们的爱股，牛市能涨，熊市里就现了原形\n最怕的是总拿着这些不大不小的牌强行硬上，打一个自己控制不住的底池，觉得自己有技术，各种操作讲故事，讲到后面自己都信了，仓位也随着自信 raise进去了\n遇到人家空头暴力raise，本可以轻松弃牌，没多少损失，结果硬是拿着自己都没信心的底牌推人家的钢板，原本空头也没想着能赢那么多，奈何我们自己送出去了满满的value\n大多数人类都是本地小模型，稀疏的注意力，500字上下文，缓慢的token输出，严重的幻觉，但是，对自己的答案又充满了自信","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2125830691732758977","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":2,"vw":1232},{"id":"2125827884279529636","h":"FROST_JIANG","ts":1795671838,"zh":"如果你在做美股，那么一定要了解“什么是美股的预期差”\n一句话：预期差 = 实际结果 - 市场事前已经算进去的预期。股价动的不是“好还是坏”，而是“比预期好还是坏”。\n因为股价在事件发生前，就已经按预期定价了。事件一公布，市场只比一件事：实际和预期的差是多少，差的方向和幅度够不够改路径。\n拿最近经历过的三个例子说：\n10 月 CPI：负向预期差，但很小\n核心环比实际 +0.3%，预期 +0.2%，差了 -0.1 个百分点，偏热。所以 10Y 跳了约 10bp，12 月加息概率上去了，但没像 9 月 CPI 那样改路径，因为 9 月是四项全超、幅度大，10 月只超了 0.1 个点。\nCoreWeave Q3：正向预期差，但不够大\n营收 $3.66B，预期 $3.54B，超了 $0.12B；EPS -$1.27，符合预期。所以盘后只涨了 1.66%，SOXX/SOXL 基本不动。超了，但没超到能改融资链叙事的程度。\nAMD vs QCOM：同一个“beat”，两种结局\nAMD Q3 营收超预期，Q4 指引约 $17B 也超预期，预期差大，次日 +13.26%。QCOM 财报本身也 beat，但指引偏软，指引预期差是负的，股价就跌。\n所以预期差分三层，越往后越重要：\n数据预期差：CPI、非农，实际 vs 彭博共识\n财报预期差：营收、EPS vs 共识，幅度决定涨跌大小\n指引预期差：下季度营收、capex 指引 vs 共识。财报是过去，指引是未来，股价主要定价未来\n还有一层容易被忽略：共识、耳语、已定价是三个不同的数。\n共识是彭博调查的平均值，公开可见\n耳语是交易员私下真正的预期，常比共识更高。公司连续 beat 几个季度后，耳语会高于共识，beat 共识 2% 也可能跌，因为没 beat 耳语\n已定价是期权隐含波动率告诉你的预期涨跌幅。财报前 implied move 是 ±18%，实际只涨 5%，就算 beat 也可能跌，因为涨幅没达到“已定价的波动”\n这就解释了为什么好消息也会跌：beat 了共识但 miss 了耳语，或者 beat 了当季但指引下调，或者预期差太小改不了路径，或者大家提前都买好了，利好兑现就是卖出信号。\n以后看事件，先问三句：共识是多少？耳语比共识高还是低？期权定价了多大波动？事件后只比一件事：实际减共识，差多少、改不改路径。三行写完，再判断涨跌合不合理。","en":"如果你在做美股，那么一定要了解“什么是美股的预期差”\n一句话：预期差 = 实际结果 - 市场事前已经算进去的预期。股价动的不是“好还是坏”，而是“比预期好还是坏”。\n因为股价在事件发生前，就已经按预期定价了。事件一公布，市场只比一件事：实际和预期的差是多少，差的方向和幅度够不够改路径。\n拿最近经历过的三个例子说：\n10 月 CPI：负向预期差，但很小\n核心环比实际 +0.3%，预期 +0.2%，差了 -0.1 个百分点，偏热。所以 10Y 跳了约 10bp，12 月加息概率上去了，但没像 9 月 CPI 那样改路径，因为 9 月是四项全超、幅度大，10 月只超了 0.1 个点。\nCoreWeave Q3：正向预期差，但不够大\n营收 $3.66B，预期 $3.54B，超了 $0.12B；EPS -$1.27，符合预期。所以盘后只涨了 1.66%，SOXX/SOXL 基本不动。超了，但没超到能改融资链叙事的程度。\nAMD vs QCOM：同一个“beat”，两种结局\nAMD Q3 营收超预期，Q4 指引约 $17B 也超预期，预期差大，次日 +13.26%。QCOM 财报本身也 beat，但指引偏软，指引预期差是负的，股价就跌。\n所以预期差分三层，越往后越重要：\n数据预期差：CPI、非农，实际 vs 彭博共识\n财报预期差：营收、EPS vs 共识，幅度决定涨跌大小\n指引预期差：下季度营收、capex 指引 vs 共识。财报是过去，指引是未来，股价主要定价未来\n还有一层容易被忽略：共识、耳语、已定价是三个不同的数。\n共识是彭博调查的平均值，公开可见\n耳语是交易员私下真正的预期，常比共识更高。公司连续 beat 几个季度后，耳语会高于共识，beat 共识 2% 也可能跌，因为没 beat 耳语\n已定价是期权隐含波动率告诉你的预期涨跌幅。财报前 implied move 是 ±18%，实际只涨 5%，就算 beat 也可能跌，因为涨幅没达到“已定价的波动”\n这就解释了为什么好消息也会跌：beat 了共识但 miss 了耳语，或者 beat 了当季但指引下调，或者预期差太小改不了路径，或者大家提前都买好了，利好兑现就是卖出信号。\n以后看事件，先问三句：共识是多少？耳语比共识高还是低？期权定价了多大波动？事件后只比一件事：实际减共识，差多少、改不改路径。三行写完，再判断涨跌合不合理。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/FROST_JIANG/status/2125827884279529636","l":[],"ln":[],"t":["美联储","通胀","美股","财报"],"lk":1,"rt":1,"rp":0,"vw":76},{"id":"2125825479219499291","h":"bboczeng","ts":1795671264,"zh":"股市在动荡一周后呈现初步企稳迹象\n11月23日，在芯片股和英伟达相关消息的推动下，市场出现大幅反弹，SPY上涨4.7%，QQQ上涨7%；但随后涨幅因关税公告以及高于预期的3.3%核心PCE通胀数据而回落。\n大型科技股表现分化，苹果表现稳健，其余多数跑输基准指数。交易员对后市看法不一：\n一部分人看到了看涨信号，目标价位SPY 740–750、QQQ 660–670；\n另一部分人则警告可能出现更深幅度的下跌，例如2018年QQQ 23%的跌幅，或是参照过往危机时期出现的熊市信号。","en":"股市在动荡一周后呈现初步企稳迹象\n11月23日，在芯片股和英伟达相关消息的推动下，市场出现大幅反弹，SPY上涨4.7%，QQQ上涨7%；但随后涨幅因关税公告以及高于预期的3.3%核心PCE通胀数据而回落。\n大型科技股表现分化，苹果表现稳健，其余多数跑输基准指数。交易员对后市看法不一：\n一部分人看到了看涨信号，目标价位SPY 740–750 ":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYBwPOqaEAAfHRH.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2125823736070992129","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":1,"vw":979},{"id":"2125822230567530704","h":"qinbafrank","ts":1795670490,"zh":"太空数据中心拿到了批文，美国联邦通信委员会（FCC）正式为SpaceX的太空数据中心计划放行，批准其发射100万颗卫星，组建名为“Starmind”的AI算力星座。昨晚FCC主席Brendan Carr称这是美国历史上首次批准在太空部署数据中心星座。\nFCC批准的时间约束，要求“2040年前完成”，根据FCC完整命令，SpaceX必须在以下节点前完成部署，任何一个中间节点未达标，许可即告失效：\n1）2033年11月25日前，发射并运营第一颗Starmind卫星；\n2）2035年11月25日前，完成100万颗中的10%入轨；\n3）2038年11月25日前，完成50%；\n4）2040年11月25日前，完成全部星座部署。\nFCC同时驳回了亚马逊Leo、Viasat和美国天文学会提出的拒绝申请，豁免了SpaceX的履约保证金，并将许可期限设为15年。\n根据申请与FCC命令披露的信息，Starmind星座由约100万颗“轨道算力模块”组成，本质是把AI数据中心拆成海量卫星单元送上轨道：\n用太阳能为主要能源，以光学星间链路（laser inter-satellite links）构建星间骨干网，之前这里\n当然从FCC的批文里也能看出来，太空数据中心现在还是一个提振情绪和估值期权，短期确实能提振市场情绪和预期，但离真正建成投产还有相当长的时间。","en":"太空数据中心拿到了批文，美国联邦通信委员会（FCC）正式为SpaceX的太空数据中心计划放行，批准其发射100万颗卫星，组建名为“Starmind”的AI算力星座。昨晚FCC主席Brendan Carr称这是美国历史上首次批准在太空部署数据中心星座。\nFCC批准的时间约束，要求“2040年前完成”，根据FCC完整命令，SpaceX必须在以下节点前完成部署，任何一个中间节点未达标，许可即告失效：\n1）2033年11月25日前，发射并运营第一颗Starmind卫星；\n2）2035年11月25日前，完成100万颗中的10%入轨；\n3）2038年11月25日前，完成50%；\n4）2040年11月25日前，完成全部星座部署。\nFCC同时驳回了亚马逊Leo、Viasat和美国天文学会提出的拒绝申请，豁免了SpaceX的履约保证金，并将许可期限设为15年。\n根据申请与FCC命令披露的信息，Starmind星座由约100万颗“轨道算力模块”组成，本质是把AI数据中心拆成海量卫星单元送上轨道：\n用太阳能为主要能源，以光学星间链路（laser inter-satellite links）构建星间骨干网，之前这里\n当然从FCC的批文里也能看出来，太空数据中心现在还是一个提振情绪和估值期权，短期确实能提振市场情绪和预期，但离真正建成投产还有相当长的时间。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYBuSl0bkAA7FVL.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2125822230567530704","l":["x.com"],"ln":[{"u":"https://x.com/qinbafrank/status/2071151529974006162?a=HKo3BEbxSadjImy3NhQ&s=46还聊过SpaceX的星间激光网络。FCC另批准其补充射频链路，用于备份和应急遥测、跟踪与指令。Starmind是独立的算力星座，与SpaceX现有的Starlink宽带星座并行运行","d":"x.com"}],"t":["AI科技"],"lk":15,"rt":0,"rp":4,"vw":4011},{"id":"2125821877251928094","h":"bboczeng","ts":1795670406,"zh":"感觉大家现在都在等这个行业最大利空：CSP Capex下调，产能过剩，价格崩盘，并由此确认半导体周期结束\n一旦确认，或许反而可以长期建仓了\n当然我是不鼓励大家买个股 空头可以兑现利润，避免反弹吞掉收益。\n2）原本准备等待破位再追空的资金，可能暂缓行动。\n3）做反弹的资金有了相对清楚的止损参照，敢于开始买入。\n4）一旦价格突破当天此前的反弹高点，部分短线空头可能被迫回补。\n而且美股周四休市周五半天交易，对于已经从下跌中获利的空头，继续持仓意味着承担假期政策消息、公司声明或其他事件带来的跳空风险。\n所以总的来说：\n亚特兰大联储下调GDP增速扭转了市场对于美联储持续鹰派的预期、同时引发美元指数小幅跳水、带动美股扭头向上。股市在前低附近出现承接，随后空头止盈、保护性仓位调整与美元避险需求回落相互强化；\n伯里减掉纳指看跌期权的消息扩大传播，万斯保证老黄没有受到调查，fcc批准了spacex的太空数据中心，这些利好事件都在助力这波反弹。\n那怎么看昨晚美股的走势？\n1）无差别的抛售可能接近尾声，这段时间市场经历了一段不管什么资产一起卖的阶段，昨晚核心PCE偏鹰对市场是利空，但利空砸出的低点被收回，也是空头力量衰竭的信号。\n从这个点上，深V的意义还是蛮大的，\n2）近期市场已经消化了太多的利空事件，如果本周后半周没有大的利空出来，短期内反弹应该是可以持续的。这可以说是最悲观情绪开始稍稍缓解，但离风险偏好已经全面转向乐观还有很大的距离。\n这个距离就是上周这里\n（1）油价、通胀和利率走势\n上周沃勒要加息50个基点鹰派的讲话也把市场吓到到了，虽然昨晚美债利率跌回了沃勒讲话前，市场仍需要议息会议的表态，才能有更清晰的预期；\n（2）AI政策\n相比上周本周老黄回归自然让市场对之后GPU迭代放缓、供应链受损的担忧减少、但市场还要看两党关于AI的斗法预期程度。（不一定真要等到斗法真正发生、而是只要能清晰未来斗法的程度与现在市场预期的偏离程度，市场往往提前反应）\n（3）商业化\n但AI质疑的表外债、生态链内融资问题，仍然没有解。这就要靠AI商业化来给答案。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"是哪些因素引发了昨晚美股V回来？昨晚10月核心 PCE升到 3.3%，高于预期和前值，确定了12月加息，也说明通胀还很顽强，引发了无差别抛售——纳指-4.6%，费半-8%，黄金破3500。但收盘则大幅收窄跌幅：道指上涨约0.31%，完成近年来少见的千点逆转；标普500-0.23%；纳指-0.68%。在盘中费城半导体创下了新低，但是纳指并没创新低。聊聊有哪些因素触发了昨晚的反弹。\n1、跟很多人讨论的并不一样，个人角度昨晚亚特兰大联储将四季度GDP增长估算从3.2%下调至2.9%是反弹的催化剂。财经日历将GDPNow下调时间04:45 PM GMT正好是美东时间 11:45 AM，这个时间点恰恰是费城半导体盘中的最低点。\n如果把亚特兰大联储GDP增速估算放到一起看（配图1），能明显看出增速在走弱的、这也扭转了市场对于联储未来持续加息的担忧（至少持续鹰派的基础在动摇）\n此数据公布时点与股票加速回升接近，从这个角度看才是昨晚美股止跌回升的第一驱动力。正好核心pce走高引发加息以及未来更强鹰派的预期导致抛售，然后GDP放缓又打消了持续鹰派的担忧。\n为什么亚特兰大GDP增速下调很关键，因为它也引发了美元指数的盘中小幅跳水、美元走弱对风险资产压制也会减少。\n2、在这大空头昨天的Substack文章中表示，他卖掉了纳斯达克100看跌期权头寸的最后一半，整体组合较此前更偏多，暂时几乎全部持有多头方向的头寸。虽然昨天白天burry就发了这篇文章，彭博对此的报道则是在凌晨1点。权威媒体的报道引发的广泛传播，可能比原始发帖时间更影响短线行情。\n3、然后凌晨万斯再次表态并保证老黄没有受到任何调查。\n再就是美国联邦通信委员会（FCC）正式为SpaceX的太空数据中心计划放行，批准其发射100万颗卫星，组建名为“Starmind”的AI算力星座。\n这些都带动了市场情绪的进一步反弹。\n当然还有资金的因素也很关键，昨晚QQQ最低约607.76美元，上周五低点为606.23美元，两者只差约0.25%。它在开盘急跌后，晚上午再次靠近这一带，最终没有跌破。经历连续下跌后，很多短线交易者都会盯住前一次恐慌低点。如果价格再次靠近那里，卖盘却无法把指数压出新低，交易者面临的选择就会发生变化：\n1）已有空头可以兑现利润，避免反弹吞掉收益。\n2）原本准备等待破位再追空的资金，可能暂缓行动。\n3）做反弹的资金有了相对清楚的止损参照，敢于开始买入。\n4）一旦价格突破当天此前的反弹高点，部分短线空头可能被迫回补。\n而且美股周四休市周五半天交易，对于已经从下跌中获利的空头，继续持仓意味着承担假期政策消息、公司声明或其他事件带来的跳空风险。\n所以总的来说：\n亚特兰大联储下调G 雇主Denny’s餐厅火速摘下纪念英伟达诞生的卡座铭牌，随后将其重新挂了回去，并强调黄仁勋始终是他们引以为豪的昔日员工。资本圈最擅长的就是拜高踩低：股价上涨时，创始人的每一句废话都被奉为商业智慧；股价下跌，过去几十年的成就都可以被全盘否定。资本市场每天都在给企业定价，随着中期选举结束，美国政商关系或将迎来新一轮调整，与特朗普关系密切的科技富豪们是否会面临更大的政治压力？","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2125764537827672064/vid/avc1/1320x644/MA-6CXpG4uK19g3H.mp4?tag=29"],"u":"https://x.com/SupFin/status/2125764561584144705","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":275},{"id":"2125764148365791700","h":"fxtrader","ts":1795656642,"zh":"大空头原型Michael Burry在最新的文章中表示自己转多，主动平掉了最后一部分纳斯达克100指数看跌期权，开始将投资重心转向低估值股票。持有英伟达看涨期权，计划200美元附近重新做空。\n文章透露，投资组合目前的多头敞口高于空头敞口，而且这种情况已经有一段时间没有出现过。除了Palantir $PLTR 和MetLife $MET 的看跌期权，目前几乎全部处于多头状态，但强调这是暂时的。\nBurry自称，仍持有上周五买入的英伟达看涨期权，目前价值已经翻倍。“这些期权的行权价远高于当前股价，我当时只花了几美元就买入了。它们的价值已经翻倍，但我还没有决定下一步该怎么操作。” 不过Burry称自己对英伟达的中期判断未变，“我的计划是，等市场情绪乐观时，在英伟达股价接近每股200美元时再次做空。但现在还不是时候。”\n目前Burry约有25%的投资组合是现金，主要来自此前获利的看跌期权，正在寻找新的投资机会，但并不打算为了提高资金使用率而勉强买入。","en":"大空头原型Michael Burry在最新的文章中表示自己转多，主动平掉了最后一部分纳斯达克100指数看跌期权，开始将投资重心转向低估值股票。持有英伟达看涨期权，计划200美元附近重新做空。\n文章透露，投资组合目前的多头敞口高于空头敞口，而且这种情况已经有一段时间没有出现过。除了Palantir $PLTR 和MetLife $MET 的看跌期权，目前几乎全部处于多头状态，但强调这是暂时的。\nBurry自称，仍持有上周五买入的英伟达看涨期权，目前价值已经翻倍。“这些期权的行权价远高于当前股价，我当时只花了几美元就买入了。它们的价值已经翻倍，但我还没有决定下一步该怎么操作。” 不过Burry称自己对英伟达的中期判断未变，“我的计划是，等市场情绪乐观时，在英伟达股价接近每股200美元时再次做空。但现在还不是时候。”\n目前Burry约有25%的投资组合是现金，主要来自此前获利的看跌期权，正在寻找新的投资机会，但并不打算为了提高资金使用率而勉强买入。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HYA4706bUAACzPC.jpg?name=orig","https://pbs.twimg.com/media/HYA6VcGacAAPGYC.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2125764148365791700","l":[],"ln":[],"t":["美股","AI科技"],"lk":2,"rt":0,"rp":2,"vw":3236},{"id":"2125763299849666718","h":"nytchinese","ts":1795656440,"zh":"中美企业都需要解决训练AI模型的成本飙升问题，但与竞争对手相比，中国企业面临的是一个更为严峻的融资环境。几大科技巨头正苦苦应对负现金流问题，投资者对人工智能的热情也已降温。","en":"中美企业都需要解决训练AI模型的成本飙升问题，但与竞争对手相比，中国企业面临的是一个更为严峻的融资环境。几大科技巨头正苦苦应对负现金流问题，投资者对人工智能的热情也已降温。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2125763299849666718"," 数据缺失。热榜还是连板和局部题材，CPO热度继续回落，不把它当成今日主方向。\n#资金面\n两小时补到一项昨日收盘后公布的数据：截至11月25日，两市融资余额合计21142.85亿元，较上日减少207.42亿元，其中沪市减少105.19亿元、深市减少102.23亿元。这是杀跌后的杠杆回撤，不是有新杠杆进来抄底。板块主力资金和北向完整净流入仍然数据缺失。周三成交约1.38万亿元、缩量普跌的结构没有新的盘前修正。","en":"A股盘前第二版·上 2026年11月26日 周四\n#结论 第一版的判断仍然成立：成长股先看成色、不抄第一波；银行、红利低波和必选消费只做回撤承接，位置偏高不追。两小时里真正新的是亚洲反弹，不是隔夜美股已经翻多。本档所见，日经225约58038.86点、涨1.80%，最高58180.86点；韩国综指约4794.42点、涨2.06%，盘中最高4817.77点。报道称铠侠早盘一度大涨约10%，SK海力士、三星电子跟涨。富时A50期指约12546.9点，较前值12455点涨约0.74%，比第一版所见的12523点又抬了一截。美股期指早间转强，标普500期货约7232.9点、较前值7195.8点涨约0.52%，纳指期货约26217点、较前值26100点涨约0.45%。集合竞价尚未开始，竞价数据暂不可用。开盘如果成长股高开，先当成亚洲超跌反弹的溢价，不把它写成趋势反转。\n#消息面\n两小时更新主要在外部。昨日韩国综指大跌近5%并触发sidecar之后，今天高开走高；韩国央行同时把基准利率上调25个基点至3.25%，符合预期，不是意外的紧缩冲击。美国周四感恩节休市、周五早收，亚洲这笔反弹今天得不到美股现货确认。另有报道称美国联邦通信委员会批准SpaceX在太空部署数据中心星座，以及摩根大通预计AI企业明年发债约4500亿美元、后年资本开支或迎平台期，这些是中期叙事，不改今天的短线排序。国内两小时内没有新的实质性政策变量，回购增持贷款和11月30日融资保证金比例下调仍按第一版的中期口径看。\n#研报面\n两小时更新里，今日可见新增两份买入报告：华安给 #鼎龙股份 $300054 买入，称半导体材料高速成长；东吴给 #广合科技 $001389\n买入，聚焦服务器PCB和高端产能释放。方向仍落在材料和PCB，短线位置并不支持把它们抬成今日主线。第一版提到的华安给 #华润三九、中邮给\n#中芯国际、太平洋给 #宁德时代 等报告仍在，排序不变。\n#热榜\n两小时更新。同花顺热榜前六仍是 #九阳股份 $002242、 #中京电子 $002579、 #青山纸业 $600103、 #冰山冷热\n$000530、 #好当家 $600467、 #华东重机 $002685，顺序只是微调。 #华胜天成 $600410、 #金牛化工\n$600722 升到前八。 #中际旭创 $300308 落到第24， #天孚通信\n已不在前25。东财人气榜本档数据缺失。热榜还是连板和局部题材，CPO热度继续回落，不把它当成今日主方向。\n#资金面\n两小时补到一项昨日收盘后公布的数据：截至11月25日，两市融资余额合计21142.85亿元，较上日减少207.42亿元，其中沪市减少105.19亿元、深市减少102.23亿元。这是杀跌后的杠杆回撤，不是有新杠杆进来抄底。板块主力资金和北向完整净流入仍然数据缺失。周三成交约1.38万亿元、缩量普跌的结构没有新的盘前修正。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125759741959999769","l":[],"ln":[],"t":["美股","A股港股","AI科技"],"lk":0,"rt":0,"rp":0,"vw":740},{"id":"2125757699950309587","h":"SupFin","ts":1795655104,"zh":"恐慌是穷人的绞肉机，却是富人的折价超市。纽约金融中心上空这几天飘着一股烤焦的味道。AI概念股盘中集体崩盘大跳水，纳指一度暴跌超4%，英伟达、谷歌全线重挫。但看懂资本博弈，散户永远在为短期数据和情绪买单。10月PCE通胀超预期加上新关税一出，宏观利空不过是华尔街大资金顺势砸盘、清理高杠杆筹码的完美借口。\n记住这个核心投资逻辑:资本开支周期从不是一条直线。当市场开始恐慌基础设施回报率、高喊AI泡沫破裂时，恰恰是情绪溢价出清的最好窗口。赢家从不盯着水面的涟漪，而是去抓那些在恐慌中被误杀的和核心垄断资产。每一次暴跌，都是在给优质资产分发筹码。","en":"恐慌是穷人的绞肉机，却是富人的折价超市。纽约金融中心上空这几天飘着一股烤焦的味道。A 人机械方向、凡拓数创（sz301313）、宁波东力（sz002164）。影响分析：对A股机器人方向偏多，强度中，属持续逻辑。\n（三）事件：财联社11月26日23:04报道，SpaceX被曝下调Blackwell芯片租金最高约35%，并低价转租Anthropic退还的H200芯片。涉及标的：AI算力软件方向、寒武纪（sh688256）、海光信息（sh688041）。影响分析：对A股算力租赁与国产算力偏空，强度中，属当日情绪影响。\n（四）事件：财联社11月26日23:45报道，科创债快速扩容，年内发行规模达1.7万亿元。涉及标的：科创50、科创板。影响分析：对科创板流动性偏多，强度弱，属持续逻辑。\n（五）事件：财联社11月26日23:31报道，A股限售股解禁一览，周四8家公司合计解禁市值5.88亿元。涉及标的：金沃股份、有研硅、一诺威。影响分析：对相关个股偏空，强度弱，属当日情绪影响。\n（六）事件：Yahoo/CNBC 11月25日报道，美股三大指数收盘分化，标普与纳指收低，道指反弹，资金轮出AI。涉及标的：^GSPC -0.25%、^IXIC -0.62%、^DJI +0.33%、NVDA -3.91%。影响分析：对A股AI算力方向偏空，强度中，属当日情绪影响。\n（七）事件：Yahoo/CNBC 11月25日报道，美联储偏好的通胀指标10月加速至3.8%，抬升2027年加息预期。涉及标的：美债利率、贵金属、成长股。影响分析：对A股成长风格偏空、对红利防御偏多，强度中，属持续逻辑。\n（八）事件：Seeking Alpha 11月25日报道，五角大楼曾考虑动用战时法律 reinstating 英伟达黄仁勋，WaPo报道。涉及标的：NVDA、AI算力链。影响分析：对A股国产算力替代偏多，强度弱，属当日情绪影响。\n（九）事件：Seeking Alpha 11月25日报道，Vertex因FDA延长povetacicept对IgA肾病审查而下跌。涉及标的：创新药基因方向、CXO。影响分析：对A股创新药情绪偏空，强度弱，属当日情绪影响。\n（十）事件：Yahoo/CNBC 11月25日报道，SpaceX获FCC批准部署100万颗轨道数据中心卫星。涉及标的：商业航天、卫星互联网。影响分析：对A股卫星方向偏多，强度弱，属持续逻辑。","en":"【A股盘前】 2026年11月26日\n数据窗口：11月23日~11月25日（近3个交易日）\n一、今日结论\n（一）环境分32分，属只观察档，不给竞价买点，只列观察名单。\n（二）方向一：创新药基因。美股映射确认，IHI 20日+5.82%、昨+0.59%；韩日无直接对应，记为待确认；研报互证为月内单一支撑。观察标的：以岭药业（sz002603）为龙一，5日-1.30%但今日+4.41%量比2.45；华北制药（sh600812）为第二只，热度条件为量比2.47且换手4.00%，市值74亿属小盘。\n（三）方向二：机器人机械。美股映射不直接对应，韩日精密制造均+0.44%偏弱，记为弱确认；研报互证为月内单一支撑。观察标的：凡拓数创（sz301313）为龙一，5日+51.08%；宁波东力（sz002164）为第二只，热度条件为今日+9.98%量比1.12换手7.80%，市值116亿属中盘。\n（四）方向三：消费。美股映射确认，XLP 20日+6.29%、昨+0.46%；韩日无对应，待确认；研报互证为月内强支撑。观察标的：贵州茅台（sh600519）为龙一，5日+2.23%，但市值18437亿属超大盘，仅作方向锚；安井食品（sh603345）为第二只，热度条件为今日+2.08%量比1.32，市值313亿属大盘，市值门槛不满足，仅作观察。\n（五）三个方向均因环境分低于40分，只给观察不给买点，具体条件见第十节。\n二、今日中美股市重要新闻事件\n（一）事件：财联社11月26日23:28报道，高端PCB排单延至2028年，算力赛道带动产业链扩产。涉及标的：沪电股份（sz002463）、胜宏科技（sz300476）、PCB板块。影响分析：对A股PCB方向偏多，强度中，属持续逻辑。\n（二）事件：财联社11月26日23:25报道，机构11月以来调研近1800家上市公司，后市看好物理AI等方向。涉及标的：机器人机械方向、凡拓数创（sz301313）、宁波东力（sz002164）。影响分析：对A股机器人方向偏多，强度中，属持续逻辑。\n（三）事件：财联社11月26日23:04报道，SpaceX被曝下调Blackwell芯片租金最高约35%，并低价转租Anthropic退还的H200芯片。涉及标的：AI算力软件方向、寒武纪（sh688256）、海光信息（sh688041）。影响分析：对A股算力租赁与国产算力 盘收12689点、涨0.56%，恒指期货夜盘收22141.24点、涨1.00%。今天没有美股现货定价，夜盘反弹只能当情绪修复。\n三大利多方向（由强到弱） 一、杀跌之后出现的是防御性承接，不是流动性枯竭。银行股探底回升，建设银行、交通银行等涨超1%；食品饮料逆势上涨。21世纪经济报道称，沪深300ETF华夏全天成交125.8亿元、较上日增超1.8倍，部分宽基ETF尾盘放量。对谁有利：回撤后的银行、红利低波和必选消费，只适合防守。制约：成交已缩到1.38万亿元，指数收在阶段低位。邮件所称成交增超4倍未核实，不以该口径定论。\n二、美国数据是“增长更强、消费偏弱、通胀仍粘”，卖压集中在AI，不是全面衰退交易。三季度实际GDP年化由初值3.4%上修至4.3%；10月PCE同比3.8%、核心同比3.3%，环比均为0.3%，同比由9月的3.7%再升；实际消费持平。道指收复失地，说明资金在做高低切换。对A股意味着：今天低开幅度未必等于收盘恐慌，银行和消费仍可能接住。制约：CME美联储观察显示12月加息25个基点概率为97.8%。\n三、商品给出了和科技股不一样的信号，只适合对照，不适合追高。金银盘中击穿关键位后收涨，油价继续走强。戴尔此前披露的AI服务器订单仍在，但改变不了英伟达和半导体继续调整的事实。\n三大利空方向（由强到弱） 一、AI交易的核心矛盾没有解开，信用层已经加入定价。创业板收在最低，宁德时代A+H双杀，中际旭创天量却收跌，拥挤的成长股仍在出清。英伟达被列入负面信用观察。《学习时报》提出算力供给要避免“一哄而上”，给国产算力扩张加上了约束。对谁影响：光模块、存储、算力租赁和已连板的高标。制约：订单和夜盘期货提示需求还在，但定价权仍在拥挤度和融资成本上。\n二、关税已从传闻变成可核对的方案，但还不是即刻落地的税率。美国贸易代表办公室公布对14个贸易伙伴的301调查，建议对中国加征20%关税，对欧盟、台湾、日本、韩国和瑞士为15%；书面意见截至1月5日，1月25日公开听证，最早也要到1月下旬。外交部回应：关税战不符合任何一方利益，反对借口“产能过剩”进行政治操弄。对出口链和风险偏好是压制，但不能写成税率已经执行。\n三、连板梯队和亏钱效应，是今天最容易亏钱的地方。九阳股份再封涨停，7个交易日5个涨停、本周三日均涨停；公司第二次提示市盈率显著高于行业、前三季度净利润同比降41.75%。公开复盘显示中京电子尾盘才封上5板，文投控股已核实收跌9.87%。今天不要接力已经走完的高标。\n小结：昨天是缩量破位、成长出清、防御接住；隔夜是道指修复、科技未稳、关税方案出台、金银V反。美股休市，不要把夜盘反弹翻译成低开就抄成长。先看银行和消费能否守住，让拥挤的连板和算力自己消化。真正的定价，要等到周五美股半日交易。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，邮件转述内容未逐条核实，不构成投资建议。","en":"热点财经新闻综述｜2026-11-26·早间\n数据时点：A股、港股、日经225、韩国KOSPI与台湾加权为11月25日收盘；美股为美东11月25日常规交易收盘；现货金银取华尔街见闻纽约尾盘报道；原油取新华社结算价报道；股指期货取每日经济新闻、新浪的连续夜盘收盘报道。本档截稿约北京时间11月26日07:50，亚太尚未开盘，美国因感恩节休市。本期新处理一封热点财经邮件：11月25日晚间20:10版（收件箱）；早间版截稿时未到。标“邮件转述”的未逐条核实。该邮件写于美股开盘前，已收盘数字以公开报道为准。\n今日判断 周三A股是缩量破位，不是洗盘。上证收3476.47点、跌2.03%，失守3500点；深证成指跌3.24%、收10086.36点；创业板指跌4.19%、收2183.58点，并收在当日最低；科创50跌5.12%。邮件写创业板跌4.45%，与收盘不符。Wind统计，585家上涨、4925家下跌；涨幅超9%的64只，跌幅超9%的284只。沪深成交13831亿元，较周二缩量2720亿元。算力和半导体领跌，消费和银行相对抗跌。中际旭创成交170.63亿元仍居首，但收跌1.92%。恒生指数收21966.01点、跌1.14%，恒生科技指数跌2.56%、收3378.26点。已核实宁德时代H股收295.6港元、跌12.23%；A股公开报道收跌8.33%，市值跌破万亿元。\n亚太把周二反弹还了回去：日经225收57011.62点、跌2.78%；KOSPI收4697.51点、跌6.16%；台湾加权收38195.43点、跌4.80%。隔夜美股是“道指修好、科技未稳”。已核实：道指涨0.33%、收50182.95点，盘中曾跌逾1100点后翻红；标普500跌0.25%、收7182.78点；纳指跌0.62%、收23585.80点；费城半导体只 京时间11月26日07:50。\n国内：主旋律已经从“要不要抄第一波”，切到“这是退潮日，不是洗盘” 公开可见的标题和开头几乎都在写同一件事：周三是集体低开、午后加速、缩量普跌，沪指失守3500点，创业板收在最低。23:10的复盘把当天定性为“缩量破位普跌日，不是洗盘”，并强调涨少跌多、跌幅超过9%的股票明显更多。23:38的复盘用中京电子做对比：前一日集合竞价一字、封单很大，25日直到尾盘才封上5板、换手很高，“高标的质量比高度更诚实”。23:34的复盘写，创业板早盘低开高走约40分钟后熄火，午后跌破前低，尾盘护盘作用有限；早盘还能涨的，多是医药、消费、农业，不是算力。\n和券商口径相同的地方很清楚：都承认这是成长出清而不是趋势反转，都看到银行和消费在接，都提醒不要接力已经走完的高标。26日07:34的盘前帖把问题提到“输入型风险”：外围反弹时A股不跟、外围下跌时A股创新低，认为指数企稳仍要看外盘。22:38的核心复盘把《学习时报》避免算力“一哄而上”、美股感恩节休市列为当晚新闻，并提醒机器人方向因高标跌停而分歧加大。\n和券商口径不同、也更容易在今天出错的地方，是仍有人把“尾盘银行拉升、夜盘期货转涨”理解成可以立刻回流国产算力，或把九阳、中京的连板当成跨年行情的接力起点。九阳股份已公告第二次风险提示，估值和业绩都对不上连板节奏。社区还把部分国产算力杀跌与监管、个股监控联系起来，具体传闻本档未核实，只记录情绪：国产算力被当成“主杀方向”，高标进入监管视野后，亏钱效应会先向梯队传导。被忽略的风险是：今天美股休市，外盘无法盘中对证，低开修复也可能只是空虚反弹。\n海外：讨论仍被英伟达吸走，但方向已经变成中性，戴尔成了热度脉冲 本期未能直接打开WSB原帖，只能看二手扫描。Tradestie页面统计24小时分析讨论1065条，把“人群情绪”标成63/100，并写约51.6%偏多；同一页里，英伟达以87次提及居首，但看多、中性、看空为28%、40%和32%，标签是中性，提及量只有近七日均值的0.73倍，热度在降、方向并不统一。戴尔是该页的“热度骤升”第一名，提及量为近七日均值的7倍，标签偏多，扫描页录得其收涨0.60%——这更像财报后的讨论脉冲，不是新的主线共识。必须说明：这是扫描页的分类和抽样，不是论坛官方统计。\nStocktwits没有可用的官方情绪数字。平台稿件在周三开盘前转述分析称，11月抄底英伟达的资金平均仍在“刚刚打平或尚未打平”，并把本轮反弹区分为“收回亏损”而不是“重新赚钱”。和国内相比，海外更少讨论A股连板，更多把分歧放在“一个人回来能不能托住估值”“信用评级观察意味着什么”“财报好的硬件股能不能单独走强”。\n两边合在一起看：国内已经在用“退潮日”给今天降预期，海外扫描的整体标签仍略偏多，但对英伟达本身已经回到中性。相同的是都看到反弹只维持了很短时间；不同的是国内更容易把夜盘期货、银行尾盘和连板梯队翻译成回流，海外则把信用风险和“回本不是赢钱”留在视野里。今天真正要防的，不是指数会不会因休市而少跌一点，而是谁在没有外盘对证的日子里，去接力已经提示风险的高标和仍在出清的算力链。\n风险提示：以上为公开讨论整理，抓取受限处已注明，二手统计和扫描分类不代表真实民意比例，不构成投资建议。","en":"散户热议｜2026-11-26·早间\n数据时点：国内方面，已打开韭研公社“公社广场”最新列表，可见多篇11月25日复盘与11月26日盘前帖；部分长文需登录，未能完整抓取，下文只使用公开可见的标题、时间及页面能直接读到的段落，不编造引语或情绪统计。海外方面，Reddit WallStreetBets本期仍未能直接打开；改用Tradestie对WSB讨论的扫描页（页面标注更新于11月25日19:58 UTC，约北京时间26日03:58）。情绪标签和小样本统计不代表全市场比例；对留言只做意译概括，不是逐字引语。Stocktwits未能获得带明确时点的官方情绪统计，只引用平台可见稿件。本档截稿约北京时间11月26日07:50。\n国内：主旋律已经从“要不要抄第一波”，切到“这是退潮日，不是洗盘” 公开可见的标题和开头几乎都在写同一件事：周三是集体低开、午后加速、缩量普跌，沪指失守3500点，创业板收在最低。23:10的复盘把当天定性为“缩量破位普跌日，不是洗盘”，并强调涨少跌多、跌幅超过9%的股票明显更多。23:38的复盘用中京电子做对比：前一日集合竞价一字、封单很大，25日直到尾盘才封上5板、换手很高，“高标的质量比高度更诚实”。23:34的复盘写，创业板早盘低开高走约40分钟后熄火，午后跌破前低，尾盘护盘作用有限；早盘还能涨的，多是医药、消费、农业，不是算力。\n和券商口径相同的地方很清楚：都承认这是成长出清而不是趋势反转， 5624356,"zh":"我之前认为川普应该宣布特赦黄仁勋。现在这条果然已经被川普放到了台面上：\n《纽约邮报》24日报道，美国总统特朗普接受采访时透露，英伟达公司首席执行官黄仁勋下周出席国会听证会后，如果有必要，他愿意对黄仁勋予以赦免。不过，特朗普认为，赦免始终是一个选项，但没有必要。\n特朗普表示，黄仁勋在国会作证时，无需援引美国宪法第五修正案赋予的权利来避免自证其罪。","en":"我之前认为川普应该宣布特赦黄仁勋。现在这条果然已经被川普放到了台面上：\n《纽约邮报》24日报道，美国总统特朗普接受采访时透露，英伟达公司首席执行官黄仁勋下周出席国会听证会后，如果有必要，他愿意对黄仁勋予以赦免。不过，特朗普认为，赦免始终是一个选项，但没有必要。\n特朗普表示，黄仁勋在国会作证时，无需援引美国宪法第五修正案赋予的权利来避免自证其罪。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125628731335262609","l":[],"ln":[],"t":["AI科技"],"lk":6,"rt":0,"rp":1,"vw":3328},{"id":"2125628132476731885","h":"cnfinancewatch","ts":1795624213,"zh":"从整体工业来看，截至9月底，中国规模以上工业企业应收账款总额已接近30万亿元。崔东树指出，中下游行业的应收账款平均回收期持续延长，反映制造业资金周转面临较大压力。","en":"从整体工业来看，截至9月底，中国规模以上工业企业应收账款总额已接近30万亿元。崔东树指出，中下游行业的应收账款平均回收期持续延长，反映制造业资金周转面临较大压力。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125628132476731885","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":0,"vw":4068},{"id":"2125625117170614691","h":"cnfinancewatch","ts":1795623494,"zh":"中国经济要破局：\n一稳住房地产；\n二稳住股市。\n社会预期一是房产增值提高信心，二是股市赚钱效应提高信心；现在房产难升，股市上涨是必选项。\n美国经济为什么能好？就是股市涨啊！","en":"中国经济要破局：\n一稳住房地产；\n二稳住股市。\n社会预期一是房产增值提高信心，二是股市赚钱效应提高信心；现在房产难升，股市上涨是必选项。\n美国经济为什么能好？就是股市涨啊！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125625117170614691","l":[],"ln":[],"t":[],"lk":13,"rt":0,"rp":6,"vw":4789},{"id":"2125624420421243333","h":"TheMarketMemo","ts":1795623328,"zh":"https://themarketmemo.com/posts/ji-gou-zi-jiu-yi-176166093","en":"","zh_src":"bing","lang":"","m":[],"u":"https://x.com/TheMarketMemo/status/2125624420421243333","l":["themarketmemo.com"],"ln":[{"u":"https://themarketmemo.com/posts/ji-gou-zi-jiu-yi-176166093","d":"themarketmemo.com"}],"t":[],"lk":6,"rt":0,"rp":0,"vw":4238},{"id":"2125621928576844157","h":"TheMarketMemo","ts":1795622734,"zh":"11月23日的筆記，截取一部分給大家看看。重要的是觀察方法，而不是結論。","en":"11月23日的筆記，截取一部分給大家看看。重要的是觀察方法，而不是結論。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX-5q45a8AAasLu.jpg?name=orig"],"u":"https:// com/octopusycc/status/2125610721891479605","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":2,"vw":1834},{"id":"2125610305879511452","h":"octopusycc","ts":1795619963,"zh":"aapl今天非常不妙，资金在从传统防御股里抽出\n基本上只等待一个催化剂了。","en":"aapl今天非常不妙，资金在从传统防御股里抽出\n基本上只等待一个催化剂了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2125610305879511452","l":[],"ln":[],"t":[],"lk":16,"rt":0,"rp":3,"vw":2938},{"id":"2125609619380678993","h":"darrencao2024","ts":1795619799,"zh":"今天市场再次抛售，vix再次突破30，vxn更是突破了40\n很多人担心AI泡沫会重演2000年的互联网崩盘，但看看现在科技巨头的估值，情况可能并没有那么悲观。2000年互联网泡沫顶峰时期，思科的市盈率曾超过100倍，微软也曾达到50至70倍。相比之下，目前科技巨头比如英伟达的Forward P/E仅16倍，Google和Meta约20倍，微软约25倍，亚马逊约26倍。\n更重要的是，今天的科技巨头与2000年的互联网公司有着本质区别。当年很多公司的估值主要依赖市场对未来增长的想象，而今天的科技巨头已经拥有成熟的商业模式、庞大的利润和强劲的现金流。AI不仅仅是一个概念，也正在推动云计算、芯片和数字广告等业务的发展。\n所以，我并不认为当前美股市场， 尤其是科技板块，存在任何泡沫。这轮下跌杀的是估值，而不是EPS。 当前部分科技巨头的估值已经到了历史低位，与2000年的极端泡沫更是存在明显差距。当然，估值合理不代表股价不会调整，但只要未来盈利能够持续增长，投资者就没有必要因为泡沫论而盲目恐慌。","en":"今天市场再次抛售，vix再次突破30，vxn更是突破了40\n很多人担心AI泡沫会重演2000年的互联网崩盘，但看看现在科技巨头的估值，情况可能并没有那么悲观。2000年互联网泡沫顶峰时期，思科的市盈率曾超过100倍，微软也曾达到50至70倍。相比之下，目前科技巨头比如英伟达的Forward P/E仅16倍，Google和Meta约20倍，微软约25倍，亚马逊约26倍。\n更重要的是，今天的科技巨头与2000年的互联网公司有着本质区别。当年很多公司的估值主要依赖市场对未来增长的想象，而今天的科技巨头已经拥有成熟的商业模式、庞大的利润和强劲的现金流。AI不仅仅是一个概念，也正在推动云计算、芯片和数字广告等业务的发展。\n所以，我并不认为当前美股市场， 尤其是科技板块，存在任何泡沫。这轮下跌杀的是估值，而不是EPS。 当前部分科技巨头的估值已经到了历史低位，与2000年的极端泡沫更是存在明显差距。当然，估值合理不代表股价不会调整，但只要未来盈利能够持续增长，投资者就没有必要因为泡沫论而盲目恐慌。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2125609619380678993","l":[],"ln":[],"t":["美股","AI科技"],"lk":19,"rt":0,"rp":2,"vw":1724},{"id":"2125609593334366348","h":"Balder13946731","ts":1795619793,"zh":"这种反包最可怕了🫪","en":"这种反包最可怕了🫪","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2125609593334366348","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":2,"vw":1988},{"id":"2125609314685702542","h":"Balder13946731","ts":1795619727,"zh":"新解放日会来吗？特朗普重新宣布对各国加征新的关税。","en":"新解放日会来吗？特朗普重新宣布对各国加征新的关税。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder1394673 续加息完全没有必要，现在最的风险就是美联储的愚蠢的政策风险，市场实际上资金面很紧，企业信贷层面已经“实质上帮着美联储完成好几次加息了”。\n如果继续美联储看不到真正的连续加息风险，对于美国消费的打压才是最大收缩风险，不是通胀而是要通缩了。看看国债利率和高收益债券利差。\n结合特朗普在中选之后不再有动力拉升股市，加上节前加入交易稀薄，媒体小作文的通胀标题必然会带来机构和量化自动杀跌，以及下周英伟达NVDA老黄国会听证会事件。\n交易走势和颗粒度更细的投资策略和应对，见订阅者专享","en":"股市大跌一个是特朗普加关税不再“呵护市场”，最新通胀指标媒体头条也都是错的，叠加节前交易稀薄，任何消息层面叠加完美风暴\n是不是复制28年版本死给你看，如何解读和投资策略应对\n加息预期大增，因为最新美联储最爱通胀指标数据PCE个人消费物价指数发布\n各大媒体头条精准复制我在周报策略中提到的剧本，都是“同比核心PCE新高/超预期/连续加息”\n这都是错的，但是感恩节交易流动弱，如何真正解读这种认知差和投资策略？\n看看这个数据公布我已精准预测。不要看同比，因为去年10月份数据扭曲，同比没意义。看环比0.3，符合预期。而且市场担心的油价二次传导没有出现。真正的粘性的，推高 10 月名义消费和核心物价的依然是内生服务与刚需\n但是最大认知差在于，你看这个核心消费虽然老百姓收入不差，但是个人消费实际支出已经实质性收缩，减少消费变储蓄\n也就是说美联储12月加息预防性25bp可以，但是1月份连续加息完全没有必要，现在最的风险就是美联储的愚蠢的政策风险，市场实际上资金面很紧，企业信贷层面已经“实质上帮着美联储完成好几次加息了”。\n如果继续美联储看不到真正的连续加息风险，对于美国消费的打压才是最大收缩风险，不是通胀而是要通缩了。看看国债利率和高收益债券利差。\n结合特朗普在中选之后不再有动力拉升股市，加上节前加入交易稀薄，媒体小作文的通胀标题必然会带来机构和量化自动杀跌，以及下周英伟达NVDA老黄国会听证会事件。\n交易走势和颗粒度更细的投资策略和应对，见订阅者专享","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX-oleHW4AAZo_D.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2125602915377451281","l":[],"ln":[],"t":["美联储","通胀","原油能源","AI科技","关税贸易"],"lk":11,"rt":1,"rp":3,"vw":2852},{"id":"2125601993683239235","h":"Kay2289123","ts":1795617981,"zh":"10/25 今天半导体继续暴力下跌，很多朋友估计跟我一样，跌的我有点两眼发黑，瘫坐在椅子上。痛苦之余我也有些兴奋，今天是飞刀还是机会？12 月初是非常关键的日子，为什么？\n今天我的帖子想和大家一起分析和回顾一下：为什么一个黄仁勋回归重大利好，连几天的行情都没撑住？\n我现在很庆幸，前天拉升后做了获利了结，支持我今天继续买入。看跌期权也起到了保护，希望今天能击穿我设置的 limit price。\n1/ 这场过山车一句话总结版：23 日，黄仁勋回归，明确缓解了一个重大风险，股价迅速上涨。24 日，这次上涨开始回吐，同时 AMD 的潜在股权稀释、部分芯片公司的业绩展望、英伟达仍在面对的监管问题，各自给相关股票增加压力。25 日，卖压延续，新关税方案和随后公布的经济数据，又增加了不确定性\n目前没有证据证明，这两天整个 AI 行业的需求突然一起坏了。\n2/ 时间线拉齐\n第一天：23 日，上涨的直接原因很清楚\n08:55，英伟达正式宣布黄仁勋回归。公告前一分钟，英伟达约 136 美元；到 09:00，约 159 美元\n为什么别人也跟着涨？可以这样理解：\n英伟达是这轮 AI 投资的重要公司。它的领导层出了问题，投资者会连带担心合作伙伴、客户和供应商。领导层问题缓解，其他相关股票也容易一起得到提振。路透社当天的报道记录了这种广泛反弹\n因为情绪太过于高涨，因此我选择了获利了结\n第二天：24 日，情绪回过来了，黄仁勋归位不代表出口限制和调查结束了。换而言之，华尔街把咱们骗进来，然后把筹码再丢给咱们普通投资者\nHPE发布财报，下跌了约 16.3%。AMD 登记了约 3.37 亿股的潜在转售。其中绝大部分涉及 OpenAI 和 Meta 各自最多 1.6 亿股的附条件认股权。模拟芯片公司 ADI 在 07:01 发布财报，收入指引略高于预期，盈利指引略低于预期，利润率预计环比回落。当天股价下跌约 17%。\n它同样不能直接证明英伟达的 GPU、Micron 的存储、Marvell 的互联业务一起变差\n黄仁勋回归，也没有让出口限制和政治调查停止。23 日收盘附近，美国把 Megaspeed、阿里巴巴的新加坡子公司等七家实体加入出口限制名单。24 日，多位参议员又正式要求政府解释推动黄仁勋复职的过程，以及英伟达的出口合规问题\n我的判断是：前一天大家一起买入时，把很多不同公司的风险暂时放在了一边；价格大幅上涨后，这些风险又重新影响投资者愿意出的价格。AMD、ADI 等具体消息，进一步增加了部分股票的压力。\n第三天：25 日，原有卖压继续，又增加了宏观压力\n25 日早上，美国政府正式提出针对 14 个贸易伙伴的新关税方案。08:30，经济数据没有让市场放下心\n美国公布的数据包括：\n整体 PCE 通胀同比 3.8%，符合预期。\n核心 PCE 同比 3.3%，略高于预期的 3.2%。\n第三季度 GDP 环比年化增长 4.3%，高于预期的 3.5%。\n经济还比较热，物价也没有充分降下来。美联储没有因为这些数据而更需要把借钱的价格降下来。\n这对需要大量借钱建设机房的企业，仍然是一项压力\n3/ 接下来我在看什么？\n黄仁勋听证会， $MRVL 即将到来的财报。我在布局，因为我并不觉得 MRVL 的投资者日路线，发生了任何变化\n以及这是个人思路，不构成任何投资建议，投资需谨慎","en":"10/25 今天半导体继续暴力下跌，很多朋友估计跟我一样，跌的我有点两眼发黑，瘫坐在椅子上。痛苦之余我也有些兴奋，今天是飞刀还是机会？12 月初是非常关键的日子，为什么？\n今天我的帖子想和大家一起分析和回顾一下：为什么一个黄仁勋回归重大利好，连几天的行情都没撑住？\n我现在很庆幸，前天拉升后做了获利了结，支持我今天继续买入。看跌期权也起到了保护，希望今天能击穿我设置的 limit price。\n1/ 这场过山车一句话总结版：23 日，黄仁勋回归，明确缓解了一个重大风险，股价迅速上涨。24 日，这次上涨开始回吐，同时 AMD 的潜在股权稀释、部分芯片公司的业绩展望、英伟达仍在面对的监管问题，各自给相关股票增加压力。25 日，卖压延续，新关税方案和随后公布的经济数据，又增加了不确定性\n目前没有证据证明，这两天整个 AI 行业的需求突然一起坏了。\n2/ 时间线拉齐\n第一天：23 日，上涨的直接原因很清楚\n08:55，英伟达正式宣布黄仁勋回归。公告前一分钟，英伟达约 136 美元；到 09:00，约 159 美元\n为什么别人也跟着涨？可以这样理解：\n英伟达是这轮 AI 投资的重要公司。它的领导层出了问题，投资者会连带担心合作伙伴、客户和供应商。领导层问题缓解，其他相关股票也容易一起得到提振。路透社当天的报道记录了这种广泛反弹\n因为情绪太过于高涨，因此我选择了获利了结\n第二天：24 日，情绪回过来了，黄仁勋归位不代表出口限制和调查结束了。换而言之，华尔街把咱们骗进来，然后把筹码再丢给咱们普通投资者\nHPE发布财报，下跌了约 16.3%。AMD 登记了约 3.37 亿股的潜在转售。其中绝大部分涉及 OpenAI 和 Meta 各自最多 1.6 亿股的附条件认股权。模拟芯片公司 ADI 在 07:01 发布财报，收入指引略高于预期，盈利指引略低于预期，利润率预计环比回落。当天股价下跌约 17%。\n它同样不能直接证明英伟达的 GPU、Micron 的存储、Marvell 的互联业务一起变差\n黄仁勋回归，也没有让出口限制和政治调查停止。23 日收盘附近，美国把 Megaspeed、阿里巴巴的新加坡子公司等七家实体加入出口限制名单。24 日，多位参议员又正式要求政府解释推动黄仁勋复职的过程，以及英伟达的出口合规问题\n我的判断是：前一天大家一起买入时，把很多不同公司的风险暂时放在了一边；价格大幅上涨后，这些风险又重新影响投资者愿意出的价格。AMD、ADI 等具体消息，进一步增加了部分股票的压力。\n第三天：25 日，原有卖压继续，又增加了宏观压力\n25 日早上，美国政府正式提出针对 14 个贸易伙伴的新关税方案。08:30，经济数据没有让市场放下心\n美国公布的数据包括：\n整体 PCE 通胀同比 3.8%，符合预期。\n核心 PCE 同比 3.3%，略高于预期的 3.2%。\n第三季度 GDP 环比年化增长 4.3%，高于预期的 3.5%。\n经济还比较热，物价也没有充分降下来。美联储没有因为这些数据而更需要把借钱的价格降下来。\n这对需要大量借钱建设机房的企业，仍然是一项压力\n3/ 接下来我在看什么？\n黄仁勋听证会， $MRVL 即将到来的财报。我在布局，因为我并不觉得 MRVL 的投资者日路线，发生了任何变化\n以及这是个人思路，不构成任何投资建议，投资需谨慎","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX-ku9LbIAA52FB.png?name=orig","https://pbs.twimg.com/media/HX-nb3RbcAAgOKR.jpg?name=orig"],"u":"https://x.com/Kay2289123/status/2125601993683239235","l":[],"ln":[],"t":["美联储","通胀","AI科技","财报","关税贸易"],"lk":10,"rt":1,"rp":4,"vw":2548},{"id":"2125601576542978427","h":"octopusycc","ts":1795617882,"zh":"浓烈的 流动性危机的感觉","en":"浓烈的 流动性危机的感觉","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2125601576542978427","l":[],"ln":[],"t":[],"lk":16,"rt":0,"rp":3,"vw":2759},{"id":"2125600235816890740","h":"dmjk001","ts":1795617562,"zh":"高盛策略师表示，现在买入人工智能抛售潮还为时过早","en":"高盛策略师表示，现在买入人工智能抛售潮还为时过早","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX-mHIhbAAIWBox.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2125600235816890740","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":2155},{"id":"2125597700376911911","h":"BrantChinesefn","ts":1795616958,"zh":"我又不是多少倍的杠杆合约，又不是三倍etf，我一个股票账户，买的还是正股 $NVDA ，就这大盘跌我还能跌多少。今天跌了3%，nvda不也就跌了5%吗，但我账户很难看吗？我要是这点亏损都扛不住，我也不会有现在的收益率呀。我继续持仓不动。","en":"我又不是多少倍的杠杆合约，又不是三倍etf，我一个股票账户，买的还是正股 $NVDA ，就这大盘跌我还能跌多少。今天跌了3%，nvda不也就跌了5%吗，但我账户很难看吗？我要是这点亏损都扛不住，我也不会有现在的收益率呀。我继续持仓不动。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX-j0zEbAAAF7Hv.jpg?name=orig","https://pbs.twimg.com/media/HX-j0zKboAAGKFv.jpg?name=orig"],"u":"https://x.com/BrantChinesefn/status/2125597700376911911","l":[],"ln":[],"t":[],"lk":14,"rt":0,"rp":3,"vw":1607},{"id":"2125597455643537759","h":"wufantouzi","ts":1795616899,"zh":"算下来\n感恩节的时候\n我好像是那只火鸡","en":"算下来\n感恩节的时候\n我好像是那只火鸡","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2125597455643537759","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":3,"vw":1327},{"id":"2125596710999122257","h":"TraderS18","ts":1795616722,"zh":"后续英伟达最少要面对两条路径的利空：\n1. 黄仁勋吃过一次亏后彻底重新掌权，大肆清理董事会，把之前阴他的人都扫出去，这时候英伟达难免会有动荡，再加上加息流动性紧张大背景，还会继续跌。\n2. 12月听证会上民主党大概就会开始发难，黄仁勋仍然面临不可预测风险。 然后1月民主党正式上台后大概率会继续反扑，政治前景暂不明朗，但好在川普既然已经下场保他就不太会反复，未来两年任期里虽然难受但不至于有生命危险。","en":"后续英伟达最少要面对两条路径的利空：\n1. 黄仁勋吃过一次亏后彻底重新掌权，大肆清理董事会，把之前阴他的人都扫出去，这时候英伟达难免会有动荡，再加上加息流动性紧张大背景，还会继续跌。\n2. 12月听证会上民主党大概就会开始发难，黄仁勋仍然面临不可预测风险。 然后1月民主党正式上台后大概率会继续反扑，政治前景暂不明朗，但好在川普既然已经下场保他就不太会反复，未来两年任期里虽然难受但不至于有生命危险。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2125596710999122257","l":[],"ln":[],"t":["美联储","AI科技"],"lk":3,"rt":1,"rp":1,"vw":3190},{"id":"2125596411819680152","h":"cnfinancewatch","ts":1795616650,"zh":"作为一名奥派经济学家，我反对美国关税政策，尤其是进一步加码的关税政策，关税壁垒无疑不利于全球贸易自由和全球生产力利益：\n美国提议对14个贸易伙伴实施新关税，以应对工业产能过剩\n🇨🇳 中国：20%（如果贸易休战破裂则高达40%）\n🇻🇳 越南：高达35%\n🇮🇳 印度：高达25%（如果达成协议则为17%）\n🇰🇷 韩国：高达25%\n🇹🇼 台湾：高达25%\n🇮🇩 印尼：高达25%\n🇲🇾 马来西亚：高达25%\n🇹🇭 泰国：高达25%\n🇰🇭 柬埔寨：高达25%\n🇪🇺 欧盟：高达20%\n🇯🇵 日本：高达20%\n🇨🇭 瑞士：高达20%\n🇸🇬 新加坡：高达20%\n🇧🇩 孟加拉国：高达20%\n另外：\n🇧🇷 巴西：成品飞机10%，另加糖关税\n🇲🇽 墨西哥 & 🇳🇴 挪威：未提议新关税\n现有贸易协议将把税率上限设定为：\n20%：越南\n18%：印尼、马来西亚、泰国、柬埔寨、孟加拉国\n15%：欧盟、日本、韩国、台湾、瑞士\n新加坡仍受其提议税率上限约束。\n其他关键细节：\n这些关税是根据第301条款提出的，此前美国对工业补贴和制造业产能过剩进行了调查。\n新关税不会叠加到其他贸易伙伴现有的10%和12.5%强迫劳动关税之上。\n中国提议的20%关税将加在2018年征收的25%关税之上。\n根据早前的强迫劳动关税，钢铁、铝、汽车、铜、药品、农产品和航空零部件预计将获得豁免，尽管豁免清单尚未发布。\n所有新关税都不会立即生效。首先将进行公众评论期，最早预计于2027年1月实施。","en":"作为一名奥派经济学家，我反对美国关税政策，尤其是进一步加码的关税政策，关税壁垒无疑不利于全球贸易自由和全球生产力利益：\n美国提议对14个贸易伙伴实施新关税，以应对工业产能过剩\n🇨🇳 中国：20%（如果贸易休战破裂则高达40%）\n🇻🇳 越南：高达35%\n🇮🇳 印度：高达25%（如果达成协议则为17%）\n🇰🇷 韩国：高达25%\n🇹🇼 台湾：高达25%\n🇮🇩 印尼：高达25%\n🇲🇾 马来西亚：高达25%\n🇹🇭 泰国：高达25%\n🇰🇭 柬埔寨：高达25%\n🇪🇺 欧盟：高达20%\n🇯🇵 日本：高达20%\n🇨🇭 瑞士：高达20%\n🇸🇬 新加坡：高达20%\n🇧🇩 孟加拉国：高达20%\n另外：\n🇧🇷 巴西：成品飞机10%，另加糖关税\n🇲🇽 墨西哥 & 🇳🇴 挪威：未提议新关税\n现有贸易协议将把税率上限设定为：\n20%：越南\n18%：印尼、马来西亚、泰国、柬埔寨、孟加拉国\n15%：欧盟、日本、韩国、台湾、瑞士\n新加坡仍受其提议税率上限约束。\n其他关键细节：\n这些关税是根据第301条款提出的，此前美国对工业补贴和制造业产能过剩进行了调查。\n新关税不会叠加到其他贸易伙伴现有的10%和12.5%强迫劳动关税之上。\n中国提议的20%关税将加在2018年征收的25%关税之上。\n根据早前的强迫劳动关税，钢铁、铝、汽车、铜、药品、农产品和航空零部件预计将获得豁免，尽管豁免清单尚未发布。\n所有新关税都不会立即生效。首先将进行公众评论期，最早预计于2027年1月实施。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125596411819680152","l":[],"ln":[],"t":["关税贸易"],"lk":0,"rt":0,"rp":1,"vw":1171},{"id":"2125595515681476649","h":"cnf media/HX-eB5VasAA0AJU.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2125591566089932877","l":[],"ln":[],"t":["美联储","通胀","美股"],"lk":2,"rt":0,"rp":1,"vw":1273},{"id":"2125590431802995018","h":"ReutersChina","ts":1795615225,"zh":"上海金融中心的官方文件周三称，在其高级官员受到调查后，上海的共产党高级领导层承诺效忠北京，并理解“把事情到底”的必要性。","en":"Shanghai's senior Communist Party leadership pledged loyalty to Beijing and understanding of the need to \"see things through to the end\" after their top official was put under investigation, the financial hub's official paper said on Wednesday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2125590431802995018","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/asia-pacific/shanghai-party-pledges-loyalty-beijing-top-official-faces-investigation-2026-11-25/?taid=6b06e9f9949d5800012d9da3&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":362},{"id":"2125589926330933672","h":"wufantouzi","ts":1795615104,"zh":"思考投资的最佳方法，还是独自一人待在房间里，静静地想。要是这样不行，别的办法也都没用。\n我回到奥马哈之后，每半年去大城市一次。每次都列一个清单，把要做的事写下来，比如要调研的公司。这些路费都没白花。该做完的事做完了，我就回到奥马哈思考。\n引用：","en":"思考投资的最佳方法，还是独自一人待在房间里，静静地想。要是这样不行，别的办法也都没用。\n我回到奥马哈之后，每半年去大城市一次。每次都列一个清单，把要做的事写下来，比如要调研的公司。这些路费都没白花。该做完的事做完了，我就回到奥马哈思考。\n引用：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX-cwrnbIAEtfyl.jpg?name=orig"],"u":"https://x.com/wufantouzi/status/2125589926330933672","l":["web.timestore.vip"],"ln":[{"u":"https://web.timestore.vip/#/time/pages/timeDetail/index?timeid=186125","d":"web.timestore.vip"}],"t":[],"lk":3,"rt":0,"rp":2,"vw":1823},{"id":"2125584823863673215","h":"cnfinancewatch","ts":1795613888,"zh":"关税的幻象与美元流动性的终局\n华尔街观察 @cnfinancewatch\n奥派视关税为理性建构主义对自发秩序的僭越。米塞斯早有断言：一项干预必然召唤下一项干预，关税人为扭曲相对价格信号，使资本错配层层累积。哈耶克则直指其认识论根源——企图以政治意志替代亿万个体的分散知识，是“致命的自负”。特朗普关税的本质，是用权力政治替代市场过程，其代价不会消失，只会转移到消费者与下游产业。\n奥派货币理论进一步揭示美元体系的深层病理。美元作为世界货币，其流动性注入并非中性：坎蒂隆效应意味着新增美元首先抵达财政部、一级交易商与华尔街，再经由美债市场“滴漏”至全球，分配严重不对称。美债因此成为全球流动性的抵押品根基，而非单纯的债务凭证。但这一机制内含自我瓦解的种子：2026财年净利息支出已突破1万亿美元，占联邦收入近20%；海外官方持有占比从2016年的45%降至约30%，私人杠杆资金接替央行成为边际买家。利息滚雪球与买家结构杠杆化并行，使美债市场的“安全资产”共识趋于松动。\n预判临界点，不宜锚定“40万亿”这一整数。达利欧的“三年±两年”窗口值得认真对待，但更可操作的信号是：30年期美债收益率持续站上6%，且利息支出占联邦收入比突破25%。届时，美联储将面临一个奥派早已预言的困境——要么让利率出清，财政瞬间“心脏骤停”；要么重新扩表，以新一轮信用注入稀释存量债务。美元流动性的大规模重新释放，大概率正是以这种被迫的、隐性化的扩表形式到来。它不是体系的修复，而是坎蒂隆效应的又一轮放大：先得者近钱，后得者得纸。","en":"关税的幻象与美元流动性的终局\n华尔街观察 @cnfinancewatch\n奥派视关税为理性建构主义对自发秩序的僭越。米塞斯早有断言：一项干预必然召唤下一项干预，关税人为扭曲相对价格信号，使资本错配层层累积。哈耶克则直指其认识论根源——企图以政治意志替代亿万个体的分散知识，是“致命的自负”。特朗普关税的本质，是用权力政治替代市场过程，其代价不会消失，只会转移到消费者与下游产业。\n奥派货币理论进一步揭示美元体系的深层病理。美元作为世界货币，其流动性注入并非中性：坎蒂隆效应意味着新增美元首先抵达财政部、一级交易商与华尔街，再经由美债市场“滴漏”至全球，分配严重不对称。美债因此成为全球流动性的抵押品根基，而非单纯的债务凭证。但这一机制内含自我瓦解的种子：2026财年净利息支出已突破1万亿美元，占联邦收入近20%；海外官方持有占比从2016年的45%降至约30%，私人杠杆资金接替央行成为边际买家。利息滚雪球与买家结构杠杆化并行，使美债市场的“安全资产”共识趋于松动。\n预判临界点，不宜锚定“40万亿”这一整数。达利欧的“三年±两年”窗口值得认真对待，但更可操作的信号是：30年期美债收益率持续站上6%，且利息支出占联邦收入比突破25%。届时，美联储将面临一个奥派早已预言的困境——要么让利率出清，财政瞬间“心脏骤停”；要么重新扩表，以新一轮信用注入稀释存量债务。美元流动性的大规模重新释放，大概率正是以这种被迫的、隐性化的扩表形式到来。它不是体系的修复，而是坎蒂隆效应的又一轮放大：先得者近钱，后得者得纸。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125584823863673215","l":[],"ln":[],"t":["美联储","财报","关税贸易"],"lk":1,"rt":0,"rp":2,"vw":1992},{"id":"2125583986718015621","h":"TraderS18","ts":1795613688,"zh":"PCE核心年率高于预期，好在月率符合预期，总体还是一个比较差的数据，市场不出所料的继续下跌了，如之前所说，现在这个阶段就是抛弃幻想，市场不会那么快好起来，又不是没有经历过熊市，流动性紧缩的时候也就偶尔消息出来情绪性诈尸上涨，随后就都是阴跌了。这种行情不反弹空还指望啥呢","en":"PCE核心年率高于预期，好在月率符合预期，总体还是一个比较差的数据，市场不出所料的继续下跌了，如之前所说，现在这个阶段就是抛弃幻想，市场不会那么快好起来，又不是没有经历过熊市，流动性紧缩的时候也就偶尔消息出来情绪性诈尸上涨，随后就都是阴跌了。这种行情不反弹空还指望啥呢","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX-XRCOaMAAoOib.jpg?name=orig"],"u":"https://x.com/TraderS18/status/2125583986718015621","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":3,"vw":2222},{"id":"2125581624846795106","h":"bbcchinese","ts":1795613125,"zh":"中国希望向外界展示，天宫太空站有能力成为国际科研平台，而非仅供中国使用的设施。与此同时，北京试图把自己塑造成美国主导太空计划以外的重要替代选择，并计划于2030年前首次把中国航天员送上月球。","en":"中国希望向外界展示，天宫太空站有能力成为国际科研平台，而非仅供中国使用的设施。与此同时，北京试图把自己塑造成美国主导太空计划以外的重要替代选择，并计划于2030年前首次把中国航天员送上月球。","zh_src" 、日本、韩国、马来西亚、新加坡、瑞士、台湾、泰国和越南的商品。具体税率将于周三在美国《联邦公报》通知中公布。\n该官员表示，在14个贸易伙伴中，中国将面临最高税率，因为拟议对中国商品征收的20%过剩产能关税，将叠加在唐纳德·特朗普总统第一任期内征收的约25%关税之上，并补充说，这将使中国税率高于拟议对越南征收的20%。\n关税税率也将与其他伙伴签署的贸易协定保持一致，包括欧盟、日本、韩国和台湾商定的15%上限，以及马来西亚商定的19%上限。","en":"路透：美国提议对14个贸易伙伴征收新关税，以应对工厂产能过剩\n一位美国高级官员表示，拟议关税针对来自中国、孟加拉国、柬埔寨、欧盟、印度、印度尼西亚、日本、韩国、马来西亚、新加坡、瑞士、台湾、泰国和越南的商品。具体税率将于周三在美国《联邦公报》通知中公布。\n该官员表示，在14个贸易伙伴中，中国将面临最高税率，因为拟议对中国商品征收的20%过剩产能关税，将叠加在唐纳德·特朗普总统第一任期内征收的约25%关税之上，并补充说，这将使中国税率高于拟议对越南征收的20%。\n关税税率也将与其他伙伴签署的贸易协定保持一致，包括欧盟、日本、韩国和台湾商定的15%上限，以及马来西亚商定的19%上限。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX-TuhbbMAA2f6V.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2125580298788503809","l":[],"ln":[],"t":["关税贸易"],"lk":1,"rt":0,"rp":0,"vw":1696},{"id":"2125579122445557821","h":"fxtrader","ts":1795612528,"zh":"美国高级官员表示，将提议对中国征收20%的关税税率。若无美中协议，税率将为40%。","en":"美国高级官员表示，将提议对中国征收20%的关税税率。若无美中协议，税率将为40%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2125579122445557821","l":[],"ln":[],"t":["关税贸易"],"lk":11,"rt":1,"rp":10,"vw":7300},{"id":"2125578072972017758","h":"fxtrader","ts":1795612278,"zh":"在贸易调查后，美国提议对欧盟征收最高20%关税。","en":"在贸易调查后，美国提议对欧盟征收最高20%关税。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2125578072972017758","l":[],"ln":[],"t":["关税贸易"],"lk":13,"rt":0,"rp":2,"vw":11544},{"id":"2125563711867752514","h":"bbcchinese","ts":1795608854,"zh":"一波与中国有关的帐号用AI生成影片，攻击台湾执政党关键人物，包括总统赖清德和台北市长候选人沈伯洋。","en":"一波与中国有关的帐号用AI生成影片，攻击台湾执政党关键人物，包括总统赖清德和台北市长候选人沈伯洋。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2125563711867752514","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4jkutXs","d":"bbc.in"}],"t":[],"lk":8,"rt":2,"rp":5,"vw":4254},{"id":"2125560257292489138","h":"ShanghaoJin","ts":1795608030,"zh":"AI race走到最后必然是把有电的都插上卡\n从这个角度来说：China wins period\n我不怎么相信什么export control，只要有利益的地方，自然有人干\n中国已有的太阳能就有1300GW，美国本来说明年要部署多少算力来着？","en":"AI race走到最后必然是把有电的都插上卡\n从这个角度来说：China wins period\n我不怎么相信什么export control，只要有利益的地方，自然有人干\n中国已有的太 ttle。\n民主党近期积极推动调查，首先自然还是希望借调查压制共和党、为2028年积累优势拿到28年的选票。核心还是迎合选民诉求：AI、通胀、腐败等问题上大作文章，把川普和共和党在过会两年的政策失当、腐败和内幕行为全部扒光呈现在民众面前，让民众对川普的反对意愿更高更强，进一步巩固期选票优势。另一方面也是为了重塑过去两年白宫和国会的失衡（7成选民认为国会制衡川普非常不够）。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"四十年前一位复旦学者去美国交流考察，回来写了一本现在看都非常有价值的书《美国反对美国》，核心要义里有一点放在当下非常应景，就是：“美国反对美国”这一命题揭示了美国并非一个均质的整体，而是充满内在结构性矛盾、否定性力量与自我对抗的复杂体。从这个角度其实就能很好地理解当下美国两党争斗和党内博弈的现状。\n对于美国要赢得下一轮科技竞争以及遏制其最主要战略对手这一点，两党有着共识，但在谁应该从中获利、谁应该付账，以及为了赢政府可以动用多大的权力这几点则不仅两党就是两党内不同派系主张都各不相同。这就是当下博弈的核心根源。\nMAGA代表性人物班农可以在限制对华芯片出口上站到鲁比奥一边，在反对长期中东战争上更接近万斯，又可以和极左翼桑德斯同台要求约束AI巨头。其他派系都是如此、这个议题上合作、下个议题上Battle。\n民主党近期积极推动调查，首先自然还是希望借调查压制共和党、为2028年积累优势拿到28年的选票。核心还是迎合选民诉求：AI、通胀、腐败等问题上大作文章，把川普和共和党在过会两年的政策失当、腐败和内幕行为全部扒光呈现在民众面前，让民众对川普的反对意愿更高更强，进一步巩固期选票优势。另一方面也是为了重塑过去两年白宫和国会的失衡（7成选民认为国会制衡川普非常不够）。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX9ew6CbgAAkFGV.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2125527067358032235","l":[],"ln":[],"t":["通胀","美股","AI科技"],"lk":4,"rt":1,"rp":2,"vw":3659},{"id":"2125524163339411825","h":"bboczeng","ts":1795599425,"zh":"我终于明白我和高盛某“高管”之间最根本的区别了\n其实我们这种做题家，特别是数学或者物理专业毕业的\n都有一种无私分享的求真精神\n这其实是教材们教给我们的精神\n数学和物理的经典教材，几乎全都是该领域大家之作，他们会把知识醍醐灌顶一般毫无保留的交给你，让我们深受感动\n这也潜移默化了我们的思维习惯\n但在金融公司工作20年的人不一样。他们的生活日常，是随时随刻提防自己的策略别人偷走，随时随地防止自己的想法被人听到\n无时不刻不生活在虚伪和竞争之中\n这就是为什么他买了AEHR之后却从不敢说亏了多少，自己INTC跑路了却从不会告诉别人，只敢在尘埃落定证明自己赢了之后才慢慢吞吞的说出来\n一股阴森太监的味道，油然而生\n而我在7月跑路就敢同时同步发出来，即便有无数人骂我、拉黑我\n我本质上是热爱分享，追求真理的\n但很显然某些人并不是\n我只希望推特上这样的人越来越少，最后被全部淘汰\n这样才对得起上帝\n良币驱逐劣币，而不是劣币驱逐良币\n学金融的都是坏人，建议大家永远，彻底的原理金融\n在工程师和科学家群体中，找到真正的幸福\n谢谢大家","en":"我终于明白我和高盛某“高管”之间最根本的区别了\n其实我们这种做题家，特别是数学或者物理专业毕业的\n都有一种无私分享的求真精神\n这其实是教材们教给我们的精神\n数学和物理的经典教材，几乎全都是该领域大家之作，他们会把知识醍醐灌顶一般毫无保留的交给你，让我们深受感动\n这也潜移默化了我们的思维习惯\n但在金融公司工作20年的人不一样。他们的生活日常，是随时随刻提防自己的策略别人偷走，随时随地防止自己的想法被人听到\n无时不刻不生活在虚伪和竞争之中\n这就是为什么他买了AEHR之后却从不敢说亏了多少，自己INTC跑路了却从不会告诉别人，只敢在尘埃落定证明自己赢了之后才慢慢吞吞的说出来\n一股阴森太监的味道，油然而生\n而我在7月跑路就敢同时同步发出来，即便有无数人骂我、拉黑我\n我本质上是热爱分享，追求真理的\n但很显然某些人并不是\n我只希望推特上这样的人越来越少，最后被全部淘汰\n这样才对得起上帝\n良币驱 ，医药板块周二领涨，从20日低264.20反弹到276.46，但已离开箱底、来到区间中部47%，头颈癌FDA加速批准发生在11月5日，不是23日新事件，半仓。第二只\n$TWST，20日区间位置17.9%，周二收出锤子线，ARKG与ARKK同买，Call持仓增仓，箱底成立，半仓。第三只 #苹果\n$AAPL，距20日和52周高360.83还有1.91%，属突破准备，Call持仓增仓且最大Call行权价贴着现价，但目标价均值低于现价，内部人近三个月净卖出，半仓，放量不过360.83就先看。\n明确不做：AI硬件追涨、像 $KYMR 这种两日大涨后已处20日区间上沿的短线票、期权偏空的 $ARCT，以及财务缺失的小盘。\n#消息面\n周二回撤，公开报道主要归因于对周一英伟达行情的获利回吐，以及新关税可能落地。黄仁勋职务周一已经恢复，但众议院相关委员会安排他12月1日闭门听证，参议院银行委员会12月3日公开听证，主题是出口管制。Anthropic跌约6.5%，收81.90美元，跌破83美元发行价。\n#美光 $MU 跌11.01%， $AMD 跌8.86%， #亚德诺 $ADI 在周一晚财报后跌17.37%。\n另外一边，必需消费和医药在涨。$ANF、 $DLTR 上调利润展望，分别大涨约19.7%、11.2%。 $XLV 涨2.95%， $IHE\n涨3.17%且量比2.15。\n亚太没能接住。日经225收57011.62，跌2.78%；韩国综指收4697.51，跌6.16%；恒生指数收22027.52，跌0.86%。A股上证收3476.47，跌2.03%；深证收10086.36，跌3.24%；创业板收2183.58，跌4.19%；科创50收1186.14，跌5.12%。北京时间约15:20，标普迷你约7159点，较周二期货收盘7217.5跌约0.81%；纳指迷你约25875.75点，跌约1.52%。\n今日美东时间8:30将公布10月PCE。周四感恩节休市，周五提前至13:00收盘，周三仍是正常交易时段。\n#研报面\n近12至24小时未见头部大行对名单股大幅上调。 $AAPL\n目标价均值343.69，低于现价354.07，买入15家、持有8家、卖出6家，近4周EPS上修9家、下修17家； $KYMR\n目标价均值179.06，买入17家、持有1家，几乎贴着现价173.92，但位置已经伸展。 $JNJ、 $TWST 目标价本档未采集。\n#资金面\nARK 11月24日有明确的多基金同买： $TWST 由ARKG与ARKK合计买入约650万美元； $BEAM 两只基金合计约320万美元。\n$GOOG 也是两只基金同买约1730万美元，但13F里FMR减持4.165%，方向相反，不算共振。 $CRSP、 $WGS、 $ARCT\n都只是单基金买入，按规则要降一档。\n带方向的期权按原邮件口径： $AAPL\nCall持仓增仓37.8%，最大Call行权价355.0距现价仅0.32%、量仓比17.9，共振成立。 $TWST\nCall持仓增仓22.7%，P/C成交比0.14，再叠加ARK同买，共振成立。 $JNJ\nCall成交7061张、P/C成交比0.25，最大Call行权价270距现价2.45%，邮件计成共振，但Call持仓其实减了14.5%，强度不如前两只。\n$TSLA Call持仓增仓35.5%，位置不够。 $KYMR 的Call和Put同时大增，方向分歧。 $ARCT、 $NVDA\n都是Put增仓偏空，未共振。\n#期货\n周二完整交易日，股指期货跟现货一起回吐。标普迷你收7217.5，跌0.51%，邮件口径量比1.09、未平仓量210.44万、日减3.48万，价跌OI降，偏多头离场。纳指迷你收26275.75，跌1.99%，量比1.23、OI日增1545，量能未确认。罗素2000迷你收涨0.57%，邮件按价跌写成多头离场，与完整日线不一致，OI日减7791属实，更接近空头回补。十年期和三十年期美债期货量比到2.26和2.61，OI大幅下降，价涨OI降，偏空头回补，属重大异动。黄金期货周二收3561.9，跌2.45%，OI日减8.31万，偏多头离场；现价约3519.4，再跌约1.19%。WTI周二收82.05，涨2.35%，OI增加但量比0.92，量能未确认；现价约80.48，回吐约1.91%。比特币期货周二收59700，跌2.41%，量增OI增，偏新空进场。白银和铜量能不可核。","en":"美股盘前下午版·上 2026年11月25日 周三\n#结论 周二不是趋势转好，是周一暴力反抽之后的回吐和风格切换。标普500收7201.09，跌0.50%，近20日仍跌6.75%，处在20日区间36.4%；纳指收23733 I周二收82.05，涨2.35%，OI增加但量比0.92，量能未确认；现价约80.48，回吐约1.91%。比特币期货周二收59700，跌2.41%，量增OI增，偏新空进场。白银和铜量能不可核。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125503655952646163","l":[],"ln":[],"t":["美股","A股港股","AI科技","财报","关税贸易","黄金"],"lk":1,"rt":0,"rp":0,"vw":823},{"id":"2125503652135936141","h":"cnfinancewatch","ts":1795594535,"zh":"A股尾盘·上 2026年11月25日 周三\n#结论 盘前“不抄光模块和存储第一波、银行与红利只做防守”今天被盘面验证，而且跌得比早盘预想的更深。截至约14:37，上证指数报3479.28点，跌1.95%，深证成指跌2.97%，创业板指跌3.98%报2188.24点，再创阶段新低，科创50跌4.38%，上证50只跌0.87%。约486只上涨、4828只下跌，涨停45家、炸板34家，广度很差。电子板块主力净流出约171亿元，半导体约100亿元。银行、家电和必选消费相对抗跌，仍是今天能站住的一侧；成长股继续不要抄第一波。\n#消息面\n外部压力没有缓解。日经225收跌2.78%，韩国KOSPI收跌6.16%，恒生指数跌约0.73%，恒生科技跌约1.72%，港股里壁仞科技、天数智芯盘中一度跌近18%。隔夜费城半导体重挫7.88%、 #英伟达 跌5.86%的冲击还在消化，午后又有机构指出部分云厂商需求下修、2027年存储器产值增速或放缓，和高盛下调DRAM、NAND均价是同一方向。美股期指同步走弱，纳指期货约25891点，较结算下跌约1.47%。今晚还有美国PCE，12月加息预期仍然偏高，外部不是稳的。\n盘中结构很清楚：半导体设备、存储和光刻机明显更弱， #北方华创 $002371 跌约9.1%， #拓荆科技 $688072 跌约8.7%， #中微公司 $688012 跌约6.7%， #兆易创新 $603986 跌约6.2%并靠近20日低点；光模块里 #中际旭创 $300308、 #新易盛 $300502 跌幅相对小一些，但 #天孚通信 $300394 逆势涨约6.6%、成交超百亿元，这是个股分流，不是板块反转，不追。题材上，水产养殖涨约5.2%， #九阳股份 $002242 三连板涨停， #北纬科技 $002148 则11天6板后跌停，连板已经分化。神舟二十四号发射成功对航天只是早盘脉冲，没有变成主线。\n#研报面\n今日新出的买入报告不少，但和今天的抛压错位。华安给 #通富微电 $002156 买入，称把握AI封装机遇，但该股盘中跌约7.9%；华安还给出 #京东方A $000725、 #豪威集团 $603501、 #传音控股 $688036 的买入或增持，中邮给 #协创数据 $300857 买入。这些是中期观点，不能用来对抗隔夜芯片和存储的下行。防守一侧，中邮11月23日给 #伊利股份 $600887 买入、国金11月24日给 #京沪高铁 $601816 买入，更贴近今天还能站住的方向。\n#热榜\n东财人气前列是 #九阳股份 $002242、 #金牛化工 $600722、 #华胜天成 $600410、 #中京电子 $002579、 #天孚通信 $300394、 #冰山冷热 $000530，后面有 #好当家 $600467、 #东方海洋 $002086、 #文投控股 $600715、 #中际旭创 $300308。同花顺热榜顺序接近， #九阳股份、 #冰山冷热、 #中京电子、 #华胜天成 靠前， #天孚通信 因逆势大涨挤进名单。热度仍在连板、养殖和个别光模块之间切换，不把它当成今天的主方向。\n#资金面\n截至约14:37，沪市成交约5604亿元，深市约6442亿元，两市合计约1.20万亿元。14:00快讯称较上日同期缩量超过3400亿元，是缩量下跌，不是昨天那种放量回吐。主力资金口径，上证净流出约187亿元，深证净流出约207亿元，两市合计净流出约394亿元；超大单和大单都在出，中小单接，是大资金离场、散户抄底的结构。行业上，电子净流出约171亿元，半导体约100亿元，数字芯片设计约50亿元，印制电路板约31亿元。个股成交额靠前的是 #中际旭创、 #新易盛、 #宁德时代、 #天孚通信、 #寒武纪。北向实时净流入本档未披露。跌停完整名单未返回，涨跌分布里跌幅10%附近的数量不少，但封死跌停的并不多。","en":"A股尾盘·上 20 NG 涨7.05%、 $FIW 涨6.26%、 $PHO 涨5.80%、\n$ITB 涨5.77%、 $IHE 涨5.51%、 $XLP 涨5.43%。5日真正加速的是生物科技： $XBI 涨7.94%、 $SBIO\n涨7.25%、 $IBB 涨6.05%，这三只20日也是正的，属于双窗口同现，但位置已经到83%至89%，只观察、不追高。 $ITB\n20日涨5.77%、5日涨4.18%，双窗口同现且位置在52.5%，比生物科技更不拥挤，没有核验通过的对应个股，不单开方向。 $UNG\n双窗口同现，偏商品，只观察。 $IHE、 $XLP、 $FIW 是20日明显、5日只有不到1.4个百分点的正值，趋势未明显加速。科技侧\n$SMH 周二跌7.26%，20日跌23.52%、5日跌7.25%， $SOXX、 $QQQ 同样深负，不是双窗口。\nA股ETF用截至11月25日收盘，部分品种未取到。20日靠前是消费50ETF富国 $515650\n涨9.93%，5日只涨0.17%，位置却到了93.8%，是仅20日为主、位置偏高的消费映射；红利低波50ETF南方 $515450\n20日涨6.11%、5日涨0.27%，位置93%，同样偏防守。纳指生物科技ETF汇添富 $513290\n20日涨1.65%、5日涨1.04%，和美股生物科技同属双窗口，但幅度更弱、位置在53%。医药ETF易方达 $512010\n20日涨0.27%、5日跌1.06%，没有跟上 $XBI 的5日加速。芯片ETF华夏 $159995\n20日跌10.94%、5日跌7.98%，和 $SMH 同向都弱。银行、创新药等样本未取到，未写入榜单。\n#三个方向\n一是生物医药创新，这是今天优先做成方向的大类。 $IHE\n收109.04，涨3.17%，20日涨5.51%，5日涨0.58%，量比2.15，强于周一。真正5日加速的是 $XBI、\n$IBB，但它们已经靠近20日高，方向做 $JNJ 这类中部票和 $TWST 这类箱底票，不追 $KYMR。\n二是必需消费，对应 $XLP 收91.88，涨1.66%，20日涨5.43%，5日只涨0.46%，距20日高1.74%，突破观察还差放量。核心是\n$AAPL 的颈线准备，不把大涨的 $ANF、 $DLTR 塞进只做名单。\n三是AI硬件，只观察不买。 $NVDA、 $SMH、 $MU 都是周一反抽后的回吐，20日趋势没转，12月1日和3日听证还在，关税和PCE还在眼前。\n#六只个股\n #强生 $JNJ 收276.46，涨2.37%，20日区间位置47.1%，区间中部。11月19日最低264.68，周五和周一守在270附近，周二中阳但量比只有0.91。触发是站稳276并放量，失效看跌破268.08，再往下是20日低264.20。半仓。\n $TWST 收108.88，跌2.22%，20日区间位置17.9%，箱底。20日仍跌31.89%，上方套牢很重，但周二低点103.50后收出锤子线。触发是守住103.50并站回111，失效看跌破101.00。半仓。\n #苹果 $AAPL 收354.07，涨1.43%，20日区间位置81.0%，突破准备，距颈线还有1.91%。周二收近高点，量比只有0.82，还不是放量突破。触发是放量站上360.83，失效看跌破345.88，再往下是11月20日低340.56。半仓。\n $KYMR 收173.92，涨15.66%，前一日涨30.40%，20日区间位置90.7%，短线已伸展，期权方向分歧，只观察。失效看114.39。\n $ARCT 收8.79，涨5.65%，20日区间位置28.8%，靠近箱底，但Put持仓大增、Call减仓，不做。失效看7.31。\n #特斯拉 $TSLA 收384.68，跌0.20%，距20日高7.68%，不在突破区间，FSD推送单独不够，只观察。失效看374.37。\n#小盘阿尔法\n本档只保留已写入六只的 $TWST，市值约76亿美元，不重复升级。 $CRSP\n收44.10，涨1.89%，20日位置33.7%，ARK只是单基金，先观察。 $BEAM\n虽是两只基金同买，但20日位置41.0%，刚过下沿标准，两日反弹偏快，不选。 $BRVE 财务字段缺失，不选。\n#操作提示\n现在股指期货对周二收盘是0.8%到1.5%的折价，亚太也没接住，先把周一反抽当成有待验证的反弹，而不是新趋势。只做仓位如果要开，就留在\n$JNJ、 $TWST、 $AAPL 三只半仓，看箱底和颈线各自能不能守住。不要用周一的 $NVDA\n去追AI硬件。今日还有PCE，周四休市、周五早收，流动性会变差。恐慌贪婪指数按原邮件口径报17.4，仍是极端恐惧，不能单独当加仓信号。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"美股盘前下午版·下 2026年11月25日 周三\n上篇的结论是：周二是反抽后的回吐，只做 $JNJ、 $TWST、 $AAPL 三只半仓，AI硬件不追。下面把中美位置和名单写完。\n#中美映射\n美股行业ETF用截至11月24日完整日线。20日涨幅靠前的是 $UNG 涨7.05%、 $FIW 涨6.26%、 $PHO 涨5.80%、\n$ITB 涨5.77%、 $IHE 涨5.51%、 $XLP 涨5.43%。5日真正加速的是生物科技： $XBI 涨7.94%、 $SBIO\n涨7.25%、 $IBB 涨6.05%，这三只20日也是正的，属于双窗口同现，但位置已经到83%至89%，只观察、不追高。 $ITB\n20日涨5.77%、5日涨4.18%，双窗口同现且位置在52.5%，比生物科技更不拥挤，没有核验通过的对应个股，不单开方向。 $UNG\n双窗口同现，偏商品，只观察。 $IHE、 $XLP、 $FIW 是20日明显、5日只有不到1.4个百分点的正值，趋势未明显加速。科技侧\n$SMH 周二跌7.26%，20日跌23.52%、5日跌7.25%， $SOXX、 $QQQ 同样深负，不是双窗口。\nA股ETF用截至11月25日收盘，部分品种未取到。20日靠前是消费50ETF富国 $515650\n涨9.93%，5日只涨0.17%，位置却到了93.8%，是仅20日为主、位置偏高的消费映射；红利低波50ETF南方 $515450\n20日涨6.11%、5日涨0.27%，位置93%，同样偏防守。纳指生物科技ETF汇添富 $513290\n20日涨1.65%、5日涨1.04%，和美股生物科技同属双窗口，但幅度更弱、位置在53%。医药ETF易方达 $512010\n20日涨0.27%、5日跌1.06%，没有跟上 $XBI 的5日加速。芯片ETF华夏 $159995\n20日跌10.94%、5日跌7.98%，和 $SMH 同向都弱。银行、创新药等样本未取到，未写入榜单。\n#三个方向\n一是生物医药创新，这是今天优先做成方向的大类。 $IHE\n收109.04，涨3.17%，20日涨5.51%，5日涨0.58%，量比2.15，强于周一。真正5日加速的是 $XBI、\n$IBB，但它们已经靠近20日高，方向做 $JNJ 这类中部票和 $TWST 这类箱底票，不追 $KYMR。\n二是必需消费，对应 $XLP 收91.88，涨1.66%，20日涨5.43%，5日只涨0.46%，距20日高1.74%，突破观察还差放量。核心是\n$AAPL 的颈线准备，不把大涨的 $ANF、 $DLTR 塞进只做名单。\n三是AI硬件，只观察不买。 $NVDA、 $SMH、 $MU 都是周一反抽后的回吐，20日趋势没转，12月1日和3日听证还在，关税和PCE还在眼前。\n#六只个股\n #强生 $JNJ 收276.46，涨2.37%，20日区间位置47.1%，区间中部。11月19日最低264.68，周五和周一守在270附近，周二中阳但量比只有0.91。触发是站稳276并放量，失效看跌破268.08，再往下是20日低264.20。半仓。\n $TWST 收108.88，跌2.22%，20日区间位置17.9%，箱底。20日仍跌31.89%，上方套牢很重，但周二低点103.50后收出锤子线。触发是守住103.50并站回111，失效看跌破101.00。半仓。\n #苹果 $AAPL 收354.07，涨1.43%，20日区间位置81.0%，突破准备，距颈线还有1.91%。周二收近高点，量比只有0.82，还不是放量突破。触发是放量站上360.83，失效看跌破345.88，再往下是11月20日低340.56。半仓。\n $KYMR 收173.92，涨15.66%，前一日涨30.40%，20日区间位置90.7%，短线已伸展，期权方向分歧，只观察。失效看114.39。\n $ARCT 收8.79，涨5.65%，20日区间位置28.8%，靠近箱底，但Put持仓大增、Call减仓，不做。失效看7.31。\n #特斯拉 $TSLA 收384.68，跌0.20%，距20日高7.68%，不在突破区间，FSD推送单独不够，只观察。失效看374.37。\n#小盘阿尔法\n本档只保留已写入六只的 $TWST，市值约76亿美元，不重复升级。 $CRSP\n收44.10，涨1.89%，20日位置33.7%，ARK只是单基金，先观察。 $BEAM\n虽是两只基金同买，但20日位置41.0%，刚过下沿标准，两日反弹偏快，不选。 $BRVE 财务字段缺失，不选。\n#操作提示\n现在股指期货对周二收盘是0.8%到1.5 所以冲这一点，也要抗住！数据公布完以后，有相当半月的时间是消息真空阶段，虽然这半月期间不会改变什么，但就好像中场休息一样，情绪会修复的。\n所以哪怕数据不好也得抗住！各位可以去看下 2022 年的走势，一路下跌一整年，也会有三次比较像样的上涨。如果要跑路，认为要连续加息，我也会选择在这些上涨的顶部跑路。\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2125493013145395499","l":[],"ln":[],"t":["美联储"],"lk":12,"rt":0,"rp":7,"vw":1804},{"id":"2125492666670723248","h":"bboczeng","ts":1795591916,"zh":"半导体投资的十五条公理\n1. 不要根据估值来决定买卖。\n2. 半导体公司的管理层，通常无论实际情况如何，都会保持乐观。\n3. 半导体是周期性行业。 不要相信“半导体已经不再具有周期性”的说法。\n4. “City Slickers”法则：半导体股票的走势通常由一个关键因素驱动——你需要做的，就是找出这个因素。\n5. 产品周期通常会把股价和每股收益（EPS）推到比你预期更高的水平，而且持续时间比你预期更长。不幸的是，反过来也成立。\n6. 以牺牲利润率为代价追求营收增长，几乎从来都行不通。\n7. 交货周期延长时买入，交货周期缩短时卖出。\n8. 真正的“这次不一样”极少发生。确实有可能，但非常罕见。\n9. 警惕“问题只会持续一个季度”的说法。\n10. 不要指望或依赖管理层提前判断行业下行——参见第2条。\n11. 收购方对所收购的业务拥有相关经验时，并购的成功率通常最高。如果缺乏相关经验，交易风险就会大幅增加。\n12. 大多数科技公司只擅长做好一件事。当这套商业模式受到冲击或走向衰退时，公司想转型进入另一项业务并取得成功，既非常困难，也极为少见。\n13. 二线公司在下行周期中最先受冲击、受损最重；在上行周期中受益最晚、受益最少。\n14. 投资“价值型”科技股，通常只有在管理层和／或经营方式发生变化时，才会奏效。\n15. 当一只股票遇到坏消息不再下跌，或者遇到好消息不再上涨时，就该退一步，重新思考了。\n分析师：Christopher Danely、Wayne Loeb、Philip Lee（CFA）。","en":"半导体投资的十五条公理\n1. 不要根据估值来决定买卖。\n2. 半导体公司的管理层，通常无论实际情况如何，都会保持乐观。\n3. 半导体是周期性行业。 不要相信“半导体已经不再具有周期性”的说法。\n4. “City Slickers”法则：半导体股票的走势通常由一个关键因素驱动——你需要做的，就是找出这个因素。\n5. 产品周期通常会把股价和每股收益（EPS）推到比你预期更高的水平，而且持续时间比你预期更长。不幸的是，反过来也成立。\n6. 以牺牲利润率为代价追求营收增长，几乎从来都行不通。\n7. 交货周期延长时买入，交货周期缩短时卖出。\n8. 真正的“这次不一样”极少发生。确实有可能，但非常罕见。\n9. 警惕“问题只会持续一个季度”的说法。\n10. 不要指望或依赖管理层提前判断行业下行——参见第2条。\n11. 收购方对所收购的业务拥有相关经验时，并购的成功率通常最高。如果缺乏相关经验，交易风险就会大幅增加。\n12. 大多数科技公司只擅长做好一件事。当这套商业模式受到冲击或走向衰退时，公司想转型进入另一项业务并取得成功，既非常困难，也极为少见。\n13. 二线公司在下行周期中最先受冲击、受损最重；在上行周期中受益最晚、受益最少。\n14. 投资“价值型”科技股，通常只有在管理层和／或经营方式发生变化时，才会奏效。\n15. 当一只股票遇到坏消息不再下跌，或者遇到好消息不再上涨时，就该退一步，重新思考了。\n分析师：Christopher Danely、Wayne Loeb、Philip Lee（CFA）。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125492666670723248","l":[],"ln":[],"t":["AI科技","财报"],"lk":10,"rt":2,"rp":3,"vw":1449},{"id":"2125491855102198206","h":"dmjk001","ts":1795591722,"zh":"彭博：一位前中国经济高官表示，中美两国将
