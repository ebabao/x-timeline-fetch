id":"2118508835878957334","h":"ReutersChina","ts":1793926841,"zh":"经营一家向欧洲出口服装的中国公司的陈立峰表示，人民币近期的强势使得他的产品变得过于昂贵，几乎吞噬了他的利润率。","en":"Chen Lifeng, who runs a Chinese company exporting dresses to Europe, says the yuan's recent strength has made his products too expensive and all but swallowed his profit margins.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2118508835878957334","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/asia-pacific/chinas-yuan-dilemma-too-weak-abroad-too-strong-home-2026-11-05/?taid=6aed26b95609e00001c61144&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["汇率","财报"],"lk":1,"rt":0,"rp":0,"vw":1236},{"id":"2118507147353117087","h":"fxtrader","ts":1793926438,"zh":"日本首相高市早苗：\n已注意到人工智能及芯片股出现大幅下跌，目前尚难断定此轮跌势是暂时的还是会持续下去。\n市场波动不仅影响到日本，也波及全球各国，因此正密切关注市场动向。\n我们将专注于通过提升日本具备竞争优势的领域，来出台强化经济的举措。","en":"日本首相高市早苗：\n已注意到人工智能及芯片股出现大幅下跌，目前尚难断定此轮跌势是暂时的还是会持续下去。\n市场波动不仅影响到日本，也波及全球各国，因此正密切关注市场动向。\n我们将专注于通过提升日本具备竞争优势的领域，来出台强化经济的举措。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2118507147353117087","l":[],"ln":[],"t":["AI科技"],"lk":26,"rt":0,"rp":6,"vw":14509},{"id":"2118501474733064648","h":"fxtrader","ts":1793925086,"zh":"#行情 日韩股市周五跟随美股抛售，日经225指数跌超5%，较6月高点下跌20%，势将进入技术性熊市。\n韩国KOSPI指数跌破5000点，回吐1月以来涨幅，跌超8%，触发20分钟熔断。KOSDAQ跌超7%，触发5分钟熔断。","en":"#行情 日韩股市周五跟随美股抛售，日经225指数跌超5%，较6月高点下跌20%，势将进入技术性熊市。\n韩国KOSPI指数跌破5000点，回吐1月以来涨幅，跌超8%，触发20分钟熔断。KOSDAQ跌超7%，触发5分钟熔断。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWZsUp4akAA6kZJ.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2118501474733064648","l":[],"ln":[],"t":["美股"],"lk":31,"rt":0,"rp":9,"vw":36353},{"id":"2118499974430503006","h":"cnfinancewatch","ts":1793924728,"zh":"【今日判断】 隔夜美股因民主党中期选举后对AI基建监管趋严的担忧剧烈杀跌，纳指跌5.52%、费城半导体跌约12%、VIX飙升近七成；今早美股期货续弱、富时A50期货日内跌约1.8%。\nA股方面，11月5日两市成交2.12万亿元连续两日站稳2万亿，光伏与端侧AI/AI漫剧双主线领涨、高股息油气煤退潮。\n今日开盘需优先评估海外AI硬件映射冲击与国内稳市政策对冲之间的力量对比，结构上更宜关注“外冷内热”下的国产替代、新能源与应用端机会，谨慎追高隔夜重挫的算力硬件。\n#三大方向\n一、美股AI叙事进入“监管重定价”，A股硬件承压、应用与替代受益 发生了什么：美国中期选举后市场押注国会将放缓数据中心扩张，叠加芯片财报指引偏弱，道指跌3.44%报51523、标普跌4.36%报7353.73、纳指跌5.52%报24315；英伟达跌约9%、特斯拉跌超10%，闪迪跌超22%、美光/西数跌超17%，光通信Lumentum跌超18%。VIX升至约28。今早纳指期货跌超1%、标普期货跌约0.6%。公开报道亦称部分数据中心项目面临冻结预期。\n 为什么重要：这是全球风险资产对“AI资本开支能否顺畅兑现”的一次集中质疑，波动率抬升会压制高估值成长股的风险偏好，并通过亚太半导体链向A股映射。\n 对投资意味着什么：A股光模块、存储、服务器等映射链条短线承压；但若海外算租受限，国产算力与Token出海逻辑可能被重新定价。操作上宜区分“叙事受损的硬件”与“需求仍在的应用/电力/国产替代”，避免一刀切清仓科技。\n二、A股风格切换进入验证：\n光伏+AI应用放量，红利资产失血 发生了什么：11月5日上证涨0.10%报3689.91、深成指涨1.19%报11471.09、创业板涨0.87%报2566.80，超4800只个股上涨，成交2.12万亿。光伏掀涨停潮，国家能源局数据显示9月底光伏装机13.1亿千瓦、已成最大电源品类，新型储能装机同比增63%；端侧AI与AI漫剧走强，红果短剧去重用户达4.3亿。中国石油等油气煤跌幅超6%—7%。两融余额重回约2.3万亿元。\n 为什么重要：量能连续站稳2万亿说明流动性足以支撑风格迁移；民主党胜选强化海外新能源政策预期，与国内装机数据形成共振，华泰等机构亦称风格切换进行时。 对投资意味着什么：短线主线更偏“政策与景气双驱动”的光伏储能、端侧与内容应用；高股息若无新催化可能继续被抽血。需警惕题材拥挤后的兑现风险，尤其AI短剧已有公司提示业务规模仍小、收入占比极低。\n三、稳市与制度供给升温，超聚变IPO成情绪试金石\n 发生了什么：国务院金融工作报告提出支持中央汇金发挥类平准基金作用；央行加力股票回购增持再贷款，A股年内回购已超1500亿元；上交所召开并购重组座谈会。超聚变拟募资约80亿元、11月12日上会。COMEX黄金约4098美元、WTI原油约90.5美元；今晚还将公布美国非农等数据，英国央行已加息至4%。 为什么重要：在外围暴跌背景下，国内稳市与并购工具是对冲外部冲击的关键缓冲；IPO节奏则检验市场对供给的承受力，宏观数据将扰动周末风险偏好。 对投资意味着什么：指数下行空间或受政策托底约束，但结构性分化会加剧。关注回购增持活跃的硬科技、并购预期标的；超聚变上会前后国产算力情绪或剧烈波动，宜控制仓位与交易节奏，周五不追高隔夜重挫品种。\n#散户热议 韭研公社盘前热帖高度集中：昨日热点点名光伏（闽发铝业、永臻股份）、短剧（浙文影业连板）、黄金、机器人、端侧AI与AI营销；\n盘前催化帖热议超聚变11月12日上会、民主党胜选利好新能源/锂电、电力设备受益于“算力买电”、文旅受2027春节连休9天与秋假催化。\n公社整体情绪偏多主题轮动，有帖认为海外算力受限或利好国产替代与Token出海，也有帖直言“这个方向又崩了”，提醒勿盲目接力高位算力。涨停复盘显示资金仍追逐连板与低位补涨，与券商强调盈利验证、风格切换的口径不完全一致——散户更偏事件与情绪交易。\n美股零售端方面，Reddit r/wallstreetbets公开讨论摘要显示对AI抛售严重分歧：一方称监管担忧过度、AMD等业绩仍支撑数据中心、视为半导体逢低买点；另一方吐槽“昨天不慌今天慌”、担心AI资本开支与融资成本，甚至类比科网泡沫。有帖指出零售单日抛售强度接近疫情级，情绪偏恐慌但抄底声仍在。Stocktwits相关报道亦显示有观点认为AI恐惧“做过了”，纳指进入技术性调整区间。总体画像：国内散户偏多主题与国产替代，海外散户对美股AI偏空纠结；与机构“AI中场休整、从算力投入转向回报验证”部分共振，但交易节奏更激进、更易追涨杀跌。\n（北京时间约8:15，数据截至公开可核对来源；不构成投资建议。）","en":"【今日判断】 隔夜美股因民主党中期选举后对AI基建监管趋严的担忧剧烈杀跌，纳指跌5.52%、费城半导体跌约12%、VIX飙升近七成；今早美股期货续弱、富时A50期货日内跌约1.8%。\nA股方面，11月5日两市成交2.12万亿元连续两日站稳2万亿，光伏与端侧AI/AI漫剧双主线领涨、高股息油气煤退潮。\n今日开盘需优先评估海外AI硬件映射冲击与国内稳市政策对冲之间的力量对比，结构上更宜关注“外冷内热”下的国产替代、新能源与应用端机会，谨慎追高隔夜重挫的算力硬件。\n#三大方向\n一、美股AI叙事进入“监管重定价”，A股硬件承压、应用与替 id":"2118348376253313176","h":"CrushTheShorts","ts":1793888584,"zh":"专家说了不少悲观的信息（仅学习，不评价）\nTPU v8i 放量推迟\n谷歌与联发科首次联合开发 TPU v8i，在架构设计、IP 适配和新拓扑验证上遇到较多问题，同时受到 CoWoS 封装和服务器系统设计限制。预计大规模放量将推迟至 2026 年底或 2027 年一季度，比原计划晚约 4—5 个月。\nRubin 交付预期下调\n受 HBM4 稳定性、液冷供电、软件协议和整机验证等问题影响，Rubin 2026 年交付预期已从至少 7000—8000 柜下调至约 4000—5000 柜。真正放量可能要等到 2027 年一季度后半段，明年一季度理想交付量约为 7000—8000 柜。\nRubin 以性能换稳定性\n英伟达下调了 Rubin 的 HBM4 和 NVLink 带宽，同时提高 scale-out 带宽，以集群性能补偿单机柜性能损失。单柜推理性能可能下降约 10%，但训练性能基本维持，同时有助于改善良率、稳定性和量产交付，因此机柜价格预计不会下调。\nHBM 供应向海力士和三星集中\n海力士和三星在英伟达 HBM4 供应中的份额预计分别约为 60% 和 30%，两家公司合计占据绝大多数供应。美光因 16-hi 产品推进失败、12-hi 36GB 产品稳定性和良率不足，预计只能取得约 10% 的第三供应商份额。\nB300 租赁价格快速下跌（但我这边问到海外的算力租赁价格并没有快速下降）\nB300 租赁价格已从每卡时 6—8 美元降至约 5 美元，部分报价甚至降至 4 美元出头，反映供给趋于宽松。由于其在超大模型场景中的性价比不如 GB 系列，客户不愿签长期协议，后续价格支撑仍然有限。\n关于 Marvell 收购 Lumentum\n专家认为收购背后最大的推手是英伟达，英伟达乐见其成，但 Marvell 面临技术路线差异、交割周期过长和整合难度较高等风险。","en":"专家说了不少悲观的信息（仅学习，不评价）\nTPU v8i 放量推迟\n谷歌与联发科首次联合开发 TPU v8i，在架构设计、IP 适配和新拓扑验证上遇到较多问题，同时受到 CoWoS 封装和服务器系统设计限制。预计大规模放量将推迟至 2026 年底或 2027 年一季度，比原计划晚约 4—5 个月。\nRubin 交付预期下调\n受 HBM4 稳定性、液冷供电、软件协议和整机验证等问题影响，Rubin 2026 年交付预期已从至少 7000—8000 柜下调至约 4000—5000 柜。真正放量可能要等到 2027 年一季度后半段，明年一季度理想交付量约为 7000—8000 柜。\nRubin 以性能换稳定性\n英伟达下调了 Rubin 的 HBM4 和 NVLink 带宽，同时提高 scale-out 带宽，以集群性能补偿单机柜性能损失。单柜推理性能可能下降约 10%，但训练性能基本维持，同时有助于改善良率、稳定性和量产交付，因此机柜价格预计不会下调。\nHBM 供应向海力士和三星集中\n海力士和三星在英伟达 HBM4 供应中的份额预计分别约为 60% 和 30%，两家公司合计占据绝大多数供应。美光因 16-hi 产品推进失败、12-hi 36GB 产品稳定性和良率不足，预计只能取得约 10% 的第三供应商份额。\nB300 租赁价格快速下跌（但我这边问到海外的算力租赁价格并没有快速下降）\nB300 租赁价格已从每卡时 6—8 美元降至约 5 美元，部分报价甚至降至 4 美元出头，反映供给趋于宽松。由于其在超大模型场景中的性价比不如 GB 系列，客户不愿签长期协议，后续价格支撑仍然有限。\n关于 Marvell 收购 Lumentum\n专家认为收购背后最大的推手是英伟达，英伟达乐见其成，但 Marvell 面临技术路线差异、交割周期过长和整合难度较高等风险。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2118348376253313176","l":[],"ln":[],"t":["AI科技"],"lk":4,"rt":0,"rp":0,"vw":506},{"id":"2118347977752236166","h":"business","ts":1793888489,"zh":"英国央行自2023年以来首次加息\n州长安德鲁·贝利表示，除非伊朗战争得到解决，否则可能会进一步加息","en":"The Bank of England raised rates for the first www.bloomberg.com/news/articles/2026-11-05/craft-beer-makers-strain-on-both-sides-of-us-canada-trade-clash?taid=6aec7b7f49b1f20001e676f0&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":1,"rp":0,"vw":13287},{"id":"2118324318975488490","h":"cnfinancewatch","ts":1793882848,"zh":"华尔街观察-A股收盘点评 | 2026年11月5日\n沪指微涨，光伏涨停潮与机器人午后共振，高低切换指向景气确定性\n一、市场概览\n沪指涨0.10%报3689.91点，深成指涨1.19%，创业板指冲高回落涨0.87%，盘中一度涨超3%。两市成交2.12万亿元，连续第二日站稳2万亿上方，超4800只个股上涨，涨停84家、跌停0家。盘面核心矛盾是极致的高低切换：高股息红利持续走弱，中国石油跌超8%，而资金并未离场，转而涌入光伏设备与机器人两条主线，形成了“传统能源退、新能源与智能制造进”的鲜明格局。\n二、光伏：海外政策确定性与国内技术迭代共振，涨停潮并非单纯超跌反弹\n光伏设备申万二级行业涨8.45%，主力净流入32.36亿元，盘中最多17只个股封板，收盘11只封板。驱动逻辑已从情绪修复切换至基本面预期的实质性重估。\n海外侧，美国中期选举民主党拿下参众两院，IRA框架下光伏、储能税收抵免的“悬崖效应”被打消，2026年7月4日的开工硬节点反而倒逼抢装窗口前移。补贴确定性提升直接改善项目可融资性，美国2026年光伏新增装机预期约48.9GW，中长期装机曲线具备上修基础。国内侧，北京“十五五”新型能源体系规划聚焦钙钛矿电池及高效组件研发制造，政策指向明确；三季度国内新增装机38.76GW、同比增38%，需求呈现“淡季不淡”特征。\n个股梯队呈现清晰的强度分层：\n贝特利（301697） 20CM两连板，叠加光伏银粉与半导体材料属性，在20CM梯队中具备身位优势；\n时创能源（688429）、金刚光伏（300093） 同属20CM涨停，分别对应叠栅技术与异质结方向，弹性突出。\n10CM梯队中，中利集团（002309）、弘元绿能（603185）、钧达股份（002865） 早盘先后封板，协鑫集成（002506） 跟随涨停，龙头封板顺序与筹码稳定性是次日观察持续性的关键信号。\n酉立智能（ 以29.99%幅度封板，北交所弹性品种在情绪高潮期提供了额外的高度参照。\n需要正视的是，行业整体仍处深度亏损区间，前三季度八大龙头合计净亏损约277亿元。本轮行情的本质是政策确定性修复下的估值修复与抢装预期博弈，而非盈利拐点的全面确认。 持续性取决于美国装机预期能否兑现为实际订单，以及国内供给侧出清节奏。\n三、机器人：量产叙事从“送样”进入“进厂”，午后封板质量优于早盘情绪扩散\n人形机器人板块收涨1.71%，主力净流入26.11亿元，游资与散户合计净流出约26.12亿元，筹码结构呈现“主力吸筹、短线资金兑现”的特征。午后板块再度拉升，\n肇民科技（301000） 20CM涨停领涨，模塑科技（000700） 直线封板，封单最高近45万手，近10个交易日涨幅已近39%。福莱新材（605488） 与春光科技（603657） 双双斩获2连板，前者叠加物理AI数据采集手套与散热材料标签，后者锚定具身机器人与小米链，在连板梯队中辨识度靠前。\n催化密度是今日机器人区别于普通题材轮动的核心：\n京东抛出未来5年300万台机器人采购计划，\n特斯拉Optimus V3处于准备大规模生产阶段，\n宇树科技王兴兴明确“明年是行业临界点、具身智能将迎来ChatGPT时刻”。\n行业评价标准正从“出货数量”向“有效智能工时”迁移，意味着订单逻辑开始接受实际作业价值的检验，纯概念映射的估值扩张空间正在收窄，具备核心零部件定点或场景闭环能力的标的将获得溢价。\n四、策略提示\n光伏与机器人今日的共性在于催化均具备可追溯的产业锚点，而非单纯的情绪脉冲。但两者的筹码阶段不同：\n光伏处于涨停潮扩散后的次日分化窗口，重点观察早盘封板核心的溢价与承接；\n机器人午后拉升的封板质量相对更优，主力净流入结构亦更为健康。在成交额维持2万亿的流动性环境下，两条主线具备并行轮动的资金基础，但需警惕高位品种在情绪高潮后的兑现压力。\n风险提示： 美国清洁能源政策落地节奏不及预期；光伏供给侧出清慢于预期；人形机器人量产进度与订单兑现存在不确定性；短期涨幅过大品种面临交易拥挤风险。","en":"华尔街观察-A股收盘点评 | 2026年11月5日\n沪指微涨，光伏涨停潮与机器人午后共振，高低切换指向景气确定性\n一、市场概览\n沪指涨0.10%报3689.91点，深成指涨1.19%，创业板指冲高回落涨0.87%，盘中一度涨超3%。两市成交2.12万亿元，连续第二日站稳2万亿上方，超4800只个股上涨，涨停84家、跌停0家。盘面核心矛盾是极致的高低切换：高股息红利持续走弱，中国石油跌超8%，而资金并未离场，转而涌入光伏设备与机器人两条主线，形成了“传统能源退、新能源与智能制造进”的鲜明格局。\n二、光伏：海外政策确定性与国内技术迭代共振，涨停潮并非单纯超跌反弹\n光伏设备申万二级行业涨8.45%，主力净流入32.36亿元，盘中最多17只个股封板，收盘11只封板。驱动逻辑已从情绪修复切换至基本面预期的实质性重估。\n海外侧，美国中期选举民主党拿下参众两院，IRA框架下光伏、储能税收抵免的“悬崖效应”被打消，2026年7月4日的开工硬节点反而倒逼抢装窗口前移。补贴确定性提升直接改善项目可融资性，美国2026年光伏新增装机预期约48.9GW，中长期装机曲线具备上修基础。国内侧，北京“十五五”新型能源体系规划聚焦钙钛矿电池及高效组件研发制造，政策指向明确；三季度国内新增装机38.76GW、同比增38%，需求呈现“淡季不淡”特征。\n个股梯队呈现清晰的强度分层：\n贝特利（301697） 20CM两连板，叠加光伏银粉与半导体材料属性，在20CM梯队中具备身位优势；\n时创能源（688429）、金刚光伏（300093） 同属20CM涨停，分别对应叠栅技术与异质结方向，弹性突出。\n10CM梯队中，中利集团（002309）、弘元绿能（603185）、钧达股份（002865） 早盘先后封板，协鑫集成（002506） 跟随涨停，龙头封板顺序与筹码稳定性是次日观察持续性的关键信号。\n酉立智能（ 以29.99%幅度封板，北交所弹性品种在情绪高潮期提供了额外的高度参照。\n需要正视的是，行业整体仍处深度亏损区间，前三季度八大龙头合计净亏损约277亿元。本轮行情的本质是政策确定性修复下的估值修复与抢装预期博弈，而非盈利拐点的全面确认。 持续性取决于美国装机预期能否兑现为实际订单，以及国内供给侧出清节奏。\n三、机器人：量产叙事从“送样”进入“进厂”，午后封板质量优于早盘情绪扩散\n人形机器人板块收涨1.71%，主力净流入26.11亿元，游资与散户合计净流出约26.12亿元，筹码结构呈现“主力吸筹、短线资金兑现”的特征。午后板块再度拉升，\n肇民科技（301000） 20CM涨停领涨，模塑科技（000700） 直线封板，封单最高近45万手，近10个交易日涨幅已近39%。福莱新材（605488） 与春光科技（603657） 双双斩获2连板，前者叠加物理AI数据采集手套与散热材料标签，后者锚定具身机器人与小米链，在连板梯队中辨识度靠前。\n催化密度是今日机器人区别于普通题材轮动的核心：\n京东抛出未来5年300万台机器人采购计划，\n特斯拉Optimus V3处于准备大规模生产阶段，\n宇树科技王兴兴明确“明年是行业临界点、具身智能将迎来ChatGPT时刻”。\n行业评价标准正从“出货数量”向“有效智能工时”迁移，意味着订单逻辑开始接受实际作业价值的检验，纯概念映射的估值扩张空间正在收窄，具备核心零部件定点或场景闭环能力的标的将获得溢价。\n四、策略提示\n光伏与机器人今日的共性在于催化均具备可追溯的产业锚点，而非单纯的情绪脉冲。但两者的筹码阶段不同：\n光伏处于涨停潮扩散后的次日分化窗口，重点观察早盘封板核心的溢价与承接；\n机器人午后拉升的封板质量相对更优，主力净流入结构亦更为健康。在成交额维持2万亿的流动性环境下，两条主线具备并行轮动的资金基础，但需警惕高位品种在情绪高潮后的兑现压力。\n风险提示： 美国清洁能源政策落地节奏不及预期；光伏供给侧出清慢于预期；人形机器人量产进度与订单兑现存在不确定性；短期涨幅过大品种面临交易拥挤风险。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2118324318975488490","l":["920007.BJ）"],"ln":[{"u":"http://920007.BJ）","d":"920007.BJ）"}],"t":["A股港股","AI科技"],"lk":2,"rt":0,"rp":3,"vw":1566},{"id":"2118323720661926294","h":"business :1793882463,"zh":"🎧 今天：民主党决定性的中期胜利重塑了华盛顿。这种新的权力平衡对市场、经济、贸易、监管和您的资金意味着什么？\n我们的记者将在美国东部时间上午 9:45 进行现场问答，回答您的问题。在这里加入：","en":"🎧 TODAY: Democrats’ decisive midterm victory has reshaped Washington. What could this new balance of power mean for markets, the economy, trade, regulation and your money?\nOur journalists answer your questions in a Live Q&A at 9:45 a.m. EST. Join here:","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HWXLRaGWgAABUX-.jpg?name=orig"],"u":"https://x.com/business/status/2118322701689385398","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/4sQ0z1y","d":"bloom.bg"}],"t":["关税贸易"],"lk":1,"rt":0,"rp":0,"vw":8159},{"id":"2118322486974599232","h":"business","ts":1793882412,"zh":"阿达尼港口和经济特区宣布收购总部位于荷兰的 Evos 100% 股权，使这家印度港口运营商在欧洲主要能源中心站稳脚跟 n?taid=6aec792c93ecc90001e9f9ea&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"Adani Ports and Special Economic Zone announced the acquisition of a 100% stake in Netherlands-headquartered Evos, giving the Indian port operator a foothold in Europe’s key energy hub","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2118322486974599232","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-05/adani-ports-to-buy-europe-s-evos-in-deal-valued-at-2-9-billion?taid=6aec792c93ecc90001e9f9ea&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["原油能源"],"lk":3,"rt":0,"rp":0,"vw":7539},{"id":"2118322183089119505","h":"cnfinancewatch","ts":1793882339,"zh":"【国泰海通食饮】出清延续，筑底蓄力——食饮板块三季报总结\n投资建议：板块整体承压，白酒降幅最大阶段过去，配置价值凸显，大众品相对平稳，但成本压力显现\n1）白酒最大调整阶段过去，地产酒率先见底，高端白酒陆续见底，推荐贵州茅台、迎驾贡酒、今世缘以及深度调整、即将出清标的，泸州老窖、古井贡酒、山西汾酒、五粮液；\n2）调味品、餐供具备量价回升弹性，推荐海天味业、颐海国际、安琪酵母、宝立食品、安井食品、千禾味业、巴比食品；\n3）产业上行周期健康食品及部分零食，推荐百龙创园、西麦食品、H&H控股、中烟香港、鲟龙科技、盐津铺子、洽洽食品、鸣鸣很忙、万辰集团、卫龙美味、劲仔食品；\n4）啤酒悲观预期反应较充分，推荐百润股份、华润啤酒、青岛啤酒、珠江啤酒；\n5）饮料成长推荐农夫山泉、东鹏饮料，高股息推荐中国食品、康师傅控股、统一企业中国；\n6）乳制品推荐伊利股份、蒙牛乳业、新乳业、三元股份、优然牧业、现代牧业、妙可蓝多\n#食品饮料：26Q3白酒跌幅收窄、大众品成本压力增大Q3食饮板块收入2331亿元、同比-3%，净利润376亿元、同比-16%，跌幅相较26Q2小幅收窄与此前相比，我们看到Q3食饮子版块展现出来的趋势有所不同，收入端白酒等高端品仍对食饮板块有较为明显的拖累，但利润端高端品好于大众品此前我们看到，大众品板块出清时间更早，25Q4已开始有改善信号、时点早于白酒，然而进入26Q3成本端受地缘、气候等因素影响有所上涨，对利润的影响加剧；相比之下，白酒出清较晚，在经历多个季度的双位数下滑后，26Q3报表端跌幅开始收窄尽管白酒报表尚未完全修复，但去库动作是持续性的，行业迈向良性经营，白酒报表压力逐步卸下后有望迎来拐点，且考虑预期先行，市场有望提前开始交易拐点\n #大众品需求边际走弱，成本端压力初显：\n1）软饮料增长放缓，新品类仍贡献增量，26Q3收入、利润分别同比+1%、-13%，收入扩张向利润兑现传导有所减弱；\n2）调味品与餐饮供应链表现分化，26Q3餐饮供应链调味品、速冻板块收入同比+6%、+8%，利润端同比-9%、+3%；\n3）乳制品收入温和修复，利润改善仍需时间，26Q3收入同比持平、利润-6%；\n4）啤酒边际需求偏弱，零食品类变化加速，26Q2收入分别同比-4%、持平；利润端分别-12%、-36%\n#白酒报表加速出清，区域龙头率先修复：行业报表出清已连续7个季度，26Q3趋势延续，行业收入、利润同比-10%、-13%，行业筑底已接近完成，部分提前出清、动销与渠道健康的公司将有率先表现机会茅台26Q3收入、利润分别同比+3%、+4%，部分出清较早、包袱较轻、动销较优的酒企在26Q3延续报表的同比增长，如迎驾贡酒、今世缘，且利润好于收入，我们认为周期终会回摆，当下的调整或已接近尾声","en":"【国泰海通食饮】出清延续，筑底蓄力——食饮板块三季报总结\n投资建议：板块整体承压，白酒降幅最大阶段过去，配置价值凸显，大众品相对平稳，但成本压力显现\n1）白酒最大调整阶段过去，地产酒率先见底，高端白酒陆续见底，推荐贵州茅台、迎驾贡酒、今世缘以及深度调整、即将出清标的，泸州老窖、古井贡酒、山西汾酒、五粮液；\n2）调味品、餐供具备量价回升弹性，推荐海天味业、颐海国际、安琪酵母、宝立食品、安井食品、千禾味业、巴比食品；\n3）产业上行周期健康食品及部分零食，推荐百龙创园、西麦食品、H&H控股、中烟香港、鲟龙科技、盐津铺子、洽洽食品、鸣鸣很忙、万辰集团、卫龙美味、劲仔食品；\n4）啤酒悲观预期反应较充分，推荐百润股份、华润啤酒、青岛啤酒、珠江啤酒；\n5）饮料成长推荐农夫山泉、东鹏饮料，高股息推荐中国食品、康师傅控股、统一企业中国；\n6）乳制品推荐伊利股份、蒙牛乳业、新乳业、三元股份、优然牧业、现代牧业、妙可蓝多\n#食品饮料：26Q3白酒跌幅收窄、大众品成本压力增大Q3食饮板块收入2331亿元、同比-3%，净利润376亿元、同比-16%，跌幅相较26Q2小幅收窄与此前相比，我们看到Q3食饮子版块展现出来的趋势有所不同，收入端白酒等高端品仍对食饮板块有较为明显的拖累，但利润端高端品好于大众品此前我们看到，大众品板块出清时间更早，25Q4已开始有改善信号、时点早于白酒，然而进入26Q3成本端受地缘、气候等因素影响有所上涨，对利润的影响加剧；相比之下，白酒出清较晚，在经历多个季度的双位数下滑后，26Q3报表端跌幅开始收窄尽管白酒报表尚未完全修复，但去库动作是持续性的，行业迈向良性经营，白酒报表压力逐步卸下后有望迎来拐点，且考虑预期先行，市场有望提前开始交易拐点\n #大众品需求边际走弱，成本端压力初显：\n1）软饮料增长放缓，新品类仍贡献增量，26Q3收入、利润分别同比+1%、-13%，收入扩张向利润兑现传导有所减弱；\n2）调味品与餐饮供应链表现分化，26Q3餐饮供应链调味品、速冻板块收入同比+6%、+8%，利润端同比-9%、+3%；\n3）乳制品收入温和修复，利润改善仍需时间，26Q3收入同比持平、利润-6%；\n4）啤酒边际需求偏弱，零食品类变化加速，26Q2收入分别同比-4%、持平；利润端分别-12%、-36%\n#白酒报表加速出清，区域龙头率先修复：行业报表出清已连续7个季度，26Q3趋势延续，行业收入、利润同比-10%、-13%，行业筑底已接近完成，部分提前出清、动销与渠道健康的公司将有率先表现机会茅台26Q3收入、利润分别同比+3%、+4%，部分出清较早、包袱较轻、动销较优的酒企在26Q3延续报表的同比增长，如迎驾贡酒、今世缘，且利润好于收入，我们认为周期终会回摆，当下的调整或已接近尾声","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/21183221 盛-6.26%，东山精密-6.13%。承接方向：阳光电源+4.67%，通富微电+7.25%，长电科技+4.10%，有研新材+10.00%。南向资金净卖出扩大至70亿港元。11月4日龙虎榜机构净买入集中于银之杰（4.64亿）、冰山冷热（1.98亿）等中小盘，未见AI硬件权重，机构对高位AI硬件态度谨慎。机构买入与散户热度明显错位，涨停股追高需谨慎。\n#期货 #外盘 隔夜美股道指+3.03%、标普+1.58%、纳指+1.44%，选举驱动价值周期强于科技。但纳指期货因疲弱芯片财报下滑逾1%，亚太半导体链集体重挫：KOSPI跌超6%，SK海力士跌逾10%，三星跌超8%，台股收低3.2%，日经跌幅扩大至2%，港股长飞光纤跌超15%。\n#中美日韩映射 美股\"选举红利\"未能传导至亚太半导体，反而韩台半导体杀跌经港股AI硬件传导至A股光模块/PCB。海外散户热议 $MU $NVDA $SMCI，方向偏谨慎。市场在交易\"估值消化\"而非\"业绩证伪\"，这是今日最需警惕的研报与股价背离。\n#三个方向\n锂电/储能：研报、行情、人气三重共振，今日最扎实的方向。\n半导体封测与材料/存储：存储供需逻辑获资金追捧，但需与光模块/PCB权重区分。\n消费低位修复：空头回补逻辑成立，但资金尚未形成合力，宜跟踪龙虎榜确认。\n#六只个股 $300750 宁德时代：锂电景气研报支撑，今日+4.48%领涨权重。 $300274 阳光电源：新能源同向共振，人气榜第7、+4.67%。 $002156 通富微电：封测端获资金追捧，+7.25%。 $600584 长电科技：封测龙头，存储与算力链承接，+4.10%。 $600206 有研新材：半导体材料局部活跃，人气榜第4。 $000858 五粮液：消费空头回补逻辑代表，温和跟随+0.88%。\n#操作提示 尾盘中性偏空，关注AI硬件能否止跌。不追人气涨停股，不抄光模块权重下跌，等亚太半导体企稳与南向资金转向再加仓。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅  以上仅为信息整理，不构成投资建议。","en":"【A股盘中要点｜11月5日 14:30】\n结论先行：今日不适合追高买入。\n盘面为\"结构性偏空、非系统性偏空\"，AI硬件权重遭集中兑现，资金向锂电、半导体封测材料与低位题材扩散。操作上宜守不宜攻，仅可在研报与资金共振方向轻仓低吸，回避人气榜上缺乏机构背书的涨停股。\n#盘面 截至14:30，上证3682.67（-0.09%），深成指11458.43（+1.08%），创业板指2562.69（+0.71%），科创50 1285.93（+1.62%），沪深300 4106.79（+0.13%）。沪弱深强、权重搭台成长唱戏。最关键信号：创业板指早盘一度涨超3%，午后大幅回吐，中际旭创、新易盛、天孚通信等权重领跌。宁德时代+4.48%是创业板指未翻绿的核心支撑。\n#消息面 国资委表态加快培育壮大新兴产业和未来产业，与科创50领涨方向一致。美国民主党在中期选举中大获全胜，重新夺回参众两院，\"选举交易\"向新能源、光伏边框、医药外溢。低位事件驱动活跃：深圳APEC、乌镇大会银发AI穿戴等题材被资金挖掘。\n#研报面 中信：2027年锂电景气上行，动力电池与储能需求共振；存储供不应求有望延续至2028年及以后；消费板块低位、持仓低、存在空头平仓正向影响；2027年A股行情宽度拓展，\"在AI之外寻找机会\"。 中信建投：通信板块前三季度归母净利+8.32%，GPU/ASIC净利+720%，Q3 PCB上游+661%，基本面高增与股价杀跌形成反差；医疗器械Q3超预期。 华泰：银行稳健配置、券商2027战略配置，但当日招行-0.40%、平安银行-1.02%，短期背离；智能戒指仍处验证阶段，尚未全面放量。\n#资金面 AI硬件集中流出：人气榜第1名中际旭创-8.16%，新易盛-6.26%，东山精密-6.13%。承接方向：阳光电源+4.67%，通富微电+7.25%，长电科技+4.10%，有研新材+10.00%。南向资金净卖出扩大至70亿港元。11月4日龙虎榜机构净买入集中于银之杰（4.64亿）、冰山冷热（1.98亿）等中小盘，未见AI硬件权重，机构对高位AI硬件态度谨慎。机构买入与散户热度明显错位，涨停股追高需谨慎。\n#期货 #外盘 隔夜美股道指+3.03%、标普+1.58%、纳指+1.44%，选举驱动价值周期强于科技。但纳指期货因疲弱芯片财报下滑逾1%，亚太半导体链集体重挫：KOSPI跌超6%，SK海力士跌逾10%，三星跌超8%，台股收低3.2%，日经跌幅扩大至2%，港股长飞光纤跌超15%。\n#中美日韩映射 美股\"选举红利\"未能传导至亚太半导体，反而韩台半导体杀跌经 42","h":"business","ts":1793836810,"zh":"德国国防公司莱茵金属第二次下调了 2026 年的销售目标，理由是 Boxer 装甲车项目出现延误，该项目将把订单推迟到明年。","en":"German defense firm Rheinmetall cut its 2026 sales target for the second time, citing delays with the Boxer armored vehicle program that would push orders into next year.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2118131221976744342","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-04/rheinmetall-cuts-sales-guidance-again-on-delays-to-boxer-vehicle?taid=6aebc70a8c7f590001b44960&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":1,"rt":2,"rp":1,"vw":14963},{"id":"2118123530810470622","h":"cnfinancewatch","ts":1793834977,"zh":"AI硬件（费半）业绩好恰恰是它的原罪\n是下跌的原因，越是业绩好，越是让市场不敢按照业绩估值\n市场用周期股定义AI硬件，在业绩好的时候兑现股价出高点，是因为他们觉得这个业绩不可持续，高增长已经见顶\n现在是要你证明这个增长同比环比都不能衰退","en":"AI硬件（费半）业绩好恰恰是它的原罪\n是下跌的原因，越是业绩好，越是让市场不敢按照业绩估值\n市场用周期股定义AI硬件，在业绩好的时候兑现股价出高点，是因为他们觉得这个业绩不可持续，高增长已经见顶\n现在是要你证明这个增长同比环比都不能衰退","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWUWHrbaEAA2obt.jpg?name=orig","https://pbs.twimg.com/media/HWUWHrcbsAEoKTp.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2118123530810470622","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":3305},{"id":"2118122766612431047","h":"cnfinancewatch","ts":1793834795,"zh":"我一直说形势严峻\n很多人不理解\nAI竞争事关未来国力，犹如新时代的星球大战\n限制必然越来越近：中国的亦步亦趋策略咄咄逼人，但也不得不为\n两方没有多少退路","en":"我一直说形势严峻\n很多人不理解\nAI竞争事关未来国力，犹如新时代的星球大战\n限制必然越来越近：中国的亦步亦趋策略咄咄逼人，但也不得不为\n两方没有多少退路","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2118122766612431047","l":[],"ln":[],"t":[],"lk":10,"rt":2,"rp":3,"vw":6334},{"id":"2118122031275540562","h":"cnfinancewatch","ts":1793834619,"zh":"五大机构研报（窗口内）\n（一）华泰证券，2026-11-04，《华泰证券张继强：稳市工具迈向长期制度安排 增量资金与中长期资金协同发力》，核心观点为资本市场稳定机制由阶段性应对转向长期制度安排，政策效能加快显现。\n（二）中信建投，2026-11-04，《中信建投：医疗器械与服务板块Q3多家公司超预期 看好2027年业绩改善趋势》，核心观点为医疗器械板块Q3收入延续增长、利润连续两季正增长，龙头业绩超预期且2027年加速。\n（三）中信证券，2026-11-04，《中信证券：展望2027年锂电行业整体景气度料将迎来上行》，核心观点为动力电池需求高景气延续、储能国内外需求共振向上。\n（四）华泰证券，2026-11-04，《华泰证券：智能戒指仍处品牌与场景验证阶段 尚未进入供应链全面放量期》，核心观点为智能戒指出货增长但仅相当于智能手表约4%，尚未全面放量。\n（五）中信证券，2026-11-04，《中信证券：2027年A股行情宽度有望拓展 非AI板块存在结构性修复机会》，核心观点为行情宽度拓展、非AI板块结构性修复，建议围绕稳健回报、优秀出海制造业、内需修复布局。\n（六）中信证券，2026-11-03，《中信证券A股市场2027年投资策略：调整前置，转机将现》，核心观点为调整已前置、明年结构性转机增多，稳健回报策略相对景气策略更占优。\n（七）中信建投，2026-11-03，《中信建投：AI需求高景气驱动功率半导体迈向新周期》，核心观点为AIDC与新能源车驱动功率半导体涨价，SiC适配高压直流化迭代。\n（八）中金公司，2026-11-03，《中金公司：A股市场中期向好趋势未变》，核心观点为本轮调整外部扰动偏短期，市场已反映过度悲观预期，中期向好趋势未变。\n八、研报互证（近一个月）\n（一）方向一，半导体设备与存储封测，互证结论为月内单一支撑。支撑研报为中信建投2026-11-03《中信建投：AI需求高景气驱动功率半导体迈向新周期》，该研报指向功率半导体而非设备本体，逻辑部分一致但非直接覆盖，维持原权重。\n（二）方向二，贵金属矿业，互证结论为月内无支撑。近一个月五大机构研报库中无黄金铜稀土小金属方向研报，权重下调；同时该方向与A股去重榜前10不符，仅与美股去重榜第9的XLB映射，按规则下调权重并降为观察。\n（三）方向三，创新药基因，互证结论为月内强支撑。支撑研报为中信建投2026-11-04《中信建投：医疗器械与服务板块Q3多家公司超预期 看好2027年业绩改善趋势》与中信建投2026-11-02《中信建投：中国创新药持续突破 竞争与差异化并存》，两家研报指向同一方向，方向权重上调一档。\n（四）主选股凯莱英，互证结论为月内单一支撑。中信建投2026-11-02《中信建投：中国创新药持续突破 竞争与差异化并存》覆盖创新药方向，未直接点名凯莱英，逻辑一致，维持原权重。\n（五）主选股华海药业，互证结论为月内单一支撑。中信建投2026-11-02《中信建投：中国创新药持续突破 竞争与差异化并存》覆盖创新药方向，未直接点名华海药业，逻辑一致，维持原权重。\n（六）主选股拓荆科技，互证结论为月内无支撑。近一个月五大机构研报无直接覆盖拓荆科技或半导体设备本体，仅有功率半导体方向研报，权重下调。\n（七）被研报否掉的方向或个股：贵金属矿业方向因近一个月五大机构无研报覆盖且与A股去重榜不符，按规则剔除出可执行方向，仅列观察；能源油气方向因油价重挫超8%与中信证券2026-11-02《中信证券：预计原油价格在低库存与高扰动预期下依然易涨难跌》观点相悖，以真实行情数据为准，研报观点已滞后，该方向剔除。\n（八）权重调整结果：创新药基因上调一档为最高权重，半导体设备与存储封测维持原权重，贵金属矿业下调并降为观察。","en":"五大机构研报（窗口内）\n（一）华泰证券，2026-11-04，《华泰证券张继强：稳市工具迈向长期制度安排 增量资金与中长期资金协同发力》，核心观点为资本市场稳定机制由阶段性应对转向长期制度安排，政策效能加快显现。\n（二）中信建投，2026-11-04，《中信建投：医疗器械与服务板块Q3多家公司超预期 看好2027年业绩改善趋势》，核心观点为医疗器械板块Q3收入延续增长、利润连续两季正增长，龙头业绩超预期且2027年加速。\n（三）中信证券，2026-11-04，《中信证券：展望2027年锂电行业整体景气度料将迎来上行》，核心观点为动力电池需求高景气延续、储能国内外需求共振向上。\n（四）华泰证券，2026-11-04，《华泰证券：智能戒指仍处品牌与场景验证阶段 尚未进入供应链全面放量期》，核心观点为智能戒指出货增长但仅相当于智能手表约4%，尚未全面放量。\n（五）中信证券，2026-11-04，《中信证券：2027年A股行情宽度有望拓展 非AI板块存在结构性修复机会》，核心观点为行情宽度拓展、非AI板块结构性修复，建议围绕稳健回报、优秀出海制造业、内需修复布局。\n（六）中信证券，2026-11-03，《中信证券A股市场2027年投资策略：调整前置，转机将现》，核心观点为调整已前置、明年结构性转机增多，稳健回报策略相对景气策略更占优。\n（七）中信建投，2026-11-03，《中信建投：AI需求高景气驱动功率半导体迈向新周期》，核心观点为AIDC与新能源车驱动功率半导体涨价，SiC适配高压直流化迭代。\n（八）中金公司，2026-11-03，《中金公司：A股市场中期向好趋势未变》，核心观点为本轮调整外部扰动偏短期，市场已反映过度悲观预期，中期向好趋势未变。\n八、研报互证（近一个月）\n（一）方向一，半导体设备与存储封测，互证结论为月内单一支撑。支撑研报为中信建投2026-11-03《中信建投：AI需求高景气驱动功率半导体迈向新周期》，该研报指向功率半导体而非设备本体，逻辑部分一致但非直接覆盖，维持原权重。\n（二）方向二，贵金属矿业，互证结论为月内无支撑。近一个月五大机构研报库中无黄金铜稀土小金属方向研报，权重下调；同时该方向与A股去重榜前10不符，仅与美股去重榜第9的XLB映射，按规则下调权重并降为观察。\n（三）方向三，创新药基因，互证结论为月内强支撑。支撑研报为中信建投2026-11-04《中信建投：医疗器械与服务板块Q3多家公司超预期 看好2027年业绩改善趋势》与中信建投2026-11-02《中信建投：中国创新药持续突破 竞争与差异化并存》，两家研报指向同一方向，方向权重上调一档。\n（四）主选股凯莱英，互证结论为月内单一支撑。中信建投2026-11-02《中信建投：中国创新药持续突破 竞争与差异化并存》覆盖创新药方向，未直接点名凯莱英，逻辑一致，维持原权重。\n（五）主选股华海药业，互证结论为月内单一支撑。中信建投2026-11-02《中信建投：中国创新药持续突破 竞争与差异化并存》覆盖创新药方向，未直接点名华海药业，逻辑一致，维持原权重。\n（六）主选股拓荆科技，互证结论为月内无支撑。近一个月五大机构研报无直接覆盖拓荆科技或半导体设备本体，仅有功率半导体方向研报，权重下调。\n（七）被研报否掉的方向或个股：贵金属矿业方向因近一个月五大机构无研报覆盖且与A股去重榜不符，按规则剔除出可执行方向，仅列观察；能源油气方向因油价重挫超8%与中信证券2026-11-02《中信证券：预计原油价格在低库存与高扰动预期下依然易涨难跌》观点相悖，以真实行情数据为准，研报观点已滞后，该方向剔除。\n（八）权重调整结果：创新药基因上调一档为最高权重，半导体设备与存储封测维持原权重，贵金属矿业下调并降为观察。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2118122031275540562","l":[],"ln":[],"t":["美股","原油能源","AI科技","黄金"],"lk":0,"rt":0,"rp":0,"vw":1841},{"id":"2118121163864023151","h":"cnfinancewatch","ts":1793834412,"zh":"【A股盘前｜11月5日 06:55】\n结论：今日适合小仓条件单买入，不宜重仓追高。环境分62分、档位“可做”，单票不超两成仓、总进攻仓不超五成。\n理由有三：\n其一，隔夜美股普涨，道指+3.03%、标普+1.58%、纳指+1.44%，道指创44年来中期选举后最大单日涨幅，外盘无负面冲击；\n其二，上证、沪深300、中证500、中证1000均站上5日与10日线，但全部位于20日线下方，属短期反弹、中期未确认；\n其三，创新药基因获美股IHI映射（昨+6.72%、20日+18.19%）与中信建投双研报强支撑，权重最高；半导体设备靠A股自身资金，贵金属矿业无研报支撑降为观察，宁缺不凑。\n邮件明确不做：已加速标的不追高（拓荆科技昨+20.00%、华海清科+17.97%、中微公司+16.62%，仅回踩低吸）；次新C皇冠新材001381；只有传闻无资金（龙溪股份）；能源油气（油价重挫超8%）；韩日数据缺失方向不加权；超大盘（紫金矿业、北方华创、中际旭创、宁德时代）；成交清淡（招商银行、中谷物流）。\n#共振梳理 创新药基因：美股映射确认+A股中药ETF同步走强+研报月内强支撑，三项共振。 半导体设备与存储封测：美股无直接映射、韩日待确认、研报单一间接支撑，主要靠A股资金。 贵金属矿业：美股GDXJ昨+9.62%确认，但近一月五大机构无研报、A股ETF未进榜，降为观察。\n#消息面 10月中国大宗商品价格指数137.0点，同比+21.0%，利好贵金属与能化； 千亿元互换便利助力逆周期布局，利好券商与宽基； 基金年内分红超1300亿元，红利风格偏多； 10月电商物流指数112.1点，环比+0.2点； 高通预计下季度手机业务营收环比降中个位数，消费电子偏空； 油价重挫超8%，压制油气、利好航运油运成本端； 美股零售$XRT昨+5.54%、必需消费$XLP昨+3.36%，但A股消费ETF昨普遍-1%以上，需看承接。\n#研报面 中信建投11/4：医疗器械与服务Q3多家超预期，看好2027年业绩改善； 中信建投11/2：中国创新药持续突破； 中信建投11/3：AI需求驱动功率半导体新周期（非设备本体）； 华泰11/4：稳市工具迈向长期制度安排； 中信证券11/4：2027年锂电景气上行、A股行情宽度拓展； 中金11/3：A股中期向好趋势未变。 原油“易涨难跌”研报与油价重挫相悖，以行情为准，能源方向剔除。\n#资金面 龙虎榜：银之杰涨停机构净买4.64亿、冰山冷热机构净买1.98亿、索辰科技游资净买1.73亿，涨停溢价尚可。 风格：中证500、中证1000相对MA5偏离+3.18%、+3.03%，高于沪深300的+1.75%，属小盘修复。宽基与红利ETF扎堆最重，属配置型资金。\n#期货 期货升贴水邮件未获取，不外推。\n#中美映射 美股IHI→A股创新药CXO器械，已走强，权重最高； 美股XRT→A股品牌消费，映射正确但A股未承接，权重下调； 美股ITB、XHB、KIE、XLB→A股基建、地产、券商、黄金，均未进A股榜前十，仅作补涨观察； 日经225 62188.63（-1.42%），KOSPI 5683.80（+0.62%），日韩板块数据均为+0.00%，属数据缺失，不作确认、不外推。\n#三个方向 1️⃣创新药基因：美股映射+研报双支撑，最高权重，只做回踩低吸。 2️⃣半导体设备与存储封测：A股资金主导，高位股仍在出清（新易盛5日-23.48%），小仓试错。 3️⃣贵金属矿业：大宗价格指数同比+21.0%催化，个股已有涨停动作，但中线口径降为观察，仅短线口径可参与。\n#六只个股 ✅凯莱英$002821：创新药龙一，5日+9.23%，昨涨停收148.84；不破145回踩缩量低吸，失效140，压力160，概率中高。 ✅华海药业$600521：创新药第二只，收16.98、量比1.46；不破16.8低吸，失效16.5，压力18。 ✅拓荆科技$688072：半导体设备龙一，昨涨停收487.79、位置偏高；不破470低吸，失效460，压力500。 ✅通富微电$002156：封测，人气榜第3名上升2名，昨涨停收42.33；不破41低吸，失效40，压力45。 👀山东黄金$600547：短线口径，美股GDXJ映射+昨涨停、量比1.79；中线无研报，仅观察。 👀中金黄金$600489：短线口径，昨+9.39%、量比1.94；热度条件不足，仅观察。\n#操作提示 竞价高开2%–4%且量能达标可小仓试错，高开超6%不追；开盘15分钟守住各自低吸位再介入；跌破失效价即退出。单票≤两成、总进攻仓≤五成。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅","en":"【A股盘前｜11月5日 06:55】\n结论：今日适合小仓条件单买入，不宜重仓追高。环境分62分、档位“可做”，单票不超两成仓、总进攻仓不超五成。\n理由有三：\n其一，隔夜美股普涨，道指+3.03%、标普+1.58%、纳指+1.44%，道指创44年来中期选举后最大单日涨幅，外盘无负面冲击；\n其二，上证、沪深300、中证500、中证1000均站上5日与10日线，但全部位于20日线下方，属短期反弹、中期未确认；\n其三，创新药基因获美股IHI映射（昨+6.72%、20日+18.19%）与中信建投双研报强支撑，权重最高；半导体设备靠A股自身资金，贵金属矿业无研报支撑降为观察，宁缺不凑。\n邮件明确不做：已加速标的不追高（拓荆科技昨+20.00%、华海清科+17.97%、中微公司+16.62%，仅回踩低吸）；次新C皇冠新材001381；只有传闻无资金（龙溪股份）；能源油气（油价重挫超8%）；韩日数据缺失方向不加权；超大盘（紫金矿业、北方华创、中际旭创、宁德时代）；成交清淡（招商银行、中谷物流）。\n#共振梳理 创新药基因：美股映射确认+A股中药ETF同步走强+研报月内强支撑，三项共振。 半导体设备与存储封测：美股无直接映射、韩日待确认、研报单一间接支撑，主要靠A股资金。 贵金属矿业：美股GDXJ昨+9.62%确认，但近一月五大机构无研报、A股ETF未进榜，降为观察。\n#消息面 10月中国大宗商品价格指数137.0点，同比+21.0%，利好贵金属与能化； 千亿元互换便利助力逆周期布局，利好券商与宽基； 基金年内分红超1300亿元，红利风格偏多； 10月电商物流指数112.1点，环比+0.2点； 高通预计下季度手机业务营收环比降中个位数，消费电子偏空； 油价重挫超8%，压制油气、利好航运油运成本端； 美股零售$XRT昨+5.54%、必需消费$XLP昨+3.36%，但A股消费ETF昨普遍-1%以上，需看承接。\n#研报面 中信建投11/4：医疗器械与服务Q3多家超预期，看好2027年业绩改 先”未能兑现的愤怒（如万斯所承认）。\n 许多弟兄姊妹心中呐喊：“主啊，为何高油价与远方战火伤了我们的家？”这是公义的哀歌，如同以色列人在埃及的叹息。主听见了。《出埃及记》3:7：“我的百姓在埃及所受的困苦，我实在看见了；他们因督工的辖制所发的哀声，我也听见了。”经济的重担与不必要的争战，主必管教掌权者，也必兴起真正把“先求祂的国和祂的义”放在心上的人。你们的愤怒若归于主，必变成祷告的力量。\n其四，内部指责与“被出卖”的感伤。\n有人说“共和党卖了我们”，有人互相攻击。这如《加拉太书》的纷争，却是主在呼召合一与洁净。不要彼此吞吃，乃要彼此担当。《罗马书》8:28：“万事都互相效力，叫爱神的人得益处。”这夜的裂痕，是为下一次更纯净的联盟预备的。\n这失败是旷野的四十日，不是迦南的终点。未来会来（2028），福音必再兴起！主的灵必浇灌保守派的心田，悔改、祷告、家庭复兴、教会站立的浪潮必来。保守派必蒙恩准，因主的怜悯而非人的谋算，在那选举中得胜。不是倚靠势力、才能，乃是倚靠万军之耶和华的灵（《撒迦利亚书》4:6）。\n你们今日的眼泪，是明日的种子。不要灰心，主的时间最美。弟兄姊妹，彼此代祷，坚固信心。主必再来，祂的国度永存。阿们。","en":"这夜的失败如同旷野的风沙，但不要怕，主的手并未缩短，祂的旨意永不落空。\n其一，国会两院失守、全面溃败？\n 你们看见权柄易手，如同大卫见扫罗的营盘溃散，心中颤惊。但记念《诗篇》46篇：“神是我们的避难所，是我们的力量，是我们在患难中随时的帮助。”这失败不是终局，乃是炼净的火。主容许这夜的黑暗，好让你们不再倚靠人的臂膀或单一领袖，而单单仰望那不改变的磐石。灰心的灵魂啊，抬起头来，主仍坐在宝座上。\n其二，德州、堪萨斯、南卡等红州翻转的惊愕！\n 昔日坚固的城墙倾倒，你们觉得“连根基都摇动了”。但《以赛亚书》54:10说：“大山可以挪开，小山可以迁移，但我的慈爱必不离开你。”这些地方曾蒙恩，今日的失落是主在呼唤更深的悔改与复兴。不要因暂时的“蓝”而丧胆，主曾用巴比伦管教犹大，却又应许归回。保守派的价值——生命、家庭、信仰、自由——是主所栽的，必不至枯干。\n其三，战争、通胀与“美国优先”未能兑现的愤怒（如万斯所承认）。\n 许多弟兄姊妹心中呐喊：“主啊，为何高油价与远方战火伤了我们的家？”这是公义的哀歌，如同以色列人在埃及的叹息。主听见了。《出埃及记》3:7：“我的百姓在埃及所受的困苦，我实在看见了；他们因督工的辖制所发的哀声，我也听见了。”经济的重担与不必要的争战，主必管教掌权者，也必兴起真正把“先求祂的国和祂的义”放在心上的人。你们的愤怒若归于主，必变成祷告的力量。\n其四，内部指责与“被出卖”的感伤。\n有人说“共和党卖了我们”，有人互相攻击。这如《加拉太书》的纷争，却是主在呼召合一与洁净。不要彼此吞吃，乃要彼此担当。《罗马书》8:28：“万事都互相效力，叫爱神的人得益处。”这夜的裂痕，是为下一次更纯净的联盟预备的。\n这失败是旷野的四十日，不是迦南的终点。未来会来（2028），福音必再兴起！主的灵必浇灌保守派的心田，悔改、祷告、家庭复兴、教会站立的浪潮必来。保守派必蒙恩准，因主的怜悯而非人的谋算，在那选举中得胜。不是倚靠势力、才能，乃是倚靠万军之耶和华的灵（《撒迦利亚书》4:6）。\n你们今日的眼泪，是明日的种子。不要灰心，主的时间最美。弟兄姊妹，彼此代祷，坚固信心。主必再来，祂的国度永存。阿们。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2118018344234434897","l":[],"ln":[],"t":["通胀","原油能源"],"lk":2,"rt":0,"rp":0,"vw":2446},{"id":"2118013541978685924","h":"RFI_Cn","ts":1793808753,"zh":"法国世界报 - 特朗普主义“尚没有从美国政治版图上被抹去”","en":"法国世界报 - 特朗普主义“尚没有从美国政治版图上被抹去”","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HWSyE8TXQAAwckc.jpg?name=orig"],"u":"https://x.com/RFI_Cn/status/2118013541978685924","l":["rfi.my"],"ln":[{"u":"https://rfi.my/DC1w","d":"rfi.my"}],"t":[],"lk":3,"rt":0,"rp":1,"vw":2809},{"id" 8","h":"business","ts":1793801707,"zh":"投资者面临新的政治和金融限制。","en":"Investors facing new political and financial constraints.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2117983989042418018","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-04/democrats-midterm-wins-threaten-to-slow-the-ai-data-center-boom?taid=6aeb3debc6a02200012fb76c&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":8,"rt":1,"rp":1,"vw":11141},{"id":"2117982867707801839","h":"business","ts":1793801440,"zh":"当选民对唐纳德·特朗普总统及其共和党进行了强烈的谴责时，民主党在国会获得了压倒性的胜利。\n@tylerskendall 解释","en":"Democrats swept to power in Congress as voters delivered a thundering rebuke of President Donald Trump and his Republican Party.\n@tylerskendall explains","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2117982777198944256/vid/avc1/1080x1920/UnzqtCDM_NRj6Vy7.mp4?tag=16"],"u":"https://x.com/business/status/2117982867707801839","l":["bloom.bg"],"ln":[{"u":"https://bloom.bg/4kyZiJT","d":"bloom.bg"}],"t":[],"lk":9,"rt":3,"rp":2,"vw":13914},{"id":"2117982728108888247","h":"business","ts":1793801407,"zh":"加纳10月份的年度通胀率升至11个月来的最高点，这加强了中央银行维持利率不变的理由","en":"Ghana’s annual inflation edged up to an 11 month-high in October, strengthening the case for the central bank to keep interest rates on hold","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2117982728108888247","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-04/ghana-inflation-hits-11-month-high-may-see-rate-pause-extended?taid=6aeb3cbf06bddd0001c0355c&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["通胀"],"lk":5,"rt":1,"rp":1,"vw":11692},{"id":"2117982718621626700","h":"cnfinancewatch","ts":1793801404,"zh":"IPO“静音模式”：无声收紧供给，直接催生午后强势大涨\n本轮A股持续下探，硬科技板块陷入极度被动。科创50自高点回撤接近五成，创业板跌幅超45%，指数接连创出新低，市场情绪濒临冰点。就在盘面摇摇欲坠之际，投行圈传出重磅消息：#IPO进入实质暂停，#大额股东减持同步叫停。消息来自上海头部券商投行人士，因合规要求匿名。\n本轮政策调控全程保持静默：没有红头文件，没有官方发布会，没有阶段性暂停的正式公告。英国《金融时报》率先披露，监管层召集投行开展窗口指导，口头要求暂缓新股推进、约束产业资本大额减持，静待市场企稳。只做事、不发文，成为这一轮维稳的核心特点。\n从流程表面看，交易所受理、问询、注册流程照常运转，新股发行计划仍在公示；但数据早已透出收紧信号。9月初至10月末，三大交易所仅安排13家企业上会，10月单月上会仅4家。大门并未上锁，项目推进却处处受限。投行面对项目推进，自发选择放缓节奏，这正是窗口指导的效果。\n这套逆周期调节机制早有政策铺垫。此前监管多次提出灵活调节新股发行节奏，827新政也明确要阶段性收紧IPO，平滑一二级市场供需。一旦正式发文关停IPO，只会加剧市场恐慌，让资金解读为行情已经崩盘；等到行情回暖再官宣重启，又会被视作新一轮扩容抽水。静默式调控，既能灵活收缩供给，又不会额外冲击市场预期。\n供给端收紧的效果已经快速显现。10月共有20家上市公司主动终止减持计划，进入11月，永新光学、勘设股份等多家公司接连撤回减持方案，不少股东一股未售便直接锁仓，产业资本主动减负，极大缓解二级市场抛压。\n供给端按住抽水，资金端同步补水。11月3日央行落地千亿级证券互换便利，31家机构参与投标，低成本流动性定向流入资本市场。一边严控IPO与减持，一边投放增量资金，供需两端形成合力。\n今日午后大盘直线拉升，核心驱动力正是这一轮静默式供给收缩。IPO实质性放缓、大额减持大面积终止，直接打消了市场对扩容抛压的担忧，信心快速修复，资金大举进场。\n没有高调的政策喊话，只靠窗口指导悄悄收紧供给，随行就市灵活调节，不设明确时间表。这就是A股最熟悉的调控配方：不用一纸公告搅动预期，先用供给端的实质性收紧，托住盘面，催生反弹。","en":"IPO“静音模式”：无声收紧供给，直接催生午后强势大涨\n本轮A股持续下探，硬科技板块陷入极度被动。科创50自高点回撤接近五成，创业板跌幅超45%，指数接连创出新低，市场情绪濒临冰点。就在盘面摇摇欲坠之际，投行圈传出重磅消息：#IPO进入实质暂停，#大额股东减持同步叫停。消息来自上海头部券商投行人士，因合规要求匿名。\n本轮政策调控全程保持静默：没有红头文件，没有官方发布会，没有阶段性暂停的正式公告。英国《金融时报》率先披露，监管层召集投行开展窗口指导，口头要求暂缓新股推进、约束产业资本大额减持，静待市场企稳。只做事、不发文，成为这一轮维稳的核心特点。\n从流程表面看，交易所受理、问询、注册流程照常运转，新股发行计划仍在公示；但数据早已透出收紧信号。9月初至10月末，三大交易所仅安排13家企业上会，10月单月上会仅4家。大门并未上锁，项目推进却处处受限。投行面对项目推进，自发选择放缓节奏，这正是窗口指导的效果。\n这套逆周期调节机制早有政策铺垫。此前监管多次提出灵活调节新股发行节奏，827新政也明确要阶段性收紧IPO，平滑一二级市场供需。一旦正式发文关停IPO，只会加剧市场恐慌，让资金解读为行情已经崩盘；等到行情回暖再官宣重启，又会被视作新一轮扩容抽水。静默式调控，既能灵活收缩供给，又不会额外冲击市场预期。\n供给端收紧的效果已经快速显现。10月共有20家上市公司主动终止减持计划，进入11月，永新光学、勘设股份等多家公司接连撤回减持方案，不少股东一股未售便直接锁仓，产业资本主动减负，极大缓解二级市场抛压。\n供给端按住抽水，资金端同步补水。11月3日央行落地千亿级证券互换便利，31家机构参与投标，低成本流动性定向流入资本市场。一边严控IPO与减持，一边投放增量资金，供需两端形成合力。\n今日午后大盘直线拉升，核心驱动力正是这一轮静默式供给收缩。IPO实质性放缓、大额减持大面积终止，直接打消了市场对扩容抛压的担忧，信心快速修复，资金大举进场。\n没有高调的政策喊话，只靠窗口指导悄悄收紧供给，随行就市灵活调节，不设明确时间表。这就是A股最熟悉的调控配方：不用一纸公告搅动预期，先用供给端的实质性收紧，托住盘面，催生反弹。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2117982718621626700","l":[],"ln":[],"t":["A股港股"],"lk":0,"rt":1,"rp":0,"vw":1514},{"id":"2117981881480175990","h":"SCMPNews","ts":1793801205,"zh":"随着特朗普的光环开始消退，共和党人面临“内战”的可能性","en":" const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
