21年11月份那波非常类似，速度和幅度。区别是在这一波的AI落地到底有没有回报。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2122383372144271802","l":[],"ln":[],"t":[],"lk":105,"rt":2,"rp":13,"vw":31940},{"id":"2122382554036875538","h":"BrantChinesefn","ts":1794850407,"zh":"观点还是之前讲的这些，我再引用一下。美国有三高，高增长，高就业，高通胀。中东那里只要伊朗还想要赔偿，就不可能和解。 $NVDA对科技股的影响会导致半导体公司集体下调盈利预期。\n刚才沃什一顿讲话，等于什么也没讲。当市场在摇摆 #美联储 是50还是25基点加息却得不到结果的时候，华尔街会先不管三七二十一先把风险price in，然后发现没那么利空的时候再全力买回来（这也是为什么美股修复能力这么快的原因）。\n再加上 $QQQ 也是顺着下跌趋势运行。此刻，我似乎是看不到任何市场利好的因素。所以我也只能继续持有空头仓位。\n最近盗图的人太多了，我时不时刷小红书会看见我自己的收益率截图，看得我一阵恍惚，所以我打个水印。","en":"观点还是之前讲的这些，我再引用一下。美国有三高，高增长，高就业，高通胀。中东那里只要伊朗还想要赔偿，就不可能和解。 $NVDA对科技股的影响会导致半导体公司集体下调盈利预期。\n刚才沃什一顿讲话，等于什么也没讲。当市场在摇摆 #美联储 是50还是25基点加息却得不到结果的时候，华尔街会先不管三七二十一先把风险price in，然后发现没那么利空的时候再全力买回来（这也是为什么美股修复能力这么快的原因）。\n再加上 $QQQ 也是顺着下跌趋势运行。此刻，我似乎是看不到任何市场利好的因素。所以我也只能继续持有空头仓位。\n最近盗图的人太多了，我时不时刷小红书会看见我自己的收益率截图，看得我一阵恍惚，所以我打个水印。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQ3rr8aQAA1H_y.jpg?name=orig","https://pbs.twimg.com/media/HXQ3rr4a8AEzmhG.jpg?name=orig"],"u":"https://x.com/BrantChinesefn/status/2122382554036875538","l":[],"ln":[],"t":["美联储","通胀","美股","AI科技"],"lk":69,"rt":3,"rp":15,"vw":16099},{"id":"2122379915643568621","h":"TraderS18","ts":1794849778,"zh":"看原视频说懂王支持黄仁勋回归其实多少是有点勉强的，感觉是想让老黄回去的人过度解读了，这也是小幅反弹后转跌的原因吧","en":"看原视频说懂王支持黄仁勋回归其实多少是有点勉强的，感觉是想让老黄回去的人过度解读了，这也是小幅反弹后转跌的原因吧","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122379657484079104/vid/avc1/1280x720/U78TP-5734P-f8-4.mp4?tag=29"],"u":"https://x.com/TraderS18/status/2122379915643568621","l":[],"ln":[],"t":[],"lk":9,"rt":0,"rp":2,"vw":20057},{"id":"2122379764522770541","h":"misaENFP","ts":1794849742,"zh":"深夜Misa又来了，聊一聊关于币圈那些没什么粉丝的小 KOL。\n最近听到一句很不舒服的谣言：Misa签约了一堆垃圾KOL。\n第一，没有那么多经费，真的垃圾的账号没有地方会要的，我这里不会，别的地方更不会。\n我的账号大部分是自然流，你像我一样17H泡在X上，你也会有正向反馈，把时间精力花在哪里哪里就逐渐开花结果，如果流量只能用钱堆出来，那么我不是一个合格的员工。\n第二点就是今天想聊的，什么时候开始，一个人在互联网上的价值，只能用用粉丝数量来衡量，没粉丝就是垃圾？\n我第一个账号从7个粉丝开端，从7到100走了很久很久，然后靠模仿短鸟老师迎来第一批对我感兴趣的人，经历了各种磨难，才一步一步走到今天，人微言轻，我缺被看见的机会，我相信你们也是。\nKOL，说白了就是网红的意思，做久了发现这里有一套非常直观的评价体系。\n粉丝多少，阅读多少，互动多少，有没有人认识你。\n这些数字当然重要，我自己做品牌，也要看数据，我很清楚传播是有商业价值的。\n但让我有点难过的是，太多人慢慢把商业价值和人的价值混为一谈了。\n我引用的这条帖子，皮神@Meichin333333 他刚认识我时，压根懒得发东西，连图都懒得自己做，让我们帮他做，通过我不懈的努力说服了他，挖掘出来一个天才，可以去看看他现在的视频质量。\n这样的列子在我的社区里数不胜数，Misa赛道代表人物@hetzerLin 也渐渐取得小结果，做视频也开始接商单了，这需要我们双向努力。\n为什么我一空下来就去“批作业”？不是我闲的没事干，是一个几十几百粉丝的小博主认真写了一篇分析，可能连被看完的机会都没有，没人看，那我来看。\n甚至有时候，粉丝少仿佛成了一种原罪。\n你表达观点，别人问你赚了多少钱。\n你分享研究，别人说你的研究有啥可参考的。\n你想争取一次合作机会，别人还没看你的内容，就已经通过主页上的数字给你定了价。\n这里面有一件事特别值得警惕：\n我们可以给流量定价，但不要习惯性地给人定价。\n这两件事是完全不同的。\n我接触过很多小 KOL，有些人白天上学上班，还有在考研的，带娃的，然后晚上回来研究行情、看数据、写内容。\n可能花了三四个小时做出来的东西，最后只有几十个阅读。\n也有人认真回复每一条评论，哪怕自己的评论区只有三五个老熟人。\n他们可能不懂怎么蹭热点，不擅长制造情绪，也没有什么资源，但这不代表他们的认真就很廉价。\n我们总喜欢讨论早期价值。\n一个项目还没有多少人关注的时候，我们愿意研究它的潜力，愿意想象它未来会发展成什么样。\n可是面对一个刚刚开始做内容的人，我们却经常只看他今天有多少粉丝。\n我们愿意给一个项目成长的时间，为什么有时候却不愿意给一个普通人成长的空间？\n我总是喜欢转发他们的帖子，我希望他们走到大家视野里，希望他们被看到，希望除了我还有赏识他们的人。\n影响力有差异，合作预算有差异，这些都很正常，很多人就是单打独斗，没有被看见，所以我来了。\n我想表达，即使你暂时没有商业价值，也不意味着你的付出不值得尊重。\n更何况，今天那些拥有几十万粉丝的人，谁没有经历过只有几十个人看自己内容的日子呢，穷途末路的时候我发p的不像我的自拍都是三四个浏览。\n我自己也做内容，所以我知道，很多时候真正让人坚持下去的，甚至不是收益。\n而是有人认真看完你写的东西，愿意和你讨论，或者告诉你一句：你这个观点让我有了新的思考，你做的很棒。\n这种被看见的感觉，真的很珍贵。\n做社区不应该只是维护一群已经有影响力的人，他们已经很厉害，一个好的社区，也应该让暂时没有影响力的人，有机会慢慢长出自己的影响力。\n我不希望这个世界最后变成一个只有大网红才有资格说话的地方。\n小账号不需要因为粉丝少而卑微。\n我们可以尊重流量，但不必崇拜流量。\n可以承认差距，但没必要把差距变成羞辱别人的理由。\n张口闭口舔狗论，那其实我更像一个舔狗，想方设法的做对大家有利的事情。\n亲爱的们，你不需要每天证明自己值得被关注，也不用因为没有流量就怀疑自己。\n认真研究过的东西不会白费，真诚建立起来的关系也不应该只用数字衡量，学会的东西都是自己的。\n粉丝数量决定了今天有多少人能听见你，但不应该决定你有没有资格开口。\n希望你以后能有很多很多粉丝。\n但在那之前，也希望你不要放弃，继续做自己。\n晚安宝贝们🌙","en":"深夜Misa又来了，聊一聊关于币圈那些没什么粉丝的小 KOL。\n最近听到一句很不舒服的谣言：Misa签约了一堆垃圾KOL。\n第一，没有那么多经费，真的垃圾的账号没有地方会要的，我这里不会，别的地方更不会。\n我的账号大部分是自然流，你像我一样17H泡在X上，你也会有正向反馈，把时间精力花在哪里哪里就逐渐开花结果，如果流量只能用钱堆出来，那么我不是一个合格的员工。\n第二点就是今天想聊的，什么时候开始，一个人在互联网上的价值，只能用用粉丝数量来衡量，没粉丝就是垃圾？\n我第一个账号从7个粉丝开端，从7到100走了很久很久，然后靠模仿短鸟老师迎来第一批对我感兴趣的人，经历了各种磨难，才一步一步走到今天，人微言轻，我缺被看见的机会，我相信你们也是。\nKOL，说白了就是网红的意思，做久了发现这里有一套非常直观的评价体系。\n粉丝多少，阅读多少，互动多少，有没有人认识你。\n这些数字当然重要，我自己做品牌，也要看数据，我很清楚传播是有商业价值的。\n但让我有点难过的是，太多人慢慢把商业价值和人的价值混为一谈了。\n我引用的这条帖子，皮神@Meichin333333 他刚认识  号压力测试，分钟级拆解，到最终老黄做出决定。全文约 1.4 万字，建议配合冰可乐服用更佳","en":"老黄的事，内网外网看了上百篇分析，本文是我看过唯一不带节奏、不带情绪瞎扯的好文，从两年前的订单、监听、解敏、川收到的绝密备忘录、被压下的批示、贝森特的拍桌、11 月 11 号压力测试，分钟级拆解，到最终老黄做出决定。全文约 1.4 万字，建议配合冰可乐服用更佳","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2122375494163472866","l":["x.com"],"ln":[{"u":"https://x.com/i/article/2122364913503117315","d":"x.com"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":1034},{"id":"2122374411726868512","h":"xingpt","ts":1794848466,"zh":"SemiAnalysis 看来也是个会营销的网红机构，Capex 下调这个事情，很多嘴子几个月前就开始说了","en":"SemiAnalysis 看来也是个会营销的网红机构，Capex 下调这个事情，很多嘴子几个月前就开始说了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2122374411726868512","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":3,"vw":2501},{"id":"2122374187704795426","h":"xingpt","ts":1794848412,"zh":"川子现在说了不算了，老黄重新做 CEO 这个概率非常非常小了，至少短期内不太可能了。\n即便老黄能回来做 CEO，他也不敢像之前一样继续卖卡给中国了。\n本质上，整个 AI 半导体的格局是注定要变化的，黄仁勋只是那个被推出来祭旗的旗手","en":"川子现在说了不算了，老黄重新做 CEO 这个概率非常非常小了，至少短期内不太可能了。\n即便老黄能回来做 CEO，他也不敢像之前一样继续卖卡给中国了。\n本质上，整个 AI 半导体的格局是注定要变化的，黄仁勋只是那个被推出来祭旗的旗手","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2122374187704795426","l":[],"ln":[],"t":["AI科技"],"lk":15,"rt":0,"rp":4,"vw":3656},{"id":"2122373371388448791","h":"xingpt","ts":1794848218,"zh":"为什么黄仁勋必须死？\n首先我们来看一下，老黄在的时候做了什么、利好了谁。\n他最提倡开源，提倡把芯片卖到全球，特别是通过一些灰色渠道流到中国，他是睁一只眼闭一只眼的，甚至可以说是纵容了这种事情发生。\n他在位的时候，整个亚洲半导体产业链都吃饱了，特别是台湾的供应商。\n所以黄仁勋在位的时期，整个 AI 硬件和半导体的投入增加是极其巨大的。\n那为什么他必须“死”呢？\n因为美国需要把 AI 的资本开支放缓了，大家实在是没有钱买卡了。\n标普全球算过，六家大厂明年 Capex 加起来 1.3 万亿美元，自由现金流还是正的只剩微软一家。高盛估计明年还得发 4000 亿美元的投资级债。这个钱是花不下去的。\n他下台之后会怎么样？\n中国的开源模型没办法拿卡了，或者说拿卡跟蒸馏的难度会非常大，跟美国frontier lab的差距会扩大。\n美国本土的云厂商也会受益，可以减小 Capex 投入。而且没有中国开源模型在后面追，闭源模型公司也可以放缓买卡和训练，把更多算力放到更高毛利的推理上，不用再拼命赶新模型的进度。\n所以未来一年你会看到，新模型发布的节奏一定是迅速放缓的。\n另外一方面，整个半导体产业链因为老黄赚得盆满钵满，很多下游产业都在被吸血。消费电子因为服务器跟内存涨价，可以说是深受其害吧。\n还有一点跟政治相关。数据中心因为算力竞赛，不断在环保和居民空间上侵害一些人的利益，民主党看到了这个机会，在中期选举上大做文章，把参众两院都拿下了。\n所以你可以看到，老黄下台，对闭源模型大厂有好处，对微软、谷歌、亚马逊、甲骨文这些买卡的大云厂商有好处，对民主党也有好处。\n不利的是中国倒卡的二道贩子、中国的开源大模型厂商，还有靠老黄背书才拿得到融资担保的 New Clouds。\n但是老黄在台上利好的这些力量，完全没有在美国争取选票的能力和政治影响力。受损的这些大厂，都有极强的背景和游说能力。\n所以在 AI 资本开支不得不放缓的时候，老黄必须走，他也必须对此负责。不然大家都会崩盘，整个融资和负债都会出问题。\n在 AI 时代要高歌猛进、堆算力的时候，黄仁勋就是那个被捧上神坛的旗手；当 AI 因为投入过大不得不放缓的时候，黄仁勋也会是第一个被推下神坛祭旗的人。\n所以老黄必须死。","en":"为什么黄仁勋必须死？\n首先我们来看一下，老黄在的时候做了什么、利好了谁。\n他最提倡开源，提倡把芯片卖到全球，特别是通过一些灰色渠道流到中国，他是睁一只眼闭一只眼的，甚至可以说是纵容了这种事情发生。\n他在位的时候，整个亚洲半导体产业链都吃饱了，特别是台湾的供应商。\n所以黄仁勋在位的时期，整个 AI 硬件和半导体的投入增加是极其巨大的。\n那为什么他必须“死”呢？\n因为美国需要把 AI 的资本开支放缓了，大家实在是没有钱买卡了。\n标普全球算过，六家大厂明年 Capex 加起来 1.3 万亿美元，自由现金流还是正的只剩微软一家。高盛估计明年还得发 4000 亿美元的投资级债。这个钱是花不下去的。\n他下台之后会怎么样？\n中国的开源模型没办法拿卡了，或者说拿卡跟蒸馏的难度会非常大，跟美国frontier lab的差距会扩大。\n美国本土的云厂商也会受益，可以减小 Capex 投入。而且没有中国开源模型在后面追，闭源模型公司也可以放缓买卡和训练，把更多算力放到更高毛利的推理上，不用再拼命赶新模型的进度。\n所以未来一年你会看到，新模型发布的节奏一定是迅速放缓的。\n另外一方面，整个半导体产业链因为老黄赚得盆满钵满，很多下游产业都在被吸血。消费电子因为服务器跟内存涨价，可以说是深受其害吧。\n还有一点跟政治相关。数据中心因为算力竞赛，不断在环保和居民空间上侵害一些人的利益，民主党看到了这个机会，在中期选举上大做文章，把参众两院都拿下了。\n所以你可以看到，老黄下台，对闭源模型大厂有好处，对微软、谷歌、亚马逊、甲骨文这些买卡的大云厂商有好处，对民主党也有好处。\n不利的是中国倒卡的二道贩子、中国的开源大模型厂商，还有靠老黄背书才拿得到融资担保的 New Clouds。\n但是老黄在台上利好的这些力量，完全没有在美国争取选票的能力和政治影响力。受损的这些大厂，都有极强的背景和游说能力。\n所以在 AI 资本开支不得不放缓的时候，老黄必须走，他也必须对此负责。不然大家都会崩盘，整个融资和负债都会出问题。\n在 AI 时代要高歌猛进、堆算力的时候，黄仁勋就是那个被捧上神坛的旗手；当 AI 因为投入过大不得不放缓的时候，黄仁勋也会是第一个被推下神坛祭旗的人。\n所以老黄必须死。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2122373371388448791","l":[],"ln":[],"t":["美股","AI科技"],"lk":93,"rt":9,"rp":15,"vw":25600},{"id":"2122373314228502617","h":"ShanghaoJin","ts":1794848204,"zh":"放一个可以在APEC讨价还价的筹码\n其实没有稀土、没有供应链忍痛能力，就只有TACO这一条路","en":"放一个可以在APEC讨价还价的筹码\n其实没有稀土、没有供应链忍痛能力，就只有TACO这一条路","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2122373314228502617","l":[],"ln":[],"t":[],"lk":92,"rt":4,"rp":8,"vw":23762},{"id":"2122372199675994210","h":"wufantouzi","ts":1794847938,"zh":"今天我都没买tqqq那些末日期权了\n真的怂了\n这个波动水平\n还是机器人好用一点","en":"今天我都没买tqqq那些末日期权了\n真的怂了\n这个波动水平\n还是机器人好用一点","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2122372199675994210","l":[],"ln":[],"t":[],"lk":19,"rt":0,"rp":4,"vw":10852},{"id":"2122367674084966749","h":"maojie 互联网】美国BIS发布AI芯片远程访问新规：海外数据中心向中国等国公司提供超1,200万TPP算力须申请许可，存量须在90天内补办\n[玫瑰]美国商务部工业与安全局（BIS）于11月15日发布暂行最终规则（IFR），规则自刊登于联邦公报之日起生效，意见征询期60天。\n[烟花]一、远程访问管制：适用于全球数据中心，存量须在90天内取得许可\n1）如知悉数据中心（含通过网络互联、共享资源的多个数据中心）向总部或最终母公司位于澳门或D:5国家组（含中国）的公司提供超过1,200万aggregate TPP的算力（约334张B200），相关先进计算芯片及服务器（ECCN 3A090、4A090等）的出口、再出口和境内转移须申请许可，适用于全球任何地区的数据中心，许可逐案审批。\n2）规则发布前已在向上述公司提供大量算力的数据中心，如需继续服务，须在规则生效后90天内取得许可，否则将面临后续出口限制；芯片持有人是否参与最初的出口交易不影响适用，数据中心转为服务上述公司视为境内转移，须取得授权。\n3）数据中心向其他客户提供算力、而该客户为上述公司训练模型或向其提供模型的，同样适用；数据中心须对客户开展尽职调查，识别是否被中国或澳门主体直接或间接持有或控制。\n4）仅用于商业推荐系统（如电商、社交媒体）的算力不受此限，但须向BIS报备；生成文本、图像、音视频、软件的AI系统，或包含此类模型的系统，即使兼有推荐功能也不在豁免范围内。\n5）BIS同时明确，现行规则一直覆盖上述公司作为采购方、或作为数据中心主要远程用户（使用超过50%算力）的交易，违规者应主动向BIS自我披露。\n[烟花]二、新增五国许可要求\n1）向印尼、马来西亚、新加坡、泰国、巴西出口、再出口或在其境内转移先进计算芯片均须申请许可，商务部长可增列其他国家；许可逐案审批，审查时考虑目的国出口管制体系的有效性及与BIS的执法合作。\n2）最终收货人或最终用户为美国总部公司（或最终母公司位于美国）的，可免于许可，但出口方须每月向BIS报告交易明细。\n[烟花]三、其他\n1）收紧对晶圆代工厂和封测厂的推定规则：位于D:1/D:4/D:5国家组或上述五国的芯片设计公司，不再能通过相关途径推翻其先进逻辑芯片属于管制物项的推定。\n2）正式废除拜登政府时期的《AI扩散规则》，取消国家分级、数据中心VEU授权及模型权重管制。\n原文详见：","en":"[Sun]【中金互联网】美国BIS发布AI芯片远程访问新规：海外数据中心向中国等国公司提供超1,200万TPP算力须申请许可，存量须在90天内补办\n[玫瑰]美国商务部工业与安全局（BIS）于11月15日发布暂行最终规则（IFR），规则自刊登于联邦公报之日起生效，意见征询期60天。\n[烟花]一、远程访问管制：适用于全球数据中心，存量须在90天内取得许可\n1）如知悉数据中心（含通过网络互联、共享资源的多个数据中心）向总部或最终母公司位于澳门或D:5国家组（含中国）的公司提供超过1,200万aggregate TPP的算力（约334张B200），相关先进计算芯片及服务器（ECCN 3A090、4A090等）的出口、再出口和境内转移须申请许可，适用于全球任何地区的数据中心，许可逐案审批。\n2）规则发布前已在向上述公司提供大量算力的数据中心，如需继续服务，须在规则生效后90天内取得许可，否则将面临后续出口限制；芯片持有人是否参与最初的出口交易不影响适用，数据中心转为服务上述公司视为境内转移，须取得授权。\n3）数据中心向其他客户提供算力、而该客户为上述公司训练模型或向其提供模型的，同样适用；数据中心须对客户开展尽职调查，识别是否被中国或澳门主体直接或间接持有或控制。\n4）仅用于商业推荐系统（如电商、社交媒体）的算力不受此限，但须向BIS报备；生成文本、图像、音视频、软件的AI系统，或包含此类模型的系统，即使兼有推荐功能也不在豁免范围内。\n5）BIS同时明确，现行规则一直覆盖上述公司作为采购方、或作为数据中心主要远程用户（使用超过50%算力）的交易，违规者应主动向BIS自我披露。\n[烟花]二、新增五国许可要求\n1）向印尼、马来西亚、新加坡、泰国、巴西出口、再出口或在其境内转移先进计算芯片均须申请许可，商务部长可增列其他国家；许可逐案审批，审查时考虑目的国出口管制体系的有效性及与BIS的执法合作。\n2）最终收货人或最终用户为美国总部公司（或最终母公司位于美国）的，可免于许可，但出口方须每月向BIS报告交易明细。\n[烟花]三、其他\n1）收紧对晶圆代工厂和封测厂的推定规则：位于D:1/D:4/D:5国家组或上述五国的芯片设计公司，不再能通过相关途径推翻其先进逻辑芯片属于管制物项的推定。\n2）正式废除拜登政府时期的《AI扩散规则》，取消国家分级、数据中心VEU授权及模型权重管制。\n原文详见：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122330285106680160","l":["bis.gov"],"ln":[{"u":"https://www.bis.gov/press-release/bis-issues-rule-addressing-remote-access-american-super-intelligence-technology","d":"bis.gov"}],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":0,"vw":1136},{"id":"2122330130743738731","h":"dmjk001","ts":1794837908,"zh":"今天，美国商务部工业与安全局（BIS）发布了一项临时最终规则（IFR）——该规则由财政部和国家安全委员会撰写并指导——以应对对先进超级智能（SI）芯片和服务器的远程访问问题。该规则旨在确保现有对敏感美国技术的访问限制无法通过涉及第三国数据中心的远程计算安排被规避。","en":"今天，美国商务部工业与安全局（BIS）发布了一项临时最终规则（IFR）——该规则由财政部和国家安全委员会撰写并指导——以应对对先进超级智能（SI）芯片和服务器的远程访问问题。该规则旨在确保现有对敏感美国技术的访问限制无法通过涉及第三国数据中心的远程计算安排被规避。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQH9DmbEAAiIov.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122330130743738731","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":1065},{"id":"2122329409764180033","h":"dmjk001","ts":1794837736,"zh":"彭博：贝莱德调整人工智能押注，在新模型调整中增加股票风险\n贝莱德公司正在调整其人工智能敞口，并在市场抛售后战术性增加股票风险，这是其 3000 亿美元模型投资组合套件的最新一次全面调整。","en":"彭博：贝莱德调整人工智能押注，在新模型调整中增加股票风险\n贝莱德公司正在调整其人工智能敞口，并在市场抛售后战术性增加股票风险，这是其 3000 亿美元模型投资组合套件的最新一次全面调整。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQHOkIbMAEtc50.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122329409764180033","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":1040},{"id":"2122329193065119954","h":"dmjk001","ts":1794837685,"zh":"彭博：美国商务部发布了一项临时规则，限制某些国家远程访问先进 AI 芯片和服务器。\n美国商务部在一份声明中表示：“该规则旨在确保现有对美国敏感技术准入的限制，不会被涉及第三国数据中心的远程计算安排所规避。”\n新规将要求向巴西、新加坡、印度尼西亚、马来西亚和泰国再出口先进 AI 芯片须获得许可。\n商务部指出，先进云计算使得远程访问美国 AI 计算系统日益成为可能，并表示新规旨在与现有的技术实体准入规则保持一致。","en":"彭博：美国商务部发布了一项临时规则，限制某些国家远程访问先进 AI 芯片和服务器。\n美国商务部在一份声明中表示：“该规则旨在确保现有对美国敏感技术准入的限制，不会被涉及第三国数据中心的远程计算安排所规避。”\n新规将要求向巴西、新加坡、印度尼西亚、马来西亚和泰国再出口先进 AI 芯片须获得许可。\n商务部指出，先进云计算使得远程访问美国 AI 计算系统日益成为可能，并表示新规旨在与现有的技术实体准入规则保持一致。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXQHBCcbQAENntw.png?name=orig"],"u":"https://x.com/dmjk001/status/2122329193065119954 位置，不要因为三期结果或ARK当天追。Powell今晚盘后出数，波动会很大，不抢。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#三个方向\n一是 #生物医药创新 ， $IHE 双窗口同现， $SBIO\n20日涨11%但量比只有0.46、5日走平，等放量再跟，个股里能做的位置并不多。二是 #大盘消费科技龙头 ，只认 #苹果\n这种低波动、贴近前高的品种。三是 #水业与能源服务 只观察， $FIW 距20日高1.9%，但对应个股还在区间中部。\n#六只个股\n #苹果 $AAPL ，突破准备，盘前略强。站上360.83放量触发，跌破343.83失效，半仓。\n #太平洋生物科学 $PACB\n，箱底，11月12日收出锤子线，13日缩量守在1.96，盘前约1.92。ARK已经同买，但五日跌13%，还在20日均线2.29下方，Put增仓，未见明确右侧。站稳2.05再看，跌破1.74失效，仅观察。\n #安进 $AMGN ，区间上部，距20日高3.9%，盘前涨到471附近。三期结果是加分项，Call减仓、目标价未采集，放量突破483.99再看，跌破434.77失效。\n #菲利普斯66 $PSX ，区间中部41%，二十日还跌9.6%，站稳270.63并放量再看，跌破259.41失效。\n #科迪亚克天然气 $KGS ，区间中部57%，内部人买入和12家买入评级已有，位置没到。放量突破49.65再看，跌破44.64失效。\n #爱德华生命科学 $EW ，高位，收在区间97%、距20日高只有0.5%，上调指引加上评级增加，但不追，回踩再论，跌破92.9失效。\n#小盘阿尔法\n本期不选。 $PACB 市值约6.2亿美元，箱底有锤子线也有ARK同买，但五日仍跌、未见右侧，Put还在增仓。 $SCTX\n箱体位置29%，ARK只是单基金，财务和市值数据不全，不纳入。 $ACHR 、 $BEAM 、 $CERS 、 $RXRX\n都还在区间下部下跌中。\n#操作提示\n英伟达财报前不碰AI硬件。苹果是贴着前高的半仓突破单，不突破就不进，跌破失效位当天走。开盘若纳指期货跌幅继续大于1.5%，这只也推迟。安进和PACB都先看位置，不要因为三期结果或ARK当天追。Powell今晚盘后出数，波动会很大，不抢。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122324121816010767","l":["macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"],"ln":[{"u":"http://macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议","d":"macaostarbridge.com，获取更多跨市场研究与交易桥接资讯。以上仅为信息整理，不构成投资建议"}],"t":["原油能源","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":338},{"id":"2122324116653113375","h":"cnfinancewatch","ts":1794836474,"zh":"美股盘前晚间版｜2026年11月16日 周一 北京时间21:00\n#结论\n今日大类只做两个：生物医药创新，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置的，只剩贴着前高的苹果；箱底小盘还没走到右侧，高位医药和区间中部的能源股都不进只做。\n #苹果 $AAPL 上周五收356.27，距20日高也是52周高360.83只差1.3%，处在区间87%的位置，属突破准备。盘前约357.8，又近了一点。卖方目标价均值345.57低于现价，近四周EPS下修16家，只给半仓，不突破不进。\n明确不做：半导体和AI硬件，英伟达明天盘后出财报，盘前已跌到156.7附近，大约低3.8%；ARK加仓但仍在下跌通道里的小盘；已经处在高位、或者五日涨幅过大的品种。\n#消息面\n截至北京时间21时出头，美股期指比下午更弱。纳指期货27662，较上周五结算跌约1.3%；标普期货7535，跌约0.6%；道指期货基本平。\n#英伟达 $NVDA 盘前约156.7，跌约3.8%。财报是明天美股盘后，也是换帅后第一份季报。英文媒体称黄仁勋方面在讨论重返CEO，没有官方确认，先当噪音。Susquehanna维持看好、目标价275美元，预期本季好于市场，同时提示继任者和对华出口仍有变数。Anthropic计划周三定价、周四在纳斯达克以\n$ANT 挂牌，定价区间70到78美元。\n #安进 $AMGN 11月11日公布干燥综合征新药dazodalibep三期OASIZ-301达到主要终点，盘前约471，涨约1.1%。事件权重大，但股价在20日区间69%、距20日高还有3.9%，不到突破位，只观察。家得宝、迪士尼明天盘前出财报，\n#Powell工业 $POWL\n今晚美股盘后出季报，盘前已跌到136.3附近，大约低4.5%。WTI回落到88美元附近。10年期美债收益率上周五收5.15%，美元指数约103.46，靠近20日高，VIX盘前约20.6。\nA股今天已经收盘，上证3602.57，跌0.87%；创业板跌4.37%，科创50跌5.16%，半导体映射继续失效。\n#研报面\n #苹果 卖方均值目标价345.57美元，买入16家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。 #菲利普斯66\n$PSX 均值目标价299.13，近四周EPS上修22家。 #科迪亚克天然气 $KGS 均值72.55，12家全是买入。 #太平洋生物科学\n$PACB 均值2.64。 #爱德华生命科学 $EW 均值114.5，买入19家。 #安进\n目标价本轮未采集。英伟达除Susquehanna外，上周汇丰降级和集体诉讼仍在。\n#资金面\n晚间版相对下午最重要的变化，是 $PACB\n变成ARK两只基金同买：ARKK加仓930万股、ARKG加仓7.0万股。但期权最大Put行权价2.5离现价太远，Put持仓还增了20.3%，同向项只有ARK一档，不算共振。\n$SCTX 只有ARKG单基金买入约47万美元，做空余额环比升49%，也不算共振。加仓榜里还有 $ACHR 、 $BEAM 、 $CERS\n、 $RXRX ，这几只都还在20日区间下部、近5日继续跌，不是右侧。\n带方向的期权： $AAPL Put持仓减仓20.8%，贴近现价，但只有这一项，未形成共振。 $NVDA\nPut持仓增仓75.2%，偏空；最大Call行权价165距现价约1.3%、量仓比13.46，和Put增仓方向不一致，不当作多共振。\n$TSLA Call持仓减仓62%，偏空。 $AMGN Call持仓减仓5.8%，是多单离场，内部人近三个月小额净买入构不成两项同向。\n$EW 目标价和买入家数增加两项同向，算共振，但位置已经在高位。 $PSX 目标价上调和EPS上修两项同向，期权链未采集。 $KGS\n内部人买入加目标价上调两项同向，但最大Call行权价60离现价34%，期权不算。\n#期货\n上周五完整交易日，股指是多头离场：标普迷你价跌、OI减4474手，量比0.90；纳指迷你价跌、OI减4391手，量比0.93；罗素迷你同样价跌OI降。10年期美债期货价涨OI降，是空头回补。WTI价跌OI降2.35万手，多头离场；黄金、铜也是价跌OI降，多头离场。今天期价继续偏弱，但是未完成交易日，OI先不定性。股指层面仍没有新多进场的证据。\n#中美映射\n20日窗口，美股 $JETS 涨11.57%、 $SBIO 涨11.00%、 $IHE 涨9.87%、 $FIW 涨9.38%、 $AGNG\n涨8.85%、 $ITB 涨8.81%、 $XLV 涨6.87%、 $XLY 涨6.69%、 $XLF 涨5.69%。5日窗口， $SOXX\n涨9.35%、 $XLE 涨5.42%、 $SMH 涨4.91%、 $IHE 涨4.16%。双窗口同现的是 $IHE 医药、$XLV\n医疗、$XLF 金融； $FIW 水业5日只涨1.88%，趋势还在、加速度不够。半导体仍是仅5日，20日 $SOXX\n跌9.22%，短线脉冲慎追。\nA股今天收盘后，汇添富纳指生物科技ETF 20日涨8.70%、5日涨2.10%，与美股医药是20日共振；银行ETF\n20日涨4.90%、5日涨3.95%，与 $XLF 双窗口同现，今天盘面也对得上。广发机器人ETF\n20日涨8.59%，但5日跌5.71%。芯片ETF 20日跌7.43%、5日跌2.41%，通信ETF\n20日跌25.43%，半导体映射今天继续失效。","en":"美股盘前晚间版｜2026年11月16日 周一 北京时间21:00\n#结论\n今日大类只做两个：生物医药创新，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置的，只剩贴着前高的苹果；箱底小盘还没走到右侧，高位医药和区间中部的能源股都不进只做。\n #苹果 $AAPL 上周五收356.27，距20日高也是52周高360.83只差1.3%，处在区间87%的位置，属突破准备。盘前约357.8，又近了一点。卖 %-增长（甚至注定降速）的药厂当成momentum long炒到x18PE，把增速确定50%+的semi当成momentum short 砸到low teens multiple\n我不知道这样叙述能砸多久，但是我确定知道这个仓位肯定、100%会反向爆仓的","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2122298378348601689","l":[],"ln":[],"t":[],"lk":275,"rt":19,"rp":20,"vw":54041},{"id":"2122297432512119204","h":"dmjk001","ts":1794830112,"zh":"19:49:14【SemiAnalysis大幅下修AI算力预测：2028年资本开支预测下调近三成 五年硅片出货面积下调17%】财联社11月16日电，AI基础设施投资热潮出现新的降温信号。半导体研究机构SemiAnalysis在最新模型更新中，大幅下调了未来数年AI加速器出货、资本开支、HBM需求和电力需求预测。其中，2028年至2030年的调整幅度尤为明显：2028年全球AI加速器资本开支预测被下调28%，2029年和2030年分别下调41%和40%。按照最新模型，2030年全球AI加速器资本开支将从此前预测的1.531万亿美元降至9230亿美元，减少6080亿美元。与此同时，2026年至2030年加速器逻辑硅片出货面积累计预测下调17%。","en":"19:49:14【SemiAnalysis大幅下修AI算力预测：2028年资本开支预测下调近三成 五年硅片出货面积下调17%】财联社11月16日电，AI基础设施投资热潮出现新的降温信号。半导体研究机构SemiAnalysis在最新模型更新中，大幅下调了未来数年AI加速器出货、资本开支、HBM需求和电力需求预测。其中，2028年至2030年的调整幅度尤为明显：2028年全球AI加速器资本开支预测被下调28%，2029年和2030年分别下调41%和40%。按照最新模型，2030年全球AI加速器资本开支将从此前预测的1.531万亿美元降至9230亿美元，减少6080亿美元。与此同时，2026年至2030年加速器逻辑硅片出货面积累计预测下调17%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122297432512119204","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":1,"rp":0,"vw":669},{"id":"2122296870336872481","h":"dmjk001","ts":1794829978,"zh":"路透：英伟达的 AI 融资机器或能在黄仁勋离开后存续，但风险偏好将降低","en":"路透：英伟达的 AI 融资机器或能在黄仁勋离开后存续，但风险偏好将降低","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXPpsARXAAA6vVO.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122296870336872481","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":1,"rp":0,"vw":716},{"id":"2122296699976593650","h":"dmjk001","ts":1794829938,"zh":"彭博：围绕霍华德·卢特尼克与英伟达的疑问持续增多\n卢特尼克因可能放任英伟达芯片落入不良行为者之手而受到审查，国会要求他就其在美国出口管制项目中的监督职责作出答复。\n卢特尼克已同意在参议院银行委员会作证，以回应两党就其行为提出的质询与关切，包括他未能落实人工智能扩散规则，以及他对 Megaspeed 事件的处理。","en":"彭博：围绕霍华德·卢特尼克与英伟达的疑问持续增多\n卢特尼克因可能放任英伟达芯片落入不良行为者之手而受到审查，国会要求他就其在美国出口管制项目中的监督职责作出答复。\n卢特尼克已同意在参议院银行委员会作证，以回应两党就其行为提出的质询与关切，包括他未能落实人工智能扩散规则，以及他对 Megaspeed 事件的处理。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXPpelJWYAAAZw-.jpg?name=orig"],"u 行器传动链，软硬结合核心赛道）\n传动、结构件、执行器是机器人物理行动的基础硬件，是具身落地最为刚性的一环。重点方向包含减速器、丝杠、轴承、结构件、驱控、手套、设备供应商等。产业链代表标的包括三花智控、拓普集团、恒立液压、双环传动、浙江荣泰、科达利、福赛科技、科森科技、长盈精密、斯菱智驱、金沃股份、新泉股份、田中精机等。硬件是物理AI落地绕不开的载体，行业落地加速阶段，T链的业绩弹性值得持续追踪。\n2. 本体与垂类应用\n机器人整机本体以及垂直场景落地厂商，承载着真机落地、场景闭环、物理数据生成的使命，是物理世界的数据发生器。稀缺材料、整机集成、行业场景服务商处在这一环节，代表上纬新材、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和等。本体厂商最大的价值不单是硬件整机，更是持续运转带来的独家场景数据入口。\n3. 数采链（数据采集闭环）\n高质量真机数据是本轮具身竞赛的核心资源。数采链覆盖传感器、数据采集、信号链路相关企业，代表凡拓数创、奥比中光、芯动联科、华依科技、日盈电子。随着各家具身机型持续试跑、迭代扩容，数据采集需求将会持续放量，数采链是产业军备竞赛里的隐形主线。\n4. OAI供应链条\n直接或是间接供给OpenAI具身项目的国内零部件厂商，兆威机电、长盈精密、立讯精密、中鼎股份、豪鹏科技等，将优先受益其样机迭代、试产放量的订单催化。\n物理AI已经跨过单纯Demo展示阶段，进入落地部署的产业周期。各家大厂的技术路线会持续试错、摇摆、切换，耦合架构、训练数据结构百家争鸣，短期路线具备非常强的不确定性。但整个产业向具身智能前进的长期终点不会改变，一场横跨软硬件的物理AI军备竞赛已经开启。\n行情机会不再是单一主题的脉冲炒作，产业投资主线，应当锚定数据与模型驱动的新叙事，高度把握软硬结合赛道，重点跟踪T链的产业进展。技术路线会不断生变，能够穿越路线波动的硬核硬件、真机场景、物理数据资源，才是具身时代的长期核心资产。","en":"华尔街观察｜具身智能：路线迭变，终点不改，数采与T链价值重估\n风险提示：本文仅为产业逻辑推演复盘，不构成任何投资建议。机器人、具身智能行业技术迭代快、落地不及预期、行业竞争超预期等风险持续存在，个股仅为产业链举例，不做买入推荐。\nOpenAI组织架构调整，市场一度解读为其机器人业务战略收缩。重新审视这次团队变动，本质并不是放弃具身赛道，而是一次研发路线的明确与资源再集中，是将机器人研究并入通用大模型主线的战略选择。\n回溯OpenAI机器人业务的演进，2020年前后曾一轮收缩，2024年重建团队，本轮再次架构整合，背后的核心判断正在显现：GPT‑6、Astra这类通用基座模型，已经具备直接承载部分机器人任务的潜力。研发重心转向通用大模型作为具身智能的“大脑”，集中算力与研发资源收敛大模型范式，用更强的基础模型去驱动物理端智能，赛道的终局目标——迈向具身智能，并未改变，只是行进的路线发生迭代。\n在基座大模型能力快速抬升的时代，具身企业的壁垒正在被重新定义。基础大模型可以快速迭代，但真机运行所产生的高质量物理交互数据、垂直专家场景、线下落地部署入口，是基座模型短期无法替代的护城河。基模变强，会冲击一部分具身公司的原有业务边界，但能够持续产出独有物理数据、场景闭环落地的厂商，模型迭代可以持续拿到额外的边际增益，数据采集链条的长期价值将持续抬升。\n整条具身产业链正在迎来结构性机会，可以划分为四大主线进行跟踪：\n1. T链（执行器传动链，软硬结合核心赛道）\n传动、结构件、执行器是机器人物理行动的基础硬件，是具身落地最为刚性的一环。重点方向包含减速器、丝杠、轴承、结构件、驱控、手套、设备供应商等。产业链代表标的包括三花智控、拓普集团、恒立液压、双环传动、浙江荣泰、科达利、福赛科技、科森科技、长盈精密、斯菱智驱、金沃股份、新泉股份、田中精机等。硬件是物理AI落地绕不开的载体，行业落地加速阶段，T链的业绩弹性值得持续追踪。\n2. 本体与垂类应用\n机器人整机本体以及垂直场景落地厂商，承载着真机落地、场景闭环、物理数据生成的使命，是物理世界的数据发生器。稀缺材料、整机集成、行业场景服务商处在这一环节，代表上纬新材、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和等。本体厂商最大的价值不单是硬件整机，更是持续运转带来的独家场景数据入口。\n3. 数采链（数据采集闭环）\n高质量真机数据是本轮具身竞赛的核心资源。数采链覆盖传感器、数据采集、信号链路相关企业，代表凡拓数创、奥比中光、芯动联科、华依科技、日盈电子。随着各家具身机型持续试跑、迭代扩容，数据采集需求将会持续放量，数采链是产业军备竞赛里的隐形主线。\n4. OAI供应链条\n直接或是间接供给OpenAI具身项目的国内零部件厂商，兆威机电、长盈精密 曦股份、中科飞测、芯原股份跌超10%，寒武纪跌逾8%。上证50只跌0.68%，中证1000跌3.38%，大盘价值明显抗跌，小盘成长最弱。\n#板块与风格 领跌的是光模块、PCB和半导体。 #中际旭创 $300308 跌12.7%，成交215亿元居全市场第一； #新易盛 $300502 跌11.45%。 #沪电股份 $002463 、 #深南电路 $002916 、 #生益科技 $600183 三只PCB龙头跌停，元件是跌停最集中的行业。ETF口径，通信ETF跌8.61%，芯片ETF跌6.72%，半导体ETF跌6.31%，人工智能ETF跌5.65%，半导体设备ETF跌5.56%，军工、机器人、有色跌3.5%到4.2%。 红盘一侧，银行ETF涨1.67%，红利ETF涨1.36%，煤炭ETF涨1.27%，消费ETF涨1.0%，酒和食品饮料小幅收红。 #工商银行 $601398 涨1.92%，盘中再创历史新高； #美的集团 $000333 涨2.13%，股价刷新2021年2月创下的历史高点。\n#资金面 主力资金与板块资金流接口本档未能取到，数据缺失；北向当日不披露。可以确认的是：截至11月13日两市融资余额22497.85亿元，单日减少165.45亿元；据媒体援引的统计，上周股票型ETF合计净流出约422亿元。杠杆和ETF两条线都在退，今天的下跌更多是去拥挤，而不是新增利空。\n#涨停分布 30家涨停里，家电和零售最整齐。 #九阳股份 $002242 、 #小熊电器 $002959 、 #北鼎股份 $300824 、 #长虹美菱 $000521 、 #华帝股份 $002035 涨停， #广百股份 $002187 三连板， #天虹股份 $002419 涨停，内需消费是今天唯一成片的进攻线。固态电池 #紫竹高科 $002058 、 #领湃科技 $300530 涨停；AI漫剧回暖， #吉视传媒 $601929 三天两板， #华数传媒 $000156 涨停。最高板是 #北纬科技 $002148 四连板。电网设备 #顺钠股份 $000533 涨停，带动 #国电南瑞 $600406 涨3.78%。\n#盘中消息 科技链的压力来自几件事叠在一起：英伟达创始人辞任CEO后的余波还在发酵，本周英伟达财报登场前资金不愿接；周末中东局势升温，第三艘美军航母抵达；美联储12月加息预期升温，叠加有关AI融资风险的提示。早盘日韩芯片股转跌，港股大模型和芯片股同步重挫。托底的一面也有，证监会上周表态构建稳的机制、防范异常波动，中美经贸磋商贸易理事会首次会议已在11月13日召开。\n#研报面 这一轮下跌中，财通基金认为AI仍处渗透率早中期，调整属于预期消化；中信建投、东吴证券继续看好国产算力链。防守侧，国投证券11月13日首次覆盖 #工商银行 给予买入评级、目标价9.88元；美的集团近两周获财信证券、申万宏源、中泰证券等多家买入评级，最新一篇是财信证券11月12日。今天盘中未见新的重磅首次覆盖。\n#中美映射 双窗口沿用早间口径。银行与金融是唯一的20日加5日双窗口同现方向，今天银行再创新高，正好兑现。半导体只有5日共振，20日两边都是负的，属于超跌脉冲，今天这一脉冲被彻底打掉，再次说明仅5日上榜的方向不能追。\n#三个方向 一是 #银行与保险红利，双窗口同现，盘中最稳，尾盘仍是首选。二是 #家电与内需消费，龙头创新高加上小家电零售成片涨停，研报密集覆盖，是今天的进攻线，但涨停股不追，做龙头回踩。三是 #电网设备，订单逻辑与防御属性兼具，逆势收红。半导体设备与AI漫剧降为观察。\n#六只个股 #工商银行 $601398 ，涨1.92%创历史新高，双窗口方向的核心，持有不追高。 #中国平安 $601318 ，涨1.34%，保险板块居涨幅前列，补涨品种。 #美的集团 $000333 ，涨2.13%刷新历史高点，研报覆盖最密，回踩91元附近再加。 #国电南瑞 $600406 ，涨3.78%，电网设备逆势走强，防御兼成长。 #横店影视 $603103 ，涨4.04%，院线和AI漫剧逆势回暖，冲高不追。 #北方华创 $002371 ，跌1.84%，明显抗跌于科创50，上周设备板块有资金逆势流入，只作为科技企稳后的首选观察，不在今天接。\n#小盘阿尔法 本档不选。小家电和零售涨停股多为当日一字或快速封板，20日K线位置与最新财报未完成核验，按规则不入选。\n#尾盘观察 看三点。一是沪指能否收回3600点，收不回来明天大概率继续在科技里找底；二是中际旭创和沪电股份尾盘有没有放量承接，没有就别抄；三是银行能否站稳日内高点，银行走弱意味着防守资金也在撤。今天收盘前不建议追涨停家电，也不建议加仓科技。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅" const S = {group:'all', handle:null, range:7, lang:'zh', sort:'time', q:'', topic:null, shown:120};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n||0);
const ACC = {}; DATA.accounts.forEach(a => ACC[a.handle] = a);
const initials = h => (ACC[h]?.name||h).trim().slice(0,1).toUpperCase();

function rel(ts){
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60)+' 分钟前';
  if (d < 86400) return Math.floor(d/3600)+' 小时前';
  if (d < 86400*7) return Math.floor(d/86400)+' 天前';
  return new Date(ts*1000).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
}
function fullTime(ts){
  return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ── 概览 ── */
function renderKpis(){
  const st = DATA.stats;
  const k = [
    ['库内总量', st.total, '条'],
    ['24h 新增', st.today, '条'],
    ['中文可读', st.cn, '条'],
    ['待翻译', st.pending, '条'],
    ['信源', st.accounts, '个'],
  ];
  $('#kpis').innerHTML = k.map(([n,v,u])=>`
    <div class="kpi"><div class="k">${n}</div>
      <div class="v num">${v}<small>${u}</small></div></div>`).join('');
  $('#syncAt').textContent = st.last_sync ? rel(st.last_sync) : '未同步';
  const pend = st.pending;
  $('#dot').className = 'dot' + (pend>0 ? ' warn' : '');
  $('#statusText').textContent = pend>0 ? `${pend} 条待译`
    : (st.last_sync ? `同步于 ${rel(st.last_sync)}` : '等待首次同步');
  $('#transAllText').textContent = pend>0 ? `一键中译 · ${pend}` : '已全部中译';
  $('#transAll').disabled = false;
}

/* ── 信源 ── */
function renderSources(){
  // 计数跟着时间范围走 —— 否则停更号（如南早中文网 2016 年停更）显示 48 条，点进去却是空的
  const now = Date.now()/1000;
  const inRange = DATA.items.filter(i => !(S.range && now - i.ts > S.range*86400));
  const counts = {};
  inRange.forEach(i => counts[i.h] = (counts[i.h]||0)+1);
  let html = `<div class="src ${S.handle===null&&S.group==='all'?'on':''}" data-all="1">
      <div class="av" style="background:#2a3241;color:#c8d2e0">全</div>
      <div class="nm">全部信源</div><div class="ct num">${inRange.length}</div></div>`;
  DATA.groups.forEach(g => {
    const accs = DATA.accounts.filter(a => a.group===g.key && counts[a.handle]);
    if (!accs.length) return;
    html += `<div class="grp-h">${g.label}</div>`;
    accs.forEach(a => {
      html += `<div class="src ${S.handle===a.handle?'on':''}" data-h="${a.handle}" title="${esc(a.note)}">
        <div class="av" style="background:${a.accent}">${(a.name||a.handle).slice(0,1)}</div>
        <div class="nm">${esc(a.name)}</div>
        <div class="ct num">${counts[a.handle]}</div></div>`;
    });
  });
  $('#srcList').innerHTML = html;
  $('#srcCount').textContent = DATA.accounts.filter(a=>counts[a.handle]).length + ' 源';
  $('#srcList').onclick = e => {
    const el = e.target.closest('.src'); if (!el) return;
    if (el.dataset.all) { S.handle = null; S.group = 'all'; }
    else { S.handle = el.dataset.h; S.group = ACC[S.handle].group; }
    S.shown = 120; renderSources(); render();
  };
  // 移动端横向信源条
  const chips = [{h:'', name:'全部'}].concat(
    DATA.accounts.filter(a => counts[a.handle]).map(a => ({h:a.handle, name:a.name})));
  $('#mchips').innerHTML = chips.map(c =>
    `<button class="mchip ${(c.h ? S.handle===c.h : !S.handle)?'on':''}" data-h="${c.h}">${esc(c.name)}</button>`).join('');
  $('#mchips').onclick = e => {
    const b = e.target.closest('.mchip'); if (!b) return;
    S.handle = b.dataset.h || null; S.group = S.handle ? ACC[S.handle].group : 'all';
    S.shown = 120; renderSources(); render();
  };
  const cn = inRange.filter(i=>i.zh).length, en = inRange.length - cn;
  const pct = n => Math.round(n/(inRange.length||1)*100);
  $('#langStat').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:#7ee0a8">中文 ${cn}</span><span style="color:#8fb6e8">英文 ${en}</span></div>
    <div style="height:6px;border-radius:3px;overflow:hidden;background:#1a2030;display:flex">
      <div style="width:${pct(cn)}%;background:linear-gradient(90deg,#2fbf71,#57d894)"></div>
      <div style="width:${pct(en)}%;background:linear-gradient(90deg,#3d70b8,#4ea1ff)"></div>
    </div>`;
}

/* ── 列表 ── */
function filtered(){
  const now = Date.now()/1000;
  let arr = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    if (S.range && now - i.ts > S.range*86400) return false;
    if (S.topic && !(i.t||[]).includes(S.topic)) return false;
    if (S.q){
      const q = S.q.toLowerCase();
      if (!((i.zh||'')+(i.en||'')+ (ACC[i.h]?.name||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  arr.sort(S.sort==='hot'
    ? (a,b)=> (b.lk+b.rt*2+b.rp) - (a.lk+a.rt*2+a.rp)
    : (a,b)=> b.ts - a.ts);
  return arr;
}

function card(i){
  const a = ACC[i.h] || {name:i.h, accent:'#6b7688'};
  const empty = !i.en && !(i.m||[]).length;
  const hasZh = !!i.zh;
  const clamp = t => (t && t.length > 230) ? ' clamp' : '';
  let body = '', orig = '';
  if (!i.en){
    body = `<div class="body" style="color:var(--dim2);font-style:italic">（纯图片 / 视频推文，无文字内容）</div>`;
  } else if (S.lang === 'en' || !hasZh){
    body = `<div class="body${clamp(i.en)}" data-exp>${esc(i.en)}</div>`;
  } else {
    body = `<div class="body zh${clamp(i.zh)}" data-exp>${esc(i.zh)}</div>`;
    if (S.lang === 'dual' && i.zh_src !== 'native') orig = `<div class="orig">${esc(i.en)}</div>`;
  }
  const tag = !i.en ? '<span class="tag en">无正文</span>'
            : hasZh ? (i.zh_src==='native' ? '<span class="tag cn">中文</span>' : '<span class="tag cn">已译</span>')
                    : '<span class="tag un">待译</span>';
  const media = (i.m||[]).slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const links = (i.ln||[]).slice(0,2).map(x=>`<a class="lnk" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.u)}">${esc(x.d)}</a>`).join('');
  const tbtn = (!hasZh && i.en && S.lang!=='en')
    ? `<button class="trans-btn" data-trans="${i.id}">译</button>`
    : (hasZh && i.en && S.lang!=='en' ? `<button class="trans-btn done" data-toggle="${i.id}">原文</button>` : '');
  return `<article class="item" style="--ac:${a.accent}">
    <div class="i-hd">
      <div class="i-av" style="background:${a.accent}">${(a.name||i.h).slice(0,1)}</div>
      <span class="i-nm">${esc(a.name)}</span>
      <span class="h">@${i.h}</span><span class="sep">·</span>
      <span class="t" title="${fullTime(i.ts)}">${rel(i.ts)}</span>
      ${tag}
    </div>
    ${body}${orig}
    ${media?`<div class="media">${media}</div>`:''}
    <div class="i-ft">
      <span class="m">♥ <b class="num">${fmtNum(i.lk)}</b></span>
      <span class="m">⇄ <b class="num">${fmtNum(i.rt)}</b></span>
      <span class="m">💬 <b class="num">${fmtNum(i.rp)}</b></span>
      ${i.vw?`<span class="m vw">👁 <b class="num">${fmtNum(i.vw)}</b></span>`:''}
      ${links}
      <span class="sp"></span>
      ${tbtn}
      <a href="${esc(i.u)}" target="_blank" rel="noopener">原帖 ↗</a>
    </div>
  </article>`;
}

function renderTopics(){
  // 主题计数基于"信源 + 时间"筛选后的结果，点击可叠加主题过滤
  const base = DATA.items.filter(i => {
    if (S.handle && i.h !== S.handle) return false;
    if (!S.handle && S.group!=='all' && ACC[i.h]?.group !== S.group) return false;
    const now = Date.now()/1000;
    if (S.range && now - i.ts > S.range*86400) return false;
    return true;
  });
  const cnt = {};
  base.forEach(i => (i.t||[]).forEach(t => cnt[t] = (cnt[t]||0)+1));
  const list = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#topics').innerHTML = list.length ? list.map(([t,n]) =>
    `<button class="tpc ${S.topic===t?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`).join('')
    : '';
}

function render(){
  renderTopics();
  const arr = filtered();
  $('#cnt').textContent = arr.length;
  const view = arr.slice(0, S.shown);
  $('#feed').innerHTML = view.length ? view.map(card).join('')
    : `<div class="empty">该筛选条件下暂无内容，试试放宽时间范围</div>`;
  $('#more').style.display = arr.length > S.shown ? 'block' : 'none';
  $('#more').textContent = `加载更多（还有 ${arr.length - S.shown} 条）`;
}

/* ── 交互 ── */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.shown = 120; render(); });
$('#rangeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#rangeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range = +b.dataset.range; S.shown = 120; renderSources(); render();
};
$('#sortSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#sortSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.sort = b.dataset.sort; render();
};
$('#langSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('#langSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.lang = b.dataset.lang; render();
};
$('#more').onclick = () => { S.shown += 120; render(); };
$('#topics').onclick = e => {
  const b = e.target.closest('.tpc'); if (!b) return;
  S.topic = (S.topic === b.dataset.t) ? null : b.dataset.t;
  S.shown = 120; render();
};

$('#feed').addEventListener('click', async e => {
  const ex = e.target.closest('.body.clamp[data-exp]');
  if (ex){ ex.classList.remove('clamp'); return; }
  const t = e.target.closest('[data-trans]');
  const g = e.target.closest('[data-toggle]');
  if (g){
    const id = g.dataset.toggle, it = DATA.items.find(x=>x.id===id);
    const b = g.closest('.item').querySelector('.body');
    if (g.dataset.mode === 'en'){
      b.textContent = it.zh; b.className = 'body zh'; g.textContent = '原文'; g.dataset.mode = '';
    } else {
      b.textContent = it.en; b.className = 'body'; g.textContent = '中文'; g.dataset.mode = 'en';
    }
    return;
  }
  if (!t) return;
  const id = t.dataset.trans, it = DATA.items.find(x=>x.id===id);
  t.textContent = '译中…'; t.disabled = true;
  try{
    const r = await fetch('api/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.zh) throw new Error('空译文');
    it.zh = j.zh; DATA.stats.cn++; DATA.stats.pending = Math.max(0, DATA.stats.pending-1);
    renderKpis(); render();
  }catch(err){
    t.textContent = '译'; t.disabled = false;
    toast('实时翻译不可用（静态模式）。历史推文已预翻译，新推文会在下次定时任务后自动补上译文。');
  }
});

$('#transAll').onclick = async () => {
  const pend = DATA.items.filter(i=>!i.zh);
  if (!pend.length){ S.lang='zh'; [...$('#langSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.lang==='zh')); render(); toast('全部条目均已有中文译文'); return; }
  const btn = $('#transAll'); btn.disabled = true;
  let ok = 0;
  for (const it of pend.slice(0,60)){
    try{
      const r = await fetch('api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id})});
      if (!r.ok) throw 0;
      const j = await r.json(); if (j.zh){ it.zh = j.zh; ok++; }
    }catch(_){ break; }
    $('#transAllText').textContent = `翻译中 ${ok}/${Math.min(pend.length,60)}`;
  }
  btn.disabled = false;
  if (ok){ DATA.stats.cn += ok; DATA.stats.pending = Math.max(0, DATA.stats.pending-ok); renderKpis(); render(); toast(`已翻译 ${ok} 条`); }
  else { toast('当前为静态视图，无法实时翻译；新推文会在下一轮定时任务后带译文入库'); }
  $('#transAllText').textContent = '一键中译';
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

renderKpis(); renderSources(); render();
</script>
</body>
</html>
