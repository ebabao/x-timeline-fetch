":"zh","m":[],"u":"https://x.com/bboczeng/status/2125105145755394520","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":1,"vw":1071},{"id":"2125102894596911304","h":"cnfinancewatch","ts":1795498987,"zh":"意力给英伟达单票，并用亢奋标签包住一个其实并不一边倒的评论结构。相同的是都在庆祝反弹，不同的是国内更容易在下午去接力四连板和二连板，海外扫描里中性和看空的比例仍然不低，而且把收购方下跌、五日仍为负的杠杆半导体，留在了视野里。午后真正要防的，不是指数会不会翻红——午市已经翻红——而是谁把“主线还在”当成继续追高的理由，谁又把港股下跌、加息日历和已经拥挤的连板，当成了看不见的背景。\n风险提示：以上为公开讨论整理，抓取受限处已注明，二手统计和扫描分类不代表真实民意比例，不构成投资建议。","en":"意力给英伟达单票，并用亢奋标签包住一个其实并不一边倒的评论结构。相同的是都在庆祝反弹，不同的是国内更容易在下午去接力四连板和二连板，海外扫描里中性和看空的比例仍然不低，而且把收购方下跌、五日仍为负的杠杆半导体，留在了视野里。午后真正要防的，不是指数会不会翻红——午市已经翻红——而是谁把“主线还在”当成继续追高的理由，谁又把港股下跌、加息日历和已经拥挤的连板，当成了看不见的背景。\n风险提示：以上为公开讨论整理，抓取受限处已注明，二手统计和扫描分类不代表真实民意比例，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125102894596911304","l":[],"ln":[],"t":["美联储","A股港股","AI科技"],"lk":0,"rt":0,"rp":0,"vw":673},{"id":"2125102891392516272","h":"cnfinancewatch","ts":1795498986,"zh":"散户热议｜2026-11-24·午间\n数据时点：国内方面，已检索并打开韭研公社11月24日盘前、早报与午盘分析等页面；多数长文需登录，未能完整抓取正文，下文只使用公开可见的标题、发布时间、作者披露和页面上能直接读到的评论，不编造引语，也不把搜索引擎对标题的改写当成原文。韭研网本期未检索到可引用的专帖。海外方面，Reddit\nWallStreetBets本期仍未能直接打开；改用Tradestie对WSB讨论的扫描页（页面标注更新于11月24日03:59\nUTC，约北京时间11:59），以及Stocktwits于美东11月23日18:56（约北京时间24日07:56）刊发的新闻稿。后一篇是周一收盘后的平台转述，不是本午间的实时统计。情绪标签、投票和小样本拆分不代表全市场比例；对留言只做意译概括，不是逐字引语。本档截稿约北京时间11月24日13:45。\n国内：标题已经从“怎么接高开”，改成“高开回了，下午还能不能接”\n早间档还能看到社区把黄仁勋复职写成开盘弹性。今天盘前，韭研公社可见标题直接问“英伟达一夜暴涨31%，日韩今晨高开，A股怎么接”，作者时间为08:44，并写明不持有相关标的；另有早报把算力硬件、液冷、PCB、机器人、AI传媒并列，以及一篇把英伟达链、物理AI、PCB和半导体放在一起的概念梳理。能直接读到的评论不多，且多为感谢，其中一条公开可见的短评只写“科技还是科技”。这些标题说明，开盘前国内讨论的重心已经不是要不要做科技，而是高开之后怎么下手。\n到了11:45，同一作者的午盘分析标题改成“高开冲高回落，看下午量能能否持续”。正文未能打开，但标题本身已经把上午的交易结果说清楚了：先冲，后回，分歧转到下午的承接。这和公开午评是对齐的。澎湃新闻11:33的午盘稿写明，AI硬件侧短线获利盘兑现，中际旭创、新易盛从盘初高点明显回落；相对更强的是物理AI、光伏逆变器，文化传媒和军工也活跃，油气、有色、煤炭疲软，银行是探底回弹。新华财经则把人形机器人的连板梯队和中京电子4连板、工业富联触及涨停写在一起。也就是说，散户能在公开标题里看到的主线，并没有跑出券商午评的框架，只是措辞更短、更强调“还要不要接”。\n和券商口径相同的地方很清楚：都承认这是高开修复，不是普涨牛市；都看到机器人、物理AI的辨识度高于已经兑现一部分涨幅的光模块；都把量能和回踩当成午后的关键，而不是把早盘最高点当成趋势确认。和券商口径不同、也更容易在下午出错的地方，是开盘前“怎么接”很容易滑向名单和连板接力。中京电子已经4连板，克来机电、长华集团3连板，福莱新材等2连板，凡拓数创继续大幅上涨，这类位置对社区最有视觉刺激，也最容易把“主线还在”理解成“还能往上加仓”。被忽略的风险更具体：港股恒生科技午市下跌，小米、美团走弱，说明同一套AI叙事在香港并没有被同步加价；两融保证金下调要到11月30日才施行，半日成交放大不等于杠杆资金已经按理论上限进场；盛剑科技此前已收监管工作函，高标若在回落后再被当成低吸，风险和开盘追涨是同一类。邮件转述的“羊”字辈、预制菜连板，以及九阳股份登上热股榜，更像情绪支线，基本面支撑弱，不应当成主线的验证。\n海外：情绪标签很热，但英伟达这条讨论仍然不是一边倒\n本期未能直接打开WSB原帖，只能看二手扫描。Tradestie页面统计24小时分析讨论1515条，把“人群情绪”标成77/100、约79.6%偏多，并加上“亢奋”一类标签，较早间档的1481条、约77.9%偏多再热了一点。英伟达仍是提及最集中的股票，24小时324次、约合近七日均值的2.6倍，但看多、中性、看空的拆分是34%、44%和22%，和早间档的35%、43%、22%几乎一样：热度极高，方向并不统一。必须说明，这是扫描页的分类和抽样，不是论坛官方统计。\n更值得看的是，讨论已经从“一个人回来了”扩到并购和杠杆。Zscaler的提及量约为近七日均值的6.0倍，是该页的“冲高领头”；CrowdStrike虽收跌约8.92%，扫描里看多比例仍到61%。这和国内连板情绪类似，都是把一个大交易迅速交易到两只股票的相反方向上。SOXL单日涨约39.93%，但五日仍跌约11.38%；美光五日仍是负的。说明周一的暴涨修复了情绪，并没有把上周的伤口全部结痂。HPE在该页上出现时，价格仍停在周一收盘的48.02美元、涨17.38%，对盘后回落的讨论还没有成为主流样本，这本身就是一种滞后。\nStocktwits新闻稿的口径更热，但时间更早：刊于周一收盘后，写明英伟达相关情绪处在“极度看多”、留言量“极高”。稿件引用的进行中投票显示，近64%的受访者在黄仁勋回归后更看多，15%感觉没变，9%更看空，12%认为现在下结论太早；同一篇还转述S3\nPartners的估算，空头周一约亏损120亿美元，几乎抹掉此前七个交易日约90%的浮盈，但这些空头年内对英伟达仍约盈利40亿美元。稿件同时注明，英伟达年内仍下跌约12%。这些数字是平台和第三方估算，不是交易所官方统计。对海外散户来说，今天可以继续炒“回来了”，但投票里仍有相当比例在观望，国会听证和调查也没有从讨论里消失。\n两边合在一起看：国内已经把问题从“会不会高开”换成“高开回了以后还要不要接”，海外则仍把大部分注","en":"散户热议｜2026-11-24·午间\n数据时点：国内方面，已检索并打开韭研公社11月24日盘前、早报与午盘分析等页面；多数长文需登录，未能完整抓取正文，下文只使用公开可见的标题、发布时间、作者披露和页面上能直接读到的评论，不编造引语，也不把搜索引擎对标题的改写当成原文。韭研网本期未检索到可引用的专帖。海外方面，Reddit\nWallStreetBets本期仍未能直接打开；改用Tradestie对WSB讨论的扫描页（页面标注更新于11月24日03:59\nUTC，约北京时间11:59），以及Stocktwits于美东11月23日18:56（约北京时间24日07:56）刊发的新闻稿。后一篇是周一收盘后的平台转述，不是本午间的实时统计。情绪标签、投票和小样本拆分不代表全市场比例；对留言只做意译概括，不是逐字引语。本档截稿约北京时间11月24日13:45。\n国内：标题已经从“怎么接高开”，改成“高开回了，下午还能不能接”\n早间档还能看到社区把黄仁勋复职写成开盘弹性。今天盘前，韭研公社可见标题直接问“英伟达一夜暴涨31%，日韩今晨高开，A股怎么接”，作者时间为08:44，并写明不持有相关标的；另有早报把算力硬件、液冷、PCB、机器人、AI传媒并列，以及一篇把英伟达链、物理AI、PCB和半导体放在一起的概念梳理。能直接读到的评论不多，且多为感谢，其中一条公开可见的短评只写“科技还是科技”。这些标题说明，开盘前国内讨论的重心已经不是要不要做科技，而是高开之后怎么下手。\n到了11:45，同一作者的午盘分析标题改成“高开冲高回落，看下午量能能否持续”。正文未能打开，但标题本身已经把上午的交易结果说清楚了：先冲，后回，分歧转到下午的承接。这和公开午评是对齐的。澎湃新闻11:33的午盘稿写明，AI硬件侧短线获利盘兑现，中际旭创、新易盛从盘初高点明显回落；相对更强的是物理AI、光伏逆变器，文化传媒和军工也活跃，油气、有色、煤炭疲软，银行是探底回弹。新华财经则把人形机器人的连板梯队和中京电子4连板、工业富联触及涨停写在一起。也就是说，散户能在公开标题里看到的主线，并没有跑出券商午评的框架，只是措辞更短、更强调“还要不要接”。\n和券商口径相同的地方很清楚：都承认这是高开修复，不是普涨牛市；都看到机器人、物理AI的辨识度高于已经兑现一部分涨幅的光模块；都把量能和回踩当成午后的关键，而不是把早盘最高点当成趋势确认。和券商口径不同、也更容易在下午出错的地方，是开盘前“怎么接”很容易滑向名单和连板接力。中京电子已经4连板，克来机电、长华集团3连板，福莱新材等2连板，凡拓数创继续大幅上涨，这类位置对社区最有视觉刺激，也最容易把“主线还在”理解成“还能往上加仓”。被忽略的风险更具体：港股恒生科技午市下跌，小米、美团走弱，说明同一套AI叙事在香港并没有被同步加价；两融保证金下调要到11月30日才施行，半日成交放大不等于杠杆资金已经按理论上限进场；盛剑科技此前已收监管工作函，高标若在回落后再被当成低吸，风险和开盘追涨是同一类。邮件转述的“羊”字辈、预制菜连板，以及九阳股份登上热股榜，更像情绪支线，基本面支撑弱，不应当成主线的验证。\n海外：情绪标签很热，但英伟达这条讨论仍然不是一边倒\n本期未能直接打开WSB原帖，只能看二手扫描。Tradestie页面统计24小时分析讨论1515条，把“人群情绪”标成77/100、约79.6%偏多，并加上“亢奋”一类标签，较早间档的1481条、约77.9%偏多再热了一点。英伟达仍是提及最集中的股票，24小时324次、约合近七日均值的2.6倍，但看多、中性、看空的拆分是34%、44%和22%，和早间档的35%、43%、22%几乎一样：热度极高，方向并不统一。必须说明，这是扫描页的分类和抽样，不是论坛官方统计。\n更值得看的是，讨论已经从“一个人回来了”扩到并购和杠杆。Zscaler的提及量约为近七日均值的6.0倍，是该页的“冲高领头”；CrowdStrike虽收跌约8.92%，扫描里看多比例仍到61%。这和国内连板情绪类似，都是把一个大交易迅速交易到两只股票的相反方向上。SOXL单日涨约39.93%，但五日仍跌约11.38%；美光五日仍是负的。说明周一的暴涨修复了情绪，并没有把上周的伤口全部结痂。HPE在该页上出现时，价格仍停在周一收盘的48.02美元、涨17.38%，对盘后回落的讨论还没有成为主流样本，这本身就是一种滞后。\nStocktwits新闻稿的口径更热，但时间更早：刊于周一收盘后，写明英伟达相关情绪处在“极度看多”、留言量“极高”。稿件引用的进行中投票显示，近64%的受访者在黄仁勋回归后更看多，15%感觉没变，9%更看空，12%认为现在下结论太早；同一篇还转述S3\nPartners的估算，空头周一约亏损120亿美元，几乎抹掉此前七个交易日约90%的浮盈，但这些空头年内对英伟达仍约盈利40亿美元。稿件同时注明，英伟达年内仍下跌约12%。这些数字是平台和第三方估算，不是交易所官方统计。对海外散户来说，今天可以继续炒“回来了”，但投票里仍有相当比例在观望，国会听证和调查也没有从讨论里消失。\n两边合在一起看：国内已经把问题从“会不会高开”换成“高开回了以后还要不要接”，海外则仍把大部分注","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125102891392516272","l":[],"ln":[],"t":["A股港股","AI科技"],"lk":1,"rt":0,"rp":2,"vw":1557},{"id":"2125102658482847758","h":"cnfinancewatch","ts":1795498930,"zh":"力士，说明国内更像情绪补涨，而不是已经按“产能售罄”重新定价。这个方向适合作为主线的基本面对照，不适合当成午后追高的新故事。\n三大利空方向（由强到弱）\n一、高开回落本身就是今天最强的约束，说明这是修复，不是反转。创业板从一度涨超4%回到1.90%，光模块把隔夜缺口在开盘附近就吐出一部分，银行和券商没有形成权重共振。光大证券的公开观点仍是：AI资本开支持续性短期内无法证伪、经济基本面弹性有限，指数缺乏反转条件。连板梯队里已经出现分歧：午间邮件转述大东方午市附近回落，预制菜和部分高位题材不再是铁板一块；凡拓数创继续大涨，但公司此前已提示数据采集暂无营收、前三季度亏损，题材和基本面是分开的。对谁不利：在开盘第一小时按“外盘涨多少、A股就该跟多少”去追已经触及涨停或多连板的股票。\n二、港股背离，加上加息和国会日历，说明全球科技并没有一起打开空间。恒指和恒生科技午市收跌，和日韩、A股成长股不是同一幅画面。美联储“三把手”仍称通胀过高，早间已核实的12月加息25个基点概率约96.1%，本档未见需要改写的新概率。黄仁勋将于12月3日出席美国参议院听证会，公司也仍要配合调查。Anthropic未来数年算力与基础设施承诺约9000亿美元，但债市预期其债券可能落在投机级、约BB区间，有报道称其计划募集的资金大约只相当于支出承诺的十分之一；其上市后前两个交易日较首笔成交约跌20%，周一科技股大反弹时仍偏弱，不能把“9000亿美元”直接写成立刻可融资、立刻可开支的现金。摩根士丹利将Meta目标价从820美元下调至720美元、维持增持，花旗将赛富时目标价从263美元下调至198美元、维持中性，提示软件和应用变现慢于硬件。对高估值成长，这些是中期紧箍咒，只是今天被硬件反弹盖过去了。\n三、金油回落和地缘扰动，限制了防御板块和资源股的对冲功能。贵金属午市调整，山东黄金、紫金矿业走弱；港股山东黄金跌超4%。原油沿用周一已核实结算：WTI\n80.17美元、跌3.88%，布伦特89.37美元、跌3.46%，中国石油同步承压。刚果（金）将从11月30日起再暂停钴出口，至监管机构另行决定，这是供给事件，但不是今天盘面的主线。新华社报道，伊朗革命卫队称过去数小时有3艘“违规”油轮在霍尔木兹海峡触雷起火，未公布国籍；油价并未因此转强，公开报道认为市场对“海峡被全面封锁”的极端担忧在减弱。另有媒体援引知情官员称，五角大楼推迟向乌克兰交付累计约40枚爱国者PAC-3拦截弹，这是转述，未见美国国防部官方全文，本档不当作已落地的正式声明。对投资而言，军工可以有主题脉冲，但油价和黄金今天并没有提供新的避险主升。还需要记住：融资保证金下调仍是11月30日起施行，不能把理论杠杆空间当成今天已经进场的钱。\n小结：外盘把门推开了，A股只把门开了一半，港股还把门带上了一点。上午最有价值的信息不是“全线高开”，而是高开之后谁在兑现、谁还在接力。算力硬件和机器人仍是主线，存储是更干净的产业对照；真正要防的，是把日韩暴涨翻译成追四连板，并把复职、长约和回购写成风险已经出清。午后看量能能否在回踩后接住，而不是看开盘幅度能否再走一遍。","en":"力士，说明国内更像情绪补涨，而不是已经按“产能售罄”重新定价。这个方向适合作为主线的基本面对照，不适合当成午后追高的新故事。\n三大利空方向（由强到弱）\n一、高开回落本身就是今天最强的约束，说明这是修复，不是反转。创业板从一度涨超4%回到1.90%，光模块把隔夜缺口在开盘附近就吐出一部分，银行和券商没有形成权重共振。光大证券的公开观点仍是：AI资本开支持续性短期内无法证伪、经济基本面弹性有限，指数缺乏反转条件。连板梯队里已经出现分歧：午间邮件转述大东方午市附近回落，预制菜和部分高位题材不再是铁板一块；凡拓数创继续大涨，但公司此前已提示数据采集暂无营收、前三季度亏损，题材和基本面是分开的。对谁不利：在开盘第一小时按“外盘涨多少、A股就该跟多少”去追已经触及涨停或多连板的股票。\n二、港股背离，加上加息和国会日历，说明全球科技并没有一起打开空间。恒指和恒生科技午市收跌，和日韩、A股成长股不是同一幅画面。美联储“三把手”仍称通胀过高，早间已核实的12月加息25个基点概率约96.1%，本档未见需要改写的新概率。黄仁勋将于12月3日出席美国参议院听证会，公司也仍要配合调查。Anthropic未来数年算力与基础设施承诺约9000亿美元，但债市预期其债券可能落在投机级、约BB区间，有报道称其计划募集的资金大约只相当于支出承诺的十分之一；其上市后前两个交易日较首笔成交约跌20%，周一科技股大反弹时仍偏弱，不能把“9000亿美元”直接写成立刻可融资、立刻可开支的现金。摩根士丹利将Meta目标价从820美元下调至720美元、维持增持，花旗将赛富时目标价从263美元下调至198美元、维持中性，提示软件和应用变现慢于硬件。对高估值成长，这些是中期紧箍咒，只是今天被硬件反弹盖过去了。\n三、金油回落和地缘扰动，限制了防御板块和资源股的对冲功能。贵金属午市调整，山东黄金、紫金矿业走弱；港股山东黄金跌超4%。原油沿用周一已核实结算：WTI\n80.17美元、跌3.88%，布伦特89.37美元、跌3.46%，中国石油同步承压。刚果（金）将从11月30日起再暂停钴出口，至监管机构另行决定，这是供给事件，但不是今天盘面的主线。新华社报道，伊朗革命卫队称过去数小时有3艘“违规”油轮在霍尔木兹海峡触雷起火，未公布国籍；油价并未因此转强，公开报道认为市场对“海峡被全面封锁”的极端担忧在减弱。另有媒体援引知情官员称，五角大楼推迟向乌克兰交付累计约40枚爱国者PAC-3拦截弹，这是转述，未见美国国防部官方全文，本档不当作已落地的正式声明。对投资而言，军工可以有主题脉冲，但油价和黄金今天并没有提供新的避险主升。还需要记住：融资保证金下调仍是11月30日起施行，不能把理论杠杆空间当成今天已经进场的钱。\n小结：外盘把门推开了，A股只把门开了一半，港股还把门带上了一点。上午最有价值的信息不是“全线高开”，而是高开之后谁在兑现、谁还在接力。算力硬件和机器人仍是主线，存储是更干净的产业对照；真正要防的，是把日韩暴涨翻译成追四连板，并把复职、长约和回购写成风险已经出清。午后看量能能否在回踩后接住，而不是看开盘幅度能否再走一遍。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125102658482847758","l":[],"ln":[],"t":["美联储","通胀","A股港股","原油能源","AI科技","财报","黄金"],"lk":1,"rt":0,"rp":0,"vw":671},{"id":"2125102654615597358","h":"cnfinancewatch","ts":1795498930,"zh":"热点财经新闻综述｜2026-11-24·午间\n数据时点：A股、港股为11月24日午间收盘；创业板开盘与盘中最高价取自公开行情接口，并与新华财经、东方财富Choice、澎湃新闻的午评交叉核对。韩国KOSPI与三星电子、SK海力士报价，采用E-Daily截至韩国时间13:04（北京时间12:04）的盘中数据，韩股午后仍在交易，不是收盘价。日经225为公开报道的半日收盘。台湾加权取经济日报转述中央社的盘中最高，因截稿前后收盘口径尚不完全一致，本档不把未核对的收盘价写成定论。美股仍为美东11月23日常规交易收盘，个股盘后另有标注。现货与原油沿用已核实的周一结算或收盘。本档截稿约北京时间11月24日13:45。本期新处理两封热点财经邮件：11月24日早间08:10版与午间13:10版（均在收件箱）。11月23日晚间版已在早间档处理，不重复计入。标“邮件转述”的内容未逐条核实。\n今日判断\n今天不是全面牛市的开门红，而是一场由外围情绪抬起来、又被获利盘迅速削薄的高开修复。午市已核实：上证指数收3555.49点，涨0.47%；深证成指收10550.87点，涨0.92%；创业板指收2323.48点，涨1.90%；科创50收1261.26点，涨2.72%；北证50涨1.83%，报809.93点。创业板开盘2368.70点，约高开3.88%，盘中最高2376.34点，一度涨超4%，随后震荡收窄到午市的1.90%，是典型的高开回落。东方财富Choice统计，全市场3123家上涨、2273家下跌，67只涨停；半日成交11210亿元，较上一交易日放量2046亿元。午间邮件里“放量超2300亿”，对应的是成交刚破1万亿时的盯盘口径，不是午盘对比，本档以午评数字为准。澎湃新闻援引Wind的上涨家数同为3123家，下跌记为2271家、平盘185家，与Choice略有出入，不影响“涨多跌少、但不是全面爆发”的判断。\n外部触发很清楚。隔夜英伟达复职后收涨31.48%、报165.05美元，纳指涨6.51%，费城半导体涨14.03%。今早韩国KOSPI开盘后迅速拉升，韩国交易所在当地时间约9:06启动买入侧车，暂停程序化买盘；中文报道常写成“熔断”，实质不是全市场停牌。E-Daily写明，截至13:04，KOSPI报5054.06点，涨7.34%，盘中最高5065.74点；三星电子涨8.45%，SK海力士涨9.22%；同期只有散户净卖出约1.4925万亿韩元，外资、机构分别为净买入。台股盘中最高见到40180.38点，涨3368.49点、涨幅9.15%，为史上最大盘中涨点、历史第二大涨幅，仅次于2025年4月10日的9.39%，逾550档涨停。日经225半日收涨3.97%。但港股没有跟上：恒生指数午市报22295.94点，跌0.39%；恒生科技指数跌0.99%；小米跌超4%，美团、哔哩哔哩跌超3%，联想则涨超4%。A股内部同样是结构市：消费电子、半导体、影视院线、机器人靠前，贵金属、煤炭、券商、石油走弱，银行是探底后回弹，不是领涨。今天的结论因此很明确——弹性仍在算力硬件和机器人，但已经从“高开就要追”变成“看回踩和午后量能”，不能写成趋势反转。\n三大利多方向（由强到弱）\n一、光模块、PCB和AI服务器，是今天把外盘涨幅接进来的主通道，也是最早出现获利了结的地方。已核实：中京电子走出4连板，工业富联早盘触及涨停，天孚通信在新华财经午评时涨近8%；PCB方向里，胜宏科技、东山精密等跟涨，港股里胜宏科技午市也涨超9%。这是对隔夜英伟达和亚太半导体暴涨的直接映射，对光模块、高端PCB和服务器代工最敏感。但澎湃午盘写得很直白：AI硬件侧短线获利盘兑现，中际旭创、新易盛从盘初高点明显回落。行情接口也显示，中际旭创开盘463.20元，较前收417.20元高开逾11%，最高见到469元后回落。海外同样不是“好消息就继续涨”：慧与公布财年第四季度营收145亿美元、同比增50%，服务器收入88亿美元、同比增94.7%，AI系统订单45亿美元，但周一收盘前股价已大涨，盘后转弱，市场在计价利润率而不是只看订单。对投资的含义是：主线还在，定价已经提前，下午要看成色，不追第一波。\n二、人形机器人和物理AI，是今天辨识度最高、连板梯队最完整的方向。新华财经午评：克来机电、长华集团走出3连板，宁波东力、锋龙股份、福莱新材、安培龙2连板，方正电机涨停；AI眼镜方向也有联创电子、共达电声涨停。中信建投继续把物理AI写成人工智能的下一波浪潮，强调大脑、小脑和本体的能力建设。对零部件、减速器和传感器公司，这是情绪和产业叙事的叠加；对已经连续涨停的高标，它更多是接力风险。早间邮件还转述自变量新模型的“零样本成功率”等具体数字，未见权威交叉核实，只作为主题热度，不写成已落实的订单或量产事实。华为今天宣布鸿蒙终端设备数突破1亿，叠加下午还有新品发布会，可能继续给消费电子和端侧AI加热，但那是午后变量，不把它提前写成已经兑现的涨因。\n三、存储周期提供了比概念股更清楚的产业映射。已核实：美光周一涨19.04%。多家中文媒体转述知情人士称，三星电子2027年至2029年大部分存储产能已被合同锁定，部分客户希望把长约延至2031年；这是传闻口径，不是公司正式公告。韩国存储股今天的涨幅，把这条逻辑当场交易了出来。对A股的兆易创新、长鑫科技和封测公司是中期支撑，但它们今天的跟涨幅度明显小于海","en":"热点财经新闻综述｜2026-11-24·午间\n数据时点：A股、港股为11月24日午间收盘；创业板开盘与盘中最高价取自公开行情接口，并与新华财经、东方财富Choice、澎湃新闻的午评交叉核对。韩国KOSPI与三星电子、SK海力士报价，采用E-Daily截至韩国时间13:04（北京时间12:04）的盘中数据，韩股午后仍在交易，不是收盘价。日经225为公开报道的半日收盘。台湾加权取经济日报转述中央社的盘中最高，因截稿前后收盘口径尚不完全一致，本档不把未核对的收盘价写成定论。美股仍为美东11月23日常规交易收盘，个股盘后另有标注。现货与原油沿用已核实的周一结算或收盘。本档截稿约北京时间11月24日13:45。本期新处理两封热点财经邮件：11月24日早间08:10版与午间13:10版（均在收件箱）。11月23日晚间版已在早间档处理，不重复计入。标“邮件转述”的内容未逐条核实。\n今日判断\n今天不是全面牛市的开门红，而是一场由外围情绪抬起来、又被获利盘迅速削薄的高开修复。午市已核实：上证指数收3555.49点，涨0.47%；深证成指收10550.87点，涨0.92%；创业板指收2323.48点，涨1.90%；科创50收1261.26点，涨2.72%；北证50涨1.83%，报809.93点。创业板开盘2368.70点，约高开3.88%，盘中最高2376.34点，一度涨超4%，随后震荡收窄到午市的1.90%，是典型的高开回落。东方财富Choice统计，全市场3123家上涨、2273家下跌，67只涨停；半日成交11210亿元，较上一交易日放量2046亿元。午间邮件里“放量超2300亿”，对应的是成交刚破1万亿时的盯盘口径，不是午盘对比，本档以午评数字为准。澎湃新闻援引Wind的上涨家数同为3123家，下跌记为2271家、平盘185家，与Choice略有出入，不影响“涨多跌少、但不是全面爆发”的判断。\n外部触发很清楚。隔夜英伟达复职后收涨31.48%、报165.05美元，纳指涨6.51%，费城半导体涨14.03%。今早韩国KOSPI开盘后迅速拉升，韩国交易所在当地时间约9:06启动买入侧车，暂停程序化买盘；中文报道常写成“熔断”，实质不是全市场停牌。E-Daily写明，截至13:04，KOSPI报5054.06点，涨7.34%，盘中最高5065.74点；三星电子涨8.45%，SK海力士涨9.22%；同期只有散户净卖出约1.4925万亿韩元，外资、机构分别为净买入。台股盘中最高见到40180.38点，涨3368.49点、涨幅9.15%，为史上最大盘中涨点、历史第二大涨幅，仅次于2025年4月10日的9.39%，逾550档涨停。日经225半日收涨3.97%。但港股没有跟上：恒生指数午市报22295.94点，跌0.39%；恒生科技指数跌0.99%；小米跌超4%，美团、哔哩哔哩跌超3%，联想则涨超4%。A股内部同样是结构市：消费电子、半导体、影视院线、机器人靠前，贵金属、煤炭、券商、石油走弱，银行是探底后回弹，不是领涨。今天的结论因此很明确——弹性仍在算力硬件和机器人， 公开听证会，重点关注美国芯片出口管制监管问题。","en":"黄仁勋接下来要接受两场国会听证。首先是12月1日（下周二）众议院三个委员会的闭门听证会，全程会有文字记录。随后是12月3日（下周四）参议院银行委员会公开听证会，重点关注美国芯片出口管制监管问题。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX3fkFlakAAnrJx.png?name=orig"],"u":"https://x.com/fxtrader/status/2125101295539466261","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":15,"rt":0,"rp":5,"vw":4440},{"id":"2125101288732189151","h":"bboczeng","ts":1795498604,"zh":"OpenAI 宣布推出名为“OpenWorks”的新项目，将向 AI 专家每月支付最高 8,000 美元，帮助本地小企业采用人工智能。","en":"OpenAI 宣布推出名为“OpenWorks”的新项目，将向 AI 专家每月支付最高 8,000 美元，帮助本地小企业采用人工智能。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125101288732189151","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2125101154250174834","h":"bboczeng","ts":1795498572,"zh":"据报道，黄仁勋承认自己的婚外情比此前披露的更多。\n😅😅😅","en":"据报道，黄仁勋承认自己的婚外情比此前披露的更多。\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125101154250174834","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":127},{"id":"2125098838587330898","h":"kevinnbass","ts":1795498020,"zh":"Coefficient Giving 由 Anthropic 投资者达斯汀·莫斯科维茨 (Dustin Moskowitz) 创立，在新闻和政策机构上花费了数亿美元，塑造了黄仁勋的故事。\n这是它的工作原理。\n达斯汀·莫斯科维茨 (Dustin Moskowitz) 将其 Anthropic 股票的数十亿美元投资到了 Good Ventures 基金会。\nGood Ventures 基金会为 Coefficient Giving 提供资金。\n股价越高，从 Coefficient Giving 衍生出来的非营利网络获得的资金就越多。\n因此，达斯汀·莫斯科维茨 (Dustin Moskowitz) 领导下的 Anthropic 非营利网络有直接动机去帮助 Anthropic 消灭其竞争对手。\n您可以在图中看到这一点的实际效果。\n为什么国会不调查这个流氓人类非营利网络试图操纵政客和公众舆论的方式？","en":"Coefficient Giving, founded by Anthropic investor Dustin Moskowitz, spent hundreds of millions on both journalism and policy outfits that shaped the Jensen Huang story.\nHere's how this works.\nDustin Moskowitz invested billions of dollars of his Anthropic stock into Good Ventures Foundation.\nGood Ventures Foundation funds Coefficient Giving.\nThe higher the stock goes, the bigger the money pile of the nonprofit network spinning out of Coefficient Giving gets.\nThe Anthropic nonprofit network under Dustin Moskowitz therefore has a direct incentive to try to help Anthropic eliminate its competitors.\nYou can see this in action in the figure.\nWhy isn't Congress investigating the ways that this rogue Anthropic nonprofit network is trying to manipulate politicians and public opinion?","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HX3cvpnWIAAymSn.jpg?name=orig"],"u":"https://x.com/kevinnbass/status/2125098838587330898","l":[],"ln":[],"t":[],"lk":6143,"rt":1469,"rp":217,"vw":633640},{"id":"2125098640264065114","h":"tychozzz","ts":1795497972,"zh":"昨天黄仁勋回归英伟达之后，英伟达单日暴涨 30%，创下了公司 20 多年以来最大的单日涨幅，纳指单天市值暴涨 2 万亿美元。\n只有失而复得才知道珍惜，黄仁勋作为美国 AI 的灵魂人物，一个人就价值数万亿美元。\n现在很多人关心的一个问题是，这波会不会直接 V 反，重复 25 年4 月的剧本？\n可能性不大，当下的大环境和前两年有明显的区别。但黄仁勋回归，起码把过去两周压在 AI 和半导体产业链上最致命的看空逻辑大幅削掉了。这波黑天鹅落地后，市场本质上是回到了 11 月初的逻辑线上。\n之前老黄卸任，伤的不只是英伟达的估值，更是整个 AI 产业链的信用背书，neocloud 融资可能会出问题，上游半导体产业链的扩产节奏也可能会放缓，牵一发而动全身。老黄回来之后，这个鬼故事也就结束了。\n剩下的主要还是宏观利率和中期选举之后的政策风险。不过关于这两点，我自己没有太悲观。\n宏观层面，过去一个月的暴跌叠加 AI 融资成本飙升，其实已经变相帮美联储做了一次紧缩，压制了通胀的预期。如果后续通胀回落，市场在明年上半年大概率就会提前交易降息的拐点。\n政策层面，民主党反数据中心浪潮这个靴子还没落地，但我不太相信民主党真有那么蠢，会因为党争而继续无脑打压 AI，差不多就得了，感觉最后大概率还是会达成某种妥协。\n回到短期走势，12 月还有 FOMC 会议，直接一路 V 反的概率偏小。但经过这轮风波，市场的注意力终究会回到 AI 本身的供需和落地上，行情会慢慢走出来。\n📈 投资美股用 BIT，稳定币直接入金，持有真实股票，终身免佣，丝滑交易美股。","en":"昨天黄仁勋回归英伟达之后，英伟达单日暴涨 30%，创下了公司 20 多年以来最大的单日涨幅，纳指单天市值暴涨 2 万亿美元。\n只有失而复得才知道珍惜，黄仁勋作为美国 AI 的灵魂人物，一个人就价值数万亿美元。\n现在很多人关心的一个问题是，这波会不会直接 V 反，重复 25 年4 月的剧本？\n可能性不大，当下的大环境和前两年有明显的区别。但黄仁勋回归，起码把过去两周压在 AI 和半导体产业链上最致命的看空逻辑大幅削掉了。这波黑天鹅落地后，市场本质上是回到了 11 月初的逻辑线上。\n之前老黄卸任，伤的不只是英伟达的估值，更是整个 AI 产业链的信用背书，neocloud 融资可能会出问题，上游半导体产业链的扩产节奏也可能会放缓，牵一发而动全身。老黄回来之后，这个鬼故事也就结束了。\n剩下的主要还是宏观利率和中期选举之后的政策风险。不过关于这两点，我自己没有太悲观。\n宏观层面，过去一个月的暴跌叠加 AI 融资成本飙升，其实已经变相帮美联储做了一次紧缩，压制了通胀的预期。如果后续通胀回落，市场在明年上半年大概率就会提前交易降息的拐点。\n政策层面，民主党反数据中心浪潮这个靴子还没落地，但我不太相信民主党真有那么蠢，会因为党争而继续无脑打压 AI，差不多就得了，感觉最后大概率还是会达成某种妥协。\n回到短期走势，12 月还有 FOMC 会议，直接一路 V 反的概率偏小。但经过这轮风波，市场的注意力终究会回到 AI 本身的供需和落地上，行情会慢慢走出来。\n📈 投资美股用 BIT，稳定币直接入金，持有真实股票，终身免佣，丝滑交易美股。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tychozzz/status/2125098640264065114 u":"https://x.com/CrushTheShorts/status/2125088793107771793","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":1045},{"id":"2125087382496264694","h":"dmjk001","ts":1795495288,"zh":"彭博：马来西亚要求数据中心切断与美国黑名单上企业的合作\n马来西亚将建议数据中心运营商不要为七家新被列入美国贸易黑名单的公司提供托管、租赁空间或服务，此举旨在加大力度防止该国蓬勃发展的产业被用来规避美国的技术限制。\n投资、贸易及工业部周二在一份声明中表示：“马来西亚仍致力于营造一个安全、透明和基于规则的贸易环境，不会允许自己被用作规避出口管制的渠道。将对被发现违反任何法律的相关方采取行动。”","en":"彭博：马来西亚要求数据中心切断与美国黑名单上企业的合作\n马来西亚将建议数据中心运营商不要为七家新被列入美国贸易黑名单的公司提供托管、租赁空间或服务，此举旨在加大力度防止该国蓬勃发展的产业被用来规避美国的技术限制。\n投资、贸易及工业部周二在一份声明中表示：“马来西亚仍致力于营造一个安全、透明和基于规则的贸易环境，不会允许自己被用作规避出口管制的渠道。将对被发现违反任何法律的相关方采取行动。”","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX3Thyha8AAWMVK.png?name=orig"],"u":"https://x.com/dmjk001/status/2125087382496264694","l":[],"ln":[],"t":["关税贸易"],"lk":3,"rt":1,"rp":0,"vw":1695},{"id":"2125087186546819431","h":"baoshu88","ts":1795495242,"zh":"老黄虽然复职了，但是董事会趁这 11 天，顺手给老黄装了三道紧箍咒，以后不让他碰对华事务了：\n 1. 针对历史出口合规的内部调查并没有撤销，继续查；\n 2. 董事会新设“国家安全与出口管制委员会”，全由独立董事掌管对华敏感业务，等于把中国区的决策权从 CEO 手里直接拿走了；\n 3. 首席合规官和总法律顾问不再向 CEO 汇报，直接向董事会负责。","en":"老黄虽然复职了，但是董事会趁这 11 天，顺手给老黄装了三道紧箍咒，以后不让他碰对华事务了：\n 1. 针对历史出口合规的内部调查并没有撤销，继续查；\n 2. 董事会新设“国家安全与出口管制委员会”，全由独立董事掌管对华敏感业务，等于把中国区的决策权从 CEO 手里直接拿走了；\n 3. 首席合规官和总法律顾问不再向 CEO 汇报，直接向董事会负责。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX3ThfKbEAAy94r.png?name=orig"],"u":"https://x.com/baoshu88/status/2125087186546819431","l":[],"ln":[],"t":["关税贸易"],"lk":20,"rt":4,"rp":5,"vw":3167},{"id":"2125086526015000639","h":"TJ_Research","ts":1795495084,"zh":"如果💇都能把老黄理回来，太可怕了，太可怕了，我怕下次走在路上真有人拿着剃刀追我🥹","en":"如果💇都能把老黄理回来，太可怕了，太可怕了，我怕下次走在路上真有人拿着剃刀追我🥹","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2125086526015000639","l":[],"ln":[],"t":[],"lk":93,"rt":0,"rp":26,"vw":6881},{"id":"2125085575107744169","h":"yijiangren","ts":1795494857,"zh":"人真的不多啊\n第三名甚至都不到一万交易量\n目前$2000交易量就可以进前十拿30刀\n这么好的活动不来试一下吗大家\n@togetherdotfun","en":"人真的不多啊\n第三名甚至都不到一万交易量\n目前$2000交易量就可以进前十拿30刀\n这么好的活动不来试一下吗大家\n@togetherdotfun","zh_src":"native" 腥风血雨。最关键是现在就要考虑建立系统接班人，你下次有点意外走了，谁知道怎么办\n第二，你现在最大对手不是政治和小报空头打手，而是你的大客户。这些云大厂都在上面自研芯片，当CUDA护城河不在，推理大时代，拼的是谁的算力最高效\n第三，美国给予了你一切，你也要看到世界单极化在台湾的供应链风险，下一次如果台海战争，你是否能有足够的美国本地产能代工和封装\n第四，所有都是政治，但你大而不能倒的时候。但不是免死金牌，一旦进入宫斗环节，国会审查还在继续，民主党远远不会放过你，从现在开始就要把所有纪录和订单讲清楚。\n第五，半导体央行地位还要保，毕竟多少行业人一起为你摇旗呐喊。从扶持新云第三方的算力服务商，多元化是必要的；但是到处江湖意气当老大，表外输血冲动要管住，他们也要有自身造血，不能你无限兜底，有多余资金，还不如回购股票，让股东发财\n市场当然爱听“王者归来”的桥段，但世上没有免费午餐，对于投资人，这时候你也不要希望，政治保驾护航下，你的估值还能回到30-40倍，这就是政治管制和参与的代价，也是一个英伟达的成就未来百年帝国的“成人礼”。\n最后，对待你的家人，她们付出了太多。你把爱洒满人间和AI行业，唯独没有给你的家人。","en":"这当然不是好莱坞式的英雄归来，希望下一次 $NVDA 换CEO的时候，不用上上下下几万亿来证明\n有多少爱可以从来，黄仁勋2.0时代，我对老黄5点忠告，也是所有投资英伟达股东首先要考虑的机遇和风险所在\n第一，刚回去，别急着搞内部清洗。独立调查和证监会还在继续，不要给对手送弹药，真真假假内部人爆料都是腥风血雨。最关键是现在就要考虑建立系统接班人，你下次有点意外走了，谁知道怎么办\n第二，你现在最大对手不是政治和小报空头打手，而是你的大客户。这些云大厂都在上面自研芯片，当CUDA护城河不在，推理大时代，拼的是谁的算力最高效\n第三，美国给予了你一切，你也要看到世界单极化在台湾的供应链风险，下一次如果台海战争，你是否能有足够的美国本地产能代工和封装\n第四，所有都是政治，但你大而不能倒的时候。但不是免死金牌，一旦进入宫斗环节，国会审查还在继续，民主党远远不会放过你，从现在开始就要把所有纪录和订单讲清楚。\n第五，半导体央行地位还要保，毕竟多少行业人一起为你摇旗呐喊。从扶持新云第三方的算力服务商，多元化是必要的；但是到处江湖意气当老大，表外输血冲动要管住，他们也要有自身造血，不能你无限兜底，有多余资金，还不如回购股票，让股东发财\n市场当然爱听“王者归来”的桥段，但世上没有免费午餐，对于投资人，这时候你也不要希望，政治保驾护航下，你的估值还能回到30-40倍，这就是政治管制和参与的代价，也是一个英伟达的成就未来百年帝国的“成人礼”。\n最后，对待你的家人，她们付出了太多。你把爱洒满人间和AI行业，唯独没有给你的家人。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX3IxohaQAA9IJ8.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2125075475458613591","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":2,"rp":0,"vw":1292},{"id":"2125074884669907192","h":"peng_hellen","ts":1795492309,"zh":"第一句就很有意思，所以上周连黄仁勋本人都不知道自己要复职了，他被市场，政府，董事会搬来搬去，犹如一尊佛龛，摆在那，大家就稳了。\n市场的节奏绑定在了一个人身上。老黄即使想走，走不了，想留，不是他说了算，想休息几天骑个摩托周游几圈，没有那个自由。\n对于这种CEO举足轻重的头部科技公司，长持是最稳妥的，不要做短线，更不要做空。过去12天两次大反转就是反复调戏短线者，让你猜中了开头，猜错结尾，猜中了结尾又猜错开头。要是再加个杠杆，基本一次就够下牌桌了。","en":"第一句就很有意思，所以上周连黄仁勋本人都不知道自己要复职了，他被市场，政府，董事会搬来搬去，犹如一尊佛龛，摆在那，大家就稳了。\n市场的节奏绑定在了一个人身上。老黄即使想走，走不了，想留，不是他说了算，想休息几天骑个摩托周游几圈，没有那个自由。\n对于这种CEO举足轻重的头部科技公司，长持是最稳妥的，不要做短线，更不要做空。过去12天两次大反转就是反复调戏短线者，让你猜中了开头，猜错结尾，猜中了结尾又猜错开头。要是再加个杠杆，基本一次就够下牌桌了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/peng_hel ,"d":"darrencr2024.substack.com"}],"t":["AI科技"],"lk":4,"rt":0,"rp":0,"vw":921},{"id":"2125066051335717051","h":"tychozzz","ts":1795490203,"zh":"从 Claude 切换到 Antigravity 之后，这两天我久久不能释怀的一个功能，就是 Anthropic 9 月份推出的新版 Claude Projects，从来没有过这么优雅的 AI 交互体验。\n一个 Project 就是一次对话，比如说我开发投资导航网站，我就只在这个对话里面提需求，包括某个产品功能开发、某个页面 UI 优化、某个 Bug 修复，还有每天自动跑的定时任务。\nClaude 会根据对话里面提出的需求，把它分解成一个个线程，比如说产品功能迭代线程，UI 优化线程，Bug 修复线程。\n以后如果有类似的需求，这个大对话会自动帮你把需求提交给对应的线程。如果这个需求是一次性的，子线程在处理完之后会自动收起来。\n不同子线程之间还可以通过主对话来互相通信，也就是说这些线程不是一个个孤岛。如果你不小心在 A 线程里问了 B 线程相关的东西，A 会通过主对话把任务转交给 B。\n太优雅了，太妙了，用过之后绝对会爱不释手，怎么会有这么牛逼的 AI 产品，可惜市面上找不到类似的平替啊…","en":"从 Claude 切换到 Antigravity 之后，这两天我久久不能释怀的一个功能，就是 Anthropic 9 月份推出的新版 Claude Projects，从来没有过这么优雅的 AI 交互体验。\n一个 Project 就是一次对话，比如说我开发投资导航网站，我就只在这个对话里面提需求，包括某个产品功能开发、某个页面 UI 优化、某个 Bug 修复，还有每天自动跑的定时任务。\nClaude 会根据对话里面提出的需求，把它分解成一个个线程，比如说产品功能迭代线程，UI 优化线程，Bug 修复线程。\n以后如果有类似的需求，这个大对话会自动帮你把需求提交给对应的线程。如果这个需求是一次性的，子线程在处理完之后会自动收起来。\n不同子线程之间还可以通过主对话来互相通信，也就是说这些线程不是一个个孤岛。如果你不小心在 A 线程里问了 B 线程相关的东西，A 会通过主对话把任务转交给 B。\n太优雅了，太妙了，用过之后绝对会爱不释手，怎么会有这么牛逼的 AI 产品，可惜市面上找不到类似的平替啊…","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tychozzz/status/2125066051335717051","l":[],"ln":[],"t":["AI科技"],"lk":19,"rt":1,"rp":5,"vw":1947},{"id":"2125064602014916922","h":"dmjk001","ts":1795489857,"zh":"路透：英伟达和黄仁勋面临哪些美国联邦和州层面的调查？","en":"路透：英伟达和黄仁勋面临哪些美国联邦和州层面的调查？","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX2-7IracAAwTzD.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2125064602014916922","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":1508},{"id":"2125063324664746369","h":"bboczeng","ts":1795489553,"zh":"@wangzhian8848 不是，您也就只是个记者，不也自信心爆棚，帮中国的电动车和人工智能指明方向吗？\n😅😅😅","en":"@wangzhian8848 不是，您也就只是个记者，不也自信心爆棚，帮中国的电动车和人工智能指明方向吗？\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125063324664746369","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":1,"rp":0,"vw":3},{"id":"2125062716473876696","h":"TraderS18","ts":1795489408,"zh":"还真是屁股决定脑袋呀。我这波确实是亏了钱，但前一条下面冷嘲热讽的人也太奇怪了 场里，从博主角度最好的就是对冲自己，违背自己原本的投资逻辑，加一些做空仓位，或者直接做空，不断改变方法。\n怕错或者营造永赢人设，这些我都不需要也不在乎，因为我一直错，事后总结加大方向做对我自己就满意了。\n很多人上网来找股神，其实网络只有两类人：骗子和有亏有赚的正常人","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2125050353099985371","l":[],"ln":[],"t":[],"lk":99,"rt":1,"rp":11,"vw":6558},{"id":"2125050020118614240","h":"fxtrader","ts":1795486380,"zh":"马来西亚总理安华接受南华早报采访表示，在与中国的关系处理上，比处理与美国的关系要容易得多，因为在科技领域存在紧张关系。中国从未对马来西亚与美国关系密切表示过担忧，也没有阻碍任何与美国的科技合作安排。\n🗒️中国大陆和香港分别是马来西亚仅次于新加坡的第二和第三大外国投资来源地。","en":"马来西亚总理安华接受南华早报采访表示，在与中国的关系处理上，比处理与美国的关系要容易得多，因为在科技领域存在紧张关系。中国从未对马来西亚与美国关系密切表示过担忧，也没有阻碍任何与美国的科技合作安排。\n🗒️中国大陆和香港分别是马来西亚仅次于新加坡的第二和第三大外国投资来源地。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX2xtwcbQAAheX8.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2125050020118614240","l":[],"ln":[],"t":[],"lk":17,"rt":3,"rp":2,"vw":5380},{"id":"2125049820956242010","h":"dmjk001","ts":1795486333,"zh":"彭博：特朗普政府将阿里巴巴集团控股有限公司的一家新加坡子公司，以及 Megaspeed International 的多家关联实体列入黑名单。该公司是一起丑闻的核心，该丑闻曾一度导致黄仁勋失去英伟达公司首席执行官职位。","en":"彭博：特朗普政府将阿里巴巴集团控股有限公司的一家新加坡子公司，以及 Megaspeed International 的多家关联实体列入黑名单。该公司是一起丑闻的核心，该丑闻曾一度导致黄仁勋失去英伟达公司首席执行官职位。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX2xfKoaMAAs-Sj.png?name=orig"],"u":"https://x.com/dmjk001/status/2125049820956242010","l":[],"ln":[],"t":["AI科技"],"lk":4,"rt":0,"rp":0,"vw":1534},{"id":"2125045232106664140","h":"cnfinancewatch","ts":1795485239,"zh":"A股宽基15%：黄金10%：短债10%：跨境55%","en":"A股宽基15%：黄金10%：短债10%：跨境55%","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125045232106664140","l":[],"ln":[],"t":["黄金"],"lk":0,"rt":0,"rp":0,"vw":476},{"id":"2125045228432421047","h":"cnfinancewatch","ts":1795485238,"zh":"ETF轮动策略重点观察A股名单：\n第一步：A股核心，四只各管一段\n这四只的分工是“大盘稳、小盘弹、创业板吃制造、科创50吃芯片”。先看各自的分量（全收益口径，含股息再投资）\n沪深300\n创业板指\n中证1000\n科创50\n年化波动从17%到28.6%，最大回撤从-72.8%到-79.3%。你想多赚那2个点，代价是回撤能多扛10个点。\n四只的行业暴露完全不同。 科创50里电子一个行业就占70.35%；创业板指里电力设备和通信合计超50%；沪深300是金融、消费、工业分散；中证1000是1000只小盘，谁冒头谁进来。\n这就是为什么四只都要留：它们覆盖的是产业周期的不同阶段。AI和芯片周期来了，科创50领跑；新能源和制造周期来了，创业板领跑；风格转向大盘防守，沪深300扛住；流动性宽松、小盘活跃，中证1000跟上。\n顺便看一眼当前位置：截至2026年10月30日，沪深300的PE（TTM）约12.87倍，处在近十年约53%分位。不贵，也不便宜了。\n第二步：跨境四只\n标普500：管“面”。 十一个行业的经济体切片，美国整体经济。1985年以来含股息年化约11.5%。\n纳指100：管“尖”。 全球科技龙头，1985年以来含股息年化13.4%~14.8%，长期回报最高，波动也最大。\n日经225：管“另一个时区”。亚太核心市场，2026年涨了33%~36%。\n德国DAX：管“欧洲制造”。 40只德国大盘股，集中在汽车、化工、工业，驱动逻辑跟美股科技、A股制造都不一样。\n第三步：黄金ETF+短债ETF\n债券管通缩和流动性危机。 2020年3月疫情冲击，股票、黄金、红利全被抛售，只有债券维持正收益。\n黄金管通胀和货币信用。 2022年俄乌冲突推高能源价格，黄金涨9.80%，同期海外股债双杀。","en":"ETF轮动策略重点观察A股名单：\n第一步：A股核心，四只各管一段\n这四只的分工是“大盘稳、小盘弹、创业板吃制造、科创50吃芯片”。先看各自的分量（全收益口径，含股息再投资）\n沪深300\n创业板指\n中证1000\n科创50\n年化波动从17%到28.6%，最大回撤从-72.8%到-79.3%。你想多赚那2个点，代价是回撤能多扛10个点。\n四只的行业暴露完全不同。 科创50里电子一个行业就占70.35%；创业板指里电力设备和通信合计超50%；沪深300是金融、消费、工业分散；中证1000是1000只小盘，谁冒头谁进来。\n这就是为什么四只都要留：它们覆盖的是产业周期的不同阶段。AI和芯片周期来了，科创50领跑；新能源和制造周期来了，创业板领跑；风格转向大盘防守，沪深300扛住；流动性宽松、小盘活跃，中证1000跟上。\n顺便看一眼当前位置：截至2026年10月30日，沪深300的PE（TTM）约12.87倍，处在近十年约53%分位。不贵，也不便宜了。\n第二步：跨境四只\n标普500：管“面”。 十一个行业的经济体切片，美国整体经济。1985年以来含股息年化约11.5%。\n纳指100：管“尖”。 全球科技龙头，1985年以来含股息年化13.4%~14.8%，长期回报最高，波动也最大。\n日经225：管“另一个时区”。亚太核心市场，2026年涨了33%~36%。\n德国DAX：管“欧洲制造”。 40只德国大盘股，集中在汽车、化工、工业，驱动逻辑跟美股科技、A股制造都不一样。\n第三步：黄金ETF+短债ETF\n债券管通缩和流动性危机。 2020年3月疫情冲击，股票、黄金、红利全被抛售，只有债券维持正收益。\n黄金管通胀和货币信用。 2022年俄乌冲突推高能源价格，黄金涨9.80%，同期海外股债双杀。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125045228432421047","l":[],"ln":[],"t":["通胀","美股","A股港股","AI科技","黄金"],"lk":2,"rt":2,"rp":3,"vw":1060},{"id":"2125045016007774618","h":"bboczeng","ts":1795485187,"zh":"转自被大家拉黑的：","en":"转自被大家拉黑的：","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/bboczeng/status/2125045016007774618","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":497},{"id":"2125044979391471844","h":"bboczeng","ts":1795485179,"zh":"你们不打听打听，简中第一大V勃哥是什么江湖地位，黄仁勋本人来了也得评论一句“谢谢勃哥”","en":"你们不打听打听，简中第一大V勃哥是什么江湖地位，黄仁勋本人来了也得评论一句“谢谢勃哥”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125044979391471844","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":783},{"id":"2125044776042889247","h":"TJ_Research","ts":1795485130,"zh":"疯狂的一天，有时间坐下来听了川普早上的采访，他反复聊到了“I MADE A DEAL”，我做了一笔交易，交易是什么，不知道，但他给了英伟达董事会担保，黄仁勋和国家安全没关系，他非常安全，绝对安全。\n政治事件用政治手段处理了。很多反对声音聊到了公司治理（CORPORATE GOVERNANCE），CNBC有个问题是“怎么划这条线？什么样的人会有像老黄这样的特权”，川普回答的特别好“感觉”\n黄仁勋就是一个牵涉到美国未来国运的人，很多事情在做判断时，只能两者取其轻，哪种决定最后对更多的人有利，即使选择的另外一头是公司治理。\nP.S. 看到英伟达的员工欢迎老黄回归的现场，试问这个世界上有多少公司的员工会这样对老板的？为川普的介入点赞","en":"疯狂的一天，有时间坐下来听了川普早上的采访，他反复聊到了“I MADE A DEAL”，我做了一笔交易，交易是什么，不知道，但他给了英伟达董事会担保，黄仁勋和国家安全没关系，他非常安全，绝对安全。\n政治事件用政治手段处理了。很多反对声音聊到了公司治理（CORPORATE GOVERNANCE），CNBC有个问题是“怎么划这条线？什么样的人会有像老黄这样的特权”，川普回答的特别好“感觉”\n黄仁勋就是一个牵涉到美国未来国运的人，很多事情在做判断时，只能两者取其轻，哪种决定最后对更多的人有利，即使选择的另外一头是公司治理。\nP.S. 看到英伟达的员工欢迎老黄回归的现场，试问这个世界上有多少公司的员工会这样对老板的？为川普的介入点赞","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2125044776042889247","l":[],"ln":[],"t":["AI科技"],"lk":93,"rt":2,"rp":20,"vw":5432},{"id":"2125044574741762109","h":"qinbafrank","ts":1795485082,"zh":"昨晚真是谁跌谁尴尬，老黄回归在声势上受损的就是ANT了，上周又把绿鞋都给行权了，这两点会不会把ANT干下去🤔","en":"昨晚真是谁跌谁尴尬，老黄回归在声势上受损的就是ANT了，上周又把绿鞋都给行权了，这两点会不会把ANT干下去🤔","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX2q3oHb0AA62re.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2125044574741762109","l":[],"ln":[],"t":[],"lk":13,"rt":0,"rp":9,"vw":3414},{"id":"2125044470249038313","h":"bboczeng","ts":1795485057,"zh":"啊？所以川普每次救市都是因为被一群富人要求的\n包括25年大解放日\n那么，如果28年民主党上台执政\n将会是怎么样一幅完全不同的场景？\n🥲🥲🥲","en":"啊？所以川普每次救市都是因为被一群富人要求的\n包括25年大解放日\n那么，如果28年民主党上台执政\n将会是怎么样一幅完全不同的场景？\n🥲🥲🥲","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125044470249038313","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":2,"vw":634},{"id":"2125043603353510077","h":"nytchinese","ts":1795484851,"zh":"黄仁勋复职重掌英伟达，美股大涨但两党批评声不断。英伟达董事会表示，“美国政府高级层面的意见”令董事会成员确信黄仁勋不构成国家安全风险。英伟达股价收涨超过31%。但黄仁勋的复职遭到两党的一致质疑。","en":"黄仁勋复职重掌英伟达，美股大涨但两党批评声不断。英伟达董事会表示，“美国政府高级层面的意见”令董事会成员确信黄仁勋不构成国家安全风险。英伟达股价收涨超过31%。但黄仁勋的复职遭到两党的一致质疑。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2125043603353510077","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/business/20261124/nvidia-jensen-huang/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["美股","AI科技"],"lk":14,"rt":4,"rp":44,"vw":6234},{"id":"2125042757207212324","h":"fxtrader","ts":1795484649,"zh":"#行情 上证指数涨超1%，CPO、英伟达、元件、半导体等板块涨幅居前；沪深京三市5000股上涨。","en":"#行情 上证指数涨超1%，CPO、英伟达、元件、半导体等板块涨幅居前；沪深京三市5000股上涨。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX2rHamaAAAIO24.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2125042757207212324","l":[],"ln":[],"t":["A股港股","AI科技"],"lk":9,"rt":0,"rp":3,"vw":3634},{"id":"2125041903879979044","h":"Love1mothe","ts":1795484445,"zh":"刚看完黄仁勋今天复职回英伟达总部的现场直拍，这80秒简直是顶级创始人危机公关教科书。\n先看穿搭，标志性的黑皮衣脱了，换了件极低调的藏青夹克，进门就把锋芒收干净了。\n开场根本没打官腔，直接自嘲：今天第一天上班，没电脑，得找IT领台新PC。下面员工喊DGX Spark，他顺嘴接个RTX Spark，十秒把紧绷气氛全敲碎。\n紧接着收起笑脸，连说两遍抱歉让大家跟着受累，直认自己犯了大错。话音刚落，就有女员工冲出来抱了他十几秒，随后中庭里山呼海啸全是Jensen的喊声。\n他右手按在胸口停了几秒，最后丢下一句：谢谢大家给的第二次机会，这一次我会当个更好的CEO。\n一周前董事会还把门关得死死的，11天后全票请人回来，很多人看完觉得魔幻。\n其实商业世界哪有什么魔幻，单季千亿美金体量的战车在狂飙，公司、华尔街和员工心里都清楚，这台机器离了谁都能转，唯独现在离不了他。\n从奥特曼到黄仁勋，你们觉得超级创始人的不可替代性，对一家巨头公司到底是护城河，还是最大的定时炸弹？","en":"刚看完黄仁勋今天复职回英伟达总部的现场直拍，这80秒简直是顶级创始人危机公关教科书。\n先看穿搭，标志性的黑皮衣脱了，换了件极低调的藏青夹克，进门就把锋芒收干净了。\n开场根本没打官腔，直接自嘲：今天第一天上班，没电脑，得找IT领台新PC。下面员工喊DGX Spark，他顺嘴接个RTX Spark，十秒把紧绷气氛全敲碎。\n紧接着收起笑脸，连说两遍抱歉让大家跟着受累，直认自己犯了大错。话音刚落，就有女员工冲出来抱了他十几秒，随后中庭里山呼海啸全是Jensen的喊声。\n他右手按在胸口停了几秒，最后丢下一句：谢谢大家给的第二次机会，这一次我会当个更好的CEO。\n一周前董事会还把门关得死死的，11天后全票请人回来，很多人看完觉得魔幻。\n其实商业世界哪有什么魔幻，单季千亿美金体量的战车在狂飙，公司、华尔街和员工心里都清楚，这台机器离了谁都能转，唯独现在离不了他。\n从奥特曼到黄仁勋，你们觉得超级创始人的不可替代性，对一家巨头公司到底是护城河，还是最大的定时炸弹？","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2125041333551132672/vid/avc1/1080x1818/Dz2MFuZ20rJSWClP.mp4?tag=29"],"u":"https://x.com/Love1mothe/status/2125041903879979044","l":[],"ln":[],"t":["AI科技"],"lk":17240,"rt":1499,"rp":552,"vw":2454464},{"id":"2125041835060191442","h":"AntonLaVay","ts":1795484429,"zh":"其实没有那么麻烦\n就是实际上没有人能替代Jensen，找不到能替代的人。\n黄仁勋的面子没有替代品\n虽然看上去这不够现代西方公司管理学，但是呢，也不要装外宾，马斯克，乔布斯都是这种Keyman。\n其实挺常见的。","en":"其实没有那么麻烦\n就是实际上没有人能替代Jensen，找不到能替代的人。\n黄仁勋的面子没有替代品\n虽然看上去这不够现代西方公司管理学，但是呢，也不要装外宾，马斯克，乔布斯都是这种Keyman。\n其实挺常见的。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX2qSDKXAAAF3UB.jpg?name=orig"],"u":"https://x.com/AntonLaVay/status/2125041835060191442","l":[],"ln":[],"t":[],"lk":21,"rt":0,"rp":0,"vw":2062},{"id":"2125041715228942803","h":"Balder13946731","ts":1795484400,"zh":"今天的美股复盘视频：美股为什么暴涨？黄仁勋回归，英伟达一天涨 31%，是反转还是轧空；明天看戴尔财报。","en":"今天的美股复盘视频：美股为什么暴涨？黄仁勋回归，英伟达一天涨 31%，是反转还是轧空；明天看戴尔财报。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2125041715228942803","l":["youtu.be"],"ln":[{"u":"https://youtu.be/YNWr0G2cEgo","d":"youtu.be"}],"t":["美股","AI科技","财报"],"lk":3,"rt":0,"rp":0,"vw":1507},{"id":"2125040115764330721","h":"AntonLaVay","ts":1795484019,"zh":"OK，现在所有的事情都应该显而易见了吧？\n我们综合Rubio和民主党Chuck Schumer的反应应该足以绘制出“Jensen Huang incident”的整个图景：\n共和党内建制强硬派对Jensen 展开调查，但是除了发现Jensen和Alice有一腿以外并没有查到什么东西，他们早已预计川普会输掉中期选举\n请注意以内斗的角度来看\n川普的失败是Maga党人的失败而不是传统共和党人的失败，Maga的失败反而凸显了传统共和党人的伟光正和川普的小丑。\n而传统的共和党强硬派和民主党强硬派是有两党共识的，反而在当前这个各方势力群魔乱舞的时候没有什么太大的矛盾。\n请再次注意，如果我们继续以内斗的角度来看问题：民主党本次的胜利并不一定对于民主党是好事，除了这次胜利基本完全来自对川普不满的反弹的原因以外更重要的原因来自“大获全胜”本胜。\n民主党的各个派系都在中选中获胜了，那特么既然大家的路线都能获胜，那凭什么你们的路线能走我的路线就走不得呢？\n均匀的胜利，无益于解决内部的纷争。\n这次胜利并不能帮助民主党人结束内斗，反而会增强内斗，你们能看到，民主党刚刚大胜，就马上有人跳出来挑战Schumer了。\nRudio这个人，没什么意思，她在我看来就是一个古墓派的保守强硬共和党人，感觉像来自上个世纪。\n新一代民粹右翼（美国的 MAGA/万斯派，以及欧洲的德国选择党 AfD、奥地利自由党等），已经把主要敌人重新定义了。\n在他们眼里，头号敌人不再是克里姆林宫的威权扩张，而是布鲁塞尔，华盛顿，达沃斯所代表的“跨国自由主义精英、大规模移民与觉醒文化”。\n哇，这之后，得斗成啥样呀，分裂的左翼，分裂的人右翼，美国现在这个政治氛围太热闹了。","en":"OK，现在所有的事情都应该显而易见了吧？\n我们综合Rubio和民主党Chuck Schumer的反应应该足以绘制出“Jensen Huang incident”的整个图景：\n共和党内建制强硬派对Jensen 展开调查，但是除了发现Jensen和Alice有一腿以外并没有查到什么东西，他们早已预计川普会输掉中期选举\n请注意以内斗的角度来看\n川普的失败是Maga党人的失败而不是传统共和党人的失败，Maga的失败反而凸显了传统共和党人的伟光正和川普的小丑。\n而传统的共和党强硬派和民主党强硬派是有两党共识的，反而在当前这个各方势力群魔乱舞的时候没有什么太大的矛盾。\n请再次注意，如果我们继续以内斗的角度来看问题：民主党本次的胜利并不一定对于民主党是好事，除了这次胜利基本完全来自对川普不满的反弹的原因以外更重要的原因来自“大获全胜”本胜。\n民主党的各个派系都在中选中获胜了，那特么既然大家的路线都能获胜，那凭什么你们的路线能走我的路线就走不得呢？\n均匀的胜利，无益于解决内部的纷争。\n这次胜利并不能帮助民主党人结束内斗，反而会增强内斗，你们能看到，民主党刚刚大胜，就马上有人跳出来挑战Schumer了。\nRudio这个人，没什么意思，她在我看来就是一个古墓派的保守强硬共和党人，感觉像来自上个世纪。\n新一代民粹右翼（美国的 MAGA/万斯派，以及欧洲的德国选择党 AfD、奥地利自由党等），已经把主要敌人重新定义了。\n在他们眼里，头号敌人不再是克里姆林宫的威权扩张，而是布鲁塞尔，华盛顿，达沃斯所代表的“跨国自由主义精英、大规模移民与觉醒文化”。\n哇，这之后，得斗成啥样呀，分裂的左翼，分裂的人右翼，美国现在这个政治氛围太热闹了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2125040115764330721","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":402},{"id":"2125036801215865054","h":"bboczeng","ts":1795483229,"zh":"其实那些最近看到美股暴跌，开始做空的空头KOL们\n蛮惨的，\n周五刚翻空，今天就爆拉30%\n都不知道怎么转型了\n当然，这并不是他们的错\n这是这个市场疯狂，不可预测，大家都在每天算命，跳大神的错\n今天的事情揭露了这一本质\n希望大家看清之后\n选择好自己未来的保命策略","en":"其实那些最近看到美股暴跌，开始做空的空头KOL们\n蛮惨的，\n周五刚翻空，今天就爆拉30%\n都不知道怎么转型了\n当然，这并不是他们的错\n这是这个市场疯狂，不可预测，大家都在每天算命，跳大神的错\n今天的事情揭露了这一本质\n希望大家看清之后\n选择好自己未来的保命策略","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125036801215865054","l":[],"ln":[],"t":["美股"],"lk":16,"rt":0,"rp":0,"vw":1367},{"id":"2125035508099407923","h":"bboczeng","ts":1795482921,"zh":"我没说他要继续跌啊，我周末的文章和space，以及我的推特\n说的难道不是已经跌的足够多，跌到baseline I之后，可以大举按比例抄底了吗\n还有人说我反手做多了\n跌到100我就all in，可惜没给我机会\n😅😅😅","en":"我没说他要继续跌啊，我周末的文章和space，以及我的推特\n说的难道不是已经跌的足够多，跌到baseline I之后，可以大举按比例抄底了吗\n还有人说我反手做多了\n跌到100我就all in，可惜没给我机会\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125035508099407923","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":2,"vw":1322},{"id":"2125034427273379866","h":"bboczeng","ts":1795482663,"zh":"美股真的是越来越诡异了，其实我也知道周五跌到120已经算是非常便宜，周五Space有人说要跌回50我也觉得不可能\n毕竟都回到了2025年1月分，我和粉红打赌跌不破120，跌破就回国的那个时候\n但我估计就算是个多头，也不可能想到黄仁勋能在12月听证会之前就回归——而且还是特朗普直接要求，董事会被迫决定的\n董事会之前的态度呢？\n股价大涨30%，最大的多头都做不出这样的梦\n所以，不论你是多头还是空头，周一的行情其实说明不了任何问题，毕竟上周的暴跌本质上也是出人意料的\n唯一能确定的事情时，美股在“不要脸”这件事是已经是登峰造极，载入史册了\n在这种行情中，只有定投，才能养活自己30年\n让我们一起戒赌，一起按计划抄底、定投\n谢谢大家","en":"美股真的是越来越诡异了，其实我也知道周五跌到120已经算是非常便宜，周五Space有人说要跌回50我也觉得不可能\n毕竟都回到了2025年1月分，我和粉红打赌跌不破120，跌破就回国的那个时候\n但我估计就算是个多头，也不可能想到黄仁勋能在12月听证会之前就回归——而且还是特朗普直接要求，董事会被迫决定的\n董事会之前的态度呢？\n股价大涨30%，最大的多头都做不出这样的梦\n所以，不论你是多头还是空头，周一的行情其实说明不了任何问题，毕竟上周的暴跌本质上也是出人意料的\n唯一能确定的事情时，美股在“不要脸”这件事是已经是登峰造极，载入史册了\n在这种行情中，只有定投，才能养活自己30年\n让我们一起戒赌，一起按计划抄底、定投\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125034427273379866","l":[],"ln":[],"t":["美股"],"lk":1,"rt":0,"rp":0,"vw":45},{"id":"2125034356712575124","h":"qinbafrank","ts":1795482646,"zh":"再聊聊老黄的回归，昨天上午说看周日川普和贝森特的表态市场会有一段交易老黄回归的时间窗口，但没想昨晚就直接回归了。借着昨晚跟朋友聊的内容说说这场回归是如何发生的：\n1、川普发力，亲自出面说服了英伟达董事会，同时力压贝森特被迫改口，看报道万斯和卢特尼克也参与斡旋。这个好理解、万斯虽然反对伊朗战争，但还是共和党科技派，卢特尼克更是如此本身这次就积极内阁被指责最多的，自然也要积极出力。\n川普发力一方面他本身就支持老黄，跟老黄算是商业盟友，股市暴跌他自己利益受损。\n2、市场发力，本质还是一次“跌给你看”甚至叫“死给你看”，美国是高度金融化，股市已经成为美国社会财富第一大支撑。股市可以跌可以调整，但是不能大跌不能真“死了”，只要“以死相逼”才能逼着博弈的几方里要么积极斡旋、要么退让；市场死了、共和党、民主党、董事会都害怕。\n3、共和党对华强硬派的分化和禁声，作为白宫里对华强硬派的代表，贝森特已经改口，鲁比奥沉默。为什么贝森特改口？其实很好理解，贝森特在华盛顿没有政治根基、虽然他主张对华强硬、但他的权力完全来自川普。鲁比奥不一样、在川普胜选总统之前就已经是联邦参议员了，他有自己的势力范围，国会里盟友就不少例如众议院外交事务委员会主席马斯特就是鲁比奥的亲密盟友。\n所以昨天鲁比奥在会见卡塔尔首相时，有记者问“黄发回归有国家安全分风险么”，鲁比奥就完全岔开忽略了这个问题。上周五市场暴跌也让他认识到了老黄的重要性，上周还在币安广场ama还聊最后要么英伟达让市场很难受、要么发现真找不到一个能替代老黄的人、最后不得不又请老黄回归。当然当时也没有认为这是短期就能发生的。\n4、很多人说民主党也有参与老黄回归，正如之前\n过去两周半中期选举后，发生的事情很多人归结为党争。其实更多还是共和党党内博弈，两党之间的争斗其实还没开始，就像27年财政预算法案一样现在民主党的思路就是12月再通过一个临时拨款协议、等到27年1月民主党真正掌控国会后再跟共和党内谈判。\n对民主党来说。遏制中国是长期战略必须一定要去做的，但现在趁着民众对AI的民意去搞川普压制共和党却是首要之事。不会说就停下来、当然民主党也怕市场真的“死给你看”。\n5、整体上来，老黄回归估计内部整顿，之后再被迫辞职的概率很小。12月共和党主导的国会听证会估计也就没啥大问题了。但27年民主党应该还是会调查老黄，只是可能也不敢真的把老黄给干走，但估计能制造波动。\n从昨天交易老黄回归到老黄真的回归，市场信心提振是巨大的、这一波📈估计会持续一段时间。\n后面继续看三个维度：\n油价/通胀/利率、\n民主党的数据中心政策比预想的更严还是会略弱、\nAI商业化是不是在加速（这一点我之前一直认为是加速，但市场要看更多的证据）。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"再聊聊老黄的回归，昨天上午说看周日川普和贝森特的表态市场会有一段交易老黄回归的时间窗口，但没想昨晚就直接回归了。借着昨晚跟朋友聊的内容说说这场回归是如何发生的：\n1、川普发力，亲自出面说服了英伟达董事会，同时力压贝森特被迫改口，看报道万斯和卢特尼克也参与斡旋。这个好理解、万斯虽然反对伊朗战争，但还是共和党科技派，卢特尼克更是如此本身这次就积极内阁被指责最多的，自然也要积极出力。\n川普发力一方面他本身就支持老黄，跟老黄算是商业盟友，股市暴跌他自己利益受损。\n2、市场发力，本质还是一次“跌给你看”甚至叫“死给你看”，美国是高度金融化，股市已经成为美国社会财富第一大支撑。股市可以跌可以调整，但是不能大跌不能真“死了”，只要“以死相逼”才能逼着博弈的几方里要么积极斡旋、要么退让；市场死了、共和党、民主党、董事会都害怕。\n3、共和党对华强硬派的分化和禁声，作为白宫里对华强硬派的代表，贝森特已经改口，鲁比奥沉默。为什么贝森特改口？其实很好理解，贝森特在华盛顿没有政治根基、虽然他主张对华强硬、但他的权力完全来自川普。鲁比奥不一样、在川普胜选总统之前就已经是联邦参议员了，他有自己的势力范围，国会里盟友就 ":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/us/trump-saw-nvidias-huang-protector-open-weight-ai-models-sources-say-2026-11-23/?taid=6b04e1bf5f9bc30001dc0a79&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":395},{"id":"2125029504456536575","h":"bboczeng","ts":1795481489,"zh":"充分证明了木头姐确实没有内幕消息\n是纯粹的 Outside Trading\n😅😅😅","en":"充分证明了木头姐确实没有内幕消息\n是纯粹的 Outside Trading\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2125029504456536575","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":1179},{"id":"2125029328283201557","h":"dmjk001","ts":1795481447,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HX2e5lBa4AAyvo1.png?name=orig"],"u":"https://x.com/dmjk001/status/2125029328283201557","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":954},{"id":"2125027349154705840","h":"cnfinancewatch","ts":1795480975,"zh":"三大利空方向（由强到弱） 一、复职不是风险出清，AI交易仍要过国会、调查和财报三关。已核实：英伟达声明写明将继续配合政府调查和问询，并新设国家安全与出口管制委员会、开始招聘首席合规官。Stocktwits援引报道称，黄仁勋将于12月1日接受三个众议院委员会闭门问询，12月3日出席参议院银行委员会公开听证，议题包括出口管制；参议员沃伦批评复职“鲁莽”，称公司和本人仍需向国会说明。另有彭博报道称，董事会周日下午在特朗普施压后作出决定，且未咨询公司高管层，这一说法来自转述，本档不当作公司已确认的事实。同一天，Anthropic不涨反跌约3%；华尔街日报等报道指，其未来数年算力与基础设施承诺约9000亿美元，债市预期债券可能落在投机级、约BB区间，评级机构尚未正式公开表态。对谁不利：把复职写成“问题已经结束”的交易，以及仍按“资本开支只增不减、融资无约束”定价的高位标的。\n二、上周五的去杠杆没有被一天抹平，亚洲内部还在分化。已核实：韩国KOSPI收4708.54点，跌3.31%，维稳承诺没有挡住跌势。台湾加权涨2.16%、收36811.89点，但要放到上周五的背景里看：彭博报道，台股上周最大跌幅接近18%，为1991年以来最差一周；11月20日融资余额单日减少约15亿美元，为1996年有数据以来最大降幅；当天追缴保证金64.6亿新台币，超过一个月前的200倍，6462个账户受影响，632个账户被强制平仓、约14.95亿新台币。台北时报转述，约5000亿新台币的国家安定基金周一介入，才帮助指数收涨。外资上月净卖创纪录约300亿美元，本月已超过250亿美元。台积电ADR涨约14%，补的是上周约15%的跌幅，不是新高启动。A股硬件链如果今天高开过多，仍可能跟韩台的节奏重新对齐。\n三、最容易在今天出错的，是把隔夜暴涨和政策标题当成追连板的理由。两融保证金比例下调仍是11月30日起施行，“近4000亿元”是理论上限，不是已经进场的钱。创业板做市和回购潮，邮件里写得很满，本档未逐条核实规模，不写成今日开盘的决定性买盘。已经能核实的是拥挤：盛剑科技5连板后，11月17日至23日累计上涨61.01%，上交所就其股价波动下发监管工作函，公司提示存在非理性炒作和短期快速下跌风险；真视通5连板，中京电子3连板，机器人与短剧的20CM也已经定价了情绪。WTI 1月合约结算80.17美元、跌3.88%，布伦特89.37美元、跌3.46%；邮件转述特朗普就伊朗表态，未作为定论。港股并未先于美股翻红，恒生指数收22383.74点、跌0.12%，恒生科技指数跌0.09%，零跑、小鹏、理想走弱。若出现高开低走，先受伤的会是昨天已经连板、今天又被隔夜情绪加码的高标。\n小结：周一A股给出的是“权重弱、题材修”，隔夜美股给出的是“黄仁勋回来、科技股暴涨”。今天开盘方向并不难猜，难的是把反弹当成趋势、把复职当成出清、把连板当成产业。防守仓不必因外围大涨就加回银行和保险；进攻只看回踩后的硬需求，不接力已收监管函和多连板的高标。真正的验证，还要看今晚戴尔、周三PCE，以及黄仁勋12月的国会安排。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，邮件转述内容未逐条核实，不构成投资建议。","en":"三大利空方向（由强到弱） 一、复职不是风险出清，AI交易仍要过国会、调查和财报三关。已核实：英伟达声明写明将继续配合政府调查和问询，并新设国家安全与出口管制委员会、开始招聘首席合规官。Stocktwits援引报道称，黄仁勋将于12月1日接受三个众议院委员会闭门问询，12月3日出席参议院银行委员会公开听证，议题包括出口管制；参议员沃伦批评复职“鲁莽”，称公司和本人仍需向国会说明。另有彭博报道称，董事会周日下午在特朗普施压后作出决定，且未咨询公司高管层，这一说法来自转述，本档不当作公司已确认的事实。同一天，Anthropic不涨反跌约3%；华尔街日报等报道指，其未来数年算力与基础设施承诺约9000亿美元，债市预期债券可能落在投机级、约BB区间，评级机构尚未正式公开表态。对谁不利：把复职写成“问题已经结束”的交易，以及仍按“资本开支只增不减、融资无约束”定价的高位标的。\n二、上周五的去杠杆没有被一天抹平，亚洲内部还在分化。已核实：韩国KOSPI收4708.54点，跌3.31%，维稳承诺没有挡住跌势。台湾加权涨2.16%、收36811.89点，但要放到上周五的背景里看：彭博报道，台股上周最大跌幅接近18%，为1991年以来最差一周；11月20日融资余额单日减少约15亿美元，为1996年有数据以来最大降幅；当天追缴保证金64.6亿新台币，超过一个月前的200倍，6462个账户受影响，632个账户被强制平仓、约14.95亿新台币。台北时报转述，约5000亿新台币的国家安定基金周一介入，才帮助指数收涨。外资上月净卖创纪录约300亿美元，本月已超过250亿美元。台积电ADR涨约14%，补的是上周约15%的跌幅，不是新高启动。A股硬件链如果今天高开过多，仍可能跟韩台的节奏重新对齐。\n三、最容易在今天出错的，是把隔夜暴涨和政策标题当成追连板的理由。两融保证金比例下调仍是11月30日起施行，“近4000亿元”是理论上限，不是已经进场的钱。创业板做市和回购潮，邮件里写得很满，本档未逐条核实规模，不写成今日开盘的决定性买盘。已经能核实的是拥挤：盛剑科技5连板后，11月17日至23日累计上涨61.01%，上交所就其股价波动下发监管工作函，公司提示存在非理性炒作和短期快速下跌风险；真视通5连板，中京电子3连板，机器人与短剧的20CM也已经定价了情绪。WTI 1月合约结算80.17美元、跌3.88%，布伦特89.37美元、跌3.46%；邮件转述特朗普就伊朗表态，未作为定论。港股并未先于美股翻红，恒生指数收22383.74点、跌0.12%，恒生科技指数跌0.09%，零跑、小鹏、理想走弱。若出现高开低走，先受伤的会是昨天已经连板、今天又被隔夜情绪加码的高标。\n小结：周一A股给出的是“权重弱、题材修”，隔夜美股给出的是“黄仁勋回来、科技股暴涨”。今天开盘方向并不难猜，难的是把反弹当成趋势、把复职当成出清、把连板当成产业。防守仓不必因外围大涨就加回银行和保险；进攻只看回踩后的硬需求，不接力已收监管函和多连板的高标。真正的验证，还要看今晚戴尔、周三PCE，以及黄仁勋12月的国会安排。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，邮件转述内容未逐条核实，不构成投资建议。","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/cnfinancewatch/status/2125027349154705840","l":[],"ln":[],"t":["美股","A股港股","原油能源","AI科技","财报","关税贸易"],"lk":2,"rt":0,"rp":0,"vw":869},{"id":"2125027345744658571","h":"cnfinancewatch","ts":1795480974,"zh":"热点财经新闻综述｜2026-11-24·早间\n数据时点：A股、港股、韩国KOSPI与台湾加权为11月23日收盘；日经225因23日勤劳感谢日休市，仍为11月20日收盘，今日恢复交易；美股为美东11月23日常规交易收盘；现货黄金、现货白银与原油为同日收盘或结算；美股股指期货仅引用每日经济新闻11月24日07:01的报道。本档截稿约北京时间11月24日07:50，亚太股市尚未开盘。本期新处理一封热点财经邮件：11月23日晚间20:10版（收件箱）；11月24日早间版截稿时尚未送达。标“邮件转述”的内容未逐条核实。晚间邮件写于美股开盘前，其中“英伟达盘前涨近8%”“特朗普希望董事会重新聘用黄仁勋”等表述，已被此后的公司公告和美股收盘数字取代，本档以已核实的公开报道为准。\n今日判断 周一A股先探底再靠成长和题材翻红：上证收3538.95点、仅涨0.15%，深证成指涨1.93%、收10454.37点，创业板指涨3.08%、收2280.20点，科创50仍跌0.26%。钛媒体统计全市场4658只上涨、783只下跌，151只涨停、7只跌停；沪深成交15528.8亿元，较上一交易日放量约1307亿元。机器人、影视院线、贵金属、PCB和CPO是买盘，保险和核电是卖盘。午间档已经看到这幅结构——政策托底没有变成权重反攻，但逢低资金在题材上是真的。\n隔夜美股把另一半答案交了出来，而且比期货更猛。已核实：英伟达董事会一致投票，立即恢复黄仁勋担任总裁、首席执行官和董事；主席哈维·琼斯称，已听取美国政府高层意见，并认为复职不会构成国家安全风险。特朗普对CNBC说，自己说服了董事会，并称黄仁勋“没有做错”。新华社、中国新闻网和公司声明确认，科莱特·克雷斯继续任首席财务官，相关调查仍将进行，公司将新设首席合规官，并已成立由独立董事组成的国家安全与出口管制委员会。英伟达收涨31.48%、报165.05美元，为2003年5月以来最大单日涨幅；纳指涨6.51%、收24089.56点，标普500涨4.73%、收7237.17点，道指涨3.01%、收49595.31点，纳指与标普均为2025年4月以来最佳单日。美光涨19.04%，英特尔涨16.34%，台积电ADR涨约14%，特斯拉涨11.46%。今天A股开盘大概率高开，弹性会集中在光模块、PCB、存储和机器人，而不是银行和保险。但不要写成趋势反转已经确认：科创50昨天还在跌，调查和国会安排都还在，连板股已经拥挤。\n三大利多方向（由强到弱） 一、黄仁勋正式复职，把上周五被拆掉的AI交易在实盘里重新接了起来。这是相对晚间邮件最大的增量。晚间邮件还停在期货反弹和“希望复职”，现在已是董事会公告和收盘数字。为什么重要：上周五纳指跌5.28%、英伟达跌14%，定价的是治理真空和交易出清；现在定价的是关键人物回来、供应链和需求叙事暂时回到桌上。Gabelli Funds的基金经理对CNBC说，这有助于修复对AI生态和需求前景的信心，但也提醒融资、地缘和可持续性的噪音并未消失。对谁有利：跟海外定价更近的CPO、PCB、服务器和存储链，以及昨天已先修复的机器人。制约：这是单日暴涨，不是周线修复已经完成；纳指上周五仍处技术性调整、并转年内下跌。截稿时每日经济新闻仅报道纳指期货高开涨0.15%，美国时段的冲动没有在亚洲早盘继续放大。今晚还有戴尔财报，周三有美国PCE，周四美国感恩节休市。\n二、A股周一已经用放量和广度证明逢低资金在，不必把希望寄托在“近4000亿元”。已核实：创业板放量涨3.08%，上涨家数约是下跌家数的六倍。首批18只主动ETF上市首日成交80.08亿元，平均换手率约22.69%，永赢景气均衡主动ETF成交最高、约9.92亿元。公开报道称，9月28日至11月20日股票型ETF累计净流入超7500亿元，11月20日单日净流入约919亿元，创年内新高，资金集中在沪深300、创业板指和科创50相关产品；易方达科创50ETF上周份额增加约123亿份。为什么重要：这些是已经进场的申购和首日成交，不是11月30日才生效的融资保证金下调。制约：周五扫的是银行、石油和宽基，周一权重继续回吐、保险逆市走弱，“按点位进场”的钱仍在接受结构错位的考验，不能把ETF净流入外推成上证必然大涨。\n三、产业线索还在，短线已经选出了接力方向。已核实：机器人方向上纬新材、宇树科技、汉威科技、安培龙20CM涨停，克来机电、长华集团2连板；影视与AI漫剧里，果麦文化、华是科技20CM涨停，浙文影业、横店影视、上海电影涨停；PCB和CPO方面，中京电子3连板，崇达技术、世运电路涨停，天孚通信等涨超10%。现货黄金收涨2.74%、报3634.72美元，现货白银涨4.65%、报43.14美元，对昨天走强的黄金股是同步验证。HPE公布2026财年第四季度营收145亿美元、同比增长50%，云与AI业务营收113亿美元、增长68.6%，其中服务器88亿美元、增长94.7%，非GAAP每股收益1.43美元，并上调2027财年指引。为什么重要：需求并没有在上周五的抛售里消失。制约：仍有报道称HPE盘后下跌约7%至8%，市场在意毛利率环比回落和产品结构；戴尔要到今晚美股盘后才公布。连板高度已经不便宜。","en":"热点财经新闻综述｜2026-11-24·早间\n数据时点：A股、港股、韩国KOSPI与台湾加权为11月23日收盘；日经225因23日勤劳感谢日休市，仍为11月20日收盘，今日恢复交易；美股为美东11月23日常规交易收盘；现货黄金、现货白银与原油为同日收盘或结算；美股股指期货仅引用每日经济新闻11月24日07:01的报道。本档截稿约北京时间11月24日07:50，亚太股市尚未开盘。本期新处理一封热点财经邮件：11月23日晚间20:10版（收件箱）；11月24日早间版截稿时尚未送达。标“邮件转述”的内容未逐条核实。晚间邮件写于美股开盘前，其中“英伟达盘前涨近8%”“特朗普希望董事会重新聘用黄仁勋”等表述，已被此后的公司公告和美股收盘数字取代，本档以已核实的公开报道为准。\n今日判断 周一A股先探底再靠成长和题材翻红：上证收3538.95点、仅涨0.15%，深证成指涨1.93%、收10454.37点，创业板指涨3.08%、收2280.20点，科创50仍跌0.26%。钛媒体统计全市场4658只上涨、783只下跌，151只涨停、7只跌停；沪深成交15528.8亿元，较上一交易日放量约1307亿元。机器人、影视院线、贵金属、PCB和CPO是买盘，保险和核电是卖盘。午间档已经看到这幅结构——政策托底没有变成权重反攻，但逢低资金在题材上是真的。\n隔夜美股把另一半答案交了出来，而且比期货更猛。已核实：英伟达董事会一致投票，立即恢复黄仁勋担任总裁、首席执行官和董事；主席哈维·琼斯称，已听取美国政府高层意见，并认为复职不会构成国家安全风险。特朗普对CNBC说，自己说服了董事会，并称黄仁勋“没有做错”。新华社、中国新闻网和公司声明确认，科莱特·克雷斯继续任首席财务官，相关调查仍将进行，公司将新设首席合规官，并已成立由独立董事组成的国家安全与出口管制委员会。英伟达收涨31.48%、报165.05美元，为2003年5月以来最大单日涨幅；纳指涨6.51%、收24089.56点，标普500涨4.73%、收7237.17点，道指涨3.01%、收49595.31点，纳指与标普均为2025年4月以来最佳单日。美光涨19.04%，英特尔涨16.34%，台积电ADR涨约14%，特斯拉涨11.46%。今天A股开盘大概率高开，弹性会集中在光模块、PCB、存储和机器人，而不是银行和保险。但不要写成趋势反转已经确认：科创50昨天还在跌，调查和国会安排都还在，连板股已经拥挤。\n三大利多方向（由强到弱） 一、黄仁勋正式复职，把上周五被拆掉的AI交易在实盘里重新接了起来。这是相对晚间邮件最大的增量。晚间邮件还停在期货反弹和“希望复职”，现在已是董事会公告和收盘数字。为什么重要：上周五纳指跌5.28%、英伟达跌14%，定价的是治理真空和交易出清；现在定价的是关键人物回来、供应链和需求叙事暂时回到桌上。Gabelli Funds的基金经理对CNBC说，这有助于修复对AI生态和需求前景的信心，但也提醒融资、地缘和可持续性的噪音并未消失。对谁有利：跟海外定价更近的CPO、PCB、服务器和存储链，以及昨天已先修复的机器人。制约：这是单日暴涨，不是周线修复已经完成；纳指上周五仍处技术性调整、并转年内下跌。截稿时每日经济新闻仅报道纳指期货高开涨0.15%，美国时段的冲动没有在亚洲早盘继续放大。今晚还有戴尔财报，周三有美国PCE，周四美国感恩节休市。\n二、A股周一已经用放量和广度证明逢低资金在，不必把希望寄托在“近4000亿元”。已核实：创业板放量涨3.08%，上涨家数约是下跌家数的六倍。首批18只主动ETF上市首日成交80.08亿元，平均换手率约22.69%，永赢景气均衡主动ETF成交最高、约9.92亿元。公开报道称，9月28日至11月20日股票型ETF累计净流入超7500亿元，11月20日单日净流入约919亿元，创年内新高，资金集中在沪深300、创业板指和科创50相关产品；易方达科创50ETF上周份额增加约123亿份。为什么重要：这些是已经进场的申购和首日成交，不是11月30日才生效的融资保证金下调。制约：周五扫的是银行、石油和宽基，周一权重继续回吐、保险逆市走弱，“按点位进场”的钱仍在接受结构错位的考验，不能把ETF净流入外推成上证必然大涨。\n三、产业线索还在，短线已经选出了接力方向。已核实：机器人方向上纬新材、宇树科技、汉威科技、安培龙20CM涨停，克来机电、长华集团2连板；影视与AI漫剧里，果麦文化、华是科技20CM涨停，浙文影业、横店影视、上海电影涨停；PCB和CPO方面，中京电子3连板，崇达技术、世运电路涨停，天孚通信等涨超10%。现货黄金收涨2.74%、报3634.72美元，现货白银涨4.65%、报43.14美元，对昨天走强的黄金股是同步验证。HPE公布2026财年第四季度营收145亿美元、同比增长50%，云与AI业务营收113亿美元、增长68.6%，其中服务器88亿美元、增长94.7%，非GAAP每股收益1.43美元，并上调2027财年指引。为什么重要：需求并没有在上周五的抛售里消失。制约：仍有报道称HPE盘后下跌约7%至8%，市场在意毛利率环比回落和产品结构；戴尔要到今晚美股盘后才公布。连板高度已经不便宜。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125027345744658571","l":[],"ln":[],"t":["美股","A股港股","原油能源","AI科技","财报","关税贸易","黄金"],"lk":3,"rt":0,"rp":2,"vw":1647},{"id":"2125027002520613051","h":"cnfinancewatch","ts":1795480893,"zh":"两边合在一起看：国内已经在为今天的高开预演PCB、光模块和机器人的接力，海外则把绝大部分注意力给了英伟达一个人。相同的是都在庆祝反弹，不同的是国内更容易把复职翻译成开盘就要追高标，海外扫描里仍有相当比例的中性和看空，而且把国会听证、Anthropic和收购方下跌留在了视野里。今天真正要防的，不是指数会不会高开，而是高开之后，谁在接力盛剑、真视通这类已经被定价过的连板，谁又把还没被核实的“周产”“成功率”当成了新的信仰。\n风险提示：以上为公开讨论整理，抓取受限处已注明，二手统计和扫描分类不代表真实民意比例，不构成投资建议。","en":"两边合在一起看：国内已经在为今天的高开预演PCB、光模块和机器人的接力，海外则把绝大部分注意力给了英伟达一个人。相同的是都在庆祝反弹，不同的是国内更容易把复职翻译成开盘就要追高标，海外扫描里仍有相当比例的中性和看空，而且把国会听证、Anthropic和收购方下跌留在了视野里。今天真正要防的，不是指数会不会高开，而是高开之后，谁在接力盛剑、真视通这类已经被定价过的连板，谁又把还没被核实的“周产”“成功率”当成了新的信仰。\n风险提示：以上为公开讨论整理，抓取受限处已注明，二手统计和扫描分类不代表真实民意比例，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2125027002520613051","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":730},{"id":"2125026998414364868","h":"cnfinancewatch","ts":1795480892,"zh":"散户热议｜2026-11-24·早间\n数据时点：国内方面，已打开韭研公社“最新发布”与“最新热度”列表，可见多篇11月23日午评、晚间复盘与11月24日盘前帖；部分长文需登录，未能完整抓取，下文只使用公开可见的标题、发布时间，以及页面上能直接读到的段落，不编造引语或情绪统计。海外方面，Reddit WallStreetBets本期仍未能直接打开；改用Tradestie对WSB讨论的扫描页（页面标注更新于11月23日19:59 UTC，约北京时间24日03:59），以及Stocktwits新闻稿对平台情绪的官方转述。情绪标签和小样本统计不代表全市场比例；对留言只做意译概括，不是逐字引语。本档截稿约北京时间11月24日07:50。\n国内：主旋律已从“组合拳来了、先看先等”，切到“那个人回来了”，但公开可见的立场里，仍反复写着低吸、不追高\n午间档时，社区里还能看到政策出台后的犹疑：指数低开，午评开始改口成先看、先等。到了23日晚间和24日盘前，标题重心明显挪到黄仁勋复职。05:30有帖把复职写成“弹性公司”机会，公开摘要的核心判断是：黄仁勋被视作AI资本开支的信用担保，短期能缓解对新云融资的担心，也能把产品升级节奏和上游利润率的悲观预期往回拉，并点名PCB升级链。23:28的盘前调研帖标题就写“那个男人回归”，继续中长线看好算力叙事，尤其以PCB为带头，同时点到中际旭创、新易盛等光模块名字。23:16的盘前帖把物理AI和人形机器人放在最前，转述特斯拉FSD V15与Optimus共享视觉底座，并夹带“真机成功率”“周产”等数字；这些具体数字未见权威出处，本档只作为社区热度，不写成已落实事实。\n和券商口径相同的地方很清楚：都承认昨天是超跌修复，不是普涨牛市；都把机器人和短剧看成最先被选中的方向，PCB、CPO是第二排；都看到了隔夜英伟达对今日开盘的映射。21:47的晚间帖说，昨天涨停数量应是近两周最多，最强风口是机器人和短剧，其次才是PCB和光通信，反弹最凶的是前期先被砸深的板块。18:34的复盘帖标题写成“超跌反弹修复，机器人领涨”，作者署名立场是“只会低吸 绝不追高”。热度榜上仍能看到“PCB缺货谁真拿到订单”“光刻胶传闻为何还能炒”这类追问，说明部分作者并不满足于贴概念。\n和券商口径不同、也更容易在今天出错的地方，是社区把复职写成几乎即时的产业反转，并迅速铺开弹性名单。公开摘要里已经出现把“老黄回来”直接对应到CPO、新材料和太空算力“都回来了”的表述，点名密度明显高于对调查、听证和监管函的讨论。被忽略的风险反而更具体：科创50昨天仍跌0.26%，银行和保险并没有跟上题材修复；两融新规要到11月30日才施行，不能把理论上的杠杆空间当成今天已经进场的钱；盛剑科技5连板后收到上交所关于股价波动的监管工作函，公司自己也提示非理性炒作和短期快速下跌风险，这类高标最容易在今天的高开里被接力。真视通5连板、中京电子3连板、凡拓数创等20CM，已经是情绪最拥挤的位置。另有盘前帖把“52家回购增持”写成看点，具体家数和含金量未逐条核实，不宜当成开盘买点。\n海外：讨论被英伟达单票吸走，情绪热闹，但评论并没有一边倒\n本期未能直接打开WSB原帖，只能看二手扫描。Tradestie页面统计24小时分析讨论1481条，把“人群情绪”标成77/100、约77.9%偏多，并加上“亢奋”一类标签；同一时间里，英伟达以282次提及居首，约为近七日均值的1.8倍，但看多、中性、看空的拆分是35%、43%和22%，也就是热度极高，方向并不统一。领先评论的大意，是在庆祝“那个人回来了”，也有人以嘲讽口吻讨论黄仁勋与散户AI狂热的关系。必须说明：这是扫描页的分类和抽样，不是论坛官方统计，也不能代表全市场。\nStocktwits新闻稿的口径更热：过去24小时英伟达相关情绪处在“极度看多”，留言量处在“极高”，环比上一交易日约增132%，过去一周约增460%。但同一批新闻稿也把冷水写进去了——黄仁勋12月1日要接受众议院三个委员会的闭门问询，12月3日要出席参议院银行委员会关于出口管制的公开听证；参议员沃伦批评复职“鲁莽”；另有彭博转述称，董事会在特朗普施压后作出决定，且未咨询公司高管层。对散户来说，这意味着今天可以炒“回来了”，但下下周的日历并不是空白。英伟达虽大涨，稿件仍注明其年内仍下跌约11%，单日并没有把今年的亏损全部抹平。\n更值得看的异同，是同样在AI叙事里，并不是所有名字都被当成赢家。CNBC报道，Anthropic在周一这场科技股大反弹里下午仍跌约3%，有评论认为，作为领先的AI股票，当天都涨不起来，说明有问题。网络安全并购则把多空写在两只股票上：CrowdStrike宣布以全股票交易收购Zscaler、企业价值约440亿美元，Tradestie页面上收购方收跌约8.9%，被收购方涨约17.7%。美光、杠杆半导体ETF这类硬件名字跟着英伟达飙，但不少标的五日维度仍是负的，说明上周五的伤口还在。和国内社区相比，海外更少讨论A股连板，更多把分歧放在“一个人能不能托住整个AI交易”“资本开支承诺能不能被债市接受”“国会还要不要问出口管制”。","en":"散户热议｜2026-11-24·早间\n数据时点：国内方面，已打开韭研公社“最新发布”与“最新热度”列表，可见多篇11月23日午评、晚间复盘与11月24日盘前帖；部分长文需登录，未能完整抓取，下文只使用公开可见的标题、发布时间，以及页面上能直接读到的段落，不编造引语或情绪统计。海外方面，Reddit WallStreetBets本期仍未能直接打开；改用Tradestie对WSB讨论的扫描页（页面标注更新于11月23日19:59 UTC，约北京时间24日03:59），以及Stocktwits新闻稿对平台情绪的官方转述。情绪标签和小样本统计不代表全市场比例；对留言只做意译概括，不是逐字引语。本档截稿约北京时间11月24日07:50。\n国内：主旋律已从“组合拳来了、先看先等”，切到“那个人回来了”，但公开可见的立场里，仍反复写着低吸、不追高\n午间档时，社区里还能看到政策出台后的犹疑：指数低开，午评开始改口成先看、先等。到了23日晚间和24日盘前，标题重心明显挪到黄仁勋复职。05:30有帖把复职写成“弹性公司”机会，公开摘要的核心判断是：黄仁勋被视作AI资本开支的信用担保，短期能缓解对新云融资的担心，也能把产品升级节奏和上游利润率的悲观预期往回拉，并点名PCB升级链。 6-11-24《中信证券：从算力到Token，重构AI基础设施的投资价值》与中信建投2026-11-24《中信建投：国产算力供需共振 AI安全需求持续升级》双研报支撑。\n3、持续性风险：沪电股份5日+11.79%已有所加速，新易盛今日+9.92%接近涨停，若隔夜美股AI方向回落则弹性收敛。\n4、龙一沪电股份（sz002463），依据5日+11.79%为本方向代表股中最大。\n5、第二只新易盛（sz300502），依据东财人气榜第1名、排名上升5名，总市值2530亿属超大盘，因本方向无总市值小于300亿候选，按规则退取本方向市值最小者（本方向代表股中市值最小为金山办公1030亿，新易盛2530亿非最小，此处按人气榜热度条件选新易盛，并注明本方向小盘标的稀缺）。\n（二）方向二机器人机械（人形机器人/工业母机/自动化）：\n1、映射证据：美股昨日上涨板块第三ARKQ+8.30%；日本精密制造均+2.86%（日立+2.88%、三菱重工+2.88%、基恩士+2.82%）；A股去重榜无机器人主题但美股映射确认。\n2、催化：凡拓数创龙虎榜机构净买入1.15亿、今日+20.00%涨停；索辰科技今日+18.63%量比1.37换手12.22%。\n3、持续性风险：凡拓数创换手33.78%极高，属情绪加速末端，索辰科技换手12.22%亦偏高，追高风险大。\n4、龙一凡拓数创（sz301313），依据5日+13.62%为本方向代表股中最大。\n5、第二只索辰科技（sh688507），依据总市值161亿属中盘、今日+18.63%量比1.37换手12.22%资金动作明确，热度条件用研报方向支撑（中信建投2026-11-23《中信建投：全球封测产业景气上行 BIS新规下国产先进封装扩产有望加速》间接涉及自动化设备），并注明该方向小盘候选无龙虎榜机构席位（索辰科技龙虎榜无）、未上人气榜，仅有间接研报覆盖。\n（三）方向三半导体（存储/模组/封测）：\n1、映射证据：美股昨日上涨板块第二AINF+15.25%，TSM+14.08%；韩国存储半导体均+7.58%（SK海力士+8.25%、三星电子+6.90%）；日本半导体设备均+7.99%；A股去重榜无半导体主题但美股映射确认。\n2、催化：中信建投2026-11-24《中信建投：国产算力供需共振 AI安全需求持续升级》与中信建投2026-11-23《中信建投：全球封测产业景气上行 BIS新规下国产先进封装扩产有望加速》双研报支撑；财联社11月24日22:21 AI芯片供应链收紧新闻。\n3、持续性风险：太极实业5日-1.27%属补涨初期，香农芯创今日+4.04%量比1.25，若韩日存储半导体开盘后回落则弹性收敛。\n4、龙一太极实业（sh600667），依据5日-1.27%为本方向代表股中相对最强（本方向代表股5日涨幅多为负，太极实业-1.27%优于深科技-1.78%、佰维存储-2.47%等），且今日+3.56%量比1.22换手5.50%。\n5、第二只香农芯创（sz300475），依据总市值375亿属大盘、今日+4.04%量比1.25换手5.44%，热度条件用研报方向支撑（中信建投2026-11-24《中信建投：国产算力供需共振 AI安全需求持续升级》指向国产存储供应链），并注明该方向小盘候选无龙虎榜机构席位、未上人气榜，仅有研报覆盖。","en":"三个方向\n（一）方向一AI算力软件（光模块/PCB）：\n1、映射证据：美股昨日上涨板块第一AIS+16.06%，NVDA+31.48%、TSM+14.08%，纳指+6.51%；韩日同向，日经+2.62%、KOSPI+2.17%；A股去重榜无AI算力软件主题但美股映射确认。\n2、催化：中信证券2026-11-24《中信证券：从算力到Token，重构AI基础设施的投资价值》与中信建投2026-11-24《中信建投：国产算力供需共振 AI安全需求持续升级》双研报支撑。\n3、持续性风险：沪电股份5日+11.79%已有所加速，新易盛今日+9.92%接近涨停，若隔夜美股AI方向回落则弹性收敛。\n4、龙一沪电股份（sz002463），依据5日+11.79%为本方向代表股中最大。\n5、第二只新易盛（sz300502），依据东财人气榜第1名、排名上升5名，总市值2530亿属超大盘，因本方向无总市值小于300亿候选，按规则退取本方向市值最小者（本方向代表股中市值最小为金山办公1030亿，新易盛2530亿非最小，此处按人气榜热度条件选新易盛，并注明本方向小盘标的稀缺）。\n（二）方向二机器人机械（人形机器人/工业母机/自动化）：\n1、映射证据：美股昨日上涨板块第三ARKQ+8.30%；日本精密制造均+2.86%（日立+2.88%、三菱重工+2.88%、基恩士+2 商业、技术材料的权力，阻止国会借调查肆意调取敏感技术文档，避免核心算力资料通过听证会外泄。\n第二，运用总统 #特赦权，提前对黄仁勋、马斯克等核心科技领袖启动预防性特赦。针对过往合规相关的潜在民事、刑事风险予以豁免，阻断民主党通过司法追责打击科技企业家的路径，保住川普最重要的科技产业基本盘。\n但这套策略同样存在制衡隐患：特赦仅覆盖联邦刑事层面，无法阻挡国会听证与立法行动。舒默推动的跨党派芯片管制法案，依然有机会重塑出口管制框架。\n这一局博弈的本质，是资本、行政权、立法权的三方拉扯。川普若不提前筑牢法理防火墙，民主党会持续用调查拖慢AI产业节奏，让耀眼的科技经济成果，逐步化为一地鸡毛。","en":"华尔街观察：风暴续篇，舒默打响清算战，川普必须提前布下法理防线\n舒默公开点名川普、黄仁勋与英伟达，宣告民主党将启动国会全面调查，同时推动立法锁死高端芯片技术外流通道。这并非单纯国安审查，本质是一场瞄准泡沫的政治狙击：民主党意图借调查刺破当下AI科技与华尔街金融泡沫，撕碎川普和AI企业家构建的政商联盟，瓦解川普经济政绩，搜集弹劾筹码。\n英伟达股价暴涨，印证市场离不开黄仁勋，但这场人事翻盘，把巨大矛盾暴露在阳光下：全球算力命脉绑定单一核心人物，国家安全审查在市值暴跌压力下被迫让步。黄仁勋重掌权杖，却只是阶段性胜利，国会、SEC的调查不会终止，英伟达正式沦为两党博弈的人质，后续诉讼与听证会会持续消耗企业与川普阵营。\n站在川普视角，被动等待国会质询绝非上策，需要立刻在法理层面构建防御体系。\n第一，动用行政权力划定权责边界，厘清行政分支与立法调查的权限边界，明确企业的国家保密义务，要求高科技企业将国家安全保密责任置于商业利益之上，要求核心科技企业服从国家顶层政治目标，约束国会无限度索取企业涉密商业、技术材料的权力，阻止国会借调查肆意调取敏感技术文档，避免核心算力资料通过听证会外泄。\n第二，运用总统 #特赦权，提前对黄仁勋、马斯克等核心科技领袖启动预防性特赦。针对过往合规相关的潜在民事、刑事风险予以豁免，阻断民主党通过司法追责打击科技企业家的路径，保住川普最重要的科技产业基本盘。\n但这套策略同样存在制衡隐患：特赦仅覆盖联邦刑事层面，无法阻挡国会听证与立法行动。舒默推动的跨党派芯片管制法案，依然有机会重塑出口管制框架。\n这一局博弈的本质，是资本、行政权、立法权的三方拉扯。川普若不提前筑牢法理防火墙，民主党会持续用调查拖慢AI产业节奏，让耀眼的科技经济成果，逐步化为一地鸡毛。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124987671223361749","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":0,"rt":0,"rp":1,"vw":357},{"id":"2124986828503806331","h":"bboczeng","ts":1795471314,"zh":"系统已经撑不住了","en":"The system can’t hold it any more","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/bboczeng/status/2124986828503806331","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":912},{"id":"2124986713026216034","h":"Balder13946731","ts":1795471287,"zh":"$NVDA 做空者一天亏损超过122亿美元，创下做空单个股票单日亏损额的历史纪录。","en":"$NVDA 做空者一天亏损超过122亿美元，创下做空单个股票单日亏损额的历史纪录。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2124986713026216034","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":2,"vw":1053},{"id":"2124983568678174793","h":"bboczeng","ts":1795470537,"zh":"查理·麦克利戈特（Charlie McElligott）表示：\"AI和股票如今已'大到不能倒'，并且直接关乎国家安全；市场花了数周时间定价的左尾风险，刚刚被大幅下调。\n而通过期权市场的管道机制，这种重新定价会转化为被迫的、机械式的买盘。\n用一句话总结这一整天的行情就是：'对冲盘被平掉，空头被止损，标普期货被拉升，上行被追涨。'\"","en":"查理·麦克利戈特（Charlie McElligott）表示：\"AI和股票如今已'大到不能倒'，并且直接关乎国家安全；市场花了数周时间定价的左尾风险，刚刚被大幅下调。\n而通过期权市场的管道机制，这种重新定价会转化为被迫的、机械式的买盘。\n用一句话总结这一整天的行情就是：'对冲盘被平掉，空头被止损，标普期货被拉升，上行被追涨。'\"","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124983568678174793","l":[],"ln":[],"t":["美股"],"lk":6,"rt":0,"rp":1,"vw":1268},{"id":"2124982424140427462","h":"darrencao2024","ts":1795470264,"zh":"“过去15年里，我预测了所有的市场顶部和底部，包括比特币在$16,000的底部和在$126,000的顶部。”\n过去十五年全部正确，世界首富的名单里，哪个是你？","en":"“过去15年里，我预测了所有的市场顶部和底部，包括比特币在$16,000的底部和在$126,000的顶部。”\n过去十五年全部正确，世界首富的名单里，哪个是你？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2124982424140427462","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":198},{"id":"2124981959936065621","h":"bboczeng","ts":1795470154,"zh":"而且很显然，交易量也不够。英伟达成交量创历史新高，存储却没有","en":"而且很显然，交易量也不够。英伟达成交量创历史新高，存储却没有","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124981959936065621","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":188},{"id":"2124979373824770241","h":"cnfinancewatch","ts":1795469537,"zh":"教授聪明过人、财富积累过人；人雄也！\n内心对孩子的期待也过人。\n但期待归期待，现实归现实。\n失落难免，现实难耐。唯有接受和祝福是正解！","en":"教授聪明过人、财富积累过人；人雄也！\n内心对孩子的期待也过人。\n但期待归期待，现实归现实。\n失落难免，现实难耐。唯有接受和祝福是正解！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124979373824770241","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":429},{"id":"2124978173238804524","h":"cnfinancewatch","ts":1795469251,"zh":"11月23日早盘，A股人形机器人板块掀涨停潮：肇民科技、安培龙、维宏股份、恒工精密、艾芬达收获20cm涨停，宁波东力、光洋股份、长华集团、多伦科技、福莱新材、联创电子、汇洲智能等近20股封死10%涨停板，上纬新材涨超11%，豪恩汽电等多股走高。国产本体龙头宇树科技盘中涨近10%，股价重回600元上方，总市值超2620亿元；物理AI板块同步走强，凡拓数创涨超15%，做多情绪全面扩散。\n量产节奏验证，硬件环节率先受益\n直接催化来自特斯拉CEO马斯克一周前的表态。11月19日视频连线中，马斯克给出两个关键时间点：Optimus（擎天柱）的\"真实能力演示\"将在1—2个月内举行，不依赖预编排或遥操作；未来12—18个月实现倒垃圾、洗碗、收纳碗碟等家务，商业化路径遵循\"先重工业、再进家庭\"。\n特斯拉最新量产进度：\n• Optimus Gen3弗里蒙特工厂周产达数百台，约为二季度的10倍，得州工厂主体完成约65%，2027年夏季大规模量产；\n• 首代产线按年产100万台设计，周产2万台为爬坡目标，单机制造成本目标从3万美元降至2万美元；\n• 首批外部客户交付预计2027年底，优先落地工业场景；\n• Gen3搭载37个关节与仿生灵巧手，灵巧手自由度翻倍至22个。\n市场关注点已超越\"机器人做家务\"本身，核心是Optimus能否在非结构化真实环境中完成指令理解、动作规划与连续任务执行。兴业证券判断，2027年物理AI模型迭代将推动机器人\"大脑\"性能突破，特斯拉链量产加速，成为放量元年。\n从硬件价值量看，旋转执行器、线性执行器与灵巧手模组合计占整机BOM超50%，谐波减速器、行星滚柱丝杠与精密轴承是三大核心子件，亦是硬件迭代重构幅度最大的环节。目前中国供应商已卡位核心零部件，超十家企业进入Optimus V3供应链，将沿\"定点—爬坡—批量交付\"节奏逐级兑现收益。\n三层产业链梳理，标的进度分化明显\n结合11月23日午盘异动与公开进展，产业链可按三大环节分层：\n减速器·丝杠·轴承：传动部件确定性最高\n宁波东力 订单充分 主营谐波/精密行星减速器，11月20日披露在手订单充分，一期厂房月底验收，进口设备12月底前安装调试，是减速器环节进度最明确标的。\n光洋股份 小批量供货 布局轴承与丝杠，部分产品已小批量供货，暂未形成大规模收入。\n长华集团 送样阶段 布局行星滚柱丝杠，仍处送样检测阶段，量产进展未见公开确认。\n恒工精密 弱关联 涉及减速器与合资布局，关联度较弱，以主题映射为主。\n浙江荣泰 布局中 通过收购布局丝杠赛道，量产交付待核实。\n新坐标 送样阶段 丝杠产品仍处送样与意向阶段，尚未量产。\n电机·结构件·传感器：执行与感知多点开花\n肇民科技 20cm涨停 布局电机叠片与精密结构件，23日收获20cm涨停，供应关系待核实。\n安培龙 弱关联 布局力矩传感器，关联度较弱，收入占比待核实。\n维宏股份 20cm涨停 涉及微型伺服电机与灵巧手业务，客户关系待核实。\n新泉股份 弱关联 布局机器人覆盖件与关节总成，关联度较弱，以市场映射为主。\nPCB·电池·系统集成：整机配套同步异动\n世运电路 弱关联 涉及机器人PCB业务，关联度较弱，直接供应待核实。\n豪鹏科技 待核实 布局机器人电池，供货证据待核实。\n克来机电 弱关联 涉及自动化装备与机器人系统，关联度较弱，直接供应未证实。\n锋龙股份 弱关联 涉及关节模组，控股股东为优必选，但资产注入尚未发生。\n本轮异动还覆盖多只映射标的：科森科技、飞亚达、亿嘉和、高德红外、豪恩汽电等；物理AI方向，凡拓数创布局数据采集与仿真工具，尚未形成规模化产出；福莱新材已在数据环节形成订单收入；多伦科技已发布异动提示明确无物理AI相关业务。\n产业与资金共振，关注业绩兑现节奏\n宇树科技是本轮情绪的直接映射。公司2025年人形机器人出货超5500台，全球市占率32.4%，2026年出货目标1万至2万台；前三季度营收18.17亿元，同比增55.71%，归母净利润3.87亿元，同比增270.54%，增速领跑行业。此外，核心团队来自华中科技大学的荆楚人形机器人正持续向文旅、工业、教育等领域交付产品；据逸飞激光（现ST逸飞）披露，其直接持有荆楚人形机器人4.6591%股份，合营公司武逸科技持有27.7216%股份。\n板块数据概览：\n• A股人形机器人概念股共346只，合计总市值约6.09万亿元，美的集团、宇树科技、中航成飞、汇川技术等体量居前；\n• 16只概念股2026年机构一致预测业绩翻倍，兆易创新、鹏辉能源预计净利增幅超7倍；\n• 11月回调中多达72只概念股较月内高点大幅回调，泛亚微透、永臻股份、海天瑞声等7股回调超40%，21只个股获融资客逆势加仓；\n• 美的集团获杠杆资金加仓0.80亿元，杭叉集团获抢筹0.21亿元。\n政策面亦有支撑：11月23日，国家发展改革委等四部门联合发布《\"一老一小\"服务体系建设实施方案》，首次将服务机器人、外骨骼等具身智能产品纳入养老服务体系建设框架。\n国金证券指出，2026年是人形机器人\"从0到1\"的关键节点，国内外供应链排产提升下，出货量有望从数千台跨越到数万台。","en":"11月23日早盘，A股人形机器人板块掀涨停潮：肇民科技、安培龙、维宏股份、恒工精密、艾芬达收获20cm涨停，宁波东力、光洋股份、长华集团、多伦科技、福莱新材、联创电子、汇洲智能等近20股封死10%涨停板，上纬新材涨超11%，豪恩汽电等多股走高。国产本体龙头宇树科技盘中涨近10%，股价重回600元上方，总市值超2620亿元；物理AI板块同步走强，凡拓数创涨超15%，做多情绪全面扩散。\n量产节奏验证，硬件环节率先受益\n直接催化来自特斯拉CEO马斯克一周前的表态。11月19日视频连线中，马斯克给出两个关键时间点：Optimus（擎天柱）的\"真实能力演示\"将在1—2个月内举行，不依赖预编排或遥操作；未来12—18个月实现倒垃圾、洗碗、收纳碗碟等家务， vw":522},{"id":"2124977479576375688","h":"cnfinancewatch","ts":1795469085,"zh":"【国金具身】FSD升级构建通用感知，继续看好物理AI模型突破下的机器人行情\n1️⃣FSD V15正式推送，视觉模型升级赋能Optimus。11月21日，特斯拉正式启动FSD V15推送，此次更新重点升级视觉编码器，基于数百万互联网视频进行训练，并计划由FSD、Robotaxi和Optimus共享。我们认为，此次升级不仅是自动驾驶能力的提升，更重要的是实现底层视觉模型的跨场景复用，有望加速Optimus智能化能力突破。\n2️⃣产业实打实有突破。（1）模型侧：GPT-6.2 Astra继续表现亮眼。八项任务通过六项，平均得分 79，登顶 AA-Robotics v0.1。上一代 GPT-6 Astra 得了 69.4 分，基模在S2的能力在月度环比提升。（2）硬件侧：T链大部分环节周产产能已达1000+，年底预计周产2500+，龙头公司明年Q2周产预计达到5000+。从明年的维度看，龙头公司的机器人收入有望达到10e量级。\n3️⃣短期看T链及模型催化_中期关注部署阶段三大瓶颈。年底前围绕T链机器人我们有望看到：（1）V3非预编程的视频发布；（2）12月初特斯拉股东大会在机器人工厂召开（真机展示）；（3）围绕V4迭代，供应链陆续赴美并反馈。围绕模型：具身模型阶段性成果的发布持续涌现，确定性关注11月字节世界模型。中期看部署端瓶颈：（1）高质量数据积累；（2）垂类本体突破；（3）硬件量产的节拍和良率提升。\n投资建议：坚定看好数据和模型驱动的板块新叙事，高度看软硬结合赛道，变化看T链。建议重点关注：\n1）T链：三花、拓普、恒立、五洲、nbhx、hsgf、双环、浙江荣泰、科达利、日盈、福赛、科森、长盈、斯菱、金沃等，新增新泉股份（结构件、手套）、田中精机（设备供应商）；\n2）本体/垂类：上纬新材（稀缺）、nbhx、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和、锋龙等；\n3）数采链：日盈（数采手套）、凡拓、奥比、芯动联科、华依、福莱等；\n4）OAI等链：兆威、长盈、立讯、中鼎、豪鹏科技等。","en":"【国金具身】FSD升级构建通用感知，继续看好物理AI模型突破下的机器人行情\n1️⃣FSD V15正式推送，视觉模型升级赋能Optimus。11月21日，特斯拉正式启动FSD V15推送，此次更新重点升级视觉编码器，基于数百万互联网视频进行训练，并计划由FSD、Robotaxi和Optimus共享。我们认为，此次升级不仅是自动驾驶能力的提升，更重要的是实现底层视觉模型的跨场景复用，有望加速Optimus智能化能力突破。\n2️⃣产业实打实有突破。（1）模型侧：GPT-6.2 Astra继续表现亮眼。八项任务通过六项，平均得分 79，登顶 AA-Robotics v0.1。上一代 GPT-6 Astra 得了 69.4 分，基模在S2的能力在月度环比提升。（2）硬件侧：T链大部分环节周产产能已达1000+，年底预计周产2500+，龙头公司明年Q2周产预计达到5000+。从明年的维度看，龙头公司的机器人收入有望达到10e量级。\n3️⃣短期看T链及模型催化_中期关注部署阶段三大瓶颈。年底前围绕T链机器人我们有望看到：（1）V3非预编程的视频发布；（2）12月初特斯拉股东大会在机器人工厂召开（真机展示）；（3）围绕V4迭代，供应链陆续赴美并反馈。围绕模型：具身模型阶段性成果的发布持续涌现，确定性关注11月字节世界模型。中期看部署端瓶颈：（1）高质量数据积累；（2）垂类本体突破；（3）硬件量产的节拍和良率提升。\n投资建议：坚定看好数据和模型驱动的板块新叙事，高度看软硬结合赛道，变化看T链。建议重点关注：\n1）T链：三花、拓普、恒立、五洲、nbhx、hsgf、双环、浙江荣泰、科达利、日盈、福赛、科森、长盈、斯菱、金沃等，新增新泉股份（结构件、手套）、田中精机（设备供应商）；\n2）本体/垂类：上纬新材（稀缺）、nbhx、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和、锋龙等；\n3）数采链：日盈（数采手套）、凡拓、奥比、芯动联科、华依、福莱等；\n4）OAI等链：兆威、长盈、立讯、中鼎、豪鹏科技等。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124977479576375688","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":220},{"id":"2124977355580211527","h":"cnf 们需要民主党在2027年1月1日整风运动\n如果民主党都同样腐败\n那美国确确实实可以说，是彻底没救了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124976801898496269","l":[],"ln":[],"t":[],"lk":9,"rt":0,"rp":3,"vw":1058},{"id":"2124976668439933363","h":"cnfinancewatch","ts":1795468892,"zh":"机器人领涨：\n特斯拉发布FSDV15，FSD、Robotaxi和机器人共用的视觉编码器，通过数百万互联网视频训练，提升泛化能力和数据利用效率。","en":"机器人领涨：\n特斯拉发布FSDV15，FSD、Robotaxi和机器人共用的视觉编码器，通过数百万互联网视频训练，提升泛化能力和数据利用效率。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124976668439933363","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":444},{"id":"2124976334812352536","h":"bboczeng","ts":1795468813,"zh":"如果明天不跌的话那就真的牛回了\n不符合熊市的预期","en":"如果明天不跌的话那就真的牛回了\n不符合熊市的预期","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124976334812352536","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":505},{"id":"2124976239287128460","h":"cnfinancewatch","ts":1795468790,"zh":"我极端看好A股水电板块的超长配置价值，那么出了这个方向还有什么方向？\n未来十年，三大值得重点跟踪的方向（估值适中，长期逻辑扎实）\n方向一：央国企高股息红利板块（底仓首选，稳现金流）\n这是最适合普通散户做十年长期底仓的赛道。\n包含电力、公用事业、优质央企能源、部分银行。特点：估值长期处于历史低位，现金流稳定，政策鼓励央企提高分红，股息率长期可观。\n不追求一年翻倍，靠分红+缓慢估值修复赚钱，熊市抗跌，震荡市稳稳拿住，适合做长期复利。\n优点：波动小、分红稳定；缺点：短期爆发力不强，不会天天大涨，适合长期持有，拿分红再投入。\n方向二：高端制造（非爆炒的硬核装备、工业自动化、工业母机）\n很多人一听到制造就联想到传统老行业，其实高端制造是未来十年制造业升级的核心。\n工业母机、精密零部件、机器人零部件、储能设备、特高压装备。这类企业做制造业“卡脖子”的基础装备，国产替代空间巨大。\n和AI芯片不一样，很多装备龙头估值并不夸张，业绩慢慢兑现，不是纯题材炒作。\n中国制造业全球竞争力持续提升，设备更新、产业升级是长期趋势，行业是慢慢成长，不是短期一次性爆炒。\n优势：产业逻辑扎实，估值合理；风险：制造业有周期，会跟随宏观经济震荡，需要分批布局，不能一次性满仓。\n方向三：创新医药、医疗设备（估值低位，困境反转）\n医药经历了多年调整，板块估值已经压缩到很低位置。\n不是指传统仿制药，重点是医疗设备、创新药、医疗器械。人口老龄化是未来十年确定的大趋势，医疗需求长期持续增长。\n过去几年政策压力充分释放，优质龙头已经消化利空。板块现在处于低位，长期需求确定性强，属于“需求长期向上，估值处于底部”的赛道。\n优势：老龄化刚需，估值已经充分回调；风险：政策、研发失败的个股风险，优先选行业龙头，避开小票。\n方向四：少量消费股！","en":"我极端看好A股水电板块的超长配置价值，那么出了这个方向还有什么方向？\n未来十年，三大值得重点跟踪的方向（估值适中，长期逻辑扎实）\n方向一：央国企高股息红利板块（底仓首选，稳现金流）\n这是最适合普通散户做十年长期底仓的赛道。\n包含电力、公用事业、优质央企能源、部分银行。特点：估值长期处于历史低位，现金流稳定，政策鼓励央企提高分红，股息率长期可观。\n不追求一年翻倍，靠分红+缓慢估值修复赚钱，熊市抗跌，震荡市稳稳拿住，适合做长期复利。\n优点：波动小、分红稳定；缺点：短期爆发力不强，不会天天大涨，适合长期持有，拿分红再投入。\n方向二：高端制造（非爆炒的硬核装备、工业自动化、工业母机）\n很多人一听到制造就联想到传统老行业，其实高端制造是未来十年制造业升级的核心。\n工业母机、精密零部件、机器人零部件、储能设备、特高压装备。这类企业做制造业“卡脖子”的基础装备，国产替代空间巨大。\n和AI芯片不一样，很多装备龙头估值并不夸张，业绩慢慢兑现，不是纯题材炒作。\n中国制造业全球竞争力持续提升，设备更新、产业升级是长期趋势，行业是慢慢成长，不是短期一次性爆炒。\n优势：产业逻辑扎实，估值合理；风险：制造业有周期，会跟随宏观经济震荡，需要分批布局，不能一次性满仓。\n方向三：创新医药、医疗设备（估值低位，困境反转）\n医药经历了多年调整，板块估值已经压缩到很低位置。\n不是指传统仿制药，重点是医疗设备、创新药、医疗器械。人口老龄化是未来十年确定的大趋势，医疗需求长期持续增长。\n过去几年政策压力充分释放，优质龙头已经消化利空。板块现在处于低位，长期需求确定性强，属于“需求长期向上，估值处于底部”的赛道。\n优势：老龄化刚需，估值已经充分回调；风险：政策、研发失败的个股风险，优先选行业龙头，避开小票。\n方向四：少量消费股！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124976239287128460","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":1,"vw":538},{"id":"2124975640332075025","h":"Balder13946731","ts":1795468647,"zh":"今天这根K线没法用来给我们打分。早上宽度超过上限，只给了锚点 26,705，没给区间。收盘 26,746.10，比锚点高 +0.15%，没有区间可以验证。\n全天 +6.86% 的大阳线，收盘离近期高点仍有 -14.34%，还在我们跟踪的所有价位下方。前几天就已经是这个状态了。\n2005 年以来，离高点跌了 12.8% 到 15.8% 的交易日一共 170 个。之后 20 个交易日里，摸到 31,224 的比例是 0%，所有交易日平均是 55%。跌破 25,409 的有 44%，平均 27%；跌破 24,071 的有 16%，平均 8%。\n下一交易日区间 26,509–26,984。","en":"今天这根K线没法用来给我们打分。早上宽度超过上限，只给了锚点 26,705，没给区间。收盘 26,746.10，比锚点高 +0.15%，没有区间可以验证。\n全天 +6.86% 的大阳线，收盘离近期高点仍有 -14.34%，还在我们跟踪的所有价位下方。前几天就已经是这个状态了。\n2005 年以来，离高点跌了 12.8% 到 15.8% 的交易日一共 170 个。之后 20 个交易日里，摸到 31,224 的比例是 0%，所有交易日平均是 55%。跌破 25,409 的有 44%，平均 27%；跌破 24,071 的有 16%，平均 8%。\n下一交易日区间 26,509–26,984。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2124975640332075025","l":["balder-ai.com"],"ln":[{"u":"http://balder-ai.com/playbook-ndx","d":"balder-ai.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":217},{"id":"2124975297997266960","h":"Balder13946731","ts":1795468565,"zh":"今早的稿子只交了一半。锚点 7,232 给了，区间没给，当时宽度超了上限。\n收盘 7,237.17，全天 +4.73%，比锚点高 +0.07%。今早没出区间，今天也就没有能验证的东西，记空白，不给自己补分。\n下一交易日区间 7,194–7,281。收盘后距近期高点 -7.44%。\n2005 年以来，距近期高点跌了 5.9% 到 8.9% 的交易日有 486 个。看它们之后 20 个交易日：摸到近期高点 7,819 的占 5%，所有交易日平均是 56%；跌破 6,875 的占 32%，平均 20%；跌破 6,513 的占 9%，平均 6%。","en":"今早的稿子只交了一半。锚点 7,232 给了，区间没给，当时宽度超了上限。\n收盘 7,237.17，全天 +4.73%，比锚点高 +0.07%。今早没出区间，今天也就没有能验证的东西，记空白，不给自己补分。\n下一交易日区间 7,194–7,281。收盘后距近期高点 -7.44%。\n2005 年以来，距近期高点跌了 5.9% 到 8.9% 的交易日有 486 个。看它们之后 20 个交易日：摸到近期高点 7,819 的占 5%，所有交易日平均是 56%；跌破 6,875 的占 32%，平均 20%；跌破 6,513 的占 9%，平均 6%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2124975297997266960","l":["balder-ai.com"],"ln":[{"u":"http://balder-ai.com/playbook","d":"balder-ai.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":308},{"id":"2124975234969411693","h":"cnfinancewatch","ts":1795468550,"zh":"2008年那波，偏离成本均线到40%左右的时候，市场就出现了一波力度不小的反弹。现在创业板50偏离成本均线大概34%，已经很接近那个极值区域了。这说明继续往下的空间，可能没有大家恐慌中想象的那么大。","en":"2008年那波，偏离成本均线到40%左右的时候，市场就出现了一波力度不小的反弹。现在创业板50偏离成本均线大概34%，已经很接近那个极值区域了。这说明继续往下的空间，可能没有大家恐慌中想象的那么大。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124975234969411693","l":[],"ln":[],"t":["A股港股"],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2124974880731078817","h":"cnfinancewatch","ts":1795468466,"zh":"问：美团还有价值吗？\n答：美团要在多领域和几大巨头公司过招。\n​阿里：拿着淘宝闪购和饿了么疯狂补贴，重回价格战，要在即时零售上跟美团拼刺刀。\n京东：刘强东亲自带队，搞百亿补贴，杀入外卖腹地，要用“品质”分走美团的蛋糕。\n字节：抖音本地生活像一头幽灵，靠着短视频的恐怖流量，一点点蚕食美团最赚钱的到店和酒旅业务。\n这是什么？这是典型的“多线作战，群狼围剿”。","en":"问：美团还有价值吗？\n答：美团要在多领域和几大巨头公司过招。\n​阿里：拿着淘宝闪购和饿了么疯狂补贴，重回价格战，要在即时零售上跟美团拼刺刀。\n京东：刘强东亲自带队，搞百亿补贴，杀入外卖腹地，要用“品质”分走美团的蛋糕。\n字节：抖音本地生活像一头幽灵，靠着短视频的恐怖流量，一点点蚕食美团最赚钱的到店和酒旅业务。\n这是什么？这是典型的“多线作战，群狼围剿”。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124974880731078817","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":167},{"id":"2124974075542147290","h":"SupFin","ts":1795468274,"zh":"黄仁勋回归，最尴尬的是英伟达董事会。一家价值数万亿美元的公司，到今天依然找不到第二个能同时镇住员工、客户、台积电、华尔街和美国政府的人。黄仁勋证明了自己依然是英伟达最值钱的个人资产；但英伟达也暴露了最危险的软肋，公司品牌、产品信用、客户关系甚至资本市场信心，依然高度绑定一个63岁的创始人。未来如果黄仁勋退休，英伟达还要再经历一次30%的估值重置，那就不妙了。","en":"黄仁勋回归，最尴尬的是英伟达董事会。一家价值数万亿美元的公司，到今天依然找不到第二个能同时镇住员工、客户、台积电、华尔街和美国政府的人。黄仁勋证明了自己依然是英伟达最值钱的个人资产；但英伟达也暴露了最危险的软肋，公司品牌、产品信用、客户关系甚至资本市场信心，依然高度绑定一个63岁的创始人。未来如果黄仁勋退休，英伟达还要再经历一次30%的估值重置，那就不妙了。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2124973985095876608/vid/avc1/854x480/7DQR9UrR8WaP50F9.mp4?tag=29"],"u":"https://x.com/SupFin/status/2124974075542147290","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":0,"vw":530},{"id":"2124973649249919408","h":"cnfinancewatch","ts":1795468172,"zh":"@gaoofffff 红利低波不用定投啊！股息率4%以上梭哈啊！本来就是图利息。只有科技成长需要定投。","en":"@gaoofffff 红利低波不用定投啊！股息率4%以上梭哈啊！本来就是图利息。只有科技成长需要定投。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2124973649249919408","l":[],"ln":[],"t":[],"lk":0,"rt":1,"rp":0,"vw":113},{"id":"2124973135661572380","h":"darrencao2024","ts":1795468050,"zh":"马斯克这次太涨粉了","en":"马斯克这次太涨粉了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2124973135661572380","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":444},{"id":"2124972876222873612","h":"cnfinancewatch","ts":1795467988,"zh":"华尔街观察复盘：11天终极验证，我当初预判的“辞职期权+二次定价”，是黄仁勋唯一最优解\n我只讲市场底层博弈，只做可被行情、权力、结果验证的预判。\n11天前，全网舆论一边倒：黄仁勋辞职=认栽、落幕、退场、大势已去。\n唯独我公开给出反共识核心策略：\n黄仁勋最好的出路，从来不是死扛硬顶，而是主动辞职止损、保留回归期权、完成个人与公司的二次定价。\n辞职不是认输，是以退为进；离场不是结束，是为更高筹码回桌铺路。\n今天，英伟达全票通过黄仁勋复职、美股暴力反弹、白宫公开背书、美国高层亲自下场托底。\n所有剧情，100%兑现我此前的全部判断。\n为什么只有“辞职—空窗博弈—强势回归”，是黄仁勋、英伟达、美国算力博弈三方的唯一最优解？\n一、当初所有人都看错：辞职是止损，不是溃败\n风波初期，市场最大误区：把“主动辞职”当成被动出局。\n华尔街顶级交易逻辑永远一致：高风险持仓，第一优先级是切断负反馈、保住核心资产，而不是死扛浮亏，直到爆仓归零。\n当时黄仁勋深陷舆论与合规审查漩涡，董事会、国会、监管层层施压。\n如果选择硬扛：\n舆情持续发酵、公司治理持续被质疑、国家安全风险叙事持续绑定英伟达。\n最终结果一定是：个人声誉彻底锁死、公司估值持续阴跌、AI算力龙头叙事崩塌、整个美股科技链持续下杀。\n死扛，是无限消耗。\n辞职，是瞬间止损。\n这就是我当初第一重核心判断：辞职是最高级的风控手段，是保留未来所有可能性的唯一方式。\n辞职离场后，所有负面压力立刻与英伟达主体切割。\n舆论降温、审查暂停、公司脱离争议漩涡，为后续翻盘，清空了所有利空底盘。\n二、我的核心预判兑现：辞职是空仓等待，复职是二次定价\n全网当时不懂的深层逻辑，我当时直接点透：\n辞职不是终点，是“创业/蛰伏+伺机复职”的筹码重构过程。离场，是为了重新定义谈判地位。\n过去11天，市场用万亿市值、白宫博弈、董事会反转，完美印证这套逻辑：\n1、空窗期，击穿所有人的认知幻觉\n董事会曾极度傲慢：认为换掉创始人，职业经理人照样能运转万亿算力帝国。\n财报好看、产能紧缺、订单爆满，他们误以为“黄仁勋可替代”。\n但现实狠狠打脸：\n黄仁勋离场短短十几天，英伟达市值暴跌数千亿，科技板块连锁下杀。\n临时财务型管理层，只能管报表、管流程，根本没有下一代芯片架构、AI算力周期、全球产业布局的顶层能力。\n市场瞬间看懂：\n英伟达的核心资产，从来不是厂房、设备、财报，而是黄仁勋的技术认知、行业卡位、全球话语权。\n2、崩盘行情，倒逼董事会认错\n此前董事会态度决绝：明确表态不欢迎黄仁勋回归。\n但市值崩塌、产业链停摆、AI融资遇冷之后，董事层彻底清醒：\n可以换掉CEO，但换不掉一个时代的算力定义者。\n这就是二次定价的精髓：\n你在的时候，所有人低估你的价值；你离开造成体系崩塌，所有人重新给你定价。\n辞职，是用“短暂离场”，证明自己的不可替代性。\n三、最高层博弈落地：美国国运，锁死黄仁勋回归必然性\n我此前第二个核心预判：黄仁勋的回归不是公司人事变动，是中美AI算力博弈的国家级选择，必然得到白宫背书。\n这11天的幕后博弈，彻底坐实我的判断：\n川普团队全程介入、副总统、财长、商务部长集体协调，白宫、司法部、情报部门联合出结论：黄仁勋本人清白，无国家安全风险。\n高层的底层逻辑极度清醒：\n顶级芯片算力，不可复制、不可山寨、无法替代。\n图纸可以留存，但三代产品的迭代逻辑、顶层架构、产业生态，只装在天才脑子里。\n美国鹰派终于想明白最致命的道理：\n留着黄仁勋不是威胁，逼走黄仁勋，才是美国最大的国家安全灾难。\n一旦把这位全球顶级算力领路人逼至绝境，对手阵营将直接完成技术弯道超车，美国数年的算力代差优势，一夜清零。\n所以才有最终结局：\n国家层面兜底、政治层面背书、董事会全面妥协、市场用万亿涨幅投票。\n黄仁勋的回归，不是人情，不是妥协，是国家利益、市场规律、产业趋势三重合力的必然结果。\n四、终极策略复盘：这就是顶级大佬的“期权人生”\n很多人看不懂这场博弈，是因为普通人只看“面子输赢”，顶级玩家只看“筹码与定价”。\n完整闭环，完全复刻我当初的策略推演：\n1. 主动辞职：止损脱坑，切断所有负向博弈，保留人生与事业期权；\n2. 空窗蛰伏：让市场、董事会、高层亲眼见证“缺我不可”的体系崩塌；\n3. 权威背书+全员认错：完成个人价值的超级二次定价；\n4. 强势复职：带着更高话语权、更高信任、更高不可替代性回归。\n辞职不是认输，是保留复职期权；回归不是复辟，是实力重新定价。\n11天前，我逆势预判的“以退为进、离场重估、曲线回归”，\n今天，全部落地、全部兑现、全部验证。\n市场永远奖励懂博弈、懂取舍、懂定价的顶级头脑。\n所有看似被动的离场，都是精心设计的顶级翻盘。\n#华尔街观察 #黄仁勋 #英伟达","en":"华尔街观察复盘：11天终极验证，我当初预判的“辞职期权+二次定价”，是黄仁勋唯一最优解\n我只讲市场底层博弈，只做可被行情、权力、结果验证的预判。\n11天前，全网舆论一边倒：黄仁勋辞职=认栽、落幕、退场、大势已去。\n唯独我公开给出反共识核心策略：\n黄仁勋最好的出路，从来不是死扛硬顶，而是主动辞职止损、保留回归期权、完成个人与公司的二次定价。\n辞职不是认输，是以退为进；离场不是结束，是为更高筹码回桌铺路。\n今天，英伟达全票通过黄仁勋复职、美股暴力反弹、白宫公开背书、美国高层亲自下场托底。\n所有剧情，100%兑现我此前的全部判断。\n为什么只有“辞职—空窗博弈—强势回归”，是黄仁勋、英伟达、美国算力博弈三方的唯一最优解？\n一、当初所有人都看错：辞职是止损，不是溃败\n风波初期，市场最大误区：把“主动辞职”当成被动出局。\n华尔街顶级交易逻辑永远一致：高风险持仓，第一优先级是切断负反馈、保住核心资产，而不是死扛浮亏，直到爆仓归零。\n当时黄仁勋深陷舆论与合规审查漩涡，董事会、国会、监管层层施压。\n如果选择硬扛：\n舆情持续发酵、公司治理持续被质疑、国家安全风险叙事持续绑定英伟达。\n最终结果一定是：个人声誉彻底锁死、公司估值持续阴跌、AI算力龙头叙事崩塌、整个美股科技链持续下杀。\n死扛，是无限消耗。\n辞职，是瞬间止损。\n这就是我当初第一重核心判断：辞职是最高级的风控手段，是保留未来所有可能性的唯一方式。\n辞职离场后，所有负面压力立刻与英伟达主体切割。\n舆论降温、审查暂停、公司脱离争议漩涡，为后续翻盘，清空了所有利空底盘。\n二、我的核心预判兑现：辞职是空仓等待，复职是二次定价\n全网当时不懂的深层逻辑，我当时直接点透：\n辞职不是终点，是“创业/蛰伏+伺机复职”的筹码重构过程。离场，是为了重新定义谈判地位。\n过去11天，市场用万亿市值、白宫博弈、董事会反转，完美印证这套逻辑：\n1、空窗期，击穿所有人的认知幻觉\n董事会曾极度傲慢：认为换掉创始人，职业经理人照样能运转万亿算力帝国。\n财报好看、产能紧缺、订单爆满，他们误以为“黄仁勋可替代”。\n但现实狠狠打脸：\n黄仁勋离场短短十几天，英伟达市值暴跌数千亿，科技板块连锁下杀。\n临时财务型管理层，只能管报表、管流程，根本没有下一代芯片架构、AI算力周期、全球产业布局的顶层能力。\n市场瞬间看懂：\n英伟达的核心资产，从来不是厂房、设备、财报，而是黄仁勋的技术认知、行业卡位、全球话语权。\n2、崩盘行情，倒逼董事会认错\n此前董事会态度决绝：明确表态不欢迎黄仁勋回归。\n但市值崩塌、产业链停摆、AI融资遇冷之后，董事层彻底清醒：\n可以换掉CEO，但换不掉一个时代的算力定义者。\n这就是二次定价的精髓：\n你在的时候，所有人低估你的价值；你离开造成体系崩塌，所有人重新给你定价。\n辞职，是用“短暂离场” us/2124920432176570396","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":574},{"id":"2124919984094642650","h":"AntonLaVay","ts":1795455377,"zh":"关于这条新闻\n首先，国会当然有权调查Jensen。\n美国党争激烈，但我从来不否认美国的司法独立和法治底色。\n其次，注意一个关键时间线：共和党内对华鹰派针对Jensen的调查早在2025年就已经开始了，总统的态度无法指示情报部门的调查员去“放水”。\n从后来总统和财长态度的180度大转弯就能看出来，查了这么久，至少美国情报部门一年以来的调查除了知道Jensen出轨过Alice以外，手里根本没有任何指向他本人危害国家安全的实锤。\n至于现在舒默喊着要动用全力调查，说白了醉翁之意不在Jensen，不过是党争之下借题发挥，把炮火对准白宫罢了。","en":"关于这条新闻\n首先，国会当然有权调查Jensen。\n美国党争激烈，但我从来不否认美国的司法独立和法治底色。\n其次，注意一个关键时间线：共和党内对华鹰派针对Jensen的调查早在2025年就已经开始了，总统的态度无法指示情报部门的调查员去“放水”。\n从后来总统和财长态度的180度大转弯就能看出来，查了这么久，至少美国情报部门一年以来的调查除了知道Jensen出轨过Alice以外，手里根本没有任何指向他本人危害国家安全的实锤。\n至于现在舒默喊着要动用全力调查，说白了醉翁之意不在Jensen，不过是党争之下借题发挥，把炮火对准白宫罢了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2124919984094642650","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":0,"vw":1357},{"id":"2124918956288774654","h":"hanking66","ts":1795455132,"zh":"黄仁勋回来是好事， 半导体的教父回来了。但是市场这波下跌并不是只因为黄仁勋，更大的利空是市场担心后面连续三次加息。黄仁勋的回归并不会让加息有任何改变。所以....后面的数据才是我们需要担心的大头。\n但是12月加息已经被充分计价了，今年剩下的时间，我觉得还是会有一波反弹行情的，看好感恩节涨到圣诞节。\n周五的低点大概率就是今年的最低点了。\n明年的事明年再说。如果真三次加息，会有机会跑的。\nBuy the dip，长期持有，Discord在个人资料。","en":"黄仁勋回来是好事， 半导体的教父回来了。但是市场这波下跌并不是只因为黄仁勋，更大的利空是市场担心后面连续三次加息。黄仁勋的回归并不会让加息有任何改变。所以....后面的数据才是我们需要担心的大头。\n但是12月加息已经被充分计价了，今年剩下的时间，我觉得还是会有一波反弹行情的，看好感恩节涨到圣诞节。\n周五的低点大概率就是今年的最低点了。\n明年的事明年再说。如果真三次加息，会有机会跑的。\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2124918956288774654","l":[],"ln":[],"t":["美联储","AI科技"],"lk":6,"rt":0,"rp":3,"vw":1335},{"id":"2124918798700683669","h":"bboczeng","ts":1795455095,"zh":"今天到底是反转，还是反弹呢？\n考验各位老师的时候又到了","en":"今天到底是反转，还是反弹呢？\n考验各位老师的时候又到了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2124918798700683669","l":[],"ln":[],"t":[],"lk":16,"rt":0,"rp":15,"vw":2436},{"id":"2124916805596811441","h":"bboczeng","ts":1795454620,"zh":"这其实说明了定投才是唯一出路\n谢谢大家","en":"这其实说明了定投才是唯一出路\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng 能对NVIDIA的消息并不兴奋。”\n据CNBC报道。","en":"一个人可以让全市场6万亿灰飞烟灭，也可以十分钟让股市3万亿暴涨逼空，多空双杀，他确实可以笑傲江湖了。\n这也说明当前AI投资的市场共识的混乱，也说明市场大量认知差和超额市场收益的空间。\n这是所有散户和专业投资者的必读\n具体的投资策略和仓位买入管理更新见11月订阅投资 订阅者专享\n所以最难的，从来不是看懂一次暴跌。\n而是当市场重新热起来、重新顺起来、重新让你觉得自己无所不能的时候，你还能不能记得，在最黑的时候到底学到了什么。\n多数人不是死在底部。多数人死在从底部活过来以后，以为自己刀枪不入。\n市场会反复奖励勇敢。但它最终只长期奖励有纪律的人。\n下面是最新的内容报道：\n🇺🇸 特朗普总统刚刚对英伟达董事会主席确认：\n1.“Jensen没有做错任何事。我们进行了彻底的调查。”\n2.“最大的威胁是失去Jensen的脑力。”\n3.“黄已经在为未来想三块芯片了。”\n4. “我们向Nvidia董事会提供了关于国家安全的保证。”\n5.“我跟习近平主席详细谈了Jensen的事。我没有跟习近平主席讨论Alice Huang是不是间谍。”\n6.“Nvidia的超级先进芯片不能被复制。”\n7.“我现在不担心人工智能泡沫了。”\n8.“副总统Vance参与了Nvidia的决定。”\n9.“我相信我的干预对让Jensen Huang回来非常重要。”\n10.“中国本可以招募黄先生领导华为或其他任何科技公司。”\n11.“我们想要Jensen站在我们这边。”\n12.“Xi可能对NVIDIA的消息并不兴奋。”\n据CNBC报道。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX0uOFNbAAELlX4.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2124905421542683120","l":[],"ln":[],"t":["AI科技"],"lk":6,"rt":2,"rp":0,"vw":1325},{"id":"2124904318604296404","h":"xingpt","ts":1795451643,"zh":"老川做事的逻辑其实很简单，你把他想象得太复杂就理解不了，想象成一个总统或者一个体系都理解不了。但你如果把他想象成一个公司，特别是一个乡镇企业的土老板，就理解多了。\n川普估计这么说的：“贝森特呀，老黄给我打电话说了，说把他给撸下去了，让我跟老黄的这些董事会伙计开个会唠一下，让老黄回来接着干吧。谁还不整点儿炕头上的事儿呢？\n哪有那么大的事儿？没有那么大的过不去的事儿，大家唠一唠，啥都能消停”","en":"老川做事的逻辑其实很简单，你把他想象得太复杂就理解不了，想象成一个总统或者一个体系都理解不了。但你如果把他想象成一个公司，特别是一个乡镇企业的土老板，就理解多了。\n川普估计这么说的：“贝森特呀，老黄给我打电话说了，说把他给撸下去了，让我跟老黄的这些董事会伙计开个会唠一下，让老黄回来接着干吧。谁还不整点儿炕头上的事儿呢？\n哪有那么大的事儿？没有那么大的过不去的事儿，大家唠一唠，啥都能消停”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2124904318604296404","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":548},{"id":"2124902957703651706","h":"tig88411109","ts":1795451318,"zh":"有一点可惜 $NVDA黄仁勋这么快就复职，在当前已经是明显各种媒体小报“猎巫”的小作文，五花八门的各种刁钻角度抨击老黄的为人和做事风格要把他搞臭。实际上我说了就是“黄金坑”接带血的恐慌筹码的时候，这才是真正的超越市场收益和认知差的投资收益所在。闪电般离职又复职，当然是市场大跌倒逼压力，但一定是特朗普和美国情报政府机构背书他本人不涉及间谍和叛国行为。当然后期的国会质询还会继续，证监会的会计操控也都会继续，但大概率都是扑风追影。但这么快复职，后面还有一系列调查，肯定连续性的坏消息小作文还会死灰复燃。这个事件冲击下，当然是好事，英伟达内部加强管控和公司治理。AI钢铁泡沫，行到中途，走得慢一点稳一点不是坏事，对于整个AI生态也是行稳致远。市场大跌确实有用，死给你看，那么这周消费者价格指数出来了，美联储还会倒逼被迫不加息么，空头是不是要瑟瑟发抖？投资者如何应对，颗粒度更细策略和内容见订阅者 伟达评级从持有上调至买入。\nWedbush：维持英伟达跑赢大市评级，目标价225美元。调查解决后可能看到更高路径（如300美元）。\n$NVDA","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2124896233009586480","l":[],"ln":[],"t":["AI科技"],"lk":11,"rt":0,"rp":2,"vw":2958},{"id":"2124896222716764634","h":"octopusycc","ts":1795449712,"zh":"最近研究了一家比较有意思的美股公司，$OPNW（OpenWorld）。@openworld_HQ\n我一直有个观点：RWA 下一阶段真正值得关注的，不是把多少资产搬到链上，而是谁能解决传统金融市场真实存在的融资需求。\nOPNW 就是一个值得研究的案例。\n1. 公司背景\nOPNW 今年 10 月正式以新代码在 Nasdaq 交易，主要通过 OpenWorld Enterprise 为企业提供资产代币化、融资结构设计和技术服务。\n团队有一定传统金融背景。CEO Matthew Shaw 曾任职 UBS，也创立过加密资产管理公司 Protos；Russel McMeekin 则有 Honeywell 的企业技术管理经验。\n2. AI CapEx 的二阶传导，可能是 RWA 的新机会\n我之前反复讲过，AI CapEx 的二阶增速不可能永远加速。\n未来市场关注的重点，会逐渐从算力投入规模转向资本效率、融资成本和资产回报率。\nOPNW 目前推进的两个项目恰好切中了这个方向：\nMeridian：拟通过上限 10 亿美元的代币化融资，建设光伏、储能支持的分布式 AI 算力网络。\nBeyondAI：拟以知识产权作为抵押品，进行上限 1.3 亿美元的代币化融资。\n两个项目都不能直接视为已完成融资或已确认收入。\n但我认为背后的逻辑值得关注：当 AI 企业开始更加重视资本效率，知识产权、算力设备、能源资产等，都可能成为新的融资标的。\nRWA 的机会可能不只在国债和传统信贷。\n3. Solana 生态的参与\n11 月 10 日，代币化 OPNW 上线 Solana，由 Backpack Securities 发行。\nSolana 官方账号进行了相关直播，Frontier Traders 也推出了 OPNW 交易奖励活动。\n我更关注的是，传统上市公司的股票开始获得新的链上交易渠道。这不等于 Solana 对股价背书，但确实让 OPNW 获得了一定的生态曝光。\n4. 估值差距与我的研究框架\n按照 11 月 16 日收盘市值及 Q3 收入年化口径计算：\nSecuritize：16.1x P/S\nFigure：5.0x P/S\nOPNW：0.28x P/S\nOPNW 当时市值约 835 万美元，Q3 收入约 740 万美元。\n估值倍数差距确实很大，但我不认为简单套用同行估值，就能证明公司被低估。\n尤其 OPNW Q3 约 89% 的收入来自关联方，相关 RWA 收入截至季末尚未开票或回款，收入质量仍然需要验证。\n按照我的研究框架，接下来主要关注三个变量：\n宏观流动性：利率和融资环境是否支持项目交割？\n现金流兑现：项目能否从融资意向变成实际收入和回款？\n估值预期差：第三方客户增长、收入质量改善，能否支撑市场重新定价？\n——————————————\n我认为 AI CapEx 周期的下一阶段，不只是半导体和数据中心之间的利润重新分配，也可能带来融资结构和资本市场服务的新需求。\nOPNW 正好处在 RWA 与 AI 资产融资的交叉点上。\n但融资规模不等于收入，收入也不等于现金流。低估值背后也可能是市场对执行风险的定价。\n我更愿意把 OPNW 当作一个需要持续验证的预期差案例。未来几个季度，真正重要的不是宣布了多少亿美元的项目，而是有多少项目完成交割、多少收入最终变成现金流。","en":"最近研究了一家比较有意思的美股公司，$OPNW（OpenWorld）。@openworld_HQ\n我一直有个观点：RWA 下一阶段真正值得关注的，不是把多少资产搬到链上，而是谁能解决传统金融市场真实存在的融资需求。\nOPNW 就是一个值得研究的案例。\n1. 公司背景\nOPNW 今年 10 月正式以新代码在 Nasdaq 交易，主要通过 OpenWorld Enterprise 为企业提供资产代币化、融资结构设计和技术服务。\n团队有一定传统金融背景。CEO Matthew Shaw 曾任职 UBS，也创立过加密资产管理公司 Protos；Russel McMeekin 则有 Honeywell 的企业技术管理经验。\n2. AI CapEx 的二阶传导，可能是 RWA 的新机会\n我之前反复讲过，AI CapEx 的二阶增速不可能永远加速。\n未来市场关注的重点，会逐渐从算力投入规模转向资本效率、融资成本和资产回报率。\nOPNW 目前推进的两个项目恰好切中了这个方向：\nMeridian：拟通过上限 10 亿美元的代币化融资，建设光伏、储能支持的分布式 AI 算力网络。\nBeyondAI：拟以知识产权作为抵押品，进行上限 1.3 亿美元的代币化融资。\n两个项目都不能直接视为已完成融资或已确认收入。\n但我认为背后的逻辑值得关注：当 AI 企业开始更加重视资本效率，知识产权、算力设备、能源资产等，都可能成为新的融资标的。\nRWA 的机会可能不只在国债和传统信贷。\n3. Solana 生态的参与\n11 月 10 日，代币化 OPNW 上线 Solana，由 Backpack Securities 发行。\nSolana 官方账号进行了相关直播，Frontier Traders 也推出了 OPNW 交易奖励活动。\n我更关注的是，传统上市公司的股票开始获得新的链上交易渠道。这不等于 Solana 对股价背书，但确实让 OPNW 获得了一定的生态曝光。\n4. 估值差距与我的研究框架\n按照 11 月 16 日收盘市值及 Q3 收入年化口径计算：\nSecuritize：16.1x P/S\nFigure：5.0x P/S\nOPNW：0.28x P/S\nOPNW 当时市值约 835 万美元，Q3 收入约 740 万美元。\n估值倍数差距确实很大，但我不认为简单套用同行估值，就能证明公司被低估。\n尤其 OPNW Q3 约 89% 的收入来自关联方，相关 RWA 收入截至季末尚未开票或回款，收入质量仍然需要验证。\n按照我的研究框架，接下来主要关注三个变量：\n宏观流动性：利率和融资环境是否支持项目交割？\n现金流兑现：项目能否从融资意向变成实际收入和回款？\n估值预期差：第三方客户增长、收入质量改善，能否支撑市场重新定价？\n——————————————\n我认为 AI CapEx 周期的下一阶段，不只是半导体和数据中心之间的利润重新分配，也可能带来融资结构和资本市场服务的新需求。\nOPNW 正好处在 RWA 与 AI 资产融资的交叉点上。\n但融资规模不等于收入，收入也不等于现金流。低估值背后也可能是市场对执行风险的定价。\n我更愿意把 OPNW 当作一个需要持续验证的预期差案例。未来几个季度，真正重要的不是宣布了多少亿美元的项目，而是有多少项目完成交割、多少收入最终变成现金流。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HX0l1d2awAAkJvG.jpg?name=orig"],"u":"https://x.com/octopusycc/status/2124896222716764634","l":[],"ln":[],"t":["美股","AI科技"],"lk":6,"rt":1,"rp":3,"vw":1762},{"id":"2124895989236658559","h":"tig88411109","ts":1795449657,"zh":"杀不死你的让你更强大。这才是真正的顶级买方策略。看看市场上一旦大跌三根阴线，就开始如大摩、UBS和那个什么印度分析师的Semianalysis疯狂挑低AI需求预测。都是比散户还是更韭菜风格的大号机构投资。在市场最恐慌之时，这是最根本的底层逻辑分析，告诉你什么叫做AI钢铁泡沫，什么叫做投资策略和仓位应对。难的，从来不是看懂一次暴跌。而是当市场重新热起来、重新顺起来、重新让你觉得自己无所不能的时候，你还能不能记得，在最黑的时候到底学到了什么。多数人不是死在底部。多数人死在从底部活过来以后，以为自己刀枪不入。","en":"杀不死你的让你更强大。这才是真正的顶级买方策略。看看市场上一旦大跌三根阴线，就开始如大摩、UBS和那个什么印度分析师的Semianalysis疯狂挑低AI需求预测。都是比散户还是更韭菜风格的大号机构投资。在市场最恐慌之时，这是最根本的底层逻辑分析，告诉你什么叫做AI钢铁泡沫，什么叫做投资策略和仓位应对。难的，从来不是看懂一次暴跌。而是当市场重新热起来、重新顺起来、重新让你觉得自己无所不能的时候，你还能不能记得，在最黑的时候到底学到了什么。多数人不是死在底部。多数人死在从底部活过来以后，以为自己刀枪不入。","zh_src":"native","lang":"zh","m":[],"u 24867812867141792","h":"ShanghaoJin","ts":1795442939,"zh":"这样就“夺门之变”了？","en":"这样就“夺门之变”了？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2124867812867141792","l":[],"ln":[],"t":[],"lk":35,"rt":0,"rp":11,"vw":5475},{"id":"2124867802268135680","h":"hanking66","ts":1795442936,"zh":"那些和我杠老黄不可能回来的，你们出来！！too young！too simple！\nBuy the dip，长期持有，Discord在个人资料。","en":"那些和我杠老黄不可能回来的，你们出来！！too young！too simple！\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2124867802268135680","l":[],"ln":[],"t":[],"lk":23,"rt":0,"rp":5,"vw":2621},{"id":"2124867598118707670","h":"fxtrader","ts":1795442888,"zh":"（全文）《英伟达董事会恢复黄仁勋总裁、首席执行官及董事职务》\n美国加利福尼亚州圣克拉拉，2026年11月23日——英伟达（NASDAQ： $NVDA ）今日宣布，即时生效，黄仁勋已恢复担任总裁兼首席执行官以及董事会成员。在与黄仁勋进行一系列讨论和会面后，董事会一致投票决定恢复其职务；此后，董事会对黄仁勋的坦诚以及领导英伟达的能力表示满意。在作出决定的过程中，董事会听取了美国政府高层的意见；基于这些意见，董事会确信黄仁勋的复职不构成国家安全风险。\n“董事会认为，黄仁勋是领导英伟达的合适人选，他的复职符合我们股东、员工、合作伙伴和客户的最佳利益，”董事会主席Harvey C. Jones表示，“我们对黄仁勋充满信心，期待在他恢复领导公司之际与他共事。我们感谢Colette Kress在担任临时首席执行官期间的出色服务，以及她继续履行英伟达首席财务官的职责。”Harvey Jones将继续担任董事会主席。\n“我很荣幸重返英伟达，并在新一轮工业革命开端之际，领导世界上最具影响力的科技公司之一，”黄仁勋表示，“我以最大的谦逊之心和全新的承诺承担这一责任。我要感谢英伟达董事会在这一过程中给予的信任与审慎考量。我特别感谢Harvey Jones作为主席所展现的领导力，感谢Colette Kress和我们的管理团队在此期间领导英伟达。我也要 deeply 感谢我们的员工、股东、业界领袖以及全球合作伙伴给予的非凡支持。最重要的是，感谢家人的爱与支持。我已迫不及待要回到工作中。”\n此前已宣布，鉴于近期有报道称黄仁勋已成为外国情报行动的目标，董事会成立了一个完全由独立董事组成的委员会进行调查，该委员会聘请了独立法律顾问协助调查。董事会重申，该委员会的调查将继续推进直至得出结论。黄仁勋完全支持这项调查，并承诺予以配合。\n董事会近期还成立了一个完全由独立董事组成的国家安全与出口管制委员会，负责监督贸易合规与国家安全风险。该委员会正在聘请具有国家安全事务经验的律师，这些律师将再行聘请具备国家安全事务专业知识的顾问。英伟达正在启动招聘程序，以填补一个新设职位——首席合规官，该职位将负责监督英伟达的整体合规事务，并向提名与公司治理委员会汇报。英伟达将继续配合正在进行的政府调查与问询。","en":"（全文）《英伟达董事会恢复黄仁勋总裁、首席执行官及董事职务》\n美国加利福尼亚州圣克拉拉，2026年11月23日——英伟达（NASDAQ： $NVDA ）今日宣布，即时生效，黄仁勋已恢复担任总裁兼首席执行官以及董事会成员。在与黄仁勋进行一系列讨论和会面后，董事会一致投票决定恢复其职务；此后，董事会对黄仁勋的坦诚以及领导英伟达的能力表示满意。在作出决定的过程中，董事会听取了美国政府高层的意见；基于这些意见，董事会确信黄仁勋的复职不构成国家安全风险。\n“董事会认为，黄仁勋是领导英伟达的合适人选，他的复职符合我们股东、员工、合作伙伴和客户的最佳利益，”董事会主席Harvey C. Jones表示，“我们对黄仁勋充满信心，期待在他恢复领导公司之际与他共事。我们感谢Colette Kress在担任临时首席执行官期间的出色服务，以及
