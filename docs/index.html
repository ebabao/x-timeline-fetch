一夜断供” 的不实信息，刻意引发国产算力链非理性下跌。我们持续跟踪产业一线，就此严正澄清：\n1. 所谓 “断供” 完全失实。本次审查仅针对通过多层壳公司规避出口管制的违规订单，合规经营的国内客户流片、交付流程全程正常，不存在任何一刀切停单的情况。\n2. 所谓 “断供拖累行业进度” 纯属无稽之谈。国内主流算力芯片厂商，从未将三星先进制程产能作为核心供应来源，本就不存在 “被断供” 的前提。\n3. 产业基本面未受任何影响：国产GPU、高端交换机、超节点整机订单排期已至明年，核心ODM合作厂产能满负荷，客户锁单意愿强烈，景气度持续上行。\n刻意散播恐慌、放大局部合规要求制造利空砸盘，本质是利用信息差收割非理性筹码。本轮下跌是纯粹的情绪错杀，请勿被别有用心的小作文误导。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123305190824788060","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":2,"rp":0,"vw":1720},{"id":"2123303719475478950","h":"qinbafrank","ts":1795070030,"zh":"9月底德鲁肯米勒还有四十多亿美金的股票仓位，现在已经完全清仓，逻辑是什么？对我们的投资交易有何启发？前两天美股机构改革纷纷披露截止9月底的三季度13-F文件，看到不少关于德鲁肯米勒家族办公室的持仓分析，不过现在看来意义都不大了。因为11月18日在奥斯汀举行的TomorrowX峰会上与摩根士丹利全球衍生品业务负责人Iliana Bouzali对谈中，德鲁肯米勒已经明确说都清仓了。一个半月前仓位还很高，现在已经全清掉，这中间的逻辑是什么？详细看完德鲁肯米勒这次谈话全文，有几个点让我印象深刻。\n1、今年1月初为何全力做多？\n1）当时经济非常强劲，更重要的是往前看——联邦基金利率只有 3.5%，而名义GDP 增速高达 6%，这意味着当时的货币政策宽松得简直荒谬！而且看美联储所谓的“点阵图（Dot plot）”，市场还预期今年晚些时候会有更多次降息；\n2）包括铜在内的大宗商品正在向上突破创出新高；\n3）德鲁肯米勒紧盯的腾落指数（Advance-Decline line，衡量市场广度的核心指标）和其他技术指标全都在创新高；\n4）信用利差（Credit spreads）窄到了极点。\n在他看来，在如此过度刺激的货币政策下，未来6 到 12 个月内根本不可能发生经济衰退。\n而去年深秋晚些时候发布的 Claude Code，让所有圈内人（对 AI 的加速爆发兴奋到了极点！ 因此我们对 AI 资本开支（CapEx）极度看多。所有这些因素叠加在一起，让我们在 1 月份全力做多股市和经济。\n2、现在为什么清仓？\n虽然表层经济看起来依然强劲，但年初支持看多的所有其他指标，已经彻底来了个 180 度大反转：\n1）美联储不再降息，而是在加息：我们在美联储迎来了“政权更迭，德鲁肯米勒对沃什非常熟，因为沃什曾在德鲁肯米勒家族办公室在担任合伙人多年，之前这里 15 年我们一直搞“免费资金（零利率）”导致财政赤字和所有债务冲上云霄极其不满，对通胀连续 5 年高于目标更是深恶痛绝。\n2）大宗商品见顶回落，反手做空铜。今年 1 月向上突破的大宗商品，现在看起来已经彻底见顶并掉头向下；\n3）市场广度背离与信用利差走阔。1 月份还在创新高的腾落指数（Advance-Decline line），早在8 月14 日 就已经见顶了，尽管大盘指数一直撑到10月份才见顶；\n4）信用利差正在不断走阔（Widening）。\n在德鲁肯米勒眼里当下所有的宏观与技术指标，都跟今年 1 月份完完全全相反！\n当下他最严肃对待的 AI 看空逻辑是就是政治，以及融资问题\n3、没有做多为什么也没做空？\n他现在既没有做多美股，也没有做空美股。没做空是因为AI 创新的爆发力，他说自己绝不敢去摸老虎屁股做空这里的科技创新！ \n还有一点德鲁肯米勒也承认当下很多科技股近期已经严重超卖、经历了剧烈的仓位洗盘（Washed out），战术层面上机构的仓位已经降下来了。潜在意思他也认为当下做空性价比已经不高了。\n但每当看不清方向的时候他自然会选择不玩了。\n4、AI的下半场是什么？\n在股票市场方面，德鲁肯米勒正在全力寻找“AI 的实际应用用例”，而不是“AI 基础设施”！\nAI 基础设施在经历了近期的剧烈洗盘后，或许会是一笔不错的短线战术交易（Tactical trade），但他也不认为基建硬件还能像过去四年那样，能继续充当主升浪的核心引擎。\n但他认为应用层用例（Use cases）却完全有可能接棒。而且也许最有趣的“应用用例”恰恰就是前沿 AI 实验室自己！他的逻辑是：掌握全球顶级智能的实验室，没有理由继续停留在按token收费的商业模式上。\n“如果你拥有世界上最强的智能，你可以开始卖任务，而不是卖token，你可以自己创建业务，”他说。\n如果接下来股市还会有一波波澜壮阔的大主升浪，他认为核心就是——“卖任务，不卖 Token”。\n这一点是个人很认可的，之前也有聊过 AI主线已经迁移、中游的云厂、下游的应用都值得关注。当然从德鲁肯米勒自己的表态来看他肯定有人在关注Anthropic上市后能介入的机会。\n5、对我们投资交易的启发是什么？\n1）反手的能力\n看德鲁肯米勒这次讲话印象最深的一点，年初他刚刚全力做多没多久，伊朗战争爆发，他也当时慌了神砍掉了一大堆仓位；\n但很很快又把仓位买回来，并且顺势把不会暴涨的杂毛股全清理干净了，让我们结结实实吃下了二季度的这波主升浪。你看发生冲击时他也会慌，也会砍仓，然后再看机会在哪里。\n还有就是9月底他的机构还是高仓位运行、但现在已经清仓、明显在10月初以来的这一波调整中他夜趁机把仓位都砍掉，就是不知道他的回撤有多大。\n但这种“反手”的能力值得我们学习、不让自己的判断成为执念，能随时纠正，这种灵活性是一个投资高手必须要能掌握的。\n2）在棒球比赛里，有远超随机概率的“连续击球手顺期（Hitting streaks）”。\n做投资也一样：\n有时候站在击球区能清清楚楚看清飞过来的球，那就抡圆了胳膊下重注（Play big）；\n而当感觉看不清球的时候，他就只做一点小小的触击短打（Little bunts），等什么时候胜率回升、重新看清球路了，我再重新发力。","en":"9月底德鲁肯米勒还有四十多亿美金的股票仓位，现在已经完全清仓，逻辑是什么？对我们的投资交易有何启发？前两天美股机构改革纷纷披露截止9月底的三季度13-F文件，看到不少关于德鲁肯米勒家族办公室的持仓分析，不过现在看来意义都不大了。因为11月18日在奥斯汀举行的TomorrowX峰会上与摩根士丹利全球衍生品业务负责人Iliana Bouzali对谈中，德鲁肯米勒已经明确说都清仓了。一个半月前仓位还很高，现在已经全清掉，这中间的逻辑是什么？详细看完德鲁肯米勒这次谈话全文，有几个点让我印象深刻。\n1、今年1月初为何全力做多？\n1）当时经济非常强劲，更重要的是往前看——联邦基金利率只有 3.5%，而名义GDP 增速高达 6%，这意味着当时的货币政策宽松得简直荒谬！而且看美联储所谓的“点阵图（Dot plot）”，市场还预期今年晚些时候会有更多次降息；\n2）包括铜在内的大宗商品正在向上突破创出新高；\n3）德鲁肯米勒紧盯的腾落指数（Advance-Decline line，衡量市场广度的核心指标）和其他技术指标全都在创新高；\n4）信用利差（Credit spreads）窄到了极点。\n在他看来，在如此过度刺激的货币政策下，未来6 到 12 个月内根本不可能发生经济衰退。\n而去年深秋晚些时候发布的 Claude Code，让所有圈内人（对 AI 的加速爆发兴奋到了极点！ 因此我们对 AI 资本开支（CapEx）极度看多。所有这些因素叠加在一起，让我们在 1 月份全力做多股市和经济。\n2、现在为什么清仓？\n虽然表层经济看起来依然强劲，但年初支持看多的所有其他指标，已经彻底来了个 180 度大反转：\n1）美联储不再降息，而是在加息：我们在美联储迎来了“政权更迭，德鲁肯米勒对沃什非常熟，因为沃什曾在德鲁肯米勒家族办公室在担任合伙人多年，之前这里 15 年我们一直搞“免费资金（零利率）”导致财政赤字和所有债务冲上云霄极其不满，对通胀连续 5 年高于目标更是深恶痛绝。\n2）大宗商品见顶回落，反手做空铜。今年 1 月向上突破的大宗商品，现在看起来已经彻底见顶并掉头向下；\n3）市场广度背离与信用利差走阔。1 月份还在创新高的腾落指数（Advance-Decline line），早在8 月14 日 就已经见顶了，尽管大盘指数一直撑到10月份才见顶；\n4）信用利差正在不断走阔（Widening）。\n在德鲁肯米勒眼里当下所有的宏观与技术指标，都跟今年 1 月份完完全全相反！\n当下他最严肃对待的 AI 看空逻辑是就是政治，以及融资问题\n3、没有做多为什么也没做空？\n他现在既没有做多美股，也没有做空美股。没做空是因为AI 创新的爆发力，他说自己绝不敢去摸老虎屁股做空这里的科技创新！ \n还有一点德鲁肯米勒也承认当下很多科技股近期已经严重超卖、经历了剧烈的仓位洗盘（Washed out），战术层面上机构的仓位已经降下来了。潜在意思他也认为当下做空性价比已经不高了。\n但每当看不清方向的时候他自然会选择不玩了。\n4、AI的下半场是什么？\n在股票市场方面，德鲁肯米勒正在全力寻找“AI 的实际应用用例”，而不是“AI 基础设施”！\nAI 基础设施在经历了近期的剧烈洗盘后，或许会是一笔不错的短线战术交易（Tactical trade），但他也不认为基建硬件还能像过去四年那样，能继续充当主升浪的核心引擎。\n但他认为应用层用例（Use cases）却完全有可能接棒。而且也许最有趣的“应用用例”恰恰就是前沿 AI 实验室自己！他的逻辑是：掌握全球顶级智能的实验室，没有理由继续停留在按token收费的商业模式上。\n“如果你拥有世界上最强的智能，你可以开始卖任务，而不是卖token，你可以自己创建业务，”他说。\n如果接下来股市还会有一波波澜壮阔的大主升浪，他认为核心就是——“卖任务，不卖 Token”。\n这一点是个人很认可的，之前也有聊过 AI主线已经迁移、中游的云厂、下游的应用都值得关注。当然从德鲁肯米勒自己的表态来看他肯定有人在关注Anthropic上市后能介入的机会。\n5、对我们投资交易的启发是什么？\n1）反手的能力\n看德鲁肯米勒这次讲话印象最深的一点，年初他刚刚全力做多没多久，伊朗战争爆发，他也当时慌了神砍掉了一大堆仓位；\n但很很快又把仓位买回来，并且顺势把不会暴涨的杂毛股全清理干净了，让我们结结实实吃下了二季度的这波主升浪。你看发生冲击时他也会慌，也会砍仓，然后再看机会在哪里。\n还有就是9月底他的机构还是高仓位运行、但现在已经清仓、明显在10月初以来的这一波调整中他夜趁机把仓位都砍掉，就是不知道他的回撤有多大。\n但这种“反手”的能力值得我们学习、不让自己的判断成为执念，能随时纠正，这种灵活性是一个投资高手必须要能掌握的。\n2）在棒球比赛里，有远超随机概率的“连续击球手顺期（Hitting streaks）”。\n做投资也一样：\n有时候站在击球区能清清楚楚看清飞过来的球，那就抡圆了胳膊下重注（Play big）；\n而当感觉看不清球的时候，他就只做一点小小的触击短打（Little bunts），等什么时候胜率回升、重新看清球路了，我再重新发力。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2123303719475478950","l":["x.com","x.com"],"ln":[{"u":"https://x.com/qinbafrank/status/2017205726301823008?a=ish1j1_G9yEALfJyefQ&s=46有聊过。他知道沃什对过去","d":"x.com"},{"u":"https://x.com/qinbafrank/status/2118134547703562723?a=ZHeGwBJN15QLeV2CGek&s=46","d":"x.com"}],"t":["美联储","通胀","美股","AI科技"],"lk":4,"rt":2,"rp":0,"vw":1254},{"id":"2123303708154802641","h":"bbcchinese","ts":1795070027,"zh":"APEC领导人峰会在深圳举行之际，中美俄三国元首习近平、特朗普与普京举行罕有的三边会谈。BBC News中文即将转播。","en":"APEC领导人峰会在深圳举行之际，中美俄三国元首习近平、特朗普与普京举行罕有的三边会谈。BBC News中文即将转播。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2123303708154802641","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4ABriRV","d":"bbc.in"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":797},{"id":"2123303685317169479","h":"dmjk001","ts":1795070022,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXd9cSPbAAAqN3f.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123303685317169479","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":152},{"id":"2123303646456852557","h":"ArtofSpecuycky","ts":1795070013,"zh":"大盘短期看反弹，中期继续看跌\n标普500指数已经连续下跌5个交易日，前三个交易日罕见地连续出现三个派发日，指数下跌成交量放大，每天跌幅超过1%。历史上这种连续放量抛售对应阶段性底部，只不过底部形成过程都非常反复。\n我认为周四上涨概率很大。 加上Anthropic上市带来的情绪提振、打新资金可能回流、中美俄峰会、CTA空头潜在转为多头，以及市场上太多人看空，可能引发Gamma Squeeze和Short Squeeze。目前这个Setup也很像11月6日大涨的那一天，价格行为很相似。\nSPY明天重点关注11月5号低点733附近能否守稳。如果高开并站稳733和开盘价上方，可以顺势做多，第一目标738-740。再往上看745和0.618 fib 749.5，极限ema 20 751.6。\n虽今日标普微跌，但盘面出现Risk-on特征：非必需消费品上涨1.79%，科技股领涨，前期强势的价值股回调，小盘成长股走强，能源股大跌3.27%。资金开始从防御板块重新流向成长板块，对短期反弹是积极信号。\n情绪面还是比较悲观，但比上周好点。最新AAII投资者情绪调查显示，看空比例从上周的51.4%下降至42.2%，看多比例从30.8%回升至33.3%，中性比例从17.8%升至24.4%。 虽然悲观情绪有所缓解，但看空比例还是高于看多比例，Bull-Bear Spread-8.9个百分点。之前连续两周看空比例分别达到48.4%和51.4%，说明市场短期已经经历了一轮恐慌情绪释放。这种情绪环境下，短期还是容易出现技术性反弹。\n不过本质上，我认为QQQ目前还是处于650–700的大区间震荡，策略还是低买高卖。\n2018年历史类比与市场结构\n2026年同样是中期选举年，目前美股和10年期美债收益率的走势与2018年高度吻合，都是在10月初附近见顶回落。10月份连续杀跌后，11月份作为下跌中继，反弹修整一个月。短期还是看反弹，中期接着看跌。\nOpEx、Gamma与VIX\n本周五是月度OpEx，大量负Gamma敞口到期会释放做市商的被动抛压，叠加下周感恩节假期临近，波动率会进一步回落。\n目前SPX全链条总GEX为-15亿美元，其中未来两个交易日到期的合约贡献-10亿美元，已经处于极端负Gamma区域。这种环境下市场容易放大波动，如果开始反弹，也可能引发剧烈的均值回归。\n上方最大的Gamma集中区域在7400，其次是7500。今日7325、7400和7475附近出现明显的看涨期权资金流。如果反弹继续，7400是第一个重要目标，之后看7500。\nVIX也按照预期开始下跌，今日形成Inside Day并收在25下方。25是目前最重要的多空分水岭。 如果继续跌破就看到20。\nQQQ与SPX关键点位\nQQQ原本我的判断是走一个Bear Flag，在11月5日低点附近形成Higher Low后反弹，最多到718 0.618 fib，然后继续下跌。但现在来看，像是走了个Double Bottom。\n大概率还是650–700的箱体震荡下跌中继，只有有效站回702且不再跌回来，才有可能有更大的反弹。\n短线QQQ先看670，上方683.75是200日均线和11月5日破位低点的共振阻力。反弹到这些区域后会遇阻。我希望这个中期诱多反弹最高能到700–710，能到这里就很满意了，当然如果更高更好。\nSPX方面，周线目前处于派发阶段，但机构出货比较慢，所以大概率还要维持一个7300–7600的震荡区间。周线来看，现在很有可能形成一个大级别右肩，后续如果反弹到EMA 20 7540，甚至7600，都是比较理想的做空机会。\n机构仓位与板块轮动\n结合Duality Research与美银基金经理调查数据，基金经理对科技股的配置已经降至2004–2006年以来的低位水平。\n同时，XLP今年上涨20.2%，但EPS增速只有3.1%，绝大部分涨幅来自估值倍数扩张。XLV表现也很不错，这也表现经济周期尾部机构抱团防御的特征。\n这些现象说明机构之前已经降低风险敞口。短期如果市场情绪改善，科技股存在资金回流和仓位修复的机会，但中期风险没有解除。\n交易方向与个股\n短期最好还是以TQQQ、SOXL等指数为主，围绕箱体做波段。个股如果真要选，可以重点围绕AMD、AVGO、SPCX、TSLA和网络安全板块。\nNVDA日线和周线都已经非常超卖，150附近是重要的Put Wall，随时可能出现Dead Cat Bounce的技术性反抽。\n韩国KOSPI目前也在4900–5500区间震荡，趋势线已经破位。后续任何反弹到EMA 20附近的5400–5500，还是我关注的做空机会，中期目标看周线200 EMA附近的4170。","en":"大盘短期看反弹，中期继续看跌\n标普500指数已经连续下跌5个交易日，前三个交易日罕见地连续出现三个派发日，指数下跌成交量放大，每天跌幅超过1%。历史上这种连续放量抛售对应阶段性底部，只不过底部形成过程都非常反复。\n我认为周四上涨概率很大。 加上Anthropic上市带来的情绪提振、打新资金可能回流、中美俄峰会、CTA空头潜在转为多头，以及市场上太多人看空，可能引发Gamma Squeeze和Short Squeeze。目前这个Setup也很像11月6日大涨的那一天，价格行为很相似。\nSPY明天重点关注11月5号低点733附近能否守稳。如果高开并站稳733和开盘价上方，可以顺势做多，第一目标738-740。再往上看745和0.618 fib 749.5，极限ema 20 751.6。\n虽今日标普微跌，但盘面出现Risk-on特征：非必需消费品上涨1.79%，科技股领涨，前期强势的价值股回调，小盘成长股走强，能源股大跌3.27%。资金开始从防御板块重新流向成长板块，对短期反弹是积极信号。\n情绪面还是比较悲观，但比上周好点。最新AAII投资者情绪调查显示，看空比例从上周的51.4%下降至42.2%，看多比例从30.8%回升至33.3%，中性比例从17.8%升至24.4%。 虽然悲观情绪有所缓解，但看空比例还是高于看多比例，Bull-Bear Spread-8.9个百分点。之前连续两周看空比例分别达到48.4%和51.4%，说明市场短期已经经历了一轮恐慌情绪释放。这种情绪环境下，短期还是容易出现技术性反弹。\n不过本质上，我认为QQQ目前还是处于650–700的大区间震荡，策略还是低买高卖。\n2018年历史类比与市场结构\n2026年同样是中期选举年，目前美股和10年期美债收益率的走势与2018年高度吻合，都是在10月初附近见顶回落。10月份连续杀跌后，11月份作为下跌中继，反弹修整一个月。短期还是看反弹，中期接着看跌。\nOpEx、Gamma与VIX\n本周五是月度OpEx，大量负Gamma敞口到期会释放做市商的被动抛压，叠加下周感恩节假期临近，波动率会进一步回落。\n目前SPX全链条总GEX为-15亿美元，其中未来两个交易日到期的合约贡献-10亿美元，已经处于极端负Gamma区域。这种环境下市场容易放大波动，如果开始反弹，也可能引发剧烈的均值回归。\n上方最大的Gamma集中区域在7400，其次是7500。今日7325、7400和7475附近出现明显的看涨期权资金流。如果反弹继续，7400是第一个重要目标，之后看7500。\nVIX也按照预期开始下跌，今日形成Inside Day并收在25下方。25是目前最重要的多空分水岭。 如果继续跌破就看到20。\nQQQ与SPX关键点位\nQQQ原本我的判断是走一个Bear Flag，在11月5日低点附近形成Higher Low后反弹，最多到718 0.618 fib，然后继续下跌。但现在来看，像是走了个Double Bottom。\n大概率还是650–700的箱体震荡下跌中继，只有有效站回702且不再跌回来，才有可能有更大的反弹。\n短线QQQ先看670，上方683.75是200日均线和11月5日破位低点的共振阻力。反弹到这些区域后会遇阻。我希望这个中期诱多反弹最高能到700–710，能到这里就很满意了，当然如果更高更好。\nSPX方面，周线目前处于派发阶段，但机构出货比较慢，所以大概率还要维持一个7300–7600的震荡区间。周线来看，现在很有可能形成一个大级别右肩，后续如果反弹到EMA 20 7540，甚至7600，都是比较理想的做空机会。\n机构仓位与板块轮动\n结合Duality Research与美银基金经理调查数据，基金经理对科技股的配置已经降至2004–2006年以来的低位水平。\n同时，XLP今年上涨20.2%，但EPS增速只有3.1%，绝大部分涨幅来自估值倍数扩张。XLV表现也很不错，这也表现经济周期尾部机构抱团防御的特征。\n这些现象说明机构之前已经降低风险敞口。短期如果市场情绪改善，科技股存在资金回流和仓位修复的机会，但中期风险没有解除。\n交易方向与个股\n短期最好还是以TQQQ、SOXL等指数为主，围绕箱体做波段。个股如果真要选，可以重点围绕AMD、AVGO、SPCX、TSLA和网络安全板块。\nNVDA日线和周线都已经非常超卖，150附近是重要的Put Wall，随时可能出现Dead Cat Bounce的技术性反抽。\n韩国KOSPI目前也在4900–5500区间震荡，趋势线已经破位。后续任何反弹到EMA 20附近的5400–5500，还是我关注的做空机会，中期目标看周线200 EMA附近的417 汇报，供参考：\n代工结构修正：不能简单按 “海外 / 国内” 一刀切\n【寒武纪】690 从 26 年起主力已切 S；并非 “三星断供即没戏”。\n【天数 / 燧原】并非纯台积依赖，两家均有 S/H 产能储备，冲击程度要看各家配额。\n【壁仞】代工以 H 为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600 走 S 的 n+1 国产闭环。\n【平头哥】S + 三星双源，不是 H 为主。\n【摩尔 / 昆仑芯 / 芯原】均有 S 产能并行，不能按 “海外代工 = 规避” 直接外推。关于 “三星 / 台积穿透严查”BIS 新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升 + 边际收紧。","en":"针对市场流传的某版 “算力芯片流片来源梳理”，结合我们产业链跟踪，做几点差异化汇报，供参考：\n代工结构修正：不能简单按 “海外 / 国内” 一刀切\n【寒武纪】690 从 26 年起主力已切 S；并非 “三星断供即没戏”。\n【天数 / 燧原】并非纯台积依赖，两家均有 S/H 产能储备，冲击程度要看各家配额。\n【壁仞】代工以 H 为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600 走 S 的 n+1 国产闭环。\n【平头哥】S + 三星双源，不是 H 为主。\n【摩尔 / 昆仑芯 / 芯原】均有 S 产能并行，不能按 “海外代工 = 规避” 直接外推。关于 “三星 / 台积穿透严查”BIS 新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升 + 边际收紧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123277185482113140","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1392},{"id":"2123276957089669612","h":"xingpt","ts":1795063649,"zh":"效率与回本，决定 AI 投资能否持续：\n按照摩根大通的模型，每建设 1GW 算力需要约 400 亿美元投资，每年需要约 220 亿美元的终端 AI 支出来支撑。要达到 2029 年的收入门槛，终端 AI 市场需要维持约 80% 的年复合增长。\n接下来决定行业回报的关键，是单位算力成本下降的速度，以及新增资本开支转化为收入和自由现金流的效率。\nAI 投资最终将从比拼谁投入更多资本，转向比拼谁能用更低的成本创造更多收入。","en":"效率与回本，决定 AI 投资能否持续：\n按照摩根大通的模型，每建设 1GW 算力需要约 400 亿美元投资，每年需要约 220 亿美元的终端 AI 支出来支撑。要达到 2029 年的收入门槛，终端 AI 市场需要维持约 80% 的年复合增长。\n接下来决定行业回报的关键，是单位算力成本下降的速度，以及新增资本开支转化为收入和自由现金流的效率。\nAI 投资最终将从比拼谁投入更多资本，转向比拼谁能用更低的成本创造更多收入。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdiVnhawAAdzum.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123276957089669612","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":225},{"id":"2123276952413020352","h":"xingpt","ts":1795063648,"zh":"2. AI资本开支先投入，再获利：\n2026 年全球 AI 资本开支已经接近万亿美元规模，几大hyperscaler：Amazon、Google、Microsoft、Meta 仍在加速建设，马斯克也计划进一步扩张算力，如果 2027 年实际新增 7GW，SpaceX按照每 GW 300 亿美元计算，仅这一项就需要约 2,100 亿美元。\n未来三年，AI 基础设下载施投资将持续领先于商业收入兑现。2029 年将是关键验证窗口：数万亿美元的算力投入，必须逐渐转化为真实的云收入、推理需求和企业 AI 付费。","en":"2. AI资本开支先投入，再获利：\n2026 年全球 AI 资本开支已经接近万亿美元规模，几大hyperscaler：Amazon、Google、Microsoft、Meta 仍在加速建设，马斯克也计划进一步扩张算力，如果 2027 年实际新增 7GW，SpaceX按照每 GW 300 亿美元计算，仅这一项就需要约 2,100 亿美元。\n未来三年，AI 基础设下载施投资将持续领先于商业收入兑现。2029 年将是关键验证窗口：数万亿美元的算力投入，必须逐渐转化为真实的云收入、推理需求和企业 AI 付费。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdk8i6bwAEx45t.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123276952413020352","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":285},{"id":"2123276948038381943","h":"xingpt","ts":1795063647,"zh":"摩根大通：AI投入到底多少，能赚钱吗？什么时候开始盈利？\n1. 当前 AI 的账，怎么算？\n摩根大通测算：全球到 2029 年建成约 129GW 的 AI 算力，需要累计投入约 5.16 万亿美元，每年创造约 2.84 万亿美元的终端收入才能支撑这套基础设施。\n企业、消费者和政府的潜在 AI 支出合计约 3.65 万亿美元，其中企业贡献近 70%。这意味着 AI 商业化的核心战场在企业端，只有 AI Agent 真正进入工作流程、创造生产率价值，数万亿美元的市场才能成立。","en":"摩根大通：AI投入到底多少，能赚钱吗？什么时候开始盈利？\n1. 当前 AI 的账，怎么算？\n摩根大通测算：全球到 2029 年建成约 129GW 的 AI 算力，需要累计投入约 5.16 万亿美元，每年创造约 2.84 万亿美元的终端收入才能支撑这套基础设施。\n企业、消费者和政府的潜在 AI 支出合计约 3.65 万亿美元，其中企业贡献近 70%。这意味着 AI 商业化的核心战场在企业端，只有 AI Agent 真正进入工作流程、创造生产率价值，数万亿美元的市场才能成立。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdh7_haoAA3-c8.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123276948038381943","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":2,"vw":821},{"id":"2123276726004498849","h":"dmjk001","ts":1795063594,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXdk6WGagAAuTyb.png?name=orig"],"u":"https://x.com/dmjk001/status/2123276726004498849","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":0,"vw":1995},{"id":"2123275678544171352","h":"fxtrader","ts":1795063344,"zh":"进入会议室时，特朗普还特意假装惊讶，停步并指了一下普京，笑问“他是谁？”","en":"进入会议室时，特朗普还特意假装惊讶，停步并指了一下普京，笑问“他是谁？”","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123274044069883905/vid/avc1/1280x720/q5ZDxzQ5NtZsyGa3.mp4?tag=29"],"u":"https://x.com/fxtrader/status/2123275678544171352","l":[],"ln":[],"t":[],"lk":17,"rt":0,"rp":1,"vw":6771},{"id":"2123275044789035115","h":"fxtrader","ts":1795063193,"zh":"特朗普与普京握手致意：“我们彼此认识很久了，我认为会有很多好事发生。”","en":"特朗普与普京握手致意：“我们彼此认识很久了，我认为会有很多好事发生。”","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/212 ","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123272112509276203","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":3,"vw":798},{"id":"2123271600837628348","h":"qinbafrank","ts":1795062372,"zh":"腾讯认为资本开支高峰是什么时候以及28年之后硬件价格会如何？昨天腾讯三季度财报，大家关注最多的是workbuddy日活超千万用户，每日累计消耗Token超过100万亿；再一个就是负自由现金流人民币691亿元。其实个人角度更值得关注的腾讯是如何看待资本开支以及硬件价格走势的。\n在腾讯第三季度业绩电话会上，Bernstein的分析师Robin G提出的关于资本开支/预付款进展及美国限制影响的问题。看看这个问题的详细问答\nBernstein的Robin G：\n我想提两个问题。首先，我们已经连续两个季度的资本开支和预付款支出都非常高。我想了解一下，腾讯在这一轮激进的算力采购支出中目前进展如何？按照您的判断，我们距离达到理想的算力水平还有多远？另外，美国的限制措施将如何影响我们现有的以及未来的算力合作？这是否会对我们此前在云业务及其他领域看到的增长势头产生不利影响？其次，Work Buddy的表现非常出色。想请管理层评估一下该业务未来的机会空间——从用户增长来看，其可触达的市场和收入利润潜力主要集中在重度用户群体吗？考虑到半导体领域的限制，这一增长前景是否存在风险？\n腾讯首席战略官詹姆斯·米歇尔 / James Mitchell回答：\n那么，Robin，我先来回答关于预付款项和资本开支，以及先进制程半导体限制对云业务收入增长影响的几个问题。关于预付款项，大家知道，第二季度和第三季度的支出水平异常偏高，而我们现在已签署了此前计划签订的长期合同，因此预付款项的流出将逐步减少。事实上，未来某些季度可能会出现因取消此前已预付的合同而导致预付款项回流的情况。不过，随着近期资本开支相关条款的变化，我们正在逐步退出这部分预付款项的影响。至于当前的现金资本开支水平，我们认为应以现金口径来看待，这一数字约为650亿元人民币，而非810亿元人民币的权责发生制资本开支。因为如果同时考虑预付款项和资本开支，就应该统一以现金资本开支口径进行核算；否则，将预付款项与权责发生制资本开支叠加计算，就会造成重复计数。\n总之，从现金资本开支的水平来看，我们认为目前已处于阶段性高位，预计在2026年和2027年剩余时间内，该指标可能在这一峰值附近呈现季度间的波动。此后，我们预计其将进一步回落。\n至于这些限制对我们的云业务有何影响，我们实际上并未看到任何冲击。因为目前我们的云业务主要以推理为主，且重点运行诸如HY 4 Flash等高能效推理模型以及其他Flash系列模型。而且，在当前阶段，这些推理任务已能在数量出奇有限的国产芯片上高效执行。\n因此，我认为过去12个月里，我们在推理效率方面实现了显著提升，从而使得仅靠国产芯片就能处理远超一年前预期的更大规模的token流量。而云业务收入的核心驱动力正是推理。所以，我们认为此次变化不会对我们的云业务收入造成实质性不利影响。\n腾讯总裁马丁·刘 / 刘炽平补充回答：\n我想就詹姆斯刚才谈到的内容补充几点。首先，在资本开支方面，我认为目前我们投入的这些资本支出，实际上是为了夯实基础设施，从而推动我们的AI原生业务尽快起步。现阶段有点像在建一座工厂，以便开展模型训练和Token生成工作。其本质在于，一旦建成这套设施，后续就可以持续用于训练新一代模型，并不断产出新的Token。\n因此，我们在26年和27年进行了相关投入后，进入28年，趋势就会逐步改善，因为我们可以持续利用26年和27年所建设的基础设施。\n其次，我们在26年和27年实际看到的定价水平确实偏高。进入28年，即便采购需求不变，价格也应会显著回落。\n第三，也是我认为最重要的一点：经过对模型训练与推理环节的持续优化，我们发现计算效率正以极快的速度逐年提升。这意味着，随着技术进步，在保持相同算力投入的前提下，我们将能够实现更高的训练效率，以及更大的Token产出规模。综合以上因素，我们认为28年及以后的业绩表现将更加出色。\n简单说：\n1）腾讯自己认为当下就是资本开支的高点，26年四季度和27年资本开支就在当下的规模水平左右，之后会进步下滑。\n2）28年硬件采购的价格会回落即使需求不变。\n3）28年随着26、27年建设的投入落地，业绩表现会非常好。也是之前聊到的数据中心建设节奏、算力陆续落地、大云厂商的业绩会很好。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"腾讯认为资本开支高峰是什么时候以及28年之后硬件价格会如何？昨天腾讯三季度财报，大家关注最多的是workbuddy日活超千万用户，每日累计消耗Token超过100万亿；再一个就是负自由现金流人民币691亿元。其实个人角度更值得关注的腾讯是如何看待资本开支以及硬件价格走势的。\n在腾讯第三季度业绩电话会上，Bernstein的分析师Robin G提出的关于资本开支/预付款进展及美国限制影响的问题。看看这个问题的详细问答\nBernstein的Robin G：\n我想提两个问题。首先，我们已经连续两个季度的资本开支和预付款支出都非常高。我想了解一下，腾讯在这一轮激进的算力采购支出中目前进展如何？按照您的判断，我们距离达到理想的算力水平还有多远？另外，美国的限制措施将如何影响我们现有的以及未来的算力合作？这是否会对我们此前在云业务及其他领域看到的增长势头产生不利影响？其次，Work Buddy的表现非常出色。想请管理层评估一下该业务未来的机会空间——从用户增长来看，其可触达的市场和收入利润潜力主要集中在重度用户群体吗？考虑到半导体领域的限制，这一增长前景是否存在风险？\n腾讯首席战略官詹姆斯·米歇尔 / James Mitchell回答：\n那么，Robin，我先来回答关于预付款项和资本开支，以及先进制程半导体限制对云业务收入增长影响的几个问题。关于预付款项，大家知道，第二季度和第三季度的支出水平异常偏高，而我们现在已签署了此前计划签订的长期合同，因此预付款项的流出将逐步减少。事实上，未来某些季度可能会出现因取消此前已预付的合同而导致预付款项回流的情况。不过，随着近期资本开支相关条款的变化，我们正在逐步退出这部分预付款项的影响。至于当前的现金资本开支水平，我们认为应以现金口径来看待，这一数字约为650亿元人民币，而非810亿元人民币的权责发生制资本开支。因为如果同时考虑预付款项和资本开支，就应该统一以现金资本开支口径进行核算；否则，将预付款项与权责发生制资本开支叠加计算，就会造成重复计数。\n总之，从现金资本开支的水平来看，我们认为目前已处于阶段性高位，预计在2026年和2027年剩余时间内，该指标可能在这一峰值附近呈现季度间的波动。此后，我们预计其将进一步回落。\n至于这些限制对我们的云业务有何影响，我们实际上并未看到任何冲击。因为目前我们的云业务主要以推理为主，且重点运行诸如HY 4 Flash等高能效推理模型以及其他Flash系列模型。而且，在当前阶段，这些推理任务已能在数量出奇有限的国产芯片上高效执行。\n因此，我认为过去12个月里，我们在推理效率方面实现了显著提升，从而使得仅靠国产芯片就能处理远超一年前预期的更大规模的token流量。而云业务收入的核心驱动力正是推理。所以，我们认为此次变化不会对我们的云业务收入造成实质性不利影响。\n腾讯总裁马丁·刘 / 刘炽平补充回答：\n我想就詹姆斯刚才谈到的内容补充几点。首先，在资本开支方面，我认为目前我们投入的这些资本支出，实际上是为了夯实基础设施，从而推动我们的AI原生业务尽快起步。现阶段有点像在建一座工厂，以便开展模型训练和Token生成工作。其本质在于，一旦建成这套设施，后续就可以持续用于训练新一代模型，并不断产出新的Token。\n因此，我们在26年和27年进行了相关投入后，进入28年，趋势就会逐步改善，因为我们可以持续利用26年和27年所建设的基础设施。\n其次，我们在26年和27年实际看到的定价水平确实偏高。进入28年，即便采购需求不变，价格也应会显著回落。\n第三，也是我认为最重要的一点：经过对模型训练与推理环节的持续优化，我们发现计算效率正以极快的速度逐年提升。这意味着，随着技术进步，在保持相同算力投入的前提下，我们将能够实现更高的训练效率，以及更大的Token产出规模。综合以上因素，我们认为28年及以后的业绩表现将更加出色。\n简单说：\n1）腾讯自己认为当下就是资本开支的高点，26年四季度和27年资本开支就在当下的规模水平左右，之后会进步下滑。\n2）28年硬件采购的价格会回落即使需求不变。\n3）28年随着26、27年建设的投入落地，业绩表现会非常好。也是之前聊到的数据中心建设节奏、算力陆续落地、大云厂商的业绩会很好。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2123271600837628348","l":[],"ln":[],"t":["美股","汇率","AI科技","财报"],"lk":0,"rt":1,"rp":1, 真正在Backpack上线交易了。","en":"一周集齐DCM、DCO、FCM，对Backpack而言，意味着具备了在美国合规开展杠杆永续合约业务的所有基础设施条件：可以自主上市合约、接收并保管客户资金、完成清算，并在CFTC和NFA的监管框架下运营，至此在交易所、清算所和客户中介三层全部落地，Backapck形成完整的垂直监管合规架构。\nDCM+DCO+FCM的组合，是目前美国合规框架下衍生品也最完整也是最高级别的基础设施配置。Backpack用一周时间把这三张牌收齐，这样其衍生品业务不仅牌照数量上跟Coinbase一样，甚至牌照的覆盖范围还要大。\n两者现在都具备端到端的美国合规衍生品能力。区别在于清算范围：\nCoinbase Clearing目前主要覆盖全额抵押产品，杠杆保证金业务仍部分依赖外部清算伙伴；\nBackpack的DCO则明确包含保证金期货，对杠杆永续合约的自主清算更为直接。\n现在就期待后续美股个股永续合约真正在Backpack上线交易了。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdMNiCbAAA2JQa.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123250635403653594","l":[],"ln":[],"t":["美股"],"lk":19,"rt":0,"rp":11,"vw":7294},{"id":"2123250327814357008","h":"xingpt","ts":1795057300,"zh":"【一年后，我不再用 WHOOP 了】\n我准备把 Whoop 换成佳明的 CIRQA 手环。这个是 2026 年 7 月新出的佳明手环，对标的就是 Whoop。\n佳明这个是一次性大概 200 美金买断，而 Whoop 是 200 美金订阅一年，每年都要重复付费，所以佳明长期来看更划算。\n另外我发现 Whoop 测睡眠特别不准，特别是一些短时间的睡眠其实不是很准，所以我想用佳明试试。而且我最看重的身体年龄这个指标两个也都有，所以我可能会换佳明试试。","en":"【一年后，我不再用 WHOOP 了】\n我准备把 Whoop 换成佳明的 CIRQA 手环。这个是 2026 年 7 月新出的佳明手环，对标的就是 Whoop。\n佳明这个是一次性大概 200 美金买断，而 Whoop 是 200 美金订阅一年，每年都要重复付费，所以佳明长期来看更划算。\n另外我发现 Whoop 测睡眠特别不准，特别是一些短时间的睡眠其实不是很准，所以我想用佳明试试。而且我最看重的身体年龄这个指标两个也都有，所以我可能会换佳明试试。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdMkMYbkAAkZJF.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123250327814357008","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":305},{"id":"2123250235430605117","h":"cnfinancewatch","ts":1795057278,"zh":"大金融、大消费已经涨了一段；目前大盘靠大金融和大消费还比较难。\n目前大金融等在休息，但科技还是不涨。\n比较悲观的看法是大金融消息，大盘就回落。\n科技和金融都跌，就是没人气。\n很像924行情前那段。\n多看券商。银行和保险没力气了么。","en":"大金融、大消费已经涨了一段；目前大盘靠大金融和大消费还比较难。\n目前大金融等在休息，但科技还是不涨。\n比较悲观的看法是大金融消息，大盘就回落。\n科技和金融都跌，就是没人气。\n很像924行情前那段。\n多看券商。银行和保险没力气了么。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123250235430605117","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":347},{"id":"2123250070925594861","h":"ReutersChina","ts":1795057239,"zh":"美国总统唐纳德·特朗普表示，他周四与中国国家主席习近平和俄罗斯总统弗拉基米尔·普京的会晤在举行之前就已经是一次“胜利”，因为中国给予了他热烈的欢迎。","en":"US President Donald Trump said his meeting on Thursday with Chinese and Russian counterparts Xi Jinping and Vladimir Putin was already a \"win\" before it took place, as China gave him a warm welcome.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123250070925594861","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/trumps-historic-meeting-with-xi-putin-headlines-asia-trip-2026-11-18/?taid=6afe665779338c000111de8b&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":285},{"id":"2123249918475411534","h":"nytchinese","ts":1795057203,"zh":"特朗普抵达深圳：展示友好关系，无视间谍丑闻。习近平亲自到机场迎接，两人在红毯上拥抱。特朗普已经表示，他无意提起涉及黄仁勋的这起重大间谍丑闻。此次行程重头戏将是他与习近平、普京的三方会晤。","en":"特朗普抵达深圳：展示友好关系，无视间谍丑闻。习近平亲自到机场迎接，两人在红毯上拥抱。特朗普已经表示，他无意提起涉及黄仁勋的这起重大间谍丑闻。此次行程重头戏将是他与习近平、普京的三方会晤。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2123249918475411534","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/world/20261119/trump-xi-shenzhen-spy-scandal/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":786},{"id":"2123249198896382082","h":"bboczeng","ts":1795057031,"zh":"华尔街日报：英伟达5000亿美元芯片融资计划至今零资金到位，预计2027年前不会有交易执行\n今年8月，英伟达（$NVDA）宣布与阿波罗，黑石（Blackstone）、贝莱德（BlackRock）、布鲁克菲尔德（Brookfield）、高盛（Goldman Sachs）和KKR合作，计划动员5000亿美元资金，帮助OpenAI、Anthropic以及规模较小的AI云计算公司等客户为购买芯片融资。\n但该协议只是一份寥寥数页的谅解备忘录。各家机构均无义务募集任何资金，目前也没有任何资金到位。","en":"华尔街日报：英伟达5000亿美元芯片融资计划至今零资金到位，预计2027年前不会有交易执行\n今年8月，英伟达（$NVDA）宣布与阿波罗，黑石（Blackstone）、贝莱德（BlackRock）、布鲁克菲尔德（Brookfield）、高盛（Goldman Sachs）和KKR合作，计划动员5000亿美元资金，帮助OpenAI、Anthropic以及规模较小的AI云计算公司等客户为购买芯片融资。\n但该协议只是一份寥寥数页的谅解备忘录。各家机构均无义务募集任何资金，目前也没有任何资金到位。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123249198896382082","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":497},{"id":"2123248964925628548","h":"BrantChinesefn","ts":1795056975,"zh":"如果你是黄仁勋，回到英伟达会先干什么？我想即便裁掉董事会不是第一件要做的事情，也是priority。那董事会能不知道吗，所以现在一定会想尽办法不让老黄回来。对立非常清晰。\n以黄仁勋的地位，不可能不知道董事会现在的态度，但却在业绩前的重要节点把自己愿意回归的想法公布出来，这里面一定有故事。把矛盾都引向董事会。\n一场公司内部和政府在背后谋划的阴谋也好，阳谋也罢，正在上演。这些东西看不清，分析不明，这 $nvda怎么做。止跌震荡是一段时间内最好的结局了，无非是震荡的幅度可能稍大些罢了。","en":"如果你是黄仁勋，回到英伟达会先干什么？我想即便裁掉董事会不是第一件要做的事情，也是priority。那董事会能不知道吗，所以现在一定会想尽办法不让老黄回来。对立非常清晰。\n以黄仁勋的地位，不可能不知道董事会现在的态度，但却在业绩前的重要节点把自己愿意回归的想法公布出来，这里面一定有故事。把矛盾都引向董事会。\n一场公司内部和政府在背后谋划的阴谋也好，阳谋也罢，正在上演。这些东西看不清，分析不明，这 $nvda怎么做。止跌震荡是一段时间内最好的结局了，无非是震荡的幅度可能稍大些罢了。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/BrantChinesefn/status/2123248964925628548","l":[],"ln":[],"t":["AI科技"],"lk":12,"rt":0,"rp":2,"vw":897},{"id":"2123248586645512399","h":"hanking66","ts":1795056885,"zh":"美光管理层在11月18日TomorrowX Summit表示，过去一个月客户需求没有转弱，供给仍紧、定价环境仍有利，2027年约75%的产出已售出，并已与客户讨论2028年承诺。\n终于等到美光管理层最新的表态，目前没有看出需求转弱的迹象😅\n关于半导体需求转弱的问题，我依旧没有看到任何实质性的迹象，无论是企业财报，电话会议，高管言论，供应链上下游，产品价格。有的全是华尔街小作文，分析师预测，散户臆想…而这些全都是因为股价跌了…\n我不是无脑看多，也不是一条路走到黑，而是我的确没看到可以说服我的证据，我不会因为周围人说半导体行情结束了就认为结束了，也不会因为股价跌了就觉得自己看错了😅，如果我看到实质性的证据或者数据，我会改变看法的，可惜目前没看到😅\n有人说等你看到了，市场早就跌完了，也许是的，市场行情往往走在事实之前，但前提是市场看对了方向，目前看市场只是在担心勿虚有的事情😅\nBuy the dip，长期持有，Discord在个人资料。","en":"美光管理层在11月18日TomorrowX Summit表示，过去一个月客户需求没有转弱，供给仍紧、定价环境仍有利，2027年约75%的产出已售出，并已与客户讨论2028年承诺。\n终于等到美光管理层最新的表态，目前没有看出需求转弱的迹象😅\n关于半导体需求转弱的问题，我依旧没有看到任何实质性的迹象，无论是企业财报，电话会议，高管言论，供应链上下游，产品价格。有的全是华尔街小作文，分析师预测，散户臆想…而这些全都是因为股价跌了…\n我不是无脑看多，也不是一条路走到黑，而是我的确没看到可以说服我的证据，我不会因为周围人说半导体行情结束了就认为结束了，也不会因为股价跌了就觉得自己看错了😅，如果我看到实质性的证据或者数据，我会改变看法的，可惜目前没看到😅\n有人说等你看到了，市场早就跌完了，也许是的，市场行情往往走在事实之前，但前提是市场看对了方向，目前看市场只是在担心勿虚有的事情😅\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdLVLubcAAd-74.jpg?name=orig"],"u":"https://x.com/hanking66/status/2123248586645512399","l":[],"ln":[],"t":["AI科技","财报"],"lk":6,"rt":1,"rp":2,"vw":1026},{"id":"2123248579334787251","h":"nytchinese","ts":1795056884,"zh":"习近平与高市早苗简短会面，中日关系无解冻迹象。这是自一年前中日爆发激烈外交争端以来，两国领导人首次接触。两人简短握手，气氛紧张。专家表示，这次互动不太可能标志着中日关系出现任何实质性解冻。","en":"习近平与高市早苗简短会面，中日关系无解冻迹象。这是自一年前中日爆发激烈外交争端以来，两国领导人首次接触。两人简短握手，气氛紧张。专家表示，这次互动不太可能标志着中日关系出现任何实质性解冻。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2123248579334787251","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/world/20261119/xi-jinping-china-sanae-takaichi-japan/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":1743},{"id":"2123247775660064859","h":"bboczeng","ts":1795056692,"zh":"是的，这代表他们已经看到或者掌握了对黄仁勋非常不利的证据\n所以不论员工如何联署，都无法答应他们的请求\n也不便出面解释\n相信调查，相信听证会，相信Board\n是我们唯一的选择","en":"是的，这代表他们已经看到或者掌握了对黄仁勋非常不利的证据\n所以不论员工如何联署，都无法答应他们的请求\n也不便出面解释\n相信调查，相信听证会，相信Board\n是我们唯一的选择","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123247775660064859","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":765},{"id":"2123244076678185279","h":"CrushTheShorts","ts":1795055810,"zh":"谢谢，稳的一逼，稳的像一条索马里的路边野狗🤢🤢🤢\n-------------------------------------------------\n经济日报：稳资本市场意义重大\n11月19日｜经济日报刊文指出，稳，是当前资本市场的主基调。“增强股市内在稳定性”“进一步深化市场稳定长效机制研究”“全力维护市场平稳运行”……近段时间，各方密集发声，持续释放稳市信号。作为牵一发而动全身的枢纽，资本市场的稳定运行历来意义重大。放到当下，这种重要性更是前所未有地凸显。\n从市场体量看，资本市场的地位“与日俱重”。当前A股市场拥有5500多家上市公司，总市值突破100万亿元，新经济领域公司数量、营收、市值占比均超过一半。现阶段的资本市场，已经不仅仅是一个投资交易场所，更是科技创新的“发动机”、产业升级的“推进器”。\n立足经济发展全局，资本市场的作用不可替代。中国式现代化全面提速，“十五五”时期要推进发展新质生产力、构建新发展格局、建设现代化经济体系等任务繁重，目标高远，每一场硬仗都离不开创新资本的加速集聚、金融资源的优化配置，都离不开一个稳定资本市场的有力支撑。\n资本市场稳不稳，是信心稳不稳、预期好不好、经济循环畅不畅的重要变量，事关国家创新体系整体效能，事关高质量发展全局。经济发展动能转换，需要资本市场发挥稳定的枢纽功能。新一轮科技革命奔涌向前，需要资本市场展现稳定的陪跑耐力。在激烈国际竞争中赢得战略主动，需要资本市场积蓄稳定的托举力量。","en":"谢谢，稳的一逼，稳的像一条索马里的路边野狗🤢🤢🤢\n-------------------------------------------------\n经济日报：稳资本市场意义重大\n11月19日｜经济日报刊文指出，稳，是当前资本市场的主基调。“增强股市内在稳定性”“进一步深化市场稳定长效机制研究”“全力维护市场平稳运行”……近段时间，各方密集发声，持续释放稳市信号。作为牵一发而动全身的枢纽，资本市场的稳定运行历来意义重大。放到当下，这种重要性更是前所未有地凸显。\n从市场体量看，资本市场的地位“与日俱重”。当前A股市场拥有5500多家上市公司，总市值突破100万亿元，新经济领域公司数量、营收、市值占比均超过一半。现阶段的资本市场，已经不仅仅是一个投资交易场所，更是科技创新的“发动机”、产业升级的“推进器”。\n立足经济发展全局，资本市场的作用不可替代。中国式现代化全面提速，“十五五”时期要推进发展新质生产力、构建新发展格局、建设现代化经济体系等任务繁重，目标高远，每一场硬仗都离不开创新资本的加速集聚、金融资源的优化配置，都离不开一个稳定资本市场的有力支撑。\n资本市场稳不稳，是信心稳不稳、预期好不好、经济循环畅不畅的重要变量，事关国家创新体系整体效能，事关高质量发展全局。经济发展动能转换，需要资本市场发挥稳定的枢纽功能。新一轮科技革命奔涌向前，需要资本市场展现稳定的陪跑耐力。在激烈国际竞争中赢得战略主动，需要资本市场积蓄稳定的托举力量。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2123244076678185279","l":[],"ln":[],"t":["财报"],"lk":2,"rt":0,"rp":0,"vw":1556},{"id":"2123242823134884315","h":"bbcchinese","ts":1795055511,"zh":"日本首相高市早苗周三（11月18日）抵达中国深圳，出席亚太经济合作组织（APEC）峰会。这是她上任以来首次访问中国。\n她在欢迎晚宴上与中国领导人习近平握手。这也是自她去年发表“台湾有事”论引发中日关系恶化以来，双方首次接触。\n然而，她扺达机场时，欢迎仪式相对简单，与到访的其他国家领导人的接待形成对比。","en":"日本首相高市早苗周三（11月18日）抵达中国深圳，出席亚太经济合作组织（APEC）峰会。这是她上任以来首次访问中国。\n她在欢迎晚宴上与中国领导人习近平握手。这也是自她去年发表“台湾有事”论引发中日关系恶化以来，双方首次接触。\n然而，她扺达机场时，欢迎仪式相对简单，与到访的其他国家领导人的接待形成对比。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123242692587188224/vid/avc1/1080x1920/Ig8zMjQ3Xyy6DJGp.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2123242823134884315","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1262},{"id":"2123242487472963670","h":"ReutersChina","ts":1795055431,"zh":"美国总统唐纳德·特朗普表示，他曾与中国国家主席习近平讨论过人工智能，而提到前英伟达首席执行官黄仁勋只是“简短”地提及。","en":"US President Donald Trump said he spoke to Chinese President Xi Jinping about artificial intelligence, and that reference to former Nvidia CEO Jensen Huang only came up \"briefly.\"","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123242487472963670","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/technology/trump-says-he-referred-ex-nvidia-boss-huangs-situation-briefly-talk-with-xi-2026-11-19/?taid=6afe5f4779338c000111de49&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":330},{"id":"2123240498303521197","h":"xingpt","ts":1795054957,"zh":"今日寄语","en":"今日寄语","zh_src":"native","lang":"ja","m":["https://pbs.twimg.com/media/HXdD-YFbsAAPlBt.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123240498303521197","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":1,"vw":576},{"id":"2123240363280552135","h":"fxtrader","ts":1795054925,"zh":"11月19日，日本首相高市早苗与习近平握手时，还特意停下来与习近平进行了简短交谈。（香港01）","en":"11月19日，日本首相高市早苗与习近平握手时，还特意停下来与习近平进行了简短交谈。（香港01）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123240363280552135","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":1,"vw":4361},{"id":"2123239944932200451","h":"cnfinancewatch","ts":1795054825,"zh":"之前大盘的曾经震荡点位是3800-4200，\n破位3800点需要向下400点寻求中枢\n目标位3440点附近\n谢谢。很悲观。但是不得不做出这种判断\n同样QQQ也许也不乐观（尽管目前期货已经上涨1.4%）","en":"之前大盘的曾经震荡点位是3800-4200，\n破位3800点需要向下400点寻求中枢\n目标位3440点附近\n谢谢。很悲观。但是不得不做出这种判断\n同样QQQ也许也不乐观（尽管目前期货已经上涨1.4%）","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdDeRNa4AA2PpV.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2123239944932200451","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":2,"vw":1273},{"id":"2123239705471013103","h":"fxtrader","ts":1795054768,"zh":"APEC领导人非正式会议合照与欢迎晚宴大合照","en":"APEC领导人非正式会议合照与欢迎晚宴大合照","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXdCpXGb0AAjete.jpg?name=orig","https://pbs.twimg.com/media/HXdCq_Xb0AASv2P.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123239705471013103","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":1,"vw":3975},{"id":"2123237915258151102","h":"cnfinancewatch","ts":1795054341,"zh":"#期货 两小时更新\n这是本档变化最大的一组数。纳指期货约08:58报27573点附近，较第一版的27238点明显上修，较结算涨约1.42%，盘中高点约27585、低点27169。标普500期货约7393点，涨约0.72%；道指期货约50489点，涨约0.43%。黄金约3753美元，比第一版的3731美元有所回升；WTI原油期货约81.81美元，和第一版的81.93美元相差不大。离岸人民币约6.6666，和第一版的6.668几乎走平。A股股指期货没有夜盘，仍是11月18日收盘：沪深300期货IF收3928.4点，上证50期货IH收2731.2点，中证500期货IC收6194.0点，中证1000期货IM收5987.4点。富时A50连续报价本档未取到可靠数据，标注缺失。港股9:30才开，以开盘现货为准。韩国股市今日推迟开市一小时，截稿前没有盘中数据。\n#三个方向\n一是银行与红利，不变。融资盘继续撤退的阶段，更要靠它守，但龙头多在20日高附近，竞价不追跳空。\n二是家电与必选消费，不变。华泰今早对必选消费的温和复苏判断，和中信建投内需磨底、出海定胜负的家电策略，都指向看 #美的集团 $000333\n、 #格力电器 $000651 这类龙头，不看已经连板或刚跌停的杂毛。\n三是半导体制造的事件余波，方向不变，弹性预期上调。日经高开和纳指期货转强，说明亚洲已经愿意给隔夜的弱势做修复，A股制造、设备和PCB大概率比第一版预想的更高开，但5日、20日仍是下跌共振，英伟达昨夜又是高开低走，只观察不追高；CPO和光模块位置仍差，不并入这一方向。腾讯提到的国产算力，也只加强观察，不改仓位纪律。\n#六只个股\n名单与第一版相同，位置数据仍用昨日收盘核验，本档没有新的完整日线需要改写。\n #工商银行 $601398 昨日平收9.06元，5日涨6.21%，20日涨7.22%，距20日高0.44%。触发是银行ETF不破5日线；失效是放量跌破5日或板块5日涨幅快速回吐。高位持盈，不追开盘。\n #中国平安 $601318 昨日跌0.46%，20日涨6.25%，距20日高0.88%，和保险ETF一样走平。触发是保险随银行继续抗跌；失效是独自走弱并跌破近日平台。\n #美的集团 $000333 昨日涨0.34%，5日涨6.81%，20日涨11.67%，距20日高0.77%。触发是家电ETF守住5日上行；失效是长阴跌破5日线。不追涨停杂毛。\n #格力电器 $000651 昨日涨0.22%，5日涨5.41%，20日涨9.75%，距20日高1.01%。触发与美的相同；失效是明显弱于美的并跌破5日。\n #长江电力 $600900 昨日涨0.26%，5日涨4.07%，20日涨3.75%，距20日高0.29%，红利属性清楚。触发是高息资产继续被承接；失效是跌破5日并放量。\n #北方华创 $002371 昨日涨0.93%，5日涨4.77%，20日涨2.33%，距20日高2.61%，位置比中芯和华虹更有余地。触发是半导体制造和设备在高开或平开后能够站稳；失效是放量回吐近日涨幅。开盘若因期货转强而跳空，先看成份，不预先加仓。\n#国电南瑞 $600406 第一版未取到完整日线，本档仍不写入样本。\n#小盘阿尔法\n本档仍不选。热榜里能看到的小票，多是连板后已经伸展， #华东重机 $002685 仍是四连板， #九阳股份 $002242\n20日大涨后昨日跌停、热度刚刚回落，缺少完整市值与财报互证的底部右侧标的，不符合入选条件。\n#操作提示\n今天比七点档更需要把高开和能追分开。期货和日经把隔夜美股的分化修得更漂亮了，开盘很容易把半导体制造、PCB和算力租赁再抬一截，但位置、杠杆和昨夜英伟达的收盘都还在。银行、家电、电力仍是相对抵抗方向，也多在20日高附近，只做持盈和回调再看，不在竞价里抬轿。\n#华虹公司 $688347 、 #沪电股份 $002463 开盘不追； #北方华创 $002371 只作为方向样本。 #中际旭创\n$300308 、 #新易盛 $300502 、 #胜宏科技 $300476\n仍在20日深跌区间，先观察不抄。短剧影视和刚跌停的小家电一律不抄。盯9点25分竞价，看银行ETF和红利ETF能否顶住，以及高开是否主要出现在科创和算力。美联储纪要偏鹰、今晚Anthropic上市和沃尔玛财报，都还是外部扰动。若高开低走，要能及时减。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"#期货 两小时更新\n这是本档变化最大的一组数。纳指期货约08:58报27573点附近，较第一版的27238点明显上修，较结算涨约1.42%，盘中高点约27585、低点27169。标普500期货约7393点，涨约0.72%；道指期货约50489点，涨约0.43%。黄金约3753美元，比第一版的3731美元有所回升；WTI原油期货约81.81美元，和第一版的81.93美元相差不大。离岸人民币约6.6666，和第一版的6.668几乎走平。A股股指期货没有夜盘，仍是11月18日收盘：沪深300期货IF收3928.4点，上证50期货IH收2731.2点，中证500期货IC收6194.0点，中证1000期货IM收5987.4点。富时A50连续报价本档未取到可靠数据，标注缺失。港股9:30才开，以开盘现货为准。韩国股市今日推迟开市一小时，截稿前没有盘中数据。\n#三个方向\n一是银行与红利，不变。融资盘继续撤退的阶段，更要靠它守，但龙头多在20日高附近，竞价不追跳空。\n二是家电与必选消费，不变。华泰今早对必选消费的温和复苏判断，和中信建投内需磨底、出海定胜负的家电策略，都指向看 #美的集团 $000333\n、 #格力电器 $000651 这类龙头，不看已经连板或刚跌停的杂毛。\n三是半导体制造的事件余波，方向不变，弹性预期上调。日经高开和纳指期货转强，说明亚洲已经愿意给隔夜的弱势做修复，A股制造、设备和PCB大概率比第一版预想的更高开，但5日、20日仍是下跌共振，英伟达昨夜又是高开低走，只观察不追高；CPO和光模块位置仍差，不并入这一方向。腾讯提到的国产算力，也只加强观察，不改仓位纪律。\n#六只个股\n名单与第一版相同，位置数据仍用昨日收盘核验，本档没有新的完整日线需要改写。\n #工商银行 $601398 昨日平收9.06元，5日涨6.21%，20日涨7.22%，距20日高0.44%。触发是银行ETF不破5日线；失效是放量跌破5日或板块5日涨幅快速回吐。高位持盈，不追开盘。\n #中国平安 $601318 昨日跌0.46%，20日涨6.25%，距20日高0.88%，和保险ETF一样走平。触发是保险随银行 曦】C600走S的n+1国产闭环\n【平头哥】S+三星双源，不是H为主。\n【摩尔/昆仑芯/芯原】均有S产能并行，不能按“海外代工=规避”直接外推。\n#关于“三星/台积穿透严查”\nBIS新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升+边际收紧。\n#关于腾讯资本开支：市场最容易误读\n腾讯3Q26资本开支814亿，预付大头对应5500合规N卡及部分高端B卡，但据产业跟踪实际到货比例很低。管理层业绩会明确：长协已签完，后续预付款流出下降，个别季度可能出现回冲（部分未交付合同资金回流）；现金CapEx当前处于峰值，#2026余下时间+2027年围绕峰值波动，2028后才回落。\n我们认为前期腾讯备卡严重不足，27年反而是激进补库窗口——N卡不够就转国产。所以“2028资本开支下滑”≠“算力需求下行”，而是高价抢卡期结束后的自然斜率放缓。#把腾讯资本开支回落理解成行业beta向下，是误读。\n#投资结论差异\n当前竞争已从“单芯片参数”进入“产品力×产能配额×大客户绑定”系统竞争；\n中芯华虹不是纯beta博弈——大厂缺卡是强现实，27年腾讯等CSP仍要激进补库，需求端有支撑。关键跟踪：估值位置、产能优先级、HBM供给节奏、整机交付验收；国产算力我们看结构性机会，有风险的是无产能保障的二三线，不是“代工在海外”的全部标的。","en":"领导好，针对今早市场流传的某版“算力芯片流片来源梳理”，结合我们产业链跟踪，做几点差异化汇报，供参考（信息勿转发）：\n#代工结构修正：不能简单按“海外/国内”一刀切\n【寒武纪】690从26年起主力已切S；并非“三星断供即没戏”。\n【天数/燧原】并非纯台积依赖，两家均有S/H产能储备，冲击程度要看各家额。\n【壁仞】代工以H为主，核心突破点是交付以及大厂验证，不是技术问题。\n【沐曦】C600走S的n+1国产闭环\n【平头哥】S+三星双源，不是H为主。\n【摩尔/昆仑芯/芯原】均有S产能并行，不能按“海外代工=规避”直接外推。\n#关于“三星/台积穿透严查”\nBIS新规方向确在收紧海外代工而非三星本意，历史落地尺度仍待观察，更可能是合规成本上升+边际收紧。\n#关于腾讯资本开支：市场最容易误读\n腾讯3Q26资本开支814亿，预付大头对应5500合规N卡及部分高端B卡，但据产业跟踪实际到货比例很低。管理层业绩会明确：长协已签完，后续预付款流出下降，个别季度可能出现回冲（部分未交付合同资金回流）；现金CapEx当前处于峰值，#2026余下时间+2027年围绕峰值波动，2028后才回落。\n我们认为前期腾讯备卡严重不足，27年反而是激进补库窗口——N卡不够就转国产。所以“2028资本开支下滑”≠“算力需求下行”，而是高价抢卡期结束后的自然斜率放缓。#把腾讯资本开支回落理解成行业beta向下，是误读。\n#投资结论差异\n当前竞争已从“单芯片参数”进入“产品力×产能配额×大客户绑定”系统竞争；\n中芯华虹不是纯beta博弈——大厂缺卡是强现实，27年腾讯等CSP仍要激进补库，需求端有支撑。关键跟踪：估值位置、产能优先级、HBM供给节奏、整机交付验收；国产算力我们看结构性机会，有风险的是无产能保障的二三线，不是“代工在海外”的全部标的。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2123237442874728581","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":3,"vw":1509},{"id":"2123236946592022899","h":"ShanghaoJin","ts":1795054110,"zh":"这才哪跟哪啊","en":"这才哪跟哪啊","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/ShanghaoJin/status/2123236946592022899","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":1576},{"id":"2123233137828536612","h":"bbcchinese","ts":1795053202,"zh":"美国总统特朗普（Donald Trump）与俄罗斯总统普京（Vladimir Putin）周三在深圳APEC峰会欢迎晚宴期间会面，这是两人一年多来首次碰面。两人周四将与中国国家主席习近平举行历史性三方会谈。","en":"美国总统特朗普（Donald Trump）与俄罗斯总统普京（Vladimir Putin）周三 :1,"vw":759},{"id":"2123222071224180964","h":"bbcchinese","ts":1795050563,"zh":"亚太经合组织（APEC）领导人峰会在深圳登场，习近平将与各成员国与地区首脑合照，然后出席峰会。BBC News中文现场直播。","en":"亚太经合组织（APEC）领导人峰会在深圳登场，习近平将与各成员国与地区首脑合照，然后出席峰会。BBC News中文现场直播。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2123222071224180964","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4l0QzjT","d":"bbc.in"}],"t":[],"lk":5,"rt":0,"rp":1,"vw":5891},{"id":"2123219929042207147","h":"ReutersChina","ts":1795050053,"zh":"据韩联社周四报道，韩国青瓦台周三表示，没有发现美国和朝鲜之间可能举行的会谈有任何具体进展。","en":"South Korea's presidential office said on Wednesday it had detected no particular developments on possible talks between the United States and North Korea, Yonhap news agency reported on Thursday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123219929042207147","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/south-korea-sees-no-particular-sign-imminent-us-north-korea-talks-yonhap-says-2026-11-18/?taid=6afe4a454f7b1a0001e4accf&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":354},{"id":"2123217424313114797","h":"tig88411109","ts":1795049456,"zh":"看最新公布的10月份美联储会议纪要，就知道对冲基金这种墙头草过去6周月创纪录的卖出，背后恐慌在哪里？\n但是基金经理错误在于，没有理解美联储这种“就怕流氓有文化”\n美联储理事好比足球裁判给艺术体操打分。一帮搞货币的懂科技创新这种非线性的预测？\n全篇纪要中，美联储理事大谈AI投资过度的什么表外融资，循环融资风险，AI投资回报不及预期将导致系统风险\n这种无知者无畏的精神，历史上美联储多次犯错。最著名就是格林斯潘96年警告“非理性繁荣”，内部美联储预测股市大跌20%会刺穿泡沫，结果呢，2000年拐点提前整整4年。\n其他比如08年次贷危机前，还说次贷风险“相对有限”，21年通胀失控前，还说疫情放水没关系。\n我一直强调很多遍，就是美联储本身就是制造市场波动的最大风险。太多滥竽充数的理事，或许懂货币懂信用市场，但是对于这种非连续性的指数型的变化，人类从来没有预测能力。\n表外融资，不是等于黑市造假；循环融资不是等于庞氏骗局。根本性在于要理解，科技革命带来的生产率的提升，短期和中期的矛盾。美联储如果没有任何证据，直接判断当前AI融资是脆弱的，这就是误导整个市场，加剧市场波动。\n而且更重要在于，大幅提升风险溢价和信用的瓶颈，反而让科技本身能够提升供给，压缩通胀的能力下降，恶化长期通胀前景。\n特别是一些胡说八道的理事，去年那个沃勒还说要降息，今年就说12月要加0.5%。这意味着什么对于投资策略？\n市场有大量的认知差超额收益的空间。空头的最大炸弹就在于是不是美联储连续加息犯错刺穿泡沫。当然概率不大，政策风险叙事压缩短期估值，正是出现长期买点的重大机会。特别是对冲基金这种墙头草过去6周月创纪录的卖出恐慌下。\n具体颗粒度更细见投资策略周报订阅者分享。","en":"看最新公布的10月份美联储会议纪要，就知道对冲基金这种墙头草过去6周月创纪录的卖出，背后恐慌在哪里？\n但是基金经理错误在于，没有理解美联储这种“就怕流氓有文化”\n美联储理事好比足球裁判给艺术体操打分。一帮搞货币的懂科技创新这种非线性的预测？\n全篇纪要中，美联储理事大谈AI投资过度的什么表外融资，循环融资风险，AI投资回报不及预期将导致系统风险\n这种无知者无畏的精神，历史上美联储多次犯错。最著名就是格林斯潘96年警告“非理性繁荣”，内部美联储预测股市大跌20%会刺穿泡沫，结果呢，2000年拐点提前整整4年。\n其他比如08年次贷危机前，还说次贷风险“相对有限”，21年通胀失控前，还说疫情放水没关系。\n我一直强调很多遍，就是美联储本身就是制造市场波动的最大风险。太多滥竽充数的理事，或许懂货币懂信用市场，但是对于这种非连续性的指数型的变化，人类从来没有预测能力。\n表外融资，不是等于黑市造假；循环融资不是等于庞氏骗局。根本性在于要理解，科技革命带来的生产率的提升，短期和中期的矛盾。美联储如果没有任何证据，直接判断当前AI融资是脆弱的，这就是误导整个市场，加剧市场波动。\n而且更重要在于，大幅提升风险溢价和信用的瓶颈，反而让科技本身能够提升供给，压缩通胀的能力下降，恶化长期通胀前景。\n特别是一些胡说八道的理事，去年那个沃勒还说要降息，今年就说12月要加0.5%。这意味着什么对于投资策略？\n市场有大量的认知差超额收益的空间。空头的最大炸弹就在于是不是美联储连续加息犯错刺穿泡沫。当然概率不大，政策风险叙事压缩短期估值，正是出现长期买点的重大机会。特别是对冲基金这种墙头草过去6周月创纪录的卖出恐慌下。\n具体颗粒度更细见投资策略周报订阅者分享。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcudxAaQAAgo95.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2123217424313114797","l":[],"ln":[],"t":["美联储","通胀"],"lk":12,"rt":1,"rp":0,"vw":1530},{"id":"2123216211429437800","h":"fxtrader","ts":1795049166,"zh":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","en":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcpTTQbIAAca6R.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123216211429437800","l":[],"ln":[],"t":["美股"],"lk":6,"rt":1,"rp":3,"vw":3629},{"id":"2123215835527532873","h":"darrencao2024","ts":1795049077,"zh":"我只看前瞻pe 不是ttm","en":"我只看前瞻pe 不是ttm","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123215835527532873","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":797},{"id":"2123215824458838166","h":"qinbafrank","ts":1795049074,"zh":"感觉AI时代最硬的需求应该还是安全了，每发生一次重大安全事故，企业对安全的需求就又多了一分。这个板块调整的时候跌的少、反弹也是最快最猛的。","en":"感觉AI时代最硬的需求应该还是安全了，每发生一次重大安全事故，企业对安全的需求就又多了一分。这个板块调整的时候跌的少、反弹也是最快最猛的。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXctiTubsAADO8v.jpg?name=orig","https://pbs.twimg.com/media/HXctiTsbMAA-fMM.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123215824458838166","l":[],"ln":[],"t":[],"lk":12,"rt":1,"rp":5,"vw":3859},{"id":"2123213641457787250","h":"huiying_lii","ts":1795048554,"zh":"我的首席执行官，最棒的首席执行官","en":"My CEO, best CEO","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/huiying_lii/status/2123213641457787250","l":[],"ln":[],"t":[],"lk":314,"rt":20,"rp":15,"vw":5353},{"id":"2123212487546020124","h":"dmjk001","ts":1795048279,"zh":"OpenAI首款AI硬件或于年底启动出货，立讯精密等中国供应商参与\n11月19日，据供应链消息，OpenAI首款AI端侧硬件产品或将于今年年底启动出货，多家中国厂商参与该项目。其中，立讯精密独家承担整机制造，并供应核心零部件。关于这款产品形态OpenAI尚未正式公布。不过，此前有消息称，OpenAI与苹果前首席设计官Jony Ive团队合作开发的首款消费级硬件，将是一款类似“甜甜圈”形状的无屏AI设备，集成麦克风、扬声器、摄像头及多种传感器，主要通过语音与用户交互，并具备感知周围环境的能力，但具体产品信息仍有待进一步确认。（每经）","en":"OpenAI首款AI硬件或于年底启动出货，立讯精密等中国供应商参与\n11月19日，据供应链消息，OpenAI首款AI端侧硬件产品或将于今年年底启动出货，多家中国厂商参与该项目。其中，立讯精密独家承担整机制造，并供应核心零部件。关于这款产品形态OpenAI尚未正式公布。不过，此前有消息称，OpenAI与苹果前首席设计官Jony Ive团队合作开发的首款消费级硬件，将是一款类似“甜甜圈”形状的无屏AI设备，集成麦克风、扬声器、摄像头及多种传感器，主要通过语音与用户交互，并具备感知周围环境的能力，但具体产品信息仍有待进一步确认。（每经）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123212487546020124","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":494},{"id":"2123212168661483899","h":"dmjk001","ts":1795048203,"zh":"【关于昇腾扩产预期与GPU代工风险汇报】\n一、华为昇腾：2027年国产算力供给有望大幅提升\n据产业链测算，昇腾950DT采用双芯片设计，960DT采用四芯片设计，单颗芯片面积约400—430mm²。按照12英寸晶圆、60%—70%良率估算，单片晶圆可产出约80—90颗有效芯片。若2027年中芯国际N+2工艺分配给昇腾的产能达到2万片/月，全年理论产出约1920万—2160万颗芯片，对应950DT约960万—1080万颗，或960DT约480万—540万颗。960DT虽然数量减半，但凭借HBM、互联及封装升级，系统性能有望实现3—4倍提升。 #市场另有先进制程产能提升至10万片/月的传闻、实际供给还需考虑良率、封装及其他芯片产能竞争（华丰科技、航天电器）\n二、国产GPU厂商：海外代工依赖成为核心变量\n近期产业链传闻，#三星可能加强晶圆代工及终端客户穿透审查，若属实，部分国产GPU企业2027年收入兑现面临风险。\n1、寒武纪： 690/580以国内代工为主，部分产品涉及台积电、三星。\n2、海光信息： CPU以国内代工为主，DCU据传依赖三星。\n3、摩尔线程： 新一代产品逐步转向中芯国际，仍需关注良率和交付。\n4、沐曦股份： 据传对三星依赖较高，国内工艺产品商业化尚待验证。\n5、天数智芯、燧原科技等： 海外先进制程依赖风险值得关注。\n6、壁仞科技、平头哥、昆仑芯： 代工来源存在差异，需分别评估技术成熟度及产能兑现。\n三、我们判断：国产晶圆制造战略价值进一步提升\n若海外代工限制升级，国产AI芯片产业链将加速向中芯国际、华虹等本土晶圆厂集中。华为昇腾凭借国内制造体系及超节点架构，有望强化国产算力竞争优势。\n结论：#重点跟踪华为昇腾国产链、中芯国际、华虹半导体，以及国产GPU厂商的实际代工来源和交付能力。以上代工信息及扩产数字，仅供内部研判，不宜作为确定性事实。","en":"【关于昇腾扩产预期与GPU代工风险汇报】\n一、华为昇腾：2027年国产算力供给有望大幅提升\n据产业链测算，昇腾950DT采用双芯片设计，960DT采用四芯片设计，单颗芯片面积约400—430mm²。按照12英寸晶圆、60%—70%良率估算，单片晶圆可产出约80—90颗有效芯片。若2027年中芯国际N+2工艺分配给昇腾的产能达到2万片/月，全年理论产出约1920万—2160万颗芯片，对应950DT约960万—1080万颗，或960DT约480万—540万颗。960DT虽然数量减半，但凭借HBM、互联及封装升级，系统性能有望实现3—4倍提升。 #市场另有先进制程产能提升至10万片/月的传闻、实际供给还需考虑良率、封装及其他芯片产能竞争（华丰科技、航天电器）\n二、国产GPU厂商：海外代工依赖成为核心变量\n近期产业链传闻，#三星可能加强晶圆代工及终端客户穿透审查，若属实，部分国产GPU企业2027年收入兑现面临风险。\n1、寒武纪： 690/580以国内代工为主，部分产品涉及台积电、三星。\n2、海光信息： CPU以国内代工为主，DCU据传依赖三星。\n3、摩尔线程： 新一代产品逐步转向中芯国际，仍需关注良率和交付。\n4、沐曦股份： 据传对三星依赖较高，国内工艺产品商业化尚待验证。\n5、天数智芯、燧原科技等： 海外先进制程依赖风险值得关注。\n6、壁仞科技、平头哥、昆仑芯： 代工来源存在差异，需分别评估技术成熟度及产能兑现。\n三、我们判断：国产晶圆制造战略价值进一步提升\n若海外代工限制升级，国产AI芯片产业链将加速向中芯国际、华虹等本土晶圆厂集中。华为昇腾凭借国内制造体系及超节点架构，有望强化国产算力竞争优势。\n结论：#重点跟踪华为昇腾国产链、中芯国际、华虹半导体，以及国产GPU厂商的实际代工来源和交付能力。以上代工信息及扩产数字，仅供内部研判，不宜作为确定性事实。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123212168661483899","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":621},{"id":"2123212074537152647","h":"fxtrader","ts":1795048180,"zh":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n另外，Anthropic设置了F类股，拥有公司普通股东投票事项中合计50.1%的投票权。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","en":"Anthropic IPO定价最终落在83美元，高于原定区间。发行9.8亿股，11月19日在纳斯达克上市，交易代码为“ANT”。\n另外，Anthropic设置了F类股，拥有公司普通股东投票事项中合计50.1%的投票权。\n$ANT\n#行情 纳指期货涨1%。Anthropic此次募资约813.1亿美元，超过此前SpaceX创下的纪录。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXcpTTQbIAAca6R.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123212074537152647","l":[],"ln":[],"t":["美股"],"lk":0,"rt":0,"rp":1,"vw":1789},{"id":"2123210083861672428","h":"darrencao2024","ts":1795047705,"zh":"你的名字这家公司 今天我买了点😂","en":"你的名字这家公司 今天我买了点😂","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2123210083861672428","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":666},{"id":"2123209353364971819","h":"TheMarketMemo","ts":1795047531,"zh":"我們普通投資者和馬斯克所掌握的資訊完全不在一個 布的这些信函涵盖了一系列可能的调查事项，包括涉及特朗普家人的所谓财务利益冲突、国土安全部的不当行为，以及政府对杰弗里·爱泼斯坦（Jeffrey Epstein）相关档案的处理。\n加西亚在声明中说：\"监督委员会民主党人正在努力终结本届政府的自肥、不当行为和滥用权力。\"他还说：\"这些调查将为惠及全体美国人的立法奠定基础。这只是开始。\"\n信函的对象包括特朗普的两个儿子、副总统 JD 万斯（JD Vance）、白宫办公厅主任斯蒂芬·米勒（Stephen Miller）、司法部长托德·布兰奇（Todd Blanche）以及总统的女婿贾里德·库什纳（Jared Kushner）。\n白宫多次反驳民主党提出的调查意图，官员们表示，对于他们认为正当的监督调查，愿意配合，但不会配合那些被认定出于政治动机的调查。\n白宫发言人劳伦·比斯（Lauren Bis）说，总统\"愿意与任何人合作，继续为勤劳的美国人民带来胜利\"。\"如果民主党人选择推进虚假的调查和激进左翼的政策，那他们就是选择与美国人民作对\"","en":"民主党议员正式启动对共和党高管的调查：\n众议院监督委员会的首席民主党人正在为长期承诺的、针对特朗普政府的调查打下基础，这些调查将在 1 月新一届国会开始时启动。\n加州众议员罗伯特·加西亚（Robert Garcia）预计将在民主党掌控众议院后出任该委员会主席。他发出多封信函，要求特朗普总统的家人和政府高级官员保存文件。这是对这位共和党总统及其政府展开调查的早期步骤。\n周三公布的这些信函涵盖了一系列可能的调查事项，包括涉及特朗普家人的所谓财务利益冲突、国土安全部的不当行为，以及政府对杰弗里·爱泼斯坦（Jeffrey Epstein）相关档案的处理。\n加西亚在声明中说：\"监督委员会民主党人正在努力终结本届政府的自肥、不当行为和滥用权力。\"他还说：\"这些调查将为惠及全体美国人的立法奠定基础。这只是开始。\"\n信函的对象包括特朗普的两个儿子、副总统 JD 万斯（JD Vance）、白宫办公厅主任斯蒂芬·米勒（Stephen Miller）、司法部长托德·布兰奇（Todd Blanche）以及总统的女婿贾里德·库什纳（Jared Kushner）。\n白宫多次反驳民主党提出的调查意图，官员们表示，对于他们认为正当的监督调查，愿意配合，但不会配合那些被认定出于政治动机的调查。\n白宫发言人劳伦·比斯（Lauren Bis）说，总统\"愿意与任何人合作，继续为勤劳的美国人民带来胜利\"。\"如果民主党人选择推进虚假的调查和激进左翼的政策，那他们就是选择与美国人民作对\"","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123192663369564659","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1193},{"id":"2123191520492986754","h":"bboczeng","ts":1795043280,"zh":"美国医保新规提案引发保险公司股价大幅下跌\n美国医疗保险和医疗补助服务中心（CMS）于11月16日公布了一项名为 CRUSH 的新规提案，计划通过加强对 Medicare Advantage（联邦医疗保险优势计划）的审计和监管，每年追回约90亿美元资金，未来十年累计追回近900亿美元。\n作为 Medicare Advantage 市场的最大参与者，联合健康集团（UnitedHealth）的股价暴跌至350美元附近；Humana 股价下跌13%，Elevance Health 等其他大型医疗保险公司也纷纷跟跌。\n该提案的公众意见征集期将持续至 2027年1月19日。由于可能面临法律挑战，最终规则仍存在调整的可能性。\n不过，投资者已经开始提前计入潜在的监管和财务风险，尤其是那些高度依赖 Medicare Advantage 业务的保险公司。\n市场担忧的核心在于：更严格的审计可能迫使保险公司退还更多医保资金，从而压缩其利润及未来盈利预期。","en":"美国医保新规提案引发保险公司股价大幅下跌\n美国医疗保险和医疗补助服务中心（CMS）于11月16日公布了一项名为 CRUSH 的新规提案，计划通过加强对 Medicare Advantage（联邦医疗保险优势计划）的审计和监管，每年追回约90亿美元资金，未来十年累计追回近900亿美元。\n作为 Medicare Advantage 市场的最大参与者，联合健康集团（UnitedHealth）的股价暴跌至350美元附近；Humana 股价下跌13%，Elevance Health 等其他大型医疗保险公司也纷纷跟跌。\n该提案的公众意见征集期将持续至 2027年1月19日。由于可能面临法律挑战，最终规则仍存在调整的可能性。\n不过，投资者已经开始提前计入潜在的监管和财务风险，尤其是那些高度依赖 Medicare Advantage 业务的保险公司。\n市场担忧的核心在于：更严格的审计可能迫使保险公司退还更多医保资金，从而压缩其利润及未来盈利预期。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123191520492986754","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":144},{"id":"2123190867066589269","h":"bboczeng","ts":1795043124,"zh":"刘云平长得很像石平啊\n这两人，最终都成为华人在海外政界的代表人物\n一个在日本，一个在美国\n难道面相上有什么说法吗？\n谢谢大家！","en":"刘云平长得很像石平啊\n这两人，最终都成为华人在海外政界的代表人物\n一个在日本，一个在美国\n难道面相上有什么说法吗？\n谢谢大家！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123190867066589269","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":221},{"id":"2123189275357581537","h":"bboczeng","ts":1795042744,"zh":"如果IPO后市值迅速跌回$1T，那基本可以说明这几天的签约都是投机性质，\nAI交易是真的要在2027年，彻底完蛋了\n我们现在虽然已经跌了很多，但可能也仅仅是在半山腰上","en":"如果IPO后市值迅速跌回$1T，那基本可以说明这几天的签约都是投机性质，\nAI交易是真的要在2027年，彻底完蛋了\n我们现在虽然已经跌了很多，但可能也仅仅是在半山腰上","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123189275357581537","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":394},{"id":"2123187625511313695","h":"wufantouzi","ts":1795042351,"zh":"ant打新\n锁住了市场5000亿美金流动资金\n预计还有30多个小时解禁回来\n这个打新规模超过了spcx\n这两天市场流动性不足\n明显与这个打新有关\n不过马上解放军就要回来了","en":"ant打新\n锁住了市场5000亿美金流动资金\n预计还有30多个小时解禁回来\n这个打新规模超过了spcx\n这两天市场流动性不足\n明显与这个打新有关\n不过马上解放军就要回来了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2123187625511313695","l":[],"ln":[],"t":[],"lk":8,"rt":0,"rp":6,"vw":1264},{"id":"2123187005718941990","h":"bboczeng","ts":1795042203,"zh":"据路透社报道，白宫和财政部正在讨论一项提案，要求美国企业在其网站上公开披露使用了中国的开放权重 AI 模型，旨在通过舆论压力来抑制这些模型的使用。","en":"据路透社报道，白宫和财政部正在讨论一项提案，要求美国企业在其网站上公开披露使用了中国的开放权重 AI 模型，旨在通过舆论压力来抑制这些模型的使用。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123187005718941990","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":1,"vw":568},{"id":"2123186503794974906","h":"bboczeng","ts":1795042084,"zh":"美联储马上要在27年累计加息100个基点了\n你在这里跟我说降息\n这人估计是被抖音、推特KOL的推送消息害惨了\n学了几个名词，就以为自己能看懂华尔街\ 场结构分化。科技成长方向偏强，网络安全、半导体和软件领涨。能源、医疗保险和量子计算概念承压。纳指与小型股小幅上涨，道指受个股拖累明显下跌，市宽显示多数个股走弱。后续关注 NVDA 管理层事件的进展，以及 PANW 盘后财报。\n---\n几点处理说明：\n- **PANW**：今日涨 9.90% 没有归因于财报，财报只作为盘后事项提及，符合铁律第 5 条。\n- **NVDA**：今日涨跌幅不在【今日行情】里，所以只写了财报和董事会事件，没有写涨跌，也没有写\"超预期\"。\n- **UNH**：今天大跌的原因数据里没有，正文只写了它对道指的拖累，没有编造原因。","en":"【美股复盘 · 11月18日】\n**大市**\n三大指数涨跌不一。标普(SPY) 收于 730.20，跌 0.31%。纳指(QQQ) 收于 659.51，涨 0.39%。道指(DIA) 收于 501.64，跌 1.12%，跌幅在主要指数中最大。罗素小型股(IWM) 收于 270.11，涨 0.39%。市宽偏弱，107 只观察股中 36 只上涨、71 只下跌，下跌家数约为上涨家数的两倍。指数层面科技权重股提供支撑，但多数个股承压。\n**板块**\n网络安全板块表现最强。 $PANW 涨 9.90%，领涨观察池。CRWD 涨 7.95%，NET 涨 5.66%。半导体与网络设备走强，AMD 涨 5.31%，ANET 涨 4.03%，AVGO 涨 3.65%。软件股同步上涨，MDB 涨 2.71%，SNOW 涨 2.45%。AMZN 涨 3.82%，TGT 涨 4.01%。\n能源板块领跌。OXY 跌 4.88%，CVX 跌 4.74%。量子计算概念股走弱，IONQ 跌 5.48%，QBTS 跌 4.83%。AAOI 跌 9.80%，ASTS 跌 7.61%，CRWV 跌 4.13%，QCOM 跌 4.12%。MRNA 跌 4.84%。\n**焦点**\nUNH 大跌 10.21%，为观察池中跌幅最大的个股。UNH 是道指成分股，是道指今日跌幅明显大于其他指数的主要拖累之一。\nNVDA 于前一交易日盘后公布第三财季业绩，今日盘中交易反映的就是这份财报。与财报同时受关注的是公司治理：董事会主席表示已接受黄仁勋辞职，且无意让其回归；黄仁勋此前对《华尔街日报》表示，若董事会邀请，他愿意回任。\nAVGO 上涨，定制芯片是市场持续讨论的方向。谷歌、Meta 等大厂推进自研芯片，以降低对英伟达的依赖，这部分订单的主要承接方正是博通。\nPANW 将于今日盘后公布财报，结果影响的是下一个交易日的走势。\n**小结**\n今日市场结构分化。科技成长方向偏强，网络安全、半导体和软件领涨。能源、医疗保险和量子计算概念承压。纳指与小型股小幅上涨，道指受个股拖累明显下跌，市宽显示多数个股走弱。后续关注 NVDA 管理层事件的进展，以及 PANW 盘后财报。\n---\n几点处理说明：\n- **PANW**：今日涨 9.90% 没有归因于财报，财报只作为盘后事项提及，符合铁律第 5 条。\n- **NVDA**：今日涨跌幅不在【今日行情】里，所以只写了财报和董事会事件，没有写涨跌，也没有写\"超预期\"。\n- **UNH**：今天大跌的原因数据里没有，正文只写了它对道指的拖累，没有编造原因。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123182094021169511","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":503},{"id":"2123174895177896180","h":"wufantouzi","ts":1795039316,"zh":"都有逆风期","en":"都有逆风期","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/wufantouzi/status/2123174895177896180","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":359},{"id":"2123174308029821168","h":"bboczeng","ts":1795039176,"zh":"西雅图好冷，冬天好冷\n我想离开这个地方\n和我的爱人\n我的小獭獭\n永远在一起\n5555","en":"西雅图好冷，冬天好冷\n我想离开这个地方\n和我的爱人\n我的小獭獭\n永远在一起\n5555","zh_src":"native","lang":"zh" 内抹去了黄金和白银合计逾 1.17 万亿美元的市值，两者均跌至 14 个月低点，同时美元飙升至 2025 年 4 月以来的最高水平。\n沃勒（Waller）在接受 CNBC 采访时表示，为应对年化约 3.5% 的通胀，美联储 12 月可能需要加息 50 个基点，或发出更强的政策信号，并呼吁以\"冲击\"来重置市场预期。\n经济学家彼得·席夫（Peter Schiff）警告称，如果真正开始抗击通胀，股票、债券和房地产的跌幅可能比黄金更大，甚至可能引发比 2008 年更严重的衰退；不过也有交易员质疑，加息是否会过度收紧，反而导致通胀过度回落。","en":"金银在美联储鹰派通胀信号下暴跌\n此次暴跌在一天之内抹去了黄金和白银合计逾 1.17 万亿美元的市值，两者均跌至 14 个月低点，同时美元飙升至 2025 年 4 月以来的最高水平。\n沃勒（Waller）在接受 CNBC 采访时表示，为应对年化约 3.5% 的通胀，美联储 12 月可能需要加息 50 个基点，或发出更强的政策信号，并呼吁以\"冲击\"来重置市场预期。\n经济学家彼得·席夫（Peter Schiff）警告称，如果真正开始抗击通胀，股票、债券和房地产的跌幅可能比黄金更大，甚至可能引发比 2008 年更严重的衰退；不过也有交易员质疑，加息是否会过度收紧，反而导致通胀过度回落。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123167719155798265","l":[],"ln":[],"t":["美联储","通胀","黄金"],"lk":0,"rt":0,"rp":0,"vw":188},{"id":"2123164308712661020","h":"bboczeng","ts":1795036792,"zh":"你的观察很准确，现在是白宫护盘，所以资金只能去价值股拉SPY\nSPY的回调一般都比QQQ晚1-3个月\n我们最迟明年2月就知道，这次大崩盘最深能跌到哪里去了\n某些人，某些KOL，以价值股PE过高为借口，证明半导体一定会反弹\n这是很可笑的，就算因为Pair Trade collapse，半导体反弹也是给你跑路的机会\n是绝对回不到前高，也可能长期建仓的\n这群人就这么想回本吗？\n历史上，买错了想回本的人比比皆是，\n但他们基本都逃不过腰斩再腰斩，最后需要翻10倍才能回本的命运\n虽然很遗憾，但这就是事实","en":"你的观察很准确，现在是白宫护盘，所以资金只能去价值股拉SPY\nSPY的回调一般都比QQQ晚1-3个月\n我们最迟明年2月就知道，这次大崩盘最深能跌到哪里去了\n某些人，某些KOL，以价值股PE过高为借口，证明半导体一定会反弹\n这是很可笑的，就算因为Pair Trade collapse，半导体反弹也是给你跑路的机会\n是绝对回不到前高，也可能长期建仓的\n这群人就这么想回本吗？\n历史上，买错了想回本的人比比皆是，\n但他们基本都逃不过腰斩再腰斩，最后需要翻10倍才能回本的命运\n虽然很遗憾，但这就是事实","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123164308712661020","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":1,"rp":0,"vw":401},{"id":"2123163269452226629","h":"Balder13946731","ts":1795036544,"zh":"今天没法给早上的判断打分：今早只公布了锚点 27,196，区间因为当时宽度超过上限没有给，所以也无从验证。\n收盘 27,116.26，相对锚点 -0.29%，全天 +0.42%。收盘仍在我们跟踪的所有价位下方，这个状态在前几天就已经形成，不是今天才跌破的。现在距近期高点 -13.16%。\n2005 年以来，距近期高点跌了 11.7% 到 14.7% 的交易日有 200 个。这些日子之后 20 个交易日内，摸到近期高点 31,224 的只有 1%（所有交易日平均 55%）；跌破 25,760 的有 44%（平均 27%）；跌破 24,405 的有 22%（平均 8%）。\n下一交易日区间 26,899–27,334。","en":"今天没法给早上的判断打分：今早只公布了锚点 27,196，区间因为当时宽度超过上限没有给，所以也无从验证。\n收盘 27,116.26，相对锚点 -0.29%，全天 +0.42%。收盘仍在我们跟踪的所有价位下方，这个状态在前几天就已经形成，不是今天才跌破 样的权力斗争开始，即使董事会想要在冒险和合规之间划清界限，冲突也不可避免地升级到超出其控制范围","en":"@realchrisC05 Jensen is way too popular. She simply can’t stay in power without discrediting him.\nOnce a power struggle like this begins, even if the board wants to draw a line between risk taking and compliance, the conflict will inevitably escalate beyond its control","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ShanghaoJin/status/2123153356835508346","l":[],"ln":[],"t":[],"lk":16,"rt":1,"rp":2,"vw":2181},{"id":"2123152329524531459","h":"bboczeng","ts":1795033936,"zh":"我很好奇，买不买为什么要等你来说\n这群人的大脑是被摘除了吗？\n如果这种人占中国人口的99%\n中国这个国家还有救吗？\n谢谢","en":"我很好奇，买不买为什么要等你来说\n这群人的大脑是被摘除了吗？\n如果这种人占中国人口的99%\n中国这个国家还有救吗？\n谢谢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123152329524531459","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":203},{"id":"2123150204098736536","h":"bboczeng","ts":1795033429,"zh":"英伟达是真的要死绝了\n可能要在120-150反复震荡很久时间，一直持续到2027\n谢谢大家","en":"英伟达是真的要死绝了\n可能要在120-150反复震荡很久时间，一直持续到2027\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123150204098736536","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":488},{"id":"2123144356941205756","h":"ShanghaoJin","ts":1795032035,"zh":"蒂姆·库克（Tim Cook）继承了史蒂夫·乔布斯（Steve Jobs）的遗产，但内华达州董事会必须解散詹森（Jensen）才能继续掌权。\n通过将领导层过渡转变为权力斗争，他们不可避免地改变了 NV 的文化\n乔布斯是苹果公司的传奇人物，而库克的工作就是为了保存这一遗产。\n但内华达州董事会拒绝了詹森的回归，现在必须证明没有他也能取得成功，并以不同的方式做事。您可以期待更多的合规性、更严格的控制、共识驱动的决策和官僚主义。\n短期财务收益可能会成为证明自己合理性的方式，但代价是牺牲让内华达变得非凡的激进冒险精神。\n结果呢？你会看到一个更加官僚化、规避风险、政治正确的 NV。它可能会在几年内保持盈利，但它不会是詹森建造的。\n这就是为什么首席财务官克雷斯或任何董事会指定的继任者可能注定会失败","en":"Tim Cook inherited Steve Jobs’ legacy, but NV board will have to dismantle Jensen’s to stay in power.\nBy turning a leadership transition into a power struggle, they are inevitably changing NV’s culture\nJobs was a legend in AAPL, and Cook’s job was just to preserve this legacy.\nBut NV’s board, having rejected Jensen’s return, must now prove it can succeed without him, and do things differently. You can expect more compliance, tighter controls, consensus driven decisions, and bureaucracy.\nShort term financial earnings will likely become the way to justify itself, at the expense of the aggressive risk taking that made NV extraordinary.\nThe result? You will see a more bureaucratic, risk averse, politically correct NV. It may remain profitable for a few more years, but it won’t be the one Jensen built.\nThat’s why Kress the CFO, or any board-appointed successor, may be doomed to fail","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ShanghaoJin/status/2123144356941205756","l":[],"ln":[],"t":["财报"],"lk":14,"rt":1,"rp":1,"vw":1350},{"id":"2123138337653637591","h":"octopusycc","ts":1795030600,"zh":"我认为瓶颈交易早就结束了\nAI也在事实放缓\n市场关于AI和半导体的定价是这个市场更重要的事情","en":"我认为瓶颈交易早就结束了\nAI也在事实放缓\n市场关于AI和半导体的定价是这个市场更重要的事情","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2123138337653637591","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":0,"rp":1,"vw":251},{"id":"2123132870718062629","h":"bboczeng","ts":1795029296,"zh":"黄仁勋真的有间谍，至少是走私嫌疑的，这不是开玩笑\n他肯定不可能回去做CEO了\n谢谢大家","en":"黄仁勋真的有间谍，至少是走私嫌疑的，这不是开玩笑\n他肯定不可能回去做CEO了\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123132870718062629","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":687},{"id":"2123130704678822314","h":"ShangwenLi1","ts":1795028780,"zh":"我对我们的董事会深感失望","en":"I’m deeply disappointed in our board","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ShangwenLi1/status/2123130704678822314","l":[],"ln":[],"t":[],"lk":2099,"rt":154,"rp":64,"vw":41123},{"id":"2123129748079648791","h":"wufantouzi","ts":1795028552,"zh":"ANT把散户认购额度搞到1000亿美金\n一方面说明市场热度很高\n大家抢着要\n另外一方面也锁死了开盘后的涨幅\n因为想要的人都拿到额度了\n去追涨的人就少了\n其实IPO的时候融资\n还是要让市场饥渴一点的\n这样很多机构散户手里没有票\n必须去二级市场买\n就会形成良好的涨幅\nANT还是对现金太饥渴了\n一看到超额认购\n马上就提高了资金募集的总量\n本来预计能干到2.5-3万亿\n现在看开盘估计只能冲到2万亿左右了","en":"ANT把散户认购额度搞到1000亿美金\n一方面说明市场热度很高\n大家抢着要\n另外一方面也锁死了开盘后的涨幅\n因为想要的人都拿到额度了\n去追涨的人就少了\n其实IPO的时候融资\n还是要让市场饥渴一点的\n这样很多机构散户手里没有票\n必须去二级市场买\n就会形成良好的涨幅\nANT还是对现金太饥渴了\n一看到超额认购\n马 4770542260366","l":[],"ln":[],"t":[],"lk":35,"rt":0,"rp":3,"vw":2653},{"id":"2123103941118599357","h":"octopusycc","ts":1795022399,"zh":"截止目前，这张上涨了50%\nMSTR 12/18 95 P\n从8刀涨到12刀\n$MSTR","en":"截止目前，这张上涨了50%\nMSTR 12/18 95 P\n从8刀涨到12刀\n$MSTR","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbHpyTagAEbGkL.jpg?name=orig"],"u":"https://x.com/octopusycc/status/2123103941118599357","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":1559},{"id":"2123101979375235386","h":"BillAckman","ts":1795021931,"zh":"我认为 @nvidia 董事会的行事方式既不符合股东的最佳利益，也不符合其信托义务。 我们所知道的是，董事会因违反公司政策和/或回应与间谍有染的指控而解雇了詹森或迫使他辞职。 他们这样做时没有仔细考虑对公司、客户、股东或其他利益相关者的影响。 他们仓促做出判断，没有经过仔细的尽职调查，甚至没有对事实的基本了解。 我们怎么知道这一点？ 我们从詹森被解雇的速度有多快以及他被解雇时的情况知之甚少就知道了这一点。 召开董事会会议需要时间。也许有时间进行一次 Zoom。 这是一个应该由董事会亲自出席并在了解事实后仔细审议后做出的决定。他们应该在做出决定后就睡觉，并在第二天再次开会讨论事实、风险以及他们决定的其他影响。 由于时间安排和信息缺乏，董事会无法进行仔细的审议。 虽然董事会可以因首席执行官与下属的不当关系而解雇首席执行官，但这不应该是一个自动的决定。这就是为什么我们的董事会由人类而非代理人组成。 董事会应考虑这种关系是否是双方自愿的，或者是否滥用权力。董事会必须考虑解雇对所有利益相关者的影响。 如果我是这个董事会成员，我就不会根据媒体文章匆忙做出判断。我会确保董事会了解所有事实，以便能够做出谨慎且明智的决定。特拉华州公司董事会有谨慎义务，这意味着他们必须做出知情、审慎和善意的决定。这显然没有发生在这里。 哪家律师事务所为该委员会提供咨询服务？ 或者董事会是否听取了良好的法律建议？ 看起来不像。 现在，董事会坚称詹森不可能重新担任首席执行官，这让董事会的失败雪上加霜。 为什么在所有事实都清楚之前排除詹森回归的可能性才符合公司的最佳利益？这是他们又一次违反注意义务。 此外，董事会还发起了一项调查，调查范围尚不清楚。调查可能会对公司造成极大的损害，因此应谨慎定位，以解决任何需要了解的事实，而不是范围过于广泛。简而言之，这看起来像是董事因媒体头条新闻而惊慌失措的一系列重大治理失败。他们可能觉得有必要做某事，因为他们害怕在媒体上看起来很糟糕，而不是因为这对他们的公司来说是正确的事情。 他们受不了高温。 对于一家如此规模且对我们国家和整个世界如此重要的公司来说，董事会的行为令人震惊，特别是在历史的这个时刻。","en":"I believe the @nvidia board is not acting in the best interest of shareholders nor in a manner consistent with their fiduciary duties.\nWhat we know is that the board fired Jensen or forced his resignation for violating company policy and/or in response to the accusation of an affair with a spy.\nThey did so without careful consideration of the impact on the company, its customers, its shareholders or other stakeholders.\nThey rushed to judgment without the benefit of careful due diligence or even with a basic understanding of the facts.\nHow do we know this?\nWe know this by how quickly Jensen was fired and how little was known at the time of his firing.\nIt takes time to convene a board meeting. There was time, maybe, for one Zoom.\nAnd this is a decision that should have been made by a board sitting in person and carefully deliberating the facts once they are known.\nAnd they should have slept on the decision and met again the day after to discuss the facts, the risks and the other implications of their decision.\nThe timing and lack of information did not allow for careful board deliberation.\nWhile boards can fire a CEO for an inappropriate relationship with a subordinate, it should not be an automatic decision. That is why we have boards comprised of humans and not agents.\nA board should consider whether or not such a relationship was consensual or whether it was an abuse of power dynamics. And a board has to consider what the impact of the firing is on all stakeholders.\nIf I were in this board, I would not have rushed to judgment based on articles in the media. I would have made sure the board had all of the facts so it could make a careful and informed decision.\nBoards of Delaware companies have a duty of care which means they must make informed, prudent and good faith decisions. This clearly did not happen here.\nWhat law firm is advising this board?\nOr is the board even taken good legal advice?\nIt doesn’t look like it.\nAnd now the board is compounding its failures by insisting that there is no possibility for Jensen’s return as CEO.\nWhy is it in the best interest of the company to foreclose the possibility of Jensen’s return and to do so before all of the facts are known? This is yet another breach of their duty of care.\nFurthermore, the board has launched an investigation whose scope is unknown. Investigations can be extremely damaging to a company and should be carefully targeted to address whatever facts need to be known rather than be overly broad in scope.\nIn short, this looks like a series of major governance failures by directors that panicked due to headlines in the media. They likely felt compelled to do something because they were afraid of looking bad in the media, not because it was the right thing for them company.\nThey couldn’t stand the heat.\nThe board’s conduct here is shocking for a company of this scale and importance to our country and the world at large, particularly at this moment in history.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/BillAckman/status/2123101979375235386","l":[],"ln":[],"t":["AI科技"],"lk":5703,"rt":838,"rp":544,"vw":154106},{"id":"2123101157887475839","h":"bboczeng","ts":1795021736,"zh":"和我的看法几乎是完全一样的，首先去$150，随后$120，最差情况可以到$80（再来一次大解放日）\n其实技术面、特别是图形这种东西，你说准吧也不准，你说不准吧，还真不能不看\n因为他就摆在你面前\n看不到结构那就是无知了\n尺度越大的结构越有效","en":"和我的看法几乎是完全一样的，首先去$150，随后$120，最差情况可以到$80（再来一次大解放日）\n其实技术面、特别是图形这种东西，你说准吧也不准，你说不准吧，还真不能不看\n因为他就摆在你面前\n看不到结构那就是无知了\n尺度越大的结构越有效","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123101157887475839","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":242},{"id":"2123101026077315446","h":"bboczeng","ts":1795021704,"zh":"不知不觉，贵金属的行情已经彻底结束了：","en":"不知不觉，贵金属的行情已经彻底结束了：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbFGGMa8AAe3Je.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2123101026077315446","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":249},{"id":"2123100834603180310","h":"bboczeng","ts":1795021658,"zh":"据 Semafor 报道，尽管英伟达（$NVDA）董事会此前公开表示不考虑让黄仁勋重返CEO职位，但董事会内部已有“一派”成员正在推动黄仁勋重新出任首席执行官。\n据悉，黄仁勋近期已与多位科技行业高管会面，并与至少一名英伟达董事会成员讨论了重新担任CEO的可能性。","en":"据 Semafor 报道，尽管英伟达（$NVDA）董事会此前公开表示不考虑让黄仁勋重返CEO职位，但董事会内部已有“一派”成员正在推动黄仁勋重新出任首席执行官。\n据悉，黄仁勋近期已与多位科技行业高管会面，并与至少一名英伟达董事会成员讨论了重新担任CEO的可能性。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123100834603180310","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":319},{"id":"2123100781213794541","h":"bboczeng","ts":1795021646,"zh":"标普500指数（$SPX）七个月来首次收盘跌破200日移动平均线","en":"标普500指数（$SPX）七个月来首次收盘跌破200日移动平均线","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123100781213794541","l":[],"ln":[],"t":["美股"],"lk":2,"rt":0,"rp":0,"vw":252},{"id":"2123100159936791009","h":"Balder13946731","ts":1795021498,"zh":"每个人都将定制芯片描述为谷歌和 Meta 逃离 Nvidia 的收费站。看看他们要逃到谁那里去。\nHock Tan 以大约 69B 美元的价格收购了 VMware，取消了永久许可证并将每个人都捆绑在一起。 AT&T 告诉法庭，其续约报价上涨了 1,050%。客户尖叫了一年，但他们中的大多数人还是付了钱，因为将 VMware 从数据中心中剥离比吃掉账单更糟糕。\n正是这个人共同设计了 Google 的 TPU、Meta 的芯片和 OpenAI 的 10GW 定制芯片交易。在 VMware 中，他发现了一些客户无法轻易拆除并以这种方式定价的东西，并且他在整个职业生涯中一直在做这样的事情。\n一旦你的模型堆栈被调整到只有一家商店可以为你构建的芯片，离开就像离开 VMware 一样痛苦，而他就是那个在未来十年向你报价的人。","en":"Everyone frames custom chips as Google and Meta escaping Nvidia's toll booth. Look at who they're escaping to.\nHock Tan bought VMware for ~$69B, killed the perpetual licenses and pushed everyone onto bundles. AT&T told a court its renewal quote went up 1,050%. Customers screamed for a year, and most of them paid anyway, because ripping VMware out of a data center is worse than eating the bill.\nThat's the same guy co-designing Google's TPUs, Meta's chips and OpenAI's 10GW custom silicon deal. With VMware he found something customers couldn't easily rip out and priced it that way, and he's been doing some version of that his whole career.\nOnce your model stack is tuned to a chip only one shop can build for you, leaving gets about as painful as leaving VMware was, and he's the one who'll be quoting you the renewal for the next decade.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/Balder13946731/status/2123100159936791009","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":596},{"id":"2123100002985898311","h":"bboczeng","ts":1795021460,"zh":"至此，日本所有大型企业，包括三菱银行的数据库系统全部被攻陷\n全体日本人的私人信息估计都被泄露十几遍了，可以被做成游戏了\n这就是外包IT的后果吗？\n谢谢大家","en":"至此，日本所有大型企业，包括三菱银行的数据库系统全部被攻陷\n全体日本人的私人信息估计都被泄露十几遍了，可以被做成游戏了\n这就是外包IT的后果吗？\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123100002985898311","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":502},{"id":"2123099584373399836","h":"yijiangren","ts":1795021360,"zh":"QQQ $QQQ\n开盘前说的650附近\n今天最低点654\n还是有点误差","en":"QQQ $QQQ\n开盘前说的650附近\n今天最低点654\n还是有点误差","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXbDpj1a0AAWdzz.png?name=orig","https://pbs.twimg.com/media/HXbDrw-agAALxtj.png?name=orig"],"u":"https://x.com/yijiangren/status/2123099584373399836","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":1,"vw":459},{"id":"2123099362435936730","h":"bboczeng","ts":1795021307,"zh":"黄金已经结束了\n正如半导体\n希望陶老师迷途知返，不要和Herman Jin一样不断纠缠了\n如果半个月前听了您的建议去抄底存储\n现在岂不是亏麻了？\n结束了就是结束\n改变立场比坚持更值得尊敬！\n不要为了维持人设陷入泥潭，意识形态挂帅，价值观先行\n请和我一样，做一个真诚，诚实，情绪化的人\n谢谢","en":"黄金已经结束了\n正如半导体\n希望陶老师迷途知返，不要和Herman Jin一样不断纠缠了\n如果半个月前听了您的建议去抄底存储\n现在岂不是亏麻了？\n结束了就是结束\n改变立场比坚持更值得尊敬！\n不要为了维持人设陷入泥潭，意识形态挂帅，价值观先行\n请和我一样，做一个真诚，诚实，情绪化的人\n谢谢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123099362435936730","l":[],"ln":[],"t":["AI科技","黄金"],"lk":2,"rt":1,"rp":2,"vw":652},{"id":"2123098165742309412","h":"bboczeng","ts":1795021022,"zh":"看来只有等到明天的IPO结束之后，\n半导体和NVDA才可能迎来11月份的第一次反弹","en":"看来只有等到明天的IPO结束之后，\n半导体和NVDA才可能迎来11月份的第一次反弹","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123098165742309412","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":1,"vw":675},{"id":"2123097645539553592","h":"bboczeng","ts":1795020898,"zh":"美联储理事沃勒呼吁12月加息50个基点\n美联储理事克里斯托弗·沃勒（Christopher Waller）呼吁，在12月8日至9日举行的联邦公开市场委员会（FOMC）会议上，大幅加息50个基点（0.5个百分点）。\n沃勒指出，美国核心消费者价格指数（Core CPI）已连续三个月环比上涨0.3%，按年化计算，通胀率接近3.5%，明显高于美联储2%的通胀目标。此外，超过70%的核心服务类项目价格涨幅超过3%。\n他警告称，通胀压力正在向更广泛的经济领域蔓延，而不仅仅是受到油价影响。因此，他主张美联储现在就采取激进的紧缩措施，或者至少明确释放未来将加快加息步伐的信号，以防止高通胀变得根深蒂固。\n市场对此作出反应，美国国债收益率上升，黄金价格下跌。\n不过，批评人士认为，考虑到油价正在下跌、整体通胀呈现放缓趋势，沃勒的鹰派立场可能为时过早。\n这一争论凸显了美联储当前面临的政策两难：究竟应该通过更激进的紧缩政策维护抗通胀的公信力，还是避免过度加息对经济造成不必要的冲击。","en":"美联储理事沃勒呼吁12月加息50个基点\n美联储理事克里斯托弗·沃勒（Christopher Waller）呼吁，在12月8日至9日举行的联邦公开市场委员会（FOMC）会议上，大幅加息50个基点（0.5个百分点）。\n沃勒指出，美国核心消费者价格指数（Core CPI）已连续三个月环比上涨0.3%，按年化计算，通胀率接近3.5%，明显高于美联储2%的通胀目标。此外，超过70%的核心服务类项目价格涨幅超过3%。\n他警告称，通胀压力正在向更广泛的经济领域蔓延，而不仅仅是受到油价影响。因此，他主张美联储现在就采取激进的紧缩措施，或者至少明确释放未来将加快加息步伐的信号，以防止高通胀变得根深蒂固。\n市场对此作出反应，美国国债收益率上升，黄金价格下跌。\n不过，批评人士认为，考虑到油价正在下跌、整体通胀呈现放缓趋势，沃勒的鹰派立场可能为时过早。\n这一争论凸显了美联储当前面临的政策两难：究竟应该通过更激进的紧缩政策维护抗通胀的公信力，还是避免过度加息对经济造成不必要的冲击。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123097645539553592","l":[],"ln":[],"t":["美联储","通胀","原油能源","黄金"],"lk":3,"rt":0,"rp":2,"vw":962},{"id":"2123097456787530207","h":"bboczeng","ts":1795020853,"zh":"Anthropic IPO 吸引近 5000 亿美元认购，超越 SpaceX 纪录\n开发 Claude 聊天机器人的这家 AI 公司，共收到机构投资者 4000 亿美元和散户投资者 1000 亿美元的认购，目前正商讨将发行价定在 78 美元以上，并扩大发行规模。\n公司前九个月营收 330 亿美元，同比增长 1200%，10 月年化收入run rate达 810 亿美元，股票将于明天在纳斯达克开始交易，股票代码为 $ANT。\n观察人士指出，散户的热情通过代币化产品得以体现，同时也有人将比特币的回落与资金流入此次 IPO 联系起来。","en":"Anthropic IPO 吸引近 5000 亿美元认购，超越 SpaceX 纪录\n开发 Claude 聊天机器人的这家 AI 公司，共收到机构投资者 4000 亿美元和散户投资者 1000 亿美元的认购，目前正商讨将发行价定在 78 美元以上，并扩大发行规模。\n公司前九个月营收 330 亿美元，同比增长 1200%，10 月年化收入run rate达 810 亿美元，股票将于明天在纳斯达克开始交易，股票代码为 $ANT。\n观察人士指出，散户的热情通过代币化产品得以体现，同时也有人将比特币的回落与资金流入此次 IPO 联系起来。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123097456787530207","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":5,"rt":0,"rp":1,"vw":1520},{"id":"2123096878363611329","h":"octopusycc","ts":1795020715,"zh":"帮着扩散一下，杨超越老师 365天盈利榜第一","en":"帮着扩散一下，杨超越老师 365天盈利榜第一","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2123096878363611329","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":0,"vw":1661},{"id":"2123095059633733782","h":"TraderS18","ts":1795020282,"zh":"是“糟心”不是“招新”，手速太快打错了","en":"是“糟心”不是“招新”，手速太快打错了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123095059633733782","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1135},{"id":"2123094172668490175","h":"bboczeng","ts":1795020070,"zh":"英伟达跌破150，那就是120见了","en":"英伟达跌破150，那就是120见了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123094172668490175","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":153},{"id":"2123093122423128338","h":"bboczeng","ts":1795019820,"zh":"事实证明，美股确实已经完了\n大家节哀吧\n只有定投voo是你们的唯一出路","en":"事实证明，美股确实已经完了\n大家节哀吧\n只有定投voo是你们的唯一出路","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123093122423128338","l":[],"ln":[],"t":["美股"],"lk":3,"rt":0,"rp":3,"vw":507},{"id":"2123089479921787104","h":"wufantouzi","ts":1795018951,"zh":"英伟达财报也没有拉起美股\n短期美股反弹的机会渺茫了\n只能装死等加息之后了","en":"英伟达财报也没有拉起美股\n短期美股反弹的机会渺茫了\n只能装死等加息之后了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2123089479921787104","l":[],"ln":[],"t":["美联储","美股","AI科技","财报"],"lk":10,"rt":0,"rp":6,"vw":2490},{"id":"2123088711030366217","h":"yijiangren","ts":1795018768,"zh":"A社 IPO：市场愿意给 AI 多高的估值\nAnthropic 即将登陆纳斯达克，股票代码 ANT。\n目前公开招股文件给出的发行区间为 70—78 美元。\n此前有媒体报道称，承销商正在考虑将发行价上调至 80 美元以上。\n市场讨论的估值已经达到约 1.4 万亿美元，如果最终定价继续上调，估值还会进一步抬升。\n但这 1.4 万亿美元究竟贵不贵？\n先看基本面\nAnthropic 的收入增长\n2025 年全年收入约 45.9 亿美元，2026 年前九个月已经达到 332.4 亿美元，同比增长约 12 倍。\n企业客户对 Claude 的需求正在快速增长，AI 编程、企业自动化和 API 服务都在推动商业化。\n但另一面也值得注意。\n2026 年前九个月，算力与基础设施费用达到 188.1 亿美元，占收入的 57%。\n同期经营亏损约 12.6 亿美元。\n账面净亏损约 1040 亿美元，其中约 943 亿美元来自可转换票据、衍生负债等金融工具的公允价值变动，不是实际现金烧掉了 1040 亿美元。\n这恰恰说明，AI 行业的商业化速度虽然很快，但算力投入依然是一笔庞大的长期成本。\n再看估值\n按照路透社报道的约 1.4 万亿美元估值计算，Anthropic 对应过去 12 个月收入约 40 倍。\n这个价格已经包含了市场对未来多年增长的预期。\n投资者买入的，是 Claude 在企业市场的持续渗透，是 AI Agent 带来的生产力变革，也是 Anthropic 未来争夺全球 AI 基础设施市场的可能性。\n但高估值也意味着更高的兑现要求。\n模型竞争、算力成本、融资环境、企业客户的实际付费意愿，任何一个环节出现变化，都可能影响估值。\n所以，两件事：\n最终发行价能否突破 80 美元\n首日交易能否承接如此高的估值\nIPO 首日的涨跌只能反映资金当下的态度。\n真正决定 Anthropic 长期价值的，是它能否把 AI 的技术优势，持续转化为收入、利润和现金流。","en":"A社 IPO：市场愿意给 AI 多高的估值\nAnthropic 即将登陆纳斯达克，股票代码 ANT。\n目前公开招股文件给出的发行区间为 70—78 美元。\n此前有媒体报道称，承销商正在考虑将发行价上调至 80 美元以上。\n市场讨论的估值已经达到约 1.4 万亿美元，如果最终定价继续上调，估值还会进一步抬升。\n但这 1.4 万亿美元究竟贵不贵？\n先看基本面\nAnthropic 的收入增长\n2025 年全年收入约 45.9 亿美元，2026 年前九个月已经达到 332.4 亿美元，同比增长约 12 倍。\n企业客户对 Claude 的需求正在快速增长，AI 编程、企业自动化和 API 服务都在推动商业化。\n但另一面也值得注意。\n2026 年前九个月，算力与基础设施费用达到 188.1 亿美元，占收入的 57%。\n同期经营亏损约 12.6 亿美元。\n账面净亏损约 1040 亿美元，其中约 943 亿美元来自可转换票据、衍生负债等金融工具的公允价值变动，不是实际现金烧掉了 1040 亿美元。\n这恰恰说明，AI 行业的商业化速度虽然很快，但算力投入依然是一笔庞大的长期成本。\n再看估值\n按照路透社报道的约 1.4 万亿美元估值计算，Anthropic 对应过去 12 个月收入约 40 倍。\n这个价格已经包含了市场对未来多年增长的预期。\n投资者买入的，是 Claude 在企业市场的持续渗透，是 AI Agent 带来的生产力变革，也是 Anthropic 未来争夺全球 AI 基础设施市场的可能性。\n但高估值也意味着更高的兑现要求。\n模型竞争、算力成本、融资环境、企业客户的实际付费意愿，任何一个环节出现变化，都可能影响估值。\n所以，两件事：\n最终发行价能否突破 80 美元\n首日交易能否承接如此高的估值\nIPO 首日的涨跌只能反映资金当下的态度。\n真正决定 Anthropic 长期价值的，是它能否把 AI 的技术优势，持续转化为收入、利润和现金流。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXa5c_yawAAv0av.png?name=orig"],"u":"https://x.com/yijiangren/status/2123088711030366217","l":[],"ln":[],"t":["美股","AI科技"],"lk":5,"rt":0,"rp":3,"vw":851},{"id":"2123083555953836116","h":"TraderS18","ts":1795017539,"zh":"那么我们想要的终极答案也就呼之欲出了，真正的反转点是利率何时从加息变降息，在能看到加息周期终点之前，只会有反弹而不会有反转。\n再回顾下本轮周期：9.16号加了25BP，10月没加，12月会加25BP，然后大概会在明年3月再加25BP后暂停。\n也就是说行情要到明年春节后才会开始好转，这跟市场一贯印象也很吻合。但不排除12月会随着TGA账户水位下降有一轮小宽松带来的行情回暖。\n好消息是油价还在下跌，如果趋势可以维持，宏观数据也会随之改善。如果11月12月的PCE/CPI都得到改善，行情的回暖也许会提前到来。毕竟市场会提前交易预期，而不会等利率决议那一刻才去博弈。","en":"那么我们想要的终极答案也就呼之欲出了，真正的反转点是利率何时从加息变降息，在能看到加息周期终点之前，只会有反弹而不会有反转。\n再回顾下本轮周期：9.16号加了25BP，10月没加，12月会加25BP，然后大概会在明年3月再加25BP后暂停。\n也就是说行情要到明年春节后才会开始好转，这跟市场一贯印象也很吻合。但不排除12月会随着TGA账户水位下降有一轮小宽松带来的行情回暖。\n好消息是油价还在下跌，如果趋势可以维持，宏观数据也会随之改善。如果11月12月的PCE/CPI都得到改善，行情的回暖也许会提前到来。毕竟市场会提前交易预期，而不会等利率决议那一刻才去博弈。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123083555953836116","l":[],"ln":[],"t":["美联储","原油能源"],"lk":31,"rt":2,"rp":2,"vw":5223},{"id":"2123081783269113949","h":"CrushTheShorts","ts":1795017116,"zh":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星开始穿透严查代工，据了解此事大概率为真\n2）只看代工来源，理论上说摩尔和壁仞相对还行，但其实都有各自的问题\n3）理论上说该把中芯华虹拉满，但腾讯给了2028年资本开支下滑的展望，尽管买国产卡的钱预计能增长2年，但在大beta向下的预期下，交易这两标的也是个难题","en":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星开始穿透严查代工，据了解此事大概率为真\n2）只看代工来源，理论上说摩尔和壁仞相对还行，但其实都有各自的问题\n3）理论上说该把中芯华虹拉满，但腾讯给了2028年资本开支下滑的展望，尽管买国产卡的钱预计能增长2年，但在大beta向下的预期下，交易这两标的也是个难题","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2123081783269113949","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":0,"rp":4,"vw":1345},{"id":"2123081479987302659","h":"Gabrysia_eth","ts":1795017044,"zh":"看到一个70岁老奶奶对ai时代的评论：\n「以后，年轻人也可能会没有工作机会，相信社会不会让人饿死。个体需要解决的就是打发时间。」\n「对抗虚无和无意义感的方法，就是让生活充满细节。」\n我一直觉得，我们正在经历的不只是生产力的进步，而可能是整个社会生产关系、阶级结构，甚至人类价值体系的重新洗牌。\n未来，人或许不再需要像过去几千年一样，终其一生都在为基本生存需求奔波。\n当劳动不再是人获取价值的主要方式，价值会是那些过去很容易被忽略的东西：人的思想、情感、创造力、审美、好奇心，以及与其他人建立真实连接的能力。\n我们为什么会被一朵花、一场雨打动，为什么想去探索、表达、创造，为什么愿意花时间去爱一个人、经营一段关系。\n生产力进步的终点，是让人终于有时间重新成为人。","en":"看到一个70岁老奶奶对ai时代的评论：\n「以后，年轻人也可能会没有工作机会，相信社会不会让人饿死。个体需要解决的就是打发时间。」\n「对抗虚无和无意义感的方法，就是让生活充满细节。」\n我一直觉得，我们正在经历的不只是生产力的进步，而可能是整个社会生产关系、阶级结构，甚至人类价值体系的重新洗牌。\n未来，人或许不再需要像过去几千年一样，终其一生都在为基本生存需求奔波。\n当劳动不再是人获取价值的主要方式，价值会是那些过去很容易被忽略的东西：人的思想、情感、创造力、审美、好奇心，以及与其他人建立真实连接的能力。\n我们为什么会被一朵花、一场雨打动，为什么想去探索、表达、创造，为什么愿意花时间去爱一个人、经营一段关系。\n生产力进步的终点，是让人终于有时间重新成为人。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Gabrysia_eth/status/2123081479987302659","l":[],"ln":[],"t":[],"lk":12,"rt":1,"rp":2,"vw":785},{"id":"2123081181730324877","h":"dmjk001","ts":1795016973,"zh":"各位领导，这个是主要算力芯片公司流片来源情况，海外为主的一定要规避（以下信息切勿转发）\n1、寒武纪：690/580主要国内，690还有TSMC和三星，后面基本没戏了，还有一些590在三星，应该也不行了，对明年收入有一定负面影响\n2、海光：CPU主要国内（也有一点在三星），DCU全部三星\n3、摩尔：5000海外但是备货够了，6000开始都是SMIC但应该也会影响收入指引的兑现，6000有个海外版，也联系了三星但应该没了\n4、沐曦：明年指引主要靠三星，SMIC n+1的C600暂时没人要\n5、天数/翱捷/燧原：主要TSMC，受冲击最大\n6、壁仞：主要华虹，但据说有技术问题未必能兑现收入指引\n7、昆仑芯/芯原股份：主要是三星\n8、平头哥：三星+华虹，比例不详，预计主要三星，国内处于上量中\n简要结论：\n1）为什么发这个，因为今晚开始传产业消息说三星 src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXaT4g7bwAADHRT.jpg?name=orig"],"u":"https://x.com/LeoYuen13/status/2123047277921177781","l":[],"ln":[],"t":["黄金"],"lk":6,"rt":0,"rp":0,"vw":452},{"id":"2123043914676666371","h":"xingpt","ts":1795008088,"zh":"2016 年至 2024 年，阿里巴巴在中国电商市场的份额从 80% 降至 40%，流失的市场份额主要被拼多多、抖音和快手蚕食。（图表来源：Momentum Works）\n图表标题：2016 年以来，中国电商平台的竞争格局发生了持续的结构性变化。\n2016 年，阿里巴巴以 80% 的市场份额占据中国电商市场的绝对主导地位。当时，分析师甚至宣称：“竞争已经结束”（Game Over）。\n然而到了 2024 年，阿里巴巴的市场份额已下降至约 40%。\n从图表估算，各大电商平台在 2024 年的市场份额分别为：\n阿里巴巴（淘宝、天猫）：约 36%\n拼多多：约 23%\n京东：约 20%\n抖音：约 15%\n快手：约 6%\n短短八年时间，阿里巴巴丧失了近一半的市场份额。即便是拥有强大规模效应、网络效应和先发优势的互联网巨头，其竞争护城河也可能随着商业模式创新和用户消费习惯的改变而逐渐瓦解。","en":"2016 年至 2024 年，阿里巴巴在中国电商市场的份额从 80% 降至 40%，流失的市场份额主要被拼多多、抖音和快手蚕食。（图表来源：Momentum Works）\n图表标题：2016 年以来，中国电商平台的竞争格局发生了持续的结构性变化。\n2016 年，阿里巴巴以 80% 的市场份额占据中国电商市场的绝对主导地位。当时，分析师甚至宣称：“竞争已经结束”（Game Over）。\n然而到了 2024 年，阿里巴巴的市场份额已下降至约 40%。\n从图表估算，各大电商平台在 2024 年的市场份额分别为：\n阿里巴巴（淘宝、天猫）：约 36%\n拼多多：约 23%\n京东：约 20%\n抖音：约 15%\n快手：约 6%\n短短八年时间，阿里巴巴丧失了近一半的市场份额。即便是拥有强大规模效应、网络效应和先发优势的互联网巨头，其竞争护城河也可能随着商业模式创新和用户消费习惯的改变而逐渐瓦解。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXaRLQWawAA2HUy.jpg?name=orig"],"u":"https://x.com/xingpt/status/2123043914676666371","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":830},{"id":"2123038830424916044","h":"bbcchinese","ts":1795006875,"zh":"你有玩《GTA》吗？ 引颈以待13年，这款全球知名的动作冒险游戏11月19日强势回归，推出新一代《GTA 6》掀起国际热话。\nBBC曾于1996年到访初代《GTA》的诞生地——苏格兰邓迪，见证这款经典游戏的制作过程。三十年后，BBC重返当地并专访元祖级共同创作者以及当时的编剧，分享如何打造出这个全球文化现象。","en":"你有玩《GTA》吗？ 引颈以待13年，这款全球知名的动作冒险游戏11月19日强势回归，推出新一代《GTA 6》掀起国际热话。\nBBC曾于1996年到访初代《GTA》的诞生地——苏格兰邓迪，见证这款经典游戏的制作过程。三十年后，BBC重返当地并专访元祖级共同创作者以及当时的编剧，分享如何打造出这个全球文化现象。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/ext_tw_video/2123038708798468096/pu/vid/avc1/720x1280/XmvmIugIbIXBczip.mp4?tag=12"],"u":"https://x.com/bbcchinese/status/2123038830424916044","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":3047},{"id":"2123035887361794268","h":"darrencao2024","ts":1795006174,"
