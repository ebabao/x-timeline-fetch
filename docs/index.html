月比上一代快一倍，而且新一代的token/瓦的效率是上一代Blackwell的十倍提升，意味着1GW的Rubin收入就是一年4-500亿。\n这不是简单卖GPU，而是真正的系统工程，自己的CPU/连接/安全芯片/明年上光互连CPO量产又一能效提升。加上模块化工厂，按上接点就挣钱。这个背景就是大的行业需求暴涨，特别是Agentic AI对于算力需求，哪怕老卡早期前2代的租金都在大涨。\n收入多元化除了云大厂占1半，这也是为什么英伟达要扶持第三方新云公司，包括企业/主权等收入，降低依赖于单一大客户风险，何况中国收入为0，目前北美/欧日等需求直接填补空档，供不应求。\n哪怕是市场担心的表外担保生态融资，来虚增收入，完全可以证伪。6400亿表外承诺，近4000亿是供应链采购承诺主要是锁定上游晶圆/HBM存储和封装产能，这是必须的，因为英伟达自己是轻资产，对于上游的供应链掌控重要性。当然老黄不在有短期影响，但对于英伟达这种体量客户，靠个人关系已经不是长久之计，必然规范大势所趋，这方面何况作为最大的客户，英伟达是甲方，不担心台湾供应链不保障的风险\n另外1000亿是自用云服务；真正新云neocloud保底租赁也就是320亿，而且都是有明确前置条件，就是全部上线才担保，现在供不应求之下，风险何在？另外1000多亿是OpenAI的20年独家租约，至少目前看不到证伪。\n目前市场大跌因为黄仁勋的时代落幕，当然作为创始人的远见和个人魄力是有折价，这主要体现在可能未来3-5年战略的选择，但是对于AI时代真正的王者和领头羊，老黄一人独裁的邪修管理风格，也是必然在企业进入系统化竞争的平台后，管理范式的转移，向“开宗立派”转移，只不过，他个人事件离职，加速了这个转移而已。\n从投资策略和估值角度，事件性冲击短期当然是重点，根据不同的事件会有好的买入时点，结合合理的估值，因为基本面虽然强，但是整体的估值溢价需要下调到一个中长期合理的区间，同时也要考虑本质性，一些竞争力丧失的风险，比如法律和治理风险，人才流失风险。\n颗粒度更细的投资策略和估值，见订阅者专享。教育分享。","en":"$NVDA 最新Q3财报财务数据和下一季预测全面超预期，粉碎的是空头的“半导体算力周期见顶和估值塌陷”的小作文陷阱。\n一个人能活成黄仁勋这种离职能带崩2万亿自己创业公司市值，还能带崩整个AI泡沫，那真是可以笑傲江湖了。如何真正的解读背后事件以及财报中关键的英伟达投资策略“范式”转移？\n真正的行业专家背景买方投资看的当然不只是一个收入和毛利超预期，这都是大概率。要看到这种英伟达顶级的技术路线和工程实现能力，这才是真正的护城河\n8月启动发售新一代Rubin第一个季度就200亿订单确认，部署效率1个月比上一代快一倍，而且新一代的token/瓦的效率是上一代Blackwell的十倍提升，意味着1GW的Rubin收入就是一年4-500亿。\n这不是简单卖GPU，而是真正的系统工程，自己的CPU/连接/安全芯片/明年上光互连CPO量产又一能效提升。加上模块化工厂，按上接点就挣钱。这个背景就是大的行业需求暴涨，特别是Agentic AI对于算力需求，哪怕老卡早期前2代的租金都在大涨。\n收入多元化除了云大厂占1半，这也是为什么英伟达要扶持第三方新云公司，包括企业/主权等收入，降低依赖于单一大客户风险，何况中国收入为0，目前北美/欧日等需求直接填补空档，供不应求。\n哪怕是市场担心的表外担保生态融资，来虚增收入，完全可以证伪。6400亿表外承诺，近4000亿是供应链采购承诺主要是锁定上游晶圆/HBM存储和封装产能，这是必须的，因为英伟达自己是轻资产，对于上游的供应链掌控重要性。当然老黄不在有短期影响，但对于英伟达这种体量客户，靠个人关系已经不是长久之计，必然规范大势所趋，这方面何况作为最大的客户，英伟达是甲方，不担心台湾供应链不保障的风险\n另外1000亿是自用云服务；真正新云neocloud保底租赁也就是320亿，而且都是有明确前置条件，就是全部上线才担保，现在供不应求之下，风险何在？另外1000多亿是OpenAI的20年独家租约，至少目前看不到证伪。\n目前市场大跌因为黄仁勋的时代落幕，当然作为创始人的远见和个人魄力是有折价，这主要体现在可能未来3-5年战略的选择，但是对于AI时代真正的王者和领头羊，老黄一人独裁的邪修管理风格，也是必然在企业进入系统化竞争的平台后，管理范式的转移，向“开宗立派”转移，只不过，他个人事件离职，加速了这个转移而已。\n从投资策略和估值角度，事件性冲击短期当然是重点，根据不同的事件会有好的买入时点，结合合理的估值，因为基本面虽然强，但是整体的估值溢价需要下调到一个中长期合理的区间，同时也要考虑本质性，一些竞争力丧失的风险，比如法律和治理风险，人才流失风险。 c":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2122886647171707175","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":477},{"id":"2122886374541938805","h":"darrencao2024","ts":1794970527,"zh":"Robinhood 目标价更新：盈利预期没变，估值跌到一年最低","en":"Robinhood 目标价更新：盈利预期没变，估值跌到一年最低","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/darrencao2024/status/2122886374541938805","l":["darrencr2024.substack.com"],"ln":[{"u":"https://darrencr2024.substack.com/p/robinhood-2bf?r=6oyb2h&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true","d":"darrencr2024.substack.com"}],"t":[],"lk":2,"rt":0,"rp":0,"vw":658},{"id":"2122886128961499282","h":"bboczeng","ts":1794970469,"zh":"我的意思是还有一半可以跌，现在只跌了一半\n不是再跌50%","en":"我的意思是还有一半可以跌，现在只跌了一半\n不是再跌50%","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122886128961499282","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":627},{"id":"2122884639262126465","h":"qinbafrank","ts":1794970113,"zh":"老黄离开后的英伟达三季度财报看点：本季大超预期下季及下一财年指引很强劲，对外新的投资担保谨慎，董事会明确不打算请回老黄。聊聊个人理解。\n1、具体数字很多地方都能看到，只说关键点：\n1）Vera Rubin开始正式交货、创造力英伟达历史上最快的爬坡记录，单季交付超过200亿美金，这个量级与公司本季约196亿美元的整体环比收入增量接近，说明新产品是增量来源，且新产品的交付本没有挤压原有产线的销售；\n2）下一季指引1300亿美元，达到所有买方卖方的最高预期水平。\n3）进一步上调了2028财年增长预期（本季是27财年第三季度），公司目前预计截至2028年1月的2028财年营收同比增长约75%，高于此前提出的70%以上增长目标。今年（2027财年）英伟达的营收应该能超过4200亿美金，那么明年（2028财年）按照75%的增速营收能超过7400亿美金。\n4）公司三财季通过回购和分红向股东返还281亿美元。剩余股票回购授权约2273亿美元，要在28年之前完成，意味着未来五个季度单季平均回购450亿美金的股票，回购力度已经达到单季自由现金流的规模。\n2、电话会议上临时CEO聊到几个关于产业的信息\n1）OpenRouter上的周度Token使用量同比激增35倍，过去三个月内增长了3.5倍。智能体工作负载目前占据约80%的Token量。\n自5月以来Token价格已下降近60%，这推动了Token使用量的加速增长和算力需求的扩张。也带动GPU租用价格跨代上涨——已有老一代GPU在多年期合同中以最高两倍的原价续约，而B300的租用费率自推出以来已上涨逾60%。\n2）CPO路线快速推进，规模化生产已经启动。Lambda宣布了英伟达光子CPO交换机的首个量产部署，连接逾1万颗GB300 GPU。与公开插拔式光模块方案相比，英伟达光子交换机的能效提升5倍，可靠性提升15倍，延迟降低10%。三季度，英伟达的网络业务收入超过210亿美元。这可能是看到的对上游产业链最利好的一个信息。\n3）Vera Rubin Ultra仍按计划于明年发布，Feynman将于2028年推出。\nPOD到货后即可直接连接部署，将上线时间从数月压缩至数周，大幅加快首次Token生成的时间。对于年收入规模达500亿美元的1吉瓦AI工厂而言，仅仅提前一个季度达到首次Token生成，就可能为运营商额外带来逾100亿美元的收入。\n4）云行业积压订单目前已达2.5万亿美元，较三个月前的2万亿美元进一步增长。\n3、资本生态\n截至第三财季末英伟达的供应承诺从上一财季的2790亿美元增加至3900亿美元，主要与多年期内存采购有关。\n此外公司云服务协议和数据中心租赁承诺合计达到1020亿美元，高于上一季度的740亿美元。\n如果进一步计入股权投资、资本开支等项目，英伟达披露的未来各项承诺合计达到5180亿美元。\n而相关融资担保敞口和Neocloud协议由公司另外列示：\n1）披露最高1180亿美元的第三方融资担保敞口。最大的一笔涉及俄亥俄州SB Energy建设的数据中心园区。英伟达提供的相关担保最高达到1050亿美元，项目将建设约4.25吉瓦的数据中心容量，并通过长达20年的租赁安排为OpenAI提供基础设施。\n2）公司还披露与新兴云服务商（Neoclouds）的相关承诺达到320亿美元。\n关于“英伟达是否准备收缩客户融资”，\nKress在会上发出了明确信号：英伟达在支持新兴云客户时将变得更加“克制和挑剔”。她表示公司正在“严格评估”各项投资、承诺和财务担保。\nKress详细划定了英伟达的担保底线：\n如果（数据中心建设）开始了，但不幸的是他们被推迟了，或者在建设方面遇到了挑战，我们的担保就不再存在了。我们对其中大多数项目的担保，实际上是基于它们准备就绪的时候。\n我的理解是：原有的仍在继续，但未来项目的筛选应该会更谨慎和严格。英伟达不再为早期的水泥建设或选址买单，只有当数据中心的土地、电力和外壳等基础设施真正就绪时，财务担保才会生效。\n这向其实发出一个明确信号：部分企业是时候自力更生了。对于Neocloud来说，27年要为生存而战了。\n4、关于老黄回归问题\n董事会主席Harvey Jones在电话会明确表示董事会不打算恢复黄仁勋的CEO职务。他透露，董事会目前正同步考察内外部的CEO候选人，并表示“此次遴选将会全面而审慎”，在“找到真正合适的人选”前，公司绝不会仓促推进。\n“先进芯片技术和国家安全形势正在改变英伟达的经营环境，而新任 CEO 必须能够妥善应对这些变化。”\n虽然昨晚老黄也表态了回归的意愿，但是今年电话会的表态我们也要做好未来老黄不能回归的准备。\n5、怎么看这份财报对市场的影响\n1）短期内强劲财报和下季下一财年的指引会提振市场的情绪，短期内可能会带动市场一波反弹。\n2）但中长期最大的考验还是如果老黄确定不能回归后，新的ceo能不能顶替上来。不然市场还是会对技术迭代的速度，产业生态支持力度心存疑虑。\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"老黄离开后的英伟达三季度财报看点：本季大超预期下季及下一财年指引很强劲，对外新的投资担保谨慎，董事会明确不打算请回老黄。聊聊个人理解。\n1、具体数字很多地方都能看到，只说关键点：\n1）Vera Rubin开始正式交货、创造力英伟达历史上最快的爬坡记录，单季交付超过200亿美金，这个量级与公司本季约196亿美元的整体环比收入增量接近，说明新产品是增量来源，且新产品的交付本没有挤压原有产线的销售；\n2）下一季指引1300亿美元，达到所有买方卖方的最高预期水平。\n3）进一步上调了2028财年增长预期（本季是27财年第三季度），公司目前预计截至2028年1月的2028财年营收同比增长约75%，高于此前提出的70%以上增长目标。今年（2027财年）英伟达的营收应该能超过4200亿美金，那么明年（2028财年）按照75%的增速营收能超过7400亿美金。\n4）公司三财季通过回购和分红向股东返还281亿美元。剩余股票回购授权约2273亿美元，要在28年之前完成，意味着未来五个季度单季平均回购450亿美金的股票，回购力度已经达到单季自由现金流的规模。\n2、电话会议上临时CEO聊到几个关于产业的信息\n1）OpenRouter上的周度Token使用量同比激增35倍，过去三个月内增长了3.5倍。智能体工作负载目前占据约80%的Token量。\n自5月以来Token价格已下降近60%，这推动了Token使用量的加速增长和算力需求的扩张。也带动GPU租用价格跨代上涨——已有老一代GPU在多年期合同中以最高两倍的原价续约，而B300的租用费率自推出以来已上涨逾60%。\n2）CPO路线快速推进，规模化生产已经启动。Lambda宣布了英伟达光子CPO交换机的首个量产部署，连接逾1万颗GB300 GPU。与公开插拔式光模块方案相比，英伟达光子交换机的能效提升5倍，可靠性提升15倍，延迟降低10%。三季度，英伟达的网络业务收入超过210亿美元。这可能是看到的对上游产业链最利好的一个信息。\n3）Vera Rubin Ultra仍按计划于明年发布，Feynman将于2028年推出。\nPOD到货后即 0,"vw":820},{"id":"2122861361390829688","h":"dmjk001","ts":1794964564,"zh":"彭博：英伟达公司已不再向中国运送 Hopper 数据中心芯片，尽管去年获得了美国政府批准向该亚洲国家出售该型号的一个版本。\n第三季度向中国出售了价值 24 亿美元的获许可 Hopper 数据中心产品， 英伟达临时首席执行官科莱特·克雷斯在周二与分析师举行的财报电话会议上表示。但她表示，公司未来的“业绩指引中不包含任何获许可的 Hopper 数据中心产品，我们也不再向中国发运获许可的 Hopper 数据中心产品。”","en":"彭博：英伟达公司已不再向中国运送 Hopper 数据中心芯片，尽管去年获得了美国政府批准向该亚洲国家出售该型号的一个版本。\n第三季度向中国出售了价值 24 亿美元的获许可 Hopper 数据中心产品， 英伟达临时首席执行官科莱特·克雷斯在周二与分析师举行的财报电话会议上表示。但她表示，公司未来的“业绩指引中不包含任何获许可的 Hopper 数据中心产品，我们也不再向中国发运获许可的 Hopper 数据中心产品。”","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXq-JebkAAQcKi.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122861361390829688","l":[],"ln":[],"t":["AI科技","财报"],"lk":1,"rt":0,"rp":0,"vw":1154},{"id":"2122860388761084376","h":"Balder13946731","ts":1794964332,"zh":"今晚GTA 6发布 $TTWO","en":"今晚GTA 6发布 $TTWO","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2122860388761084376","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1301},{"id":"2122860058417811897","h":"ArtofSpecuycky","ts":1794964253,"zh":"确实，在这种市场环境下，日内交易的价格走势和交易机会更好（控制可接受的仓位就好）。大盘连续三天杀跌1%，反弹估计也是类似的轧空大涨，有波动就是非常好的做期权日内机会。在美国做不了合约，做做日内倒是挺好的。然后博反弹可以用看涨期权博，等诱多到了关键均线高位再大仓位做空","en":"确实，在这种市场环境下，日内交易的价格走势和交易机会更好（控制可接受的仓位就好）。大盘连续三天杀跌1%，反弹估计也是类似的轧空大涨，有波动就是非常好的做期权日内机会。在美国做不了合约，做做日内倒是挺好的。然后博反弹可以用看涨期权博，等诱多到了关键均线高位再大仓位做空","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ArtofSpecuycky/status/2122860058417811897","l":[],"ln":[],"t":[],"lk":7,"rt":2,"rp":0,"vw":3148},{"id":"2122858939792740644","h":"cnfinancewatch","ts":1794963986,"zh":"A股盘前第二版\n七点档的主结论还在，但外盘已经比当时热闹得多。第一版看到的美股指期货只是相对周二结算小幅翻红，现在标普500期货约7413点，较结算涨约0.72%；\n#纳指期货约27454点涨约1.40%；道指期货约50976点，涨约0.32%。\n亚洲开盘把这笔账做得更清楚：日经225约59448点，涨1.0%；韩国综指约5111点，#涨约2.87%，一度接近3%，昨天跌破的5000点已经收回。日本芯片股和软银集团早盘大涨，韩国三星电子、海力士和三星电机也明显走强。\n#三个方向不变：\n银行与红利、\n家电与必选消费、\n半导体制造的事件反弹。\n变化在于，第三方向的高开可能会比第一版预想的更猛，更要守住只观察、不追高，尤其不能把已经伤很重的CPO一并带进去。\n#消息面 两小时更新\n英伟达盘后涨幅一度扩大到约5%，临时CEO继续强调需求至少延伸到2028年，云业务未交订单约2.5万亿美元，并上调2028财年营收增长预期至75%。新出来的干扰也不少。做空机构浑水在财报前宣布做空英伟达，发布报告质疑其前全球现场运营高管与超微电脑前高管可能存在未披露关联，并把问题指向对华销售风险；浑水自己写明，相关身份尚未证实，两人也未被刑事指控。这是转述，不是已坐实的指控，但足够提醒：财报数字好，不等于开盘就能把位置问题一笔勾掉。另据报道，黄仁勋已同意出席美国参议院银行委员会听证会，日期未定。贝佐斯则称，若黄仁勋无法回归，英伟达应从内部寻找新CEO。Anthropic\nIPO仍被传超额认购10至20倍，发行价可能高于每股80美元，这是本周另一只靴子，不是今天开盘的加仓理由。10年期美债收益率在5%附近已经停留约27天，接近2007年的纪录，这根绳子并没有因为期货翻红就松开。\n国内可交易的新信息，更接近风险提示。截至11月17日，两市融资余额22097.71亿元，再减186.04亿元，沪市减78.24亿元、深市减107.8亿元，杠杆还在撤。\n#瀛通通讯 $002861 六天四板后公告，智能眼镜只是少量代工、收入占比不足1%，并提示情绪过热，热榜仍排在前二十，开盘不碰。短剧影视这边，\n#文投控股 $600715 、 #凯撒文化 $002425\n还在人气榜前排，改变不了昨天已经兑现的风险，一律不抄。集合竞价要到9点15分以后才有，截稿前无法采集，开盘强弱以9点25分竞价结果为准。\n#研报面 两小时更新\n今早和新结构更贴的，还是半导体设备与消费。#中信建投称半导体设备、材料和零部件板块业绩有望加速；华龙证券电子行业三季报综述认为自主可控加速兑现；国金证券优先看好国内存储渗透。这些报告只能当作事件反弹的背景，盖不住5日、20日仍在下跌的ETF位置，也不能覆盖浑水报告带来的情绪扰动。\n太平洋证券买入\n#晶晨股份 $688099 、 #全志科技 $300458 ，逻辑是端侧AI，不构成另开主线；\n同门还买入 #永和股份 $605020 、\n#安井食品 $603345 、 #宝立食品 $603170\n，后两只和必选消费同向，只作观察。\n#华泰看好国内储能中长期需求，#中信证券称原奶周期进入上行、稀土供需向好，都记在观察栏，不改今天三个方向。\n#热榜 两小时更新\n东财人气榜前排仍是 \n#华胜天成 $600410 、 #长虹美菱 $000521 、 #西陇科学 $002584 、 #九阳股份\n$002242 、 #有研新材 $600206 、 #华东重机 $002685 、 #海立股份 $600619 、 #中际旭创\n$300308 ， #小熊电器 $002959 、 #顺钠股份 $000533\n进入前十。\n和第一版相比，长虹美菱前移、九阳后撤，小家电和电子化学品还是最拥挤的一端。 \n#中际旭创 $300308\n仍在前十，但昨天继续收跌，热度和位置背离没有修复。同花顺热榜本档数据缺失。","en":"A股盘前第二版\n七点档的主结论还在，但外盘已经比当时热闹得多。第一版看到的美股指期货只是相对周二结算小幅翻红，现在标普500期货约7413点，较结算涨约0.72%；\n#纳指期货约27454点涨约1.40%；道指期货约50976点，涨约0.32%。\n亚洲开盘把这笔账做得更清楚：日经225约59448点，涨1.0%；韩国综指约5111点，#涨约2.87%，一度接近3%，昨天跌破的5000点已经收回。日本芯片股和软银集团早盘大涨，韩国三星电子、海力士和三星电机也明显走强。\n#三个方向不变：\n银行与红利、\n家电与必选消费、\n半导体制造的事件反弹。\n变化在于，第三方向的高开可能会比第一版预想的更猛，更要守住只观察、不追高，尤其不能把已经伤很重的CPO一并带进去。\n#消息面 两小时更新\n英伟达盘后涨幅一度扩大到约5%，临时CEO继续强调需求至少延伸到2028年，云业务未交订单约2.5万亿美元，并上调2028财年营收增长预期至75%。新出来的干扰也不少。做空机构浑水在财报前宣布做空英伟达，发布报告质疑其前全球现场运营高管与超微电脑前高管可能存在未披露关联，并把问题指向对华销售风险；浑水自己写明，相关身份尚未证实，两人也未被刑事指控。这是转述，不是已坐实的指控，但足够提醒：财报数字好，不等于开盘就能把位置问题一笔勾掉。另据报道，黄仁勋已同意出席美国参议院银行委员会听证会，日期未定。贝佐斯则称，若黄仁勋无法回归，英伟达应从内部寻找新CEO。Anthropic\nIPO仍被传超额认购10至20倍，发行价可能高于每股80美元，这是本周另一只靴子，不是今天开盘的加仓理由。10年期美债收益率在5%附近已经停留约27天，接近2007年的纪录，这根绳子并没有因为期货翻红就松开。\n国内可交易的新信息，更接近风险提示。截至11月17日，两市融资余额22097.71亿元，再减186.04亿元，沪市减7 ,"rt":0,"rp":0,"vw":1608},{"id":"2122855528108089408","h":"bboczeng","ts":1794963173,"zh":"地球已经疯了，我打算彻底离开","en":"地球已经疯了，我打算彻底离开","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122855528108089408","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":1055},{"id":"2122854898295599512","h":"fxtrader","ts":1794963023,"zh":"据CNN报道，美国国家安全局（NSA）内部传输、存储和共享机密情报的通讯网络NSANet突然出现大规模故障。\n交叉信源分别指出，此次故障发生在系统补丁更新期间，而华盛顿邮报更是提及NSA近期完成了微软Office 365的平台升级。\n#观察 美国最近一周密集出现了重要信息系统故障，值得调查一下。","en":"据CNN报道，美国国家安全局（NSA）内部传输、存储和共享机密情报的通讯网络NSANet突然出现大规模故障。\n交叉信源分别指出，此次故障发生在系统补丁更新期间，而华盛顿邮报更是提及NSA近期完成了微软Office 365的平台升级。\n#观察 美国最近一周密集出现了重要信息系统故障，值得调查一下。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXj7CubMAAtLMx.jpg?name=orig","https://pbs.twimg.com/media/HXXknMtbIAAuyID.png?name=orig"],"u":"https://x.com/fxtrader/status/2122854898295599512","l":[],"ln":[],"t":[],"lk":4,"rt":2,"rp":4,"vw":4014},{"id":"2122853536098877505","h":"cnfinancewatch","ts":1794962698,"zh":"#隔夜美股映射\n（一）美股去重榜前10领涨方向为交通运输航运JETS 20日+8.25%、水业FIW +7.56%、基建BILD +5.58%，但隔夜美股主要指数全线收跌，标普-1.03%、道指-1.64%，20日强势与隔夜方向背离。\n（二）映射个股须方向在美股去重榜前10且隔夜该方向收涨：昨日美股上涨板块仅能源油气UNG +2.24%、交通运输航运BDRY +2.06%、贵金属GDX +0.79%三个方向收涨，其中交通运输航运BDRY与去重榜JETS同向，权重上调一档，对应A股中远海控。\n（三）冲突处理：美股20日强势的消费、创新药隔夜均收跌（XLP -1.23%、IHI -1.06%），美股半导体博通昨+2.46%为带动性热股第一，虽不在去重榜前10，但隔夜方向明确，A股半导体设备K线未远离5日线，映射正确且位置可做，权重上调。\n#韩日开盘映射\n（一）韩国KOSPI 5124.17（+0.46%），日经225 59335.76（-0.55%），韩强日弱。\n（二）韩国存储半导体均+5.24%（SK海力士+5.97%、三星电子+4.52%），半导体设备与存储最强；日本半导体设备均+4.00%（爱德万测试+4.67%、迪思科+4.31%、东京电子+3.01%），精密制造均+0.53%，金融均-0.07%。\n（三）韩股存储强提高A股存储、半导体设备、封测权重；日股半导体设备强提高A股设备、材料权重，两者同向共振。\n（四）韩日半导体方向与隔夜美股博通+2.46%一致，定当日最高优先级；日经指数本身-0.55%与板块强势背离，仅作板块层面确认，指数层面降权。\n（五）韩日数据只用于确认半导体方向，不直接作买入理由。\n六、大盘风险开关\n（一）环境分42分，降仓档，只做回踩低吸不做追高。\n（二）指数位置：上证3584.58低于MA5 3631.59（-1.29%）、MA10 3650.77（-1.81%）、MA20 3654.66（-1.92%），沪深300、中证500、中证1000全部在5日线与10日线下方，中证1000偏离MA20达-5.83%最弱，属小盘弱势、权重相对抗跌格局。\n（三）期货升贴水：未获取。\n（四）涨跌停结构：窗口内龙虎榜涨停股以游资普通席位为主，成功率多在30%至45%，机构上榜多为卖出或分歧，赚钱效应一般，未见明显恶化但也无强势连板高度数据。\n（五）外盘冲击：隔夜美股三大指数收跌，日经-0.55%，仅韩国+0.46%与半导体板块强，外盘整体偏空但半导体结构性偏多。\n（六）综合：指数在均线下方、小盘弱、外盘偏空，环境分42分，降仓，只做半导体设备与消费的回踩低吸。\n#五大机构研报（窗口内）\n（一）华泰证券，11月18日，《互联网行业关注纯工具类平台和硬切软逻辑》，关注AI基础设施投入ROI边际变化。\n（二）中信证券，11月18日，《原奶周期进入上行通道 保持对牧业板块的推荐》，奶价终结五年下行。\n（三）中信证券，11月18日，《稀土行业供需向好 关注板块配置价值》，板块调整后配置价值凸显。\n（四）中信建投，11月18日，《半导体设备、材料、零部件板块业绩有望加速》，Q3半导体单季归母净利增速516%。\n（五）中信建投，11月17日，《十月底低点大概率已是本轮市场底，11月开启进二退一修复行情》，估值偏低。\n（六）中金公司，11月17日，《当前至12月有望迎来修复行情》，换手率降至3.6%，ETF净流入积极。\n（七）华泰证券，11月17日，《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》，必选与可选消费景气改善居前。\n（八）中信建投，11月16日，《注意估值风格切换的年末行情特征》，低估值盈利确定板块年末胜率高。\n#研报互证\n（一）方向一半导体设备与存储：互证结论月内强支撑。中信建投11月18日《半导体设备、材料、零部件板块业绩有望加速》直接覆盖设备材料；中信建投11月16日《持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现》覆盖算力硬件；中泰证券11月13日《AI产业趋势远未终结》覆盖电子。多家机构同向，方向权重上调一档。\n（二）方向二消费：互证结论月内强支撑。华泰证券11月17日《内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续》直接覆盖；中信证券11月18日《原奶周期进入上行通道 保持对牧业板块的推荐》覆盖食品农业链。两家同向，方向权重上调一档。\n（三）方向三军工航天：互证结论月内无支撑。近一个月华泰、中信建投、中信、中泰、中金五家研报库无军工航天直接覆盖，权重下调一档，仅作补涨观察。\n（四）主选股华海清科：月内强支撑，中信建投11月18日半导体设备研报覆盖设备环节，逻辑一致，权重上调。\n（五）主选股安井食品：月内单一支撑，华泰证券11月17日内需消费研报覆盖必选消费方向，未直接点名个股，维持原权重。\n（六）主选股中航光电：月内无支撑，五家机构近一个月无军工覆盖，权重下调，若同时与ETF榜不符则剔除，本方向仅美股AV映射、A股未进榜，降为观察性配置。\n（七）被研报否掉或剔除的标的：AI算力软件方向虽有多份研报支撑，但今日短线候选池该方向可作短线为零，行情数据与研报观点冲突，以行情为准，剔除；光伏储能方向研报有中信证券11月17日《储能发展规划出台》支撑，但A股同主题未进榜且候选池无达标个股，剔除。","en":"#隔夜美股映射\n（一）美股去重榜前10领涨方向为交通运输航运JETS 20日+8.25%、水业FIW +7.56%、基建BILD +5.58%，但隔夜美股主要指数全线收跌，标普-1.03%、道指-1.64%，20日强势与隔夜方向背离。\n（二）映射个股须方向在美股去重榜前10且隔夜该方向收涨：昨日美股上涨板块仅能源油气UNG +2.24%、交通运输航运BDRY +2.06%、贵金属GDX +0.79%三个方向收涨，其中交通运输航运BDRY与去重榜JETS同向，权重上调一档，对应A股中远海控。\n（三）冲突处理：美股20日强势的消费、创新药隔夜均收跌（XLP -1.23%、IHI -1.06%），美股半导体博通昨+2.46%为带动性热股第一，虽不在去重榜前10，但隔夜方向明确，A股半导体设备K线未远离5日线，映射正确且位置可做，权重上调。\n#韩日开盘映射\n（一）韩国KOSPI 5124.17（+0.46%），日经225 59335.76（-0.55%），韩强日弱。\n（二）韩国存储半导体均+5.24%（SK海力士+5.97%、三星电子+4.52%），半导体设备与存储最强；日本半导体设备均+4.00%（爱德万测试+4.67%、迪思科+4.31%、东京电子+3.01%），精密制造均+0.53%，金融均-0.07%。\n（三）韩股存储强提高A股存储、半导体设备、封测权重；日股半导体设备强提高A股设备、材料权重，两者同向共振。\n（四）韩日半导体方向与隔夜美股博通+2.46%一致，定当日最高优先级；日经指数本身-0.55%与板块强势背离，仅作板块层面确认，指数层面降权。\n（五）韩日数据只用于确认半导体方向，不直接作买入理由。\n六、大盘风险开关\n（一）环境分42分，降仓档，只做回踩低吸不做  64 天。公司的说法是一部分是因为 Rubin 出货节奏，一部分是给某些大客户的账期更长。\n这一季财报黄仁勋还在任。老黄对英伟达影响要看下一季了。股价盘后涨超 4%，现在有所回落，我觉得作为反弹不算小，但放在这次财报前的预期里，又有点克制了，继续看今晚正式开盘后的走势。\n买美股、加密货币用OKX，本条由@okxchinese赞助。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXbG5hawAA6iK6.jpg?name=orig"],"u":"https://x.com/LucyBuilding/status/2122847494073934005","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":480},{"id":"2122846131453661578","h":"cnfinancewatch","ts":1794960932,"zh":"散户热议｜2026-11-18·早间\n数据时点：国内社区以11月17日收盘后至11月18日07:50前可见的公开帖为准；海外统计抓取于北京时间今早。本期邮箱新增一封11月17日晚间热点财经邮件，早间邮件截稿未到。韭研公社热帖列表可以打开，但针对今早英伟达财报的时间轴帖打开时暂无评论；国内讨论因此主要依据淘股吧收盘后的复盘，以及韭研17日下午到晚间仍在消化国产替代与出口管制的帖文。WallStreetBets帖文正文未能直接完整抓取，情绪统计来自StonkHub二手页面，已注明；Stocktwits英伟达个股页可以打开，情绪值为平台标示，不是我们自行计算的投票。\n国内：17日收盘的 #情绪是冰点，不是修复完成\n淘股吧“庄哥说股”11月17日16:57的《11.18盘前推演:77家跌停！九阳地天板！明天只有一种可能性！》，发帖时英伟达还没出数，页面显示浏览约8077次。作者写得很难受：上证只跌0.50%，但下跌约4119家、跌停约77家、涨停37家，两市成交约1.46万亿元继续缩量；早盘半导体和九阳涨停让人看到希望，午后又把希望收走。他把压力分成三层：#外围科技不确定性、量能不够、#高位题材亏钱效应连锁——文投控股跌停，吉视传媒大跌，北纬科技断板，#短剧和机器人继续补跌。对 #九阳股份，他记的是低开28.26元、盘中触及跌停，最终封在31.52元，走出地天板，并称之为“总龙头地位的再次确认”，但也提醒20%振幅说明风险不小。热门榜里，#华胜天成收涨停、三天两板；#有研新材涨停被视为材料方向的新强点；中际旭创跌3.90%、成交204.75亿元，仍被写成“机构恐慌出逃、趋势向下”；凯撒文化地天后炸板，被标成次日危险。对今天的预案，他看 #支撑3550点、3530点，压力3600点、3630点，最想先看跌停数量能否下来、指数能否收回3600，#再看九阳的承接、#有研新材和华胜天成有没有板块响应、#中际旭创能不能稳住。这些是出数前的社区预案，不是已经消化过财报的新共识。上述涨跌停和成交是社区口径，与金十统计的全天成交14576.95亿元、涨停37只大体相近，跌停家数我们未与交易所逐一核对。\n#最强主线写成国产替代，并称光刻胶涨幅靠前，催化是美国拟封堵通过海外数据中心远程获取算力，以及外交部、商务部的回应。另一篇16:49的盘面帖同时转述了SemiAnalysis大幅下调未来数年AI加速器资本开支预测，以及“董事会没有在考虑让黄仁勋回任”的消息。昇腾、光刻材料、华东重机、华胜天成、寒武纪、海光信息等名字仍在被来回点。针对“英伟达财报”的时间轴帖由@韭连板在11月18日凌晨发布，我们打开时页面显示暂无评论，因此不能把“公社已经形成统一看多或看空”写成事实。抓取范围有限，这里不编造更多引语。\n与券商口径的异同：#相同点是都看见了国产替代和制造、设备、材料的活口，也都没有把光模块写成同步修复。不同点是社区更愿意把#九阳地天板、#华东重机连板理解成情绪锚点和“明天可以继续做高度”，分析口径则更强调这是亏钱效应还没收敛时的局部高潮。被忽略的风险有三：一是把今早可能出现的科技高开，直接理解成风格已经切回成长，去追昨天已经涨停的有研新材、连板的华东重机，或者补涨还没企稳的中际旭创；二 #是在文投慈文跌停后再去抄短剧，把风险提示当成利空出尽；三是忽略毛利率指引下修和中国数据中心收入缺失，只记住“营收翻倍”。\n海外：持股社区在盘后欢呼，但七日统计仍略偏空\nStonkHub（二手，页面今早抓取）显示，过去7天有1101名WallStreetBets用户讨论英伟达，提及1507次，人数较上周的474人升132%。全Reddit口径下，7日共2608次提及，看多35.7%（930次）、中性23.0%、#看空41.3%（1077次），分类器平均置信度64%，不宜过度解读。统计还显示，讨论最密的一小时仍是美东17日16时，也就是常规交易收盘、财报尚未公布的时点。也就是说，这组略偏空的数字，主要反映的是财报前一周的恐惧，不能直接当成盘后投票。页面列出的高赞标题包括黄仁勋表态愿意回归，需要和董事会主席“不打算让他复职”分开看：前者是他本人的条件句，后者才是公司在电话会上的正式口径。\nStocktwits英伟达个股页可以直接打开。平台标示情绪为93、极端看多，关注人数约68.84万，并给出盘后报价约161.55美元、较收盘155.46美元涨约3.92%。评论区分化很清楚：有人写“空头完蛋了”“市盈率只有19”，把超预期和回购授权理解成反转；也有人提醒，盘后量不大、董事会强调不会让黄仁勋复职，担心次日开盘才是机构兑现的时候。这和七日WSB统计并不矛盾——持股社区在股价已经大跌之后，更愿意把一份超预期财报当成转折；期权和短线玩家在出数前更怕波动，七日窗口里看空仍略占上风。\n专业资金的制约，散户讨论里出现得更少：四季度毛利率指引下调到71%至72%，指引仍不含中国数据中心计算收入，Anthropic上市还在后头。A股散户若只把盘后涨3.9%理解成“外部利好已经落地，今天可以追连板和光模块”，就会把两套不同的交易揉在一起。\n小结：国内短线还停在17日冰点复盘和国产替代活口，海外持股社区已经在盘后欢呼，但七日统计仍偏谨慎。","en":"散户热议｜2026-11-18·早间\n数据时点：国内社区以11月17日收盘后至11月18日07:50前可见的公开帖为准；海外统计抓取于北京时间今早。本期邮箱新增一封11月17日晚间热点财经邮件，早间邮件截稿未到。韭研公社热帖列表可以打开，但针对今早英伟达财报的时间轴帖打开时暂无评论；国内讨论因此主要依据淘股吧收盘后的复盘，以及韭研17日下午到晚间仍在消化国产替代与出口管制的帖文。WallStreetBets帖文正文未能直接完整抓取，情绪统计来自StonkHub二手页面，已注明；Stocktwits英伟达个股页可以打开，情绪值为平台标示，不是我们自行计算的投票。\n国内：17日收盘的 #情绪是冰点，不是修复完成\n淘股吧“庄哥说股”11月17日16:57的《11.18盘前推演:77家跌停！九阳地天板！明天只有一种可能性！》，发帖时英伟达还没出数，页面显示浏览约8077次。作者写得很难受：上证只跌0.50%，但下跌约4119家、跌停约77家、涨停37家，两市成交约1.46万亿元继续缩量；早盘半导体和九阳涨停让人看到希望，午后又把希望收走。他把压力分成三层：#外围科技不确定性、量能不够、#高位题材亏钱效应连锁——文投控股跌停，吉视传媒大跌，北纬科技断板，#短剧和机器人继续补跌。对 #九阳股份，他记的是低开28.26元、盘中触及跌停，最终封在31.52元，走出地天板，并称之为“总龙头地位的再次确认”，但也提醒20%振幅说明风险不小。热门榜里，#华胜天成收涨停、三天两板；#有研新材涨停被视为材料方向的新强点；中际旭创跌3.90%、成交204.75亿元，仍被写成“机构恐慌出逃、趋势向下”；凯撒文化地天后炸板，被标成次日危险。对今天的预案，他看 #支撑3550点、3530点，压力3600点、3630点，最想先看跌停数量能否下来、指数能否收回3600，#再看九阳的承接、#有研新材和华胜天成有没有板块响应、#中际旭创能不能稳住。这些是出数前的社区预案，不是已经消化过财报的新共识。上述涨跌停和成交是社区口径，与金十统计的全天成交14576.95亿元、涨停37只大体相近，跌停家数我们未与交易所逐一核对。\n#最强主线写成国产替代，并称光刻胶涨幅靠前，催化是美国拟封堵通过海外数据中心远程获取算力，以及外交部、商务部的回应。另一篇16:49的盘面帖同时转述了SemiAnalysis大幅下调未来数年AI加速器资本开支预测，以及“董事会没有在考虑让黄仁勋回任”的消息。昇腾、光刻材料、华东重机、华胜天成、寒武纪、海光信息等名字仍在被来回点。针对“英伟达财报”的时间轴帖由@韭连板在11月18日凌晨发布，我们打开时页面显示暂无评论，因此不能把“公社已经形成统一看多或看空”写成事实。抓取范围有限，这里不编造更多引语。\n与券商口径的异同：#相同点是都看见了国产替代和制造、设备、材料的活口，也都没有把光模块写成同步修复。不同点是社区更愿意把#九阳地天板、#华东重机连板理解成情绪锚点和“明天可以继续做高度”，分析口径则更强调这是亏钱效应还没收敛时的局部高潮。被忽略的风险有三：一是把今早可能出现的科技高开，直接理解成风格已经切回成长，去追昨天已经涨停的有研新材、连板的华东重机，或者补涨还没企稳的中际旭创；二 #是在文投慈文跌停后再去抄短剧，把风险提示当成利空出尽；三是忽略毛利率指引下修和中国数据中心收入缺失，只记住“营收翻倍”。\n海外：持股社区在盘后欢呼，但七日统计仍略偏空\nStonkHub（二手，页面今早抓取）显示，过去7天有1101名WallStreetBets用户讨论英伟达，提及1507次，人数较上周的474人升132%。全Reddit口径下，7日共2608次提及，看多35.7%（930次）、中性23.0%、#看空41.3%（1077次），分类器平均置信度64%，不宜过度解读。统计还显示，讨论最密的一小时仍是美东17日16时，也就是常规交易收盘、财报尚未公布的时点。也就是说，这组略偏空的数字，主要反映的是财报前一周的恐惧，不能直接当成盘后投票。页面列出的高赞标题包括黄仁勋表态愿意回归，需要和董事会主席“不打算让他复职”分开看：前者是他本人的条件句，后者才是公司在电话会上的正式口径。\nStocktwits英伟达个股页可以直接打开。平台标示情绪为93、极端看多，关注人数约68.84万，并给出盘后报价约161.55美元、较收盘155.46美元涨约3.92%。评论区分化很清楚：有人写“空头完蛋了”“市盈率只有19”，把超预期和回购授权理解成反转；也有人提醒，盘后量不大、董事会强调不会让黄仁勋复职，担心次日开盘才是机构兑现的时候。这和七日WSB统计并不矛盾——持股社区在股价已经大跌之后，更愿意把一份超预期财报当成转折；期权和短线玩家在出数前更怕波动，七日窗口里看空仍略占上风。\n专业资金的制约，散户讨论里出现得更少：四季度毛利率指引下调到71%至72%，指引仍不含中国数据中心计算收入，Anthropic上市还在后头。A股散户若只把盘后涨3.9%理解成“外部利好已经落地，今天可以追连板和光模块”，就会把两套不同的交易揉在一起。\n小结：国内短线还停在17日冰点复盘和国产替代活口，海外持股社区已经在盘后欢呼，但七日统计仍偏谨慎。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122846131453661578","l":[],"ln":[],"t":["A股港股","AI科技","财报","关税贸易"],"lk":0,"rt":0,"rp":0,"vw":1423},{"id":"2122844812449874286","h":"cnfinancewatch","ts":1794960618,"zh":"三大利空方向（由强到弱）\n一、利率和流动性约束并没有被一份财报解除。已核实：美股11个主要行业全部收跌，金融跌1.87%，公用事业跌1.60%，连传统防守板块也没能幸免。纽约尾盘10年期美债收益率报5.0987%，仍在5.10%附近，盘中高见5.1494%；市场此前计价美联储12月加息25个基点的概率约96.8%。现货黄金约3849.59美元，仍靠近一年低位；美元指数17日收于103.485，当日微跌0.06%，所谓“创十八个月新高”更多是近日背景，不宜写成17日当天又创新高。WTI原油约85.74美元，已从更早的大跌中暂时稳住。英伟达自己也在用毛利率下修和“不含中国数据中心计算收入”提醒：增长还在，但质量预期和地缘约束没有消失。只要债券收益率不下来，成长股的估值修复就会反复被打折。\n二、CPO、光模块和已经受伤的AI硬件，不能自动兑现英伟达的超预期。晚间邮件把英伟达的影响直接映射到中际旭创、新易盛，这个映射在出数前就已和盘面脱节。已核实：台积电常规交易跌3.68%，软件指数IGV跌3.29%，阿里巴巴美股跌4.38%。创业板收盘跌破52周低位，说明成长股的亏钱效应还在指数层面确认。另一只靴子是Anthropic：CNBC援引消息称发行价可能高于70至78美元的指引区间，计划11月19日以代码ANT在纳斯达克上市；招股文件显示前九个月营收332.4亿美元，同期净亏损1040亿美元，其中大部分来自可转债和衍生工具公允价值变动。定价和首日表现会重新测量AI估值，不排除“英伟达数字很好、新股定价很贵、风险资产仍然摇摆”的组合。\n三、短剧影视和高位题材的亏钱效应还在扩散，不是“利空出尽”后的抄底窗口。已核实：文投控股跌9.89%，慈文传媒跌9.98%，横店影视跌停，短剧影视继风险提示之后继续兑现。人形机器人里，宇树科技跌11.97%，襄阳轴承跌10.01%；中国稀土跌10.00%。另一端则是局部高潮：阳光照明涨停并处于连板高位，华东重机三连板，华胜天成三天两板，九阳走出地天板。涨停少、跌停多，希望在上午给过一次、下午又收走，这是典型的容错率下降。复星医药董事长提议以2.5亿元至5亿元回购A股，对板块只是温和信号。今天如果因为英伟达高开去接力这些高位票，或者在跌停堆里捡短剧，证伪成本都会非常低。\n主要依据：英伟达2027财年三季报及电话会公开转述、家得宝官方业绩与任命公告、京东SEC附件、商务部与外交部公开表态、中国证券报所载上交所审核通过公告、海关出口数据的公开报道、新华社与美联社行情、金十成交统计、东方财富早餐中的利率与商品报价。以上为公开信息整理，不构成投资建议，投资有风险。","en":"三大利空方向（由强到弱）\n一、利率和流动性约束并没有被一份财报解除。已核实：美股11个主要行业全部收跌，金融跌1.87%，公用事业跌1.60%，连传统防守板块也没能幸免。纽约尾盘10年期美债收益率报5.0987%，仍在5.10%附近，盘中高见5.1494%；市场此前计价美联储12月加息25个基点的概率约96.8%。现货黄金约3849.59美元，仍靠近一年低位；美元指数17日收于103.485，当日微跌0.06%，所谓“创十八个月新高”更多是近日背景，不宜写成17日当天又创新高。WTI原油约85.74美元，已从更早的大跌中暂时稳住。英伟达自己也在用毛利率下修和“不含中国数据中心计算收入”提醒：增长还在，但质量预期和地缘约束没有消失。只要债券收益率不下来，成长股的估值修复就会反复被打折。\n二、CPO、光模块和已经受伤的AI硬件，不能自动兑现英伟达的超预期。晚间邮件把英伟达的影响直接映射到中际旭创、新易盛，这个映射在出数前就已和盘面脱节。已核实：台积电常规交易跌3.68%，软件指数IGV跌3.29%，阿里巴巴美股跌4.38%。创业板收盘跌破52周低位，说明成长股的亏钱效应还在指数层面确认。另一只靴子是Anthropic：CNBC援引消息称发行价可能高于70至78美元的指引区间，计划11月19日以代码ANT在纳斯达克上市；招股文件显示前九个月营收332.4亿美元，同期净亏损1040亿美元，其中大部分来自可转债和衍生工具公允价值变动。定价和首日表现会重新测量AI估值，不排除“英伟达数字很好、新股定价很贵、风险资产仍然摇摆”的组合。\n三、短剧影视和高位题材的亏钱效应还在扩散，不是“利空出尽”后的抄底窗口。已核实：文投控股跌9.89%，慈文传媒跌9.98%，横店影视跌停，短剧影视继风险提示之后继续兑现。人形机器人里，宇树科技跌11.97%，襄阳轴承跌10.01%；中国稀土跌10.00%。另一端则是局部高潮：阳光照明涨停并处于连板高位，华东重机三连板，华胜天成三天两板，九阳走出地天板。涨停少、跌停多，希望在上午给过一次、下午又收走，这是典型的容错率下降。复星医药董事长提议以2.5亿元至5亿元回购A股，对板块只是温和信号。今天如果因为英伟达高开去接力这些高位票，或者在跌停堆里捡短剧，证伪成本都会非常低。\n主要依据：英伟达2027财年三季报及电话会公开转述、家得宝官方业绩与任命公告、京东SEC附件、商务部与外交部公开表态、中国证券报所载上交所审核通过公告、海关出口数据的公开报道、新华社与美联社行情、金十成交统计、东方财富早餐中的利率与商品报价。以上为公开信息整理，不构成投资建议，投资有风险。","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/cnfinancewatch/status/2122844812449874286","l":[],"ln":[],"t":["美联储","美股","A股港股","汇率","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":199},{"id":"2122844632346501296","h":"cnfinancewatch","ts":1794960575,"zh":"热点财经新闻综述｜2026-11-18·早间\n数据时点：A股为11月17日收盘；美股为美东11月17日收盘，并以盘后公开报价补充英伟达财报反应；隔夜与今早消息整理截至北京时间11月18日07:50。本期邮箱新增一封热点财经邮件（11月17日晚间20:10版，位于垃圾邮件），11月18日早间邮件截稿未到。该晚间邮件写于英伟达出数之前，其中对财报的预判不能当成已落实结果。凡标“邮件转述”的内容未逐条核实，其余已对照英伟达、家得宝等公司公告、京东向SEC提交的财报、商务部与外交部公开信息、交易所审核公告、海关出口数据的公开报道，以及新华社、美联社行情和主流媒体报道。\n今日判断\n凌晨落地的英伟达财报，是今天唯一足够改写叙事的新信息，但还不够改写仓位结构。已核实：三季度营收1158亿美元，同比增103%、环比增20%；数据中心收入1076亿美元，同比增110%；非GAAP每股收益2.68美元，GAAP为2.70美元。第四季度营收指引中值1300亿美元、上下浮动3%，公司明确指引不含中国数据中心计算收入。当季GAAP和非GAAP毛利率分别为74.8%和74.9%，但四季度毛利率指引下调到71%至72%。电话会上，临时CEO克雷斯把2028财年营收增长预期上调到75%，并称“一切照常”；董事会主席则明确表示，不打算让黄仁勋复职。黄仁勋本人在辞职后的首份声明里说，若董事会认为回归符合股东、员工、公司和美国利益，他愿意回来——这是他的态度，不是董事会的决定，两句话不能并成“马上回归”。财报还披露，董事会已于今年9月将回购授权上调1500亿美元，三季度回购加派息281亿美元，截至季末剩余授权约2273亿美元。\n常规交易里，英伟达收155.46美元，跌0.44%；盘后公开报价约161.55美元，涨约3.9%，盘后一度接近4%。数字是超预期的，盘后也给了反应，但美股三大指数昨天仍是四连跌：道指跌1.64%报50759.42点，标普500跌1.03%报7340.53点，纳指跌0.74%报24328.38点，11个主要行业全部收跌。A股昨天已经先走完自己的结构：上证跌0.50%报3584.58点，再失3600；创业板跌1.20%报2292.20点，收盘跌破52周低位；科创50反而涨0.62%。资金提前买的是制造、设备和材料，不是光模块。所以今天的基调很清楚：不要把超预期理解成成长风格已经反转。相对更稳的仍是银行红利和家电；半导体制造和设备只当成事件反弹观察，开盘不追；CPO和已经地天板、连板的题材票，不要并进同一笔交易。Anthropic的定价和上市也在这两天落地，是另一只靴子。\n三大利多方向（由强到弱）\n一、半导体制造、设备与材料的国产替代，是事件上最有弹性的方向，但必须和光模块拆开看。已核实：中芯国际三季度销售收入31.9亿美元，同比增33.9%，产能利用率升至97.3%；昨天中芯国际涨6.59%，华虹公司涨10.39%，北方华创涨4.09%，有研新材涨停，半导体板块主力净流入约29.6亿元，从上一交易日的流出第一转为流入第一。美国商务部本周公布新规，限制中国企业通过新加坡、马来西亚、泰国、印尼、巴西等地数据中心远程获取先进算力，存量业务须在90天内申请许可；中国商务部表示若美方一意孤行将采取反制，外交部称之为典型的经济胁迫和“长臂管辖”。这解释了为什么昨天修复的是国产制造和材料，而不是和英伟达订单绑定更紧的光模块——中际旭创跌3.90%，成交额204.75亿元居两市第一，新易盛跌4.08%。制约就在同一份财报里：毛利率指引下修、中国数据中心计算收入继续不计入、董事会人事并未“恢复原状”。有研新材已经涨停，中芯、华虹若高开后不能站稳，就是脉冲结束，而不是新趋势开始。开盘不追，更不要把CPO一并抬进去。\n二、家电与必选消费，是少数既有出口数字、又还没被亏钱效应打穿的方向。已核实：海关口径下，2026年10月家电出口4.02亿台，同比增14.1%，出口金额89.56亿美元，同比增20.9%，金额增速继续抬升。昨天美的集团涨0.70%，小家电里长虹美菱、小熊电器继续活跃。家得宝三季度销售额434亿美元，增4.9%，美国同店增2.2%，调整后每股收益3.86美元，并更新全年销售增长约4.5%、调整后每股收益增速约2.0%的指引，同时宣布财务总监麦克费尔将于11月23日接任CEO；但股价仍收跌约2.4%，报339美元附近，说明美股把“略超预期+换帅”理解成卖出机会，不能简单映射成A股家居建材要跟涨。真正该看的是出口链龙头，而不是已经走出地天板的九阳股份——该股昨天低开后触及跌停，再拉至涨停，淘股吧复盘记低开28.26元、收31.52元，振幅约20%，这是方向里已经拥挤的一端。制约：高位小家电和“羊”字辈的接力资金，随时可能被半导体高开抽走。\n三、银行与红利仍是防守底仓，但高位已经开始兑现。已核实：昨天工商银行涨0.11%，多只银行股仍在历史新高附近，但银行板块主力净流出约13.5亿元。上证失守3600，沪深成交14576.95亿元，再缩267.95亿元。东吴证券收购东海证券事项已获上交所并购重组委通过，交易对价约115.19亿元，后续仍待证监会注册，这只是券商整合的增量，改变不了昨天的缩量结构。\n邮件转述称尾盘有212亿元资金涌入宽基ETF、创业板ETF广发成交超50亿元创出天量。","en":"热点财经新闻综述｜2026-11-18·早间\n数据时点：A股为11月17日收盘；美股为美东11月17日收盘，并以盘后公开报价补充英伟达财报反应；隔夜与今早消息整理截至北京时间11月18日07:50。本期邮箱新增一封热点财经邮件（11月17日晚间20:10版，位于垃圾邮件），11月18日早间邮件截稿未到。该晚间邮件写于英伟达出数之前，其中对财报的预判不能当 \n邮件转述称尾盘有212亿元资金涌入宽基ETF、创业板ETF广发成交超50亿元创出天量。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122844632346501296","l":[],"ln":[],"t":["美股","A股港股","AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":246},{"id":"2122842560238686454","h":"dmjk001","ts":1794960081,"zh":"英伟达新任临时首席执行官Colette Kress向员工发送电子邮件表示，将于太平洋时间11月18日上午9点（北京时间19日凌晨1点）召开公司会议。","en":"英伟达新任临时首席执行官Colette Kress向员工发送电子邮件表示，将于太平洋时间11月18日上午9点（北京时间19日凌晨1点）召开公司会议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122842560238686454","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":686},{"id":"2122841034476675374","h":"bboczeng","ts":1794959717,"zh":"Gensler 警告：AI 热潮已是泡沫，终将破裂\n前美国证券交易委员会（SEC）主席加里·根斯勒（Gary Gensler）称，AI 热潮是一个泡沫，其背后是每年 8000 亿美元的基础设施支出，规模过大，部分环节还背负着债务。\n他预测经济将陷入衰退，程度可能比 2008 年温和，但与 2000 年代初的互联网泡沫破裂相似：大型科技公司将挺过去，规模较小的云服务提供商则会被整合或倒闭。\n美联储的凯文·沃什（Kevin Warsh）勾勒了三种 AI 情景，从生产率提升到就业岗位流失，再到热潮退去后的失望；与此同时，在通胀降温和油价下跌的背景下，市场大举押注 12 月加息。投资者彼得·席夫（Peter Schiff）警告称，由于美联储过去的政策，所有资产都存在泡沫。","en":"Gensler 警告：AI 热潮已是泡沫，终将破裂\n前美国证券交易委员会（SEC）主席加里·根斯勒（Gary Gensler）称，AI 热潮是一个泡沫，其背后是每年 8000 亿美元的基础设施支出，规模过大，部分环节还背负着债务。\n他预测经济将陷入衰退，程度可能比 2008 年温和，但与 2000 年代初的互联网泡沫破裂相似：大型科技公司将挺过去，规模较小的云服务提供商则会被整合或倒闭。\n美联储的凯文·沃什（Kevin Warsh）勾勒了三种 AI 情景，从生产率提升到就业岗位流失，再到热潮退去后的失望；与此同时，在通胀降温和油价下跌的背景下，市场大举押注 12 月加息。投资者彼得·席夫（Peter Schiff）警告称，由于美联储过去的政策，所有资产都存在泡沫。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122841034476675374","l":[],"ln":[],"t":["美联储","通胀","原油能源","AI科技"],"lk":4,"rt":0,"rp":1,"vw":939},{"id":"2122840828473410042","h":"dmjk001","ts":1794959668,"zh":"路透：英伟达董事长表示董事会不会重新聘请黄仁勋担任 CEO\n英伟达董事会主席哈维·琼斯在周二的投资者电话会议开场时表示，这家 AI 芯片公司不会重新聘请联合创始人黄仁勋担任 CEO，也不会回答有关他离职的问题。\n琼斯表示，董事会已聘请高管猎头公司海德思哲协助寻找新任 CEO。“我们希望尽快任命 CEO，即常任 CEO，但在找到完全合适的人选之前，我们不会仓促推进，”他补充道。","en":"路透：英伟达董事长表示董事会不会重新聘请黄仁勋担任 CEO\n英伟达董事会主席哈维·琼斯在周二的投资者电话会议开场时表示，这家 AI 芯片公司不会重新聘请联合创始人黄仁勋担任 CEO，也不会回答有关他离职的问题。\n琼斯表示，董事会已聘请高管猎头公司海德思哲协助寻找新任 CEO。“我们希望尽快任命 CEO，即常任 CEO，但在找到完全合适的人选之前，我们不会仓促推进，”他补充道。","zh_src":"native","lang":" hen或Cenly Puri的女子，是否就是曾在美超微任职的那位Cenly Chen。","en":"浑水正式开始做空英伟达\n一名被认定为Cenly Chen的女子（在部分照片标注中被称为Cenly Puri），在2024年至2026年间多次与Ajay K. Puri一同被拍到出现在公共场合。\n直到今年6月，Puri先生很可能都是英伟达的第三号高管，仅次于黄仁勋和Colette Kress。他的职位是全球现场运营执行副总裁（EVP Worldwide Field Operations），在2024至2026财年的总薪酬略高于Kress女士。\nPuri先生是2026年委托书中点名的仅有五位英伟达高管之一。\n另外，2026年10月针对美超微（SMCI）提起的合并集体诉讼起诉书称，美超微前首席增长官、一名叫Cenly Chen的女子\"负责管理SMCI从英伟达采购GPU芯片\"，并\"决定如何在美超微的客户之间分配英伟达的GPU\"。\n今年3月，美国对与美超微有关的三人提起刑事指控，其中包括一名联合创始人，指控他们通过一家东南亚的空壳公司，向中国最终客户非法销售至少约25亿美元搭载英伟达GPU的美超微服务器。针对这名美超微前高管，集体诉讼起诉书称，\"Cenly Chen不可能不知道SMCI的非法销售\"。\nPuri先生于2026年6月下旬离开英伟达，而名为Cenly Chen的美超微前高管于2026年4月底或5月初离开美超微。Puri先生目前仍在英伟达担任高级顾问职务。\n目前没有任何政府对名为Cenly Chen的人提起刑事指控或作出其他刑事指控。集体诉讼中的指控尚未得到证实。\n问题在于：照片中与Puri先生同框、被认定为Cenly Chen或Cenly Puri的女子，是否就是曾在美超微任职的那位Cenly Chen。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122808331026981192","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1140},{"id":"2122807361954054146","h":"Balder13946731","ts":1794951689,"zh":"小小的不妙🫪 财报发布以后的交易量比过去8次财报都低很多。","en":"小小的不妙🫪 财报发布以后的交易量比过去8次财报都低很多。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2122807361954054146","l":[],"ln":[],"t":["财报"],"lk":6,"rt":0,"rp":0,"vw":543},{"id":"2122807314071933041","h":"bboczeng","ts":1794951678,"zh":"我现在怀疑这位babybus和我初中班上那群不学无术，最后辍学的同学差不多\n乐天派，脸皮厚，声音还特别大\n天天呵呵呵哈哈哈，舒服了，你看他的用词造句，像是受过教育的样子吗？\n说话连换行都不会，就不要指望他能有什么学历了\n当然不是说学历高就怎么样，\n但没有接受过正规教育的人，更容易成为纯粹的赌徒\n因为或许本来就什么都没有\n怕不是人天天泡在网吧里打游戏？\n推特真的牛逼，一个账号背后，是人是狗你都不知道\n我是看一个识破一个\n不知道你们能不能有这样的水平\n😅😅😅","en":"我现在怀疑这位babybus和我初中班上那群不学无术，最后辍学的同学差不多\n乐天派，脸皮厚，声音还特别大\n天天呵呵呵哈哈哈，舒服了，你看他的用词造句，像是受过教育的样子吗？\n说话连换行都不会，就不要指望他能有什么学历了\n当然不是说学历高就怎么样，\n但没有接受过正规教育的人，更容易成为纯粹的赌徒\n因为或许本来就什么都没有\n怕不是人天天泡在网吧里打游戏？\n推特真的牛逼，一个账号背后，是人是狗你都不知道\n我是看一个识破一个\n不知道你们能不能有这样的水平\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122807314071933041","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":104},{"id":"2122806330566254998","h":"Balder13946731","ts":1794951443,"zh": 片部署在第三国数据中心，中国企业再通过互联网远程调用算力训练模型，而无须把相关硬件运入中国。","en":"在美国限制最先进英伟达芯片直接销往中国的背景下，中国大型互联网公司和AI实验室逐渐转向“只租算力、不买硬件”的模式。芯片部署在第三国数据中心，中国企业再通过互联网远程调用算力训练模型，而无须把相关硬件运入中国。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122739099945541834","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4iN6OzR","d":"bbc.in"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":529},{"id":"2122738837114007726","h":"ShanghaoJin","ts":1794935352,"zh":"很少有辞职几天就立马表态愿意回去的，感觉是跟Trump谈好了\n但是现在台上代理的几个“节度使”肯定不愿意他回去了。不回去，他们就成永远“选侯”了","en":"很少有辞职几天就立马表态愿意回去的，感觉是跟Trump谈好了\n但是现在台上代理的几个“节度使”肯定不愿意他回去了。不回去，他们就成永远“选侯”了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2122738837114007726","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":1,"vw":345},{"id":"2122738306643595691","h":"bboczeng","ts":1794935225,"zh":"和我的观点一致，美国并不那么需要NVDA，不必尬吹。\n美国还有AMD，谷歌，AVGO，以及以后的SPCX","en":"和我的观点一致，美国并不那么需要NVDA，不必尬吹。\n美国还有AMD，谷歌，AVGO，以及以后的SPCX","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122738306643595691","l":[],"ln":[],"t":[],"lk":4,"rt":1,"rp":1,"vw":666},{"id":"2122737207643693397","h":"wufantouzi","ts":1794934963,"zh":"共和党失去了两院\n川普现在也不护盘了\n以前川普还是会喊一喊要降息\n喊一喊要抄底","en":"共和党失去了两院\n川普现在也不护盘了\n以前川普还是会喊一喊要降息\n喊一喊要抄底","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2122737207643693397","l":[],"ln":[],"t":["美联储"],"lk":2,"rt":0,"rp":2,"vw":1440},{"id":"2122737087560765678","h":"bboczeng","ts":1794934934,"zh":"果然是个家族企业。。。","en":"果然是个家族企业。。。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122737087560765678","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":331},{"id":"2122736843926167622","h":"bboczeng","ts":1794934876,"zh":"投资者大幅削减科技股超配仓位，降幅创纪录\n美国银行11月调查显示，投资者对科技股的净超配比例从上月的37%降至12%，为2006年以来的最大单月降幅。\n创纪录的38%受访者认为企业在AI上投资过度，52%预计某家大型超大规模云厂商将很快削减支出；AI泡沫风险成为他们最担忧的问题。\n尽管科技股仓位有所调整，但对经济衰退的担忧依然很低，仅为3%，现金持仓也处于极低水平，基金经理们在关键财报发布前更青睐2027年的国际股票。","en":"投资者大幅削减科技股超配仓位，降幅创纪录\n美国银行11月调查显示，投资者对科技股的净超配比例从上月的37%降至12%，为2006年以来的最大单月降幅。\n创纪录的38%受访者认为企业在AI上投资过度，52%预计某家大型超大规模云厂商将很快削减支出；AI泡沫风险成为他们最担忧的问题。\n尽管科技股仓位有所调整，但对经济衰退的担忧依然很低，仅为3%，现金持仓也处于极低水平，基金经理们在关键财报发布前更青睐2027年的国际股票。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122736843926167622","l":[],"ln":[],"t":["财报"],"lk":2,"rt":0,"rp":2,"vw":654},{"id":"2122736756927967474","h":"bboczeng","ts":1794934856,"zh":"英伟达在出口审查压力下成立国家安全监督委员会\n11月17日，英伟达宣布成立常设的\"国家安全与出口管制监督委员会\"，由新任董事Suzanne Nora Johnson担任主席，Stephen C. Neal和John O. Dabiri为成员。\n该委员会将监督公司的国家安全与全球贸易合规团队，并每季度与独立专家举行会议；与此同时，先进AI芯片正面临前所未有的国家安全障碍。\n此举发生在前首席执行官黄仁勋因涉嫌向中国转运芯片的调查而辞职之后，并获得了特朗普总统的赞扬，不过也有人质疑主席的金融背景，认为她缺乏科技或安全领域的经验。","en":"英伟达在出口审查压力下成立国家安全监督委员会\n11月17日，英伟达宣布成立常设的\"国家安全与出口管制监督委员会\"，由新任董事Suzanne Nora Johnson担任主席，Stephen C. Neal和John O. Dabiri为成员。\n该委员会将监督公司的国家安全与全球贸易合规团队，并每季度与独立专家举行会议；与此同时，先进AI芯片正面临前所未有的国家安全障碍。\n此举发生在前首席执行官黄仁勋因涉嫌向中国转运芯片的调查而辞职之后，并获得了特朗普总统的赞扬，不过也有人质疑主席的金融背景，认为她缺乏科技或安全领域的经验。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122736756927967474","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":2,"rt":0,"rp":0,"vw":813},{"id":"2122736521942089794","h":"bboczeng","ts":1794934800,"zh":"卧槽，原来推动黄仁勋下台背后的势力\n竟然是索罗斯？？","en":"卧槽，原来推动黄仁勋下台背后的势力\n竟然是索罗斯？？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122736521942089794","l":[],"ln":[],"t":[],"lk":7,"rt":1,"rp":1,"vw":714},{"id":"2122736046639304889","h":"bboczeng","ts":1794934686,"zh":"据The Information报道，随着更便宜的替代方案竞争力提升，英伟达（$NVDA）的AI推理市场份额开始被AMD（$AMD）和谷歌（$GOOGL）的TPU蚕食，而这一转变在黄仁勋卸任之前就已经开始。\n问题在于，AMD芯片的交付周期可能长达6个月，而英伟达只需3个月，这说明英伟达目前最大的优势或许仅仅是供货能力。","en":"据The Information报道，随着更便宜的替代方案竞争力提升，英伟达（$NVDA）的AI推理市场份额开始被AMD（$AMD）和谷歌（$GOOGL）的TPU蚕食，而这一转变在黄仁勋卸任之前就已经开始。\n问题在于，AMD芯片的交付周期可能长达6个月，而英伟达只需3个月，这说明英伟达目前最大的优势或许仅仅是供货能力。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122736046639304889","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":1,"rp":0,"vw":1411},{"id":"2122735988116230319","h":"bboczeng","ts":1794934672,"zh":"迈克尔·伯里（Michael Burry）称，Anthropic是在\"押上自己的全部存在\"来赌乐观预期，他本人也无意持 国家，也深爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感懊悔。\n我愿意为自己的错误承担全部责任，并承诺全力配合董事会开展的独立调查。\n自从我离开公司以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重新出任首席执行官（CEO）。\n在公司面临复杂的技术、市场、竞争以及地缘政治局势之际，仍有许多人持续直接与我联系，希望我能够回归。\n英伟达是一家数十年甚至一代人才能诞生一次的非凡企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最佳利益，那么我将深感荣幸，愿意回应这些呼声，重新担任英伟达的首席执行官。\n再次感谢所有向我表达祝福与善意的人。你们的支持让我深受感动，也让我心怀谦卑与感激。\n最后，我想对我的家人说：我爱你们。我愿意用余生的每一天，努力成为一个配得上你们爱的人。\nJensen（黄仁勋）”","en":"每个英伟达股东本日必读，黄仁勋刚刚发的 ⬇️\n“过去一周，来自朋友、行业同仁，以及素未谋面的人们的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份支持对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。\n英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将它建设成今天这样的公司，是我莫大的荣幸与荣耀。只有在美国，才有可能诞生像英伟达这样的公司。\n我深爱我们的国家，也深爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感懊悔。\n我愿意为自己的错误承担全部责任，并承诺全力配合董事会开展的独立调查。\n自从我离开公司以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重新出任首席执行官（CEO）。\n在公司面临复杂的技术、市场、竞争以及地缘政治局势之际，仍有许多人持续直接与我联系，希望我能够回归。\n英伟达是一家数十年甚至一代人才能诞生一次的非凡企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最佳利益，那么我将深感荣幸，愿意回应这些呼声，重新担任英伟达的首席执行官。\n再次感谢所有向我表达祝福与善意的人。你们的支持让我深受感动，也让我心怀谦卑与感激。\n最后，我想对我的家人说：我爱你们。我愿意用余生的每一天，努力成为一个配得上你们爱的人。\nJensen（黄仁勋）”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Kay2289123/status/2122733473031156081","l":[],"ln":[],"t":["AI科技"],"lk":18,"rt":2,"rp":2,"vw":3469},{"id":"2122732717381157312","h":"bboczeng","ts":1794933892,"zh":"据英国《金融时报》报道，黄仁勋之女深度参与了英伟达就其与Megaspeed关系所展开的公开辩护工作。\n前英伟达首席执行官黄仁勋之女Madison Huang（黄敏珊），协助主导了公司应对外界对Megaspeed审视的举措。\n她的丈夫Nico Caprez在英伟达与这家总部位于新加坡的云服务商的交易接受调查期间，迅速晋升至人工智能基础设施领域的高级职位。\nMegaspeed采购了约50亿美元的英伟达硬件，并因芯片可能被转运至中国而受到美国方面的关注。\n英伟达董事会已启动内部调查，并设立了新的国家安全与出口合规委员会。","en":"据英国《金融时报》报道，黄仁勋之女深度参与了英伟达就其与Megaspeed关系所展开的公开辩护工作。\n前英伟达首席执行官黄仁勋之女Madison Huang（黄敏珊），协助主导了公司应对外界对Megaspeed审视的举措。\n她的丈夫Nico Caprez在英伟达与这家总部位于新加坡的云服务商的交易接受调查期间，迅速晋升至人工智能基础设施领域的高级职位。\nMegaspeed采购了约50亿美元的英伟达硬件，并因芯片可能被转运至中国而受到美国方面的关注。\n英伟达董事会已启动内部调查，并设立了新的国家安全与出口合规委员会。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122732717381157312","l":[],"ln":[],"t":["AI科技"],"lk":11,"rt":1,"rp":3,"vw":2215},{"id":"2122732382549868831" 愿意为自己的错误承担全部责任，并承诺全力配合董事会正在进行的独立调查。\n自从我离职以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重返公司，重新担任首席执行官。在公司面临复杂的技术、市场、竞争和地缘政治局势之际，仍有许多人不断直接联系我。英伟达是一家一代人才能诞生一次的伟大企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最大利益，那么我将深感荣幸，愿意回应这些呼声，重新出任英伟达首席执行官。\n再次感谢所有向我表达美好祝愿的人。你们的支持让我深感谦卑，也令我无比感激。\n最后，我想对我的家人说：我爱你们。我将用余生的时间，努力成为一个配得上你们的爱的人。\n黄仁勋（Jensen）","en":"过去一周，来自朋友、业内同行，以及许多素未谋面之人的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份情谊对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将英伟达建设成今天这样的公司，是我的荣幸，也是我的荣耀。只有在美国，才有可能诞生像英伟达这样的企业。我热爱我们的国家，也热爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感悔恨。我愿意为自己的错误承担全部责任，并承诺全力配合董事会正在进行的独立调查。\n自从我离职以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重返公司，重新担任首席执行官。在公司面临复杂的技术、市场、竞争和地缘政治局势之际，仍有许多人不断直接联系我。英伟达是一家一代人才能诞生一次的伟大企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最大利益，那么我将深感荣幸，愿意回应这些呼声，重新出任英伟达首席执行官。\n再次感谢所有向我表达美好祝愿的人。你们的支持让我深感谦卑，也令我无比感激。\n最后，我想对我的家人说：我爱你们。我将用余生的时间，努力成为一个配得上你们的爱的人。\n黄仁勋（Jensen）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726624538034520","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":0,"rp":5,"vw":2302},{"id":"2122726565847138465","h":"bboczeng","ts":1794932426,"zh":"@JensenHuang 感谢您在 NVDA 发布灾难性收益报告之前挽救了其股票！","en":"@JensenHuang Thanks for saving NVDA stock right before its disastrous earnings report !","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/bboczeng/status/2122726565847138465","l":[],"ln":[],"t":["财报"],"lk":144,"rt":1,"rp":5,"vw":16439},{"id":"2122726292936360342","h":"bboczeng","ts":1794932361,"zh":"刚开始暴跌，这会又开始拉盘了？\n😅😅😅","en":"刚开始暴跌，这会又开始拉盘了？\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726292936360342","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":4,"vw":1693},{"id":"2122726287219523973","h":"octopusycc","ts":1794932359,"zh":"世界需要你 AI也需要你","en":"世界需要你 AI也需要你","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/octopusycc/status/2122726287219523973","l":[],"ln":[],"t":[],"lk":14,"rt":0,"rp":0,"vw":2572},{"id":"2122726113965457844","h":"bboczeng","ts":1794932318,"zh":"又是定投VOO成功的一天\n等到多头全部认输，我们也就赢了\n😅😅😅","en":"又是定投VOO成功的一天\n等到多头全部认输，我们也就赢了\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726113965457844","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":2,"vw":1460},{"id":"2122726005219737649","h":"JensenHuang","ts":1794932292,"zh":"在过去的一周里，我被朋友、行业同事和素未谋面的人的爱和支持所感动。感谢所有对我和我的家人表示善意的人。这对我来说意味着整个世界。 53 年前我来到美国，成为美国公民是我一生中最伟大的礼物和最自豪的时刻之一。 NVIDIA 是我一生的事业。与我的同事们一起将其融入到今天的公司是一种荣幸。除了美国，其他任何地方都不可能出现像 NVIDIA 这样的公司。我爱我们的国家，我也爱 NVIDIA。 我没有达到 NVIDIA 每个人的期望标准，并且在个人生活中犯了严重错误。我给董事会带来了问题，对此我深感遗憾。我完全承认自己的错误，并致力于配合董事会的独立调查。自从我离职后，NVIDIA 的员工、投资者、业务合作伙伴和客户纷纷呼吁我重新担任首席执行官。当公司应对复杂的技术、市场、竞争和地缘政治动态时，许多人继续直接与我联系。 NVIDIA 是一家百年一遇的公司。如果董事会认为我的回归符合我们的股东、员工、公司和美国的最佳利益，我将很荣幸回应这些呼吁并重新担任首席执行官。 再次感谢所有分享美好祝愿的人。你们的支持让我深感荣幸。对我的家人：我爱你们，我会用我的余生来配得上你们。 詹森","en":"Over the past week, I’ve been overwhelmed by the love and support of friends, industry colleagues, and people I've never met. Thank you to everyone who has shown kindness to my family and me. It means the world to me.\nI came to the United States 53 years ago, and becoming an American citizen is one of the greatest gifts and proudest moments of my life. NVIDIA has been my life’s work. Building it into the company it is today alongside my colleagues has been a privilege and an honor. Nowhere but in America could a company like NVIDIA be possible. I love our country, and I love NVIDIA.\nI did not live up to the standards expected of everyone at NVIDIA, and I have made serious mistakes in my personal life. I created problems for the Board that I deeply regret. I own my mistakes completely, and I am committed to cooperating with the Board’s independent investigation.\nSince my departure, I’ve seen an outpouring of calls from NVIDIA’s employees, investors, business partners, and customers for me to return as CEO. Many continue to reach out to me directly as the company navigates complex technology, market, competitive, and geopolitical dynamics. NVIDIA is a once-in-a-generation company. If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO.\nThank you again to everyone who has shared their good wishes. I am profoundly humbled by your support. To my family: I love you, and I will spend the rest of my life being worthy of yours.\nJensen","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/JensenHuang/status/2122726005219737649","l":[],"ln":[],"t":["AI科技"],"lk":710385,"rt":79153,"rp":37986,"vw":24044000},{"id":"2122725463449829707","h":"xingpt","ts":1794932163,"zh":"“Nvidia CEO Huang: If the Board of Directors decides my return is in the best interest of shareholders, employees, the company, and the US, I would be honored to return as CEO - WSJ”\n老黄不会回来。\n如果老黄真的要回来，不会是这种在媒体的表态方式。而是会像 Sam Altman 一样，不管是找新的投资人，还是在董事会里找到自己的利益合伙人，直接逼宫新管理层。一定会用稳准狠的方式打出那张让董事会不得不让他回来的牌。\n而现在的这个语气听起来，老黄更多的只是在寻求舆论的支持，可能手里其实没有什么牌。","en":"“Nvidia CEO Huang: If the Board of Directors decides my return is in the best interest of shareholders, employees, the company, and the US, I would be honored to return as CEO - WSJ”\n老黄不会回来。\n如果老黄真的要回来，不会是这种在媒体的表态方式。而是会像 Sam Altman 一样，不管是找新的投资人，还是在董事会里找到自己的利益合伙人，直接逼宫新管理层。一定会用稳准狠的方式打出那张让董事会不得不让他回来的牌。\n而现在的这个语气听起来，老黄更多的只是在寻求舆论的支持，可能手里其实没有什么牌。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/xingpt/status/2122725463449829707","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":166},{"id":"2122725040487796999","h":"octopusycc","ts":1794932062,"zh":"谢谢你\n谢谢大家","en":"谢谢你\n谢谢大家","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2122725040487796999","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":500},{"id":"2122725012700627369","h":"xiaomustock","ts":1794932056,"zh":"老黄一句话立马反弹了一小段，\n现在持仓就怕盘后英伟达财报的下季度指引出问题，万一增长跟不上ai交易的想象力，\n那全场完蛋。","en":"老黄一句话立马反弹了一小段，\n现在持仓就怕盘后英伟达财报的下季度指引出问题，万一增长跟不上ai交易的想象力，\n那全场完蛋。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVvJI-aEAA-5QZ.jpg?name=ori ences-agree-summit-text-official-2026-11-17/?taid=6afc6c26a3d32e000116b8f4&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["关税贸易"],"lk":0,"rt":0,"rp":0,"vw":472},{"id":"2122703919101211021","h":"dmjk001","ts":1794927026,"zh":"Altman：芯片厂商在高估OpenAI需求\nOpenAI的Sam Altman称，芯片厂商在高估OpenAI需求、存在重复统计：各家都默认OpenAI会买下他们全部芯片。他表示：“没错。很长一段时间里，行业里基本只有一家芯片供应商。所以当时大家统计晶圆产能时，可以向我们这类公司了解需求预期，从而大致判断自家芯片的终端需求空间。现在做芯片的厂商变多了。其中不少厂商都认为，自己大部分芯片出货量都会卖给我们、Anthropic以及其他客户。但我们的需求、数据中心规模等资源都是有限的。很多芯片厂商在对接供应链的时候，都预设我们会采购他们全部的芯片。当然，整体需求、数据中心建设的基本面是扎实的。但我们不可能、也没有必要从每一家芯片供应商那里采购全部产能。”","en":"Altman：芯片厂商在高估OpenAI需求\nOpenAI的Sam Altman称，芯片厂商在高估OpenAI需求、存在重复统计：各家都默认OpenAI会买下他们全部芯片。他表示：“没错。很长一段时间里，行业里基本只有一家芯片供应商。所以当时大家统计晶圆产能时，可以向我们这类公司了解需求预期，从而大致判断自家芯片的终端需求空间。现在做芯片的厂商变多了。其中不少厂商都认为，自己大部分芯片出货量都会卖给我们、Anthropic以及其他客户。但我们的需求、数据中心规模等资源都是有限的。很多芯片厂商在对接供应链的时候，都预设我们会采购他们全部的芯片。当然，整体需求、数据中心建设的基本面是扎实的。但我们不可能、也没有必要从每一家芯片供应商那里采购全部产能。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122703919101211021","l":[],"ln":[],"t":["AI科技"],"lk":4,"rt":0,"rp":0,"vw":1644},{"id":"2122700362843082996","h":"hanking66","ts":1794926179,"zh":"感觉全网都在赌达子财报利空出尽，超级反弹！😅😅😅\n希望这次大部分人都能赌对🙏🙏🙏跌这么久了，也该反弹一下了，利空消息也好多天了，消化得也差不多了……难道还能有比老黄走人更大的利空等着我们吗？我想象力贫瘠，实在想不出还有什么可以比现在更惨了\n新 ceo 总不第一个财报，给大家表演一个我杀我自己吧😅真要是这样，那达子董事会里是进间谍了吧🤣🤣\nBuy the dip，长期持有，Discord在个人资料。","en":"感觉全网都在赌达子财报利空出尽，超级反弹！😅😅😅\n希望这次大部分人都能赌对🙏🙏🙏跌这么久了，也该反弹一下了，利空消息也好多天了，消化得也差不多了……难道还能有比老黄走人更大的利空等着我们吗？我想象力贫瘠，实在想不出还有什么可以比现在更惨了\n新 ceo 总不第一个财报，给大家表演一个我杀我自己吧😅真要是这样，那达子董事会里是进间谍了吧🤣🤣\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2122700362843082996","l":[],"ln":[],"t":["财报"],"lk":5,"rt":0,"rp":3,"vw":1364},{"id":"2122700264780267782","h":"xingpt","ts":1794926155,"zh":"币圈人炒美股的几个恶习，一定要避坑这几个点：\n1. 信仰盘\n看准一个就以为是比特币，疯狂加仓，从 存储 到 Circle，到最近也有人喊英伟达。其实不管任何股票都有周期，不是所有的成功路径都可以通过早期囤比特币这种信仰盘的方式来复制，这种幸存者是极少的。但币圈往往是被早期囤比特币能发财、囤以太坊能发财的人洗脑，认为只要搞信仰盘就能够赚钱。\n2. 只会炒热门票\n什么热炒什么。其实美股涨得好的，往往是悄摸摸在偷偷发展的公司，不一定是热门票。\n一个票若是热门票，要么是涨到了顶点，要么是博弈面极其复杂，这种参与进去大概率都是韭菜，因为热门票的仓位已经极度拥挤了。\n就单看存储半导体，有多少人能真的赚到钱落到口袋里？而消费、医疗和网络安全，很多股票已经破了新高，但因为不在新闻热点上，币圈的人也没有深度覆盖的能力，所以只能跟着热度炒。但炒公司跟炒币不一样，公司是有长期投资价值的，不是说那些冷门的就没有。\n比如有一家公司几乎没有人提，半年时间已经稳稳翻倍了，而且几乎没有人提过：维多利亚的秘密，对，就是搞维密秀、卖女性内衣的那家公司\n3. 只会炒情绪盘\n别的不说，币圈的人炒情绪盘确实是很厉害的。因为炒 meme 和炒山寨币，大部分只要看情绪就够了。\n但炒美股，当然炒情绪也是一方面，但大部分时候还是要回归公司的基本价值跟行业逻辑，以及关于估值体系、这个市场交易的拥挤度和资金配置等问题。要考虑的层面，其实要比单纯看情绪面博弈复杂得多，而且看情绪面博弈的胜率和收益比，也没有币圈来得高。\n所以要炒透美股，还是要扎扎实实做好基本面研究：对公司的业务、公司本身的估值，以及公司的未来战略和上下游，都要搞清楚。\n比如有个公司叫 TBBB，是 Druckenmiller 的持仓，做的是墨西哥的平价超市。其实基本面非常好，但也并不在情绪盘里，这个公司今年也翻倍了，而且走势非常稳，不像科技一样大起大落。\n4. 盲目相信 KOL。\n当然这点其实并不是币圈的问题了，A 股包括很多股票圈的人也是盲目听着 KOL 就冲进去干了。\n但交易其实是自己的，KOL 只能提供一些他的思路。你要知道 KOL 他擅长的是什么：他是短线还是长线？他是交易基本面、情绪，还是技术方向？\n如果这都不知道你就盲目跟，你一定会丧失自己的节奏。因为没有 KOL 是永远准确的，也不可能第一时间就告诉你该买多少、该什么时候卖。\n我也订阅了很多 KOL，但我从来不会盲目抄作业，而是会把他们的思路吸收和分析，看有哪些是对的，有哪些我认为他们说得不对，我也不会盲目去跟单。\n总之，炒美股是一个比炒币复杂得多的事情。炒币赚钱当然牛逼，但不一定能代表炒美股赚钱，特别是个股。\n所以大家在看这些美股信息，特别是币圈 KOL 发的时候，还是要对他的观点有一个自己的判断。","en":"币圈人炒美股的几个恶习，一定要避坑这几个点：\n1. 信仰盘\n看准一个就以为是比特币，疯狂加仓，从 存储 到 Circle，到最近也有人喊英伟达。其实不管任何股票都有周期，不是所有的成功路径都可以通过早期囤比特币这种信仰盘的方式来复制，这种幸存者是极少的。但币圈往往是被早期囤比特币能发财、囤以太坊能发财的人洗脑，认为只要搞信仰盘就能够赚钱。\n2. 只会炒热门票\n什么热炒什么。其实美股涨得好的，往往是悄摸摸在偷偷发展的公司，不一定是热门票。\n一个票若是热门票，要么是涨到了顶点，要么是博弈面极其复杂，这种参与进去大概率都是韭菜，因为热门票的仓位已经极度拥挤了。\n就单看存储半导体，有多少人能真的赚到钱落到口袋里？而消费、医疗和网络安全，很多股票已经破了新高，但因为不在新闻热点上，币圈的人也没有深度覆盖的能力，所以只能跟着热度炒。但炒公司跟炒币不一样，公司是有长期投资价值的，不是说那些冷门的就没有。\n比如有一家公司几乎没有人提，半年时间已经稳稳翻倍了，而且几乎没有人提过：维多利亚的秘密，对，就是搞维密秀、卖女性内衣的那家公司\n3. 只会炒情绪盘\n别的不说，币圈的人炒情绪盘确实是很厉害的。因为炒 meme 和炒山寨币，大部分只要看情绪就够了。\n但炒美股，当然炒情绪也是一方面，但大部分时候还是要回归公司的基本价值跟行业逻辑，以及关于估值体系、这个市场交易的拥挤度和资金配置等问题。要考虑的层面，其实要比单纯看情绪面博弈复杂得多，而且看情绪面博弈的胜率和收益比，也没有币圈来得高。\n所以要炒透美股，还是要扎扎实实做好基本面研究：对公司的业务、公司本身的估值，以及公司的未来战略和上下游，都要搞清楚。\n比如有个公司叫 TBBB，是 Druckenmiller 的持仓，做的是墨西哥的平价超市。其实基本面非常好，但也并不在情绪盘里，这个公司今年也翻倍了，而且走势非常稳，不像科技一样大起大落。\n4. 盲目相信 KOL。\n当然这点其实并不是币圈的问题了，A 股包括很多股票圈的人也是盲目听着 KOL 就冲进去干了。\n但交易其实是自己的，KOL 只能提供一些他的思路。你要知道 KOL 他擅长的是什么：他是短线还是长线？他是交易基本面、情绪，还是技术方向？\n如果这都不知道你就盲目跟，你一定会丧失自己的节奏。因为没有 KOL 是永远准确的，也不可能第一时间就告诉你该买多少、该什么时候卖。\n我也订阅了很多 KOL，但我从来不会盲目抄作业，而 aoJin","ts":1794925707,"zh":"既然你成功击败了 Jensen，你的价格就应该高于 $ANT 范围","en":"Since you managed to take down Jensen, you deserve to price above the range $ANT","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ShanghaoJin/status/2122698386596098424","l":[],"ln":[],"t":[],"lk":13,"rt":0,"rp":1,"vw":3700},{"id":"2122697624981844173","h":"fxtrader","ts":1794925526,"zh":"#观察 由于X平台的激励机制影响，现在X上的推文经常看到：惊诧体，硬凑体，半截话，造黄谣，瞎B编。感觉不如取消这个激励，避免劣币驱逐良币。","en":"#观察 由于X平台的激励机制影响，现在X上的推文经常看到：惊诧体，硬凑体，半截话，造黄谣，瞎B编。感觉不如取消这个激励，避免劣币驱逐良币。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2122697624981844173","l":[],"ln":[],"t":[],"lk":35,"rt":1,"rp":12,"vw":4363},{"id":"2122697609227956541","h":"octopusycc","ts":1794925522,"zh":"nm为什么我改不了订阅费啊","en":"nm为什么我改不了订阅费啊","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVWOVObsAAoIWR.jpg?name=orig"],"u":"https://x.com/octopusycc/status/2122697609227956541","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1564},{"id":"2122697163633487906","h":"octopusycc","ts":1794925416,"zh":"我受不了了","en":"我受不了了","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/octopusycc/status/2122697163633487906","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":674},{"id":"2122697011443245229","h":"yijiangren","ts":1794925379,"zh":"观澜谱·兵法篇一：以正合，以奇胜\n《孙子兵法·兵势篇》有言：凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江海。\n很多人会把“奇”理解为出其不意的奇招，或是一支能够偷袭制胜的奇兵。\n历代兵家确实常以奇兵解释“奇”，但若只停留在奇袭二字，便容易忽略一个更深层的前提。\n你必须拥有尚未投入战场、能够随时调度的力量，才有资格谈出奇制胜。\n正兵负责正面交锋，奇兵负责寻找破绽。\n倘若所有兵力都已经陷入正面战场，即便敌人露出再大的破绽，你又拿什么去攻？\n所以，从投资的角度，“奇”理解为一种可以自由支配的余力。\n它可以是没有投入市场的现金，可以是尚未使用的风险额度，也可以是一条能够源源不断提供资金的现金流。\n它们共同构成了投资者的后手。\n以正合，是凭借已有的实力参与市场；以奇胜，是永远保留改变战局的能力。\n一、兵力未尽，胜负未定\n很多人有一个根深蒂固的误区。\n认为看准了方向，就应该全仓投入；认为一笔交易的胜率足够高，就应该尽可能放大收益。\n于是，满仓成为自信的证明，杠杆成为胆识的象征。\n谨慎遭人看不起，赌徒成为了吹捧的对象。\n市场最残酷的地方在于：我们的判断可以正确，价格却未必按照我们预期的时间和路径运行。\n一只股票，你认为它值 100 。\n它可能先跌到 80，再跌到 60，最终才回到 150。\n如果你在 100 的位置 All in，即使最终判断正确，中间的过程也让你承受巨大的心理压力。\n如果上了高杠杆，可能在价值兑现之前便遭到强制平仓。\n相反，如果你始终保留一部分现金，局面便完全不同。\n价格跌到 80，你可以重新评估\n跌到 60，你依然拥有选择权\n倘若基本面没有恶化，估值反而更加合理，你甚至有机会以更低的成本积累更多筹码。\n当然，前提是判断经过重新验证。持续下跌也可能意味着最初的投资逻辑已经失效。\n现金无法保证你买在最低点，却能保证你拥有下一次出手的资格。\n二、十则围之，五则攻之\n《孙子兵法·谋攻篇》还有一段极其精彩的论述：\n十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。\n兵力十倍于敌，便可以围困\n五倍于敌，可以主动进攻\n两倍于敌，可以分散敌军\n势均力敌，可以正面交战\n兵力处于劣势，则应当撤退或避其锋芒\n这段话的核心，是根据力量对比决定行动方式。\n放在交易市场中，同样适用。\n当市场趋势明确、基本面扎实、估值合理，且你拥有充分的资金储备时，可以主动进攻。\n当价格接近合理区间，但方向仍然模糊时，可以小仓位试探。\n当市场进入剧烈震荡、宏观环境不断恶化时，应当收缩战线。\n当原有交易逻辑被证伪，或者潜在风险已经超过承受能力时，就应该果断撤退。\n仓位的大小，应当服从胜算与风险的变化，而非情绪的强弱。\n孙子从未要求将军逢敌必战。\n真正高明的将领，知道何时进攻，也知道何时避战。\n交易亦然。\n有时候，空仓就是最好的防守。\n有时候，轻仓就是最好的进攻准备。\n真正危险的，是明明处于劣势，却因为仓位太重、退路太少，被迫与市场决一死战。\n三、永远不要 All in\n一句话，我认为值得反复提醒自己，也提醒大家：永远不要把最后一颗子弹，打在自己最有信心的时候。\n因为信心只代表你当下的认知，并不能消除未来的不确定性。\n今天你认为市场已经见底，明天可能出现新的流动性冲击\n今天你认为一家公司的估值足够便宜，下个季度可能迎来盈利预期下修\n今天你认为宏观环境即将转暖，一份超预期的经济数据便可能改变利率路径\n市场从来不会因为你已经满仓，就停止制造新的机会。\n更残酷的是，机会往往出现在绝大多数人无力行动的时候。\n牛市末期，人人都有购买的欲望\n熊市深处，真正缺的却是购买的能力\n那些在上涨阶段保留现金的人，往往能够在流动性收缩时拥有更大的主动权。\n当然，现金也有机会成本。长期持有过多现金，可能错过优质资产的持续上涨。\n所以保留后手，并不意味着永远轻仓，更不意味着机械地等待暴跌。\n它要求你根据市场环境、资产估值和自身现金流，动态分配兵力。\n更重要的是，在投入任何一笔资金之前，都要想清楚：\n如果判断错误，我还有没有退路？\n如果出现更好的机会，我还有没有余力？\n如果市场长期不按照预期运行，我能不能继续留在牌桌上？\nAll in 最大的代价，是你把未来所有的选择权，都押在了当下这一次判断上。\n四、源源不断的现金流，才是最好的后勤\n战争拼到最后，往往拼的是补给。\n投资也是如此。\n很多人把全部精力放在寻找下一只暴涨的股票，却忽略了自身持续创造现金流的能力。\n工资、经营收入、稳定的业务利润，以及其他可持续的自由现金流，都是投资者的后勤。\n它们让你不必依靠每一笔交易来维持生活。\n让你能够承受更长时间的等待。\n也让你在市场出现真正值得出手的机会时，拥有额外的资金来源。\n一个拥有稳定现金流的投资者，即使暂时遭遇亏损，只要风险可控，依然可以逐渐恢复实力。\n而一个失去现金流、又满仓高杠杆的人，即使对未来的判断足够深刻，也可能倒在黎明之前。\n这也是为什么，我一直认为普通人应该同时建立两种能力。\n一种是在市场中识别优质资产的能力。\n另一种是在市场之外持续创造财富的能力。\n前者决定投资收益的潜力，后者决定你能够在市场中停留多久。\n所谓无限后手，并非真的拥有取之不尽的资金。\n而是通过持续的现金流、合理的仓位管理和严格的风险控制，让自己始终具备重新组织进攻的能力。\n善战者，不以一战赌国运；善投者，不以一仓定生死。\n五、以正合，以奇胜\n如果让我将这六个字转化为一套投资体系，那么：\n所谓正，是对优质资产的理解，是对长期趋势的判断，是能够承受波动的核心仓位。\n所谓奇，是保留的现金，是灵活的机动仓位，是发现判断错误后及时撤退的能力，也是机会真正出现时敢于集结力量的底气。\n正决定你能够走多远。\n奇决定你在复杂的市场环境中，究竟还有多少选择。\n两者缺一不可。\n只守现金，可能错过漫长的资产升值。\n只持仓位，则可能在真正的历史性机会到来时无能为力。\n而最理想的状态，是让核心资产参与长期增长，让机动资金应对周期变化，让持续现金流不断补充自己的力量。\n行情好时，顺势而为\n行情差时，收缩阵地\n机会不足时，休养生息\n机会成熟时，集中优势兵力\n进退之间，始终掌握主动\n最后，我想用一句话作为这一篇的结尾。\n一个交易者真正的强大，不在于他能一次投入多少兵力，而在于无论经历多少次交锋，他始终还有兵可用。\n兵无常势，水无常形\n以正合，以奇胜\ 从2027年11月到2028年9月之间，美联储将进行四次25个基点的降息，使利率最终降至3.25%-3.5%。这将解除对黄金的利率限制，并推动对利率敏感型西方ETF的需求恢复。\n如果黄金作为对宏观政策风险对冲工具的需求重新回升，高盛认为，其走势将超出基准情景的显著上涨空间。西方经济体财政可持续性问题再度引发担忧，可能成为推动力。\n对2027年预测的风险因素则偏向于下行。若美联储加息四次且最终利率更高，到2027年底金价将跌至4585美元；若出现300吨ETF赎回，则金价将降至4265美元。\n分析师还预计，到2027年黄金表现将强于白银，因为只有黄金能从央行的抢购行动中受益。高盛呼吁避免再次出现白银的流动性紧缩。","en":"高盛预计，一旦美联储开始降息且西方投资者重新进入市场，在2028年前黄金将达到5600美元/盎司。\n贵金属市场在2027年的表现“越来越像2022年”。高盛预测到2027年底黄金价格将达到4650美元/盎司，较现货价格高19%，较10月平均价4100美元高13%。分析师认为，这一涨幅主要得益于央行持续增持头寸。\n分析师预计，到2026至2028年期间，央行每月将购买60吨黄金，而2022年之前均值仅为17吨。“我们认为这标志着储备管理行为的结构性转变，短期内不会逆转。我们的基准情景假设官方部门的积累趋势将继续维持三年。”\n5600美元的目标取决于美联储的政策转向。预计从2027年11月到2028年9月之间，美联储将进行四次25个基点的降息，使利率最终降至3.25%-3.5%。这将解除对黄金的利率限制，并推动对利率敏感型西方ETF的需求恢复。\n如果黄金作为对宏观政策风险对冲工具的需求重新回升，高盛认为，其走势将超出基准情景的显著上涨空间。西方经济体财政可持续性问题再度引发担忧，可能成为推动力。\n对2027年预测的风险因素则偏向于下行。若美联储加息四次且最终利率更高，到2027年底金价将跌至4585美元；若出现300吨ETF赎回，则金价将降至4265美元。\n分析师还预计，到2027年黄金表现将强于白银，因为只有黄金能从央行的抢购行动中受益。高盛呼吁避免再次出现白银的流动性紧缩。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2122686696844358129","l":[],"ln":[],"t":["美联储","黄金"],"lk":3,"rt":0,"rp":0,"vw":1358},{"id":"2122685482836652071","h":"bbcchinese","ts":1794922631,"zh":"深圳被誉为中国最具未来感的城市之一。在本周的APEC峰会，中国国家主席习近平将在这里，接待包括美国总统特朗普和俄罗斯总统普京在内的多国领袖，向他们展示这座中国的人工智能之都。\n但这座城市还有另一面，是领袖们看不到的。BBC记者实地采访，听听赶上AI潮流的年轻人，以及传统产业的工人们怎么说。","en":"深圳被誉为中国最具未来感的城市之一。在本周的APEC峰会，中国国家主席习近平将在这里，接待包括美国总统特朗普和俄罗斯总统普京在内的多国领袖，向他们展示这座中国的人工智能之都。\n但这座城市还有另一面，是领袖们看不到的。BBC记者实地采访，听听赶上AI潮流的年轻人，以及传统产业的工人们怎么说。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122685310203207680/vid/avc1/1280x720/hoYWQ6JF-26YCzjt.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2122685482836652071","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":1,"vw":1836},{"id":"2122684248746508511","h":"cnfinancewatch","ts":1794922337,"zh":"味觉能力每个人区别很大\n我品茶、品酒，的确超越很多人\n别人拼不出来的香、鲜、裤、酸、甘……我能品出来\n也因此，我愿意为茶叶、咖啡、白酒那一点点味道差别多付出数千元","en":"味觉能力每个人区别很大\n我品茶、品酒，的确超越很多人\n别人拼不出来的香、鲜、裤、酸、甘……我能品出来\n也因此，我愿意为茶叶、咖啡、白酒那一点点味道差别多付出数千元","zh_src":"native","lang":"zh","m":["https 。\n2、涉及标的：美元指数（DXY）走强，新兴市场ETF（EEM）承压；A股对应方向为出口链与外汇敏感板块，代表个股美的集团（000333）、海尔智家（600690）。\n3、影响：对美股偏空于跨国企业盈利，强度中，属持续性逻辑；强美元压制新兴市场资金流入，传导A股外资偏好。\n（十六）\n1、事件：据WSJ报道，IEA称全球石油市场将随海湾出口恢复重回过剩，油价因供应前景改善而回落，抵消中东紧张局势。\n2、涉及标的：原油ETF（USO）与埃克森美孚（XOM）承压；A股对应方向为石油石化与油服，代表个股中国石油（601857）、中海油服（601808）。\n3、影响：对美股能源板块偏空，强度中，属持续性逻辑；油价回落传导A股石油石化盈利预期与油服订单。\n（十七）\n1、事件：据Barron's报道，一纸降级拖累全部稀土股，在特朗普与习近平会晤前稀土板块走弱。\n2、涉及标的：MP Materials（MP）为稀土标的；A股对应方向为稀土永磁，代表个股北方稀土（600111）、中国稀土（000831）当日-10.00%。\n3、影响：对美股稀土偏空，强度中，属当日情绪影响；会晤前不确定性传导A股稀土板块，短期波动加大。\n（十八）\n1、事件：据Bloomberg报道，巴克莱称被迫的散户平仓是台湾股市重挫背后原因，台股遭遇抛售。\n2、涉及标的：台积电（TSM）为台股权重核心；A股对应方向为半导体代工与封测，代表个股中芯国际（688981）、长电科技（600584）。\n3、影响：对美股半导体偏空，强度中，属当日情绪影响；台股去杠杆传导A股半导体情绪，但国产替代逻辑形成对冲。\n（十九）\n1、事件：据WSJ报道，美联储主席Warsh表示美联储正在推演AI如何重塑经济，并重申偏好小步加息，但通胀预期若失控将被迫提速。\n2、涉及标的：标普500（SPX）与美债ETF（TLT）为敏感标的；A股对应方向为大金融与利率敏感板块，代表个股招商银行（600036）、中国平安（601318）。\n3、影响：对美股偏空，强度中，属持续性逻辑；加息偏好与AI经济推演影响全球流动性预期，传导A股银行保险估值。\n（二十）\n1、事件：据BusinessInsider报道，迪士尼CEO Josh D'Amaro的科技战略获华尔街认可，财报超预期；同时Opera宣布以普通股直接登陆纳斯达克替代ADS。\n2、涉及标的：迪士尼（DIS）与Opera（OPRA）为事件主体；A股对应方向为传媒IP与浏览器软件，代表个股光线传媒（300251）、三六零（601360）。\n3、影响：对美股偏多，强度弱，属当日情绪影响；科技战略与上市结构调整对A股传媒软件板块示范效应有限。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：\n━━━━━━━━━━━━━\n⭐️⭐️⭐️ 华尔街观察团队 | WSV量化模型 | 不构成投资建议 | 投资有风险 ⭐️⭐️⭐️","en":"（十二）\n1、事件：据华尔街见闻报道，京东三季度净营收3096亿元，归母净利润同比大增44%，新业务大幅减亏，自由现金流扩大至负239亿元。\n2、涉及标的：京东（JD）为财报主体；A股对应方向为电商与物流供应链，代表个股顺丰控股（002352）、圆通速递（600233）。\n3、影响：对美股偏多，强度中，属持续性逻辑；利润大增与减亏传导A股电商物流板块盈利预期改善。\n（十三）\n1、事件：据Reuters报道，美国升级芯片出口管制，商务部规则旨在进一步限制对华芯片出货，外交部回应称典型经济胁迫与长臂管辖，中方将采取必要措施。\n2、涉及标的：英伟达（NVDA）、AMD（AMD）为受限标的；A股对应方向为国产替代半导体设备材料，代表个股北方华创（002371）、中微公司（688012）。\n3、影响：对美股偏空、对A股国产替代偏多，强度强，属持续性逻辑；管制升级强化自主可控主线，利好设备材料端。\n（十四）\n1、事件：据Reuters报道，黄金跌至一年低点，受美债收益率与美元压制，势将创2015年以来最差年度表现，黄金期货结算价创52周新低。\n2、涉及标的：黄金ETF（GLD）与金矿股纽蒙特（NEM）承压；A股对应方向为黄金珠宝与贵金属，代表个股山东黄金（600547）、紫金矿业（601899）。\n3、影响：对美股黄金板块偏空，强度强，属持续性逻辑；金价走弱传导A股黄金股盈利预期下修。\n（十五）\n1、事件：据WSJ报道，美元创18个月新高，美元指数抹去解放日跌幅，“卖出美国”担忧消退，美元五连涨后企稳。\n2、涉及标的：美元指数（DXY）走强，新兴市场ETF（EEM）承压；A股对应方向为出口链与外汇敏感板块，代表个股美的集团（00033 头大赚240亿美元，英伟达跌4%，空头40天斩获240亿美元收益。\n2、涉及标的：英伟达（NVDA）为空头主要目标；A股对应方向为半导体与AI硬件，代表个股寒武纪（688256）、海光信息（688041）。\n3、影响：对美股偏空，强度强，属当日情绪影响；空头获利了结压力传导A股国产算力芯片情绪，短期波动加大。\n（四）\n1、事件：据华尔街见闻报道，AI暴跌前华尔街大佬分道扬镳，桥水、索罗斯Q3大砍英伟达持仓，“木头姐”、Tepper逆势加码，德鲁肯米勒清仓闪迪、台积电。\n2、涉及标的：英伟达（NVDA）、台积电（TSM）、闪迪（SNDK）为调仓对象；A股对应方向为半导体设备材料，代表个股北方华创（002371）、有研新材（600206）。\n3、影响：对美股偏空，强度中，属持续性逻辑；机构分歧加大显示AI交易拥挤度高位，传导A股半导体板块波动。\n（五）\n1、事件：据华尔街见闻报道，高盛五份研报同指一个结论，AI盛宴接近尾声，市场比经济更脆弱。\n2、涉及标的：纳斯达克100指数（NDX）与标普500（SPX）为承压指数；A股对应方向为AI应用与算力，代表个股科大讯飞（002230）、浪潮信息（000977）。\n3、影响：对美股偏空，强度中，属持续性逻辑；外资对AI估值担忧传导A股科技板块风险偏好收敛。\n（六）\n1、事件：据华尔街见闻报道，大摩高喊拥抱风险，AI算力开支只会迟到不会缩水，顶格超配全球股市，摩根士丹利将全球股票上调至最大超配。\n2、涉及标的：MSCI全球指数与标普500（SPX）为受益方向；A股对应方向为算力基础设施，代表个股中科曙光（603019）、紫光股份（000938）。\n3、影响：对美股偏多，强度中，属持续性逻辑；与高盛观点形成对冲，对A股算力板块情绪形成一定支撑。\n（七）\n1、事件：据财联社报道，Anthropic IPO计划于11月18日定价，并于次日开始交易，IPO成AI牛市关键试金石。\n2、涉及标的：Anthropic为待上市AI标的；A股对应方向为AI大模型与应用，代表个股三六零（601360）、昆仑万维（300418）。\n3、影响：对美股偏多待验证，强度强，属当日情绪影响；IPO定价与首日表现将检验AI估值，传导A股AI应用板块情绪。\n（八）\n1、事件：据华尔街见闻报道，巴菲特感恩节再捐股55亿美元，这次的信只写了250字，1620亿剩余财富8年内捐完。\n2、涉及标的：伯克希尔哈撒韦（BRK.B）为捐赠主体；A股对应方向为价值红利风格，代表个股工商银行（601398）、长江电力（600900）。\n3、影响：对美股中性偏多，强度弱，属持续性逻辑；捐赠不改变公司经营，红利价值风格对A股高股息方向形成示范。\n（九）\n1、事件：据华尔街见闻报道，伯克希尔Q3大调仓，建仓Lennar与Delta，减持美银与VeriSign，加码房产与航空股。\n2、涉及标的：莱纳（LEN）、达美航空（DAL）为新进标的，美国银行（BAC）被减持；A股对应方向为地产链与航空，代表个股保利发展（600048）、中国国航（601111）。\n3、影响：对美股偏多，强度中，属持续性逻辑；房产与航空加仓释放对美国内需信心，传导A股地产与航空板块情绪。\n（十）\n1、事件：据\n2、涉及标的：家得宝（HD）为事件主体；A股对应方向为家居建材与消费建材，代表个股欧派家居（603833）、东方雨虹（002271）。\n3、影响：对美股偏多，强度中，属持续性逻辑；美国家居需求韧性传导A股家居出口链预期。\n（十一）\n1、事件：据Seeking Alpha报道，迪士尼第四季度业绩超预期，流媒体增长驱动，半年度股息上调33%至1.00美元，并重申FY2027调整后EPS指引。\n2、涉及标的：迪士尼（DIS）为事件主体；A股对应方向为影视传媒与IP经济，代表个股光线传媒（300251）、广百股份（002187）属IP经济概念。\n3、影响：对美股偏多，强度中，属持续性逻辑；流媒体盈利改善传导A股传媒板块估值修复预期。","en":"今日美股与全球热点二十条\n（一）\n1、事件：据财联社报道，英伟达将于太平洋时间11月17日下午1时20分左右公布2027财年第三季度财务业绩，并于下午2时召开业绩电话会议，市场聚焦四大看点。\n2、涉及标的：英伟达（NVDA）为全球AI算力核心标的；A股对应方向为CPO光模块与算力硬件，代表个股中际旭创（300308）、新易盛（300502）。\n3、影响：对美股偏多待验证，强度强，属当日情绪影响；财报结果将直接传导A股算力硬件板块，超预期则修复光模块情绪。\n（二）\n1、事件：据华尔街见闻报道，黄仁勋离职震荡蔓延，“AI央行”紧缩，新云公司融资危险了，英伟达董事 能算法，冰箱冰柜（营收占比29.97%）营收占比29.97%，围绕“AI垂直应用”完善产品矩阵，并已推出AI套系家电。\n北鼎股份：小家电\n公司2026年持续推出全钢蒸锅、全钛锅具、全钛保温杯、全玻璃养生壶等升级新品，中国区前三季度收入6.01亿同比增长27.54%，Q3单季1.88亿同比增长33.9%；公司深耕高品质厨房小家电，主要产品养生壶（营收占比17.43%）、蒸炖锅（31.15%）产品在国补背景下具备较强优势，自主品牌规模效应显现。\n泰嘉股份：昇腾超节点PSU\n2026年11月16日市场传闻（未证实），DeepSeek新版本拟采用原生国产昇腾950DT超节点进行训练的消息，具体方案尚待官方确认。公司通过旗下雅达电子深度布局AI服务器 PSU，通过华为官方认证，进入昇腾供应链，独家代工CloudMatrix 384 超节点高功率电源模块PSU，同时供货微软LES，是国内最早实现PSU供货海外巨头的企业之一。\n盛剑科技：光刻胶+半导体设备\n1、2026年5月18日盘后纪要，2025 年光刻胶显影液（TMAH）回收技术在客户端测试验证成功，蚀刻液回收技术研发完成。\n2、2026年6月25日机构研报，公司是半导体废气处理与厂务设备龙头，已获得亚翔新加坡项目1亿风管代工订单，真空泵、工艺废气处理设备在马来西亚英飞凌厂验证顺利，预计27年可获得设备订单。公司昨晚正式授予股权激励，目标激进，预测26-28年业绩0.7/2.0/3.6。\n西陇科学：光刻胶配套试剂\n公司拥有酸碱类、溶剂类、蚀刻类和光刻胶配套试剂多种，和英特尔（成都）公司等建立合作关系。公司铜蚀刻液实现量产供应，可用于显示面板8.5高世代产线。\n真视通：华为算力\n公司是华为的“多产品金牌代理”，与华为昇腾会谈共同探索“智能算力建设与运营”合作之路。公司作为北京移动数字北京算力服务产品合作伙伴，为北京移动提供GPU高性能计算服务、并行文件存储服务、机房液冷服务、算力网络服务等。\n扬子新材：半导体洁净室\n2026年8月31日互动，公司的主要产品包括高洁净彩涂板、抗静电彩涂板、高韧耐污彩涂板等，主要用于集成电路厂房、医疗场所等建设项目，下游主要客户为净化及洁净类公司。\n亚泰集团：重整投资协议落地\n2026年11月16日晚公告，公司与长发集团、长春兴泰企业管理及其设立的长春泰启企业管理签署《重整投资协议》。重整投资人拟合计出资15.53亿元，受让公司14.19亿股转增股票，占转增后总股本的20.90%。其中，长发集团作为牵头投资人，将在投资完成后取得公司控股权。\n双环科技：氯化铵涨价\n2026年11月16日讯，截至11月16日氯化铵工业级730元/吨创年内新高，上周山东、河北干铵主流价格升至720元/吨，周内大涨80元/吨，涨幅达12.5%。公司本部运用联碱法生产纯碱和氯化铵等化工产品，年产纯碱近110万吨，每生产1吨纯碱同时产生1吨氯化铵。公司自备真空制盐装置，产能130万吨/年。","en":"一组网络消息：\n一、板块热议：\n半导体芯片：业内人士称，已接获晶圆代工调价通知，涨幅从10％至逾20％不等，明年包括台积电在内的合作晶圆厂都将调价。（华东重机、联合化学、国林科技、佳先股份、西陇科学等）\n昇腾：华为云发布并开源昇腾原生具身世界模型，昇腾云已覆盖80%的中国具身智能企业。（华胜天成、泰嘉股份、克莱特、嘉环科技、真视通等）\n氯化铵：联碱法企业因纯碱长期亏损而主动减产，导致副产品氯化铵供应收缩，国内氯化铵工业级价格涨至730元/吨，创年内新高。（中盐化工、和邦生物、双环科技、华昌化工等）\n#华尔街观察最近提示乳业：11月本是原奶传统淡季，但散奶价格较合同奶价出现明显倒挂，反映供应趋紧，部分地区合同奶价上行。（伊利股份、新乳业、光明乳业、骑士乳业等）\n风险提示：以上内容来自公社用户写作，相关信息未经核实，未必准确，请审慎参考。\n二、大涨股解析：\n顺钠股份：干式变压器\n2026年11月16日盘中消息，1-9月全国电网工程投资完成额4594亿元，同比+4.9%，其中8-9月单月投资同比提速，单9月同比+13.8%；此外，机构预计第五批招标有望于12月挂网招标，有可能涉及“2直1交”，招标金额可观公司为国内干式变压器开拓者，主导或参与制定国家及行业标准超过50项，干式变压器规格超过3000种，累计销量超过16.2万台，其它产品包括预装式变电站、开关柜、电抗器、分布式储能柜及储能系统等，同时承接电力成套工程并提供配套运维服务。\n长虹美菱：家电\n公司2026年H1小家电方面已推出集成AI控温、净水和保鲜存储的AI冰吧机，正在开发AI视觉食材识别、膳食大模型、健康数据监测和自适应烹饪调控系统，构建智能健康烹饪方案。公司空调（营收占比5 "rp":0,"vw":3049},{"id":"2122658360353079674","h":"fxtrader","ts":1794916164,"zh":"#观察 英伟达新班子成立国家安全和出口管制监督委员会，最直接的信号就是开始主动向美国政府交代，直接向董事会层面汇报，不再只是普通管理层内部的合规工作。\n这个委员会，是为了保护美国政府对公司的信任，处理政府对话政策的压力，也是为了应对国会调查及潜在立法风险。","en":"#观察 英伟达新班子成立国家安全和出口管制监督委员会，最直接的信号就是开始主动向美国政府交代，直接向董事会层面汇报，不再只是普通管理层内部的合规工作。\n这个委员会，是为了保护美国政府对公司的信任，处理政府对话政策的压力，也是为了应对国会调查及潜在立法风险。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2122658360353079674","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":0,"vw":290},{"id":"2122657529968857480","h":"qinbafrank","ts":1794915966,"zh":"“看我的大字报如何炮打AI司令部”，华尔街日报这篇特稿真是让我惊到了。标题直接就用了“贬损、派对与一个‘王室家族’”。核心几点：\n1）老黄本人以严苛、当面斥责闻名，会议上会说“你的问题很愚蠢”“这个想法很愚蠢”，还会用“死脸”形容被训后茫然的员工。\n2）女儿黄敏珊（Madison）被描述成实际上的幕僚长，属于非正式的“乐队”核心圈，随父走遍全球，要求同样苛刻，还会用“死脸”“金鱼”（记不住事的人）骂人。\n3）员工普遍认为公司文化是围绕黄仁勋及其成年子女建立的，几乎没有传统公司架构，黄有60个直接下属，家人被私下称为“皇室家族”。\n把这些元素叠在一起，再配合页面导航里的“黄仁勋被罢免”“英伟达风云”“临时首席执行官”，是不是就有了“旧司令部垮台后，把内部运作和文化贴出来清算”的感觉。\n一个把企业带到如此高度的大佬，要说没有个性那是假的，乔布斯、马斯克在也都有过“暴君”标签，但这种过往行事风格，被包装成家族特权、内部秩序来公司贬损。\n个人角度老黄未来一段时间回归英伟达的可能性其实不大了，但这么急迫搞臭一家全球市值第一的上市公司创始人还是第一次看到。大家再一次看到这一次“倒黄”背后几鼓势力合流势能之凶猛。","en":"“看我的大字报如何炮打AI司令部”，华尔街日报这篇特稿真是让我惊到了。标题直接就用了“贬损、派对与一个‘王室家族’”。核心几点：\n1）老黄本人以严苛、当面斥责闻名，会议上会说“你的问题很愚蠢”“这个想法很愚蠢”，还会用“死脸”形容被训后茫然的员工。\n2）女儿黄敏珊（Madison）被描述成实际上的幕僚长，属于非正式的“乐队”核心圈，随父走遍全球，要求同样苛刻，还会用“死脸”“金鱼”（记不住事的人）骂人。\n3）员工普遍认为公司文化是围绕黄仁勋及其成年子女建立的，几乎没有传统公司架构，黄有60个直接下属，家人被私下称为“皇室家族”。\n把这些元素叠在一起，再配合页面导航里的“黄仁勋被罢免”“英伟达风云”“临时首席执行官”，是不是就有了“旧司令部垮台后，把内部运作和文化贴出来清算”的感觉。\n一个把企业带到如此高度的大佬，要说没有个性那是假的，乔布斯、马斯克在也都有过“暴君”标签，但这种过往行事风格，被包装成家族特权、内部秩序来公司贬损。\n个人角度老黄未来一段时间回归英伟达的可能性其实不大了，但这么急迫搞臭一家全球市值第一的上市公司创始人还是第一次看到。大家再一次看到这一次“倒黄”背后几鼓势力合流势能之凶猛。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUxdTdaIAEC-J6.jpg?name=orig","https://pbs.twimg.com/media/HXUxdTXbMAAE87u.jpg?name=orig","https://pbs.twimg.com/media/HXUxdTZakAA-dgl.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122657529968857480","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":1,"rp":2,"vw":2284},{"id":"2122657303228993991","h":"fxtrader","ts":1794915912,"zh":"对于英伟达新设立的国家安全和出口管制监督委员会，特朗普表示，“这是一家伟大的公司，这是一个伟大的想法。”","en":"对于英伟达新设立的国家安全和出口管制监督委员会，特朗普表示，“这是一家伟大的公司，这是一个伟大的想法。”","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122644736548786176/vid/avc1/1280x720/VA-nDB0Hagr8aZil.mp4?tag=29"],"u":"https://x.com/fxtrader/status/2122657303228993991","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":0,"vw":742},{"id":"2122657022445588875","h":"fxtrader","ts":1794915845,"zh":"英伟达刚刚宣布，董事会决定成立一个新的常设机构——国家安全和出口管制监督委员会，专门负责监督公司的国家安全保障及全球贸易合规相关程序。\n委员会将聘请外部专家，英伟达审计委员会成员Suzanne Nora Johnson担任主席。\n现有的国家安全团队和全球贸易合规团队将向委员会和临时CEO克雷斯汇报。","en":"英伟达刚刚宣布，董事会决定成立一个新的常设机构——国家安全和出口管制监督委员会，专门负责监督公司的国家安全保障及全球贸易合规相关程序。\n委员会将聘请外部专家，英伟达审计委员会成员Suzanne Nora Johnson担任主席。\n现有的国家安全团队和全球贸易合规团队将向委员会和临时CEO克雷斯汇报。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUwRmwboAAVVs2.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122657022445588875","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":3,"rt":0,"rp":3,"vw":2241},{"id":"2122656336500629603","h":"dmjk001","ts":1794915682,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXUwrt3bMAAV_Mf.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122656336500629603","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1055},{"id":"2122656181894459763","h":"dmjk001","ts":1794915645,"zh":"路透：尽管遭到亚马逊、谷歌、Meta 及其他美国科技公司的反对，特朗普政府仍计划推进阻止进口中国数据中心设备的举措。\n路透社8月报道，美国联邦通信委员会正寻求以国家安全为由，禁止美国进口新型号的中国光收发器。光收发器使数据能够在数据中心内以光速通过光纤电缆传输。、\n据两位了解会议情况的人士透露，这些高管告诉官员们，美国企业可能需要长达十年时间才能遵守任何此类规定。\n这些游说活动曾让人怀疑该措施是否会继续推进。但据另外三位知情人士透露，该措施正在向前推进。由于相关讨论属于私下进行，这些人士要求匿名。","en":"路透：尽管遭到亚马逊、谷歌、Meta 及其他美国科技公司的反对，特朗普政府仍计划推进阻止进口中国数据中心设备的举措。\n路透社8月报道，美国联邦通信委员会正寻求以国家安全为由，禁止美国进口新型号的中国光收发器。光收发器使数据能够在数据中心内以光速通过光纤电缆传输。、\n据两位了解会议情况的人士透露，这些高管告诉官员们，美国企业可能需要长达十年时间才能遵守任何此类规定。\n这些游说活动曾让人怀疑该措施是否会继续推进。但据另外三位知情人士透露，该措施正在向前推进。由于相关讨论属于私下进行，这些人士要求匿名。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUwVOQbgAAa3d6.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122656181894459763","l":[] 算力而面临“法律诉讼”。\n目前的美国管制措施限制向中国出口先进芯片，而国会正在考虑对托管在海外数据中心芯片的远程访问授予更广泛的权限。\n英伟达表示，不会将芯片出售给那些把超过 50%图形处理器（GPU）出租给中国公司的客户。","en":"CNBC：英伟达警告芯片买家，与中国 AI 准入相关的法律风险\n消息人士称，英伟达警告客户，一项新法律可能使他们和这家芯片制造商因中国获取芯片算力而面临“法律诉讼”。\n目前的美国管制措施限制向中国出口先进芯片，而国会正在考虑对托管在海外数据中心芯片的远程访问授予更广泛的权限。\n英伟达表示，不会将芯片出售给那些把超过 50%图形处理器（GPU）出租给中国公司的客户。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUisa_b0AA43Qt.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122641197533634647","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1027},{"id":"2122639744404484398","h":"dmjk001","ts":1794911726,"zh":"路透：英伟达周二表示，已成立一个新的董事会级委员会，负责监督其国家安全政策、出口管制合规及全球贸易风险管理。","en":"路透：英伟达周二表示，已成立一个新的董事会级委员会，负责监督其国家安全政策、出口管制合规及全球贸易风险管理。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUhbbVaUAA4W9N.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122639744404484398","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":6,"rt":0,"rp":0,"vw":1316},{"id":"2122639516528001107","h":"wufantouzi","ts":1794911672,"zh":"今日盘前\ncrcl56.7\ntqqq52.4\nsoxl47.7\nbtc65.2k\nqqq661.7\n除了btc\n我认为以上四者\n现在买入半年内盈利的概率是90%以上\n收益预期不低于30%\n我真希望我现在没有仓位\n可以以这个价格买进去\n可惜我满仓太早了\n已经挨打两周了","en":"今日盘前\ncrcl56.7\ntqqq52.4\nsoxl47.7\nbtc65.2k\nqqq661.7\n除了btc\n我认为以上四者\n现在买入半年内盈利的概率是90%以上\n收益预期不低于30%\n我真希望我现在没有仓位\n可以以这个价格买进去\n可惜我满仓太早了\n已经挨打两周了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2122639516528001107","l":[],"ln":[],"t":[],"lk":27,"rt":1,"rp":8,"vw":5680},{"id":"2122638178104566092","h":"wufantouzi","ts":1794911353,"zh":"最近茅台 格力 马应龙 伊利这些涨的错\n今年5-7月份\n科技暴涨的时候\n我不断发表买入消费股的观点\n当时被嘲讽老登很厉害\n因为市场当时去追高科技\n把消费股砸的跌的太便宜\nai是机会\n但市场不止一个机会\n那会如果你买了消费股\n可以完美避开科技股的暴跌\n现在是时候买入科技股了\n不要被美股的加息、科技泡沫吓到\n其实泡沫已经去的差不多了\n因为to c端的企业已经盈利\n虽然不知道什么时候是底部\n但现在抄底crcl抄底英伟达抄底qqq\n就是上半年抄底消费股的节奏\n上半年卖掉消费股去追科技的\n正如现在卖掉科技去追消费的\n会两头挨打\n现在应该卖掉上半年抄底的消费股\n把部分仓位补上ai行业的配置\n勇敢买入泡沫破灭后\n依然有良好基本面的科技股或者etf\n我重仓的crcl\n最近确实回调了很多\n但我坚定认为\n现在是更好的买入时刻","en":"最近茅台 格力 马应龙 伊利这些涨的错\n今年5-7月份\n科技暴涨的时候\n我不断发表买入消费股的观点\n当时被嘲讽老登很厉害\n因为市场当时去追高科技\n把消费股砸的跌的太便宜\nai是机会\n但 己投资生物科技的几个原因：\n一是生物科技经历了数年的低迷，存在市场领导板块切换的机会；二是行业的技术面和价格动量正在发生变化；三是生物科技可能是AI最具潜力的应用场景之一，尤其是药物研发、疾病诊断和持续监测。\n这笔交易值得重视的地方，在于将产业技术变革、行业周期和市场资金轮动结合起来。\n未来可以重点观察生物科技ETF（$XBI）相对于纳斯达克100（$QQQ）的走势。\n2. 减持AI算力，加仓HDD\nQ3德鲁肯米勒对半导体进行了大幅调仓：\n清仓AMD、Sandisk、Google。\n减持94.5%的台积电、47.9%的意法半导体。\n增持180.2%的希捷科技（$STX）。\n新建仓希捷看涨期权及西部数据（$WDC）。\n两家HDD厂商合计占其13F申报市值的9.9%（含期权对应标的市值）。\n尤其值得注意的是，他清仓了做NAND的Sandisk，同时买入了做HDD的西部数据。\n相比其他半导体细分赛道，HDD具有行业竞争格局高度集中、资本开支相对克制、供给弹性有限等特点。随着AI生成的数据量不断增长，海量数据的长期存储需求，有望转化为HDD厂商的定价能力、利润率和自由现金流增长。\n希捷10月底公布的财报也部分验证了这一逻辑，单季度自由现金流达到14.79亿美元，创历史新高。\n不过，随着AI数据中心融资环境恶化，HDD未来的需求增长也存在被下修的风险。\n3. 从AI基础设施向AI应用进行切换\nQ3德鲁肯米勒大幅增加了部分AI应用公司的配置：\n增持435.5%的Unity（$U）。\n增持42.7%的亚马逊（$AMZN）。\n新建仓AppLovin（$APP）。\n新建仓Palantir（$PLTR）。\n其中Unity和AppLovin这组交易尤其值得关注，两家公司都能通过AI算法提高广告投放效率，并将技术进步直接转化为收入和利润。\n最新财报显示，Unity的AI广告平台Vector收入同比增长126%，AppLovin营收同比增长55%，净利润增长72%。\n过去几年，AI产业的超额利润主要集中在上游算力厂商。但随着模型能力提升、推理成本下降以及竞争加剧，超额利润可能逐渐向具有用户、数据和商业化优势的下游应用公司转移。\n相比需要投入巨额资本开支的云厂商，部分AI应用公司具有更好的资本回报率和利润增长潜力。\n4. 宏观层面：警惕资本稀缺和AI融资风险\n9月10日，据《金融时报》报道，德鲁肯米勒认为，考虑到美国经济、资本开支热潮以及对资本的争夺，即便当时美债收益率已经明显上升，利率可能依然偏低。\n据11月16日《华尔街日报》报道，德鲁肯米勒近期与Paul Tudor Jones在一场闭门会议上就AI泡沫展开辩论。\n他表达了几个重要观点：\nAI是历史上规模最大的技术变革之一。\n其家族办公室已经削减AI相关投资敞口。\n英伟达目前正在获取超常水平的利润（overearning），未来利润率可能下降，竞争对手也会获得更多市场份额。\n资本市场未必愿意为计划中的大规模AI数据中心建设提供足够资金。\n最后一点尤其重要。\n美国政府财政赤字、Hyperscaler资本开支、Neocloud债务融资，都在争夺有限的资本。资本成本的上升，可能成为制约下一阶段AI发展的重要因素。\n此外，德鲁肯米勒在Q3退出了多项宽基指数看涨期权，并同时新建仓三大黄金矿业公司Newmont（$NEM）、Barrick（$B）和Agnico Eagle（$AEM）。\n结合他此前长期看空美元、担忧美国财政可持续性的观点，这部分配置也具有一定的宏观交易属性。\n5. 结合近期行情，推测他四季度做了什么？\n如果按照9月30日披露的持仓静态计算，截至11月16日，德鲁肯米勒的正股组合累计下跌约15.3%，其中两大核心重仓Natera和希捷科技分别下跌约30%和46%。\n相比之下，Unity和AppLovin分别上涨约27%和43%。\n与此同时，美国10年期国债收益率突破5%，AI基础设施企业的信用风险显著上升。\n结合他的近期发言及一贯灵活的交易风格，我推测他在四季度可能进行了以下调整：\n一是进一步削减AI硬件敞口，特别是对数据中心建设速度高度敏感的公司；二是降低部分重仓股的集中度；三是保留部分AI应用和生物科技公司的配置；四是通过现金、短期国债或宏观对冲降低组合整体风险。\n至于加密货币，虽然他在10月29日公开确认投资了Trade[XYZ]，但其Q3加密相关上市公司持仓市值实际上环比下降了约13%。目前没有充分证据表明他正在增加加密资产的方向性多头敞口。\n总结\n我认为，德鲁肯米勒当前的投资主线，可以归纳为四个方向：\n生物科技的行业复苏与技术变革。\nAI产业链内部的利润重新分配。\n具有供给约束和定价能力的细分行业。\n资本成本上升背景下的宏观风险管理。\n过去三年，AI投资最重要的变量是需求增长。未来三年，竞争格局、资本成本、自由现金流和投资回报率可能变得更加重要。\n即使AI产业继续高速发展，产业增长与股东回报之间也可能出现显著分化。\n注：13F持仓截至9月30日，组合收益为不含期权、股息及期间调仓的静态模拟，四季度交易方向为个人推测。","en":"德鲁肯米勒最新13F：AI产业利润的重新分配\n11月16日，德鲁肯米勒（Stanley Druckenmiller）旗下Duquesne Family Office公布了2026年Q3持仓，13F申报总市值为44.71亿美元，环比下降14.2%，持仓数量从95项减少至65项。\n结合最近几个季度的持仓变化、他今年的公开采访，以及11月份的美股行情，我认为他的投资思路正在发生一些比较重要的变化。\n1. 生物科技可能成为下一轮市场的主线\n很多人关注德鲁肯米勒的半导体持仓，却忽略了生物医药已经成为他最大的配置方向，占13F申报市值的四成左右。\n第一大重仓股是癌症及基因检测公司Natera（$NTRA），持仓市值13.06亿美元，占比从上季度的16.6%上升至29.2%。不过，这期间他的持仓股数实际减少了0.8%，权重提升主要来自股价上涨和其他仓位的收缩。\n此外，他还持有大量生物科技公司，包括：\n$INSM：罕见病治疗\n$RVMD：RAS靶向抗癌药\n$NAMS：心血管疾病创新药\n$BEAM：基因碱基编辑\n$RLAY：精准药物研发\n今年3月，德鲁肯米勒在接受摩根士丹利采访时，解释了自己投资生物科技的几个原因：\n一是生物科技经历了数年的低迷，存在市场领导板块切换的机会；二是行业的技术面和价格动量正在发生变化；三是生物科技可能是AI最具潜力的应用场景之一，尤其是药物研发、疾病诊断和持续监测。\n这笔交易值得重视的地方，在于将产业技术变革、行业周期和市场资金轮动结合起来。\n未来可以重点观察生物科技ETF（$XBI）相对于纳斯达克100（$QQQ）的走势。\n2. 减持AI算力，加仓HDD\nQ3德鲁肯米勒对半导体进行了大幅调仓：\n清仓AMD、Sandisk、Google。\n减持94.5%的台积电、47.9%的意法半导体。\n增持180.2%的希捷科技（$STX）。\n新建仓希捷看涨期权及西部数据（$WDC）。\n两家HDD厂商合计占其13F申报市值的9.9%（含期权对应标的市值）。\n尤其值得注意的是，他清仓了做NAND的Sandisk，同时买入了做HDD的西部数据。\n相比其他半导体细分赛道，HDD具有行业竞争格局高度集中、资本开支相对克制、供给弹性有限等特点。随着AI生成的数据量不断增长，海量数据的长期存储需求，有望转化为HDD厂商的定价能力、利润率和自由现金流增长。\n希捷10月底公布的财报也部分验证了这一逻辑，单季度自由现金流达到14.79亿美元，创历史新高。\n不过，随着AI数据中心融资环境恶化，HDD未来的需求增长也存在被下修的风险。\n3. 从AI基础设施向AI应用进行切换\nQ3德鲁肯米勒大幅增加了部分AI应用公司的配置：\n增持435.5%的Unity（$U）。\n增持42.7%的亚马逊（$AMZN）。\n新建仓AppLovin（$APP）。\n新建仓Palantir（$PLTR）。\n其中Unity和AppLovin这组交易尤其值得关注，两家公司都能通过AI算法提高广告投放效率，并将技术进步直接转化为收入和利润。\n最新财报显示，Unity的AI广告平台Vector收入同比增长126%，AppLovin营收同比增长55%，净利润增长72%。\n过去几年，AI产业的超额利润主要集中在上游算力厂商。但随着模型能力提升、推理成本下降以及竞争加剧，超额利润可能逐渐向具有用户、数据和商业化优势的下游应用公司转移。\n相比需要投入巨额资本开支的云厂商，部分AI应用公司具有更好的资本回报率和利润增长潜力。\n4. 宏观层面：警惕资本稀缺和AI融资风险\n9月10日，据《金融时报》报道，德鲁肯米勒认为，考虑到美国经济、资本开支热潮以及对资本的争夺，即便当时美债收益率已经明显上升，利率可能依然偏低。\n据11月16日《华尔街日报》报道，德鲁肯米勒近期与Paul Tudor Jones在一场闭门会议上就AI泡沫展开辩论。\n他表达了几个重要观点：\nAI是历史上规模最大的技术变革之一。\n其家族办公室已经削减AI相关投资敞口。\n英伟达目前正在获取超常水平的利润（overearning），未来利润率可能下降，竞争对手也会获得更多市场份额。\n资本市场未必愿意为计划中的大规模AI数据中心建设提供足够资金。\n最后一点尤其重要。\n美国政府财政赤字、Hyperscaler资本开支、Neocloud债务融资，都在争夺有限的资本。资本成本的上升，可能成为制约下一阶段AI发展的重要因素。\n此外，德鲁肯米勒在Q3退出了多项宽基指数看涨期权，并同时新建仓三大黄金矿业公司Newmont（$NEM）、Barrick（$B）和Agnico Eagle（$AEM）。\n结合他此前长期看空美元、担忧美国财政可持续性的观点，这部分配置也具有一定的宏观交易属性。\n5. 结合近期行情，推测他四季度做了什么？\n如果按照9月30日披露的持仓静态计算，截至11月16日，德鲁肯米勒的正股组合累计下跌约15.3%，其中两大核心重仓Natera和希捷科技分别下跌约30%和46%。\n相比之下，Unity和AppLovin分别上涨约27%和43%。\n与此同时，美国10年期国债收益率突破5%，AI基础设施企业的信用风险显著上升。\n结合他的近期发言及一贯灵活的交易风格，我推测他在四季度可能进行了以下调整：\n一是进一步削减AI硬件敞口，特别是对数据中心建设速度高度敏感的公司；二是降低部分重仓股的集中度；三是保留部分AI应用和生物科技公司的配置；四是通过现金、短期国债或宏观对冲降低组合整体风险。\n至于加密货币，虽然他在10月29日公开确认投资了Trade[XYZ]，但其Q3加密相关上市公司持仓市值实际上环比下降了约13%。目前没有充分证据表明他正在增加加密资产的方向性多头敞口。\n总结\n我认为，德鲁肯米勒当前的投资主线，可以归纳为四个方向：\n生物科技的行业复苏与技术变革。\nAI产业链内部的利润重新分配。\n具有供给约束和定价能力的细分行业。\n资本成本上升背景下的宏观风险管理。\n过去三年，AI投资最重要的变量是需求增长。未来三年，竞争格局、资本成本、自由现金流和投资回报率可能变得更加重要。\n即使AI产业继续高速发展，产业增长与股东回报之间也可能出现显著分化。\n注：13F持仓截至9月30日，组合收益为不含期权、股息及期间调仓的静态模拟，四季度交易方向为个人推测。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUapHybUAAMjx5.jpg?name=orig"],"u":"https://x.com/xingpt/status/2122632109106012451","l":[],"ln":[],"t":["美股","AI科技","财报","黄金"],"lk":9,"rt":0,"rp":5,"vw":1378},{"id":"2122631764090966140","h":"cnfinancewatch","ts":1794909823,"zh":"晚上了\n#互关 16摊位出摊\n今天椒友16个。看看能不能有16给老铁给面！","en":"晚上了\n#互关 16摊位出摊\n今天椒友16个。看看能不能有16给老铁给面！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122631764090966140","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":1098},{"id":"2122630837426409743","h":"bbcchinese","ts":1794909602,"zh":"英国演员罗伯·派汀森（Robert Pattinson）将成为下一任詹姆士·庞德（James Bond）。\n亚马逊米高梅影业（Amazon MGM Studios）周一（11月16日）宣布这项消息，表示派汀森将接棒在长寿间谍系列电影中卸任的丹尼尔．克雷格（Daniel Craig）。\n以英国情报员庞德为主角的《007》系列，向来以主角的魅力、量身订制的燕尾服，以及经典台词“马丁尼要摇匀，不要搅拌（shaken, not stirred）”闻名。这也是好莱坞史上历时最久、票房最高的电影系列之一。","en":"英国演员罗伯·派汀森（Robert Pattinson）将成为下一任詹姆士·庞德（James Bond）。\n亚马逊米高梅影业（Amazon MGM Studios）周一（11月16日）宣布这项消息，表示派汀森将接棒在长寿间谍系列电影中卸任的丹尼尔．克雷格（Daniel Craig）。\n以英国情报员庞德为主角的《007》系列，向来以主角的魅力、量身订制的燕尾服，以及经典台词“马丁尼要摇匀，不要搅拌（shaken, not stirred）”闻名。这也是好莱坞史上历时最久、票房最高的电影系列之一。","zh_src":"native","lang":"zh"," -meeting-yalta-conference-2026-11-17/?taid=6afc1ea2be5ec50001f28555&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":298},{"id":"2122620049089544371","h":"fxtrader","ts":1794907030,"zh":"韩国《每日经济新闻》报道，三星电子与苹果即将签署DRAM（动态随机存取存储器）长期供应协议（LTA）。作为全球最大的消费电子产品企业，苹果是大型科技公司中唯一一家尚未与三星电子签署LTA的企业。\n据业界17日消息，三星电子与苹果正在进行最后阶段的协议磋商。该协议拟从明年上半年开始生效，期限为4至5年。\n据悉，协议还将设定DRAM供应量下限，同时根据未来市场情况最终确定价格。此次协议背后，被认为是日益严峻的存储芯片供应紧张局面。\n分析认为，为确保iPhone、MacBook等核心产品所需DRAM的稳定供应，苹果最终选择签署长期供应协议。三星电子、SK海力士和美光等三大存储芯片制造商相继与主要客户签署LTA，也对苹果产生了影响。据悉，苹果近期也已与SK海力士签署存储芯片供应长期协议，且协议条件更有利于供应商。","en":"韩国《每日经济新闻》报道，三星电子与苹果即将签署DRAM（动态随机存取存储器）长期供应协议（LTA）。作为全球最大的消费电子产品企业，苹果是大型科技公司中唯一一家尚未与三星电子签署LTA的企业。\n据业界17日消息，三星电子与苹果正在进行最后阶段的协议磋商。该协议拟从明年上半年开始生效，期限为4至5年。\n据悉，协议还将设定DRAM供应量下限，同时根据未来市场情况最终确定价格。此次协议背后，被认为是日益严峻的存储芯片供应紧张局面。\n分析认为，为确保iPhone、MacBook等核心产品所需DRAM的稳定供应，苹果最终选择签署长期供应协议。三星电子、SK海力士和美光等三大存储芯片制造商相继与主要客户签署LTA，也对苹果产生了影响。据悉，苹果近期也已与SK海力士签署存储芯片供应长期协议，且协议条件更有利于供应商。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUPqcka0AAe64P.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122620049089544371","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":0,"rp":0,"vw":4086},{"id":"2122615839459307859","h":"ReutersChina","ts":1794906027,"zh":"据官方蒙萨姆通讯社报道，在反对党指控总统和高级官员腐败后，蒙古总统呼日勒苏赫·乌赫纳周二宣布辞职。","en":"Mongolian President Khurelsukh Ukhnaa announced his resignation on Tuesday after the opposition party accused the president and top officials of corruption, the official Montsame news agency reported.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122615839459307859","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/mongolian-president-announces-resignation-over-alleged-corruption-2026-11-17/?taid=6afc17ab6018910001a15968&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":1,"rt":0,"rp":0,"vw":333},{"id":"2122615740348178918","h":"bbcchinese","ts":1794906003,"zh":"你吃过无人机送的外卖吗？在深圳，这已成 仓。\n明确不做：半导体和AI硬件，英伟达今晚美股盘后出换帅后第一份财报，周一收156.14，跌4.12%，处在20日区间只剩10%的位置；已经大涨或五日涨幅过大的品种；ARK同买但仍在阴跌的箱底票，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指分化。纳指期货27311，较周一结算27284涨约0.1%；标普期货7425，跌约0.2%；道指期货51489，跌约0.4%。周一纳指收24509.76，跌2.49%，已经离开10月收盘高点10%以上，重新进入技术性调整；标普7416.59，跌1.92%；道指51608.17，跌1.41%；费城半导体跌5.28%。A股今天收盘，上证3584.58跌0.50%，创业板跌1.20%，科创50收1221.19，涨0.62%，比午后低点有所回升。\n #英伟达 $NVDA 今晚盘后发布三季报，是黄仁勋辞职、原CFO克雷斯任临时CEO后的第一份财报。华尔街预期营收约1090亿美元，高于公司自身1080亿美元上下的指引，每股收益约2.47美元。有报道称黄仁勋方面在讨论回归，Yorkville的丹·艾夫斯认为回归希望不大，并下调了预期。有机构把期权隐含波动大约估在7.8%。家得宝、迪士尼今晚美股盘前出季报，明天还有零售销售数据。Anthropic计划周三定价、周四以\n$ANT 在纳斯达克挂牌，区间70到78美元，是本周AI估值的第二块试金石。WTI原油现报84.81美元，较周一再跌约1%，较上周五的88.56已经明显回落。10年期美债收益率周一收5.12%，美元指数约103.47，仍靠近近期高位。VIX周一升至22.91。\n高权重事件里， #CG Oncology $CGON\n公布三期PIVOT-006达到主要终点，膀胱癌复发风险下降68%，事件分最高；但周一放量收84.78，五日涨13.4%，20日涨41%，量比超过8倍，已经伸展，只看不追。\n#Powell工业 $POWL\n周一盘后公布四季度营收3.97亿美元，同比增33%，每股收益2.23美元，新订单7.10亿，积压订单升至27亿美元；周一股价已收151.20，处在20日区间59%，等回踩再看。\n#雷神技术 $RTX 积压订单升至1300亿美元，标普把信用评级上调至A-，但股价在区间中部，距20日高还有5.5%，不追。\n#研报面\n #苹果 卖方均值目标价345.57美元，买入16家、持有8家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。\n#菲利普斯66 $PSX 均值目标价299.13美元，区间258到346美元，买入6家无卖出，近四周EPS上修22家、下修2家。 #Grid\nDynamics $GDYN 均值13.75美元，4家全是买入，近四周EPS上修9家，但今天有律所发布股东调查通知，研报再好也先放一放。\n#资金面\nARK两只及以上基金同买的有三只。 #太空探索科技 $SPCX\n获ARKK与ARKW同买，合计约5190万美元，是本期金额最大的一笔；期权最大Put行权价135，距现价只差1.72%，偏空，和基金买入方向相反，不能算多头共振。\n#Block $XYZ 、 #Shopify $SHOP\n也是多基金同买，但股价分别在20日区间59%和29%，五日仍在回撤，位置不够。邮件还记了ARKQ买入 #火箭实验室 $RKLB\n约90万美元，公开交易记录未核验到；即便算上，期权最大Put行权价57贴着现价57.37，也是偏空，不算共振。\n带方向的期权里，只有 #苹果 最干净：最大Call行权价355距现价-0.36%，量仓比24.14，Call持仓增仓5.5%，三项同向。\n#菲利普斯66 最大Call量仓比4.84、Call持仓增仓1.3%，P/C成交比只有0.04，但行权价220距现价远了17%，只能记偏多、不能当贴价看涨。\n#Grid Dynamics 期权P/C成交比1.82，空单放量，没有多头共振。\n#期货\n邮件给出的持仓变化，量能口径更接近上周五：标普迷你OI增4.88万手、量比0.99，纳指迷你OI增9072手、量比1.05，价跌但量能未确认，暂不定性。微型纳指价跌OI降，属多头离场。10年期美债价涨OI降，属空头回补；30年期美债价跌OI降，属多头离场。原油价跌OI降3.45万手，多头离场；黄金价涨OI降，空头回补。周一股指继续下跌，今天盘前只是纳指期货略高、标普微跌，还看不到新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨13.45%、 $ITB 涨9.98%、 $PHO 与 $FIW 各涨9.61%、 $IHE 涨9.01%、\n$AGNG 涨8.72%、 $XHB 涨7.31%、 $XLV 涨6.96%、 $XLU 涨6.67%、 4，Call持仓增仓5.5%，三项同向。\n#菲利普斯66 最大Call量仓比4.84、Call持仓增仓1.3%，P/C成交比只有0.04，但行权价220距现价远了17%，只能记偏多、不能当贴价看涨。\n#Grid Dynamics 期权P/C成交比1.82，空单放量，没有多头共振。\n#期货\n邮件给出的持仓变化，量能口径更接近上周五：标普迷你OI增4.88万手、量比0.99，纳指迷你OI增9072手、量比1.05，价跌但量能未确认，暂不定性。微型纳指价跌OI降，属多头离场。10年期美债价涨OI降，属空头回补；30年期美债价跌OI降，属多头离场。原油价跌OI降3.45万手，多头离场；黄金价涨OI降，空头回补。周一股指继续下跌，今天盘前只是纳指期货略高、标普微跌，还看不到新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨13.45%、 $ITB 涨9.98%、 $PHO 与 $FIW 各涨9.61%、 $IHE 涨9.01%、\n$AGNG 涨8.72%、 $XHB 涨7.31%、 $XLV 涨6.96%、 $XLU 涨6.67%、 $XLP 涨6.18%、 $XLF\n涨5.67%。A股这边，消费50ETF涨9.40%、消费ETF涨6.93%、酒ETF涨6.44%、银行ETF涨5.77%领先。5日窗口，美股只有\n$XLE 涨2.83%、 $XLP 涨","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122610469538247089","l":[],"ln":[],"t":["美股","A股港股","汇率","原油能源","AI科技","财报","黄金"],"lk":0,"rt":0,"rp":1,"vw":523},{"id":"2122608242698211742","h":"ReutersChina","ts":1794904215,"zh":"巴布亚新几内亚总理詹姆斯·马拉佩周二告诉中国国家主席习近平，关闭台湾驻巴布亚新几内亚办事处“并不容易”，并承认他在这样做时面临国内挑战。","en":"Papua New Guinea's Prime Minister James Marape told Chinese President Xi Jinping on Tuesday that it \"wasn't easy\" to close Taiwan's office in his country, acknowledging he faced domestic challenges in doing so.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122608242698211742","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/papua-new-guineas-prime-minister-says-taiwan-does-not-operate-there-anymore-2026-11-17/?taid=6afc109738c51300013dfeba&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":401},{"id":"2122607980252111077","h":"qinbafrank","ts":1794904153,"zh":"美股又多了一个能影响股票定价的资产类型，永续合约这一币市原创终于在美股登堂入室。这两天才注意到本月初11月3日，CFTC主席Michael S. Selig 正式宣布，美股个股永续合约可以在符合条件的美国交易所开始交易。这些合约被依据CFTCRegulation 40.3 视为已批准定性为《商品期货现代化法案》下的 security futures products（证券期货产品），由 CFTC 和 SEC 联合监管。\n要求交易所必须同时满足：\n1）CFTC 的DCM牌照；\n2）SEC 的 notice-registered national securities exchange备案（针对 security futures）；\n要特别注意，这是直接挂钩美股正股价格的永续期货合约，不是很多加密交易所上的代币化股票（tokenized stocks）合约。这次美股个股永续合约是CFTC/SEC 框架下的 Equity Perps ，与加密交易所上的美股代币合约是安全不同产品。前者是美国监管机构批准能直接面对美国客户的产品，前者是监管灰色地带的产物。\nKalshi 已在11月5日前后上线，覆盖约50只大型个股（如 Nvidia、SpaceX、Micron 等）。上线10天左右名义成交量已达约50亿美元，单日部分热门标的（如 Nvidia）能到上亿美元级别。Coinbase已经在准备、Backpack也计划很快上线美股个股永续合约。\n这个意义还是非常大的，之前美股只有股指期货合约，并没有个股合约而永续合约更是币市原创，大家只能玩正股和期权。现在美股个股永续合约已经被正式批准，美股又多了一个能影响定价的资产类型。\n现在加密永续已经是一个日成交数千美元、年成交几十万亿美元接近百万亿美金级别的成熟市场。从长期天花板来看，美股个股永续合约（Equity Perps）的潜力确实更大，原因很直接：\n1）底层市场规模差距巨大\n美股市值远超加密资产。传统股权衍生品（股票/指数期货和期权）本身就是万亿美元级别的成熟市场，年合约成交量以百亿张计。如果美股永续能分到传统股权衍生品的一部分流量，或吸引新的杠杆/投机需求，规模很容易超过当前的加密永续。\n2）需求场景更广泛 加密永续高度依赖加密圈内的杠杆交易文化；美股永续则可以同时吸引传统股票投资者、对冲基金、散户杠杆需求，以及希望更简单做空的用户。\n当然短期内规模还需要时间，增长不会那么迅速。毕竟也有限制：\n1）目前美国合规版本的杠杆被压得较低（大致 5–7 倍左右），远低于离岸加密永续常见的 20–100 倍。\n2）产品才刚推出，流动性还在建立阶段；\n3）加密永续已经跑了近十年，生态和用户习惯非常成熟；美股永续还需要时间积累流动性、经纪通道和用户教育。\n现在还面临法律挑战：Cboe 和 Citadel 等组成的团体已起诉 CFTC，认为其无权批准这类产品。法官初步认为原告“很可能在实体问题上胜诉”，但拒绝了紧急禁令，最终结果还不确定、还要看双方博弈的情况。\n美股个股永续如果能在监管和法律挑战中站稳，并逐步提升流动性和可接受度，中长期确实有机会成长到比当前加密永续更大的规模，但那应该是几年后的事情了。","en":"美股又多了一个能影响股票定价的资产类型，永续合约这一币市原创终于在美股登堂入室。这两天才注意到本月初11月3日，CFTC主席Michael S. Selig 正式宣布，美股个股永续合约可以在符合条件的美国交易所开始交易。这些合约被依据CFTCRegulation 40.3 视为已批准定性为《商品期货现代化法案》下的 security futures products（证券期货产品），由 CFTC 和 SEC 联合监管。\n要求交易所必须同时满足：\n1）CFTC 的DCM牌照；\n2）SEC 的 notice-registered national securities exchange备案（针对 security futures）；\n要特别注意，这是直接挂钩美股正股价格的永续期货合约，不是很多加密交易所上的代币化股票（tokenized stocks）合约。这次美股个股永续合约是CFTC/SEC 框架下的 Equity Perps ，与加密交易所上的美股代币合约是安全不同产品。前者是美国监管机构批准能直接面对美国客户的产品，前者是监管灰色地带的产物。\nKalshi 已在11月5日前后上线，覆盖约50只大型个股（如 Nvidia、SpaceX、Micron 等）。上线10天左右名义成交量已达约50亿美元，单日部分热门标的（如 Nvidia）能到上亿美元级别。Coinbase已经在准备、Backpack也计划很快上线美股个股永续合约。\n这个意义还是非常大的，之前美股只有股指期货合约，并没有个股合约而永续合约更是币市原创，大家只能玩正股和期权。现在美股个股永续合约已经被正式批准，美股又多了一个能影响定价的资产类型。\n现在加密永续已经是一个日成交数千美元、年成交几十万亿美元接近百万亿美金级别的成熟市场。从长期天花板来看，美股个股永续合约（Equity Perps）的潜力确实更大，原因很直接：\n1）底层市场规模差距巨大\n美股市值远超加密资产。传统股权衍生品（股票/指数期货和期权）本身就是万亿美元级别的成熟市场，年合约成交量以百亿张计。如果美股永续能分到传统股权衍生品的一部分流量，或吸引新的杠杆/投机需求，规模很容易超过当前的加密永续。\n2）需求场景更广泛 加密永续高度依赖加密圈内的杠杆交易文化；美股永续则可以同时吸引传统股票投资者、对冲基金、散户杠杆需求，以及希望更简单做空的用户。\n当然短期内规模还需要时间，增长不会 OL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意思多了。\n二，交易也能像玩游戏一样升级\n这是我个人最喜欢的设计。\n引入了 XP、等级、成就和 Trading Drops 机制。\n交易产生的成交量可以转化为 XP，XP 累积之后可以提升等级。\n随着参与度增加，还能获得不同稀有度的 Mystery Box。\n里面有头像框、专属名牌、称号和弹幕样式等个性化道具。\n从 Common 到 Legendary，一共有四个稀有度。\n你甚至可以通过自己的等级、头像框和称号，让其他人知道你在这个社区里的身份。\n这就有点像 MMORPG 里的角色成长系统。\n每个人都有自己的等级、装备和专属身份。\n交易之外，还多了一层收集和养成的乐趣。\n三，把交易、社交和游戏放进同一个地方\n的底层交易接入 Hyperliquid。\n它把行情、交易执行、实时聊天室、K 线弹幕和游戏化奖励融合在一个界面里。\n这意味着你不需要在行情软件、X、Telegram 和 DEX 之间反复切换。\n看行情、讨论市场、观察其他人的观点，以及执行交易，都可以在同一个地方完成。\n这也是它和传统 DEX 最明显的差异。\n传统 DEX 更像一个交易终端， 则试图把它变成一个有社区、有互动、有成长体系的交易空间。\n我一直认为，加密的特殊之处在于：价格由交易决定，叙事靠社区传播，情绪在社交网络里发酵。\n如果这些东西能够在同一个产品里形成闭环，用户体验自然会发生变化。\n当然，游戏化奖励只是额外体验，没必要为了刷 XP 而过度交易。\n但我确实很喜欢 的产品思路。\n交易本来就可以很有趣。\n一个人盯盘是交易，一群人一起看市场、讨论行情、分享观点，或许才是加密社区更有生命力的样子。\n想体验一下这种交易方式，可以去看看：\nTrade together, farm fun together.","en":"想像玩游戏一样做交易吗？\n大家还记得前两天的 LOL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意
