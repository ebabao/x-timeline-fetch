的政策，所有资产都存在泡沫。","en":"Gensler 警告：AI 热潮已是泡沫，终将破裂\n前美国证券交易委员会（SEC）主席加里·根斯勒（Gary Gensler）称，AI 热潮是一个泡沫，其背后是每年 8000 亿美元的基础设施支出，规模过大，部分环节还背负着债务。\n他预测经济将陷入衰退，程度可能比 2008 年温和，但与 2000 年代初的互联网泡沫破裂相似：大型科技公司将挺过去，规模较小的云服务提供商则会被整合或倒闭。\n美联储的凯文·沃什（Kevin Warsh）勾勒了三种 AI 情景，从生产率提升到就业岗位流失，再到热潮退去后的失望；与此同时，在通胀降温和油价下跌的背景下，市场大举押注 12 月加息。投资者彼得·席夫（Peter Schiff）警告称，由于美联储过去的政策，所有资产都存在泡沫。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122841034476675374","l":[],"ln":[],"t":["美联储","通胀","原油能源","AI科技"],"lk":4,"rt":0,"rp":1,"vw":939},{"id":"2122840828473410042","h":"dmjk001","ts":1794959668,"zh":"路透：英伟达董事长表示董事会不会重新聘请黄仁勋担任 CEO\n英伟达董事会主席哈维·琼斯在周二的投资者电话会议开场时表示，这家 AI 芯片公司不会重新聘请联合创始人黄仁勋担任 CEO，也不会回答有关他离职的问题。\n琼斯表示，董事会已聘请高管猎头公司海德思哲协助寻找新任 CEO。“我们希望尽快任命 CEO，即常任 CEO，但在找到完全合适的人选之前，我们不会仓促推进，”他补充道。","en":"路透：英伟达董事长表示董事会不会重新聘请黄仁勋担任 CEO\n英伟达董事会主席哈维·琼斯在周二的投资者电话会议开场时表示，这家 AI 芯片公司不会重新聘请联合创始人黄仁勋担任 CEO，也不会回答有关他离职的问题。\n琼斯表示，董事会已聘请高管猎头公司海德思哲协助寻找新任 CEO。“我们希望尽快任命 CEO，即常任 CEO，但在找到完全合适的人选之前，我们不会仓促推进，”他补充道。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXXYKNCbsAACWty.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122840828473410042","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1059},{"id":"2122840752397156444","h":"bboczeng","ts":1794959650,"zh":"为何粉丝流失94%后仍有100万粉丝\nX的投资者都是弱智吗？\n谢谢\n😅😅😅\n@aleabitoreddit","en":"Why does he still have 1M followers after losing 94%\nAre all investors in X retarded?\nThanks\n😅😅😅\n@aleabitoreddit","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXXXmaxbYAAOmoQ.jpg?name=orig"],"u":"https://x.com/bboczeng/status/2122840752397156444","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":729},{"id":"2122840047095533776","h":"LucyBuilding","ts":1794959482,"zh":"昨晚半导体盘中大跌，尾盘拉了回来。英伟达盘后给出超预期的营收指引，芯片股又反弹了一轮。我暂时还是按财报反弹看，还是要看今晚开盘后的表现。 大家觉得这波是财报后的短线反弹，还是半导体有见底的迹象？\n这种行情我真觉得新手很难做。跌多了想抄底，买进去才发现还在半山腰。等涨起来想做右侧，刚追进去，第一波冲高就被埋了。来回几次，就不敢操作了，跌了怕继续跌，涨了又怕错过，心态全崩，操作变形。这种感觉之前经历过，太刻骨铭心了，所以这轮谨慎很多。","en":"昨晚半导体盘中大跌，尾盘拉了回来。英伟达盘后给出超预期的营收指引，芯片股又反弹了一轮。我暂时还是按财报反弹看 is，aehr，nok，cbrs，be，感慨自己“抄了一个大底”危险\n😅😅😅","en":"@ShanghaoJin 至少没有你今年8月份打光子弹买入nbis，aehr，nok，cbrs，be，感慨自己“抄了一个大底”危险\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122809066770882828","l":[],"ln":[],"t":[],"lk":6,"rt":1,"rp":0,"vw":765},{"id":"2122808331026981192","h":"bboczeng","ts":1794951920,"zh":"浑水正式开始做空英伟达\n一名被认定为Cenly Chen的女子（在部分照片标注中被称为Cenly Puri），在2024年至2026年间多次与Ajay K. Puri一同被拍到出现在公共场合。\n直到今年6月，Puri先生很可能都是英伟达的第三号高管，仅次于黄仁勋和Colette Kress。他的职位是全球现场运营执行副总裁（EVP Worldwide Field Operations），在2024至2026财年的总薪酬略高于Kress女士。\nPuri先生是2026年委托书中点名的仅有五位英伟达高管之一。\n另外，2026年10月针对美超微（SMCI）提起的合并集体诉讼起诉书称，美超微前首席增长官、一名叫Cenly Chen的女子\"负责管理SMCI从英伟达采购GPU芯片\"，并\"决定如何在美超微的客户之间分配英伟达的GPU\"。\n今年3月，美国对与美超微有关的三人提起刑事指控，其中包括一名联合创始人，指控他们通过一家东南亚的空壳公司，向中国最终客户非法销售至少约25亿美元搭载英伟达GPU的美超微服务器。针对这名美超微前高管，集体诉讼起诉书称，\"Cenly Chen不可能不知道SMCI的非法销售\"。\nPuri先生于2026年6月下旬离开英伟达，而名为Cenly Chen的美超微前高管于2026年4月底或5月初离开美超微。Puri先生目前仍在英伟达担任高级顾问职务。\n目前没有任何政府对名为Cenly Chen的人提起刑事指控或作出其他刑事指控。集体诉讼中的指控尚未得到证实。\n问题在于：照片中与Puri先生同框、被认定为Cenly Chen或Cenly Puri的女子，是否就是曾在美超微任职的那位Cenly Chen。","en":"浑水正式开始做空英伟达\n一名被认定为Cenly Chen的女子（在部分照片标注中被称为Cenly Puri），在2024年至2026年间多次与Ajay K. Puri一同被拍到出现在公共场合。\n直到今年6月，Puri先生很可能都是英伟达的第三号高管，仅次于黄仁勋和Colette Kress。他的职位是全球现场运营执行副总裁（EVP Worldwide Field Operations），在2024至2026财年的总薪酬略高于Kress女士。\nPuri先生是2026年委托书中点名的仅有五位英伟达高管之一。\n另外，2026年10月针对美超微（SMCI）提起的合并集体诉讼起诉书称，美超微前首席增长官、一名叫Cenly Chen的女子\"负责管理SMCI从英伟达采购GPU芯片\"，并\"决定如何在美超微的客户之间分配英伟达的GPU\"。\n今年3月，美国对与美超微有关的三人提起刑事指控，其中包括一名联合创始人，指控他们通过一家东南亚的空壳公司，向中国最终客户非法销售至少约25亿美元搭载英伟达GPU的美超微服务器。针对这名美超微前高管，集体诉讼起诉书称，\"Cenly Chen不可能不知道SMCI的非法销售\"。\nPuri先生于2026年6月下旬离开英伟达，而名为Cenly Chen的美超微前高管于2026年4月底或5月初离开美超微。Puri先生目前仍在英伟达担任高级顾问职务。\n目前没有任何政府对名为Cenly Chen的人提起刑事指控或作出其他刑事指控。集体诉讼中的指控尚未得到证实。\n问题在于：照片中与Puri先生同框、被认定为Cenly Chen或Cenly Puri的女子，是否就是曾在美超微任职的那位Cenly Chen。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122808331026981192","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1140},{"id":"2122807361954054146","h":"Balder13946731","t 个世界上没有什么王牌投资KOL，KOL也救不了你\n请你别把时间浪费在他们身上了\n这波历史性的大熊结束之后，我估计也会逐渐隐退\n谢谢\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122752062618567019","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":282},{"id":"2122749192141733912","h":"ShanghaoJin","ts":1794937820,"zh":"作为多头的消费、医疗、utility，每年增长2-6%。现在升息环境，增长还追不上利息。却仅仅因为做空50%增长的semi而暴涨\n要么long short动能爆仓，要么经济变差一起跌。总之我看不到一点可能，这些高度拥挤、一致的仓位不出问题的\n愿意相信每年增长3-5%的医疗，30/31年会全部因为AI增长50%。却不愿意相信Semi作为AI基础，28/29年能不降速。你们知道多危险吗","en":"作为多头的消费、医疗、utility，每年增长2-6%。现在升息环境，增长还追不上利息。却仅仅因为做空50%增长的semi而暴涨\n要么long short动能爆仓，要么经济变差一起跌。总之我看不到一点可能，这些高度拥挤、一致的仓位不出问题的\n愿意相信每年增长3-5%的医疗，30/31年会全部因为AI增长50%。却不愿意相信Semi作为AI基础，28/29年能不降速。你们知道多危险吗","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2122749192141733912","l":[],"ln":[],"t":[],"lk":37,"rt":3,"rp":5,"vw":4323},{"id":"2122748742302642619","h":"octopusycc","ts":1794937713,"zh":"我换个说法可能更简单一点\n如果你们不让Jenson Huang回归CEO\n机构将会带领养老金 被动基金 主权基金一起卖出 $NVDA\n这样有感觉没有","en":"我换个说法可能更简单一点\n如果你们不让Jenson Huang回归CEO\n机构将会带领养老金 被动基金 主权基金一起卖出 $NVDA\n这样有感觉没有","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2122748742302642619","l":[],"ln":[],"t":[],"lk":12,"rt":1,"rp":3,"vw":2175},{"id":"2122747282265460813","h":"tig88411109","ts":1794937365,"zh":"浪子回头金不换。有个人私德问题，公司有治理瑕疵，但是牺牲美国利益甚至卖国去交换公司增长这种尾部事件不会出现。云大厂和SpaceX大客户需求就已经可以满足产能。通过信贷扶持第三方中小型新云公司，没什么猫腻，完全是打造创新初期，健康大小共生生态的必然。开源模型发展不是敌人，真正的“敌人”是对于AI的需求。已经改变了世界，还会继续改变，行到中途，暂停反思才能走得更远，对于他个人，对于公司，对于AI行业，一切刚刚开始。欢迎王者回来。","en":"浪子回头金不换。有个人私德问题，公司有治理瑕疵，但是牺牲美国利益甚至卖国去交换公司增长这种尾部事件不会出现。云大厂和SpaceX大客户需求就已经可以满足产能。通过信贷扶持第三方中小型新云公司，没什么猫腻，完全是打造创新初期，健康大小共生生态的必然。开源模型发展不是敌人，真正的“敌人”是对于AI的需求。已经改变了世界，还会继续改变，行到中途，暂停反思才能走得更远，对于他个人，对于公司，对于AI行业，一切刚刚开始。欢迎王者回来。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tig88411109/status/2122747282265460813","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":0,"vw":419},{"id":"2122746545116176386","h":"AntonLaVay","ts":1794937189,"zh":"荒谬至极，印度警方一个信函就能冻结华人资金300万美金。\n这不应该发生！\n@Coinbase 拒绝武断而无底线的司 料。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXV46fRa8AABhpm.jpg?name=orig","https://pbs.twimg.com/media/HXV46fRbMAAuAan.jpg?name=orig","https://pbs.twimg.com/media/HXV46fSaQAA62p6.jpg?name=orig","https://pbs.twimg.com/media/HXV46fQaYAABHnm.jpg?name=orig"],"u":"https://x.com/hanking66/status/2122735760537448777","l":[],"ln":[],"t":["AI科技"],"lk":12,"rt":0,"rp":3,"vw":1404},{"id":"2122735560511091185","h":"ShanghaoJin","ts":1794934570,"zh":"我们选个电影The return of the king还是Odyssey 哪部好看点","en":"我们选个电影The return of the king还是Odyssey 哪部好看点","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2122735560511091185","l":[],"ln":[],"t":[],"lk":31,"rt":1,"rp":14,"vw":4772},{"id":"2122733473031156081","h":"Kay2289123","ts":1794934073,"zh":"每个英伟达股东本日必读，黄仁勋刚刚发的 ⬇️\n“过去一周，来自朋友、行业同仁，以及素未谋面的人们的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份支持对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。\n英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将它建设成今天这样的公司，是我莫大的荣幸与荣耀。只有在美国，才有可能诞生像英伟达这样的公司。\n我深爱我们的国家，也深爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感懊悔。\n我愿意为自己的错误承担全部责任，并承诺全力配合董事会开展的独立调查。\n自从我离开公司以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重新出任首席执行官（CEO）。\n在公司面临复杂的技术、市场、竞争以及地缘政治局势之际，仍有许多人持续直接与我联系，希望我能够回归。\n英伟达是一家数十年甚至一代人才能诞生一次的非凡企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最佳利益，那么我将深感荣幸，愿意回应这些呼声，重新担任英伟达的首席执行官。\n再次感谢所有向我表达祝福与善意的人。你们的支持让我深受感动，也让我心怀谦卑与感激。\n最后，我想对我的家人说：我爱你们。我愿意用余生的每一天，努力成为一个配得上你们爱的人。\nJensen（黄仁勋）”","en":"每个英伟达股东本日必读，黄仁勋刚刚发的 ⬇️\n“过去一周，来自朋友、行业同仁，以及素未谋面的人们的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份支持对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。\n英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将它建设成今天这样的公司，是我莫大的荣幸与荣耀。只有在美国，才有可能诞生像英伟达这样的公司。\n我深爱我们的国家，也深爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感懊悔。\n我愿意为自己的错误承担全部责任，并承诺全力配合董事会开展的独立调查。\n自从我离开公司以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重新出任首席执行官（CEO）。\n在公司面临复杂的技术、市场、竞争以及地缘政治局势之际，仍有许多人持续直接与我联系，希望我能够回归。\n英伟达是一家数十年甚至一代人才能诞生一次的非凡企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最佳利益，那么我将深感荣幸，愿意回应这些呼声，重新担任英伟达的首席执行官。\n再次感谢所有向我表达祝福与善意的人。你们的支持让我深受感动，也让我心怀谦卑与感激。\n最后，我想对我的家人说：我爱你们。我愿意用余生的每一天，努力成为一个配得上你们爱的人。\nJensen（黄仁勋）”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Kay2289123/status/2122733473031156081","l":[],"ln":[],"t":["AI科技"],"lk":18,"rt":2,"rp":2,"vw":3469},{"id":"2122732717381157312","h":"bboczeng","ts":1794933892,"zh":"据英国《金融时报》报道，黄仁勋之女深度参与了英伟达就其与Megaspeed关系所展开的公开辩护工作。\n前英伟达首席执行官黄仁勋之女Madison Huang（黄敏珊），协助主导了公司应对外界对Megaspeed审视的举措。\n她的丈夫Nico Caprez在英伟达与这家总部位于新加坡的云服务商的交易接受调查期间，迅速晋升至人工智能基础设施领域的高级职位。\nMegaspeed采购了约50亿美元的英伟达硬件，并因芯片可能被转运至中国而受到美国方面的关注。\n英伟达董事会已启动内部调查，并设立了新的国家安全与出口合规委员会。","en":"据英国《金融时报》报道，黄仁勋之女深度参与了英伟达就其与Megaspeed关系所展开的公开辩护工作。\n前英伟达首席执行官黄仁勋之女Madison Huang（黄敏珊），协助主导了公司应对外界对Megaspeed审视的举措。\n她的丈夫Nico Caprez在英伟达与这家总部位于新加坡的云服务商的交易接受调查期间，迅速晋升至人工智能基础设施领域的高级职位。\nMegaspeed采购了约50亿美元的英伟达硬件，并因芯片可能被转运至中国而受到美国方面的关注。\n英伟达董事会已启动内部调查，并设立了新的国家安全与出口合规委员会。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122732717381157312","l":[],"ln":[],"t":["AI科技"],"lk":11,"rt":1,"rp":3,"vw":2215},{"id":"2122732382549868831","h":"CrushTheShorts","ts":1794933813,"zh":"回来吧 Goat！\n市场不需要那个没有睾丸的副 goat","en":"回来吧 Goat！\n市场不需要那个没有睾丸的副 goat","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXV116SagAABwWc.jpg?name=orig"],"u":"https://x.com/CrushTheShorts/status/2122732382549868831","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":0,"vw":887},{"id":"2122732171526046080","h":"bboczeng","ts":1794933762,"zh":"大家要注意到，黄仁勋愿意复出的谈话其实是没有太多作用的\n他当然要出来表态，否则硅谷科技派这一个星期以来的斡旋和努力就白费了\n但最终能否回去，取决于白宫幕后利益集团博弈的结果\n不论如何，英伟达股价的底部要看它今天的财报\n是否足够灾难\n😅😅😅","en":"大家要注意到，黄仁勋愿意复出的谈话其实是没有太多作用的\n他当然要出来表态，否则硅谷科技派这一个星期以来的斡旋和努力就白费了\n但最终能否回去，取决于白宫幕后利益集团博弈的结果\n不论如何，英伟达股价的底部要看它今天的财报\n是否足够灾难\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122732171526046080","l":[],"ln":[],"t":["AI科技","财报"],"lk":2,"rt":0,"rp":0,"vw":258},{"id":"2122730771278409785","h":"TJ_Research","ts":1794933428,"zh":"另外在下午财报会议前出这消息，我认为回归概率非常大","en":"另外在下午财报会议前出这消息，我认为回归概率非常大","zh_src":"native","lang":"zh","m":[],"u":"https://x.co 调无法证实Alice是间谍，至于和内部员工的事，最终还是投资者说了算，董事会都得服务投资者。\n这次感性要胜利了，这个世界还有救❤️","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2122727527227531417","l":[],"ln":[],"t":[],"lk":189,"rt":7,"rp":18,"vw":12032},{"id":"2122726995134181532","h":"yijiangren","ts":1794932528,"zh":"我们确实需要 @JensenHuang\n但是这个发文时间是不是太巧了\n非要赶在暴跌的时候\n来救市","en":"我们确实需要 @JensenHuang\n但是这个发文时间是不是太巧了\n非要赶在暴跌的时候\n来救市","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVwxgsagAYo0u1.png?name=orig","https://pbs.twimg.com/media/HXVw8v4bYAA583X.png?name=orig"],"u":"https://x.com/yijiangren/status/2122726995134181532","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":0,"vw":1176},{"id":"2122726624538034520","h":"bboczeng","ts":1794932440,"zh":"过去一周，来自朋友、业内同行，以及许多素未谋面之人的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份情谊对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将英伟达建设成今天这样的公司，是我的荣幸，也是我的荣耀。只有在美国，才有可能诞生像英伟达这样的企业。我热爱我们的国家，也热爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感悔恨。我愿意为自己的错误承担全部责任，并承诺全力配合董事会正在进行的独立调查。\n自从我离职以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重返公司，重新担任首席执行官。在公司面临复杂的技术、市场、竞争和地缘政治局势之际，仍有许多人不断直接联系我。英伟达是一家一代人才能诞生一次的伟大企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最大利益，那么我将深感荣幸，愿意回应这些呼声，重新出任英伟达首席执行官。\n再次感谢所有向我表达美好祝愿的人。你们的支持让我深感谦卑，也令我无比感激。\n最后，我想对我的家人说：我爱你们。我将用余生的时间，努力成为一个配得上你们的爱的人。\n黄仁勋（Jensen）","en":"过去一周，来自朋友、业内同行，以及许多素未谋面之人的关爱与支持，让我深受感动。感谢每一位向我和我的家人表达善意的人。这份情谊对我而言意义非凡。\n53年前，我来到美国。成为一名美国公民，是我一生中收到的最珍贵的礼物之一，也是我最引以为傲的时刻之一。英伟达（NVIDIA）是我毕生的心血。能够与同事们并肩奋斗，将英伟达建设成今天这样的公司，是我的荣幸，也是我的荣耀。只有在美国，才有可能诞生像英伟达这样的企业。我热爱我们的国家，也热爱英伟达。\n我没有达到英伟达对每一位员工所要求的行为标准，也在个人生活中犯下了严重的错误。我给董事会带来了麻烦，对此我深感悔恨。我愿意为自己的错误承担全部责任，并承诺全力配合董事会正在进行的独立调查。\n自从我离职以来，我看到英伟达的员工、投资者、商业合作伙伴和客户纷纷呼吁我重返公司，重新担任首席执行官。在公司面临复杂的技术、市场、竞争和地缘政治局势之际，仍有许多人不断直接联系我。英伟达是一家一代人才能诞生一次的伟大企业。\n如果董事会认为，我的回归符合股东、员工、公司以及美国的最大利益，那么我将深感荣幸，愿意回应这些呼声，重新出任英伟达首席执行官。\n再次感谢所有向我表达美好祝愿的人。你们的支持让我深感谦卑，也令我无比感激。\n最后，我想对我的家人说：我爱你们。我将用余生的时间，努力成为一个配得上你们的爱的人。\n黄仁勋（Jensen）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726624538034520","l":[],"ln":[],"t":["AI科技"],"lk":9,"rt":0,"rp":5,"vw":2302},{"id":"2122726565847138465","h":"bboczeng","ts":1794932426,"zh":"@JensenHuang 感谢您在 NVDA 发布灾难性收益报告之前挽救了其股票！","en":"@JensenHuang Thanks for saving NVDA stock right before its disastrous earnings report !","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/bboczeng/status/2122726565847138465","l":[],"ln":[],"t":["财报"],"lk":144,"rt":1,"rp":5,"vw":16439},{"id":"2122726292936360342","h":"bboczeng","ts":1794932361,"zh":"刚开始暴跌，这会又开始拉盘了？\n😅😅😅","en":"刚开始暴跌，这会又开始拉盘了？\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726292936360342","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":4,"vw":1693},{"id":"2122726287219523973","h":"octopusycc","ts":1794932359,"zh":"世界需要你 AI也需要你","en":"世界需要你 AI也需要你","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/octopusycc/status/2122726287219523973","l":[],"ln":[],"t":[],"lk":14,"rt":0,"rp":0,"vw":2572},{"id":"2122726113965457844","h":"bboczeng","ts":1794932318,"zh":"又是定投VOO成功的一天\n等到多头全部认输，我们也就赢了\n😅😅😅","en":"又是定投VOO成功的一天\n等到多头全部认输，我们也就赢了\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2122726113965457844","l":[],"ln":[],"t":[],"lk":6,"rt":0,"rp":2,"vw":1460},{"id":"2122726005219737649","h":"JensenHuang","ts":1794932292,"zh":"在过去的一周里，我被朋友、行业同事和素未谋面的人的爱和支持所感动。感谢所有对我和我的家人表示善意的人。这对我来说意味着整个世界。 53 年前我来到美国，成为美国公民是我一生中最伟大的礼物和最自豪的时刻之一。 NVIDIA 是我一生的事业。与我的同事们一起将其融入到今天的公司是一种荣幸。除了美国，其他任何地方都不可能出现像 NVIDIA 这样的公司。我爱我们的国家，我也爱 NVIDIA。 我没有达到 NVIDIA 每个人的期望标准，并且在个人生活中犯了严重错误。我给董事会带来了问题，对此我深感遗憾。我完全承认自己的错误，并致力于配合董事会的独立调查。自从我离职后，NVIDIA 的员工、投资者、业务合作伙伴和客户纷纷呼吁我重新担任首席执行官。当公司应对复杂的技术、市场、竞争和地缘政治动态时，许多人继续直接与我联系。 NVIDIA 是一家百年一遇的公司。如果董事会认为我的回归符合我们的股东、员工、公司和美国的最佳利益，我将很荣幸回应这些呼吁并重新担任首席执行官。 再次感谢所有分享美好祝愿的人。你们的支持让我深感荣幸。对我的家人：我爱你们，我会用我的余生来配得上你们。 詹森","en":"Over the past week, I’ve been overwhelmed by the love and support of friends, industry colleagues, and people I've never met. Thank you to everyone who has shown kindness to my family and me. It means the world to me.\nI came to the United States 53 years ago, and becoming an American citizen is one of the greatest gifts and proudest moments of my life. NVIDIA has been my life’s work. Building it into the company it is today alongside my colleagues has been a privilege and an honor. Nowhere but in America could a company like NVIDIA be possible. I love our country, and I love NVIDIA.\nI did not live up to the standards expected of everyone at NVIDIA, and I have made serious mistakes in my personal life. I created problems for the Board that I deeply regret. I own my mistakes completely, and I am committed to cooperating with the Board’s independent investigation.\nSince my departure, I’ve seen an outpouring of calls from NVIDIA’s employees, investors, business partners, and customers for me to return as CEO. Many continue to reach out to me directly as the company navigates complex technology, market, competitive, and geopolitical dynamics. NVIDIA is a once-in-a-generation company. If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO.\nThank you again to everyone who has shared their good wishes. I am profoundly humbled by your support. To my family: I love you, and I will spend the rest of my life being worthy of yours.\nJensen","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/JensenHuang/status/2122726005219737649","l":[],"ln":[],"t":["AI科技"],"lk":710385,"rt":79153,"rp":37986,"vw":24044000},{"id":"2122725463449829707","h":"xingpt","ts":1794932163,"zh":"“Nvidia CEO Huang: If the Board of Directors decides my return is in the best interest of shareholders, employees, the company, and the US, I would be honored to return as CEO - WSJ”\n老黄不会回来。\n如果老黄真的要回来，不会是这种在媒体的表态方式。而是会像 Sam Altman 一样，不管是找新的投资人，还是在董事会里找到自己的利益合伙人，直接逼宫新管理层。一定会用稳准狠的方式打出那张让董事会不得不让他回来的牌。\n而现在的这个语气听起来，老黄更多的只是在寻求舆论的支持，可能手里其实没有什么牌。","en":"“Nvidia CEO Huang: 跌破 7,042 的概率 24%，平常 20%。\n历史上，跌破这类位置之后的走势并不更差。今晚 NVDA 财报可能把价格打出区间；收盘回到 7,450 上方之前，先按回到高点要等更久来看。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXVehn_agAAE1SV.jpg?name=orig"],"u":"https://x.com/Balder13946731/status/2122706735203025019","l":["balder-ai.com"],"ln":[{"u":"http://balder-ai.com/playbook","d":"balder-ai.com"}],"t":["财报"],"lk":2,"rt":0,"rp":0,"vw":1270},{"id":"2122706551555129501","h":"ReutersChina","ts":1794927654,"zh":"亚太经合组织(APEC)一位高级官员周二对路透表示，亚太经合组织(APEC)成员国可能会因关税和供应链障碍而发生争执，但他们很可能会在本周的中国峰会上克服分歧并就共同目标达成一致。","en":"The members of the Asia-Pacific Economic Cooperation may be feuding over tariffs and supply chain snags, but they are likely to look past differences and agree joint aims at their summit in China this week, a senior APEC official told Reuters on Tuesday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122706551555129501","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/apec-members-expected-look-past-trade-differences-agree-summit-text-official-2026-11-17/?taid=6afc6c26a3d32e000116b8f4&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["关税贸易"],"lk":0,"rt":0,"rp":0,"vw":472},{"id":"2122703919101211021","h":"dmjk001","ts":1794927026,"zh":"Altman：芯片厂商在高估OpenAI需求\nOpenAI的Sam Altman称，芯片厂商在高估OpenAI需求、存在重复统计：各家都默认OpenAI会买下他们全部芯片。他表示：“没错。很长一段时间里，行业里基本只有一家芯片供应商。所以当时大家统计晶圆产能时，可以向我们这类公司了解需求预期，从而大致判断自家芯片的终端需求空间。现在做芯片的厂商变多了。其中不少厂商都认为，自己大部分芯片出货量都会卖给我们、Anthropic以及其他客户。但我们的需求、数据中心规模等资源都是有限的。很多芯片厂商在对接供应链的时候，都预设我们会采购他们全部的芯片。当然，整体需求、数据中心建设的基本面是扎实的。但我们不可能、也没有必要从每一家芯片供应商那里采购全部产能。”","en":"Altman：芯片厂商在高估OpenAI需求\nOpenAI的Sam Altman称，芯片厂商在高估OpenAI需求、存在重复统计：各家都默认OpenAI会买下他们全部芯片。他表示：“没错。很长一段时间里，行业里基本只有一家芯片供应商。所以当时大家统计晶圆产能时，可以向我们这类公司了解需求预期，从而大致判断自家芯片的终端需求空间。现在做芯片的厂商变多了。其中不少厂商都认为，自己大部分芯片出货量都会卖给我们、Anthropic以及其他客户。但我们的需求、数据中心规模等资源都是有限的。很多芯片厂商在对接供应链的时候，都预设我们会采购他们全部的芯片。当然，整体需求、数据中心建设的基本面是扎实的。但我们不可能、也没有必要从每一家芯片供应商那里采购全部产能。”","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122703919101211021","l":[],"ln":[],"t":["AI科技"],"lk":4,"rt":0,"rp":0,"vw":1644},{"id":"2122700362843082996","h":"hanking66","ts":1794926179,"zh":"感觉全网都在赌达子财报利空出尽，超级反弹！😅😅😅\n希望这次大部分人都能赌对🙏🙏🙏跌这么久了，也该反弹一下了，利空消息也好多天了，消化得也差不多了……难道还能有比老黄走人更大的利空等着我们吗？我想象力贫瘠，实在想不出还有什么可以比现在更惨了\n新 ceo 总不第一个财报，给大家表演一个我杀我自己吧😅真要是这样，那达子董事会里是进间谍了吧🤣🤣\nBuy the dip，长期持有，Discord在个人资料。","en":"感觉全网都在赌达子财报利空出尽，超级反弹！😅😅😅\n希望这次大部分人都能赌对🙏🙏🙏跌这么久了，也该反弹一下了，利空消息也好多天了，消化得也差不多了……难道还能有比老黄走人更大的利空等着我们吗？我想象力贫瘠，实在想不出还有什么可以比现在更惨了\n新 ceo 总不第一个财报，给大家表演一个我杀我自己吧😅真要是这样，那达子董事会里是进间谍了吧🤣🤣\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2122700362843082996","l":[],"ln":[],"t":["财报"],"lk":5,"rt":0,"rp":3,"vw":1364},{"id":"2122700264780267782","h":"xingpt","ts":1794926155,"zh":"币圈人炒美股的几个恶习，一定要避坑这几个点：\n1. 信仰盘\n看准一个就以为是比特币，疯狂加仓，从 存储 到 Circle，到最近也有人喊英伟达。其实不管任何股票都有周期，不是所有的成功路径都可以通过早期囤比特币这种信仰盘的方式来复制，这种幸存者是极少的。但币圈往往是被早期囤比特币能发财、囤以太坊能发财的人洗脑，认为只要搞信仰盘就能够赚钱。\n2. 只会炒热门票\n什么热炒什么。其实美股涨得好的，往往是悄摸摸在偷偷发展的公司，不一定是热门票。\n一个票若是热门票，要么是涨到了顶点，要么是博弈面极其复杂，这种参与进去大概率都是韭菜，因为热门票的仓位已经极度拥挤了。\n就单看存储半导体，有多少人能真的赚到钱落到口袋里？而消费、医疗和网络安全，很多股票已经破了新高，但因为不在新闻热点上，币圈的人也没有深度覆盖的能力，所以只能跟着热度炒。但炒公司跟炒币不一样，公司是有长期投资价值的，不是说那些冷门的就没有。\n比如有一家公司几乎没有人提，半年时间已经稳稳翻倍了，而且几乎没有人提过：维多利亚的秘密，对，就是搞维密秀、卖女性内衣的那家公司\n3. 只会炒情绪盘\n别的不说，币圈的人炒情绪盘确实是很厉害的。因为炒 meme 和炒山寨币，大部分只要看情绪就够了。\n但炒美股，当然炒情绪也是一方面，但大部分时候还是要回归公司的基本价值跟行业逻辑，以及关于估值体系、这个市场交易的拥挤度和资金配置等问题。要考虑的层面，其实要比单纯看情绪面博弈复杂得多，而且看情绪面博弈的胜率和收益比，也没有币圈来得高。\n所以要炒透美股，还是要扎扎实实做好基本面研究：对公司的业务、公司本身的估值，以及公司的未来战略和上下游，都要搞清楚。\n比如有个公司叫 TBBB，是 Druckenmiller 的持仓，做的是墨西哥的平价超市。其实基本面非常好，但也并不在情绪盘里，这个公司今年也翻倍了，而且走势非常稳，不像科技一样大起大落。\n4. 盲目相信 KOL。\n当然这点其实并不是币圈的问题了，A 股包括很多股票圈的人也是盲目听着 KOL 就冲进去干了。\n但交易其实是自己的，KOL 只能提供一些他的思路。你要知道 KOL 他擅长的是什么：他是短线还是长线？他是交易基本面、情绪，还是技术方向？\n如果这都不知道你就盲目跟，你一定会丧失自己的节奏。因为没有 KOL 是永远准确的，也不可能第一时间就告诉你该买多少、该什么时候卖。\n我也订阅了很多 KOL，但我从来不会盲目抄作业，而是会把他们的思路吸收和分析，看有哪些是对的，有哪些我认为他们说得不对，我也不会盲目去跟单。\n总之，炒美股是一个比炒币复杂得多的事情。炒币赚钱当然牛逼，但不一定能代表炒美股赚钱，特别是个股。\n所以大家在看这些美股信息，特别是币圈 KOL 发的时候，还是要对他的观点有一个自己的判断。","en":"币圈人炒美股的几个恶习，一定要避坑这几 697163633487906","h":"octopusycc","ts":1794925416,"zh":"我受不了了","en":"我受不了了","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/octopusycc/status/2122697163633487906","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":674},{"id":"2122697011443245229","h":"yijiangren","ts":1794925379,"zh":"观澜谱·兵法篇一：以正合，以奇胜\n《孙子兵法·兵势篇》有言：凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江海。\n很多人会把“奇”理解为出其不意的奇招，或是一支能够偷袭制胜的奇兵。\n历代兵家确实常以奇兵解释“奇”，但若只停留在奇袭二字，便容易忽略一个更深层的前提。\n你必须拥有尚未投入战场、能够随时调度的力量，才有资格谈出奇制胜。\n正兵负责正面交锋，奇兵负责寻找破绽。\n倘若所有兵力都已经陷入正面战场，即便敌人露出再大的破绽，你又拿什么去攻？\n所以，从投资的角度，“奇”理解为一种可以自由支配的余力。\n它可以是没有投入市场的现金，可以是尚未使用的风险额度，也可以是一条能够源源不断提供资金的现金流。\n它们共同构成了投资者的后手。\n以正合，是凭借已有的实力参与市场；以奇胜，是永远保留改变战局的能力。\n一、兵力未尽，胜负未定\n很多人有一个根深蒂固的误区。\n认为看准了方向，就应该全仓投入；认为一笔交易的胜率足够高，就应该尽可能放大收益。\n于是，满仓成为自信的证明，杠杆成为胆识的象征。\n谨慎遭人看不起，赌徒成为了吹捧的对象。\n市场最残酷的地方在于：我们的判断可以正确，价格却未必按照我们预期的时间和路径运行。\n一只股票，你认为它值 100 。\n它可能先跌到 80，再跌到 60，最终才回到 150。\n如果你在 100 的位置 All in，即使最终判断正确，中间的过程也让你承受巨大的心理压力。\n如果上了高杠杆，可能在价值兑现之前便遭到强制平仓。\n相反，如果你始终保留一部分现金，局面便完全不同。\n价格跌到 80，你可以重新评估\n跌到 60，你依然拥有选择权\n倘若基本面没有恶化，估值反而更加合理，你甚至有机会以更低的成本积累更多筹码。\n当然，前提是判断经过重新验证。持续下跌也可能意味着最初的投资逻辑已经失效。\n现金无法保证你买在最低点，却能保证你拥有下一次出手的资格。\n二、十则围之，五则攻之\n《孙子兵法·谋攻篇》还有一段极其精彩的论述：\n十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。\n兵力十倍于敌，便可以围困\n五倍于敌，可以主动进攻\n两倍于敌，可以分散敌军\n势均力敌，可以正面交战\n兵力处于劣势，则应当撤退或避其锋芒\n这段话的核心，是根据力量对比决定行动方式。\n放在交易市场中，同样适用。\n当市场趋势明确、基本面扎实、估值合理，且你拥有充分的资金储备时，可以主动进攻。\n当价格接近合理区间，但方向仍然模糊时，可以小仓位试探。\n当市场进入剧烈震荡、宏观环境不断恶化时，应当收缩战线。\n当原有交易逻辑被证伪，或者潜在风险已经超过承受能力时，就应该果断撤退。\n仓位的大小，应当服从胜算与风险的变化，而非情绪的强弱。\n孙子从未要求将军逢敌必战。\n真正高明的将领，知道何时进攻，也知道何时避战。\n交易亦然。\n有时候，空仓就是最好的防守。\n有时候，轻仓就是最好的进攻准备。\n真正危险的，是明明处于劣势，却因为仓位太重、退路太少，被迫与市场决一死战。\n三、永远不要 All in\n一句话，我认为值得反复提醒自己，也提醒大家：永远不要把最后一颗子弹，打在自己最有信心的时候。\n因为信心只代表你当下的认知，并不能消除未来的不确定性。\n今天你认为市场已经见底，明天可能出现新的流动性冲击\n今天你认为一家公司的估值足够便宜，下个季度可能迎来盈利预期下修\n今天你认为宏观环境即将转暖，一份超预期的经济数据便可能改变利率路径\n市场从来不会因为你已经满仓，就停止制造新的机会。\n更残酷的是，机会往往出现在绝大多数人无力行动的时候。\n牛市末期，人人都有购买的欲望\n熊市深处，真正缺的却是购买的能力\n那些在上涨阶段保留现金的人，往往能够在流动性收缩时拥有更大的主动权。\n当然，现金也有机会成本。长期持有过多现金，可能错过优质资产的持续上涨。\n所以保留后手，并不意味着永远轻仓，更不意味着机械地等待暴跌。\n它要求你根据市场环境、资产估值和自身现金流，动态分配兵力。\n更重要的是，在投入任何一笔资金之前，都要想清楚：\n如果判断错误，我还有没有退路？\n如果出现更好的机会，我还有没有余力？\n如果市场长期不按照预期运行，我能不能继续留在牌桌上？\nAll in 最大的代价，是你把未来所有的选择权，都押在了当下这一次判断上。\n四、源源不断的现金流，才是最好的后勤\n战争拼到最后，往往拼的是补给。\n投资也是如此。\n很多人把全部精力放在寻找下一只暴涨的股票，却忽略了自身持续创造现金流的能力。\n工资、经营收入、稳定的业务利润，以及其他可持续的自由现金流，都是投资者的后勤。\n它们让你不必依靠每一笔交易来维持生活。\n让你能够承受更长时间的等待。\n也让你在市场出现真正值得出手的机会时，拥有额外的资金来源。\n一个拥有稳定现金流的投资者，即使暂时遭遇亏损，只要风险可控，依然可以逐渐恢复实力。\n而一个失去现金流、又满仓高杠杆的人，即使对未来的判断足够深刻，也可能倒在黎明之前。\n这也是为什么，我一直认为普通人应该同时建立两种能力。\n一种是在市场中识别优质资产的能力。\n另一种是在市场之外持续创造财富的能力。\n前者决定投资收益的潜力，后者决定你能够在市场中停留多久。\n所谓无限后手，并非真的拥有取之不尽的资金。\n而是通过持续的现金流、合理的仓位管理和严格的风险控制，让自己始终具备重新组织进攻的能力。\n善战者，不以一战赌国运；善投者，不以一仓定生死。\n五、以正合，以奇胜\n如果让我将这六个字转化为一套投资体系，那么：\n所谓正，是对优质资产的理解，是对长期趋势的判断，是能够承受波动的核心仓位。\n所谓奇，是保留的现金，是灵活的机动仓位，是发现判断错误后及时撤退的能力，也是机会真正出现时敢于集结力量的底气。\n正决定你能够走多远。\n奇决定你在复杂的市场环境中，究竟还有多少选择。\n两者缺一不可。\n只守现金，可能错过漫长的资产升值。\n只持仓位，则可能在真正的历史性机会到来时无能为力。\n而最理想的状态，是让核心资产参与长期增长，让机动资金应对周期变化，让持续现金流不断补充自己的力量。\n行情好时，顺势而为\n行情差时，收缩阵地\n机会不足时，休养生息\n机会成熟时，集中优势兵力\n进退之间，始终掌握主动\n最后，我想用一句话作为这一篇的结尾。\n一个交易者真正的强大，不在于他能一次投入多少兵力，而在于无论经历多少次交锋，他始终还有兵可用。\n兵无常势，水无常形\n以正合，以奇胜\n留有余地，方有胜机","en":"观澜谱·兵法篇一：以正合，以奇胜\n《孙子兵法·兵势篇》有言：凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江海。\n很多人会把“奇”理解为出其不意的奇招，或是一支能够偷袭制胜的奇兵。\n历代兵家确实常以奇兵解释“奇”，但若只停留在奇袭二字，便容易忽略一个更深层的前提。\n你必须拥有尚未投入战场、能够随时调度的力量，才有资格谈出奇制胜。\n正兵负责正面交锋，奇兵负责寻找破绽。\n倘若所有兵力都已经陷入正面战场，即便敌人露出再大的破绽，你又拿什么去攻？\n所以，从投资的角度，“奇”理解为一种可以自由支配的余力。\n它可以是没有投入市场的现金，可以是尚未使用的风险额度，也可以是一条能够源源不断提供资金的现金流。\n它们共同构成了投资者的后手。\n以正合，是凭借已有的实力参与市场；以奇胜，是永远保留改变战局的能力。\n一、兵力未尽，胜负未定\n很多人有一个根深蒂固的误区。\n认为看准了方向，就应该全仓投入；认为一笔交易的胜率足够高，就应该尽可能放大收益。\n于是，满仓成为自信的证明，杠杆成为胆识的象征。\n谨慎遭人看不起，赌徒成为了吹捧的对象。\n市场最残酷的地方在于：我们的判断可以正确，价格却未必按照我们预期的时间和路径运行。\n一只股票，你认为它值 100 。\n它可能先跌到 80，再跌到 60，最终才回到 150。\n如果你在 100 的位置 All in，即使最终判断正确，中间的过程也让你承受巨大的心理压力。\n如果上了高杠杆，可能在价值兑现之前便遭到强制平仓。\n相反，如果你始终保留一部分现金，局面便完全不同。\n价格跌到 80，你可以重新评估\n跌到 60，你依然拥有选择权\n倘若基本面没有恶化，估值反而更加合理，你甚至有机会以更低的成本积累更多筹码。\n当然，前提是判断经过重新验证。持续下跌也可能意味着最初的投资逻辑已经失效。\n现金无法保证你买在最低点，却能保证你拥有下一次出手的资格。\n二、十则围之，五则攻之\n《孙子兵法·谋攻篇》还有一段极其精彩的论述：\n十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。\n兵力十倍于敌，便可以围困\n五倍于敌，可以主动进攻\n两倍于敌，可以分散敌军\n势均力敌，可以正面交战\n兵力处于劣势，则应当撤退或避其锋芒\n这段话的核 en":"crcl 现价 57u\n当前市值约 147.9 亿美元\nbtc 当前价格是64900u\n当前市值约 1.29 万亿美元\n如果未来crcl能涨到btc市值\n目标倍数约 87.22 倍\n所以今日买入crcl的价格\n等效 btc 买入价约 750u\n1000u买入btc\n还是2000u买入btc\n其实都算足够的便宜\n而且期间都有好几年时间\n最终能不能赚钱\n要看你在每次动摇的时候\n有没有选择相信\n直到它涨到万亿美金的时候","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2122689365365424140","l":[],"ln":[],"t":[],"lk":11,"rt":1,"rp":8,"vw":2902},{"id":"2122687363172442317","h":"octopusycc","ts":1794923079,"zh":"明天4:00开播英伟达财报及电话会\n到时见","en":"明天4:00开播英伟达财报及电话会\n到时见","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/octopusycc/status/2122687363172442317","l":[],"ln":[],"t":["AI科技","财报"],"lk":2,"rt":0,"rp":0,"vw":540},{"id":"2122686696844358129","h":"fxtrader","ts":1794922920,"zh":"高盛预计，一旦美联储开始降息且西方投资者重新进入市场，在2028年前黄金将达到5600美元/盎司。\n贵金属市场在2027年的表现“越来越像2022年”。高盛预测到2027年底黄金价格将达到4650美元/盎司，较现货价格高19%，较10月平均价4100美元高13%。分析师认为，这一涨幅主要得益于央行持续增持头寸。\n分析师预计，到2026至2028年期间，央行每月将购买60吨黄金，而2022年之前均值仅为17吨。“我们认为这标志着储备管理行为的结构性转变，短期内不会逆转。我们的基准情景假设官方部门的积累趋势将继续维持三年。”\n5600美元的目标取决于美联储的政策转向。预计从2027年11月到2028年9月之间，美联储将进行四次25个基点的降息，使利率最终降至3.25%-3.5%。这将解除对黄金的利率限制，并推动对利率敏感型西方ETF的需求恢复。\n如果黄金作为对宏观政策风险对冲工具的需求重新回升，高盛认为，其走势将超出基准情景的显著上涨空间。西方经济体财政可持续性问题再度引发担忧，可能成为推动力。\n对2027年预测的风险因素则偏向于下行。若美联储加息四次且最终利率更高，到2027年底金价将跌至4585美元；若出现300吨ETF赎回，则金价将降至4265美元。\n分析师还预计，到2027年黄金表现将强于白银，因为只有黄金能从央行的抢购行动中受益。高盛呼吁避免再次出现白银的流动性紧缩。","en":"高盛预计，一旦美联储开始降息且西方投资者重新进入市场，在2028年前黄金将达到5600美元/盎司。\n贵金属市场在2027年的表现“越来越像2022年”。高盛预测到2027年底黄金价格将达到4650美元/盎司，较现货价格高19%，较10月平均价4100美元高13%。分析师认为，这一涨幅主要得益于央行持续增持头寸。\n分析师预计，到2026至2028年期间，央行每月将购买60吨黄金，而2022年之前均值仅为17吨。“我们认为这标志着储备管理行为的结构性转变，短期内不会逆转。我们的基准情景假设官方部门的积累趋势将继续维持三年。”\n5600美元的目标取决于美联储的政策转向。预计从2027年11月到2028年9月之间，美联储将进行四次25个基点的降息，使利率最终降至3.25%-3.5%。这将解除对黄金的利率限制，并推动对利率敏感型西方ETF的需求恢复。\n如果黄金作为对宏观政策风险对冲工具的需求重新回升，高盛认为，其走势将超出基准情景的显著上涨空间。西方经济体财政可持续性问题再度引发担忧，可能成为推动力。\n对2027年预测的风险因素则偏向于下行。若美联储加息四次且最终利率更高，到2027年底金价将跌至4585美元；若出现300吨ETF赎回，则金价将降至4265美元。\n分析师还预计，到2027年黄金表现将强于白银，因为只有黄金能从央行的抢购行动中受益。高盛呼吁避免再次出现白银的流动性紧缩。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtra 7415","h":"TraderS18","ts":1794920209,"zh":"最近无数人说红果短剧，别的不说，这一个月你要是沉迷刷剧不操作，得少亏多少钱","en":"最近无数人说红果短剧，别的不说，这一个月你要是沉迷刷剧不操作，得少亏多少钱","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2122675322856587415","l":[],"ln":[],"t":[],"lk":4,"rt":1,"rp":2,"vw":2044},{"id":"2122674607501275632","h":"cnfinancewatch","ts":1794920038,"zh":"（十二）\n1、事件：据华尔街见闻报道，京东三季度净营收3096亿元，归母净利润同比大增44%，新业务大幅减亏，自由现金流扩大至负239亿元。\n2、涉及标的：京东（JD）为财报主体；A股对应方向为电商与物流供应链，代表个股顺丰控股（002352）、圆通速递（600233）。\n3、影响：对美股偏多，强度中，属持续性逻辑；利润大增与减亏传导A股电商物流板块盈利预期改善。\n（十三）\n1、事件：据Reuters报道，美国升级芯片出口管制，商务部规则旨在进一步限制对华芯片出货，外交部回应称典型经济胁迫与长臂管辖，中方将采取必要措施。\n2、涉及标的：英伟达（NVDA）、AMD（AMD）为受限标的；A股对应方向为国产替代半导体设备材料，代表个股北方华创（002371）、中微公司（688012）。\n3、影响：对美股偏空、对A股国产替代偏多，强度强，属持续性逻辑；管制升级强化自主可控主线，利好设备材料端。\n（十四）\n1、事件：据Reuters报道，黄金跌至一年低点，受美债收益率与美元压制，势将创2015年以来最差年度表现，黄金期货结算价创52周新低。\n2、涉及标的：黄金ETF（GLD）与金矿股纽蒙特（NEM）承压；A股对应方向为黄金珠宝与贵金属，代表个股山东黄金（600547）、紫金矿业（601899）。\n3、影响：对美股黄金板块偏空，强度强，属持续性逻辑；金价走弱传导A股黄金股盈利预期下修。\n（十五）\n1、事件：据WSJ报道，美元创18个月新高，美元指数抹去解放日跌幅，“卖出美国”担忧消退，美元五连涨后企稳。\n2、涉及标的：美元指数（DXY）走强，新兴市场ETF（EEM）承压；A股对应方向为出口链与外汇敏感板块，代表个股美的集团（000333）、海尔智家（600690）。\n3、影响：对美股偏空于跨国企业盈利，强度中，属持续性逻辑；强美元压制新兴市场资金流入，传导A股外资偏好。\n（十六）\n1、事件：据WSJ报道，IEA称全球石油市场将随海湾出口恢复重回过剩，油价因供应前景改善而回落，抵消中东紧张局势。\n2、涉及标的：原油ETF（USO）与埃克森美孚（XOM）承压；A股对应方向为石油石化与油服，代表个股中国石油（601857）、中海油服（601808）。\n3、影响：对美股能源板块偏空，强度中，属持续性逻辑；油价回落传导A股石油石化盈利预期与油服订单。\n（十七）\n1、事件：据Barron's报道，一纸降级拖累全部稀土股，在特朗普与习近平会晤前稀土板块走弱。\n2、涉及标的：MP Materials（MP）为稀土标的；A股对应方向为稀土永磁，代表个股北方稀土（600111）、中国稀土（000831）当日-10.00%。\n3、影响：对美股稀土偏空，强度中，属当日情绪影响；会晤前不确定性传导A股稀土板块，短期波动加大。\n（十八）\n1、事件：据Bloomberg报道，巴克莱称被迫的散户平仓是台湾股市重挫背后原因，台股遭遇抛售。\n2、涉及标的：台积电（TSM）为台股权重核心；A股对应方向为半导体代工与封测，代表个股中芯国际（688981）、长电科技（600584）。\n3、影响：对美股半导体偏空，强度中，属当日情绪影响；台股去杠杆传导A股半导体情绪，但国产替代逻辑形成对冲。\n（十九）\n1、事件：据WSJ报道，美联储主席Warsh表示美联储正在推演AI如何重塑经济，并重申偏好小步加息，但通胀预期若失控将被迫提速。\n2、涉及标的：标普500（SPX）与美债ETF（TLT）为敏感标的；A股对应方向为大金融与利率敏感板块，代表个股招商银行（600036）、中国平安（601318）。\n3、影响：对美股偏空，强度中，属持续性逻辑；加息偏好与AI经济推演影响全球流动性预期，传导A股银行保险估值。\n（二十）\n1、事件：据BusinessInsider报道，迪士尼CEO Josh D'Amaro的科技战略获华尔街认可，财报超预期；同时Opera宣布以普通股直接登陆纳斯达克替代ADS。\n2、涉及标的：迪士尼（DIS）与Opera（OPRA）为事件主体；A股对应方向为传媒IP与浏览器软件，代表个股光线传媒（300251）、三六零（601360）。\n3、影响：对美股偏多，强度弱，属当日情绪影响；科技战略与上市结构调整对A股传媒软件板块示范效应有限。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：\n━━━━━━━━━━━━━\n⭐️⭐️⭐️ 华尔街观察团队 | WSV量化模型 | 不构成投资建议 | 投资有风险 ⭐️⭐️⭐️","en":"（十二）\n1、事件：据华尔街见闻报道，京东三季度净营收3096亿元，归母净利润同比大增44%，新业务大幅减亏，自由现金流扩大至负239亿元。\n2、涉及标的：京东（JD）为财报主体；A股对应方向为电商与物流供应链，代表个股顺丰控股（002352）、圆通速递（600233）。\n3、影响：对美股偏多，强度中，属持续性逻辑；利润大增与减亏传导A股电商物流板块盈利预期改善。\n（十三）\n1、事件：据Reuters报道，美国升级芯片出口管制，商务部规则旨在进一步限制对华芯片出货，外交部回应称典型经济胁迫与长臂管辖，中方将采取必要措施。\n2、涉及标的：英伟达（NVDA）、AMD（AMD）为受限标的；A股对应方向为国产替代半导体设备材料，代表个股北方华创（002371）、中微公司（688012）。\n3、影响：对美股偏空、对A股国产替代偏多，强度强，属持续性逻辑；管制升级强化自主可控主线，利好设备材料端。\n（十四）\n1、事件：据Reuters报道，黄金跌至一年低点，受美债收益率与美元压制，势将创2015年以来最差年度表现，黄金期货结算价创52周新低。\n2、涉及标的：黄金ETF（GLD）与金矿股纽蒙特（NEM）承压；A股对应方向为黄金珠宝与贵金属，代表个股山东黄金（600547）、紫金矿业（601899）。\n3、影响：对美股黄金板块偏空，强度强，属持续性逻辑；金价走弱传导A股黄金股盈利预期下修。\n（十五）\n1、事件：据WSJ报道，美元创18个月新高，美元指数抹去解放日跌幅，“卖出美国”担忧消退，美元五连涨后企稳。\n2、涉及标的：美元指数（DXY）走强，新兴市场ETF（EEM）承压；A股对应方向为出口链与外汇敏感板块，代表个股美的集团（000333）、海尔智家（600690）。\n3、影响：对美股偏空于跨国企业盈利，强度中，属持续性逻辑；强美元压制新兴市场资金流入，传导A股外资偏好。\n（十六）\n1、事件：据WSJ报道，IEA称全球石油市场将随海湾出口恢复重回过剩，油价因供应前景改善而回落，抵消中东紧张局势。\n2、涉及标的：原油ETF（USO）与埃克森美孚（XOM）承压；A股对应方向为石油石化与油服，代表个股中国石油（601857）、中海油服（601808）。\n3、影响：对美股能源板块偏空，强度中，属持续性逻辑；油价回落传导A股石油石化盈利预期与油服订单。\n（十七）\n1、事件：据Barron's报道，一纸降级拖累全部稀土股，在特朗普与习近平会晤前稀土板块走弱。\n2、涉及标的：MP Materials（MP）为稀土标的；A股对应方向为稀土永磁，代表个股北方稀土（600111）、中国稀土（000831）当日-10.00%。\n3、影响：对美股稀土偏空，强度中，属当日情绪影响；会晤前不确定性传导A股稀土板块，短期波动加大。\n（十八）\n1、事件：据Bloomberg报道，巴克莱称被迫的散户平仓是台湾股市重挫背后原因，台股遭遇抛售。\n2、涉及标的：台积电（TSM）为台股权重核心；A股对应方向为半导体代工与封测，代表个股中芯国际（688981）、长电科技（600584）。\n3、影响：对美股半导体偏空，强度中，属当日情绪影响；台股去杠杆传导A股半导体情绪，但国产替代逻辑形成对冲。\n（十九）\n1、事件：据WSJ报道，美联储主席Warsh表示美联储正在推演AI如何重塑经济，并重申偏好小步加息，但通胀预期若失控将被迫提速。\n2、涉及标的：标普500（SPX）与美债ETF（TLT）为敏感标的；A股对应方向为大金融与利率敏感板块，代表个股招商银行（600036）、中国平安（601318）。\n3、影响：对美股偏空，强度中，属持续性逻辑；加息偏好与AI经济推演影响全球流动性预期，传导A股银行保险估值。\n（二十）\n1、事件：据BusinessInsider报道，迪士尼CEO Josh D'Amaro的科技战略获华尔街认可，财报超预期；同时Opera宣布以普通股直接登陆纳斯达克替代ADS。\n2、涉及标的：迪士尼（DIS）与Opera（OPRA）为事件主体；A股对应方向为传媒IP与浏览器软件，代表个股光线传媒（300251）、三六零（601360）。\n3、影响：对美股偏多，强度弱，属当日情绪影响；科技战略与上市结构调整对A股传媒软件板块示范效应有限。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n更多更即时更聚焦信息请订阅：\n━━━━━━━━━━━━━\n⭐️⭐️⭐️ 华尔街观察团队 | WSV量化模型 | 不构成投资建议 | 投资有风险 ⭐️⭐️⭐️","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122674607501275632","l":["macaostarbridge.com"],"ln":[{"u":"https://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["美联储","通胀","美股","汇率","原油能源","AI科技","财报","关税贸易","黄金"],"lk":0,"rt":0,"rp":1,"vw":597},{"id":"2122674601217999265","h":"cnfinancewatch","ts":1794920036,"zh":"今日美股与全球热点二十条\n（一）\n1、事件：据财联社报道，英伟达将于太平洋时间11月17日下午1时20分左右公布2027财年第三季度财务业绩，并于下午2时召开业绩电话会议，市场聚焦四大看点。\n2、涉及标的：英伟达（NVDA）为全球AI算力核心标的；A股对应方向为CPO光模块与算力硬件，代表个股中际旭创（300308）、新易盛（300502）。\n3、影响：对美股偏多待验证，强度强，属当日情绪影响；财报结果将直接传导A股算力硬件板块，超预期则修复光模块情绪。\n（二）\n1、事件：据华尔街见闻报道，黄仁勋离职震荡蔓延，“AI央行”紧缩，新云公司融资危险了，英伟达董事会称暂不考虑复职事项。\n2、涉及标的：英伟达（NVDA）管理层变动为核心变量；A股对应方向为AI算力与服务器，代表个股工业富联（601138）、华胜天成（600410）。\n3、影响：对美股偏空，强度强，属当日情绪影响；管理层不确定性压制AI硬件估值，传导A股算力板块风险偏好。\n（三）\n1、事件：据华尔街见闻报道，英伟达暴跌，空头大赚240亿美元，英伟达跌4%，空头40天斩获240亿美元收益。\n2、涉及标的：英伟达（NVDA）为空头主要目标；A股对应方向为半导体与AI硬件，代表个股寒武纪（688256）、海光信息（688041）。\n3、影响：对美股偏空，强度强，属当日情绪影响；空头获利了结压力传导A股国产算力芯片情绪，短期波动加大。\n（四）\n1、事件：据华尔街见闻报道，AI暴跌前华尔街大佬分道扬镳，桥水、索罗斯Q3大砍英伟达持仓，“木头姐”、Tepper逆势加码，德鲁肯米勒清仓闪迪、台积电。\n2、涉及标的：英伟达（NVDA）、台积电（TSM）、闪迪（SNDK）为调仓对象；A股对应方向为半导体设备材料，代表个股北方华创（002371）、有研新材（600206）。\n3、影响：对美股偏空，强度中，属持续性逻辑；机构分歧加大显示AI交易拥挤度高位，传导A股半导体板块波动。\n（五）\n1、事件：据华尔街见闻报道，高盛五份研报同指一个结论，AI盛宴接近尾声，市场比经济更脆弱。\n2、涉及标的：纳斯达克100指数（NDX）与标普500（SPX）为承压指数；A股对应方向为AI应用与算力，代表个股科大讯飞（002230）、浪潮信息（000977）。\n3、影响：对美股偏空，强度中，属持续性逻辑；外资对AI估值担忧传导A股科技板块风险偏好收敛。\n（六）\n1、事件：据华尔街见闻报道，大摩高喊拥抱风险，AI算力开支只会迟到不会缩水，顶格超配全球股市，摩根士丹利将全球股票上调至最大超配。\n2、涉及标的：MSCI全球指数与标普500（SPX）为受益方向；A股对应方向为算力基础设施，代表个股中科曙光（603019）、紫光股份（000938）。\n3、影响：对美股偏多，强度中，属持续性逻辑；与高盛观点形成对冲，对A股算力板块情绪形成一定支撑。\n（七）\n1、事件：据财联社报道，Anthropic IPO计划于11月18日定价，并于次日开始交易，IPO成AI牛市关键试金石。\n2、涉及标的：Anthropic为待上市AI标的；A股对应方向为AI大模型与应用，代表个股三六零（601360）、昆仑万维（300418）。\n3、影响：对美股偏多待验证，强度强，属当日情绪影响；IPO定价与首日表现将检验AI估值，传导A股AI应用板块情绪。\n（八）\n1、事件：据华尔街见闻报道， "id":"2122671338276204775","h":"dmjk001","ts":1794919259,"zh":"《广发海外电子通信》\n☄️存储：下调NAND价格预测\n👉据TrendForce最新跟踪，受消费端需求疲软及中国eSSD采购动能放缓拖累，NAND需求表现弱于预期。我们进一步下调明年NAND合约价预期，预计2027年Q1-Q4价格环比为0%/-3%/-8%/-12%。\n☀️下调NAND价格预测：我们将2027年Q1-Q4 NAND合约价环比预期从+6%/+3%/0%/0%下调至0%/-3%/-8%/-12%。消费电子需求持续疲软，预计2027年智能手机与PC出货量均将出现两位数下滑。与此同时，国内GPU与HBM供应瓶颈制约了服务器部署节奏，削弱了配套eSSD的采购需求，抵消了北美云厂商9月以来的加单效应。上述多重逆风共同缓解了此前的供应紧张局面，对NAND价格形成下行压力。\n☀️2027年Q2或迎供过于求：我们目前预计2026/27/28年NAND bit需求增速分别为26%/20%/24%，其中2027年需求下修47.8EB（占总需求的3.2%），主要反映消费端双位数需求下滑以及中国eSSD采购放缓。供给端方面，随着中国厂商产能持续扩张以及QLC产品占比提升，我们预计2026/27/28年NAND bit供给增速分别为21%/28%/30%，供需格局将迎来反转，预计2026/27/28年NAND供需缺口分别为-5%/+3%/+7%，2027年Q2起或正式进入价格下行通道。\n☀️2028年情景分析：展望2028年，我们预计NAND市场将继续分化，消费市场复苏节奏及中国CSP的eSSD需求仍是核心变量，供给则取决于海外与中国厂商的排产策略。我们对2028年NAND价格设定悲观/中性/乐观三种情景，分别为$0.08/0.15/0.20/GB，对应AI前价格，LTA底部价格，乐观需求价格。作为纯NAND厂商，闪迪盈利波动最为剧烈，2028年三种情景下EPS预计分别为34/126/193美元。相比之下，美光与海力士受影响更小：美光预计为190/205/215美元，海力士预计为48/52/55美元。\n☀️投资建议：我们对纯NAND标的仍然保持谨慎，如闪迪（SNDK US）、铠侠（285A JP）、群联（8299 TT）等。DRAM/HBM厂商有望相对跑赢，如美光（MU US）、海力士（SKHY US）及三星电子（005930 KS）。","en":"《广发海外电子通信》\n☄️存储：下调NAND价格预测\n👉据TrendForce最新跟踪，受消费端需求疲软及中国eSSD采购动能放缓拖累，NAND需求表现弱于预期。我们进一步下调明年NAND合约价预期，预计2027年Q1-Q4价格环比为0%/-3%/-8%/-12%。\n☀️下调NAND价格预测：我们将2027年Q1-Q4 NAND合约价环比预期从+6%/+3%/0%/0%下调至0%/-3%/-8%/-12%。消费电子需求持续疲软，预计2027年智能手机与PC出货量均将出现两位数下滑。与此同时，国内GPU与HBM供应瓶颈制约了服务器部署节奏，削弱了配套eSSD的采购需求，抵消了北美云厂商9月以来的加单效应。上述多重逆风共同缓解了此前的供应紧张局面，对NAND价格形成下行压力。\n☀️2027年Q2或迎供过于求：我们目前预计2026/27/28年NAND bit需求增速分别为26%/20%/24%，其中2027年需求下修47.8EB（占总需求的3.2%），主要反映消费端双位数需求下滑以及中国eSSD采购放缓。供给端方面，随着中国厂商产能持续扩张以及QLC产品占比提升，我们预计2026/27/28年NAND bit供给增速分别为21%/28%/30%，供需格局将迎来反转，预计2026/27/28年NAND供需缺口分别为-5%/+3%/+7%，2027年Q2起或正式进入价格下行通道。\n☀️2028年情景分析：展望2028年，我们预计NAND市场将继续分化，消费市场复苏节奏及中国CSP的eSSD需求仍是核心变量，供给则取决于海外与中国厂商的排产策略。我们对2028年NAND价格设定悲观/中性/乐观三种情景，分别为$0.08/0.15/0.20/GB，对应AI前价格，LTA底部价格，乐观需求价格。作为纯NAND厂商，闪迪盈利波动最为剧烈，2028年三种情景下EPS预计分别为34/126/193美元。相比之下，美光与海力士受影响更小：美光预计为190/205/215美元，海力士预计为48/52/55美元。\n☀️投资建议：我们对纯NAND标的仍然保持谨慎，如闪迪（SNDK US）、铠侠（285A JP）、群联（8299 TT）等。DRAM/HBM厂商有望相对跑赢，如美光（MU US）、海力士（SKHY US）及三星电子（005930 KS）。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122671338276204775","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":795},{"id":"2122668566369767525","h":"cnfinancewatch","ts":1794918598,"zh":"一组网络消息：\n一、板块热议：\n半导体芯片：业内人士称，已接获晶圆代工调价通知，涨幅从10％至逾20％不等，明年包括台积电在内的合作晶圆厂都将调价。（华东重机、联合化学、国林科技、佳先股份、西陇科学等）\n昇腾：华为云发布并开源昇腾原生具身世界模型，昇腾云已覆盖80%的中国具身智能企业。（华胜天成、泰嘉股份、克莱特、嘉环科技、真视通等）\n氯化铵：联碱法企业因纯碱长期亏损而主动减产，导致副产品氯化铵供应收缩，国内氯化铵工业级价格涨至730元/吨，创年内新高。（中盐化工、和邦生物、双环科技、华昌化工等）\n#华尔街观察最近提示乳业：11月本是原奶传统淡季，但散奶价格较合同奶价出现明显倒挂，反映供应趋紧，部分地区合同奶价上行。（伊利股份、新乳业、光明乳业、骑士乳业等）\n风险提示：以上内容来自公社用户写作，相关信息未经核实，未必准确，请审慎参考。\n二、大涨股解析：\n顺钠股份：干式变压器\n2026年11月16日盘中消息，1-9月全国电网工程投资完成额4594亿元，同比+4.9%，其中8-9月单月投资同比提速，单9月同比+13.8%；此外，机构预计第五批招标有望于12月挂网招标，有可能涉及“2直1交”，招标金额可观公司为国内干式变压器开拓者，主导或参与制定国家及行业标准超过50项，干式变压器规格超过3000种，累计销量超过16.2万台，其它产品包括预装式变电站、开关柜、电抗器、分布式储能柜及储能系统等，同时承接电力成套工程并提供配套运维服务。\n长虹美菱：家电\n公司2026年H1小家电方面已推出集成AI控温、净水和保鲜存储的AI冰吧机，正在开发AI视觉食材识别、膳食大模型、健康数据监测和自适应烹饪调控系统，构建智能健康烹饪方案。公司空调（营收占比55.99%）搭载AI人感技术并布局AI节能算法，冰箱冰柜（营收占比29.97%）营收占比29.97%，围绕“AI垂直应用”完善产品矩阵，并已推出AI套系家电。\n北鼎股份：小家电\n公司2026年持续推出全钢蒸锅、全钛锅具、全钛保温杯、全玻璃养生壶等升级新品，中国区前三季度收入6.01亿同比增长27.54%，Q3单季1.88亿同比增长33.9%；公司深耕高品质厨房小家电，主要产品养生壶（营收占比17.43%）、蒸炖锅（31.15%）产品在国补背景下具备较强优势，自主品牌规模效应显现。\n泰嘉股份：昇腾超节点PSU\n2026年11月16日市场传闻（未证实），DeepSeek新版本拟采用原生国产昇腾950DT超节点进行训练的消息，具体方案尚待官方确认。公司通过旗下雅达电子深度布局AI服务器 PSU，通过华为官方认证，进入昇腾供应链，独家代工CloudMatrix 384 超节点高功率电源模块PSU，同时供货微软LES，是国内最早实现PSU供货海外巨头的企业之一。\n盛剑科技：光刻胶+半导体设备\n1、2026年5月18日盘后纪要，2025 年光刻胶显影液（TMAH）回收技术在客户端测试验证成功，蚀刻液回收技术研发完成。\n2、2026年6月25日机构研报，公司是半导体废气处理与厂务设备龙头，已获得亚翔新加坡项目1亿风管代工订单，真空泵、工艺废气处理设备在马来西亚英飞凌厂验证顺利，预计27年可获得设备订单。公司昨晚正式授予股权激励，目标激进，预测26-28年业绩0.7/2.0/3.6。\n西陇科学：光刻胶配套试剂\n公司拥有酸碱类、溶剂类、蚀刻类和光刻胶配套试剂多种，和英特尔（成都）公司等建立合作关系。公司铜蚀刻液实现量产供应，可用于显示面板8.5高世代产线。\n真视通：华为算力\n公司是华为的“多产品金牌代理”，与华为昇腾会谈共同探索“智能算力建设与运营”合作之路。公司作为北京移动数字北京算力服务产品合作伙伴，为北京移动提供GPU高性能计算服务、并行文件存储服务、机房液冷服务、算力网络服务等。\n扬子新材：半导体洁净室\n2026年8月31日互动，公司的主要产品包括高洁净彩涂板、抗静电彩涂板、高韧耐污彩涂板等，主要用于集成电路厂房、医疗场所等建设项目，下游主要客户为净化及洁净类公司。\n亚泰集团：重整投资协议落地\n2026年11月16日晚公告，公司与长发集团、长春兴泰企业管理及其设立的长春泰启企业管理签署《重整投资协议》。重整投资人拟合计出资15.53亿元，受让公司14.19亿股转增股票，占转增后总股本的20.90%。其中，长发集团作为牵头投资人，将在投资完成后取得公司控股权。\n双环科技：氯化铵涨价\n2026年11月16日讯，截至11月16日氯化铵工业级730元/吨创年内新高，上周山东、河北干铵主流价格升至720元/吨，周内大涨80元/吨，涨幅达12.5%。公司本部运用联碱法生产纯碱和氯化铵等化工产品，年产纯碱近110万吨，每生产1吨纯碱同时产生1吨氯化铵。公司自备真空制盐装置，产能130万吨/年。","en":"一组网络消息：\n一、板块热议：\n半导体芯片：业内人士称，已接获晶圆代工调价通知，涨幅从10％至逾20％不等，明年包括台积电在内的合作晶圆厂都将调价。（华东重机、联合化学、国林科技、佳先股份、西陇科学等）\n昇腾：华为云发布并开源昇腾原生具身世界模型，昇腾云已覆盖80%的中国具身智能企业。（华胜天成、泰嘉股份、克莱特、嘉环科技、真视通等）\n氯化铵：联碱法企业因纯碱长期亏损而主动减产，导致副产品氯化铵供应收缩，国内氯化铵工业级价格涨至730元/吨，创年内新高。（中盐化工、和邦生物、双环科技、华昌化工等）\n#华尔街观察最近提示乳业：11月本是原奶传统淡季，但散奶价格较合同奶价出现明显倒挂，反映供应趋紧，部分地区合同奶价上行。（伊利股份、新乳业、光明乳业、骑士乳业等）\n风险提示：以上内容来自公社用户写作，相关信息未经核实，未必准确，请审慎参考。\n二、大涨股解析：\n顺钠股份：干式变压器\n2026年11月16日盘中消息，1-9月全国电网工程投资完成额4594亿元，同比+4.9%，其中8-9月单月投资同比提速，单9月同比+13.8%；此外，机构预计第五批招标有望于12月挂网招标，有可能涉及“2直1交”，招标金额可观公司为国内干式变压器开拓者，主导或参与制定国家及行业标准超过50项，干式变压器规格超过3000种，累计销量超过16.2万台，其它产品包括预装式变电站、开关柜、电抗器、分布式储能柜及储能系统等，同时承接电力成套工程并提供配套运维服务。\n长虹美菱：家电\n公司2026年H1小家电方面已推出集成AI控温、净水和保鲜存储的AI冰吧机，正在开发AI视觉食材识别、膳食大模型、健康数据监测和自适应烹饪调控系统，构建智能健康烹饪方案。公司空调（营收占比55.99%）搭载AI人感技术并布局AI节能算法，冰箱冰柜（营收占比29.97%）营收占比29.97%，围绕“AI垂直应用”完善产品矩阵，并已推出AI套系家电。\n北鼎股份：小家电\n公司2026年持续推出全钢蒸锅、全钛锅具、全钛保温杯、全玻璃养生壶等升级新品，中国区前三季度收入6.01亿同比增长27.54%，Q3单季1.88亿同比增长33.9%；公司深耕高品质厨房小家电，主要产品养生壶（营收占比17.43%）、蒸炖锅（31.15%）产品在国补背景下具备较强优势，自主品牌规模效应显现。\n泰嘉股份：昇腾超节点PSU\n2026年11月16日市场传闻（未证实），DeepSeek新版本拟采用原生国产昇腾950DT超节点进行训练的消息，具体方案尚待官方确认。公司通过旗下雅达电子深度布局AI服务器 PSU，通过华为官方认证，进入昇腾供应链，独家代工CloudMatrix 384 超节点高功率电源模块PSU，同时供货微软LES，是国内最早实现PSU供货海外巨头的企业之一。\n盛剑科技：光刻胶+半导体设备\n1、2026年5月18日盘后纪要，2025 年光刻胶显影液（TMAH）回收技术在客户端测试验证成功，蚀刻液回收技术研发完成。\n2、2026年6月25日机构研报，公司是半导体废气处理与厂务设备龙头，已获得亚翔新加坡项目1亿风管代工订单，真空泵、工艺废气处理设备在马来西亚英飞凌厂验证顺利，预计27年可获得设备订单。公司昨晚正式授予股权激励，目标激进，预测26-28年业绩0.7/2.0/3.6。\n西陇科学：光刻胶配套试剂\n公司拥有酸碱类、溶剂类、蚀刻类和光刻胶配套试剂多种，和英特尔（成都）公司等建立合作关系。公司铜蚀刻液实现量产供应，可用于显示面板8.5高世代产线。\n真视通：华为算力\n公司是华为的“多产品金牌代理”，与华为昇腾会谈共同探索“智能算力建设与运营”合作之路。公司作为北京移动数字北京算力服务产品合作伙伴，为北京移动提供GPU高性能计算服务、并行文件存储服务、机房液冷服务、算力网络服务等。\n扬子新材：半导体洁净室\n2026年8月31日互动，公司的主要产品包括高洁净彩涂板、抗静电彩涂板、高韧耐污彩涂板等，主要用于集成电路厂房、医疗场所等建设项目，下游主要客户为净化及洁净类公司。\n亚泰集团：重整投资协议落地\n2026年11月16日 装成家族特权、内部秩序来公司贬损。\n个人角度老黄未来一段时间回归英伟达的可能性其实不大了，但这么急迫搞臭一家全球市值第一的上市公司创始人还是第一次看到。大家再一次看到这一次“倒黄”背后几鼓势力合流势能之凶猛。","en":"“看我的大字报如何炮打AI司令部”，华尔街日报这篇特稿真是让我惊到了。标题直接就用了“贬损、派对与一个‘王室家族’”。核心几点：\n1）老黄本人以严苛、当面斥责闻名，会议上会说“你的问题很愚蠢”“这个想法很愚蠢”，还会用“死脸”形容被训后茫然的员工。\n2）女儿黄敏珊（Madison）被描述成实际上的幕僚长，属于非正式的“乐队”核心圈，随父走遍全球，要求同样苛刻，还会用“死脸”“金鱼”（记不住事的人）骂人。\n3）员工普遍认为公司文化是围绕黄仁勋及其成年子女建立的，几乎没有传统公司架构，黄有60个直接下属，家人被私下称为“皇室家族”。\n把这些元素叠在一起，再配合页面导航里的“黄仁勋被罢免”“英伟达风云”“临时首席执行官”，是不是就有了“旧司令部垮台后，把内部运作和文化贴出来清算”的感觉。\n一个把企业带到如此高度的大佬，要说没有个性那是假的，乔布斯、马斯克在也都有过“暴君”标签，但这种过往行事风格，被包装成家族特权、内部秩序来公司贬损。\n个人角度老黄未来一段时间回归英伟达的可能性其实不大了，但这么急迫搞臭一家全球市值第一的上市公司创始人还是第一次看到。大家再一次看到这一次“倒黄”背后几鼓势力合流势能之凶猛。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUxdTdaIAEC-J6.jpg?name=orig","https://pbs.twimg.com/media/HXUxdTXbMAAE87u.jpg?name=orig","https://pbs.twimg.com/media/HXUxdTZakAA-dgl.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122657529968857480","l":[],"ln":[],"t":["AI科技"],"lk":5,"rt":1,"rp":2,"vw":2284},{"id":"2122657303228993991","h":"fxtrader","ts":1794915912,"zh":"对于英伟达新设立的国家安全和出口管制监督委员会，特朗普表示，“这是一家伟大的公司，这是一个伟大的想法。”","en":"对于英伟达新设立的国家安全和出口管制监督委员会，特朗普表示，“这是一家伟大的公司，这是一个伟大的想法。”","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122644736548786176/vid/avc1/1280x720/VA-nDB0Hagr8aZil.mp4?tag=29"],"u":"https://x.com/fxtrader/status/2122657303228993991","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":1,"rt":0,"rp":0,"vw":742},{"id":"2122657022445588875","h":"fxtrader","ts":1794915845,"zh":"英伟达刚刚宣布，董事会决定成立一个新的常设机构——国家安全和出口管制监督委员会，专门负责监督公司的国家安全保障及全球贸易合规相关程序。\n委员会将聘请外部专家，英伟达审计委员会成员Suzanne Nora Johnson担任主席。\n现有的国家安全团队和全球贸易合规团队将向委员会和临时CEO克雷斯汇报。","en":"英伟达刚刚宣布，董事会决定成立一个新的常设机构——国家安全和出口管制监督委员会，专门负责监督公司的国家安全保障及全球贸易合规相关程序。\n委员会将聘请外部专家，英伟达审计委员会成员Suzanne Nora Johnson担任主席。\n现有的国家安全团队和全球贸易合规团队将向委员会和临时CEO克雷斯汇报。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUwRmwboAAVVs2.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122657022445588875","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":3,"rt":0,"rp":3,"vw":2241},{"id":"2122656336500629603","h":"dmjk001","ts":1794915682,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXUwrt3bMAAV_Mf.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122656336500629603","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1055},{"id":"2122656181894459763","h":"dmjk001","ts":1794915645,"zh":"路透：尽管遭到亚马逊、谷歌、Meta 及其他美国科技公司的反对，特朗普政府仍计划推进阻止进口中国数据中心设备的举措。\n路透社8月报道，美国联邦通信委员会正寻求以国家安全为由，禁止美国进口新型号的中国光收发器。光收发器使数据能够在数据中心内以光速通过光纤电缆传输。、\n据两位了解会议情况的人士透露，这些高管告诉官员们，美国企业可能需要长达十年时间才能遵守任何此类规定。\n这些游说活动曾让人怀疑该措施是否会继续推进。但据另外三位知情人士透露，该措施正在向前推进。由于相关讨论属于私下进行，这些人士要求匿名。","en":"路透：尽管遭到亚马逊、谷歌、Meta 及其他美国科技公司的反对，特朗普政府仍计划推进阻止进口中国数据中心设备的举措。\n路透社8月报道，美国联邦通信委员会正寻求以国家安全为由，禁止美国进口新型号的中国光收发器。光收发器使数据能够在数据中心内以光速通过光纤电缆传输。、\n据两位了解会议情况的人士透露，这些高管告诉官员们，美国企业可能需要长达十年时间才能遵守任何此类规定。\n这些游说活动曾让人怀疑该措施是否会继续推进。但据另外三位知情人士透露，该措施正在向前推进。由于相关讨论属于私下进行，这些人士要求匿名。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXUwVOQbgAAa3d6.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122656181894459763","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":0,"vw":1212},{"id":"2122655444569342272","h":"fxtrader","ts":1794915469,"zh":"记者：您会提出台湾问题吗？\n特朗普：我相信他（习近平）会提出的。我不必提出——他会提出的。","en":"记者：您会提出台湾问题吗？\n特朗普：我相信他（习近平）会提出的。我不必提出——他会提出的。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122646738385108992/vid/avc1/1280x720/yIjN41bxNf6oeHEl.mp4?tag=29"],"u":"https://x.com/fxtrader/status/2122655444569342272","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":0,"vw":2201},{"id":"2122655378802667630","h":"wufantouzi","ts":1794915453,"zh":"11月19号ANT上市开启交易\n这几天整个市场在暴跌\n和它的抽血也有关系\n不过这些都只能短期影响市场\n过段时间好公司都海水涨回来的","en":"11月19号ANT上市开启交易\n这几天整个市场在暴跌\n和它的抽血也有关系\n不过这些都只能短期影响市场\n过段时间好公司都海水涨回来的","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/wufantouzi/status/2122655378802667630","l":[],"ln":[],"t":[],"lk":5,"rt":0,"rp":2,"vw":1559},{"id":"2122655236477358176","h":"fxtrader","ts":1794915420,"zh":"特朗普：我们将在一切我们需要的方面追赶上。\n日本、印度、澳大利亚也是一样。","en":"特朗普：我们将在一切我们需要的方面追赶上。\n日本、印度、澳大利亚也是一样。","zh _campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":7,"rt":1,"rp":5,"vw":1323},{"id":"2122633686436941864","h":"yijiangren","ts":1794910282,"zh":"他没做错什么\n只是把推特当成抖音和快手发罢了\n推特是一个极其功利的地方\n人们只有两个诉求\n看黄\n赚钱\n可惜他好像一个也满足不了","en":"他没做错什么\n只是把推特当成抖音和快手发罢了\n推特是一个极其功利的地方\n人们只有两个诉求\n看黄\n赚钱\n可惜他好像一个也满足不了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/yijiangren/status/2122633686436941864","l":[],"ln":[],"t":[],"lk":7,"rt":0,"rp":7,"vw":1694},{"id":"2122632109106012451","h":"xingpt","ts":1794909906,"zh":"德鲁肯米勒最新13F：AI产业利润的重新分配\n11月16日，德鲁肯米勒（Stanley Druckenmiller）旗下Duquesne Family Office公布了2026年Q3持仓，13F申报总市值为44.71亿美元，环比下降14.2%，持仓数量从95项减少至65项。\n结合最近几个季度的持仓变化、他今年的公开采访，以及11月份的美股行情，我认为他的投资思路正在发生一些比较重要的变化。\n1. 生物科技可能成为下一轮市场的主线\n很多人关注德鲁肯米勒的半导体持仓，却忽略了生物医药已经成为他最大的配置方向，占13F申报市值的四成左右。\n第一大重仓股是癌症及基因检测公司Natera（$NTRA），持仓市值13.06亿美元，占比从上季度的16.6%上升至29.2%。不过，这期间他的持仓股数实际减少了0.8%，权重提升主要来自股价上涨和其他仓位的收缩。\n此外，他还持有大量生物科技公司，包括：\n$INSM：罕见病治疗\n$RVMD：RAS靶向抗癌药\n$NAMS：心血管疾病创新药\n$BEAM：基因碱基编辑\n$RLAY：精准药物研发\n今年3月，德鲁肯米勒在接受摩根士丹利采访时，解释了自己投资生物科技的几个原因：\n一是生物科技经历了数年的低迷，存在市场领导板块切换的机会；二是行业的技术面和价格动量正在发生变化；三是生物科技可能是AI最具潜力的应用场景之一，尤其是药物研发、疾病诊断和持续监测。\n这笔交易值得重视的地方，在于将产业技术变革、行业周期和市场资金轮动结合起来。\n未来可以重点观察生物科技ETF（$XBI）相对于纳斯达克100（$QQQ）的走势。\n2. 减持AI算力，加仓HDD\nQ3德鲁肯米勒对半导体进行了大幅调仓：\n清仓AMD、Sandisk、Google。\n减持94.5%的台积电、47.9%的意法半导体。\n增持180.2%的希捷科技（$STX）。\n新建仓希捷看涨期权及西部数据（$WDC）。\n两家HDD厂商合计占其13F申报市值的9.9%（含期权对应标的市值）。\n尤其值得注意的是，他清仓了做NAND的Sandisk，同时买入了做HDD的西部数据。\n相比其他半导体细分赛道，HDD具有行业竞争格局高度集中、资本开支相对克制、供给弹性有限等特点。随着AI生成的数据量不断增长，海量数据的长期存储需求，有望转化为HDD厂商的定价能力、利润率和自由现金流增长。\n希捷10月底公布的财报也部分验证了这一逻辑，单季度自由现金流达到14.79亿美元，创历史新高。\n不过，随着AI数据中心融资环境恶化，HDD未来的需求增长也存在被下修的风险。\n3. 从AI基础设施向AI应用进行切换\nQ3德鲁肯米勒大幅增加了部分AI应用公司的配置：\n增持435.5%的Unity（$U）。\n增持42.7%的亚马逊（$AMZN）。\n新建仓AppLovin（$APP）。\n新建仓Palantir（$PLTR）。\n其中Unity和AppLovin这组交易尤其值得关注，两家公司都能通过AI算法提高广告投放效率，并将技术进步直接转化为收入和利润。\n最新财报显示，Unity的AI广告平台Vector收入同比增长126%，AppLovin营收同比增长55%，净利润增长72%。\n过去几年，AI产业的超额利润主要集中在上游算力厂商。但随着模型能力提升、推理成本下降以及竞争加剧，超额利润可能逐渐向具有用户、数据和商业化优势的下游应用公司转移。\n相比需要投入巨额资本开支的云厂商，部分AI应用公司具有更好的资本回报率和利润增长潜力。\n4. 宏观层面：警惕资本稀缺和AI融资风险\n9月10日，据《金融时报》报道，德鲁肯米勒认为，考虑到美国经济、资本开支热潮以及对资本的争夺，即便当时美债收益率已经明显上升，利率可能依然偏低。\n据11月16日《华尔街日报》报道，德鲁肯米勒近期与Paul Tudor Jones在一场闭门会议上就AI泡沫展开辩论。\n他表达了几个重要观点：\nAI是历史上规模最大的技术变革之一。\n其家族办公室已经削减AI相关投资敞口。\n英伟达目前正在获取超常水平的利润（overearning），未来利润率可能下降，竞争对手也会获得更多市场份额。\n资本市场未必愿意为计划中的大规模AI数据中心建设提供足够资金。\n最后一点尤其重要。\n美国政府财政赤字、Hyperscaler资本开支、Neocloud债务融资，都在争夺有限的资本。资本成本的上升，可能成为制约下一阶段AI发展的重要因素。\n此外，德鲁肯米勒在Q3退出了多项宽基指数看涨期权，并同时新建仓三大黄金矿业公司Newmont（$NEM）、Barrick（$B）和Agnico Eagle（$AEM）。\n结合他此前长期看空美元、担忧美国财政可持续性的观点，这部分配置也具有一定的宏观交易属性。\n5. 结合近期行情，推测他四季度做了什么？\n如果按照9月30日披露的持仓静态计算，截至11月16日，德鲁肯米勒的正股组合累计下跌约15.3%，其中两大核心重仓Natera和希捷科技分别下跌约30%和46%。\n相比之下，Unity和AppLovin分别上涨约27%和43%。\n与此同时，美国10年期国债收益率突破5%，AI基础设施企业的信用风险显著上升。\n结合他的近期发言及一贯灵活的交易风格，我推测他在四季度可能进行了以下调整：\n一是进一步削减AI硬件敞口，特别是对数据中心建设速度高度敏感的公司；二是降低部分重仓股的集中度；三是保留部分AI应用和生物科技公司的配置；四是通过现金、短期国债或宏观对冲降低组合整体风险。\n至于加密货币，虽然他在10月29日公开确认投资了Trade[XYZ]，但其Q3加密相关上市公司持仓市值实际上环比下降了约13%。目前没有充分证据表明他正在增加加密资产的方向性多头敞口。\n总结\n我认为，德鲁肯米勒当前的投资主线，可以归纳为四个方向：\n生物科技的行业复苏与技术变革。\nAI产业链内部的利润重新分配。\n具有供给约束和定价能力的细分行业。\n资本成本上升背景下的宏观风险管理。\n过去三年，AI投资最重要的变量是需求增长。未来三年，竞争格局、资本成本、自由现金流和投资回报率可能变得更加重要。\n即使AI产业继续高速发展，产业增长与股东回报之间也可能出现显著分化。\n注：13F持仓截至9月30日，组合收益为不含期权、股息及期间调仓的静态模拟，四季度交易方向为个人推测。","en":"德鲁肯米勒最新13F：AI产业利润的重新分配\n11月16日，德鲁肯米勒（Stanley Druckenmiller）旗下Duquesne Family Office公布了2026年Q3持仓，13F申报总市值为44.71亿美元，环比下降14.2%，持仓数量从95项减少至65项。\n结合最近几个季度的持仓变化、他今年的公开采访，以及11月份的美股行情，我认为他的投资思路正在发生一些比较重要的变化。\n1. 生物科技可能成为下一轮市场的主线\n很多人关注德鲁肯米勒的半导体持仓，却忽略了生物医药已经成为他最大的配置方向，占13F申报市值的四成左右。\n第一大重仓股是癌症及基因检测公司Natera（$NTRA），持仓市值13.06亿美元，占比从上季度的16.6%上升至29.2%。不过，这期间他的持仓股数实际减少了0.8%，权重提升主要来自股价上涨和其他仓位的收缩。\n此外，他还持有大量生物科技公司，包括：\n$INSM：罕见病治疗\n$RVMD：RAS靶向抗癌药\n$NAMS：心血管疾病创新药\n$BEAM：基因碱基编辑\n$RLAY：精准药物研发\n今年3月，德鲁肯米勒在接受摩根士丹利采访时，解释了自己投资生物科技的几个原因：\n一是生物科技经历了数年的低迷，存在市场领导板块切换的机会；二是行业的技术面和价格动量正在发生变化；三是生物科技可能是AI最具潜力的应用场景之一，尤其是药物研发、疾病诊断和持续监测。\n这笔交易值得重视的地方，在于将产业技术变革、行业周期和市场资金轮动结合起来。\n未来可以重点观察生物科技ETF（$XBI）相对于纳斯达克100（$QQQ）的走势。\n2. 减持AI算力，加仓HDD\nQ3德鲁肯米勒对半导体进行了大幅调仓：\n清仓AMD、Sandisk、Google。\n减持94.5%的台积电、47.9%的意法半导体。\n增持180.2%的希捷科技（$STX）。\n新建仓希 面\n #苹果 卖方均值目标价345.57美元，买入16家、持有8家、卖出6家，目标价低于现价，近四周EPS下修多于上修，研报端不支持追高。\n#菲利普斯66 $PSX 均值目标价299.13美元，区间258到346美元，买入6家无卖出，近四周EPS上修22家、下修2家。 #Grid\nDynamics $GDYN 均值13.75美元，4家全是买入，近四周EPS上修9家，但今天有律所发布股东调查通知，研报再好也先放一放。\n#资金面\nARK两只及以上基金同买的有三只。 #太空探索科技 $SPCX\n获ARKK与ARKW同买，合计约5190万美元，是本期金额最大的一笔；期权最大Put行权价135，距现价只差1.72%，偏空，和基金买入方向相反，不能算多头共振。\n#Block $XYZ 、 #Shopify $SHOP\n也是多基金同买，但股价分别在20日区间59%和29%，五日仍在回撤，位置不够。邮件还记了ARKQ买入 #火箭实验室 $RKLB\n约90万美元，公开交易记录未核验到；即便算上，期权最大Put行权价57贴着现价57.37，也是偏空，不算共振。\n带方向的期权里，只有 #苹果 最干净：最大Call行权价355距现价-0.36%，量仓比24.14，Call持仓增仓5.5%，三项同向。\n#菲利普斯66 最大Call量仓比4.84、Call持仓增仓1.3%，P/C成交比只有0.04，但行权价220距现价远了17%，只能记偏多、不能当贴价看涨。\n#Grid Dynamics 期权P/C成交比1.82，空单放量，没有多头共振。\n#期货\n邮件给出的持仓变化，量能口径更接近上周五：标普迷你OI增4.88万手、量比0.99，纳指迷你OI增9072手、量比1.05，价跌但量能未确认，暂不定性。微型纳指价跌OI降，属多头离场。10年期美债价涨OI降，属空头回补；30年期美债价跌OI降，属多头离场。原油价跌OI降3.45万手，多头离场；黄金价涨OI降，空头回补。周一股指继续下跌，今天盘前只是纳指期货略高、标普微跌，还看不到新多进场。\n#中美映射\n20日窗口，美股 $JETS 涨13.45%、 $ITB 涨9.98%、 $PHO 与 $FIW 各涨9.61%、 $IHE 涨9.01%、\n$AGNG 涨8.72%、 $XHB 涨7.31%、 $XLV 涨6.96%、 $XLU 涨6.67%、 $XLP 涨6.18%、 $XLF\n涨5.67%。A股这边，消费50ETF涨9.40%、消费ETF涨6.93%、酒ETF涨6.44%、银行ETF涨5.77%领先。5日窗口，美股只有\n$XLE 涨2.83%、 $XLP 涨","en":"美股盘前下午版｜2026年11月17日 周二 北京时间15:05\n#结论\n今日大类只做两个：必选消费与公用事业的低波动防守，和大盘消费科技龙头。只做名单只给一只，第二、第三个位置空着。候选里能同时过技术位置和资金共振的，只剩靠近前高的苹果；箱底的航天和炼油股还没走出右侧，医药事件票已经伸展，不进只做。\n #苹果 $AAPL 周一收352.78，跌0.98%，距20日高也是52周高360.83还有2.28%，处在近20日区间77%的位置。比上周五的1.3%远了一点，略宽于通常的2%门槛，仍按突破准备的回撤来看，不突破不进。期权最大Call行权价355，距现价只差0.36%，量仓比24.14，Call持仓增仓5.5%，三项同向偏多。卖方目标价均值345.57低于现价，近四周EPS下修16家、上修9家，只给半仓。\n明确不做：半导体和AI硬件，英伟达今晚美股盘后出换帅后第一份财报，周一收156.14，跌4.12%，处在20日区间只剩10%的位置；已经大涨或五日涨幅过大的品种；ARK同买但仍在阴跌的箱底票，先观察不追。\n#消息面\n截至北京时间15时出头，美股期指分化。纳指期货27311，较周一结算27284涨约0.1%；标普期货7425，跌约0.2%；道指期货51489，跌约0.4%。周一纳指收24509.76，跌2.49%，已经离开10月收盘高点10%以上，重新进入技术性调整；标普7416.59，跌1.92%；道指51608.17，跌1.41%；费城半导体跌5.28%。A股今天收盘，上证3584.58跌0.50%，创业板跌1.20%，科创50收1221.19，涨0.62%，比午后低点有所回升。\n #英伟达 $NVDA 今晚盘后发布三季报，是黄仁勋辞职、原CFO克雷斯任临时CEO后的第一份财报。华尔街预期营收约1090亿美元，高于公司自身1080亿美元上下的指引，每股收益约2.47美元。有报道称黄仁勋方面在讨论回归，Yorkville的丹·艾夫斯认为回归希望不大，并下调了预期。有机构把期权隐含波动 nese President Xi Jinping on Tuesday that it \"wasn't easy\" to close Taiwan's office in his country, acknowledging he faced domestic challenges in doing so.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122608242698211742","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/papua-new-guineas-prime-minister-says-taiwan-does-not-operate-there-anymore-2026-11-17/?taid=6afc109738c51300013dfeba&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":401},{"id":"2122607980252111077","h":"qinbafrank","ts":1794904153,"zh":"美股又多了一个能影响股票定价的资产类型，永续合约这一币市原创终于在美股登堂入室。这两天才注意到本月初11月3日，CFTC主席Michael S. Selig 正式宣布，美股个股永续合约可以在符合条件的美国交易所开始交易。这些合约被依据CFTCRegulation 40.3 视为已批准定性为《商品期货现代化法案》下的 security futures products（证券期货产品），由 CFTC 和 SEC 联合监管。\n要求交易所必须同时满足：\n1）CFTC 的DCM牌照；\n2）SEC 的 notice-registered national securities exchange备案（针对 security futures）；\n要特别注意，这是直接挂钩美股正股价格的永续期货合约，不是很多加密交易所上的代币化股票（tokenized stocks）合约。这次美股个股永续合约是CFTC/SEC 框架下的 Equity Perps ，与加密交易所上的美股代币合约是安全不同产品。前者是美国监管机构批准能直接面对美国客户的产品，前者是监管灰色地带的产物。\nKalshi 已在11月5日前后上线，覆盖约50只大型个股（如 Nvidia、SpaceX、Micron 等）。上线10天左右名义成交量已达约50亿美元，单日部分热门标的（如 Nvidia）能到上亿美元级别。Coinbase已经在准备、Backpack也计划很快上线美股个股永续合约。\n这个意义还是非常大的，之前美股只有股指期货合约，并没有个股合约而永续合约更是币市原创，大家只能玩正股和期权。现在美股个股永续合约已经被正式批准，美股又多了一个能影响定价的资产类型。\n现在加密永续已经是一个日成交数千美元、年成交几十万亿美元接近百万亿美金级别的成熟市场。从长期天花板来看，美股个股永续合约（Equity Perps）的潜力确实更大，原因很直接：\n1）底层市场规模差距巨大\n美股市值远超加密资产。传统股权衍生品（股票/指数期货和期权）本身就是万亿美元级别的成熟市场，年合约成交量以百亿张计。如果美股永续能分到传统股权衍生品的一部分流量，或吸引新的杠杆/投机需求，规模很容易超过当前的加密永续。\n2）需求场景更广泛 加密永续高度依赖加密圈内的杠杆交易文化；美股永续则可以同时吸引传统股票投资者、对冲基金、散户杠杆需求，以及希望更简单做空的用户。\n当然短期内规模还需要时间，增长不会那么迅速。毕竟也有限制：\n1）目前美国合规版本的杠杆被压得较低（大致 5–7 倍左右），远低于离岸加密永续常见的 20–100 倍。\n2）产品才刚推出，流动性还在建立阶段；\n3）加密永续已经跑了近十年，生态和用户习惯非常成熟；美股永续还需要时间积累流动性、经纪通道和用户教育。\n现在还面临法律挑战：Cboe 和 Citadel 等组成的团体已起诉 CFTC，认为其无权批准这类产品。法官初步认为原告“很可能在实体问题上胜诉”，但拒绝了紧急禁令，最终结果还不确定、还要看双方博弈的情况。\n美股个股永续如果能在监管和法律挑战中站稳，并逐步提升流动性和可接受度，中长期确实有机会成长到比当前加密永续更大的规模，但那应该是几年后的事情了。","en":"美股又多了一个能影响股票定价的 ],"t":["AI科技"],"lk":15,"rt":0,"rp":2,"vw":3523},{"id":"2122583229496734060","h":"bbcchinese","ts":1794898252,"zh":"周一（11月16日）晚间，台北101外墙打灯声援辉达（Nvidia）创办人黄仁勋。此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","en":"周一（11月16日）晚间，台北101外墙打灯声援辉达（Nvidia）创办人黄仁勋。此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122554344130363392/vid/avc1/720x1280/yfIQvXLptTLEoPrY.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2122583229496734060","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":2,"rp":0,"vw":1710},{"id":"2122581167417540855","h":"yijiangren","ts":1794897760,"zh":"想像玩游戏一样做交易吗？\n大家还记得前两天的 LOL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意思多了。\n二，交易也能像玩游戏一样升级\n这是我个人最喜欢的设计。\n引入了 XP、等级、成就和 Trading Drops 机制。\n交易产生的成交量可以转化为 XP，XP 累积之后可以提升等级。\n随着参与度增加，还能获得不同稀有度的 Mystery Box。\n里面有头像框、专属名牌、称号和弹幕样式等个性化道具。\n从 Common 到 Legendary，一共有四个稀有度。\n你甚至可以通过自己的等级、头像框和称号，让其他人知道你在这个社区里的身份。\n这就有点像 MMORPG 里的角色成长系统。\n每个人都有自己的等级、装备和专属身份。\n交易之外，还多了一层收集和养成的乐趣。\n三，把交易、社交和游戏放进同一个地方\n的底层交易接入 Hyperliquid。\n它把行情、交易执行、实时聊天室、K 线弹幕和游戏化奖励融合在一个界面里。\n这意味着你不需要在行情软件、X、Telegram 和 DEX 之间反复切换。\n看行情、讨论市场、观察其他人的观点，以及执行交易，都可以在同一个地方完成。\n这也是它和传统 DEX 最明显的差异。\n传统 DEX 更像一个交易终端， 则试图把它变成一个有社区、有互动、有成长体系的交易空间。\n我一直认为，加密的特殊之处在于：价格由交易决定，叙事靠社区传播，情绪在社交网络里发酵。\n如果这些东西能够在同一个产品里形成闭环，用户体验自然会发生变化。\n当然，游戏化奖励只是额外体验，没必要为了刷 XP 而过度交易。\n但我确实很喜欢 的产品思路。\n交易本来就可以很有趣。\n一个人盯盘是交易，一群人一起看市场、讨论行情、分享观点，或许才是加密社区更有生命力的样子。\n想体验一下这种交易方式，可以去看看：\nTrade together, farm fun together.","en":"想像玩游戏一样做交易吗？\n大家还记得前两天的 LOL 总决赛吗？\n在 B 站看比赛，最有意思的体验之一，就是弹幕。\n精彩操作出现的时候，满屏都是666；团战打起来，弹幕瞬间刷屏；有人预测下一波团战，有人分析 BP，还有人单纯跟着大家一起欢呼。\n看比赛，一个人看和一群人看，完全是两种体验。\n交易也可以有类似的体验。\n现在大多数 DEX 给人的感觉都比较工具化。\n打开平台，看 K 线、看盘口、看资金费率，然后自己判断、自己下单、自己承担盈亏。\n交易本身当然很重要，但整个过程多少有些孤独。\n最近在玩一个新的DEX 豆腐/TOFU @togetherdotfun\n它给我的感觉，像把弹幕文化和游戏里的成长体系，搬进了 DEX。\n觉不觉得他们的网站开屏就跟一个直播间一样\n并且从一个前UI设计师和半个产品的角度来看，他们的产品设计真的挺有意思。\n一，每个 Token 都有自己的直播间\n给每个 Token 配备了独立的实时聊天室，还把弹幕直接放进了 K 线图里。\n你可以一边看行情，一边看其他交易者的实时讨论。\n有人看多，有人看空，有人分享自己的交易观点，也有人在关键行情出现时发弹幕。\n还有 Together Moments 和精彩观点展示，让一些有价值的市场讨论能够留下来。\n想象一下， bitcoin:native 突然放量突破，整个 K 线图上弹幕飞过，聊天室同步讨论。\n这种体验，比一个人盯着 K 线有意思多了。\n二，交易也能像玩游戏一样升级\n这是我个人最喜欢的设计。\n引入了 XP、等级、成就和 Trading Drops 机制。\n交易产生的成交量可以转化为 XP，XP 累积之后可以提升等级。\n随着参与度增加，还能获得不同稀有度的 Mystery Box。\n里面有头像框、专属名牌、称号和弹幕样式等个性化道具。\n从 Common 到 Legendary，一共有四个稀有度。\n你甚至可以通过自己的等级、头像框和称号，让其他人知道你在这个社区里的身份。\n这就有点像 MMORPG 里的角色成长系统。\n每个人都有自己的等级、装备和专属身份。\n交易之外，还多了一层收集和养成的乐趣。\n三，把交易、社交和游戏放进同一个地方\n的底层交易接入 Hyperliquid。\n它把行情、交易执行、实时聊天室、K 线弹幕和游戏化奖励融合在一个界面里。\n这意味着你不需要在行情软件、X、Telegram 和 DEX 之间反复切换。\n看行情、讨论市场、观察其他人的观点，以及执行交易，都可以在同一个地方完成。\n这也是它和传统 DEX 最明显的差异。\n传统 DEX 更像一个交易终端， 则试图把它变成一个有社区、有互动、有成长体系的交易空间。\n我一直认为，加密的特殊之处在于：价格由交易决定，叙事靠社区传播，情绪在社交网络里发酵。\n如果这些东西能够在同一个产品里形成闭环，用户体验自然会发生变化。\n当然，游戏化奖励只是额外体验，没必要为了刷 XP 而过度交易。\n但我确实很喜欢 的产品思路。\n交易本来就可以很有趣。\n一个人盯盘是交易，一群人一起看市场、讨论行情、分享观点，或许才是加密社区更有生命力的样子。\n想体验一下这种交易方式，可以去看看：\nTrade together, farm fun together.","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXTsDEOaMAAZFZF.jpg?name=orig","https://pbs.twimg.com/media/HXTsF4sa4AAdoqe.jpg?name=orig","https://pbs.twimg.com/media/HXTsJZ5bsAAhdoR.jpg?name=orig" 此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","en":"周一（11月16日）晚间，台北101外墙打灯声援辉达创办人黄仁勋。此次点灯由台湾产业界重要成员共同发起，吸引不少民众驻足拍照。\n黄仁勋在台湾一直拥有极高人气，无论造访夜市、外出用餐、出席活动，都经常吸引大批民众围观。\n在风波爆发后，包括马斯克在内的一些科技界人士，皆传出希望黄仁勋能重新出任辉达执行长。美国总统特朗普则表示，他“不介意”看到黄仁勋重新出任辉达执行长。\n《金融时报》报导，黄仁勋正与相关人士讨论重返公司管理层的可能性。不过，BBC了解到，在公司内部调查仍持续进行的情况下，他短期内重掌辉达的机率并不高。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122554344130363392/vid/avc1/720x1280/yfIQvXLptTLEoPrY.mp4?tag=29"],"u":"https://x.com/bbcchinese/status/2122570437024678229","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":2,"vw":1559},{"id":"2122569336527458788","h":"cnfinancewatch","ts":1794894939,"zh":"超跌反弹会很快，所以这里仍然是“等结果”，不是单边看空到底。本周另一只靴子是Anthropic，计划18日定价、19日上市。\n二、短剧和高位题材的亏钱效应，今天已经从提示变成价格。已核实：文投控股开盘即靠近跌停，报3.37元，跌9.89%，盘中最高只到3.57元，午后仍封死跌停；浙文影业跌10.08%，大晟文化跌10.00%，慈文传媒跌近10%。这是对16日风险提示的兑现——前三季度营收1.80亿元、净亏3754.58万元，AI漫剧收入约占2.57%，并提示可能被实施退市风险警示。高位股同样在兑现：闽发铝业午间邮件记为12天7板后跌停（连板天数未逐日复核），大东方跌停，日出东方深跌。对短线交易者，这意味着亏钱效应正在从光模块扩散到连板；对还想接力“羊字辈”、广百、华东重机的人，赔率已经不好看。\n三、外部风险偏好没有转暖，银行红利今天也不是无脑避风港。已核实：港股恒生指数午间收报23571.61点，跌0.77%，恒生科技跌0.46%，科网股普遍调整，哔哩哔哩、百度跌幅靠前，华虹宏力则涨超9%。亚洲股市同步偏弱，FXStreet在北京时间13:01前后称，日经225跌约1.18%、报58960点附近，韩国KOSPI跌约1.79%、接近5000点；我们早间还记录到KOSPI盘中一度跌破5000点。银行板块午间走弱，银行ETF鹏华半日跌0.96%，新浪基金转述其重仓股里工商银行午间跌1.10%；13:28前后工商银行约跌0.33%，只是跌幅收窄，并没有重新走强。黄金、原油隔夜已明显走弱，美元走强的压力还在。邮件转述美联储官员倾向缓慢加息、部分机构喊出连续加息，未逐条核实原话，只作为外部约束的背景。银行和红利可以继续当作底仓，但昨天创历史新高之后，今天更适合看回踩，不适合把防御做成追高。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"超跌反弹会很快，所以这里仍然是“等结果”，不是单边看空到底。本周另一只靴子是Anthropic，计划18日定价、19日上市。\n二、短剧和高位题材的亏钱效应，今天已经从提示变成价格。已核实：文投控股开盘即靠近跌停，报3.37元，跌9.89%，盘中最高只到3.57元，午后仍封死跌停；浙文影业跌10.08%，大晟文化跌10.00%，慈文传媒跌近10%。这是对16日风险提示的兑现——前三季度营收1.80亿元、净亏3754.58万元，AI漫剧收入约占2.57%，并提示可能被实施退市风险警示。高位股同样在兑现：闽发铝业午间邮件记为12天7板后跌停（连板天数未逐日复核），大东方跌停，日出东方深跌。对短线交易者，这意味着亏钱效应正在从光模块扩散到连板；对还想接力“羊字辈”、广百、华东重机的人，赔率已经不好看。\n三、外部风险偏好没有转暖，银行红利今天也不是 ，随后拉升至31.52元涨停，振幅20%，成交超过34亿元，证券时报e公司报道封单超过13万手，走出“地天板”。阳光照明同步涨停，澎湃称继续引领所谓“羊字辈”炒作；长虹美菱、小熊电器走出2连板，北鼎股份涨超15%，美的集团午后仍小幅上涨。这和昨天的逻辑是连续的：科技股出清时，资金去买有出口和内销故事的家电。但九阳自9月28日以来累计涨幅超230%（证券时报口径；每日经济新闻若从8月底起算则写约294%），此前异常波动公告已说明参股机器人相关公司属财务性投资、对当期营收和利润无重大影响。地天板是情绪交易的极致，不是基本面突变。制约：高位股的赔率已经变差，若半导体午后继续回流，家电的接力资金会被抽走。\n三、流动性和个别政策是托底，不是今天的交易主线。已核实：央行17日开展7140亿元隔夜逆回购，利率1.25%，当日有4600亿元逆回购到期，Wind口径单日净投放2540亿元。商务部等9部门发布意见，推动新能源汽车“车电一体报废”回收拆解，这是中期政策线索。华为算力方向也有局部高潮，华胜天成涨停、走出3天2板，真视通、嘉环科技涨停，拓维信息跟涨。这些能解释为什么下跌之后仍有活钱，但连板股波动加大，广百股份4连板、华东重机3连板，已经是短线博弈而不是配置。邮件转述的“11月16日股票型ETF净申购216亿元、融资余额减少214.1亿元”，是上一交易日的资金数据，不宜写成今日增量。\n三大利空方向（由强到弱）\n一、英伟达财报与管理层真空，仍是本周最硬的空头约束。已核实：公司将于美西时间11月17日13:20、也就是美东16:20左右、北京时间18日凌晨5:20前后公布2027财年第三季度业绩，这是首席财务官科莱特·克雷斯以临时CEO身份主持的首份财报。董事会知情人士向CNBC等表示，暂不考虑让黄仁勋回归，当前重点仍是相关调查。周一英伟达跌4.12%，收156.14美元，纳指跌2.49%。今天A股半导体能反弹，恰恰说明有资金在抢国产替代和超跌，但光模块没有跟上，说明全球算力链的风险并没有被消化。制约的另一面是：若指引稳住，","en":"热点财经新闻综述｜2026-11-17·午间\n数据时点：A股以11月17日午间收盘（北京时间11:30）为主，并用13:28前后的公开行情补充午后变化；港股为午间收盘；外盘与海外消息整理截至北京时间13:30左右。本期邮箱新增两封热点财经邮件（11月17日早间08:10版、午间13:10版），均在垃圾邮件中。凡标“邮件转述”的内容未逐条核实，其余已对照新华财经、中新经纬、每日经济新闻、证券时报、澎湃、公开行情及已披露公司文件。\n今日判断\n今天上午的剧本，几乎是昨天的镜像。指数低开后翻红，半导体和光刻机把昨天的杀跌往回修，银行和短剧则在吐出涨幅。已核实：截至午间收盘，上证报3602.07点，微跌0.01%；深证成指报10764.88点，涨0.69%；创业板指报2336.80点，涨0.72%；科创50报1253.91点，涨3.31%，早盘一度跌超1%。北证50涨2.44%，报857.01点。新华财经称沪深半日成交约8946亿元，较上一交易日半日缩量59亿元；中新经纬则写半日成交约9010亿元、超3500只个股上涨。金融界统计，截至12:30两市约42只涨停。\n但这不是风格已经切回来了。光模块并没有跟上半导体的反弹，英伟达还要到北京时间18日凌晨才公布黄仁勋离职后的首份财报。更直接的信号是午后开盘后反弹明显回吐：截至13:28前后，上证跌约0.26%，创业板由午间的上涨转为下跌约0.72%，科创50涨幅从3.31%收窄到约1.22%。上午的修复，更像财报前的超跌反弹，叠加上国产替代交易，不是可以追高的趋势反转。短剧这边，昨天提示的风险今天兑现了——文投控股、浙文影业、大晟文化跌停，慈文传媒接近跌停。\n三大利多方向（由强到弱）\n一、半导体设备材料与晶圆代工的国产替代，是今天最强的主线，但要把它和光模块分开看。已核实：午间中芯国际、华虹宏力大幅上扬，午间邮件记为分别涨7.43%、11.59%；有研新材、伟测科技涨停，联合化学、国林科技触及20%涨停。新华财经称半导体、光刻机、消费电子、OLED等居前。逻辑上有三条，但要分清新旧：中芯国际三季度营收31.90亿美元、同比增33.9%、环比增6.1%，产能利用率由二季度的93.7%升至97.3%，毛利率29.9%，这是11月12日前后已披露的业绩，不是今天的新财报，四季度指引还略有回落；每日经济新闻提到，上海微电子新一代光刻机日前亮相，称国产前道干式光刻机已在国内量产线运行；另据港股报道，美国商务部16日出台临时规定，限制部分国家通过远程方式访问先进人工智能芯片和服务器，强化了国产算力替代的交易情绪。对谁有影响：晶圆代工、光刻机和电子化学品今天接到了钱； "l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/business/aerospace-defense/how-trump-xi-went-tariff-war-trade-truce-2026-11-17/?taid=6afbd860da07f00001ffa687&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":["关税贸易"],"lk":2,"rt":1,"rp":0,"vw":510},{"id":"2122545642220449961","h":"fxtrader","ts":1794889290,"zh":"阿里巴巴、腾讯和月之暗面等中国AI企业近期推出的新模型，均削弱了网络攻击能力，同时强化网络防御功能。举措被解读为回应中国政府关于AI带来的风险的指示，正值政府计划禁止出口能够攻击关键国家基础设施或威胁军事目标的AI工具。\n阿里巴巴最新发布的Qwen4-Max并未没有公开模型权重（Model Weights），因此用户无法像使用开源权重模型那样，下载完整模型并自行部署、修改或微调。\n腾讯本月初发布Hy4模型前，也削弱了部分网络攻击功能。\n月之暗面推出Kimi K3.1 Pro模型时，采取了类似措施。\n智谱AI则在今年8月开放GLM-5.3模型权重前，进行安全审查，并向相关机构通报发现的系统漏洞。\n网络安全机构TeamT5认为，中国正试图在AI技术的国际商业化和战略管控之间取得平衡。 “随着中国前沿AI模型据报在网络安全能力方面逐渐缩小与美国同类模型的差距，北京越来越将这些能力视为战略资产，并认为有必要实施更严格的出口管制。”","en":"阿里巴巴、腾讯和月之暗面等中国AI企业近期推出的新模型，均削弱了网络攻击能力，同时强化网络防御功能。举措被解读为回应中国政府关于AI带来的风险的指示，正值政府计划禁止出口能够攻击关键国家基础设施或威胁军事目标的AI工具。\n阿里巴巴最新发布的Qwen4-Max并未没有公开模型权重（Model Weights），因此用户无法像使用开源权重模型那样，下载完整模型并自行部署、修改或微调。\n腾讯本月初发布Hy4模型前，也削弱了部分网络攻击功能。\n月之暗面推出Kimi K3.1 Pro模型时，采取了类似措施。\n智谱AI则在今年8月开放GLM-5.3模型权重前，进行安全审查，并向相关机构通报发现的系统漏洞。\n网络安全机构TeamT5认为，中国正试图在AI技术的国际商业化和战略管控之间取得平衡。 “随着中国前沿AI模型据报在网络安全能力方面逐渐缩小与美国同类模型的差距，北京越来越将这些能力视为战略资产，并认为有必要实施更严格的出口管制。”","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXTKHdub0AAn0Dp.jpg?name=orig","https://pbs.twimg.com/media/HXTLlc9bAAAK76E.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122545642220449961","l":[],"ln":[],"t":["关税贸易"],"lk":0,"rt":0,"rp":0,"vw":263},{"id":"2122544845642445007","h":"cnfinancewatch","ts":1794889100,"zh":"11月17日早盘，市场震荡回升，截至午间收盘，沪指跌0.01%，深成指涨0.69%，创业板指涨0.72%；科创50指数涨超3%，此前一度跌超1%。沪深两市半日成交额8946亿，较上个交易日缩量59亿，全市场超3500只个股上涨。盘面上，芯片产业链早盘强势拉升，华为算力概念、消费电子与家电板块表现活跃；煤炭板块走弱，AI漫剧概念表现低迷。资金在连续调整后明显向国产科技赛道集中回补。\n#互关互粉有关必回","en":"11月17日早盘，市场震荡回升，截至午间收盘，沪指跌0.01%，深成指涨0.69%，创业板指涨0.72%；科创50指数涨超3%，此前一度跌超1%。沪深两市半日成交额8946亿，较上个交易日缩量59亿，全市场超3500只个股上涨。盘面上，芯片产业链早盘强势拉升，华为算力概念、消费电子与家电板块表现活跃；煤炭板块走弱，AI漫剧概念表现低迷。资金在连续调整后明显向国产科技赛道集中回补。\n#互关互粉有关必回","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122544845642445007","l":[],"ln":[],"t":["A股港股","AI科技"],"lk":0,"rt":0,"rp":0,"vw":132},{"id":"2122542532215390476","h":"fxtrader","ts":1794888549,"zh":"中加两国后续的经贸文化安排：\n落实第二届加中经济金融战略对话联合成果，强化两国金融、宏观经济、监管、货币机构务实协作。\n2027年派遣大型商贸代表团访华，举办加中电子商务年，助力加拿大中小企业借助中国电商平台发展。\n加拿大投入85万加元奖学金，支持850名加拿大学生来华高校学习。\n向中国环境与发展国际合作委员会拨款800万加元，调动加方科研力量提供环境政策科学建议。\n加航2027年5月开通温哥华‑广州新航线，中方航司同步增加航班。\n5家加拿大文创企业签署超1500万加元商业协议；设立加中CEO圆桌会议，由加中商业委员会、中国银行联合主办。\n渥太华大学与上海外国语大学签署谅解备忘录，合办本科双学位项目，融合双方国际研究、语言、法语研究、外交学科优势。","en":"中加两国后续的经贸文化安排：\n落实第二届加中经济金融战略对话联合成果，强化两国金融、宏观经济、监管、货币机构务实协作。\n2027年派遣大型商贸代表团访华，举办加中电子商务年，助力加拿大中小企业借助中国电商平台发展。\n加拿大投入85万加元奖学金，支持850名加拿大学生来华高校学习。\n向中国环境与发展国际合作委员会拨款800万加元，调动加方科研力量提供环境政策科学建议。\n加航2027年5月开通温哥华‑广州新航线，中方航司同步增加航班。\n5家加拿大文创企业签署超1500万加元商业协议；设立加中CEO圆桌会议，由加中商业委员会、中国银行联合主办。\n渥太华大学与上海外国语大学签署谅解备忘录，合办本科双学位项目，融合双方国际研究、语言、法语研究、外交学科优势。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2122542532215390476","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":1123},{"id":"2122542057504035110","h":"fxtrader","ts":1794888436,"zh":"加拿大总理卡尼在声明中表示，“加拿大和中国重新校准（recalibrated）了关系，这有利于两国公民。” 加拿大正在“使对外关系更加多样化，这样我们就能自由地按照自己的意愿生活。”\n习近平在会见卡尼时表示期待推进“新型中加战略伙伴关系”。","en":"加拿大总理卡尼在声明中表示，“加拿大和中国重新校准（recalibrated）了关系，这有利于两国公民。” 加拿大正在“使对外关系更加多样化，这样我们就能自由地按照自己的意愿生活。”\n习近平在会见卡尼时表示期待推进“新型中加战略伙伴关系”。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXTIuejb0AArj8c.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122542057504035110","l":[],"ln":[],"t":[],"lk":10,"rt":0,"rp":0,"vw":2675},{"id":"2122541182958071892","h":"fxtrader","ts":1794888227,"zh":"习近平今日在深圳与加拿大总理卡尼会晤，双方已同意在农业和钢铁出口方面进一步降低关税。中国将进一步对价值4亿加元的加拿大农产品出口提供关税减免（包括冷冻猪肉切片，以及虾、龙虾、比目鱼等海鲜产品）。\n加拿大将扩大对中国部分钢铁和铝产品的关税豁免范围。\n双方同意至少持续到2028年底。","en":"习近平今日在深圳与加拿大总理卡尼会晤，双方已同意在农业和钢铁出口方面进一步降低关税。中国将进一步对价值4亿加元的加拿大农产品出口提供关税减免（包括冷冻猪肉切片，以及虾、龙虾、比目鱼等海鲜产品）。\n加拿大将扩大对中国部分钢铁和铝产品的关税豁免范围。\n双方同意至少持续到2028年底。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXTHE6ybkAA-cvL.jpg?name=orig 5592,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXS95Wwa0AEDnbi.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122530129696157728","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":696},{"id":"2122529995243295054","h":"dmjk001","ts":1794885560,"zh":"百度李彦宏：人工智能普及程度低于预期；人工智能并未帮助大多数公司提升营收和利润。","en":"百度李彦宏：人工智能普及程度低于预期；人工智能并未帮助大多数公司提升营收和利润。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2122529995243295054","l":[],"ln":[],"t":["AI科技","财报"],"lk":0,"rt":0,"rp":0,"vw":766},{"id":"2122529236275835279","h":"cnfinancewatch","ts":1794885379,"zh":"这些食物对血脂和血管健康确实有益：\n#沙丁鱼富含omega-3可降甘油三酯；\n#洋葱略降LDL；\n#特级初榨橄榄油是地中海饮食核心；\n#燕麦β-葡聚糖能降LDL；\n#西兰花和\n#核桃\n也有降胆固醇作用。","en":"这些食物对血脂和血管健康确实有益：\n#沙丁鱼富含omega-3可降甘油三酯；\n#洋葱略降LDL；\n#特级初榨橄榄油是地中海饮食核心；\n#燕麦β-葡聚糖能降LDL；\n#西兰花和\n#核桃\n也有降胆固醇作用。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122529236275835279","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":776},{"id":"2122527308678561995","h":"cnfinancewatch","ts":1794884919,"zh":"最近中信的一篇研究报告揭示出市场为什么调整的这么凶，报告认为此轮调整过程中，机构大票的出清速度远快于过往，这意味着机构权重股的快速下跌，特别科技权重快速杀跌，引发市场迅速走熊，这对市场伤害很大。但到明年大票提前出清完成，可能会领先于小票反弹修复。而小微盘股的出清，可能才刚刚开始，意味着小微盘股可能短期没跌完。","en":"最近中信的一篇研究报告揭示出市场为什么调整的这么凶，报告认为此轮调整过程中，机构大票的出清速度远快于过往，这意味着机构权重股的快速下跌，特别科技权重快速杀跌，引发市场迅速走熊，这对市场伤害很大。但到明年大票提前出清完成，可能会领先于小票反弹修复。而小微盘股的出清，可能才刚刚开始，意味着小微盘股可能短期没跌完。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122527308678561995","l":[],"ln":[],"t":[],"lk":3,"rt":0,"rp":2,"vw":1113},{"id":"2122525317847781685","h":"ReutersChina","ts":1794884445,"zh":"中国自由奔放的科技之都深圳在准备本周接待世界领导人之际，呈现出一种不同寻常的安静，汽车喇叭被禁止，送货无人机停飞，居民被敦促将车辆留在家中。","en":"China's freewheeling tech capital of Shenzhen has embraced an unusual quiet as it prepares to host world leaders this week, with car horns banned, delivery drones grounded and residents urged to leave vehicles at home.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122525317847781685","l":["reuters.co 探讨地方政治、两岸交流与统战之间的界线。","en":"台湾“九合一”地方选举下周举行，村里长作为最基层的民选公职，因为掌握地方人脉，在社区服务与选举动员中扮演重要角色。近年部分里长赴中国交流，引发北京透过基层网络影响台湾政治的疑虑。BBC中文走访台湾多个县市，访问不同世代、不同政治背景的里长，探讨地方政治、两岸交流与统战之间的界线。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2122521296982491136/vid/avc1/720x1280/cxzanNpBapgjiX7Z.mp4?tag=16"],"u":"https://x.com/bbcchinese/status/2122524854402589123","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":660},{"id":"2122524454790250776","h":"fxtrader","ts":1794884239,"zh":"#数据 10月全球投资者增持中国在岸政府债券，增持速度为去年5月以来最高；外资持有中国主权国债规模连续第6个月增长，当月增持395亿元，总持仓达2.08万亿元，创下2025年6月之后新高。\n多家基金表示，全球投资者正日益被中国债券的优异表现所吸引，尤其是在将人民币升值因素考虑在内的情况下。（彭博）","en":"#数据 10月全球投资者增持中国在岸政府债券，增持速度为去年5月以来最高；外资持有中国主权国债规模连续第6个月增长，当月增持395亿元，总持仓达2.08万亿元，创下2025年6月之后新高。\n多家基金表示，全球投资者正日益被中国债券的优异表现所吸引，尤其是在将人民币升值因素考虑在内的情况下。（彭博）","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXS0mIKbEAA9fda.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2122524454790250776","l":[],"ln":[],"t":["汇率"],"lk":0,"rt":0,"rp":0,"vw":1096},{"id":"2122520410550087749","h":"TraderS18","ts":1794883275,"zh":"为今之计只能看 APEC 峰会上各国领导人会不会在双边、多边或者比较重要的发布会上重申大力发展 AI 及对 AI 产业支持的声明了。最好是能来一次当年习大大行情那种爆拉，但也可能只是一个赌徒爆仓前的幻想","en":"为今之计只能看 APEC 峰会上各国领导人会不会在双边、多边或者比较重要的发布会上重申大力发展 AI 及对 AI 产业支持的声明了。最好是能来一次当年习大大行情那种爆拉，但也可能只是一个赌徒爆仓前的幻想","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2122520410550087749","l":[],"ln":[],"t":["AI科技"],"lk":15,"rt":2,"rp":2,"vw":22284},{"id":"2122517697174835636","h":"ReutersChina","ts":1794882628,"zh":"美国总统唐纳德·特朗普周二飞抵菲律宾，正值东南亚峰会的尾声，他可能会面临抗议活动，此次出访是在印太地区四方安全对话（Quad）国家领导人两年后的首次会晤之前。","en":"US President Donald Trump flies into the Philippines on Tuesday at the tail end of a Southeast Asian summit, where he could face protests ahead of the first meeting in two years of the leaders of the Quad group of Indo-Pacific countries.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2122517697174835636","l":["reuters.com"],"ln":[{"u":"https://www.reuters.com/world/china/trump-kick-off-asia-trip-with-quad-talks-manila-ahead-china-visit-2026-11-17/?taid=6afbbc44da07f00001ffa594&utm_campaign=trueanthem&utm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":299},{"id":"2122515290152136825","h":"nytchinese","ts":1794882054,"zh":"特朗普访华前，美国推进新规封堵芯片出口漏洞。新规旨在使中国企业更难远程访问英伟达等公司制造的先进芯片。此前，中国企业一直通过东南亚等地的数据中心来租用这些芯片，相关政策曾在特朗普政府内部引发争论。","en":"特朗普访华前，美国推进新规封堵芯片出口漏洞。新规旨在使中国企业更难远程访问英伟达等公司制造的先进芯片。此前，中国企业一直通过东南亚等地的数据中心来租用这些芯片，相关政策曾在特朗普政府内部引发争论。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2122515290152136825","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/usa/20261117/trump-china-ai-chip-loophole/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":4,"rt":1,"rp":3,"vw":2329},{"id":"2122512993993052324","h":"cnfinancewatch","ts":1794881506,"zh":"国内：都看见了杀跌，但仍有人在短剧里找接力\n周一收盘后，韭研公社置顶仍是长韭杯实盘大赛、站规和“打击吹票等不良行为”专帖。往下翻，讨论几乎围着同一张K线：创业板跌4.37%，银行、保险、家电逆势走强，算力硬件被砸。\n第一类是复盘和情绪宣泄。15:41有帖《2026年11月16日连板个股复盘》，摘要写沪深下跌家数多、创业板跌4.37%，防御方向走强，并点到美的、九阳。17:09的涨停点评帖称超4400只下跌、33涨停、63跌停，资金躲进银行家电，算力硬件与高位股退潮——涨跌停和下跌家数是社区口径，我们未逐一核对官方统计。21:18《晚间A股值得关注的资讯》更直白，摘要写“今天，市场跌的大家都找不到北”，并提到北纬科技连板、九阳与小家电走强，资金“高低切”至固态电池。这是社区里对亏钱效应最直接的表述。\n第二类是短剧和家电，仍被当成“接得住的主线”。热门帖讨论文投控股、AI影视传媒、红果OTT大屏和牌照逻辑，还有帖子问“社零只涨0.4%，资金为什么拼命抢这三条消费线”，摘要称美的创历史新高。最新发布里，11月17日0:07已有帖讨论“九阳13天8板疯涨，谁最有资格接棒”，并引申到“阳”字辈补涨——这是作者自己的连板统计和映射，未见公司或交易所口径，不当作已核实事实。华为云16日发布并开源昇腾原生具身世界模型CloudRobo-WM1.2，也被多篇资讯帖带到，但可见摘要里会后合作细节并不多，热度低于上一交易日发布会之前。\n第三类是风险提示还没成为主流话题。22:44的市场精华汇总摘要提到金科股份、山鹰国际的退市风险提示，关联标注里出现了文投控股，但首页未见专门拆解文投控股退市风险警示的热帖。社区仍在讨论AI漫剧用户扩张和影院渠道，对“收入只占2.57%、前三季度亏损”的公告，消化明显慢于对涨停本身的讨论。\n与券商口径的异同：相同点是都承认16日是一次干脆的风格切换，银行家电是避风港，CPO是杀跌中心。不同点是社区把短剧、九阳补涨和固态电池高低切当成“明天还能做”的方向，而公开公告已经给文投控股标上了退市风险警示；海外董事会口径也不支持把黄仁勋回归写成利多。被忽略的风险有三：一是文投这类高位连板票热度还在、基本面已经揭底，开盘若再接力，亏钱效应可能从光模块扩散到短剧；二是“阳”字辈、OTT牌照这类补涨映射，证伪成本很低；三是今早虽有帖子同步了纳指跌2.49%、费半跌逾5%，但对英伟达财报和董事会调查的讨论仍然偏少，容易把隔夜大跌理解成“又一个低吸点”。","en":"国内：都看见了杀跌，但仍有人在短剧里找接力\n周一收盘后，韭研公社置顶仍是长韭杯实盘大赛、站规 在单独消化估值。增量消息还有两条：港交所16日推出首个离岸人民币债券指数，纳入305只债券、名义本金约8500亿元，平均收益率2.08%，挂钩ETF仍在筹备；国家外汇局称10月跨境资金净流入769亿美元，但9至10月月均净流入588亿美元，较8月下降6%，含节假日收支节奏，不宜写成外资大举流入。银行红利是今天相对稳的底仓，但已在历史新高附近，适合持有和回踩，不适合追高。制约：若英伟达财报好于预期，风格可能迅速切回成长。\n二、家电与必选消费，是杀跌里真正接到钱的方向。已核实：16日小家电板块居前，九阳股份收28.65元，涨7.10%；长虹美菱、华帝股份、小熊电器涨停，美的集团创历史新高。这不是主题炒作，而是科技股出清时，资金去买有出口和内销支撑的白马。家电龙头比高位短剧票更经得起波动，但它们也已经走了一段，今天若低开不多而被情绪资金抬升，不要把防御做成追高。\n三、政策托底是中期线索，不是今天的交易主线。已核实：工信部表示，对应付账款规模大、故意拉长账期或投诉较多的车企，将联合部门约谈并督促整改；中汽协同步启动对17家重点车企供应商账款的年度评估，17家是评估范围，不等于已被约谈名单。胜宏科技董事会16日通过1.5亿元至3亿元回购方案。百度三季度营收308亿元，同比下降1%，连续第六个季度下滑，但智能云基础设施收入同比增长94%至82亿元，自由现金流仍为负45.71亿元。这些对零部件现金流和AI应用叙事有帮助，但不足以对冲外部算力链波动，只作为观察项。","en":"热点财经新闻综述｜2026-11-17·早间\n数据时点：A股为11月16日收盘，美股为美东11月16日收盘；隔夜与今早消息整理截至北京时间11月17日07:50。本期邮箱新增一封热点财经邮件（11月16日晚间版），11月17日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照交易所行情、公司公告与主流媒体公开报道。\n今日判断\n周一A股已经先把风格切完了：银行保险创历史新高，算力硬件创年内新低。隔夜美股把同一条裂口又撕大了一截——纳指跌2.49%报24509.76点，标普500跌1.92%报7416.59点，道指跌1.41%报51608.17点，费城半导体跌5.28%，英伟达跌4.12%收156.14美元，光通信股Lumentum、Ciena跌超8%。今早美股期货只是略为回稳，纳指期货涨约0.2%，标普期货基本持平。英伟达将于美东11月17日盘后、也就是北京时间18日早晨公布黄仁勋辞职后的首份财报，市场共识约每股收益2.47美元、营收1091.5亿美元。真空期里，我们对今天的基调是：红利和家电可以做底仓，不抢半导体和光模块的缺口，也不去追已经连板的短剧票。\n三大利多方向（由强到弱）\n一、银行与红利，资金已经用价格确认。已核实：11月16日上证收3602.57点，跌0.87%，盘中失守3600后收回；创业板跌4.37%报2320.02点，科创50跌5.16%，上证50只跌0.30%。沪深京成交约1.49万亿元，较上一交易日缩量1729亿元。工商银行收9.05元，涨2.26%，与建设银行、南京银行、成都银行、杭州银行、江苏银行、青岛银行一起创历史新高；银行ETF华宝涨2.23%。港股同日恒生指数反涨0.49%，收23753.84点，说明外部并不是“中国资产被抛弃”，而是A股成长股在单独消化估值。增量消息还有两条：港交所16日推出首个离岸人民币债券指数，纳入305只债券、名义本金约8500亿元，平均收益率2.08%，挂钩ETF仍在筹备；国家外汇局称10月跨境资金净流入769亿美元，但9至10月月均净流入588亿美元，较8月下降6%，含节假日收支节奏，不宜写成外资大举流入。银行红利是今天相对稳的底仓，但已在历史新高附近，适合持有和回踩，不适合追高。制约：若英伟达财报好于预期，风格可能迅速切回成长。\n二、家电与必选消费，是杀跌里真正接到钱的方向。已核实：16日小家电板块居前，九阳股份收28.65元，涨7.10%；长虹美菱、华帝股份、小熊电器涨停，美的集团创历史新高。这不是主题炒作，而是科技股出清时，资金去买有出口和内销支撑的白马。家电龙头比高位短剧票更经得起波动，但它们也已经走了一段，今天若低开不多而被情绪资金抬升，不要把防御做成追高。\n三、政策托底是中期线索，不是今天的交易主线。已核实：工信部表示，对应付账款规模大、故意拉长账期或投诉较多的车企，将联合部门约谈并督促整改；中汽协同步启动对17家重点车企供应商账款的年度评估，17家是评估范围，不等于已被约谈名单。胜宏科技董事会16日通过1.5亿元至3亿元回购方案。百度三季度营收308亿元，同比下降1%，连续第六个季度下滑，但智能云基础设施收入同比增长94%至82亿元，自由现金流仍为负45.71亿元。这些对零部件现金流和AI应用叙事有帮助，但不足以对冲外部算力链波动，只作为观察项。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122512990264263018","l":[],"ln":[],"t":["美股","A股港股","汇率","AI科技","财报"],"lk":0,"rt":0,"rp":2,"vw":1581},{"id":"2122511062058549484","h":"bbcchinese","ts":1794881046,"zh":"BBC调查发现，有中国顾问公司涉嫌协助富裕移民，伪装成艺术家以虚假资料申请英国的“全球人才签证”。报导揭露，一些移民试图钻制度漏洞，透过支付高额费用予中介伪造作品集，从而冒充为自己的作品。","en":"BBC调查发现，有中国顾问公司涉嫌协助富裕移民，伪装成艺术家以虚假资料申请英国的“全球人才签证”。报导揭露，一些移民试图钻制度漏洞，透过支付高额费用予中介伪造作品集，从而冒充为自己的作品。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122511062058549484","l":["bbc.in"],"ln":[{"u":"https://bbc.in/4t3nOFa","d":"bbc.in"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":1123},{"id":"2122510520691617801","h":"qinbafrank","ts":1794880917,"zh":"拿下CFTC的两张重磅牌照，让Backpack在加密合规层面与Coinbase站在了同一身位。看到Backpack宣布已获得CFTC批准，拿到 DCO（衍生品清算机构）进和DCM（衍生品交易所）两张牌照，意味着Backpack获得早美国合法向零售用户提供衍生品交易与清算服务的资质，正式具备了自己上市自己清算的能力，由此也正式进入全球最大的零售衍生品市场。\nBackpack的DCO牌照获批范围包括全额抵押的期货、期货期权和掉期，以及保证金期货。这意味着它可以处理带杠杆的产品，配套初始保证金、维持保证金、变动保证金和违约管理机制。DCM牌照则解决了产品能不能挂出来的问题。集齐这两张牌照后，Backpack就能够在自己的交易所上线永续合约，并在自己的清算所里完成清结算。\n对比 Coinbase，两边现在的牌照配置已经非常接近：Coinbase拥有交易所、期货经纪商和自有清算所，是目前少数跑通完整链条的平台。但Coinbase的DCO牌照范围仅限全额抵押产品，杠杆相关清算仍需依赖外部伙伴。而Backpack的清算所直接获准保证金期货这比Coinbase的DCO牌照获批范围大得多，这是少有的获准清算保证金期货（margined futures）的新清算所。\n在此之前Backpack 已经持有 FINRA 注册券商 Backpack Securities、FinCEN 货币服务业务（MSB）登记和 22 个州及华盛顿特区的汇款牌照。加上迪拜 VARA 和欧盟 MiFID II，这次 CFTC 批准补上的是美国牌照矩阵里最后、也是最难的一块：衍生品，形成了一个覆盖全球的完备的牌照矩阵，可以说Backpack几乎是要集齐加密领域几乎所有的合规牌照了。\n而且看官方的说法，下一步还要推进美股永续在美国的合约审批与SEC登记，要知道之前美股只有股指期货合约并没有个股的永续合约。美国境内真正的个股永续也是刚刚在本月初被 CFTC 以“deemed approved”的方式放开，需接受 CFTC 和 SEC 的双重监管。监管刚刚放行，Backpack就迅速跟上，加密市场永续合约现在是一个日成交数千亿美金，年成交接近百万亿美金的规模，那么美股个股永续合约市场规模未来只会更大。\n对Backpac 而言，完成DCM+SEC notice registration+具体个股永续合约的审批/认证，这意味着它从“全球平台做美股代币永续”进入“美国监管体系内自己上市、自己清算的真正美股永续”的阶段，妥妥的与Coinbase处于同一监管身位，而且如前面说到它的DCO牌照覆盖保证金期货，清算能力上甚至要更完整一些。\n之前这里","en":"拿下CFTC的两张重磅牌照，让Backpack在加密合规层面与Coinbase站在了同一身位。看到Backpack宣布已获得CFTC批准，拿到 DCO（衍生品清算机构）进和DCM（衍生品交易所）两张牌照，意味着Backpack获得早美国合法向 ,"rp":2,"vw":1916},{"id":"2122505627314647159","h":"cnfinancewatch","ts":1794879750,"zh":"#五大机构研报（窗口内）\n（一）中信证券，2026-11-17，架构调优中心化，OpenAI加速具身布局，核心观点为具身大脑产业进步是OpenAI调整核心动因，前沿AI实验室加速物理AI布局。\n（二）中信建投，2026-11-17，物理AI是人工智能下一波浪潮 建议聚焦优质环节，核心观点为GPT-6加速具身大脑发展，Apple、OpenAI、Meta入局，Tesla推进量产。\n（三）华泰证券，2026-11-17，内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，核心观点为10月全行业景气指数回升，必选消费与可选消费景气改善居前。\n（四）华泰证券，2026-11-17，端侧AI催化密集 看好需求扩容与电池技术升级，核心观点为模型能力向规划与动作执行延伸，带动AI眼镜、无屏穿戴及机器人硬件。\n（五）中信证券，2026-11-16，AI原生广告商业化提速，看好AI影视、AI营销及精品游戏，核心观点为AI模型成本下降，内容平台开放流量入口，AI影视供给增加。\n（六）中信证券，2026-11-16，国家医保谈判持续支持创新药 关注2027年商业化增量，核心观点为新增107种药品其中1类创新药51种，CAR-T首次纳入基本医保。\n（七）华泰证券，2026-11-16，A股策略：底部仍待夯实 配置上建议继续向质量和价值风格切换，核心观点为底部信号体系显示市场处于底部区域，但科技筹码尚未充分出清。\n（八）中信建投，2026-11-16，持续看好国产算力产业链 重点关注GPU/ASIC等环节需求兑现，核心观点为模型迭代与AI商业化支撑算力需求，国产芯片订单有望转化。\n#研报互证（近一个月）\n（一）方向创新药基因：互证结论为月内强支撑。支撑研报为中信证券2026-11-16国家医保谈判持续支持创新药 关注2027年商业化增量，中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，中泰证券2026-11-12医药产业链景气延续 AI4S有望推动估值持续抬升，三家机构指向同一方向，权重上调一档。\n（二）方向基建建筑：互证结论为月内无支撑。近一个月五大机构无研报覆盖基建工程方向，权重下调；但该方向属美股去重榜第2位映射，未与榜单不符，保留观察不剔除。\n（三）方向消费：互证结论为月内强支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，华泰证券2026-11-11猪价二次探底推动产能去化再加速，两家机构指向消费与农业，权重上调一档。\n（四）个股迈瑞医疗：互证结论为月内单一支撑。支撑研报为中信建投2026-11-13 2026年前三季度医药板块经营持续改善 2027年趋势有望延续，提及医疗器械经营改善，维持原权重。\n（五）个股四川路桥：互证结论为月内无支撑。近一个月五大机构无研报覆盖该个股或基建工程细分，权重下调。\n（六）个股美的集团：互证结论为月内单一支撑。支撑研报为华泰证券2026-11-17内需消费景气或底部反转，提及可选消费景气改善，维持原权重。\n（七）被研报否掉的方向：AI算力软件。中信建投2026-11-16持续看好国产算力产业链，但隔夜NVDA-4.12%、纳指-2.49%，行情数据与研报观点冲突，以真实行情为准，研报观点已滞后，该方向剔除。\n（八）被研报否掉的个股：中际旭创。人气榜第2名但5日-9.53%、昨-12.28%，与中信证券2026-11-14看好中国光通信的长期发展趋势研报方向相悖于短期行情，且总市值4817亿属超大盘，剔除。\n（九）权重调整结果：创新药基因上调一档为最高权重，消费上调一档，基建建筑下调一档仅保留观察。","en":"#五大机构研报（窗口内）\n（一）中信证券，2026-11-17，架构调优中心化，OpenAI加速具身布局，核心观点为具身大脑产业进步是OpenAI调整核心动因，前沿AI实验室加速物理AI布局。\n（二）中信建投，2026-11-17，物理AI是人工智能下一波浪潮 建议聚焦优质环节，核心观点为GPT-6加速具身大脑发展，Apple、OpenAI、Meta入局，Tesla推进量产。\n（三）华泰证券，2026-11-17，内需消费景气或底部反转 涨价链、制造、AI链结构性亮点延续，核心观点为10月全行业景气指数回升，必选消费与可选消费景气改善居前。\n（四）华泰证券，2026-11-17，端侧AI催化密集 看好需求扩容与电池技术升级，核心观点为模型能力向规划与动作执行延伸，带动AI眼镜、 orkaround系统性地纳入许可。对需要十万卡级别训练的模型来说，这是成本、可用性和确定性的同步恶化。\n远程先进算力通道被实质性收紧，会提高中国模型厂商训练的成本和难度，拖慢与美国前沿的追赶速度。\n可以说美国正在试图封堵中国AI追赶过程中几乎所有重要的外部途径：\n芯片管制更严格、\n远程算力通道被压缩、前沿模型的反蒸馏措施越来越严格。\n这算不算中国模型的“艰难时刻”？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXR-pmdaMAAb4pl.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2122477672509100265","l":[],"ln":[],"t":["美股","AI科技","关税贸易"],"lk":73,"rt":10,"rp":32,"vw":24347},{"id":"2122472784471491067","h":"tig88411109","ts":1794871920,"zh":"订阅者专享｜11月第三周投资策略深度 11/15 满城剑影齐出鞘\n现在到了一个比较关键的阶段，市场最危险的时候肯定不是人人满仓或者人人做空。因为市场共识的混乱叠加信息和情绪的放大，多空双杀，左右打脸，如何解读？如何应对投资策略 🔽","en":"订阅者专享｜11月第三周投资策略深度 11/15 满城剑影齐出鞘\n现在到了一个比较关键的阶段，市场最危险的时候肯定不是人人满仓或者人人做空。因为市场共识的混乱叠加信息和情绪的放大，多空双杀，左右打脸，如何解读？如何应对投资策略 🔽","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tig88411109/status/2122472784471491067","l":["x.com"],"ln":[{"u":"https://x.com/tig88411109/status/2122209413658563025?a=yYZ_w5kvFQu-FbqV9GM&s=46","d":"x.com"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":1143},{"id":"2122472454748815670","h":"tig88411109","ts":1794871841,"zh":"《11月第三周投资策略周报》：满城剑影齐出鞘。 ⬇️\n25年第一次，6周的相对表现，防御类股票跑赢科技股26%。\n上周标普反弹2.5%，半导体指数暴涨8%。但问题来了，这究竟是多头进攻，还是空头撤退？今天又一个全市场大跌迎接明天财报\n黄仁勋离职引发的英伟达暴跌余震未消。机构投资者，特别是对冲基金，总杠杆接近历史高位，净多头敞口却接近历史低位。\n空头回补，不等于多头入场。\n本周AI迎来两场大考：英伟达“后黄时代”首份财报，以及Anthropic天量IPO。\n市场究竟会迎来新一轮逼空，还是多空双杀？详见订阅者专享","en":"《11月第三周投资策略周报》：满城剑影齐出鞘。 ⬇️\n25年第一次，6周的相对表现，防御类股票跑赢科技股26%。\n上周标普反弹2.5%，半导体指数暴涨8%。但问题来了，这究竟是多头进攻，还是空头撤退？今天又一个全市场大跌迎接明天财报\n黄仁勋离职引发的英伟达暴跌余震未消。机构投资者，特别是对冲基金，总杠杆接近历史高位，净多头敞口却接近历史低位。\n空头回补，不等于多头入场。\n本周AI迎来两场大考：英伟达“后黄时代”首份财报，以及Anthropic天量IPO。\n市场究竟会迎来新一轮逼空，还是多空双杀？详见订阅者专享","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXSJcu_aYAAiEdH.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2122472454748815670","l":[],"ln":[],"t":["美股","AI科技","财报"],"lk":12,"rt":0,"rp":5,"vw":6987},{"id":"2122471365341265940","h":"TheMarketMemo","ts":1794871581,"zh":"目前為止，指數漲漲跌跌，並沒有突破 11 月 5 日大跌陰線的最高價和最低價，說明行情只是在*反覆確認* 11 月 5 日這根大陰線的有效性：如果 涨 8.10%，SPXU 涨 5.73%。半导体做空工具涨幅最大，说明抛压主要集中在芯片板块。\n**板块**\n光模块与互联板块跌幅居前。AAOI 跌 9.48%，LITE 跌 8.48%，CRDO 跌 8.21%，CIEN 跌 8.19%。量子计算板块同步大跌，QBTS 跌 9.31%，IONQ 跌 8.41%。算力与存储相关个股同样承压，IREN 跌 9.80%，SNDK 跌 8.58%，半导体测试设备股 AEHR 跌 10.53%。ASTS 跌 12.33%，在观察股中跌幅最大。\n防御板块相对抗跌。UNH 涨 1.12%，MCD 涨 0.99%，COST 涨 0.68%，WMT 涨 0.25%。软件股中 APP 涨 1.50%，ADBE 涨 1.20%。UBER 涨 0.43%。\n**焦点**\n据报道，美国商务部计划封堵 AI 算力出口的「第三国」漏洞。此前，中国公司无需直接采购芯片，可以通过租用东南亚数据中心的英伟达算力获取资源，这一渠道将被关闭。英伟达在马来西亚、新加坡等地的客户收入中，有多少实际来自转道而来的中国需求，成为市场重新评估的问题。消息出现在 AI 硬件产业链普遍下跌的交易日，光模块、互联和算力租赁个股跌幅集中。\n**小结**\n本日市场呈现明显的风险偏好收缩。资金撤离高估值的 AI 硬件和题材股，转向医疗、必需消费等防御板块。市宽为 12 涨 95 跌，下跌范围很广。后续需关注出口管制细则的落地进度，以及 AI 硬件板块能否企稳。\n---\n说明：\n- 今天的行情数据中没有英伟达的涨跌幅，所以焦点段只写了出口管制这件事本身，没有写英伟达今天的价格或涨跌。帖子里「2025年7月以来最低收盘」的说法也没有引用。\n- 这次没有提供【财报】名单，所以文中没有用财报解释任何个股的涨跌。\n- 个股只有涨跌幅、没有收盘价，所以「收于 X」的写法只用在四个指数上。\n- 其余几个备选角度（OpenAI Mercury、新台币与寿险、挪威主权基金、美光与海力士）和今天的行情关系不大，没有用进复盘。","en":"【美股复盘 · 11月16日】\n**大市**\n美股三大指数全线下跌，科技股领跌。标普500 ETF（ $SPY ）收于 739.96，跌 1.91%。纳指100 ETF（QQQ）收于 661.75，跌 2.67%，跌幅居主要指数之首。道指 ETF（DIA）收于 515.68，跌 1.43%。罗素2000 ETF（IWM）收于 272.95，跌 1.65%。市场普遍走弱，107 只观察股中仅 12 只上涨，95 只下跌。反向杠杆 ETF 涨幅居前：SOXS 涨 16.35%，SQQQ 涨 8.10%，SPXU 涨 5.73%。半导体做空工具涨幅最大，说明抛压主要集中在芯片板块。\n**板块**\n光模块与互联板块跌幅居前。AAOI 跌 9.48%，LITE 跌 8.48%，CRDO 跌 8.21%，CIEN 跌 8.19%。量子计算板块同步大跌，QBTS 跌 9.31%，IONQ 跌 8.41%。算力与存储相关个股同样承压，IREN 跌 9.80%，SNDK 跌 8.58%，半导体测试设备股 AEHR 跌 10.53%。ASTS 跌 12.33%，在观察股中跌幅最大。\n防御板块相对抗跌。UNH 涨 1.12%，MCD 涨 0.99%，COST 涨 0.68%，WMT 涨 0.25%。软件股中 APP 涨 1.50%，ADBE 涨 1.20%。UBER 涨 0.43%。\n**焦点**\n据报道，美国商务部计划封堵 AI 算力出口的「第三国」漏洞。此前，中国公司无需直接采购芯片，可以通过租用东南亚数据中心的英伟达算力获取资源，这一渠道将被关闭。英伟达在马来西亚、新加坡等地的客户收入中，有多少实际来自转道而来的中国需求，成为市场重新评估的问题。消息出现在 AI 硬件产业链普遍下跌的交易日，光模块、互联和算力租赁个股跌幅集中。\n**小结**\n本日市场呈现明显的风险偏好收缩。资金撤离高估值的 AI 硬件和题材股，转向医疗、必需消费等防御板块。市宽为 12 涨 95 跌，下跌范围很广。后续需关注出口管制细则的落地进度，以及 AI 硬件板块能否企稳。\n---\n说明：\n- 今天的行情数据中没有英伟达的涨跌幅，所以焦点段只写了出口管制这件事本身，没有写英伟达今天的价格或涨跌。帖子里「2025年7月以来最低收盘」的说法也没有引用。\n- 这次没有提供【财报】名单，所以文中没有用财报解释任何个股的涨跌。\n- 个股只有涨跌幅、没有收盘价，所以「收于 X」的写法只用在四个指数上。\n- 其余几个备选角度（OpenAI Mercury、新台币与寿险、挪威主权基金、美光与海力士）和今天的行情关系不大，没有用 ruckenmiller 最新13F曝光\n根据2026年第三季度披露的持仓数据，他正在进行一轮大规模的投资组合调整。首先，最大的变化是大幅削减部分AI半导体和科技股敞口：彻底清仓谷歌（GOOGL）、AMD、ARM、闪迪（SNDK）、泛林集团（LRCX），同时大幅减持台积电（TSM）94%、Palo Alto Networks（PANW）74%、CRH（CRH）71%和礼来（LLY）69%，另外还清仓了联合航空（UAL）、达美航空（DAL）。\n但他没有全面撤离科技板块，将资金转向更有选择性的方向：亚马逊（AMZN）加仓43%、希捷（STX）加仓180%，并建立约9040万美元的STX看涨期权仓位；同时新建仓西部数据（WDC）3680万美元、AppLovin（APP）3180万美元、Palantir（PLTR）1500万美元和SpaceX（SPCX）3050万美元的相关持仓。\n医疗创新还是他的核心押注，Natera（NTRA）以约13.1亿美元稳居第一大持仓，Beam Therapeutics（BEAM）大幅加仓356%，Relay Therapeutics（RLAY）加仓144%。他还大举增持Unity（U）436%，并新建仓Somnigroup（SGI）6170万美元。他还一次性新建仓三家黄金矿企：Newmont（NEM）4390万美元、Barrick（B）4290万美元、Agnico Eagle（AEM）4230万美元，合计约1.29亿美元。\n截至第三季度末，前五大持仓依次为NTRA（13.1亿美元）、STX（3.152亿美元）、AMZN（1.925亿美元）、FOXA（1.908亿美元）和YPF（1.776亿美元），其中FOXA本季度也加仓约38%。\n我对这次调仓的理解是，Druckenmiller是在从部分估值敏感、资本开支依赖较高的科技公司撤出，转向盈利兑现、产业链结构性机会和宏观对冲。 清仓AMD、ARM、LRCX，大幅减持TSM，说明他至少在主动降低半导体周期风险。但大幅加仓STX、买入WDC和STX看涨期权，说明他没有完全放弃AI基础设施需求，仓位不大，可能是怕踏空？加仓AMZN、APP、PLTR和U，说明他愿意参与AI应用和平台公司的增长机会。他还买入三大黄金矿企，可能是在为未来的货币政策变化、通胀风险或市场波动增加防御性配置。医疗方面持续重仓NTRA、加码BEAM和RLAY，说明他还是偏好具有独立技术催化剂的成长公司。\n总结下来，他上个季度的操作逻辑就是降低部分AI芯片和半导体设备敞口，增配AI存储与应用，继续押注创新医疗，同时利用黄金矿企对冲宏观不确定性。 这是上个季度的持仓，可以参考和学习的是他上个季度投资的逻辑。","en":"传奇投资人 Stanley Druckenmiller 最新13F曝光\n根据2026年第三季度披露的持仓数据，他正在进行一轮大规模的投资组合调整。首先，最大的变化是大幅削减部分AI半导体和科技股敞口：彻底清仓谷歌（GOOGL）、AMD、ARM、闪迪（SNDK）、泛林集团（LRCX），同时大幅减持台积电（TSM）94%、Palo Alto Networks（PANW）74%、CRH（CRH）71%和礼来（LLY）69%，另外还清仓了联合航空（UAL）、达美航空（DAL）。\n但他没有全面撤离科技板块，将资金转向更有选择性的方向：亚马逊（AMZN）加仓43%、希捷（STX）加仓180%，并建立约9040万美元的STX看涨期权仓位；同时新建仓西部数据（WDC）3680万美元、AppLovin（APP）3180万美元、Palantir（PLTR）1500万美元和SpaceX（SPCX）3050万美元的相关持仓。\n医疗创新还是他的核心押注，Natera（NTRA）以约13.1亿美元稳居第一大持仓，Beam Therapeutics（BEAM）大幅加仓356%，Relay Therapeutics（RLAY）加仓144%。他还大举增持Unity（U）436%，并新建仓Somnigroup（SGI）6170万美元。他还一次性新建仓三家黄金矿企：Newmont（NEM）4390万美元、Barrick（B）4290万美元、Agnico Eagle（AEM）4230万美元，合计约1.29亿美元。\n截至第三季度末，前五大持仓依次为NTRA（13.1亿美元）、STX（3.152亿美元）、AMZN（1.925亿美元）、FOXA（1.908亿美元）和YPF（1.776亿美元），其中FOXA本季度也加仓约38%。\n我对这次调仓的理解是，Druckenmiller是在从部分估值敏感、资本开支依赖较高的科技公司撤出，转向盈利兑现、产业链结构性机会和宏观对冲。 清仓AMD、ARM、LRCX，大幅减
