高至145%，但他并不希望中国经济因此彻底崩溃，因为中国需要养活14亿人口。特朗普还提及因芬太尼问题对中国征收的20%关税，称中国仍在承担相应成本。称通过船舶、海运进入美国的芬太尼数量下降了97%，是中美经贸关系改善的重要体现。\n芯片问题：领先中国10年，可以向中国出售旧芯片\n被问及是否考虑放宽对华出口芯片管制时，表示正与中国讨论一项非常全面的协议。\n追问是否会允许更多美国芯片出口中国。回答“我们只希望出售旧一代芯片。如果一片都不出口，我们也不介意，但只能是旧一代芯片。”\n特朗普认为，美国在芯片制造领域领先中国大约10年。特别提及了英伟达Blackwell芯片，可能会过时，因此美国需要持续保持技术领先。自己向习近平介绍英伟达创始人黄仁勋，习近平称赞黄仁勋是一位非常优秀的人才。特朗普再次表达希望黄仁勋回归英伟达管理层的意愿。\nAI竞争：不希望美国企业在海外建设数据中心\nAI竞争实际上只有美国和中国两个主要玩家，因此，双方需要建立一定的监管边界。与习近平同意，在AI领域建立某种联合监管机制。\n特朗普还表示，习近平非常喜欢“Super Intelligence（超级智能，SI）”这个词，比AI更准确。\n特朗普强调，不希望美国企业在海外建设数据中心。逻辑是，如果美国企业把数据中心建设在海外，中国可能取得这些基础设施及相关资源的竞争优势。如果企业仍然在海外建设，将面临非常高的税收惩罚。希望将AI基础设施和算力投资留在国内。过去美国允许芯片等产业在海外建设，是美国开始失去技术竞争优势的原因之一。\n美俄中三边峰会：核武器、联合声明及国际秩序\n自己最初并没有意识到这次会面的历史意义，后来才意识到这是一次非常重要的外交事件。\n特朗普认为中国正在快速扩充核武库，可能在未来10年内追赶美国。自己很难在美国拥有核优势的情况下主动同意削减核武库，因为这会影响美国的战略威慑能力。\n谈到乌克兰问题时，特朗普将自己与习近平、普京之间的讨论形容为某种“2对1”局面。\n印太与拉美：压缩中国的战略空间\nQuad领导人峰会强调经济安全及供应链韧性、AI技术合作、海上安全及监视行动。\n在介绍菲律宾的合作时，直接对菲律宾方面提出问题“如果中国攻击你们，中东国家会来救你们吗？”借此要求菲律宾减少从中东及其他国家采购能源，转而购买美国能源。\n记者问，格陵兰、委内瑞拉、巴拿马与太平洋军演是否让此次与习近平的对话拥有更大筹码。特朗普表示美国则重新取得在委内瑞拉的主导地位。\n（没有直接谈及台湾、香港或南海问题）","en":"特朗普11月20日白宫记者会主要内容\n对华关系：强调个人关系良好，释放经贸合作信号\n习近平亲自到机场迎接，这是他从未对其他领导人做过的事情，这体现了习近平对美国的尊重。自己与习近平、普京都保持着良好关系，美国因此更加安全。\n特别赞扬了深圳的城市建设，称赞习近平治理中国14亿人口的成绩，认为美国有必要向中国学习。\n中国现在是向美国支付最多资金的国家。未来中美经贸关系可以对两国都有利。\n特朗普回顾了自己第一任期的对华关税政策，称曾将中国关税提高至145%，但他并不希望中国经济因此彻底崩溃，因为中国需要养活14亿人口。特朗普还提及因芬太尼问题对中国征收的20%关税，称中国仍在承担相应成本。称通过船舶、海运进入美国的芬太尼数量下降了97%，是中美经贸关系改善的重要体现。\n芯片问题：领先中国10年，可以向中国出售旧芯片\n被问及是否考虑放宽对华出口芯片管制时，表示正与中国讨论一项非常全面的协议。\n追问是否会允许更多美国芯片出口中国。回答“我们只希望出售旧一代芯片。如果一片都不出口，我们也不介意，但只能是旧一代芯片。”\n特朗普认为，美国在芯片制造领域领先中国大约10年。特别提及了英伟达Blackwell芯片，可能会过时，因此美国需要持续保持技术领先。自己向习近平介绍英伟达创始人黄仁勋，习近平称赞黄仁勋是一位非常优秀的人才。特朗普再次表达希望黄仁勋回归英伟达管理层的意愿。\nAI竞争：不希望美国企业在海外建设数据中心\nAI竞争实际上只有美国和中国两个主要玩家，因此，双方需要建立一定的监管边界。与习近平同意，在AI领域建立某种联合监管机制。\n特朗普还表示，习近平非常喜欢“Super Intelligence（超级智能，SI）”这个词，比AI更准确。\n特朗普强调，不希望美国企业在海外建设数据中心。逻辑是，如果美国企业把数据中心建设在海外，中国可能取得这些基础设施及相关资源的竞争优势。如果企业仍然在海外建设，将面临非常高的税收惩罚。希望将AI基础设施和算力投资留在国内。过去美国允许芯片等产业在海外建设，是美国开始失去技术竞争优势的原因之一。\n美俄中三边峰会：核武器、联合声明及国际秩序\n自己最初并没有意识到这次会面的历史意义，后来才意识到这是一次非常重要的外交事件。\n特朗普认为中国正在快速扩充核武库，可能在未来10年内追赶美国。自己很难在美国拥有核优势的情况下主动同意削减核武库，因为这会影响美国的战略威慑能力。\n谈到乌克兰问题时，特朗普将自己与习近平、普京之间的讨论形容为某种“2对1”局面。\n印太与拉美：压缩中国的战略空间\nQuad领导人峰会强调经济安全及供应链韧性、AI技术合作、海上安全及监视行动。\n在介绍菲律宾的合作时，直接对菲律宾方面提出问题“如果中国攻击你们，中东国家会来救你们吗？”借此要求菲律宾减少从中东及其他国家采购能源，转而购买美国能源。\n记者问，格陵兰、委内瑞拉、巴拿马与太平洋军演是否让此次与习近平的对话拥有更大筹码。特朗普表示美国则重新取得在委内瑞拉的主导地位。\n（没有直接谈及台湾、香港或南海问题）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123950295957098959","l":["x.com"],"ln":[{"u":"https://x.com/WhiteHouse/status/2123822070005928339","d":"x.com"}],"t":["AI科技","关税贸易"],"lk":8,"rt":0,"rp":3,"vw":2966},{"id":"2123950190302548019","h":"bboczeng","ts":1795224161,"zh":"当然是靠Herman老师这样优秀的KOL给我们传递的独家内幕产业链消息啊\n虽然这些消息都是他的人脉，或者其他庄家“偷偷”送给他的，根本也不是他自己调研的结果\n你说他是在是鹦鹉学舌，传递上级下达的口谕\n也不是完全没有道理吧。。。\n😅😅😅","en":"当然是靠Herman老师这样优秀的KOL给我们传递的独家内幕产业链消息啊\n虽然这些消息都是他的人脉，或者其他庄家“偷偷”送给他的，根本也不是他自己调研的结果\n你说他是在是鹦鹉学舌，传递上级下达的口谕\n也不是完全没有道理吧。。。\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123950190302548019","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":930},{"id":"2123949597433417823","h":"cnfinancewatch","ts":1795224019,"zh":"三大利空方向（由强到弱）\n#这有点像是杠杆出清\n一、全球AI交易进入出清，外部冲击周一就会出现在A股开盘价里。已核实的美股、日韩台跌幅见上文。台积电收2000元新台币，跌4.76%；联发科、台达电收跌停。邮件转述的英伟达走弱、Anthropic次日回吐，已被收盘价坐实。另已核实：美国商务部工业与安全局日前公布规则，收紧先进芯片通过海外数据中心远程使用的路径；穆迪把英伟达信用评级展望由正面调至稳定，Aa1评级本身维持不变。沽空报告质疑AMD对华风险及“不能简单替代英伟达”，AMD予以否认，股价仍随板块重挫，通富微电收跌10.00%报39.67元，封测链条显著下跌。为SpaceX采购芯片而发行的约321亿美元债券，最大档收益率约8.26%，说明高息仍能找到买盘，但也提醒AI资本开支的融资成本并不便宜。晚间邮件还写入“黄仁勋将创办新公司、筹资500亿美元”，这是Semafor记者的个人预测，不是公司已公布的计划，不能当成事实交易。对谁不利：A股CPO、光模块、封测、设备材料，以及一切还在用“AI主线没坏”定价的高位票。制约：超跌之后会有反弹，但反弹的触发应看美股周一是否先稳住，而不是周五尾盘的A股银行。\n二、A股内部亏钱效应仍在扩大，指数被权重修好，多数股票没有被修好。创业板、科创与中小盘跌幅明显大于上证。东财Choice统计涨停30只、封板率约68%，另有14只盘中触及涨停；连板网等游资口径记为涨停28、跌停58，最高4板为盛剑科技、真视通。无论用哪一种口径，涨停都偏少、跌停都偏多。长鑫科技收创上市以来新低，市值冠军易主本身就是科技权重被改写。港股恒生指数跌1.89%报22410.80点，恒生科技跌3.78%，网易跌超17%，快手跌超11%，华虹宏力跌超10%，阿里巴巴则涨超3%，同样是结构分化。已核实：欢瑞世纪因2022年年报虚增利润，将于11月23日停牌、24日复牌并简称“ST欢瑞”。制约：局部题材（算力租赁、农业、机器人）仍有板，但那是退潮期的残存接力，不是市场广度修复。\n三、大宗商品和汇率同步提示：这不是经典的避险行情。已核实：中文行情常用口径下，COMEX黄金期货收报3539.00美元/盎司，跌3.98%，白银收报41.08美元、跌7.39%；道琼斯以11月交割的主力合约计，结算价3512.30美元，当日跌4.61%、当周跌9.47%，为2025年8月29日以来最低结算价。WTI\n12月合约结算83.98美元，涨0.77美元、约0.93%，与晚间邮件里的盘中价82.63美元不是同一个时点。日本10月核心CPI升至2.2%，加息预期升温。美元指数公开报价约103.9。黄金大跌、股市大跌同时出现，更像杠杆出清，而不是资金从股票有序搬到黄金。对A股黄金股、有色和外资流入都偏负面。欧股亦普跌，欧洲斯托克50收跌约2.8%，德国DAX跌约2.5%至2.6%，法国CAC40跌1.89%。邮件转述的铜价下跌、美债因避险走强、美元或连续第四周上涨，本档未全部核到精确收盘，只作为方向性转述。北向资金周五成交2384.70亿元，占两市成交约16.77%，具体净买入本档未见到交易所口径，不以净流入下结论。","en":"三大利空方向（由强到弱）\n#这有点像是杠杆出清\n一、全球AI交易进入出清，外部冲击周一就会出现在A股开盘价里。已核实的美股、日韩台跌幅见上文。台积电收2000元新台币，跌4.76%；联发科、台达电收跌停。邮件转述的英伟达走弱、Anthropic次日回吐，已被收盘价坐实。另已核实：美国商务部工业与安全局日前公布规则，收紧先进芯片通过海外数据中心远程使用的路径；穆迪把英伟达信用评级展望由正面调至稳定，Aa1评级本身维持不变。沽空报告质疑AMD对华风险及“不能简单替代英伟达”，AMD予以否认，股价仍随板块重挫，通富微电收跌10.00%报39.67元，封测链条显著下跌。为SpaceX采购芯片而发行的约321亿美元债券，最大档收益率约8.26%，说明高息仍能找到买盘，但也提醒AI资本开支的融资成本并不便宜。晚间邮件还写入“黄仁勋将创办新公司、筹资500亿美元”，这是Semafor记者的个人预测，不是公司已公布的计划，不能当成事实交易。对谁不利：A股CPO、光模块、封测、设备材料，以及一切还在用“AI主线没坏”定价的高位票。制约：超跌之后会有反弹，但反弹的触发应看美股周一是否先稳住，而不是周五尾盘的A股银行。\n二、A股内部亏钱效应仍在扩大，指数被权重修好，多数股票没有被修好。创业板、科创与中小盘跌幅明显大于上证。东财Choice统计涨停30只、封板率约68%，另有14只盘中触及涨停；连板网等游资口径记为涨停28、跌停58，最高4板为盛剑科技、真视通。无论用哪一种口径，涨停都偏少、跌停都偏多。长鑫科技收创上市以来新低，市值冠军易主本身就是科技权重被改写。港股恒生指数跌1.89%报22410.80点，恒生科技跌3.78%，网易跌超17%，快手跌超11%，华虹宏力跌超10%，阿里巴巴则涨超3%，同样是结构分化。已核实：欢瑞世纪因2022年年报虚增利润，将于11月23日停牌、24日复牌并简称“ST欢瑞”。制约：局部题材（算力租赁、农业、机器人）仍有板，但那是退潮期的残存接力，不是市场广度修复。\n三、大宗商品和汇率同步提示：这不是经典的避险行情。已核实：中文行情常用口径下，COMEX黄金期货收报3539.00美元/盎司，跌3.98%，白银收报41.08美元、跌7.39%；道琼斯以11月交割的主力合约计，结算价3512.30美元，当日跌4.61%、当周跌9.47%，为2025年8月29日以来最低结算价。WTI\n12月合约结算83.98美元，涨0.77美元、约0.93%，与晚间邮件里的盘中价82.63美元不是同一个时点。日本10月核心CPI升至2.2%，加息预期升温。美元指数公开报价约103.9。黄金大跌、股市大跌同时出现，更像杠杆出清，而不是资金从股票有序搬到黄金。对A股黄金股、有色和外资流入都偏负面。欧股亦普跌，欧洲斯托克50收跌约2.8%，德国DAX跌约2.5%至2.6%，法国CAC40跌1.89%。邮件转述的铜价下跌、美债因避险走强、美元或连续第四周上涨，本档未全部核到精确收盘，只作为方向性转述。北向资金周五成交2384.70亿元，占两市成交约16.77%，具体净买入本档未见到交易所口径，不以净流入下结论。","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/cnfinancewatch/status/2123949597433417823","l":[],"ln":[],"t":["美联储","美股","A股港股","汇率","AI科技","黄金"],"lk":2,"rt":0,"rp":1,"vw":1757},{"id":"2123949175188725828","h":"cnfinancewatch","ts":1795223919,"zh":"下周一注意拉证券行业股救市的可能性：\n国内利率以稳为主，给高股息定价提供了政策背景。已核实：11月20日1年期LPR报3.0%、5年期以上报3.5%，连续第18个月不变；财政部称1至10月证券交易印花税2511亿元，同比增长54.1%。LPR持稳对银行净息差是中性偏稳的信号，与周五银行走强并不矛盾。印花税高增说明年内交投仍活跃，但那是1到10月的累计数，解释不了周五这种量增价跌。制约：稳息差不等于银行可以无限上涨；活跃度指标滞后，且与当日亏钱效应可以并存。","en":"下周一注意拉证券行业股救市的可能性：\n国内利率以稳为主，给高股息定价提供了政策背景。已核实：11月20日1年期LPR报3.0%、5年期以上报3.5%，连续第18个月不变；财政部称1至10月证券交易印花税2511亿元，同比增长54.1%。LPR持稳对银行净息差是中性偏稳的信号，与周五银行走强并不矛盾。印花税高增说明年内交投仍活跃，但那是1到10月的累计数，解释不了周五这种量增价跌。制约：稳息差不等于银行可以无限上涨；活跃度指标滞后，且与当日亏钱效应可以并存。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123949175188725828","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":1654},{"id":"2123948229113028633","h":"cnfinancewatch","ts":1795223693,"zh":"美国H-1B签证发放量一年减少约三分之一，IBM等企业削减外籍员工签证担保，美国科技人才开始逃离，高技能员工另寻出路。","en":"美国H-1B签证发放量一年减少约三分之一，IBM等企业削减外籍员工签证担保，美国科技人才开始逃离，高技能员工另寻出路。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123948229113028633","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1741},{"id":"2123947407696343377","h":"ShanghaoJin","ts":1795223497,"zh":"@rickawsb 我是多头！\nBubbles can go both ways—up and down.\nAnd it isn’t in AI, but in defensive sectors","en":"@rickawsb 我是多头！\nBubbles can go both ways—up and down.\nAnd it isn’t in AI, but in defensive sectors","zh_src":"native","lang":"en","m":[],"u":"https://x.com/ShanghaoJin/status/2123947407696343377","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":1,"rp":2,"vw":601},{"id":"2123946776164229283","h":"cnfinancewatch","ts":1795223347,"zh":"美国30年期国债收益率当日下跌10个基点至5.30%，5年期下跌15个基点至4.70%，2至7年期收益率日内下跌至少15个基点，美债五连涨，避险需求推动。\n20年期以上国债ETF（TLT）","en":"美国30年期国债收益率当日下跌10个基点至5.30%，5年期下跌15个基点至4.70%，2至7年期收益率日内下跌至少15个基点，美债五连涨，避险需求推动。\n20年期以上国债ETF（TLT）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123946776164229283","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":1,"vw":463},{"id":"2123946407912747362","h":"cnfinancewatch","ts":1795223259,"zh":"金价盘中巨震一度临近3500美元，金价创14个月新低，一日四家集中示警，工行招行等发布风险提 服务器供应商因美国限制暂停向东南亚发货\n随着各公司争相审查订单，担忧情绪在 AI 供应链中蔓延\n英伟达服务器供应商之一的一位高管表示，为遵守最新出口限制，其公司从周五起已停止向东南亚的所有发货，并补充说，公司目前也已暂停接收该地区新客户的新订单。\n这位高管说：“在向美国政府申请出口许可证之前，我们将不得不要求客户提供更多信息。我最担心的是，最终可能会有太多昂贵的 GPU 板卡积压在我们手中成为库存，这将给我们带来巨大的财务负担。”","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXnAeTOb0AAJidY.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123940704980549861","l":[],"ln":[],"t":["AI科技"],"lk":3,"rt":1,"rp":0,"vw":1278},{"id":"2123940614496752015","h":"fxtrader","ts":1795221878,"zh":"特朗普总统呼吁黄仁勋应该“做出重大道歉并回去”，并给他机会。\n“我认为如果这家公司聪明的话，他们会接纳这位杰出人士，接受他的道歉，让他回去工作。”“他做出了一些糟糕的决定，但他是一个才华横溢的人。”\n特朗普以马斯克为例，指出美国为什么需要保护最杰出的创新者。","en":"特朗普总统呼吁黄仁勋应该“做出重大道歉并回去”，并给他机会。\n“我认为如果这家公司聪明的话，他们会接纳这位杰出人士，接受他的道歉，让他回去工作。”“他做出了一些糟糕的决定，但他是一个才华横溢的人。”\n特朗普以马斯克为例，指出美国为什么需要保护最杰出的创新者。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123845363136393216/vid/avc1/1920x1080/2bImz328igGe5zKH.mp4?tag=29"],"u":"https://x.com/fxtrader/status/2123940614496752015","l":[],"ln":[],"t":[],"lk":29,"rt":4,"rp":18,"vw":10099},{"id":"2123939752265318763","h":"bboczeng","ts":1795221672,"zh":"他真的赢了。他胆子真的很大，我很佩服他\n虽然我知道会回调，我确实无法预测NVDA能在一周内跌这么多\n我还是靠抄底赚钱吧，做空的钱违背人性，我不赚","en":"他真的赢了。他胆子真的很大，我很佩服他\n虽然我知道会回调，我确实无法预测NVDA能在一周内跌这么多\n我还是靠抄底赚钱吧，做空的钱违背人性，我不赚","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123939752265318763","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":384},{"id":"2123939574695260438","h":"bboczeng","ts":1795221630,"zh":"“佩服”有什么用，希望你在推特上多支持我，\n在我和坏人撕逼，勇于和推特黑恶势力做对的时候，\n多给我点赞\n谢谢\n😅😅😅😅","en":"“佩服”有什么用，希望你在推特上多支持我，\n在我和坏人撕逼，勇于和推特黑恶势力做对的时候，\n多给我点赞\n谢谢\n😅😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123939574695260438","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":1,"vw":331},{"id":"2123938976390369434","h":"hanking66","ts":1795221487,"zh":"请欣赏下我的每日雷霆发言😅我说真的，我并没有很焦虑，我感觉因为加息，半导体被打压，很正常。反正我不会卖的，就拿着呗…现在拿着就等于 5 字头买入美光，想想感觉还挺不错的…\n我说我长期持有是真的长期持有，你们做不到的😅\nBuy the dip，长期持有，Discord在个人资料。","en":"请欣赏下我的每日雷霆发言😅我说真的，我并没有很焦虑，我感觉因为加息，半导体被打压，很正常。反正我不会卖的，就拿着呗…现在拿着就等于 5 字头买入美光，想想感觉还挺不错的…\n我说我长期持有是真的长期持有，你们做不到的😅\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXm_PXebUAAtrHu.jpg?name=orig"],"u":"https://x.com/hanking66/status/2123938976390369434","l":[],"ln":[],"t":["美联储","AI科技"],"lk":1,"rt":0,"rp":1,"vw":653},{"id":"2123937835380293996","h":"fxtrader","ts":1795221215,"zh":"财政部：前10个月个人所得税增长22.9%，其中10月份增长89.6%，主要是加强离岸信托个人所得税征管等因素带动。","en":"财政部：前10个月个人所得税增长22.9%，其中10月份增长89.6%，主要是加强离岸信托个人所得税征管等因素带动。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123937835380293996","l":[],"ln":[],"t":["汇率"],"lk":9,"rt":0,"rp":1,"vw":2115},{"id":"2123936681384681493","h":"dmjk001","ts":1795220940,"zh":"路透：特朗普周五表示，美国只希望向中国出售较旧的芯片，并补充说他的政府正在与中国讨论一项协议，但没有提供更多细节。\n“我们只想要较旧的芯片，一片都不卖也没关系。但只能是较旧的。你们必须明白，中国也制造芯片，如果我们不卖给他们，他们就会自己制造。”他在亚洲之行后的一场新闻发布会上对记者说。","en":"路透：特朗普周五表示，美国只希望向中国出售较旧的芯片，并补充说他的政府正在与中国讨论一项协议，但没有提供更多细节。\n“我们只想要较旧的芯片，一片都不卖也没关系。但只能是较旧的。你们必须明白，中国也制造芯片，如果我们不卖给他们，他们就会自己制造。”他在亚洲之行后的一场新闻发布会上对记者说。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXm9CVNaIAAPx8k.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123936681384681493","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":677},{"id":"2123936452178509942","h":"dmjk001","ts":1795220885,"zh":"路透：美国联邦通信委员会周五表示，2026年已批准71家公司继续进口无人机、无线路由器、机器人和电源逆变器，这些产品原本将根据美国国家安全限制被禁止进口。","en":"路透：美国联邦通信委员会周五表示，2026年已批准71家公司继续进口无人机、无线路由器、机器人和电源逆变器，这些产品原本将根据美国国家安全限制被禁止进口。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXm85Q-aQAAsdHu.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123936452178509942","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":0,"vw":840},{"id":"2123935648260440067","h":"dmjk001","ts":1795220694,"zh":"彭博：特朗普威胁对在海外建设数据中心的企业征税\n特朗普誓言要对在其他国家建设数据中心的美国公司征税，但他没有详细说明这一威胁将如何实施，以及政府可能拥有何种法律权力来征收此类税。\n如果美国公司想在海外建设数据中心，“他们可以，”特朗普周五在白宫新闻发布会上表示。“但我们将对他们征收巨额税款。如果他们这样做，我们希望他们在这里建设。”\n特朗普特别点名谷歌，批评其投资芬兰的数据中心业务，而不是将这笔钱花在美国。","en":"彭博：特朗普威胁对在海外建设数据中心的企业征税\n特朗普誓言要对在其他国家建设数据中心的美国公司征税，但他没有详细说明这一威胁将如何实施，以及政府可能拥有何种法律权力来征收此类税。\n如果美国公司想在海外建设数据中心，“他们可以，”特朗普周五在白宫新闻发布会上表示。“但我们将对他们征收巨额税款。如果他们这样做，我们希望他们在这里建设。”\n特朗普特别点名谷歌，批评其投资芬兰的数据中心业务，而不是将这笔钱花在美国。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXm79bNagAA43dK.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123935648260440067","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":0,"vw":868},{"id":"2123934527878005071","h":"dmjk001","ts":1795220426,"zh":"高盛称股市抛售仍有后劲，恐慌指数接近峰值\n高盛集团的恐慌指标周五接近最高水平，美国股市大跌，预示着未来一周将出现又一轮大规模抛售。\n该银行的模型预测，在股市持平的情况下，CTA 可能再抛售 658 亿美元；若股市上涨，抛售规模为 286 亿美元；若股市继续下跌，抛售规模可能高达 806 亿美元。\n投资者越来越质疑，在人工智能基础设施、芯片和算力上的巨额支出能否产生足够的回报，以支撑整个行业的估值。","en":"高盛称股市抛售仍有后劲，恐慌指数接近峰值\n高盛集团的恐慌指标周五接近最高水平，美国股市大跌，预示着未来一周将出现又一轮大规模抛售。\n该银行的模型预测，在股市持平的情况下，CTA 可能再抛售 658 亿美元；若股市上涨，抛售规模为 286 亿美元；若股市继续下跌，抛售规模可能高达 806 亿美元。\n投资者越来越质疑，在人工智能基础设施、芯片和算力上的巨额支出能否产生足够的回报，以支撑整个行业的估值。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXm7HncbIAEL1Ac.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2123934527878005071","l":[],"ln":[],"t":["AI科技"],"lk":7,"rt":3,"rp":0,"vw":1111},{"id":"2123934325485830229","h":"darrencao2024","ts":1795220378,"zh":"本周VIX收在36，纳斯达克波动率指数VXN更是冲到45以上。VIX到这个级别，过去20年只在几次极端恐慌时出现过：2008年金融危机、2020年疫情、2025年关税战……每一次大家都觉得“这次不一样”，但每一次之后，标普都迎来了反弹，并且不断创出历史新高。\n标普大盘平均每年都要经历一次10%以上的回调，有意思的是今年其实一直没有跌破，直到今天才正式跌破10%。对于长期投资来说，这样的回调就是你在市场里要交的税，是无法避免的。这几周世界上最大的公司英伟达跌掉了一半市值，各大龙头公司，成长型公司都在下跌，大家的账户在下跌，我的账户也在下跌。如果你决定投资美股，这样的下跌应该早在预料之中，我们不知道它何时到来，要在开始前就要做好它随时会来的准备。而且我们之后的美股投资，还会不断遇到类似的回撤。所以接受它，抽离它，别让它毁掉你的周末，别让它影响你的日常生活。\n今年标普基本打平，纳指甚至已经转负，很多会员朋友的账户一年白干，这都很正常，美股不可能一路上涨不回调。但请记住，这些都只是浮盈浮亏，只是一个数字。反过来想：如果今年账户翻倍了，你会辞职吗？会把钱全取出来花掉吗？大概率不会，还是会继续拿着。涨跌在你真正取出来之前，都只是数字。\n我一直强调一个前提：不要用短期内要用的钱投资。如果你现在焦虑到睡不着，先问问自己有没有守住这个前提。\n这个周末，建议大家把手里的股票过一遍：是不是好公司？你对它还有没有信心？现在的价格是不是够便宜，是不是你之前心里想过“要是跌到这里就好了”的价格？如果是，拿住就好。如果拿不住，说明你对这家公司本来就没什么信心，不如趁低位换仓，或者换成大盘指数。如果对大盘也没信心，那就换成现金，但要清楚，现金长期注定跑不赢通胀，拉长看一定是亏的。\n如果手里有闲钱，恐慌的时候更要挑确定性最强的标的分批加仓，比如标普、纳指这样的指数，或者Mag 7这些现金流最强的龙头。不要去碰明天就可能归零的期权，也不要因为觉得已经够低了就盲目上杠杆。\n市场不会一直跌，恐慌也不会一直持续。保持冷静，保持乐观，继续向前。","en":"  a growth model known as circular financing. Jensen Huang was central to that model’s credibility. He spearheaded $500 billion in partnership agreements for Nvidia, and his personal reputation gave investors confidence that those deals would deliver.\nHis sudden departure forced markets to ask a hard question. Without Huang coordinating the deals, can a network so dependent on mutual trust and near-flawless execution still deliver on its promises? A slowdown in financing or purchasing at just one link in the chain could trigger a domino effect, tightening credit across the AI industry.\nAt today’s White House press conference, flanked by JD Vance and Marco Rubio, Trump said America must protect its smartest people, including Jensen Huang. Rubio has gone quiet, and Scott Bessent seems to be keeping a low profile. Both reportedly pushed for Huang’s ouster.\nBrandLLM, part of estimates that their actions and coverage by The New York Times, the Financial Times, and The Economist have cut Huang’s personal brand equity in half. Even if he returned as Nvidia CEO today, he could only slow the collapse of the AI bubble. Nvidia and Jensen Huang are destined to become a case study in brand marketing textbooks.","zh_src":"bing","lang":"en","m":["https://video.twimg.com/amplify_video/2123921792506920960/vid/avc1/1320x642/tB4XAb2RH64zLnYQ.mp4?tag=29"],"u":"https://x.com/Brand/status/2123921972522348595","l":["Brand.com"],"ln":[{"u":"http://Brand.com","d":"Brand.com"}],"t":["AI科技"],"lk":8,"rt":3,"rp":1,"vw":1671},{"id":"2123921851776905637","h":"hanking66","ts":1795217404,"zh":"我接受啊，我很能接受，有啥不能接受的，疫情和 22 年加息我都走过来了，这有啥不能接受的😅就是因为能接受所以选择长期持有，因为最后都是会回去的","en":"我接受啊，我很能接受，有啥不能接受的，疫情和 22 年加息我都走过来了，这有啥不能接受的😅就是因为能接受所以选择长期持有，因为最后都是会回去的","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2123921851776905637","l":[],"ln":[],"t":["美联储"],"lk":3,"rt":1,"rp":1,"vw":849},{"id":"2123919536445640914","h":"qinbafrank","ts":1795216852,"zh":"月初献祭了一批机构，昨晚美股这走势是不是又献祭一大批？这两天看看有没有相关信息 1,"vw":408},{"id":"2123908570773348859","h":"bboczeng","ts":1795214238,"zh":"搞笑\n政治美联储的政治目的是什么？拜登？\n😅😅😅","en":"Funny\nwhat the political Fed was political about? Biden?\n😅😅😅","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/bboczeng/status/2123908570773348859","l":[],"ln":[],"t":["美联储"],"lk":1,"rt":0,"rp":1,"vw":377},{"id":"2123906896981836074","h":"Balder13946731","ts":1795213839,"zh":"【美股复盘 · 11月20日】\n大市\n美股三大指数全线大跌，科技股领跌。纳指(QQQ)收于 609.88，跌 5.45%。标普(SPY)收于 690.87，跌 3.49%。道指(DIA)收于 481.21，跌 1.95%。罗素小型股(IWM)收于 257.04，跌 2.72%。市宽明显走弱，107 只观察股中仅 15 只上涨，92 只下跌。资金集中流向反向杠杆产品。半导体三倍做空的 $SOXS 涨 31.83%，纳指三倍做空的 SQQQ 涨 16.49%，标普三倍做空的 SPXU 涨 10.64%。\n板块\n抛压集中在 AI 产业链，从芯片设计、存储、光通信一直到算力基础设施。存储方向，SNDK 跌 16.03%，MU 跌 13.86%。芯片与互连方向，ARM 跌 14.11%，CRDO 跌 15.19%，AAOI 跌 16.50%。半导体测试设备股 AEHR 跌 16.90%。算力云与数据中心相关个股跌幅居前，IREN 跌 18.01%，为观察池内跌幅最大，NBIS 跌 16.07%。数据中心供电概念的 BE 跌 15.26%。防御板块逆势上涨。UNH 涨 2.85%，领涨观察池内个股。零售股中，WMT 涨 1.61%，COST 涨 0.96%，LOW 涨 0.78%，HD 涨 0.72%。能源股 CVX 涨 0.91%，医药股 MRK 涨 0.69%。\n焦点\nNVDA 收跌 13.80%，是今日 AI 板块抛售的核心。公司管理层仍不稳定。黄仁勋已于 11 月 12 日辞去 CEO，现由原 CFO Colette Kress 担任临时 CEO。据 WSJ 报道，特朗普表示希望黄仁勋回归。董事会主席 Harvey Jones 此前已表态接受辞职，无意让其回归。市场还流传 SEC 正在调查英伟达会计处理的消息，目前仍属传闻，尚未得到证实。对华出口方面，媒体报道显示，过去半年美国政府持续批准英伟达和 AMD 的 AI 芯片对华出口许可，出口管制政策与实际执行之间的差异再次受到关注。今日资料中没有财报相关信息，上述事件均不能直接认定为今日下跌的主因。\n小结\n今日市场呈现典型的避险格局。纳指跌幅超过标普和道指，成长股与 AI 链遭到集中抛售。资金转向反向杠杆产品以及医疗、必需消费、零售和能源等防御板块。NVDA 的管理层变动与监管传闻仍未平息，AI 板块短期能否企稳，取决于这两方面的消息能否落地。","en":"【美股复盘 · 11月20日】\n大市\n美股三大指数全线大跌，科技股领跌。纳指(QQQ)收于 609.88，跌 5.45%。标普(SPY)收于 690.87，跌 3.49%。道指(DIA)收于 481.21，跌 1.95%。罗素小型股(IWM)收于 257.04，跌 2.72%。市宽明显走弱，107 只观察股中仅 15 只上涨，92 只下跌。资金集中流向反向杠杆产品。半导体三倍做空的 $SOXS 涨 31.83%，纳指三倍做空的 SQQQ 涨 16.49%，标普三倍做空的 SPXU 涨 10.64%。\n板块\n抛压集中在 AI 产业链，从芯片设计、存储、光通信一直到算力基础设施。存储方向，SNDK 跌 16.03%，MU 跌 13.86%。芯片与互连方向，ARM 跌 14.11%，CRDO 跌 15.19%，AAOI 跌 16.50%。半导体测试设备股 AEHR 跌 16.90%。算力云与数据中心相关个股跌幅居前，IREN 跌 18.01%，为观察池内跌幅最大，NBIS 跌 16.07%。数据中心供电概念的 BE 跌 15.26%。防御板块逆势上涨。UNH 涨 2.85%，领涨观察池内个股。零售股中，WMT 涨 1.61%，COST 涨 0.96%，LOW 涨 0.78%，HD 涨 0.72%。能源股 CVX 涨 0.91%，医药股 MRK 涨 0.69%。\n焦点\nNVDA 收跌 13.80%，是今日 AI 板块抛售的核心。公司管理层仍不稳定。黄仁勋已于 11 月 12 日辞去 CEO，现由原 CFO Colette Kress 担任临时 CEO。据 WSJ 报道，特朗普表示希望黄仁勋回归。董事会主席 Harvey Jones 此前已表态接受辞职，无意让其回归。市场还流传 SEC 正在调查英伟达会计处理的消息，目前仍属传闻，尚未得到证实。对华出口方面，媒体报道显示，过去半年美国政府持续批准英伟达和 AMD 的 AI 芯片对华出口许可，出口管制政策与实际执行之间的差异再次受到关注。今日资料中没有财报相关信息，上述事件均不能直接认定为今日下跌的主因。\n小结\n今日市场呈现典型的避险格局。纳指跌幅超过标普和道指，成长股与 AI 链遭到集中抛售。资金转向反向杠杆产品以及医疗、必需消费、零售和能源等防御板块。NVDA 的管理层变动与监管传闻仍未平息，AI 板块短期能否企稳，取决于这两方面的消息能否落地。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123906896981836074","l":[],"ln":[],"t":["美股","AI科技","财报","关税贸易"],"lk":0,"rt":0,"rp":0,"vw":830},{"id":"2123903898394009923","h":"FinWorld","ts":1795213124,"zh":"美股到达极度恐慌！CNN恐惧与贪婪指数跌至极度恐慌区间，科技股持续承压。市场越恐慌，越值得研究哪些股票已经跌出了估值吸引力。来看看美国半导体ETF $SMH 的25只成分股，估值差距相当惊人：美光远期PE仅4.0倍，SK海力士4.3倍，英伟达11.0倍，台积电17.0倍，高通17.2倍，博通19.6倍。另一边，英特尔37.4倍，AMD38.8倍，ARM更是高达79.4倍。\n最值得关注的是英伟达。作为AI算力产业的重要受益者，它的远期PE只有AMD的约28%，比台积电、博通都低。当然，存储芯片公司的超低PE也有原因：行业正处于盈利周期，市场担心未来高利润难以维持。如果准备趁着恐慌布局半导体，重点可以放在英伟达、美光、SK海力士和台积电。英伟达看AI求和盈利增长能否兑现，美光和海力士看存储价格与利润周期，台积电看先进制程产能和定价能力。","en":"美股到达极度恐慌！CNN恐惧与贪婪指数跌至极度恐慌区间，科技股持续承压。市场越恐慌，越值得研究哪些股票已经跌出了估值吸引力。来看看美国半导体ETF $SMH 的25只成分股，估值差距相当惊人：美光远期PE仅4.0倍，SK海力士4.3倍，英伟达11.0倍，台积电17.0倍，高通17.2倍，博通19.6倍。另一边，英特尔37.4倍，AMD38.8倍，ARM更是高达79.4倍。\n最值得关注的是英伟达。作为AI算力产业的重要受益者，它的远期PE只有AMD的约28%，比台积电、博通都低。当然，存储芯片公司的超低PE也有原因：行业正处于盈利周期，市场担心未来高利润难以维持。如果准备趁着恐慌布局半导体，重点可以放在英伟达、美光、SK海力士和台积电。英伟达看AI求和盈利增长能否兑现，美光和海力士看存储价格与利润周期，台积电看先进制程产能和定价能力。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXmfDNuXsAA7R5W.jpg?name=orig"],"u":"https://x.com/FinWorld/status/2123903898394009923","l":[],"ln":[],"t":["美股","AI科技"],"lk":48,"rt":20,"rp":8,"vw":15169},{"id":"2123902916671295887","h":"tychozzz","ts":1795212890,"zh":"纳斯达克 100 指数这周收盘，暴跌 10.5%。\n这是 2020 年 3 月疫情以来，单周最大的跌幅。\n但大跌并不是割肉的好时机，如果大跌割肉，那么大涨也会追涨，盈亏同源...","en":"纳斯达克 100 指数这周收盘，暴跌 10.5%。\n这是 2020 年 3 月疫情以来，单周最大的跌幅。\n但大跌并不是割肉的好时机，如果大跌割肉，那么大涨也会追涨，盈亏同源...","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tychozzz/status/21239029166712 技"],"lk":3,"rt":0,"rp":0,"vw":599},{"id":"2123884437045760420","h":"Oracle","ts":1795208484,"zh":"甲骨文已经获得我们履行与OpenAI合同所需的所有资金。随着本月初的最终资本筹集，我们成为首个在本轮投资周期中获得全额资金的超大规模云服务提供商。我们在甲骨文投资者日上概述的融资计划，包括供应商融资，已经到位。与供应商的任何进一步私人讨论只是额外的选择。我们履行OpenAI合同的能力不依赖于这些讨论。任何媒体报道如果说相反的情况都是不正确的。甲骨文和OpenAI在我们的基础设施合作伙伴关系上正在快速推进。我们的Abilene园区，Astra-6训练的地点，几乎已经完成。Shackelford，我们下一个吉瓦级园区，已完全获批。NVIDIA Vera Rubin机架在其数据中心的交付工作预计将在未来几周按计划进行。我们继续预计在2028财年的下半年将实现正的自由现金流。我们计划在2029财年实现超过300亿美元的自由现金流，并预计从那一年开始自筹资金支持未来增长。","en":"Oracle has secured all the funding we need to fulfill our contract with OpenAI. With our final capital raise earlier this month, we became the first hyperscaler fully funded for this investment cycle. The financing we outlined at Oracle Investor Day, including vendor financing, is in place. Any further private discussions with vendors are just additional options. Our ability to deliver on our OpenAI contract does not depend on those discussions. Any media reports that will come out and say the contrary are incorrect and wrong.\nOracle and OpenAI are making rapid progress on our infrastructure partnership. Our Abilene campus, where Astra-6 was trained, is nearly complete. Shackelford, our next gigawatt-scale campus, is fully permitted. The handover of NVIDIA Vera Rubin racks in its data halls is on track for the coming weeks.\nWe continue to expect positive free cash flow in the second half of FY2028. We are targeting more than $30 billion in free cash flow in FY2029 and expect to self-fund future growth beginning that year.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/Oracle/status/2123884437045760420","l":[],"ln":[],"t":["AI科技"],"lk":1149,"rt":121,"rp":117,"vw":135849},{"id":"2123883808445612356","h":"Balder13946731","ts":1795208334,"zh":"扫一波 $NQ 的期货🫪 这个RSI的胜率很高，期权在这个波动率下已经不合适了。RSI回到30以上跑路。","en":"扫一波 $NQ 的期货🫪 这个RSI的胜率很高，期权在这个波动率下已经不合适了。RSI回到30以上跑路。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123883808445612356","l":[],"ln":[],"t":[],"lk 错的时候\n你唱多的时候是个什么态度，你心里没数吗？\n吹牛逼说自己能看到牌，吹牛逼说自己有内幕消息\n别人看空就疯狂嘲讽，吊起来打，说是弱者心态，是loser\n你自己什么狂妄态度和小人嘴脸，你真的以为大家看完你这些小说都忘记了吗？\n你真不知道自己应该为谁道歉，为什么要道歉？\n😅😅😅","en":"唱多五个月，今天美股崩了\n网友：你能认个错吗？\nHerman Jin be like: 他人品不好，我对他有恩\n网友：认个错就好了，一切都过去了\nHerman Jin：他人品不好，想送我去断头台\n网友：…\n请问我人品哪里不好了\n就因为我也让你认错了吗？\n什么叫人都有看错的时候\n你唱多的时候是个什么态度，你心里没数吗？\n吹牛逼说自己能看到牌，吹牛逼说自己有内幕消息\n别人看空就疯狂嘲讽，吊起来打，说是弱者心态，是loser\n你自己什么狂妄态度和小人嘴脸，你真的以为大家看完你这些小说都忘记了吗？\n你真不知道自己应该为谁道歉，为什么要道歉？\n😅😅😅","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123878086798377194","l":[],"ln":[],"t":["美股"],"lk":1,"rt":0,"rp":1,"vw":592},{"id":"2123877639001956487","h":"cnfinancewatch","ts":1795206863,"zh":"你这篇帖子里的核心数据基本都能对上，但把“Anthropic IPO 抽走流动性”当作解释这轮下跌的单一主线，在因果逻辑上跳过了一个关键环节。\n哪些数据是真的\n你列出的数字，大部分有据可查：\nAnthropic IPO 813亿美元：属实。发行价83美元/股，发行约9.8亿股，公开发行募资约813亿美元，叠加260亿美元私募配售，总规模逾1000亿美元，超过SpaceX成为史上最大IPO。首日收涨约17%，报97.17美元。\n标普500连跌6天、6万亿美元蒸发：属实。连跌6个交易日，创2024年4月以来最长连跌；自10月6日高点以来市值蒸发约6万亿美元；当日跌2%，较历史高点回撤8.2%。\n美联储12月加息概率96%左右：属实，且在上周持续上修。CME FedWatch在11月18日显示12月加息25bp概率为96.8%，此前一周还在95%上下波动。\n融资余额数据方向正确，但峰值口径有偏差：你写“10月为1.44万亿，比6月峰值低540亿”。FINRA数据显示10月保证金债务为1.45万亿美元，较9月的1.48万亿下降约2.1%；6月峰值是1.50万亿，当前距峰值约3.6%（约540亿）。数字基本对得上，只是“1.44”与1.45的细微差异可能来自不同统计口径。\n英伟达连跌6日、AMD遭做空跌7.7%：属实。英伟达连续6个交易日下跌，期间市值蒸发约4871亿美元；AMD因Hunterbrook做空报告跌7.72%，报告指其采用与英伟达类似的“循环交易”模式。\n因果逻辑的裂缝：“抽血说”解释不了同一天的所有事\n你的叙事链条是：巨型IPO抽走流动性 → 资金被迫从现有持仓中撤出 → 价格跟着抛售走，而不是跟着利润走。\n这个机制部分成立：有市场观点指出，投资者为认购Anthropic，确实抛售了黄金、铜、加密货币以及英伟达等“AI代理资产”；标普500当日蒸发的市值（约1.3万亿美元）与IPO募资规模在量级上“高度吻合”；三大指数恰在Anthropic开始交易的那一刻跌至日内低点。Swissquote分析师也事前提醒过，买入Anthropic的钱可能来自抛售科技股。\n但同一天有一个反例，“抽血说”解释不了：纳斯达克中国金龙指数当日仅跌1.86%，拼多多涨11%，京东涨2.9%，富途涨4.8%。如果真的是无差别的流动性抽水，这些流动性最脆弱的资产没有理由逆势收高。更合理的解读是：钱不是消失了，是换了地方——从AI/科技仓位向IPO和个别非美资产转移，而不是从整个市场中“蒸发”。\n这意味着，“6万亿美元蒸发”和“813亿IPO抽血”之间，量级上存在两个数量级的差距。IPO抽走的是认购资金层面的流动性，而6万亿市值蒸发是估值重定价的结果，两者不是同一层面的因果关系。把后者完全归因于前者，是用一个局部事件解释一个全局现象。\n这轮下跌更接近“多重压力同时兑现”，而非单一“失血”\n你列出的每一条利空——加息预期、融资余额收缩、英伟达/AMD被做空、AI资本开支叙事松动——单独看都是真实压力，但把它们全部串到IPO这一根线上，反而削弱了解释力。\n更贴近盘面的框架是：利率预期骤变（12月加息几乎板上钉钉）→ 高久期资产（AI/科技）估值承压 → 巨型IPO恰好在这个节点抽走边际买盘 → 做空报告成为压垮芯片情绪的触发器。IPO是催化剂之一，不是唯一的“抽水机”。你自己也写了“一美元，4个去处”，但如果是四个去处同时作用，就不能把其中一个去处（IPO）当作“解释一切的指标”。\n“Anthropic IPO抽干标普500”这个单因果叙事，把一场多因素同时兑现的重定价，压缩成了一个过于整洁的故事。 盯住7037点作为修正观察位是合理的，但把它归因于某一件事情的“必然结果”，会低估后续变量（加息落地后的反应、11月融资余额数据、AI监管的实际力度）对路径的改写能力。","en":"你这篇帖子里的核心数据基本都能对上，但把“Anthropic IPO 抽走流动性”当作解释这轮下跌的单一主线，在因果逻辑上跳过了一个关键环节。\n哪些数据是真的\n你列出的数字，大部分有据可查：\nAnthropic IPO 813亿美元：属实。发行价83美元/股，发行约9.8亿股，公开发行募资约813亿美元，叠加260亿美元私募配售，总规模逾1000亿美元，超过SpaceX成为史上最大IPO。首日收涨约17%，报97.17美元。\n标普500连跌6天、6万亿美元蒸发：属实。连跌6个交易日，创2024年4月以来最长连跌；自10月6日高点以来市值蒸发约6万亿美元；当日跌2%，较历史高点回撤8.2%。\n美联储12月加息概率96%左右：属实，且在上周持续上修。CME FedWatch在11月18日显示12月加息25bp概率为96.8%，此前一周还在95%上下波动。\n融资余额数据方向正确，但峰值口径有偏差：你写“10月为1.44万亿，比6月峰值低540亿”。FINRA数据显示10月保证金债务为1.45万亿美元，较9月的1.48万亿下降约2.1%；6月峰值是1.50万亿，当前距峰值约3.6%（约540亿）。数字基本对得上，只是“1.44”与1.45的细微差异可能来自不同统计口径。\n英伟达连跌6日、AMD遭做空跌7.7%：属实。英伟达连续6个交易日下跌，期间市值蒸发约4871亿美元；AMD因Hunterbrook做空报告跌7.72%，报告指其采用与英伟达类似的“循环交易”模式。\n因果逻辑的裂缝：“抽血说”解释不了同一天的所有事\n你的叙事链条是：巨型IPO抽走流动性 → 资金被迫从现有持仓中撤出 → 价格跟着抛售走，而不是跟着利润走。\n这个机制部分成立：有市场观点指出，投资者为认购Anthropic，确实抛售了黄金、铜、加密货币以及英伟达等“AI代理资产”；标普500当日蒸发的市值（约1.3万亿美元）与IPO募资规模在量级上“高度吻合”；三大指数恰在Anthropic开始交易的那一刻跌至日内低点。Swissquote分析师也事前提醒过，买入Anthropic的钱可能来自抛售科技股。\n但同一天有一个反例，“抽血说”解释不了：纳斯达克中国金龙指数当日仅跌1.86%，拼多多涨11%，京东涨2.9%，富途涨4.8%。如果真的是无差别的流动性抽水，这些流动性最脆弱的资产没有理由逆势收高。更合理的解读是：钱不是消失了，是换了地方——从AI/科技仓位向IPO和个别非美资产转移，而不是从整个市场中“蒸发”。\n这意味着，“6万亿美元蒸发”和“813亿IPO抽血”之间，量级上存在两个数量级的差距。IPO抽走的是认购资金层面的流动性，而6万亿市值蒸发是估值重定价的结果，两者不是同一层面的因果关系。把后者完全归因于前者，是用一个局部事件解释一个全局现象。\n这轮下跌更接近“多重压力同时兑现”，而非单一“失血”\n你列出的每一条利空——加息预期、融资余额收缩、英伟达/AMD被做空、AI资本开支叙事松动——单独看都是真实压力，但把它们全部串到IPO这一根线上，反而削弱了解释力。\n更贴近盘面的框架是：利率预期骤变（12月加息几乎板上钉钉）→ 高久期资产（AI/科技）估值承压 → 巨型IPO恰好在这个节点抽走边际买盘 → 做空报告成为压垮芯片情绪的触发器。IPO是催化剂之一，不是唯一的“抽水机”。你自己也写了“一美元，4个去处”，但如果是四个去处同时作用，就不能把其中一个去处（IPO）当作“解释一切的指标”。\n“Anthropic IPO抽干标普500”这个单因果叙事，把一场多因素同时兑现的重定价，压缩成了一个过于整洁的故事。 盯住7037点作为修正观察位是合理的，但把它归因于某一件事情的“必然结果”，会低估后续变量（加息落地后的反应、11月融资余额数据、AI监管的实际力度）对路径的改写能力。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123877639001956487","l":[],"ln":[],"t":["美联储","美股","AI科技","黄金"],"lk":0,"rt":0,"rp":2,"vw":627},{"id":"2123877598505922980","h":"TheMarketMemo","ts":1795206853,"zh":"VIX 指數已回補了這三個缺口‼️","en":"VIX 指數已回補了這三個缺口‼️","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TheMarketMemo/status/2123877598505922980","l":[],"ln":[],"t":[],"lk":49,"rt":4,"rp":14,"vw":4211},{"id":"2123876426306953554","h":"cnfinancewatch","ts":1795206574,"zh":"你帖子里的价格事实基本成立，但“历史模式”和“6400-6600 必反弹”这两层叙事，需要拆开来看。\n哪些是事实，哪些是叙事\n标普500确实在2026年10月6日触及约 7,819-7,844点的纪录高位，与你说的“7800点顶部”吻合。11月初的暴跌也真实发生，11月5日单日跌4.36%，收于7353点；到11月20日前后，指数进一步滑向7000点附近，较高点回撤约 10.8%，正好踩在你说的“技术性调整”门槛上。\n但你列举的“2020→2022→2024→2026每两年回归一次”模式，是一种选择性拟合。2020年的暴跌是疫情全球流动性危机，2022年是通胀+美联储暴力加息，2025年的调整则与贸易冲突相关。它们的驱动机制完全不同，只是事后被“回撤至某个长期支撑位”的共性串在一起。把2026年放进这个序列，逻辑上成立，但因果上并不构成“规律”。\n本轮下跌的真正驱动：不止是“估值回归”\n用户帖子给人一种“周期到点、自然回落”的观感，但市场不是在真空中重平衡的。这一轮下跌有三条更具体的线索：\n① 中期选举后的AI监管冲击。 民主党控制参众两院后，释放了暂停先进AI开发、监管数据中心建设的信号。科技板块以7.3%的跌幅领跌，英伟达单日跌7.3%，美光、AMD跌幅超14%。这是政治事件驱动的风险偏好骤变，而不是估值钟摆的自然摆动。\n② AI资本开支叙事的重估。 市场此前给AI供应链的估值，隐含的是“资本开支无限扩张”的假设。当监管不确定性和融资成本上升同时施压，投资者开始对“更长的扩建期”重新定价，高估值的强周期AI板块首当其冲。\n③ 利率预期的再次上修。 美联储会议纪要显示官员倾向继续加息，10年期美债收益率被推升至5%以上，高盛策略团队在11月19日的报告中仍将5.11%作为起点。对于资本开支大、回报周期长的AI资产，贴现率上行直接压缩估值空间，这和“两年周期”无关，是贴现率变化的机械效应。\n6400-6600：技术上有依据，但“第一目标”不等于“必反弹”\n你给出的6400-6600区间，在技术分析层面确实有支撑依据：6440点附近是2026年3月曾止住下跌的强支撑，同时也是8月以来上升浪的61.8%斐波那契回撤位；6350点附近则是更受关注的0.5回撤位。\n但问题在于，“价格到达支撑位”和“价格会从那里反弹”是两件事。 BTIG在11月中旬的判断是：7250-7350支撑已被第五次测试，买盘正在耗尽，目标下看7000-7100，而不是在6400提前止跌。美银的哈特内特虽然认为“跌破7000点若避免衰退则是买入机会”，但他同时警告硬着陆风险被市场低估，只有3%的受访基金经理预期衰退。换句话说，6400-6600要成为有效反弹起点，需要一个前提：经济不滑入硬着陆，且美联储的加息路径不进一步超预期收紧。 这个前提目前并未被市场充分定价。\n机构判断的分化，本身就说明“单一路径”不可靠\n就在指数跌至7000点附近的同时：高盛给出12个月目标 8700点（较当前约19%上行），Seaport将2026年底目标从8200下调至7700，但仍预计2027年底回升至8400。这种分歧恰恰说明，当前市场不是一条已经被历史模式“锁定”的下跌轨道。AI监管的落地力度、美联储是否在12月继续加息、以及企业盈利预期是否被系统性下修，才是决定6400是“第一目标”还是“终点附近”的变量。\n一句话总结：你的价格观察和技术位判断有事实基础，但“每两年重平衡”的框架掩盖了本轮下跌的政治与利率特殊性，而6400-6600作为支撑区域的有效性，取决于它到达时的宏观条件，而不是周期本身。","en":"你帖子里的价格事实基本成立，但“历史模式”和“6400-6600 必反弹”这两层叙事，需要拆开来看。\n哪些是事实，哪些是叙事\n标 1169703","l":[],"ln":[],"t":["美股"],"lk":35,"rt":1,"rp":2,"vw":2741},{"id":"2123842416457474422","h":"tig88411109","ts":1795198465,"zh":"标普和道指从高点回落10%进入修正区间，纳指抹去全年涨幅。\n这轮科技股的崩盘到底该怎么理解？是AI叙事彻底证伪了，还是又一次惨烈的筹码清洗？\n如何解读和投资策略？这不是基本面坍塌，而是一场罕见的完美风暴叠加拥挤交易的流动性挤兑。\n周报策略中提到满城剑影。第一重就是，政策与监管的双重逆风。\n中选民主党席卷两会，市场开始提前定价“反AI/反数据中心”的政策风险。叠加中国相关的监管阴云蔓延至整个半导体与存储链条\n第二重就是信仰锚点的突然松动。作为AI革命的旗手，英伟达老黄遭遇危机，市场最核心的叙事支柱出现裂痕，恐慌情绪被瞬间放大。\n第三重就是脆弱流动性抽血与拥挤踩踏，最致命的一击。\n通胀粘性叠加美联储鹰派表态，金融条件再度收紧。而Anthropic IPO虽大获成功，却在边际上抽走了场内其他科技股的流动性。\n结果就是机构杠杆平仓剧痛、净值回撤、承接弹药被彻底锁死，几轮本该“出清”的事件，叠加量化趋势和杠杆基金，直接演变成了多杀多的连锁踩踏，被动降仓、多杀多、越跌越砍。\n这是一次典型的流动性冲击与拥挤挤兑，而不是产业周期的终结。 4万亿美元的AI基建周期推动40万亿知识性工作商品化，医疗医药/机器人自动化，依然在全速推进。\n这场技术革命，不过刚刚行至半途，看多科技股到2027年的核心逻辑，岿然不动。但看对不等于做对，长期趋势不等于短期无恙，颗粒度更细的投资策略和仓位管理订阅者分享。","en":"标普和道指从高点回落10%进入修正区间，纳指抹去全年涨幅。\n这轮科技股的崩盘到底该怎么理解？是AI叙事彻底证伪了，还是又一次惨烈的筹码清洗？\n如何解读和投资策略？这不是基本面坍塌，而是一场罕见的完美风暴叠加拥挤交易的流动性挤兑。\n周报策略中提到满城剑影。第一重就是，政策与监管的双重逆风。\n中选民主党席卷两会，市场开始提前定价“反AI/反数据中心”的政策风险。叠加中国相关的监管阴云蔓延至整个半导体与存储链条\n第二重就是信仰锚点的突然松动。作为AI革命的旗手，英伟达老黄遭遇危机，市场最核心的叙事支柱出现裂痕，恐慌情绪被瞬间放大。\n第三重就是脆弱流动性抽血与拥挤踩踏，最致命的一击。\n通胀粘性叠加美联储鹰派表态，金融条件再度收紧。而Anthropic IPO虽大获成功，却在边际上抽走了场内其他科技股的流动性。\n结果就是机构杠杆平仓剧痛、净值回撤、承接弹药被彻底锁死，几轮本该“出清”的事件，叠加量化趋势和杠杆基金，直接演变成了多杀多的连锁踩踏，被动降仓、多杀多、越跌越砍。\n这是一次典型的流动性冲击与拥挤挤兑，而不是产业周期的终结。 4万亿美元的AI基建周期推动40万亿知识性工作商品化，医疗医药/机器人自动化，依然在全速推进。\n这场技术革命，不过刚刚行至半途，看多科技股到2027年的核心逻辑，岿然不动。但看对不等于做对，长期趋势不等于短期无恙，颗粒度更细的投资策略和仓位管理订阅者分享。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXlnbFUa4AAtpf_.jpg?name=orig"],"u":"https://x.com/tig88411109/status/2123842416457474422","l":[],"ln":[],"t":["美联储","通胀","美股","AI科技"],"lk":4,"rt":0,"rp":4,"vw":1204},{"id":"2123839592671653915","h":"baoshu88","ts":1795197792,"zh":"特朗普刚和中国相谈甚欢，回去马上就抛出巨型炸弹","en":"特朗普刚和中国相谈甚欢，回去马上就抛出巨型炸弹","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXlk2NBbYAEgnqi.jpg?name=orig"],"u":"https://x.com/baoshu88/status/2123839592671653915","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":1880},{"id":"2123839186763665480","h":"cnfinancewatch","ts":1795197695,"zh":"突发新闻：\n美联储主席凯 tm_medium=social&utm_source=twitter","d":"reuters.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":570},{"id":"2123775267369803858","h":"cnfinancewatch","ts":1795182456,"zh":"必须承认人格性格是有类型的：\n一种是精通人际关系学的政治家人格，他擅长和首先考虑的问题是人的利益诉求差异和协调沟通\n一种是商人性格，精通市场盈利模式观察和营销，哪里能挣到钱和怎么挣钱他有兴趣和直觉，利益主导思维\n一种是深究义理，弄懂来龙去脉的学究型人格，研究能力强能看透，但实战因为看太透人生和历史，反而内耗和悲切，知识大于行动能力\n一种是情感情绪主导人格：啥啥都以当下情绪为主导，瞎胡闹吧！把人生弄成一团糟。没目标也没方略更没意志力，跟谁合作谁倒霉","en":"必须承认人格性格是有类型的：\n一种是精通人际关系学的政治家人格，他擅长和首先考虑的问题是人的利益诉求差异和协调沟通\n一种是商人性格，精通市场盈利模式观察和营销，哪里能挣到钱和怎么挣钱他有兴趣和直觉，利益主导思维\n一种是深究义理，弄懂来龙去脉的学究型人格，研究能力强能看透，但实战因为看太透人生和历史，反而内耗和悲切，知识大于行动能力\n一种是情感情绪主导人格：啥啥都以当下情绪为主导，瞎胡闹吧！把人生弄成一团糟。没目标也没方略更没意志力，跟谁合作谁倒霉","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123775267369803858","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":839},{"id":"2123773507138142664","h":"qinbafrank","ts":1795182036,"zh":"德州新州长：不讨厌数据中心但讨厌利用德州人的方式，期待与马斯克合作。今天FOX新闻对对德克萨斯州新当选州长Gina Hinojos的访访谈值得看看，主要讨论数据中心禁令、移民/边境政策以及与Elon Musk合作等议题。讲话要点：\n1、市场最关心的数据中心禁令问题\n这是她竞选期间的核心议题之一。她明确表示：\n1）将对州政府有控制权的任何新数据中心许可实施禁令（moratorium）。\n2）她认为自己没有权力停止已经获批或正在建设的项目，但可以阻止新的许可通过。\n原话大意：“我不讨厌数据中心。我只是讨厌它们现在利用德州人的方式。我们没有法律来保护德州人。”\n“我们需要对新数据中心许可实施禁令，直到我们能通过法律保护德州人，最重要的是让德州人能坐在谈判桌上，决定数据中心是否以及如何进入他们的社区。”\n她的目标是在立法机构通过水、电、社区参与、补贴等方面的保护措施之前，先暂停新项目。\n2、市场第二关注应该就是她与马斯克的关系\n主持人Baier提到Musk在《纽约时报》DealBook峰会上的言论（称她“相当温和”，不是极左，德州在她治下“会没事”）。Hinojosa回应：“我还没有和Elon Musk谈过。我期待在某个时候和他谈谈。”\n“他在德州有很多业务，我期待与他合作，前提是这种合作能确保德州人过得更好、更繁荣。”\n她自称是“经济民粹主义者”，认为企业利益已经腐蚀了两党，经济必须优先服务于普通德州人。\n3、边境政策与特朗普成果\nHinojosa明确区分“边境安全”与“内陆ICE行动”。她称赞特朗普在边境的成果：“在拜登总统时期，情况是混乱的。这也是为什么人们生气、投票反对民主党的原因。”\n“毫无疑问，正是因为特朗普总统，非法越境人数大幅下降。我为此称赞他。”\n她表示计划与特朗普政府、边境地区警长以及墨西哥官员直接合作，强调“公共安全永远不应该成为党派问题”。她支持联邦政府在边境投入更多资源来维持安全。\n整体看下来，Hinojosa在访谈中试图展现务实、跨党派合作的形象（称赞特朗普边境成果、愿与他合作、区分边境与内陆执法）\n同时坚持她竞选时的核心承诺：数据中心需受监管、不无条件配合ICE内陆行动、优先保护德州纳税人与社区。\n看起来她上任后新数据中心的建设确实要放缓了，这里的核心就是新数据中心建设要暂停多久？之后再重启审批等门槛怎么设定？节奏会如何？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","en":"德州新州长：不讨厌数据中心但讨厌利用德州人的方式，期待与马斯克合作。今天FOX新闻对对德克萨斯州新当选州长Gina Hinojos的访访谈值得看看，主要讨论数据中心禁令、移民/边境政策以及与Elon Musk合作等议题。讲话要点：\n1、市场最关心的数据中心禁令问题\n这是她竞选期间的核心议题之一。她明确表示：\n1）将对州政府有控制权的任何新数据中心许可实施禁令（moratorium）。\n2）她认为自己没有权力停止已经获批或正在建设的项目，但可以阻止新的许可通过。\n原话大意：“我不讨厌数据中心。我只是讨厌它们现在利用德州人的方式。我们没有法律来保护德州人。”\n“我们需要对新数据中心许可实施禁令，直到我们能通过法律保护德州人，最重要的是让德州人能坐在谈判桌上，决定数据中心是否以及如何进入他们的社区。”\n她的目标是在立法机构通过水、电、社区参与、补贴等方面的保护措施之前，先暂停新项目。\n2、市场第二关注应该就是她与马斯克的关系\n主持人Baier提到Musk在《纽约时报》DealBook峰会上的言论（称她“相当温和”，不是极左，德州在她治下“会没事”）。Hinojosa回应：“我还没有和Elon Musk谈过。我期待在某个时候和他谈谈。”\n“他在德州有很多业务，我期待与他合作，前提是这种合作能确保德州人过得更好、更繁荣。”\n她自称是“经济民粹主义者”，认为企业利益已经腐蚀了两党，经济必须优先服务于普通德州人。\n3、边境政策与特朗普成果\nHinojosa明确区分“边境安全”与“内陆ICE行动”。她称赞特朗普在边境的成果：“在拜登总统时期，情况是混乱的。这也是为什么人们生气、投票反对民主党的原因。”\n“毫无疑问，正是因为特朗普总统，非法越境人数大幅下降。我为此称赞他。”\n她表示计划与特朗普政府、边境地区警长以及墨西哥官员直接合作，强调“公共安全永远不应该成为党派问题”。她支持联邦政府在边境投入更多资源来维持安全。\n整体看下来，Hinojosa在访谈中试图展现务实、跨党派合作的形象（称赞特朗普边境成果、愿与他合作、区分边境与内陆执法）\n同时坚持她竞选时的核心承诺：数据中心需受监管、不无条件配合ICE内陆行动、优先保护德州纳税人与社区。\n看起来她上任后新数据中心的建设确实要放缓了，这里的核心就是新数据中心建设要暂停多久？之后再重启审批等门槛怎么设定？节奏会如何？\n本条由@bitget_zh赞助，「Bitget 买美股：秒级入场，丝滑交易","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXkoS2LaAAAEKCt.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123773507138142664","l":[],"ln":[],"t":["美股"],"lk":7,"rt":0,"rp":1,"vw":5114},{"id":"2123773346290844038","h":"xiaomustock","ts":1795181998,"zh":"ant不到24小时破发，正儿八经全球的金融危机。\n这波ant也就龙王赚了把大的，他这个认知是真高。","en":"ant不到24小时破发，正儿八经全球的金融危机。\n这波ant也就龙王赚了把大的，他这个认知是真高。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXkomXTbIAEkKQ6.jpg?name=orig"],"u":"https://x.com/xiaomustock/status/2123773346290844038","l":[],"ln":[],"t":[],"lk":40,"rt":0,"rp":13,"vw":11577},{"id":"2123773019508133970","h":"AntonLaVay","ts":1795181920,"zh":"这市场现在很简单，老黄不回来就送泡沫归零，老黄回来就重新开多迎接AI革命。\n傻逼白皮根本不知道自己干了一件什么事情，整个半导体行业最值钱的东西就是“黄仁勋的面子”。\n这个行业不是苹果供应链，大量的模糊灰色地带，最前沿的芯片就算是台积电最牛逼的工程师也不知道下周哪个方面会出什么难以预测的问题。\n如果这不靠东方的面子文化而是要靠西方的一纸合约，那么不要干了，没法干，前沿设计模糊地带实在是太多，无法准确定价。","en":"这市场现在很简单，老黄不回来就送泡沫归零，老黄回来就重新开多迎接AI革命。\n傻逼白皮根本不知道自己干了一件什么事情，整个半导体行业最值钱的东西就是“黄仁勋的面子”。\n这个行业不是苹果供应链，大量的模糊灰色地带，最前沿的芯片就算是台积电最牛逼的工程师也不知道下周哪个方面会出什么难以预测的问题。\n如果这不靠东方的面子文化而是要靠西方的一纸合约，那么不要干了，没法干，前沿设计模糊地带实在是太多，无法准确定价。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2123773019508133970","l":[],"ln":[],"t":["AI科技"],"lk":40,"rt":1,"rp":5,"vw":2649},{"id":"2123768465517679012","h":"baoshu88","ts":1795180834,"zh":"投研时代，各大机构和操盘人都用AI辅助分析，看了几个机构工作台，AI分析的方向基本都一致，这导致了这轮大A下跌共识形成得极快，连弱反弹都很少，没业绩纯讲故事的票，全市场一两天就能达成共识一起砸盘。","en":"投研时代，各大机构和操盘人都用AI辅助分析，看了几个机构工作台，AI分析的方向基本都一致，这导致了这轮大A下跌共识形成得极快，连弱反弹都很少，没业绩纯讲故事的票，全市场一两天就能达成共识一起砸盘。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXkkGI1boAAimxl.jpg?name=orig","https://pbs.twimg.com/media/HXkkGOpbQAAyrX5.png?name=orig"],"u":"https://x.com/baoshu88/status/2123768465517679012","l":[],"ln":[],"t":[],"lk":4,"rt":1,"rp":0,"vw":958},{"id":"2123764853697589610","h":"artinmemes","ts":1795179973,"zh":"大跌其实更需要巴菲特\n给大家分享一篇老巴2008年次贷危机后发在纽约时报的文章：\nBuy American. I Am.（我正在买入美国 2008.10.16 美股暴跌）\n无论美国本土还是海外，金融市场现在一团糟。金融体系的问题正在向实体经济蔓延，渗漏已经变成汹涌的洪流。短期来看，失业率将会上升，商业活动陷入停滞，新闻头条也会持续充斥吓人的消息\n所以……我正在买入美国股票。我说的是我的个人账户，在此之前，这个账户只持有美国国债。（这里不包含我伯克希尔·哈撒韦的持仓，那部分已经确定全部捐赠给慈善事业。）如果股价继续保持吸引力，我伯克希尔以外的净资产很快会100%配置在美国股票上\n为什么？\n我的买入遵循一条简单准则：别人贪婪时我恐惧，别人恐惧时我贪婪\n当下恐惧情绪四处蔓延，就连经验老道的投资者也被裹挟。当然，投资者警惕高杠杆企业、竞争力薄弱的公司，这是合理的。但对国内大量优质企业的长期前景感到恐慌，毫无道理。这些企业盈利短期会出现波动，历来如此。但5年、10年、20年之后，绝大多数头部企业依然会创出利润新高\n有一点我讲清楚：我无法预测股市短期涨跌。一个月、一年之后股市是涨是跌，我完全不知道。但有一件事大概率会发生：在市场情绪、实体经济回暖之前很久，股市就会率先上涨，甚至大幅上涨。如果你等知更鸟飞来才动手，春天已经结束了\n来看一段历史：大萧条期间，道琼斯指数1932年7月8日跌到最低点41点。但经济状况持续恶化，直到1933年3月罗斯福上台。而到那个时候，股市已经上涨30%\n再想想二战初期，美军在欧洲、太平洋节节败退，股市却在1942年4月见底，远早于盟军战局反转。还有80年代初，通胀肆虐、经济深陷泥潭的时候，恰恰是买入股票的时机\n一句话：坏消息是投资者最好的朋友。 它让你可以用打折的价格，买下美国未来的一部分\n长期来看，股市的结局一定是向好的。20世纪，美国经历两次世界大战、多场代价惨重的军事冲突、大萧条、十几次衰退与金融恐慌、石油危机、流感疫情、总统丑闻下台。但道琼斯指数，从66点涨到11497点\n你可能以为，在这样一个涨幅巨大的百年里，投资者很难亏钱。但确实很多人亏了。那些倒霉的投资者，总是在行情舒服、内心安稳的时候买入，等到新闻吓人、心里发慌的时候卖出\n现在手握现金类资产的人觉得安心。他们不该安心。他们选了一个长期很差的资产：几乎没有收益，而且价值一定会缩水。事实上，政府为缓解危机出台的政策，大概率会带来通胀，进一步侵蚀现金账户的真实购买力\n未来十年，股票几乎肯定跑赢现金，而且差距往往很大。现在执着持有现金的投资者，是在赌自己之后能精准择时再进场。他们等着利好消息带来安全感，却忽略了韦恩·格雷茨基那句建议：“我滑向冰球将要到达的位置，而不是它现在所在的地方。”\n我不喜欢对股市发表看法，再次强调，我不知道短期市场会怎么走。但我效仿一家开在空置银行大楼里的餐厅广告：“说到做到，钱跟着话走。”今天，我的资金和我的观点，都指向股票。","en":"大跌其实更需要巴菲特\n给大家分享一篇老巴2008年次贷危机后发在纽约时报的文章：\nBuy American. I Am.（我正在买入美国 2008.10.16 美股暴跌）\n无论美国本土还是海外，金融市场现在一团糟。金融体系的问题正在向实体经济蔓延，渗漏已经变成汹涌的洪流。短期来看，失业率将会上升，商业活动陷入停滞，新闻头条也会持续充斥吓人的消息\n所以……我正在买入美国股票。我说的是我的个人账户，在此之前，这个账户只持有美国国债。（这里不包含我伯克希尔·哈撒韦的持仓，那部分已经确定全部捐赠给慈善事业。）如果股价继续保持吸引力，我伯克希尔以外的净资产很快会100%配置在美国股票上\n为什么？\n我的买入遵循一条简单准则：别人贪婪时我恐惧，别人恐惧时我贪婪\n当下恐惧情绪四处蔓延，就连经验老道的投资者也被裹挟。当然，投资者警惕高杠杆企业、竞争力薄弱的公司，这是合理的。但对国内大量优质企业的长期前景感到恐慌，毫无道理。这些企业盈利短期会出现波动，历来如此。但5年、10年、20年之后，绝大多数头部企业依然会创出利润新高\n有一点我讲清楚：我无法预测股市短期涨跌。一个月、一年之后股市是涨是跌，我完全不知道。但有一件事大概率会发生：在市场情绪、实体经济回暖之前很久，股市就会率先上涨，甚至大幅上涨。如果你等知更鸟飞来才动手，春天已经结束了\n来看一段历史：大萧条期间，道琼斯指数1932年7月8日跌到最低点41点。但经济状况持续恶化，直到1933年3月罗斯福上台。而到那个时候，股市已经上涨30%\n再想想二战初期，美军在欧洲、太平洋节节败退，股市却在1942年4月见底，远早于盟军战局反转。还有80年代初，通胀肆虐、经济深陷泥潭的时候，恰恰是买入股票的时机\n一句话：坏消息是投资者最好的朋友。 它让你可以用打折的价格，买下美国未来的一部分\n长期来看，股市的结局一定是向好的。20世纪，美国经历两次世界大战、多场代价惨重的军事冲突、大萧条、十几次衰退与金融恐慌、石油危机、流感疫情、总统丑闻下台。但道琼斯指数，从66点涨到11497点\n你可能以为，在这样一个涨幅巨大的百年里，投资者很难亏钱。但确实很多人亏了。那些倒霉的投资者，总是在行情舒服、内心安稳的时候买入，等到新闻吓人、心里发慌的时候卖出\n现在手握现金类资产的人觉得安心。他们不该安心。他们选了一个长期很差的资产：几乎没有收益，而且价值一定会缩水。事实上，政府为缓解危机出台的政策，大概率会带来通胀，进一步侵蚀现金账户的真实购买力\n未来十年，股票几乎肯定跑赢现金，而且差距往往很大。现在执着持有现金的投资者，是在赌自己之后能精准择时再进场。他们等着利好消息带来安全感，却忽略了韦恩·格雷茨基那句建议：“我滑向冰球将要到达的位置，而不是它现在所在的地方。”\n我不喜欢对股市发表看法，再次强调，我不知道短期市场会怎么走。但我效仿一家开在空置银行大楼里的餐厅广告：“说到做到，钱跟着话走。”今天，我的资金和我的观点，都指向股票。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXkelmCbUAAvhKQ.jpg?name=orig"],"u":"https://x.com/artinmemes/status/2123764853697589610","l":[],"ln":[],"t":["通胀","美股"],"lk":6,"rt":2,"rp":1,"vw":1480},{"id":"2123760631576944994","h":"Kay2289123","ts":1795178966,"zh":"信念这个事儿，每个人的来源肯定都是不一样的。我分享一下我的两大信念来源，他们陪我穿越牛熊的周期\n1. 我是 AI 的坚定使用者：我一直在观察周围人的 AI 使用和渗透情况，我认为现在在全社会不足 1%，渗透率一定会提上来\n2. 我的本职工作就是在硅谷做 AI 训练推理：目前我认为最大的瓶颈在互联。","en":"信念这个事儿，每个人的来源肯定都是不一样的。我分享一下我的两大信念来源，他们陪我穿越牛熊的周期\n1. 我是 AI 的坚定使用者：我一直在观察周围人的 AI 使用和渗透情况，我认为现在在全社会不足 1%，渗透率一定会提上来\n2. 我的本职工作就是在硅谷做 AI 训练推理：目前我认为最大的瓶颈在互联。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Kay2289123/status/2123760631576 \n不是在链上。\n而是在价格发现中，这才是真正重要的。\n合成浮动比率 (SFR)。\n解释一切的指标。\n一旦合成供应压倒真实供应，价格就不再对需求做出反应。\n它对仓位、对冲和清算流做出反应。\n华尔街现在可以对冲比特币交易。\n他们不是在猜测方向。\n他们在每个衍生品主导的市场中做他们擅长的事：\n1⃣ 创建无限的纸面 BTC\n2⃣ 在反弹中做空\n3⃣ 强制清算\n4⃣ 在更低价位回补\n5⃣ 重复\n这不是“下注”。\n这是库存制造。\n现在一个真实的 BTC 可以同时支持：\n→ 一个 ETF 份额\n→ 一个期货合约\n→ 一个永续掉期\n→ 一个期权 delta\n→ 一个经纪商贷款\n→ 一个结构性票据\n全部在同一时间。\n那是对一枚币的六个索赔。\n那不是自由市场。\n那是一个戴着比特币面具的部分储备价格系统。\n如果你想忽略它，随你便，但别假装你没有被警告。\n在为时已晚之前关注并开启通知。","en":"提供一种华尔街观察视角的解释：\n一旦供应可以被合成创造，稀缺性就消失了。\n当稀缺性消失时，价格不再在链上发现，而是开始在衍生品中被设定。\n这正是发生在比特币身上的事。\n这与已经发生在以下资产上的结构性断裂相同：\n→ 黄金\n→ 白银\n→ 石油\n→ 股票\n一旦衍生品接管。\n比特币的原始论点已经破灭。\n比特币的估值建立在两个想法上：\n→ 2100 万的硬上限\n→ 无再抵押\n当华尔街在链上叠加这些时，该框架就死了：\n→ 现金结算期货\n→ 永续掉期\n→ 期权\n→ ETF\n→ 主经纪商贷款\n→ 包装 BTC\n→ 总回报掉期\n从那时起，比特币供应在理论上变得无限。\n不是在链上。\n而是在价格发现中，这才是真正重要的。\n合成浮动比率 (SFR)。\n解释一切的指标。\n一旦合成供应压倒真实供应，价格就不再对需求做出反应。\n它对仓位、对冲和清算流做出反应。\n华尔街现在可以对冲比特币交易。\n他们不是在猜测方向。\n他们在每个衍生品主导的市场中做他们擅长的事：\n1⃣ 创建无限的纸面 BTC\n2⃣ 在反弹中做空\n3⃣ 强制清算\n4⃣ 在更低价位回补\n5⃣ 重复\n这不是“下注”。\n这是库存制造。\n现在一个真实的 BTC 可以同时支持：\n→ 一个 ETF 份额\n→ 一个期货合约\n→ 一个永续掉期\n→ 一个期权 delta\n→ 一个经纪商贷款\n→ 一个结构性票据\n全部在同一时间。\n那是对一枚币的六个索赔。\n那不是自由市场。\n那是一个戴着比特币面具的部分储备价格系统。\n如果你想忽略它，随你便，但别假装你没有被警告。\n在为时已晚之前关注并开启通知。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123729392279118146","l":[],"ln":[],"t":["黄金"],"lk":0,"rt":0,"rp":0,"vw":791},{"id":"2123728715360424005","h":"cnfinancewatch","ts":1795171357,"zh":"过去数周，一切避险策略都在失效\n我们的订阅者持有短债大致是唯一的避险成功的\n黄金、油气、股票、长债都在跌\n所谓负相关资产根本不存在\n只是我们的大类轮动数据依然有效\n周日我们将有闭门研讨会对这种现象给出结论：","en":"过去数周，一切避险策略都在失效\n我们的订阅者持有短债大致是唯一的避险成功的\n黄金、油气、股票、长债都在跌\n所谓负相关资产根本不存在\n只是我们的大类轮动数据依然有效\n周日我们将有闭门研讨会对这种现象给出结论：","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123728715360424005","l":["macaostarbridge.com"],"ln":[{"u":"https://macaostarbridge.com","d":"macaostarbridge.com"}],"t":["黄金"],"lk":0,"rt":0,"rp":0,"vw":854},{"id":"2123727210590920799","h":"TraderS18","ts":1795170998,"zh":"如果用情绪指标来衡量行情的话，现在已经不是恐慌而是绝望了","en":"如果用情绪指标来衡量行情的话，现在已经不是恐慌而是绝望了","zh_src":"native","lang":"zh","m":[], 反对声音质疑，引入拼音输入法是“消灭正体字”，亦有人担心会影响学童认字能力，甚至改变用语思维。\n有学者向BBC中文指出，输入法本质是一项工具，未必直接左右学童的语言能力。而比起输入法本身，学童早已改变的语言环境更值得关注。\n阅读报导：","en":"10月底，香港教育局公布小学创科课程草拟文件，提出小学二年级学生应该初步掌握以“汉语拼音输入法”（Pinyin）输入中文。过去，教育局没有规定学校应该教哪一种输入法，而仓颉及其简化版速成一直是港人常用选择。\n从仓颉到汉语拼音输入，表面是打字方式的选择，背后却涉及文化改变及语言系统转换。在港府积极推广学校用普通话教授中文科(普教中）的背景下，有反对声音质疑，引入拼音输入法是“消灭正体字”，亦有人担心会影响学童认字能力，甚至改变用语思维。\n有学者向BBC中文指出，输入法本质是一项工具，未必直接左右学童的语言能力。而比起输入法本身，学童早已改变的语言环境更值得关注。\n阅读报导：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXjsS05bMAA5QeQ.jpg?name=orig","https://pbs.twimg.com/media/HXjsS05bUAAms6Y.jpg?name=orig","https://pbs.twimg.com/media/HXjsS1EacAACkBQ.jpg?name=orig","https://pbs.twimg.com/media/HXjsS05aQAArrS7.jpg?name=orig"],"u":"https://x.com/bbcchinese/status/2123717991221403804","l":["bbc.in"],"ln":[{"u":"https://bbc.in/3V0v8Fh","d":"bbc.in"}],"t":[],"lk":4,"rt":0,"rp":2,"vw":3228},{"id":"2123716830678425815","h":"TraderS18","ts":1795168523,"zh":"现在应该算是流动性危机了，黄金原油美股比特币全面下跌，除了政策性救市/宽松应该没有别的反转理由了。\n那么救市就是两条线，以美联储为主财政部为辅，美联储开启回购，财政部释放TGA余额。\n具体观测指标：2年期美债收益率及美元指数。\n如果这两家都不动，那就只能理解为党争之下两党僵持不下只能主被动的挤破泡沫了。\n但好消息是反弹不需要救市，只要卖盘枯竭叠加放出利好预期刺激情绪就可以做到，甚至反弹猛烈的话都足以给人一种小阳春的感觉。不过这种情况难以提前预判，超卖信号之后也许会连续超卖。\n能改变市场恐慌情绪的无非还是重量人物出来讲话、降低加息预期，加大短债回购、11.25PCE、12.4大非农、12.10加息落地及CPI数据。数据都还有点远，看看有没有人出来托市吧。","en":"现在应该算是流动性危机了，黄金原油美股比特币全面下跌，除了政策性救市/宽松应该没有别的反转理由了。\n那么救市就是两条线，以美联储为主财政部为辅，美联储开启回购，财政部释放TGA余额。\n具体观测指标：2年期美债收益率及美元指数。\n如果这两家都不动，那就只能理解为党争之下两党僵持不下只能主被动的挤破泡沫了。\n但好消息是反弹不需要救市，只要卖盘枯竭叠加放出利好预期刺激情绪就可以做到，甚至反弹猛烈的话都足以给人一种小阳春的感觉。不过这种情况难以提前预判，超卖信号之后也许会连续超卖。\n能改变市场恐慌情绪的无非还是重量人物出来讲话、降低加息预期，加大短债回购、11.25PCE、12.4大非农、12.10加息落地及CPI数据。数据都还有点远，看看有没有人出来托市吧。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123716830678425815","l":[],"ln":[],"t":["美联储","美股","汇率","原油能源","黄金"],"lk":4,"rt":0,"rp":0,"vw":545},{"id":"2123716685698101611","h":"cnfinancewatch","ts":1795168489,"zh":"标普是进入熊市还是你将反弹？\n1-熊市\n2-即将反弹","en":"标普是进入熊市还是你将反弹？\n1-熊市\n2-即将反弹","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/212355344 在看来两党都希望再通过一个短期拨款法案，让政府运营维持到明年初，把实质谈判留给新国会，这就与2027 年2月前后的债务上限到期也叠加在一起了。\n所以明年OpenAI能不能上市？一方面看市场情况、另一方面要看要证明 GPT 能持续跟上 Claude。OpenAI 在八、九月追回了一些差距，Claude 在部分场景仍占优，OpenAI 要把企业端和消费端的采用转成实际收入。\n当然，同一家公司在不同市场环境下发行，能拿到的估值可能相差很大。\n5、AI之后看哪些方向\n1）超大云厂商，\n7月份开始提超大CSP的重估，现在依然这么看。如果新的数据中心放缓、过去一年多砸钱力度不断提高的大云厂商未来一年数据中心陆续建好，业绩兑现。同时超大云厂也是广泛的B端企业采用AI的载体。\n2）应用端\n移动互联网的应用基于AI底层重构，就像X平台、现在X平台跟几年前完全不同。当时X平台几千名员工、现在X只有几十名员工，大量都是AI在背后支撑，现在X整个平台内容分发推荐运营都是AI在驱动、这样算不算已经是AI应用了。\n大家一直期望看到AI时代原生应用，但是大概率老树开新花，但是底层已经在大量消耗token。\n个人Agent自然是一个趋势、已经很明显了。\n然后就是AI医疗健康领域、也值得关注。\n完整内容看对谈视频","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/qinbafrank/status/2123706150440915359","l":["binance.com"],"ln":[{"u":"https://www.binance.com/zh-CN/square/audio/replay?id=48597016063297","d":"binance.com"}],"t":["通胀","AI科技"],"lk":3,"rt":0,"rp":2,"vw":1008},{"id":"2123706146120999020","h":"qinbafrank","ts":1795165976,"zh":"英伟达的财报以及老黄对英伟达的影响在哪里？中期选举后美国的政治生态怎样的变化？Anthropic上市后走势会如何？未来行情走势的变量是什么？多谢Beca周三晚上在币安广场的AMA聊的内容很多，正好也梳理下当时聊的要点？\n1、英伟达的财报质量和老黄离开的影响\n1）财报本身是超预期、无论是本季的业绩还是下季度和下一财年指引都很强劲。如果28财年，就是明年按照 75% 的增速的话，那它营收能到7400亿美金以上，就相当于 5,000 多亿的毛利，可能是 4,000 多亿的净利润。其实这个体量非常大了。但这次财报没有解决大家最关心的问题，就是老黄。\n2）老黄对英伟达的影响是巨大且不可或缺，体现在三个层面：\n（1）技术远见，比客户更早看到技术方向。 CUDA 商业回报还不清楚时，黄仁勋就持续投入软件和开发者生态，又推动 GPU 从图形计算进入高性能计算。今天的管理层可以执行已经排好的产品路线，下一次技术方向尚未形成共识时，谁有判断和魄力下注，仍待观察。\n（2）让供应商愿意跟着一起赌未来技术方向，英伟达负责设计，一代芯片要如期交付，台积电、鸿海、台达电及材料、封装、测试厂商都得提前投入。老黄的远见和让长期让合作伙伴分享到收益，也积累了兑现承诺的记录。供应商愿意跟着他承担押错路线的风险，才有条件把换代周期从数年压到约一年至一年半。\n（3）同时管技术、供应链、人事和资本的全局视野。数十位高管直接向黄仁勋汇报，几位核心负责人只长期深耕各自领域，很难顶得上。\n3）老黄不能回归的直接影响\n（1）英伟达的技术升级的速度可能会要慢下来。如果未来的人没有这样的魄力、远见，技术方向的选择会多变，产业链上的摩擦越来越大（公事公办）。摩擦最后就会带来时间上的延迟；\n（2）产业资本生态萎缩\n英伟达投资、承诺采购或为基础设施提供担保，会影响银行和债券投资者愿意借多少钱。克雷斯表示对新增投资、采购承诺和担保会更审慎。个人会担心若以后类似支持越来越少，一些新云厂商到 2027 年的首要问题会从扩张变成生存。也会带来融资更难，资金成本更高。\n2、中期选举美国政治生态的变化以及政策的影响\n1）这一次中期选举的惨败程度远超以往\n民主党参议院拿下56席、众议院超过250席（虽然不是绝对多数，但是离绝对多数也不远了），同时民主党还拿到29个州的州长位子。连德克萨斯州、堪萨斯州这些传统接近百年的铁红州都被丢掉，共和党的基本盘这一次被极大的动摇了。可见惨败程度；\n2）中期选举的惨败也极大地削弱了川普的威信和影响力，从“倒黄”事件就能看来，主导改善共和党内部白宫内阁里和国会里的对华强硬派，即使川普一再力保也没能留下老黄。让共和党里的鹰派或者建制派话语权更大了，而前两年川普一统共和党依靠自己的威信和影响力死死压住党内不同意见，现在已经压不住了。\n这也意味着之后美国对华AI政策上越来越严格，往技术封锁的路线上走了、有点八十年代里根时代当时中情局局长比尔.凯西主导的对苏联技术禁运的味道。本周川普访深时的良好气氛，可能是未来两年中美关系的相对高点。\n3）这次共和党中选惨败，伊朗战争、油价和生活成本动摇了部分选民，数据中心带来的电费、用水和噪音也进入社区政治，都说明民意沸腾。这种情况下、不仅民主党、就是共和党内部也会对过去激进的产业政策做出调整、来迎合选民的呼吁。\n4）当然川普也不会完全妥协，他把斯蒂芬.米勒提到白宫幕僚长的位置上，用意很深。米勒对联邦行政法非常熟悉，善于找到各种冷门法律条文来给川普的行为提供法律依据，善于找路洞、钻空子，川普让米勒当白宫幕僚长就是让他来战斗的。未来两年，白宫国会的博弈可能会非常激烈。\n3、Anthropic上市及之後的走勢\n1）IPO定价还可以、前期流动盘不大，但很快开始解锁。跟SpaceX的走势可能类似，先涨再跌。短期定价还 OK，加上申购的情绪可能有一波走势向上。但大概率最终还是要砸下来，最终就是看砸到一个什么样的位置。\n2）如果Anthropic市值之后真的能跌破 1 万亿美金，例如跌倒八九千亿美金，那就是有性价比的位置了。\n4、之后市场走势的三个变量\n虽然8月底9月初提过一个“秋意渐凉”的框架，高油价、高利率、中期选举前就有大震荡，10月初也聊到高Beta会会跌。但也低估了这次中期选举共和党惨败的程度，这个惨败让市场意识美国居民对通胀、对数据中心建设已经到了如此反感的地步，所以市场对此有激烈的定价。\n1）油价、通胀及利率走势；\n核心逻辑是，如果美伊能缓和、俄乌也能结束，油价下来通胀才会下来，市场才会预期利率更宽松，否则又要担心明年上半年联储会继续收紧。\n2）新的政治生态下AI政策会比预期的还要收紧还是会柔和些；\n现在科技杀的这么猛、就是预期新国会生态带来AI基建的大放缓，那就要看明年实际力度比预期的更猛还是更弱。如果民主党搞事力度比现在预期更猛，即使通胀下来了，科技也很难受。但如果比现在预期柔和一些，市场情绪则又起来。\n完整内容看对谈视频","en":"英伟达的财报以及老黄对英伟达的影响在哪里？中期选举后美国的政治生态怎样的变化？Anthropic上市后走势会如何？未来行情走势的变量是什么？多谢Beca周三晚上在币安广场的AMA聊的内容很多，正好也梳理下当时聊的要点？\n1、英伟达的财报质量和老黄离开的影响\n1）财报本身是超预期、无论是本季的业绩还是下季度和下一财年指引都很强劲。如果28财年，就是明年按照 75% 的增速的话，那它营收能到7400亿美金以上，就相当于 5,000 多亿的毛利，可能是 4,000 多亿的净利润。其实这个体量非常大了。但这次财报没有解决大家最关心的问题，就是老黄。\n2）老黄对英伟达的影响是巨大且不可或缺，体现在三个层面：\n（1）技术远见，比客户更早看到技术方向。 CUDA 商业回报还不清楚时，黄仁勋就持续投入软件和开发者生态，又推动 GPU 从图形计算进入高性能计算。今天的管理层可以执行已经排好的产品路线，下一次技术方向尚未形成共识时，谁有判断和魄力下注，仍待观察。\n（2）让供应商愿意跟着一起赌未来技术方向，英伟达负责设计，一代芯片要如期交付，台积电、鸿海、台达电及材料、封装、测试厂商都得提前投入。老黄的远见和让长期让合作伙伴分享到收益，也积累了兑现承诺的记录。供应商愿意跟着他承担押错路线的风险，才有条件把换代周期从数年压到约一年至一年半。\n（3）同时管技术、供应链、人事和资本的全局视野。数十位高管直接向黄仁勋汇报，几位核心负责人只长期深耕各自领域，很难顶得上。\n3）老黄不能回归的直接影响\n（1）英伟达的技术升级的速度可能会要慢下来。如果未来的人没有这样的魄力、远见，技术方向的选择会多变，产业链上的摩擦越来越大（公事公办）。摩擦最后就会带来时间上的延迟；\n（2）产业资本生态萎缩\n英伟达投资、承诺采购或为基础设施提供担保，会影响银行和债券投资者愿意借多少钱。克雷斯表示对新增投资、采购承诺和担保会更审慎。个人会担心若以后类似支持越来越少，一些新云厂商到 2027 年的首要问题会从扩张变成生存。也会带来融资更难，资金成本更高。\n2、中期选举美国政治生态的变化以及政策的影响\n1）这一次中期选举的惨败程度远超以往\n民主党参议院拿下56席、众议院超过250席（虽然不是绝对多数，但是离绝对多数也不远了），同时民主党还拿到29个州的州长位子。连德克萨斯州、堪萨斯州这些传统接近百年的铁红州都被丢掉，共和党的基本盘这一次被极大的动摇了。 ，其实你是在给自己拉仇恨，塑造敌人）\n位高权重，如何藏锋不露不被小人惦记，那是一门学问\n家、国的政策制定者和方向决策者也是如此，有招一部分人爱你，也有招一部分人恨你，这个恨怎么不颠覆了你的反噬了你\n这个值得思考，反过来我们做下位的时候，不要缺了对上位者的尊重，不要真以为上位者是蠢货","en":"我曾经或者现在也是国内某方向的排名第一的创始人、大拿、大佬、权威、会长、主席……\n天天听人哄着、供着、敬着\n有时候自己也飘了吧\n习惯于衣来伸手饭来张口、习惯于上位者姿态\n没耐心听人说话、也没耐心等别人跟上来\n总是高高在上盛气凌人\n最后是被反噬（你以为你在帮别人，其实你是在给自己拉仇恨，塑造敌人）\n位高权重，如何藏锋不露不被小人惦记，那是一门学问\n家、国的政策制定者和方向决策者也是如此，有招一部分人爱你，也有招一部分人恨你，这个恨怎么不颠覆了你的反噬了你\n这个值得思考，反过来我们做下位的时候，不要缺了对上位者的尊重，不要真以为上位者是蠢货","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123694208553046389","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":342},{"id":"2123692878828568654","h":"fxtrader","ts":1795162813,"zh":"路透社报道，台湾方面向Meta举报接近2700个Threads账号，理由是“这些账号属于中国信息战计划的一部分”，并“影响下周的地方选举。”\n台湾还向Meta表示，约有260个账号发布了超过2000条AI生成的视频，吸引了235万次的互动，主要针对民进党的政治人物及其政策。","en":"路透社报道，台湾方面向Meta举报接近2700个Threads账号，理由是“这些账号属于中国信息战计划的一部分”，并“影响下周的地方选举。”\n台湾还向Meta表示，约有260个账号发布了超过2000条AI生成的视频，吸引了235万次的互动，主要针对民进党的政治人物及其政策。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123692878828568654","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":2,"vw":2087},{"id":"2123692774168117502","h":"cnfinancewatch","ts":1795162788,"zh":"情感上的事儿，不要跟中老年人谈\n都是千年狐狸\n小九九亿万个","en":"情感上的事儿，不要跟中老年人谈\n都是千年狐狸\n小九九亿万个","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123692774168117502","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":717},{"id":"2123689770157232542","h":"hanking66","ts":1795162072,"zh":"现在全世界最希望下跌的人应该就是黄仁勋了，他现在说不定坐在家里沙发上一边玩 GTA6 一边偷笑呢😅\n英伟达跌到 100，黄仁勋下个月回归\n英伟达跌到 50，黄仁勋下周回归\n英伟达跌到 10块，黄仁勋下一秒回归\n英伟达跌的越惨，回归概率越大😅\nBuy the dip，长期持有，Discord在个人资料。","en":"现在全世界最希望下跌的人应该就是黄仁勋了，他现在说不定坐在家里沙发上一边玩 GTA6 一边偷笑呢😅\n英伟达跌到 100，黄仁勋下个月回归\n英伟达跌到 50，黄仁勋下周回归\n英伟达跌到 10块，黄仁勋下一秒回归\n英伟达跌的越惨，回归概率越大😅\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2123689770157232542","l":[],"ln":[],"t":["AI科技"],"lk":10,"rt":0,"rp":3,"vw":1765},{"id":"2123689187904041467","h":"tychozzz","ts":1795161933,"zh":"本就稀缺脆弱的市场流动性， 苦…这种原因下跌是最烦的了。\nBuy the dip，长期持有，Discord在个人资料。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/hanking66/status/2123679673888772170","l":[],"ln":[],"t":["美联储"],"lk":2,"rt":0,"rp":1,"vw":396},{"id":"2123679499871219792","h":"cnfinancewatch","ts":1795159623,"zh":"能不能动：能小仓防守观察，不宜进攻。 今日大类不硬做进攻，只留苹果、BBWI两个观察框，第三位空着；半导体/AI硬件、已大涨的PDD/PANW、商业地产抵押均不碰。\n怎么动：\n· AAPL：期权转强但已离开突破窗口，不突破不进。只做半仓观察，触发为放量站上360.83；跌破344.43失效当天走。\n· BBWI：箱底长下影成立，但缺第二项资金共振，大势弱，降权半仓。触发为放量站上19.43；收盘跌破18.66或再失17.80作废，不因长下影提前加仓。\n· TRTX、GEV、PFE、ACM：仅观察，等企稳K线，不列入进攻。\n· 亚洲已先跌、期指未翻红，今晚防高开低走，不在缺口里追。英伟达、美光事件盖不住位置，AI硬件继续只观察；黄金白银弱、债券期货仍是空头回补，不代表风险偏好转好。\n以上仅为信息整理，不构成投资建议。","en":"能不能动：能小仓防守观察，不宜进攻。 今日大类不硬做进攻，只留苹果、BBWI两个观察框，第三位空着；半导体/AI硬件、已大涨的PDD/PANW、商业地产抵押均不碰。\n怎么动：\n· AAPL：期权转强但已离开突破窗口，不突破不进。只做半仓观察，触发为放量站上360.83；跌破344.43失效当天走。\n· BBWI：箱底长下影成立，但缺第二项资金共振，大势弱，降权半仓。触发为放量站上19.43；收盘跌破18.66或再失17.80作废，不因长下影提前加仓。\n· TRTX、GEV、PFE、ACM：仅观察，等企稳K线，不列入进攻。\n· 亚洲已先跌、期指未翻红，今晚防高开低走，不在缺口里追。英伟达、美光事件盖不住位置，AI硬件继续只观察；黄金白银弱、债券期货仍是空头回补，不代表风险偏好转好。\n以上仅为信息整理，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123679499871219792","l":[],"ln":[],"t":["AI科技","黄金"],"lk":0,"rt":0,"rp":0,"vw":232},{"id":"2123679010060440007","h":"cnfinancewatch","ts":1795159506,"zh":"真正的经营之道：\n1、管高管先统一价值观，底线极其明确，只要撒谎直接开除。2、防风险靠内部数据完全透明，管基层就是让一线员工畅所欲言。3、对待资本极其清醒，钱可以融，但公司控制权必须死死攥在自己手里。4、做生意坚持微利经营，死磕降本，把利润让给供货商，绝不比对手卖得贵。5、当年顶着骂声自建物流，就是为了把效率变成别人抄不走的护城河。6、用人偏爱有冲劲的穷孩子，把管培生当黄埔军校来带，真心对待兄弟。","en":"真正的经营之道：\n1、管高管先统一价值观，底线极其明确，只要撒谎直接开除。2、防风险靠内部数据完全透明，管基层就是让一线员工畅所欲言。3、对待资本极其清醒，钱可以融，但公司控制权必须死死攥在自己手里。4、做生意坚持微利经营，死磕降本，把利润让给供货商，绝不比对手卖得贵。5、当年顶着骂声自建物流，就是为了把效率变成别人抄不走的护城河。6、用人偏爱有冲劲的穷孩子，把管培生当黄埔军校来带，真心对待兄弟。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123679010060440007","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":392},{"id":"2123678003666505753","h":"cnfinancewatch","ts":1795159266,"zh":"美股三个方向\n一是 #大盘消费电子 ，只认 #苹果 这种低波动、仍相对抗跌的品种。它已经离开最干净的颈线窗口，期权转强只够维持观察，不突破不进。二是\n#可选消费箱底 ， $BBWI 的位置和放量长下影是成立的，但缺资金共振，又赶上风险偏好下降，只给降权仓。三是 #AI硬件与利率敏感板块\n只观察：积压订单和期权多头改变不了英伟达、美光的底部杀跌，地产抵押在加息路径被拉长后更不宜作为主方向。\n#六只个股\n #苹果 $AAPL ，回撤后的区间中上部，位置约67%，距20日高也是52周高360.83还有3.33%，已经略离开负2%到正3%的突破窗口，收盘仍略高于20日均线347.74。触发是放量站上360.83，失效是跌破344.43，只给半仓，不突破不进。\n $BBWI ，箱底企稳，位置18%，周四收18.91，涨1.34%，量比约2.39，最低17.80后收回，留下长下影。事件只是四季度指引，中性；期权未形成共振。触发是放量站上19.43，收盘跌破18.66或再失17.80附近则失效，降权半仓。\n $TRTX ，箱底下沿，位置21%，市值约4.9亿美元，是商业地产抵押贷款信托。周四收6.42，跌0.93%，近两日有锤子，但收盘仍弱，董事买入和期权都构不成共振，利率环境也不站在这边。触发是放量站上6.44，跌破20日低6.14失效，仅观察。\n $GEV ，靠近箱底但未企稳，位置约5%，周四收756.28，跌2.06%，是一根中阴，130吉瓦积压订单和三项期权共振都只是加分，先等企稳蜡烛，跌破747附近失效，仅观察。\n #辉瑞 $PFE ，靠近20日低点，位置约2.5%，Call持仓增仓10.2%、Put持仓减仓2.3%，有两项同向，但最近三根都是阴线，没有企稳，仅观察，跌破27.44失效。\n $ACM ，短线已伸展，20日涨32.02%，五日涨14.55%，位置84%，周四收80.31，跌2.51%，积压订单创纪录是事实，但距颈线仍有约9%，不追，仅观察。\n#小盘阿尔法\n本期只把 $TRTX 列入观察，不写入只做。它市值偏小，又有董事买入和箱底下沿的锤子，核验后位置成立，可是没有第二项资金共振，经营利润率也弱，叠加加息预期被拉长，只适合看、不适合当做小盘进攻。\n$WGS 、 $TWST 有单基金买入，但周四都是中阴，没有企稳，不选。 $SLS\n五日仍涨85%，周四再跌17.21%，属于短线伸展后的回吐，不选。 $OFRM 、 $NUAI 不是硬条件命中，而且 $NUAI\n已经走到区间95%附近，不选。\n#操作提示\n亚洲已经先跌了一轮，美股期指截稿仍未翻红，今晚若再高开，先防高开低走，不急着在缺口里动手。苹果只作为贴着前高回撤后的半仓观察单，期权比昨天强，但距离颈线比昨天远，不突破就不进，跌破失效位当天走。\n$BBWI 看的是箱底能否站稳，收在18.66下方就作废，不要因为一根长下影提前加仓。英伟达、美光的事件和期权都在，位置却在杀跌，AI硬件继续只观察。黄金、白银继续被甩，债券期货仍是空头回补，不是风险偏好已经转好。\n$PDD 、 $PANW 这类已经跳空或连续大阳的，要用完整日线确认能否站住，不拿跳空去填只做名单。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"美股三个方向\n一是 #大盘消费电子 ，只认 #苹果 这种低波动、仍相对抗跌的品种。它已经离开最干净的颈线窗口，期权转强只够维持观察，不突破不进。二是\n#可选消费箱底 ， $BBWI 的位置和放量长下影是成立的，但缺资金共振，又赶上风险偏好下降，只给降权仓。三是 #AI硬件与利率敏感板块\n只观察：积压订单和期权多头改变不了英伟达、美光的底部杀跌，地产抵押在加息路径被拉长后更不宜作为主方向。\n#六只个股\n #苹果 $AAPL ，回撤后的区间中上部，位置约67%，距20日高也是52周高360.83还有3.33%，已经略离开负2%到正3%的突破窗口，收盘仍略高于20日均线347.74。触发是放量站上360.83，失效是跌破344.43，只给半仓，不突破不进。\n $BBWI ，箱底企稳，位置18%，周四收18.91，涨1.34%，量比约2.39，最低17.80后收回，留下长下影。事件只是四季度指引，中性；期权未形成共振。触发是放量站上19.43，收盘跌破18.66或再失17.80附近则失效，降权半仓。\n $TRTX ，箱底下沿，位置21%，市值约4.9亿美元，是商业地产抵押贷款信托。周四收6.42，跌0.93%，近两日有锤子，但收盘仍弱，董事买入和期权都构不成共振，利率环境也不站在这边。触发是放量站上6.44，跌破20日低6.14失效，仅观察。\n $GEV ，靠近箱底但未企稳，位置约5%，周四收756.28，跌2.06%，是一根中阴，130吉瓦积压订单和三项期权共振都只是加分，先等企稳蜡烛，跌破747附近失效，仅观察。\n #辉瑞 $PFE ，靠近20日低点，位置约2.5%，Call持仓增仓10.2%、 n the game，如何分批进入，如何避免用完美主义错过大周期。第一篇是《踏空者指南》\n这篇更适合现在。它讲的是尾部事件冲击下，如何管理核心仓、技术仓和现金仓，如何在不确定性中保持可行动性。第二篇是《投资者如何面对事件性冲击的投资和仓位指南》\n链接都在下面：👇","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/tig88411109/status/2123652586440126916","l":[],"ln":[],"t":["美股"],"lk":9,"rt":0,"rp":2,"vw":2161},{"id":"2123652030229008446","h":"cnfinancewatch","ts":1795153074,"zh":"投资的含义是，这是存量资金的高低切换，不是成长风格已经翻过来。制约非常直接：中财网记CPO概念午盘跌3.77%，中际旭创午收跌2.64%，东山精密跌2.51%，新易盛只勉强翻红涨0.34%。把PCB小票和光模块龙头并成同一笔交易，上午就已经被走出来的分化打过一次。\n三、农业养殖的逆势回升，以及港股阿里巴巴对云业务的再定价，是今天的次级缓冲，不是用来对抗低开的主武器。已核实：金新农涨停，东方海洋午收涨9.97%封板，猪肉和部分水产成为新华财经、澎湃午评里的探底回升方向。它的意义是，在黄金这条传统避险已经被利率预期打穿的时候，部分资金把避风港临时放在了农业，而不是把银行和黄金同时当成同一类防御。港股里，阿里巴巴-W午收涨4.28%，港台电台称其结束10日跌势，这和今早已经核对过的云业务高增长是同一条中期逻辑，今天只是把隔夜财报补进了股价。九芝堂公告参股公司北京科信美德的沃拉德单抗注射液获得国家药监局临床试验批准，属于1类创新药、用于成人1型糖尿病的胰岛素辅助治疗，每日经济新闻和同花顺均有转载；但该股午收7.96元，跌1.36%，说明公司事件没有改写上午的风险偏好。制约在于：农业是弱市轮动，弹性票容易午后回流；阿里的云逻辑也挡不住网易跌17.92%、快手跌9.98%。把次级缓冲当成主升浪，会把赔率做反。","en":"投资的含义是，这是存量资金的高低切换，不是成长风格已经翻过来。制约非常直接：中财网记CPO概念午盘跌3.77%，中际旭创午收跌2.64%，东山精密跌2.51%，新易盛只勉强翻红涨0.34%。把PCB小票和光模块龙头并成同一笔交易，上午就已经被走出来的分化打过一次。\n三、农业养殖的逆势回升，以及港股阿里巴巴对云业务的再定价，是今天的次级缓冲，不是用来对抗低开的主武器。已核实：金新农涨停，东方海洋午收涨9.97%封板，猪肉和部分水产成为新华财经、澎湃午评里的探底回升方向。它的意义是，在黄金这条传统避险已经被利率预期打穿的时候，部分资金把避风港临时放在了农业，而不是把银行和黄金同时当成同一类防御。港股里，阿里巴巴-W午收涨4.28%，港台电台称其结束10日跌势，这和今早已经核对过的云业务高增长是同一条中期逻辑，今天只是把隔夜财报补进了股价。九芝堂公告参股公司北京科信美德的沃拉德单抗注射液获得国家药监局临床试验批准，属于1类创新药、用于成人1型糖尿病的胰岛素辅助治疗，每日经济新闻和同花顺均有转载；但该股午收7.96元，跌1.36%，说明公司事件没有改写上午的风险偏好。制约在于：农业是弱市轮动，弹性票容易午后回流；阿里的云逻辑也挡不住网易跌17.92%、快手跌9.98%。把次级缓冲当成主升浪，会把赔率做反。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123652030229008446","l":[],"ln":[],"t":["A股港股","财报","黄金"],"lk":0,"rt":0,"rp":0,"vw":927},{"id":"2123652026114695626","h":"cnfinancewatch","ts":1795153073,"zh":"热点财经新闻综述｜2026-11-20·午间\n数据时点：A股、港股以11月20日午间收盘（北京时间11:30）为主；富时A50日盘引用汇通财经11:04的盘中报价，完整日盘收盘本档未取到；日经225与韩国KOSPI截稿时尚未见官方收盘，报价为雅虎约13:10的最新价；黄金、原油、美股期货与汇率补充截至约13:20的公开行情；隔夜美股仍为美东11月19日常规交易收盘。本期邮箱新增两封热点财经邮件（11月20日早间08:10版、午间13:10版，均位于垃圾邮件）。凡标“邮件转述”的内容未逐条核实；其余已对照新华社、新华财经、央行授权发布、澎湃新闻、东方财富、界面新闻、财新、路透、彭博及公司公告转载等公开报道。13:00后的午后报价不作为午收使用。\n今日判断\n今天要先把低开的性质说清楚：这不是一次普通的风格轮动，而是隔夜美股把Anthropic上市交易成“卖事实”之后，日韩科技股把同一套定价继续往下传，A股开盘就把昨天科创50的局部高潮还了回去。已核实：上证开盘3527.30点，跌1.41%，上午最低探至3500.88点，跌2.15%；午收3521.40点，跌1.57%。深证午收10365.76点，跌2.05%；创业板2245.61点，跌2.08%，盘中最低2222.77点，一度跌超3%；科创50午收1236.38点，跌2.71%，昨天它是唯一收红的主指数，今天变成跌得最深的一条。上证50午收2722.76点，跌1.83%；沪深300午收3916.96点，跌1.70%；北证50相对抗跌，午收792.34点，跌0.79%。广度很差：东方财富Choice记全市场上涨690家、下跌4808家，31只涨停；界面新闻记6只跌停；澎湃引Wind为689家上涨、4807家下跌。可是半日成交并不冷，新华财经和东方财富都记沪深两市半日成交8558亿元，较上日同期放量约699亿元，已经相当于昨天全天约1.31万亿元的六成以上。今天又是11月第三个周五，是IF、IH、IC、IM\n2611合约的最后交易日暨交割日。金十11:31的早盘收盘快讯里，IF主力跌1.57%，IH跌1.63%，IC跌2.97%，IM跌2.70%。\n所以午间的结论很明确：3500.88是上午真实见到的低点，但不是已经确认的底部；放量也先只说明抛压被交易了，不说明增量已经转向做多。结构上，真正逆势的是PCB和部分农业，不是昨天的晶圆代工高潮，更不是高位算力主题的整体翻红。通富微电午收39.70元，跌9.94%，一度贴近跌停；长电科技跌6.42%；黄金ETF跌约5.3%。另一边，中京电子、超声电子涨停，真视通4连板，这是弱市里的局部抱团，容错率很低。港股同步走弱，恒生指数午收22451.91点，跌1.71%，盘中低见22333点；恒生科技跌3.14%，报3534.6点，一度失守3500点。网易跌17.92%，快手跌9.98%，腾讯跌1.38%；阿里巴巴因业绩午收涨4.28%，是少数例外，不能把它理解成港股科技已经修复。外盘在07:30之后还在恶化：日经225约13:10最新56483.07点，约跌5.0%，最低已低于今早的56703点；KOSPI最新约4862点，约跌5.37%，确认跌破5000点。美股期货截稿仍贴水，标普约跌0.57%，纳指约跌1.12%。对客户的含义是：先按防守框架处理，不要在交割日下午把PCB小票或4连板当成指数反转的信号。\n三大利多方向（由强到弱）\n一、银行、红利与宽基ETF的配置盘，仍是今天容错相对更高的底仓，但只适合持盈和回踩，不适合把盘中新高理解成风格反转。已核实：中国人民银行授权公布，11月1年期LPR为3.0%，5年期以上为3.5%，均未调整；新华社和央视都确认，这是连续第18个月保持不变。利率没有额外宽松，对银行息差至少是稳定，不是新的刺激。澎湃新闻午评和中国基金报早盘稿都写到，工商银行、建设银行、中信银行等盘中创出新高；工商银行上午最高9.20元，但午收9.09元，较昨收9.10元微跌0.11%。高点是盘中事实，收盘并没有把新高坐实。资金面上，澎湃据Wind统计，11月19日全市场1623只可统计股票型ETF（含跨境ETF）合计净流入488.67亿元，11月16日至19日四个交易日累计996.55亿元，前列仍是科创50ETF易方达和多只沪深300ETF。东方财富Choice把同日股票型净流入记为463.67亿元，单只前列数字一致、合计不同，应是样本口径差异，两套数字并列即可，不能把488亿写成已经统一的结论，更不能把它理解成货币基金或者成交额。制约也很清楚：今天是交割日，富时A50夜盘已收跌1.12%报12553点，日盘11:04见到12399点、跌2.33%。配置盘能解释为什么指数没有在3500下方加速崩，解释不了4800只下跌的账户感受。\n二、PCB和元件是今天盘面上唯一同时看到产业线索和涨停梯队的方向，但位置在弱市里被迅速抬高，只适合观察前排，不适合后排追涨。已核实：新华财经、澎湃和中国基金报都记满坤科技、中京电子、澳弘电子、超声电子等涨停。中京电子午收13.39元，涨10.02%，2连板；超声电子午收18.51元，涨9.98%，封住涨停。邮件转述把全球电路板短缺写成中期逻辑，公开报道的方向可以对上，但“持续至2028年年中”或“至少到2027年上半年”的期限并不完全一致，这里只把它当成产业背景，不把年限写成已裁定事实。它为什么重要：在指数低开、算力芯片和CPO都在调整的上午，资金没有回到中际旭创，也没有回到通富微电，而是把最快的涨停给了“带电子”的小板。对","en":"热点财经新闻综述｜2026-11-20·午间\n数据时点：A股、港股以11月20日午间收盘（北京时间11:30）为主；富时A50日盘引用汇通财经11:04的盘中报价，完整日盘收盘本档未取到；日经225与韩国KOSPI截稿时尚未见官方收盘，报价为雅虎约13:10的最新价；黄金、原油、美股期货与汇率补充截至约13:20的公开行情；隔夜美股仍为美东11月19日常规交易收盘。本期邮箱新增两封热点财经邮件（11月20日早间08:10版、午间13:10版，均位于垃圾邮件）。凡标“邮件转述”的内容未逐条核实；其余已对照新华社、新华财经、央行授权发布、澎湃新闻、东方财富、界面新闻、财新、路透、彭博及公司公告转载等公开报道。13:00后的午后报价不作为午收使用。\n今日判断\n今天要先把低开的性质说清楚：这不是一次普通的风格轮动，而是隔夜美股把Anthropic上市交易成“卖事实”之后，日韩科技股把同一套定价继续往下传，A股开盘就把昨天科创50的局部高潮还了回去。已核实：上证开盘3527.30点，跌1.41%，上午最低探至3500.88点，跌2.15%；午收3521.40点，跌1.57%。深证午收10365.76点，跌2.05%；创业板2245.61点，跌2.08%，盘中最低2222.77点，一度跌超3%；科创50午收1236.38点，跌2.71%，昨天它是唯一收红的主指数，今天变成跌得最深的一条。上证50午收2722.76点，跌1.83%；沪深300午收3916.96点，跌1.70%；北证50相对抗跌，午收792.34点，跌0.79%。广度很差：东方财富Choice记全市场上涨690家、下跌4808家，31只涨停；界面新闻记6只跌停；澎湃引Wind为689家上涨、4807家下跌。可是半日成交并不冷，新华财经和东方财富都记沪深两市半日成交8558亿元，较上日同期放量约699亿元，已经相当于昨天全天约1.31万亿元的六成以上。今天又是11月第三个周五，是IF、IH、IC、IM\n2611合约的最后交易日暨交割日。金十11:31的早盘收盘快讯里，IF主力跌1.57%，IH跌1.63%，IC跌2.97%，IM跌2.70%。\n所以午间的结论很明确：3500.88是上午真实见到的低点，但不是已经确认的底部；放量也先只说明抛压被交易了，不说明增量已经转向做多。结构上，真正逆势的是PCB和部分农业，不是昨天的晶圆代工高潮，更不是高位算力主题的整体翻红。通富微电午收39.70元，跌9.94%，一度贴近跌停；长电科技跌6.42%；黄金ETF跌约5.3%。另一边，中京电子、超声电子涨停，真视通4连板，这是弱市里的局部抱团，容错率很低。港股同步走弱，恒生指数午收22451.91点，跌1.71%，盘中低见22333点；恒生科技跌3.14%，报3534.6点，一度失守3500点。网易跌17.92%，快手跌9.98%，腾讯跌1.38%；阿里巴巴因业绩午收涨4.28%，是少数例外，不能把它理解成港股科技已经修复。外盘在07:30之后还在恶化：日经225约13:10最新56483.07点，约跌5.0%，最低已低于今早的56703点；KOSPI最新约4862点，约跌5.37%，确认跌破5000点。美股期货截稿仍贴水，标普约跌0.57%，纳指约跌1.12%。对客户的含义是：先按防守框架处理，不要在交割日下午把PCB小票或4连板当成指数反转的信号。\n三大利多方向（由强到弱）\n一、银行、红利与宽基ETF的配置盘，仍是今天容错相对更高的底仓，但只适合持盈和回踩，不适合把盘中新高理解成风格反转。已核实：中国人民银行授权公布，11月1年期LPR为3.0%，5年期以上为3.5%，均未调整；新华社和央视都确认，这是连续第18个月保持不变。利率没有额外宽松，对银行息差至少是稳定，不是新的刺激。澎湃新闻午评和中国基金报早盘稿都写到，工商银行、建设银行、中信银行等盘中创出新高；工商银行上午最高9.20元，但午收9.09元，较昨收9.10元微跌0.11%。高点是盘中事实，收盘并没有把新高坐实。资金面上，澎湃据Wind统计，11月19日全市场1623只可统计股票型ETF（含跨境ETF）合计净流入488.67亿元，11月16日至19日四个交易日累计996.55亿元，前列仍是科创50ETF易方达和多只沪深300ETF。东方财富Choice把同日股票型净流入记为463.67亿元，单只前列数字一致、合计不同，应是样本口径差异，两套数字并列即可，不能把488亿写成已经统一的结论，更不能把它理解成货币基金或者成交额。制约也很清楚：今天是交割日，富时A50夜盘已收跌1.12%报12553点，日盘11:04 巨大。昨天盘前IPO定价83，链上合约已经到102以上，这次链上合约又一次给开盘定价成功；\n2、但大盘没撑住，纳指高开低走盘中振幅巨大。个人看来，还是昨天下午提的这个问题“作为纯正的AI空投龙头，ANT上线交易后会把哪些板块资金注意力给吸走，毕竟龙头来了还不如去交易这个龙头”。一部分炒硬件、大云、软件saas的资金分仓位去炒ANT这个更直接。这跟SpaceX上市开盘后对整个太空经济板块吸血逻辑是一样。\n3、往后看spcx6月份上市先涨了四个交易日再开始大幅回落、这次ANT上市场环境并没有那么好，能涨几个交易日呢？这次解锁更快，27天之后就会迎来第一批解锁。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXibgyEbcAElK6C.jpg?name=orig"],"u":"https://x.com/qinbafrank/status/2123618772368114034","l":[],"ln":[],"t":[],"lk":4,"rt":0,"rp":2,"vw":3125},{"id":"2123618418058539037","h":"dmjk001","ts":1795145060,"zh":"传黄仁勋可能创立新半导体公司\n11月20日｜自11月12日英伟达宣布黄仁勋辞去CEO、总裁及董事职务以来，关于他下一步去向的猜测就从未停止。近日，一个更具冲击力的预测正在科技圈快速传播：黄仁勋可能不会重返英伟达，而是选择另起炉灶，创办一家全新的半导体公司。这一预测的核心来源是Semafor商业记者Rohan Goswami。他在11月18日播出的《Prof G Markets》节目中给出了一个相当笃定的判断：黄仁勋重返英伟达的概率“为零”。Goswami的理由是，英伟达董事会做出让黄仁勋离开的决定门槛极高——许多董事与他共事已长达30年，不可能仅凭外界声援或请愿就推翻决议。此外，英伟达是上市公司，大量员工的财富与公司股票深度绑定，很难复制OpenAI员工集体施压董事会、迫使奥特曼火速复职的剧本。在Goswami看来，黄仁勋“本质上是创建者”，他最合理的下一步是与长期支持他的朋友一起，筹集并投入高达500亿美元，创办一家新的企业。尽管Goswami的预测仅为记者判断，尚未得到黄仁勋本人或任何官方渠道的确认，但它之所以能迅速发酵，是因为它触及了一个更具想象空间的问题：如果黄仁勋真的创办一家新的芯片公司，他能否在AI芯片领域再造一个足以与英伟达竞争的玩家？","en":"传黄仁勋可能创立新半导体公司\n11月20日｜自11月12日英伟达宣布黄仁勋辞去CEO、总裁及董事职务以来，关于他下一步去向的猜测就从未停止。近日，一个更具冲击力的预测正在科技圈快速传播：黄仁勋可能不会重返英伟达，而是选择另起炉灶，创办一家全新的半导体公司。这一预测的核心来源是Semafor商业记者Rohan Goswami。他在11月18日播出的《Prof G Markets》节目中给出了一个相当笃定的判断：黄仁勋重返英伟达的概率“为零”。Goswami的理由是，英伟达董事会做出让黄仁勋离开的决定门槛极高——许多董事与他共事已长达30年，不可能仅凭外界声援或请愿就推翻决议。此外，英伟达是上市公司，大量员工的财富与公司股票深度绑定，很难复制OpenAI员工集体施压董事会、迫使奥特曼火速复职的剧本。在Goswami看来，黄仁勋“本质上是创建者”，他最合理的下一步是与长期支持他的朋友一起，筹集并投入高达500亿美元，创办一家新的企业。尽管Goswami的预测仅为记者判断，尚未得到黄仁勋本人或任何官方渠道的确认，但它之所以能迅速发酵，是因为它触及了一个更具想象空间的问题：如果黄仁勋真的创办一家新的芯片公司，他能否在AI芯片领域再造一个足以与英伟达竞争的玩家？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123618418058539037","l":[],"ln":[],"t":["AI科技"],"lk":1,"rt":0,"rp":0,"vw":911},{"id":"2123616590612554213","h":"TJ_Research","ts":1795144624,"zh":"市场怎么了？情绪面极低！","en":"市场怎么了？情绪面极低！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TJ_Research/status/2123616590612554213","l":["x.com"],"l 9970","h":"fxtrader","ts":1795143192,"zh":"#讨论 今年内，Anthropic会跌破发行价吗？ $ANT\n（2026年还剩28个交易日）","en":"#讨论 今年内，Anthropic会跌破发行价吗？ $ANT\n（2026年还剩28个交易日）","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123610585174769970","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":1,"vw":2160},{"id":"2123609971984400827","h":"ShanghaoJin","ts":1795143046,"zh":"写一段历史冷知识：“溜须”典故，北宋宰相丁谓\n丁谓早年受寇准赏识、提携，后来官至参知政事。一次两人吃饭，寇准胡须沾了汤，丁谓赶紧起身替他擦拭\n寇准却笑道：“堂堂参政，怎么替上司擦胡子呢？”\n一句玩笑，丁谓却觉得颜面扫地。后来轮到丁谓得势掌权，立即借机排挤、构陷寇准，将昔日恩人一贬再贬，到岭南荒蛮之地\n小人心中永远充满自卑。寇准怎么做、怎么说，他都觉得人家打心底看不起他。你以为是一句玩笑，却是他记成一辈子的仇。必须置寇准于死地不可。丁谓心里其实总是活在寇准影子里，不把他踩脚下，心中自卑永远过不去\n说实话，这种蟑螂其实自己也很可怜。但谁被缠上，往往真是很无奈","en":"写一段历史冷知识：“溜须”典故，北宋宰相丁谓\n丁谓早年受寇准赏识、提携，后来官至参知政事。一次两人吃饭，寇准胡须沾了汤，丁谓赶紧起身替他擦拭\n寇准却笑道：“堂堂参政，怎么替上司擦胡子呢？”\n一句玩笑，丁谓却觉得颜面扫地。后来轮到丁谓得势掌权，立即借机排挤、构陷寇准，将昔日恩人一贬再贬，到岭南荒蛮之地\n小人心中永远充满自卑。寇准怎么做、怎么说，他都觉得人家打心底看不起他。你以为是一句玩笑，却是他记成一辈子的仇。必须置寇准于死地不可。丁谓心里其实总是活在寇准影子里，不把他踩脚下，心中自卑永远过不去\n说实话，这种蟑螂其实自己也很可怜。但谁被缠上，往往真是很无奈","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/ShanghaoJin/status/2123609971984400827","l":[],"ln":[],"t":[],"lk":18,"rt":0,"rp":1,"vw":3452},{"id":"2123609054962405519","h":"AntonLaVay","ts":1795142828,"zh":"政治内斗，一般有两种结果。\n1. 政治僵局，对抗国会。整个国家的立法和政策制定陷入瘫痪，议会对抗总统，总统对抗议会。但是就公司而言，这并不一定很糟，因为这意味着相当长的一段时间里，政策都不会有什么变动，没有人能改变现状，所以一直维持现状。\n这对股市不一定差，至少政策预期是稳定的。\n2. 政治失序，进入你死我活的政治斗争阶段。各方不仅无法达成协议，也不敢假设对方的底线，Fair play彻底破产，只有原始残暴的政治清算。\nJensen Huang在中选结束不到半个月内被猎杀。\nAMD在昨天被用枪指头指控：“Has Its Own China Problem”\n都在指向，现实是失序而不是僵局。","en":"政治内斗，一般有两种结果。\n1. 政治僵局，对抗国会。整个国家的立法和政策制定陷入瘫痪，议会对抗总统，总统对抗议会。但是就公司而言，这并不一定很糟，因为这意味着相当长的一段时间里，政策都不会有什么变动，没有人能改变现状，所以一直维持现状。\n这对股市不一定差，至少政策预期是稳定的。\n2. 政治失序，进入你死我活的政治斗争阶段。各方不仅无法达成协议，也不敢假设对方的底线，Fair play彻底破产，只有原始残暴的政治清算。\nJensen Huang在中选结束不到半个月内被猎杀。\nAMD在昨天被用枪指头指控：“Has Its Own China Problem”\n都在指向，现实是失序而不是僵局。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/AntonLaVay/status/2123609054962405519","l":[],"ln":[],"t":[],"lk":12,"rt":0,"rp":0,"vw":1645},{"id":"2123608779157864540","h":"TheMarketMemo","ts":1795142762,"zh":"金銀 。\n如果按照民主党上来就想刺破泡沫确保股灾发生在川普任内反而思路打开很多事就好做了，形式比人强，思维转换要快。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123594101149077746","l":[],"ln":[],"t":["关税贸易"],"lk":12,"rt":0,"rp":3,"vw":2555},{"id":"2123593116309758075","h":"cnfinancewatch","ts":1795139028,"zh":"权力的游戏\n也是经营恐惧感的游戏","en":"权力的游戏\n也是经营恐惧感的游戏","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123592996478455808/vid/avc1/1024x576/ixAuqVj9HGwwNW4x.mp4?tag=29"],"u":"https://x.com/cnfinancewatch/status/2123593116309758075","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":1358},{"id":"2123592240409018373","h":"fxtrader","ts":1795138819,"zh":"#行情 台湾加权指数跌幅扩大至5%。","en":"#行情 台湾加权指数跌幅扩大至5%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123592240409018373","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":3017},{"id":"2123592144086880284","h":"nytchinese","ts":1795138796,"zh":"Anthropic创纪录IPO，中国投资者再被排除在外。这是史上最大的首次公开募股。此前，SpaceX和OpenAI进行IPO时也将中国投资者拒之门外。随着中美在人工智能领域争夺霸权，双方都在为其本土技术划定红线。","en":"Anthropic创纪录IPO，中国投资者再被排除在外。这是史上最大的首次公开募股。此前，SpaceX和OpenAI进行IPO时也将中国投资者拒之门外。随着中美在人工智能领域争夺霸权，双方都在为其本土技术划定红线。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/nytchinese/status/2123592144086880284","l":["cn.nytimes.com"],"ln":[{"u":"https://cn.nytimes.com/business/20261120/anthropic-ipo-china-hong-kong/?utm_source=tw-nytimeschinese&utm_medium=social&utm_campaign=cur","d":"cn.nytimes.com"}],"t":["AI科技"],"lk":6,"rt":1,"rp":1,"vw":2702},{"id":"2123591971000442990","h":"CEOBriefing","ts":1795138754,"zh":"突发：AI排华事件正逐渐失控…如今，黄仁勋需要解释的，恐怕不仅是GPU架构那么简单。除了卢比奥、贝森特等政客广为人知，离奇的是，还有很多学者和作家参与。譬如哈佛教授Joseph G. Allen，在X上写的是“黄仁勋才是那个间谍”。这种严重指控，是在没有任何证据的情况下发生的。","en":"突发：AI排华事件正逐渐失控…如今，黄仁勋需要解释的，恐怕不仅是GPU架构那么简单。除了卢比奥、贝森特等政客广为人知，离奇的是，还有很多学者和作家参与。譬如哈佛教授Joseph G. Allen，在X上写的是“黄仁勋才是那个间谍”。这种严重指控，是在没有任何证据的情况下发生的。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123590893722570752/vid/avc1/1320x668/lKJ5qQhipfQkCsWr.mp4?tag=29"],"u":"https://x.com/CEOBriefing/status/2123591971000442990","l":[],"ln":[],"t":[],"lk":33,"rt":6,"rp":2,"vw":7903},{"id":"2123591386050285837","h":"cnfinancewatch","ts":1795138615,"zh":"AI链再平衡，国产替代走强\n在强美元的外部压制下，今日A股呈现“指数分化、个股普跌”：沪指微跌0.28%，科创50逆势上涨1.83%，市场成交额萎缩至1.31万亿元、续创年内新低，近4900只个股下跌。“地量”叠加普跌，反映买盘实质性缺失，存量博弈陷入困局。\n盘面的核心博弈发生在科技内部：美国出口管制新规反向利好国产替代，却打击境外算力依赖，存量资金在AI链条内“再平衡”，半导体、通信设备表现抗跌，算力租赁、IT服务则重挫。同时资金向家电、食品饮料等低估值板块收缩避险，有色则受强美元与金价大跌拖累。资金面的关键变化在ETF端：宽基ETF全天在午盘前与尾盘两次集中买入，力度明显强于前两日的尾盘单次脉冲，但托底只守住下沿、未能拉起指数，个股层面亦无资金承接——资金买的是指数，没有买成“赚钱效应”，这正是存量困局的注脚。\n“地量”往往意味着变盘临近，但右侧信号尚未出现。在套牢筹码未释放、增量资金未入场的环境中，资金只向有真实订单的硬件端集中，远期叙事的容错空间被压至极致——“地量”之后，拼的或许不是方向判断，而是谁能等到量能回归。","en":"AI链再平衡，国产替代走强\n在强美元的外部压制下，今日A股呈现“指数分化、个股普跌”：沪指微跌0.28%，科创50逆势上涨1.83%，市场成交额萎缩至1.31万亿元、续创年内新低，近4900只个股下跌。“地量”叠加普跌，反映买盘实质性缺失，存量博弈陷入困局。\n盘面的核心博弈发生在科技内部：美国出口管制新规反向利好国产替代，却打击境外算力依赖，存量资金在AI链条内“再平衡”，半导体、通信设备表现抗跌，算力租赁、IT服务则重挫。同时资金向家电、食品饮料等低估值板块收缩避险，有色则受强美元与金价大跌拖累。资金面的关键变化在ETF端：宽基ETF全天在午盘前与尾盘两次集中买入，力度明显强于前两日的尾盘单次脉冲，但托底只守住下沿、未能拉起指数，个股层面亦无资金承接——资金买的是指数，没有买成“赚钱效应”，这正是存量困局的注脚。\n“地量”往往意味着变盘临近，但右侧信号尚未出现。在套牢筹码未释放、增量资金未入场的环境中，资金只向有真实订单的硬件端集中，远期叙事的容错空间被压至极致——“地量”之后，拼的或许不是方向判断，而是谁能等到量能回归。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123591386050285837","l":[],"ln":[],"t":["A股港股","AI科技","关税贸易","黄金"],"lk":0,"rt":0,"rp":1,"vw":951},{"id":"2123590587832283159","h":"cnfinancewatch","ts":1795138425,"zh":"标普500今天跌破了7月份的平台位置！\n我们核心的微盘股指数昨天也刚刚跌破7月份的成交密集区，目前政策底已经明确了，需要通过微盘股补跌到位，才能形成市场底和12月来年经济工作中释放出来的消息，引发的情绪底。\n513330恒生互联网周线，周线是我们定位投入资源最关键的风控点，昨天中金公司对于腾讯大幅度从666港元目标位置下调到470港元。\n就在开盘前中金也大幅度下调了阿里巴巴的目标价128港元。\n在低位大幅度下调这两家最重要权重公司，有利于利空的尽快出清，保持好心态，股价在低位重来都是利空为主，我们怕的是不确定，中金总算接近一年时间同时大幅调整了他们的目标价格。","en":"标普500今天跌破了7月份的平台位置！\n我们核心的微盘股指数昨天也刚刚跌破7月份的成交密集区，目前政策底已经明确了，需要通过微盘股补跌到位，才能形成市场底和12月来年经济工作中释放出来的消息，引发的情绪底。\n513330恒生互联网周线，周线是我们定位投入资源最关键的风控点，昨天中金公司对于腾讯大幅度从666港元目标位置下调到470港元。\n就在开盘前中金也大幅度下调了阿里巴巴的目标价128港元。\n在低位大幅度下调这两家最重要权重公司，有利于利空的尽快出清，保持好心态，股价在低位重来都是利空为主，我们怕的是不确定，中金总算接近一年时间同时大幅调整了他们的目标价格。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXiCYVYboAAOmR4.jpg?name=orig","https://pbs.twimg.com/media/HXiCYVjaQAAVK7G.jpg?name=orig","https://pbs.twimg.com/media/HXiCYVWaIAAh5Ar.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2123590587832283159","l":[],"ln":[],"t":["美股","A股港股"],"lk":1,"rt":0,"rp":1,"vw":1974},{"id":"2123590167529414807","h":"Balder13946731","ts":1795138324,"zh":"今晚的视频复盘：标普高开 0.9%、收跌 2%，开盘就是全天最高点。讲了负 Gamma 为什么会把高开变成大跌，还有昨天两张财报雷达卡的结果。","en":"今晚的视频复盘：标普高开 0.9%、收跌 2%，开盘就是全天最高点。讲了负 Gamma 为什么会把高开变成大跌，还有昨天两张财报雷达卡的结果。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/Balder13946731/status/2123590167529414807","l":["youtu.be"],"ln":[{"u":"https://youtu.be/OkxAFzV2I1I","d":"youtu.be"}],"t":["美股","财报"],"lk":0,"rt":0,"rp":0,"vw":577},{"id":"2123590145307988132","h":"bboczeng","ts":1795138319,"zh":"当然和黄仁勋的婚外情无关，\n是因为黄仁勋明显看到自己订的存储和台积电产能用不完了，估计才孤注一掷和阿里巴巴媾和\nAMD也是一样\n这里反映的都不是什么排华的问题，完全是库存问题！\n这一次，都是空头Burry是真的对了","en":"当然和黄仁勋的婚外情无关，\n是因为黄仁勋明显看到自己订的存储和台积电产能用不完了，估计才孤注一掷和阿里巴巴媾和\nAMD也是一样\n这里反映的都不是什么排华的问题，完全是库存问题！\n这一次，都是空头Burry是真的对了","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bboczeng/status/2123590145307988132","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":413},{"id":"2123588861687402538","h":"fxtrader","ts":1795138013,"zh":"#行情 A股开盘，上证指数低开1.41%，深证成指低开1.71%，创业板指低开2.15%。","en":"#行情 A股开盘，上证指数低开1.41%，深证成指低开1.71%，创业板指低开2.15%。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/fxtrader/status/2123588861687402538","l":[],"ln":[],"t":["A股港股"],"lk":4,"rt":0,"rp":0,"vw":1377},{"id":"2123585145567658294","h":"fxtrader","ts":1795137127,"zh":"继英伟达后，AMD成为被做空目标。Hunterbrook Capital发布调查报告，提出三大指控，质疑AMD存在与中国受美国制裁企业的业务关联，以及AI业务中存在潜在的循环融资风险。\n第一项指控是，被美国拉黑的中国服务器制造商浪潮信息，旗下服务器仍然在持续使用AMD的新版本固件。与Maginfra、Kaytus和Aivres的三家关联企业也使用了几乎相同的AMD固件。（Hunterbrook承认不能证明AMD违反了出口管制规定）\n第二项指控是，AMD与中国受制裁芯片企业存在收入联系。通过对比海光此前的招股书及财报，发现相关款项与AMD的知识产权授权费用记录吻合。推断AMD仍在从这两家中国合资企业获得知识产权授权收益。估算2021—2025 年累计支付约2.7亿美元，与AMD披露的同期约 2.63 亿美元授权收益接近。\n第三项指控是，AMD的AI业务可能存在循环融资。AMD向客户与合作伙伴作出的承诺规模已远超英伟达，而其现金储备却相对不足。警告如果围绕英伟达的相关风险持续发酵、演变为AI基础设施建设的一场更大危机，AMD将难以幸免。\nAMD盘中一度大跌11%，尾盘收窄跌幅，但盘后继续下跌。\nAMD对此回应称，Hunterbrook的指控歪曲了AMD的业务实践与合作关系。","en":"继英伟达后，AMD成为被做空目标。Hunterbrook Capital发布调查报告，提出三大指控，质疑AMD存在与中国受美国制裁企业的业务关联，以及AI业务中存在潜在的循环融资风险。\n第一项指控是，被美国拉黑的中国服务器制造商浪潮信息，旗下服务器仍然在持续使用AMD的新版本固件。与Maginfra、Kaytus和Aivres的三家关联企业也使用了几乎相同的AMD固件。（Hunterbrook承认不能证明AMD违反了出口管制规定）\n第二项指控是，AMD与中国受制裁芯片企业存在收入联系。通过对比海光此前的招股书及财报，发现相关款项与AMD的知识产权授权费用记录吻合。推断AMD仍在从这两家中国合资企业获得知识产权授权收益。估算2021—2025 年累计支付约2.7亿美元，与AMD披露的同期约 2.63 亿美元授权收益接近。\n第三项指控是，AMD的AI业务可能存在循环融资。AMD向客户与合作伙伴作出的承诺规模已远超英伟达，而其现金储备却相对不足。警告如果围绕英伟达的相关风险持续发酵、演变为AI基础设施建设的一场更大危机，AMD将难以幸免。\nAMD盘中一度大跌11%，尾盘收窄跌幅，但盘后继续下跌。\nAMD对此回应称，Hunterbrook的指控歪曲了AMD的业务实践与合作关系。","zh_src":"native","lang":"zh","m":["https://video.twimg.com/amplify_video/2123580444113608704/vid/avc1/1532x1328/98wodbhdGs_IBJcb.mp4?tag=29","https://pbs.twimg.com/media/HXh6rgubYAARHWW.jpg?name=orig","https://pbs.twimg.com/media/HXh6uDubcAA-D6a.jpg?name=orig","https://pbs.twimg.com/media/HXh7_n3bYAAGKM_.jpg?name=orig"],"u":"https://x.com/fxtrader/status/2123585145567658294","l":[],"ln":[],"t":["AI科技","财报","关税贸易"],"lk":15,"rt":2,"rp":2,"vw":4664},{"id":"2123584304529981484","h":"TraderS18","ts":1795136927,"zh":"障眼法还在继续，即使抛开 ANT 本身高开低走不谈，谁能想到借着 ANT 在台前吸引眼球，后面 AMD 突然给你来个大跳水再次引发崩盘呢","en":"障眼法还在继续，即使抛开 ANT 本身高开低走不谈，谁能想到借着 ANT 在台前吸引眼球，后面 AMD 突然给你来个大跳水再次引发崩盘呢","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/TraderS18/status/2123584304529981484","l":[],"ln":[],"t":[],"lk":6,"rt":1,"rp":1,"vw":3115},{"id":"2123582297139986527","h":"ReutersChina","ts":1795136448,"zh":"美国众议院外交事务委员会周四表示，特朗普政府批准从 2025 年 12 月到 2026 年 5 月向中国企业运送近 90 万个由 Nvidia 和 AMD 制造的先进人工智能芯片。","en":"The Trump administration approved shipments of nearly 900,000 advanced AI chips made by Nvidia and AMD for Chinese companies from December 2025 through May 2026, the House Foreign Affairs Committee said on Thursday.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/ReutersChina/status/2123582297139986527","l":["reuters.com"],"ln":[{"u":"https://www.reuter ,"ts":1795134341,"zh":"1. 通富微电：给 AMD 封装测试芯片，干了大部分后道工序（命脉供应商）。\n2. 海光：AMD 的合资伙伴，已被美国拉黑，但每年还给 AMD 交几千万美元许可费。\n3. 浪潮系（IEIT/Aivres 等）：用 AMD 芯片做服务器，被拉黑后疑似通过关联公司继续拿 AMD 的技术。\n4. 中科曙光（Cancon）：被拉黑的公司，产品却出现在 AMD 官网目录里。","en":"1. 通富微电：给 AMD 封装测试芯片，干了大部分后道工序（命脉供应商）。\n2. 海光：AMD 的合资伙伴，已被美国拉黑，但每年还给 AMD 交几千万美元许可费。\n3. 浪潮系（IEIT/Aivres 等）：用 AMD 芯片做服务器，被拉黑后疑似通过关联公司继续拿 AMD 的技术。\n4. 中科曙光（Cancon）：被拉黑的公司，产品却出现在 AMD 官网目录里。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123573457694929206","l":[],"ln":[],"t":["AI科技"],"lk":2,"rt":0,"rp":0,"vw":1004},{"id":"2123572944739897597","h":"cnfinancewatch","ts":1795134218,"zh":"三大利空方向（由强到弱）\n一、AI交易的定价权已经从“上市催化”回到“回报能不能覆盖投入”，这是今天外部最硬的空头约束。已核实：Anthropic开盘后指数很快打到日内最低。科技巨头按市值排列，苹果跌0.92%，微软跌1.78%，英伟达跌3.3%，谷歌C跌2.93%，亚马逊跌3.87%，SpaceX跌3.53%，Meta跌3.27%，特斯拉跌2.43%。费城半导体30只成分股仅英特尔、高通和Coherent三家收涨。做空机构Hunterbrook盘中宣布做空AMD，并警告其存在与英伟达类似的“循环交易”，这是空头指控，不是已裁决事实，但AMD收跌7.72%，说明市场愿意给这个叙事定价。网络安全是少数逆势，Palo\nAlto Networks涨6.42%，因其前一日季度业绩超预期并上调全年指引。纳斯达克金龙指数跌1.86%，网易跌11.39%。对A股的直接映射，是昨天已经退潮的国产GPU和算力租赁可能继续被核：燧原科技20厘米跌停，沐曦股份跌超14%，摩尔线程跌8.34%，海光信息、寒武纪也下跌。共进股份、星网锐捷昨天已经跌停。今天若再低开，先要分清哪些是代工和材料的产业票，哪些是高位主题票，不能再混为一谈。\n二、利率和流动性约束不但没有解除，反而被会议纪要和公开表态重新钉死，贵金属已经先倒下。已核实：美联储10月会议以10比2维持3.75%至4.00%的利率区间，库克理事和克利夫兰联储主席哈马克主张加息25个基点。纪要显示，几乎所有与会者认为，按基准情景，为把通胀及时拉回2%，后续进一步加息可能是合适的；部分委员在会上就主张加息25个基点，少数委员还提到12月或需要更大的加息幅度。纪要同时把人工智能写成通胀和金融稳定的风险来源，并提醒表外租赁和循环融资可能放大亏损。理事沃勒11月18日对CNBC表示，通胀“正朝错误方向走，而且在扩散”，12月8日至9日的会议可能需要一次50个基点的加息“震惊市场”；若只加25个基点，则需明确释放明年1月再加息的信号。期货此前已充分计价12月加25个基点并预期1月再动一次，沃勒的表态是把上沿打开，不是把加息从零写成必然。现货黄金11月19日盘中跌破3620美元，最低3619.81美元，收跌2.7%报3624.4美元；现货白银收跌4.83%报42.88美元。WTI原油收83.21美元，跌0.06%；布伦特收91.98美元，涨0.03%，油价本身不是主摔的资产，金和银才是。邮件把Comex黄金写成收跌3.16%报3736.80美元，对应的是更早一轮跌势，不能和19日夜盘收盘混用。对A股，黄金和有色昨天已经承压，紫金矿业成交额高达99.20亿元，今天还要面对外盘补跌的风险。\n三、A股内部的亏钱效应比指数更危险，今天又是交割日，微盘和高位题材的负反馈还没有收敛。已核实：影视院线、数字媒体和厨卫电器跌幅居前，慈文传媒、横店影视、金逸影视、文投控股跌停，冰雪经济里龙江交通、冰山冷热、长白山等跌停。北证50有复盘口径显示跌近4%。连续多个交易日超过四千只个股下跌，社区称之为“六连冰”。成交再缩到约1.31万亿元，说明不是大举换手后的见底，而是增量不愿入场、存量也不愿意加价。邮件转述三星拟在CES\n2027发布两款人形机器人、马斯克更新Optimus进展，这能解释九阳、襄阳轴承一类主题为什么还能脉冲，但解释不了为什么同一天里跌停家数远多于涨停。今天的约束是：低开之后如果跌停继续扩容，银行和红利也会被倒逼着提供流动性；如果只是指数低开、结构还在，才有条件重新讨论代工和材料的回踩。在看到量能和跌停家数收敛之前，先把仓位和预期都降下来。\n（来源：新华社、财联社、中国证券报、每经、21世纪经济报道、金十数据、公司公告、CNBC等公开报道，以及本期晚间热点财经邮件中已标明的转述线索。以上内容仅供参考，不构成投资建议，市场有风险，决策需谨慎。）","en":"三大利空方向（由强到弱）\n一、AI交易的定价权已经从“上市催化”回到“回报能不能覆盖投入”，这是今天外部最硬的空头约束。已核实：Anthropic开盘后指数很快打到日内最低。科技巨头按市值排列，苹果跌0.92%，微软跌1.78%，英伟达跌3.3%，谷歌C跌2.93%，亚马逊跌3.87%，SpaceX跌3.53%，Meta跌3.27%，特斯拉跌2.43%。费城半导体30只成分股仅英特尔、高通和Coherent三家收涨。做空机构Hunterbrook盘中宣布做空AMD，并警告其存在与英伟达类似的“循环交易”，这是空头指控，不是已裁决事实，但AMD收跌7.72%，说明市场愿意给这个叙事定价。网络安全是少数逆势，Palo\nAlto Networks涨6.42%，因其前一日季度业绩超预期并上调全年指引。纳斯达克金龙指数跌1.86%，网易跌11.39%。对A股的直接映射，是昨天已经退潮的国产GPU和算力租赁可能继续被核：燧原科技20厘米跌停，沐曦股份跌超14%，摩尔线程跌8.34%，海光信息、寒武纪也下跌。共进股份、星网锐捷昨天已经跌停。今天若再低开，先要分清哪些是代工和材料的产业票，哪些是高位主题票，不能再混为一谈。\n二、利率和流动性约束不但没有解除，反而被会议纪要和公开表态重新钉死，贵金属已经先倒下。已核实：美联储10月会议以10比2维持3.75%至4.00%的利率区间，库克理事和克利夫兰联储主席哈马克主张加息25个基点。纪要显示，几乎所有与会者认为，按基准情景，为把通胀及时拉回2%，后续进一步加息可能是合适的；部分委员在会上就主张加息25个基点，少数委员还提到12月或需要更大的加息幅度。纪要同时把人工智能写成通胀和金融稳定的风险来源，并提醒表外租赁和循环融资可能放大亏损。理事沃勒11月18日对CNBC表示，通胀“正朝错误方向走，而且在扩散”，12月8日至9日的会议可能需要一次50个基点的加息“震惊市场”；若只加25个基点，则需明确释放明年1月再加息的信号。期货此前已充分计价12月加25个基点并预期1月再动一次，沃勒的表态是把上沿打开，不是把加息从零写成必然。现货黄金11月19日盘中跌破3620美元，最低3619.81美元，收跌2.7%报3624.4美元；现货白银收跌4.83%报42.88美元。WTI原油收83.21美元，跌0.06%；布伦特收91.98美元，涨0.03%，油价本身不是主摔的资产，金和银才是。邮件把Comex黄金写成收跌3.16%报3736.80美元，对应的是更早一轮跌势，不能和19日夜盘收盘混用。对A股，黄金和有色昨天已经承压，紫金矿业成交额高达99.20亿元，今天还要面对外盘补跌的风险。\n三、A股内部的亏钱效应比指数更危险，今天又是交割日，微盘和高位题材的负反馈还没有收敛。已核实：影视院线、数字媒体和厨卫电器跌幅居前，慈文传媒、横店影视、金逸影视、文投控股跌停，冰雪经济里龙江交通、冰山冷热、长白山等跌停。北证50有复盘口径显示跌近4%。连续多个交易日超过四千只个股下跌，社区称之为“六连冰”。成交再缩到约1.31万亿元，说明不是大举换手后的见底，而是增量不愿入场、存量也不愿意加价。邮件转述三星拟在CES\n2027发布两款人形机器人、马斯克更新Optimus进展，这能解释九阳、襄阳轴承一类主题为什么还能脉冲，但解释不了为什么同一天里跌停家数远多于涨停。今天的约束是：低开之后如果跌停继续扩容，银行和红利也会被倒逼着提供流动性；如果只是指数低开、结构还在，才有条件重新讨论代工和材料的回踩。在看到量能和跌停家数收敛之前，先把仓位和预期都降下来。\n（来源：新华社、财联社、中国证券报、每经、21世纪经济报道、金十数据、公司公告、CNBC等公开报道，以及本期晚间热点财经邮件中已标明的转述线索。以上内容仅供参考，不构成投资建议，市场有风险，决策需谨慎。）","zh_src":"native","lang":"ja","m":[],"u":"https://x.com/cnfinancewatch/status/2123572944739897597","l":[],"ln":[],"t":["美联储","通胀","美股","原油能源","AI科技","黄金"],"lk":1,"rt":0,"rp":0,"vw":479},{"id":"2123572940449190194","h":"cnfinancewatch","ts":1795134217,"zh":"三、必选消费与云业务的盈利验证还在，但它是中期逻辑，不是今天用来对抗低开的武器。已核实：沃尔玛截至10月31日的第三财季营收1888.35亿美元，同比增5.2%，略高于分析师预期的1872.7亿美元；调整后每股收益0.65美元，略高于预期的0.64美元；营业利润77.7亿美元，同比增16%。中国市场按固定汇率净销售79亿美元，同比增28.5%，可比销售增14.3%，电商增31%。公司年内第三次上调指引，全年净销售增速调至4.9%至5.2%，调整后每股收益调至2.84至2.89美元。但沃尔玛当天仍收跌1.04%，报126.04美元，说明即便是质量较高的零售财报，也挡不住风险偏好回落。阿里巴巴2027财年第二季度收入2715.19亿元，同比增10%；阿里云外部商业化收入同比增64%，经常性收入（不含算力设备解决方案）同比增67%，经调整EBITA同比增121%，利润率升至14.5%，AI相关产品收入连续第13个季度三位数增长。同时，资本开支走高，自由现金流阶段性承压。拼多多第三季度营收1083亿元，归母净利295亿元，大致持平去年的293亿元，美股收涨11.04%，是中概股里少有的例外。对A股的含义是：美的、格力这类有盈利和分红的龙头，比高位小家电更经得起波动；云和AI需求没有消失，但投入正在改写利润表。九阳股份昨天再次走出地天板，盘中炸板超16次，收31.21元，已经连续三个交易日在地天板和天地板之间切换，这一端不是消费逻辑，是情绪投机，今天必须拆开看。","en":"三、必选消费与云业务的盈利验证还在，但它是中期逻辑，不是今天用来对抗低开的武器。已核实：沃尔玛截至10月31日的第三财季营收1888.35亿美元，同比增5.2%，略高于分析师预期的1872.7亿美元；调整后每股收益0.65美元，略高于预期的0.64美元；营业利润77.7亿美元，同比增16%。中国市场按固定汇率净销售79亿美元，同比增28.5%，可比销售增14.3%，电商增31%。公司年内第三次上调指引，全年净销售增速调至4.9%至5.2%，调整后每股收益调至2.84至2.89美元。但沃尔玛当天仍收跌1.04%，报126.04美元，说明即便是质量较高的零售财报，也挡不住风险偏好回落。阿里巴巴2027财年第二季度收入2715.19亿元，同比增10%；阿里云外部商业化收入同比增64%，经常性收入（不含算力设备解决方案）同比增67%，经调整EBITA同比增121%，利润率升至14.5%，AI相关产品收入连续第13个季度三位数增长。同时，资本开支走高，自由现金流阶段性承压。拼多多第三季度营收1083亿元，归母净利295亿元，大致持平去年的293亿元，美股收涨11.04%，是中概股里少有的例外。对A股的含义是：美的、格力这类有盈利和分红的龙头，比高位小家电更经得起波动；云和AI需求没有消失，但投入正在改写利润表。九阳股份昨天再次走出地天板，盘中炸板超16次，收31.21元，已经连续三个交易日在地天板和天地板之间切换，这一端不是消费逻辑，是情绪投机，今天必须拆开看。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2123572940449190194","l":[],"ln":[],"t":["美股","汇率","AI科技","财报"],"lk":1,"rt":0,"rp":2,"vw":533},{"id":"2123572936149983381","h":"cnfinancewatch","ts":1795134216,"zh":"今日判断\n今天的关键不是昨天科创50红了没有，而是隔夜美股把Anthropic上市这笔“最大IPO”交易成了一次卖事实。已核实：Anthropic发行9.8亿股、定价83美元，公开募资约813亿美元，超过今年6月SpaceX创下的纪录；另有约260亿美元私募，合计约1073亿美元。股票代码ANT于11月19日在纳斯达克开盘报111.50美元，较发行价高约34%，盘中一度约115.10美元、涨约39%，收97.17美元，仍较发行价涨17.07%，但较开盘价回落约12.9%，完全稀释市值约1.8万亿美元。指数没有留下这份热度。三大指数高开低走，均跌超2%：道指跌1101.11点、跌2.19%，收49097.06点，为5月5日以来最低，也是6月以来首次收在5万点下方；标普500跌2.02%，收7175.83点，连跌六个交易日；纳指跌2.25%，收23879.20点。标普与纳指同创4月以来收盘新低。VIX收涨15.8%报28.44，盘中触及29.13，为4月1日以来最高。Miller\nTabak策略师马特·马利的概括很直白：市场上出现了“买预期、卖事实”，催化因素已经兑现。\nA股昨天已经先走完自己的结构分化，没有能力再去接隔夜这一棒。已核实：上证跌0.28%报3577.62点，深成指跌0.71%报10583.20点，创业板跌0.79%报2293.34点，科创50逆势涨1.83%报1270.78点，上证50尾盘拉回涨0.32%。沪深成交约1.31万亿元，金十口径为13051.47亿元，较上日缩约646亿元，再创年内地量。21财经雷达统计，沪深两市638只上涨、4532只下跌，28只涨停、83只跌停；连板网与淘股吧复盘把全部A股记为上涨649家、下跌4876家，涨停23家、跌停68家，炸板率约51%。口径不同，方向一致：指数跌得不多，账户很难过关。港股更弱，恒生指数跌1.95%报22841.62点，恒生科技跌2.33%报3649.14点，腾讯收跌6.55%。富时A50连续夜盘收跌1.12%报12553点，指数端今早有低开压力。所以今天的基调很清楚：不要把昨天晶圆代工和光刻胶的局部高潮，理解成成长风格已经翻过来；更不要把隔夜史上最大IPO，当成A股算力链的开盘加仓信号。先看低开后的承接，再谈结构。相对更稳的仍是银行红利和宽基配置盘；半导体制造只作为事件余波观察，开盘不追昨天已经大涨的方向。\n三大利多方向（由强到弱）\n一、银行、红利与宽基ETF的配置盘，是今天容错相对更高的底仓，但只适合持盈和回踩，不适合把尾盘拉升理解成反转。已核实：11月19日临近收盘，科创50与上证50发力，上证跌幅收窄。中国证券报报道，多只宽基ETF尾盘约15分钟放量，科创50ETF易方达（588080）成交127.25亿元，创上市以来第三高、较上日放量超4倍；中证500ETF南方、科创50ETF华夏、创业板ETF易方达、沪深300ETF华夏全天成交均超过百亿元；沪深300ETF嘉实较上日放量超8倍。机场航运、白酒和国有大型银行等板块相对抗跌，券商股尾盘也有拉升。邮件转述称沪深300ETF与创业板ETF近5日净流入超100亿元，我们未独立核对全部申赎细节，只把它当成护盘线索，不是已经确认的增量反转。制约很明确：今天是11月第三个周五，也是期指交割日，又叠着A50夜盘低开，尾盘的ETF放量只能说明有资金不愿砸在地板上，不能说明增量已经进场。银行和红利适合作为低开后的防守框架，高位个股内部已经分化，邮件转述里阳光照明跌停，说明这条线也不是铁板一块。\n二、半导体制造、先进封装与材料，仍是昨天盘面里唯一能同时看到产业逻辑和真金白银的方向，但位置已经抬高，今天只观察、不追高。已核实：中芯国际涨6.21%、成交104.96亿元，华虹公司涨8.05%、成交84.2亿元；中微公司涨超5%，长电科技、北方华创涨超4%。光刻胶与先进封装活跃，格林达、红宝丽、大港股份涨停，蓝箭电子20厘米涨停，盛剑科技3连板。21世纪经济报道称，主力净流入前十个股均为科技股，新易盛、中芯国际、中际旭创净流入均超10亿元。中芯国际联合CEO赵海军在三季度业绩说明会上表示，2027年半导体代工仍将供需紧平衡，人工智能相关存储器要到2028年中期及下半年才可能平衡，算力和配套芯片仍缺。长鑫科技董事会已审议通过把回购金额上调至25亿元至50亿元、价格不超过63.78元/股，尚需12月9日股东会审议，这是对存储链情绪的支撑，还不是已经实施的买盘。邮件转述还提到14只基金在震荡市中加仓国产替代，我们未逐只核对持仓，不把它写成机构已经集体转向。制约在隔夜：费城半导体指数盘初一度涨逾4.7%，收跌2.41%；英伟达跌3.3%，AMD跌7.72%，台积电ADR跌约2.9%。A股昨天涨得好的，正是今天最容易被低开检验的。开盘不追中芯、华虹，更不要把已经连板的光刻胶和设备票并进同一笔交易。","en":"今日判断\n今天的关键不是昨天科创50红了没有，而是隔夜美股把Anthropic上市这笔“最大IPO”交易成了一次卖事实。已核实：Anthropic发行9.8亿股、定价83美元，公开募资约813亿美元，超过今年6月SpaceX创下的纪录；另有约260亿美元私募，合计约1073亿美元。股票代码ANT于11月19日在纳斯达克开盘报111.50美元，较发行价高约34%，盘中一度约115.10美元、涨约39%，收97.17美元，仍较发行价涨17.07%，但较开盘价回落约12.9%，完全稀释市值约1.8万亿美元。指数没有留下这份热度。三大指数高开低走，均跌超2%：道指跌1101.11点、跌2.19%，收49097.06点，为5月5日以 :"今天 $NVDA 跌至145元，更新一下我的看法：","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXhx_Vwa0AA7bdV.jpg?name=orig"],"u":"https://x.com/TheMarketMemo/status/2123572646050971707","l":[],"ln":[],"t":[],"lk":29,"rt":2,"rp":5,"vw":4138},{"id":"2123572420087030178","h":"dmjk001","ts":1795134093,"zh":"中际交流反馈\n🔹1、2027 年业务能见度以及 2028 年展望：2027 年大部分合同已经敲定，数量与价格均确认落地。部分核心客户已经给出 2028 年指引，公司预计 2028 年需求将维持正向增长。\n🔹2、1.6T 光模块订单获得上调，800G 订单小幅下调；整体在手订单依旧十分充足，未出现订单取消情况。\n🔹3、NPO（近封装光学）业务取得更为积极的进展：近数周 NPO 产品需求获得上调，计划 2027 年下半年实现规模化量产，2028 年迎来更大规模增长。NPO 产品极有可能同时对产品平均售价与毛利率带来正向贡献。\n🔹4、2027 年毛利率展望具备韧性：光收发模块产品会遵循行业惯例出现年度降价。但公司持续依靠技术创新以及成本优化去抵消降价带来的负面影响，维持具备韧性的盈利水平。除硅光方案以及 1.6T 产品占比提升之外，公司在 1:4 CW 激光器方案（单颗 CW 激光器支持 4 条通道）上取得进展，该方案相比现有 1:2 方案成本优势更强。\n🔹5、跨行业周期的优异表现：公司预计 2027 年供给紧张格局仍将延续。除此之外，公司与头部云服务商建立深度合作关系，有助于维持充足在手订单；持续的技术创新将助力公司在新产品领域维持较高市场份额。","en":"中际交流反馈\n🔹1、2027 年业务能见度以及 2028 年展望：2027 年大部分合同已经敲定，数量与价格均确认落地。部分核心客户已经给出 2028 年指引，公司预计 2028 年需求将维持正向增长。\n🔹2、1.6T 光模块订单获得上调，800G 订单小幅下调；整体在手订单依旧十分充足，未出现订单取消情况。\n🔹3、NPO（近封装光学）业务取得更为积极的进展：近数周 NPO 产品需求获得上调，计划 2027 年下半年实现规模化量产，2028 年迎来更大规模增长。NPO 产品极有可能同时对产品平均售价与毛利率带来正向贡献。\n🔹4、2027 年毛利率展望具备韧性：光收发模块产品会遵循行业惯例出现年度降价。但公司持续依靠技术创新以及成本优化去抵消降价带来的负面影响，维持具备韧性的盈利水平。除硅光方案以及 1.6T 产品占比提升之外，公司在 1:4 CW 激光器方案（单颗 CW 激光器支持 4 条通道）上取得进展，该方案相比现有 1:2 方案成本优势更强。\n🔹5、跨行业周期的优异表现：公司预计 2027 年供给紧张格局仍将延续。除此之外，公司与头部云服务商建立深度合作关系，有助于维持充足在手订单；持续的技术创新将助力公司在新产品领域维持较高市场份额。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/dmjk001/status/2123572420087030178","l":[],"ln":[],"t":[],"lk":2,"rt":0,"rp":0,"vw":1009},{"id":"2123571643423527119","h":"dmjk001","ts":1795133908,"zh":"近期和渠道交流量化私募申赎情况，核心要点如下：\n1、下半年以来，预计量化私募赎回约占存量规模的10-15%，除了8-9月有小幅申购外，其余均呈现净流出，近期客户基本深套躺平，尤其是今年入场的客户，新增申购降至冰点，机构和渠道普遍反馈权益类策略新发募集难度明显加大。\n2、6月底根据各家宣传规模预估量化规模3.5万e左右，但是考虑到多家管理人把自己的管理规模往低了申报（虚报自己策略容量额度），预计实际规模可能在4-5万e左右，考虑近期回撤约25%，预计余下3-4万e，如若出现强反弹，预计去年申购的目前已经进入开放期的产品将出现赎回压力。\n3、此外，和两家头部股份行沟通中性产品的赎回情况，均表示不明显，但是部分券商自营资金开始赎回，我们认为这部分风险仍有待进一步观察。","en":"近期和渠道交流量化私募申赎情况，核心要点如下：\n1、下半年以来，预计量化私募赎回约占存量规模的10-15%，除了8-9月
