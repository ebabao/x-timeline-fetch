<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经资讯工作台 · X 信源</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d4a24c'/><text x='16' y='23' font-size='19' font-family='system-ui' text-anchor='middle' fill='%230a0d13'>财</text></svg>">
<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --panel:#10151f; --panel2:#151b28; --hover:#1a2130;
  --line:#1d2534; --line2:#28323f;
  --txt:#e7ebf3; --dim:#8b95a7; --dim2:#5d6779;
  --gold:#f0b429; --up:#ff4d4f; --down:#2fbf71; --blue:#4ea1ff; --purple:#8b7cf6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c3b;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31405a}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ───────────── 顶栏 ───────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,13,19,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:18px;padding:12px 22px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#f0b429,#c98a12);color:#151008;font-weight:800;font-size:15px;
  box-shadow:0 0 0 1px rgba(240,180,41,.28),0 6px 18px -8px rgba(240,180,41,.7);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim2);letter-spacing:.6px;margin-top:1px}
.search{
  flex:1;max-width:420px;position:relative;
}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px 8px 32px;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
.search input:focus{border-color:#2f4a6e;background:var(--panel2);box-shadow:0 0 0 3px rgba(78,161,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.pill{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(47,191,113,.14)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--dim);border-radius:6px;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn-primary{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:linear-gradient(160deg,#f5c34a,#dda017);color:#1a1204;
  box-shadow:0 4px 14px -6px rgba(240,180,41,.8);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}

/* ───────────── 指标条 ───────────── */
.kpis{
  max-width:1560px;margin:0 auto;padding:16px 22px 0;
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
}
.kpi{
  background:linear-gradient(170deg,var(--panel),#0e131c);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,.35),transparent)}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:660;margin-top:3px;letter-spacing:-.4px}
.kpi .v small{font-size:11.5px;color:var(--dim2);font-weight:400;margin-left:4px;letter-spacing:0}

/* ───────────── 主区 ───────────── */
.main{max-width:1560px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.main>section{min-width:0}

/* 左栏 */
aside{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{
  padding:9px 12px;font-size:11.5px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.src-list{padding:5px}
.src{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:.12s;
  position:relative;
}
.src:hover{background:var(--hover)}
.src.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.src .av{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:#0a0d13;text-transform:uppercase;
}
.src .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ct{font-size:11px;color:var(--dim2);flex-shrink:0}
.src.on .ct{color:var(--gold)}
.grp-h{
  padding:10px 12px 4px;font-size:11px;color:var(--dim2);letter-spacing:.6px;display:flex;align-items:center;gap:6px;
}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 工具条 */
.mchips{display:none;gap:7px;overflow-x:auto;padding:0 0 9px;max-width:100%;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);flex-shrink:0}
.mchip.on{color:var(--txt);border-color:rgba(240,180,41,.42);background:rgba(240,180,41,.1)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .seg button{font-size:12px}
.count-line{font-size:12px;color:var(--dim2);margin-left:auto}
.count-line b{color:var(--txt);font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tpc{
  font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--panel);transition:.13s;
}
.tpc:hover{color:var(--txt);border-color:var(--line2)}
.tpc.on{color:#1a1204;background:linear-gradient(160deg,#f5c34a,#dda017);border-color:transparent;font-weight:650}
.tpc .n{opacity:.55;margin-left:4px;font-size:10.5px}

/* 时间线 */
.feed{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px 15px;position:relative;transition:.15s;
}
.item:hover{border-color:var(--line2);background:#111722}
.item::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;
  background:var(--ac);opacity:.85;
}
.i-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.i-av{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  color:#0a0d13;flex-shrink:0;text-transform:uppercase;
}
.i-nm{font-size:13px;font-weight:620;letter-spacing:.1px}
.i-hd .h{font-size:12px;color:var(--dim2)}
.i-hd .sep{color:var(--dim2);font-size:11px}
.i-hd .t{font-size:11.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;letter-spacing:.4px;font-weight:600;
  border:1px solid transparent;flex-shrink:0;
}
.tag.cn{color:#7ee0a8;background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.22)}
.tag.en{color:#8fb6e8;background:rgba(78,161,255,.09);border-color:rgba(78,161,255,.2)}
.tag.un{color:var(--gold);background:rgba(240,180,41,.09);border-color:rgba(240,180,41,.22)}
.body{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#dfe5ef}
.body.clamp{
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
  mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25));
}
.lnk{
  font-size:11px;color:#7f93ad;background:#151c28;border:1px solid var(--line);
  padding:1px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lnk:hover{color:var(--gold);border-color:rgba(240,180,41,.35)}
.lnk::before{content:"↗";font-size:9px;opacity:.7}
.body.zh{color:#eef2f8}
.orig{font-size:12.5px;line-height:1.62;color:var(--dim);margin-top:7px;padding-left:9px;border-left:2px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.media{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.media img{
  width:92px;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);
}
.i-ft{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap;row-gap:6px}
.i-ft .m{display:flex;align-items:center;gap:4px}
.i-ft .m b{color:var(--dim);font-weight:550}
.i-ft .sp{flex:1}
.i-ft a:hover,.i-ft button:hover{color:var(--gold)}
.trans-btn{
  font-size:11.5px;color:var(--gold);border:1px solid rgba(240,180,41,.3);border-radius:5px;
  padding:2px 8px;transition:.12s;background:rgba(240,180,41,.06);
}
.trans-btn:hover{background:rgba(240,180,41,.16)}
.trans-btn.done{color:var(--dim2);border-color:var(--line2);background:none}

.empty{text-align:center;padding:70px 0;color:var(--dim2);font-size:13px}
.more{
  margin:16px auto 0;display:block;padding:9px 26px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
}
.more:hover{border-color:var(--line2);color:var(--txt)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:#1b2333;border:1px solid var(--line2);color:var(--txt);
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 12px 32px -12px #000;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  aside .card{flex:1;min-width:210px}
}
@media (max-width:720px){
  .hd{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand h1{font-size:14px}
  .search{order:9;max-width:none;width:100%;flex-basis:100%}
  .hd-right .pill{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);padding:12px 14px 0;gap:8px}
  .kpi:nth-child(5){display:none}
  .kpi .v{font-size:18px}
  .main{padding:12px 14px 50px}
  aside{display:none}
  .mchips{display:flex}
  .item{padding:11px 12px 10px 13px}
  .media img{width:72px;height:72px}
  .i-ft{gap:10px;font-size:11px}
  .i-ft .vw{display:none}
  .lnk{max-width:104px}
}
</style>
</head>

0,"rp":0,"vw":0},{"id":"2122272228087673330","h":"business","ts":1794824103,"zh":"@tomwblack 表示，随着美国联邦航空局升级其过时的系统，单靠资金并不能结束航空旅行的中断。肖恩·达菲需要与美国乘客进行诚实的对话（来自@opinion）","en":"Money alone won't end disruptions to air travel as the FAA upgrades its antiquated systems, @tomwblack says. Sean Duffy needs to have an honest conversation with American flyers (via @opinion)","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122272228087673330","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/opinion/articles/2026-11-16/faa-flight-disruptions-need-more-than-money-to-fix?taid=6afad7a7718669000140b92a&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":0,"rt":0,"rp":0,"vw":7100},{"id":"2122270967732818259","h":"business","ts":1794823803,"zh":"黄仁勋自封为人工智能经济之王。在这位英伟达前首席执行官失业前的最后一次大型布道之旅中，我们与他一起度过了一周。","en":"Jensen Huang was the self-appointed king of the AI economy. We spent a week with the former Nvidia CEO during his last big evangelism tour before he lost his job.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122270967732818259","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/features/2026-11-16/the-final-days-of-the-jensen-huang-hype-train-at-nvidia?taid=6afad67bd0eea100019b048d&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":6,"rt":0,"rp":3,"vw":9787},{"id":"2122270961588400152","h":"cnfinancewatch","ts":1794823801,"zh":"华尔街观察｜具身智能：路线迭变，终点不改，数采与T链价值重估\n风险提示：本文仅为产业逻辑推演复盘，不构成任何投资建议。机器人、具身智能行业技术迭代快、落地不及预期、行业竞争超预期等风险持续存在，个股仅为产业链举例，不做买入推荐。\nOpenAI组织架构调整，市场一度解读为其机器人业务战略收缩。重新审视这次团队变动，本质并不是放弃具身赛道，而是一次研发路线的明确与资源再集中，是将机器人研究并入通用大模型主线的战略选择。\n回溯OpenAI机器人业务的演进，2020年前后曾一轮收缩，2024年重建团队，本轮再次架构整合，背后的核心判断正在显现：GPT‑6、Astra这类通用基座模型，已经具备直接承载部分机器人任务的潜力。研发重心转向通用大模型作为具身智能的“大脑”，集中算力与研发资源收敛大模型范式，用更强的基础模型去驱动物理端智能，赛道的终局目标——迈向具身智能，并未改变，只是行进的路线发生迭代。\n在基座大模型能力快速抬升的时代，具身企业的壁垒正在被重新定义。基础大模型可以快速迭代，但真机运行所产生的高质量物理交互数据、垂直专家场景、线下落地部署入口，是基座模型短期无法替代的护城河。基模变强，会冲击一部分具身公司的原有业务边界，但能够持续产出独有物理数据、场景闭环落地的厂商，模型迭代可以持续拿到额外的边际增益，数据采集链条的长期价值将持续抬升。\n整条具身产业链正在迎来结构性机会，可以划分为四大主线进行跟踪：\n1. T链（执行器传动链，软硬结合核心赛道）\n传动、结构件、执行器是机器人物理行动的基础硬件，是具身落地最为刚性的一环。重点方向包含减速器、丝杠、轴承、结构件、驱控、手套、设备供应商等。产业链代表标的包括三花智控、拓普集团、恒立液压、双环传动、浙江荣泰、科达利、福赛科技、科森科技、长盈精密、斯菱智驱、金沃股份、新泉股份、田中精机等。硬件是物理AI落地绕不开的载体，行业落地加速阶段，T链的业绩弹性值得持续追踪。\n2. 本体与垂类应用\n机器人整机本体以及垂直场景落地厂商，承载着真机落地、场景闭环、物理数据生成的使命，是物理世界的数据发生器。稀缺材料、整机集成、行业场景服务商处在这一环节，代表上纬新材、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和等。本体厂商最大的价值不单是硬件整机，更是持续运转带来的独家场景数据入口。\n3. 数采链（数据采集闭环）\n高质量真机数据是本轮具身竞赛的核心资源。数采链覆盖传感器、数据采集、信号链路相关企业，代表凡拓数创、奥比中光、芯动联科、华依科技、日盈电子。随着各家具身机型持续试跑、迭代扩容，数据采集需求将会持续放量，数采链是产业军备竞赛里的隐形主线。\n4. OAI供应链条\n直接或是间接供给OpenAI具身项目的国内零部件厂商，兆威机电、长盈精密、立讯精密、中鼎股份、豪鹏科技等，将优先受益其样机迭代、试产放量的订单催化。\n物理AI已经跨过单纯Demo展示阶段，进入落地部署的产业周期。各家大厂的技术路线会持续试错、摇摆、切换，耦合架构、训练数据结构百家争鸣，短期路线具备非常强的不确定性。但整个产业向具身智能前进的长期终点不会改变，一场横跨软硬件的物理AI军备竞赛已经开启。\n行情机会不再是单一主题的脉冲炒作，产业投资主线，应当锚定数据与模型驱动的新叙事，高度把握软硬结合赛道，重点跟踪T链的产业进展。技术路线会不断生变，能够穿越路线波动的硬核硬件、真机场景、物理数据资源，才是具身时代的长期核心资产。","en":"华尔街观察｜具身智能：路线迭变，终点不改，数采与T链价值重估\n风险提示：本文仅为产业逻辑推演复盘，不构成任何投资建议。机器人、具身智能行业技术迭代快、落地不及预期、行业竞争超预期等风险持续存在，个股仅为产业链举例，不做买入推荐。\nOpenAI组织架构调整，市场一度解读为其机器人业务战略收缩。重新审视这次团队变动，本质并不是放弃具身赛道，而是一次研发路线的明确与资源再集中，是将机器人研究并入通用大模型主线的战略选择。\n回溯OpenAI机器人业务的演进，2020年前后曾一轮收缩，2024年重建团队，本轮再次架构整合，背后的核心判断正在显现：GPT‑6、Astra这类通用基座模型，已经具备直接承载部分机器人任务的潜力。研发重心转向通用大模型作为具身智能的“大脑”，集中算力与研发资源收敛大模型范式，用更强的基础模型去驱动物理端智能，赛道的终局目标——迈向具身智能，并未改变，只是行进的路线发生迭代。\n在基座大模型能力快速抬升的时代，具身企业的壁垒正在被重新定义。基础大模型可以快速迭代，但真机运行所产生的高质量物理交互数据、垂直专家场景、线下落地部署入口，是基座模型短期无法替代的护城河。基模变强，会冲击一部分具身公司的原有业务边界，但能够持续产出独有物理数据、场景闭环落地的厂商，模型迭代可以持续拿到额外的边际增益，数据采集链条的长期价值将持续抬升。\n整条具身产业链正在迎来结构性机会，可以划分为四大主线进行跟踪：\n1. T链（执行器传动链，软硬结合核心赛道）\n传动、结构件、执行器是机器人物理行动的基础硬件，是具身落地最为刚性的一环。重点方向包含减速器、丝杠、轴承、结构件、驱控、手套、设备供应商等。产业链代表标的包括三花智控、拓普集团、恒立液压、双环传动、浙江荣泰、科达利、福赛科技、科森科技、长盈精密、斯菱智驱、金沃股份、新泉股份、田中精机等。硬件是物理AI落地绕不开的载体，行业落地加速阶段，T链的业绩弹性值得持续追踪。\n2. 本体与垂类应用\n机器人整机本体以及垂直场景落地厂商，承载着真机落地、场景闭环、物理数据生成的使命，是物理世界的数据发生器。稀缺材料、整机集成、行业场景服务商处在这一环节，代表上纬新材、宏润建设、杭州柯林、均普智能、天奇股份、亿嘉和等。本体厂商最大的价值不单是硬件整机，更是持续运转带来的独家场景数据入口。\n3. 数采链（数据采集闭环）\n高质 业。不去KTV\n美女没了活路\n科技男创业，不吃不喝，还不雇佣劳动力，只用AI\n工人也没了活路\n这就是当下处境","en":"科技男创业。不去KTV\n美女没了活路\n科技男创业，不吃不喝，还不雇佣劳动力，只用AI\n工人也没了活路\n这就是当下处境","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122252079876235528","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":0},{"id":"2122251360167211032","h":"cnfinancewatch","ts":1794819128,"zh":"过早思考世界是灾难，理性的终极是抑郁。","en":"过早思考世界是灾难，理性的终极是抑郁。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122251360167211032","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":334},{"id":"2122250832582250996","h":"business","ts":1794819002,"zh":"@parmy（来自 @opinion）写道，历史可能会回顾黄仁勋的下台和达里奥·阿莫迪的大规模 IPO，作为人工智能公司最终开始成长的那一刻","en":"History may look back at Jensen Huang's ousting and Dario Amodei's massive IPO as the moment AI companies finally started to grow up, writes @parmy (via @opinion)","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122250832582250996","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/opinion/articles/2026-11-16/nvidia-and-anthropic-ai-is-hitting-serious-new-power-limits?taid=6afac3bad0eea100019b03ac&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":3,"rt":0,"rp":1,"vw":9106},{"id":"2122249865803845908","h":"cnfinancewatch","ts":1794818772,"zh":"A股盘中｜2026年11月16日 周一 截至14时40分\n#结论 今天是一次干脆的风格切换，科技硬件被集中抛售，资金躲进银行、保险和家电。截至14时40分，沪指跌1.25%报3588.94点，失守3600点；深成指跌2.88%，创业板指跌4.72%，科创50跌5.99%，跌幅都比午盘扩大了一倍多。沪深两市已成交约1.34万亿元。涨停30家，跌停58家，跌停数是涨停的近两倍，赚钱效应明显偏弱。尾盘不建议抄科技的底，持仓向银行保险和白电靠拢，算力和半导体等本周英伟达财报落地再说。\n#盘面速览 上午还算有序，沪指午盘只跌0.39%，下午一点半后科创板和创业板加速下探，摩尔线程、沐曦股份、中科飞测、芯原股份跌超10%，寒武纪跌逾8%。上证50只跌0.68%，中证1000跌3.38%，大盘价值明显抗跌，小盘成长最弱。\n#板块与风格 领跌的是光模块、PCB和半导体。 #中际旭创 $300308 跌12.7%，成交215亿元居全市场第一； #新易盛 $300502 跌11.45%。 #沪电股份 $002463 、 #深南电路 $002916 、 #生益科技 $600183 三只PCB龙头跌停，元件是跌停最集中的行业。ETF口径，通信ETF跌8.61%，芯片ETF跌6.72%，半导体ETF跌6.31%，人工智能ETF跌5.65%，半导体设备ETF跌5.56%，军工、机器人、有色跌3.5%到4.2%。 红盘一侧，银行ETF涨1.67%，红利ETF涨1.36%，煤炭ETF涨1.27%，消费ETF涨1.0%，酒和食品饮料小幅收红。 #工商银行 $601398 涨1.92%，盘中再创历史新高； #美的集团 $000333 涨2.13%，股价刷新2021年2月创下的历史高点。\n#资金面 主力资金与板块资金流接口本档未能取到，数据缺失；北向当日不披露。可以确认的是：截至11月13日两市融资余额22497.85亿元，单日减少165.45亿元；据媒体援引的统计，上周股票型ETF合计净流出约422亿元。杠杆和ETF两条线都在退，今天的下跌更多是去拥挤，而不是新增利空。\n#涨停分布 30家涨停里，家电和零售最整齐。 #九阳股份 $002242 、 #小熊电器 $002959 、 #北鼎股份 $300824 、 #长虹美菱 $000521 、 #华帝股份 $002035 涨停， #广百股份 $002187 三连板， #天虹股份 $002419 涨停，内需消费是今天唯一成片的进攻线。固态电池 #紫竹高科 $002058 、 #领湃科技 $300530 涨停；AI漫剧回暖， #吉视传媒 $601929 三天两板， #华数传媒 $000156 涨停。最高板是 #北纬科技 $002148 四连板。电网设备 #顺钠股份 $000533 涨停，带动 #国电南瑞 $600406 涨3.78%。\n#盘中消息 科技链的压力来自几件事叠在一起：英伟达创始人辞任CEO后的余波还在发酵，本周英伟达财报登场前资金不愿接；周末中东局势升温，第三艘美军航母抵达；美联储12月加息预期升温，叠加有关AI融资风险的提示。早盘日韩芯片股转跌，港股大模型和芯片股同步重挫。托底的一面也有，证监会上周表态构建稳的机制、防范异常波动，中美经贸磋商贸易理事会首次会议已在11月13日召开。\n#研报面 这一轮下跌中，财通基金认为AI仍处渗透率早中期，调整属于预期消化；中信建投、东吴证券继续看好国产算力链。防守侧，国投证券11月13日首次覆盖 #工商银行 给予买入评级、目标价9.88元；美的集团近两周获财信证券、申万宏源、中泰证券等多家买入评级，最新一篇是财信证券11月12日。今天盘中未见新的重磅首次覆盖。\n#中美映射 双窗口沿用早间口径。银行与金融是唯一的20日加5日双窗口同现方向，今天银行再创新高，正好兑现。半导体只有5日共振，20日两边都是负的，属于超跌脉冲，今天这一脉冲被彻底打掉，再次说明仅5日上榜的方向不能追。\n#三个方向 一是 #银行与保险红利，双窗口同现，盘中最稳，尾盘仍是首选。二是 #家电与内需消费，龙头创新高加上小家电零售成片涨停，研报密集覆盖，是今天的进攻线，但涨停股不追，做龙头回踩。三是 #电网设备，订单逻辑与防御属性兼具，逆势收红。半导体设备与AI漫剧降为观察。\n#六只个股 #工商银行 $601398 ，涨1.92%创历史新高，双窗口方向的核心，持有不追高。 #中国平安 $601318 ，涨1.34%，保险板块居涨幅前列，补涨品种。 #美的集团 $000333 ，涨2.13%刷新历史高点，研报覆盖最密，回踩91元附近再加。 #国电南瑞 $600406 ，涨3.78%，电网设备逆势走强，防御兼成长。 #横店影视 $603103 ，涨4.04%，院线和AI漫剧逆势回暖，冲高不追。 #北方华创 $002371 ，跌1.84%，明显抗跌于科创50，上周设备板块有资金逆势流入，只作为科技企稳后的首选观察，不在今天接。\n#小盘阿尔法 本档不选。小家电和零售涨停股多为当日一字或快速封板，20日K线位置与最新财报未完成核验，按规则不入选。\n#尾盘观察 看三点。一是沪指能否收回3600点，收不回来明天大概率继续在科技里找底；二是中际旭创和沪电股份尾盘有没有放量承接，没有就别抄；三是银行能否站稳日内高点，银行走弱意味着防守资金也在撤。今天收盘前不建议追涨停家电，也不建议加仓科技。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。 订阅","en":"A股盘中｜2026年11月16日 周一 截至14时40分\n#结论 今天是一次干脆的风格切换，科技硬件被集中抛售，资金躲进银行、保险和家电。截至14时40分，沪指跌1.25%报3588.94点，失守3600点；深成指跌2.88%，创业板指跌4.72%，科创50跌5.99%，跌幅都比午盘扩大了一倍多。沪深两市已成交约1.34万亿元。涨停30家，跌停58家，跌停数是涨停的近两倍，赚钱效应明显偏弱。尾盘不建议抄科技的底，持仓向银行保险和白电靠拢，算力和半导体等本周英伟达财报落地再说。\n#盘面速览 上午还算有序，沪指午盘只跌0.39%，下午一点半后科创板和创业板加速下探，摩尔线程、沐曦股份、中科飞测、芯原股份跌超10%，寒武纪跌逾8%。上证50只跌0.68%，中证1000跌3.38%，大盘价值明显抗跌， 3400,"zh":"炒股第一祖训：\n要么及时出金，把钱存在银行，要么买入银行，既有资本增值还有股息收入\n存为王，存为王，存为王，喊了一年多了，存懂了吗你？\n手持科技股，CEO的裤裆都得研究清楚，手持银行股，你甚至不在意银行行长是谁","en":"炒股第一祖训：\n要么及时出金，把钱存在银行，要么买入银行，既有资本增值还有股息收入\n存为王，存为王，存为王，喊了一年多了，存懂了吗你？\n手持科技股，CEO的裤裆都得研究清楚，手持银行股，你甚至不在意银行行长是谁","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/CrushTheShorts/status/2122185391948050671","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":192},{"id":"2122184140887859222","h":"business","ts":1794803102,"zh":"由于人们乐观地认为结束俄罗斯-乌克兰冲突的谈判将取得进展，从而释放谷物供应，芝加哥小麦下跌。","en":"Wheat fell in Chicago on optimism that progress will be made in negotiations to end the Russia-Ukraine conflict, freeing up supplies of the grain.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122184140887859222","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/wheat-falls-on-optimism-trilateral-talks-will-free-up-black-sea?taid=6afa859e718669000140b78a&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":0,"rt":0,"rp":1,"vw":11251},{"id":"2122180583761846422","h":"cnfinancewatch","ts":1794802254,"zh":"A股盘前第二版｜2026年11月16日 周一 两小时更新\n#结论\n七点以后外盘给了一点缓冲，但科技链的压力没有消失。纳指期货报28178附近，较上一结算回升约0.5%，标普期货涨约0.25%；日经225却从高开0.34%转跌，盘中一度跌1%，日本芯片测试设备龙头\n#爱德万测试 跌8.2%，韩国KOSPI也回吐涨幅。外部算力链情绪仍弱，第一版的判断不变：银行红利守底仓，影视院线等回踩，半导体设备只低吸。两小时内的新增变化集中在两处，一是数据中心液冷与电力设备订单密集，二是医保目录落地后创新药获券商集中解读，今天可作为盘中观察的补充线索，不改三个方向。\n#消息面 两小时更新\n韩国 #LS电气 拿下约1300亿韩元美国超大规模AI数据中心配电订单， #三星SDI\n因美国电池订单早盘涨超6%，SK海力士宣布五年投入约10.5亿美元扶持本土材料设备供应商。国内方面， #银轮股份\n大型钎焊板式换热器进入国内头部云厂商白名单， #永贵电器 称液冷快换接头等产品在推广中，液冷是今早公告最密的方向。 #TCL中环\n调研称硅片供需偏紧格局有望延续、价格仍在上涨周期。 #龙蟠科技\n把与宁德时代的年度采购上限由70亿元上调至90亿元。国家能源局表态智能微电网进入规模化阶段。海外看，日本三季度GDP年化环比萎缩0.1%，低于预期；美国2年期国债收益率上周一度飙升37个基点，10年期重回5%上方，本周焦点在美联储官员讲话与会议纪要。美军在中东再度形成三航母部署，原油事件风险仍在。\n#研报面 两小时更新\n中信证券今早发文，新版医保目录新增107种药品，其中1类创新药51种、数量创新高，CAR-T首次纳入，关注2027年商业化增量，与第一版提到的太平洋看好\n#联影医疗 $688271 、 #惠泰医疗 $688617\n形成医疗线的互证。华泰证券通信研报看好OCS全光交换，建议关注海外整体方案商与国内上游核心元器件配套商；光通信20日跌幅较深，这类研报更多是中期逻辑，不构成今天追高理由。半导体设备方向两小时内没有新增评级，沿用第一版太平洋、华安的买入覆盖。\n#热榜\n人气榜本档仍未取到，数据缺失。集合竞价数据要到9点15分以后才有，本档截稿前无法采集，竞价强弱请以开盘实际为准。\n#资金面\n截至11月13日两市融资余额22497.85亿元，较前一交易日减少165.45亿元，沪市减86.72亿元、深市减78.73亿元，杠杆资金在上周后半段明显撤退，这与周五创业板大跌对得上。北向当日不披露，主力资金接口本档仍缺失。\n#中美映射\n双窗口数据沿用第一版，两小时内无新的收盘数据。银行与金融仍是唯一双窗口同现方向；半导体5日共振但20日为负，属于超跌脉冲。今早日韩芯片设备股走弱，进一步说明半导体反弹不能追。\n#期货 两小时更新\n纳指期货28178，较上一结算涨约0.5%；标普期货7601，涨约0.25%。A50期指本档报价未更新，仍为上周五夜盘12831附近，数据待开盘确认。离岸人民币6.6724，较前收略升。黄金3897美元，现货一度突破3900美元；纽约原油88.2美元小幅回落；白银48.8美元、美铜617美分，均小幅走弱。恒生指数与恒生科技本档仍为上周五收盘口径，分别跌1.55%和3.02%。\n#三个方向\n一是 #银行与红利，不变，杠杆资金撤退阶段防守仍是首选。二是 #影视院线与AI漫剧，不变，高开过多不追。三是\n#半导体设备与先进封装，不变，但优先级下调到观察低吸，日本 #爱德万测试\n大跌是今天的外部压力。液冷与数据中心电力设备单列观察，今早订单和准入消息多，但属于单日催化，需要盘面放量确认。\n#六只个股\n #工商银行 $601398 ，防守底仓，不变。\n #中国电影 $600977 ，影视趋势核心，回踩分时均线再看。\n #横店影视 $603103 ，院线弹性品种，高开超过5%不追。\n #北方华创 $002371 ，设备龙头，守住上周五低点才考虑低吸。\n #拓荆科技 $688072 ，先进封装逻辑清楚，今天外部芯片设备偏弱，轻仓或等。\n #国电南瑞 $600406 ，电网订单与智能微电网定调共振，防御兼成长。\n观察名单补充 #银轮股份 $002126 ，液冷换热器进入头部云厂商白名单，需看开盘量能，不进六只。\n#小盘阿尔法\n本档仍不选。液冷相关小盘标的消息面活跃，但20日K线与最新财报未完成核验，按规则不入选。\n#操作提示\n九点二十五分先看竞价：银行是否平开偏强，影视是否高开过度，设备是否随日韩低开。IM与IC贴水若继续扩大，成长股一律等。融资盘仍在撤，追涨的胜率不高，今天以守为主，液冷只看不追。\n关注 @cnfinancewatch，紧跟华尔街与 A 股盘前盘中要点。\n订阅","en":"A股盘前第二版｜2026年11月16日 周一 两小时更新\n#结论\n七点以后外盘给了一点缓冲，但科技链的压力没有消失。纳指期货报28178附近，较上一结算回升约0.5%，标普期货涨约0.25%；日经225却从高开0.34%转跌，盘中一度跌1%，日本芯片测试设备龙头\n#爱德万测试 跌8.2%，韩国KOSPI也回吐涨幅。外部算力链情绪仍弱，第一版的判断不变：银行红利守底仓，影视院线等回踩，半导体设备只低吸。两小时内的新增变化集中在两处，一是数据中心液冷与电力设备订单密集，二是医保目录落地后创新药获券商集中解读，今天可作为盘中观察的补充线索，不改三个方向。\n#消息面 两小时更新\n韩国 #LS电气 拿下约1300亿韩元美国超大规模AI数据中心配电订单， #三星SDI\n因美国电池订单早盘涨超6%，SK海力士宣布五年投入约10.5亿美元扶持本土材料设备供应商。国内方面， #银轮股份\n大型钎焊板式换热器进入国内头部云厂商白名单， #永贵电器 称液冷快换接头等产品在推广中，液冷是今早公告最密的方向。 #TCL中环\n调研称硅片供需偏紧格局有望延续、价格仍在上涨周期。 #龙蟠科技\n把与宁德时代的年度采购上限由70亿元上调至90亿元。国家能源局表态智能微电网进入规模化阶段。海外看，日本三季度GDP年化环比萎缩0.1%，低于预期；美国2年期国债收益率上周一度飙升37个基点，10年期重回5%上方，本周焦点在美联储官员讲话与会议纪要。美军在中东再度形成三航母部署，原油事件风险仍在。\n#研报面 两小时更新\n中信证券今早发文，新版医保目录新增107种药品，其中1类创新药51种、数量创新高，CAR-T首次纳入，关注2027年商业化增量，与第一版提到的太平洋看好\n#联影医疗 $688271 、 #惠泰医疗 $688617\n形成医疗线的互证。华泰证券通信研报看好OCS全光交换，建议关注海外整体方案商与国内上游核心元器件配套商；光通信20日跌幅较深，这类研报更多是中期逻辑，不构成今天追高理由。半导体设备方 去的倾向\n2-原生家庭里的老臣会担心未来女儿掌权这种离心倾向，女婿擅权会逐渐脱离娘家或者直接先打压娘家势力\n3-女儿家族意识缺乏：照顾娘家叔伯兄弟大家族的意愿很低甚至没有，分裂必然\n4-家族观念没有国家观念也没有，揣兜里第一，容易引起利益搞不清楚，不容易政商关系等处理好\n……\n其他再说吧。\n典型就如我预测，天下第一布鞋老总家，女儿掌权逻辑削弱娘家老人权利剥夺利益，跟政府打官司，跟同父异母姊弟姊妹打官司……\n另立势力，最后自己被踢出父亲势力集团，企业易主！","en":"可能很多人都觉得我是女性歧视\n其实没有\n原因是客观的\n1-女性天然属于女婿家庭，会有从原生家庭中离析出去的倾向\n2-原生家庭里的老臣会担心未来女儿掌权这种离心倾向，女婿擅权会逐渐脱离娘家或者直接先打压娘家势力\n3-女儿家族意识缺乏：照顾娘家叔伯兄弟大家族的意愿很低甚至没有，分裂必然\n4-家族观念没有国家观念也没有，揣兜里第一，容易引起利益搞不清楚，不容易政商关系等处理好\n……\n其他再说吧。\n典型就如我预测，天下第一布鞋老总家，女儿掌权逻辑削弱娘家老人权利剥夺利益，跟政府打官司，跟同父异母姊弟姊妹打官司……\n另立势力，最后自己被踢出父亲势力集团，企业易主！","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122176444470338033","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":813},{"id":"2122175334762025055","h":"business","ts":1794801002,"zh":"高盛集团表示，明年石油市场将面临“相当大的过剩”，即使供应风险仍然存在，这也将拖累价格走低","en":"The oil market faces a “sizeable surplus” next year that’ll drag prices lower even as supply risks remain, Goldman Sachs Group says","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122175334762025055","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/goldman-sachs-predicts-sizeable-surplus-for-oil-market-in-2027?taid=6afa7d6ad0eea100019b00dd&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["原油能源"],"lk":6,"rt":0,"rp":1,"vw":13000},{"id":"2122174084997894586","h":"business","ts":1794800704,"zh":"将于周二会见中国国家主席习近平的加拿大总理马克·卡尼表示，如果特朗普政府不希望建立一体化的北美供应链，加拿大还有其他汽车制造合作伙伴。","en":"Prime Minister Mark Carney, who will meet with Chinese President Xi Jinping on Tuesday, said Canada has other partners for auto manufacturing if the Trump administration doesn’t want an integrated North American supply chain.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122174084997894586","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/carney-eyes-auto-partners-beyond-us-as-xi-meeting-looms?taid=6afa7c40718669000140b757&utm_campaign 4795603,"zh":"10月份中国住宅价格持续下跌，引发人们对最新刺激措施将在多大程度上提振低迷市场的疑问","en":"China’s residential prices continued to fall in October, raising questions over how much the latest stimulus measures will lift the sagging market","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122152687382712435","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/china-home-price-slump-drags-on-despite-latest-stimulus-push?taid=6afa6852d0eea100019b000b&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":5,"rt":2,"rp":3,"vw":15183},{"id":"2122152511180288016","h":"SCMPNews","ts":1794795561,"zh":"中国总理李强在马尼拉东盟峰会上发表讲话","en":"Chinese Premier Li Qiang addresses Asean summit in Manila","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2122152511180288016","l":["sc.mp"],"ln":[{"u":"https://sc.mp/hdi1n","d":"sc.mp"}],"t":[],"lk":2,"rt":0,"rp":1,"vw":1355},{"id":"2122152463478513758","h":"fxtrader","ts":1794795549,"zh":"#全文 腾讯公开2026总办LinkTime现场笔记，号召AI时代再创业，“心态归零”。\n1、上船应战，准备新的打法，找到新的高地\n大航海时代，不进则退；工业革命，落后就挨打。现在进行的智能革命如果不投入拥抱，就是被颠覆。这是一个生死存亡的问题。\n随着算力的不断投入，AI无疑将带来范式的变革，渗透到更多行业只是时间问题。而且特点是变化速度很快，在短时间内就能实现指数级增长，也能快速去颠覆传统业务。在这个改变世界的技术里，我们要义不容辞冲在前面，坚定投入。\n和之前降本增效不同，上次是被动降本，这次是主动增效——AI native业务、模型和产品要逆流而上；所有业务都要面向AI时代再创业，实现效率和创造力的极致提升，也让我们给用户创造的价值再次提升。当下国内竞争激烈，AI变现尤其困难，更需要把我们处于AI前沿的身位和洞察放到业务里面。\n浪已经杀过来了。一些核心业务看起来地位稳固，但AI的进展飞快，远处的浪潮已经在吞没一个个山丘了，你不能还坐着欣赏。大家要着急，赶紧站起来准备新的打法，找到新的高地。陆战变海战，陆军变海军，大家都要搬运物资，转变技能，迅速上船应战。\n我们正在经历一个大格局的变化，选出能够适应新的打法和新的战场的人，必须干脆、直截了当。组织也要扁平化。核心业务原来是陆军守，要升级、提效，一半人负责守住，另一半人去打新的战役，一起用AI干更多的事。现在不是和平年代了，大家不能自以为站在高处很安全，或者等着人哄、谈好条件利益才上船。\n2、做以人为本的AI，能投是荣幸\n现在大家都关心AI会不会安全，会不会对人产生负面影响。我们有自己的核心价值观。这个世界需要多样化的AI，才能把AI变得安全。我们要做以人为本的AI：首先要坚持AI必须造福人类和社会；第二AI必须是由人控制的；第三，AI要让人的创造力得到赋能。这就是我们为什么要大力投入AI的原因。\n投入很大，是因为AI发展还在早期，当前所有基建和算力都需要自建，而且在所有人都投入的情况下，价格飞涨。但如果现在不投，以后可能连参与的机会也没有。但我们也非常务实，不仅看长期和全局，也要在能力范围看投入产出比，看到底能创造多少价值。\n某种程度上，可以说我们过去28年的存在就为了今天可以投入这样一个改变世界的技术潮流。不是每家公司都有机会加入，能够投入、参与这场巨大的科技变革，并且站在前沿，这是我们的荣幸。\n在这场全球变革里，我们相信这些投入肯定有回报。这个回报可能是我们AI原生业务不断发展，创造新的价值，也有可能是现有业务向AI时代更快再创业带来的增值。我们扎根于中国，我们拥有在性价比上竞争力很强的模型，如果我们让地球上各个地方的人都能用上AI，同时深刻改变各个行业，这将创造巨大的价值。\n3、我们的AI金字塔初见雏形，智能应用的开发刚刚开始\n我们的AI业务要一层层看。金字塔的核心是模型，现在我们已经进入国内第一梯队，接下来不断迭代，推动智能的成本指数级下降。小微是每个人的私人AI助理，随着能力的迅速增长，它的目标是让大家实现“token自由”。而元宝未来可以成为每个人决策和资讯的参谋。WorkBuddy就是你的员工，它在短短8个月内成为中国提供最多token的单一AI产品，展示了AI时代的生长速度。这些AI产品，可以覆盖用户每天的需求。\nWorkBuddy是我们AI native第一个跑出来的产品，也希望之后我们内部更多团队可以和AI有乘数效应，创造出更多新的AI native产品。\n现在AI在应用层面的开发才刚刚开始，如同工业化早期刚刚发明用电力来照明，还没有出现各种电器和把电力用于生产。未来更大的智能应用将发生在生产中，跟千行百业结合，还有很多机会值得我们投入。\n这个过程中，资源有限，注意力也有限，所以一定要找准定位，发挥我们的优势。\n4、心态归零，加快速度，提升要求，打破山头\n心态归零，所有核心业务每一个团队都要面向AI时代再创业，抛掉身上的包袱，拥抱AI新时代。所有人都要动手做事，整个组织有机化。每个人快速提升能力，每个组织重新变化、扁平化，以小团队为作战单元。\n打破过去的管理流程。整个管理方式以及做事方式都要通过AI重新设计，在现有业务上再延伸竞争力，让成本、效率可以再优化，获取更多的商业化能力，甚至创造出新的需求——它也许是现有路径上的新需求，也许是一个全新的AI产品。\n我们要加快速度，马上反馈，马上决策，马上行动；我们要提升对所有人的要求。重新组建混元团队的时候，一个重要的体会就是：人才密度的定义不只是你有多少特别有能耐的人，还取决于团队所有人的能力能否向上拉齐。\n组织变革要加快，未来不一定要那么多管理岗位，不要让中间传话的不想动还霸占地盘的干部成为阻碍，山头主义、地盘意识都要完全打破。很多基层同事很有动力和激情利用AI发挥自己的聪明才智，他们有机会成为一个非常好的贡献者，但是受制于很多旧有的架构和组织。我们要对此做更大的调整，让更多有机的小团队做大事，组织更灵敏地变化。\n5、所有人先动起来，在新的时代同努力，再出发\n先动起来才能找到机会。不动不改，走出第一步的勇气都没有的话，就没有未来了；什么都要问清楚才动身，也没机会。\n过去28年我们经历很多，很多次变革都非常惊险，是自上而下和自下而上合力的结果。这次也是一样。我们给更好的土壤、更好的机制，让有想法的员工能够从下面冒上来，一旦新业务培育成功，我们全力以赴支持，兄弟部门也全力支持，最终平台和用户大家都受益。\n只要我们真正动起来，全面拥抱这个新的时代变革，把腾讯的价值观做到极致，就可以克服困难，产生巨大的生产力。首先是我们的正直，“用户为本、科技向善”已经在腾讯扎根；第二很多团队都有很强的自下而上、由内而外的创造力和意愿，我们一定要把这种创造力发挥出来；第三是协作，公司很大，有部门墙，但在生死之战中，你帮我挡住后面，我帮你看住前面，协作自然就会出来。游戏、金融、安全等团队都把他们的能力跟模型进行了Co-Design，带来了Hy能力的提升，我们可以进行更多这样的参与和推动，同时再把混元的能力拉进自己的业务里，让业务有质的提升，创造新的场景；在进取这块，我们还可以更加进取。\n期待所有小伙伴们可以把焦虑转为兴奋，把等待和观望的情绪转换为全情投入，核心业务面向AI时代再创业，同时支持AI native模型、业务的发展，让我们腾讯的价值观在AI时代闪闪发光。","en":"#全文 腾讯公开2026总办LinkTime现场笔记，号召AI时代再创业，“心态归零”。\n1、上船应战，准备新的打法，找到新的高地\n大航海时代，不进则退；工业革命，落后就挨打。现在进行的智能革命如果不投入拥抱，就是被颠覆。这是一个生死存亡的问题。\n随着算力的不断投入，AI无疑将带来范式的变革，渗透到更多行业只是时间问题。而且特点是变化速度很快，在短时间内就能实现指数级增长，也能快速去颠覆传统业务。在这个改变世界的技术里，我们要义不容辞冲在前面，坚定投入。\n和之前降本增效不同，上次是被动降本，这次是主动增效——AI native业务、模型和产品要逆流而上；所有业务都要面向AI时代再创业，实现效率和创造力的 berg.com/news/articles/2026-11-16/china-s-economy-weakens-more-than-forecast-despite-stimulus-push?taid=6afa6727718669000140b6e4&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":2,"rt":1,"rp":2,"vw":8748},{"id":"2122150587311780227","h":"cnfinancewatch","ts":1794795102,"zh":"书法家长寿！好像有道理？","en":"书法家长寿！好像有道理？","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122150587311780227","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":694},{"id":"2122150171450437737","h":"business","ts":1794795003,"zh":"随着新员工的全球扩张，高频交易公司 Graviton 新加坡子公司的利润几乎增长了两倍，将其 39 岁的印度创始人变成了亿万富翁 ionaires?taid=6afa65fbd0eea100019afff8&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","en":"High-frequency trading firm Graviton nearly tripled profits at its Singapore-based unit as it expands globally with new hires, turning its 39-year-old Indian founders into billionaires","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122150171450437737","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/hft-firm-graviton-s-singapore-profit-surge-makes-indian-founders-billionaires?taid=6afa65fbd0eea100019afff8&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":2,"rp":5,"vw":12195},{"id":"2122148315311858165","h":"cnfinancewatch","ts":1794794560,"zh":"传说苏东坡爱字如命。\n那一晚，他忽然想起“剑”字该怎么写。\n不是平日里随意的临帖，是心里那一笔忽然清了。横竖撇捺，每一处转折都该落在什么地方，他躺在榻上，越想越清楚，越清楚越坐不住。\n正好，约了一歌姬，不好把别人撂在那儿！\n姑娘进门，沐浴更衣，妆未卸，人已躺平。东坡也不多言，只取了墨，就在她胸口起了第一笔。\n他写得很慢。第一笔横，墨色还浓；第二笔竖，他已觉肩头太窄，转腕不顺。写完一个“剑”，他盯着看了片刻，自己摇头，唤人端水来，用软布把胸口的字轻轻拭去，只留淡淡一痕。然后又写。这一次他换了位置，写在她背上。背比胸宽，他可以慢慢拉开笔势。可写到“刀”字旁时，他忽然觉得那一撇太浮，不像从骨里生出来的。他又洗掉，重新来过。\n一整夜，他都在她身上写字。写了，看，不满意，便洗。洗干净了，再写。有时写在手臂，有时写在腰侧，有时甚至写在她锁骨与胸口之间那一小块平坦处。墨干了又湿，湿了又干，姑娘身上的皮肤被软布反复擦拭，渐渐发红。她起初还等着他有别的动作，后来只是侧躺着，任他翻来覆去地摆弄。东坡始终没有碰她别的地方。他只写“剑”字。\n天亮时，他写到第十七个。墨已淡，人已倦，可那一笔他还是没写完。他停下来，看着姑娘背上最后那个未完的字，忽然觉得，这个“剑”字今夜是写不成了。他放下笔，把剩下的墨洗干净，付了钱，让人送她回去。\n后来有人问他，那一晚到底写了些什么。东坡只说：“写了，洗了，又写了。”问的人以为他在打趣，他却认真得很。在他看来，字没写好，便不算写过。\n写不好的字留在纸上，是污了纸；留在人身上，是污了人。洗掉重来，不过是把污处重新变成干净的地方，好让下一次的笔能落得端正。\n他一生都是这样。被贬黄州的那些年，他写字写到半夜，纸用完了，便写在竹上，写在墙上，写在自己手掌心里。写完不满意，便用水洗掉，再写。有一回他写到天明，掌心被水泡得发白，字却还是没写好。旁人劝他将就着，他只说：“将就着写出来的字，不是我的字。”\n那一晚他什么也没做。不是他不想，是他觉得，字没写完，人便还没干净。干净了，才能再写。写不好，便只能再洗。洗到天亮，字还是没写完，他便什么都没做成。\n他后来老了，还是这样。\n有时夜里忽然想起某个字该怎么写，便独自坐到天明。墨干了，水凉了，字却始终没落下去。他也不着急。在他看来，字没写好之前，一切都还来得及。来得及洗，也来得及再写。写不好的，便不算写过。不算写过的，便还不脏。","en":"传说苏东坡爱字如命。\n那一晚，他忽然想起“剑”字该怎么写。\n不是平日里随意的临帖，是心里那一笔忽然清了。横竖撇捺，每一处转折都该落在什么地方，他躺在榻上，越想越清楚，越清楚越坐不住。\n正好，约了一歌姬，不好把别人撂在那儿！\n姑娘进门，沐浴更衣，妆未卸，人已躺平。东坡也不多言，只取了墨，就在她胸口起了第一笔。\n他写得很慢。第一笔横，墨色还浓；第二笔竖，他已觉肩头太窄，转腕不顺。写完一个“剑”，他盯着看了片刻，自己摇头，唤人端水来，用软布把胸口的字轻轻拭去，只留淡淡一痕。然后又写。这一次他换了位置，写在她背上。背比胸宽，他可以慢慢拉开笔势。可写到“刀”字旁时，他忽然觉得那一撇太浮，不像从骨里生出来的。他又洗掉，重新来过。\n一整夜，他都在她身上写字。写了，看，不满意，便洗。洗干净了，再写。有时写在手臂，有时写在腰侧，有时甚至写在她锁骨与胸口之间那一小块平坦处。墨干了又湿，湿了又干，姑娘身上的皮肤被软布反复擦拭，渐渐发红。她起初还等着他有别的动作，后来只是侧躺着，任他翻来覆去地摆弄。东坡始终没有碰她别的地方。他只写“剑”字。\n天亮时，他写到第十七个。墨已淡，人已倦，可那一笔他还是没写完。他停下来，看着姑娘背上最后那个未完的字，忽然觉得，这个“剑”字今夜是写不成了。他放下笔，把剩下的墨洗干净，付了钱，让人送她回去。\n后来有人问他，那一晚到底写了些什么。东坡只说：“写了，洗了，又写了。”问的人以为他在打趣，他却认真得很。在他看来，字没写好，便不算写过。\n写不好的字留在纸上，是污了纸；留在人身上，是污了人。洗掉重来，不过是把污处重新变成干净的地方，好让下一次的笔能落得端正。\n他一生都是这样。被贬黄州的那些年，他写字写到半夜，纸用完了，便写在竹上，写在墙上，写在自己手掌心里。写完不满意，便用水洗掉，再写。有一回他写到天明，掌心被水泡得发白，字却还是没写好。旁人劝他将就着，他只说：“将就着写出来的字，不是我的字。”\n那一晚他什么也没做。不是他不想，是他觉得，字没写完，人便还没干净。干净了，才能再写。写不好，便只能再洗。洗到天亮，字还是没写完，他便什么都没做成。\n他后来老了，还是这样。\n有时夜里忽然想起某个字该怎么写，便独自坐到天明。墨干了，水凉了，字却始终没落下去。他也不着急。在他看来，字没写好之前，一切都还来得及。来得及洗，也来得及再写。写不好的，便不算写过。不算写过的，便还不脏。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122148315311858165","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":1390},{"id":"2122148040123527335","h":"fxtrader","ts":1794794495,"zh":"#数据 中国\n10月规模以上工业增加值同比增4.8%，预期5.3%；\n10月社会消费品零售总额同比增0.4%，预期0.8%；\n10月城镇调查失业率5.1%，前值5.5%；\n1-10月城镇固定资产投资同比-8.1%，预期-7.0%。","en":"#数据 中国\n10月规模以上工业增加值同比增4.8%，预期5.3%；\n10月社会消费品零售总额同比增0.4%，预期0.8%；\n10月城镇调查失业率5.1%，前值5.5%；\n1-10月城镇固定资产投资同比-8.1%，预期-7.0%。","zh_src":"native","lang"  are becoming increasingly attractive to renewables developers such as Singapore-based Peak Energy, as governments accelerate clean energy adoption to overcome fuel disruptions","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122122488922468613","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-16/peak-energy-eyes-korea-green-projects-as-war-upends-fuel-flows?taid=6afa4c33d0eea100019afedd&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["原油能源"],"lk":8,"rt":2,"rp":0,"vw":11598},{"id":"2122122065050468538","h":"dmjk001","ts":1794788302,"zh":"彭博：英伟达公司罢免黄仁勋首席执行官职务数日后，压力持续加大，财政部长斯科特·贝森特敦促该公司进行“大刀阔斧”的领导层改组，并如实说明其珍贵 AI 芯片遵守出口管制的情况。\n贝森特周日试图排除黄仁勋回归的可能性，在一系列指控称英伟达协助向中国实体出售先进人工智能芯片之后，他呼吁英伟达董事会从公司外部寻找新的领导层。近日，这位财政部长还将矛头指向商务部，称其在执行美国出口限制方面做得不够。\n“这让我觉得，在董事会物色新领导人的过程中，他们需要从公司外部寻找人选，”贝森特在接受福克斯新闻 《周日早间期货》 采访时表示。“他们需要一次大刀阔斧的改组。”\n“我想不断回到英伟达的文化是什么这个问题上，他们是否在推动这些看似非法的销售，以抬高收入和利润？”贝森特说，“我认为，我们需要董事会在未来10天内给出答案，外部法律顾问也要给出答案。”\n“正如我所说，许多其他部门都在推动此事，而商务部掌握着决定权，”这位财政部长表示。","en":"彭博：英伟达公司罢免黄仁勋首席执行官职务数日后，压力持续加大，财政部长斯科特·贝森特敦促该公司进行“大刀阔斧”的领导层改组，并如实说明其珍贵 AI 芯片遵守出口管制的情况。\n贝森特周日试图排除黄仁勋回归的可能性，在一系列指控称英伟达协助向中国实体出售先进人工智能芯片之后，他呼吁英伟达董事会从公司外部寻找新的领导层。近日，这位财政部长还将矛头指向商务部，称其在执行美国出口限制方面做得不够。\n“这让我觉得，在董事会物色新领导人的过程中，他们需要从公司外部寻找人选，”贝森特在接受福克斯新闻 《周日早间期货》 采访时表示。“他们需要一次大刀阔斧的改组。”\n“我想不断回到英伟达的文化是什么这个问题上，他们是否在推动这些看似非法的销售，以抬高收入和利润？”贝森特说，“我认为，我们需要董事会在未来10天内给出答案，外部法律顾问也要给出答案。”\n“正如我所说，许多其他部门都在推动此事，而商务部掌握着决定权，”这位财政部长表示。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXNKU-SbIAArimX.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122122065050468538","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":2,"rt":0,"rp":0,"vw":895},{"id":"2122121229234500033","h":"business","ts":1794788102,"zh":"Canaccord Genuity 周日表示，已达成协议，将其英国财富管理业务出售给 Centerbridge 和 Mubadala 的附属公司，预计这笔交易将为该公司带来约 7.45 亿美元的收益","en":"Canaccord Genuity said on Sunday it entered an agreement to sell its UK wealth management business operations to affiliates of Centerbridge and Mubadala in a deal expected to generate about $745 million in proceeds for the company","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122121229234500033","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-15/canaccord-says-to-sell-uk-wealth-arm-to-centerbridge-mubadala?taid=6afa4b06718669000140b624&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":2,"rt":0,"rp":0,"vw":12616},{"id":"2122120900598243390","h":"bbcchinese","ts":1794788024,"zh":"前英伟达执行长黄仁勋（Jensen Huang）已被传唤下个月到美国参议院委员会作证，说明他与一名疑似中国间谍女性的外遇。","en":"前英伟达执行长黄仁勋（Jensen Huang）已被传唤下个月到美国参议院委员会作证，说明他与一名疑似中国间谍女性的外遇。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/bbcchinese/status/2122120900598243390","l":["bbc.in"],"ln":[{"u":"https://bbc.in/48kuyFu","d":"bbc.in"}],"t":["AI科技"],"lk":3,"rt":0,"rp":2,"vw":3260},{"id":"2122119971341775064","h":"business","ts":1794787802,"zh":"Netflix 正在重新考虑其亲身体验的策略，并在节目前添加预告片。","en":"Netflix is rethinking its strategy for its in-person experiences and adding trailers before its show.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122119971341775064","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-15/netflix-resets-its-experiential-strategy?taid=6afa49dad0eea100019afeca&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":9,"rt":2,"rp":3,"vw":15951},{"id":"2122118709883859422","h":"business","ts":1794787502,"zh":"由于一系列恶劣天气影响了消费者支出，日本经济一年以来首次收缩，这突显了国内需求的脆弱性","en":"Japan’s economy contracted for the first time in a year as a spate of inclement weather weighed on consumer spending, highlighting the fragility of domestic demand","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122118709883859422","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-15/japan-s-economy-contracts-as-bad-weather-weighs-on-consumption?taid=6afa48ae718669000140b61b&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":1,"rt":1,"rp":0,"vw":7079},{"id":"2122117463135375607","h":"business","ts":1794787204,"zh":"在英伟达将黄仁勋免去首席执行官职务几天后，压力正在增加，美国财政部长斯科特·贝森特敦促公司进行“彻底”的领导层重组，并公开其在人工智能芯片出口管制方面的合规情况","en":"Pressure is mounting on Nvidia days after it ousted Jensen Huang as CEO, with Treasury Secretary Scott Bessent urging the company to make a “dramatic” leadership shakeup and come clean about its compliance with AI chip export controls","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122117463135375607","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-15/nvidia-s-ceo-search-draws-fire-with-bessent-s-call-for-shakeup?taid=6afa4784191e680001edd759&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技","关税贸易"],"lk":4,"rt":0,"rp":1,"vw":8254},{"id":"2122116195339907343","h":"business","ts":1794786902,"zh":"澳大利亚资源部长表示担忧，由国家支持的买家中国矿产资源集团与铁矿石供应商的谈判可能违反国际贸易规则","en":"Australia’s resources minister has expressed concern that state-backed buyer China Mineral Resources Group's negotiations with iron ore suppliers could breach international trade rules","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122116195339907343","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-15/australia-warns-china-iron-ore-push-could-breach-trade-rules?taid=6afa4656718669000140b5f1&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["关税贸易"],"lk":2,"rt":0,"rp":0,"vw":11343},{"id":"2122115302049906742","h":"cnfinancewatch","ts":1794786689,"zh":"散户热议｜2026-11-16·早间\n数据时点：国内社区浏览截至北京时间11月16日07:50；海外讨论覆盖至美东11月15日晚。国内部分直接打开了韭研公社首页，引用的是公开可见的帖子标题与摘要，帖子正文多需登录，未能全文引用。Reddit与Stocktwits个股页未能直接抓取实时情绪，海外部分改用StonkHub对WSB的统计与Stocktwits已刊新闻稿，均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周一的剧本几乎写给了华为机器人\n周一早上打开韭研公社，置顶依旧是长韭杯实盘大赛、站规与“打击吹票等不良行为”专帖。往下翻，最集中的话题只有一个：今天下午的华为云CloudRobo发布会。\n第一类是华为具身智能的标的梳理。11月14日晚的帖子按合作深度列出亿嘉和、拓斯达、福龙马、埃夫特、软通动力，摘要写明亿嘉和为“深化合作伙伴”、福龙马与华为云签有2亿元环卫具身智能合同。11月15日中午另一篇把亿嘉和称作“华为机器人版的赛力斯”，依据是今年7月的合作备忘录：华为云提供大小脑平台，亿嘉和负责设计制造。还有调研纪要帖讲拓斯达人形机器人工业落地。社区的逻辑很清晰：发布会是确定日程，标的辨识度够高。\n第二类是多点开花的题材映射。周日早间有商业航天帖，讲星舰上面级首次被“筷子”捕获，作者自己也写了“主要是情绪映射”，并注明助推器回收失败。周日中午有物理AI产业拐点长文，周五还有帖子讨论美国新规草案对远程算力的限制，推出“GPU维保”这类后市场支线；后者依据是“流出的草案”，我们未能核实，只能当作传闻看。另有周末资讯汇总帖提到周五“4000多家下跌”，逆势方向是影视院线、国产替代与华为机器人，还提到BLG夺得英雄联盟全球总决赛冠军，给电竞与游戏添了一个周末话题。\n第三类是宏观被压缩成一行字。周日晚的周末研报精选里，“美银预计连续三次加息”“外汇存款准备金率今起由4%提高至6%”排在宏观第一、第二条，但在首页可见摘要中，几乎没有帖子讨论今天上午10点的10月经济数据，也较少看到新版医保目录的个股梳理。\n与券商口径的异同：相同点是都承认机器人、院线是周五的逆势方向；不同点是社区把华为发布会当成“周一主线”，而券商框架更看重上午的宏观数据与周二英伟达财报。被忽略的风险有三：一是亿嘉和上周二已出现开盘快速涨停，发布会当天容易兑现，赛力斯类比只是作者推断，并非合作条款；二是周五机器人龙头已批量跌停，高低切换后再回头接力，亏钱效应可能二次放大；三是吴清提到要优化量化与减持制度规则，清朗专帖仍在置顶，个股吹票帖要打折看。\n海外：一边看空英伟达，一边排队买Anthropic\nWallStreetBets方面（StonkHub统计，二手）：过去7天有1093名WSB用户讨论英伟达，提及1515次，较昨日午间看到的1064人略增；全Reddit口径下看空41%、看多37.8%、中性21.5%，看空略占上风，分类器平均置信度只有66%，不宜过度解读。检索到的二手汇总显示，对Anthropic上市的讨论里质疑估值、护城河与现金消耗的声音较多，但我们未能逐条核看原帖，不作量化。\nStocktwits方面：个股页实时情绪未能打开。能核验的是11月12日官方新闻稿（二手、非当日实时）：当时英伟达散户情绪为“极度看多”，站内投票58%选择抄底、42%回避，当周消息量增约593%。WSB偏空与Stocktwits偏多并不矛盾，前者更多是期权玩家在押财报波动，后者是持股者在摊低成本。\n专业资金那边，口径更谨慎。已核实：Semafor称Anthropic认购约6倍，但AI“卖铲子”公司自6月以来市值已蒸发约4.2万亿美元；分析师提醒，英伟达周二财报若不及预期，会给周四的上市蒙上阴影。分析师丹·艾维斯（Yorkville Ives）仍预期财报需求指标较上季加速。散户容易忽略的是：英伟达与Anthropic已绑在一起，上市后英伟达预计向其投资约100亿美元，两件事不是独立的两次机会，而是同一笔AI风险敞口。\n小结：国内散户押一场发布会，海外散户押一份财报，共同的风险都是“事件当天兑现”。追高之前，先想清楚自己赌的是消息本身，还是消息之后还有没有人接力。\n风险提示：以上为公开讨论整理，二手口径已标注，不构成投资建议。","en":"散户热议｜2026-11-16·早间\n数据时点：国内社区浏览截至北京时间11月16日07:50；海外讨论覆盖至美东11月15日晚。国内部分直接打开了韭研公社首页，引用的是公开可见的帖子标题与摘要，帖子正文多需登录，未能全文引用。Reddit与Stocktwits个股页未能直接抓取实时情绪，海外部分改用StonkHub对WSB的统计与Stocktwits已刊新闻稿，均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周一的剧本几乎写给了华为机器人\n周一早上打开韭研公社，置顶依旧是长韭杯实盘大赛、站规与“打击吹票等不良行为”专帖。往下翻，最集中的话题只有一个：今天下午的华为云CloudRobo发布会。\n第一类是华为具身智能的标的梳理。11月14日晚的帖子按 ，熬夜给它上户口。\n7. 总觉得自己老了，不是成熟，是给身体发指令：收到，开始老化。身体执行力强得可怕。\n虚弱从来不是突然发生的，是你每天亲手给它续费，最后它自动扣款。","en":"40岁暴论小段子：没人提前提醒你，因为身体喜欢搞突然袭击。\n1. 停止力量训练，不是休息，是给肌肉发裁员通知。你不练，它真走，还不给赔偿金。\n2. 长期睡眠不足，不是熬夜，是给大脑开加速老化会员。皮肤只是最先暴露的实习生。\n3. 蛋白质吃不够，不是吃得清淡，是身体开始拆承重墙。力气不是没了，是被拿去抵债了。\n4. 晒不到太阳，不是防晒做得好，是骨头在悄悄变成脆脆鲨。阳光不要钱，钙片要。\n5. 久坐不动，不是省体力，是让新陈代谢提前退休。你坐着，代谢躺着，最后一起摆烂。\n6. 腹部变大不是怀孕，是压力怀了脂肪，久坐给它接生，熬夜给它上户口。\n7. 总觉得自己老了，不是成熟，是给身体发指令：收到，开始老化。身体执行力强得可怕。\n虚弱从来不是突然发生的，是你每天亲手给它续费，最后它自动扣款。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122114737928573166","l":[],"ln":[],"t":[],"lk":1,"rt":1,"rp":1,"vw":661},{"id":"2122114619456344098","h":"cnfinancewatch","ts":1794786526,"zh":"华尔街观察｜SPY真正的抄底密码，给你一把超额收割标普的金钥匙。\n免责声明：本文基于公开回测数据整理，仅为技术思路探讨，不构成任何投资建议。DYOR，自主决策。\n很多老股民抄底，习惯死等RSI跌到30以下，认定深度超卖就是底部。这份对标普500ETF（SPY）的逆向复盘，直接推翻了这个流传多年的惯性思维。\n我不纠结哪个指标事后好看，选择倒推底部。提取近两年501根SPY日线，筛选出：10个交易日内反弹5%以上的7个关键低点，以及下跌超5%的3个阶段高点。把13个常用技术指标，在每一个转折点的数值全部扒出来，和普通交易日的数据做对比，看看底部降临那一刻，指标真实读数到底是什么。\n先说最震撼的结论：布林极限%B（%BB）完胜一众传统指标。\n简单讲人话解释%B：布林带大家都熟，上轨、中轨、下轨三条线。%B就是把价格在布林带里的位置换算成数字。\n1=碰到上轨，0=碰到下轨，小于0代表收盘价已经跌到布林下轨的外面。\n回测结果：7个有效底部里面6个，拐点收盘%B＜0.15，命中率86%。而阶段顶部，没有一例出现这个信号。平日里，只有7%的普通交易日，才会跌到这个区间。\n再把几个热门指标的底部中位数值摊开，一看差距就出来了：\n1. MACD柱：‑2.80，普通行情+0.42。灵敏度够，但是噪音巨大，接近一半都是假信号，容易被反复打脸。\n2. 布林%B：0.11，普通行情0.67。信号最干净，本次回测最强单一过滤器。\n3. KDJ的K值：16，普通行情83；D值：21，普通行情83。\n4. RSI14：真实底部中位数39.6，而不是大家迷信的30！\n暴论来了：死守RSI＜30抄底，仅仅捕捉到29%的市场真实底部。一味等待更深的超卖，只会眼睁睁错过绝大多数反弹行情。过度苛求极致恐慌，反而踏空。\n经过复盘，提炼出三套可直接拿去实践的交易规则，按保守到激进排序：\n✅方案一（简洁版）：布林%B低于0.15。胜率最高的单一条件，适合喜欢简单粗暴的交易者。\n✅方案二（降噪版）：%B＜0.15 + 现价在50日均线下方。保留绝大多数底部机会，进一步过滤杂波，减少无效试错。\n✅方案三（极致保守）：RSI＜35 并且%B＜0.15。虽然仅抓到29%的底部，但是本次样本零假信号。信号很少，一旦触发，博弈反弹的置信度极高。\n拿近期历史信号印证：\n2026‑07‑29，%B‑0.16，后续反弹6.1%\n2026‑06‑26，%B0.14，后续反弹5.0%\n2026‑03‑30，%B‑0.02，后续反弹7.6%\n最后讲最关键的短板，避免大家无脑神话这套法则。\n样本只有7个底部，数量偏小；观察周期整体处于牛市环境，没有经历深度熊市的严酷考验。9月曾4次触发%B的低位，却没能走出5%的反弹。\n定位要清晰：%B跌到0.15以下，代表市场进入洗盘区，是恐慌充分释放的预警，不等于底部已经100%确认。\n我已经搭建自动化脚本，实时监控该触发器，一旦洗盘信号出现，自动推送提醒到Slack。后续拉长时间样本，继续验证这套择时体系的长期有效性。\n技术分析没有圣杯，逆向复盘的意义，就是打破教科书的刻板教条，跳出网上流传的口诀，去看一看市场拐点发生的那一刻，真相究竟是什么。\n觉得有用可以收藏，以后恐慌下跌的时候，别再死盯着RSI30，多看一看布林极限%B的位置。","en":"华尔街观察｜SPY真正的抄底密码，给你一把超额收割标普的金钥匙。\n免责声明：本文基于公开回测数据整理，仅为技术思路探讨，不构成任何投资建议。DYOR，自主决策。\n很多老股民抄底，习惯死等RSI跌到30以下，认定深度超卖就是底部。这份对标普500ETF（SPY）的逆向复盘，直接推翻了这个流传多年的惯性思维。\n我不纠结哪个指标事后好看，选择倒推底部。提取近两年501根SPY日线，筛选出：10个交易日内反弹5%以上的7个关键低点，以及下跌超5%的3个阶段高点。把13个常用技术指标，在每一个转折点的数值全部扒出来，和普通交易日的数据做对比，看看底部降临那一刻，指标真实读数到底是什么。\n先说最震撼的结论：布林极限%B（%BB）完胜一众传统指标。\n简单讲人话解释%B：布林带大家都熟，上轨、中轨、下轨三条线。%B就是把价格在布林带里的位置换算成数字。\n1=碰到上轨，0=碰到下轨，小于0代表收盘价已经跌到布林下轨的外面。\n回测结果：7个有效底部里面6个，拐点收盘%B＜0.15，命中率86%。而阶段顶部，没有一例出现这个信号。平日里，只有7%的普通交易日，才会跌到这个区间。\n再把几个热门指标的底部中位数值摊开，一看差距就出来了：\n1. MACD柱：‑2.80，普通行情+0.42。灵敏度够，但是噪音巨大，接近一半都是假信号，容易被反复打脸。\n2. 布林%B：0.11，普通行情0.67。信号最干净，本次回测最强单一过滤器。\n3. KDJ的K值：16，普通行情83；D值：21，普通行情83。\n4. RSI14：真实底部中位数39.6，而不是大家迷信的30！\n暴论来了：死守RSI＜30抄底，仅仅捕捉到29%的市场真实底部。一味等待更深的超卖，只会眼睁睁错过绝大多数反弹行情。过度苛求极致恐慌，反而踏空。\n经过复盘，提炼出三套可直接拿去实践的交易规则，按保守到激进排序：\n✅方案一（简洁版）：布林%B低于0.15。胜率最高的单一条件，适合喜欢简单粗暴的交易者。\n✅方案二（降噪版）：%B＜0.15 + 现价在50日均线下方。保留绝大多数底部机会，进一步过滤杂波，减少无效试错。\n✅方案三（极致保守）：RSI＜35 并且%B＜0.15。虽然仅抓到29%的底部，但是本次样本零假信号。信号很少，一旦触发，博弈反弹的置信度极高。\n拿近期历史信号印证：\n2026‑07‑29，%B‑0.16，后续反弹6.1%\n2026‑06‑26，%B0.14，后续反弹5.0%\n2026‑03‑30，%B‑0.02，后续反弹7.6%\n最后讲最关键的短板，避免大家无脑神话这套法则。\n样本只有7个底部，数量偏小；观察周期整体处于牛市环境，没有经历深度熊市的严酷考验。9月曾4次触发%B的低位，却没能走出5%的反弹。\n定位要清晰：%B跌到0.15以下，代表市场进入洗盘区，是恐慌充分释放的预警，不等于底部已经100%确认。\n我已经搭建自动化脚本，实时监控该触发器，一旦洗盘信号出现，自动推送提醒到Slack。后续拉长时间样本，继续验证这套择时体系的长期有效性。\n技术分析没有圣杯，逆向复盘的意义，就是打破教科书的刻板教条，跳出网上流传的口诀，去看一看市场拐点发生的那一刻，真相究竟是什么。\n觉得有用可以收藏，以后恐慌下跌的时候，别再死盯着RSI30，多看一看布林极限%B的位置。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122114619456344098","l":[],"ln":[],"t":["美股"],"lk":1,"rt":0,"rp":0,"vw":606},{"id":"2122114512803487917","h":"cnfinancewatch","ts":1794786501,"zh":"我们为什么不投女儿可能接班的企业？\n宗族不认可，女婿越权，党政关系不稳，宏观把控失当……\n案例：\n按“市值跌=失败，市值涨=成功”这个标准，女性接班名单基本团灭。\n新希望刘畅，1800亿市值干到300多亿，跌掉1400亿，失败。\n碧桂园杨惠妍，销售额从2199亿掉到402亿，失败。\n美邦胡佳佳，7年亏32亿，失败。\n娃哈哈宗馥莉，2024营收反弹也没用，2025年10月被赶下董事长席位，失败。\n天齐锂业蒋安琪，2024上市以来最大亏损，失败。\n凯撒郑雅珊，两年亏14.5亿，失败。\n如意邱晨冉，失败。\n达利许阳阳，营收下滑，失败。\n浙江美大夏兰， 总票房规模也仅在520亿左右。\n一个诞生仅仅数年的互联网内容产品，单一平台体量，已经快要追上全国电影工业几十年积累的总盘子。\n这不是短暂热度，是新旧娱乐时代的正式交接。\n按照当前增速线性外推，2027年AI短剧的产业规模，将全面碾压传统国产电影行业，没有任何悬念。\n而这，仅仅是风暴的序幕。\n一、字节真正的终极杀招：大模型+网文+短剧的全球闭环\n资本市场目前最大的认知盲区，是低估了字节这套“全链路AI内容工业化”的终极天花板。\n随着AI Token成本持续崩塌、模型能力指数级跃升，字节正在打通一套全球独一无二的闭环：\n海量网文IP沉淀（番茄小说）→ 零成本爆款剧本库 → 抖音全域流量测试 → Seedance视频大模型AI制片 → 红果短剧+海外PineDrama全球变现\n这套体系，实现了史无前例的三低革命：\n极低剧本成本、极低拍摄制作成本、极低全球获客成本。\n传统影视最大的成本：编剧、明星、剧组、场地、后期、宣发，几乎全部被AI模型清零。\n这是降维打击，不是行业竞争。\n当前短剧板块，在字节整体收入占比不足3%，属于边缘业务。\n但未来3-4年，这套海内外联动的AI短剧生态，极有望为字节新增400-500亿美元年化收入。\n什么概念？\n等同于再造四分之一个字节，体量对标当下 OpenAI + Anthropic 的总和。\n这也是为什么海外VC至今没有完全看懂：\n他们习惯了好莱坞、流媒体、长视频的传统估值逻辑，完全看不懂AI工业化内容的爆发势能。\n二、为什么短剧在国内能彻底打爆？是人性，不是流量\n很多人把短剧爆火归结为“碎片化娱乐”，这是浅层认知。\n短剧真正的底层逻辑，是当代高压社会的情绪补位。\n过去几十年，国人娱乐供给长期单一、严肃、压抑；社会长期内卷、高强度工作、精神紧绷。\n大众内心天然极度渴求高密度、高反馈、强情绪释放的内容。\n传统院线电影、主流影视剧，越来越脱离普通人的情绪需求：叙事拖沓、价值观说教、剧情悬浮、缺乏爽感。\n而网文衍生的短剧体系，精准击中人性刚需：\n高节奏、强反转、即时反馈、情绪拉满、解压治愈。\n不是短剧太“俗”，而是传统文娱太久不懂普通人。\n短剧的胜利，是情绪价值对艺术说教的胜利，是大众解压需求对精英叙事的替代。\n三、下一步：AI画质趋近真人，全球影视体系面临降维击穿\n更恐怖的拐点，将在未来1-2年彻底到来。\nAI视频模型的画质、光影、人物动态、细节真实度，将无限逼近真人实拍。\n届时，观众对AI内容的心理壁垒会彻底消失，只剩极致的沉浸体验。\n放眼全球，传统娱乐巨头早已外强中干：\n• 全球电影总票房：约330亿美元\n• Netflix全年营收：约510亿美元\n• YouTube广告收入：约600亿美元\n• 迪士尼视频业务：约250亿美元\n• 华纳HBO体系：约120亿美元\n这些盘踞全球几十年的超级巨头，未来都会成为字节AI短剧生态的替代对象。\n依托极致低成本工业化优势，字节可以全面覆盖欧亚非拉非英语市场，击穿全球中低端影视剧市场，刚性抢占350-400亿美元全球娱乐份额。\n除此之外，全球创作者持续调用字节Seedance大模型生产内容，还能为公司稳定带来百亿级别的模型工具收入。\n一鱼双吃：内容变现+模型算力变现。\n四、美国影视巨头几乎无解：体制锁死，无法转身\n为什么这场革命，只能由中国公司完成？\n好莱坞、美国影视行业，被两大枷锁彻底锁死：\n1. 极致复杂的版权诉讼体系\n2. 强大的演员工会、编剧工会体制束缚\n任何AI替代拍摄、AI替代演员、AI改编剧本的尝试，都会遭遇集体诉讼、罢工、制度阻力。\n美国文娱体系，已经没有颠覆性迭代的制度空间。\n而国内市场化充分、迭代极快、生态灵活，率先完成AI内容工业化跑通。\n随之而来的，是全球低端剧组、普通演员、传统制作人员的失业潮。\n国内已经提前上演：横店棚控率暴跌、中小剧组大量倒闭、群演岗位锐减、传统长剧开机量断崖下滑。\n这是一次AI对传统文娱劳动力的系统性替代，不可逆、不可挡。\n五、时代感慨：AI工业化时代，真正的顶级IP终将被重制\n从网文时代的《无限恐怖》《阳神》《龙蛇演义》开始，整整一代人的审美、热血、世界观，都由国产网文构建。\n过去受限于拍摄技术、资金、特效、剧本能力，这些顶级神作始终无法完美影视化。\n但现在，AI视频大模型彻底打破所有制作枷锁。\n未来唯一的悬念只剩一个：\n何时会有顶尖创作者，突破传统版权桎梏，用AI 1:1完美还原《无限恐怖》《杀戮都市》这类殿堂级神作？\n当顶级世界观 + AI无限生产力相遇，\n新一轮全球文娱审美颠覆，才刚刚真正开始。","en":"深度产业洞察：AI短剧颠覆全球娱乐，字节开启400亿美金新增收入时代\n当下中国文娱产业，正在发生一场绝大多数人低估的结构性革命。\n传统电影、长视频、好莱坞体系，维持了几十年的内容霸权，正在被一种全新的、AI工业化、极致低成本的内容模式快速瓦解。\n核心标志性数据极具冲击力：\n2026年红果短剧年化收入已无限逼近400亿级别。\n而整个中国院线电影，全年总票房规模也仅在520亿左右。\n一个诞生仅仅数年的互联网内容产品，单一平台体量，已经快要追上全国电影工业几十年积累的总盘子。\n这不是短暂热度，是新旧娱乐时代的正式交接。\n按照当前增速线性外推，2027年AI短剧的产业规模，将全面碾压传统国产电影行业，没有任何悬念。\n而这，仅仅是风暴的序幕。\n一、字节真正的终极杀招：大模型+网文+短剧的全球闭环\n资本市场目前最大的认知盲区，是低估了字节这套“全链路AI内容工业化”的终极天花板。\n随着AI Token成本持续崩塌、模型能力指数级跃升，字节正在打通一套全球独一无二的闭环：\n海量网文IP沉淀（番茄小说）→ 零成本爆款剧本库 → 抖音全域流量测试 → Seedance视频大模型AI制片 → 红果短剧+海外PineDrama全球变现\n这套体系，实现了史无前例的三低革命：\n极低剧本成本、极低拍摄制作成本、极低全球获客成本。\n传统影视最大的成本：编剧、明星、剧组、场地、后期、宣发，几乎全部被AI模型清零。\n这是降维打击，不是行业竞争。\n当前短剧板块，在字节整体收入占比不足3%，属于边缘业务。\n但未来3-4年，这套海内外联动的AI短剧生态，极有望为字节新增400-500亿美元年化收入。\n什么概念？\n等同于再造四分之一个字节，体量对标当下 OpenAI + Anthropic 的总和。\n这也是为什么海外VC至今没有完全看懂：\n他们习惯了好莱坞、流媒体、长视频的传统估值逻辑，完全看不懂AI工业化内容的爆发势能。\n二、为什么短剧在国内能彻底打爆？是人性，不是流量\n很多人把短剧爆火归结为“碎片化娱乐”，这是浅层认知。\n短剧真正的底层逻辑，是当代高压社会的情绪补位。\n过去几十年，国人娱乐供给长期单一、严肃、压抑；社会长期内卷、高强度工作、精神紧绷。\n大众内心天然极度渴求高密度、高反馈、强情绪释放的内容。\n传统院线电影、主流影视剧，越来越脱离普通人的情绪需求：叙事拖沓、价值观说教、剧情悬浮、缺乏爽感。\n而网文衍生的短剧体系，精准击中人性刚需：\n高节奏、强反转、即时反馈、情绪拉满、解压治愈。\n不是短剧太“俗”，而是传统文娱太久不懂普通人。\n短剧的胜利，是情绪价值对艺术说教的胜利，是大众解压需求对精英叙事的替代。\n三、下一步：AI画质趋近真人，全球影视体系面临降维击穿\n更恐怖的拐点，将在未来1-2年彻底到来。\nAI视频模型的画质、光影、人物动态、细节真实度，将无限逼近真人实拍。\n届时，观众对AI内容的心理壁垒会彻底消失，只剩极致的沉浸体验。\n放眼全球，传统娱乐巨头早已外强中干：\n• 全球电影总票房：约330亿美元\n• Netflix全年营收：约510亿美元\n• YouTube广告收入：约600亿美元\n• 迪士尼视频业务：约250亿美元\n• 华纳HBO体系：约120亿美元\n这些盘踞全球几十年的超级巨头，未来都会成为字节AI短剧生态的替代对象。\n依托极致低成本工业化优势，字节可以全面覆盖欧亚非拉非英语市场，击穿全球中低端影视剧市场，刚性抢占350-400亿美元全球娱乐份额。\n除此之外，全球创作者持续调用字节Seedance大模型生产内容，还能为公司稳定带来百亿级别的模型工具收入。\n一鱼双吃：内容变现+模型算力变现。\n四、美国影视巨头几乎无解：体制锁死，无法转身\n为什么这场革命，只能由中国公司完成？\n好莱坞、美国影视行业，被两大枷锁彻底锁死：\n1. 极致复杂的版权诉讼体系\n2. 强大的演员工会、编剧工会体制束缚\n任何AI替代拍摄、AI替代演员、AI改编剧本的尝试，都会遭遇集体诉讼、罢工、制度阻力。\n美国文娱体系，已经没有颠覆性迭代的制度空间。\n而国内市场化充分、迭代极快、生态灵活，率先完成AI内容工业化跑通。\n随之而来的，是全球低端剧组、普通演员、传统制作人员的失业潮。\n国内已经提前上演：横店棚控率暴跌、中小剧组大量倒闭、群演岗位锐减、传统长剧开机量断崖下滑。\n这是一次AI对传统文娱劳动力的系统性替代，不可逆、不可挡。\n五、时代感慨：AI工业化时代，真正的顶级IP终将被重制\n从网文时代的《无限恐怖》《阳神》《龙蛇演义》开始，整整一代人的审美、热血、世界观，都由国产网文构建。\n过去受限于拍摄技术、资金、特效、剧本能力，这些顶级神作始终无法完美影视化。\n但现在，AI视频大模型彻底打破所有制作枷锁。\n未来唯一的悬念只剩一个：\n何时会有顶尖创作者，突破传统版权桎梏，用AI 1:1完美还原《无限恐怖》《杀戮都市》这类殿堂级神作？\n当顶级世界观 + AI无限生产力相遇，\n新一轮全球文娱审美颠覆，才刚刚真正开始。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2122114113111474450","l":[],"ln":[],"t":["AI科技","财报"],"lk":2,"rt":1,"rp":1,"vw":596},{"id":"2122113909796770095","h":"cnfinancewatch","ts":1794786357,"zh":"74支行业主题ETF，截止到昨天的今年收益倒数前十名的，基本是交易拥挤度低，业绩预期差，其中很多都是涉及国家未来产业，有可能是2027年未来有潜力的方向之一。","en":"74支行业主题ETF，截止到昨天的今年收益倒数前十名的，基本是交易拥挤度低，业绩预期差，其中很多都是涉及国家未来产业，有可能是2027年未来有潜力的方向之一。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXNDWc6aoAAids2.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2122113909796770095","l":[],"ln":[],"t":[],"lk":1,"rt":0,"rp":0,"vw":594},{"id":"2122113752585904462","h":"dmjk001","ts":1794786320,"zh":"FT：黄仁勋与盟友讨论英伟达 CEO 的回归\n黄仁勋正在考虑重返英伟达担任首席执行官，硅谷的盟友正向该公司董事会施压，要求其恢复他的职务。\n据多位知情人士透露，黄仁勋已与密友讨论过回归的可能性，他们正在组建一个由硅谷高管组成的“作战室”，为这位英伟达前掌门人的回归进行游说，并将争取白宫的支持。","en":"FT：黄仁勋与盟友讨论英伟达 CEO 的回归\n黄仁勋正在考虑重返英伟达担任首席执行官，硅谷的盟友正向该公司董事会施压，要求其恢复他的职务。\n据多位知情人士透露，黄仁勋已与密友讨论过回归的可能性，他们正在组建一个由硅谷高管组成的“作战室”，为这位英伟达前掌门人的回归进行游说，并将争取白宫的支持。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXNC6Mbb0AAg8HU.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2122113752585904462","l":[],"ln":[],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":871},{"id":"2122113686563106921","h":"business","ts":1794786304,"zh":"安迪·伯纳姆将在周一对伦敦金融区的听众表示，英国脱欧没有奏效，必须寻求新的协议，本周晚些时候将在与欧盟的峰会上开始讨论。","en":"Andy Burnham will tell an audience in London’s financial district on Monday that Brexit has not worked and a new deal must be sought, starting at a summit with the European Union later this week","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2122113686563106921","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-15/burnham-to-tell-city-of-london-audience-brexit-has-not-worked?taid=6afa4400718669000140b5e8&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":6,"rt":1,"rp":2,"vw":13264},{"id":"2122113368584491389","h":"business","ts":1794786228,"zh":"今日必读\n👜硅谷盟友推动黄仁勋重返公司\n🎒美伊冲突“非战非和”僵局难破\n👝美国老旧航空管理系统再敲警钟\n获取免费中文电子报《彭博财经早茶》与音频播报，聚焦中国与全球市场最新动向，并有周末特别推送。\nA daily Chinese-language briefing and audio broadcast of what's moving markets in China and around the world. Plus, a weekend edition.","en":"今日必读\n👜硅谷盟友推动黄仁勋重返公司\n🎒美伊冲突“非战非和”僵局难破\n👝美国老旧航空管理系统再敲警钟\n获取免费中文电子报《彭博财经早茶》与音频播报，聚焦中国与全球市场最新动向，并有周末特别推送。\nA daily Chinese-language briefing and audio broadcast of what's moving markets in China and around the world. Plus, a weekend edition.","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/business/status/2122113368584491389","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/account/newsletters/china-markets?taid=6afa43b48a00c900012277ea&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":0,"rp":0,"vw":13410},{"id":"2122112718627078363","h":"cnfinancewatch","ts":1794786073,"zh":"热点财经新闻综述｜2026-11-16·早间\n数据时点：A股为11月13日（周五）收盘，美股为美东11月13日收盘；周末与隔夜消息整理截至北京时间11月16日07:50。本期邮箱新增一封热点财经邮件（11月15日晚间版），11月16日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照官方或主流媒体公开报道。晚间邮件里写作“今日涨停”的个股，实为周五盘面，周末沪深休市。\n今日判断\n周一开盘前，最硬的变量不在题材里，而在两个日程上：上午9:30的70城房价、10:00的10月工业、社零、固投与地产数据（国新办发布会已核实），以及本周二美股盘后英伟达首份“后黄仁勋”财报、周三晚Anthropic定价。隔夜美股期货小幅走高，纳指100期货涨约0.6%，恒指期货略高于周五收盘，外盘没有给出恐慌信号。我们对今天的基调是：数据落地前不抢跑，创新药与院线首板方向可以持有观察，算力硬件等到周二财报再决定，高位连板继续回避。\n三大利多方向（由强到弱）\n一、医保目录落地，创新药拿到确定性的放量通道。已核实：国家医保局与人社部11月14日发布2026年版目录，新增107种药品，其中51个为1类创新药，数量创新高；商保创新药目录新增12种，合计28种，2027年1月1日起执行。恒瑞医药、复星医药、首药控股、艾力斯、京新药业等已公告相关品种纳入或续约。为什么重要：这是基本面事件，不靠情绪接力，对已有商业化产品的创新药企是收入兑现，对CXO是间接景气。制约：谈判降价幅度决定利润弹性，部分品种市场早有预期，开盘高开过多反而要防兑现。\n二、票房破320亿，院线从题材回到数据。已核实：截至11月15日，2026年度电影总票房（含预售）突破320亿元，年度前五均为国产片。邮件转述：周五幸福蓝海20%涨停，中国电影、横店影视、儒意电影集体首板。票房给院线涨停群提供了基本面注脚，比单纯的AI短剧概念更扎实。对投资的意味：院线权重可以作为短剧情绪的“低位替身”，但文投控股这类十几天九板的高位品种，与院线首板不是一回事。\n三、产业日程密集，给中低位题材提供催化。已核实：发改委、能源局印发“十五五”新型储能实施方案，2030年装机目标3亿千瓦；华为云CloudRobo具身世界模型发布会今天14:00线上举行，将发布昇腾原生模型；APEC工商领导人峰会17日至18日、领导人非正式会议18日至19日在深圳举行。储能是政策写明的数量目标，持续性最强；具身智能是事件驱动，发布会当天容易“利好兑现”；APEC更多是情绪与外资预期层面的支撑。\n三大利空方向（由强到弱）\n一、英伟达财报与Anthropic上市，本周AI链是二元事件。已核实：英伟达将于美东11月17日盘后发布财报，临时CEO克雷斯首次面对市场；Anthropic价格区间70至78美元，计划11月18日定价、19日以ANT代码上市，认购约6倍。黄仁勋辞职后英伟达上周跌约13%。邮件转述：索罗斯基金三季度减持英伟达、高毅清仓多只AI硬件股，这是13F类季度持仓，反映的是过去三个月，不能当成本周的资金流向。对谁不利：中际旭创、东山精密等北美算力链，周五已领跌。制约：若指引稳住，超跌反弹会很快，所以这里是“等结果”，而不是“继续空”。\n二、海外加息预期抬升，压制高估值成长。已核实：美国10月PPI同比6.5%，为2022年11月以来最大；美银将预测改为12月、明年1月和3月连续三次加息，联邦基金利率区间升至4.50%至4.75%；波士顿联储柯林斯支持渐进加息。邮件转述：黄金或录得六月来最大单周跌幅。传导路径是美债利率与美元走强，通过分母端压制A股成长估值，相对利好银行等低估值方向。另据已核实信息，伊朗周日称以无人机袭击巴林美军基地，巴林称已全部拦截、美军无受损；IEA则预计四季度全球石油日均过剩约170万桶。地缘推升避险、供给过剩压油价，两股力量对石油板块是对冲，不构成单边主线。\n三、高位题材退潮叠加个股治理风险。邮件转述：周五阳光照明、闽发铝业、大东方等高位连板股跌停，襄阳轴承等中位股跟跌。已核实：南卫股份公告实控人李平因涉嫌内幕交易罪被刑事拘留，公司称控制权未变、经营正常；证监会主席吴清11月14日表示将研究优化量化交易、股份减持等制度。监管语境下，高位接力的赔率继续变差；而“稳市长效机制”更多托住的是指数，而不是题材连板。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"热点财经新闻综述｜2026-11-16·早间\n数据时点：A股为11月13日（周五）收盘，美股为美东11月13日收盘；周末与隔夜消息整理截至北京时间11月16日07:50。本期邮箱新增一封热点财经邮件（11月15日晚间版），11月16日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照官方或主流媒体公开报道。晚间邮件里写作“今日涨停”的个股，实为周五盘面，周末沪深休市。\n今日判断\n周一开盘前，最硬的变量不在题材里，而在两个日程上：上午9:30的70城房价、10:00的10月工业、社零、固投与地产数据（国新办发布会已核实），以及本周二美股盘后英伟达首份“后黄仁勋”财报、周三晚Anthropic定价。隔夜美股期货小幅走高，纳指100期货涨约0.6%，恒指期货略高于周五收盘，外盘没有给出恐慌信号。我们对今天的基调是：数据落地前不抢跑，创新药与院线首板方向可以持有观察，算力硬件等到周二财报再决定，高位连板继续回避。\n三大利多方向（由强到弱）\n一、医保目录落地，创新药拿到确定性的放量通道。已核实：国家医保局与人社部11月14日发布2026年版目录，新增107种药品，其中51个为1类创新药，数量创新高；商保创新药目录新增12种，合计28种，2027年1月1日起执行。恒瑞医药、复星医药、首药控股、艾力斯、京新药业等已公告相关品种纳入或续约。为什么重要：这是基本面事件，不靠情绪接力，对已有商业化产品的创新药企是收入兑现，对CXO是间接景气。制约：谈判降价幅度决定利润弹性，部分品种市场早有预期，开盘高开过多反而要防兑现。\n二、票房破320亿，院线从题材回到数据。已核实：截至11月15日，2026年度电影总票房（含预售）突破320亿元，年度前五均为国产片。邮件转述：周五幸福蓝海20%涨停，中国电影、横店影视、儒意电影集体首板。票房给院线涨停群提供了基本面注脚，比单纯的AI短剧概念更扎实。对投资的意味：院线权重可以作为短剧情绪的“低位替身”，但文投控股这类十几天九板的高位品种，与院线首板不是一回事。\n三、产业日程密集，给中低位题材提供催化。已核实：发改委、能源局印发“十五五”新型储能实施方案，2030年装机目标3亿千瓦；华为云CloudRobo具身世界模型发布会今天14:00线上举行，将发布昇腾原生模型；APEC工商领导人峰会17日至18日、领导人非正式会议18日至19日在深圳举行。储能是政策写明的数量目标，持续性最强；具身智能是事件驱动，发布会当天容易“利好兑现”；APEC更多是情绪与外资预期层面的支撑。\n三大利空方向（由强到弱）\n一、英伟达财报与Anthropic上市，本周AI链是二元事件。已核实：英伟达将于美 这一路径，并指出身边“高人”的判断。\n这超越了事后解读，将个人/公司舆情风险与估值锚直接挂钩。在英伟达链、中概互联网承压、光模块/PCB跳水的背景下，它提示：CEO变动是一次性出清，但真正持久的压力来自利率与美元（10年期美债重回5.1%上方）。机构与散户的分歧（机构下调可见度、散户抄底）也被同步提炼，突出“利率比任何CEO变动更持久”的盲点。这一贡献把高层人事事件转化为可操作的风险定价，而非情绪化热点。\n二、生物-社会错配与高净值行为的金融映射\n账号将黄仁勋（及盖茨）事件延伸到更底层的结构观察：婚姻作为“永久有效的合法性许可证”，承载财务、道德、精力三重负担；女性绝经后性能下降与男性中年需求形成错配，迫使部分高净值个体通过婚外路径解决，而马斯克式不婚或频繁离婚则是不同应对。该帖明确关联“为什么有的国家要禁止卖淫买春”——除阳痿或化学阉割外，结婚成为唯一合法通道，却是最沉重且无期限的许可。\n这是推特财经中少见的跨学科原创：把演化生物学、人口统计（中国男性与全球均值的差异）、婚姻制度与科技领袖行为、甚至国家政策联系起来。它不停留在八卦，而是解释高净值个体的风险暴露与决策约束，为理解科技公司治理、个人品牌与市场情绪提供新视角。在信息过载的财经圈，这类“底层协议决定上层叙事”的穿透，具有思想增量。\n三、不亏钱优先的动态配置体系：哑铃、动平衡与大类轮动\n订阅区周报与纪要持续输出中美股市框架，核心原创在于**“不亏钱是投资第一要义”**。在波动率高、无法主观判断“底部还是下跌中继”的阶段，主张整体保守、保留子弹，以待未来攻击时刻。具体策略包括：\n•哑铃策略：中美股市主仓与辅助仓的动平衡配比，讨论预测收益率与调仓节奏。\n•动平衡组合：通过付相关资产（如价值/成长ETF，或美股QQQ与SCHD）定期再平衡（示例5:5），回测美股年化超20%，A股亦不差；一年约三次操作，每次1.5-2个月。强调这是贯穿牛熊的低维护方法，不依赖预测。\n•大类轮动优于纯动平衡，结合股债商汇与行业轮动，每周日固定公布数据。\n这些将哈佛式再平衡思想本地化，并嵌入中美共振观察（5日脉冲 vs 20日趋势），强调业绩验证优于纯题材。对推特内容的贡献在于提供“可执行、可回测、低主观”的框架，而非单点荐股。\n四、短线生存过滤器与市场结构洞察\n账号分享16年实战经验：“占比四道闸”——涨停板次日能否存活，80%答案藏在前一晚龙虎榜买卖占比中。从18万滚到800万再回撤至300万的历程，提炼出数字阈值的过滤器，强调进出场成本与流动性。\n每日/午间观察则系统梳理A股存量博弈：AI漫剧（Seedance成本下降、用户与供给爆发）、算力芯片局部活跃但高位分歧、银行高股息批量创新高（股息率与业绩双支撑）、猪肉去化、白酒库存泄压而非需求复苏。强调风格向低波红利倾斜，科技主线等待催化；操作上避免追高，等待轮动低吸。散户热议与机构口径的对比（社区偏好连板小票 vs 券商偏好有业绩验证的代工/设备），以及被忽略的风险（监管函、利率、预期差），进一步强化了信息提炼的深度。\n总结：对推特财经的原创性思想贡献\n本周最有价值的输出，是把危机管理的时间领先、生物-制度错配的穿透、不亏钱优先的动态配置、以及可量化的过滤器，整合成中美联动的实用框架。它既有事件驱动的前瞻（黄仁勋请辞），也有穿越周期的方法论（再平衡与轮动），还包含对市场结构与散户/机构分歧的冷静对照。在充斥情绪与碎片信息的推特财经中，这种“研究与数据优先、不做荐股、强调过滤器与风险优先”的路径，提供了可复用的思想增量。\n整体策略保守但结构清晰，适合在高波动环境中作为参考框架。订阅与周报体系则将单帖观点系统化，进一步放大其持续性贡献。以上基于公开帖子整理，观点与数据以原文为准，不构成投资建议。","en":"@cnfinancewatch（华尔街观察 Xtrader）过去一周最具价值观点综述：中美联动框架下的风险优先、动态配置与危机定价原创贡献\n回顾2026年11月8日至15日期间，该账号在高频输出中，最有价值的原创思想集中在危机领导力的提前定价、生物-社会错配的金融映射、不亏钱优先的动态配置体系，以及可量化的短线生存过滤器。这些并非简单信息搬运，而是将中美联动、资金流、期权/热度共振、OSINT社区情绪与个人实战经验融合后的结构化输出，对推特财经内容的原创贡献在于“把宏观叙事还原成可执行的仓位与过滤器”，并在关键事件上展现时间领先性。\n一、危机领导力的提前定价：黄仁勋主动请辞的“舆情止血”逻辑\n本周最具标志性的原创观点是11月12日明确提出“黄仁勋应该主动请辞；公司和他可立即止血。当前关键是舆情止血”，并强调其未来重新创业机会仍多。该观点基于个人处理过投资公司类似事件的经验——创始人主动辞职能让董事会快速  with confidence.\nVisit and subscribe on","zh_src":"bing","lang":"en","m":["https://pbs.twimg.com/media/HXJYFXSXEAA18mI.jpg?name=orig"],"u":"https://x.com/business/status/2121855226067943753","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/india","d":"bloomberg.com"}],"t":[],"lk":3,"rt":1,"rp":0,"vw":13717},{"id":"2121849373722067321","h":"SCMPNews","ts":1794723287,"zh":"北京咖啡馆纠纷揭示了中国苦苦挣扎的书店","en":"What a Beijing cafe dispute reveals about China’s struggling bookshops","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/SCMPNews/status/2121849373722067321","l":["scmp.com"],"ln":[{"u":"https://www.scmp.com/news/china/politics/article/3374469/what-beijing-cafe-dispute-reveals-about-chinas-struggling-bookshops?utm_medium=Social&utm_source=Twitter#Echobox=1794723283","d":"scmp.com"}],"t":[],"lk":1,"rt":0,"rp":1,"vw":1116},{"id":"2121844403224379716","h":"business","ts":1794722102,"zh":"比特币最近的抛售正在考验一些加密货币市场最坚定的投资者的决心，因为一系列的挫折将价格推向今年的最低水平，并且主要需求来源减弱","en":"Bitcoin’s latest selloff is testing the resolve of some of the cryptocurrency market’s most committed investors, as a succession of setbacks pushes prices toward their lowest levels of the year and major sources of demand weaken","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2121844403224379716","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/articles/2026-11-15/crypto-s-slow-motion-selloff-leaves-traders-weary-and-hopeless?taid=6af94936d0eea100019af5e3&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":3,"rp":2,"vw":12040},{"id":"2121841718329070058","h":"cnfinancewatch","ts":1794721462,"zh":"朝鲜突然修改宪法，对东亚局势有什么影响？@grok","en":"朝鲜突然修改宪法，对东亚局势有什么影响？@grok","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121841718329070058","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":1,"vw":867},{"id":"2121841547599839338","h":"cnfinancewatch","ts":1794721421,"zh":"散户热议｜2026-11-15·午间\n数据时点：国内社区浏览截至北京时间11月15日13:45；海外讨论覆盖至美东11月14日至15日。国内部分直接打开了韭研公社首页及部分公开帖的可见摘要；「周末舆情热度」等复盘帖正文需登录，未能全文引用。Reddit与Stocktwits个股页未能直接抓取实时情绪，海外部分改用StonkHub对WSB的统计和Stocktwits已刊新闻稿，均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：把周末新闻映射成题材，数据窗口并不在首页中央\n周日中午打开韭研公社，置顶仍是实盘大赛、站规和“打击吹票等不良行为”专帖，平台约束没有放松。与今早相比，首页多了几条能直接看到摘要的新帖，更能看清社区在为周一找方向。\n第一类是事件映射。11月15日07:15的帖子以“筷子夹飞船”为题，梳理可回收火箭和商业航天，可见摘要写明：星舰上面级首次被发射塔机械臂捕获，但助推器回收失败，两级全部回收并未实现，并提醒这主要是情绪映射。这和公开报道一致，也比把“首次回收成功”写成全面胜利更冷静。另一条11月14日晚的帖子梳理华为CloudRobo标的，点名亿嘉和、拓斯达、福龙马等，对应明天下午的发布会。社区抓住了可核验的事件，但较少讨论亚利桑那项目仍待当地审批，也较少把OpenAI撤销独立机器人团队写成对“专属具身大脑”叙事的约束。\n第二类是高低切换的余波。11月14日的复盘帖把最近三大热点写成机器人、短剧等，并写到周五机器人两大龙头批量跌停，“可能会提前休整”。11月13日复盘帖的标题仍是“算力硬件权重杀跌，影视短剧与防御权重承接”。这和券商口径的相同点，都承认\n短剧是最强情绪分支、机器人已经分化；不同点在于\n社区仍在为短剧和华为机器人找接力，对连板位置的警惕不如对“下一个方向”的渴望来得强烈。\n第三类是新主题试探。11月15日午间出现\n脑机接口题材帖，把工信部标准立项和“十五五”未来产业写成从故事转向兑现。同一天还有帖子汇总周末资讯，提到周五4000多家下跌，\n逆势方向是影视院线、国产替代和华为机器人，并转述吴清关于稳市机制的讲话。被忽略的是：明天上午10时的统计局发布会、今日生效的外汇存款准备金率，在公开首页并不显眼；平头哥赴港分拆也很少被放在主标题里。社区仍在用题材语言消化周末，而不是用数据语言准备开盘。\n被忽略的风险：\n一是把商业航天和具身智能的事件催化，当成周一可以追的主线，忽略高位股周五已经跌停；\n二是“国产大芯片窗口期”的周五帖还在首页，容易把英伟达真空读成立刻可以加仓；\n三是清朗专帖仍置顶，个股梳理要打折看。\n海外：一边质疑需求，一边仍在讨论黄仁勋回归\nWallStreetBets方面（StonkHub统计，二手）：过去7天有1064人在WSB讨论英伟达，较前一周的155人增加约586%；全Reddit口径下看多占37.9%、看空占40.4%、中性21.6%，多空仍大体对半，和今早读数几乎相同。过去24小时靠前的帖子里，一条高赞标题把英伟达的“短缺”解释成公司资助初创企业再买回自己的芯片，质疑需求的成色；另一条则关注两大投资者敦促董事会考虑保留黄仁勋回归的选项。社区同时在做两件事：检验AI需求是不是循环的，以及人事能否反转。\nStocktwits方面：个股页实时情绪未能直接打开。能核验的较近文本是11月12日官方新闻稿（二手、非今日实时）：当时散户情绪为“极度看多”，站内投票显示58%选择抄底、42%选择回避，当周消息量约增593%。这是周中旧稿，不能当成周日的即时读数；它只说明，在股价大跌的当周，站内仍有相当比例的人把下跌当成折扣。\n与券商口径的差异仍然清楚：卖方在讨论下周二财报、高盛对2027年资本开支见顶的框架，以及路透援引消息人士的治理细节报道；散户更集中于复职请愿和“买得便宜与否”。Altimeter与Atreides的公开信支持临时CEO、只是要求不要匆忙换帅，和请愿书要求复职并不是同一件事，海外帖子里也容易被写成“董事会已被逼宫”。\n追高与被忽略的风险：第一，人事反转不是基本情形，请愿和股东信都不能代替继任安排与财报指引；第二，循环需求的质疑如果在财报电话会上被坐实，抄底会被立刻改写；第三，国内社区把筷子夹飞船和华为发布会映射到概念股，海外则几乎只围着英伟达转，两边的主线并不对称。比特币周末仍在6.5万美元附近波动，只适合作为风险偏好的背景，不宜解释成A股新主线。\n小结：国内散户在为周一找新题材，海外散户在为英伟达找反转或证伪。两边都更重事件、更轻明天的数据。下周真正能检验判断的，仍是统计局的数字、英伟达财报，以及医保目录之后创新药会不会被认真定价。\n来源：韭研公社公开首页及可见摘要、StonkHub对WSB的统计页、Stocktwits 11月12日新闻稿；以上为社区讨 英伟达（NVIDIA）共同创办人黄仁勋辞去所有职务后，据传台湾服务器业者因担心美方加强出口管制，主动加强查核客户和出货地点，甚至暂停承接陌生客户的订单。后续英伟达是否调整采购、投资及融资支持，将牵动台湾芯片制造、封测和服务器业者。","zh_src":"native","lang":"zh","m":["https://pbs.twimg.com/media/HXIXktJaAAAiVxC.jpg?name=orig"],"u":"https://x.com/dmjk001/status/2121784374157058314","l":[],"ln":[],"t":["AI科技","关税贸易"],"lk":0,"rt":0,"rp":0,"vw":534},{"id":"2121782551543230597","h":"cnfinancewatch","ts":1794707355,"zh":"热点财经新闻综述｜2026-11-15·早间\n数据时点：A股为11月13日（周五）收盘，美股为美东11月13日收盘；周末消息整理截至北京时间11月15日07:40。本期邮箱新增一封11月14日晚间热点财经邮件，11月15日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照官方或主流媒体公开报道。今天周日，沪深与美股均休市。\n今日判断\n周六午后到周日早晨，对A股和港股定价最有分量的两件事是：高盛将中国H股评级上调至超配，以及商务部通报中美经贸磋商机制项下贸易理事会首次会议。两者都改善了外部风险溢价，但都还不是落地的交易结果。外部的主要矛盾没变——英伟达仍处领导层真空，下周二（11月17日）财报才是AI硬件链的胜负手。我们对周一的基调是：港股通蓝筹、创新药和稳市受益方向可以继续布局；高位短剧和连板题材继续回避；AI硬件等财报落地再定方向。\n三大利多方向（由强到弱）\n一、外资对中国资产再定价，叠加中美磋商。已核实：财联社、格隆汇11月14日报道，高盛将中国H股和印度股市上调至超配，维持韩国、日本超配，并预计MSCI日本以外亚洲指数明年以美元计价回报约19%。同日商务部通报，双方就落实前期成果、关税、约300亿美元对等降税安排和农产品贸易作了沟通；白宫称特朗普将于周四在深圳APEC期间与习近平会见。为什么重要：这是周末能同时影响A股和港股风险偏好的外部锚。制约：会议未宣布新协议，降税安排尚未落地；高盛全球股票策略对亚洲及新兴市场仍有“中性”口径，与H股超配不是同一份报告，不宜写成“全面看多亚洲”。\n二、创新药支付端改善。已核实：国家医保局与人社部11月14日发布2026年版目录，新增107种药品，其中1类创新药51个；药明巨诺的瑞基奥仑赛成为首个进入基本医保的CAR-T产品；新版目录2027年1月1日执行。对谁有利：创新药龙头和已进入目录的品种。制约：公开报道对价格有“年费用有望降至30万元以内”和“患者自付或可降至10万元以内”两种口径，官方细目未全部公开，不宜写成单一成交价；业绩兑现在明年。\n三、稳市制度预期。已核实：证监会主席吴清提出，系统构建稳的机制、稳的力量、稳的生态，并研究评估量化交易、股份减持等制度优化。投资含义：券商、权重蓝筹和高股息的下行保护更厚。制约：讲话以“研究”为主，没有新的落地细则，周一不宜期待脉冲行情。\n三大利空方向（由强到弱）\n一、英伟达治理真空与财报风险。已核实：黄仁勋11月12日辞职，CFO克雷斯任临时CEO。联合早报等转述董事会接触Arm首席执行官Haas；多家报道称公司回应尚未正式接触任何潜在候选人，仍在挑选猎头。晚间邮件把“接触”写成进展，公开口径仍是传闻对官方否认。A股传导周五已经兑现，中际旭创、新易盛跌超8%。财报若指引稳住，超跌反弹会很猛；若订单口径松动，光模块、PCB还有一段。\n二、海外利率与风险偏好收缩。已核实：美国10月PPI同比6.5%为近年高位，环比低于预期；波士顿联储主席柯林斯支持继续渐进加息，达拉斯联储主席洛根主张把紧急购债与常规货币政策分开记账，以免被看成量化宽松。比特币已跌破7万美元，周末各行情源报价多在6.3万至6.6万美元一带，数字并不完全一致；部分分析将其与Anthropic\nIPO认购抽水联系起来，原因仍是推测。对谁不利：高估值成长股、黄金、加密资产，以及依赖外资流入的成长风格。\n三、高位题材退潮。邮件转述：文投控股14天9板，北纬科技3天3板，天普股份4天4板，影视短剧仍是最强分支；但机器人板块内部分化，日发精机涨停、大业股份跌停。社区与邮件对连板天数口径不一，说明位置已经偏高。周一最容易踩的是接力高位，而不是指数本身。\n补充：美国联邦航空局周五因空管通信故障实施全国停飞，美东约15:44至20:15解除，FlightAware截至当晚统计延误约9124架次、取消约5901架次，对A股航空板块属弱传导，不作为主要定价因素。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"热点财经新闻综述｜2026-11-15·早间\n数据时点：A股为11月13日（周五）收盘，美股为美东11月13日收盘；周末消息整理截至北京时间11月15日07:40。本期邮箱新增一封11月14日晚间热点财经邮件，11月15日早间邮件截稿未到。凡标“邮件转述”的内容未逐条核实，其余已对照官方或主流媒体公开报道。今天周日，沪深与美股均休市。\n今日判断\n周六午后到周日早晨，对A股和港股定价最有分量的两件事是：高盛将中国H股评级上调至超配，以及商务部通报中美经贸磋商机制项下贸易理事会首次会议。两者都改善了外部风险溢价，但都还不是落地的交易结果。外部的主要矛盾没变——英伟达仍处领导层真空，下周二（11月17日）财报才是AI硬件链的胜负手。我们对周一的基调是：港股通蓝筹、创新药和稳市受益方向可以继续布局；高位短剧和连板题材继续回避；AI硬件等财报落地再定方向。\n三大利多方向（由强到弱）\n一、外资对中国资产再定价，叠加中美磋商。已核实：财联社、格隆汇11月14日报道，高盛将中国H股和印度股市上调至超配，维持韩国、日本超配，并预计MSCI日本以外亚洲指数明年以美元计价回报约19%。同日商务部通报，双方就落实前期成果、关税、约300亿美元对等降税安排和农产品贸易作了沟通；白宫称特朗普将于周四在深圳APEC期间与习近平会见。为什么重要：这是周末能同时影响A股和港股风险偏好的外部锚。制约：会议未宣布新协议，降税安排尚未落地；高盛全球股票策略对亚洲及新兴市场仍有“中性”口径，与H股超配不是同一份报告，不宜写成“全面看多亚洲”。\n二、创新药支付端改善。已核实：国家医保局与人社部11月14日发布2026年版目录，新增107种药品，其中1类创新药51个；药明巨诺的瑞基奥仑赛成为首个进入基本医保的CAR-T产品；新版目录2027年1月1日执行。对谁有利：创新药龙头和已进入目录的品种。制约：公开报道对价格有“年费用有望降至30万元以内”和“患者自付或可降至10万元以内”两种口径，官方细目未全部公开，不宜写成单一成交价；业绩兑现在明年。\n三、稳市制度预期。已核实：证监会主席吴清提出，系统构建稳的机制、稳的力量、稳的生态，并研究评估量化交易、股份减持等制度优化。投资含义：券商、权重蓝筹和高股息的下行保护更厚。制约：讲话以“研究”为主，没有新的落地细则，周一不宜期待脉冲行情。\n三大利空方向（由强到弱）\n一、英伟达治理真空与财报风险。已核实：黄仁勋11月12日辞职，CFO克雷斯任临时CEO。联合早报等转述董事会接触Arm首席执行官Haas；多家报道称公司回应尚未正式接触任何潜在候选人，仍在挑选猎头。晚间邮件把“接触”写成进展，公开口径仍是传闻对官方否认。A股传导周五已经兑现，中际旭创、新易盛跌超8%。财报若指引稳住，超跌反弹会很猛；若订单口径松动，光模块、PCB还有一段。\n二、海外利率与风险偏好收缩。已核实：美国10月PPI同比6.5%为近年高位，环比低于预期；波士顿联储主席柯林斯支持继续渐进加息，达拉斯联储主席洛根主张把紧急购债与常规货币政策分开记账，以免被看成量化宽松。比特币已跌破7万美元，周末各行情源报价多在6.3万至6.6万美元一带，数字并不完全一致；部分分析将其与Anthropic\nIPO认购抽水联系起来，原因仍是推测。对谁不利：高估值成长股、黄金、加密资产，以及依赖外资流入的成长风格。\n三、高位题材退潮。邮件转述：文投控股14天9板，北纬科技3天3板，天普股份4天4板，影视短剧仍是最强分支；但机器人板块内部分化，日发精机涨停、大业股份跌停。社区与邮件对连板天数口径不一，说明位置已经偏高。周一最容易踩的是接力高位，而不是指数本身。\n补充：美国联邦航空局周五因空管通信故障实施全国停飞，美东约15:44至20:15解除，FlightAware截至当晚统计延误约9124架次、取消约5901架次，对A股航空板块属弱传导，不作为主要定价因素。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121782551543230597","l":[],"ln":[],"t":["美联储","美股","A股港股","AI科技","财报","关税贸易","黄金"],"lk":0,"rt":0,"rp":0,"vw":807},{"id":"2121782141898076642","h 超4700只个股下跌，38只涨停、34只跌停，炸板率约36%。周六上午一篇复盘把近期热点归为机器人、短剧等几条线，并承认大业股份、襄阳轴承这两个机器人龙头周五批量跌停，“可能会提前休整”。情绪方向偏谨慎，不是恐慌。\n第二类是高低切换。短剧和AI漫剧仍是讨论最集中的方向，文投控股、幸福蓝海、中国电影反复被提。一个值得注意的细节：社区帖子写文投控股“18天10板”，午间热点财经邮件写“14天9板”，统计区间不同，但都说明位置已高。另一条切换线是大消费，有帖子把来伊份包装成“首发经济加谷子经济”，与邮件提到的公募大消费持仓回暖属同一叙事，只是社区更偏短线炒作。\n第三类是英伟达换帅后的“国产替代”叙事。多篇帖子从黄仁勋辞职推导国产AI芯片窗口期，点名寒武纪、燧原科技、沐曦股份等；也有帖子拆解超聚变过会后的产业链受益方，提到华胜天成、软通动力、神州数码等。这和券商口径有相同点，都认可国产算力中期逻辑；不同点在于社区几乎不谈超聚变上半年经营现金流为负、也不谈过会到上市还隔注册与询价，容易把“过会”读成“马上兑现”。\n被忽略的风险：一是周六监管层讲话提到减少羊群效应和短期化交易，对接力炒作并不友好，社区今天对此讨论很少；二是韭研公社首页置顶了打击吹票的专帖，说明平台本身也在约束荐股帖，个股“深度梳理”类帖子要打折看。医保目录的讨论截至发稿时还不多，周一可能成为新的接力方向，但创新药的业绩兑现要到2027年。\n海外：散户抄底，机构降级\nWallStreetBets方面（StonkHub统计，二手）：过去7天有1025人在WSB讨论英伟达，人数比前一周增加622%；全Reddit口径下看空占40.6%、看多占37.7%，多空基本对半。过去24小时热帖里，有帖子转述英伟达员工在内部论坛要求黄仁勋回归，还有标题直接叫“Jensen\ncomeback”，说明社区相当一部分在押注人事反转，而不是基本面。\nStocktwits方面（官方新闻稿，二手）：英伟达散户情绪为“极度看多”，一周消息量增加593%；一项站内投票显示58%的人在抄底、42%回避。另一篇报道称SPY、QQQ、DIA的散户情绪已从10月底的“看空”升至“极度看多”。\n与券商口径的差异很明显：汇丰、Truist、Craig-Hallum都已降到持有，Truist把目标价从346美元砍到174美元，理由是治理和出口调查风险比估值更重要；散户则把下跌当成打折。11月17日财报是两种看法的交汇点。\n追高与被忽略的风险：第一，英伟达已连跌六周，散户抄底多发生在治理问题没有结论之前，若国会或联邦调查出新消息，抄底仓位会先被止损；第二，Anthropic定于11月19日上市，社区热度高，但估值区间对应约1.4万亿美元，首日追高风险不小；第三，美国PPI同比6.5%、美联储稳定报告点名AI估值，利率端的压力在散户讨论里几乎缺席。\n小结：国内散户在亏钱效应里找切换，海外散户在下跌里找反转。两边都偏向押事件，而不是押业绩，下周英伟达财报和医保目录后的创新药行情，会检验谁的判断更扎实。\n来源：韭研公社公开首页帖子、StonkHub对WSB的统计页、Stocktwits新闻稿、雅虎财经转载的Stocktwits市场稿；以上为社区讨论整理，不代表本文观点，不构成投资建议。","en":"散户热议｜2026-11-14·午间\n数据时点：国内社区浏览截至北京时间11月14日13:30，海外讨论数据截至美东11月13日收盘后（北京时间11月14日上午）。国内部分直接浏览韭研公社首页公开帖子；Reddit与Stocktwits直连被拦截，海外部分改用StonkHub对WallStreetBets的统计和Stocktwits官方新闻稿，均为二手口径，下文逐条标注。不引用无法核实的原话，不自行编造情绪比例。\n国内：周末在复盘，也在找下一个故事\n韭研公社首页周五到周六最显眼的是三类帖子。\n第一类是复盘亏钱效应。社区一篇11月13日的涨停汇总写得很直白：沪指跌0.59%、创业板指跌3.32%，超4700只个股下跌，38只涨停、34只跌停，炸板率约36%。周六上午一篇复盘把近期热点归为机器人、短剧等几条线，并承认大业股份、襄阳轴承这两个机器人龙头周五批量跌停，“可能会提前休整”。情绪方向偏谨慎，不是恐慌。\n第二类是高低切换。短剧和AI漫剧仍是讨论最集中的方向，文投控股、幸福蓝海、中国电影反复被提。一个值得注意的细节：社区帖子写文投控股“18天10板”，午间热点财经邮件写“14天9板”，统计区间不同，但都说明位置已高。另一条切换线是大消费，有帖子把来伊份包装成“首发经济加谷子经济”，与邮件提到的公募大消费持仓回暖属同一叙事，只是社区更偏短线炒作。\n第三类是英伟达换帅后的“国产替代”叙事。多篇帖子从黄 券商、高股息。已核实：吴清提出系统构建“稳的机制、稳的力量、稳的生态”，研究评估量化交易、股份减持等制度优化，并加强大型和新型科技企业发行上市的制度适配性研究。此前11月3日央行开展第三批互换便利操作1000亿元，31家券商和基金参与；回购增持再贷款转为长期安排、利率降至1%。投资含义：券商、权重蓝筹、高股息资产的下行保护更厚。制约：讲话以“研究”为主，没有落地细则，周一不宜期待脉冲行情。\n三、国产算力服务器与AI定价锚。已核实：超聚变11月12日创业板过会，拟募资80亿元，为今年创业板上会最大项目；2026年上半年营收372.86亿元、归母净利21.08亿元。Anthropic计划11月18日定价、19日在纳斯达克上市，发行区间70至78美元，对应估值约1.3万亿至1.4万亿美元。对谁有利：国产服务器配套、算力服务和AI应用端。制约：超聚变上半年经营现金流为-156.85亿元，过会后还需注册与询价；巨型IPO也会分流资金。\n三大利空方向（由强到弱）\n一、英伟达领导层真空与财报风险。已核实：英伟达周五收162.85美元，单周跌约13%，连续第六周下跌；汇丰、Truist、Craig-Hallum先后下调至持有；临时CEO为CFO克雷斯。邮件转述：董事会接触Arm\nCEO Rene Haas。A股周五中际旭创、新易盛跌超8%（邮件与公开盘面一致）。财报若指引稳住，超跌反弹会很猛，空头不宜追；若订单口径松动，光模块、PCB还有一段。\n二、海外利率与AI估值警示。已核实：美国10月PPI环比0.3%低于预期，但同比6.5%为2022年11月以来最高；美联储11月13日金融稳定报告把AI列为最受关注的风险，指出股票估值偏高。邮件转述：柯林斯称很快需要进一步加息。对谁不利：高估值成长股、黄金、加密资产。\n三、高位题材退潮。邮件转述：大东方收监管工作函后跌停，阳光照明、闽发铝业等高位连板股跌停，机器人龙头大业股份、襄阳轴承跌停。吴清讲话点名减少“羊群效应”和短期化交易，对炒作情绪是边际约束。短剧影视仍是最强分支，但文投控股连板天数邮件与社区口径不一（14天9板与18天10板），说明已在高位，追高赔率很差。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"热点财经新闻综述｜2026-11-14·午间\n数据时点：A股为11月13日（周五）收盘，美股为美东11月13日收盘（北京时间11月14日05:00），周末消息整理截至北京时间11月14日13:30。本期邮箱新增两封热点财经邮件（早间08:10版、午间13:10版），凡标“邮件转述”的内容未逐条核实，其余已对照官方或主流媒体公开报道。今天周六，沪深与美股均休市。\n今日判断\n周六上午出了两件对A股定价有分量的事：国家医保局发布2026年版医保目录，证监会主席吴清在首届中国资本市场学术年会致辞。前者给创新药一个看得见的支付端增量，后者给“稳市”加了一层制度预期。但外部的主要矛盾没变，下周二（11月17日）英伟达财报才是AI硬件链的胜负手。我们对下周的基调是：创新药和稳市受益方向可以先布局，AI硬件等财报落地再说，高位题材股继续回避。\n三大利多方向（由强到弱）\n一、创新药与CAR-T。已核实：医保局与人社部11月14日发布新版目录，新增107种药品，其中1类创新药51个，创历史新高；药明巨诺的瑞基奥仑赛成为首个进入基本医保的CAR-T产品；商保创新药目录新增12种、总数28种；新版目录2027年1月1日执行。为什么重要：支付端放开决定创新药放量的天花板，独家品种的销售预期会被重估。口径提示：邮件称CAR-T报销后患者自付或在10万元以内，公开报道更常见的说法是谈判后年治疗费用“有望降至30万元以内”，以后者为准。邮件另点名百利天恒、东阳光相关品种入选，我们尚未逐一核对。制约：降价幅度要等谈判价格细节，业绩兑现在2027年。\n二、稳市制度与券商、高股息。已核实：吴清提出系统构建“稳的机制、稳的力量、稳的生态”，研究评估量化交易、股份减持等制度优化，并加强大型和新型科技企业发行上市的制度适配性研究。此前11月3日央行开展第三批互换便利操作1000亿元，31家券商和基金参与；回购增持再贷款转为长期安排、利率降至1%。投资含义：券商、权重蓝筹、高股息资产的下行保护更厚。制约：讲话以“研究”为主，没有落地细则，周一不宜期待脉冲行情。\n三、国产算力服务器与AI定价锚。已核实：超聚变11月12日创业板过会，拟募资80亿元，为今年创业板上会最大项目；2026年上半年营收372.86亿元、归母净利21.08亿元。Anthropic计划11月18日定价、19日在纳斯达克上市，发行区间70至78美元，对应估值约1.3万亿至1.4万亿美元。对谁有利：国 g.com"],"ln":[{"u":"https://www.bloomberg.com/opinion/articles/2026-11-13/florida-republicans-think-they-built-a-red-wall-can-it-last?taid=6af7ab97c6e521000170846d&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":4,"rt":3,"rp":1,"vw":14355},{"id":"2121398969917989310","h":"business","ts":1794615902,"zh":"来自民主党派系的新当选政治家一致认为，负担能力是最令人担忧的问题。","en":"Newly elected politicians from across the Democratic Party spectrum agree that affordability is the top concern.","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2121398969917989310","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/news/newsletters/2026-11-13/after-midterm-election-blue-wave-progressive-and-moderate-democrats-plot-agenda?taid=6af7aa5e718669000140a3fe&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":[],"lk":3,"rt":0,"rp":0,"vw":7521},{"id":"2121398084005744812","h":"cnfinancewatch","ts":1794615691,"zh":"华尔街观察： #为什么AI短剧制作者全线亏损？ #AI投融资如火如荼但股市为什么下跌？\n#我对AI短期是否造福人类感到悲观\nAI生产力狂飙，旧生产关系锁死普通人红利\nAI技术已带领社会生产力迈入指数级迭代的全新时代，内容生成、文案创作、视频制作、数据处理的边际成本近乎归零，效率实现跨越式突破。但残酷的现实是：生产力已经进入AI时代，生产关系却停滞在互联网买量时代，这种结构性错位，让本轮技术革命几乎无法普惠普通劳动者，短期难言造福大众。\n当下AI创造的全部效率红利，并未流向从业者，而是被平台流量体系层层收割。从业者借助AI省下的时间、压缩的成本，没有转化为休息时间与收益增量，反而全部沦为投流竞价、同行内卷的弹药。所有人用AI降本增效，最终结果不是行业减负，而是流量价格水涨船高，所有效率盈余最终变成平台的“流量税”，完成资本单向收割。\n市场正在验证残酷的“牛马守恒定律”：技术工具越先进，行业考核基准、产出门槛同步抬升。AI消灭了低效重复劳动，却催生了无差别的高强度内卷。劳动者被迫用更高效率匹配更高KPI，效率越高、负荷越重、内卷越深。技术解放劳动的初衷彻底失效，只是变相延长了劳动时长、加剧了生存竞争。\n深层症结在于旧有生产关系与分配体系的彻底滞后。当前流量分发、算法规则、渠道垄断仍牢牢掌握在头部平台手中，全要素生产率的提升被垄断结构锁死。没有分配机制的革新、没有流量壁垒的打破、没有垄断格局的重构，单纯的技术进步只会加剧贫富分化。\n技术本身无罪，但制度决定红利归属。在生产关系完成适配改革前，AI不会成为普通人的福利，只会成为资本加剧收割、行业加剧内卷的工具。AI生产力狂奔不止，旧枷锁纹丝不动，这便是当下技术时代最大的结构性悲观现实。","en":"华尔街观察： #为什么AI短剧制作者全线亏损？ #AI投融资如火如荼但股市为什么下跌？\n#我对AI短期是否造福人类感到悲观\nAI生产力狂飙，旧生产关系锁死普通人红利\nAI技术已带领社会生产力迈入指数级迭代的全新时代，内容生成、文案创作、视频制作、数据处理的边际成本近乎归零，效率实现跨越式突破。但残酷的现实是：生产力已经进入AI时代，生产关系却停滞在互联网买量时代，这种结构性错位，让本轮技术革命几乎无法普惠普通劳动者，短期难言造福大众。\n当下A ign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["美联储","通胀"],"lk":7,"rt":2,"rp":1,"vw":12045},{"id":"2121396462424887640","h":"cnfinancewatch","ts":1794615304,"zh":"截至11月，股票型ETF自9月28日起连续25个交易日净流入，累计约6215亿元，刷新最长纪录；7月单周曾扫入2036亿元，历史单周最高；11月3日单日净流入837.59亿元，年内峰值。但市场仍在磨底：10月上证跌6.33%，创业板跌23.02%，科创50跌24.13%；11月指数在3600点上下反复，科技股反弹一波三折，全市场动辄超4600只个股下跌。\n钱去哪了？高度集中：9月28日至10月30日，沪深300ETF华泰柏瑞净流入624亿，科创50ETF华夏501亿，创业板ETF易方达493亿；宽基ETF累计吸金约6000亿，7只核心宽基就拿走近5000亿。宽基ETF天然逆周期——越弱越托底，稍稳即收力，使命是防失控，不是点火；同时集中抽走中小盘流动性，形成“越买ETF、个股越弱”。\n看出水：2026年上半年重要股东实际减持4894亿，截至8月底约5600亿，已远超2025年全年约4000亿的水平；IPO截至11月11日募资2275亿，是2025年全年1318亿的近1.7倍；再融资截至8月已超4700亿，前三季度股权融资合计7164亿。流出端合计约1.3万亿—1.4万亿量级。对冲端：分红已实施2.29万亿，回购实施超1500亿，增持计划大几百亿，合计约2.5万亿。净现金流仍是正的，但结构极度不均：分红流向长期资金和原始股东，ETF集中权重，减持和融资分散抽血中小盘。\n增量还有：险资一季度持仓增1024亿，机构预测全年入市0.9万亿—1.2万亿，高股息占比74%居历史高位；公募权益类新发截至10月逼近5000亿；国家队ETF持仓存量约1.5万亿，仍是压舱石但不造弹性。\n托底要多少钱？高盛2000亿、李迅雷2万亿—3万亿、中信2.3万亿—4.6万亿，逻辑没变：前提是止血。减持从4000亿级跳到5600亿以上，IPO和再融资同步放大，出水口不收，增量进来仍会被对冲。6215亿买到的还是“不崩”，离“起来”隔着减持约束、融资节奏和盈利修复三件事。缺了它们，堆钱的结果依然是：指数有面子，账户没里子。\n原创不易，转发不要去掉名字，谢谢 @cnfinancewatch","en":"截至11月，股票型ETF自9月28日起连续25个交易日净流入，累计约6215亿元，刷新最长纪录；7月单周曾扫入2036亿元，历史单周最高；11月3日单日净流入837.59亿元，年内峰值。但市场仍在磨底：10月上证跌6.33%，创业板跌23.02%，科创50跌24.13%；11月指数在3600点上下反复，科技股反弹一波三折，全市场动辄超4600只个股下跌。\n钱去哪了？高度集中：9月28日至10月30日，沪深300ETF华泰柏瑞净流入624亿，科创50ETF华夏501亿，创业板ETF易方达493亿；宽基ETF累计吸金约6000亿，7只核心宽基就拿走近5000亿。宽基ETF天然逆周期——越弱越托底，稍稳即收力，使命是防失控，不是点火；同时集中抽走中小盘流动性，形成“越买ETF、个股越弱”。\n看出水：2026年上半年重要股东实际减持4894亿，截至8月底约5600亿，已远超2025年全年约4000亿的水平；IPO截至11月11日募资2275亿，是2025年全年1318亿的近1.7倍；再融资截至8月已超4700亿，前三季度股权融资合计7164亿。流出端合计约1.3万亿—1.4万亿量级。对冲端：分红已实施2.29万亿，回购实施超1500亿，增持计划大几百亿，合计约2.5万亿。净现金流仍是正的，但结构极度不均：分红流向长期资金和原始股东，ETF集中权重，减持和融资分散抽血中小盘。\n增量还有：险资一季度持仓增1024亿，机构预测全年入市0.9万亿—1.2万亿，高股息占比74%居历史高位；公募权益类新发截至10月逼近5000亿；国家队ETF持仓存量约1.5万亿，仍是压舱石但不造弹性。\n托底要多少钱？高盛2000亿、李迅雷2万亿—3万亿、中信2.3万亿—4.6万亿，逻辑没变：前提是止血。减持从4000亿级跳到5600亿以上，IPO和再融资同步放大，出水口不收，增量进来仍会被对冲。6215亿买到的还是“不崩”，离“起来”隔着减持约束、融资节奏和盈利修复三件事。缺了它们，堆钱的结果依然是：指数有面子，账户没里子。\n原创不易，转发不要去掉名字 炼的持仓数据","en":"订阅区公布了我们的大类轮动和两个锤型动平衡账户的原始数据\n周日下午“周报”将公布提炼的持仓数据","zh_src":"native","lang":"zh","m":[],"u":"https://x.com/cnfinancewatch/status/2121393051478442284","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":807},{"id":"2121392689425834014","h":"business","ts":1794614405,"zh":"The Nvidia controversy illuminates yet again the troubling lack of financial oversight in Trump's White House, @TimOBrien says (via @opinion)","en":"The Nvidia controversy illuminates yet again the troubling lack of financial oversight in Trump's White House, @TimOBrien says (via @opinion)","zh_src":"bing","lang":"en","m":[],"u":"https://x.com/business/status/2121392689425834014","l":["bloomberg.com"],"ln":[{"u":"https://www.bloomberg.com/opinion/articles/2026-11-13/nvidia-s-huang-scandal-stirs-up-murk-around-trump-and-money?taid=6af7a484718669000140a3a5&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter","d":"bloomberg.com"}],"t":["AI科技"],"lk":0,"rt":0,"rp":0,"vw":5100},{"id":"2121392666911121696","h":"cnfinancewatch","ts":1794614400,"zh":null,"en":"","zh_src":"","lang":"","m":["https://pbs.twimg.com/media/HXA06oLbwAAaaxw.jpg?name=orig"],"u":"https://x.com/cnfinancewatch/status/2121392666911121696","l":[],"ln":[],"t":[],"lk":0,"rt":0,"rp":0,"vw":136},{"id":"2121391967133430233","h":"cnfinancewatch","ts":1794614233,"zh":"热点财经新闻综述｜2026-11-14·早间\n数据时点：A股为11月13日收盘，美股为美东11月13日收盘（北京时间11月14日05:00），整理截至北京时间11月14日07:40。本期邮箱新增一封11月13日晚间热点财经邮件，以下凡标“邮件转述”的内容未逐条核实，其余已对照公开网页。\n今日判断 本周末的核心矛盾很清楚：一边是英伟达换帅后的AI硬件重定价，一边是美联储加息预期从“可能”变成“几乎确定”。\n周五A股创业板指跌3.32%，美股费城半导体指数再跌3.43%，两地硬件链同步承压；\n同时银行、影视、猪肉、能源在接资金。\n下周一开盘，我们的基调是防御为先、科技等止跌信号，不建议在周末情绪里提前抄底硬件高位股。\n三大利多方向（由强到弱）\n一、银行与高股息。已核实：11月13日银行板块涨约1.46%，江苏银行、南京银行、青岛银行、成都银行、杭州银行盘中创历史新高；11月12日华宝银行ETF净流入5.58亿元。为什么重要：美债10年期收益率周五在5.1%以上，CME FedWatch显示市场对12月9日加息的定价接近100%，成长股估值的锚被抬高，低波动高股息成了机构年末调仓的蓄水池。对谁有利：城商行、国有大行、保险。制约：拥挤度已快速上升，若下周科技反弹，银行可能出现短线获利了结。\n二、能源与石油石化。已核实：布伦特1月合约周五收于约96.32美元，美股能源板块领涨，雪佛龙涨1.64%。背景是特朗普称美国不需要与伊朗达成协议，地缘溢价回升。对A股：中国海油、中国石油等“三桶油”周五抗跌。制约：邮件转述IEA月报下修未来两年石油需求，油价中期上行空间受需求端压制，更适合当防御仓位而非进攻主线。\n三、政策驱动的储能与输配电。邮件转述：两部门印发“十五五”新型储能实施方案；思源电气三季报收入保持高增长。这属于中期逻辑，周五盘面未见大规模资金响应，个股行情数据邮件也未给出。我们的看法是逻辑顺、节奏慢，适合在硬件链出清期间逢低关注，而不是追涨。\n三大利空方向（由强到弱） 一、AI硬件链重定价。已核实：英伟达周五再跌2.01%至162.85美元，创52周新低，本周累计跌约13%，为连续第六周下跌；汇丰下调至持有。A股周五元件板块跌6.29%，CPO跌4.40%，中际旭创、新易盛、天孚通信等成交居前且大跌。为什么重要：市场正在从“信任单一龙头”转向“按订单确定性定价”，绑定英伟达出货的光模块、PCB首当其冲。关键节点：公开报道显示英伟达11月17日发布三季度财报，这是下周最大的单一变量。制约：美股散户周四开盘半小时净买入英伟达约1.11亿美元（Vanda数据），若财报指引稳住，超跌反弹会很猛烈，空头也不宜过度追杀。\n二、美联储加息与美元走强。已核实：美国10月PPI同比6.5%，为2022年11月以来最大年度涨幅；10年期美债约5.14%。邮件转述：美联储Hammack与Daly支持渐进加息，美国10月成屋销售跌至2010年以来最低。对谁不利：高估值成长股、黄金（12月黄金期货收于约3878美元，邮件称跌至近一年低位）、加密资产（邮件称比特币跌破7万美元）。\n三、A股高位题材退潮。已核实：周五两市成交约1.67万亿元，缩量约2788亿元，上涨仅约765家、下跌4748家；襄阳轴承、大东方等高位股跌停。上交所对溢价较高的芯片LOF重点监控（邮件转述）。文投控股14天9板、累计涨100%，但公司公告AI漫剧收入仅占营收约2.57%，已多次提示快速回落风险。题材接力的赚钱效应在收缩。\n多空如何制约 防御资金抱团银行与能源，托住了上证指数（仅跌0.59%），但深成指、创业板指的杀跌说明增量资金缺席。银河证券认为电子具备超跌反弹基础，中信证券认为系统性抛售压力有限；我们同意中期逻辑未坏，但短期必须等英伟达财报和量能回升来确认。\n风险提示：以上为公开信息整理与研判，事实与推测已分开标注，不构成投资建议。","en":"热点财经新闻综述｜2026-11-14·早间\n数据时点：A股为11月13日收盘，美股为美东11月13日收盘（北京时间11月14日05:00），整理截至北京时间11月14日07:40。本期邮箱新增一封11月13日晚间热点财经邮件，以下凡标“邮件转述”的内容未逐条核实，其余已对照公开网页。\n今日判断 本周末的核心矛盾很清楚：一边是英伟达换帅后的AI硬件重定价，一边是美联储加息预期从“可能”变成“几乎确定”。\n周五A股创业板指跌3.32%，美股费城半导体指数再跌3.43%，两地硬件链同步承压；\n同时银行、影视、猪肉、能源在接资金。\n下周一开盘，我们的基调是防御为先、科技等止跌信号，不建议在周末情绪里提前抄底硬件高位股。\n三大利多方向（由强到弱）\n一、银行与高股息。已核实：11月13日银行板块涨约1.46%，江苏银行、南京银行、青岛银行、成都银行、杭州银行盘中创历史新高；11月12日华宝银行ETF净流入5.58亿元。为什么重要：美债10年期收益率周五在5.1%以上，CME FedWatch显示市场对12月9日加息的定价接近100%，成长股估值的锚被抬高，低波动高股息成了机构年末调仓的蓄水池。对谁有利：城商行、国有大行、保险。制约：拥挤度已快速上升，若下周科技反弹，银行可能出现短线获利了结。\n二、能源与石油石化。已核实：布伦特1月合约周五收于约96.32美元，美股能源板块领涨，雪佛龙涨1.64%。背景是特朗普称美国不需要与伊朗达成协议，地缘溢价回升。对A股：中国海油、中国石油等“三桶油”周五抗跌。制约：邮件转述IEA月报下修未来两年石油需求，油价中期上行空间受需求端压制，更适合当防御仓位而非进攻主线。\n三、政策驱动的储能与输配电。邮件转述：两部门印发“十五五”新型储能实施方案；思源电气三季报收入保持高增长。这属于中期逻辑，周五盘面未见大规模资金响应，个股行情数据邮件也未给出。我们的看法是逻辑顺、节奏慢，适合在硬件链出清期间逢低关注，而不是追涨。\n三大利空方向（由强到弱） 一、AI硬件链重定价。已核实：英伟达周五再跌2.01%至162.85美元，创52周新低，本周累计跌约13%，为连续第六周下跌；汇丰下调至持有。A股周五元件板块跌6.29%，CPO跌4.40%，中际旭创、新易盛、天孚通信等成交居前且大跌。为什么重要：市场正在从“信任单一龙头”转向“按订单确定性定价”，绑定英伟达出 %、报1.375元，盘面大跌但逆势净流入3360万，说明高位机构出逃、低位已有资金试探性托底，多空分歧剧烈。\n核心标的中国铝业正式破位：开盘直接失守8元整数关口，最低下探7.92元，收盘7.96元。全天成交额仅9.02亿元，量比低至0.71，进入极致缩量阴跌状态。资金结构上，主力资金净流出6303万，机构持续兑现离场；而散户、中小单逆势净流入超6000万，融资盘持续逆势接仓，筹码高位下沉隐患加剧。\n板块情绪全面降温，龙头资金出逃明显：紫金矿业净流出3.30亿、洛阳钼业净流出2.45亿。中国铝业动态市盈率跌破5.72倍，刷新历史估值极值，极低估值背景下依旧持续杀跌，完全是宏观流动性定价主导市场。\n一、宏观定调：美元指数突破103，重新定义A股估值底线\n当下A股所有调整的核心根源，不是个股基本面，而是美元流动性重定价。\n本轮美元指数强势突破103，核心是市场重新计价“美联储高利率延续”预期，美债收益率高位锚定，全球无风险收益率被动抬升。这会形成两大致命传导链条，直接改写A股与大宗商品的定价逻辑：\n1. 全球资金虹吸效应\n美元走强、美债收益走高，美元资产性价比大幅提升，全球跨境资本从新兴市场回流美国。A股作为外资重要配置市场，北向风险偏好收缩、增量资金枯竭，存量资金持续出逃，所有权重、周期、资源板块都会被动承压。\n2. A股整体斩杀线上移\n以往市场认可的估值底、政策底、产业资本增持底，在强美元周期中全部失效。\n美元走强=A股估值安全垫压缩=市场支撑位整体上移。\n简单讲：以前跌到位能反弹的位置，现在只是中继平台；以前的超低估值，在高美元利率环境下依旧存在下行空间。这也是为何中铝跌破历史最低PE，依然止不住跌势。\n3. 有色板块遭受双重打击\n有色金属属于美元计价大宗商品，货币属性极强。美元升值直接压制伦铝、国际金属价格，外盘承压带动内盘跟跌；同时AH溢价持续走阔，今日中铝H股大跌3.14%，AH溢价飙升至39.69%，内外价差撕裂，A股有色估值被动高估，长期承压无解。\n二、盘面核心特征：缩量阴跌，最折磨人的钝刀行情\n今日中铝破8元后的最大特征，不是恐慌暴跌，而是无量下跌。\n量比0.71、成交额极致萎缩，代表市场当下处于特殊状态：\n恐慌盘已经彻底割不动，浮筹清洗殆尽；但主力资金受宏观利空压制，拒绝任何主动护盘与拉升。\n没有抛压、没有承接、没有反弹力量，完全依靠市场重力自由回落。\n这种“缩量阴跌”，是比放量大跌更可怕的走势——放量下跌是风险一次性释放，缩量阴跌是情绪与估值的长期磨底，时间换空间，持续消耗多头信心。\n三、资金博弈拆解：机构撤退、散户接盘，杠杆风险积聚\n今日筹码博弈呈现极致的反向背离：\n• 大资金高度理性：超大单、大单合计流出超6300万，在美元流动性拐点确认后，机构统一选择减仓避险，不博弈短线超跌。\n• 散户与融资盘反向死扛：小单、中单净流入超6000万，叠加前两日融资盘累计净买入1.4亿。\n市场最大风险已经浮出水面：极低估值吸引散户杠杆抄底，但宏观逆风未止。\n一旦股价继续小幅下探，高位累积的融资盘将触发被动平仓，极易引发连锁多杀多踩踏，形成加速下跌。资本市场永远反人性：低估不代表立刻上涨，逆势流动性收紧下，低价可以更低。\n四、逻辑重构：为何大股东增持底彻底失效？\n很多投资者困惑：产业资本9元上方真金白银增持，为何挡不住7.9元的杀跌？\n核心逻辑区分：\n产业资本看3-5年产业周期，交易资金看当下全球流动性。\n大股东增持是长线战略布局，不计短期波动；但量化、游资、外资是顺势交易，在美元强势、全球流动性收紧的大背景下，不会为基本面买单。\n当下市场主线非常清晰：宏观流动性＞技术形态＞估值高低＞股东增持。\n覆巢之下无完卵，整个有色板块资金全线抽血，再好的基本面也无法对抗系统性流动性压力。\n五、后市核心展望：三重寒冬之下，只看三个见底信号\n当前中国铝业、有色金属板块，正处于美元宏观压制+资金持续流出+技术破位的三重寒冬。\n前期填权行情、箱体震荡结构彻底终结，短期不存在企稳反转基础。\n后续真正底部，必须等待三大信号同步出现：\n1. 美元指数高位钝化、流动性压力缓释\n只要美元持续走强，有色杀估值行情不会结束，所有反弹仅为弱修复。\n2. 融资盘充分出清\n当前杠杆资金高位接盘、筹码不稳定，必须完成一轮彻底的筹码清洗，风险释放完毕才具备企稳条件。\n3. 后续需在7.9元区间连续收出缩量十字星、企稳小阳线，同时主力资金停止大幅流出，方能确认短期底部。\n现阶段A股最大的交易真相：强美元周期下，所有低估值周期股，都在重新接受全球流动性定价。","en":"美元破位上行，A股估值斩杀线上移，有色板块进入三重承压周期\n#有色金属##股票财经#\n11月13日市场核心数据速
